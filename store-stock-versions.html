<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store stock · versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --ink:#17191c;--text:#30343b;--body:#5a606a;--mute:#767c86;--faint:#c4c8cf;--ico:#8d939c;
  --bg:#fff;--soft:#f7f7f8;--soft-2:#f0f0f2;--line:#ebebee;--line-2:#dcdce1;
  --accent:#2563eb;--accent-bg:#eef4ff;--accent-ink:#1d4fd7;
  --wh:#8d939c;--fl:#2563eb;--rj:#d0861a;--rj-ink:#a35f06;--rj-bg:#fdf4e7;
  --pos:#1a7f37;--neg:#c0362c;
  --r:12px;--r-sm:10px;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --shadow-float:0 1px 2px rgb(23 25 28 / 5%),0 10px 30px rgb(23 25 28 / 10%);
  --shadow-pop:0 2px 6px rgb(23 25 28 / 6%),0 16px 40px rgb(23 25 28 / 12%);
  --ph:44px;--ab:56px;--dock:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font:15px/1.45 Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.006em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
svg.lucide{width:16px;height:16px;stroke-width:1.8;flex-shrink:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;letter-spacing:0}
[hidden]{display:none!important}

/* ── prototype chrome — not part of the app ── */
.proto{position:sticky;top:0;z-index:80;background:#101012;color:#d9dbe0;font-size:14px}
.proto .row{height:44px;display:flex;align-items:center;gap:14px;padding:0 16px}
.proto b{color:#fff;font-weight:600;white-space:nowrap}
.proto .glab{color:#7d818a;white-space:nowrap;margin-left:6px}
.proto .opts{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex-shrink:1}
.proto .opts button{height:30px;padding:0 11px;border-radius:7px;color:#a9adb6;white-space:nowrap}
.proto .opts button:hover{color:#fff}
.proto .opts button[aria-pressed=true]{background:#2c2d31;color:#fff;font-weight:500}
.proto .note{display:flex;flex-wrap:wrap;gap:3px 16px;padding:7px 16px 9px;border-top:1px solid #222327;color:#a9adb6;line-height:1.4}
.proto .note b{color:#e4e6ea;font-weight:500}
.proto .note .good b{color:#8fd6a0}
.proto .note .weak b{color:#f0b37a}
.proto .note .br{flex-basis:100%;height:0}
.proto .rs{margin-left:auto;height:30px;padding:0 10px;border-radius:7px;background:#2c2d31;color:#e4e6ea;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.proto .rs svg{width:14px;height:14px}

/* ── app bar ── */
.appbar{position:sticky;top:var(--ph);z-index:20;height:var(--ab);display:flex;align-items:center;gap:20px;padding:0 24px;background:rgb(255 255 255 / 86%);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:8px;background:#000;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;position:relative;flex-shrink:0}
.mark::after{content:"";position:absolute;right:5px;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.brand b{font-size:15px;font-weight:600;color:var(--ink)}
.brand span{font-size:14px;color:var(--mute)}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{height:32px;display:flex;align-items:center;padding:0 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--body);text-decoration:none}
.nav a.on{background:var(--soft-2);color:var(--ink)}
.appbar .ttl{display:none;font-size:17px;font-weight:600;color:var(--ink)}
.appbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--body)}
.sync{display:flex;align-items:center;gap:7px}
.sync i{width:7px;height:7px;border-radius:50%;background:#36b827;display:block}
.av{width:32px;height:32px;border-radius:50%;background:var(--soft-2);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:14px}

/* ── page: the table, and the panel floating at its right ── */
.page{max-width:1180px;margin:0 auto;padding:24px 28px 120px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
.page.editing{grid-template-columns:minmax(0,1fr) 300px}
.main{min-width:0}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:40px}
.head h1{font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-.025em;line-height:1.15;margin-right:auto}
.head .mode{font-size:15px;color:var(--body);display:flex;align-items:center;gap:8px}
.head .mode i.pd{width:8px;height:8px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;width:260px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ico);width:15px;height:15px}
.search input{width:100%;height:36px;border:0;border-radius:999px;background:var(--soft-2);padding:0 14px 0 34px;font-size:15px;outline:none;transition:box-shadow 150ms ease,background-color 150ms ease}
.search input:focus{background:var(--bg);box-shadow:0 0 0 1px var(--line-2),0 0 0 4px var(--accent-bg)}
.search input::placeholder{color:var(--mute)}
.fbtn{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line-2);font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;transition:background-color 150ms ease,border-color 150ms ease,transform 150ms var(--ease-out)}
.fbtn:active{transform:scale(.97)}
.fbtn svg{width:14px;height:14px;color:var(--ico)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fbtn.on svg{color:#c6c9cf}
.fbtn .ct{min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;display:inline-grid;place-items:center;padding:0 6px}
.lk{height:32px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--accent);white-space:nowrap;transition:background-color 150ms ease}
.lk:disabled{color:var(--faint)}
@media (hover:hover) and (pointer:fine){.fbtn:hover:not(.on){background:var(--soft)}.lk:hover:not(:disabled){background:var(--accent-bg)}}

/* buttons */
.btn{height:40px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink);background:var(--soft-2);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background-color 150ms ease,transform 150ms var(--ease-out),opacity 150ms ease}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--accent);color:#fff;font-weight:600}
.btn.rej{background:var(--rj-bg);color:var(--rj-ink);font-weight:600}
.btn.rej.pri{background:var(--rj);color:#fff}
.btn:disabled{opacity:.4}
.btn.wide{width:100%;height:44px}
@media (hover:hover) and (pointer:fine){.btn:hover:not(:disabled){background:#e6e6e9}.btn.pri:hover:not(:disabled){background:var(--accent-ink)}.btn.rej:hover:not(:disabled){background:#fbead0}.btn.rej.pri:hover:not(:disabled){background:#b9760f}}

/* the table */
.tbl{--cols:minmax(0,1fr) 140px 140px 140px}
.tbl.e-one{--cols:minmax(0,1fr) 150px 132px 150px}
.tbl.st{--cols:minmax(0,1fr) 140px 140px 140px 64px}
.e-one .cell{align-items:center;text-align:center}
.e-one .hc.num{align-items:center;text-align:center}
.e-one .arow .sum{text-align:center}
.e-one .mvc{justify-content:center;padding:0}
.hc.mvh{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;color:var(--accent-ink);font-weight:600}
.e-rj .hc.mvh{color:var(--rj-ink)}
.hc.mvh svg{width:18px;height:18px}
.modebar{display:flex;align-items:center;gap:10px}
.modebar .seg{margin:0;min-width:440px}
.applybar{position:sticky;bottom:16px;z-index:12;margin-top:14px;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 18px;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:var(--shadow-float);animation:pin 200ms var(--ease-out)}
.abs{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.abs b{font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.abs span{font-size:14px;color:var(--body)}
.applybar .btn{height:44px;min-width:180px}
.stc{display:flex;justify-content:center}
.stico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#b26a00;transition:background-color 150ms ease,transform 150ms var(--ease-out)}
.stico svg{width:17px;height:17px}
.stico:active{transform:scale(.92)}
@media (hover:hover) and (pointer:fine){.stico:hover{background:#fdf1dc}}
.lenst{font-size:14px;color:var(--mute);white-space:nowrap}
.pop.cmp{width:440px;padding:14px 16px}
.cmp .ch{display:block;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:8px}
.cmpg{display:grid;grid-template-columns:minmax(130px,1fr) 56px 56px auto;align-items:center;gap:8px 10px;font-size:15px}
.cmpg .hd{font-size:14px;color:var(--mute);text-align:right}
.cmpg .pl{display:flex;align-items:center;gap:7px;color:var(--text);white-space:nowrap}
.cmpg b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.cmpg b.warn{color:#b26a00}.cmpg b.z{color:var(--faint);font-weight:400}
.cmpg em{font-style:normal;font-size:14px;color:var(--mute);white-space:nowrap}
.tbl.e-b{--cols:minmax(0,1fr) 112px 112px 112px 116px 116px}
.tbl.e-c{--cols:minmax(0,1fr) 150px 150px 132px}
.tbl.e-d{--cols:minmax(0,1fr) 112px 112px 112px 176px}
.hrow,.arow,.crow,.srow{display:grid;grid-template-columns:var(--cols);align-items:center}
.hrow{position:sticky;top:calc(var(--ph) + var(--ab));z-index:10;background:rgb(255 255 255 / 92%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);min-height:64px}
.hc{padding:10px 14px;font-size:14px;color:var(--body);font-weight:500}
.hc.num{display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.hc .pn{display:flex;align-items:center;gap:6px}
.hc b{font-size:18px;font-weight:600;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.hc.dim{opacity:.45}
.hc .sweep{font-size:14px;font-weight:400;color:var(--mute);white-space:nowrap}
.hc .eb{font-size:14px;font-weight:500;color:var(--mute);min-height:20px}
.hc.from .eb{color:var(--body)}
.hc.to .eb,.hc.to .pn{color:var(--accent-ink)}
.e-one .hc.to .eb,.e-one .hc.to .pn{color:var(--accent-ink)}
.hc.dim,.sum.dim,.cell.dim{opacity:.45}
.cell.to{background:#f7faff;align-self:stretch}
.e-rj .cell.to{background:#fffaf2}
.e-rj .hc.to .pn{color:var(--rj-ink)}
.mvsum{color:var(--accent-ink);font-weight:600}
.seenlink{font-size:14px;font-weight:500;color:#b26a00;white-space:nowrap;border-radius:6px;padding:0 4px;margin-right:-4px}
.seenlink.on{background:#fdf1dc}
@media (hover:hover) and (pointer:fine){.seenlink:hover{background:#fdf1dc}}
.cell .sub{font-size:14px;color:var(--mute)}
.now.warn{color:#b26a00}
.seg{display:flex;background:var(--soft-2);border-radius:11px;padding:3px;gap:2px;margin:6px 0 8px}
.seg button{flex:1;height:34px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--body);white-space:nowrap;transition:background-color 150ms ease,color 150ms ease}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgb(23 25 28 / 10%)}
.seg button:disabled{opacity:.35}
.seg.lens{display:inline-flex;margin:0}
.seg.lens button{flex:none;min-width:64px}
.seg.three button{padding:0 8px}
.mbtn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);font-size:14px;font-weight:500;color:var(--body);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;transition:background-color 150ms ease}
.mbtn.on{background:var(--accent-bg);border-color:#c9d9fb;color:var(--accent-ink);font-weight:600}
@media (hover:hover) and (pointer:fine){.mbtn:hover{background:var(--soft)}.mbtn.on:hover{background:#e2ecff}}
.pop.mpop{width:440px;padding:14px 16px 12px;max-height:none;overflow:visible}
.mph b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.mph span{display:block;font-size:14px;color:var(--mute);margin:2px 0 6px}
.mpr{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:8px;min-height:46px}
.mpr>span:first-child{font-size:14px;color:var(--body)}
.mpr .seg{margin:0}
.mpq{display:flex;align-items:center;gap:8px}
.mpq .of{font-size:14px;color:var(--mute)}
.mpf{display:flex;justify-content:flex-end;gap:8px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}
.hc .dl{font-size:14px;font-weight:600;margin-left:6px;letter-spacing:0}
.pos{color:var(--pos)!important}.neg{color:var(--neg)!important}
.pd{width:8px;height:8px;border-radius:50%;display:block;flex-shrink:0}
.grp{border-bottom:1px solid var(--line)}
.arow{min-height:64px}
.ai{display:flex;align-items:center;gap:12px;padding:10px 14px;min-width:0}
.th{width:40px;height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex-shrink:0;overflow:hidden;box-shadow:inset 0 0 0 1px rgb(23 25 28 / 4%)}
.th svg{width:32px;height:32px}
.lt{min-width:0}
.lt b{display:block;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt>span{display:flex;align-items:center;gap:6px;color:var(--mute);white-space:nowrap;overflow:hidden;font-size:14px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0;box-shadow:inset 0 0 0 1px rgb(23 25 28 / 14%)}
.sum{padding:0 14px;text-align:right;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.crow{min-height:44px}
.ci{padding:0 14px 0 66px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--ink)}
.srow{min-height:48px;transition:background-color 200ms ease}
.srow .sz{padding:0 14px 0 66px;font-size:15px;color:var(--text);display:flex;align-items:center;gap:8px;min-width:0}
.srow .sz span{min-width:0}
.cell{padding:0 14px;text-align:right;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.3}
.seen{font-size:14px;font-weight:500;color:#b26a00}
.qn{width:64px;height:36px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);text-align:right;padding:0 10px;font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;outline:none;transition:border-color 150ms ease,box-shadow 150ms ease,background-color 150ms ease}
.qn:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.e-one .qn,.e-b .qn{background:var(--soft);border-color:transparent}
.e-one .qn::placeholder,.e-b .qn::placeholder{color:transparent}
@media (hover:hover) and (pointer:fine){.e-one .qn:hover,.e-b .qn:hover{border-color:var(--line-2)}}
.e-one .qn:focus,.e-b .qn:focus{background:var(--bg);border-color:var(--accent)}
.e-one .qn.on,.e-b .qn.on{background:var(--accent-bg);border-color:#c9d9fb}
.qn.on{background:var(--accent-bg);border-color:var(--accent-line,#c9d9fb);color:var(--accent-ink)}
.e-rj .qn.on{background:var(--rj-bg)!important;border-color:#efd3a6!important;color:var(--rj-ink)}
.tip{position:fixed;z-index:75;background:#17191c;color:#fff;font-size:14px;padding:4px 9px;border-radius:7px;opacity:0;transform:translateY(3px);transition:opacity 120ms ease,transform 120ms var(--ease-out);pointer-events:none}
.tip.in{opacity:1;transform:none}
.btn.ghost{background:none;color:var(--body)}
@media (hover:hover) and (pointer:fine){.btn.ghost:hover{background:var(--soft-2);color:var(--ink)}}
.cell.z,.z{color:var(--faint)}
.cell.dim{color:var(--faint)}
.was{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-2)}
.ar{color:var(--faint);margin:0 4px}
.now{font-weight:600}
.now.up{color:var(--pos)}.now.down{color:var(--neg)}
.mv{padding:0 10px 0 6px;display:flex;justify-content:flex-end;align-items:center;gap:6px}
@media (hover:hover) and (pointer:fine){.srow:hover{background:var(--soft)}}
.flash{animation:flash 1100ms ease}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
.none{padding:56px 16px;text-align:center;font-size:15px;color:var(--mute)}

/* steppers and taps */
.step{display:inline-flex;align-items:center;height:36px;border-radius:999px;background:var(--soft-2);color:var(--ink)}
.step button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--body);transition:transform 150ms var(--ease-out),background-color 150ms ease}
.step button:active:not(:disabled){transform:scale(.88)}
.step button:disabled{opacity:.3}
.step b{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.step.on{background:var(--accent-bg);color:var(--accent-ink)}
.step.on button{color:var(--accent-ink)}
@media (hover:hover) and (pointer:fine){.step button:hover:not(:disabled){background:rgb(23 25 28 / 6%)}}
.send{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-radius:999px;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;border:1px solid var(--line-2);background:var(--bg);transition:background-color 150ms ease,border-color 150ms ease,transform 150ms var(--ease-out)}
.send svg{width:14px;height:14px;color:var(--rj)}
.send:active:not(:disabled){transform:scale(.95)}
.send:disabled{border-color:var(--line);color:var(--faint)}
.send:disabled svg{opacity:.35}
@media (hover:hover) and (pointer:fine){.send:hover:not(:disabled){background:#fdf6ec;border-color:#efd3a6}}
.rcell{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-right:10px}
.unsend{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft-2);color:var(--body);transition:transform 150ms var(--ease-out)}
.unsend:active:not(:disabled){transform:scale(.9)}
.unsend:disabled{visibility:hidden}
.rcell.on .unsend{background:var(--rj-bg);color:var(--rj-ink)}

/* ── the floating panel ── */
.panel{position:sticky;top:calc(var(--ph) + var(--ab) + 20px);background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-float);padding:16px 18px 16px;animation:pin 220ms var(--ease-out);max-height:calc(100vh - var(--ph) - var(--ab) - 40px);display:flex;flex-direction:column}
.pnh{display:flex;align-items:center;gap:8px;min-height:32px;margin-bottom:4px}
.pnh b{font-size:15px;font-weight:600;color:var(--ink);margin-right:auto;display:flex;align-items:center;gap:8px}
.pnh .tog{display:none}
.icb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ico)}
@media (hover:hover) and (pointer:fine){.icb:hover{background:var(--soft-2);color:var(--ink)}}
.delta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0 12px}
.delta div{display:flex;flex-direction:column}
.delta span{font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px}
.delta b{font-size:18px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.psec{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:12px 0 6px;font-size:14px;color:var(--body);font-weight:500}
.psec svg{color:var(--ico)}

const skuOf=(code,colour,size)=>{for(const [k,v] of SKU) if(v.a.code===code&&v.c.name===colour&&v.size===size) return k};
function seedLog(){
  const t=m=>Date.now()-m*60000, y=new Date(); y.setDate(y.getDate()-1); y.setHours(17,20,0,0);
  return [

/* ───────────────────────── versions ───────────────────────── */
const MOVE_VERS={
  A:{name:"★ A · Table + Move",good:"The stock table stays; Move puts one quantity box between the two places — from, how many, to — and one button under the table",weak:"Going the other way is a switch at the top"},
  B:{name:"B · Two ways",good:"Both directions in the same row — To shop floor and To stockroom columns, no switch",weak:"Two empty boxes on every row; easy to type in the wrong one"},
  C:{name:"C · Set the floor",good:"Type what a place should hold; the other place follows",weak:"The number typed is a total, not a quantity — staff read 5 as \"move 5\""},
  D:{name:"D · Per size",good:"Each size says it in a sentence: Move 2 from Stockroom to Shop floor; any route, return stock too",weak:"One popover per size — slow for a delivery of 40 sizes"}
};

  off:{name:"Off",good:"Nothing extra on the Stock screen; sweeps are dealt with in Count",weak:"Staff move on numbers nobody has checked"},
  status:{name:"★ Status",good:"One number per place — the system's, the one a move works on; a sign on the rows the last sweep disagrees with, tap it for System vs Seen",weak:"How far off shows only after the tap"},

  header:{name:"Header",good:"One line per place: when it was swept and how many sizes differ; tap it to list only those",weak:"One more tap to see which sizes"},

/* ───────────────────────── state ───────────────────────── */
const S={ver:"A",obs:"status",lens:"book",mode:false,q:"",div:null,tags:new Set(),col:new Set(),size:new Set(),show:"all",
  route:{from:"warehouse",to:"floor"},qty:new Map(),qf:new Map(),qw:new Map(),dd:new Map(),ln:new Map(),
  log:[],flash:new Set(),panelOpen:true,kept:null,seq:4};
const ZD={f:0,rf:0,rw:0};
/* one-way input: version A, and Reject in every version but C */
const isOne=()=>!!S.mode&&(S.mode==="reject"?S.ver!=="C":S.ver==="A");
function setMap(m,k,v){ if(v>0) m.set(k,v); else m.delete(k) }
function clearWork(){S.qty.clear();S.qf.clear();S.qw.clear();S.dd.clear();S.ln.clear()}
function snapshot(){return {mode:S.mode,route:{...S.route},qty:new Map(S.qty),qf:new Map(S.qf),qw:new Map(S.qw),dd:new Map(S.dd),ln:new Map(S.ln)}}
function lines(){
  const out=[]; if(!S.mode) return out;
  if(isOne()){ for(const [s,q] of S.qty) out.push([s,S.route.from,S.route.to,q]); return out }
  if(S.ver==="B"){ for(const [s,q] of S.qf) out.push([s,"warehouse","floor",q]); for(const [s,q] of S.qw) out.push([s,"floor","warehouse",q]); return out }
  if(S.ver==="C"){
    for(const [sku,d] of S.dd){
      if(d.f>0) out.push([sku,"warehouse","floor",d.f]); if(d.f<0) out.push([sku,"floor","warehouse",-d.f]);
      if(d.rf>0) out.push([sku,"floor","reject",d.rf]); if(d.rf<0) out.push([sku,"reject","floor",-d.rf]);
      if(d.rw>0) out.push([sku,"warehouse","reject",d.rw]); if(d.rw<0) out.push([sku,"reject","warehouse",-d.rw]);
    }
    return out;
  }
  for(const [s,l] of S.ln) out.push([s,l.from,l.to,l.q]);
  return out;
}
function view(sku){
  const v={...BASE.get(sku)};
  for(const [s,f,t,q] of lines()) if(s===sku){v[f]-=q;v[t]+=q}
  return v;
}
/* C: type what a place should hold; Move balances it against the other place, Reject against return stock */
function setCell(sku,k,want){
  const b=BASE.get(sku), d={...(S.dd.get(sku)||ZD)};
  let max;
  if(S.mode==="move"){ max=b.floor+b.warehouse; want=Math.max(0,Math.min(max,want)); d.f=k==="floor"?want-b.floor:b.warehouse-want }
  else { const mine=k==="floor"?"rf":"rw", other=k==="floor"?"rw":"rf"; max=b[k]+b.reject+d[other]; want=Math.max(0,Math.min(max,want)); d[mine]=b[k]-want }
  if(!d.f&&!d.rf&&!d.rw) S.dd.delete(sku); else S.dd.set(sku,d);
  return {want,max};
}
const baseTotal=k=>{let n=0;for(const b of BASE.values()) n+=b[k];return n};
const viewTotal=k=>{let n=0;for(const s of BASE.keys()) n+=view(s)[k];return n};

/* what the handheld saw at the last sweep of each place — evidence, never a move */
const SWEEP={warehouse:null,floor:null,reject:null}, OBS=new Map();
function buildObs(){
  const y=new Date(); y.setDate(y.getDate()-1); y.setHours(18,5,0,0);
  SWEEP.warehouse=y.getTime(); SWEEP.floor=Date.now()-130*60000; SWEEP.reject=null;
  OBS.clear(); for(const [sku,b] of BASE) OBS.set(sku,{warehouse:b.warehouse,floor:b.floor});
  for(const r of S.log) if(!r.undone) for(const [sku,f,t,q] of r.lines) for(const k of ["warehouse","floor"]) if(SWEEP[k]&&r.at>SWEEP[k]){ if(f===k) OBS.get(sku)[k]+=q; if(t===k) OBS.get(sku)[k]-=q }
  const set=(code,col,size,k,n)=>{OBS.get(skuOf(code,col,size))[k]=n};
  set("00000003","Charcoal","M","floor",0); set("00000002","Navy","L","warehouse",2);
  set("00000009","Khaki","32","warehouse",3); set("00000010","Black","One Size","floor",2);
}
/* a gap only counts while nothing has moved there since the sweep */
function seenGap(sku,k){
  if(!SWEEP[k]) return null;
  if(S.log.some(r=>!r.undone&&r.at>SWEEP[k]&&r.lines.some(([s,f,t])=>s===sku&&(f===k||t===k)))) return null;
  const o=OBS.get(sku)[k]; return o===BASE.get(sku)[k]?null:o;
}
const gapsIn=k=>{let n=0;for(const s of BASE.keys()) if(seenGap(s,k)!==null) n++;return n};

/* ───────────────────────── helpers ───────────────────────── */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const thumb=(a,hex)=>`<span class="th"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="${SHAPES[a.shape]}" fill="${hex}" stroke="rgb(23 25 28 / 16%)" stroke-width="1.4" stroke-linejoin="round" fill-rule="evenodd"/></svg></span>`;
const nameOf=sku=>{const {a,c,size}=SKU.get(sku);return `${a.name} ${c.name} ${size}`};
function cellTxt(b,v){

}
function clock(ts){
  const d=new Date(ts), now=new Date(), hm=d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0");
  const y=new Date(now); y.setDate(y.getDate()-1);
  if(d.toDateString()===now.toDateString()) return hm;
  if(d.toDateString()===y.toDateString()) return "Yesterday "+hm;
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})+" "+hm;
}
const isPhone=()=>matchMedia("(max-width:767px)").matches;
function swept(k){ if(!SWEEP[k]) return "Not swept yet"; const c=clock(SWEEP[k]); return `Swept ${c.startsWith("Yesterday")?c.replace("Yesterday","yesterday"):c}` }

/* ───────────────────────── filters ───────────────────────── */
const ALL_TAGS=[...new Set(ARTS.flatMap(a=>a.tags))].sort();
const ALL_COLS=(()=>{const m=new Map();for(const a of ARTS) for(const [n,h] of a.colours) if(!m.has(n)) m.set(n,h);return [...m]})();
const ALL_SIZES=SIZE_ORDER.filter(z=>ARTS.some(a=>a.colours.some(c=>c[2].some(s=>s[0]===z))));
const shows=()=>[["all","Everything"],["gap","Not on the floor"],["ret","Has return stock"],...(S.obs==="off"?[]:[["seen","Differs from the sweep"]])];
function skuVisible(sku){
  const {a,c,size}=SKU.get(sku), b=BASE.get(sku), q=S.q.trim().toLowerCase();
  if(q&&!(a.name.toLowerCase().includes(q)||a.code.includes(q)||c.name.toLowerCase().includes(q)||(a.name+" "+c.name).toLowerCase().includes(q))) return false;
  if(S.div&&a.div!==S.div) return false;
  if(S.tags.size&&!a.tags.some(t=>S.tags.has(t))) return false;
  if(S.col.size&&!S.col.has(c.name)) return false;
  if(S.size.size&&!S.size.has(size)) return false;
  if(S.show==="gap"&&!(b.floor===0&&b.warehouse>0)) return false;
  if(S.show==="ret"&&!(b.reject>0)) return false;
  if(S.show==="seen"&&seenGap(sku,"warehouse")===null&&seenGap(sku,"floor")===null) return false;
  return true;
}
const activeFilters=()=>(S.div?1:0)+S.tags.size+S.col.size+S.size.size+(S.show!=="all"?1:0);

/* ───────────────────────── head + tools ───────────────────────── */

const hasStatus=()=>!S.mode&&(S.obs==="status"||S.obs==="lens");
function routeSeg(){

function pill(key,label,on,count){return `<button class="fbtn${on?" on":""}" data-filter="${key}">${label}${count?`<span class="ct">${count}</span>`:""}<i data-lucide="chevron-down"></i></button>`}
function searchHtml(){return `<label class="search"><i data-lucide="search"></i><input id="q" placeholder="Search articles" value="${esc(S.q)}" autocomplete="off"></label>`}

const lensHtml=()=>S.obs==="lens"&&!S.mode?`<div class="seg lens">${[["seen","Seen"],["book","System"]].map(([v,l])=>`<button data-lens="${v}" aria-pressed="${S.lens===v}">${l}</button>`).join("")}</div><span class="lenst">${S.lens==="seen"?"Swept "+clock(lastSweep()):""}</span>`:"";

/* ───────────────────────── the table ───────────────────────── */
function tblClass(){

/* which place a column is in the move on screen */
function roleOf(k){
  if(!S.mode) return "";
  if(isOne()) return k===S.route.from?"from":k===S.route.to?"to":"dim";
  if(S.ver==="B"||(S.ver==="C"&&S.mode==="move")) return k==="reject"?"dim":"";

function lensTotal(k){let n=0;for(const [s,o] of OBS) n+=o[k];return n}
function headRow(){
  if(S.mode&&isOne()){
    const [L,R]=onePools(), back=S.mode==="move"&&S.route.from==="floor";
    const col=k=>{const b=baseTotal(k), d=viewTotal(k)-b;return `<div class="hc num ${k===S.route.from?"from":"to"}"><span class="pn">${dot(k)}${PL[k].l}</span><b>${b}${d?`<span class="dl ${d>0?"pos":"neg"}">${signed(d)}</span>`:""}</b></div>`};
    return `<div class="hrow"><div class="hc first">Article</div>${col(L)}<div class="hc mvh"><span class="pn">${S.mode==="reject"?"Reject":"Move"}</span><i data-lucide="${back?"arrow-left":"arrow-right"}"></i></div>${col(R)}</div>`;
  }
  const extra=hasStatus()?`<div class="hc num"><span class="pn">Status</span></div>`:!S.mode?"":isOne()?`<div class="hc num"><span class="eb">${S.mode==="reject"?"Reject":"Move"}</span><span class="pn">Quantity</span></div>`
    :S.ver==="B"?`<div class="hc num"><span class="eb">Move</span><span class="pn">→ ${dot("floor")}Floor</span></div><div class="hc num"><span class="eb">Move</span><span class="pn">→ ${dot("warehouse")}Stockroom</span></div>`
    :S.ver==="D"?`<div class="hc num"><span class="eb"></span><span class="pn">Move</span></div>`:"";
  return `<div class="hrow"><div class="hc first">Article</div>${POOLS.map(p=>{
    const r=roleOf(p.k), seenLens=!S.mode&&S.obs==="lens"&&S.lens==="seen";
    const b=seenLens?(SWEEP[p.k]?lensTotal(p.k):null):baseTotal(p.k), d=S.mode?viewTotal(p.k)-baseTotal(p.k):0;

function sums(skus){const o={warehouse:0,floor:0,reject:0};for(const s of skus){const v=view(s);for(const k in o) o[k]+=v[k]}return o}
function groupHtml(a){
  const skus=a.cols.flatMap(c=>c.skus.filter(skuVisible)), as=sums(skus);
  const moving=skus.reduce((n,s)=>n+lines().filter(l=>l[0]===s).reduce((m,l)=>m+l[3],0),0);
  const ai=`<div class="ai">${thumb(a,a.cols[0].hex)}<span class="lt"><b>${esc(a.name)}</b><span><span class="mono">${a.code}</span>· ${a.tags.join(" · ")}</span></span></div>`;
  if(S.mode&&isOne()){const [L,R]=onePools();return `<section class="grp" id="g-${a.code}"><div class="arow">${ai}<div class="sum">${as[L]}</div><div class="sum mvsum">${moving||""}</div><div class="sum">${as[R]}</div></div>${skus.map(srow).join("")}</section>`}
  if(hasStatus()) return `<section class="grp" id="g-${a.code}"><div class="arow">${ai}${POOLS.map(p=>`<div class="sum">${as[p.k]}</div>`).join("")}<div></div></div>${skus.map(srow).join("")}</section>`;
  const tail=!S.mode?"":isOne()||S.ver==="D"?`<div class="sum mvsum">${moving||""}</div>`:S.ver==="B"?`<div class="sum mvsum">${skus.reduce((n,s)=>n+(S.qf.get(s)||0),0)||""}</div><div class="sum mvsum">${skus.reduce((n,s)=>n+(S.qw.get(s)||0),0)||""}</div>`:"";
  return `<section class="grp" id="g-${a.code}"><div class="arow"><div class="ai">${thumb(a,a.cols[0].hex)}<span class="lt"><b>${esc(a.name)}</b><span><span class="mono">${a.code}</span>· ${a.tags.join(" · ")}</span></span></div>${POOLS.map(p=>`<div class="sum ${roleOf(p.k)}">${as[p.k]}</div>`).join("")}${tail}</div>${skus.map(srow).join("")}</section>`;

function cellHtml(sku,k){
  const b=BASE.get(sku)[k], v=view(sku)[k], r=roleOf(k);

function postLines(L,kind){

function erpClick(t){
  const d=S.doc; if(!d) return false;
  if(t.dataset.addline!==undefined){ openPicker(t,sku=>{ d.lines.push({sku,from:d.from,to:d.to,q:1,done:0}); renderErp() },d.from); return true }
  if(t.dataset.ldel!==undefined){ d.lines.splice(+t.dataset.ldel,1); renderErp(); return true }
  if(t.dataset.erp){
    const a=t.dataset.erp; d.err=null;
    if(a==="save"){ if(!d.lines.length){d.err="Items are required";renderErp();return true} d.saved=true; d.no=++docSeq.erpnext; toast(`Saved MAT-STE-2026-000${d.no}`) }
    if(a==="submit"){ const r=postLines(d.lines.map(l=>[l.sku,l.from,l.to,+l.q||0]),"erpnext"); if(r?.error){d.err=r.error} else if(r){d.status="submitted"; d.rec=r.rec.id; toast(`Submitted MAT-STE-2026-000${d.no}`,r.rec.id)} }
    if(a==="cancel"){ undo(d.rec); d.status="cancelled" }
    renderErp(); return true;
  }
  if(t.dataset.odoo){
    const a=t.dataset.odoo; d.err=null;
    if(a==="todo"){ if(!d.lines.length){d.err="Add some products to move";renderErp();return true} d.saved=true; d.no=++docSeq.odoo; d.status="ready"; d.lines.forEach(l=>l.done=Math.min(+l.q||0,avail(l.sku,d.from))) }
    if(a==="validate"){ if(d.lines.some(l=>(+l.done||0)<(+l.q||0))){d.ask=true;renderErp();return true} a2("nobo") }
    if(a==="bo"||a==="nobo") a2(a);
    function a2(){ d.ask=false; const r=postLines(d.lines.map(l=>[l.sku,d.from,d.to,+l.done||0]),"odoo"); if(r?.error){d.err=r.error} else if(r){d.status="done"; toast(`WH/INT/000${d.no} validated`,r.rec.id)} else {d.err="Nothing to validate"} }
    renderErp(); return true;
  }
  if(t.dataset.fsku){ d.sku=t.dataset.fsku; d.from=d.to==="reject"?"floor":null; if(d.to!=="reject") d.to=null; d.q=0; renderErp(); return true }
  if(t.dataset.fchange!==undefined){ d.sku=null; renderErp(); return true }
  if(t.dataset.tile){
    const k=t.dataset.tile;
    if(!d.from||(d.from&&d.to)){ d.from=k; d.to=null; d.q=0 } else if(k===d.from){ d.from=null } else { d.to=k; d.q=Math.min(1,BASE.get(d.sku)[d.from]) }
    renderErp(); if(d.to) setTimeout(()=>{$("#fqty")?.focus();$("#fqty")?.select()},30); return true;
  }
  if(t.dataset.fpost!==undefined){ const r=postLines([[d.sku,d.from,d.to,d.q]],"fiori"); if(r?.rec){ toast(`${recTitle(r.rec)} to ${PL[d.to].l.toLowerCase()}`,r.rec.id); d.from=null; d.to=null; d.q=0 } renderErp(); return true }
  if(t.dataset.bcitem!==undefined){ const i=+t.dataset.bcitem; openPicker(t,sku=>{ if(i===d.lines.length) d.lines.push({sku,from:"",to:"",q:""}); else d.lines[i].sku=sku; renderErp() }); return true }
  if(t.dataset.bc){
    const a=t.dataset.bc; d.err=null;
    if(a==="post"){ const bad=d.lines.find(l=>!l.from||!l.to||!(+l.q)); if(!d.lines.length) d.err="There is nothing to post."; else if(bad) d.err=`Location Code, New Location Code and Quantity must have a value on ${nameOf(bad.sku)}.`; else d.ask=true }
    if(a==="no") d.ask=false;
    if(a==="yes"){ d.ask=false; const r=postLines(d.lines.map(l=>[l.sku,l.from,l.to,+l.q]),"bc"); if(r?.error) d.err=r.error; else if(r){ d.lines=[]; docSeq.bc++; toast("The journal lines were successfully posted.",r.rec.id) } }
    renderErp(); return true;
  }
  return false;
}

  if(!t){ if(popEl&&!e.target.closest(".pop")) closePop(); return }
  if(t.closest(".mpop")){
    if(t.dataset.mp){const [k,v]=t.dataset.mp.split("|"); mp[k]=v; if(mp.from===mp.to) mp.to=POOLS.find(p=>p.k!==mp.from).k; mp.q=Math.min(mp.q,BASE.get(mp.sku)[mp.from]); drawSizePop(); return}
    if(t.dataset.mpok!==undefined) return sizePopDone();
    if(t.dataset.mpdel!==undefined){const sku=mp.sku; S.ln.delete(sku); closeSizePop(); return rerender(sku)}
    return;
  }
  if(t.closest(".pop")) return;
  if(t.dataset.filter){ const k=t.dataset.filter; if(popKey===k) return closePop(); return openPop(t,k,filterItems(k),k==="tags"||k==="col"||k==="size",v=>pickFilter(k,v)) }
  if(popEl) closePop();
  if(t.dataset.ver){ if(S.mode){clearWork();S.mode=false} S.ver=t.dataset.ver; return renderAll() }
  if(t.dataset.cmp){ if(popKey==="cmp") return closePop(); return openCmp(t,t.dataset.cmp) }
  if(t.dataset.obs){ S.obs=t.dataset.obs; S.lens=S.obs==="lens"?"seen":"book"; if(S.obs==="off"&&S.show==="seen") S.show="all"; return renderAll() }
  if(t.dataset.lens){ S.lens=t.dataset.lens; return renderAll() }
  if(t.dataset.seenf!==undefined){ S.show=S.show==="seen"?"all":"seen"; return renderAll() }
  if(t.dataset.reset!==undefined) return reset();
  if(t.dataset.mode) return isErp()?startErp(t.dataset.mode==="reject"?"reject":null):setMode(t.dataset.mode);
  if(t.dataset.route) return setRoute(t.dataset.route);
  if(t.dataset.msize) return mpEl&&mp?.sku===t.dataset.msize?closeSizePop():openSizePop(t,t.dataset.msize);
  if(t.dataset.cancel!==undefined){
    const had=lines().length>0; S.kept=had?snapshot():null; clearWork(); S.mode=false; if(S.obs==="lens") S.lens="seen"; renderAll();
    if(had) toast("Changes dropped",null,true); return;
  }
  if(t.dataset.restore!==undefined){
    const k=S.kept; if(k){S.mode=k.mode;S.route=k.route;S.qty=k.qty;S.qf=k.qf;S.qw=k.qw;S.dd=k.dd;S.ln=k.ln;S.kept=null;renderAll()}
    $("#toast").classList.remove("in"); return;
  }
  if(t.dataset.commit!==undefined) return commit();
  if(t.dataset.undo){ $("#toast").classList.remove("in"); return undo(t.dataset.undo) }
  if(t.dataset.allmoves!==undefined) return openSheet("moves");
  if(t.dataset.fsheet!==undefined) return openSheet("filter");
  if(t.dataset.closesheet!==undefined) return closeSheet();
  if(t.dataset.ptog!==undefined){S.panelOpen=!S.panelOpen; return renderPanel()}
  if(t.dataset.clearf!==undefined){S.div=null;S.tags.clear();S.col.clear();S.size.clear();S.show="all";renderAll();if(sheetEl&&sheetEl.dataset.kind==="filter")renderFilterSheet();return}
  if(t.dataset.fchip){const [k,v]=t.dataset.fchip.split("|"); pickFilter(k,v); renderFilterSheet(); return}
});
document.addEventListener("change",e=>{ if(sheetEl&&S.doc) erpChange(e.target) });
document.addEventListener("input",e=>{
  const x=e.target;
  if((sheetEl&&S.doc&&x.closest?.(".sheet"))||x.id==="pq"){ if(erpInput(x)) return }
  if(x.dataset?.mpq!==undefined){ const raw=x.value.replace(/\D/g,""), max=BASE.get(mp.sku)[mp.from]; let n=raw===""?0:parseInt(raw,10); if(n>max){n=max;tip(x,`${max} at most`)} x.value=n||""; mp.q=n; return }
  if(x.classList?.contains("qn")) return liveInput(x);
  if(x.id==="q"){S.q=x.value; document.querySelectorAll("#q").forEach(i=>{if(i!==x) i.value=S.q}); renderGrid(); icons()}
});
document.addEventListener("keydown",e=>{
  const q=e.target.closest?.(".qn");
  if(e.target.id==="fqty"&&e.key==="Enter"){e.preventDefault(); sheetEl?.querySelector("[data-fpost]")?.click(); return}
  if(q&&q.closest(".sheet")){ if(e.key.length===1&&!/\d/.test(e.key)&&!e.metaKey&&!e.ctrlKey) e.preventDefault(); return }
  if(e.key==="Escape"&&pickEl){ closePicker(); return }
  if(q&&q.dataset.mpq!==undefined&&e.key==="Enter"){e.preventDefault(); return sizePopDone()}
  if(q){
    if(e.key==="Enter"){e.preventDefault(); q.dataset.done="1"; leaveInput(q,true); return}
    if(e.key==="Escape"){q.blur(); return}
    if(e.key.length===1&&!/\d/.test(e.key)&&!e.metaKey&&!e.ctrlKey){e.preventDefault(); return}
  }
  if(e.key==="Escape"){ if(mpEl) closeSizePop(); else if(popEl) closePop(); else if(sheetEl) closeSheet() }
});
/* a tap on a count selects all of it, so typing replaces the number instead of adding to it */
document.addEventListener("focusin",e=>{ if(e.target.classList?.contains("qn")){ delete e.target.dataset.done; e.target.dataset.fresh="1"; e.target.select() } });
document.addEventListener("mouseup",e=>{ const q=e.target.closest?.(".qn"); if(q&&q.dataset.fresh){ e.preventDefault(); delete q.dataset.fresh; q.select() } });
document.addEventListener("focusout",e=>{ const q=e.target; if(q.classList?.contains("qn")&&q.dataset.mpq===undefined&&!q.closest(".sheet")&&!q.dataset.done) leaveInput(q,false) });
addEventListener("resize",()=>{closePop(); renderDock()});

reset();
</script>
</body>
