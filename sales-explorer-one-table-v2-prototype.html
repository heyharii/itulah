<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales one table v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* frontend-hub tokens (src/styles/index.css) */
:root{
  --ink:#20242c;--text:#394150;--body:#565f6d;--mute:#666f7d;--faint:#b9c0c9;--line-ico:#89919d;
  --canvas:#ffffff;--soft:#f8f8f9;--soft-2:#f0f0f2;--soft-3:#f6f6f7;
  --hairline:#e6e6e9;--hairline-2:#dadade;--hairline-strong:#c6c6cc;
  --rail:#242526;--rail-2:#303234;--rail-mute:#a1a3a8;--dark:#191b20;
  --accent:#2563eb;--accent-bg:#eff5ff;--ok:#15803d;--bad:#be123c;
  --shadow-soft:0 1px 3px rgb(24 39 60 / 4%);
  --r-card:10px;--r-inner:8px;--r-sheet:16px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9e9ec;color:var(--ink);font:400 15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.pressable{transition:transform 120ms var(--ease-out),background-color 150ms ease,color 150ms ease,box-shadow 150ms ease,border-color 150ms ease}
.pressable:active{transform:scale(.97)}

/* prototype chrome */
.proto{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--dark);color:#fff;font-size:14px;flex-wrap:wrap}
.proto b{font-weight:600}
.proto .grp{display:flex;align-items:center;gap:4px}
.proto .grp span{color:#a1a3a8;margin-right:4px}
.proto .grp button{padding:5px 10px;border-radius:999px;color:#c3c4c7}
.proto .grp button.on{background:#fff;color:var(--dark)}
.proto .note{margin-left:auto;color:#a1a3a8}

/* device frames */
.stage{display:flex;justify-content:center;padding:0}
.stage.tablet,.stage.phone{padding:24px}
.device{width:100%;background:var(--soft-3);position:relative;overflow:hidden}
.stage.tablet .device{width:834px;height:1112px;border-radius:24px;box-shadow:0 0 0 10px #1b1c1f,0 30px 80px rgba(0,0,0,.25)}
.stage.phone .device{width:414px;height:896px;border-radius:44px;box-shadow:0 0 0 10px #1b1c1f,0 30px 80px rgba(0,0,0,.25)}
.app{display:flex;min-height:calc(100vh - 42px);height:100%;container-type:inline-size;container-name:app}
.stage.tablet .app,.stage.phone .app{min-height:0}
.rail{width:64px;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.rail .logo{width:32px;height:32px;border-radius:8px;background:#000;color:#fff;font-weight:700;display:grid;place-items:center;margin-bottom:12px;position:relative}
.rail .logo:after{content:"";position:absolute;right:7px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.rail i{width:36px;height:36px;border-radius:8px;display:block;position:relative}
.rail i:before{content:"";position:absolute;inset:11px;border:1.6px solid var(--rail-mute);border-radius:4px}
.rail i.on{background:var(--rail-2)}
.rail i.on:before{border-color:#fff}
.page{flex:1;min-width:0;padding:22px 28px 28px;overflow:auto}
.stage.phone .rail{display:none}
.stage.phone .page{padding:52px 16px 96px}

/* header */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title h1{margin:0;font-size:22px;line-height:28px;font-weight:600}
.title p{margin:2px 0 0;color:var(--mute)}
.grow{flex:1}
.seg{display:inline-flex;background:var(--soft-2);border-radius:var(--r-inner);padding:3px;gap:2px;flex:none}
.seg button{height:30px;padding:0 12px;border-radius:6px;color:var(--body);font-size:14px;font-weight:500;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.btn{height:36px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;color:var(--text);white-space:nowrap}
.btn svg{color:var(--line-ico)}
.btn .badge{background:var(--ink);color:#fff;border-radius:999px;font-size:13px;line-height:18px;min-width:18px;text-align:center;padding:0 5px}
.btn.on{border-color:var(--ink);color:var(--ink)}

/* KPI — the hub's Kpi card: label 14 medium, figure 18 semibold */
.kpis{margin-top:16px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:var(--r-card);background:#fff;padding:10px 16px;box-shadow:var(--shadow-soft);min-width:0}
.kpi .l{font-size:14px;font-weight:500;color:var(--body)}
.kpi .v{margin-top:auto;padding-top:6px;font-size:18px;line-height:1;font-weight:600;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.kpi .s{margin-top:6px;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tabs: three hub tastes */
.navwrap{margin-top:20px}
.tabs-under{display:flex;gap:2px;box-shadow:inset 0 -1px 0 var(--hairline)}
.tabs-under button{border-bottom:2px solid transparent;padding:8px 12px 10px;font-size:14px;font-weight:500;color:var(--body);white-space:nowrap}
.tabs-under button:hover{color:var(--ink)}
.tabs-under button.on{border-color:var(--ink);color:var(--ink)}
.tabs-under button .c,.tabs-quiet button .c{color:var(--faint);font-weight:400;margin-left:6px}
.tabs-nav{display:inline-flex;gap:2px;background:#fff;border:1px solid var(--hairline);border-radius:12px;padding:4px;box-shadow:var(--shadow-soft)}
.tabs-nav button{height:34px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--body);white-space:nowrap}
.tabs-nav button:hover{background:var(--soft)}
.tabs-nav button.on{background:var(--ink);color:#fff}
.tabs-quiet{display:flex;gap:22px;flex-wrap:wrap}
.tabs-quiet button{font-size:15px;font-weight:500;color:var(--mute);padding:6px 0;white-space:nowrap}
.tabs-quiet button.on{color:var(--ink);font-weight:600}

/* results */
.card{margin-top:12px;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow-soft)}
.s3 .card{background:transparent;border:0;box-shadow:none;border-radius:0}
.s3 .card .tools{padding-left:0;padding-right:0}
.tools{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.search{height:36px;width:280px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mute)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 4px;color:var(--text);font-size:14px;font-weight:500}
.switch .t{width:34px;height:20px;border-radius:999px;background:var(--hairline-strong);position:relative;transition:background-color 150ms ease}
.switch .t:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform 160ms var(--ease-out)}
.switch.on .t{background:var(--accent)}
.switch.on .t:after{transform:translateX(14px)}
.applied{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--hairline);color:var(--body);font-size:14px}
.applied button,.crumb button{color:var(--accent);font-weight:500}
.crumb{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--hairline);color:var(--mute);font-size:14px}

.scroll{overflow:auto;position:relative}
.stage.desktop .scroll{max-height:calc(100vh - 420px);min-height:300px}
.stage.tablet .scroll{max-height:640px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:0 14px;height:60px;border-bottom:1px solid var(--hairline);text-align:right;white-space:nowrap;background:#fff}
.s3 th,.s3 td{background:var(--soft-3)}
.s2 th,.s2 td{height:56px}
thead th{height:40px;font-size:14px;font-weight:500;color:var(--mute);position:sticky;top:0;z-index:4}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:2;padding-left:16px}
thead th:first-child{z-index:6}
.pin{position:sticky;right:0;z-index:2;background:var(--soft)}
.s3 .pin{background:#fff}
th.pin{z-index:6}
.pin-l{box-shadow:-8px 0 10px -8px rgba(16,24,40,.16);border-left:1px solid var(--hairline-2)}
td.name{min-width:220px;max-width:280px;white-space:normal}
td.name .n{font-weight:500;color:var(--ink);line-height:20px}
td.name .d{color:var(--mute);font-size:14px;line-height:20px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
tbody tr:hover td.pin{background:var(--soft-2)}
tfoot td{position:sticky;bottom:0;z-index:3;background:var(--soft-2);font-weight:600;border-top:1px solid var(--hairline-2);border-bottom:0}
tfoot td:first-child,tfoot td.pin{z-index:5;background:var(--soft-2)}
.two{line-height:20px}
.two .a{color:var(--ink)}
.two .z{color:var(--mute);font-size:14px}
.b{font-weight:600}
.sep{border-left:1px solid var(--hairline)}
.foot{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--mute);font-size:14px}
.s3 .foot{padding-left:0}
.legend{display:inline-flex;align-items:center;gap:6px}
.legend span{display:inline-block;width:72px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(37,99,235,.04),rgba(37,99,235,.32))}
.fade{animation:fade 160ms var(--ease-out)}
@keyframes fade{from{opacity:.5}to{opacity:1}}

/* phone list */
.plist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pcard{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);padding:12px 14px;box-shadow:var(--shadow-soft)}
.pcard .top{display:flex;align-items:baseline;gap:8px}
.pcard .top .n{font-weight:500}
.pcard .top .v{margin-left:auto;font-weight:600;font-size:16px}
.pcard .meta{color:var(--mute);font-size:14px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.pcard .stores{margin-top:10px;border-top:1px solid var(--hairline);padding-top:6px}
.pcard .stores > div{display:grid;grid-template-columns:44px 1fr 1fr;align-items:center;font-size:14px;line-height:32px;color:var(--text);border-radius:6px;padding:0 6px;margin:0 -6px;white-space:nowrap}
.pcard .stores > div > span{text-align:right}
.pcard .stores > div > span:first-child{text-align:left;color:var(--mute)}
.pcard .stores > div > span:nth-child(2){color:var(--ink)}
.pcard .stores > div > span:nth-child(n+3){color:var(--mute)}
.pcard .stores > div.h{line-height:24px;color:var(--faint)}
.pcard .stores .two{line-height:18px;padding:5px 0}
.pcard .stores .two .z{font-size:14px}
.pcard .stores > div.h span{color:var(--faint)!important}
.ptotal{background:var(--soft-2);border-radius:var(--r-card);padding:12px 14px;display:flex;font-weight:600}
.dock{position:absolute;left:12px;right:12px;bottom:20px;z-index:30;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid var(--hairline);border-radius:16px;padding:6px;box-shadow:0 8px 24px rgba(16,24,40,.12)}
.dock .chip{height:44px;padding:0 12px;border-radius:12px;background:var(--ink);color:#fff;font-weight:500;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.dock .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text);position:relative}
.dock .ib:hover{background:var(--soft-2)}
.dock .ib .badge{position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;border-radius:999px;font-size:12px;min-width:16px;height:16px;line-height:16px;text-align:center}
.dock .per{margin-left:auto;height:44px;padding:0 10px;border-radius:12px;color:var(--text);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}

/* floating sheet: two panes */
.scrim{position:absolute;inset:0;background:rgba(25,27,32,.2);z-index:50;opacity:0;pointer-events:none;transition:opacity 200ms ease}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;top:16px;right:16px;bottom:16px;width:620px;max-width:calc(100% - 32px);background:#fff;border-radius:var(--r-sheet);box-shadow:0 24px 64px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.06);z-index:51;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform 260ms var(--ease-drawer)}
.sheet.open{transform:none}
.stage.phone .sheet{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:78%;transform:translateY(calc(100% + 16px))}
.stage.phone .sheet.open{transform:none}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--hairline)}
.sh-h h2{margin:0;font-size:18px;font-weight:600}
.sh-h .x{margin-left:auto;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--mute)}
.sh-b{flex:1;overflow:auto}
.sh-f{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--hairline)}
.sh-f .primary{margin-left:auto;height:44px;padding:0 18px;border-radius:var(--r-inner);background:var(--ink);color:#fff;font-weight:600}
.panes{display:grid;grid-template-columns:200px 1fr;height:100%}
.panes nav{border-right:1px solid var(--hairline);padding:8px;overflow:auto}
.panes nav button{display:flex;width:100%;align-items:center;height:42px;padding:0 12px;border-radius:8px;color:var(--text);font-weight:500;font-size:14px}
.panes nav button.on{background:var(--soft-2);color:var(--ink)}
.panes nav button small{margin-left:auto;color:var(--mute);font-weight:400;font-size:14px}
.panes .pane{padding:12px 16px;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;height:42px;padding:0 6px;border-radius:8px;cursor:pointer;color:var(--text)}
.opt:hover{background:var(--soft)}
.opt .box{width:18px;height:18px;border:1.5px solid var(--hairline-strong);border-radius:5px;display:grid;place-items:center;flex:none}
.opt.on .box{background:var(--ink);border-color:var(--ink)}
.opt.on .box:after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt .c{margin-left:auto;color:var(--mute);font-size:14px}
.mini-search{height:36px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);display:flex;align-items:center;padding:0 10px;margin-bottom:6px;color:var(--mute);gap:8px}
.mini-search input{border:0;outline:0;flex:1;min-width:0}
.prow{display:flex;align-items:center;height:52px;border-bottom:1px solid var(--hairline);padding:0 20px;gap:10px;cursor:pointer}
.prow .k{font-weight:500}.prow .val{margin-left:auto;color:var(--mute)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;height:40px;padding:0 20px}

/* calendar */
.cal{position:absolute;z-index:45;background:#fff;border:1px solid var(--hairline);border-radius:14px;box-shadow:0 16px 48px rgba(16,24,40,.16);display:flex;transform-origin:top right;animation:pop 160ms var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.cal .pre{border-right:1px solid var(--hairline);padding:10px;width:160px}
.cal .pre button{display:block;width:100%;text-align:left;height:36px;padding:0 10px;border-radius:8px;color:var(--text);font-size:14px}
.cal .pre button:hover{background:var(--soft)}
.cal .pre button.on{background:var(--soft-2);color:var(--ink);font-weight:500}
.cal .mons{padding:14px 16px}
.cal .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .nav button{width:32px;height:32px;border-radius:8px;color:var(--body)}
.cal .pair{display:flex;gap:24px}
.mon h4{margin:0 0 6px;text-align:center;font-size:15px;font-weight:600}
.mon .dow,.mon .days{display:grid;grid-template-columns:repeat(7,36px)}
.mon .dow span{height:28px;display:grid;place-items:center;color:var(--mute);font-size:14px}
.mon .days button{height:36px;font-size:14px;color:var(--text)}
.mon .days button.out{color:var(--faint);cursor:default}
.mon .days button.in{background:var(--accent-bg)}
.mon .days button.end{background:var(--ink);color:#fff;border-radius:8px}
.cal .cf{display:flex;align-items:center;gap:10px;border-top:1px solid var(--hairline);padding:12px 16px;margin:12px -16px -14px}
.cal .cf .primary{margin-left:auto;height:36px;padding:0 14px;border-radius:var(--r-inner);background:var(--ink);color:#fff;font-weight:600}
.stage.phone .cal{position:absolute;left:8px;right:8px;bottom:8px;top:auto;flex-direction:column;border-radius:16px}
.stage.phone .cal .pre{display:flex;flex-wrap:wrap;width:auto;border-right:0;border-bottom:1px solid var(--hairline);gap:4px}
.stage.phone .cal .pre button{width:auto;padding:0 10px}
.stage.phone .cal .pair .mon:last-child{display:none}
.stage.phone .mon .dow,.stage.phone .mon .days{grid-template-columns:repeat(7,1fr)}

/* tablet: the hub's md breakpoint */
@container app (max-width: 900px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .search{width:220px}
  .page{padding:20px}
  .tabs-under button{padding:8px 9px 10px}
  .tabs-nav button{padding:0 10px}
}
</style>
</head>
<body>
<div class="proto">
  <b>Sales — One table v2</b>
  <div class="grp"><span>Style</span><button class="pressable" data-style="1">1 · Hub tabs</button><button class="pressable" data-style="2">2 · Navbar</button><button class="pressable" data-style="3">3 · Quiet</button></div>
  <div class="grp"><span>Device</span><button class="pressable" data-device="desktop">Desktop</button><button class="pressable" data-device="tablet">Tablet</button><button class="pressable" data-device="phone">Phone</button></div>
  <span class="note">Real: transactions, sold, net sales, divisions, stores, months, payment · Sample: stock, acquisition, tags, suppliers, cashier sessions</span>
</div>
<div class="stage desktop" id="stage">
  <div class="device" id="device">
    <div class="app" id="app">
      <nav class="rail"><div class="logo">C</div><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i></nav>
      <main class="page" id="page"></main>
    </div>
    <div id="dock"></div>
    <div class="scrim" id="scrim"></div>
    <aside class="sheet" id="sheet"></aside>
  </div>

/* ── KPI: the hub's small cards ─────────────────────── */
function kpis() {

    ["Sold", `${num(t.sold)} pcs`, `${(t.sold / t.done).toLocaleString("id-ID", { maximumFractionDigits: 1 })} pcs each`],
    ["Sales", rpc(t.net), `${rpc(t.discount)} discount · avg ${rpc(t.net / t.done)}`],

}

  document.getElementById("dock").innerHTML = dock();
  document.querySelectorAll(".proto [data-style]").forEach((b) => b.classList.toggle("on", +b.dataset.style === S.style));
  document.querySelectorAll(".proto [data-device]").forEach((b) => b.classList.toggle("on", b.dataset.device === S.device));
  sheet();
  if (focus) { const q = document.getElementById("q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}
const toggle = (set, v) => (set.has(v) ? set.delete(v) : set.add(v));
document.addEventListener("click", (e) => {
  if (S.cal && !e.target.closest(".cal") && !e.target.closest("[data-calbtn]")) { S.cal = false; render(); return; }
  const b = e.target.closest("button,tr,.opt,.prow,.pcard"); if (!b || b.disabled) return; const d = b.dataset;
  if (d.style) S.style = +d.style;
  else if (d.device) { S.device = d.device; S.sheet = null; S.cal = false; }
  else if (d.preset) { S.preset = d.preset; [, S.from, S.to] = PRESETS[d.preset]; if (S.sheet === "period") S.sheet = null; }
  else if (d.calbtn) { S.cal = !S.cal; S.sheet = null; S.calA = S.preset === "custom" ? S.from : null; S.calB = S.preset === "custom" ? S.to : null; }
  else if (d.calnav) S.calLeft = Math.min(10, Math.max(0, S.calLeft + +d.calnav));
  else if (d.day) { if (!S.calA || S.calB) { S.calA = d.day; S.calB = null; } else S.calB = d.day; }
  else if (d.quick) [S.calA, S.calB] = d.quick.split("|");
  else if (d.calcancel) S.cal = false;
  else if (d.calapply) { if (!S.calA) return; const a = S.calA, z = S.calB || S.calA; S.from = a < z ? a : z; S.to = a < z ? z : a; S.preset = "custom"; S.cal = false; }
  else if (d.group) { S.group = d.group; S.drill = null; S.q = ""; if (S.sheet === "group") S.sheet = null; }
  else if (d.view) S.view = d.view;
  else if (d.heat) S.heat = !S.heat;
  else if (d.openfilter) { S.sheet = "filter"; S.phonePane = null; }
  else if (d.sheet) S.sheet = d.sheet;
  else if (d.close) S.sheet = null;
  else if (d.pane) S.pane = d.pane;
  else if (d.ppane !== undefined) S.phonePane = d.ppane || null;
  else if (d.opt) { const [k, v] = d.opt.split("|"); toggle(S.f[k], v); }
  else if (d.radio) { const [k, v] = d.radio.split("|"); S.f[k] = v; }
  else if (d.clear) S.f = { stores: new Set(), divisions: new Set(), tags: new Set(), payment: new Set(), suppliers: new Set(), price: "all", stock: "all" };
  else if (d.psearch) S.phoneSearch = !S.phoneSearch;
  else if (d.up) S.drill = null;
  else if (d.row && !S.drill && S.group === "division") S.drill = d.row;
  else return;
  render();
});
document.getElementById("scrim").addEventListener("click", () => { S.sheet = null; S.cal = false; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { S.sheet = null; S.cal = false; render(); } });
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render(); } });
render();
</script>
