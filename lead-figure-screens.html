<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Figure Screens</title>
<style>
:root{
  --ink:#20242c;--text:#394150;--body:#565f6d;--mute:#666f7d;--faint:#b9c0c9;--line-ico:#89919d;
  --canvas:#fff;--soft:#f8f8f9;--soft-2:#f0f0f2;--page:#f6f6f7;--hairline:#e6e6e9;--hairline-2:#dadade;
  --accent:#2563eb;--accent-bg:#eff5ff;--ok-fg:#137a37;--ok-line:#b9dcbf;--bad:#b42318;--bad-bg:#fdf4f4;--warn:#9a5b00;
  --shadow-soft:0 1px 2px rgb(24 39 60 / 6%),0 1px 1px rgb(24 39 60 / 4%);
  --shadow-float:0 12px 32px rgb(15 23 42 / 16%),0 2px 6px rgb(15 23 42 / 8%);
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--w:414px;
}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#e4e4e8;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;padding:0}
svg{display:block;flex:none}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.9}
.bar{position:sticky;top:0;left:0;z-index:100;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 20px;background:rgb(255 255 255 / .92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline-2)}
.bar h1{font-size:15px;font-weight:600;margin-right:6px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:9px;background:#d9d9de}
.seg button{padding:5px 11px;border-radius:7px;font-size:14px;font-weight:500;color:#444}
.seg button[aria-pressed=true]{background:#fff;color:#111;box-shadow:0 1px 2px rgb(0 0 0 / .15)}
.lab{font-size:14px;color:#555;margin-right:8px}
.stage{display:flex;gap:28px;padding:24px 20px 60px;overflow-x:auto;align-items:flex-start}
.opt{flex:none}
.opt h2{font-size:15px;font-weight:600;margin:0 4px 2px}
.opt p{font-size:14px;color:#555;margin:0 4px 10px;max-width:var(--w);min-height:88px}

/* phone */
.phone{position:relative;width:var(--w);height:896px;background:var(--page);border-radius:30px;border:1px solid #cfcfd6;box-shadow:0 18px 40px rgb(0 0 0 / .14);overflow:hidden;display:flex;flex-direction:column}
.top{height:51px;flex:none;background:#fff;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px;padding:0 12px 0 16px}
.top b{font-weight:600;font-size:17px;letter-spacing:-.01em}.top .sp{flex:1}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:15px}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 24px;position:relative}
.kstrip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-bottom:14px;border:1px solid var(--hairline);border-radius:10px;background:#fff;box-shadow:var(--shadow-soft)}
.kstrip div{padding:12px 6px;text-align:center;min-width:0}.kstrip div+div{border-left:1px solid var(--hairline)}
.kstrip b{display:block;font-size:17px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.kstrip span{display:block;font-size:14px;color:var(--mute)}
.sw{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:8px;background:#fff;box-shadow:var(--shadow-soft);color:var(--text);font-size:14px;margin-bottom:14px}
.sw i{width:30px;height:18px;border-radius:9px;background:#d4d6db;position:relative}.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.dock{flex:none;padding:0 8px 8px}
.dock .c2{display:flex;gap:6px;align-items:center;padding:8px;border-radius:1.75rem;border:1px solid rgb(0 0 0 / .06);background:rgb(255 255 255 / .95);box-shadow:var(--shadow-float)}
.chip{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 14px;border-radius:999px;background:var(--soft-2);font-size:14px;font-weight:500}
.field{flex:1;min-width:0;display:flex;align-items:center;height:36px;border-radius:999px;background:var(--soft-2);padding:0 8px 0 12px;color:var(--mute);font-size:14px;gap:8px}
.field .s{flex:1;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.tabs{height:80px;flex:none;background:#fff;border-top:1px solid var(--hairline);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:24px;position:relative}
.tabs::after{content:"";position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#1a1a1a}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:500;color:var(--mute)}
.tabs button .ico{font-size:22px;color:var(--line-ico)}
.tabs button.on{color:var(--accent);background:linear-gradient(180deg,rgb(37 99 235 / .08),transparent)}.tabs button.on .ico{color:var(--accent)}
.empty{padding:40px 16px;text-align:center;font-size:14px;color:var(--body)}

/* cards */
.cards{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--hairline);border-radius:10px;background:var(--canvas);box-shadow:var(--shadow-soft);transition:scale 120ms var(--ease-out)}
.card.press:active{scale:.985}
.card .hd{display:flex;gap:12px;padding:16px;align-items:flex-start}
.card.slim .hd{padding:14px 16px}
.card .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--soft-2);display:grid;place-items:center;flex:none;color:#9aa1ac}
.thumb svg{width:26px;height:26px}
.nm{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.nm.mute{color:var(--mute)}
.q{font-size:14px;color:var(--mute);line-height:1.45;overflow-wrap:anywhere}.q b{font-weight:500;color:var(--ink)}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.tag{display:inline-block;max-width:100%;overflow-wrap:anywhere;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:14px;color:var(--text);background:var(--soft-2);border-radius:6px;padding:1px 8px}
.lead{text-align:right;flex:none;max-width:48%}
.lead b{display:block;font-size:24px;line-height:1.1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lead b.z{color:var(--mute)}.lead b small{font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0}
.lead span{display:block;margin-top:2px;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--hairline);border-radius:0 0 9px 9px;font-size:14px;color:var(--mute);line-height:1.5}
.foot.t{background:var(--bad-bg);border-top-color:#f9e9e9}
.foot b{font-size:15px;font-weight:600;color:var(--ink)}.foot b.bad,.bad{color:var(--bad)}
.dw{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap}.dw i{width:7px;height:7px;border-radius:50%;background:currentColor}
.dw.ok{color:var(--ok-fg)}.dw.n{color:var(--mute)}.dw.info{color:var(--accent)}.dw.warn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--ok-line);color:var(--ok-fg);font-size:14px;font-weight:500;background:#fff;white-space:nowrap}
.pill.n{border-color:var(--hairline-2);color:var(--body)}.pill.warn{border-color:#e9d3a6;color:var(--warn)}.pill.info{border-color:#c3d4f7;color:#1e40af}
.btn{height:36px;padding:0 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:500;display:inline-flex;align-items:center;transition:scale 120ms var(--ease-out)}
.btn:active{scale:.97}
.eye{display:inline-flex;margin-right:6px;color:var(--mute)}
.edit{position:relative;display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 14px;border:0;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-size:15px;font-weight:600;transition:scale 120ms var(--ease-out),background-color 100ms}
.edit::after{content:"";position:absolute;inset:-6px}
.edit:active{scale:.97;background:#dfeaff}
.stage[data-btn=solid] .edit{background:var(--accent);color:#fff}.stage[data-btn=solid] .edit:active{background:#1d4fd0}
.stage[data-btn=outlined] .edit{background:#fff;color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--hairline-2),var(--shadow-soft)}.stage[data-btn=outlined] .edit:active{background:var(--soft)}
.sheet .acts .edit.dim{height:44px;background:#fff;color:var(--bad);box-shadow:inset 0 0 0 1px var(--hairline-2)}
.sheet .acts .edit.dim::after{display:none}
.ib{width:44px;height:44px;margin:-10px -10px -10px -4px;display:grid;place-items:center;border-radius:50%;color:var(--mute);flex:none;transition:scale 120ms var(--ease-out),background-color 100ms}
.ib:active{background:var(--soft-2);scale:.94}.ib .ico{width:18px;height:18px}
.veil{position:absolute;inset:0;background:rgb(15 23 42 / .32);opacity:0;transition:opacity 220ms var(--ease-out);z-index:20}
.veil.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:20px 20px 0 0;box-shadow:var(--shadow-float);padding:8px 16px 28px;translate:0 100%;transition:translate 320ms var(--ease-drawer)}
.sheet.in{translate:0 0}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--hairline-2);margin:0 auto 12px}
.sheet h3{font-size:17px;font-weight:600;margin-bottom:2px}.sheet .sub{font-size:14px;color:var(--mute);margin-bottom:14px}
.sheet label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.sheet .in{height:44px;border:1px solid var(--hairline-2);border-radius:8px;display:flex;align-items:center;padding:0 12px;font-size:15px}
.sheet .acts{display:flex;gap:10px;margin-top:18px}.sheet .acts .btn{flex:1;justify-content:center;height:44px}
.hint{position:absolute;left:12px;right:12px;top:60px;z-index:19;padding:8px 12px;border-radius:8px;background:#20242c;color:#fff;font-size:14px;opacity:0;translate:0 -6px;transition:opacity 160ms var(--ease-out),translate 160ms var(--ease-out);pointer-events:none}
.hint.in{opacity:1;translate:0 0}

.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgb(0 0 0 / .18)}
.sw2{width:22px;height:22px;border-radius:50%;border:1px solid rgb(0 0 0 / .15);flex:none;margin-top:2px}
.stamp{display:inline-block;rotate:-12deg;border:3px double currentColor;border-radius:6px;padding:2px 10px;text-align:center;font-size:14px;font-weight:700;line-height:20px;letter-spacing:.06em;text-transform:uppercase;mix-blend-mode:multiply;opacity:.85;white-space:nowrap}
.stamp.ok{color:var(--ok-fg)}

/* today (what the app draws now) */
.today dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:8px}
.today dt{font-size:14px;color:var(--mute)}.today dd{margin-top:2px;font-size:15px;color:var(--ink)}
.today{padding:16px}
.sortbar{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:-4px 0 12px;border:1px solid var(--hairline);border-radius:10px;background:#fff;font-size:14px;color:var(--mute)}
.sortbar span{flex:1;height:34px;border:1px solid var(--hairline-2);border-radius:8px;display:flex;align-items:center;padding:0 10px;color:var(--ink)}

/* sections */
.sec{position:sticky;top:-16px;z-index:5;margin:0 -16px;padding:0 16px;background:var(--page)}
.sec button{display:flex;align-items:center;gap:8px;width:100%;padding:12px 0 8px;text-align:left}
.sec .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sec b{font-size:16px;font-weight:600}.sec .n{font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.sec .r{margin-left:auto;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.sec .chev{font-size:16px;color:var(--line-ico);transition:rotate 200ms var(--ease-out)}
.sec.shut .chev{rotate:-90deg}
.grp{display:grid;grid-template-rows:1fr;transition:grid-template-rows 240ms var(--ease-out)}
.grp>div{min-height:0;overflow:hidden}
.grp.shut{grid-template-rows:0fr}
.grp .cards{padding-bottom:6px}
/* rows */
.rows{border:1px solid var(--hairline);border-radius:10px;background:#fff;box-shadow:var(--shadow-soft);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;transition:background-color 100ms}
.row+.row{border-top:1px solid var(--hairline)}.row:active{background:var(--soft)}
.row .l{flex:1;min-width:0}
.row .r{text-align:right;flex:none}.row .r b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.row .r span{font-size:14px;color:var(--mute)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--hairline-2);flex:none}
@media (prefers-reduced-motion:reduce){.grp,.sec .chev,.card{transition:none}}
</style>
</head>

  ];
  if(screen==="Articles") return [
    P("Today","Thumbnail and name, a line of division · colours · sizes · status, then SKUs and price range as a two-by-two.",todaySort+`<div class="cards">${d.articles.map(aToday).join("")}</div>`),
    P("A · Price leads","What it sells for is the figure; division, colours and sizes sit in the foot with the SKU count.",`<div class="cards">${d.articles.map(aLeadA).join("")}</div>`),
    P("B · SKUs lead","How many SKUs it is made of is the figure; the price range and the status are the foot.",`<div class="cards">${d.articles.map(aLeadB).join("")}</div>`),
    P("C · Uniform card","The same card as the others: the price is the figure, division and colours sit under the code, and the foot says how many SKUs and sizes on the left and Edit on the right. An inactive article has the eye-off mark and a grey name.",`<div class="cards">${d.articles.map(aUni).join("")}</div>`),
  ];
  if(screen==="New Articles"){
    const A=d.newArts.map(g=>section(g.sup,null,g.sup,`${g.rows.length} ${g.rows.length===1?"item":"items"}`,fmt(sum(g))+" pcs",`<div class="cards">${g.rows.map(nCardA).join("")}</div>`,"na:")).join("");
    const B=d.newArts.map(g=>section(g.sup,null,g.sup,`${g.rows.length} ${g.rows.length===1?"item":"items"}`,fmt(sum(g))+" pcs",`<div class="rows">${g.rows.map(nRowB).join("")}</div>`,"nb:")).join("");
    return [
      P("Today","One white box: a supplier line, then rows with a thumbnail, the PO number and the pieces.",nToday(d.newArts)),
      P("A · Cards under a supplier","Each new article is a card (pieces as the figure, how long it has waited and Set up in the foot) under a supplier heading that sticks and folds.",A),
      P("B · Rows under a supplier","The same headings, but each article is a slim row: for a long list, where a button on every line is a lot of blue.",B),
    ];
  }
  if(screen==="Allotments") return [
    P("Today · Unallotted","A supplier line with a tick, then a tick, a thumbnail and the pieces on every row.",uToday(d.unallotted),{status:"Unallotted"}),
    P("Unallotted · lead figure","A card per supplier: the pieces still free lead; its articles are rows inside the card. As built.",uLead(d.unallotted),{status:"Unallotted"}),
    P("Allotments · lead figure","A card per allotment: the pieces lead with the item count under them; what has been received, and the status, in the foot. As built.",`<div class="cards">${d.allotments.map(aoCard).join("")}</div>`),
  ];
  if(screen==="Return to HO") return [
    P("Today","The allotment summary sentence (it says allotments), a type menu, and an empty book.",`<p class="q" style="margin-bottom:12px"><b>0 allotments</b> are active. 0 pcs not shipped yet, 0 in transit.</p><span class="sw">Allotments</span><p class="empty">Nothing here yet.</p>`),
    P("A · Same card as an allotment","A return is an allotment of type Return to HO, so it is the same card: pieces lead, received and status in the foot.",`<div class="cards">${d.returns.map(aoCard).join("")}</div>`),
  ];
  if(screen==="Return to HO · Ops") return [
    P("Today","A labelled two-by-two (sent on, koli) with the store over its return number; what was counted, or the Count receive button, sits alone at the bottom.",rtToday(d.storeReturns)),
    P("Lead figure","The koli is the figure, the one number a blind delivery has. The foot says when it left and, once counted, what was found: red, on a soft red wash, when it is not what was announced. The button is the same as every other card's; Received is a pill, because it is only read.",rtLead(d.storeReturns)),
  ];
  if(screen==="Allotment · Ops") return [
    P("Today (before)","A flat table of cards: a number, the store, the number, a lane word, the pieces as a labelled figure.",opToday(d.lanes)),
    P("Lead figure, by lane","Lanes are the sections of one list, in the order the goods move; a heading sticks to the top and folds on a tap; each card leads with its pieces and carries the verb. Built in the app.",opLead(d.lanes)),
  ];
  return [];
}
function paint(){
  document.documentElement.style.setProperty("--w",width+"px");
  const d=DATA[key];
  document.getElementById("stage").innerHTML=screens(d).map(p=>`<section class="opt"><h2>${p.name}</h2><p>${p.blurb}</p>${p.html}</section>`).join("");
  seg("screen",SCREENS,screen,v=>{screen=v;paint();sync()});
  seg("data",Object.keys(DATA),key,v=>{key=v;paint();sync()});
  seg("width",WIDTHS.map(String),String(width),v=>{width=Number(v);paint();sync()});
  document.getElementById("stage").dataset.btn=btn;
  seg("btn",["tinted","solid","outlined"],btn,v=>{btn=v;paint();sync()});
  const CODES=[["rec","Recommended"],["thin","Under label"],["chip","Chip"],["none","Hidden"]];
  const ce=document.getElementById("code");ce.innerHTML=CODES.map(([v,l])=>`<button aria-pressed="${v===code}">${l}</button>`).join("");[...ce.children].forEach((b,i)=>b.onclick=()=>{code=CODES[i][0];paint();sync()});
}
function seg(id,values,cur,on){const el=document.getElementById(id);el.innerHTML=values.map(v=>`<button aria-pressed="${v===cur}">${v}</button>`).join("");[...el.children].forEach((b,i)=>b.onclick=()=>on(values[i]))}
function sync(){history.replaceState(null,"","?"+new URLSearchParams({screen,data:key,w:String(width),b:btn,c:code}))}
const noun={Divisions:"Division",Tags:"Tag",Sizes:"Size",Colors:"Color",Articles:"Article"};
function openSheet(card,viaBtn){
  const ph=card.closest(".phone");if(!ph||ph.querySelector(".sheet"))return;
  const k=card.dataset.k,ordered=k==="Divisions"||k==="Sizes";
  ph.insertAdjacentHTML("beforeend",`<div class="veil"></div><div class="sheet"><div class="grab"></div><h3>Edit ${noun[k]}</h3><div class="sub">${viaBtn?"Opened by the Edit button":"Opened by tapping the card"}</div><label>Name</label><div class="in">${card.dataset.t}</div><label>Code</label><div class="in mono">${card.dataset.c}</div><div class="acts"><button class="edit dim">Delete</button><button class="btn">Save</button></div></div>`);
  const v=ph.querySelector(".veil"),sh=ph.querySelector(".sheet");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{v.classList.add("in");sh.classList.add("in")}));
  const shut=()=>{v.classList.remove("in");sh.classList.remove("in");setTimeout(()=>{v.remove();sh.remove()},320)};
  v.onclick=shut;sh.querySelector(".btn").onclick=shut;sh.querySelector(".acts .edit").onclick=shut;
}
document.getElementById("stage").addEventListener("click",e=>{
  const card=e.target.closest("[data-edit]");
  if(card)return openSheet(card,!!e.target.closest("[data-btn]"));
  const b=e.target.closest("[data-fold]");if(!b)return;const id=b.dataset.fold;
  document.querySelectorAll(`[data-fold="${CSS.escape(id)}"]`).forEach(x=>{
    const sec=x.closest(".sec"),grp=sec.nextElementSibling;
    const shutNow=!sec.classList.contains("shut");sec.classList.toggle("shut",shutNow);grp.classList.toggle("shut",shutNow)});
  shut.has(id)?shut.delete(id):shut.add(id);
});
paint();
</script>
