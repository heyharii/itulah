<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Department overviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --ink:#20242c;--text:#394150;--mute:#737c89;--faint:#b9c0c9;
  --soft:#f8f8f9;--soft-2:#f0f0f2;--line:#e6e6e9;--line-2:#c6c6cc;
  --accent:#2563eb;--accent-bg:#eff5ff;--ok-fg:#15803d;--warn:#c9892e;--warn-bg:#faeacd;--warn-fg:#b45309;--bad:#d05151;--bad-fg:#be123c;
  --side:#242526;--r-card:10px;--ease:cubic-bezier(.23,1,.32,1);
  --app-buying:#2f6fed;--app-merchandise:#e8456b;--app-ops:#1f9fb4;--app-inventory:#b7791f;--app-finance:#5856d6;--app-selling:#2ea44f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--text);background:var(--soft);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg.lucide{width:16px;height:16px;stroke-width:1.7;flex-shrink:0}
.mute{color:var(--mute)}.faint{color:var(--faint)!important}
.proto{height:44px;background:#101012;color:#d9dbe0;display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:20}
.proto b{color:#fff;font-weight:600;white-space:nowrap}
.proto .opts{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.proto .opts button{height:30px;padding:0 12px;border-radius:7px;color:#a9adb6;white-space:nowrap}
.proto .opts button:hover{color:#fff}
.proto .opts button[aria-pressed=true]{background:#2c2d31;color:#fff;font-weight:500}
.app{display:flex;min-height:calc(100vh - 44px)}
.side{width:232px;flex-shrink:0;background:var(--side);color:#c9cbd0;padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:44px;height:calc(100vh - 44px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;color:#fff;font-weight:600}
.mark{width:26px;height:26px;border-radius:7px;background:#000;color:#fff;display:grid;place-items:center;font-weight:700;position:relative;font-size:14px;box-shadow:0 0 0 1px #3a3b3f}
.mark::after{content:"";position:absolute;right:4px;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dept{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;color:#8e9198;border-radius:7px;cursor:pointer}
.dept:hover{color:#fff}
.dept i{width:8px;height:8px;border-radius:50%;background:var(--c,#5b5d63)}
.dept.on{color:#fff;font-weight:500}
.sub{margin:0 0 6px 14px;border-left:1px solid #3a3b3f;padding-left:8px;display:flex;flex-direction:column;gap:2px}
.sub a{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-radius:7px;color:#b4b7be}
.sub a.on{background:#34353a;color:#fff}
.sub a .c{color:#e6b45c;font-variant-numeric:tabular-nums}
.main{flex:1;min-width:0;padding:26px 32px 48px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:22px;line-height:30px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.sel{height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 10px}
.view{display:none;animation:in .18s var(--ease)}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(172px,auto);gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;min-width:0;position:relative;text-align:left;transition:border-color .15s,box-shadow .2s var(--ease),transform .2s var(--ease)}
.tile.go{cursor:pointer}
.tile.go:hover{border-color:var(--line-2);box-shadow:0 6px 18px rgba(20,24,32,.06)}
.tile.go:active{transform:scale(.995)}
.w2{grid-column:span 2}.h2{grid-row:span 2}
.tt{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--text);font-weight:500}
.tt svg{color:var(--mute)}
.tt .arr{color:var(--faint);transition:color .15s}
.tile.go:hover .tt .arr{color:var(--ink)}
.tt .dd{display:flex;align-items:center;gap:8px}
.tt .dd i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fig{margin-top:auto;padding-top:14px}
.fig .n{display:flex;align-items:baseline;gap:7px}
.fig .n b{font-size:34px;line-height:1.1;font-weight:600;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fig .n span{color:var(--mute)}
.fig p{color:var(--mute);margin-top:4px}
.fig p b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.warnN .n b{color:var(--warn-fg)!important}
.badN .n b{color:var(--bad-fg)!important}
.h2 .fig{margin-top:6px}
.h2 .list{margin-top:auto;padding-top:12px}
.pair{margin-top:auto;padding-top:14px;display:flex;gap:20px}
.pair>div+div{border-left:1px solid var(--line);padding-left:20px}
.pair b{font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.pair span{color:var(--mute)}
.pair b.warn,.warn{color:var(--warn-fg)}
.list{margin-top:12px;display:flex;flex-direction:column}
.list div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.list div:first-child{border-top:0}
.list .a{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .q{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.list .s{color:var(--mute);grid-column:1/-1}
.bar{display:flex;gap:2px;height:8px;margin-top:14px}
.bar span{border-radius:2px;min-width:3px}
.bar span:first-child{border-radius:4px 2px 2px 4px}.bar span:last-child{border-radius:2px 4px 4px 2px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin-top:12px}
.legend div{display:flex;justify-content:space-between;gap:8px}
.legend div span{display:flex;align-items:center;gap:7px;color:var(--text)}
.legend i{width:8px;height:8px;border-radius:2px}
.legend b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.legend .sub2{color:var(--mute)}
.dot{display:inline-flex;align-items:center;gap:6px}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
.gap{height:8px}
.secline{grid-column:1/-1;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:8px;margin-top:10px}
.secline i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.secline:first-child{margin-top:0}
/* buying: one screen, two decision cards on top, five figures below */
.main.fit{height:calc(100vh - 44px);display:flex;flex-direction:column;padding-bottom:24px}
.main.fit .view.on{flex:1;min-height:0;display:flex;flex-direction:column}
.bento-b{flex:1;min-height:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:minmax(0,1fr) 168px;gap:12px}
.bento-b .big{grid-column:span 5;padding:20px 22px}
.bento .big{grid-column:span 2;grid-row:span 2}
.bento-b .tile:not(.big){grid-column:span 2}
.big .tt .btn{height:36px;padding:0 16px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-weight:500;transition:background .12s,transform .12s var(--ease)}
.big .tt .btn:hover{background:var(--soft)}
.big .tt .btn:active{transform:scale(.97)}
.big .fig .n b{font-size:40px}
.pol{margin-top:16px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.pomore{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center}
.pomore .link{color:var(--accent);font-weight:500}
.pol>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.pol .a{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pol .q{text-align:right;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pol .s{color:var(--mute);grid-column:1/-1}
.pob{grid-column:1/-1;display:flex;gap:2px;height:6px;border-radius:3px;background:var(--soft-2);overflow:hidden}
.pob i{display:block;height:100%;background:var(--ink);border-radius:3px}
.pob i.ov{background:var(--warn)}
@media (max-height:860px){.pol>div:nth-child(n+4){display:none}}
@media (max-height:760px){.pol>div:nth-child(n+3){display:none}}
/* merchandise: three decisions on top, returns and divisions below */
.bento-m{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:184px 150px auto;align-content:start;
  grid-template-areas:"new new new new un un un un iss iss iss iss" "ret ret ret ret ret ret road road road cat cat cat" "div div div div div div div div div div div div"}
.bento-m .tt .btn{height:36px;padding:0 16px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-weight:500}
.bento-m .tt .btn:hover{background:var(--soft)}
.dvc{margin-top:16px;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:18px}
.dvc div{display:flex;flex-direction:column;gap:4px;min-width:0}
.dvc span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dvc b{font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dvc i{display:block;height:4px;border-radius:2px;background:var(--soft-2);overflow:hidden;margin-top:4px}
.dvc em{display:block;height:100%;background:var(--ink);border-radius:2px}
.bento-m .big{padding:18px 20px}
.mini{margin-top:auto;display:flex;flex-direction:column}
.mini div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.mini .a{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .q{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.mt{width:100%;border-collapse:collapse;margin-top:8px}
.mt th{height:32px;text-align:left;font-weight:500;color:var(--mute);border-bottom:1px solid var(--line)}
.mt td{height:27px;color:var(--ink);white-space:nowrap}
.mt .n{text-align:right;font-variant-numeric:tabular-nums}
.mt td.mute{color:var(--mute)}
.mt tr+tr td{border-top:1px solid #f3f3f5}
.dv{margin-top:10px;display:flex;flex-direction:column;justify-content:space-between;flex:1}
.dv div{display:grid;grid-template-columns:96px 1fr 60px 76px;gap:12px;align-items:center;height:24px}
.dv span:first-child{color:var(--ink)}
.dv b{text-align:right;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.dv .mute{text-align:right}
.dbar{height:8px;border-radius:4px;background:var(--soft-2);overflow:hidden}
.dbar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bento-m .tt .mute{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-height:860px){.mini div:nth-child(3){display:none}}
@media (max-width:1200px){.bento-m{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;grid-template-areas:"new un" "iss iss" "road cat" "ret ret" "div div"}.dvc{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.bento-m{grid-template-columns:1fr;grid-template-areas:"new" "un" "iss" "road" "cat" "ret" "div"}}
@media (max-width:1200px){.bento-b{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}.bento-b .big{grid-column:span 2}.bento-b .tile:not(.big){grid-column:span 1;min-height:150px}.main.fit{height:auto}}
@media (max-width:1200px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.side{display:none}.main{padding:20px 16px 40px}}
@media (max-width:640px){.bento{grid-template-columns:1fr}.w2{grid-column:auto}.h2{grid-row:auto}.legend{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="proto"><b>Overviews</b>
  <div class="opts" id="opts">
    <button data-v="buying">Buying</button>
    <button data-v="md">Merchandise</button>
    <button data-v="ops">Operations</button>
    <button data-v="home">Home · all departments</button>
  </div>
</div>
<div class="app">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>

<script>
const fmt = n => n.toLocaleString('en-US');
const NAV = {
  buying:{name:'Buying',c:'var(--app-buying)',rows:[['Overview'],['Purchase orders',8],['Suppliers'],['Sourcing'],['Return to supplier',4]]},
  md:{name:'Merchandise',c:'var(--app-merchandise)',rows:[['Overview'],['Articles',14],['Divisions'],['Tags'],['Sizes'],['Colours'],['Allotment',4],['Return to HO']]},
  ops:{name:'Operations',c:'var(--app-ops)',rows:[['Overview'],['Receiving',4],['Printing'],['Outbound'],['Stock'],['Count',2]]},
  inv:{name:'Inventory',c:'var(--app-inventory)',rows:[['Overview'],['Stock'],['Exceptions',16],['Counts'],['Adjustments']]},
};

// ---------- tiles ----------
const T = (o) => `<div class="tile ${o.go ? 'go' : ''} ${o.w ? 'w2' : ''} ${o.h ? 'h2' : ''}" ${o.go ? `data-go="${o.go}"` : ''}>
  <div class="tt">${o.dept ? `<span class="dd" style="--c:${o.dept}"><i></i>${o.title}</span>` : `<span>${o.title}</span>`}${o.go ? '<i data-lucide="arrow-up-right" class="arr"></i>' : `<i data-lucide="${o.icon}"></i>`}</div>
  ${o.body || ''}</div>`;
const num = (n, unit, sub, cls = '') => `<div class="fig ${cls}"><div class="n"><b>${n}</b>${unit ? `<span>${unit}</span>` : ''}</div>${sub ? `<p>${sub}</p>` : ''}</div>`;
const pair = (a, b) => `<div class="pair">${[a, b].map(([n, l, cls]) => `<div><b class="${cls || ''}">${n}</b><span>${l}</span></div>`).join('')}</div>`;
const list = rows => `<div class="list">${rows.map(([a, q, s]) => `<div><span class="a">${a}</span><span class="q">${q}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`).join('')}</div>`;
const SHADES = ['var(--ink)', '#6b7280', '#a3aab4', '#d4d8de', '#eceef1'];
const bar = (parts) => { const tot = parts.reduce((a, p) => a + p[1], 0);
  return `<div class="bar">${parts.map((p, i) => `<span style="flex:${p[1]};background:${p[2] || SHADES[i]}"></span>`).join('')}</div>
  <div class="legend">${parts.map((p, i) => `<div><span><i style="background:${p[2] || SHADES[i]}"></i>${p[0]}</span><b>${fmt(p[1])}</b></div>`).join('')}</div>`; };

// ---------- Buying ----------
// Two decisions the buyer owns get the big cards; the rest are one figure each.
const poBar = (got, ordered, over) => {
  const max = ordered + (over || 0);
  return `<span class="pob"><i style="width:${Math.min(got, ordered) / max * 100}%"></i>${over ? `<i class="ov" style="width:${over / max * 100}%"></i>` : ''}</span>`;
};
const big = (o) => `<div class="tile big go" data-go="po">
  <div class="tt"><span>${o.title}</span><button class="btn">Review</button></div>
  <div class="fig" style="margin-top:6px;padding-top:6px"><div class="n ${o.cls || ''}"><b>${o.n}</b><span>POs</span></div><p>${o.sub}</p></div>
  <div class="pol">${o.rows.map(r => `<div><span class="a">${r[0]} <span class="mute">· ${r[1]}</span></span><span class="q ${o.cls === 'warnN' ? 'warn' : ''}">${r[2]}</span>${poBar(r[3], r[4], r[5])}<span class="s">${r[6]}</span></div>`).join('')}</div>
  <div class="pomore">${o.more ? `<span class="mute">and ${o.more} more</span>` : '<span></span>'}<span class="link">View all</span></div>
</div>`;
const small = (title, n, unit, sub, cls = '') => `<div class="tile go" data-go="po"><div class="tt"><span>${title}</span><i data-lucide="arrow-up-right" class="arr"></i></div>${num(n, unit, sub, cls)}</div>`;
const BUY_BIG = [
  big({title:'Over-delivered', n:3, cls:'warnN', sub:'<b>22</b> pcs more than ordered · keep or send back', more:0, rows:[
    ['PO-2026-0446','CV Sinar Garmen','+12',240,240,12,'240 ordered · counted today 08:15'],
    ['PO-2026-0433','PT Kain Nusantara','+6',120,120,6,'120 ordered · counted 2 Oct'],
    ['PO-2026-0428','Konveksi Abadi','+4',80,80,4,'80 ordered · counted 1 Oct']]}),
  big({title:'Short delivered', n:5, sub:'<b>238</b> pcs still missing · wait or close short', more:1, rows:[
    ['PO-2026-0458','PT Indo Denim','312 of 500',312,500,0,'Counted yesterday 16:40'],
    ['PO-2026-0429','CV Linen Prima','140 of 160',140,160,0,'Counted 3 Oct'],
    ['PO-2026-0437','Konveksi Abadi','86 of 100',86,100,0,'Counted 2 Oct'],
    ['PO-2026-0441','Rajut Bandung','198 of 210',198,210,0,'Counted today 09:02']]}),
];
const BUY_SMALL = [
  small('Late', 2, 'POs', 'Oldest <b>3 d</b> past the date', 'warnN'),
  small('Active PO', 12, 'POs', '<b>1</b> partly received'),
  small('Active suppliers', 38, '', '<b>6</b> non-active'),
  small('Sourcing', fmt(1240), 'items', 'From <b>31</b> suppliers'),
  small('Return to supplier', 4, 'open', '<b>2</b> to hand over'),
];
const BUY = [...BUY_BIG, ...BUY_SMALL];

// ---------- Merchandise ----------
const deck = (o) => `<div class="tile big go" style="grid-area:${o.area}">
  <div class="tt"><span>${o.title}</span><button class="btn">${o.btn}</button></div>
  <div class="fig" style="margin-top:6px;padding-top:6px"><div class="n ${o.cls || ''}"><b>${o.n}</b><span>${o.unit}</span></div><p>${o.sub}</p></div>
  <div class="mini">${o.rows.map(r => `<div><span class="a">${r[0]}${r[1] ? ` <span class="mute">· ${r[1]}</span>` : ''}</span><span class="q">${r[2]}</span></div>`).join('')}</div>
</div>`;
const RET = [['Kelapa Gading',1860,12,0,24],['PIK',2140,8,0,31],['Senayan',2410,24,0,42],['Kemang',1520,6,0,18],['Bekasi',1690,14,0,22],['Tangerang',1745,9,0,16],['Depok',1380,18,0,27],['Bogor',1210,5,0,12],['Bandung PVJ',1980,0,60,25],['Bandung Dago',1105,7,0,14],['Surabaya Tunjungan',2260,21,0,30],['Surabaya Galaxy',1640,10,0,11],['Bali Beachwalk',1490,12,0,18]];
const DIV = [['Tops',9840,3120],['Bottoms',7120,2210],['Denim',6380,1460],['Outerwear',4210,1090],['Dresses',4050,1380],['Basics',3980,640],['Knitwear',3460,1150],['Accessories',1790,980],['Kids',1260,450]];
const sum = (a, i) => a.reduce((t, r) => t + r[i], 0);
const decide = (o) => `<div class="tile go" style="grid-area:${o.area}">
  <div class="tt"><span>${o.title}</span><button class="btn">${o.btn}</button></div>
  <div class="fig"><div class="n ${o.cls || ''}"><b>${o.n}</b><span>${o.unit}</span></div><p>${o.sub}</p></div>
</div>`;
const fig3 = (title, figs, area) => `<div class="tile go" style="grid-area:${area}"><div class="tt"><span>${title}</span><i data-lucide="arrow-up-right" class="arr"></i></div>
  <div class="pair">${figs.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('')}</div></div>`;
const MD_VIEW = `<div class="bento-m">
  ${decide({area:'new', title:'New articles', btn:'Set up', n:14, unit:'lines', sub:'No article code yet'})}
  ${decide({area:'un', title:'Unallotted', btn:'Allot', n:212, unit:'articles', sub:'Oldest <b>6 d</b>'})}
  ${decide({area:'iss', title:'Allotment issues', btn:'Review', n:4, unit:'allotments', cls:'warnN', sub:'Unfilled <b>3</b> · Overdue <b>1</b>'})}
  ${fig3('Return stock', [[sum(RET,2), 'At stores'], [sum(RET,3), 'On the road'], [sum(RET,4), 'At HO']], 'ret')}
  ${fig3('To stores', [[fmt(1180), 'On the road'], [8, 'Surat jalan']], 'road')}
  ${fig3('Catalogue', [[fmt(12480), 'Articles'], [64, 'Tags']], 'cat')}
  <div class="tile" style="grid-area:div">
    <div class="tt"><span>Stock by division</span><span class="mute" style="font-weight:400">${fmt(sum(DIV,1))} pcs</span></div>
    <div class="dvc">${DIV.map(d => `<div><span>${d[0]}</span><b>${fmt(d[1])}</b><i><em style="width:${d[1] / DIV[0][1] * 100}%"></em></i></div>`).join('')}</div>
  </div>
</div>`;

// ---------- Operations ----------
const OPS = [
  T({title:'Receiving', go:'rcv', w:true, body: pair([4, 'POs to count'], [2, 'Store returns']) }),
  T({title:'Printing', go:'prn', body: pair([fmt(1820), 'Tags'], [3, 'GRN'])}),
  T({title:'Count', go:'cnt', body: num(2, 'tasks', 'Asked by Inventory')}),
  T({title:'To pick', go:'out', body: num(6, 'picklists', '<b>4</b> stores')}),
  T({title:'To pack', go:'out', body: num(4, 'stores', 'Picked, not packed')}),
  T({title:'To dispatch', go:'out', w:true, body: pair([22, 'Cartons'], [1, 'Truck on the yard'])}),
];

// ---------- Home ----------
const HOME = [
  T({title:'Buying', dept:'var(--app-buying)', go:'buying', w:true, body:
    pair([3, 'Over-delivered', 'warn'], [5, 'Short delivered']) + list([['Late','2 POs'],['Return to supplier','4 open']])}),
  T({title:'Merchandise', dept:'var(--app-merchandise)', go:'md', w:true, body:
    pair([14, 'New article lines'], [4, 'Allotment issues', 'warn']) + list([['Unallotted','212 articles'],['Return stock at HO','290 pcs']])}),
  T({title:'Operations', dept:'var(--app-ops)', go:'ops', w:true, body:
    pair([4, 'POs to count'], [6, 'Picklists']) + list([['To dispatch','22 cartons'],['Count tasks','2']])}),
  T({title:'Inventory', dept:'var(--app-inventory)', go:'inv', w:true, body:
    pair([16, 'Exceptions need you', 'warn'], [2, 'Stores not counted 30 d']) + list([['Observed vs book','98.9%'],['Waiting on Ops','5']])}),
];

const VIEWS = {
  buying:{nav:'buying', title:'Overview', fit:true, body:`<div class="bento-b">${BUY_BIG.join('')}${BUY_SMALL.join('')}</div>`},
  md:{nav:'md', title:'Overview', body:MD_VIEW},
  ops:{nav:'ops', title:'Overview', body:`<div class="bento">${OPS.join('')}</div>`},
  home:{nav:null, title:'Home', body:`<div class="bento">${HOME.join('')}</div>`},
};

function renderSide(active) {
  document.getElementById('side').innerHTML = `<div class="brand"><span class="mark">C</span>Central</div>
    <div class="dept ${!active ? 'on' : ''}" data-go="home" style="--c:#f08a24"><i></i>Home</div>` +
    Object.entries(NAV).map(([k, d]) => `<div class="dept ${active === k ? 'on' : ''}" data-go="${k === 'inv' ? 'home' : k}" style="--c:${d.c}"><i></i>${d.name}</div>` +
      (active === k ? `<div class="sub">${d.rows.map(([r, c], i) => `<a class="${i === 0 ? 'on' : ''}">${r}${c ? `<span class="c">${c}</span>` : ''}</a>`).join('')}</div>` : '')).join('');
}
function show(v) {
  const V = VIEWS[v];
  renderSide(V.nav);
  document.getElementById('main').classList.toggle('fit', !!V.fit);
  document.getElementById('main').innerHTML = `<section class="view on"><div class="ph"><h1>${V.title}</h1>${v === 'home' ? '' : '<select class="sel"><option>Today</option><option>This week</option></select>'}</div>${V.body}</section>`;
  document.querySelectorAll('#opts button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  lucide.createIcons();
  try { localStorage.setItem('ov-view', v); } catch (e) {}
}
document.addEventListener('click', e => {
  const o = e.target.closest('#opts button'); if (o) return show(o.dataset.v);
  const g = e.target.closest('[data-go]'); if (g && VIEWS[g.dataset.go]) show(g.dataset.go);
});
let start = 'buying'; try { start = localStorage.getItem('ov-view') || 'buying'; } catch (e) {}
show(start);
</script>
</body>
