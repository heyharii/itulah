<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Allotment ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Hub tokens + sizes measured on the running hub (pos-e2e :5480, 11 Oct 2026):
   board lanes 19rem soft-2 r10, cards white r10 p16 title 17/600, sheet 760 r16 head 72,
   table header 14/500 body, inputs 40, buttons 36 r8. */
:root {
  --ink: #20242c; --text: #394150; --body: #565f6d; --mute: #666f7d; --faint: #89919d;
  --hairline: #e6e6e9; --edge: #dadade; --strong: #c6c6cc; --soft: #f8f8f9; --soft-2: #f0f0f2; --soft-3: #f6f6f7;
  --accent: #2563eb; --accent-hover: #1d4ed8; --tint: #eff5ff; --info-fg: #2c57bf; --info-bg: #ddebfa;
  --bad-fg: #be123c; --bad-bg: #fbeaea; --warn-fg: #a64a08; --warn-bg: #faeacd; --ok-fg: #137a37; --ok-bg: #d9f4d2;
  --rail: #242526; --merch: #e8456b; --ops: #1f9fb4;
  --r-card: 10px; --r-inner: 8px; --r-sheet: 16px;
  --shadow-soft: 0 1px 3px rgba(24, 39, 60, .04);
  --shadow-float: 0 8px 24px rgba(24, 39, 60, .06), 0 24px 64px rgba(24, 39, 60, .12);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --bar-h: 96px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font: 400 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: -0.09px; color: var(--ink); background: #e9e9ec;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
.mono { font-family: var(--mono); font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.75; flex-shrink: 0; }
svg.lucide.s16 { width: 16px; height: 16px; }
.ok { color: var(--ok-fg); } .bad { color: var(--bad-fg); } .warn { color: var(--warn-fg); } .info { color: var(--info-fg); } .mute { color: var(--mute); }

/* ── prototype bar (not part of the design) ─────────────── */
.proto { position: fixed; inset: 0 0 auto 0; z-index: 200; display: flex; flex-direction: column; gap: 6px; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--hairline); }
.proto .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.proto .lbl { font-size: 14px; color: var(--mute); margin-right: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--soft-2); border-radius: 10px; }
.seg button { height: 30px; padding: 0 11px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--body); transition: background-color 150ms ease, color 150ms ease; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(24, 39, 60, .08), 0 0 0 1px var(--hairline); }
.seg button .n { margin-left: 4px; color: var(--accent); }
.acts { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.acts button { height: 30px; padding: 0 10px; border-radius: 7px; font-size: 14px; color: var(--text); border: 1px solid var(--hairline); background: #fff; transition: background-color 120ms ease, transform 160ms var(--ease-out); white-space: nowrap; }
.acts button:hover { background: var(--soft); }
.acts button:active { transform: scale(.97); }
.acts button.md { border-color: #f3c2cf; }
.acts button.fl { border-color: #b9e3ea; }
.acts button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.proto .reset { margin-left: auto; }

/* ── frame: desk = whole window below the bar, phone = iPhone XR 414×896 ─ */
#frame { position: fixed; top: var(--bar-h); left: 0; right: 0; bottom: 0; background: #fff; overflow: hidden; transform: translateZ(0); }
body.phone #frame { left: 50%; right: auto; width: 414px; height: min(896px, calc(100vh - var(--bar-h) - 24px)); top: calc(var(--bar-h) + 12px); bottom: auto; margin-left: -207px; border-radius: 40px; border: 10px solid #1b1c1f; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
#app { position: absolute; inset: 0; overflow: hidden; display: flex; flex-direction: column; }

/* ── hub shell (MD side) ─────────────────────────────────── */
.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 68px 232px minmax(0, 1fr); }
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; }
.rail .logo { width: 28px; height: 28px; border-radius: 8px; background: #fff; color: var(--rail); font-weight: 700; display: grid; place-items: center; margin-bottom: 14px; font-size: 16px; }
.rail .ic { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: #b9bcc2; position: relative; }
.rail .ic.on { background: rgba(255, 255, 255, .1); color: #fff; }
.rail .gap { flex: 1; }
.rail .me { width: 28px; height: 28px; border-radius: 50%; background: #3a3b3d; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 600; margin-top: 6px; }
.dept { background: #fff; border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; }
.dept .head { height: 52px; display: flex; align-items: center; padding: 0 16px; font-weight: 600; }
.dept nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.dept nav a { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; }
.dept nav a.on { background: var(--tint); color: var(--accent); font-weight: 500; }
.dept nav a .n { color: var(--warn-fg); }
.dept .clock { margin-top: auto; border-top: 1px solid var(--hairline); height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 14px; color: var(--text); }
.content { overflow-y: auto; padding: 16px 32px 48px; min-height: 0; }
.page-title { font-size: 15px; font-weight: 600; margin: 0 0 10px; line-height: 22px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 12px 16px; box-shadow: var(--shadow-soft); }
.kpi .l { font-size: 14px; color: var(--body); }
.kpi .v { font-size: 18px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 16px; }
.tabs button { padding: 8px 12px 10px; font-size: 14px; font-weight: 500; color: var(--body); position: relative; }
.tabs button.on { color: var(--ink); }
.tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.tabs button .c { color: var(--mute); font-weight: 400; margin-left: 4px; }
.card { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: hidden; }
table { border-collapse: collapse; width: 100%; }
.dt th { height: 40px; padding: 0 14px; background: #fff; border-bottom: 1px solid var(--hairline); color: var(--body); font-size: 14px; font-weight: 500; text-align: left; white-space: nowrap; }
.dt td { padding: 12px 14px; color: var(--text); border-bottom: 1px solid var(--hairline); vertical-align: middle; }
.dt tbody tr:last-child td { border-bottom: 0; }
.dt tr.click { cursor: pointer; height: 64px; transition: background-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .dt tr.click:hover { background: var(--soft); } }
.dt tfoot td { background: var(--soft); font-weight: 500; color: var(--ink); border-top: 1px solid var(--hairline); border-bottom: 0; }
.r { text-align: right !important; }
.two { display: flex; flex-direction: column; line-height: 20px; gap: 2px; min-width: 0; }
.two .a { color: var(--ink); font-weight: 500; }
.two .b { color: var(--mute); font-size: 14px; }
.zero { color: var(--faint); }

/* buttons */
.btn { height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; border-radius: 8px; font-size: 15px; font-weight: 500; white-space: nowrap; transition: transform 160ms var(--ease-out), background-color 150ms ease, opacity 150ms ease; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.danger { background: var(--bad-fg); color: #fff; }
.btn.soft { background: #fff; border: 1px solid var(--edge); color: var(--ink); box-shadow: var(--shadow-soft); }
.btn.soft:hover { background: var(--soft); }
.btn.ghost { color: var(--ink); }
.btn.ghost:hover { background: var(--soft-2); }
.btn.ghost.red { color: var(--bad-fg); }
.btn.icon { width: 36px; padding: 0; }
.btn.wide { flex: 1; }
.field { height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 8px; font-size: 14px; color: var(--mute); background: #fff; }
.field select { border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--ink); appearance: none; padding-right: 4px; cursor: pointer; }

/* ── Ops board ───────────────────────────────────────────── */
.board-page { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 18px 32px 22px; }
.board-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.board-head .back { height: 32px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px 0 6px; border: 1px solid var(--edge); border-radius: 8px; font-size: 14px; color: var(--text); background: #fff; }
.board-head h1 { font-size: 15px; font-weight: 600; margin: 0; }
.board-head .grow { flex: 1; }
.board-head .search { width: 300px; }
.lanes { flex: 1; min-height: 0; display: flex; gap: 16px; }
.lane { flex: 1 1 0; min-width: 0; max-width: 420px; display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--hairline); background: var(--soft-2); border-radius: var(--r-card); transition: background-color 150ms ease, border-color 150ms ease; }
.lane.drop { background: var(--tint); border-color: var(--accent); }
.lane header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.lane header i.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.lane header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.lane header .count { margin-left: auto; min-width: 24px; height: 22px; padding: 0 7px; border-radius: 6px; background: #fff; border: 1px solid var(--hairline); font-size: 14px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.lane .body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
.lane .body > * { flex-shrink: 0; }
.lane footer { padding: 10px 16px; border-top: 1px solid var(--hairline); color: var(--body); font-size: 14px; font-variant-numeric: tabular-nums; }
.lane .empty { padding: 18px 12px; color: var(--faint); text-align: center; }
.lane.side { flex: 0 0 56px; max-width: 56px; cursor: pointer; align-items: center; }
.lane.side header { flex-direction: column; padding: 16px 0; gap: 10px; }
.lane.side h2 { writing-mode: vertical-rl; }
.lane.side .count { margin: 0; }
.lane.side.open { flex: 0 0 280px; max-width: 280px; cursor: default; align-items: stretch; }
.lane.side.open header { flex-direction: row; padding: 16px 16px 12px; }
.lane.side.open h2 { writing-mode: horizontal-tb; }
.lane.side.open .count { margin-left: auto; }

/* card = one store's work in that lane; the footer is its ONE next action */
.tile { position: relative; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: hidden; text-align: left; width: 100%; transition: border-color 150ms ease, box-shadow 150ms ease; }
@media (hover: hover) and (pointer: fine) { .tile:hover { border-color: var(--edge); box-shadow: 0 2px 8px rgba(24, 39, 60, .08); } }
.tile[draggable="true"] { cursor: grab; }
.tile .main { display: flex; flex-direction: column; gap: 4px; padding: 16px; cursor: pointer; }
.tile .t1 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.tile .nm { min-width: 0; font-size: 17px; font-weight: 600; line-height: 24px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .side { flex-shrink: 0; color: var(--body); font-size: 15px; }
.tile .sub { color: var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .q { font-variant-numeric: tabular-nums; color: var(--body); }
.tile .q b { color: var(--ink); font-weight: 600; }
.tile .q s { color: var(--faint); margin-right: 6px; text-decoration-thickness: 1.5px; }
.tile .q .plus { color: var(--accent); font-weight: 600; margin-left: 6px; }
.tile .main { position: relative; }
.tile .dotnew { position: absolute; left: 4px; top: 25px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.tile .act.owed { background: var(--bad-bg); color: var(--bad-fg); }
@media (hover: hover) and (pointer: fine) { .tile .act.owed:hover { background: #f8dde1; } }
.tile .sub .cx { color: var(--bad-fg); }
.tile .act { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 44px; padding: 0 16px; border-top: 1px solid var(--hairline); font-size: 15px; font-weight: 500; color: var(--ink); width: 100%; text-align: left; transition: background-color 120ms ease; }
@media (hover: hover) and (pointer: fine) { .tile .act:hover { background: var(--soft); } }
.tile .act:active { background: var(--soft-2); }
.tile .act.blue { color: var(--accent); }
.tile .act.red { color: var(--bad-fg); }
.tile .strip { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 16px; color: #fff; font-size: 14px; font-weight: 600; }
.tile .strip.bad { background: var(--bad-fg); }
.tile .strip.warn { background: var(--warn-fg); }
.tile.off .main { background: repeating-linear-gradient(-45deg, #f6f6f7 0 8px, #efeff1 8px 16px); }
.tile.off .main > * { opacity: .55; }
.tile .stamp { position: absolute; right: 16px; top: 44px; transform: rotate(-7deg); border: 2.5px solid var(--bad-fg); color: var(--bad-fg); border-radius: 7px; padding: 0 10px; font-size: 22px; font-weight: 800; letter-spacing: .12em; line-height: 32px; opacity: .85; pointer-events: none; background: rgba(255,255,255,.6); }
.tile .chk { position: absolute; left: 12px; top: 18px; width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
.tile.has-chk .main { padding-left: 42px; }

/* phone board */
.pbar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--hairline); padding-top: 0; flex-shrink: 0; }
.pbar .crumb { font-size: 15px; color: var(--body); }
.pbar .crumb b { color: var(--ink); font-weight: 600; }
.pseg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 3px; margin: 10px 12px 6px; background: var(--soft-2); border-radius: 10px; flex-shrink: 0; }
.pseg button { height: 36px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--body); }
.pseg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(24, 39, 60, .08), 0 0 0 1px var(--hairline); }
.pseg button .c { color: var(--mute); font-weight: 400; margin-left: 3px; }
.pseg.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.pseg.five button { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 18px; padding: 0 2px; }
.pseg.five button .c { margin: 0; }
.plist { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 12px 28px; display: flex; flex-direction: column; gap: 10px; }
.plist > * { flex-shrink: 0; }
.phone .tile .dotnew { left: 5px; }

/* ── sheets / dialogs ───────────────────────────────────── */
.scrim { position: fixed; inset: 0; background: rgba(246, 246, 247, .72); z-index: 40; }
.sheet { position: fixed; top: 20px; right: 20px; bottom: 20px; z-index: 50; width: min(760px, calc(100% - 40px)); background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-sheet); box-shadow: var(--shadow-float); display: flex; flex-direction: column; overflow: hidden; }
.sheet.enter { animation: sheetIn 220ms var(--ease-out); }
.scrim.enter { animation: fadeIn 200ms ease; }
@keyframes fadeIn { from { opacity: 0; } }
.sheet.wide { width: min(1080px, calc(100% - 40px)); }
@keyframes sheetIn { from { opacity: 0; transform: translateX(16px); } }
.phone .sheet { inset: 0; width: auto; border-radius: 0; border: 0; }
.phone .sheet.enter { animation: phoneIn 260ms var(--ease-out); }
@keyframes phoneIn { from { transform: translateY(24px); opacity: 0; } }
.sh-head { display: flex; align-items: flex-start; gap: 16px; padding: 12px 28px; border-bottom: 1px solid var(--hairline); min-height: 72px; flex-shrink: 0; }
.sh-head .t { flex: 1; min-width: 0; padding-top: 4px; }
.sh-head h2 { margin: 0; font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: -0.18px; }
.sh-head .sub { color: var(--body); font-size: 15px; margin-top: 2px; }
.sh-head .x { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); margin-top: 6px; margin-right: -6px; }
.sh-head .x:hover { background: var(--soft-2); }
.phone .sh-head { padding: 10px 16px; min-height: 60px; }
.sh-body { flex: 1; overflow-y: auto; padding: 20px 28px 28px; display: flex; flex-direction: column; gap: 18px; }
.sh-body > * { flex-shrink: 0; }
.phone .sh-body { padding: 16px; }
.sh-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 14px 24px; border-top: 1px solid var(--hairline); flex-shrink: 0; }
.sh-foot .grow { flex: 1; }
.sh-foot .said { color: var(--body); font-variant-numeric: tabular-nums; }
.phone .sh-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.phone .sh-foot .btn { height: 44px; }
.phone .sh-foot .said { flex-basis: 100%; }
.phone .sh-foot .grow { display: none; }
.phone .sh-foot .btn.primary, .phone .sh-foot .btn.danger { flex: 1; }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 24px; }
.facts .l { font-size: 14px; color: var(--body); line-height: 18px; }
.facts .v { font-size: 15px; color: var(--ink); line-height: 22px; margin-top: 2px; }
.phone .facts { grid-template-columns: 1fr 1fr; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-card); background: var(--tint); color: var(--info-fg); }
.banner.bad { background: var(--bad-bg); color: var(--bad-fg); }
.banner.warn { background: var(--warn-bg); color: var(--warn-fg); }
.banner b { font-weight: 600; }
.banner svg { margin-top: 2px; }

.lines { width: 100%; }
.lines th { padding: 0 0 10px; font-size: 14px; font-weight: 500; color: var(--body); text-align: left; white-space: nowrap; }
.lines th + th, .lines td + td { padding-left: 12px; }
.lines td { padding: 12px 0; border-top: 1px solid var(--hairline); vertical-align: middle; font-variant-numeric: tabular-nums; }
.lines .grp td { padding: 16px 0 6px; border-top: 0; font-weight: 600; color: var(--ink); }
.lines .sku { color: var(--ink); line-height: 20px; }
.lines .sku span { display: block; color: var(--mute); font-size: 14px; }
.lines td.hl { color: var(--bad-fg); font-weight: 600; }
.lines tr.dim td { color: var(--faint); }
.phone .lines .hide-ph { display: none; }

.step { display: inline-flex; align-items: center; gap: 6px; }
.step button { width: 36px; height: 36px; border: 1px solid var(--edge); border-radius: 8px; display: grid; place-items: center; color: var(--text); background: #fff; transition: background-color 120ms ease, transform 160ms var(--ease-out); }
.step button:active:not(:disabled) { transform: scale(.94); }
.step button:disabled { opacity: .35; cursor: default; }
.step input { width: 60px; height: 40px; border: 1px solid var(--edge); border-radius: 8px; text-align: center; font-variant-numeric: tabular-nums; outline: none; background: #fff; font-size: 15px; }
.step input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
.step.red input { color: var(--bad-fg); border-color: #f0b4c2; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 36px; padding: 0 14px; border: 1px solid var(--edge); border-radius: 18px; font-weight: 500; color: var(--text); background: #fff; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 160ms var(--ease-out); }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--tint); border-color: var(--accent); color: var(--accent); }
.q-label { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }

.form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.form2 label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500; }
.form2 input { height: 44px; border: 1px solid var(--edge); border-radius: 8px; padding: 0 12px; font-size: 15px; outline: none; }
.form2 input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
.phone .form2 { grid-template-columns: 1fr; }

.pick-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--hairline); border-radius: var(--r-card); }
.pick-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.pick-row .grow { flex: 1; min-width: 0; }
.pick-row.dis { background: var(--soft); }

/* MD matrix */
.mx { border: 1px solid var(--hairline); border-radius: var(--r-card); overflow: auto; }
.mx table { min-width: 100%; }
.mx th { position: sticky; top: 0; z-index: 1; height: 44px; padding: 0 12px; background: var(--soft); border-bottom: 1px solid var(--hairline); color: var(--body); font-size: 14px; font-weight: 500; text-align: right; white-space: nowrap; }
.mx th:first-child { text-align: left; position: sticky; left: 0; z-index: 2; }
.mx td { height: 52px; padding: 0 12px; border-bottom: 1px solid var(--hairline); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.mx td:first-child { text-align: left; position: sticky; left: 0; background: #fff; z-index: 1; }
.mx .sku { line-height: 20px; padding: 6px 0; }
.mx .sku span { display: block; color: var(--mute); font-size: 14px; }
.mx td .lock { display: block; font-size: 14px; color: var(--mute); line-height: 16px; }
.mx td input { width: 64px; height: 36px; border: 1px solid var(--edge); border-radius: 8px; text-align: right; padding: 0 8px; font-variant-numeric: tabular-nums; outline: none; }
.mx td input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
.mx td.changed input { border-color: var(--accent); background: var(--tint); }
.mx tr.stage td { height: 40px; background: var(--soft); color: var(--body); border-bottom: 1px solid var(--hairline); }
.mx tr.stage td:first-child { background: var(--soft); color: var(--body); }
.mx tr.stage.total td { color: var(--ink); font-weight: 600; border-top: 1px solid var(--strong); }
.mx tr.stage.chg td { background: var(--tint); color: var(--info-fg); font-weight: 500; }
.mx tr.stage.chg td:first-child { background: var(--tint); }
.mx tr.stage td.pb { color: var(--warn-fg); }

.dlg-scrim { position: fixed; inset: 0; z-index: 70; background: rgba(246, 246, 247, .6); }
.dlg { position: fixed; z-index: 80; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(500px, calc(100% - 32px)); background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-sheet); box-shadow: var(--shadow-float); display: flex; flex-direction: column; overflow: hidden; }
.dlg.enter { animation: dlgIn 200ms var(--ease-out); }
@keyframes dlgIn { from { opacity: 0; transform: translate(-50%, calc(-50% + 8px)) scale(.985); } }
.dlg h2 { margin: 0; padding: 20px 24px 6px; font-size: 18px; font-weight: 600; }
.dlg .d-body { padding: 8px 24px 16px; display: flex; flex-direction: column; gap: 12px; }
.dlg .d-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 24px 20px; }
.costs { width: 100%; }
.costs td { padding: 11px 0; border-top: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
.costs td + td { text-align: right; }
.costs td.what { color: var(--body); padding-left: 16px; text-align: right; white-space: nowrap; }
.costs tr.amber td:first-child, .costs tr.amber td.what { color: var(--warn-fg); }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

.activity { border-top: 1px solid var(--hairline); padding-top: 14px; }
.activity summary { cursor: pointer; font-weight: 500; color: var(--ink); list-style: none; display: flex; align-items: center; gap: 6px; }
.activity summary::-webkit-details-marker { display: none; }
.activity ol { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.activity li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; color: var(--text); }
.activity li .tm { color: var(--mute); font-variant-numeric: tabular-nums; }
.activity li b { font-weight: 600; color: var(--ink); }

/* toasts */
.toasts { position: fixed; left: 24px; bottom: 24px; z-index: 120; display: flex; flex-direction: column-reverse; gap: 8px; align-items: flex-start; pointer-events: none; width: max-content; max-width: calc(100% - 48px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; background: var(--ink); color: #fff; border-radius: 10px; box-shadow: var(--shadow-float); font-size: 15px; animation: toastIn 200ms var(--ease-out); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
.toast .u { height: 30px; padding: 0 10px; border-radius: 7px; background: rgba(255,255,255,.12); color: #fff; font-weight: 500; }
.toast .u:hover { background: rgba(255,255,255,.2); }
.toast.md { background: #3b1520; }
.toasts.over { left: 50%; transform: translateX(-50%); bottom: 96px; align-items: center; }
.toasts.phone { left: 12px; right: 12px; top: 10px; bottom: auto; width: auto; max-width: none; flex-direction: column; align-items: stretch; }
.toasts.phone .toast { justify-content: space-between; animation-name: toastDown; }
@keyframes toastDown { from { opacity: 0; transform: translateY(-8px); } }

/* status words */
.st-word { font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--hairline); border-radius: 13px; font-size: 14px; color: var(--text); background: #fff; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ── compare + research pages ───────────────────────────── */
.doc { flex: 1; overflow-y: auto; background: var(--soft-3); }
.doc .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 32px 64px; display: flex; flex-direction: column; gap: 20px; }
.doc h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.3px; }
.doc h2 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
.doc h3 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
.doc p { margin: 0; color: var(--text); }
.doc .box { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); padding: 20px 22px; }
.doc .figs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.doc .fig { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 14px 16px; }
.doc .fig .l { font-size: 14px; color: var(--body); }
.doc .fig .v { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.doc .fig .v s { color: var(--faint); font-weight: 500; margin-right: 8px; font-size: 18px; }
.doc table.cmp { width: 100%; border-collapse: collapse; }
.doc table.cmp th { text-align: left; font-size: 14px; font-weight: 500; color: var(--body); padding: 10px 12px; border-bottom: 1px solid var(--hairline); background: var(--soft); vertical-align: bottom; }
.doc table.cmp td { padding: 12px; border-bottom: 1px solid var(--hairline); vertical-align: top; color: var(--text); font-size: 15px; }
.doc table.cmp tr:last-child td { border-bottom: 0; }
.doc table.cmp td:first-child { color: var(--ink); font-weight: 500; }
.doc table.cmp td.new { background: #f5f9ff; color: var(--ink); }
.doc .tag { display: block; font-size: 14px; color: var(--mute); font-weight: 400; margin-top: 2px; }
.doc ul { margin: 6px 0 0; padding-left: 20px; color: var(--text); }
.doc li { margin: 4px 0; }
.doc a { color: var(--accent); text-decoration: none; }
.doc a:hover { text-decoration: underline; }
.doc .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.doc .rule { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hairline); }
.doc .rule:first-of-type { border-top: 0; }
.doc .rule .n { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.doc .try { color: var(--accent); font-weight: 500; }
.phone .doc .wrap { padding: 16px; }
.phone .doc .figs, .phone .doc .cols { grid-template-columns: 1fr; }
.phone .doc table.cmp, .phone .doc table.cmp tbody, .phone .doc table.cmp tr, .phone .doc table.cmp td { display: block; }
.phone .doc table.cmp thead { display: none; }
.phone .doc table.cmp td { border-bottom: 0; padding: 6px 12px; }
.phone .doc table.cmp tr { border-bottom: 1px solid var(--hairline); padding: 8px 0; }


/* tablet frame (iPad landscape) */
body.tablet #frame { left: 50%; right: auto; width: 1024px; height: min(768px, calc(100vh - var(--bar-h) - 24px)); top: calc(var(--bar-h) + 12px); bottom: auto; margin-left: -512px; border-radius: 28px; border: 10px solid #1b1c1f; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
body.tablet .board-page { padding: 14px 16px 16px; }
body.tablet .board-head .search { width: 200px; }
body.tablet .lanes { gap: 10px; }
body.tablet .lane.side.open { flex-basis: 250px; max-width: 250px; }

/* drag and drop */
.tile[data-drag] { touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.tile.lifted { opacity: .35; }
.drag-ghost { position: fixed !important; z-index: 300; pointer-events: none; margin: 0; box-shadow: 0 14px 34px rgba(24, 39, 60, .18), 0 2px 6px rgba(24, 39, 60, .08) !important; border-color: var(--edge) !important; will-change: transform; }
.drag-ghost.back { transition: transform 200ms var(--ease-out), opacity 200ms ease; opacity: 0; }
body.dragging, body.dragging * { cursor: grabbing !important; }
.lane { position: relative; }
.lane.no-drop { opacity: .45; }
.lane.can-drop::after { content: attr(data-hint); position: absolute; left: 8px; right: 8px; bottom: 50px; height: 48px; display: grid; place-items: center; border: 1.5px dashed var(--strong); border-radius: var(--r-card); background: rgba(255, 255, 255, .92); color: var(--body); font-weight: 500; pointer-events: none; }
.lane.side.can-drop::after { left: 4px; right: 4px; bottom: 12px; writing-mode: vertical-rl; height: auto; top: 120px; }
.lane.drop { background: var(--tint); border-color: var(--accent); }
.lane.drop::after { border-color: var(--accent); color: var(--accent); background: #fff; }
.lane .day { padding: 10px 6px 0; font-size: 14px; font-weight: 500; color: var(--body); }
.lane .body .day:first-child { padding-top: 0; }
.lane .tile[data-trip] .main { cursor: pointer; }
.lane .tile.done { background: var(--soft); box-shadow: none; }

/* MD list + delivery sheet */
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
.dt td.dotcell { position: relative; }
.dt .fresh { position: absolute; left: 4px; top: 50%; margin-top: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.facts.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.phone .facts.five { grid-template-columns: 1fr 1fr; }
.form1 label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500; }
.form1 input { height: 44px; border: 1px solid var(--edge); border-radius: 8px; padding: 0 12px; font-size: 15px; outline: none; }
.form1 input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
.dv { border: 1px solid var(--hairline); border-radius: var(--r-card); overflow: hidden; }
.dv table { width: 100%; }
.dv th { height: 40px; padding: 0 12px; background: var(--soft); border-bottom: 1px solid var(--hairline); color: var(--body); font-size: 14px; font-weight: 500; text-align: left; white-space: nowrap; }
.dv td { padding: 10px 12px; border-bottom: 1px solid var(--hairline); color: var(--ink); font-variant-numeric: tabular-nums; vertical-align: middle; }
.dv tbody tr:last-child td { border-bottom: 0; }
.dv tr.srow.on td { background: var(--tint); }
.dv tr.arow td { background: var(--soft); padding-top: 8px; padding-bottom: 8px; color: var(--text); }
.dv tr.arow td.nm2 { padding-left: 52px; }
.dv tfoot td { background: var(--soft-2); font-weight: 600; border-top: 1px solid var(--hairline); border-bottom: 0; }
.dv tfoot tr + tr td { background: var(--soft); font-weight: 500; }
.dv .ck { width: 44px; padding-right: 0; }
.dv .ck input, .pcard input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.dv .sname { display: flex; align-items: center; gap: 6px; }
.dv .exp { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; display: grid; place-items: center; color: var(--mute); }
.dv .exp:hover { background: var(--soft-2); }
.dv input.tot, .pcard input.tot { width: 84px; height: 36px; border: 1px solid var(--edge); border-radius: 8px; text-align: right; padding: 0 8px; font-variant-numeric: tabular-nums; outline: none; font-size: 15px; }
.dv input.tot:focus, .pcard input.tot:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
.dv .lock { font-size: 14px; color: var(--mute); line-height: 18px; }
.pcard { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.pcard.on { background: var(--tint); }
.pcard .pc-top { display: flex; align-items: center; gap: 10px; }
.pcard .pc-top b { font-weight: 600; flex: 1; }
.pcard .pc-edit { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.pcard .pc-edit .lock { display: none; }


/* MD · In progress cards (five views) */
.alist { display: flex; flex-direction: column; gap: 12px; }
.alist.v-rings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.phone .alist.v-rings { grid-template-columns: 1fr; }
.acard { position: relative; background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); padding: 16px 20px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 16px; transition: border-color 150ms ease, box-shadow 150ms ease; }
@media (hover: hover) and (pointer: fine) { .acard:hover { border-color: var(--edge); box-shadow: 0 2px 8px rgba(24, 39, 60, .08); } }
.acard:active { background: var(--soft); }
.acard .dotnew { position: absolute; left: 7px; top: 25px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.acard header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.acard header .a { font-size: 17px; font-weight: 600; line-height: 24px; }
.acard .afig { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.acard .afig span { font-weight: 400; font-size: 14px; }
.phone .acard { padding: 14px 14px 16px; }
.phone .acard header { flex-direction: column; gap: 4px; }
.phone .acard .afig { align-items: flex-start; }
.dt.simple tr.click { height: 56px; }
.phone .kpis { grid-template-columns: 1fr 1fr; }
.phone .toolbar { display: none; }
.fab { position: absolute; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(37, 99, 235, .35); transition: transform 160ms var(--ease-out); }
.fab:active { transform: scale(.94); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--body); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.legend b { color: var(--ink); font-weight: 600; margin-left: 2px; font-variant-numeric: tabular-nums; }
.legend .z, .legend .z b { color: var(--faint); }

/* A · Truck */
.v-truck .road { display: flex; align-items: center; gap: 10px; color: var(--mute); }
.v-truck .track { position: relative; flex: 1; height: 8px; border-radius: 4px; background: var(--soft-2); }
.v-truck .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #b9d6f4; transition: width 900ms cubic-bezier(.77, 0, .175, 1); }
.v-truck .stop { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; border: 2px solid var(--strong); }
.v-truck .stop.on { border-color: #2f86d8; background: #2f86d8; }
.v-truck .truck { position: absolute; top: 50%; z-index: 1; width: 44px; height: 30px; margin: -15px 0 0 -22px; border-radius: 9px; background: var(--ink); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(24, 39, 60, .2); transition: left 900ms cubic-bezier(.77, 0, .175, 1), background-color 200ms ease; }
.v-truck .truck.home { background: var(--ok-fg); }
.v-truck .stops4 { position: relative; height: 44px; margin: 10px 26px 0; }
.v-truck .stops4 div { position: absolute; top: 0; display: flex; flex-direction: column; line-height: 20px; white-space: nowrap; }
.v-truck .stops4 div:nth-child(1) { left: 0; }
.v-truck .stops4 div:nth-child(2) { left: 33.3%; transform: translateX(-50%); align-items: center; }
.v-truck .stops4 div:nth-child(3) { left: 66.6%; transform: translateX(-50%); align-items: center; }
.v-truck .stops4 div:nth-child(4) { right: 0; align-items: flex-end; }
.v-truck .stops4 b { font-weight: 600; font-variant-numeric: tabular-nums; }
.v-truck .stops4 span { font-size: 14px; color: var(--body); }
.v-truck .stops4 .z b, .v-truck .stops4 .z span { color: var(--faint); }
.phone .v-truck .stops4 { height: 64px; margin: 10px 4px 0; }
.phone .v-truck .stops4 div { white-space: normal; max-width: 25%; }
.phone .v-truck .stops4 span { line-height: 18px; }

/* B · Bar */
.v-bar { display: flex; flex-direction: column; gap: 10px; }
.v-bar .bar-top b { font-size: 17px; font-weight: 600; }
.sbar { display: flex; height: 12px; border-radius: 6px; background: #dcdce1; overflow: hidden; }
.sbar i { display: block; height: 100%; transition: width 800ms var(--ease-out); }
.sg-rec { background: #36b827; } .sg-way { background: #2f86d8; } .sg-wh { background: #c9892e; }

/* C · Stores */
.v-dots { display: flex; flex-direction: column; gap: 12px; }
.v-dots .dots { display: flex; flex-wrap: wrap; gap: 10px 16px; }
.v-dots .ds { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; color: var(--body); }
@property --r { syntax: "<number>"; inherits: false; initial-value: 0; }
@property --w { syntax: "<number>"; inherits: false; initial-value: 0; }
@property --h { syntax: "<number>"; inherits: false; initial-value: 0; }
@property --k { syntax: "<number>"; inherits: false; initial-value: 0; }
.v-dots .pie { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: conic-gradient(#36b827 0 calc(var(--r) * 1%), #2f86d8 0 calc(var(--w) * 1%), #c9892e 0 calc(var(--h) * 1%), #dcdce1 0);
  -webkit-mask: radial-gradient(circle, transparent 9px, #000 10px); mask: radial-gradient(circle, transparent 9px, #000 10px);
  transition: --r 900ms var(--ease-out), --w 900ms var(--ease-out), --h 900ms var(--ease-out); }
.v-dots .pie.done { -webkit-mask: none; mask: none; background: #36b827; }
.v-dots .pie.off { -webkit-mask: none; mask: none; background: transparent; border: 2px dashed var(--strong); }
.v-dots .ds { position: relative; }
.v-dots .ds:has(.att)::before { content: ""; position: absolute; top: -4px; left: 50%; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%; border: 2px solid var(--bad-fg); pointer-events: none; }

/* D · Rings */
.v-rings { display: flex; align-items: center; gap: 22px; }
.v-rings .rt { fill: none; stroke: var(--soft-2); stroke-width: 7; }
.v-rings .rv { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 1000ms var(--ease-out); }
.rleg { display: flex; flex-direction: column; gap: 6px; }
.rleg div { display: grid; grid-template-columns: 10px 96px 44px auto; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.rleg i { width: 8px; height: 8px; border-radius: 50%; }
.rleg b { text-align: right; font-weight: 600; }
.rleg .mute { font-size: 14px; }

/* E · Steps */
.v-steps .shead { font-weight: 600; margin-bottom: 12px; }
.v-steps .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.v-steps .step-i { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
.v-steps .sc { position: relative; z-index: 1; width: 32px; height: 32px; margin-bottom: 6px; border-radius: 50%; display: grid; place-items: center; background: #fff; }
.v-steps .sc.full { background: #36b827; color: #fff; }
.v-steps .sc.cur { box-shadow: 0 0 0 4px var(--tint); }
.v-steps .sc .rt { fill: #fff; stroke: var(--soft-2); stroke-width: 4; }
.v-steps .sc .rv { fill: none; stroke: #2f86d8; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 800ms var(--ease-out); }
.v-steps .conn { position: absolute; top: 15px; left: calc(-50% + 20px); right: calc(50% + 20px); height: 3px; border-radius: 2px; background: var(--soft-2); overflow: hidden; }
.v-steps .conn i { display: block; height: 100%; background: #2f86d8; transition: width 800ms var(--ease-out); }
.v-steps .step-i b { font-weight: 500; }
.v-steps .step-i span { font-size: 14px; color: var(--mute); }


/* two rows per allotment: Warehouse + Stores */
.alegend { margin: 0 0 10px; }
.acard .arow { display: grid; grid-template-columns: 96px minmax(0, 1fr) 112px; align-items: center; gap: 16px; padding-top: 14px; border-top: 1px solid var(--hairline); }
.acard .alab { font-size: 14px; font-weight: 500; color: var(--body); }
.acard .asum { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.acard .asum b { font-size: 17px; font-weight: 600; }
.acard .asum span { font-size: 14px; color: var(--mute); }
.phone .acard .arow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "lab sum" "body body"; row-gap: 10px; }
.phone .acard .alab { grid-area: lab; } .phone .acard .asum { grid-area: sum; flex-direction: row; gap: 6px; align-items: baseline; } .phone .acard .abody { grid-area: body; }
.acard .dots { display: flex; flex-wrap: wrap; gap: 10px 16px; }
.acard .ds { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; color: var(--body); }
.acard .pie { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: conic-gradient(#36b827 0 calc(var(--r) * 1%), #2f86d8 0 calc(var(--w) * 1%), #c9892e 0 calc(var(--h) * 1%), #e9c88f 0 calc(var(--k) * 1%), #dcdce1 0);
  -webkit-mask: radial-gradient(circle, transparent 9px, #000 10px); mask: radial-gradient(circle, transparent 9px, #000 10px);
  transition: --r 900ms var(--ease-out), --w 900ms var(--ease-out), --h 900ms var(--ease-out), --k 900ms var(--ease-out); }
.acard .pie.done { -webkit-mask: none; mask: none; background: #36b827; }
.acard .pie.off { -webkit-mask: none; mask: none; background: transparent; border: 2px dashed var(--strong); }
.acard .ds.att::before { content: ""; position: absolute; top: -4px; left: 50%; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%; border: 2px solid var(--bad-fg); pointer-events: none; }
/* A · Steps */
.w-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 560px; }
.w-steps .step-i { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
.w-steps .sc { position: relative; z-index: 1; width: 32px; height: 32px; margin-bottom: 6px; border-radius: 50%; display: grid; place-items: center; background: #fff; }
.w-steps .sc.full { background: #2f86d8; color: #fff; }
.w-steps .sc.cur { box-shadow: 0 0 0 4px var(--tint); }
.w-steps .sc .rt { fill: #fff; stroke: var(--soft-2); stroke-width: 4; }
.w-steps .sc .rv { fill: none; stroke: #2f86d8; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 800ms var(--ease-out); }
.w-steps .conn { position: absolute; top: 15px; left: calc(-50% + 20px); right: calc(50% + 20px); height: 3px; border-radius: 2px; background: var(--soft-2); overflow: hidden; }
.w-steps .conn i { display: block; height: 100%; background: #2f86d8; transition: width 800ms var(--ease-out); }
.w-steps .step-i b { font-weight: 500; }
.w-steps .step-i span { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
/* B · Bar */
.w-bar { display: flex; flex-direction: column; gap: 10px; }
/* C · Truck */
.w-truck { max-width: 640px; }
.w-truck .road { display: flex; align-items: center; gap: 10px; color: var(--mute); }
.w-truck .track { position: relative; flex: 1; height: 8px; border-radius: 4px; background: var(--soft-2); margin-right: 22px; }
.w-truck .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #b9d6f4; transition: width 900ms cubic-bezier(.77, 0, .175, 1); }
.w-truck .stop { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; border: 2px solid var(--strong); }
.w-truck .stop.on { border-color: #2f86d8; background: #2f86d8; }
.w-truck .truck { position: absolute; top: 50%; z-index: 1; width: 44px; height: 30px; margin: -15px 0 0 -22px; border-radius: 9px; background: var(--ink); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(24, 39, 60, .2); transition: left 900ms cubic-bezier(.77, 0, .175, 1), background-color 200ms ease; }
.w-truck .truck.home { background: #2f86d8; }
.w-truck .stops3 { position: relative; height: 44px; margin: 10px 22px 0 26px; }
.w-truck .stops3 div { position: absolute; top: 0; display: flex; flex-direction: column; line-height: 20px; white-space: nowrap; }
.w-truck .stops3 div:nth-child(1) { left: 0; }
.w-truck .stops3 div:nth-child(2) { left: 50%; transform: translateX(-50%); align-items: center; }
.w-truck .stops3 div:nth-child(3) { right: 0; align-items: flex-end; }
.w-truck .stops3 b { font-weight: 600; font-variant-numeric: tabular-nums; }
.w-truck .stops3 span { font-size: 14px; color: var(--body); }
.w-truck .stops3 .z b, .w-truck .stops3 .z span { color: var(--faint); }
/* D · Ring */
.w-ring { display: flex; align-items: center; gap: 20px; }
.w-ring .wring { position: relative; flex-shrink: 0; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(#2f86d8 0 calc(var(--r) * 1%), #c9892e 0 calc(var(--w) * 1%), #e9c88f 0 calc(var(--h) * 1%), #dcdce1 0);
  transition: --r 900ms var(--ease-out), --w 900ms var(--ease-out), --h 900ms var(--ease-out); }
.w-ring .wring::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #fff; }
.w-ring .wring b { position: relative; z-index: 1; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.w-ring .rleg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 20px; }
.w-ring .rleg div { grid-template-columns: 10px 1fr auto; }
/* E · Numbers */
.w-num { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.w-num div { display: flex; flex-direction: column; gap: 2px; }

.w-num .meter { display: block; height: 4px; margin-top: 6px; border-radius: 2px; background: var(--soft-2); overflow: hidden; }
.w-num .meter i { display: block; height: 100%; border-radius: 2px; transition: width 800ms var(--ease-out); }
.phone .w-num { grid-template-columns: 1fr 1fr; }
.phone .w-ring .rleg { grid-template-columns: 1fr; }


/* Pack sheet: cartons one at a time */

.ctn-a { display: flex; gap: 4px; margin-left: -8px; }
.btn.sm { height: 32px; padding: 0 8px; font-size: 14px; }
.photo { display: block; flex: none; background: var(--soft-2); border-radius: var(--r-inner); overflow: hidden; }

.prod { display: flex; flex-direction: column; gap: 2px; }

.prod-n { font-size: 20px; line-height: 26px; font-weight: 600; color: var(--ink); letter-spacing: -0.2px; }
.prod-m { font-size: 14px; line-height: 20px; color: var(--body); }
.cw { display: flex; flex-direction: column; gap: 6px; padding-top: 16px; border-top: 1px solid var(--hairline); }
.cw-head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
.cw-n { font-size: 17px; line-height: 22px; font-weight: 600; color: var(--ink); }
.cw .lines .sku { display: flex; flex-direction: column; }
.cw .lines .sz { font-size: 15px; font-weight: 500; color: var(--ink); }
.paper-print { position: fixed; inset: 0; z-index: 250; display: flex; flex-direction: column; background: rgba(32, 36, 44, .55); }
.paper-bar { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--hairline); }
.paper-bar b { font-weight: 600; }
.paper-bar .grow { flex: 1; }
.paper-pages { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 28px 16px 64px; }
.paper { flex: none; width: 148mm; min-height: 210mm; padding: 9mm; background: #fff; color: #111; font-size: 14px; line-height: 19px; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
.paper .mono { font-size: 13px; }

.p-lines { width: 100%; border-collapse: collapse; }

.p-lines td.box { width: 22mm; border: 1px solid #111; }

.p-note { margin-top: 14px; min-height: 16mm; padding: 6px; border: 1px solid #ccc; color: #555; }

@media screen and (max-width: 640px) { .paper-pages { padding: 16px 8px 48px; } .paper { zoom: .66; } .paper-bar { padding: 8px 12px; } .paper-bar .mute { display: none; } }

.radio.on { border-color: var(--accent); box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 10px var(--accent); }

/* cartons on the Dispatch card + per-carton ticks in Dispatch */

/* Touch layout: content responds to available width, including a split tablet. */
:root { --bar-h: 76px; }
body { background: var(--soft); }

.dv { overflow-x: auto; }

.compact .pcard .pc-top .num { margin-left:auto; }
.compact .sheet { inset:0; width:auto; border-radius:0; }
.compact .sh-head { padding:14px 20px; }
.compact .sh-body { padding:20px; }
.compact .sh-foot { padding:14px 20px max(14px,env(safe-area-inset-bottom)); }
.compact .form1 input { width:100%; }
.compact-search { padding:0 16px 12px; display:flex; gap:8px; }

body.phone #frame { width:min(414px,100%); max-width:100%; left:50%; margin-left:0; transform:translateX(-50%); }
body.tablet #frame { width:min(1024px,100%); max-width:100%; left:50%; margin-left:0; transform:translateX(-50%); }
@media (max-width:1200px) { .shell { grid-template-columns:60px minmax(0,1fr); } .dept { display:none; } .board-page { padding:20px 16px; } .board-head .search { max-width:none; } }
@media (max-width:900px) { .proto { padding:8px 12px; } .proto .brand { margin-right:0; } .proto .brand span { display:none; } .proto .demo-label { display:none; } .proto .seg { flex:1; } .proto .seg button { padding:0 10px; } .flow-page { padding:20px 16px; } }
@media (max-width:600px) { .proto .brand { display:none; } .proto .row { gap:4px; } .proto .seg button { padding:0 8px; } .proto .tools { gap:8px; } .compact .plist { grid-template-columns:1fr; } .compact .facts.five { grid-template-columns:repeat(2,minmax(0,1fr)); } .compact .sh-head,.compact .sh-body,.compact .sh-foot { padding-left:16px; padding-right:16px; } .compact .lines .step { gap:2px; } .compact .lines .step input { width:44px; } .compact .lines .step button { min-width:44px; } .compact .lines th, .compact .lines td { font-size:14px; } .compact .lines th + th, .compact .lines td + td { padding-left:4px; } .compact .lines .mono { overflow-wrap:anywhere; } .compact .open-ctn { padding:10px 8px; } .compact .pseg { margin-left:12px; margin-right:12px; } .compact .pseg button { font-size:14px; } .compact .kpis { gap:8px; } .kpi { padding:12px; } .toolbar .btn { flex:1; } .board-head .attention-toggle { margin-left:0; } .flow-head { flex-wrap:wrap; } .dctns { padding-left:16px; } .flow-step span { padding:4px 8px; } .compact .ctn-head { flex-wrap:wrap; } }
@media print { .proto,#app,.scrim,.sh-foot,.sh-head .x,.toasts { display:none!important; } #frame,#layer,.sheet,.sh-body { position:static!important; width:100%!important; height:auto!important; overflow:visible!important; border:0!important; box-shadow:none!important; } }

/* ═══ Lark look (12 Oct): same screens, same flows — the hub's Lark taste:
   pills, soft filled wells, pastel lane chips, initials tiles, big figures,
   floating white sheets on a tinted shell. Switch: Look · Today | Lark. ═══ */
body[data-look="lark"] {
  --hairline: #eceef1; --edge: #e3e5e9; --soft: #f7f8fa; --soft-2: #f5f6f8; --tint: #eaf0ff;
  --r-card: 14px; --r-sheet: 20px; --well: #f2f3f5; --shell: #eef1f6;
  --ring: 0 0 0 1px rgb(16 24 40 / 5%), 0 1px 2px rgb(16 24 40 / 4%);
}
body[data-look="lark"] .btn { border-radius: 999px; }
body[data-look="lark"] .btn.primary, body[data-look="lark"] .btn.danger { height: 40px; padding: 0 18px; }
body[data-look="lark"] .btn.soft { border: 0; background: var(--well); box-shadow: none; height: 40px; padding: 0 16px; }
body[data-look="lark"] .btn.soft:hover { background: #ebecef; }
body[data-look="lark"] .btn.icon { width: 40px; padding: 0; }
body[data-look="lark"] .btn.soft[aria-pressed="true"] { background: #fff1e3; color: #b4570b; }
body[data-look="lark"] .field { height: 40px; border: 1px solid transparent; border-radius: 999px; background: var(--well); padding: 0 14px; }
body[data-look="lark"] .field input { border: 0; outline: 0; background: none; min-width: 0; flex: 1; font-size: 15px; color: var(--ink); }
body[data-look="lark"] .field:focus-within { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px rgb(37 99 235 / 15%); }
/* the avatar tile */
body[data-look="lark"] .lk-ava { width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; display: grid; place-items: center; background: #edf1f9; color: #3d5aa8; font-size: 14px; font-weight: 600; letter-spacing: 0; }
body[data-look="lark"] .lk-ava svg.lucide { width: 20px; height: 20px; }
body[data-look="lark"] .lk-ava.big { width: 44px; height: 44px; border-radius: 12px; font-size: 15px; }
body[data-look="lark"] .mono.lk-code { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--well); color: var(--body); }

/* ── Ops board ── */
body[data-look="lark"] .board-page { background: #fff; padding: 20px 24px 20px; }
body[data-look="lark"] .board-head { gap: 8px; margin-bottom: 18px; }
body[data-look="lark"] .board-head h1 { font-size: 22px; line-height: 28px; letter-spacing: -0.3px; margin-right: 8px; }
body[data-look="lark"] .lanes { gap: 14px; }
body[data-look="lark"] .lane { border: 0; background: var(--soft-2); border-radius: 18px; }
body[data-look="lark"] .lane.drop { background: var(--tint); box-shadow: inset 0 0 0 1.5px var(--accent); }
body[data-look="lark"] .lane header { gap: 8px; padding: 14px 14px 12px; }
body[data-look="lark"] .lane header i.dot { display: none; }
body[data-look="lark"] .lane header h2 { height: 28px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; font-size: 15px; background: #e8efff; color: #2457d6; }
body[data-look="lark"] .lane[data-lane="pack"] header h2 { background: #fff1e3; color: #b4570b; }
body[data-look="lark"] .lane[data-lane="dispatch"] header h2 { background: #f0ebff; color: #6d3ad6; }
body[data-look="lark"] .lane[data-lane="dispatched"] header h2 { background: #e7f6ec; color: #1f8a3c; }
body[data-look="lark"] .lane header .count { margin-left: 0; min-width: 0; height: auto; padding: 0; border: 0; background: none; color: var(--mute); font-weight: 500; }
body[data-look="lark"] .lane footer { border-top: 0; padding: 4px 16px 14px; color: var(--mute); }
body[data-look="lark"] .lane .body { padding: 0 10px 10px; gap: 10px; }
body[data-look="lark"] .lane.side header h2 { padding: 12px 0; height: auto; }
body[data-look="lark"] .lane.side.open header h2 { padding: 0 12px; height: 28px; }
body[data-look="lark"] .lane.can-drop::after { border-radius: 14px; }
/* store cards */
body[data-look="lark"] .tile { border: 0; border-radius: 14px; box-shadow: var(--ring); }
@media (hover: hover) and (pointer: fine) { body[data-look="lark"] .tile:hover { box-shadow: 0 0 0 1px rgb(16 24 40 / 7%), 0 6px 16px rgb(16 24 40 / 7%); } }
body[data-look="lark"] .tile .main { padding: 14px 14px 12px; gap: 4px; }
body[data-look="lark"] .tile .nm { font-size: 16px; }
body[data-look="lark"] .kbox { border: 0; border-radius: 14px; background: #f3f6ff; }
body[data-look="lark"] .tile .side { font-size: 14px; color: var(--mute); }
body[data-look="lark"] .tile .sub { margin-top: 6px; }
body[data-look="lark"] .tile .q { font-size: 15px; }
body[data-look="lark"] .tile .q b { font-size: 20px; letter-spacing: -0.01em; }
body[data-look="lark"] .tile .dotnew { left: 5px; top: 30px; }
body[data-look="lark"] .tile .act { position: relative; flex-shrink: 0; width: auto; height: 36px; margin: 0; padding: 0 14px; border-top: 0; border-radius: 999px; justify-content: center; gap: 4px; background: var(--tint); color: #1d4fd8; transition: background-color 120ms ease, transform 160ms var(--ease-out); }
body[data-look="lark"] .tile .act::after { content: ""; position: absolute; inset: -4px; }
@media (hover: hover) and (pointer: fine) { body[data-look="lark"] .tile .act:hover { background: #dfe8ff; } }
body[data-look="lark"] .tile .act:active { transform: scale(.97); background: #dfe8ff; }
body[data-look="lark"] .tile .lk-qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-height: 36px; margin-top: 2px; }
body[data-look="lark"] .tile .lk-qrow .q { white-space: nowrap; }
body[data-look="lark"] .tile .lk-qrow .act { margin-left: auto; }
body[data-look="lark"] .compact .tile .lk-qrow .act { padding: 0 14px; }
body[data-look="lark"] .compact .tile .lk-qrow .act svg { display: none; }
body[data-look="lark"] .tile .acts2, body[data-look="lark"] .tile.lk-foot > .acts2 { display: flex; gap: 6px; margin: 0; border-top: 0; }
body[data-look="lark"] .tile.lk-foot > .act, body[data-look="lark"] .tile.lk-foot > .acts2 { align-self: flex-end; margin: 0 12px 12px; }
body[data-look="lark"] .tile .act.owed, body[data-look="lark"] .tile .act.red { background: #fff0f0; color: #c4281c; }
body[data-look="lark"] .tile .act.owed svg, body[data-look="lark"] .tile .act.red svg { color: inherit; }
body[data-look="lark"] .tile .acts2 .act { margin: 0; border-left: 0 !important; }
body[data-look="lark"] .tile .strip { align-self: flex-start; height: 26px; margin: 12px 14px 0; padding: 0 10px; border-radius: 999px; font-weight: 500; }
body[data-look="lark"] .tile .strip.warn { background: #fff1e3; color: #b4570b; }
body[data-look="lark"] .tile .strip.bad { background: #fff0f0; color: #c4281c; }
body[data-look="lark"] .tile .strip + .main { padding-top: 10px; }
body[data-look="lark"] .tile .crows { gap: 6px; margin-top: 10px; border-top: 0; }
body[data-look="lark"] .tile .crow { padding: 0 10px; height: 34px; align-items: center; border-radius: 10px; background: var(--soft); }
body[data-look="lark"] .tile.off .main { background: repeating-linear-gradient(-45deg, #f7f8fa 0 8px, #f1f2f5 8px 16px); }
body[data-look="lark"] .tile .stamp { border-radius: 10px; }
body[data-look="lark"] .lane .tile.done { background: #fafbfc; box-shadow: none; }
body[data-look="lark"] .lane .day { padding: 8px 6px 0; }

/* ── MD shell: tinted rail, the page floats as a white sheet ── */
body[data-look="lark"] .shell { background: var(--shell); }
body[data-look="lark"] .rail { background: transparent; }
body[data-look="lark"] .rail .logo { background: var(--ink); color: #fff; border-radius: 10px; width: 32px; height: 32px; }
body[data-look="lark"] .rail .ic { width: 40px; height: 40px; border-radius: 12px; color: #5b6472; }
body[data-look="lark"] .rail .ic.on { background: #fff; color: var(--accent); box-shadow: 0 1px 2px rgb(16 24 40 / 8%); }
body[data-look="lark"] .rail .me { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(16 24 40 / 8%); }
body[data-look="lark"] .dept { background: transparent; border-right: 0; }
body[data-look="lark"] .dept nav a { height: 38px; border-radius: 10px; font-size: 15px; }
body[data-look="lark"] .dept nav a.on { background: #fff; color: var(--accent); box-shadow: 0 1px 2px rgb(16 24 40 / 6%); }
body[data-look="lark"] .dept .clock { border-top: 0; }
body[data-look="lark"] .shell > .content { margin: 8px 8px 8px 0; border-radius: 20px; background: #fff; box-shadow: 0 0 0 1px rgb(16 24 40 / 4%); padding: 22px 28px 48px; }
body[data-look="lark"] .page-title { font-size: 22px; line-height: 28px; letter-spacing: -0.3px; margin-bottom: 18px; }
body[data-look="lark"] .kpis { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
body[data-look="lark"] .kpi { display: flex; align-items: center; gap: 12px; padding: 14px 24px 14px 14px; border: 0; border-radius: 16px; box-shadow: none; background: #f3f6ff; }
body[data-look="lark"] .kpi .ki { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; background: #fff; box-shadow: 0 1px 2px rgb(16 24 40 / 6%); color: #2457d6; }
body[data-look="lark"] .kpi .ki svg.lucide { width: 20px; height: 20px; }
body[data-look="lark"] .kpi .v { font-size: 20px; line-height: 26px; white-space: nowrap; }
body[data-look="lark"] .kpi:nth-child(2) { background: #fff5ea; } body[data-look="lark"] .kpi:nth-child(2) .ki { color: #c2610c; }
body[data-look="lark"] .kpi:nth-child(3) { background: #f6f3ff; } body[data-look="lark"] .kpi:nth-child(3) .ki { color: #6d3ad6; }
body[data-look="lark"] .kpi:nth-child(4) { background: #f0f8f3; } body[data-look="lark"] .kpi:nth-child(4) .ki { color: #1f8a3c; }
body[data-look="lark"] .tabs { gap: 6px; border-bottom: 0; margin-bottom: 14px; }
body[data-look="lark"] .tabs button { height: 36px; padding: 0 14px; border-radius: 999px; }
body[data-look="lark"] .tabs button.on { background: var(--tint); color: #1d4fd8; }
body[data-look="lark"] .tabs button.on::after { display: none; }
body[data-look="lark"] .tabs button .c { color: inherit; opacity: .7; }
body[data-look="lark"] .toolbar { margin-bottom: 16px; }
body[data-look="lark"] .acard { border: 0; border-radius: 18px; box-shadow: var(--ring); padding: 18px 20px 18px; }
@media (hover: hover) and (pointer: fine) { body[data-look="lark"] .acard:hover { box-shadow: 0 0 0 1px rgb(16 24 40 / 7%), 0 6px 16px rgb(16 24 40 / 7%); } }
body[data-look="lark"] .acard header { align-items: center; }
body[data-look="lark"] .acard .lk-who { display: flex; align-items: center; gap: 12px; min-width: 0; }
body[data-look="lark"] .acard header .a { font-size: 18px; }
body[data-look="lark"] .acard header .b { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; }
body[data-look="lark"] .acard .afig { font-size: 22px; letter-spacing: -0.02em; }
body[data-look="lark"] .acard .arow { border-top: 0; padding: 14px 16px; border-radius: 14px; background: var(--soft); }
body[data-look="lark"] .acard .arow + .arow { margin-top: -6px; }
body[data-look="lark"] .card { border: 0; box-shadow: var(--ring); border-radius: 16px; }
body[data-look="lark"] .dt th { background: var(--soft-2); border-bottom: 0; }
body[data-look="lark"] .dt td { border-bottom-color: var(--hairline); }
body[data-look="lark"] .legend { margin-bottom: 4px; }

/* ── Sheets and dialogs ── */
body[data-look="lark"] .scrim, body[data-look="lark"] .dlg-scrim { background: rgb(20 24 33 / 18%); }
body[data-look="lark"] .sheet { top: 8px; right: 8px; bottom: 8px; width: min(760px, calc(100% - 16px)); border: 0; border-radius: 20px; }
body[data-look="lark"] .sheet.wide { width: min(1080px, calc(100% - 16px)); }
body[data-look="lark"] .sh-head { align-items: center; gap: 14px; padding: 18px 24px 10px; border-bottom: 0; min-height: 0; }
body[data-look="lark"] .sh-head .t { padding-top: 0; }
body[data-look="lark"] .sh-head h2 { font-size: 20px; line-height: 26px; }
body[data-look="lark"] .sh-head .sub { margin-top: 2px; }
body[data-look="lark"] .sh-head .x { margin: 0 -4px 0 0; width: 36px; height: 36px; border-radius: 999px; background: var(--well); color: var(--body); }
body[data-look="lark"] .sh-body { padding: 14px 24px 24px; }
body[data-look="lark"] .sh-foot { border-top: 1px solid var(--hairline); padding: 14px 24px; }
body[data-look="lark"] .sh-foot .btn.soft, body[data-look="lark"] .d-foot .btn.soft { background: #fff; box-shadow: inset 0 0 0 1px var(--edge); }
body[data-look="lark"] .facts .l { color: var(--mute); }
body[data-look="lark"] .banner { border-radius: 14px; padding: 12px 16px; }
body[data-look="lark"] .lines th { height: 40px; padding: 0 0 0 12px; background: var(--soft-2); }
body[data-look="lark"] .lines th:first-child { padding-left: 14px; border-radius: 12px 0 0 12px; }
body[data-look="lark"] .lines th:last-child { padding-right: 14px; border-radius: 0 12px 12px 0; }
body[data-look="lark"] .lines td:first-child { padding-left: 14px; }
body[data-look="lark"] .lines td:last-child { padding-right: 14px; }
body[data-look="lark"] .lines thead + tbody tr:first-child td { border-top: 0; }
body[data-look="lark"] .lines .grp td { padding-left: 14px; }
body[data-look="lark"] .step button { border: 0; border-radius: 999px; background: var(--well); width: 38px; height: 38px; }
body[data-look="lark"] .step input, body[data-look="lark"] .dv input.tot, body[data-look="lark"] .pcard input.tot, body[data-look="lark"] .mx td input { border: 1px solid transparent; border-radius: 10px; background: var(--well); }
body[data-look="lark"] .step input:focus, body[data-look="lark"] .dv input.tot:focus, body[data-look="lark"] .mx td input:focus { background: #fff; border-color: var(--accent); }
body[data-look="lark"] .step.red input { color: #c4281c; background: #fff0f0; border-color: transparent; }
body[data-look="lark"] .form1 input, body[data-look="lark"] .form2 input { border: 1px solid transparent; border-radius: 10px; background: var(--well); }

body[data-look="lark"] .chip { border: 0; background: var(--well); }
body[data-look="lark"] .chip.on { background: var(--tint); color: #1d4fd8; box-shadow: inset 0 0 0 1.5px var(--accent); }
body[data-look="lark"] .pick-row { border: 0; border-radius: 14px; background: var(--soft); }
body[data-look="lark"] .ctn { border: 0; border-radius: 14px; background: var(--soft); }
body[data-look="lark"] .open-ctn { border-radius: 14px; }
body[data-look="lark"] .dv, body[data-look="lark"] .mx { border: 0; border-radius: 0; }
body[data-look="lark"] .dv th, body[data-look="lark"] .mx th { background: var(--soft-2); border-bottom: 0; }
body[data-look="lark"] .dv th:first-child, body[data-look="lark"] .mx th:first-child { border-radius: 12px 0 0 12px; }
body[data-look="lark"] .dv th:last-child, body[data-look="lark"] .mx th:last-child { border-radius: 0 12px 12px 0; }
body[data-look="lark"] .dv tr.srow.on td { background: #f3f6ff; }
body[data-look="lark"] .dv tfoot td { background: var(--soft); border-top: 0; }
body[data-look="lark"] .dlg { border: 0; border-radius: 20px; }
body[data-look="lark"] .toast { border-radius: 999px; padding: 8px 8px 8px 18px; }
body[data-look="lark"] .toast .u { border-radius: 999px; height: 32px; padding: 0 12px; }
body[data-look="lark"] .pill { border: 0; background: var(--well); }
/* phone */
body[data-look="lark"] .pbar { border-bottom: 0; }
body[data-look="lark"] .pseg { border-radius: 14px; background: var(--well); }
body[data-look="lark"] .pseg button { border-radius: 11px; padding: 0 4px; }
body[data-look="lark"] .pseg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(16 24 40 / 8%); }
body[data-look="lark"] .plist { background: #fff; }
body[data-look="lark"] .fab { box-shadow: 0 8px 20px rgb(37 99 235 / 30%); }

/* ═══ Quiet (12 Oct, Hari: "bagusnya lark di less line, jeleknya di pemilihan warna dan radiusnya
   terlalu ketara"): Lark's line-less surfaces, with colour only where it means something
   (lane dot grey→amber→blue→green, Short pick amber, Put back red, one blue primary) and the
   hub's own radii (cards 10, buttons and inputs 8, sheets 16). ═══ */
body[data-look="lark"][data-tone="quiet"] { --r-card: 10px; --r-sheet: 16px; --tint: #eff3fb; --shell: #f2f3f5; }
body[data-look="lark"][data-tone="quiet"] .btn { border-radius: 8px; }
body[data-look="lark"][data-tone="quiet"] .btn.primary, body[data-look="lark"][data-tone="quiet"] .btn.danger, body[data-look="lark"][data-tone="quiet"] .btn.soft { height: 38px; padding: 0 14px; }
body[data-look="lark"][data-tone="quiet"] .btn.icon { width: 38px; padding: 0; }
body[data-look="lark"][data-tone="quiet"] .btn.soft[aria-pressed="true"] { background: var(--ink); color: #fff; }
body[data-look="lark"][data-tone="quiet"] .field { height: 38px; border-radius: 8px; }
body[data-look="lark"][data-tone="quiet"] .lk-ava { border-radius: 8px; background: var(--well); color: var(--text); }
/* board */
body[data-look="lark"][data-tone="quiet"] .lane { border-radius: 12px; }
body[data-look="lark"][data-tone="quiet"] .lane header { padding: 14px 16px 12px; }
body[data-look="lark"][data-tone="quiet"] .lane header i.dot { display: block; }
body[data-look="lark"][data-tone="quiet"] .lane header h2, body[data-look="lark"][data-tone="quiet"] .lane[data-lane] header h2 { height: auto; padding: 0; background: none; color: var(--ink); }
body[data-look="lark"][data-tone="quiet"] .lane[data-lane="dispatched"] header i.dot { background: #2f9e57 !important; }
body[data-look="lark"][data-tone="quiet"] .lane.drop { box-shadow: inset 0 0 0 1.5px var(--accent); }
body[data-look="lark"][data-tone="quiet"] .lane.can-drop::after { border-radius: 10px; }
body[data-look="lark"][data-tone="quiet"] .tile { border-radius: 10px; }
/* Apple's small button (App Store "Get"): a 30px capsule, grey fill, bold tint text, no arrow;
   the touch area stays 44px through ::after */
body[data-look="lark"][data-tone="quiet"] .tile .act { height: 30px; min-width: 64px; padding: 0 14px; border-radius: 999px; background: #f0f1f4; color: var(--accent); font-size: 15px; font-weight: 600; letter-spacing: 0; }
body[data-look="lark"][data-tone="quiet"] .tile .act svg { display: none; }

  { id: "D010", no: "ALT-00000042", po: "PO-041026-010", supplier: "Indorama, PT", alts: ["A415", "A420"], created: "10 Oct 2026" },
  { id: "D002", no: "ALT-00000038", po: "PO-270926-002", supplier: "Sritex, PT", alts: ["A405"], created: "05 Oct 2026" },

]

function skusOf(a) {

const SKU = {}

let S

  box("C003", of("A405", "C003").map((l) => ({ alt: l.alt, sku: l.sku, qty: 4 })), "TRP-0000")
  // Kemeja Oxford: C001 to pick · C002 picked · C003 packed · C004 dispatched this morning

  add("A420", "C003", 8); add("A420", "C005", 8)
  box("C005", of("A420", "C005").map((l) => ({ alt: l.alt, sku: l.sku, qty: 8 })), "TRP-0001")

/* ═════════ derived numbers ═════════
   MD owns the plan (target). The floor owns where pieces are.
   The app turns the difference into work: Pick more, or Put back. ("sent" = dispatched) */
const tripOf = (id) => S.trips.find((t) => t.id === id)
function inCartons(l, sent, recv) {
  let q = 0
  for (const c of S.cartons) {
    if (c.store !== l.store || c.sent !== sent) continue
    if (recv && !cartonHanded(c)) continue
    for (const i of c.items) if (i.alt === l.alt && i.sku === l.sku) q += i.qty
  }
  return q
}
function receivedOf(l) {
  let q = 0
  for (const t of S.trips) {
    const d = sum(S.cartons.filter(c => c.trip === t.id && c.store === l.store && cartonHanded(c)).flatMap(c => c.items.filter(i => i.alt === l.alt && i.sku === l.sku).map(i => i.qty)))

}

}

function agg(ls) {
  const a = { target: 0, sent: 0, packed: 0, picked: 0, want: 0, held: 0, excess: 0, pbPicked: 0, pbPacked: 0, toPick: 0, received: 0, onway: 0, issue: 0 }

function spread(ls, total, cur) {
  const floors = ls.map((l) => calc(l).sent), curs = ls.map(cur)
  const minT = sum(floors)
  if (total <= minT) return new Map(ls.map((l, i) => [l, floors[i]]))

  if (!sum(w)) w = curs.map((c) => c || 1)

  const order = raw.map((r, i) => [r - base[i], i]).sort((a, b) => b[0] - a[0])

/* D · Ring: one ring for the DC, split dispatched / packed / picked */

/* E · Numbers: what is waiting at each step, with a thin meter under each figure */
function whNumbers(d, s) {

/* Pick: one picklist per allotment and store. What is picked lands on that store's pile for Pack.
   The picker finds goods by look: the article on top, then one block per colourway with its picture and its sizes. */
function pickSheet(sh) {
  const a = AL[sh.alt], d = delOf(sh.alt), ls = linesOf(sh.alt, sh.store)
  const t = (sku) => pickOf(sh.alt, sh.store, sku)
  const skus = skusOf(a).filter((k) => ls.some((l) => l.sku === k.sku))
  const blocked = ls.filter((l) => shortBlocked(l) && calc(l).toPick > 0)

  const got = sum(skus.map((k) => Math.min(sh.draft[k.sku] ?? t(k.sku), t(k.sku))))

  const prod = `<div class="prod"><div class="prod-n">${a.article}</div><div class="prod-m"><span class="mono">${a.code}</span> · ${a.division}</div><div class="prod-m">${d.supplier} · <span class="mono">${d.po}</span></div></div>`

  if (!all) {
    const z = S.zeroed[key(sh.alt, sh.store)]
    return { title, sub, side, body: banner + inv + prod, foot: z ? `<span class="grow"></span><button class="btn primary" data-do="ok-sheet">OK</button>` : `<span class="said">${blocked.length ? "Waiting for Inventory" : "Nothing left to pick"}</span><span class="grow"></span><button class="btn soft" data-do="close">Close</button>` }
  }
  const row = (k) => {
    const n = t(k.sku), v = Math.min(sh.draft[k.sku] ?? n, n), b = sh.base ? sh.base[k.sku] : n
    const was = b != null && b !== n ? `<s class="mute" style="margin-right:6px">${b}</s>` : ""
    const l = ls.find((x) => x.sku === k.sku)
    const sht = l.short && !shortBlocked(l) && calc(l).toPick > 0 ? `<div class="warn" style="font-size:14px">Short ${Math.min(l.short.qty, calc(l).toPick)} · ${l.short.reason}</div>` : ""
    const cell = `<div class="sku"><span class="sz">${k.size}</span><span class="mono">${k.sku}</span></div>${sht}`
    if (!n) return `<tr class="dim"><td>${cell}</td><td class="r">${was}0</td><td class="r">—</td></tr>`
    return `<tr><td>${cell}</td><td class="r">${was}${n}</td><td class="r">${stepper(k.sku, v, 0, n)}</td></tr>`
  }
  const colourways = [...new Set(shown.map((k) => k.colour))].map((c) => {
    const ks = shown.filter((k) => k.colour === c), n = sum(ks.map((k) => t(k.sku)))
    return `<section class="cw">
      <div class="cw-head">${photo(sh.alt, c)}<div><div class="cw-n">${c}</div><div class="prod-m">${plural(ks.length, "size", "sizes")} · ${pcs(n)}</div></div></div>

    </section>`
  }).join("")
  const short = all - got, shortMode = sh.pickMode === "short"
  const printBtn = `<button class="btn ghost" data-do="pick-print">${ic("printer", "s16")}Print</button>`
  const body = `${banner}${inv}${prod}${colourways}
    ${short ? `<div class="seg"><button data-extra="pick-partial" aria-pressed="${!shortMode}">Continue later</button><button data-extra="pick-short" aria-pressed="${shortMode}">Cannot pick the rest</button></div>` : ""}
    ${short && shortMode ? `<div><div class="q-label">Why ${short} fewer?</div><div class="chips">${REASONS.map((r) => `<button class="chip${sh.reason === r ? " on" : ""}" data-reason="${r}">${r}</button>`).join("")}</div></div>` : ""}`
  const foot = short
    ? `<span class="said">${pcs(got)} picked · ${pcs(short)} ${shortMode ? "short" : "left to pick"}</span><span class="grow"></span>${printBtn}<button class="btn primary" data-do="pick-submit" ${shortMode ? (!sh.reason ? "disabled" : "") : !got ? "disabled" : ""}>Save pick</button>`
    : `<span class="said">${pcs(got)}</span><span class="grow"></span>${printBtn}<button class="btn primary" data-do="pick-submit">Save pick</button>`
  return { title, sub, side, body, foot }
}
