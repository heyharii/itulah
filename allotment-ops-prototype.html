/* Pack: the store's picked pile goes into koli the packer adds by hand (koli differ in size).
   One koli is being filled (the ticked one); each koli is packed on its own and prints its label; the rest can wait.
   Open koli are kept per store until packed, like boxes left open on the table. */
const packLeft = (l) => { const c = calc(l); return Math.max(0, c.picked - c.pbPicked) }
const kid = (l) => l.alt + "|" + l.sku
const kLine = (store, id) => { const [a, sku] = id.split("|"); return S.lines.find((l) => l.alt === a && l.sku === sku && l.store === store) }
const packLines = (store) => S.lines.filter((l) => l.store === store && packLeft(l) > 0)
const koliQty = (k) => sum(Object.values(k.items))
function nextKoliNo(store) { const d = (S.packDraft ||= {})[store]; return Math.max(0, ...cartonsOf(store).map((c) => c.no || 0), ...(d ? d.koli.map((k) => k.no) : [])) + 1 }
function koliDraft(store) {
  const d = ((S.packDraft ||= {})[store] ||= { koli: [], active: null })
  const left = new Map(packLines(store).map((l) => [kid(l), packLeft(l)]))
  // pieces that left the pile (put back, MD, picked elsewhere) come out of the newest koli first
  for (const k of d.koli) for (const id in k.items) if (!left.has(id) || !k.items[id]) delete k.items[id]
  for (const [id, n] of left) {
    let have = sum(d.koli.map((k) => k.items[id] || 0))
    for (let i = d.koli.length - 1; i >= 0 && have > n; i--) { const k = d.koli[i], take = Math.min(k.items[id] || 0, have - n); k.items[id] -= take; have -= take; if (!k.items[id]) delete k.items[id] }
  }
  if (!left.size) { d.koli = []; d.active = null }
  if (!d.koli.some((k) => k.no === d.active)) d.active = d.koli.at(-1)?.no ?? null
  return d
}
function pileOf(store, d = koliDraft(store)) { return packLines(store).map((l) => ({ id: kid(l), n: packLeft(l) - sum(d.koli.map((k) => k.items[kid(l)] || 0)) })).filter((x) => x.n > 0) }
// opening Pack with no koli open: Koli N starts with everything left — one koli is the usual case
function startKoli(store) {
  const d = koliDraft(store), pile = pileOf(store, d)
  if (d.koli.length || !pile.length) return
  d.koli.push({ no: nextKoliNo(store), items: Object.fromEntries(pile.map((p) => [p.id, p.n])) })
  d.active = d.koli.at(-1).no
}
function addKoli(store) { const d = koliDraft(store), no = nextKoliNo(store); d.koli.push({ no, items: {} }); d.active = no }
function moveToKoli(store, id, from) {
  const d = koliDraft(store), to = d.koli.find((k) => k.no === d.active)
  if (!to) return
  let n
  if (from === "pile") n = pileOf(store, d).find((p) => p.id === id)?.n || 0

}
function moveAllToKoli(store) { for (const p of pileOf(store)) moveToKoli(store, p.id, "pile") }
function skuShort(sku) { const k = SKU[sku]; return `${k.colour} · ${k.size}` }
function cartonContents(items) {
  const by = {}

  return Object.entries(by).map(([a, xs]) => `<span class="ca">${AL[a].article}</span> ${xs.join(" · ")}`).join("<br>")
}
function cartonRow(b, n, actions = true) {

    return `<tr><td>${skuCell(sku)}</td><td class="r"><span class="kmove"><b class="num">${n}</b>${act ? `<button class="btn soft sm" data-do="koli-move" data-id="${id}" data-from="${from}" aria-label="Move to koli ${act.no}">${ic("arrow-right", "s16")}Koli ${act.no}</button>` : ""}</span></td></tr>`

}
function packSheet(sh) {

  const boxes = cartonsOf(sh.store)
  const owed = sum(ls.map((l) => calc(l).pbPicked))
  const alts = [...new Set([...ls.map((l) => l.alt), ...boxes.flatMap((b) => b.items.map((i) => i.alt))])]
  const banners = [...new Set(ls.filter((l) => calc(l).pbPicked).map((l) => l.alt))].map((a) => changeBanner(a, sh.store)).join("")
  const pile = pileOf(sh.store, d), pileN = sum(pile.map((p) => p.n))
  const act = d.koli.find((k) => k.no === d.active)

      <table class="lines"><tbody>${koliRows(sh.store, pile.map((p) => [p.id, p.n]), "move", "pile", act)}</tbody></table></section>` : ""
  const koliHtml = d.koli.map((k) => {
    const on = k === act, n = koliQty(k), ents = Object.entries(k.items).filter(([, q]) => q > 0)
    return `<section class="koli${on ? " on" : ""}">
      <div class="ctn-head" ${on ? "" : `data-do="koli-pick" data-koli="${k.no}" role="button" tabindex="0"`}><i class="radio${on ? " on" : ""}" aria-hidden="true"></i><b>Koli ${k.no}</b><span class="num mute">${pcs(n)}</span><span class="grow"></span>${n ? "" : `<button class="btn ghost sm" data-do="koli-remove" data-koli="${k.no}">Remove</button>`}</div>

/* Put back from koli (MD lowered a store whose pieces are already packed) */
function takeoutPlan(store) {
  const plan = []
  for (const l of S.lines.filter((x) => x.store === store)) {
    let need = calc(l).pbPacked
    if (!need) continue
    for (const c of cartonsOf(store).slice().reverse()) {
      const it = c.items.find((i) => i.alt === l.alt && i.sku === l.sku && i.qty > 0)
      if (!it || !need) continue
      const q = Math.min(it.qty, need); need -= q
      plan.push({ carton: c.id, alt: l.alt, sku: l.sku, inBox: it.qty, take: q })
    }
  }
  return plan
}
function putbackSheet(sh) {
  const ls = S.lines.filter((l) => l.store === sh.store && l.picked > 0)
  const plan = takeoutPlan(sh.store)
  const alts = [...new Set([...ls.filter((l) => calc(l).pbPicked).map((l) => l.alt), ...plan.map((p) => p.alt)])]
  const pv = (l) => Math.min(sh.q[l.sku] ?? calc(l).pbPicked, l.picked)
  const picked = ls.length ? `<div><div class="q-label">Picked</div><table class="lines"><thead><tr><th>Article</th><th class="r">Picked</th><th class="r">Put back</th></tr></thead><tbody>
    ${[...new Set(ls.map((l) => l.alt))].map((a) => `<tr class="grp"><td colspan="3">${AL[a].article}</td></tr>` + ls.filter((l) => l.alt === a).map((l) => `<tr><td>${skuCell(l.sku)}</td><td class="r">${l.picked}</td><td class="r">${stepper("pb:" + l.sku, pv(l), 0, l.picked, pv(l) > 0)}</td></tr>`).join("")).join("")}
    </tbody></table></div>` : ""
  const boxes = [...new Set(plan.map((p) => p.carton))]
  const cartons = plan.length ? `<div><div class="q-label">In koli</div><table class="lines"><thead><tr><th>Article</th><th class="r">In koli</th><th class="r">Take out</th></tr></thead><tbody>
    ${boxes.map((b) => { const ps = plan.filter((p) => p.carton === b), box = S.cartons.find((c) => c.id === b), inBox = sum(box.items.map((i) => i.qty)), take = sum(ps.map((p) => returnTake(sh,p))); return `<tr class="grp"><td colspan="3"><span class="mono">${b}</span> <span class="mute" style="font-weight:400">· take out ${take} of ${inBox}${take === inBox ? " · koli emptied" : ""}</span></td></tr>` + ps.map((p) => `<tr><td>${AL[p.alt].article} · ${skuCell(p.sku)}</td><td class="r">${p.inBox}</td><td class="r">${stepper("ctn:" + p.carton + ":" + p.sku, returnTake(sh,p), 0, p.take, true)}</td></tr>`).join("") }).join("")}
    </tbody></table></div>` : ""
  const n = sum(ls.map(pv)) + sum(plan.map((p) => returnTake(sh,p)))
  return { title: `Put back · ${stName(sh.store)}`, sub: altNames(alts.length ? alts : [...new Set(ls.map((l) => l.alt))]), body: alts.map((a) => changeBanner(a, sh.store)).join("") + picked + cartons,
    foot: `<span class="said">${boxes.length ? `${plural(boxes.length, "label", "labels")} to reprint` : "Back to stock"}</span><span class="grow"></span><button class="btn primary" data-do="putback-submit" ${n ? "" : "disabled"}>Put back ${n}</button>` }
}

/* Store in the Dispatch lane: its koli, each with what it holds; Unpack is the way back */
function storeSheet(sh) {
  const cs = cartonsOf(sh.store)

    foot: `<span class="grow"></span>${pb ? `<button class="btn ${freeCartons(sh.store).length ? "soft red-t" : "primary"}" data-do="takeout">Put back ${pb}</button>` : ""}${freeCartons(sh.store).length ? `<button class="btn primary" data-do="dispatch">Dispatch</button>` : pb ? "" : `<button class="btn soft" data-do="close">Close</button>`}`,
  }

/* Dispatch: the stores for one trip, every free koli ticked; untick a koli to leave it for the next trip; a koli owing a put back waits.
   Trip data is plain text (own truck, courier, cargo…) */
const ctnOn = (sh, id) => sh.ctn[id] !== false

/* A trip in the Dispatched history: read only — after dispatch nothing changes */

/* MD: one allotment (delivery) — stores first; articles only when a store is opened; sizes never */
function dlvSheet(sh) {

  const ls = (store, alt) => all.filter((l) => l.store === store && (!alt || l.alt === alt))

  const note = (sl) => { const g = agg(sl); return [dlvNotes(sl), g.sent && g.received === g.sent && !g.want && !g.held ? `<span class="ok">Received</span>` : "", cancelledNote(sl)].filter(Boolean).join(" · ") }

  const ticks = open && !sh.edit

    const rows = stores.map((s) => {

        <td><div class="sname"><button class="exp" data-exp="${s}" aria-label="Articles">${ic(ex ? "chevron-down" : "chevron-right", "s16")}</button><div class="two"><span class="a">${stName(s)}</span>${nt ? `<span class="b">${nt}</span>` : ""}</div></div></td>
        <td class="r">${sh.edit ? totIn("s|" + s, sl) : n(g.target)}</td>${sh.edit ? `<td class="r">${chg(prev.byStore[s])}</td>` : ""}
        <td class="r">${n(g.toPick)}</td><td class="r">${n(g.held)}</td><td class="r">${n(g.sent)}</td><td class="r">${n(g.received)}</td></tr>`
      if (ex) html += alts.map((a) => { const al = ls(s, a), ga = agg(al); return `<tr class="arow">${ticks ? `<td class="ck"></td>` : ""}<td class="nm2"><div class="two"><span>${AL[a].article}</span><span class="b mono">${AL[a].code}</span></div></td><td class="r">${sh.edit ? totIn("a|" + a + "|" + s, al) : n(ga.target)}</td>${sh.edit ? `<td class="r">${chg(prev.byArt[a + "|" + s])}</td>` : ""}<td class="r">${n(ga.toPick)}</td><td class="r">${n(ga.held)}</td><td class="r">${n(ga.sent)}</td><td class="r">${n(ga.received)}</td></tr>` }).join("")
      return html

  const pill = state === "cancelled" ? `<span class="pill bad"><i></i>Cancelled</span>` : state === "completed" ? `<span class="pill ok"><i></i>Completed</span>` : `<span class="pill info"><i></i>In progress</span>`
  const sub = `<span class="mono">${d.no}</span> · <span class="mono">${d.po}</span> · ${plural(d.alts.length, "article", "articles")} · ${d.created} · ${MD} &nbsp;${pill}`
  const sel = stores.filter((s) => sh.sel[s])
  const rest = agg(sel.length ? all.filter((l) => sel.includes(l.store)) : all).sent > 0

  if (!open) foot = `<span class="said">${g0.excess ? `<span class="warn">Warehouse puts back ${g0.excess}</span>` : ""}</span><span class="grow"></span><button class="btn soft" data-do="close">Close</button>`
  else if (sh.edit) foot = `<span class="said">${prev.text || "No change"}</span><span class="grow"></span><button class="btn ghost" data-do="md-discard">Discard</button><button class="btn primary" data-do="md-save" ${prev.any ? "" : "disabled"}>Save</button>`
  else foot = `<button class="btn ghost red" data-do="md-cancel">${cancelLabel}</button><span class="grow"></span><button class="btn primary" data-do="md-edit">Edit</button>`
  return { title: d.supplier, sub, body: facts + table + activity, foot, wide: true }
}
function dlvPreview(sh) {
  const byStore = {}, byArt = {}
  let add = 0, put = 0, less = 0, any = false
  if (!sh.edit) return { byStore, byArt, text: "", any, put }
  for (const l of dlvLines(DL[sh.dlv])) {
    const nv = sh.draft[l.sku + "|" + l.store]
    if (nv == null || nv === l.target) continue
    any = true
    const c = calc(l), v = Math.max(nv, c.sent)
    const want = v - c.sent, toPick = Math.max(0, want - c.held), excess = Math.max(0, c.held - want)
    const dp = Math.max(0, excess - c.excess)
    for (const [m, k] of [[byStore, l.store], [byArt, l.alt + "|" + l.store]]) { const b = (m[k] ||= { delta: 0, put: 0 }); b.delta += v - l.target; b.put += dp }
    add += Math.max(0, toPick - c.toPick); put += dp; less += Math.min(0, v - l.target)
  }
  const parts = []
  if (add) parts.push(`+${add} to pick`)
  if (less) parts.push(`${-less} fewer`)
  if (put) parts.push(`<span class="warn">${put} put back by the warehouse</span>`)
  return { byStore, byArt, text: parts.join(" · "), any, put }
}

const NEW_SPLIT = { C001: 0.25, C002: 1 / 6, C003: 1 / 6, C004: 1 / 12, C005: 1 / 6, C006: 1 / 6 }

/* ═════════ actions ═════════ */
let toastSeq = 0
const toasts = []
let QUIET = false
function toast(text, { undo, md } = {}) {
  if (QUIET) return
  const id = ++toastSeq
  toasts.push({ id, text, undo, expected: undo ? snap() : null, md })
  if (toasts.length > 3) toasts.shift()
  drawToasts()
  setTimeout(() => { const i = toasts.findIndex((t) => t.id === id); if (i >= 0) { toasts.splice(i, 1); drawToasts() } }, undo ? 10000 : 4200)
}
function drawToasts() {
  document.getElementById("toasts").innerHTML = toasts.map((t) => `<div class="toast${t.md ? " md" : ""}"><span>${t.text}</span>${t.undo ? `<button class="u" data-undo="${t.id}">Undo</button>` : ""}</div>`).join("")
}
const snap = () => JSON.stringify({ lines: S.lines, cartons: S.cartons, trips: S.trips, changes: S.changes, zeroed: S.zeroed, log: S.log, status: S.status, returns: S.returns, seq: S.seq, clock: S.clock, dels: S.dels, fresh: S.fresh, issues: S.issues, returnSeq: S.returnSeq })
function restore(js) { Object.assign(S, JSON.parse(js)); S.sheet = S.sheet && S.sheet.kind === "dlv" && S.dels.includes(S.sheet.dlv) ? { ...S.sheet, edit: false, draft: {} } : null; S.dlg = null; render() }
function logIt(who, alt, text) { S.log.push({ at: clock(), who, alt, text }) }
// work done on a store settles MD's change there: the dot goes; a pick also ends the was → now
function settleChanges(alt, stores, picked) { for (const c of S.changes) if (c.alt === alt && stores.includes(c.store)) { if (!c.seen) { c.seen = true; c.seenAt = clock() } if (picked) c.live = false } }
function markSeen(pairs) {
  for (const c of S.changes) if (!c.seen && pairs.some(([a, s]) => c.alt === a && c.store === s)) { c.seen = true; c.seenAt = clock(); if (!c.isNew) logIt(OPS, c.alt, `saw the change on <b>${stName(c.store)}</b>`) }
}

/* MD changes the plan. The floor gets the difference. Returns how many stores changed. */
function mdApply(alt, targets, { cancel = false, by = MD, act = S.seq.act++ } = {}) {
  const at = tick()
  const stores = storesOfAlt(alt)
  const before = Object.fromEntries(stores.map((s) => [s, agg(linesOf(alt, s))]))
  for (const l of linesOf(alt)) { const nv = targets(l); if (nv != null) l.target = Math.max(nv, calc(l).sent) }
  let n = 0
  for (const s of stores) {
    const b = before[s], a = agg(linesOf(alt, s))
    if (b.target === a.target) continue
    n++
    // a newer change replaces one nobody has seen yet
    for (const c of S.changes) if (c.alt === alt && c.store === s && !c.seen) { c.seen = true; c.live = false }
    S.changes.push({ id: S.seq.chg++, alt, store: s, from: b.target, to: a.target, fromPick: b.toPick, toPick: a.toPick, by, at, t: Date.now() + Math.random(), seen: false, live: a.toPick > 0 || b.toPick > 0, cancel })
    const k = key(alt, s)
    if (b.toPick > 0 && a.toPick === 0) S.zeroed[k] = { from: b.toPick, cancel, act }
    if (a.toPick > 0) delete S.zeroed[k]
    // a pick that MD cancels mid-way must not become a short pick
    if (a.toPick === 0) for (const l of linesOf(alt, s)) l.short = null
    const put = a.excess - b.excess
    logIt(by, alt, `${cancel ? "cancelled" : "changed"} <b>${stName(s)}</b> · ${AL[alt].article} ${b.target} → ${a.target}${put > 0 ? ` · put back ${put}` : ""}`)
  }
  if (n && !cancel) settleStatus(alt)
  return n
}
function settleStatus(alt) {
  if (linesOf(alt).every((l) => l.target === calc(l).sent)) S.status[alt] = agg(linesOf(alt)).sent ? "closed" : "cancelled"
  else S.status[alt] = "open"
}
function mdStore(alt, store, newTotal) {
  const ls = linesOf(alt, store), cur = sum(ls.map((l) => l.target))
  const m = spread(ls, newTotal, (l) => l.target)
  mdApply(alt, (l) => (m.has(l) ? m.get(l) : null))
  if (S.view === "ops") toast(`${MD} changed ${stName(store)} · ${AL[alt].article} ${cur} → ${sum(ls.map((l) => l.target))}`, { md: true })
  render()
}
function mdCancelScope(dlv, stores, ret) {
  const d = DL[dlv], act = S.seq.act++
  const sentBefore = agg(dlvLines(d).filter((l) => stores.includes(l.store))).sent
  for (const alt of d.alts) if (mdApply(alt, (l) => (stores.includes(l.store) ? 0 : null), { cancel: true, act })) settleStatus(alt)
  if (ret && sentBefore) for (const s of stores) {
    const n = agg(dlvLines(d).filter((l) => l.store === s)).sent
    if (n) { S.returns.push({ dlv, store: s, qty: n }); logIt(MD, d.alts[0], `asked <b>${stName(s)}</b> to return ${n} (Return to HO)`) }
  }
}
function mdCancelAlt(alt) {
  if (mdApply(alt, () => 0, { cancel: true })) settleStatus(alt)
  if (S.view === "ops") toast(`${MD} ${S.status[alt] === "closed" ? "cancelled the rest of" : "cancelled"} ${AL[alt].article}`, { md: true })
}
function newAllotment(q) {
  const d = DL.D014
  for (const a of d.alts) {
    const skus = skusOf(AL[a])
    for (const s of STORES) {
      const tot = q[a + "|" + s.id] || 0
      if (!tot) continue
      const tmp = skus.map((k) => ({ alt: a, sku: k.sku, store: s.id, target: k.size === "M" ? 2 : 1, picked: 0, short: null }))
      const m = new Map(tmp.map((l) => [l, l.target]))
      const W = sum(tmp.map((l) => l.target)), raw = tmp.map((l) => (tot * l.target) / W), base = raw.map(Math.floor)
      let left = tot - sum(base)
      raw.map((r, i) => [r - base[i], i]).sort((x, y) => y[0] - x[0]).forEach(([, i]) => { if (left > 0) { base[i]++; left-- } })
      tmp.forEach((l, i) => { l.target = base[i]; if (l.target) S.lines.push(l) })
      m.clear()
      S.changes.push({ id: S.seq.chg++, alt: a, store: s.id, from: 0, to: tot, fromPick: 0, toPick: tot, by: MD, at: clock(), t: Date.now(), seen: false, live: false, isNew: true })
    }
    logIt(MD, a, `allotted ${AL[a].article} · ${pcs(sum(STORES.map((s) => q[a + "|" + s.id] || 0)))} to ${STORES.filter((s) => q[a + "|" + s.id]).length} stores`)
  }
  S.dels.unshift("D014"); S.fresh.D014 = true
}

/* floor actions — each one can be undone for 10 s, like Mail's Undo Send */
function doPick(sh) {
  const at = tick()
  let got = 0, short = 0
  for (const l of linesOf(sh.alt, sh.store)) {
    const n = pickOf(sh.alt, sh.store, l.sku)
    if (!n) continue
    const v = Math.min(sh.draft[l.sku] ?? n, n), rest = n - v
    l.picked += v
    l.short = rest && sh.pickMode === "short" ? { qty: rest, reason: sh.reason, by: OPS, at } : (rest ? l.short : null)
    got += v
    if (sh.pickMode === "short") short += rest
  }
  settleChanges(sh.alt, [sh.store], true)
  const z = S.zeroed[key(sh.alt, sh.store)]
  if (z && !z.cancel) delete S.zeroed[key(sh.alt, sh.store)]
  logIt(OPS, sh.alt, `picked <b>${stName(sh.store)}</b> · ${AL[sh.alt].article} ${got}${short ? ` · ${short} short · ${sh.reason}` : ""}`)
  S.sheet = null
  render()
  toast(`Picked ${got} · ${stName(sh.store)}${short ? ` · ${short} short` : ""}`)
}
function doPackKoli(store, no) {
  const d = koliDraft(store), k = d.koli.find((x) => x.no === no)
  if (!k || !koliQty(k)) return
  tick()
  const items = []
  for (const [id, q] of Object.entries(k.items)) {
    const l = kLine(store, id), n = Math.min(q, l ? packLeft(l) : 0)
    if (!n) continue
    items.push({ alt: l.alt, sku: l.sku, qty: n }); l.picked -= n
  }
  d.koli = d.koli.filter((x) => x !== k)
  if (d.active === no) d.active = d.koli.at(-1)?.no ?? null
  if (!items.length) return render()
  const id = "KOLI-" + String(S.seq.ctn++).padStart(4, "0"), q = sum(items.map((i) => i.qty))
  S.cartons.push({ id, no, store, items, sent: false, trip: null })
  for (const a of new Set(items.map((i) => i.alt))) { settleChanges(a, [store]); logIt(OPS, a, `packed <b>${stName(store)}</b> · koli ${no} · ${id} · ${pcs(sum(items.filter((i) => i.alt === a).map((i) => i.qty)))}`) }
  render()
  toast(`Koli ${no} packed · ${pcs(q)} · label ready`)
}
// Play warehouse: everything left goes into one koli
function packAll(store) { const d = koliDraft(store); d.koli = []; d.active = null; startKoli(store); const k = koliDraft(store).koli[0]; if (k) doPackKoli(store, k.no) }
function doPutBack(sh) {
  const before = snap(); tick()
  const ls = S.lines.filter((l) => l.store === sh.store && l.picked > 0)
  let n = 0
  const alts = new Set()
  for (const l of ls) { const q = Math.min(sh.q[l.sku] ?? calc(l).pbPicked, l.picked); if (q) { l.picked -= q; n += q; alts.add(l.alt) } }
  const plan = takeoutPlan(sh.store).map(p => ({ ...p, take: returnTake(sh, p) })).filter(p => p.take > 0)
  for (const p of plan) { S.cartons.find((x) => x.id === p.carton).items.find((i) => i.alt === p.alt && i.sku === p.sku).qty -= p.take; n += p.take; alts.add(p.alt) }
  S.cartons = S.cartons.filter((c) => c.sent || sum(c.items.map((i) => i.qty)) > 0)
  for (const a of alts) { settleChanges(a, [sh.store]); logIt(OPS, a, `put back <b>${stName(sh.store)}</b>${plan.some((p) => p.alt === a) ? " · from koli, labels need reprint" : ""}`) }
  const back = sh.from === "pack" && S.lines.some((l) => l.store === sh.store && packLeft(l) > 0)
  if (back) startKoli(sh.store)
  S.sheet = back ? { kind: "pack", store: sh.store } : null
  render()
  toast(`Put back ${n} · ${stName(sh.store)}`)
}
function doUnpackOne(store, id) {
  const before = snap(); tick()
  const c = S.cartons.find((x) => x.id === id)
  if (!c || c.sent || c.store !== store) return toast("Dispatched koli cannot be unpacked")
  let n = 0
  for (const it of c.items) { S.lines.find((x) => x.alt === it.alt && x.sku === it.sku && x.store === store).picked += it.qty; n += it.qty }
  S.cartons = S.cartons.filter((x) => x.id !== id)
  for (const a of new Set(c.items.map((i) => i.alt))) logIt(OPS, a, `unpacked <b>${stName(store)}</b> · ${id}`)
  render()
  toast(`Unpacked ${id} · ${n} back to pack`)
}
function doUnpack(sh) {
  const before = snap(); tick()
  const ids = Object.keys(sh.unpack).filter((k) => sh.unpack[k])
  let n = 0
  const alts = new Set()
  for (const id of ids) {
    const c = S.cartons.find((x) => x.id === id)
    for (const it of c.items) { S.lines.find((x) => x.alt === it.alt && x.sku === it.sku && x.store === c.store).picked += it.qty; n += it.qty; alts.add(it.alt) }
    S.cartons = S.cartons.filter((x) => x.id !== id)
  }
  for (const a of alts) logIt(OPS, a, `unpacked <b>${stName(sh.store)}</b> · ${plural(ids.length, "koli", "koli")}`)
  S.sheet = null
  render()
  toast(`Unpacked ${plural(ids.length, "koli", "koli")} · ${n} back to Pack`)
}
function doDispatch(sh) {
  const before = snap(), at = tick()
  const boxes = chosenCartons(sh), stores = [...new Set(boxes.map((b) => b.store))]
  if (!boxes.length) return
  if (!sh.tripData.trim()) return toast("Enter trip data")
  const id = "TRP-" + String(S.seq.trip++).padStart(4, "0")
  for (const b of boxes) { b.sent = true; b.trip = id }
  S.trips.push({ id, day: TODAY, at, stores, data: sh.tripData.trim(), received: {}, recAt: {} })
  for (const st of stores) { const mine = boxes.filter((b) => b.store === st); for (const a of new Set(mine.flatMap((b) => b.items.map((i) => i.alt)))) { settleChanges(a, [st]); logIt(OPS, a, `dispatched <b>${stName(st)}</b> · ${plural(mine.length, "koli", "koli")} · ${esc(sh.tripData.trim())}`) } }
  S.sheet = null
  render()
  toast(`Dispatched ${plural(stores.length, "store", "stores")} · ${plural(boxes.length, "koli", "koli")} · ${plural(stores.length, "delivery note", "delivery notes")} ready`)
}
function doOk(alt, store, quiet) {
  delete S.zeroed[key(alt, store)]
  for (const c of S.changes) if (c.alt === alt && c.store === store) { c.live = false; if (!c.seen) { c.seen = true; c.seenAt = clock() } }
  if (!quiet) { tick(); logIt(OPS, alt, `OK on <b>${stName(store)}</b> · nothing left to pick`) }
  if (S.sheet && S.sheet.kind === "pick") S.sheet = null
  if (!quiet) render()
}
function okArticle(alt) {
  const zs = STORES.map((x) => x.id).filter((x) => S.zeroed[key(alt, x)])
  const acts = [...new Set(zs.map((x) => S.zeroed[key(alt, x)]).filter((z) => z.cancel).map((z) => z.act))]
  for (const a of acts) doOkAct(a)
  const rest = zs.filter((x) => S.zeroed[key(alt, x)])
  rest.forEach((x, i) => doOk(alt, x, i < rest.length - 1))
  if (!zs.length) { S.sheet = null; render() }
}
function doOkAct(act) {
  const ks = Object.keys(S.zeroed).filter((k) => S.zeroed[k].act == act)
  const alts = new Set()
  for (const k of ks) { const [a, s] = k.split("|"); doOk(a, s, true); alts.add(a) }
  tick(); for (const a of alts) logIt(OPS, a, `OK on the cancel`)
  render()
}

/* open a card */
function openCard(kind, store, alt) {
  if (kind === "pick") { S.sheet = { kind: "pick", alt, store, draft: {}, reason: null, opened: Date.now(), base: Object.fromEntries(skusOf(AL[alt]).map((k) => [k.sku, pickOf(alt, store, k.sku)])) }; markSeen([[alt, store]]) }
  else if (kind === "pack") { startKoli(store); S.sheet = { kind: "pack", store }; markSeen([...new Set(S.lines.filter((l) => l.store === store && l.picked).map((l) => l.alt))].map((a) => [a, store])) }
  else if (kind === "dispatch") { S.sheet = { kind: "store", store }; markSeen([...new Set(S.lines.filter((l) => l.store === store).map((l) => l.alt))].map((a) => [a, store])) }
  render()
}
// one truck usually takes everything that is packed: every ready store starts ticked, untick what stays
function openDispatch() { S.sheet = { kind: "dispatch", sel: Object.fromEntries(dispatchCards().filter((c) => freeCartons(c.store).length).map((c) => [c.store, true])), ctn: {}, tripData: "" }; render() }
function openTakeout(store, from) { S.sheet = { kind: "putback", store, q: {}, from }; markSeen([...new Set(S.lines.filter((l) => l.store === store).map((l) => l.alt))].map((a) => [a, store])); render() }
function openNew() {
  if (S.dels.includes("D014")) return toast("Nothing left to allot")
  const d = DL.D014, q = {}
  for (const a of d.alts) { let left = d.free[a]; STORES.forEach((s, i) => { const v = i === STORES.length - 1 ? left : Math.round(d.free[a] * NEW_SPLIT[s.id]); q[a + "|" + s.id] = v; left -= v }) }
  S.sheet = { kind: "new", q }
  render()
}

/* ═════════ events ═════════ */
let suppressClick = false
document.addEventListener("click", (e) => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return }
  const t = e.target
  const u = t.closest("[data-undo]")
  if (u) { const i = toasts.findIndex((x) => x.id === +u.dataset.undo); if (i >= 0) { const entry = toasts[i]; if (entry.expected !== snap()) { toasts.splice(i, 1); drawToasts(); toast("Work has changed. Review the current allotment."); return } const js = entry.undo; toasts.splice(i, 1); drawToasts(); restore(js); toast("Undone") } return }
  const pr = t.closest("[data-proto]")
  if (pr) return protoAction(pr.dataset.proto, pr)
  const pl = t.closest("[data-plane]")
  if (pl) { S.phoneLane = pl.dataset.plane; render(); return }

function totInput(t) {
  const sh = S.sheet, parts = t.dataset.tot.split("|")
  const store = parts[0] === "s" ? parts[1] : parts[2], alt = parts[0] === "a" ? parts[1] : null
  const ls = dlvLines(DL[sh.dlv]).filter((l) => l.store === store && (!alt || l.alt === alt))
  let v = parseInt(t.value, 10); if (isNaN(v) || v < 0) v = 0
  const floor = sum(ls.map((l) => calc(l).sent))
  if (v < floor) { v = floor; toast(`${floor} already dispatched to ${stName(store)} · ask the store to return them`) }
  for (const [l, nv] of spread(ls, v, (l) => sh.draft[l.sku + "|" + l.store] ?? l.target)) sh.draft[l.sku + "|" + l.store] = nv
  render()
}
function getVal(id) {
  const sh = S.sheet
  if (sh.kind === "pick") { const n = pickOf(sh.alt, sh.store, id); return Math.min(sh.draft[id] ?? n, n) }
  if (id.startsWith("ctn:")) { const p = takeoutPlan(sh.store).find(p => "ctn:" + p.carton + ":" + p.sku === id); return p ? returnTake(sh,p) : 0 }
  if (id.startsWith("koli:")) { const [, no, kk] = id.split(":"); return koliDraft(sh.store).koli.find((k) => k.no === +no)?.items[kk] || 0 }
  const [k, sku] = id.split(":"), l = S.lines.find((x) => x.store === sh.store && x.sku === sku)
  return Math.min(sh.q[sku] ?? calc(l).pbPicked, l.picked)
}
function setVal(id, raw) {
  const sh = S.sheet
  const el = document.querySelector(`[data-in="${CSS.escape(id)}"]`)
  const min = el ? +el.dataset.min : 0, max = el ? +el.dataset.max : 999
  let v = parseInt(raw, 10); if (isNaN(v)) v = min
  v = Math.max(min, Math.min(max, v))
  if (id.startsWith("ctn:")) sh.q[id] = v
  else if (sh.kind === "pick") sh.draft[id] = v
  else if (id.startsWith("koli:")) { const [, no, kk] = id.split(":"), k = koliDraft(sh.store).koli.find((x) => x.no === +no); if (k) { if (v) k.items[kk] = v; else delete k.items[kk] } }
  else { const [, sku] = id.split(":"); sh.q[sku] = v }
  render()
}
function stepBy(id, d) { setVal(id, getVal(id) + d) }

/* ═════════ drag and drop ═════════
   Pointer events, so mouse and touch (tablet) both work. Mouse: drag after 6 px. Touch: hold 350 ms, then drag
   (a quick swipe still scrolls the lane). A drop never writes: it opens the sheet that does that move. */
const DROPS = {
  pick: { pack: "Pick" },
  pack: { dispatch: "Pack", pick: "Put back" },
  dispatch: { dispatched: "Dispatch", pack: "Unpack" },
}
let press = null, drag = null
document.addEventListener("pointerdown", (e) => {
  if (e.button > 0) return
  const tl = e.target.closest(".tile[data-drag]")
  if (!tl || e.target.closest("button.act, input, .chk")) return
  press = { tl, x: e.clientX, y: e.clientY, id: e.pointerId, touch: e.pointerType !== "mouse" }
  if (press.touch) press.timer = setTimeout(() => press && startDrag(press.x, press.y), 350)
})
document.addEventListener("pointermove", (e) => {
  if (drag) { moveDrag(e.clientX, e.clientY); return }
  if (!press || e.pointerId !== press.id) return
  const dist = Math.hypot(e.clientX - press.x, e.clientY - press.y)
  if (press.touch) { if (dist > 8) { clearTimeout(press.timer); press = null } return }
  if (dist > 6) startDrag(e.clientX, e.clientY)
})
document.addEventListener("pointerup", (e) => {
  if (press) { clearTimeout(press.timer); press = null }
  if (drag) endDrag(e.clientX, e.clientY)
})
document.addEventListener("pointercancel", () => { if (press) { clearTimeout(press.timer); press = null } if (drag) cancelDrag() })
document.addEventListener("touchmove", (e) => { if (drag) e.preventDefault() }, { passive: false })
document.addEventListener("contextmenu", (e) => { if (drag || press?.touch) e.preventDefault() })
function startDrag(x, y) {
  const tl = press.tl, r = tl.getBoundingClientRect()
  const owed = tl.querySelector(".act.owed")
  drag = { kind: tl.dataset.kind, store: tl.dataset.store, alt: tl.dataset.alt, tl, r, ox: press.x - r.left, oy: press.y - r.top, over: null, owed: !!owed }
  press = null
  const g = tl.cloneNode(true)
  g.classList.add("drag-ghost")
  Object.assign(g.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px" })
  document.body.appendChild(g)
  drag.g = g
  tl.classList.add("lifted")
  document.body.classList.add("dragging")
  const ok = DROPS[drag.kind] || {}
  document.querySelectorAll(".lane[data-lane]").forEach((ln) => {
    const k = ln.dataset.lane
    if (k === drag.kind) return
    if (ok[k]) { ln.classList.add("can-drop"); ln.dataset.hint = k === "dispatched" && drag.owed ? "Put back first" : ok[k] }
    else ln.classList.add("no-drop")
  })
  if (navigator.vibrate) navigator.vibrate(8)
  moveDrag(x, y)
}
function moveDrag(x, y) {
  const g = drag.g
  g.style.transform = `translate(${x - drag.ox - drag.r.left}px, ${y - drag.oy - drag.r.top}px) scale(1.02)`
  const ln = document.elementFromPoint(x, y)?.closest(".lane.can-drop")
  if (ln !== drag.over) { drag.over?.classList.remove("drop"); ln?.classList.add("drop"); drag.over = ln || null }
}
function clearDrag() {
  document.querySelectorAll(".lane").forEach((ln) => { ln.classList.remove("can-drop", "no-drop", "drop"); delete ln.dataset.hint })
  document.body.classList.remove("dragging")
  drag.tl.classList.remove("lifted")
}
function endDrag() {
  const { kind, store, alt, over } = drag
  suppressClick = true
  setTimeout(() => (suppressClick = false), 0)
  drag.g.remove(); clearDrag()
  const to = over?.dataset.lane
  drag = null
  if (!to) return
  if (kind === "pick") openCard("pick", store, alt)
  else if (kind === "pack" && to === "pick") openTakeout(store)
  else if (kind === "pack") openCard("pack", store)
  else if (kind === "dispatch" && to === "dispatched") { freeCartons(store).length ? openDispatch(store) : openTakeout(store) }
  else if (kind === "dispatch" && to === "pack") { S.sheet = { kind: "store", store }; render() }
}
function cancelDrag() {
  const g = drag.g, r = drag.r
  g.classList.add("back")
  g.style.transform = "translate(0, 0) scale(1)"
  setTimeout(() => g.remove(), 200)
  clearDrag()
  drag = null
}

/* the warehouse works by itself, one step at a time, so MD can watch the cards move */
let playing = null
function autoStep() {
  QUIET = true
  try {
    const cards = pickCards()
    const z = cards.find((c) => c.group || !c.qty)
    if (z) { z.group ? doOkAct(z.act) : doOk(z.alt, z.store); return true }
    const pc = cards.find((c) => !c.group && c.qty && skusOf(AL[c.alt]).some((k) => pickOf(c.alt, c.store, k.sku) > 0))
    if (pc) { doPick({ kind: "pick", alt: pc.alt, store: pc.store, draft: {}, reason: null, opened: Date.now() }); return true }
    const pk = packCards()[0]
    if (pk) { if (pk.pb) doPutBack({ store: pk.store, q: {} }); else packAll(pk.store); return true }
    const dc = dispatchCards(), owed = dc.find((c) => c.pb)
    if (owed) { doPutBack({ store: owed.store, q: {} }); return true }
    if (dc.length) { doDispatch({ kind: "dispatch", sel: Object.fromEntries(dc.map((c) => [c.store, true])), ctn: {}, tripData: "Truk HO · B 9123 KD · Joko Prasetyo" }); return true }
    const t = S.trips.find((x) => x.stores.some((y) => !x.received[y]))
    if (t) { const y = t.stores.find((x) => !t.received[x]); t.received[y] = TODAY; (t.recAt ||= {})[y] = tick(); logIt("Store team", dispatchAlt(t, y), `received <b>${stName(y)}</b> · blind count complete`); render(); return true }
    return false
  } finally { QUIET = false }
}

          <tr><td>Cancelled · Completed</td><td>“Rest cancelled” when something was already dispatched</td></tr>
        </tbody></table></div>
    </div>
  </div></div>`
}

/* Tablet and connected workflow revision, 12 October 2026. */
// Browser-local demonstrator. No API, messages, inventory ledger or printer integration.
const DEMO_KEY = 'itulah.allotment.tablet.v3';
let savedDemo = '', persistenceWarning = false, toolsOpen = false;
function compactUI() { return (S?.device === 'phone' ? Math.min(innerWidth,414) : S?.device === 'tablet' ? Math.min(innerWidth,1024) : innerWidth) <= 900; }
function matchesSearch(value) { return !S.search || value.toLowerCase().includes(S.search.toLowerCase().trim()); }
function cartonHanded(c) { const t = tripOf(c.trip); return !!t && (t.handedCartons?.includes(c.id) || !!t.received[c.store]); }
function returnTake(sh,p) { return Math.max(0, Math.min(p.take, sh.q['ctn:'+p.carton+':'+p.sku] ?? p.take)); }
function shortOwner(l) { return ['Not found','Stock unconfirmed','Damaged'].includes(l.short?.reason) ? 'Inventory' : 'Operations'; }
function shortBlocked(l) { return !!l.short && shortOwner(l) === 'Inventory'; }
function domainRevision() { return JSON.stringify([S.lines,S.cartons,S.trips,S.status,S.dels,S.issues,S.returns]); }
const originalSeed = seed;
seed = function() { originalSeed(); S.search=''; S.attention=false; S.issues=[]; S.receiptDrafts={}; S.returnSeq=1; S.returnTab='active'; S.view = ['ops','md','store','inventory','returns','compare','research'].includes(S.view) ? S.view : 'ops'; };
function persistDemo() {
  try { const value = snap(); if (value !== savedDemo) { localStorage.setItem(DEMO_KEY,JSON.stringify({schema:2,domain:JSON.parse(value)})); savedDemo=value; } }
  catch { if (!persistenceWarning) { persistenceWarning=true; toast('Changes last only while this page is open.'); } }
}
function loadDemo() {
  try { const data=JSON.parse(localStorage.getItem(DEMO_KEY)||'null'); if(data?.schema===2 && Array.isArray(data.domain?.lines) && Array.isArray(data.domain?.trips)) Object.assign(S,data.domain); savedDemo=snap(); }
  catch { persistenceWarning=true; }
}
window.addEventListener('storage',e=> { if(e.key!==DEMO_KEY || !e.newValue)return; try {const data=JSON.parse(e.newValue); if(data.schema!==2)return; Object.assign(S,data.domain); savedDemo=snap(); render(); toast('Updated from another demo tab.');}catch{} });
const originalProto = protoAction;
protoAction = function(a) { if(a==='reset' && playing){clearInterval(playing);playing=null;} originalProto(a); };
renderProto = function() {
  const nav=[['ops','Operations'],['md','MD'],['store','Store'],['inventory','Inventory'],['returns','Returns']];
  $proto.innerHTML=`<div class="row"><div class="brand"><i>i</i><span>Allotment</span></div><nav class="seg" aria-label="Demo workspace">${nav.map(([v,t])=>`<button aria-pressed="${S.view===v}" data-proto="set:view:${v}">${t}</button>`).join('')}</nav><span class="demo-label">Local demo</span><button class="btn icon soft" data-extra="tools" aria-label="Demo tools" aria-expanded="${toolsOpen}">${ic('sliders-horizontal')}</button></div>${toolsOpen?`<div class="row tools"><label class="field"><select data-device aria-label="Preview width">${[['auto','Responsive'],['tablet','Tablet 1024'],['phone','Phone 414']].map(([v,t])=>`<option value="${v}" ${S.device===v?'selected':''}>${t}</option>`).join('')}</select></label><button class="btn soft" data-extra="review">Flow coverage</button><button class="btn soft" data-proto="set:view:research">Research</button><button class="btn soft" data-extra="reset">Reset demo</button><span class="mute">${persistenceWarning?'Session only':'Saved on this browser'}</span><div class="sim-line">${[['md:-40half','MD −40, half picked'],['md:-50packed','MD −50, packed'],['md:cancel','MD cancels Gamis'],['md:race','Change during pick'],['play',playing?'Stop warehouse':'Run warehouse']].map(([a,t])=>`<button class="btn soft" data-proto="${a}">${t}</button>`).join('')}</div></div>`:''}`;
  document.documentElement.style.setProperty('--bar-h',$proto.offsetHeight+'px');
};
function searchField() { return `<label class="field search">${ic('search','s16')}<input data-search aria-label="Search allotments, articles or stores" placeholder="Search article or store" value="${esc(S.search||'')}"></label>`; }
function openIssues(scope) { S.sheet={kind:'issues',scope};render(); }
function openDelivery(id) { S.view='md'; S.sheet={kind:'dlv',dlv:id,edit:false,draft:{},sel:{},open:{}}; render(); }
function openReturn(id) { S.sheet={kind:'returns',returnId:id}; render(); }
function newReturn(dlv) { S.sheet={kind:'returnNew',dlv,store:storesOfDlv(DL[dlv])[0],q:{}}; render(); }
function enhanceUI() {
  const board=$app.querySelector('.board-head');
  if(board) { board.querySelector('.back')?.remove(); board.querySelector('.search')?.replaceWith(htmlElement(searchField())); board.insertAdjacentHTML('beforeend',`<button class="btn soft attention-toggle" data-extra="attention" aria-pressed="${!!S.attention}">Needs attention</button><button class="btn soft" data-extra="history">Dispatched ${S.trips.filter(onRoad).length}</button>`); }
  if(S.view==='ops' && compactUI()) { const p=$app.querySelector('.pbar'); p?.insertAdjacentHTML('afterend',`<div class="compact-search">${searchField()}<button class="btn soft attention-toggle" data-extra="attention" aria-pressed="${!!S.attention}" aria-label="Needs attention">${ic('list-filter')}</button><button class="btn soft" data-extra="issues">Issues</button></div>`); }
  if(S.view==='md') $app.querySelector('.toolbar .field')?.replaceWith(htmlElement(searchField()));
  $app.querySelectorAll('.acard, tr[data-dlv], .tile[data-trip] .main, .tile [data-open]').forEach(el=> {el.tabIndex=0;el.setAttribute('role','button');});
  $app.querySelectorAll('.dept nav a').forEach(el=> { if(el.textContent==='Return to HO'){el.href='#returns';el.dataset.extra='returns-page';}else if(el.textContent!=='Allotments')el.remove(); });
  const sh=S.sheet;
  if(sh) {
    const revision=domainRevision();
    if(sh.baseRevision==null) sh.baseRevision=revision;
    const stale=sh.baseRevision!==revision;
    if(stale && ['pick','pack','putback','dispatch','dlv','new','receive','returnNew'].includes(sh.kind)) {
      $layer.querySelector('.sh-body')?.insertAdjacentHTML('afterbegin',`<div class="banner warn" role="alert"><div class="grow">Work has changed. Review quantities before saving.</div><button class="btn soft" data-extra="refresh-work">Refresh</button></div>`);
      $layer.querySelectorAll('[data-do="pick-submit"],[data-do="pack-carton"],[data-do="putback-submit"],[data-do="dispatch-submit"],[data-do="md-save"],[data-do="md-cancel"],[data-extra="receive-submit"],[data-extra="return-create"]').forEach(el=>el.disabled=true);
    }
    $layer.querySelectorAll('input[data-in]').forEach(el=>el.setAttribute('aria-label','Quantity '+el.dataset.in));
    $layer.querySelectorAll('input[data-tot]').forEach(el=>el.setAttribute('aria-label','Allotted '+el.dataset.tot));
    $layer.querySelectorAll('input[data-nq]').forEach(el=>el.setAttribute('aria-label','New quantity '+el.dataset.nq));
  }
  $app.inert=!!S.sheet; $proto.inert=!!S.dlg;
  const panel=$layer.querySelector('.dlg')||$layer.querySelector('.sheet');
  if(panel && !sh?._focusSet) { panel.tabIndex=-1;panel.focus({preventScroll:true});if(sh)sh._focusSet=true; }
}
function htmlElement(markup) {const t=document.createElement('template');t.innerHTML=markup;return t.content.firstElementChild;}
const originalDlvSheet=dlvSheet;
dlvSheet=function(sh) {
  const r=originalDlvSheet(sh),d=DL[sh.dlv],ls=dlvLines(d);
  r.body+=`<div class="route-links"><button class="btn soft" data-extra="warehouse" data-dlv-id="${d.id}">Warehouse work</button><button class="btn soft" data-extra="issues" data-dlv-id="${d.id}">Issues ${shortIssues(ls).length+openReceiptIssues(ls).length}</button><button class="btn soft" data-extra="return-new" data-dlv-id="${d.id}">Return to HO</button>${S.returns.filter(x=>x.dlv===d.id).map(x=>`<button class="btn soft" data-extra="return-open" data-id="${x.id}">${x.id} · ${returnState(x)}</button>`).join('')}</div>`;
  if(compactUI() && sh.edit) r.body=r.body.replace(/<div class="pc-edit">/g,'<div class="pc-edit">');

 else if(action==='resolve-receipt')resolveReceipt(extra.dataset.id,extra.dataset.outcome);
 else if(action==='store-receive')openReceive(extra.dataset.tripId,extra.dataset.storeId);
 else if(action==='receive-submit')confirmReceive(sh);
 else if(action==='return-new')newReturn(extra.dataset.dlvId);
 else if(action==='return-open')openReturn(extra.dataset.id);
 else if(action==='return-create') {
   const ls=dlvLines(DL[sh.dlv]).filter(l=>l.store===sh.store),items=ls.filter(l=>sh.q[l.sku]>0).map(l=>({alt:l.alt,sku:l.sku,qty:sh.q[l.sku]}));
   if(!items.length||items.some(i=>!Number.isSafeInteger(i.qty)||i.qty>returnAvailable(ls.find(l=>l.sku===i.sku))))return toast('Review the return quantities.');
   const r=createReturn(sh.dlv,sh.store,items);if(r)openReturn(r.id);
 }
 else if(action==='quality-clear'||action==='quality-reject'){const r=S.returns.find(x=>x.id===extra.dataset.id);if(!r||r.status!=='received'||S.issues.some(i=>i.trip===r.id&&!i.resolution))return;r.quality=action==='quality-clear'?'cleared':'rejected';tick();logIt('Inventory · Dewi Lestari',DL[r.dlv].alts[0],`${r.id} · quality ${r.quality}`);render();}
 else if(action.startsWith('return-')) {
   const r=S.returns.find(x=>x.id===extra.dataset.id);if(!r)return;
   if(action==='return-cancel'&&r.status==='requested'){r.status='cancelled';tick();logIt(MD,DL[r.dlv].alts[0],`cancelled ${r.id}`);}
   else if(action==='return-trim'&&r.status==='requested'){r.items=r.items.map(i=>({...i,qty:readyReturnQty(r,i)})).filter(i=>i.qty>0);r.qty=sum(r.items.map(i=>i.qty));tick();logIt(MD,DL[r.dlv].alts[0],`changed ${r.id} to ${r.qty} received pieces`);}
   else if(action==='return-dispatch'&&returnState(r)==='Ready at store'){r.status='dispatched';tick();logIt('Store team',DL[r.dlv].alts[0],`dispatched ${r.id} · ${pcs(r.qty)} to HO`);}
   else if(action==='return-receive'&&r.status==='dispatched'&&r.items.every(i=>Number.isSafeInteger(sh.counts?.[i.sku])&&sh.counts[i.sku]>=0)) {
     r.status='received';r.counts={...sh.counts};r.quality='pending';
     for(const i of r.items)if(r.counts[i.sku]!==i.qty)S.issues.push({id:'CASE-'+r.id+'-'+i.sku,trip:r.id,store:r.store,sku:i.sku,alt:i.alt,type:r.counts[i.sku]<i.qty?'return-missing':'return-extra',qty:Math.abs(r.counts[i.sku]-i.qty),resolution:null});
     tick();logIt(OPS,DL[r.dlv].alts[0],`received ${r.id} · ${pcs(sum(Object.values(r.counts)))} · quality inspection pending`);
   }
   sh.baseRevision=null;render();
 }
 else if(action==='refresh-work') {
   sh.baseRevision=null;sh.draft={};sh.q={};sh.counts={};
   if(sh.kind==='pick')sh.base=Object.fromEntries(skusOf(AL[sh.alt]).map(k=>[k.sku,pickOf(sh.alt,sh.store,k.sku)]));
   render();
 }
 else if(action==='print-preview'){toast('Browser print preview · sample document');window.print();}
 else if(action==='keep-editing')$layer.querySelector('[data-unsaved]')?.remove();
 else if(action==='discard-close'){S.sheet=null;S.dlg=null;render();}
},true);
document.addEventListener('change',e=>{
 const t=e.target,sh=S.sheet;
 if(t.matches('[data-device]')){e.stopImmediatePropagation();S.device=t.value;render();return;}
 if(t.matches('[data-receive-carton]')){e.stopImmediatePropagation();sh.selected[t.dataset.receiveCarton]=t.checked;sh.counts={};render();return;}
 if(t.matches('[data-return-store]')){e.stopImmediatePropagation();sh.store=t.value;sh.q={};render();return;}
 const number=t.matches('[data-count-sku],[data-return-count],[data-return-qty],[data-in],[data-tot],[data-nq]');
 if(number&&!/^\d+$/.test(t.value.trim())){e.stopImmediatePropagation();toast('Enter a whole number, zero or above.');render();return;}
 if(number&&(!Number.isSafeInteger(Number(t.value))||Number(t.value)>1000000)){e.stopImmediatePropagation();toast('Quantity is too large.');render();return;}
 if(t.dataset.countSku){e.stopImmediatePropagation();sh.counts[t.dataset.countSku]=Number(t.value);render();}
 if(t.dataset.returnCount){e.stopImmediatePropagation();(sh.counts ||= {})[t.dataset.returnCount]=Number(t.value);render();}
 if(t.dataset.returnQty){e.stopImmediatePropagation();const l=dlvLines(DL[sh.dlv]).find(l=>l.store===sh.store&&l.sku===t.dataset.returnQty);const n=Number(t.value);if(n>returnAvailable(l))toast('Only '+returnAvailable(l)+' received pieces available.');sh.q[l.sku]=Math.min(n,returnAvailable(l));render();}
},true);
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){const pos=e.target.selectionStart;S.search=e.target.value;render();const input=$app.querySelector('[data-search]');input?.focus();input?.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.sheet&&!S.dlg){e.preventDefault();e.stopImmediatePropagation();requestClose();return;}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();return;}
 if(e.key==='Tab'&&S.sheet){const panel=$layer.querySelector('.dlg')||$layer.querySelector('.sheet'),items=[...panel.querySelectorAll('button:not(:disabled),input:not(:disabled),select,summary,a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===panel)){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||!panel.contains(document.activeElement))){e.preventDefault();first.focus();}}
},true);
// Keep touch input and keyboard focus stable when a quantity causes a redraw.
const paintRender=render;
render=function(){
 const el=document.activeElement,selection=el&&typeof el.selectionStart==='number'?[el.selectionStart,el.selectionEnd]:null,attrs=['data-in','data-tot','data-nq','data-count-sku','data-return-count','data-return-qty','data-step','data-exp','data-ck','data-extra'];
 const attr=el&&attrs.find(a=>el.hasAttribute?.(a)),value=attr?el.getAttribute(attr):null;
 const scroll=$app.querySelector('.content,.flow-page,.plist')?.scrollTop||0;
 paintRender();
 if(attr){const next=[...document.querySelectorAll('['+attr+']')].find(x=>x.getAttribute(attr)===value&&!x.disabled);next?.focus({preventScroll:true});if(next&&selection&&next.setSelectionRange)next.setSelectionRange(...selection);}
 const area=$app.querySelector('.content,.flow-page,.plist');if(area)area.scrollTop=scroll;
};

// Quantity fields update the draft immediately; Save never waits for a blur.
document.addEventListener('input', e => {
 const t=e.target,sh=S.sheet;if(!sh||!t.matches('[data-tot],[data-nq],[data-in],[data-count-sku],[data-return-count],[data-return-qty]'))return;
 if(!/^\d+$/.test(t.value.trim())||!Number.isSafeInteger(Number(t.value))||Number(t.value)>1000000)return;
 if(t.dataset.tot){totInput(t);return;}
 if(t.dataset.nq){sh.q[t.dataset.nq]=Number(t.value);render();return;}
 if(t.dataset.in){setVal(t.dataset.in,t.value);return;}
 if(t.dataset.countSku){sh.counts[t.dataset.countSku]=Number(t.value);document.getElementById('foot').innerHTML=receiveSheet(sh).foot;return;}
 if(t.dataset.returnCount){(sh.counts ||= {})[t.dataset.returnCount]=Number(t.value);document.getElementById('foot').innerHTML=returnsSheet(sh).foot;return;}
 if(t.dataset.returnQty){sh.q[t.dataset.returnQty]=Number(t.value);document.getElementById('foot').innerHTML=returnNewSheet(sh).foot;}
});

// Handoff cues name the next owner; operational decisions stay out of MD's screen.
const returnSheetWithActions=returnsSheet;
returnsSheet=function(sh){
 const view=returnSheetWithActions(sh),r=S.returns.find(r=>r.id===sh.returnId);if(!r)return view;
 if(r.status==='requested'&&returnState(r)==='Ready at store'&&S.view!=='store')view.foot=view.foot.replace(/<button class="btn primary" data-extra="return-dispatch"[^>]*>Dispatch return<\/button>/,`<button class="btn primary" data-extra="owner-return" data-owner="store" data-id="${r.id}">Continue at Store</button>`);
 if(r.status==='dispatched'&&S.view!=='ops')view.foot=`<span class="said">Returning to HO</span><span class="grow"></span><button class="btn primary" data-extra="owner-return" data-owner="ops" data-id="${r.id}">Receive at HO</button>`;
 return view;
};


/* ═══ Look: Today | Lark — a skin over the same screens; the flows never change ═══ */
let LOOK = "today"
const LOOKS = ["today", "lark", "quiet"]
try { const v = localStorage.getItem("allot-look"); if (LOOKS.includes(v)) LOOK = v } catch {}
{ const q = new URLSearchParams(location.search).get("look"); if (LOOKS.includes(q)) LOOK = q }
const SHEET_IC = { pick: "hand", pack: "package", putback: "undo-2", store: "store", dispatch: "truck", trip: "truck", dlv: "shirt", new: "plus", issues: "triangle-alert", receive: "package-check", returns: "undo-2", returnNew: "undo-2", history: "history", review: "list-checks" }
const initials2 = (s) => { const w = s.replace(/,? (PT|CV)\.?$/i, "").split(/\s+/).filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || "").slice(0, 2)).toUpperCase() }
function larkDress() {
  document.body.dataset.look = LOOK === "today" ? "today" : "lark"
  document.body.dataset.tone = LOOK === "quiet" ? "quiet" : ""
  if (LOOK === "today") return
  // the card's one action shrinks to a pill beside its figure (or bottom right when there is no figure)
  for (const tile of document.querySelectorAll(".tile")) {
    const act = tile.querySelector(":scope > .act, :scope > .acts2"), main = tile.querySelector(":scope > .main")
    if (!act || !main) continue
    const last = main.lastElementChild
    if (last?.classList.contains("q") && act.classList.contains("act")) { const row = document.createElement("div"); row.className = "lk-qrow"; last.replaceWith(row); row.append(last, act) }
    else tile.classList.add("lk-foot")
  }
  // allotment cards: supplier tile, allotment no as a code chip
  for (const h of document.querySelectorAll(".acard header > .two")) {
    if (h.parentElement.querySelector(".lk-who")) continue
    const who = document.createElement("div"); who.className = "lk-who"
    h.replaceWith(who); who.innerHTML = `<span class="lk-ava big">${initials2(h.querySelector(".a").textContent)}</span>`; who.appendChild(h)
    const code = h.querySelector(".b .mono")
    if (code) { code.classList.add("lk-code"); const n = code.nextSibling; if (n?.nodeType === 3) n.textContent = n.textContent.replace(/^\s*·\s*/, "") }
  }
  // KPI cards get their icon tile
  const KI = ["loader", "hand", "warehouse", "truck"]
  document.querySelectorAll(".kpis .kpi").forEach((k, i) => {
    if (k.querySelector(".ki")) return
    k.innerHTML = `<span class="ki">${ic(KI[i] || "circle")}</span><div>${k.innerHTML}</div>`
  })
  // sheet head: a tile for what the sheet is about
  const head = document.querySelector(".sheet .sh-head")
  if (head && !head.querySelector(".lk-ava")) {
    const t = head.querySelector("h2")?.textContent || ""
    const store = t.match(/^C\d{3} · (.+)$/)
    head.insertAdjacentHTML("afterbegin", `<span class="lk-ava big">${store ? initials2(store[1]) : ic(SHEET_IC[S.sheet?.kind] || "file-text")}</span>`)
  }
}
const plainRender = render
render = function () { plainRender(); larkDress(); addLookSwitch(); if (window.lucide) lucide.createIcons() }
function addLookSwitch() {
  const row = $proto.querySelector(".row")
  if (!row || row.querySelector("[data-look]")) return
  const dev = S.device === "auto" ? "auto" : S.device
  row.querySelector(".demo-label")?.insertAdjacentHTML("beforebegin",
    `<span class="lbl" style="margin-left:8px">Look</span><nav class="seg">${[["today", "Today"], ["lark", "Lark"], ["quiet", "Quiet"]].map(([v, t]) => `<button aria-pressed="${LOOK === v}" data-look="${v}">${t}</button>`).join("")}</nav>
     <nav class="seg">${[["auto", "Desk"], ["tablet", "Tablet"], ["phone", "Phone"]].map(([v, t]) => `<button aria-pressed="${dev === v}" data-dev="${v}">${t}</button>`).join("")}</nav>`)
  document.documentElement.style.setProperty("--bar-h", $proto.offsetHeight + "px")
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-look], [data-dev]")
  if (!b || !$proto.contains(b)) return
  e.stopImmediatePropagation()
  if (b.dataset.look) { LOOK = b.dataset.look; try { localStorage.setItem("allot-look", LOOK) } catch {} }
  if (b.dataset.dev) S.device = b.dataset.dev
  render()
}, true)

seed()
loadDemo()
{ const q = new URLSearchParams(location.search)
  if (["auto", "tablet", "phone"].includes(q.get("device"))) S.device = q.get("device")
  if (["ops", "md", "store", "inventory", "returns"].includes(q.get("view"))) S.view = q.get("view") }
render()
window.addEventListener("resize", () => render())
