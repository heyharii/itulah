<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report a
         real number, and the whole bottom of this app — the floating tab bar,
         the action bar under a count sheet — is positioned clear of the home
         indicator with it. A double-tap that zooms the screen mid-count is a
         fault, and `touch-action: manipulation` on the whole document
         (styles/index.css) is what stops it — NOT `user-scalable=no`, which
         iOS has ignored since 10 and which also takes pinch-zoom away from
         the person who needs to read a small code. `interactive-widget`
         makes Android's keyboard shrink the layout the way iOS's does, so
         the action bar under a count sheet rides above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Lantai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
