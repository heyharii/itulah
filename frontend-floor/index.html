<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report a
         real number, and the whole bottom of this app — the floating tab bar,
         the action bar under a count sheet — is positioned clear of the home
         indicator with it. `user-scalable=no` because this is worked with one
         thumb while the other hand is holding a carton, and a double-tap that
         zooms the screen mid-count is a fault, not a feature. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Lantai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
