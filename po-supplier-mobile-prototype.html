<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#ffffff" />
<title>Central PO & Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
/* Buying · Purchase orders + Suppliers on desk, tablet and phone.
   Every size below is measured from the running frontend-hub (:5495,
   4 Oct 2026), not chosen per component: page 22 · KPI/sheet title 18 ·
   cells 15 · labels, tabs and controls 14; controls 34, buttons 36, sheet
   actions 28, form fields 44; cards r10, inner r8; table cells 20px.
   Motion follows Emil Kowalski: transform + opacity only, custom curves,
   exits faster than entrances, nothing animates on a keyboard action. */
:root {
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --canvas: #ffffff; --soft: #f8f8f9; --soft-2: #f0f0f2; --soft-3: #f6f6f7;
  --hairline: #e6e6e9; --hairline-2: #dadade; --hairline-strong: #c6c6cc;
  --ink: #20242c; --text: #394150; --body: #565f6d; --mute: #666f7d; --faint: #b9c0c9; --line-ico: #89919d;
  --rail: #242526; --rail-2: #303234; --rail-3: #393b3d; --rail-ink: #ffffff; --rail-text: #c3c4c7;
  --scrim: rgba(246, 246, 247, 0.72);
  --accent: #2563eb; --accent-bg: #eff5ff;
  --cta: #2563eb; --cta-hover: #1d4ed8;
  --ok: #36b827; --ok-fg: #137a37; --warn-fg: #a64a08; --warn-bg: #faeacd; --bad: #d05151; --bad-fg: #be123c; --bad-bg: #fbeaea;
  --info: #2f86d8; --info-fg: #2c57bf;

  --r-card: 10px; --r-inner: 8px; --r-shell: 16px;
  --shadow-soft: 0 1px 3px rgb(24 39 60 / 4%);
  --shadow-pop: 0 4px 8px rgb(24 39 60 / 4%), 0 12px 32px rgb(24 39 60 / 8%);
  --shadow-float: 0 1px 2px rgb(24 39 60 / 6%), 0 18px 48px -8px rgb(24 39 60 / 18%);

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --slow: 1;
  --t-press: calc(120ms * var(--slow));
  --t-pop: calc(160ms * var(--slow));
  --t-sheet: calc(280ms * var(--slow));
  --t-drawer: calc(450ms * var(--slow));
  --t-exit: calc(200ms * var(--slow));
  --t-toast: calc(400ms * var(--slow));
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
html, body { height: 100%; margin: 0; }
body { background: #e4e4e8; color: var(--ink); font: 400 15px/1.45 var(--font-sans); letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button, a, [role="button"] { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
input, textarea, select { font: inherit; letter-spacing: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { flex-shrink: 0; }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ico-20 { width: 20px; height: 20px; }
.ico-12 { width: 12px; height: 12px; }
.mono { font-family: var(--font-mono); letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.bad { color: var(--bad-fg); }
.nowrap { white-space: nowrap; }

/* ── prototype chrome (not part of the design) ─────────────────────────── */
.proto { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px; font: 500 14px/1 system-ui, sans-serif; color: #3a3a40; letter-spacing: 0; }
.proto b { font-weight: 600; color: #18181b; }
.seg { display: inline-flex; background: #d6d6db; border-radius: 9px; padding: 3px; gap: 2px; font: 500 14px/1 system-ui, sans-serif; letter-spacing: 0; }
.seg button { height: 28px; padding: 0 11px; border-radius: 7px; color: #55555c; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #fff; color: #18181b; box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.proto .sp { flex: 1; }
.proto label { display: inline-flex; align-items: center; gap: 6px; color: #55555c; }
.data-toggle { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100; }
.stage { height: calc(100dvh - 52px); position: relative; overflow: hidden; padding: 0 16px 60px; }
.device { position: relative; overflow: hidden; background: #d9d9de; container: dev / inline-size; flex-shrink: 0; transform-origin: center center;
  box-shadow: 0 0 0 1px rgb(0 0 0 / 8%), 0 30px 60px -20px rgb(0 0 0 / 25%); --sat: 0px; --sab: 0px; }
.stage[data-device="desktop"] .device { width: 100%; height: 100%; border-radius: 12px; }
.stage:not([data-device="desktop"]) .device { position: absolute; left: 50%; top: calc(50% - 26px); }
.stage[data-device="tablet"] .device { border-radius: 28px; box-shadow: 0 0 0 10px #1c1c1f, 0 0 0 11px #2c2c30, 0 30px 60px -20px rgb(0 0 0 / 35%); --sat: 24px; --sab: 18px; }
.stage[data-device="phone"] .device { border-radius: 44px; box-shadow: 0 0 0 10px #1c1c1f, 0 0 0 11px #2c2c30, 0 30px 60px -20px rgb(0 0 0 / 35%); --sat: 50px; --sab: 26px; }
.notch, .homebar { display: none; }
.stage[data-device="phone"] .notch { display: block; position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 90; pointer-events: none; }
.stage[data-device="phone"] .homebar { display: block; position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #111; z-index: 90; pointer-events: none; }
@media (max-width: 600px) {
  .proto, .data-toggle { display: none; }
  .stage { height: 100dvh; padding: 0 !important; }
  .stage .device { position: absolute !important; inset: 0; width: 100% !important; height: 100% !important; transform: none !important; border-radius: 0 !important; box-shadow: none !important;
    --sat: env(safe-area-inset-top, 0px) !important; --sab: env(safe-area-inset-bottom, 0px) !important; }
  .notch, .homebar { display: none !important; }
}

/* ── shell: rail 68 · department column 232 · page on soft-3 ────────────── */
.app { position: absolute; inset: 0; display: grid; grid-template-columns: 68px 232px minmax(0, 1fr); background: var(--soft-3); overflow: hidden; transform-origin: 50% 0; transition: transform var(--t-exit) var(--ease-out); }
.app.pushed { transform: translateY(calc(var(--sat) * 0.5)) scale(0.94); border-radius: 14px; transition: transform var(--t-drawer) var(--ease-drawer); }
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: calc(var(--sat) + 12px) 0 12px; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: #000; display: grid; place-items: center; position: relative; box-shadow: 0 0 0 1px rgb(255 255 255 / 10%); margin-bottom: 8px; }
.logo b { color: #fff; font: 700 16px/1 var(--font-sans); letter-spacing: -0.04em; }
.logo i { position: absolute; right: 6px; bottom: 7px; width: 5px; height: 5px; border-radius: 50%; background: #2563eb; }
.rbtn { width: 40px; height: 40px; border-radius: var(--r-inner); display: grid; place-items: center; color: var(--rail-text); position: relative; transition: background-color var(--t-press) ease, color var(--t-press) ease; }
.rbtn .ico { width: 20px; height: 20px; }
.rbtn[aria-current="true"] { background: var(--rail-3); color: var(--rail-ink); }
.rbtn .dot { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: #ee8b2e; box-shadow: 0 0 0 2px var(--rail); }
.rbtn .badge { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); min-width: 22px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font: 600 12px/18px var(--font-sans); letter-spacing: 0; text-align: center; box-shadow: 0 0 0 2px var(--rail); }
@media (hover: hover) and (pointer: fine) { .rbtn:hover { background: var(--rail-2); color: var(--rail-ink); } }
.rail .sp { flex: 1; }
.me { width: 28px; height: 28px; border-radius: 50%; background: #3d3f42; color: #fff; display: grid; place-items: center; font: 600 14px/1 var(--font-sans); margin-top: 6px; }
.side { background: var(--canvas); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; padding-top: var(--sat); }
.side-h { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--hairline); }
.side-h h2 { flex: 1; margin: 0; font: 600 15px/22px var(--font-sans); letter-spacing: -0.01em; color: var(--ink); }
.side-l { display: flex; flex-direction: column; gap: 2px; padding: 10px; }
.sitem { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: var(--r-inner); font-size: 14px; color: var(--body); white-space: nowrap; transition: background-color var(--t-press) ease, color var(--t-press) ease; }
.sitem[aria-current="page"] { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.sitem .n { margin-left: auto; padding: 0 6px; font-weight: 500; color: var(--warn-fg); font-variant-numeric: tabular-nums; }
@media (hover: hover) and (pointer: fine) { .sitem:not([aria-current="page"]):hover { background: var(--soft-2); color: var(--ink); } }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { flex-shrink: 0; height: calc(52px + var(--sat)); padding: var(--sat) 20px 0; display: flex; align-items: center; gap: 12px; background: var(--soft-3); border-bottom: 1px solid var(--hairline); }
.top .sp { flex: 1; }
.clock { display: inline-flex; align-items: center; gap: 8px; color: var(--body); font-size: 14px; font-variant-numeric: tabular-nums; }
.clock .ico { color: var(--line-ico); }
.icon-btn { width: 32px; height: 32px; border-radius: var(--r-inner); display: grid; place-items: center; color: var(--line-ico); position: relative; transition: background-color var(--t-press) ease, color var(--t-press) ease, transform var(--t-press) var(--ease-out); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn .badge { position: absolute; top: -2px; right: -6px; min-width: 22px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font: 600 12px/18px var(--font-sans); letter-spacing: 0; text-align: center; }
@media (hover: hover) and (pointer: fine) { .icon-btn:hover { background: var(--soft-2); color: var(--ink); } }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--body); min-width: 0; white-space: nowrap; }
.crumbs .ico { color: var(--line-ico); }
.crumbs b { font-weight: 500; color: var(--ink); }
.crumbs i { font-style: normal; color: var(--faint); }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border-radius: var(--r-inner); font-size: 14px; color: var(--body); }
.tbtn.ask { color: var(--accent); font-weight: 500; }
.t-desk, .t-tab, .t-phone { display: contents; }
.t-tab, .t-phone { display: none; }
.switcher { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.switcher small { font: 500 14px/14px var(--font-sans); color: var(--mute); }
.switcher span { display: inline-flex; align-items: center; gap: 4px; font: 600 16px/20px var(--font-sans); color: var(--ink); }
.switcher span .ico { color: var(--mute); }
.main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.page { padding: 28px 32px 48px; }
.page-title { margin: 0 0 24px; font: 600 22px/30px var(--font-sans); letter-spacing: -0.02em; color: var(--ink); }

@container dev (max-width: 1023px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail, .side { display: none; }
  .t-desk { display: none; }
  .t-tab { display: contents; }
  .page-title { display: none; }
}
@container dev (max-width: 767px) {
  .top { background: var(--canvas); padding: var(--sat) 12px 0; }
  .t-tab { display: none; }
  .t-phone { display: contents; }
  .page { padding: 16px 16px calc(150px + var(--sab)); }
}

/* ── KPI cards ─────────────────────────────────────────────────────────── */
.kpis { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { height: 72px; display: flex; flex-direction: column; padding: 12px 16px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); text-align: left; min-width: 0; }
.kpi .l { font: 500 14px/20px var(--font-sans); letter-spacing: 0.04em; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { margin-top: auto; padding-top: 8px; font: 600 18px/1 var(--font-sans); letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .v.bad { color: var(--bad-fg); }
button.kpi { transition: border-color var(--t-press) ease, transform var(--t-press) var(--ease-out); }
button.kpi:active { transform: scale(0.98); }
button.kpi[aria-pressed="true"] { border-color: color-mix(in oklab, var(--accent) 45%, var(--hairline)); box-shadow: 0 0 0 3px var(--accent-bg); }
@media (hover: hover) and (pointer: fine) { button.kpi:hover { border-color: var(--hairline-2); } }
@container dev (max-width: 767px) {
  .kpis { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; scrollbar-width: none; margin: 0 -16px 16px; padding: 0 16px 2px; }
  .kpis::-webkit-scrollbar { display: none; }
  .kpi { flex: 0 0 160px; height: 66px; padding: 10px 16px; scroll-snap-align: start; }
}

/* ── tabs: a colour change, no travelling line (pressed tens of times a day) ── */
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; box-shadow: inset 0 -1px 0 var(--hairline); margin-bottom: 18px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 8px 12px 10px; font: 500 14px/20px var(--font-sans); color: var(--body); white-space: nowrap; border-bottom: 2px solid transparent; transition: color var(--t-press) ease, border-color var(--t-press) ease; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .tab:hover { color: var(--ink); } }

/* ── toolbar ───────────────────────────────────────────────────────────── */
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 36px; margin-bottom: 12px; }
.toolbar .sp { flex: 1; }
.srch { position: relative; width: 176px; flex-shrink: 0; }
.srch.w { width: 256px; }
.srch .ico { position: absolute; left: 10px; top: 50%; margin-top: -8px; color: var(--mute); pointer-events: none; }
.srch input { width: 100%; height: 34px; padding: 0 10px 0 32px; border: 1px solid var(--hairline-2); border-radius: var(--r-inner); background: var(--canvas); box-shadow: var(--shadow-soft); font-size: 14px; color: var(--ink); outline: none; transition: border-color var(--t-press) ease, box-shadow var(--t-press) ease; }
.srch input::placeholder { color: var(--body); }
.srch input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.sel { position: relative; width: 176px; height: 34px; display: flex; align-items: center; padding: 0 36px 0 12px; border: 1px solid var(--hairline-2); border-radius: var(--r-inner); background: var(--canvas); box-shadow: var(--shadow-soft); font-size: 14px; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: border-color var(--t-press) ease; }
.sel.set { color: var(--ink); }
.sel .ico { position: absolute; right: 10px; top: 50%; margin-top: -8px; color: var(--line-ico); }
@media (hover: hover) and (pointer: fine) { .sel:hover { border-color: var(--hairline-strong); } }
.ghost { height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border-radius: var(--r-inner); font: 500 14px/20px var(--font-sans); color: var(--body); white-space: nowrap; transition: background-color var(--t-press) ease, color var(--t-press) ease; }
.ghost .ico { color: var(--line-ico); }
@media (hover: hover) and (pointer: fine) { .ghost:hover { background: var(--soft-2); color: var(--ink); } }
.swl { height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; border: 1px solid var(--hairline-2); border-radius: var(--r-inner); background: var(--canvas); box-shadow: var(--shadow-soft); font-size: 14px; color: var(--text); white-space: nowrap; }
.sw { position: relative; width: 30px; height: 18px; border-radius: 9px; background: var(--hairline-2); flex-shrink: 0; transition: background-color var(--t-pop) ease; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 20%); transition: transform var(--t-pop) var(--ease-out); }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(12px); }
.sw.lg { width: 44px; height: 26px; border-radius: 13px; }
.sw.lg::after { top: 3px; left: 3px; width: 20px; height: 20px; }
.sw.lg[aria-checked="true"] { background: var(--ok); }
.sw.lg[aria-checked="true"]::after { transform: translateX(18px); }
.toolbar .only-desk { display: inline-flex; }
.toolbar .only-narrow { display: none; }
@container dev (max-width: 1023px) {
  .toolbar .only-desk { display: none; }
  .toolbar .only-narrow { display: inline-flex; }
  .srch, .srch.w { flex: 1; width: auto; }
}
@container dev (max-width: 767px) {
  .toolbar { flex-wrap: nowrap; }
  .srch input { height: 44px; }
  .toolbar .btn.icon { width: 44px; height: 44px; }
  .toolbar .only-tab { display: none; }
}

/* ── buttons ───────────────────────────────────────────────────────────── */
.btn { height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border: 1px solid var(--hairline-2); border-radius: var(--r-inner); background: var(--canvas); color: var(--text); font: 500 15px/20px var(--font-sans); white-space: nowrap; flex-shrink: 0;
  transition: transform var(--t-press) var(--ease-out), background-color var(--t-press) ease, border-color var(--t-press) ease, opacity var(--t-press) ease; }
.btn .ico { color: var(--line-ico); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.primary { background: var(--cta); border-color: var(--cta); color: #fff; }
.btn.primary .ico { color: #fff; }
.btn.danger { background: var(--bad-fg); border-color: var(--bad-fg); color: #fff; }
.btn.sm { height: 28px; padding: 0 8px; }
.btn.icon { width: 36px; padding: 0; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled) { background: var(--soft-2); }
  .btn.primary:hover:not(:disabled) { background: var(--cta-hover); border-color: var(--cta-hover); }
  .btn.danger:hover { background: #a20f33; }
}
.link { color: var(--accent); font-weight: 500; }
@media (hover: hover) and (pointer: fine) { .link:hover { text-decoration: underline; text-underline-offset: 3px; } }

/* ── the list: a white card on soft-3, grey header band, fixed columns ──── */
.tcard { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: clip; }
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 15px; }
.tbl th { position: sticky; top: 0; z-index: 2; height: 40px; padding: 0 16px; background: var(--soft); border-bottom: 1px solid var(--hairline-2); font: 500 14px/20px var(--font-sans); letter-spacing: 0.04em; color: var(--body); text-align: left; white-space: nowrap; }
.tbl thead tr + tr th { top: 40px; }
.tbl th.grp { text-align: center; border-left: 1px solid var(--hairline-strong); border-right: 1px solid var(--hairline-strong); border-bottom-color: var(--hairline-strong); }
.tbl th.gs { border-left: 1px solid var(--hairline-strong); }
.tbl .r { text-align: right; }
.tbl th .so { display: inline-flex; align-items: center; gap: 4px; }
.tbl th .so .ico { width: 12px; height: 12px; color: var(--faint); }
.tbl td { padding: 20px 16px; border-bottom: 1px solid var(--hairline); color: var(--text); white-space: nowrap; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }
.tbl.dense th { padding: 0 12px; }
.tbl.dense td { padding: 10px 12px; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr td { transition: background-color var(--t-press) ease; }
.tbl tbody tr.sel td { background: var(--accent-bg); }
@media (hover: hover) and (pointer: fine) { .tbl tbody tr:hover td { background: var(--soft); } .tbl tbody tr.sel:hover td { background: var(--accent-bg); } }
.tbl tfoot td { height: 44px; padding: 0 16px; background: var(--soft); border-bottom: 0; font: 500 14px/20px var(--font-sans); color: var(--ink); font-variant-numeric: tabular-nums; cursor: default; }
.tbl.dense tfoot td { padding: 0 12px; }
.c2 { display: flex; flex-direction: column; min-width: 0; }
.c2 .a { font: 500 14px/20px var(--font-sans); color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.c2 .b { font: 400 14px/20px var(--font-mono); color: var(--mute); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; }

.psrch input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

.pop { position: absolute; z-index: 60; min-width: 200px; max-width: min(360px, calc(100% - 16px)); padding: 4px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-pop);
  transform-origin: var(--origin, top left); opacity: 0; transform: scale(0.96); transition: opacity 120ms var(--ease-out), transform 120ms var(--ease-out); }
.pop[data-open="true"] { opacity: 1; transform: none; transition-duration: var(--t-pop); }
.pop.instant { transition: none; }
.mi { width: 100%; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 6px; font-size: 14px; color: var(--ink); text-align: left; white-space: nowrap; }
.mi .ico { color: var(--line-ico); }
.mi.danger, .mi.danger .ico { color: var(--bad-fg); }
.mi:disabled { color: var(--faint); cursor: not-allowed; }
.mi .chk { margin-left: auto; color: var(--accent); }
.mi .m { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 6px 0; white-space: normal; }
.mi .m .s { color: var(--mute); }
.mi-sep { height: 1px; background: var(--hairline); margin: 4px 2px; }
.mi-h { padding: 8px 10px 4px; color: var(--mute); font-size: 14px; }
@media (hover: hover) and (pointer: fine) { .mi:hover:not(:disabled) { background: var(--soft-2); } }
.plistbox { max-height: 300px; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; }
.sh-body .plistbox { max-height: none; margin: 0 -10px; }
.sh-body .plistbox .mi { min-height: 52px; }

/* ── confirm: centred, so it scales from its centre ─────────────────────── */
.dlg-layer { position: absolute; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; pointer-events: none; }
.dlg-layer .dv { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity var(--t-exit) ease; }
.dlg { position: relative; width: min(440px, 100%); padding: 24px; display: flex; flex-direction: column; gap: 8px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-shell); box-shadow: var(--shadow-float);

.dlg-layer[data-open="true"] { pointer-events: auto; }
.dlg-layer[data-open="true"] .dv { opacity: 1; transition-duration: 200ms; }
.dlg-layer[data-open="true"] .dlg { opacity: 1; transform: none; transition-duration: 200ms; }
.dlg h3 { margin: 0; font: 600 18px/25px var(--font-sans); letter-spacing: -0.02em; color: var(--ink); overflow-wrap: anywhere; }
.dlg p { margin: 0; color: var(--text); }
.dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
@container dev (max-width: 767px) { .dlg .acts .btn { flex: 1; height: 44px; } }

/* ── toasts (Sonner's taste): in and out through the same edge ───────────── */
.toaster { position: absolute; z-index: 80; right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
@container dev (max-width: 767px) { .toaster { left: 16px; right: 16px; bottom: calc(140px + var(--sab)); align-items: stretch; } }
.toast { pointer-events: auto; min-width: 300px; max-width: 420px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-pop); touch-action: pan-x;
  opacity: 1; transform: none; transition: opacity var(--t-toast) ease, transform var(--t-toast) ease; }
.toast[data-mounted="false"] { opacity: 0; transform: translateY(100%); }
.toast[data-leaving="true"] { opacity: 0; transform: translateY(100%); transition-duration: var(--t-exit); }
.toast .ok-ico { width: 20px; height: 20px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.toast .ok-ico .ico { width: 12px; height: 12px; stroke-width: 3; }
.toast .t { flex: 1; min-width: 0; color: var(--ink); overflow-wrap: anywhere; }
@container dev (max-width: 767px) { .toast { min-width: 0; max-width: none; } }
@media (prefers-reduced-motion: reduce) { .toast[data-mounted="false"], .toast[data-leaving="true"] { transform: none; } }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 40%); border-top-color: #fff; animation: spin 600ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.tbl td.bad, .tbl td .bad { color: var(--bad-fg); }
.tbl td.mute { color: var(--mute); }
.only-tab { display: inline-flex; }
@container dev (max-width: 767px) { .only-tab { display: none !important; } }

function finish(db) {
  db.supById = Object.fromEntries(db.suppliers.map((s) => [s.code, s]));
  db.artById = Object.fromEntries(db.articles.map((a) => [a.code, a]));
  db.pos.forEach((p) => derive(db, p));
  return db;
}
function derive(db, p) {
  let pcsAll = 0, gross = 0, recPcs = 0, recVal = 0, done = true, over = 0;
  p.lines.forEach((l) => {
    const a = db.artById[l.a] || l.custom || { name: "Unnamed item", division: "", tags: [], price: 0 };
    l.art = a;
    if (l.price == null) l.price = a.price;
    const f = UNITS[l.unit];
    l.pcs = Math.round(l.qty * f);
    l.amount = Math.round((l.pcs * l.price) / f);
    l.received = l.rec.reduce((s, r) => s + r[1], 0);
    pcsAll += l.pcs; gross += l.amount; recPcs += Math.min(l.received, l.pcs);
    recVal += Math.round((Math.min(l.received, l.pcs) * l.price) / f);
    if (l.received < l.pcs) done = false;
    if (l.received > l.pcs) over += l.received - l.pcs;
  });
  p.pcs = pcsAll; p.gross = gross; p.recPcs = recPcs; p.recVal = recVal; p.over = over;
  p.discount = Math.round((gross * p.discountPct) / 100);
  p.net = gross - p.discount;
  p.status = p.cancelled ? "cancelled" : p.recount ? "recount" : recPcs === 0 ? "active" : done ? "full" : p.closedShort ? "short" : "partial";
  p.open = p.status === "active" || p.status === "partial" || p.status === "recount";
  p.overdue = p.open && p.delivery < TODAY;
  p.lateDays = p.overdue ? daysBetween(p.delivery, TODAY) : 0;
  p.supplier = db.supById[p.sup];
}

/* ── sheets ───────────────────────────────────────────────────────────────
   Desk/tablet: the hub's floating panel, inset 20 (records 928, forms 1248).
   Phone: from the bottom, stopping short of the top, drag to dismiss.
   Enter on the drawer curve, leave faster; a stacked sheet pushes the one
   below back. Escape and N act instantly — keyboard actions never animate. */
const WIDTHS = { po: "928px", sup: "928px", "po-form": "1248px", item: "560px", "sup-form": "928px", options: "440px", "pick-sup": "480px" };
function openSheet(kind, data = {}, { instant = false } = {}) {
  closePop(true);
  const el = document.createElement("section");
  el.className = "sheet" + (instant ? " instant" : "");
  el.dataset.kind = kind; el.dataset.state = "enter";
  el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.tabIndex = -1;
  el.style.setProperty("--w", WIDTHS[kind] || "560px");
  const entry = { kind, el, dirty: false, opener: document.activeElement, ...data };
  S.stack.push(entry);
  layer.appendChild(el);
  rebuild(entry);
  updateStack();
  el.getBoundingClientRect();
  el.dataset.state = "open";
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("instant")));
  if (!isTouch) setTimeout(() => ($("[data-autofocus]", el) || el).focus({ preventScroll: true }), instant ? 0 : 60);
  if (kind === "po" || kind === "sup") markSelected(data.id);
  return entry;
}
async function closeTop({ instant = false, force = false } = {}) {
  const e = S.stack[S.stack.length - 1];
  if (!e) return;
  if (e.dirty && !force) {
    const ok = await confirmDlg({ title: "Discard this draft?", body: "Nothing has been saved.", ok: "Discard", cancel: "Keep editing", danger: true });
    if (!ok) return;
  }
  S.stack.pop();
  const el = e.el;
  if (instant) el.remove();
  else { el.dataset.state = "closing"; setTimeout(() => el.remove(), 220 * currentSlow() + 60); }
  updateStack();
  if (!S.stack.length) markSelected(null);
  if (e.opener && document.contains(e.opener) && !isTouch) e.opener.focus({ preventScroll: true });
}
function updateStack() {
  S.stack.forEach((e, i) => { e.el.style.zIndex = 30 + i * 2; e.el.classList.toggle("behind", i < S.stack.length - 1); });
  veil.dataset.on = S.stack.length > 0;
  app.classList.toggle("pushed", S.stack.length > 0 && mode() === "phone");
}
function markSelected(id) {

}

function rebuild(e, { keepScroll = true, anim = "" } = {}) {
  const old = $(".sh-body", e.el), st = keepScroll && old ? old.scrollTop : 0;
  const B = { po: poSheet, sup: supSheet, "po-form": composerSheet, item: itemSheet, "sup-form": supFormSheet, options: optionsSheet, "pick-sup": pickSupSheet }[e.kind];
  e.el.innerHTML = B(e);

/* drag to dismiss: 1:1, rubber-band the wrong way, a flick is enough */
const rubber = (o, dim) => (o * dim * 0.55) / (dim + 0.55 * o);
layer.addEventListener("pointerdown", (ev) => {
  const zone = ev.target.closest("[data-drag]");
  if (!zone || ev.button !== 0 || S.dragging) return;
  if (ev.target.closest("button, a, input, select, textarea, label")) return;
  const el = ev.target.closest(".sheet"), e = S.stack[S.stack.length - 1];
  if (!e || e.el !== el) return;
  const axis = mode() === "phone" ? "y" : "x";
  if (axis === "x" && ev.pointerType === "mouse") return;
  S.dragging = true;
  const start = axis === "y" ? ev.clientY : ev.clientX, size = axis === "y" ? el.offsetHeight : el.offsetWidth + 24;
  let d = 0, moved = false;
  const hist = [[performance.now(), 0]];
  el.setPointerCapture(ev.pointerId);
  const move = (m) => {
    if (m.pointerId !== ev.pointerId) return;
    const raw = ((axis === "y" ? m.clientY : m.clientX) - start) / S.scale;
    if (!moved && Math.abs(raw) < 6) return;
    moved = true; el.classList.add("dragging");
    d = raw >= 0 ? raw : -rubber(-raw, size);
    el.style.transform = axis === "y" ? `translateY(${d}px)` : `translateX(${d}px)`;
    if (S.stack.length === 1) { veil.style.transition = "none"; veil.style.opacity = String(Math.max(0, 1 - Math.max(0, d) / size)); }
    hist.push([performance.now(), raw]); if (hist.length > 5) hist.shift();
  };
  const up = (u) => {
    if (u.pointerId !== ev.pointerId) return;
    el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
    S.dragging = false;
    if (!moved) return;
    const [ta, da] = hist[0], [tb, db] = hist[hist.length - 1];
    const v = (db - da) / Math.max(1, tb - ta);
    el.classList.remove("dragging"); el.style.transform = ""; veil.style.transition = ""; veil.style.opacity = "";
    if (d > size * 0.35 || (v > 0.11 && d > 12)) closeTop();
  };
  el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
});
veil.addEventListener("click", () => closeTop());

/* ── popovers: scale out of the trigger ───────────────────────────────── */
function openPop(trigger, html, { instant = false, minWidth } = {}) {
  closePop(true);
  const pop = document.createElement("div");
  pop.className = "pop" + (instant ? " instant" : "");
  pop.innerHTML = html;
  if (minWidth) pop.style.minWidth = minWidth + "px";
  $("#popLayer").appendChild(pop);
  const dr = device.getBoundingClientRect(), r = trigger.getBoundingClientRect(), s = S.scale;
  const w = pop.offsetWidth, h = pop.offsetHeight, W = device.clientWidth, H = device.clientHeight;
  let x = (r.left - dr.left) / s, y = (r.bottom - dr.top) / s + 6, ox = "left", oy = "top";
  if (x + w > W - 8) { x = (r.right - dr.left) / s - w; ox = "right"; }
  if (x < 8) x = 8;
  if (y + h > H - 8) { y = (r.top - dr.top) / s - h - 6; oy = "bottom"; }
  pop.style.left = x + "px"; pop.style.top = Math.max(8, y) + "px";
  pop.style.setProperty("--origin", `${oy} ${ox}`);
  pop.getBoundingClientRect();
  pop.dataset.open = "true";
  S.pop = { el: pop, trigger };
  const f = $("input", pop); if (f && !isTouch) f.focus();
  return pop;
}
function closePop(instant = false) {
  const p = S.pop; if (!p) return;
  S.pop = null;
  if (instant) { p.el.remove(); return; }
  p.el.dataset.open = "false";
  setTimeout(() => p.el.remove(), 130 * currentSlow());
}
document.addEventListener("pointerdown", (ev) => { if (S.pop && !S.pop.el.contains(ev.target) && !S.pop.trigger.contains(ev.target)) closePop(); }, true);

/* ── toasts: Sonner's taste — same edge in and out, pause when hidden ──── */
function toast(msg, action) {
  const t = document.createElement("div");
  t.className = "toast"; t.dataset.mounted = "false";
  t.innerHTML = `<span class="ok-ico">${I("check")}</span><span class="t">${esc(msg)}</span>${action ? `<button class="btn sm">${esc(action.label)}</button>` : ""}`;
  $("#toaster").appendChild(t);
  t.getBoundingClientRect();
  t.dataset.mounted = "true";
  let remaining = 4000, started = Date.now(), timer = null;
  const vis = () => (document.hidden ? pause() : run());
  const leave = () => { clearTimeout(timer); document.removeEventListener("visibilitychange", vis); t.dataset.leaving = "true"; setTimeout(() => t.remove(), 220 * currentSlow()); };
  const run = () => { started = Date.now(); timer = setTimeout(leave, remaining); };
  const pause = () => { clearTimeout(timer); remaining -= Date.now() - started; };
  t.addEventListener("pointerenter", (e) => e.pointerType === "mouse" && pause());
  t.addEventListener("pointerleave", (e) => e.pointerType === "mouse" && run());
  document.addEventListener("visibilitychange", vis);
  if (action) $("button", t).onclick = () => { action.fn(); leave(); };
  t.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest("button")) return;
    const y0 = ev.clientY, t0 = performance.now(); let dy = 0;
    t.setPointerCapture(ev.pointerId); t.style.transition = "none";
    const mv = (m) => { dy = Math.max(0, (m.clientY - y0) / S.scale); t.style.transform = `translateY(${dy}px)`; };
    const up = () => { t.removeEventListener("pointermove", mv); t.removeEventListener("pointerup", up); t.style.transition = ""; t.style.transform = ""; if (dy > 30 || dy / (performance.now() - t0) > 0.11) leave(); };
    t.addEventListener("pointermove", mv); t.addEventListener("pointerup", up);
  });
  run();
}

function parseNum(str) {

  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");

function validateSup(f, edit) {
  const er = {};
  if (!edit && !f.name.trim()) er.name = "Fill in the supplier's name.";
  if (!edit && !f.legal) er.legal = "Choose the legal form.";
  if (!f.address.trim()) er.address = "Fill in the address.";
  const em = f.email.trim();
  if (em) {
    if (/\s/.test(em)) er.email = "An email address has no spaces in it.";
    else if (!/^[^@]+@[^@]+$/.test(em)) er.email = "An email address carries one @, with a name and a domain around it.";
    else if (!/\.[a-z]{2,}$/i.test(em)) er.email = "The domain looks unfinished — orders@sinartekstil.co.id.";
  }
  const ds = f.phones.map((p) => p.replace(/\D/g, ""));
  if (!ds.some(Boolean)) er.phone0 = "Fill in a phone number.";
  ds.forEach((d, i) => { if (d && d.length < 8) er["phone" + i] = "That is too short for a phone number."; if (d.length > 15) er["phone" + i] = "That is too long for a phone number."; });
  if (!edit && f.npwp && f.npwp.length !== 16) er.npwp = "An NPWP has 16 digits — an old 15-digit one gets a 0 in front.";
  f.contacts.forEach((c, i) => { if (!c.name.trim()) er["cname" + i] = "Give this contact a name."; if (!c.phone.trim() && !c.email.trim()) er["creach" + i] = "A contact needs a phone number or an email."; });
  return er;
}

function lineCalc(l) { const f = UNITS[l.unit], pc = Math.round(l.qty * f); return { pcs: pc, amount: Math.round((pc * l.price) / f), art: DB.artById[l.a] || l.custom }; }
function formTotals(f) {

/* filters on tablet/phone */

function supplierListHTML(q, m) {

/* ── actions ──────────────────────────────────────────────────────────── */
const entryOf = (el) => S.stack.find((x) => x.el === el?.closest(".sheet"));
const topEntry = () => S.stack[S.stack.length - 1];
function openRecord(kind, id, fromSheet) {
  const top = topEntry();
  // a second row click swaps the open record in place instead of stacking
  if (!fromSheet && top && S.stack.length === 1 && (top.kind === "po" || top.kind === "sup")) {
    Object.assign(top, { kind, id, tab: undefined, edit: false }); top.el.dataset.kind = kind; top.el.style.setProperty("--w", WIDTHS[kind]);
    rebuild(top, { keepScroll: false, anim: "swap-in" }); markSelected(id); return top;
  }
  return openSheet(kind, { id });
}
const newPO = (instant = false) => openSheet("po-form", { form: newPoForm() }, { instant });
const newSup = (instant = false) => openSheet("sup-form", { form: newSupForm() }, { instant });
function nextPONo() {
  const pre = `PO-${String(TODAY.getDate()).padStart(2, "0")}${String(TODAY.getMonth() + 1).padStart(2, "0")}${String(TODAY.getFullYear()).slice(2)}-`;
  const used = DB.pos.filter((p) => p.no.startsWith(pre)).map((p) => Number(p.no.slice(-3)));
  return pre + String((used.length ? Math.max(...used) : 0) + 1).padStart(3, "0");
}
const refreshRegion = () => { const r = $("#region"); if (r) r.innerHTML = S.screen === "sup" ? supRegion() : poRegion(); };
function focusFirstError(e) {
  const bad = $('[aria-invalid="true"], .noitems.bad', e.el); if (!bad) return;
  bad.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  if (bad.matches("input, textarea, select, button")) bad.focus({ preventScroll: true });
}

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b || b.disabled) return;
  if (b.tagName === "A") ev.preventDefault();
  const act = b.dataset.act, e = entryOf(b);
  const p = e && e.kind === "po" ? DB.pos.find((x) => x.no === e.id) : null;
  switch (act) {
    case "screen": closePop(true); S.screen = b.dataset.screen; while (S.stack.length) await closeTop({ instant: true, force: true }); main.scrollTop = 0; render(); break;
    case "screen-menu": openPop(b, menu(SCREENS.map(([k, t]) => ({ act: "screen", v: k, label: t, checked: S.screen === k }))).replace(/data-v=/g, "data-screen=")); break;
    case "new-po": newPO(); break;
    case "new-sup": newSup(); break;
    case "overdue": S.overdueOnly = !S.overdueOnly; if (S.overdueOnly) S.poTab = "open"; render(); break;
    case "potab": S.poTab = b.dataset.tab; render(); break;
    case "suptab": S.supTab = b.dataset.tab; render(); break;
    case "clear": S.supFilter = ""; S.delivery = "any"; S.overdueOnly = false; S.q = ""; S.supQ = ""; S.activeOrderOnly = false; render(); if (e) rebuild(e); break;
    case "more": S.limit += 400; refreshRegion(); break;
    case "pick-sup-filter": openPop(b, supplierPicker("filter"), { minWidth: 300 }); break;
    case "pick-delivery": openPop(b, menu([{ act: "set-delivery", v: "any", label: "Any time", checked: S.delivery === "any" }, { act: "set-delivery", v: "week", label: "Due this week", checked: S.delivery === "week" }, { act: "set-delivery", v: "late", label: "Past delivery date", checked: S.delivery === "late" }])); break;
    case "set-delivery": S.delivery = b.dataset.v; closePop(); render(); if (e) rebuild(e); break;
    case "menu-issued": openPop(b, menu([{ act: "close-pop", label: "Any time", checked: true }, { act: "close-pop", label: "This week" }, { act: "close-pop", label: "This month" }])); break;
    case "menu-cols": openPop(b, `<div class="mi-h">Columns</div>` + menu((S.screen === "sup" ? ["Supplier", "Status", "Active Order", "Completed Order", "Cancelled Order", "Last Purchased"] : ["PO", "Delivery Date", "Ordered", "Received", "Status"]).map((c) => ({ act: "close-pop", label: c, checked: true })))); break;
    case "close-pop": closePop(); break;
    case "export": toast("suppliers.csv saved"); break;
    case "options": openSheet("options"); break;
    case "active-order": S.activeOrderOnly = !S.activeOrderOnly; render(); if (e) rebuild(e); break;
    case "expand-sup": ev.stopPropagation(); S.open[b.dataset.id] = !S.open[b.dataset.id]; refreshRegion(); break;
    case "open-sup-orders": { const t = openRecord("sup", b.dataset.id); t.tab = "orders"; rebuild(t, { keepScroll: false }); break; }
    case "open-po": openRecord("po", b.dataset.id, !!e); break;
    case "open-sup": openRecord("sup", b.dataset.id, !!e); break;
    case "close": closeTop(); break;
    case "sheet-tab": e.tab = b.dataset.tab; rebuild(e, { keepScroll: false }); break;
    case "toggle-act": { const a = b.closest(".act"); a.dataset.open = a.dataset.open === "true" ? "false" : "true"; break; }
    case "expand": e.expand[b.dataset.k] = true; rebuild(e); break;
    case "review": toast(`Opens Review count for ${b.dataset.id}`); break;

    /* PO record */
    case "po-edit": openSheet("po-form", { form: formFromPO(p) }); break;
    case "po-print": openPop(b, `<div class="mi-h">Print</div>` + menu(["A5 landscape", "A4 landscape", "A5 portrait", "A4 portrait"].map((v) => ({ act: "print", v, label: v })))); break;
    case "print": { const no = topEntry()?.id; closePop(); toast(`${no} sent to print · ${b.dataset.v}`); break; }
    case "sup-print": toast(`${e.id} sent to print`); break;
    case "close-short": {
      const r = await confirmDlg({ title: "Close this short?", body: `${pcs(p.pcs - p.recPcs)} will be removed from the order, and the PO completes as received. This can't be undone.`, ok: "Close Short", why: true });
      if (!r) break;
      p.closedShort = true; derive(DB, p); rebuild(e); render(); markSelected(p.no); toast(`${p.no} completed`); break;
    }
    case "cancel-po": {
      const r = await confirmDlg({ title: `Cancel ${p.no}?`, body: "The warehouse will stop receiving against this order. It stays on record as cancelled.", ok: "Cancel order", cancel: "Keep order", danger: true, why: true });
      if (!r) break;
      p.cancelled = true; p.cancelWhy = r.why; derive(DB, p); rebuild(e); render(); markSelected(p.no); toast(`${p.no} is cancelled.`); break;
    }

    /* supplier record */
    case "sup-edit": e.edit = true; e.form = supFormFrom(DB.supById[e.id]); e.dirty = false; rebuild(e, { keepScroll: false }); break;
    case "sup-edit-cancel":
      if (e.dirty && !(await confirmDlg({ title: "Discard this draft?", body: "Nothing has been saved.", ok: "Discard", cancel: "Keep editing", danger: true }))) break;
      e.edit = false; e.dirty = false; rebuild(e, { keepScroll: false }); break;
    case "sup-active":
      if (e.form.active && !(await confirmDlg({ title: "Make this supplier non-active?", body: "A non-active supplier cannot be used to create a purchase order.", ok: "Continue" }))) break;
      e.form.active = !e.form.active; e.dirty = true; rebuild(e); break;
    case "sup-submit": {
      e.form.errors = validateSup(e.form, true);
      if (Object.keys(e.form.errors).length) { rebuild(e); focusFirstError(e); break; }
      const s = DB.supById[e.id], f = e.form;
      Object.assign(s, { address: f.address, email: f.email.trim(), phones: f.phones.filter((x) => x.trim()), contacts: f.contacts, notes: f.notes, active: f.active });
      s.activity.push({ t: "Details edited", s: `Rina Wulandari · ${dayTime(new Date())}` });
      e.edit = false; e.dirty = false; rebuild(e, { keepScroll: false }); render(); markSelected(s.code); toast("Supplier saved"); break;
    }
    case "seg": e.item.unit = b.dataset.v; rebuild(e); break;
    case "pkp": e.form.pkp = !e.form.pkp; e.dirty = true; rebuild(e); break;
    case "add-phone": e.form.phones.push(""); e.dirty = true; rebuild(e); $$('[data-f="phone"]', e.el).pop()?.focus(); break;
    case "rm-phone": e.form.phones.splice(+b.dataset.i, 1); e.dirty = true; rebuild(e); break;
    case "add-contact": e.form.contacts.push({ name: "", role: "", phone: "", email: "" }); e.dirty = true; rebuild(e); $$('[data-f="c-name"]', e.el).pop()?.focus(); break;
    case "rm-contact": e.form.contacts.splice(+b.dataset.i, 1); e.dirty = true; rebuild(e); break;
    case "supnew-submit": {
      e.form.errors = validateSup(e.form, false);
      if (Object.keys(e.form.errors).length) { rebuild(e); focusFirstError(e); break; }
      const f = e.form, code = String(Math.max(0, ...DB.suppliers.map((s) => +s.code)) + 1).padStart(4, "0");
      const city = (f.address.split("\n").pop() || "").replace(/\d+/g, "").trim() || "—";
      const s = sup(code, f.name.trim(), f.legal, city, f.address, f.phones.filter((x) => x.trim()), f.email.trim(), f.npwp, f.pkp, f.contacts, f.notes);
      s.fresh = true; s.activity = [{ t: "Supplier created", s: `Rina Wulandari · ${dayTime(new Date())}` }];
      DB.suppliers.unshift(s); DB.supById[code] = s;
      const back = e.returnTo;
      await closeTop({ force: true });
      if (back) { back.form.supplier = code; delete back.form.errors.supplier; back.dirty = true; rebuild(back); toast(`${code} saved`); }
      else { render(); toast(`${code} saved`, { label: "Open", fn: () => openRecord("sup", code) }); }
      setTimeout(() => (s.fresh = false), 1700);
      break;
    }

    /* composer */
    case "pick-supplier":
      if (b.getAttribute("aria-disabled") === "true") break;
      if (mode() === "phone") openSheet("pick-sup"); else openPop(b, supplierPicker("compose"), { minWidth: b.offsetWidth });
      break;
    case "sup-choose": {
      if (b.dataset.mode === "filter") { S.supFilter = b.dataset.id; closePop(); render(); if (e) rebuild(e); break; }
      const comp = S.stack.find((x) => x.kind === "po-form");
      if (comp.form.supplier !== b.dataset.id && comp.form.lines.length) comp.form.lines = [];
      comp.form.supplier = b.dataset.id; delete comp.form.errors.supplier; comp.dirty = true;
      if (e && e.kind === "pick-sup") await closeTop(); else closePop();
      rebuild(comp); break;
    }
    case "create-sup": {
      const comp = S.stack.find((x) => x.kind === "po-form");
      closePop(true); if (e && e.kind === "pick-sup") await closeTop();
      openSheet("sup-form", { form: newSupForm(), returnTo: comp }); break;
    }
    case "browse": openSheet("item", { item: { view: "list", q: "" } }); break;
    case "new-item": openSheet("item", { item: { view: "edit", isNew: true, name: "", division: "", unit: "pcs", qty: "", price: "", errors: {} } }); break;
    case "line-edit": {
      const l = e.form.lines[+b.dataset.i];
      openSheet("item", { item: { view: "edit", idx: +b.dataset.i, isNew: !l.a, code: l.a, custom: l.custom, name: l.custom?.name || "", division: l.custom?.division || "", unit: l.unit, qty: NF2.format(l.qty), price: NF.format(l.price), errors: {} } });
      break;
    }
    case "line-rm": e.form.lines.splice(+b.dataset.i, 1); e.dirty = true; rebuild(e); break;
    case "item-pick": { const a = DB.artById[b.dataset.code]; Object.assign(e.item, { view: "edit", fromList: true, code: a.code, unit: a.unit, price: NF.format(a.price), qty: "", errors: {} }); rebuild(e, { keepScroll: false, anim: "view-in" }); if (!isTouch) $("#i-qty", e.el)?.focus(); break; }
    case "item-back": e.item.view = "list"; rebuild(e, { keepScroll: false, anim: "view-back" }); break;
    case "item-save": {
      const it = e.item, er = {}, q = parseNum(it.qty), pr = digits(it.price), pc = q * UNITS[it.unit];
      if (it.isNew && !it.name.trim()) er.name = "Give the item a name.";
      if (!(q > 0)) er.qty = "Fill in how many.";
      else if (Math.abs(pc - Math.round(pc)) > 1e-9) er.qty = `That is ${NF2.format(pc)} pcs — a count is whole pieces.`;
      if (!(pr > 0)) er.price = "Fill in the price.";
      it.errors = er;
      if (Object.keys(er).length) { rebuild(e); focusFirstError(e); break; }
      const comp = S.stack.find((x) => x.kind === "po-form");
      const line = { a: it.isNew ? null : it.code, custom: it.isNew ? { name: it.name.trim(), division: it.division, tags: [] } : undefined, unit: it.unit, qty: q, price: Math.round(pr), rec: [] };
      if (it.idx != null) comp.form.lines[it.idx] = { ...comp.form.lines[it.idx], ...line, rec: comp.form.lines[it.idx].rec || [] };
      else comp.form.lines.push(line);
      delete comp.form.errors.lines; comp.dirty = true; comp.form.fresh = it.idx != null ? it.idx : comp.form.lines.length - 1;
      await closeTop({ force: true });
      rebuild(comp); comp.form.fresh = null;
      break;
    }
    case "review-order":
      e.form.errors = validatePO(e.form);
      if (Object.keys(e.form.errors).length) { rebuild(e); focusFirstError(e); break; }
      e.form.step = "review"; rebuild(e, { keepScroll: false, anim: "view-in" }); break;
    case "back-edit": e.form.step = "edit"; rebuild(e, { keepScroll: false, anim: "view-back" }); break;
    case "submit-po": {
      b.disabled = true; b.innerHTML = `<span class="spin"></span>Submitting…`;
      await new Promise((r) => setTimeout(r, 700));
      const f = e.form, wasEdit = !!f.editNo;
      let target;
      if (wasEdit) {
        target = DB.pos.find((x) => x.no === f.editNo);
        Object.assign(target, { delivery: new Date(f.delivery + "T00:00"), terms: f.terms, method: f.method, discountPct: f.discPct, notes: f.notes, tnc: f.tnc,
          lines: f.lines.map((l) => ({ a: l.a, custom: l.custom, unit: l.unit, qty: l.qty, price: l.price, rec: l.rec || [] })) });
      } else {
        target = po(nextPONo(), f.supplier, "Rina Wulandari", new Date(TODAY.getTime() + 10 * 36e5), new Date(f.delivery + "T00:00"),
          f.lines.map((l) => ({ a: l.a, custom: l.custom, unit: l.unit, qty: l.qty, price: l.price, rec: [] })), { method: f.method, terms: f.terms, discount: f.discPct, notes: f.notes, tnc: f.tnc });
        DB.pos.unshift(target);
      }
      derive(DB, target);
      target.fresh = !wasEdit; e.dirty = false;
      await closeTop({ force: true });
      if (!wasEdit) { S.screen = "po"; S.poTab = "open"; S.overdueOnly = false; }
      render();
      const under = S.stack.find((x) => x.kind === "po" && x.id === target.no); if (under) rebuild(under);
      toast(wasEdit ? `${target.no} updated` : `${target.no} created`, wasEdit ? null : { label: "Open", fn: () => openRecord("po", target.no) });
      setTimeout(() => (target.fresh = false), 1700);
      break;
    }
  }
});
document.addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
});

/* typing updates in place — never a re-render under the caret */
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "q") { S.q = t.value; refreshRegion(); return; }
  if (t.id === "supq") { S.supQ = t.value; refreshRegion(); return; }
  if (t.dataset.pickq) { $('[data-o="picklist"]', t.closest(".pop, .sheet")).innerHTML = supplierListHTML(t.value, t.dataset.pickq); return; }
  const e = entryOf(t); if (!e) return;
  if (t.dataset.itemq !== undefined) {
    e.item.q = t.value; const s = DB.supById[S.stack.find((x) => x.kind === "po-form").form.supplier], q = t.value.toLowerCase();
    $('[data-o="catlist"]', e.el).innerHTML = catRows(DB.articles.filter((a) => a.sup === s.code && (!q || a.name.toLowerCase().includes(q) || a.code.toLowerCase().includes(q)))); return;
  }
  clearErr(t);
  if (t.dataset.if) {
    e.item[t.dataset.if] = t.value; e.dirty = true;
    const it = e.item, f = UNITS[it.unit], q = parseNum(it.qty), pr = digits(it.price), pc = q * f;
    const h = $('[data-o="hint-i-qty"]', e.el); if (h) h.textContent = isFinite(pc) && pc > 0 && it.unit !== "pcs" ? `= ${NF2.format(pc)} pcs` : "";
    $('[data-o="iamt"]', e.el).textContent = rp(isFinite(pc) && isFinite(pr) ? Math.round((Math.round(pc) * pr) / f) : 0);
    return;
  }
  const k = t.dataset.f; if (!k) return;
  const f = e.form; e.dirty = true;
  if (k === "phone") f.phones[+t.dataset.i] = t.value;
  else if (k.startsWith("c-")) f.contacts[+t.dataset.i][k.slice(2)] = t.value;
  else if (k === "npwp") { const d = t.value.replace(/\D/g, "").slice(0, 16); if (d !== t.value) t.value = d; f.npwp = d; const h = $('[data-o="hint-f-npwp"]', e.el); if (h) h.textContent = d.length ? `${d.length} / 16` : "16 digits"; }
  else if (k === "discPct") { f.discPct = Math.min(100, Math.max(0, parseNum(t.value) || 0)); const T = formTotals(f); $("#f-da", e.el).value = T.disc ? NF.format(T.disc) : ""; const o = $('[data-o="net"]', e.el); if (o) o.textContent = rp(T.net); }
  else if (k === "discAmt") { const g = formTotals(f).gross, a = Math.min(g, digits(t.value) || 0); f.discPct = g ? Math.round((a / g) * 10000) / 100 : 0; $("#f-dp", e.el).value = f.discPct ? NF2.format(f.discPct) : ""; const o = $('[data-o="net"]', e.el); if (o) o.textContent = rp(formTotals(f).net); }
  else f[k] = t.value;
});
document.addEventListener("change", (ev) => {
  const t = ev.target, e = entryOf(t); if (!e) return;
  if (["terms", "delivery", "method", "legal"].includes(t.dataset.f)) { e.form[t.dataset.f] = t.value; e.dirty = true; if (e.form.errors) delete e.form.errors[t.dataset.f]; if (t.dataset.f === "legal" || t.dataset.f === "delivery") clearErr(t); }
  if (t.dataset.if === "division") e.item.division = t.value;
  if (t.dataset.f === "discPct" || t.dataset.f === "discAmt") rebuild(e);
});
document.addEventListener("focusout", (ev) => {
  const t = ev.target, e = entryOf(t);
  // the percent is what the PO keeps (2 decimals); the amount snaps to it, rounded once
  if (t.id === "f-da" && e) { const d = formTotals(e.form).disc; t.value = d ? NF.format(d) : ""; }
  if (t.id === "i-price" && t.value) { const v = digits(t.value); if (isFinite(v)) { t.value = NF.format(v); if (e) e.item.price = t.value; } }
});
function clearErr(t) {
  if (t.getAttribute("aria-invalid") !== "true") return;
  t.removeAttribute("aria-invalid");
  t.closest(".fld")?.querySelectorAll(".err").forEach((x) => x.remove());
  const e = entryOf(t);
  if (e?.form?.errors) delete e.form.errors[t.dataset.f === "phone" ? "phone" + t.dataset.i : t.dataset.f];
  if (e?.item?.errors) delete e.item.errors[t.dataset.if];
}

/* keyboard: instant, never animated */
document.addEventListener("keydown", (ev) => {
  const typing = ev.target.closest("input, textarea, select, [contenteditable]");
  if (ev.key === "Escape") {
    if (S.dlg) { S.dlg(false); ev.preventDefault(); return; }
    if (S.pop) { closePop(true); ev.preventDefault(); return; }
    if (S.stack.length) { closeTop({ instant: true }); ev.preventDefault(); }
    return;
  }
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey || S.dlg) return;
  if (ev.key === "/" && !S.stack.length) { ev.preventDefault(); ($("#q") || $("#supq"))?.focus(); }
  if ((ev.key === "n" || ev.key === "N") && !S.stack.length) { ev.preventDefault(); S.screen === "sup" ? newSup(true) : newPO(true); }
});
$("#fab").addEventListener("click", () => (S.screen === "sup" ? newSup() : newPO()));

/* ── prototype chrome ─────────────────────────────────────────────────── */
const segPress = (seg, btn) => $$("button", seg).forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
$("#devSeg").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (!b) return; segPress($("#devSeg"), b); S.device = b.dataset.dev; fit(); });
$("#rotate").addEventListener("click", () => { S.landscape = !S.landscape; if (S.device !== "tablet") { S.device = "tablet"; segPress($("#devSeg"), $('[data-dev="tablet"]')); } fit(); });
$("#slowSeg").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (!b) return; segPress($("#slowSeg"), b); document.documentElement.style.setProperty("--slow", b.dataset.slow); });
$("#dataSeg").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return; segPress($("#dataSeg"), b);
  S.set = b.dataset.set; DB = DATASETS[S.set](); S.limit = 400;
  S.stack.splice(0).forEach((x) => x.el.remove()); updateStack(); closePop(true);
  S.supFilter = ""; S.overdueOnly = false; render();
});
const qp = new URLSearchParams(location.search);
if (qp.get("device")) { S.device = qp.get("device"); segPress($("#devSeg"), $(`[data-dev="${S.device}"]`)); }
if (qp.get("landscape")) S.landscape = true;
if (qp.get("data") && DATASETS[qp.get("data")]) { S.set = qp.get("data"); DB = DATASETS[S.set](); segPress($("#dataSeg"), $(`[data-set="${S.set}"]`)); }
if (qp.get("screen")) S.screen = qp.get("screen");
fit(); lastMode = mode(); render();
</script>
