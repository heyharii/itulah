<!doctype html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Pasangan LINK-IN-BIO-PLAN.md · 2026-09-06 · enam usaha, desktop/ponsel, editor; satu perender.
     Buka langsung sebagai berkas, atau lewat entri prototypes-static di .claude/launch.json.
     Font dari Google Fonts, pustaka QR dari cdnjs; tanpa keduanya halaman tetap terbaca. -->
<meta charset="utf-8">
<title>Prototipe Halaman Toko</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF; --ink:#0E0E0E; --muted:#787878; --muted-2:#A8A8A8; --line:rgba(0,0,0,.08); --soft:#F4F4F5;
    --cell:172px; --gap:28px; --r:28px;
    --ease:cubic-bezier(.16,1,.3,1);
    --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;color-scheme:light}
  button{font:inherit}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} html{scroll-behavior:auto} }

  /* ── Bilah atas ─────────────────────────────────────────────────────── */
  .bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .brand{font:700 13px var(--font);letter-spacing:-.01em;white-space:nowrap}
  .brand span{color:var(--muted);font-weight:500;margin-left:6px}
  .tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;padding:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:0;background:transparent;color:var(--muted);font:600 13px var(--font);padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .25s var(--ease),color .25s var(--ease)}
  .tab:hover{background:var(--soft);color:var(--ink)}
  .tab.on{background:var(--ink);color:#fff}
  .ctrls{display:flex;align-items:center;gap:8px}
  .seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);font:600 12.5px var(--font);padding:6px 11px;border-radius:9px;cursor:pointer;transition:.2s}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .btn{border:0;border-radius:999px;padding:8px 15px;font:700 13px var(--font);cursor:pointer;background:var(--ink);color:#fff;transition:transform .2s var(--ease),background .2s;white-space:nowrap}
  .btn:hover{transform:translateY(-1px)}
  .btn.ghost{background:var(--soft);color:var(--ink)}
  .btn.hidden{display:none}
  @media (max-width:720px){ .brand span{display:none} .bar{gap:8px;padding:8px 12px} }

  /* ── Halaman ────────────────────────────────────────────────────────── */
  .stage{min-height:calc(100vh - 57px);position:relative}
  .page{display:grid;grid-template-columns:minmax(240px,360px) max-content;gap:72px;justify-content:center;align-items:start;padding:72px 40px 140px;max-width:1280px;margin:0 auto}
  .page.stack{grid-template-columns:minmax(0,1fr);gap:36px;padding:36px 20px 140px;max-width:640px}
  .profile{position:sticky;top:92px;animation:rise .7s var(--ease) both}
  .page.stack .profile{position:static}
  .avatar{width:184px;height:184px;border-radius:50%;display:grid;place-items:center;font:800 60px var(--font);letter-spacing:-.04em;color:#fff;background:#ddd center/cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 20px 50px -20px rgba(0,0,0,.25);text-shadow:0 2px 12px rgba(0,0,0,.25)}
  .page.stack .avatar{width:112px;height:112px;font-size:38px}
  .name{font:800 44px/1.04 var(--font);letter-spacing:-.035em;margin:30px 0 14px;text-wrap:balance}
  .page.stack .name{font-size:32px;margin:18px 0 10px}
  .bio{font:500 17px/1.55 var(--font);color:var(--muted);max-width:32ch;margin:0 0 18px;text-wrap:pretty}
  .page.stack .bio{font-size:15.5px;max-width:none}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font:600 13.5px var(--font);color:var(--muted)}
  .meta .st{display:inline-flex;align-items:center;gap:7px}
  .meta .dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.16)}
  .meta .dot.off{background:#C4C4C4;box-shadow:0 0 0 4px rgba(0,0,0,.05)}
  .gridwrap{min-width:0}
  .grid{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);gap:var(--gap);grid-auto-flow:dense;position:relative;width:calc(var(--cols)*var(--cell) + (var(--cols) - 1)*var(--gap))}
  .grid.editing{touch-action:none}
  .slot{position:relative;min-width:0;will-change:transform}
  .w2{grid-column:span 2}.h2{grid-row:span 2}
  .slot.pop{animation:pop .65s var(--ease) both;animation-delay:calc(var(--i)*38ms)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .tile{position:relative;display:flex;flex-direction:column;width:100%;height:100%;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.035);padding:20px;color:var(--ink);overflow:hidden;cursor:pointer;text-align:left;transition:transform .4s var(--ease),box-shadow .4s var(--ease);will-change:transform}
  .tile:hover{transform:scale(1.024);box-shadow:0 18px 44px -8px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.04)}
  .tile:active{transform:scale(.985)}
  .grid.editing .tile{cursor:grab}
  .grid.editing .tile:active{cursor:grabbing}
  .tile.bleed{padding:0}
  .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);background:#111}
  .ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ico svg.f{fill:currentColor;stroke:none}
  .ico b{font:800 14px var(--font);letter-spacing:-.03em}
  .ico b.s{font-size:10.5px;letter-spacing:-.02em}
  .ico.soft{background:var(--soft);color:var(--ink);box-shadow:none}
  .ico.ring{background:#fff;color:#1A73E8;box-shadow:inset 0 0 0 1px var(--line)}
  .tt{margin-top:13px;min-width:0}
  .tl{display:block;font:700 15.5px/1.25 var(--font);letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tm{display:block;font:500 12.5px/1.35 var(--font);color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font:700 12px var(--font);color:#fff;background:var(--bc,#111);margin-top:auto;align-self:flex-start;white-space:nowrap}
  .pill.lite{background:var(--soft);color:var(--ink)}
  .h2 .pill,.w2 .pill{margin-top:auto}
  .side{position:absolute;right:0;top:0;bottom:0;width:46%;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .side .big{width:112px;height:112px;border-radius:32px;opacity:.10;display:grid;place-items:center;color:#000}
  .side .big svg{width:64px;height:64px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .bubble{background:#DCF8C6;color:#0B3B1C;border-radius:16px 16px 16px 4px;padding:10px 12px;font:500 12.5px/1.4 var(--font);max-width:88%;box-shadow:0 2px 6px rgba(0,0,0,.06);position:relative}
  .bubble small{display:block;text-align:right;font-size:10px;color:#4E7A5B;margin-top:3px}
  /* foto & galeri */
  .photo{position:absolute;inset:0;background:#e5e5e5 center/cover no-repeat}
  .cap{position:absolute;left:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:6px 11px;font:600 12px var(--font);color:#111;box-shadow:0 2px 10px rgba(0,0,0,.14);max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .collage{position:absolute;inset:0;display:grid;gap:3px;background:#fff}
  .collage.c3{grid-template-columns:1.2fr 1fr 1fr}
  .collage.c4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .collage.c2{grid-template-columns:1fr 1fr}
  .collage.c2v{grid-template-rows:1fr 1fr}
  .collage div{background:#e5e5e5 center/cover}
  /* katalog & menu */
  .items{display:grid;gap:10px;margin-top:14px;min-width:0}
  .items.g2{grid-template-columns:1fr 1fr}
  .items.row{grid-template-columns:repeat(3,1fr)}
  .it{display:grid;gap:6px;min-width:0}
  .it .ph{aspect-ratio:1;border-radius:14px;background:#eee center/cover}
  .it.h .ph{aspect-ratio:auto;height:56px}
  .it b{font:700 12.5px/1.2 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it span{font:600 12px var(--font);color:var(--muted);font-variant-numeric:tabular-nums}
  .list{display:grid;gap:9px;margin-top:12px}
  .list .li{display:flex;align-items:center;gap:10px;min-width:0}
  .list .li i{width:36px;height:36px;border-radius:10px;background:#eee center/cover;flex:none}
  .list .li b{font:700 12.5px var(--font);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .li span{font:600 12px var(--font);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .cat{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:#fff}
  .cat div{position:relative;background:#eee center/cover;overflow:hidden}
  .cat div span{position:absolute;left:10px;right:10px;bottom:9px;display:flex;justify-content:space-between;gap:6px;font:700 11px var(--font);color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55)}
  .cat div span em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* teks */
  .txt .tl{font-size:17px;-webkit-line-clamp:3}
  .txt .tm{white-space:normal;-webkit-line-clamp:4;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.45;margin-top:8px}
  /* jam */
  .days{display:flex;gap:5px;margin-top:auto}
  .days i{flex:1;height:30px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font:700 10px var(--font);color:var(--muted);font-style:normal}
  .days i.on{background:#111;color:#fff}
  .days i.x{background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:#C9C9C9}
  /* ulasan */
  .stars{color:#F5A623;font-size:13px;letter-spacing:1px;margin-top:4px}
  /* peta */
  .map{position:absolute;inset:0;background:#EEEDE7}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .pin{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#EA4335;box-shadow:0 0 0 3px #fff,0 4px 12px rgba(0,0,0,.3)}
  .pin::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(234,67,53,.55);animation:pulse 2.2s var(--ease) infinite}
  @keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
  .pfoot{grid-column:1/-1;display:flex;justify-content:space-between;font:600 12.5px var(--font);color:var(--muted-2);padding-top:8px}
  .pfoot a:hover{color:var(--ink)}

  /* ── Ponsel ─────────────────────────────────────────────────────────── */
  .device{width:390px;height:812px;margin:44px auto 120px;border-radius:52px;background:#fff;box-shadow:0 0 0 11px #0f0f0f,0 0 0 13px #2a2a2a,0 50px 100px -30px rgba(0,0,0,.45);overflow:hidden;position:relative;animation:rise .7s var(--ease) both}
  .device .page{display:block;padding:52px 20px 48px;height:100%;overflow-y:auto;scrollbar-width:none;max-width:none;margin:0}
  .device .page::-webkit-scrollbar{display:none}
  .device .profile{position:static;animation:none;margin-bottom:26px}
  .device .avatar{width:96px;height:96px;font-size:32px}
  .device .name{font-size:30px;margin:16px 0 8px}
  .device .bio{font-size:14.5px;margin-bottom:12px}
  .device .meta{font-size:12.5px}
  .device .grid{--cols:2;--cell:168px;--gap:14px}
  .device .tile{padding:16px;--r:24px}
  .device .ico{width:36px;height:36px;border-radius:11px}
  .device .tl{font-size:14.5px}
  .device .pfoot{padding-top:16px}
  .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:999px;background:#0f0f0f;z-index:2}
  @media (max-width:440px){ .device{width:100%;height:auto;min-height:720px;border-radius:0;box-shadow:none;margin:0} .device .page{height:auto} .notch{display:none} }

  /* ── Editor ─────────────────────────────────────────────────────────── */
  .slot.sel .tile{box-shadow:0 0 0 2px var(--ink),0 18px 44px -8px rgba(0,0,0,.16)}
  .slot.dragging .tile{opacity:.18;transform:none!important;box-shadow:none}
  .slot.over .tile{transform:scale(.97)}
  .tb{position:absolute;z-index:6;display:flex;align-items:center;gap:2px;padding:5px;background:#111;color:#fff;border-radius:14px;box-shadow:0 14px 34px -6px rgba(0,0,0,.45);transform:translate(-50%,10px);animation:pop .35s var(--ease) both}
  .tb button{border:0;background:transparent;color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer;display:grid;place-items:center;opacity:.7;transition:.15s}
  .tb button:hover,.tb button.on{opacity:1;background:rgba(255,255,255,.14)}
  .tb button svg{width:16px;height:16px}
  .tb .sep{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 4px}
  .ghost{position:fixed;z-index:60;pointer-events:none;border-radius:var(--r);transform-origin:center;box-shadow:0 40px 80px -20px rgba(0,0,0,.45);transition:transform .08s linear}
  .ghost .tile{transform:scale(1.045);box-shadow:none;cursor:grabbing}
  [contenteditable="true"]{cursor:text;outline:none;border-radius:4px}
  [contenteditable="true"]:hover{background:rgba(0,0,0,.04)}
  [contenteditable="true"]:focus{background:rgba(0,0,0,.05);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
  .addbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:flex;gap:6px;align-items:center;background:#111;border-radius:22px;padding:8px;box-shadow:0 24px 60px -10px rgba(0,0,0,.5);animation:pop .45s var(--ease) both;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
  .addbar input{border:0;background:rgba(255,255,255,.1);color:#fff;font:600 13.5px var(--font);border-radius:14px;padding:10px 14px;width:min(320px,60vw);outline:none}
  .addbar input::placeholder{color:rgba(255,255,255,.5)}
  .addbar input:focus{background:rgba(255,255,255,.16)}
  .addbar .ab{border:0;background:transparent;color:#fff;font:600 12.5px var(--font);padding:9px 11px;border-radius:12px;cursor:pointer;opacity:.8;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .addbar .ab:hover{opacity:1;background:rgba(255,255,255,.12)}
  .addbar .ab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .addbar .go{background:#fff;color:#111;opacity:1}
  .addbar .go:disabled{opacity:.35;cursor:default}
  .detect{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:40;font:600 12.5px var(--font);color:#fff;background:#111;padding:6px 12px;border-radius:999px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:pop .3s var(--ease) both;white-space:nowrap}

  /* ── Modal & toast ──────────────────────────────────────────────────── */
  .modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.32);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fade .25s var(--ease) both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{width:min(540px,100%);max-height:84vh;background:#fff;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 100px -20px rgba(0,0,0,.4);animation:pop .45s var(--ease) both}
  .card.narrow{width:min(360px,100%)}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 24px 12px}
  .ch b{font:800 22px/1.1 var(--font);letter-spacing:-.025em}
  .ch span{display:block;font:500 13px var(--font);color:var(--muted);margin-top:3px}
  .x{border:0;background:var(--soft);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;transition:.15s}
  .x:hover{background:#e8e8ea}
  .x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .chips{display:flex;gap:6px;padding:4px 24px 14px;overflow-x:auto;scrollbar-width:none;flex:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;border-radius:999px;padding:7px 13px;font:600 12.5px var(--font);background:var(--soft);color:var(--ink);cursor:pointer;transition:.15s}
  .chip.on{background:var(--ink);color:#fff}
  .mlist{overflow-y:auto;padding:0 24px 24px;display:grid;gap:14px}
  .mi{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center}
  .mi .mp{width:60px;height:60px;border-radius:16px;background:#eee center/cover}
  .mi b{display:block;font:700 14.5px var(--font);letter-spacing:-.01em}
  .mi small{display:block;font:500 12.5px var(--font);color:var(--muted);margin-top:2px}
  .mi .mr{display:grid;gap:6px;justify-items:end}
  .mi .pr{font:700 13.5px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
  .mi .pr small{display:inline;color:var(--muted);font-weight:600;margin-left:1px}
  .pill.wa{--bc:#25D366;margin:0}
  .qwrap{display:grid;gap:12px;justify-items:center;padding:8px 24px 24px;text-align:center}
  .qr{width:220px;height:220px;display:grid;place-items:center;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);padding:12px;background:#fff}
  .qr canvas,.qr img{width:196px!important;height:196px!important;image-rendering:pixelated}
  .qr table{border-collapse:collapse}
  .qname{font:800 17px var(--font);letter-spacing:-.02em}
  .qnote{font:500 12.5px var(--font);color:var(--muted);margin-top:-6px}
  .qbtns{display:flex;gap:8px;width:100%;margin-top:6px}
  .qbtns .btn{flex:1}
  .fields{padding:0 24px 24px;display:grid;gap:14px;overflow-y:auto}
  .fld{display:grid;gap:6px}
  .fld label{font:600 11.5px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .fld input,.fld textarea{font:500 14.5px var(--font);color:var(--ink);background:var(--soft);border:0;border-radius:12px;padding:11px 13px;width:100%;resize:none;outline:none}
  .fld input:focus,.fld textarea:focus{box-shadow:0 0 0 2px var(--ink)}
  .hint{font:500 13px var(--font);color:var(--muted);margin:0}
  .toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:70;background:#111;color:#fff;font:600 13px var(--font);padding:10px 16px;border-radius:999px;opacity:0;transition:.35s var(--ease);pointer-events:none;box-shadow:0 20px 40px -10px rgba(0,0,0,.4);white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .note{max-width:1200px;margin:0 auto;padding:0 40px 60px;color:var(--muted);font:500 13px/1.6 var(--font)}
</style>

</head>
<body>
<div class="bar">
  <div class="brand">Prototipe halaman toko<span>enam usaha · satu perender</span></div>
  <nav class="tabs" id="tabs" aria-label="Usaha"></nav>
  <div class="ctrls">
    <div class="seg" id="device"><button type="button" data-dev="desktop" class="on">Desktop</button><button type="button" data-dev="phone">Ponsel</button></div>
    <button type="button" class="btn ghost hidden" id="publish">Terbitkan</button>
    <button type="button" class="btn" id="edit">Edit</button>
  </div>
</div>

    const g = grid(); if (!g) return; g.querySelectorAll('.tb').forEach(x => x.remove());
    g.querySelectorAll('.slot').forEach(s => s.classList.toggle('sel', s.dataset.id === S.sel));
    if (!S.sel) return; const s = g.querySelector('[data-id="' + S.sel + '"]'); if (!s){ S.sel = null; return; }
    const t = page().tiles.find(x => x.id === S.sel);
    const sz = [[1,1,'Kecil'],[2,1,'Lebar'],[1,2,'Tinggi'],[2,2,'Besar']].map(z => '<button type="button" class="' + (z[0]===t.w && z[1]===t.h ? 'on' : '') + '" data-size="' + z[0] + 'x' + z[1] + '" title="' + z[2] + '" aria-label="' + z[2] + '"><svg viewBox="0 0 12 12">' + [[0,0],[1,0],[0,1],[1,1]].map(c => '<rect x="' + (c[0]*7) + '" y="' + (c[1]*7) + '" width="5" height="5" rx="1.2" fill="currentColor" opacity="' + ((c[0] < z[0] && c[1] < z[1]) ? 1 : .28) + '"/>').join('') + '</svg></button>').join('');
    const tb = document.createElement('div'); tb.className = 'tb';
    tb.innerHTML = sz + '<span class="sep"></span><button type="button" data-move="-1" title="Geser ke depan" aria-label="Geser ke depan">' + IC.left + '</button><button type="button" data-move="1" title="Geser ke belakang" aria-label="Geser ke belakang">' + IC.right + '</button><span class="sep"></span><button type="button" data-fields title="Ubah isi" aria-label="Ubah isi">' + IC.pencil + '</button><button type="button" data-del title="Hapus" aria-label="Hapus">' + IC.trash + '</button>';
    tb.querySelectorAll('svg').forEach(v => { v.style.cssText = 'width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round'; if (v.getAttribute('viewBox') === '0 0 12 12') v.style.cssText = 'width:14px;height:14px'; });
    tb.style.left = (s.offsetLeft + s.offsetWidth / 2) + 'px'; tb.style.top = (s.offsetTop + s.offsetHeight) + 'px';
    g.appendChild(tb);
  }
  const FIELDS = {
    wa:[['label','Tulisan di tile','input'],['msg','Awal pesan WhatsApp','textarea']], brand:[['handle','Nama akun / keterangan','input']], link:[['label','Tulisan di tile','input'],['url','Alamat tautan','input']],
    text:[['heading','Judul','input'],['body','Isi','textarea']], promo:[['title','Judul promo','input'],['line','Keterangan','input'],['until','Berlaku sampai','input']],
    menu:[['label','Nama tile','input']], catalog:[['label','Nama tile','input']], photo:[['caption','Keterangan','input']], review:[['rating','Nilai','input'],['count','Jumlah ulasan','input']],
    maps:[['@address','Alamat lengkap','input'],['@area','Nama daerah di peta','input']], hours:[['@open','Buka (jj:mm)','input'],['@close','Tutup (jj:mm)','input']], gallery:[], qris:[]
  };
  function fieldsModal(t){
    const p = page(), defs = FIELDS[t.type] || [];
    const inputs = defs.map(d => { const key = d[0], v = key[0] === '@' ? (key === '@address' ? p.address : key === '@area' ? p.area : (p.hours[key.slice(1)] || '')) : (t[key] == null ? '' : t[key]);
      return '<div class="fld"><label>' + esc(d[1]) + '</label>' + (d[2] === 'textarea' ? '<textarea rows="2" data-key="' + key + '">' + esc(v) + '</textarea>' : '<input type="text" data-key="' + key + '" value="' + esc(v) + '">') + '</div>'; }).join('');
    const m = openModal('<div class="ch"><div><b>' + esc(slotLabel(t)) + '</b><span>Perubahan langsung terlihat di halaman</span></div>' + xbtn + '</div><div class="fields">' + (inputs || '<p class="hint">Tile ini tidak punya teks. Ukuran dan urutannya diatur lewat toolbar hitam di bawah tile.</p>') + '</div>', true);
    m.addEventListener('input', ev => { const i = ev.target.closest('[data-key]'); if (!i) return; const key = i.dataset.key;
      if (key === '@address') p.address = i.value; else if (key === '@area') p.area = i.value; else if (key[0] === '@') p.hours[key.slice(1)] = i.value; else t[key] = i.value;
      const s = grid().querySelector('[data-id="' + t.id + '"]'); if (s) s.innerHTML = tileInner(t, p, {edit:true}); if (key[0] === '@') stage.querySelector('.profile').outerHTML = profileHtml(p); });
  }
  const HOSTS = [[/gofood\.co\.id|gofood\.link/i,'gofood'],[/food\.grab\.com|grab\.onelink/i,'grabfood'],[/shopeefood|shopee\.co\.id\/m\/food/i,'shopeefood'],[/shopee\.co\.id|shp\.ee/i,'shopee'],[/tokopedia/i,'tokopedia'],[/shop\.tiktok|tiktok\.com\/.*shop/i,'tiktokshop'],[/tiktok\.com/i,'tiktok'],[/instagram\.com/i,'instagram'],[/youtube\.com|youtu\.be/i,'youtube'],[/grabmart|grab\.com\/id\/mart/i,'grabmart'],[/gomart/i,'gomart']];
  function detect(url){
    const u = url.trim(); if (!u) return null;
    if (/wa\.me|whatsapp\.com/i.test(u)) return {type:'wa', name:'WhatsApp'};
    if (/maps\.app\.goo\.gl|google\.[a-z.]+\/maps|goo\.gl\/maps|maps\.google/i.test(u)) return {type:'maps', name:'Google Maps'};
    for (const [re, b] of HOSTS) if (re.test(u)) return {type:'brand', brand:b, name:BRANDS[b].name};
    try { const h = new URL(/^https?:/i.test(u) ? u : 'https://' + u).hostname.replace(/^www\./, ''); if (!h.includes('.')) return null; return {type:'link', host:h, name:h}; } catch (e) { return null; }
  }
  function newTile(kind, extra){
    const p = page(), base = {id:nid(), w:1, h:1};
    const T = { text:{type:'text', w:2, heading:'Judul baru', body:'Tulis sesuatu untuk pembeli.'}, promo:{type:'promo', w:2, title:'Promo baru', line:'Keterangan', until:'30 Sep'},
      photo:{type:'photo', hue:Math.floor(Math.random()*360), kind:'none', caption:'Foto'}, gallery:{type:'gallery', w:2, shots:[[Math.floor(Math.random()*360),'none'],[120,'none'],[240,'none']]},
      hours:{type:'hours'}, qris:{type:'qris'}, review:{type:'review', rating:'5,0', count:1}, menu:{type:'menu', w:2, h:2, label:'Menu'}, maps:{type:'maps'},
      wa:{type:'wa', w:2, label:'Pesan via WhatsApp', msg:'Halo ' + p.name + ', saya mau pesan'} };
    return Object.assign(base, T[kind] || {type:'text', heading:kind, body:''}, extra || {});
  }
  function addTile(t){ flip(() => { page().tiles.push(t); rerenderGrid(); }); S.sel = t.id; syncSel(); toast('Tile ' + slotLabel(t) + ' ditambahkan'); }

  /* Addbar */
  let addbar = null;
  function toggleAddbar(){
    if (addbar){ addbar.remove(); addbar = null; const d = document.querySelector('.detect'); if (d) d.remove(); }
    if (!S.edit) return;
    addbar = document.createElement('div'); addbar.className = 'addbar';
    const ab = (k, label, icon) => '<button type="button" class="ab" data-add="' + k + '">' + icon + label + '</button>';
    addbar.innerHTML = '<input type="text" data-paste placeholder="Tempel tautan GoFood, Shopee, Maps, Instagram…" aria-label="Tempel tautan"><button type="button" class="ab go" data-go disabled>' + IC.plus + 'Tambah</button>' +
      ab('photo', 'Foto', IC.image) + ab('text', 'Teks', IC.text) + ab('maps', 'Peta', IC.pin) + ab('hours', 'Jam', IC.clock) + ab('promo', 'Promo', IC.tag) + ab('qris', 'QRIS', IC.qr) + ab('menu', 'Menu', IC.bowl);
    document.body.appendChild(addbar);
    const inp = addbar.querySelector('[data-paste]'), go = addbar.querySelector('[data-go]');
    const showDetect = d => { let el = document.querySelector('.detect'); if (!d){ if (el) el.remove(); go.disabled = true; return; } if (!el){ el = document.createElement('div'); el.className = 'detect'; document.body.appendChild(el); } el.textContent = d.type === 'link' ? 'Tautan ' + d.name + ' · jadi kartu tautan' : 'Dikenali: ' + d.name + ' · jadi tile ' + d.name; go.disabled = false; };
    inp.addEventListener('input', () => showDetect(detect(inp.value)));
    const commit = () => { const d = detect(inp.value); if (!d) return; const t = d.type === 'brand' ? newTile('brand', {type:'brand', brand:d.brand}) : d.type === 'link' ? newTile('link', {type:'link', host:d.host, label:d.host, url:inp.value.trim()}) : newTile(d.type); addTile(t); inp.value = ''; showDetect(null); };
    go.addEventListener('click', commit); inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') commit(); });
    addbar.addEventListener('click', ev => { const b = ev.target.closest('[data-add]'); if (b) addTile(newTile(b.dataset.add)); });
  }

  /* Interaksi editor: pilih, toolbar, teks inline, seret */
  function bindEditor(){
    const g = grid();
    g.addEventListener('click', ev => {
      const tb = ev.target.closest('.tb');
      if (tb){
        const t = page().tiles.find(x => x.id === S.sel); const i = page().tiles.indexOf(t);
        const sz = ev.target.closest('[data-size]'); if (sz){ const [w, h] = sz.dataset.size.split('x').map(Number); flip(() => { t.w = w; t.h = h; rerenderGrid(); }); return; }
        const mv = ev.target.closest('[data-move]'); if (mv){ const j = i + (+mv.dataset.move); if (j < 0 || j >= page().tiles.length) return; flip(() => { const a = page().tiles; [a[i], a[j]] = [a[j], a[i]]; rerenderGrid(); }); return; }
        if (ev.target.closest('[data-fields]')){ fieldsModal(t); return; }
        if (ev.target.closest('[data-del]')){ flip(() => { page().tiles.splice(i, 1); S.sel = null; rerenderGrid(); }); return; }
        return;
      }
      if (ev.target.isContentEditable) return;
      const slot = ev.target.closest('.slot'); if (!slot){ S.sel = null; syncSel(); return; }
      if (drag && drag.moved) return;
      S.sel = slot.dataset.id === S.sel ? null : slot.dataset.id; syncSel();
    });
    g.addEventListener('input', ev => { const el = ev.target.closest('[contenteditable]'); if (!el) return; const slot = el.closest('.slot'); const t = page().tiles.find(x => x.id === slot.dataset.id); t[el.dataset.k] = el.textContent; });
    g.addEventListener('keydown', ev => { if (ev.target.isContentEditable && ev.key === 'Enter'){ ev.preventDefault(); ev.target.blur(); } });
    g.addEventListener('pointerdown', onDown);
  }
  let drag = null;
  const prevent = e => e.preventDefault();
  function onDown(ev){
    if (!S.edit || ev.button > 0) return;
    const slot = ev.target.closest('.slot'); if (!slot || ev.target.closest('.tb') || ev.target.isContentEditable) return;
    drag = {id:slot.dataset.id, x0:ev.clientX, y0:ev.clientY, started:false, moved:false, timer:null, touch:ev.pointerType === 'touch', lastSwap:0};
    if (drag.touch) drag.timer = setTimeout(() => startDrag(ev.clientX, ev.clientY), 320);
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
  }
  function startDrag(x, y){
    const g = grid(), slot = g.querySelector('[data-id="' + drag.id + '"]'); if (!slot) return;
    const r = slot.getBoundingClientRect(); drag.started = true; drag.ox = x - r.left; drag.oy = y - r.top; drag.w = r.width; drag.h = r.height;
    const ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.style.cssText = 'left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px'; ghost.innerHTML = slot.innerHTML; ghost.querySelectorAll('.tb').forEach(x => x.remove());
    document.body.appendChild(ghost); drag.ghost = ghost; slot.classList.add('dragging'); S.sel = null; syncSel(); document.body.style.userSelect = 'none';
    document.addEventListener('touchmove', prevent, {passive:false});
  }
  function onMove(ev){
    if (!drag) return;
    const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0, dist = Math.hypot(dx, dy);
    if (!drag.started){ if (drag.touch){ if (dist > 10){ clearTimeout(drag.timer); cleanupDrag(); } return; } if (dist > 6) startDrag(ev.clientX, ev.clientY); else return; }
    drag.moved = true;
    drag.ghost.style.transform = 'translate(' + (ev.clientX - drag.ox - parseFloat(drag.ghost.style.left)) + 'px,' + (ev.clientY - drag.oy - parseFloat(drag.ghost.style.top)) + 'px)';
    const now = Date.now(); if (now - drag.lastSwap < 160) return;
    const el = document.elementFromPoint(ev.clientX, ev.clientY); const over = el && el.closest('.slot');
    if (!over || over.dataset.id === drag.id) return;
    const a = page().tiles, from = a.findIndex(t => t.id === drag.id), to = a.findIndex(t => t.id === over.dataset.id); if (from < 0 || to < 0) return;
    drag.lastSwap = now;
    flip(() => { const [m] = a.splice(from, 1); a.splice(to, 0, m); rerenderGrid(); const s = grid().querySelector('[data-id="' + drag.id + '"]'); if (s) s.classList.add('dragging'); });
  }
  function onUp(){
    if (!drag) return; clearTimeout(drag.timer);
    if (drag.started){
      const slot = grid().querySelector('[data-id="' + drag.id + '"]'), ghost = drag.ghost;
      if (slot){ const r = slot.getBoundingClientRect(); ghost.style.transition = 'transform .32s cubic-bezier(.16,1,.3,1)'; ghost.style.transform = 'translate(' + (r.left - parseFloat(ghost.style.left)) + 'px,' + (r.top - parseFloat(ghost.style.top)) + 'px)'; ghost.querySelector('.tile').style.transform = 'none'; ghost.querySelector('.tile').style.transition = 'transform .32s'; }
      const done = () => { ghost.remove(); if (slot) slot.classList.remove('dragging'); };
      setTimeout(done, 330);
      const wasMoved = drag.moved; cleanupDrag(); if (wasMoved) setTimeout(() => { drag = null; }, 50); return;
    }
    cleanupDrag();
  }
  function cleanupDrag(){ window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp); document.removeEventListener('touchmove', prevent); document.body.style.userSelect = ''; if (drag && !drag.started) drag = null; else if (drag && drag.started && !drag.moved) drag = null; }

  renderTabs(); render(true);
  setInterval(() => { if (!S.edit) render(false); }, 60000);
})();
</script>
