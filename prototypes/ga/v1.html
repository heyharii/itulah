*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#243831;background:#f5f6f2}button,input,select{font:inherit}button{cursor:pointer}aside{position:fixed;width:224px;height:100vh;background:#163e33;color:#e9f2e9;padding:27px 18px;overflow:auto}aside h2{margin:0 10px 35px;letter-spacing:-1px}aside small{color:#a5c6b5}nav button{display:block;border:0;background:none;color:#c5d8ce;padding:12px;width:100%;text-align:left;border-radius:7px;margin:3px 0}nav button.active{background:#d8edbb;color:#183c2d;font-weight:650}.sidefoot{margin-top:40px;padding:10px;font-size:12px;color:#a5c6b5}main{margin-left:224px;padding:28px 42px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;color:#7b8881;font-size:12px}.chip{display:inline-block;border-radius:20px;padding:5px 10px;background:#e9eee7;color:#4d6858;font-size:11px}.hero{margin:40px 0 25px;display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;letter-spacing:-1px;margin:0 0 8px}p{color:#718077;line-height:1.6}button.primary{background:#225e48;color:white;border:0;border-radius:7px;padding:11px 16px}.tabs{display:flex;gap:7px;border-bottom:1px solid #dce2d9;margin-bottom:25px;flex-wrap:wrap}.tabs button{border:0;background:none;padding:12px;color:#78847b}.tabs button.active{color:#214d38;border-bottom:2px solid #214d38;font-weight:650}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:25px}.card{padding:21px;background:white;border:1px solid #e0e5db;border-radius:9px}.card strong{display:block;font-size:27px;margin:9px 0}.card small{color:#758377}.panel{background:white;border:1px solid #e0e5db;border-radius:10px;overflow:hidden}.toolbar{padding:18px;display:flex;justify-content:space-between;align-items:center}input,select{padding:10px;border:1px solid #d8dfd5;border-radius:6px;background:white;color:#304839}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.6p </style><aside><h2>itulah<span style="color:#b6d798">.</span></h2><small>WORKSPACE / GA</small><nav id="nav"></nav><div class="sidefoot">C007 · Jakarta<br><br>Prototype interaktif<br>Data contoh · sesi browser</div></aside><main><div class="top"><span>Workspace / <b id="crumb"></b></span><span class="chip">24 September 2026 · Demo</span></div><div class="hero"><div><h1 id="title"></h1><p id="desc"></p></div><button class="primary" onclick="go('Finance','Bills')">Buka Finance ↗</button></div><div class="tabs" id="tabs"></div><div id="content"></div></main><dialog id="detail"></dialog><script>

{id:'AST-002',kind:'asset',group:'Register',name:'AC Daikin · AC-007-01',vendor:'PT Udara Sejuk',site:'C007',holder:'Tim GA',status:'Dalam perbaikan'},

{id:'LTR-001',kind:'letter',name:'Surat akses teknisi AC',site:'C007',status:'Terbit'}];
const bills=[{id:'BILL-001',ref:'CT-001',name:'Sewa tahun pertama',amount:400000000,status:'POSTED',period:'01 Jan — 31 Des 2027',prepaid:'12 bulan',account:'1038',paid:0},{id:'BILL-002',ref:'RP-001',name:'Perbaikan AC',amount:5400000,status:'POSTED',period:'September 2026',prepaid:'—',account:'6072',paid:5400000},{id:'BILL-003',ref:'CT-002',name:'PLN September',amount:3250000,status:'DRAFT',period:'September 2026',prepaid:'—',account:'6045',paid:0}];

let module='Contracts',tab='Sewa';const el=id=>document.getElementById(id),rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(){if(module==='Vendors')return vendors;if(module==='Finance')return tab==='Bills'?bills:[];return data.filter(r=>module==='Contracts'?r.kind==='contract'&&r.group===tab:module==='Assets'?r.kind==='asset'&&r.group===tab:module==='Maintenance'?r.kind===(tab==='Perbaikan'?'repair':'task'):module==='Fleet'?tab==='Vehicles'?r.vehicle:tab==='Documents'?r.kind==='contract'&&r.asset==='AST-001':['repair','task'].includes(r.kind)&&r.asset==='AST-001':module==='Workplace'?tab==='Utilities'?r.kind==='contract'&&r.group==='Langganan':r.kind===({Locations:'location',Supplies:'supply',Cleaning:'cleaning'}[tab]):r.kind==='letter');}
function go(m,t){module=m;tab=t??menus[m][0]??'';render()}
function render(){el('nav').innerHTML=Object.keys(menus).filter(m=>m!=='Finance').map(m=>`<button class="${m===module?'active':''}" onclick="go('${m}')">${m}</button>`).join('');el('crumb').textContent=module;el('title').textContent=module;el('desc').textContent=({Contracts:'Kesepakatan, masa berlaku, dan dokumen legal.',Assets:'Lokasi, kondisi, dan penanggung jawab setiap aset.',Fleet:'Kendaraan, servis, dan dokumen dalam satu tempat.',Workplace:'Kebutuhan sehari-hari setiap lokasi.',Finance:'Tagihan aktual dan periode layanan dikelola Finance.',Vendors:'Satu supplier untuk GA, Procurement, dan Finance.',Maintenance:'Pekerjaan perbaikan dan perawatan berkala.',Letters:'Administrasi surat dan dokumen keluar.'})[module];el('tabs').innerHTML=menus[module].map(t=>`<button class="${t===tab?'active':''}" onclick="go('${module}','${t}')">${t}</button>`).join('');let rs=rows();el('content').innerHTML=`<div class="cards"><div class="card"><small>${esc(tab||module)}</small><strong>${rs.length}</strong><small>Record pada tampilan ini</small></div><div class="card"><small>Lokasi kerja</small><strong>C007</strong><small>Contoh operasional toko Jakarta</small></div><div class="card"><small>Sumber data</small><strong style="font-size:21px">${module==='Finance'?'Finance':'Register bersama'}</strong><small>${module==='Fleet'||tab==='Utilities'?'Tampilan lain, ID tetap sama':'Terhubung melalui referensi'}</small></div></div><div class="panel"><div class="toolbar"><b>${esc(tab||module)}</b><input aria-label="Cari record" placeholder="Cari nama atau ID…" oninput="filterRows(this.value)"></div><table><thead><tr><th>Nama / record</th><th>${module==='Finance'?'Nominal':'Lokasi / pihak'}</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="note">${module==='Finance'?'Simulasi: buka bill dan ubah nominal atau status. Total di GA langsung mengikuti bill POSTED. Periode prepaid memakai periode bill.':module==='Fleet'?'Vehicles membuka aset yang sama dengan Assets. Service membaca Maintenance. Documents membaca kontrak atau dokumen kendaraan terkait.':tab==='Supplies'?'Supplies membutuhkan fakta operasional sendiri: permintaan, jumlah, dan pemakaian barang. Integrasi stok mengikuti Inventory; nominal invoice tetap di Finance.':tab==='Cleaning'?'Checklist adalah fakta pekerjaan. Kontrak vendor tetap di Contracts; biaya aktual berasal dari Finance.':'Klik record untuk membuka detail dan hubungan dengan Finance. Data contoh hanya bertahan selama halaman ini terbuka.'}</div>`;filterRows('')}
function filterRows(q){let rs=rows().filter(r=>(r.name+r.id).toLowerCase().includes(q.toLowerCase()));el('rows').innerHTML=rs.length?rs.map(r=>`<tr onclick="openRecord('${r.id}')"><td>${esc(r.name)}<small>${r.id}</small></td><td>${r.amount!==undefined?rupiah(r.amount):esc(r.site)}</td><td><span class="chip">${esc(r.status)}</span></td><td>↗</td></tr>`).join(''):`<tr><td colspan="4" class="empty">${module==='Finance'&&tab==='Tagihan rutin'?'Template Finance akan menunjuk kontrak. Belum ada template contoh.':'Belum ada record contoh untuk filter ini.'}</td></tr>`}
function openRecord(id){const r=[...data,...vendors,...bills].find(r=>r.id===id),isBill=bills.includes(r),linked=bills.filter(b=>b.ref===id),total=linked.filter(b=>b.status==='POSTED').reduce((n,b)=>n+b.amount,0);el('detail').innerHTML=`<button class="close" aria-label="Tutup" onclick="el('detail').close()">×</button><span class="chip">${isBill?'Finance':r.kind==='asset'?'Asset register':'GA'} · ${id}</span><h2>${esc(r.name)}</h2>${isBill?`<p>Referensi: <button class="link" onclick="openRecord('${r.ref}')">${r.ref} ↗</button></p><label>Nominal bill (IDR)</label><input id="amount" type="number" min="0" step="1" value="${r.amount}"><label>Status bill</label><select id="status"><option ${r.status==='DRAFT'?'selected':''}>DRAFT</option><option ${r.status==='POSTED'?'selected':''}>POSTED</option><option ${r.status==='CANCELLED'?'selected':''}>CANCELLED</option></select><div class="fields"><div><label>Periode tagihan</label><p>${r.period}</p></div><div><label>Jadwal prepaid</label><p>${r.prepaid}</p></div></div><p>Akun baris bill: ${r.account} · Dibayar: ${rupiah(r.paid)}</p><button class="primary" onclick="saveBill('${id}')">Simpan simulasi</button><p id="error"></p>`:r.kind==='asset'?`<label>Lokasi</label><select id="site">${['C007','C008','HO'].map(s=>`<option ${r.site===s?'selected':''}>${s}</option>`).join('')}</select><label>Pemegang</label><input id="holder" value="${esc(r.holder)}"><p>Kondisi: ${r.status}</p><button class="primary" onclick="saveAsset('${id}')">Simpan aset</button><div class="note">${r.vehicle?'Aset ini juga terlihat di Fleet → Vehicles. Ubah lokasi, lalu buka kedua tampilan untuk membuktikannya.':'Nilai buku dan penyusutan dikelola Finance.'}</div>`:r.kind==='vendor'?`<p>Profil supplier yang sama dibaca lintas modul.</p><label>Rekening pembayaran</label><p>${r.status}</p><label>Kontak demo</label><p>Administrasi vendor · kontak belum diisi</p><div class="note">Verifikasi rekening dilakukan Finance. Akun default vendor hanya usulan awal di bill.</div>`:`<p>${esc(r.vendor||r.site)} · ${esc(r.status)}</p>${r.period?`<label>Masa berlaku kontrak</label><p>${esc(r.period)}</p>`:''}${r.customer?`<p>ID pelanggan: ${r.customer}</p>`:''}${r.asset?`<p>Aset: <button class="link" onclick="openRecord('${r.asset}')">${r.asset} ↗</button></p>`:''}${r.contract?`<p>Kontrak: <button class="link" onclick="openRecord('${r.contract}')">${r.contract} ↗</button></p>`:''}${['contract','repair'].includes(r.kind)?`<div class="card"><small>${r.kind==='repair'?'Biaya aktual':'Total ditagih'} · Finance · hanya baca</small><strong>${rupiah(total)}</strong><small>Bill POSTED terkait · basis nominal demo tanpa pajak/kredit</small></div><label>Tagihan terkait</label>${linked.length?linked.map(b=>`<p><button class="link" onclick="openRecord('${b.id}')">${b.id} ↗</button> · ${rupiah(b.amount)} · ${b.status}<br><small>${b.period}</small></p>`).join(''):'<p>Belum ada bill terkait.</p>'}<div class="note">${r.group==='Disewakan'?'Kontrak disewakan memerlukan invoice pelanggan / AR, bukan supplier bill. Integrasi AR belum dicontohkan.':'Total ditagih bukan nilai legal kontrak atau sisa utang. Tidak ada input nominal di record GA pada prototype ini.'}</div>`:'<div class="note">Contoh register operasional. Form transaksi lengkap belum disimulasikan.</div>'}`}`;if(!el('detail').open)el('detail').showModal()}
function saveBill(id){let n=Number(el('amount').value);if(!el('amount').value||!Number.isFinite(n)||n<0){el('error').textContent='Isi nominal nol atau lebih.';return}const b=bills.find(b=>b.id===id);b.amount=n;b.status=el('status').value;el('detail').close();render();openRecord(b.ref)}
