<script type="module">
// Browser-local domain simulator. No production API calls.
const STAGES = ['waiting','picked','packed','staged','loaded','transit','received','gap','lost','wrong','returnTransit','returned'];
const LABELS = {waiting:'To pick',picked:'Picked',packed:'Packed',staged:'Surat jalan issued',loaded:'Loaded',transit:'In transit',received:'At intended store',gap:'Receiving discrepancy',lost:'Confirmed lost',wrong:'At wrong destination',returnTransit:'Return in progress',returned:'Returned · quarantine'};
const SKU = {'OX-NV-M':{name:'Oxford shirt',variant:'Navy · M'},'TS-WH-L':{name:'Essential tee',variant:'White · L'},'JN-IN-32':{name:'Straight jeans',variant:'Indigo · 32'}};
const STORES = ['Kemang','PIK Avenue','Cikupa'];
function line(id,store,sku,buckets,extra={}) {
  const stages=Object.fromEntries(STAGES.map(s=>[s,buckets[s]||0]));
  const target=Object.values(stages).reduce((a,b)=>a+b,0);
  return {id,store,sku,stages,target,original:target,added:0,removed:0,pending:[],hold:false,carton:`KOLI-${store==='Kemang'?'087':store==='PIK Avenue'?'088':'089'}`, ...extra};
}
function order(id,lines,extra={}) {return {id,supplier:'Garmen Nusantara',source:'HO · Gudang',revision:1,cancelled:false,hold:false,lines,queue:[],lastError:null,events:[{time:'11 Oct 2026 · 09:00',actor:'MD · Nadya',text:'Allotment created',detail:`${lines.reduce((s,l)=>s+l.target,0)} pieces · ${new Set(lines.map(l=>l.store)).size} stores`}], ...extra};}
function seed() {
  return {version:1,online:true,stock:{'OX-NV-M':180,'TS-WH-L':240,'JN-IN-32':96},orders:[
    order('ALT-001042',[
      line('a','Kemang','OX-NV-M',{waiting:20,picked:20,packed:40,transit:40}),
      line('b','Kemang','TS-WH-L',{packed:40}),
      line('c','PIK Avenue','OX-NV-M',{waiting:20,picked:20,packed:20,received:20}),
      line('d','Cikupa','JN-IN-32',{waiting:60})]),
    order('ALT-001043',[line('e','Kemang','TS-WH-L',{}, {original:50,removed:50,pending:[{id:'initial-e',stage:'packed',quantity:30,reason:'Store plan changed',actor:'MD · Nadya',time:'11 Oct 2026 · 10:12'}]}),line('f','PIK Avenue','JN-IN-32',{}, {original:20,removed:20,pending:[{id:'initial-f',stage:'picked',quantity:20,reason:'Store plan changed',actor:'MD · Nadya',time:'11 Oct 2026 · 10:12'}]})],{cancelled:true,events:[{time:'11 Oct 2026 · 10:12',actor:'MD · Nadya',text:'Allotment cancelled',detail:'70 pieces removed from demand · 50 pieces still need putting back'}]}),
    order('ALT-001044',[line('g','PIK Avenue','OX-NV-M',{waiting:5,received:95},{original:100,short:5,issue:{kind:'short',owner:'MD',quantity:5,resolved:false}})],{supplier:'Sentosa Apparel'}),
    order('ALT-001045',[line('h','Cikupa','TS-WH-L',{staged:40,loaded:20})],{supplier:'Sentosa Apparel'}),
    order('ALT-001046',[line('i','Kemang','JN-IN-32',{received:72})],{supplier:'Indigo Works'})
  ]};
}
const scenarios = [
  {id:'mixed',name:'Partial dispatch + MD edit',hint:'Reduce Kemang Oxford from 120 to 60, then switch to Warehouse.'},
  {id:'cancel',name:'Cancel during packing',hint:'Cancel 100 pieces. 30 release now; 70 stay blocked until physically returned.'},
  {id:'issued',name:'SJ issued, truck not left',hint:'Warehouse reverses the document first; MD can then change the released quantity.'},
  {id:'departed',name:'Cancel after departure',hint:'Close 40 unsent pieces. Handle the 60 already departed through a linked Return.'},
  {id:'short',name:'95 / 100 received',hint:'The remaining 5 are still needed. MD can wait or close that balance.'},
  {id:'receipt',name:'SJ 100 · counted 95',hint:'Delivery count is complete with a 5-piece discrepancy. Inventory establishes the facts first.'},
  {id:'lost',name:'Lost confirmed',hint:'Inventory has confirmed 5 lost. MD chooses no replacement or a linked replacement.'},
  {id:'wrong',name:'Wrong destination',hint:'20 pieces are at PIK, intended for Kemang. Return starts from the actual location.'},
  {id:'offline',name:'Warehouse offline',hint:'MD requests a change. It remains pending until the warehouse acknowledges it.'},
  {id:'conflict',name:'MD + warehouse together',hint:'Open Edit target and simulate the warehouse packing while the form is open.'},
  {id:'finished',name:'Finished + later return',hint:'A return stays linked to the completed allotment; history remains visible.'}
];
function scenario(id){
  const s=seed();
  const base = {
    mixed:s.orders[0],
    cancel:order('ALT-DEMO-CANCEL',[line('x','Kemang','OX-NV-M',{waiting:30,picked:20,packed:50})]),
    issued:s.orders[3],
    departed:order('ALT-DEMO-SENT',[line('x','Kemang','OX-NV-M',{waiting:20,packed:20,transit:60})]),
    short:s.orders[2],
    receipt:order('ALT-DEMO-RECEIPT',[line('x','Kemang','OX-NV-M',{received:95,gap:5},{issue:{kind:'gap',quantity:5,owner:'Inventory',resolved:false}})]),
    lost:order('ALT-DEMO-LOST',[line('x','Kemang','OX-NV-M',{received:95,lost:5},{issue:{kind:'lost',quantity:5,owner:'MD',resolved:false}})],{supplier:'Sentosa Apparel'}),
    wrong:order('ALT-DEMO-WRONG',[line('x','Kemang','OX-NV-M',{wrong:20},{issue:{kind:'wrong',quantity:20,owner:'MD',resolved:false,actual:'PIK Avenue'}})]),
    offline:s.orders[0],conflict:s.orders[0],finished:s.orders[4]
  }[id];
  if(!base)throw Error('Unknown scenario');s.orders=[base];s.online=id!=='offline';return s;
}
const sum=(xs,fn)=>xs.reduce((a,x)=>a+fn(x),0);
function pending(l){return sum(l.pending,p=>p.quantity);}
function committed(l){return sum(['staged','loaded','transit','received','gap','lost','wrong','returnTransit','returned'],s=>l.stages[s]);}
function departed(l){return sum(['transit','received','gap','lost','wrong','returnTransit','returned'],s=>l.stages[s]);}
function floor(l){return committed(l);}
function receivedEver(o){return sum(o.lines,l=>l.stages.received+(l.receivedReturned||0));}
function totals(o){const t=Object.fromEntries(STAGES.map(k=>[k,sum(o.lines,l=>l.stages[k])]));return {...t,target:sum(o.lines,l=>l.target),original:sum(o.lines,l=>l.original),removed:sum(o.lines,l=>l.removed),pending:sum(o.lines,pending),floor:sum(o.lines,floor),departed:sum(o.lines,departed),stores:new Set(o.lines.map(l=>l.store)).size};}
function status(o){const t=totals(o);if(o.queue.length)return 'Awaiting warehouse';if(o.cancelled)return 'Cancelled';if(o.hold)return 'On hold';if(t.waiting+t.picked+t.packed+t.staged+t.loaded+t.transit+t.gap)return 'Active';if(t.lost+t.wrong+t.removed||o.lines.some(l=>l.returnedBeforeReceipt))return 'Closed short';return 'Completed';}
function finished(o){return ['Cancelled','Closed short','Completed'].includes(status(o));}
function blocked(o,l){return o.hold||l.hold||o.queue.length>0||o.lines.some(x=>x.carton===l.carton&&pending(x)>0);}

const researchHTML=`<article class="research">
<p class="intro">Make the next action obvious. Keep MD's request, the goods' physical position, and corrective work visible as separate facts.</p>
<div class="notice blue"><b>Research scope</b>Five ERP families reviewed through official documentation; current Hub and backend inspected through source. This is a local interactive proposal, not a deployed ERP change or an authenticated audit of today's live screens.</div>
<section class="research-section"><h2>Our recommendation</h2><ol><li><b>Warehouse starts with actionable work.</b> A queue says what, how many, where, and who acts next. A stage view remains available for coordination.</li><li><b>MD keeps Unallotted / Allotted.</b> Active / Finished and a decision filter handle mixed progress without adding more top-level pages.</li><li><b>Edit the remaining demand.</b> Show the before / after target, immediate release, physical putback, and committed quantity before save.</li><li><b>After departure, create a linked Return.</b> Preserve the shipment, start from the actual location, and release returned stock only after receipt and inspection.</li><li><b>Corrections stay visible until done.</b> Hold the affected carton, not every store in the allotment.</li></ol></section>
<section class="research-section"><h2>What other systems teach us</h2><div class="table-wrap"><table><thead><tr><th>ERP</th><th>Documented pattern</th><th>Our design interpretation</th></tr></thead><tbody>
<tr><td>SAP EWM</td><td>Cancel picking can release selected stock and create a putback task. Partial handling-unit cancellation requires repacking. <a href="https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/9832125c23154a179bfa1784cdc9577a/4f414373dd89535be10000000a421937.html" target="_blank" rel="noopener">Official reference ↗</a></td><td>Generate a specific correction task with carton, SKU, quantity, source and destination.</td></tr>
<tr><td>Dynamics 365</td><td>Warehouse work, loads, shipment confirmation and posting are distinct. Reversals change the related remaining quantity. <a href="https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/outbound-load-handling" target="_blank" rel="noopener">Official reference ↗</a></td><td>Expose the true commitment boundary; a document reversal cannot prove physical return.</td></tr>
<tr><td>Odoo</td><td>Partial batch validation offers a backorder choice. Returns create another warehouse operation. <a href="https://www.odoo.com/documentation/19.0/applications/inventory_and_mrp/inventory/shipping_receiving/picking_methods/batch.html" target="_blank" rel="noopener">Backorders ↗</a> · <a href="https://www.odoo.com/documentation/19.0/applications/services/helpdesk/advanced/after_sales.html" target="_blank" rel="noopener">Returns ↗</a></td><td>Ask only when the remainder needs a decision. Pre-fill the linked correction from existing facts.</td></tr>
<tr><td>ERPNext</td><td>Allowed item edits are validated against linked fulfilment. Broader amendments keep the cancelled original and create a linked draft. <a href="https://docs.frappe.io/erpnext/amending-sales-order-after-submit" target="_blank" rel="noopener">Official reference ↗</a></td><td>Keep revisions and document links, while avoiding cancel-and-recreate for every small quantity change.</td></tr>
<tr><td>NetSuite</td><td>Unfulfilled lines or the remaining order can be closed while prior fulfilment is retained. <a href="https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_4698204292.html" target="_blank" rel="noopener">Official reference ↗</a></td><td>Use “Close unsent balance” after partial dispatch; distinguish it from cancelling the whole request.</td></tr>
</tbody></table></div><p class="bottom-caption">These are documented workflow comparisons. No claim that our proposal is objectively faster than every ERP; that requires task testing with actual MD and warehouse users.</p></section>
<section class="research-section"><h2>Compared with our current UI</h2><div class="comparison"><div><h3>Current source</h3><p>Desktop Ops uses a stage board. Changes are marked on picked / packed cards; Move back opens the physical correction. MD edits through the original matrix, with the minimum already committed to an SJ. Cloud and edge paths have different capabilities.</p></div><div><h3>Proposed workbench</h3><p>One queue brings corrections and executable tasks into view. A shared detail shows per-store / SKU position, request revisions, linked deliveries, and the next owner. The same information reflows into phone cards with actions at the bottom.</p></div></div><p>Keep the current quantity matrix for bulk creation and edits. This prototype's small line editor demonstrates an individual correction; it is not a proposed replacement for high-volume matrix entry.</p></section>
<section class="research-section"><h2>Eleven scenarios you can try</h2><p>Use <b>Scenarios</b> above, then switch between <b>MD</b> and <b>Warehouse</b>.</p><ol><li>Partial dispatch and target reduction, including a shared carton.</li><li>Cancellation during picking / packing and partial putback.</li><li>SJ issued, goods still at the warehouse.</li><li>Cancellation after departure and a linked Return.</li><li>95 received out of 100; the other 5 remain open.</li><li>SJ 100, counted 95: a receiving discrepancy owned by Inventory.</li><li>Confirmed loss and a linked replacement without duplicate old demand.</li><li>Wrong destination and return from the actual store.</li><li>Offline warehouse, pending request, then acknowledgement.</li><li>Warehouse packing while MD's edit preview is open.</li><li>A later Return linked to a finished allotment.</li></ol></section>
<section class="research-section"><h2>Implementation boundaries</h2><p>Already present in source: target amendments, cancellation, owed putback, move-back, short-pick reports, idempotency and guards on affected cartons.</p><p>Proposed extensions requiring production design: temporary holds, consistent revision checks across all writers, controlled SJ / loading reversals, linked return and replacement orchestration, durable correction inbox and consistent cloud / edge acknowledgements.</p><p>Demo simplifications: quantities instead of serialized EPCs, one representative carton per store, synthetic document IDs, no carrier / print / accounting integration, no server permissions. Warehouse receipt and Inventory decisions are explicitly labelled simulations.</p></section>
<section class="research-section"><h2>Full research and specification</h2><p><a href="research.md" target="_blank">Read the detailed Indonesian report ↗</a> · <a href="README.md" target="_blank">Prototype instructions ↗</a></p><p>The report includes the scenario matrix, current source evidence, data contracts, race conditions, offline behavior, implementation order, and a task-based usability test plan.</p></section>
</article>`;

function readCommand(){const c={type:context.type,line:context.line,from:context.from,pendingId:context.pendingId,quantity:$('#quantity')?Number($('#quantity').value):undefined,reason:[$('#reason')?.value,$('#note')?.value].filter(Boolean).join(' · ')};
 if($('#close-count'))c.closeCount=$('#close-count').checked;if($('#move-to'))c.to=$('#move-to').value;if($('#finding'))c.result=$('#finding').value;if($('#stock-issue'))c.stockIssue=$('#stock-issue').checked;if($('#sku'))c.sku=$('#sku').value;if($('#store'))c.store=$('#store').value;return c;}
function impactRow(label,q){return `<div class="impact-row"><span>${label}</span><b>${q}</b></div>`;}
function renderImpact(){if(!context)return;const c=readCommand(),o=getOrder(context.order),l=o&&getLine(o,context.line);let html='',error='';
 try{
  if(c.type==='edit'){const p=preview(l,c.quantity);html+=impactRow('Current target → new target',`${l.target} → ${c.quantity}`);html+=impactRow('Released immediately',`${p.release} pcs`);html+=impactRow('Warehouse puts back from pick area',`${p.picked} pcs`);html+=impactRow('Warehouse unpacks & puts back',`${p.packed} pcs`);if(p.delta>0)html+=impactRow('Additional stock reserved',`${p.delta} pcs`);html+=impactRow('Committed / dispatched history retained',`${floor(l)} pcs`);}
  else if(c.type==='cancel'){let release=0,correction=0;for(const x of o.lines){const p=preview(x,floor(x));release+=p.release;correction+=p.picked+p.packed;}html+=impactRow('Demand stopped',`${totals(o).target-totals(o).floor} pcs`)+impactRow('Released immediately',`${release} pcs`)+impactRow('Physical correction for Warehouse',`${correction} pcs`)+impactRow('On SJ / further retained',`${totals(o).floor} pcs`);}
  else if(c.type==='create'){const q=sum([...document.querySelectorAll('[data-store]')],x=>Number(x.value));html+=impactRow('Total to reserve',`${q} pcs`)+impactRow('Free after reservation',`${state.stock[c.sku]-q} pcs`);if(q>state.stock[c.sku])throw Error('Requested quantity exceeds free stock.');}
  else if(c.type==='addLine')html+=impactRow('Stock reserved',`${c.quantity} pcs`)+impactRow('Free after reservation',`${state.stock[c.sku]-c.quantity} pcs`);
  else if(c.type==='resolvePending')html+=impactRow('Free stock after confirmed putback',`${state.stock[l.sku]+c.quantity} pcs`)+impactRow('Correction still open',`${pending(l)-c.quantity} pcs`);
  else if(c.type==='closeShort'){html+=impactRow('Target after closing balance',`${l.target-c.quantity} pcs`)+impactRow('Already dispatched / received retained',`${floor(l)} pcs`);}
  else if(c.type==='return')html+=impactRow('Linked Return quantity',`${c.quantity} pcs`)+impactRow('Free stock released now','0 pcs');
  else if(c.type==='moveBack')html+=impactRow('Physical movement',`${c.quantity} pcs`)+impactRow('Demand retained',`${l.target} pcs`);
  else html='<p class="secondary">Only the selected SKU and destination are affected. The change is added to history.</p>';
  if(o&&o.revision!==context.revision)throw Error(`Current revision ${o.revision} differs from reviewed revision ${context.revision}. Refresh the impact before saving.`);
  if(!state.online)html+='<p class="skeleton-note">Request only · stock remains reserved until warehouse acknowledgement.</p>';
 }catch(e){error=e.message;}
 $('#impact').innerHTML=html;$('#action-error').textContent=error;$('#confirm').disabled=!!error;
}
function run(cmd){state=apply(state,context.order,cmd,context.revision);save();$('#action').close();render();if(detailId)detail();toast(!state.online?'Change requested · awaiting warehouse acknowledgement':'Saved · work and history updated');}
$('#action-form').addEventListener('submit',e=>{e.preventDefault();try{const c=readCommand();if(context.type==='create'){const quantities=Object.fromEntries([...document.querySelectorAll('[data-store]')].map(x=>[x.dataset.store,Number(x.value)]));state=createAllotment(state,c.sku,quantities,c.reason);detailId=state.orders[0].id;$('#action').close();render();detail();toast('Allotment issued · stock reserved');}else run(c);}catch(e){$('#action-error').textContent=e.message;}});
$('#action-form').addEventListener('input',renderImpact);$('#action-form').addEventListener('change',renderImpact);
function switchRole(next){role=next;section=next;filter='all';view=next==='md'?'orders':'queue';search='';render();if(detailId&&$('#detail').open)detail();}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.role){switchRole(b.dataset.role);return;}if(b.dataset.section){if(b.dataset.section==='research'){section='research';render();}else switchRole(b.dataset.section);return;}
 if(b.id==='lab-toggle'||b.id==='mobile-lab'){$('#lab').hidden=!$('#lab').hidden;return;}if(b.id==='reset'){state=seed();activeScenario=null;detailId=null;$('#detail').close();render();toast('Demo reset');return;}
 const d=b.dataset,a=d.action;if(!a)return;
 try{
 if(a==='view'){view=d.view;filter='all';render();}
 else if(a==='filter'){filter=d.filter;render();}
 else if(a==='detail'){detailId=d.order;detailTab='items';detail();}
 else if(a==='closeDetail'){$('#detail').close();detailId=null;}
 else if(a==='detailTab'){detailTab=d.tab;detail();}
 else if(a==='closeAction'){$('#action').close();context=null;}
 else if(a==='scenario'){state=scenario(d.scenario);activeScenario=d.scenario;detailTab='items';switchRole(['issued'].includes(d.scenario)?'ops':'md');detailId=state.orders[0].id;detail();toast(scenarios.find(s=>s.id===d.scenario).hint);}
 else if(a==='sync'){state=reconnect(state);render();if(detailId)detail();toast('Warehouse connected · pending requests processed');}
 else if(a==='task'){const type=pickTaskAction({type:d.task});openAction(type,d);}
 else if(a==='keepDemand'){if($('#action').open)$('#action').close();toast('Remaining demand kept · Warehouse can continue. No duplicate request created.');}
 else if(a==='alternativeNoReplacement'){$('#action').close();openAction('noReplacement',{order:context.order,line:context.line});}
 else if(a==='race'){const o=getOrder(context.order),l=getLine(o,context.line);if(l.stages.picked<5)throw Error('At least 5 picked pieces are needed for this simulation.');state=apply(state,o.id,{type:'pack',line:l.id,quantity:5},o.revision);render();renderImpact();toast('Warehouse packed 5 pieces · MD preview is now stale');}
 else if(a==='refreshImpact'){context.revision=getOrder(context.order).revision;renderImpact();toast('Impact refreshed · review the latest physical position');}
 else if(actionTitles[a])openAction(a,d);
 }catch(err){if($('#action').open)$('#action-error').textContent=err.message;else toast(err.message);}
});
$('#offline').addEventListener('change',e=>{if(e.target.checked){state.online=false;render();if(detailId)detail();}else{state=reconnect(state);render();if(detailId)detail();}});
$('#sync').addEventListener('click',()=>{state=reconnect(state);render();if(detailId)detail();toast('Warehouse acknowledged pending requests');});
document.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;search=e.target.value;render();const input=$('#search');input?.focus();input?.setSelectionRange(start,start);}});
$('#detail').addEventListener('close',()=>{if(!$('#detail').open&&!$('#action').open)detailId=null;});
render();
// Expose read-only snapshots for demo QA; changes still use the public UI.
window.demoSnapshot=()=>structuredClone(state);

</script></body></html>
