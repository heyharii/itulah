<title>Itulah GA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --ink:#20242c; --text:#394150; --body:#626b78; --mute:#737c89; --faint:#b9c0c9; --ico:#89919d;
  --canvas:#ffffff; --soft:#f8f9fb; --soft-2:#f0f2f5; --soft-3:#e9ecf1;
  --hair:#e7eaf0; --hair-2:#dce1e8; --hair-strong:#c7ced8;
  --accent:#2563eb; --accent-bg:#eff5ff; --accent-hover:#1d4ed8;
  --ok:#15803d; --ok-bg:#dcf5d6; --warn:#b45309; --warn-bg:#faeacd; --bad:#be123c; --bad-bg:#fbeaea;
  --fin:#5b3fd0; --fin-bg:#f1edfd; --fin-line:#e2dafb; --fin-wash:#fbfaff;
  --ga:#0f6e56; --ga-bg:#e1f5ee; --ga-line:#c9ebdd; --ga-wash:#f7fcfa;
  --dark:#191b20;
  --scrim:rgba(247,248,250,.72);
  --shadow-pop:0 4px 8px rgb(24 39 60 / 4%), 0 12px 32px rgb(24 39 60 / 8%);
  --shadow-float:0 8px 24px rgb(24 39 60 / 6%), 0 24px 64px rgb(24 39 60 / 12%);
  --ease:cubic-bezier(.16,1,.3,1);
  --sans:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:inherit}
.ico{flex-shrink:0;display:block}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100%}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;height:52px;padding-inline:16px;background:var(--canvas);border-bottom:1px solid var(--hair)}
.mark{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--dark);color:#fff;font:600 13px var(--sans);text-decoration:none;flex-shrink:0;letter-spacing:-.02em}
.domains{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.domains::-webkit-scrollbar{display:none}
.dom{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;border:0;background:none;font-size:13px;font-weight:500;color:var(--body);white-space:nowrap;cursor:pointer;text-decoration:none}
.dom:hover{background:var(--soft-2);color:var(--ink)}
.dom.dim{color:var(--faint)}
.dom.dim:hover{color:var(--body)}
.dom[aria-current="page"]{background:var(--soft-2);color:var(--ink);font-weight:600}
.proto-tag{font-size:12px;color:var(--mute);white-space:nowrap;padding:4px 8px;border:1px dashed var(--hair-strong);border-radius:6px}
.icon-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--ico);cursor:pointer}
.icon-btn:hover{background:var(--soft-2);color:var(--text)}
.menu-btn{display:none}

.side{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));height:calc(100dvh - 52px - env(safe-area-inset-top,0px));overflow-y:auto;scrollbar-width:none;background:var(--soft);border-right:1px solid var(--hair);padding:12px 10px;display:flex;flex-direction:column}
.side::-webkit-scrollbar{display:none}
.side-chip{display:flex;align-items:center;gap:9px;padding:4px 9px 10px}
.side-chip .sq{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;font:600 10.5px var(--sans);letter-spacing:.02em}
.side-chip b{font-size:14px;font-weight:600;color:var(--ink)}
.strip{display:flex;align-items:center;gap:2px;padding:6px 5px 8px;margin:0 4px 4px;border-bottom:1px solid var(--hair)}
.strip .icon-btn{width:30px;height:30px}
.strip-note{margin-left:auto;font-size:11px;color:var(--mute);padding-right:4px}
.grp{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:14px 9px 5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;color:var(--text);font-size:13.5px;font-weight:500;text-decoration:none;transition:background .12s}
.nav-item .ico{color:var(--ico)}
.nav-item:hover{background:var(--soft-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--soft-3);color:var(--ink);font-weight:600}
.nav-item[aria-current="page"] .ico{color:var(--ink)}
.badge{margin-left:auto;min-width:19px;height:19px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:600;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:14px 9px 2px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--hair)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#e8def4,#f8dde8);flex-shrink:0}
.side-foot b{display:block;font-size:12.5px;color:var(--ink);font-weight:500}
.side-foot small{display:block;font-size:11px;color:var(--mute)}

.main{min-width:0;padding:22px 28px 56px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--soft);font-size:13px;color:var(--body);margin-bottom:18px}
.note>.ico{color:var(--fin);margin-top:1px}
.note p{margin:0;flex:1;max-width:96ch}
.note b{color:var(--ink);font-weight:600}
.note a{color:var(--accent);font-weight:500}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:14px}
.crumb{font-size:12px;color:var(--mute);margin-bottom:3px}
.ph h1{margin:0;font-size:22px;line-height:1.2;font-weight:600;color:var(--ink);letter-spacing:-.015em;text-wrap:balance}
.lead{margin:6px 0 0;font-size:13.5px;color:var(--body);max-width:72ch}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ico);pointer-events:none}
.search input{height:34px;width:220px;max-width:100%;border:1px solid var(--hair-2);border-radius:8px;padding:0 10px 0 32px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--canvas)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.btn{height:34px;padding:0 14px;border-radius:8px;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-2);background:var(--canvas);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--hair-2);border-radius:8px;padding:2px;gap:2px;background:var(--soft)}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--canvas);color:var(--ink);box-shadow:0 1px 2px rgb(24 39 60 / 10%)}
.sum{display:flex;flex-wrap:wrap;gap:10px 32px;padding:12px 2px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-bottom:16px}
.sum div{display:flex;flex-direction:column;gap:2px}
.sum span{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.sum strong{font-size:16px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sum strong.warn{color:var(--warn)}
.sum strong.bad{color:var(--bad)}
.h2{font-size:15px;font-weight:600;color:var(--ink);margin:26px 0 10px;display:flex;align-items:center;gap:8px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--hair);border-radius:12px;background:var(--canvas)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:500;color:var(--body);text-align:left;padding:9px 12px;background:var(--soft);border-bottom:1px solid var(--hair);white-space:nowrap}
th .fin,th .ga{margin-left:4px}
td{padding:10px 12px;border-bottom:1px solid var(--hair);vertical-align:top;color:var(--text)}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--soft)}
tbody tr.draft-row{background:#fffcf5}
td .t{color:var(--ink);font-weight:500}
td .sub{display:block;font-size:12px;color:var(--mute);margin-top:1px}
td.num .sub{text-align:right}
td.chk{width:36px;padding-right:0}
td.chk input{width:16px;height:16px;accent-color:var(--accent);margin:2px 0 0}
.empty-row td{text-align:center;color:var(--mute);padding:28px 12px}
.refs{display:flex;flex-wrap:wrap;gap:4px 8px}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.muted{background:var(--soft-2);color:var(--body)}
.pill.accent{background:var(--accent-bg);color:var(--accent)}
.pill.line{border:1px solid var(--hair-2);color:var(--text);background:var(--canvas)}
.fin,.ga{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 6px 1px 4px;border-radius:5px;letter-spacing:.01em;vertical-align:1px;white-space:nowrap}
.fin{color:var(--fin);background:var(--fin-bg)}
.ga{color:var(--ga);background:var(--ga-bg)}
.fin .ico,.ga .ico{width:11px;height:11px}
.refbtn{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;text-align:left;font-weight:500}
.refbtn:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.refbtn.mono{font-weight:500}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .2s var(--ease)}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--canvas);border-left:1px solid var(--hair);box-shadow:var(--shadow-float);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .28s var(--ease)}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--hair)}
.sheet-h .grow{flex:1;min-width:0}
.sheet-h h2{margin:2px 0 0;font-size:18px;line-height:1.25;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.sheet-h .sh-sub{font-size:13px;color:var(--body);margin-top:3px}
.sheet-b{overflow-y:auto;padding:18px 20px 32px;display:flex;flex-direction:column;gap:24px}
.sec h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h3 .fin,.sec h3 .ga{text-transform:none;letter-spacing:.01em}
.sec .cap{font-size:12.5px;color:var(--mute);margin:8px 0 0;max-width:62ch}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;margin:0;font-size:13.5px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.acct{border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.ar{display:grid;grid-template-columns:120px 52px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 12px;border-bottom:1px solid var(--hair);font-size:13px}
.ar:last-child{border-bottom:0}
.ar-role{color:var(--mute);font-size:12.5px}
.ar-code{color:var(--ink);font-weight:500}
.ar-name{color:var(--text)}
.ar-name.missing{color:var(--bad)}
.fin-box,.ga-box{border-radius:10px;padding:14px}
.fin-box{border:1px solid var(--fin-line);background:var(--fin-wash)}
.ga-box{border:1px solid var(--ga-line);background:var(--ga-wash)}
.fin-figs{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:12px}
.fin-figs div{display:flex;flex-direction:column;gap:1px}
.fin-figs span{font-size:12px;color:var(--mute)}
.fin-figs strong{font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.fin-figs strong.bad{color:var(--bad)}
.bar{height:6px;background:#ebe6fb;border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--fin);border-radius:3px}
.bar.over i{background:var(--bad)}
.bills{display:flex;flex-direction:column;border-top:1px solid var(--fin-line)}
.bl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--fin-line);font-size:13px}
.bl:last-child{border-bottom:0}
.bl .bl-p{color:var(--body)}
.more{font-size:12.5px;color:var(--mute);padding-top:8px}
.jr{border:1px solid var(--hair);border-radius:10px;overflow:hidden;font-size:13px}
.jr div{display:grid;grid-template-columns:30px 48px minmax(0,1fr) auto;gap:10px;padding:8px 12px;border-bottom:1px solid var(--hair);align-items:baseline}
.jr div:last-child{border-bottom:0}
.jr .side-l{color:var(--mute);font-size:12px}
.jr .cr{padding-left:28px}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);padding:8px 10px;border:1px solid var(--hair);border-radius:8px}
.file .ico{color:var(--ico)}
.file small{margin-left:auto;color:var(--mute);font-size:12px}
.links{display:flex;flex-direction:column}
.lnk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 0;border-bottom:1px solid var(--hair);cursor:pointer;font-size:13px}
.lnk:last-child{border-bottom:0}
.lnk:hover .t{color:var(--accent)}
.lnk .t{color:var(--ink);font-weight:500}
.lnk .sub{color:var(--mute);font-size:12px}
.lnk .grow{flex:1;min-width:0}
.lnk>.ico{color:var(--faint)}
.empty{margin:0;font-size:13px;color:var(--mute)}
.callout{display:flex;gap:10px;padding:12px;border-radius:10px;background:var(--warn-bg);color:#7a3d06;font-size:13px}
.callout .ico{margin-top:1px}
.callout.info{background:var(--soft);color:var(--body);border:1px solid var(--hair)}
.callout.ok{background:var(--ok-bg);color:#14532d}
.callout p{margin:0}
.bank{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;margin-bottom:6px}
.bank .grow{flex:1;min-width:0}
.bank .t{color:var(--ink);font-weight:500;font-size:13.5px}
.bank .sub{display:block;color:var(--mute);font-size:12px;margin-top:2px}

.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:500;color:var(--body)}
.field input,.field select{height:36px;border:1px solid var(--hair-2);border-radius:7px;padding:0 10px;background:var(--canvas);font:inherit;font-size:13.5px;color:var(--ink);width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.field .hint{font-size:12px;color:var(--mute)}
.field .hint.src{color:var(--fin)}
.field .err{font-size:12.5px;color:var(--bad)}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink)}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.form-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--hair);flex-wrap:wrap}

.flows{display:flex;flex-direction:column;gap:14px}
.flow{border:1px solid var(--hair);border-radius:12px;padding:14px 16px 16px;background:var(--canvas)}
.flow h2{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.flow .fl-sub{margin:2px 0 12px;font-size:13px;color:var(--body)}
.steps{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.step{flex:1 1 150px;min-width:148px;max-width:260px;border:1px solid var(--hair);border-radius:9px;padding:9px 10px;background:var(--soft);display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text)}
.step.ga-s{background:var(--ga-wash);border-color:var(--ga-line)}
.step.fin-s{background:var(--fin-wash);border-color:var(--fin-line)}
.step .who{align-self:flex-start}
.step .st-ref{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.own{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.own.ga-o{color:var(--ga);background:var(--ga-bg)}
.own.fin-o{color:var(--fin);background:var(--fin-bg)}
.own.toko-o{color:var(--body);background:var(--soft-3)}
.step-arrow{display:grid;place-items:center;color:var(--faint);flex:0 0 14px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--dark);color:#fff;font-size:13px;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-pop);max-width:min(560px,calc(100% - 32px));animation:fade .16s var(--ease)}
.navscrim{position:fixed;inset:0;background:var(--scrim);z-index:44}

.aico{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;flex-shrink:0}
.aico.lg{width:46px;height:46px;border-radius:12px}
.t-ga{background:var(--ga-bg);color:var(--ga)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-acc{background:var(--accent-bg);color:var(--accent)}
.t-pink{background:#fbeaf0;color:#993556}.t-fin{background:var(--fin-bg);color:var(--fin)}.t-coral{background:#faece7;color:#993c1d}.t-soft{background:var(--soft-2);color:var(--text)}
.cell-ico{display:flex;align-items:center;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 10px;border:1px solid var(--hair-2);border-radius:999px;background:var(--canvas);font-size:13px;font-weight:500;color:var(--text);text-decoration:none;white-space:nowrap}
.chip:hover{background:var(--soft)}
.chip .ico{color:var(--ico)}
.chip .n{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.chip[aria-current="page"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.chip[aria-current="page"] .ico,.chip[aria-current="page"] .n{color:var(--accent)}
.fs{border:0;margin:0;padding:0;min-width:0}
.fs legend{font-size:12.5px;font-weight:500;color:var(--body);margin:0 0 8px;padding:0}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--hair-2);border-radius:10px;cursor:pointer;background:var(--canvas);min-height:56px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--hair-strong)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .t{display:block;font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.25}
.opt .tag{display:block;font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:3px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:has(input:checked) .aico{background:var(--canvas);color:var(--accent)}
.opt:has(input:checked) .tag{color:var(--accent)}

.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--hair-2);border-radius:10px}
.switch-row .t{font-size:13.5px;color:var(--ink);font-weight:500}
.sw{position:relative;width:36px;height:21px;border-radius:999px;background:var(--hair-strong);border:0;cursor:pointer;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / 20%);transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{left:18px}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}

.srcpill:empty{display:none}
.usage{display:flex;align-items:flex-end;gap:6px;padding-top:4px}
.usage div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.usage i{display:block;width:100%;max-width:34px;background:var(--fin);opacity:.75;border-radius:4px 4px 0 0}
.sh-title{display:flex;align-items:center;gap:12px}

  .step{max-width:none;flex-basis:100%}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- dates & money ---------- */
const TODAY = '2026-09-24';
const CLOSED_THROUGH = '2026-08';
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const pad = n => String(n).padStart(2, '0');
function dt(s){ return new Date(s + 'T00:00:00'); }
function iso(x){ return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); }
function addDays(s, n){ const x = dt(s); x.setDate(x.getDate() + n); return iso(x); }
function fmtDate(s){ if(!s) return '—'; const x = dt(s); return x.getDate()+' '+MONTHS[x.getMonth()]+' '+x.getFullYear(); }
function daysBetween(a,b){ return Math.round((dt(b) - dt(a)) / 86400000); }
function ymIdx(ym){ const p = ym.split('-').map(Number); return p[0]*12 + p[1] - 1; }
function ymFromIdx(i){ return Math.floor(i/12) + '-' + pad(i%12 + 1); }
function ymLabel(ym){ const p = ym.split('-').map(Number); return MONTHS[p[1]-1] + ' ' + p[0]; }
function rp(n){
  if(n == null) return '—';
  const a = Math.abs(n);
  if(a >= 1e9) return 'Rp' + (n/1e9).toLocaleString('id-ID',{maximumFractionDigits:2}) + ' M';
  if(a >= 1e6) return 'Rp' + (n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1}) + ' jt';
  return 'Rp' + Math.round(n).toLocaleString('id-ID');
}
function rpFull(n){ return n == null ? '—' : 'Rp' + Math.round(n).toLocaleString('id-ID'); }

/* ---------- derived ---------- */
function billsWhere(key, id){ return BILLS.filter(b => b[key] === id).sort((a,b) => a.date < b.date ? 1 : -1); }
function postedSum(list){ return list.filter(b => b.status === 'POSTED').reduce((s,b) => s + b.amount, 0); }
function partyName(c){ return c.partyName || (vById(c.party) || {}).name || '—'; }
function period(c){ return fmtDate(c.start) + ' – ' + (c.end ? fmtDate(c.end) : 'tanpa batas'); }
function cStatus(c){
  if(!c.signed) return {k:'muted', t:'Draft'};
  if(c.start > TODAY) return {k:'accent', t:'Belum mulai'};
  if(c.end && c.end < TODAY) return {k:'muted', t:'Habis'};
  if(c.end){ const left = daysBetween(TODAY, c.end); if(left <= c.reminder) return {k:'warn', t:'Habis ' + left + ' hari lagi', soon:true}; }
  return {k:'ok', t:'Aktif'};
}
function taskState(t){ const d = daysBetween(TODAY, t.next); if(d < 0) return {k:'bad', t:'Terlambat ' + (-d) + ' hari', due:true}; if(d <= 7) return {k:'warn', t:d + ' hari lagi', due:true}; return {k:'muted', t:fmtDate(t.next)}; }
function pill(s){ return '<span class="pill ' + s.k + '">' + esc(s.t) + '</span>'; }
const unpaid = () => BILLS.filter(b => b.status === 'POSTED' && !b.paid);
function vendorHutang(vid){ return unpaid().filter(b => b.vendor === vid).reduce((s,b) => s + b.amount, 0); }
function billState(b){ if(b.status === 'DRAFT') return {k:'muted', t:'Draft · tagihan rutin'}; if(b.paid) return {k:'ok', t:'Dibayar'}; if(b.due < TODAY) return {k:'bad', t:'Lewat jatuh tempo'}; return {k:'line', t:'Posted · belum dibayar'}; }
function finStatus(id){
  const s = ASSESS[id];
  if(!s) return {k:'warn', t:'Belum dinilai'};
  if(s.decision === 'EXPENSE') return {k:'muted', t:'Dibebankan'};
  if(s.decision === 'IN_PROGRESS') return {k:'accent', t:'Dalam pengerjaan'};
  if(s.method === 'Replacement') return {k:'line', t:'Kapitalisasi · replacement'};
  if(s.method === 'Tidak disusutkan') return {k:'line', t:'Kapitalisasi · tidak disusutkan'};
  return {k:'ok', t:'Disusutkan'};
}
function nbv(id){
  const s = ASSESS[id]; if(!s || s.decision !== 'CAPITALIZE') return s && s.decision === 'IN_PROGRESS' ? s.cost : null;
  if(s.method !== 'Garis lurus' && s.method !== 'Saldo menurun') return s.cost;
  const el = Math.max(0, ymIdx(CLOSED_THROUGH) - ymIdx(s.inService.slice(0,7)) + 1);
  const m = Math.min(el, s.life);
  return s.cost - (s.cost - s.salvage) / s.life * m;
}
function monthlyDep(id){ const s = ASSESS[id]; if(!s || s.decision !== 'CAPITALIZE' || !s.life) return null; return (s.cost - s.salvage) / s.life; }
function contractExpense(c){ const t = TYPES[c.type]; if(t.expense === 'objek') return c.objek ? OBJEK[c.objek].acc : null; return t.expense || null; }
function suggest(o){
  if(o.assetClass){ return {code:CLASSES[o.assetClass].a, src:'kelas aset · ' + o.assetClass}; }
  if(o.repair){ const r = rById(o.repair); return {code:OBJEK[r.objek].acc, src:'objek perbaikan · ' + OBJEK[r.objek].label}; }
  if(o.contract){
    const c = cById(o.contract), t = TYPES[c.type];
    if(o.prepaid && t.prepaid) return {code:t.prepaid, src:'jenis kontrak · ' + t.label + ' · bayar dimuka'};
    if(t.expense === 'objek') return {code:OBJEK[c.objek].acc, src:'objek kontrak · ' + OBJEK[c.objek].label};
    if(t.expense) return {code:t.expense, src:'jenis kontrak · ' + t.label};
    if(t.missing) return {code:'', src:'jenis kontrak · ' + t.label, missing:t.missing};
  }
  const v = vById(o.vendor); if(v) return {code:v.acct, src:'akun default vendor'};
  return {code:'', src:''};
}
function billSource(b){
  if(b.src) return b.src;
  const a = b.asset ? aById(b.asset) : null;
  return suggest({vendor:b.vendor, contract:b.contract, repair:b.repair, assetClass:a ? a.cls : null, prepaid:b.prepaid}).src;
}
function schedules(){
  return BILLS.filter(b => b.prepaid && b.status === 'POSTED').map(b => {
    const c = b.contract ? cById(b.contract) : null;
    const exp = c ? contractExpense(c) : null;
    const missing = c && TYPES[c.type].missing ? TYPES[c.type].missing : null;
    const released = missing ? 0 : Math.max(0, Math.min(b.months, ymIdx(CLOSED_THROUGH) - ymIdx(b.pStart) + 1));
    const per = b.amount / b.months;
    return {bill:b, contract:c, exp:exp, missing:missing, released:released, per:per, relAmt:per * released, left:b.amount - per * released, done:released >= b.months};
  }).sort((x,y) => (x.done - y.done) || (x.bill.date < y.bill.date ? 1 : -1));
}
function accruals(){
  return TEMPLATES.map(t => {
    const d = BILLS.find(b => b.template === t.id && b.period === 'Sep 2026' && b.status === 'DRAFT');
    if(!d) return null;
    const c = cById(t.contract);
    return {t:t, bill:d, contract:c, acc:TYPES[c.type].accrual || null};
  }).filter(Boolean);
}
function gapAssets(){ return allAssets().filter(a => !a.bill); }
function gapBills(){ return BILLS.filter(b => b.status === 'POSTED' && ASSET_ACCOUNTS.includes(b.account) && !allAssets().some(a => a.bill === b.no)); }
function payments(){
  const map = {};
  BILLS.filter(b => b.paid).forEach(b => {
    const pd = b.payDate || addDays(b.date, 20);
    const no = b.payment || ('PAY-' + pd.slice(2,4) + pd.slice(5,7) + '-' + b.vendor.slice(1));
    if(!map[no]) map[no] = {no:no, date:pd, vendor:b.vendor, bills:[], total:0};
    map[no].bills.push(b.no); map[no].total += b.amount;
    if(pd > map[no].date) map[no].date = pd;
  });
  return Object.values(map).sort((a,b) => a.date < b.date ? 1 : -1);
}

function pageContracts(g){
  const list = CONTRACTS.filter(c => TYPES[c.type].g === g.id);
  const btn = '<button class="btn primary" type="button" data-action="new-contract" data-group="' + g.id + '">' + ico('plus', 15) + 'Tambah kontrak</button>';
  let h = note(false) + pageHead('GA · Contracts', g.label, g.lead, btn);
  const soon = list.filter(c => cStatus(c).soon).length;
  if(g.id === 'langganan'){
    const billed = list.reduce((s,c) => s + postedSum(billsWhere('contract', c.id)), 0);
    const drafts = list.reduce((s,c) => s + billsWhere('contract', c.id).filter(b => b.status === 'DRAFT').length, 0);
    h += sum([['Sambungan', list.length], ['Ditagih 2026 ' + FIN, rp(billed)], ['Draft bulan ini ' + FIN, drafts]]);
    const rows = list.map(c => {
      const bs = billsWhere('contract', c.id), dr = bs.find(b => b.status === 'DRAFT');
      return tr('contract:' + c.id, [td('<span class="mono">' + c.id + '</span>'), td(two(esc(partyName(c)), esc(c.title))), td(esc(TYPES[c.type].label)), td(esc(c.site)), td('<span class="mono">' + esc(c.customer) + '</span>'), td(rp(postedSum(bs)), 'num'), td(dr ? '<span class="pill muted">Draft ' + esc(dr.period) + '</span>' : '<span class="pill ok">Sudah dicocokkan</span>'), td(pill(cStatus(c)))], [c.id, partyName(c), c.title, c.site, c.customer, TYPES[c.type].label].join(' '));
    });
    return h + table([{h:'No'},{h:'Penyedia'},{h:'Jenis'},{h:'Site'},{h:'ID pelanggan'},{h:'Ditagih 2026 ' + FIN, num:true},{h:'Tagihan bulan ini ' + FIN},{h:'Status'}], rows);
  }
  if(g.id === 'disewakan'){
    const got = RECEIPTS.filter(r => list.some(c => c.id === r.contract)).reduce((s,r) => s + r.amount, 0);
    h += sum([['Kontrak', list.length], ['Nilai kontrak', rp(list.reduce((s,c) => s + (c.value || 0), 0))], ['Diterima s/d hari ini ' + FIN, rp(got)]]);
    const rows = list.map(c => {
      const recv = RECEIPTS.filter(r => r.contract === c.id).reduce((s,r) => s + r.amount, 0);
      return tr('contract:' + c.id, [td('<span class="mono">' + c.id + '</span>'), td(two(esc(partyName(c)), esc(c.title))), td(esc(TYPES[c.type].label)), td(esc(c.site)), td(period(c)), td(rp(c.value), 'num'), td(rp(recv), 'num'), td(pill(cStatus(c)))], [c.id, partyName(c), c.title, c.site].join(' '));
    });
    return h + table([{h:'No'},{h:'Penyewa'},{h:'Jenis'},{h:'Site'},{h:'Periode'},{h:'Nilai kontrak', num:true},{h:'Diterima ' + FIN, num:true},{h:'Status'}], rows);
  }
  const act = list.filter(c => ['ok','warn'].includes(cStatus(c).k));
  const billedAll = list.reduce((s,c) => s + postedSum(billsWhere('contract', c.id)), 0);
  h += sum([['Aktif', act.length], ['Perlu diperpanjang', soon, soon ? 'warn' : ''], ['Nilai kontrak aktif', rp(act.reduce((s,c) => s + (c.value || 0), 0))], ['Ditagih s/d hari ini ' + FIN, rp(billedAll)]]);
  const rows = list.map(c => {
    const billed = postedSum(billsWhere('contract', c.id));
    const sisa = c.value != null ? c.value - billed : null;
    return tr('contract:' + c.id, [td('<span class="mono">' + c.id + '</span>'), td(two(esc(partyName(c)), esc(c.title))), td(esc(TYPES[c.type].label) + (c.objek ? '<span class="sub">Objek: ' + esc(OBJEK[c.objek].label) + '</span>' : '')), td(esc(c.site)), td(period(c)), td(rp(c.value), 'num'), td(rp(billed) + (sisa != null ? '<span class="sub">sisa ' + rp(sisa) + '</span>' : ''), 'num'), td(pill(cStatus(c)))], [c.id, partyName(c), c.title, c.site, TYPES[c.type].label].join(' '));
  });
  return h + table([{h:'No'},{h:'Pihak'},{h:'Jenis'},{h:'Site'},{h:'Periode'},{h:'Nilai kontrak', num:true},{h:'Ditagih ' + FIN, num:true},{h:'Status'}], rows);
}

function repairCost(r){
  const bs = billsWhere('repair', r.id), act = postedSum(bs), pr = r.via ? prById(r.via) : null;
  if(r.contract && !bs.length) return {html:'<span class="pill ok">Dicover ' + r.contract + '</span>', over:false};
  if(pr && !bs.length) return {html:'<span class="pill muted">' + esc(r.via) + ' · ' + (pr.status === 'REQUESTED' ? 'menunggu Finance' : 'ditolak') + '</span>', over:false};
  if(!bs.length) return {html:'—', over:false};
  const cap = r.budget != null ? r.budget : r.est, over = cap != null && act > cap;
  return {html:rp(act) + (over ? '<span class="sub" style="color:var(--bad)">di atas ' + (r.budget != null ? 'budget' : 'estimasi') + '</span>' : ''), over:over};
}

function docState(d){ if(!d.expiry) return {k:'muted', t:'Tanpa masa berlaku'}; const n = daysBetween(TODAY, d.expiry); if(n < 0) return {k:'bad', t:'Habis ' + fmtDate(d.expiry), soon:true}; if(n <= 90) return {k:'warn', t:'Habis ' + n + ' hari lagi', soon:true}; return {k:'line', t:'s/d ' + fmtDate(d.expiry)}; }

  ]);
  let finBox;
  if(t.income){
    const rc = RECEIPTS.filter(r => r.contract === c.id), got = rc.reduce((s,r) => s + r.amount, 0);
    finBox = '<div class="fin-box"><div class="fin-figs"><div><span>Diterima s/d hari ini</span><strong>' + rp(got) + '</strong></div>' + (c.value != null ? '<div><span>Belum diterima</span><strong>' + rp(c.value - got) + '</strong></div>' : '') + '</div>' +
      (c.value ? '<div class="bar"><i style="width:' + Math.min(100, got / c.value * 100) + '%"></i></div>' : '') +
      (rc.length ? '<div class="bills">' + rc.slice().reverse().slice(0,6).map(r => '<div class="bl"><span class="mono">' + r.no + '</span><span class="bl-p">' + r.period + ' · <span class="mono">' + t.income + '</span></span><span class="num">' + rp(r.amount) + '</span><span><span class="pill ok">Diterima</span></span></div>').join('') + '</div>' + (rc.length > 6 ? '<div class="more">dan ' + (rc.length - 6) + ' penerimaan lainnya</div>' : '') : '<p class="empty">Belum ada penerimaan.</p>') + '</div>';
  } else {
    const bs = billsWhere('contract', c.id), billed = postedSum(bs), dr = bs.filter(b => b.status === 'DRAFT');

  }
  let warn = '';
  if(t.missing) warn = '<div class="callout">' + ico('alert', 16) + '<p>Akun beban <b>' + esc(t.missing) + '</b> belum ada di COA. Bill bisa dicatat ke akun bayar dimuka (' + t.prepaid + '), tapi pelepasan bulanannya tertahan. Keputusan Finance.</p></div>';

function doPay(){
  const sel = Array.from(document.querySelectorAll('input[name=pay]:checked'));
  const err = $('#payErr');
  if(!sel.length){ err.textContent = 'Pilih minimal satu bill untuk dibayar.'; err.hidden = false; return; }
  const blocked = [], paidNos = [];
  const pno = 'PAY-2609-' + (paySeq++);
  sel.forEach(cb => {
    const b = bByNo(cb.value), v = vById(b.vendor);
    if(bankState(v) === 'unverified'){ blocked.push(b.no + ' (' + v.name + ')'); return; }
    b.paid = true; b.payment = pno; b.payDate = TODAY; paidNos.push(b.no);
    if(b.request){ const p = prById(b.request); if(p) p.status = 'PAID'; }
  });
  refresh();
  const e2 = $('#payErr');
  if(blocked.length){ e2.textContent = 'Tertahan: ' + blocked.join(', ') + '. Rekening belum diverifikasi; verifikasi dulu di Rekening vendor.'; e2.hidden = false; }
  if(paidNos.length) toast(pno + ' dibuat untuk ' + paidNos.length + ' bill. Hutang 2004 berkurang.');
}

  }
  const t = e.target.closest('[data-toast]'); if(t){ toast(t.dataset.toast); return; }
  if(e.target.closest('.nav-item')) setNav(false);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(sheetRoot.innerHTML) closeSheet(); else setNav(false); }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-open]')){ e.preventDefault(); openRef(e.target.dataset.open); }
});
function setNav(on){ shell.classList.toggle('nav-open', on); $('#navscrim').hidden = !on; $('#menuBtn').setAttribute('aria-expanded', on ? 'true' : 'false'); }
$('#menuBtn').addEventListener('click', () => setNav(!shell.classList.contains('nav-open')));
$('#navscrim').addEventListener('click', () => setNav(false));
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); if(pendingOpen){ const p = pendingOpen; pendingOpen = null; openRef(p); } });
render();
</script>
