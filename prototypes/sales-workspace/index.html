function sessionsView(){let ss=sessions.filter(s=>inRange(s));if(state.txStatus==='open')ss=ss.filter(s=>s.open);if(state.txStatus==='variance')ss=ss.filter(s=>sessionVariance(s));ss.sort((a,b)=>b.day.localeCompare(a.day)||a.store.localeCompare(b.store)||b.start.localeCompare(a.start));const visible=ss.slice(state.txPage*16,state.txPage*16+16);return `<div class="small-metrics"><div><span>Sessions</span><strong>${ss.length}</strong></div><div><span>Open</span><strong>${ss.filter(s=>s.open).length}</strong></div><div><span>Closed</span><strong>${ss.filter(s=>!s.open).length}</strong></div></div><div class="toolbar"><label class="control">Status ${select('session-status',[['all','All sessions'],['open','Still open'],['variance','Cash variance']],state.txStatus)}</label></div><section class="card"><div class="desktop-table"><table><thead><tr><th>Session / cashier</th><th>Store</th><th>Time</th><th>Receipts</th><th>Sales</th><th>Expected cash</th><th>Variance</th><th>Status</th></tr></thead><tbody>${visible.map(s=>{const d=sessionData(s);return `<tr class="rowlink" data-session="${s.id}"><td><strong>${s.cashier}</strong><small style="display:block">${s.id} · ${s.terminal}</small></td><td>${s.store}</td><td>${pretty(s.day)}<small style="display:block">${s.start}–${s.open?'now':s.end}</small></td><td>${d.rs.length}</td><td>${money(d.sales)}</td><td>${money(s.opening+d.cash)}</td><td class="${sessionVariance(s)?'bad':'muted'}">${s.open?'—':money(sessionVariance(s))}</td><td><span class="status ${s.open?'amber':'good'}">${s.open?'Open':'Closed'}</span></td></tr>`}).join('')}</tbody></table></div><div class="mobile-cards">${visible.map(s=>{const d=sessionData(s);return `<div class="mobile-row"><button class="spread text-button" style="width:100%" data-session="${s.id}"><span><strong>${s.cashier} · ${s.store}</strong><small style="display:block">${pretty(s.day)} · ${s.terminal} · ${s.start}</small></span><span class="status ${s.open?'amber':'good'}">${s.open?'Open':'Closed'}</span></button><div class="mobile-stats"><div><small>Sales</small><strong>Rp${short(d.sales)}</strong></div><div><small>Receipts</small><strong>${d.rs.length}</strong></div><div><small>Variance</small><strong class="bad">${s.open?'—':money(sessionVariance(s))}</strong></div></div></div>`}).join('')}</div>${!ss.length?'<div class="empty"><strong>No sessions found</strong>Change the period or status.</div>':''}${pagination(ss.length,16)}</section>`}
function pagination(count,size=20){const pages=Math.max(1,Math.ceil(count/size));return `<div class="pagination"><span>${count?state.txPage*size+1:0}–${Math.min(count,(state.txPage+1)*size)} of ${num(count)}</span><div class="page-buttons"><button class="button" data-paginate="-1" ${state.txPage===0?'disabled':''}>Previous</button><span style="align-self:center">${state.txPage+1} / ${pages}</span><button class="button" data-paginate="1" ${state.txPage+1>=pages?'disabled':''}>Next</button></div></div>`}
function transactionRows(){if(state.tab==='payments'){let ts=tenders.filter(t=>inRange(t));if(state.paymentMethod)ts=ts.filter(t=>t.method===state.paymentMethod);if(state.sessionOnly)ts=ts.filter(t=>t.session===state.sessionOnly);return ts.sort((a,b)=>b.day.localeCompare(a.day)||b.id.localeCompare(a.id))}if(state.tab==='returns')return activeRefunds().sort((a,b)=>b.day.localeCompare(a.day));return receipts.filter(r=>inRange(r)&&(!state.productOnly||r.lines.some(l=>l.pid===state.productOnly))&&(!state.sessionOnly||r.session===state.sessionOnly)&&(state.txStatus!=='void'||r.void)&&(!state.search||[r.id,r.cashier,r.store].join(' ').toLowerCase().includes(state.search.toLowerCase()))).sort((a,b)=>b.day.localeCompare(a.day)||b.time.localeCompare(a.time))}
function transactions(){let html=`<div class="tabs">${[['receipts','Receipts'],['sessions','Sessions'],['payments','Payments'],['returns','Returns & voids']].map(([k,l])=>`<button data-txtab="${k}" class="${state.tab===k?'active':''}">${l}</button>`).join('')}</div>`;if(state.tab==='sessions')return html+sessionsView();if(state.tab==='returns'){html+=`<div class="toolbar"><span class="small">Customer returns and refunds</span><button class="button push" data-action="voids">View voided receipts</button></div>`}else html+=`<div class="toolbar">${state.tab==='receipts'?`<label class="control search">${icon('search')}<input id="search" placeholder="Find receipt or cashier…" value="${esc(state.search)}"></label>`:`<button class="button" data-action="payment-summary">Payment summary</button><label class="control">Method ${select('payment-method',[['all','All methods'],['Cash','Cash'],['QRIS','QRIS'],['Debit BCA','Debit BCA'],['Credit Mandiri','Credit Mandiri']],state.paymentMethod||'all')}</label>`}${state.productOnly||state.sessionOnly||state.txStatus==='void'?`<button class="button" data-action="clear-tx">${state.productOnly?products.find(p=>p.id===state.productOnly).name:state.sessionOnly||'Voided receipts'} ×</button>`:''}<span class="push small">Click a row to inspect its source</span></div>`;
 const rows=transactionRows(),vs=rows.slice(state.txPage*20,state.txPage*20+20),heads=state.tab==='receipts'?['Receipt','Store / cashier','Time','Items','Paid with','Total','Status']:state.tab==='payments'?['Payment / receipt','Store','Method','Date','Amount']:['Return / receipt','Store','Reason','Date','Qty','Refund'];
 const body=vs.map(r=>{if(state.tab==='receipts')return `<tr class="rowlink" data-receipt="${r.id}"><td><strong>${r.id}</strong></td><td>${r.store} · ${r.cashier}</td><td>${pretty(r.day)} · ${r.time}</td><td>${sum(r.lines,'qty')}</td><td>${r.payments.map(t=>t.method).join(' + ')||'—'}</td><td>${money(r.total)}</td><td><span class="status ${r.void?'bad':'good'}">${r.void?'Voided':'Completed'}</span></td></tr>`;if(state.tab==='payments')return `<tr class="rowlink" data-receipt="${r.rid}"><td><strong>${r.id}</strong><small style="display:block">${r.rid}</small></td><td>${r.store}</td><td>${r.method}</td><td>${pretty(r.day)}</td><td>${money(r.amount)}</td></tr>`;return `<tr class="rowlink" data-return="${r.id}"><td><strong>${r.id}</strong><small style="display:block">${r.rid}</small></td><td>${r.store}</td><td>${r.reason}</td><td>${pretty(r.day)}</td><td>${r.qty}</td><td>${money(r.amount)}</td></tr>`}).join('');
 const mobile=vs.map(r=>`<div class="mobile-row"><button class="text-button" ${state.tab==='returns'?`data-return="${r.id}"`:`data-receipt="${r.rid||r.id}"`} style="width:100%"><div class="spread"><strong>${r.id}</strong><strong>${money(r.amount||r.total)}</strong></div><div class="spread small" style="margin-top:8px"><span>${r.store} · ${pretty(r.day)} ${r.time||''}</span><span>${r.method||r.reason||(r.void?'Voided':r.payments.map(t=>t.method).join(' + '))}</span></div></button></div>`).join('');
 return html+`<section class="card"><div class="desktop-table"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div><div class="mobile-cards">${mobile}</div>${!rows.length?'<div class="empty"><strong>No transactions found</strong>Try another period or filter.</div>':''}${pagination(rows.length)}</section>`}
let focusedBeforeDrawer=null;
function showDrawer(title,eyebrow,body,actions=''){focusedBeforeDrawer=document.activeElement;$('#overlay').innerHTML=`<div class="drawer-veil"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-head"><div><small>${esc(eyebrow)}</small><h2>${esc(title)}</h2></div><button class="button" data-close aria-label="Close detail">${icon('close')}</button></div><div class="drawer-body">${body}</div>${actions?`<div class="drawer-actions">${actions}</div>`:''}</section></div>`;document.body.style.overflow='hidden';$('[data-close]').focus()}

function showProduct(id){const oldSearch=state.search,oldPreset=state.preset,oldD=state.division,oldT=state.tag;state.search='';state.preset='all';state.division='all';state.tag='all';const p=productRows().find(p=>p.id===id);Object.assign(state,{search:oldSearch,preset:oldPreset,division:oldD,tag:oldT});if(!p)return;const ss=skus.filter(s=>s.pid===id);showDrawer(p.name,`${p.code} · ${p.division}`,`<div class="kv"><span>Supplier</span><span>${p.supplier}</span></div><div class="kv"><span>Tag</span><span>${p.tag}</span></div><div class="kv"><span>Regular price</span><span>${money(p.price)}</span></div><div class="kv"><span>Purchase price / pc</span><span>${money(p.unitCost)}</span></div><div class="metrics"><div class="metric"><div class="label">Net sales</div><div class="value">Rp${short(p.net)}</div></div><div class="metric"><div class="label">Sold</div><div class="value">${num(p.qty)}</div></div><div class="metric"><div class="label">Gross profit</div><div class="value">Rp${short(p.profit)}</div></div><div class="metric"><div class="label">Stock now</div><div class="value">${num(p.stock)}</div></div></div><h3>SKU variants</h3><table><thead><tr><th>Color / size</th><th>Sold</th><th>Net sales</th></tr></thead><tbody>${ss.map(s=>{const ls=p.ls.filter(l=>l.sku===s.id),fs=p.fs.filter(f=>f.sku===s.id);return`<tr><td>${s.color} · ${s.size}<small style="display:block">${s.code}</small></td><td>${sum(ls,'qty')-sum(fs,'qty')}</td><td>${money(sum(ls,'net')-sum(fs,'amount'))}</td></tr>`}).join('')}</tbody></table><h3 style="margin-top:23px">By store</h3><table><thead><tr><th>Store</th><th>Sold</th><th>Net sales</th></tr></thead><tbody>${stores.filter(s=>state.store==='all'||s.id===state.store).map(s=>{const ls=p.ls.filter(l=>l.store===s.id),fs=p.fs.filter(f=>f.store===s.id);return`<tr><td>${s.id} · ${s.name}</td><td>${sum(ls,'qty')-sum(fs,'qty')}</td><td>${money(sum(ls,'net')-sum(fs,'amount'))}</td></tr>`}).join('')}</tbody></table>`,`<button class="button primary" data-product-receipts="${id}">View receipts ${icon('arrow')}</button>`)}
function showSession(id){const s=sessions.find(s=>s.id===id),d=sessionData(s),gs=['Cash','QRIS','Debit BCA','Credit Mandiri'].map(method=>({method,total:sum(d.ts.filter(t=>t.method===method),'amount')}));showDrawer(s.cashier,s.id,`<div class="kv"><span>Store / terminal</span><span>${s.store} · ${s.terminal}</span></div><div class="kv"><span>Session</span><span>${pretty(s.day)} · ${s.start}–${s.open?'now':s.end}</span></div><div class="kv"><span>Status</span><span class="status ${s.open?'amber':'good'}">${s.open?'Open':'Closed'}</span></div><div class="metrics"><div class="metric"><div class="label">Sales</div><div class="value">Rp${short(d.sales)}</div></div><div class="metric"><div class="label">Receipts</div><div class="value">${d.rs.length}</div></div></div><h3>Payments in this session</h3><table><tbody>${gs.map(g=>`<tr><td>${g.method}</td><td>${money(g.total)}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:24px">Cash drawer</h3><div class="kv"><span>Opening cash</span><span>${money(s.opening)}</span></div><div class="kv"><span>Cash payments</span><span>${money(d.cash)}</span></div><div class="kv"><span>Expected closing cash</span><strong>${money(s.opening+d.cash)}</strong></div><div class="kv"><span>Counted cash</span><span>${s.open?'Not counted':money(s.opening+d.cash+sessionVariance(s))}</span></div><div class="kv"><span>Variance</span><strong class="${sessionVariance(s)?'bad':''}">${s.open?'—':money(sessionVariance(s))}</strong></div><p class="small" style="margin-top:13px">Sample session: no cash movements or refunds in this drawer.</p>`,`<button class="button primary" data-session-receipts="${s.id}">View receipts ${icon('arrow')}</button><button class="button" data-session-payments="${s.id}">Payments</button>`)}
function showReceipt(id){const r=receipts.find(r=>r.id===id);if(!r)return;const rf=refunds.filter(f=>f.rid===r.id);showDrawer(r.id,r.void?'Voided receipt':'Completed sale',`<div class="kv"><span>Store</span><span>${r.store} · ${stores.find(s=>s.id===r.store).name}</span></div><div class="kv"><span>Date / time</span><span>${pretty(r.day)} 2026 · ${r.time}</span></div><div class="kv"><span>Cashier</span><span>${r.cashier}</span></div><div class="kv"><span>Session</span><button class="text-button" style="color:var(--blue)" data-session="${r.session}">${r.session}</button></div><h3 style="margin:22px 0 6px">Items</h3><table><thead><tr><th>Product</th><th>Qty</th><th>Net amount</th></tr></thead><tbody>${r.lines.map(l=>{const p=products.find(p=>p.id===l.pid),s=skus.find(s=>s.id===l.sku);return `<tr><td>${p.name}<small style="display:block">${s.color} · ${s.size}${l.discount?' · '+pct(l.discount/l.gross*100)+' off':''}</small></td><td>${l.qty}</td><td>${money(l.net)}</td></tr>`}).join('')}</tbody></table><div class="kv"><span>Gross sales</span><span>${money(sum(r.lines,'gross'))}</span></div><div class="kv"><span>Discount</span><span>−${money(sum(r.lines,'discount'))}</span></div><div class="kv"><span>Total</span><strong>${money(r.total)}</strong></div><h3 style="margin-top:24px">Payment${r.payments.length>1?'s · split tender':''}</h3>${r.void?'<div class="notice">Voided before payment · excluded from sales and payment totals.</div>':r.payments.map(t=>`<div class="kv"><span>${t.method}</span><strong>${money(t.amount)}</strong></div>`).join('')}${rf.length?`<h3 style="margin-top:22px">Related returns</h3>${rf.map(f=>`<div class="kv"><button class="text-button" data-return="${f.id}" style="color:var(--blue)">${f.id} · ${pretty(f.day)}</button><span>${money(f.amount)}</span></div>`).join('')}`:''}`)}
function showReturn(id){const f=refunds.find(f=>f.id===id),p=products.find(p=>p.id===f.pid);showDrawer(f.id,'Customer return',`<div class="kv"><span>Original receipt</span><button class="text-button" style="color:var(--blue)" data-receipt="${f.rid}">${f.rid}</button></div><div class="kv"><span>Return date</span><span>${pretty(f.day)} 2026</span></div><div class="kv"><span>Store</span><span>${f.store}</span></div><div class="kv"><span>Article</span><span>${p.name}</span></div><div class="kv"><span>Quantity</span><span>${f.qty}</span></div><div class="kv"><span>Reason</span><span>${f.reason}</span></div><div class="kv"><span>Stock</span><span>Returned to sellable stock</span></div><div class="kv"><span>Refund method</span><span>${f.method}</span></div><div class="kv"><span>Refund amount</span><strong>${money(f.amount)}</strong></div><div class="kv"><span>Purchase cost restored</span><span>${money(f.cost)}</span></div>`)}
function render(){const meta={overview:['Overview','Your sales, across every store.'],explorer:['Explorer','From the whole business to a single SKU.'],transactions:['Transactions','Receipts, sessions, and the payments behind them.']};$('#title').textContent=meta[state.page][0];$('#crumb').textContent=meta[state.page][0];$('#subtitle').textContent=meta[state.page][1];document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.page);b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false')});$('#from').value=state.from;$('#to').value=state.to;$('#store-filter').value=state.store;const n=days(state.from,state.to);$('#comparison-caption').textContent=state.page==='overview'&&state.from&&state.to?`Compared with ${pretty(shift(state.from,-n))} – ${pretty(shift(state.from,-1))}`:'';if(state.from>state.to||!state.from||!state.to){$('#date-error').innerHTML='<p class="error" style="margin-bottom:15px">Choose a valid date range.</p>';$('#content').innerHTML='';return}$('#date-error').innerHTML='';$('#content').innerHTML=state.page==='overview'?overview():state.page==='explorer'?explorer():transactions()}
function navigate(page){state.page=page;state.search='';state.txPage=0;state.txStatus='all';state.productOnly=null;state.sessionOnly=null;state.paymentMethod=null;if(page==='overview'){state.preset='all';state.division='all';state.tag='all'}closeDrawer();render();window.scrollTo({top:0,behavior:'instant'})}

function exportCsv(){let headers,rows;if(state.page==='transactions'&&state.tab!=='sessions'){const tx=transactionRows();headers=state.tab==='receipts'?['Receipt','Date','Store','Cashier','Total','Status']:state.tab==='payments'?['Payment','Receipt','Date','Store','Method','Amount']:['Return','Receipt','Date','Store','Qty','Refund'];rows=tx.map(r=>state.tab==='receipts'?[r.id,r.day,r.store,r.cashier,r.total,r.void?'Voided':'Completed']:state.tab==='payments'?[r.id,r.rid,r.day,r.store,r.method,r.amount]:[r.id,r.rid,r.day,r.store,r.qty,r.amount])}else if(state.analysis==='payment'&&state.page==='explorer'){headers=['Method','Payments','Received','Refunded','Net'];rows=paymentGroups().map(g=>[g.method,g.count,g.received,g.refund,g.net])}else if((state.analysis==='session'&&state.page==='explorer')||(state.page==='transactions'&&state.tab==='sessions')){headers=['Session','Date','Store','Cashier','Sales','Cash payments','Status'];rows=sessions.filter(s=>inRange(s)&&(state.txStatus!=='open'||s.open)&&(state.txStatus!=='variance'||sessionVariance(s))).map(s=>{const d=sessionData(s);return[s.id,s.day,s.store,s.cashier,d.sales,d.cash,s.open?'Open':'Closed']})}else{headers=['Article','Name','Division','Net qty','Gross sales','Discount','Net sales','Purchase cost','Profit','Stock'];rows=productRows().map(p=>[p.code,p.name,p.division,p.qty,p.gross,p.discount,p.net,p.cost,p.profit,p.stock])}const csv='\ufeff'+[headers,...rows].map(row=>row.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`sales-${state.page}-${state.from}-${state.to}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV exported · '+rows.length+' rows')}

 for(const k of ['basis','view','storeMode'])if(b.dataset[k]!==undefined){state[k]=b.dataset[k];render();return}if(b.dataset.sort){state.desc=state.sort===b.dataset.sort?!state.desc:true;state.sort=b.dataset.sort;render();return}if(b.dataset.preset){state.preset=b.dataset.preset;state.sort=state.preset==='slow'?'stock':state.preset==='discount'?'discount':'net';state.desc=true;render();return}if(b.dataset.txtab){state.tab=b.dataset.txtab;state.txPage=0;state.txStatus='all';state.search='';state.productOnly=null;state.sessionOnly=null;state.paymentMethod=null;render();return}if(b.dataset.txstatus){state.txStatus=b.dataset.txstatus;state.txPage=0;render();return}if(b.dataset.paginate){state.txPage+=Number(b.dataset.paginate);render();return}
 if(b.dataset.productReceipts||b.dataset.sessionReceipts||b.dataset.sessionPayments){const p=b.dataset.productReceipts,s=b.dataset.sessionReceipts||b.dataset.sessionPayments;closeDrawer();navigate('transactions');state.tab=b.dataset.sessionPayments?'payments':'receipts';state.productOnly=p||null;state.sessionOnly=s||null;render();return}
 const action=b.dataset.action;if(action){if(action==='payment-summary'){state.analysis='payment';showDrawer('Payment summary','Transactions',analysisTable());return}if(action==='customize')return customize();if(action==='apply-custom'){state.group=$('#custom-group').value;state.division=$('#custom-division').value;state.tag=$('#custom-tag').value;state.storeMode=$('#custom-split').checked?'split':'total';state.details=$('#custom-details').checked;closeDrawer();render();return}if(action==='reset-explorer'){Object.assign(state,{group:'article',division:'all',tag:'all',preset:'all',storeMode:'total',details:false,sort:'net',desc:true});render();return}if(action==='clear-tx'){state.productOnly=state.sessionOnly=null;state.txStatus='all';state.txPage=0;render();return}if(action==='voids'){state.tab='receipts';state.txStatus='void';state.txPage=0;render();return}if(action==='best'||action==='running'){navigate('explorer');state.analysis='product';state.preset=action==='best'?'all':'running';state.sort='net';state.desc=true;render()}if(action==='stores'){state.analysis='store';showDrawer('Store performance','Overview',analysisTable())}if(action==='payments'){navigate('transactions');state.tab='payments';render()}if(action==='open-sessions'||action==='returns'){navigate('transactions');state.tab=action==='returns'?'returns':'sessions';state.txStatus=action==='open-sessions'?'open':'all';render()}}
});
document.addEventListener('change',e=>{const m={from:'from',to:'to','store-filter':'store',analysis:'analysis',group:'group',division:'division',tag:'tag','sort-select':'sort'};if(m[e.target.id]){state[m[e.target.id]]=e.target.value;state.txPage=0;state.txStatus='all';if(e.target.id==='sort-select')state.desc=e.target.value!=='name';render()}if(e.target.id==='session-status'){state.txStatus=e.target.value;state.txPage=0;render()}if(e.target.id==='payment-method'){state.paymentMethod=e.target.value==='all'?null:e.target.value;state.txPage=0;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const at=e.target.selectionStart;state.search=e.target.value;state.txPage=0;render();const inp=$('#search');inp?.focus();inp?.setSelectionRange(at,at)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();const dr=$('.drawer');if(e.key==='Tab'&&dr){const els=[...dr.querySelectorAll('button,a,input,select')].filter(x=>!x.disabled),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
window.salesPrototype={state,products,stores,receipts,sessions,tenders,refunds,lines,totals,paymentGroups,productRows,storeSlice,render};render();
})();
