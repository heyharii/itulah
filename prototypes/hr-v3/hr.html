<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itulah People</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --ink:#20242c; --text:#394150; --body:#626b78; --mute:#737c89; --faint:#b9c0c9; --ico:#89919d;
  --canvas:#ffffff; --soft:#f8f9fb; --soft-2:#f0f2f5; --soft-3:#e9ecf1;
  --hair:#e7eaf0; --hair-2:#dce1e8; --hair-strong:#c7ced8;
  --accent:#2563eb; --accent-bg:#eff5ff; --accent-hover:#1d4ed8;
  --ok:#15803d; --ok-bg:#dcf5d6; --warn:#b45309; --warn-bg:#faeacd; --bad:#be123c; --bad-bg:#fbeaea;
  --fin:#5b3fd0; --fin-bg:#f1edfd; --fin-line:#e2dafb; --fin-wash:#fbfaff;
  --ho:#0f6e56; --ho-bg:#e1f5ee;
  --dark:#191b20; --scrim:rgba(247,248,250,.72);
  --shadow-pop:0 4px 8px rgb(24 39 60 / 4%), 0 12px 32px rgb(24 39 60 / 8%);
  --shadow-float:0 8px 24px rgb(24 39 60 / 6%), 0 24px 64px rgb(24 39 60 / 12%);
  --ease:cubic-bezier(.16,1,.3,1);
  --sans:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.ico{flex-shrink:0;display:block}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.shell{display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100%}
.shell.no-side{grid-template-columns:minmax(0,1fr)}
.shell.no-side .side{display:none}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding-inline:16px;background:var(--canvas);border-bottom:1px solid var(--hair)}
.mark{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--dark);color:#fff;font:600 13px var(--sans);flex-shrink:0}
.brand{font-weight:600;color:var(--ink);font-size:14px}
.roles{display:inline-flex;border:1px solid var(--hair-2);border-radius:10px;padding:3px;gap:3px;background:var(--soft);margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.roles a{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--body);text-decoration:none;white-space:nowrap}
.roles a[aria-current="page"]{background:var(--canvas);color:var(--ink);box-shadow:0 1px 2px rgb(24 39 60 / 10%)}
.icon-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--ico);cursor:pointer}
.icon-btn:hover{background:var(--soft-2);color:var(--text)}
.menu-btn{display:none}

.side{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100dvh - 56px - env(safe-area-inset-top,0px));overflow-y:auto;scrollbar-width:none;background:var(--soft);border-right:1px solid var(--hair);padding:12px 10px;display:flex;flex-direction:column}
.side-chip{display:flex;align-items:center;gap:9px;padding:4px 9px 8px}
.side-chip .sq{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;font:600 10.5px var(--sans)}
.side-chip b{font-size:14px;font-weight:600;color:var(--ink)}
.side-chip small{display:block;font-size:11.5px;color:var(--mute);font-weight:400}
.grp{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:14px 9px 5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;color:var(--text);font-size:13.5px;font-weight:500;text-decoration:none}
.nav-item .ico{color:var(--ico)}
.nav-item:hover{background:var(--soft-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--soft-3);color:var(--ink);font-weight:600}
.nav-item[aria-current="page"] .ico{color:var(--ink)}
.badge{margin-left:auto;min-width:19px;height:19px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:600;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn)}
.side-foot{margin-top:auto;padding:14px 9px 2px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--hair)}
.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#e8def4,#f8dde8);flex-shrink:0;font-size:11.5px;font-weight:600;color:#6b3f86}
.avatar.lg{width:48px;height:48px;font-size:16px}
.avatar.cand{background:linear-gradient(135deg,#dbeafe,#e0f2fe);color:#1e4f8f}
.side-foot b{display:block;font-size:12.5px;color:var(--ink);font-weight:500}
.side-foot small{display:block;font-size:11px;color:var(--mute)}

.main{min-width:0;padding:22px 28px 56px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--soft);font-size:13px;color:var(--body);margin-bottom:18px}
.note>.ico{color:var(--accent);margin-top:1px}
.note p{margin:0;flex:1;max-width:100ch}
.note b{color:var(--ink);font-weight:600}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:14px}
.crumb{font-size:12px;color:var(--mute);margin-bottom:3px}
.ph h1{margin:0;font-size:22px;line-height:1.2;font-weight:600;color:var(--ink);letter-spacing:-.015em;text-wrap:balance}
.lead{margin:6px 0 0;font-size:13.5px;color:var(--body);max-width:76ch}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ico);pointer-events:none}
.search input{height:34px;width:220px;max-width:100%;border:1px solid var(--hair-2);border-radius:8px;padding:0 10px 0 32px;font-size:13.5px;background:var(--canvas)}
.btn{height:34px;padding:0 14px;border-radius:8px;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-2);background:var(--canvas);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary[aria-disabled="true"]{background:var(--hair-strong);border-color:var(--hair-strong);cursor:not-allowed}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
select.sel{height:34px;border:1px solid var(--hair-2);border-radius:8px;padding:0 10px;background:var(--canvas);font-size:13.5px}
.sum{display:flex;flex-wrap:wrap;gap:10px 32px;padding:12px 2px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-bottom:16px}
.sum div{display:flex;flex-direction:column;gap:2px}
.sum span{font-size:12px;color:var(--mute)}
.sum strong{font-size:16px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sum strong.warn{color:var(--warn)}.sum strong.bad{color:var(--bad)}.sum strong.ok{color:var(--ok)}
.h2{font-size:15px;font-weight:600;color:var(--ink);margin:26px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.h2 .grow{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--hair);border-radius:12px;padding:14px 16px;background:var(--canvas)}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}

.tbl-wrap{overflow-x:auto;border:1px solid var(--hair);border-radius:12px;background:var(--canvas)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:500;color:var(--body);text-align:left;padding:9px 12px;background:var(--soft);border-bottom:1px solid var(--hair);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--soft)}
td .t{color:var(--ink);font-weight:500}
td .sub,.sub{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.cell-ico{display:flex;align-items:center;gap:10px;min-width:180px}
.empty-row td{text-align:center;color:var(--mute);padding:28px 12px}
tr.total td{font-weight:600;color:var(--ink);background:var(--soft)}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.muted{background:var(--soft-2);color:var(--body)}.pill.accent{background:var(--accent-bg);color:var(--accent)}.pill.line{border:1px solid var(--hair-2);color:var(--text);background:var(--canvas)}
.pill.ho{background:var(--ho-bg);color:var(--ho)}.pill.fin{background:var(--fin-bg);color:var(--fin)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;white-space:nowrap;vertical-align:1px}
.tag.fin{color:var(--fin);background:var(--fin-bg)}.tag.ho{color:var(--ho);background:var(--ho-bg)}.tag.lock{color:var(--body);background:var(--soft-2)}.tag.hrms{color:var(--accent);background:var(--accent-bg)}
.refbtn{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;font-weight:500;text-align:left}
.refbtn:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 10px;border:1px solid var(--hair-2);border-radius:999px;background:var(--canvas);font-size:13px;font-weight:500;color:var(--text);cursor:pointer;white-space:nowrap}
.chip .ico{color:var(--ico)}.chip .n{font-size:12px;color:var(--mute)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.chip[aria-pressed="true"] .ico,.chip[aria-pressed="true"] .n{color:var(--accent)}

/* heatmap, compare grid */
.heat{border-collapse:separate;border-spacing:3px;font-size:12.5px;width:100%}
.heat th{background:none;border:0;padding:4px 6px;text-align:center;color:var(--mute);font-weight:500}
.heat th.row{text-align:left;color:var(--ink);cursor:pointer}
.heat th.row:hover{color:var(--accent)}
.heat td{border:0;padding:0;text-align:center}
.heat td button{width:100%;height:32px;border:0;border-radius:6px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;font-size:12.5px}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend i{display:block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 8%,#fff),var(--accent))}
.cmp td,.cmp th{text-align:center;white-space:nowrap}
.cmp td:first-child,.cmp th:first-child{text-align:left;position:sticky;left:0;background:var(--canvas);z-index:1}
.cmp th:first-child{background:var(--soft)}
.cmp th.site{cursor:pointer}.cmp th.site:hover{color:var(--accent)}
.spark{display:block;width:100%;height:120px}

/* monthly attendance sheet */
.ms{border-collapse:separate;border-spacing:2px;font-size:11.5px;width:auto}
.ms th{background:none;border:0;padding:2px;text-align:center;font-weight:500;color:var(--mute);font-size:11px;line-height:1.2}
.ms th.hol{color:var(--ho)}
.ms th.nm{text-align:left;padding-right:10px;color:var(--ink);font-size:12.5px;white-space:nowrap;position:sticky;left:0;background:var(--canvas);z-index:1}
.ms td{border:0;padding:0}
.ms td.f{padding:0 8px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink);white-space:nowrap}
.cd{display:grid;place-items:center;width:24px;height:26px;border-radius:5px;font-weight:600;font-size:11px;border:0;padding:0}
button.cd{cursor:pointer}
.c-H{background:var(--ok-bg);color:var(--ok)}.c-T{background:var(--warn-bg);color:var(--warn)}.c-D{background:var(--accent-bg);color:var(--accent)}
.c-C{background:#e6eefc;color:#1d4ed8}.c-S{background:var(--fin-bg);color:var(--fin)}.c-A,.c-I{background:var(--bad-bg);color:var(--bad)}
.c-L{background:var(--soft-2);color:var(--faint)}.c-N{background:var(--ho-bg);color:var(--ho)}.c-Q{background:var(--canvas);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.c-X{background:transparent;color:var(--faint)}
.c-P{background:var(--accent-bg);color:var(--accent)}.c-Si{background:#fff4e0;color:#9a5b00}
.ms tr.cov th.nm{color:var(--mute);font-weight:500}
.ms tr.cov td{text-align:center;font-size:11px;color:var(--body)}
.ms tr.cov td.low{color:var(--bad);font-weight:600}

/* funnel, stepper, site strip, bars */
.funnel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fstep{flex:1 1 110px;border:1px solid var(--hair-2);border-radius:10px;padding:10px 12px;background:var(--canvas);cursor:pointer;text-align:left;position:relative}
.fstep b{display:block;font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.fstep span{font-size:12px;color:var(--mute)}
.fstep[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.fstep.neg b{color:var(--bad)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.step{border:1px solid var(--hair);border-radius:10px;padding:10px 12px;background:var(--canvas)}
.step .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11.5px;font-weight:600;background:var(--soft-2);color:var(--body)}
.step.done .n{background:var(--ok-bg);color:var(--ok)}
.step.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step.now .n{background:var(--accent);color:#fff}
.step .t{display:block;font-size:13px;font-weight:500;color:var(--ink);margin-top:8px}
.step.fin{background:var(--fin-wash);border-color:var(--fin-line)}
.sites{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sitec{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--hair-2);font-size:12.5px;background:var(--canvas);cursor:pointer;font-weight:500}
.sitec .dot{width:8px;height:8px;border-radius:50%}
.bar{height:6px;border-radius:3px;background:var(--soft-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.task:last-child{border-bottom:0}
.task .grow{flex:1;min-width:0}
.task .t{color:var(--ink);font-weight:500}
.task.done .t{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.chk{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--ok-bg);color:var(--ok);flex-shrink:0}
.chk.no{background:var(--soft-2);color:var(--faint)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--canvas);border-left:1px solid var(--hair);box-shadow:var(--shadow-float);z-index:41;display:flex;flex-direction:column;animation:slide .26s var(--ease)}
@keyframes slide{from{transform:translateX(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--hair)}
.sheet-h .grow{flex:1;min-width:0}
.sheet-h h2{margin:2px 0 0;font-size:18px;line-height:1.25;font-weight:600;color:var(--ink)}
.sh-sub{font-size:13px;color:var(--body);margin-top:3px}
.sh-title{display:flex;align-items:center;gap:12px}
.sheet-b{overflow-y:auto;padding:18px 20px 32px;display:flex;flex-direction:column;gap:22px}
.sec h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h3 .tag{text-transform:none;letter-spacing:0}
.cap{font-size:12.5px;color:var(--mute);margin:8px 0 0;max-width:64ch}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 16px;margin:0;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;color:var(--ink);min-width:0}
.links{display:flex;flex-direction:column}
.lnk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px}
.lnk:last-child{border-bottom:0}
.lnk .grow{flex:1;min-width:0}.lnk .t{color:var(--ink);font-weight:500}.lnk .sub{color:var(--mute);font-size:12px;display:inline}
button.lnk{cursor:pointer}button.lnk:hover .t{color:var(--accent)}
.empty{margin:0;font-size:13px;color:var(--mute)}
.callout{display:flex;gap:10px;padding:12px;border-radius:10px;background:var(--warn-bg);color:#7a3d06;font-size:13px}
.callout.info{background:var(--soft);color:var(--body);border:1px solid var(--hair)}
.callout.ok{background:var(--ok-bg);color:#14532d}
.callout.bad{background:var(--bad-bg);color:#8a1030}
.callout p{margin:0}.callout .ico{margin-top:1px}
.callout ul{margin:4px 0 0;padding-left:18px}
.fin-box{border:1px solid var(--fin-line);background:var(--fin-wash);border-radius:10px;padding:14px}
.lines{display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--fin-line);font-size:13px}
.ln:last-child{border-bottom:0}
.ln.total{font-weight:600;color:var(--ink)}
.ln .sub{display:inline;margin:0}
.je{display:grid;grid-template-columns:64px minmax(0,1fr) 130px 130px;gap:8px;padding:7px 0;border-bottom:1px solid var(--fin-line);font-size:13px;align-items:baseline}
.je.h{font-size:12px;color:var(--mute);font-weight:500}
.je.total{font-weight:600;color:var(--ink);border-bottom:0}

.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:500;color:var(--body)}
.field input,.field select{height:38px;border:1px solid var(--hair-2);border-radius:8px;padding:0 10px;background:var(--canvas);font-size:13.5px;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.err{font-size:12.5px;color:var(--bad)}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.srcpill{font-size:11.5px;font-weight:500;color:var(--ho);background:var(--ho-bg);padding:2px 8px;border-radius:6px;white-space:nowrap}
.srcpill:empty{display:none}
.fs{border:0;margin:0;padding:0;min-width:0}
.fs legend{font-size:12.5px;font-weight:500;color:var(--body);margin:0 0 8px;padding:0}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.choice.rate{grid-template-columns:repeat(5,minmax(0,1fr))}
.choice.rate .opt{min-height:40px;justify-content:center;padding:6px}

function heatColor(v, m){ const d = METRICS[m]; const all = []; SITES.forEach(s => HEAT_MONTHS.forEach(x => all.push(d.val(s, x)))); const lo = Math.min.apply(null, all), hi = Math.max.apply(null, all); let r = (v - lo) / (hi - lo || 1); if(d.good === 'low') r = 1 - r; const pct = Math.round(8 + r * 80); return `background:color-mix(in srgb,var(--accent) ${pct}%,#fff);color:${pct > 52 ? '#fff' : 'var(--ink)'}`; }

function compareGrid(){

function exceptionTable(filter){

function trendSvg(){
  const pts = HEAT_MONTHS.map(m => total(SITES, x => METRICS.att.val(x, m)) / SITES.length);
  const W = 520, H = 120, lo = 80, hi = 100;
  const xy = pts.map((v, i) => [30 + i * (W - 60) / (pts.length - 1), H - 22 - (v - lo) / (hi - lo) * (H - 44)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tren kehadiran seluruh perusahaan"><line x1="20" x2="${W - 20}" y1="${H - 22}" y2="${H - 22}" stroke="var(--hair)"/><polygon fill="var(--accent-bg)" points="${xy[0][0]},${H - 22} ${xy.map(p => p.join(',')).join(' ')} ${xy[xy.length - 1][0]},${H - 22}"/><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${xy.map(p => p.join(',')).join(' ')}"/>` +
    xy.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === xy.length - 1 ? 4.5 : 3.5}" fill="${i === xy.length - 1 ? 'var(--accent)' : 'var(--canvas)'}" stroke="var(--accent)" stroke-width="2"/><text x="${p[0]}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--mute)">${MONTHS[+HEAT_MONTHS[i].slice(5) - 1]}</text><text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle" font-size="11" fill="var(--ink)">${Math.round(pts[i])}%</text>`).join('') + '</svg>';
}

function dayRecord(id, d){
  const c = code(id, d), sh = shiftOf(id, d), st = SHIFT_TIME[sh] || SHIFT_TIME.P, r = seed(id + d);

  const rec = {d:d, c:c, sh:sh, in:null, out:null, pills:[], src:null, fixable:false, pend:pend};
  if(['H','T','D','?'].includes(c)){
    const late = c === 'T' ? 12 + Math.round(r * 18) : 0;
    rec.in = tAdd(st[0], c === 'T' ? late : -(2 + Math.round(r * 8)));
    rec.out = c === '?' ? null : tAdd(st[1], 1 + Math.round(r * 7) + (ot ? ot.hours * 60 : 0));
    rec.src = fixed ? (fixed.kind === 'dinas' ? 'Dinas luar · disetujui ' + esc(fixed.by || 'kepala toko') : 'Dikoreksi · disetujui ' + esc(fixed.by || 'kepala toko')) : 'Mesin sidik jari ' + eById(id).site;
    if(c === 'H') rec.pills.push({k:'ok', t:'Hadir'});
    if(c === 'T') rec.pills.push({k:'warn', t:'Terlambat ' + late + ' mnt'});
    if(c === 'D') rec.pills.push({k:'accent', t:'Dinas'});
    if(c === '?'){ rec.pills.push({k:'bad', t:'Absen pulang tidak ada'}); rec.fixable = !pend; }
    if(ot) rec.pills.push({k:'fin', t:'Lembur ' + ot.hours + ' j'});

/* =================== decisions =================== */
function decide(kind, id, status){
  const lists = {leave:LEAVES, ot:OT, ar:AREQ, sr:SREQ, claim:CLAIMS, adv:ADVANCES, jr:JR, change:CHANGES};
  const x = lists[kind].find(y => y.id === id); if(!x) return '';
  const who = eById(x.emp);
  if(kind === 'leave'){
    if(status === 'LWP'){ x.type = 'Izin tanpa upah'; status = 'DISETUJUI'; }
    x.status = status; x.by = mgrOwn(x.emp) ? 'Ratna Sari (HR HO)' : 'Budi Hartono';
    notify(x.emp, 'Cuti ' + fmtShort(x.from) + (x.to !== x.from ? '–' + fmtShort(x.to) : '') + (status === 'DISETUJUI' ? ' disetujui' + (x.type === 'Izin tanpa upah' ? ' sebagai izin tanpa upah' : '') : ' ditolak') + ' oleh ' + x.by + '.', 'leave');
    return 'Cuti ' + who.name + (status === 'DISETUJUI' ? ' disetujui (' + x.type + '). Saldo dan lembar absensi ikut.' : ' ditolak.');
  }
  if(kind === 'ar'){ x.status = status; x.by = mgrOwn(x.emp) ? 'Ratna Sari' : 'Budi Hartono'; notify(x.emp, 'Perbaikan absen ' + fmtShort(x.date) + (status === 'DISETUJUI' ? ' disetujui.' : ' ditolak.'), 'hours'); if(status === 'DISETUJUI'){ OVR[x.emp] = OVR[x.emp] || {}; OVR[x.emp][x.date] = x.kind === 'dinas' ? 'D' : 'H'; if(x.date === TODAY && !ATT_TODAY[x.emp]) ATT_TODAY[x.emp] = {in:x.time || '09:00', src:'Koreksi ' + x.id}; } return 'Koreksi ' + x.id + (status === 'DISETUJUI' ? ' disetujui. ' + fmtShort(x.date) + ' tercatat ' + (x.kind === 'dinas' ? 'dinas.' : 'hadir.') : ' ditolak.'); }
  if(kind === 'sr'){ if(status === 'DISETUJUI'){ const a = shiftOf(x.emp, x.date), b = shiftOf(x.with, x.date); ROSTER_OVR[x.emp] = ROSTER_OVR[x.emp] || {}; ROSTER_OVR[x.with] = ROSTER_OVR[x.with] || {}; ROSTER_OVR[x.emp][x.date] = b; ROSTER_OVR[x.with][x.date] = a; } x.status = status; notify(x.emp, 'Tukar shift ' + fmtShort(x.date) + (status === 'DISETUJUI' ? ' disetujui. Roster sudah diperbarui.' : ' ditolak.'), 'hours'); notify(x.with, 'Tukar shift ' + fmtShort(x.date) + ' dengan ' + who.name.split(' ')[0] + (status === 'DISETUJUI' ? ' disetujui.' : ' ditolak.'), 'hours'); return 'Tukar shift ' + (status === 'DISETUJUI' ? 'disetujui. Roster ' + fmtShort(x.date) + ' sudah ditukar.' : 'ditolak.'); }
  if(kind === 'ot'){ if(status === 'BATAL'){ x.status = 'BATAL'; notify(x.emp, 'Perintah lembur ' + fmtShort(x.date) + ' dibatalkan.', 'hours'); return 'Perintah lembur ' + x.id + ' dibatalkan.'; } if(status === 'DISETUJUI'){ x.hours = Math.min(x.planned, x.machineH || x.planned); x.status = 'AUTHORIZED'; notify(x.emp, 'Lembur ' + fmtShort(x.date) + ' disahkan ' + jam(x.hours) + ' jam.', 'hours'); return 'Lembur ' + x.id + ' disahkan ' + jam(x.hours) + ' jam, masuk payroll ' + (inRange(x.date, CUT_FROM, CUT_TO) ? PERIOD : 'Okt 2026') + '.'; } x.status = 'REJECTED'; notify(x.emp, 'Jam lembur ' + fmtShort(x.date) + ' tidak disahkan.', 'hours'); return 'Lembur ' + x.id + ' tidak disahkan.'; }
  if(kind === 'claim'){ x.status = status; notify(x.emp, 'Klaim ' + x.label + (status === 'DISETUJUI' ? ' disetujui ' + rp(sanction(x)) + '. Dibayar Finance.' : ' ditolak.'), 'pay'); return 'Klaim ' + x.id + (status === 'DISETUJUI' ? ' disetujui ' + rp(sanction(x)) + '; diteruskan ke Finance.' : ' ditolak.'); }
  if(kind === 'adv'){ x.status = status; notify(x.emp, 'Uang muka ' + rp(x.amount) + (status === 'DISETUJUI' ? ' disetujui. Finance akan mentransfer.' : ' ditolak.'), 'pay'); return 'Uang muka ' + x.id + (status === 'DISETUJUI' ? ' disetujui; Finance membayar dari 1051.' : ' ditolak.'); }
  if(kind === 'jr'){
    x.status = status; x.decided = 'Ratna Sari';
    if(status === 'DISETUJUI'){ const jo = {id:'JO-00' + (JO.length + 1), site:x.site, role:x.role, jr:x.id, grade:((ORG.roles.find(r => r[0] === x.role) || [0,'G1'])[1]).slice(0, 2), closes:addDays(TODAY, 21), status:'Buka'}; JO.push(jo); x.opening = jo.id; const sp = STAFFING.find(s => s.site === x.site && s.role === x.role); if(sp && sp.plan - filled(sp) - openFor(sp) < 0) sp.plan += x.n; return x.id + ' disetujui. Lowongan ' + jo.id + ' dibuka.'; }
    return x.id + ' ditolak.';
  }
  if(kind === 'change'){
    x.status = status; x.decided = 'Ratna Sari'; x.note = ($('#chNote') || {}).value || null;
    if(status === 'DISETUJUI'){
      const e = who, pv = n => (x.props.find(p => p[0] === n) || [])[2];
      if(x.kind === 'TRANSFER'){ const to = pv('Site'); if(!WORK_HIST.some(a => a.emp === e.id)) WORK_HIST.push({emp:e.id, from:e.join, to:null, site:e.site, role:e.role, reason:'Rekrut'}); WORK_HIST.filter(a => a.emp === e.id && !a.to).forEach(a => a.to = addDays(x.start, -1)); WORK_HIST.push({emp:e.id, from:x.start, to:null, site:to, role:e.role, reason:'Transfer ' + x.id}); e.site = to; }
      if(x.kind === 'PROMOSI'){ if(!WORK_HIST.some(a => a.emp === e.id)) WORK_HIST.push({emp:e.id, from:e.join, to:null, site:e.site, role:e.role, reason:'Rekrut'}); WORK_HIST.filter(a => a.emp === e.id && !a.to).forEach(a => a.to = addDays(x.start, -1)); WORK_HIST.push({emp:e.id, from:x.start, to:null, site:e.site, role:pv('Jabatan'), reason:'Promosi ' + x.id}); e.role = pv('Jabatan'); e.grade = pv('Grade'); }
      if(pv('Base gaji')) SSA.push({emp:e.id, st:ssaOf(e.id).st, base:pv('Base gaji'), from:x.start});
      if(x.kind === 'KELUAR' && !SEPS.some(s => s.emp === e.id)){ e.status = 'Keluar ' + fmtShort(x.start); const sid = 'SEP-00' + (SEPS.length + 1); SEPS.push({id:sid, emp:e.id, last:x.start, reason:x.detail, done:{}, exitNote:'Belum dijadwalkan.', ch:x.id}); FNF.push({id:'FNF-00' + (FNF.length + 1), emp:e.id, sep:sid, status:'DRAFT', leaveLeft:Math.max(0, leaveBal(e))}); }
      return x.id + ' disetujui dan ditulis ke data karyawan per ' + fmtDate(x.start) + '.';
    }
    return x.id + ' ditolak.';
  }
  return '';
}
