<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C5 Handheld Prototype</title>
<style>
/* ── Tokens.kt, value for value (1dp = 1px, sp = px) ───────────────────── */
:root{
  --ink:#20242C; --text:#394150; --body:#626B78; --mute:#737C89; --faint:#B9C0C9; --line-ico:#89919D;
  --canvas:#FFFFFF; --soft:#F8F9FB; --soft2:#F0F2F5; --soft3:#F7F8FA;
  --hairline:#E7EAF0; --hairline2:#DCE1E8; --hairline-strong:#C7CED8;
  --dark:#191B20; --on-dark:#FFFFFF; --shadow:#18273C;
  --accent:#2563EB; --accent-bg:#EFF5FF; --info:#2F86D8; --info-fg:#2C57BF;
  --cta:#2563EB; --cta-fg:#FFFFFF;
  --ok:#36B827; --ok-fg:#15803D; --warn:#C9892E; --warn-fg:#B45309; --bad:#D05151; --bad-fg:#BE123C;
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:20px; --sp-xxl:24px;
  --r-card:12px; --r-inner:7px; --r-shell:16px; --r-sheet:16px;
  --tap-floor:44px; --tap-action:56px; --tap-field:48px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
  --t-press:120ms; --t-hover:120ms; --t-pop:160ms; --t-panel:200ms; --t-page:180ms; --t-sheet:280ms;
  --font:Roboto, "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  /* page around the device (not the app) */
  --page:#E9EBEF; --page-ink:#394150; --body-shell:#2A2D33;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);font-family:var(--font);color:var(--page-ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}

/* type scale (Type.*) */
.t-display{font-size:76px;line-height:82px;font-weight:600;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.t-total{font-size:32px;line-height:35px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.t-hero{font-size:22px;line-height:26px;font-weight:600;letter-spacing:-.022em}
.t-title{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.015em}
.t-kpi{font-size:21px;line-height:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-cardTitle{font-size:14px;line-height:18px;font-weight:600;letter-spacing:-.01em}
.t-metric{font-size:15px;line-height:20px;font-weight:500;font-variant-numeric:tabular-nums}
.t-body{font-size:14px;line-height:20px}
.t-cell{font-size:13.5px;line-height:19px}
.t-control{font-size:14px;line-height:20px;font-weight:500}
.t-action{font-size:16px;line-height:22px;font-weight:500}
.t-section{font-size:12.5px;line-height:16px;font-weight:500;color:var(--mute)}
.t-meta{font-size:12.5px;line-height:17px;font-variant-numeric:tabular-nums}
.t-pill{font-size:11.5px;line-height:14px;font-weight:500}
.t-id{font-size:12.5px;line-height:16px;font-family:var(--mono);font-variant-numeric:tabular-nums;word-break:break-all}
.c-ink{color:var(--ink)} .c-text{color:var(--text)} .c-body{color:var(--body)} .c-mute{color:var(--mute)}
.c-faint{color:var(--faint)} .c-lineico{color:var(--line-ico)} .c-ok{color:var(--ok-fg)} .c-warn{color:var(--warn-fg)} .c-bad{color:var(--bad-fg)}
.center{text-align:center}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── stage ─────────────────────────────────────────────────────────────── */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding:28px 16px;flex-wrap:wrap}
.rig{display:flex;align-items:center;gap:22px}
.device{background:var(--body-shell);border-radius:38px;padding:34px 16px 46px;position:relative;
  box-shadow:0 30px 60px -20px rgba(24,39,60,.45),0 2px 0 rgba(255,255,255,.06) inset}
.device::before{content:"";position:absolute;top:15px;left:50%;width:64px;height:5px;margin-left:-32px;border-radius:3px;background:#15171b}
.device::after{content:"C5";position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#6b7079;font-size:15px;letter-spacing:.2em;font-weight:600}
.screen{width:360px;height:720px;background:var(--canvas);border-radius:6px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.sysbar{height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;color:var(--ink);background:var(--canvas);font-variant-numeric:tabular-nums}
.sysbar .r{display:flex;gap:6px;align-items:center}
.sysbar svg{width:14px;height:14px;fill:var(--ink)}
.app{position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--canvas)}

.trigger-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.trigger{width:84px;height:84px;border-radius:50%;border:0;background:#F28C28;color:#fff;font-weight:600;font-size:15px;
  box-shadow:0 6px 0 #b8611a,0 10px 18px rgba(0,0,0,.18);transition:transform var(--t-press) var(--ease-out),box-shadow var(--t-press) var(--ease-out)}
.trigger:active,.trigger.down{transform:translateY(5px);box-shadow:0 1px 0 #b8611a,0 4px 8px rgba(0,0,0,.18)}
.trigger-hint{font-size:15px;color:var(--mute)}
kbd{font:inherit;border:1px solid var(--hairline2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}

/* state switcher */
.panel{width:300px;font-size:15px;color:var(--text);align-self:center}
.panel details{background:rgba(255,255,255,.7);border:1px solid var(--hairline2);border-radius:12px;padding:10px 14px}
.panel summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none}
.panel summary::-webkit-details-marker{display:none}
.panel .pkg{font-family:var(--mono);font-size:15px;color:var(--mute);margin:8px 0 2px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--hairline)}
.prow:first-of-type{border-top:0}
.seg{display:inline-flex;background:var(--soft2);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:3px 8px;border-radius:5px;font-size:15px;color:var(--body)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(24,39,60,.12)}
.pbtns{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px solid var(--hairline);margin-top:4px}
.pbtns button{border:1px solid var(--hairline2);background:#fff;border-radius:7px;padding:4px 9px;font-size:15px}

@media (max-width:760px){
  .stage{padding:0 0 24px;gap:16px}
  .rig{flex-direction:column;gap:14px;width:100%}
  .device{border-radius:0;padding:0;width:100%;box-shadow:none}
  .device::before,.device::after{display:none}
  .screen{width:100%;height:100svh;max-height:780px;border-radius:0}
  .trigger-wrap{flex-direction:row}
  .panel{width:auto;max-width:100%;padding:0 16px}
}

/* ── app shell ─────────────────────────────────────────────────────────── */
.appbar{height:60px;flex:0 0 60px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--canvas)}
.appbar .slot{width:44px;flex:0 0 44px;display:flex;align-items:center}
.appbar .ttl{flex:1;text-align:center;color:var(--ink)}
.content{position:relative;flex:1;overflow:hidden}
.layer{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--canvas);scrollbar-width:none}
.layer::-webkit-scrollbar{display:none}
.footfade{position:absolute;left:0;right:0;bottom:0;height:110px;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,0) 0%,var(--canvas) 70%)}
.tabbar{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:14px}
.tab{border:0;display:flex;align-items:center;justify-content:center;background:rgba(247,248,250,.9);padding:0;
  transition:background-color var(--t-press) var(--ease-out)}
.tab svg{width:21px;height:21px;fill:var(--line-ico)}
.tab.on{background:var(--accent);box-shadow:0 4px 14px rgba(37,99,235,.38)}
.tab.on svg{fill:var(--on-dark)}

.pad{padding:8px 16px 150px}
.pad120{padding:8px 16px 120px}
.stack>*+*{margin-top:8px}
.stack-md>*+*{margin-top:12px}

/* HubCard */
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-card);padding:16px;
  box-shadow:0 1px 2px rgba(24,39,60,.06);transition:background-color var(--t-press) var(--ease-out),transform var(--t-press) var(--ease-out)}
.card.tight{padding:12px 16px}
.card.press{cursor:pointer;user-select:none}
.card.press:active{background:var(--soft2);transform:scale(.99)}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.gap-sm{gap:8px} .gap-md{gap:12px} .gap-xxl{gap:24px} .gap-xs{gap:4px}

/* Pill */
.pill{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 9px;background:var(--canvas);border:1px solid;border-radius:var(--r-inner);white-space:nowrap}
.pill .dot{width:5px;height:5px;border-radius:50%}
.tone-ok{color:var(--ok-fg);border-color:rgba(21,128,61,.30)} .tone-ok .dot{background:var(--ok)}
.tone-warn{color:var(--warn-fg);border-color:rgba(180,83,9,.30)} .tone-warn .dot{background:var(--warn)}
.tone-bad{color:var(--bad-fg);border-color:rgba(190,18,60,.30)} .tone-bad .dot{background:var(--bad)}
.tone-accent{color:var(--accent);border-color:rgba(37,99,235,.30)} .tone-accent .dot{background:var(--accent)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-inner);
  font-size:14px;line-height:20px;font-weight:500;transition:transform var(--t-press) var(--ease-out),background-color var(--t-press) var(--ease-out);white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.99)}
.btn.big{min-height:56px;padding:0 24px;font-size:16px;line-height:22px}
.btn.full{width:100%}
.btn-primary{background:var(--cta);color:var(--cta-fg);border:0}
.btn-primary:disabled{background:var(--soft2);color:var(--mute);cursor:default}
.btn-quiet{background:var(--canvas);color:var(--text);border:1px solid var(--hairline2)}
.btn-quiet:active:not(:disabled){background:var(--soft2)}
.btn-quiet:disabled{background:var(--soft2);color:var(--mute);border-color:transparent;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{padding:0 14px}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Chip */
.chip{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--canvas);border:1px solid var(--hairline2);
  border-radius:var(--r-inner);box-shadow:0 1px 2px rgba(24,39,60,.06);padding:0;transition:transform var(--t-press) var(--ease-out)}
.chip:active{transform:scale(.99)}
.chip svg{width:18px;height:18px;fill:var(--line-ico)}

/* HubField */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;line-height:17px;font-weight:500;color:var(--text)}
.field input{height:48px;width:100%;border:1px solid transparent;border-radius:var(--r-inner);background:var(--soft2);padding:0 16px;
  font-size:16px;line-height:22px;font-weight:500;color:var(--ink);outline:none;caret-color:var(--accent)}
.field input::placeholder{color:var(--mute);font-weight:500}
.field input:focus{border-color:var(--accent)}
.field .hint{font-size:12.5px;line-height:17px;color:var(--mute)}
.mb-md{margin-bottom:12px}

/* KeyValue */
.kv{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:12px}
.kv .k{font-size:13.5px;line-height:19px;color:var(--mute);white-space:nowrap}
.kv .v{font-size:13.5px;line-height:19px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kv .v.mono{font-family:var(--mono);font-weight:400;font-size:12.5px}
.kv .v.none{color:var(--faint)}

.ico{width:18px;height:18px;flex:0 0 auto}
.ico svg{width:100%;height:100%;display:block}
.pinbox{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0}
.pinbox svg{width:18px;height:18px}
.rot180{transform:rotate(180deg)}
.chev{transition:transform var(--t-panel) var(--ease-out)}

/* Fader */
.fader{position:relative;height:56px;border-radius:var(--r-card);background:var(--soft2);overflow:hidden;touch-action:none;cursor:pointer;user-select:none}
.fader .fill{position:absolute;left:0;top:0;bottom:0;background:var(--hairline2)}
.fader .thumb{position:absolute;top:4px;bottom:4px;width:34px;background:var(--canvas);border:1px solid var(--hairline-strong);border-radius:var(--r-inner);
  box-shadow:0 1px 2px rgba(24,39,60,.08);display:flex;align-items:center;justify-content:center;gap:3px}
.fader .thumb i{display:block;width:2px;height:16px;border-radius:1px;background:var(--hairline-strong)}
.fader.ease .fill{transition:width 320ms var(--ease-out)}
.fader.ease .thumb{transition:left 320ms var(--ease-out)}

/* Rolling digits */
.roll{display:inline-flex;font-variant-numeric:tabular-nums}
.dg{position:relative;display:inline-block;overflow:hidden}
.dg>span{display:block}
.dg>span.abs{position:absolute;left:0;top:0}

/* scanning surface */
.scan{display:flex;flex-direction:column;align-items:center;height:100%;padding:24px 16px 120px}
.scan .spacer{flex:1}
.bigcount{color:var(--faint);transition:color var(--t-panel) var(--ease-out)}
.bigcount.live{color:var(--ok-fg)}

/* transitions */
@keyframes pageIn{from{opacity:0;transform:translateX(var(--from,16%))}to{opacity:1;transform:none}}
@keyframes pageOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(var(--to,-12%))}}
@keyframes surfaceIn{from{opacity:0;transform:translateY(7%)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0}}
.anim-page-in{animation:pageIn var(--t-page) var(--ease-out) both}
.anim-page-out{animation:pageOut var(--t-pop) var(--ease-out) both;pointer-events:none}
.anim-surface-in{animation:surfaceIn var(--t-panel) var(--ease-out) both}
.anim-fade-out{animation:fadeOut var(--t-pop) linear both;pointer-events:none}
.expand{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows var(--t-pop) var(--ease-out),opacity var(--t-pop)}
.expand.open{grid-template-rows:1fr;opacity:1;transition:grid-template-rows var(--t-panel) var(--ease-out),opacity var(--t-panel)}
.expand>div{overflow:hidden}

/* splash */
.splash{position:absolute;inset:0;background:var(--canvas);display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity 260ms}
.splash.gone{opacity:0;pointer-events:none}
.splash svg{width:288px;height:288px;animation:blink 700ms cubic-bezier(0,0,.2,1) infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.35}}

/* pull to refresh */
.ptr{position:absolute;left:50%;top:0;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--canvas);
  box-shadow:0 2px 6px rgba(24,39,60,.18);display:flex;align-items:center;justify-content:center;transform:translateY(-48px);z-index:5}
.ptr .spin{border-color:rgba(47,134,216,.25);border-top-color:var(--info);color:var(--info)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0ms !important;animation-iteration-count:1 !important;transition-duration:0ms !important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="rig">
    <div class="device" aria-label="Chainway C5">
      <div class="screen">
        <div class="sysbar"><span id="clock">14.32</span><span class="r">
          <svg id="wifi" viewBox="0 0 24 24"><path d="M12 21 0 8.5C3.3 5.4 7.5 3.5 12 3.5s8.7 1.9 12 5L12 21z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
          <span>86%</span></span></div>
        <div class="app" id="app">
          <div class="appbar"><div class="slot" id="barLeft"></div><div class="ttl t-title ellip" id="barTitle">Scan</div><div class="slot"></div></div>
          <div class="content" id="content"></div>
          <div class="footfade"></div>
          <nav class="tabbar" id="tabbar"></nav>
          <div class="splash" id="splash"><svg viewBox="0 0 288 288" aria-label="Central">
            <path fill="#E11D2E" d="M120,84 L168,84 A36,36 0 0,1 204,120 L204,168 A36,36 0 0,1 168,204 L120,204 A36,36 0 0,1 84,168 L84,120 A36,36 0 0,1 120,84 Z"/>
            <path d="M166.38,121.62 A31.67,31.67 0 1,0 166.38,166.38" stroke="#fff" stroke-width="16.67" stroke-linecap="round" fill="none"/></svg></div>
        </div>
      </div>
    </div>
    <div class="trigger-wrap">
      <button class="trigger" id="trigger" aria-label="Hardware trigger">Trigger</button>
      <div class="trigger-hint"><kbd>Space</kbd></div>
    </div>
  </div>

  <aside class="panel">
    <details open>
      <summary>States</summary>
      <div class="pkg" id="pkg">id.itulah.pindai.dc</div>
      <div id="panelRows"></div>
      <div class="pbtns">
        <button data-p="splash">Replay splash</button>
        <button data-p="sessions">Open Sessions</button>
        <button data-p="clearHistory">Clear history</button>
        <button data-p="seedHistory">Seed history</button>
      </div>
    </details>
  </aside>
</div>

<script>
"use strict";
/* ═══════════════ motion ═══════════════ */
const RM = window.matchMedia("(prefers-reduced-motion: reduce)");
const motionOn = () => !RM.matches;
const EASE_OUT = "cubic-bezier(.16,1,.3,1)";
const T = { press: 120, pop: 160, panel: 200, page: 180, sheet: 280 };

/* ═══════════════ icons (Material outlined) ═══════════════ */
const P = {
  qr: "M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM22 7h-2V4h-3V2h5v5zm0 15v-5h-2v3h-3v2h5zM2 22h5v-2H4v-3H2v5zM2 2v5h2V4h3V2H2z",
  inv: "M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-1 18H5V9h14v11zm1-13H4V4h16v3zM9 12h6v2H9z",
  inbox: "M16 9h-2.55V6h-2.9v3H8l4 4zm3-6H4.99C3.88 3 3 3.9 3 5v14c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z",

/* tags in front of the reader: threshold dBm = where the tag stops powering up */
function makePopulation(seed, n, skuPool, opts = {}) {
  const r = seeded(seed);
  const tags = [];
  let serial = 1000 + Math.floor(r() * 90000);
  for (let i = 0; i < n; i++) {
    const roll = r();
    let epc, sku = null, kind;
    if (roll < (opts.foreign ?? .06)) { epc = "E280" + hex(20); kind = "foreign"; }
    else if (roll < (opts.foreign ?? .06) + (opts.unknown ?? .03)) { sku = UNKNOWN_SKUS[Math.floor(r() * 2)]; epc = oursEpc(sku, serial++); kind = "unknown"; }
    else { sku = skuPool[Math.floor(Math.pow(r(), 1.6) * skuPool.length)]; epc = oursEpc(sku, serial++); kind = "ours"; }
    // fraction readable at p dBm = ((p-5)/25)^4 → 30: all, 25: ~41%, 20: ~13%, 10: ~0.2%
    tags.push({ epc, sku, kind, threshold: 5 + 25 * Math.pow(r(), .25), pos: r() });
  }
  return tags;
}

function receiveDelivery() {
  const d = S.inbound.chosen; if (!d) return;

  if (S.sweeping) stopSweep();

      DELIVERIES = DELIVERIES.filter(x => x.deliveryId !== d.deliveryId);
    } else if (outcome === "conflict") {

}
function makeReceipt(d, swept, already) {
  const expected = new Map(), sentEpcs = new Map();
  d.population.forEach(t => { if (t.kind === "foreign" || t.extra) return; expected.set(t.sku, (expected.get(t.sku) || 0) + 1); if (!sentEpcs.has(t.sku)) sentEpcs.set(t.sku, []); sentEpcs.get(t.sku).push(t.epc); });
  const got = new Map(); swept.forEach(t => { if (!got.has(t.sku)) got.set(t.sku, []); got.get(t.sku).push(t.epc); });
  const skus = new Set([...expected.keys(), ...got.keys()]);
  const lines = [...skus].map(sku => {
    const exp = expected.get(sku) || 0, rec = (got.get(sku) || []).length;
    const sentSet = new Set(sentEpcs.get(sku) || []), gotSet = new Set(got.get(sku) || []);
    const missingEpcs = [...sentSet].filter(e => !gotSet.has(e)), extraEpcs = [...gotSet].filter(e => !sentSet.has(e));
    return { skuCode: sku, name: CATALOG[sku] ? CATALOG[sku].name : null, expected: exp, received: rec,
      missing: missingEpcs.length, extra: extraEpcs.length, missingEpcs, extraEpcs, hasProblem: missingEpcs.length + extraEpcs.length > 0 };
  }).sort((a, b) => (b.hasProblem - a.hasProblem) || (b.expected - a.expected));
  const sum = k => lines.reduce((s, l) => s + l[k], 0);
  return {
    alreadyReceived: already,
    delivery: { title: deliveryTitle(d), sourceSiteId: d.sourceSiteId, receivedAt: already ? new Date(Date.now() - 50 * 60e3) : new Date(), receivedBy: "handheld" },
    totals: { expectedUnits: sum("expected"), receivedUnits: sum("received"), missingUnits: sum("missing"), extraUnits: sum("extra") },
    lines, skipped: swept.filter(t => t.kind === "unknown").length,
  };
}

function commit() {

  S.busy = true; S.message = "Saving…"; S.failed = false; render();

    } else {

        : current.mode === "COUNT" ? `${received} count entries`

      const queued = S.outboxPending;

      const wasUnannounced = isStoreReceiving() && S.inbound.unannounced;
      engine = null; S.sweepOpen = false; S.counts = emptyCounts(); S.lines = []; S.message = text; S.failed = false;

/* ═══════════════ rolling number ═══════════════ */
function rollHTML(value, cls, id) {
  return `<span class="roll ${cls}" ${id ? `id="${id}"` : ""} data-v="${value}">${String(value).split("").map(d => `<span class="dg"><span>${d}</span></span>`).join("")}</span>`;
}
function setRoll(el, value) {
  if (!el) return;
  const old = el.dataset.v; const s = String(value);
  if (old === s) return;
  el.dataset.v = s;
  while (el.children.length < s.length) { const c = document.createElement("span"); c.className = "dg"; c.innerHTML = "<span></span>"; el.prepend(c); }
  while (el.children.length > s.length) el.firstElementChild.remove();
  const cols = [...el.children];
  for (let i = 0; i < s.length; i++) {
    const place = s.length - i;
    const prev = old.length >= place ? old[old.length - place] : null;
    const next = s[i];
    const col = cols[i];
    if (prev === next) continue;
    const cur = col.lastElementChild;
    if (!motionOn() || prev === null || !cur || !cur.textContent) { col.innerHTML = `<span>${next}</span>`; continue; }
    const up = next > prev;                       // per digit, as in Motion.kt
    [...col.children].slice(0, -1).forEach(n => n.remove());
    const n = document.createElement("span"); n.textContent = next; n.className = "abs";
    col.appendChild(n);
    cur.animate([{ transform: "none", opacity: 1 }, { transform: `translateY(${up ? -100 : 100}%)`, opacity: 0 }], { duration: T.panel, easing: EASE_OUT, fill: "forwards" })
      .onfinish = () => cur.remove();
    n.animate([{ transform: `translateY(${up ? 100 : -100}%)`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: T.panel, easing: EASE_OUT })
      .onfinish = () => n.classList.remove("abs");
  }
}

/* ═══════════════ shell render ═══════════════ */
let lastKey = null;
function screenKey() {
  if (S.tab === "LAB") return "LAB";
  if (S.tab === "SETTINGS") return "SETTINGS";
  if (S.showSessions) return "SESSIONS";
  const scanning = S.sweeping || S.starting;
  if (scanning) return S.tab + ":scan";
  if (isStoreReceiving()) return S.tab + ":recv" + recvStage();
  return S.tab + ":rest" + (S.openSweep != null ? ":d" : "");
}
function bodyHTML() {
  if (S.tab === "LAB" && env.bench) return labScreen();
  if (S.tab === "SETTINGS") return settingsScreen();
  if (S.showSessions) return sessionsScreen();
  if (S.sweeping || S.starting) return scanningSurface();
  if (isStoreReceiving()) return [deliveryList, deliverySweep, receiptView][recvStage()]();
  if (S.openSweep != null) return sweepDetail();
  return history();
}
function render() {
  const pushed = S.showSessions && S.tab !== "SETTINGS";
  document.getElementById("barTitle").textContent = pushed ? "Sessions" : TABS.find(t => t.id === S.tab).label;
  document.getElementById("barLeft").innerHTML = pushed ? `<button class="chip" data-act="closeSessions" aria-label="Back">${svg(P.back, "var(--line-ico)")}</button>` : "";
  renderTabs();
  const content = document.getElementById("content");
  const key = screenKey();
  const html = bodyHTML();
  const cur = content.querySelector(".layer:not(.leaving)");
  if (cur && key === lastKey) {
    if (key.endsWith(":scan")) { // keep the rolling digits alive
      const pillEl = document.getElementById("scanPill");
      if (pillEl) pillEl.innerHTML = S.starting ? pill("warn", "waking the reader") : pill("ok", "reading");
      const al = document.getElementById("alarm"); if (al) al.innerHTML = alarmHTML();
      updateScanning(); return;
    }
    const top = cur.scrollTop; const focused = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.field;
    cur.innerHTML = html; cur.scrollTop = top;
    if (focused) { const f = cur.querySelector(`[data-field="${focused}"]`); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
    bindLayer(cur); return;
  }
  // transition
  const [pt, pk] = [lastKey ? lastKey.split(":")[0] : null, key.split(":")[0]];
  let kind = "none", forward = true;
  if (!lastKey) kind = "none";
  else if (pt !== pk) { kind = "page"; const ids = TABS.map(t => t.id); forward = ids.indexOf(S.tab) >= ids.indexOf(S.prevTab); if (pk === "SESSIONS") forward = true; if (pt === "SESSIONS") forward = false; }
  else if (key.endsWith(":scan") || lastKey.endsWith(":scan")) kind = "surface";
  else if (key.includes(":recv") && lastKey.includes(":recv")) { kind = "page"; forward = +key.slice(-1) >= +lastKey.slice(-1); }
  lastKey = key;
  const layer = document.createElement("div");
  layer.className = "layer"; layer.innerHTML = html;
  if (cur) {
    if (kind === "none" || !motionOn()) cur.remove();
    else {
      cur.classList.add("leaving");
      if (kind === "page") { cur.style.setProperty("--to", forward ? "-12.5%" : "12.5%"); cur.classList.add("anim-page-out"); }
      else cur.classList.add("anim-fade-out");
      setTimeout(() => cur.remove(), T.pop + 20);
    }
  }
  content.appendChild(layer);
  if (kind === "page" && motionOn()) { layer.style.setProperty("--from", forward ? "16.6%" : "-16.6%"); layer.classList.add("anim-page-in"); }
  if (kind === "surface" && motionOn()) layer.classList.add("anim-surface-in");
  bindLayer(layer);
}
function renderTabs() {
  const tabs = visibleTabs();
  const width = document.querySelector(".screen").clientWidth;
  const size = Math.min(54, (width - 24 - 14 * (tabs.length - 1)) / tabs.length);
  const bar = document.getElementById("tabbar");
  bar.innerHTML = tabs.map(t => `<button class="tab ${t.id === S.tab ? "on" : ""}" data-tab="${t.id}" aria-label="${t.label}" style="width:${size}px;height:${size}px;border-radius:${size / 3}px">${svg(t.icon, "")}</button>`).join("");
}

/* per-layer bindings: inputs, fader, pull-to-refresh */
function bindLayer(layer) {
  layer.querySelectorAll("input[data-field]").forEach(inp => inp.addEventListener("input", () => {
    const k = inp.dataset.field, v = inp.value;
    if (k.startsWith("d.")) S.draft[k.slice(2)] = v;
    else if (k === "destination") S.destination = v.trim();
    else if (k === "detailQuery") { S.detailQuery = v; const l = document.getElementById("detailList"); if (l) l.innerHTML = detailList(); }
    else if (k === "skuFilter") { S.skuFilter = v; }
  }));
  const sf = layer.querySelector('input[data-field="skuFilter"]');
  if (sf) sf.addEventListener("change", () => {
    const v = sf.value.trim();
    const parts = v.split("/");
    S.filterNote = !v ? "cleared" : parts.length !== 3 ? "use pointer/bits/hex" : (isNaN(+parts[0]) || isNaN(+parts[1])) ? "pointer and bits must be numbers" : `accepted ptr=${parts[0]} bits=${parts[1]} · sweep to see`;
    render();
  });
  const fader = layer.querySelector("#fader");
  if (fader) bindFader(fader);
  if (layer.querySelector("#ptrBody") && !layer._pull) { layer._pull = true; bindPull(layer); }
}
function bindFader(el) {
  const thumbW = 34;
  const valueAt = x => { const r = el.getBoundingClientRect(); const travel = Math.max(1, r.width - thumbW); return 5 + Math.round(Math.min(1, Math.max(0, (x - r.left - thumbW / 2) / travel)) * 25); };
  const paint = v => {
    const f = (v - 5) / 25;
    el.querySelector(".fill").style.width = `calc((100% - 34px) * ${f} + 34px)`;
    el.querySelector(".thumb").style.left = `calc((100% - 34px) * ${f})`;
    el.setAttribute("aria-valuenow", v);
    const fig = document.getElementById("powerFig"); if (fig) fig.textContent = v;
  };
  let dragging = false;
  el.addEventListener("pointerdown", e => { dragging = true; el.setPointerCapture(e.pointerId); el.classList.remove("ease"); S.power = valueAt(e.clientX); paint(S.power); });
  el.addEventListener("pointermove", e => { if (!dragging) return; S.power = valueAt(e.clientX); paint(S.power); });
  const end = () => { if (!dragging) return; dragging = false; el.classList.add("ease"); commitPower(); };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); S.power = Math.max(5, Math.min(30, S.power + (e.key === "ArrowRight" ? 1 : -1))); paint(S.power); clearTimeout(el._t); el._t = setTimeout(commitPower, 500); }
  });
}
function bindPull(layer) {
  const ptrEl = () => layer.querySelector("#ptr");
  let startY = null, dy = 0;
  layer.addEventListener("pointerdown", e => { if (layer.scrollTop <= 0 && !e.target.closest("button,input")) { startY = e.clientY; dy = 0; } });
  layer.addEventListener("pointermove", e => {
    if (startY == null) return; dy = Math.max(0, Math.min(110, e.clientY - startY));
    const ptr = ptrEl(); if (ptr) ptr.style.transform = `translateY(${dy * .7 - 48}px)`;
  });
  const end = () => {
    if (startY == null) return; startY = null;
    const ptr = ptrEl(); if (!ptr) return;
    if (dy > 70) { ptr.style.transition = `transform ${T.panel}ms ${EASE_OUT}`; ptr.style.transform = "translateY(16px)"; pulling = true; loadInbound(); }
    else { ptr.style.transition = `transform ${T.panel}ms ${EASE_OUT}`; ptr.style.transform = "translateY(-48px)"; }
  };
  layer.addEventListener("pointerup", end); layer.addEventListener("pointerleave", end);
}
let pulling = false;
function endPull() { pulling = false; }

/* ═══════════════ events ═══════════════ */
let discardTimer = null;
const ACT = {
  toggleLabel() {
    if (S.sweeping || S.starting) { S.labelNote = "stop the sweep first"; return; }
    S.labelMode = !S.labelMode; S.labelNote = null;
    S.labelDiag = S.labelMode ? "imager open · asked 0 · started — waiting for a decode" : "";
  },
  setCount(el) { S.countId = el.dataset.id; },
  pin(el, e) { e.stopPropagation(); const r = S.history.find(h => h.id === +el.dataset.id); r.pinned = !r.pinned; },
  openSweep(el) { S.openSweep = +el.dataset.id; S.detailQuery = ""; },
  closeSweep() { S.openSweep = null; },
  chooseDelivery(el) { S.inbound.chosen = S.inbound.deliveries.find(d => d.deliveryId === el.dataset.id); S.inbound.unannounced = false; S.inbound.receipt = null; S.message = null; S.failed = false; },
  unannounced() { S.inbound.chosen = null; S.inbound.unannounced = true; S.inbound.receipt = null; S.message = null; S.failed = false; },
  loadInbound() { loadInbound(); },
  backToDeliveries() { if (S.sweeping || S.busy) return; S.inbound.chosen = null; S.inbound.unannounced = false; S.message = null; S.failed = false; setTimeout(loadInbound, 0); },
  discard() {
    if (S.discardArmed) { S.discardArmed = false; clearTimeout(discardTimer); discardSweep(); return "skip"; }
    S.discardArmed = true; clearTimeout(discardTimer); discardTimer = setTimeout(() => { S.discardArmed = false; render(); }, 4000);
  },
  receiveDelivery() { receiveDelivery(); return "skip"; },
  commit() { commit(); return "skip"; },
  closeReceipt() { closeReceipt(); return "skip"; },
  toggleReceipt(el) {
    const id = el.dataset.id; const was = S.receiptOpen; S.receiptOpen = was === id ? null : id;
    // animate in place rather than re-render
    document.querySelectorAll(".layer:not(.leaving) [data-act=toggleReceipt]").forEach(c => {
      const open = c.dataset.id === S.receiptOpen;
      const x = c.querySelector(".expand"); if (x) x.classList.toggle("open", open);
      const ch = c.querySelector(".chev"); if (ch) ch.classList.toggle("rot180", open);
    });
    return "skip";
  },
  closeSessions() { S.showSessions = false; S.chosenSession = null; },
  chooseSession(el) { S.chosenSession = S.sessions.find(s => s.code === el.dataset.code); },
  joinSession() { setSessionCode(S.chosenSession.code); S.chosenSession = null; S.showSessions = false; },
  sessionBack() { S.chosenSession = null; },
  leaveSession() { setSessionCode(""); },
  newSession() { newSessionCode(); return "skip"; },
  focus() { S.gen2.tagFocus = !S.gen2.tagFocus; callLog(`setGen2Extensions(tagFocus=${S.gen2.tagFocus}, fastId=${S.gen2.fastId}) -> true`); },
  fastid() { S.gen2.fastId = !S.gen2.fastId; callLog(`setGen2Extensions(tagFocus=${S.gen2.tagFocus}, fastId=${S.gen2.fastId}) -> true`); },
  gen2session(el) { S.gen2.session = +el.dataset.s; callLog(`setGen2(session=${el.dataset.s}) -> true`); },
  startQ(el) { callLog(`setGen2(startQ=${el.dataset.q}) -> true`); },
  resetRadio() { S.gen2 = { tagFocus: true, fastId: false, session: 1 }; S.skuFilter = ""; S.filterNote = null; callLog("setGen2(defaults) -> true"); },
  aim(el) { const t = engine && [...engine.seen.keys()][0]; S.filterNote = t ? `aimed at ${t.slice(0, 12)}… (ptr ${el.dataset.p})` : "sweep first — there is no tag to aim at"; },
  oursOnly() { S.oursOnly = !S.oursOnly; S.skuFilter = ""; callLog(`setFilter(1, 32, 8, A1) -> true`); S.filterNote = S.oursOnly ? "accepted · sweep to see whether it HONOURS it" : "cleared"; },
  oursOff() { S.oursOnly = false; S.filterNote = "cleared"; },
  clearFilter() { S.skuFilter = ""; S.filterNote = "cleared"; },
  marry() {
    if (S.sweeping || S.starting) return;
    const orphans = engine ? [...engine.seen.values()].filter(t => t.kind !== "ours").length : 0;
    if (!orphans) { S.aliasNote = "nothing unnamed in the last sweep"; return; }
    if (!catalogueReady()) { S.aliasNote = "no catalogue to marry them to"; return; }
    S.aliasCount += orphans; S.aliasNote = `${orphans} tags married · sweep again`;
  },
  forget() { S.aliasCount = 0; S.aliasNote = "all marriages forgotten"; },
  export() { const n = engine ? engine.seen.size : 0; S.aliasNote = `${n} EPCs written to /storage/emulated/0/Android/data/${NODES[env.app].pkg}/files/epc-sweep.txt`; },
  bench() { if (S.sweeping || S.starting) return; S.countEveryTag = !S.countEveryTag; S.engineBeliefs = `aliases=${S.aliasCount} bench=${S.countEveryTag} known=${catalogueReady() ? S.catalogue.items : 0}`; },
  learn() { S.learning = !S.learning; },
  refreshCatalogue() { refreshCatalogue(); return "skip"; },
  testConn() {
    S.setBusy = true; S.setStatus = null; render();
    setTimeout(() => {
      S.setBusy = false;
      if (!S.draft.baseUrl) { S.setFailed = true; S.setStatus = "failed"; }
      else if (!env.online) { S.setFailed = true; S.setStatus = `Unable to resolve host "${S.draft.baseUrl.replace(/^https?:\/\//, "")}": No address associated with hostname`; }
      else { S.setFailed = false; S.setStatus = "connected · " + (S.draft.siteId.startsWith("store") ? "store" : S.draft.siteId.startsWith("dc") ? "dc" : "?") + " · postgres"; }
      render();
    }, 800);
    return "skip";
  },
  save() { S.settings = { ...S.draft }; S.setFailed = false; S.setStatus = "saved"; refreshCatalogue(); },
};
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { selectTab(tab.dataset.tab); return; }
  const el = e.target.closest("[data-act]");
  if (el && el.closest(".app")) {
    if (el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (fn && fn(el, e) !== "skip") render();
  }
});

/* trigger: the hardware button belongs to the sweep mode on top */
function pullTrigger(code) {
  if (!splashGone) return;
  if (S.learning && S.tab === "SETTINGS") { S.settings.triggerKeyCode = code; S.draft.triggerKeyCode = code; S.learning = false; render(); return; }
  const t = TABS.find(x => x.id === S.tab);
  const armed = t.mode != null && !S.showSessions;
  if (armed) toggleSweep();
}
const trig = document.getElementById("trigger");
trig.addEventListener("click", () => pullTrigger(293));
document.addEventListener("keydown", e => {
  if (e.code !== "Space" || e.repeat) return;
  const tg = e.target;
  if (tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.closest(".panel"))) return;
  e.preventDefault(); trig.classList.add("down"); pullTrigger(62);
});
document.addEventListener("keyup", e => { if (e.code === "Space") trig.classList.remove("down"); });

/* ═══════════════ splash ═══════════════ */
let splashGone = false;
function runSplash() {
  const sp = document.getElementById("splash");
  splashGone = false; sp.classList.remove("gone");
  const ready = 600 + Math.random() * 600; // the radio opening beside the UI
  setTimeout(() => { sp.classList.add("gone"); splashGone = true; }, Math.max(900, ready));
}

/* ═══════════════ state switcher ═══════════════ */
const PANEL = [
  ["app", "App", [["dc", "DC"], ["store", "Store"]]],
  ["bench", "Build", [[true, "debug (Lab)"], [false, "release"]]],
  ["setelan", "Setelan", [["filled", "filled"], ["empty", "empty"]]],
  ["online", "Network", [[true, "online"], [false, "offline"]]],
  ["nextStep", "Second step", [["ok", "ok"], ["fail", "fails"]]],
  ["receive", "Receive delivery", [["ok", "ok"], ["conflict", "409"], ["gone", "404"]]],
  ["deliveries", "Deliveries", [["some", "3"], ["none", "none"], ["404", "404"]]],
  ["catalogue", "Catalogue", [["ready", "gen 42"], ["none", "none"]]],
  ["clock", "Device clock", [["ok", "ok"], ["wrong", "wrong"]]],
];
function renderPanel() {
  document.getElementById("pkg").textContent = `${NODES[env.app].pkg} · ${NODES[env.app].label}`;
  document.getElementById("panelRows").innerHTML = PANEL.map(([k, label, opts]) => `<div class="prow"><span>${label}</span><span class="seg">${opts.map(([v, t]) => `<button class="${env[k] === v ? "on" : ""}" data-env="${k}" data-v="${String(v)}">${t}</button>`).join("")}</span></div>`).join("");
}
document.querySelector(".panel").addEventListener("click", e => {
  const b = e.target.closest("[data-env]");
  if (b) {
    const k = b.dataset.env; let v = b.dataset.v; if (v === "true") v = true; else if (v === "false") v = false;
    env[k] = v;
    if (k === "app" || k === "setelan") {
      if (S.sweeping) stopSweep();
      fillSettings(); engine = null; S.sweepOpen = false; S.counts = emptyCounts(); S.lines = []; S.message = null; S.failed = false;
      S.inbound = { deliveries: [], loaded: false, loading: false, note: null, chosen: null, unannounced: false, receipt: null };
      S.countsLoaded = false; S.countList = []; S.countId = ""; S.sessions = []; S.sessionsLoaded = false;
      DELIVERIES = makeDeliveries();
      if (S.tab === "SETTINGS") enterSettings();
      if (S.mode === "RECEIVING") enterReceiving();
    }
    if (k === "bench" && !v && S.tab === "LAB") { S.prevTab = S.tab; S.tab = "SETTINGS"; enterSettings(); }
    if (k === "online" && v) drainOutbox();
    if (k === "clock" && v === "ok") drainOutbox();
    if (k === "deliveries") { S.inbound.chosen = null; S.inbound.unannounced = false; S.inbound.receipt = null; if (isStoreReceiving()) loadInbound(); }
    if (k === "online") { S.countsLoaded = false; S.countList = []; }
    if (S.mode === "COUNT" && !S.countsLoaded) loadCounts();
    renderPanel(); render(); return;
  }
  const p = e.target.closest("[data-p]");
  if (!p) return;
  if (p.dataset.p === "splash") runSplash();
  if (p.dataset.p === "sessions") { if (S.sweeping) stopSweep(); if (S.tab === "LAB" || S.tab === "SETTINGS") { S.prevTab = S.tab; S.tab = TABS.find(t => t.mode === S.mode).id; } S.showSessions = true; S.chosenSession = null; S.sessionsLoaded = false; loadSessions(); render(); }
  if (p.dataset.p === "clearHistory") { S.history = []; S.openSweep = null; render(); }
  if (p.dataset.p === "seedHistory") { seedHistory(); render(); }
});
function seedHistory() {
  const mkLines = (seed, n) => {
    const r = seeded(seed), m = new Map();
    for (let i = 0; i < n; i++) { const sku = SKUS[Math.floor(Math.pow(r(), 1.5) * SKUS.length)]; m.set(sku, (m.get(sku) || 0) + 1); }
    const lines = [...m.entries()].map(([sku, q]) => ({ skuCode: sku, qty: q, epcs: [], identity: { name: CATALOG[sku].name } }));
    lines.push({ skuCode: UNKNOWN_SKUS[0], qty: 2, epcs: [], identity: null });
    return lines.sort((a, b) => b.qty - a.qty);
  };
  const now = Date.now();
  [[3 * 3600e3, "SCAN", 21, 184], [26 * 3600e3, "COUNT", 22, 412], [50 * 3600e3, "PACKING", 23, 63]].forEach(([ago, mode, seed, n]) => {
    const lines = mkLines(seed, n);
    const known = lines.filter(l => l.identity);
    S.history.push({ id: S.nextId++, endedAt: new Date(now - ago), mode, units: known.reduce((s, l) => s + l.qty, 0), skus: known.length,
      articles: new Set(known.map(l => CATALOG[l.skuCode].article)).size, unknown: 1, foreign: 3, lines, pinned: mode === "COUNT" });
  });
}

/* clock in the status bar */
function tickClock() { const d = new Date(); document.getElementById("clock").textContent = sweepClock(d); }
setInterval(tickClock, 15000); tickClock();
window.addEventListener("resize", renderTabs);

/* boot */
fillSettings(); seedHistory(); renderPanel(); render(); runSplash();
</script>
