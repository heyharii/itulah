<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Retail sales menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Sales menu for retail. Each option copies a real retail back office's
   Sales menu and files it in Central's own shape: department → rows and
   sub-menus that fold (as Finance since 29 Sep). No switcher, no third level.
   Hub as built today: charcoal column, neutral greys, Inter only, 22px page
   title, 18px figures, 36px controls, 52px rows. Nothing below 14px.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ink:#20242c; --text:#394150; --body:#626b78; --mute:#737c89; --faint:#b9c0c9;
  --canvas:#fff; --soft:#f8f8f9; --soft-2:#f0f0f2; --soft-3:#f6f6f7;
  --hairline:#e6e6e9; --hairline-2:#dadade; --ctl:#d3d3d8;
  --rail:#242526; --rail-2:#303234; --rail-3:#393b3d; --rail-ink:#fff; --rail-text:#c3c4c7; --rail-mute:#a1a3a8; --rail-hair:#343638;
  --primary:#2563eb; --primary-ink:#1d4ed8; --primary-soft:#eef4ff;
  --ok:#22a55a; --ok-fg:#15803d; --warn:#d99a2b; --warn-fg:#b45309; --bad:#e25555; --bad-fg:#be123c; --info:#2563eb; --new:#7c3aed;
  --meter:#394150; --shadow:0 1px 2px rgb(20 20 24/.04);
  --h-ctl:36px; --h-row:52px;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f1f2f4; --text:#d0d3d8; --body:#a9adb5; --mute:#8e939c; --faint:#50545b;
  --canvas:#1d1e20; --soft:#232427; --soft-2:#2a2b2e; --soft-3:#161719;
  --hairline:#2e3033; --hairline-2:#383a3e; --ctl:#43464b;
  --rail:#1b1c1d; --rail-2:#27282a; --rail-3:#313335; --rail-hair:#2c2d2f;
  --primary:#4f83f5; --primary-ink:#8cb0ff; --primary-soft:#1d2a44;
  --ok-fg:#5fd08a; --warn-fg:#f0b44f; --bad-fg:#ff8a8a; --new:#a78bfa; --meter:#c9ced6; --shadow:none;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#f1f2f4; --text:#d0d3d8; --body:#a9adb5; --mute:#8e939c; --faint:#50545b;
  --canvas:#1d1e20; --soft:#232427; --soft-2:#2a2b2e; --soft-3:#161719;
  --hairline:#2e3033; --hairline-2:#383a3e; --ctl:#43464b;
  --rail:#1b1c1d; --rail-2:#27282a; --rail-3:#313335; --rail-hair:#2c2d2f;
  --primary:#4f83f5; --primary-ink:#8cb0ff; --primary-soft:#1d2a44;
  --ok-fg:#5fd08a; --warn-fg:#f0b44f; --bad-fg:#ff8a8a; --new:#a78bfa; --meter:#c9ced6; --shadow:none;
  color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--soft-3)}
body{font:400 14px/20px var(--font);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:left}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── Prototype bar ── */
.proto{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;height:52px;padding:0 16px;background:var(--canvas);border-bottom:1px solid var(--hairline)}
.proto .t{font-weight:600;color:var(--ink);white-space:nowrap}
.proto .t span{color:var(--mute);font-weight:400}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--soft-2);overflow-x:auto;scrollbar-width:none;min-width:0}
.seg button{height:30px;padding:0 12px;border-radius:7px;color:var(--body);font-weight:500;white-space:nowrap;transition:background-color .2s var(--ease),color .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--canvas);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08),0 0 0 1px var(--hairline)}
.seg .star{color:var(--primary)}
.proto .sp{flex:1}
.proto .theme{height:30px;padding:0 10px;border-radius:7px;color:var(--body)}
.proto .theme:hover{background:var(--soft-2);color:var(--ink)}

/* ── Central's column (charcoal) ── */
.app{display:grid;grid-template-columns:256px minmax(0,1fr) 344px;min-height:calc(100vh - 52px)}
.side{background:var(--rail);color:var(--rail-text);padding:0 12px 16px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--rail-3) transparent}
.brand{display:flex;align-items:center;gap:10px;height:52px;border-bottom:1px solid var(--rail-hair);margin:0 -12px;padding:0 16px}
.mark{width:28px;height:28px;border-radius:7px;background:#0d0d0f;box-shadow:inset 0 0 0 1px #3a3b3e;color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px;position:relative}
.mark::after{content:"";position:absolute;right:5px;bottom:6px;width:5px;height:5px;border-radius:50%;background:#2563eb}
.brand b{color:var(--rail-ink);font-weight:600;font-size:15px}
.find{display:flex;align-items:center;gap:8px;height:36px;margin:12px 0 10px;padding:0 10px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--rail-hair);color:var(--rail-mute)}
.find .i{width:16px;height:16px}
.find span{flex:1}
.dep{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 10px;border-radius:7px;color:var(--rail-text);transition:background-color .15s,color .15s}
.dep:hover{background:var(--rail-2);color:var(--rail-ink)}
.dep .i{color:var(--rail-mute)}
.dep .cv{margin-left:auto;width:16px;height:16px;color:var(--rail-mute);transition:transform .25s var(--ease)}
.dep.open{color:var(--rail-ink);font-weight:500}
.dep.open .i{color:var(--rail-ink)}
.dep.open .cv{transform:rotate(90deg)}
.dep.inert{cursor:default}
.dep.inert:hover{background:none;color:var(--rail-text)}
.guide{margin:2px 0 8px 19px;padding-left:8px;border-left:1px solid var(--rail-hair);display:flex;flex-direction:column;gap:1px}
.nr{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 10px;border-radius:7px;color:var(--rail-text);transition:background-color .15s,color .15s}
.nr:hover{background:var(--rail-2);color:var(--rail-ink)}
.nr[aria-current]{background:var(--rail-3);color:var(--rail-ink);font-weight:500}
.nr .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nr .cv{width:16px;height:16px;color:var(--rail-mute);transition:transform .25s var(--ease)}
.nr.fold[aria-expanded=true] .cv{transform:rotate(90deg)}
.nr.fold.here{color:var(--rail-ink);font-weight:500}
.nr.soon{cursor:default;color:rgb(161 163 168/.7)}
.nr.soon:hover{background:none}
.pill{border-radius:99px;padding:0 6px;line-height:20px;color:rgb(161 163 168/.85);box-shadow:inset 0 0 0 1px var(--rail-hair)}
.cnt{min-width:22px;padding:0 6px;border-radius:99px;text-align:center;line-height:20px;color:var(--rail-mute);font-weight:500}
.cnt.bad{background:rgb(226 85 85/.2);color:#ffa3a3}
.nw{color:#b9a4ff}
.kids{display:flex;flex-direction:column;gap:1px;padding:0 0 4px 12px}
.kids .nr,.guide>.nr{animation:rise .3s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(-3px)}}

/* ── Page ── */
main{min-width:0;padding:28px 32px 72px}
.page{animation:page .26s var(--ease)}
@keyframes page{from{opacity:0;transform:translateY(5px)}}
.crumb{color:var(--mute)}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head .tx{flex:1;min-width:260px}
.h1{margin-top:2px;font-size:22px;line-height:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.desc{margin-top:4px;color:var(--body);max-width:660px}
.desc .nwt{color:var(--new);font-weight:500}
.desc .xt{color:var(--warn-fg);font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:var(--h-ctl);padding:0 14px;border-radius:7px;font-weight:500;white-space:nowrap;transition:background-color .2s,transform .16s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-g{background:var(--canvas);box-shadow:inset 0 0 0 1px var(--ctl);color:var(--text)}
.btn-g:hover{background:var(--soft)}
.btn-g .i{color:var(--mute);width:16px;height:16px}
.btn-p{background:var(--primary);color:#fff;font-weight:600}
.btn-p:hover{background:var(--primary-ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--canvas);border:1px solid var(--hairline);border-radius:10px;padding:13px 16px;box-shadow:var(--shadow)}
.kpi .l{color:var(--body);font-weight:500}
.kpi .v{margin-top:8px;font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .s{margin-top:4px;color:var(--mute)}
.panel{background:var(--canvas);border:1px solid var(--hairline);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.panel+.panel{margin-top:16px}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;height:var(--h-ctl);padding:0 12px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--ctl);color:var(--mute)}
.search .i{width:16px;height:16px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;height:var(--h-ctl);padding:0 34px 0 12px;border-radius:7px;border:0;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--ctl);color:var(--ink);font-weight:500;cursor:pointer}
.sel select:hover{background:var(--soft)}
.sel .i{position:absolute;right:10px;pointer-events:none;color:var(--mute);width:16px;height:16px}
.h2{padding:14px 16px 6px;font-weight:600;color:var(--ink)}
.h2 span{color:var(--mute);font-weight:400}
table{width:100%;border-collapse:collapse}
th{height:40px;padding:0 16px;text-align:left;font-weight:500;color:var(--body);border-bottom:1px solid var(--hairline);white-space:nowrap}
td{height:var(--h-row);padding:0 16px;border-bottom:1px solid var(--hairline);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--soft)}
tr.kid td{height:44px;color:var(--body);background:var(--soft)}
tr.kid td:first-child{padding-left:42px}
.caret{display:inline-block;width:18px;color:var(--mute);transition:transform .2s var(--ease)}
tr.open .caret{transform:rotate(90deg)}
.t1{color:var(--ink);font-weight:500}
.t2{color:var(--mute)}
.up{color:var(--ok-fg)} .down{color:var(--bad-fg)}
.dot{display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--text)}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.dot.ok::before{background:var(--ok)} .dot.info::before{background:var(--info)}
.dot.warn{color:var(--warn-fg)} .dot.warn::before{background:var(--warn)}
.dot.bad{color:var(--bad-fg)} .dot.bad::before{background:var(--bad)}
.meter{display:flex;align-items:center;gap:10px;min-width:140px}
.meter i{flex:1;height:4px;background:var(--soft-2);border-radius:4px;position:relative;overflow:hidden}
.meter i b{position:absolute;inset:0 auto 0 0;background:var(--meter);border-radius:4px}
.meter i b.ok{background:var(--ok)}
.meter span{width:40px;text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.foot{padding:12px 16px;color:var(--mute);border-top:1px solid var(--hairline)}
.list .it{display:flex;align-items:center;gap:14px;min-height:var(--h-row);padding:10px 16px;border-top:1px solid var(--hairline);cursor:pointer}
.list .it:first-child{border-top:0}
.list .it:hover{background:var(--soft)}
.list .it .tx{flex:1;min-width:0}
.list .it .i{color:var(--faint)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split>div+div{border-left:1px solid var(--hairline)}
.facts{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:4px 16px 8px}
.facts div{padding:12px 0;border-bottom:1px solid var(--hairline)}
.facts div:nth-last-child(-n+2){border-bottom:0}
.facts .l{color:var(--body)} .facts .v{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.facts .tot{font-weight:600;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.card .t1{display:block}
.card .row{display:flex;justify-content:space-between;margin-top:6px;color:var(--body)}
.card .row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.card .btn{margin-top:12px;height:32px;padding:0 12px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0}
.links>div:last-child{border-right:0}
.links>div{padding:6px 16px 14px;border-right:1px solid var(--hairline)}
.links a{display:block;padding:5px 0;color:var(--text);cursor:pointer;text-decoration:none}
.links a:hover{color:var(--primary)}
.shorts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding:16px 20px 0}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart b{width:100%;max-width:44px;background:var(--meter);border-radius:4px 4px 0 0;opacity:.85}
.chart span{color:var(--mute)}

/* ── Notes column ── */
.about{border-left:1px solid var(--hairline);background:var(--canvas);padding:24px 20px 56px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.about .k{color:var(--mute)}
.about h3{margin-top:2px;font-size:18px;line-height:26px;font-weight:600;color:var(--ink);letter-spacing:-.015em}
.about p{margin-top:8px;color:var(--text)}
.about .meta{display:flex;gap:16px;margin-top:14px;padding:12px 0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
.about .meta div{flex:1}
.about .meta b{display:block;font-size:18px;line-height:24px;font-weight:600;color:var(--ink)}
.about .meta span{color:var(--body)}
.about h4{margin-top:20px;font-weight:600;color:var(--ink)}
.theirs{margin-top:6px}
.theirs div{padding:6px 0;border-bottom:1px solid var(--hairline)}
.theirs b{display:block;color:var(--ink);font-weight:500}
.theirs span{color:var(--body)}
.map{margin-top:6px}
.map div{display:grid;grid-template-columns:1fr 16px 1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--hairline);align-items:start}
.map .a{color:var(--body)} .map .b{color:var(--ink);font-weight:500} .map .ar{color:var(--faint)}
.pc{margin-top:6px;padding-left:18px;color:var(--text)}
.pc li{margin-top:4px}
.rec{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--primary-soft);color:var(--ink)}
.rec b{color:var(--primary-ink)}
.caveat{margin-top:16px;color:var(--mute)}

/* ── Compare ── */
.compare{max-width:1240px;margin:0 auto;padding:32px 24px 72px}
.compare td{white-space:normal;height:auto;padding-top:11px;padding-bottom:11px;vertical-align:top}
.compare td.none{color:var(--faint)}
.compare th.us,.compare td.us{background:var(--primary-soft)}
.compare .notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.compare .notes .card p{margin-top:4px;color:var(--body)}

@media (max-width:1600px){
  .two,.split{grid-template-columns:minmax(0,1fr)}
  .split>div+div{border-left:0;border-top:1px solid var(--hairline)}
}
@media (max-width:1520px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .about{grid-column:2;position:static;height:auto;border-left:0;border-top:1px solid var(--hairline);padding:24px 32px 56px}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto}
  .side .dep:not(.open),.find{display:none}
  main{padding:20px 16px 48px}
  .about{grid-column:1;padding:20px 16px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .compare .notes{grid-template-columns:minmax(0,1fr)}
  .proto .t span,.proto .theme{display:none}
  .compare{padding:24px 16px 56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="proto">
  <div class="t">Sales menu <span>· retail</span></div>
  <div class="seg" id="seg" role="group" aria-label="Option"></div>
  <div class="sp"></div>
  <button class="theme" id="theme" title="Light / dark">◐</button>
</div>
<div id="root"></div>

<script>
/* ───────────────────────── helpers ──────────────────────────────────── */
const I={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.3h8.6a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/>',
  shirt:'<path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3a4 4 0 0 1-8 0z"/>',
  truck:'<path d="M2 6h12v10H2zM14 9h4l4 4v3h-8"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  mega:'<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1zM17 9a4 4 0 0 1 0 6"/>',
  trend:'<path d="M3 17 9 11l4 4 8-8"/><path d="M15 7h6v6"/>',
  wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3.5 3 3.5 6"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  right:'<path d="m9 6 6 6-6 6"/>',
  down:'<path d="M12 4v12M6 12l6 6 6-6M4 21h16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
}
const ic=(k,c="i")=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${I[k]||""}</svg>`
const nf=new Intl.NumberFormat("id-ID"), n=v=>nf.format(v)
const neg=v=>v<0?'−'+n(-v):n(v)
const pct=v=>v===0?'<span class="t2">—</span>':`<span class="${v>0?'up':'down'}">${v>0?'+':'−'}${Math.abs(v)}%</span>`
const meter=(v,tone)=>`<div class="meter"><i><b class="${tone||''}" style="width:${Math.min(v,100)}%"></b></i><span>${v}%</span></div>`
const sel=(opts,on)=>`<label class="sel"><select ${on?`onchange="${on}"`:''}>${opts.map((o,i)=>`<option ${on&&i===S.view?'selected':''}>${o}</option>`).join('')}</select>${ic('chev')}</label>`
const search=ph=>`<label class="search">${ic('search')}<input placeholder="${ph}"></label>`
const views=r=>r.views?sel(r.views.map(v=>v.label),'setView(this.selectedIndex)'):''
const exp=`<button class="btn btn-g">${ic('down')}Export</button>`

   cons:['“Statement”, “Transaction register”, “Cues”: accountant words for store heads.','Posting a statement overlaps Finance’s Sales postings.','Names are from product knowledge, not a live copy: check before building.']},

 moka:{name:'Moka · Majoo',kicker:'Copied from Moka Backoffice (Indonesian POS)',title:'Moka · Flat reports',
   rows:[
     R('Dashboard','overview',{desc:'Today’s gross sales, transactions and average, per outlet.'}),
     F('Reports',[R('Sales summary','summary',{desc:'Ringkasan penjualan: gross, discounts, refunds, net, tax.'}),R('Gross profit','summary',{gp:1,desc:'Laba kotor: net sales less cost of goods.'}),R('Payment methods','payments',{desc:'Metode pembayaran.'}),R('Item sales','byArticle',{desc:'Penjualan barang.'}),R('Category sales','byDivision',{desc:'Penjualan kategori.'}),R('Discounts','discounts',{desc:'Diskon: what each discount gave away.'}),R('Collected by','byStaff',{desc:'Dikumpulkan oleh: sales per cashier.'}),R('Transactions','receipts',{desc:'Riwayat transaksi: every sale, refund and void.'}),R('Shifts','closings',{ct:2,bad:1,desc:'Riwayat shift: each cashier’s open, close and cash difference.'})]),
     F('Customers',[R('Customer list','members',{cust:1,desc:'Daftar pelanggan.'}),R('Loyalty','points',{desc:'Points earned and redeemed.'})]),
   ],
   sum:'What store staff in Indonesia already know from Moka, Majoo and iSeller: one flat list of reports named by what they read. F&B reports (modifiers, gratuity, sales type) are left out.',
   theirs:[['Laporan','Ringkasan penjualan · Laba kotor · Metode pembayaran · Tipe penjualan · Penjualan barang · Penjualan kategori · Penjualan modifier · Diskon · Pajak · Gratifikasi · Dikumpulkan oleh · Riwayat transaksi · Shift'],['Pelanggan','Daftar pelanggan · Loyalty · Feedback']],
   meta:[3,12,10],
   map:[['Sales, Returns','Reports › Transactions'],['Exceptions (money)','Reports › Shifts'],['Sales by store','Outlet filter on every report'],['By article, By division','Item sales, Category sales'],['By PO (Soon)','not in Moka']],
   pros:['Familiar to every store head who has used a local POS.','Gross profit and discounts are reports of their own.'],
   cons:['Nine rows in one sub-menu.','Built for one outlet: By store disappears into a filter.','No PO, and category is the highest level.']},
}
const ORDER=['today','retail','erpnext','odoo','lightspeed','ls','moka','compare']
const DEPTS=[['home','home','Home'],['buy','cart','Buying'],['merch','shirt','Merchandise'],['ops','truck','Ops'],['inv','box','Inventory'],['mkt','mega','Marketing'],['sales','trend','Sales'],['fin','wallet','Finance'],['hr','users','HR'],['ga','person','GA']]

/* ───────────────────────── state and render ─────────────────────────── */
const S={opt:'retail',id:'0',view:0,open:{}}
try{const v=JSON.parse(localStorage.getItem('sales-menu-retail')||'null');if(v&&ORDER.includes(v.opt))S.opt=v.opt;const th=localStorage.getItem('sales-menu-retail-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}

// Every row with an id ("2" or "1.3") and the fold it sits in.
function flat(o){const out=[];o.rows.forEach((e,i)=>{if(e.fold)e.items.forEach((r,j)=>out.push({...r,id:`${i}.${j}`,fold:e.fold}));else out.push({...e,id:String(i)})});return out}
const cur=()=>{const all=flat(OPTS[S.opt]);return all.find(r=>r.id===S.id)||all.find(r=>!r.soon)}
function badge(r){return r.ct?`<span class="cnt ${r.bad?'bad':''}">${r.ct}</span>`:r.isNew?'<span class="nw">New</span>':''}
function navRow(r,here){
  if(r.soon)return `<span class="nr soon" title="Not built yet"><span class="lb">${r.label}</span><span class="pill">Soon</span></span>`
  return `<button class="nr" ${here?'aria-current="page"':''} onclick="go('${r.id}')"><span class="lb">${r.label}</span>${badge(r)}</button>`
}
function side(){
  const o=OPTS[S.opt], c=cur()
  let h=`<div class="brand"><div class="mark">C</div><b>Central</b></div><div class="find">${ic('search')}<span>Search</span>⌘K</div>`
  for(const [id,icn,label] of DEPTS){
    if(id!=='sales'){h+=`<button class="dep inert" title="Prototype: only Sales opens">${ic(icn)}${label}${ic('right','i cv')}</button>`;continue}
    h+=`<button class="dep open">${ic(icn)}${label}${ic('right','i cv')}</button><div class="guide">`
    o.rows.forEach((e,i)=>{
      if(!e.fold){h+=navRow({...e,id:String(i)},c.id===String(i));return}
      const inside=c.fold===e.fold, open=S.open[e.fold]??inside
      const rows=e.items.map((r,j)=>({...r,id:`${i}.${j}`}))
      h+=`<button class="nr fold ${inside&&!open?'here':''}" aria-expanded="${open}" onclick="fold('${e.fold}',${!open})"><span class="lb">${e.fold}</span>${open?'':rows.filter(r=>r.ct).map(badge).join('')}${ic('right','i cv')}</button>`
      if(open)h+=`<div class="kids">${rows.map((r,k)=>navRow(r,c.id===r.id).replace('class="nr','style="animation-delay:'+k*25+'ms" class="nr')).join('')}</div>`
    })
    h+='</div>'
  }
  return h
}
function page(){const r=cur();const v=r.views?r.views[S.view]:null;return T[v?v.tpl:r.tpl](r)}
function about(){
  const o=OPTS[S.opt], folds=o.rows.filter(e=>e.fold).length
  return `<div class="k">${o.kicker}</div><h3>${o.title}${o.star?' <span style="color:var(--primary)">★</span>':''}</h3><p>${o.sum}</p>
  <div class="meta"><div><b>${o.meta[0]}</b><span>lines, folded</span></div><div><b>${o.meta[1]}</b><span>rows inside</span></div><div><b>${o.meta[2]}</b><span>to build</span></div></div>
  ${o.theirs?`<h4>${o.star?'Built from':'Their menu, as they file it'}</h4><div class="theirs">${o.theirs.map(t=>`<div><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div>`:''}
  ${o.map?`<h4>Where today’s screens go</h4><div class="map">${o.map.map(m=>`<div><span class="a">${m[0]}</span><span class="ar">→</span><span class="b">${m[1]}</span></div>`).join('')}</div>`:''}
  <h4>Good</h4><ul class="pc">${o.pros.map(x=>`<li>${x}</li>`).join('')}</ul>
  <h4>Costs</h4><ul class="pc">${o.cons.map(x=>`<li>${x}</li>`).join('')}</ul>
  ${o.rec?`<div class="rec">${o.rec}</div>`:''}
  ${S.opt!=='today'&&S.opt!=='retail'?'<p class="caveat">Menus are summarised from product knowledge, not a live crawl. Worth a spot-check before building one literally.</p>':''}`
}

/* ───────────────────────── compare ──────────────────────────────────── */
const CMP=[
 ['Landing page','—','Overview','Selling workspace','Dashboard (till cards)','Retail dashboard','Role centre','Dashboard'],
 ['Every receipt','⌘K only','Sales history (day → store → receipt)','POS Invoice','Orders','Sales history','Transaction register','Riwayat transaksi'],
 ['Refunds','⌘K only','Sales history · Type','POS Invoice · Is Return','Orders (refund)','Sales history','Transaction register','Riwayat transaksi'],
 ['Till closing','—','Closings','POS Closing Entry','Sessions','Register closures','Statements','Shift'],
 ['Payments by method','—','Payments','Sales Payment Summary','Payments','Payment reports','Statement tenders','Metode pembayaran'],
 ['Tills right now','⌘K only','Live','—','Dashboard','Status','POS terminals','—'],
 ['By store','By store','By store','Sales Analytics · Territory','Orders · Point of Sale','Sales · Outlet','Store sales','outlet filter'],
 ['By article','Soon','By article','Item-wise Sales History','Orders · Product','Sales · Product','Item sales','Penjualan barang'],
 ['By PO','Soon','By PO','—','—','Sales · Supplier (not per PO)','—','—'],
 ['By division','Soon','By division','Sales Analytics · Item Group','Orders · Product Category','Sales · Product type','Product group sales','Penjualan kategori'],
 ['By staff','—','By staff','Sales Person','Orders · Salesperson','Sales · Salesperson','Staff sales','Dikumpulkan oleh'],
 ['Members','⌘K only','Members','Customer','Customers','Customers','Member accounts','Daftar pelanggan'],
 ['Points','hidden','Points','Loyalty Point Entry','Discount & Loyalty','Customers (loyalty)','Member point entries','Loyalty'],
]
function compare(){
  const H=['','Today','★ Retail','ERPNext','Odoo','Lightspeed','LS Central','Moka · Majoo']
  return `<div class="compare"><div class="crumb">Compare</div><div class="h1">Where each one files the same thing</div><div class="desc">Thirteen things a retail Sales menu has to hold, and what each product calls them. A dash means it has no place for it.</div>
  <div class="panel" style="margin-top:20px"><div class="tw"><table><thead><tr>${H.map((h,i)=>`<th class="${i===2?'us':''}">${h}</th>`).join('')}</tr></thead><tbody>
  ${CMP.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'t1':''} ${i===2?'us t1':''} ${c==='—'?'none':''}">${c}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>
  <div class="notes">
    <div class="card"><span class="t1">All six have a till closing</span><p>Closings, Sessions, Register closures, Statements, Shift. Central has none as a list today, only the exceptions it raises.</p></div>
    <div class="card"><span class="t1">None gives refunds their own row</span><p>A refund sits in the same list as sales in every one of them. They all list receipts flat; the proposal keeps your day → store → receipt instead.</p></div>
    <div class="card"><span class="t1">Only Central answers By PO</span><p>Till systems stop at supplier. It is a buyer’s report, and it stays our extra in every option.</p></div>
  </div></div>`
}

function render(){
  document.getElementById('seg').innerHTML=ORDER.map(k=>`<button aria-pressed="${S.opt===k}" onclick="pick('${k}')">${k==='compare'?'Compare':OPTS[k].name}${OPTS[k]&&OPTS[k].star?' <span class="star">★</span>':''}</button>`).join('')
  const root=document.getElementById('root')
  root.innerHTML=S.opt==='compare'?compare():`<div class="app"><aside class="side">${side()}</aside><main><div class="page">${page()}</div></main><aside class="about">${about()}</aside></div>`
  try{localStorage.setItem('sales-menu-retail',JSON.stringify({opt:S.opt}))}catch(e){}
}
function pick(k){Object.assign(S,{opt:k,id:'0',view:0,open:{}});if(k!=='compare')S.id=cur().id;render();scrollTo(0,0)}
function go(id){Object.assign(S,{id,view:0});const r=cur();if(r.fold)S.open[r.fold]=true;render();scrollTo(0,0)}
function goLabel(l){const r=flat(OPTS[S.opt]).find(x=>x.label===l);if(r)go(r.id)}
function fold(f,v){S.open[f]=v;render()}
function setView(i){S.view=i;render()}
function toggleKids(tr){tr.classList.toggle('open');let x=tr.nextElementSibling;while(x&&x.classList.contains('kid')){x.hidden=!x.hidden;x=x.nextElementSibling}}
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('sales-menu-retail-theme',r.dataset.theme)}catch(e){}}
render()
</script>
</body>
</html>
