<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packed RFID Verify</title>
<style>
@font-face{font-family:Inter;src:url('/frontend-hub/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--ink:#1d1d1f;--body:#3a3a3c;--mute:#6e6e73;--line:#ececf0;--soft:#f7f7f9;--blue:#2563eb;--blue-bg:#eaf1ff;--green:#1f8a3b;--green-bg:#e8f6ec;--red:#d70015;--red-bg:#fdecee;--amber:#b25e00;--amber-bg:#fff4e0;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:#e9e9ed;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
svg{flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.page{max-width:1100px;margin:16px auto;background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgb(0 0 0 / 5%),0 24px 72px rgb(0 0 0 / 8%);padding:26px 32px 40px}
h1{margin:0 0 20px;font-size:17px;font-weight:650}
.kpis{display:flex;gap:0;margin-bottom:22px}
.kpi{padding:0 24px;border-left:1px solid var(--line)}.kpi:first-child{padding-left:0;border:0}
.kpi span{display:block;color:var(--mute)}.kpi b{font-size:17px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:8px 2px 12px;color:var(--mute);position:relative}
.tab.on{color:var(--ink);font-weight:550}.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.bar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:14px}
.btn{height:38px;padding:0 16px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:scale .12s var(--ease),opacity .15s}
.btn:active{scale:.97}.btn[disabled]{opacity:.45;pointer-events:none}
.primary{background:var(--blue);color:#fff}
.danger{background:#e5484d;color:#fff}
.verify{background:var(--blue-bg);color:var(--blue)}
.ghost{background:#fff;box-shadow:inset 0 0 0 1px #dcdce1}
table{width:100%;border-collapse:collapse}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{text-align:left;font-weight:500;color:var(--mute);background:var(--soft);height:44px;padding:0 14px}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.click:hover td{background:#fafafc;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}
.code{color:var(--mute)}
.ok{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-weight:600}
.no{color:var(--mute)}
.warn{display:inline-flex;align-items:center;gap:5px;color:var(--amber);font-weight:600}
/* scrim + sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / 18%);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:24px}
.scrim.open{display:flex}
.sheet{width:min(880px,100%);max-height:calc(100vh - 48px);background:#fff;border-radius:18px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgb(0 0 0 / 20%);animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;scale:.97}}
.head{padding:22px 28px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.head .ctx{color:var(--mute)}.head .t{font-size:17px;font-weight:650}
.x{margin-left:auto;width:36px;height:36px;border-radius:8px;display:grid;place-items:center}.x:hover{background:var(--soft)}
.sbody{padding:20px 28px;overflow:auto;flex:1}
.foot{padding:12px 28px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:64px}
.foot .grow{flex:1;color:var(--mute)}
.sec{font-weight:600;margin:20px 0 8px}
.line{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.line:first-of-type{border:0}
.ph{width:44px;height:44px;border-radius:9px;background:#eef0f4;display:grid;place-items:center;color:var(--mute)}
.line .grow{flex:1}.line b{font-weight:500}
.big{display:flex;align-items:baseline;gap:8px;margin:4px 0 14px}.big b{font-size:34px;line-height:1}
.ring{width:12px;height:12px;border-radius:50%;background:var(--blue);display:inline-block;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.koli-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);margin:0 6px 6px 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14.5px}
.epc-ok{color:var(--green)}.epc-miss{color:var(--red)}.epc-extra{color:var(--amber)}
@media (max-width:760px){.page{margin:0;border-radius:0;padding:20px 16px}.kpis{flex-wrap:wrap;gap:12px}.kpi{padding:0 12px}.tabs{overflow-x:auto;gap:18px}.tab{white-space:nowrap}.bar{flex-wrap:wrap}.card{overflow-x:auto}table{min-width:640px}}
</style>
</head>
<body>
<div class="page">
  <h1>Allotment</h1>
  <div class="kpis">
    <div class="kpi"><span>To pick</span><b>180 pcs</b></div>
    <div class="kpi"><span>Picked</span><b>187 pcs</b></div>
    <div class="kpi"><span>Packed</span><b>3 koli</b></div>
    <div class="kpi"><span>In transit</span><b>6 koli</b></div>
  </div>
  <div class="tabs"><span class="tab">Picklist 6</span><span class="tab">Picked 11</span><span class="tab on">Packed 3</span><span class="tab">In transit 2</span><span class="tab">Received 0</span></div>
  <div class="bar">
    <button class="btn danger" id="unpack" disabled>Unpack</button>
    <button class="btn verify" id="verifyBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4.9 19.1a10 10 0 0 1 0-14.2M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4M19.1 4.9a10 10 0 0 1 0 14.2"/><circle cx="12" cy="12" r="2"/></svg>
      <span id="verifyLabel">Verify RFID</span>
    </button>
    <button class="btn primary">Dispatch</button>
  </div>
  <div class="card">
    <table>
      <thead><tr><th style="width:48px"><input type="checkbox" id="all" aria-label="All koli"></th><th>Koli</th><th>Store</th><th>Sealed</th><th>RFID</th><th style="text-align:right">Pcs</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<!-- Verify RFID: the chosen koli, scanned -->
<div class="scrim" id="verify"><div class="sheet">
  <div class="head"><div><div class="ctx">Packed</div><div class="t" id="vTitle">Verify RFID</div></div><button class="x" onclick="closeAll()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sbody" id="vBody"></div>
  <div class="foot" id="vFoot"></div>
</div></div>

<!-- One koli, with its EPCs -->
<div class="scrim" id="koli"><div class="sheet">
  <div class="head"><div><div class="ctx" id="kCtx"></div><div class="t" id="kTitle"></div></div><button class="x" onclick="closeAll()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sbody" id="kBody"></div>
  <div class="foot"><button class="btn ghost"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Print packing list</button><span class="grow"></span><button class="btn ghost" onclick="closeAll()">Close</button></div>
</div></div>

<script>
const shirt = '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'
const check = '<svg width="16" height="16" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="m5 12 5 5 9-10"/></svg>'
const epc = (sku, n) => "E280" + sku.replace("·", "") + String(n).padStart(6, "0")
const mk = (sku, name, qty) => ({ sku, name, qty, epcs: Array.from({ length: qty }, (_, i) => epc(sku, i + 1)) })
const KOLI = [
  { id: "a13", no: 1, code: "A00013", store: "C001 · Cikupa", sealed: "21 Oct 2026, 12:18", lines: [mk("00000004·003", "87167 Jaket · HITAM · M", 10), mk("00000004·103", "87167 Jaket · NAVY · M", 10)], verified: null },
  { id: "a11", no: 1, code: "A00011", store: "C002 · Muaro Bungo", sealed: "21 Oct 2026, 11:35", lines: [mk("00000009·001", "Celana Jeans · NAVY · ALL SIZE", 10), mk("00000010·001", "Polo Shirts · PUTIH · ALL SIZE", 5)], verified: "11:52" },
  { id: "a12", no: 2, code: "A00012", store: "C002 · Muaro Bungo", sealed: "21 Oct 2026, 11:35", lines: [mk("00000006·001", "Blouse Tangan Panjang · HITAM · ALL SIZE", 4), mk("00000006·101", "Blouse Tangan Panjang · PUTIH · ALL SIZE", 1)], verified: null },
]
const pcs = (k) => k.lines.reduce((t, l) => t + l.qty, 0)
let picked = new Set()
let scan = null // { ids, found:Set, extra:[], timer }

function rows() {
  document.getElementById("rows").innerHTML = KOLI.map((k) => `
    <tr class="click" onclick="openKoli('${k.id}')">
      <td onclick="event.stopPropagation()"><input type="checkbox" ${picked.has(k.id) ? "checked" : ""} onchange="tick('${k.id}')" aria-label="Koli ${k.no}"></td>
      <td><div>Koli ${k.no}</div><div class="code">${k.code}</div></td>
      <td class="code">${k.store}</td>
      <td class="code num">${k.sealed}</td>
      <td>${k.verified ? `<span class="ok">${check} Verified</span>` : k.failed ? `<span class="warn">${k.failed}</span>` : `<span class="no">Not verified</span>`}</td>
      <td class="num" style="text-align:right">${pcs(k)}</td>
    </tr>`).join("")
  document.getElementById("all").checked = picked.size === KOLI.length
  document.getElementById("verifyBtn").disabled = picked.size === 0
  document.getElementById("unpack").disabled = picked.size === 0
  document.getElementById("verifyLabel").textContent = picked.size > 0 ? `Verify RFID · ${picked.size} koli` : "Verify RFID"
}
function tick(id) { picked.has(id) ? picked.delete(id) : picked.add(id); rows() }
document.getElementById("all").addEventListener("change", (e) => { picked = new Set(e.target.checked ? KOLI.map((k) => k.id) : []); rows() })
document.getElementById("verifyBtn").addEventListener("click", startVerify)

function startVerify() {
  scan = { ids: [...picked], found: new Set(), extra: [], timer: null, done: false }
  document.getElementById("verify").classList.add("open")
  drawVerify()
}
function drawVerify() {
  const ks = KOLI.filter((k) => scan.ids.includes(k.id))
  const want = ks.flatMap((k) => k.lines.flatMap((l) => l.epcs))
  const got = want.filter((e) => scan.found.has(e)).length
  const live = scan.timer !== null
  document.getElementById("vTitle").textContent = `Verify RFID · ${ks.length} koli`
  document.getElementById("vBody").innerHTML = `
    <div>${ks.map((k) => {
      const w = k.lines.flatMap((l) => l.epcs); const g = w.filter((e) => scan.found.has(e)).length
      return `<span class="koli-chip"><b>Koli ${k.no}</b><span class="code">${k.code} · ${k.store.split(" · ")[0]}</span><span class="num ${g === w.length ? "epc-ok" : ""}">${g}/${w.length}</span>${g === w.length ? check : ""}</span>`
    }).join("")}</div>
    <div class="big"><b class="num">${got}</b><span class="code num">of ${want.length} tags</span>${live ? '<span class="ring" style="margin-left:8px"></span><span style="color:var(--blue);font-weight:600">Scanning…</span>' : ""}</div>
    ${scan.done ? `<div style="padding:10px 12px;border-radius:12px;background:${got === want.length && scan.extra.length === 0 ? "var(--green-bg);color:var(--green)" : "var(--amber-bg);color:var(--amber)"}">${got === want.length && scan.extra.length === 0 ? "Every tag is in its koli." : `${want.length - got} tags not read${scan.extra.length ? ` · ${scan.extra.length} tag not in these koli` : ""}. Scan again, or open the koli to see which.`}</div>` : '<div class="code">Hold the handheld over the chosen koli and press the trigger.</div>'}`
  document.getElementById("vFoot").innerHTML = live
    ? `<span class="grow"></span><button class="btn ghost" onclick="stopScan()">Stop</button>`
    : `<span class="grow num">${got} of ${want.length} read</span>
       <button class="btn ghost" onclick="runScan()">${scan.found.size ? "Scan again" : "Scan"}</button>
       <button class="btn primary" ${!scan.done ? "disabled" : ""} onclick="saveVerify()">Save</button>`
}
function runScan() {
  const ks = KOLI.filter((k) => scan.ids.includes(k.id))
  const want = ks.flatMap((k) => k.lines.flatMap((l) => l.epcs))
  scan.timer = setInterval(() => {
    const left = want.filter((e) => !scan.found.has(e))
    if (left.length === 0 || (left.length <= 2 && Math.random() < 0.5 && !scan.again)) {
      if (Math.random() < 0.3) scan.extra = ["E2800000002200300000009"]
      return stopScan()
    }
    scan.found.add(left[Math.floor(Math.random() * left.length)])
    drawVerify()
  }, 90)
  scan.again = scan.found.size > 0
  drawVerify()
}
function stopScan() { clearInterval(scan.timer); scan.timer = null; scan.done = true; drawVerify() }
function saveVerify() {
  for (const k of KOLI.filter((k) => scan.ids.includes(k.id))) {
    const w = k.lines.flatMap((l) => l.epcs); const g = w.filter((e) => scan.found.has(e)).length
    k.scanned = new Set(w.filter((e) => scan.found.has(e)))
    if (g === w.length) { k.verified = new Date().toTimeString().slice(0, 5); k.failed = null }
    else { k.verified = null; k.failed = `${w.length - g} missing` }
  }
  picked = new Set(); closeAll(); rows()
}

function openKoli(id) {
  const k = KOLI.find((one) => one.id === id)
  document.getElementById("kCtx").textContent = `Koli · ${k.store}`
  document.getElementById("kTitle").textContent = `Koli ${k.no} · ${k.code}`
  const state = (e) => k.verified ? '<span class="epc-ok">Read</span>' : k.scanned ? (k.scanned.has(e) ? '<span class="epc-ok">Read</span>' : '<span class="epc-miss">Not read</span>') : '<span class="no">—</span>'
  document.getElementById("kBody").innerHTML = `
    <div class="code" style="margin-bottom:6px">Packed ${k.sealed.split(", ")[1]} · ${pcs(k)} pcs · ${k.verified ? `<span class="ok">${check} RFID verified ${k.verified}</span>` : k.failed ? `<span class="warn">${k.failed}</span>` : "RFID not verified"}</div>
    ${k.lines.map((l) => `<div class="line"><div class="ph">${shirt}</div><div class="grow"><b>${l.name}</b><div class="code num">${l.sku}</div></div><b class="num" style="font-size:17px">${l.qty}</b></div>`).join("")}
    <div class="sec">EPC · ${pcs(k)}</div>
    <div class="card"><table>
      <thead><tr><th style="width:56px">No.</th><th>EPC</th><th>SKU</th><th>Article</th><th>RFID</th></tr></thead>
      <tbody>${k.lines.flatMap((l) => l.epcs.map((e) => ({ e, l }))).map(({ e, l }, i) => `
        <tr><td class="code num">${i + 1}</td><td class="mono">${e}</td><td class="code num">${l.sku}</td><td>${l.name.split(" · ")[0]}</td><td>${state(e)}</td></tr>`).join("")}</tbody>
    </table></div>`
  document.getElementById("koli").classList.add("open")
}
function closeAll() { if (scan?.timer) stopScan(); document.querySelectorAll(".scrim").forEach((s) => s.classList.remove("open")) }
addEventListener("keydown", (e) => { if (e.key === "Escape") closeAll() })
rows()
</script>
</body>
</html>
