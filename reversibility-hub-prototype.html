<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goods flow · how far back, in the hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Measured on the running hub (pos-e2e :5480, 8 Oct 2026): Receiving list,
   Review Count dialog, PO sheet, Count receive sheet. */
:root {
  --ink: #20242c; --text: #394150; --body: #565f6d; --mute: #666f7d; --faint: #89919d;
  --hairline: #e6e6e9; --edge: #dadade; --soft: #f8f8f9; --soft-2: #f0f0f2; --soft-3: #f6f6f7;
  --accent: #2563eb; --info-fg: #2c57bf; --tint: #eff5ff;
  --bad-fg: #be123c; --bad-bg: #fbeaea; --warn-fg: #a64a08; --ok-fg: #137a37;
  --rail: #242526;
  --r-card: 10px; --r-inner: 8px; --r-sheet: 16px;
  --shadow-soft: 0 1px 3px rgba(24, 39, 60, .04);
  --shadow-sheet: 0 8px 24px rgba(24, 39, 60, .06), 0 24px 64px rgba(24, 39, 60, .12);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font: 400 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: -0.09px; color: var(--ink); background: #fff;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.75; flex-shrink: 0; }

/* ── prototype bar ───────────────────────────────────────── */
.proto {
  position: fixed; inset: 0 0 auto 0; z-index: 100; min-height: 48px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px;
  background: #fff; border-bottom: 1px solid var(--hairline);
}
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--soft-2); border-radius: 10px; }
.seg button { height: 30px; padding: 0 12px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--body); transition: background-color 150ms ease, color 150ms ease; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(24, 39, 60, .08), 0 0 0 1px var(--hairline); }
.seg .live { margin-left: 6px; font-size: 14px; color: var(--ok-fg); }
.proto .reset { margin-left: auto; height: 30px; padding: 0 10px; border-radius: 7px; font-size: 14px; color: var(--body); }
.proto .reset:hover { background: var(--soft-2); }

/* ── shell ───────────────────────────────────────────────── */
.shell { position: fixed; inset: 48px 0 0 0; display: grid; grid-template-columns: 68px 232px minmax(0, 1fr); }
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; }
.rail .logo { width: 28px; height: 28px; border-radius: 8px; background: #fff; color: var(--rail); font-weight: 700; display: grid; place-items: center; margin-bottom: 14px; font-size: 16px; }
.rail .ic { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: #b9bcc2; position: relative; }
.rail .ic.on { background: rgba(255, 255, 255, .1); color: #fff; }
.rail .gap { flex: 1; }
.rail .badge { position: absolute; top: 2px; right: 1px; background: var(--accent); color: #fff; font-size: 14px; line-height: 16px; padding: 0 4px; border-radius: 8px; transform: scale(.75); transform-origin: top right; }
.rail .me { width: 28px; height: 28px; border-radius: 50%; background: #3a3b3d; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 600; margin-top: 6px; }
.dept { background: #fff; border-right: 1px solid var(--hairline); display: flex; flex-direction: column; }
.dept .head { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 600; }
.dept .head svg { color: var(--mute); }
.dept nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.dept nav a { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; }
.dept nav a.on { background: var(--tint); color: var(--accent); font-weight: 500; }
.dept nav a .n { color: var(--warn-fg); font-size: 14px; }
.dept .clock { margin-top: auto; border-top: 1px solid var(--hairline); height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 14px; color: var(--text); }
.content { overflow-y: auto; padding: 14px 32px 40px; }
.page-title { font-size: 15px; font-weight: 600; margin: 0 0 8px; line-height: 22px; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 18px; }
.tabs span { padding: 8px 12px 10px; font-size: 14px; font-weight: 500; color: var(--body); position: relative; }
.tabs span.on { color: var(--ink); }
.tabs span.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }

/* cards + tables */
.card { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: hidden; }
table { border-collapse: collapse; width: 100%; }
.dt th { height: 40px; padding: 0 12px; background: var(--soft); border-bottom: 1px solid var(--hairline); color: var(--body); font-size: 14px; font-weight: 500; letter-spacing: .04em; text-align: left; white-space: nowrap; }
.dt td { padding: 12px; color: var(--text); border-bottom: 1px solid var(--hairline); vertical-align: middle; }
.dt tbody tr:last-child td { border-bottom: 0; }
.dt tr.row { height: 75px; }
.dt tr.click { cursor: pointer; transition: background-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .dt tr.click:hover { background: var(--soft); } }
.r { text-align: right !important; }
.two { display: flex; flex-direction: column; line-height: 20px; gap: 2px; min-width: 0; }
.two .a { color: var(--ink); font-weight: 500; }
.two .b { color: var(--mute); font-size: 14px; }
.two .q { color: var(--body); }
.counted { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 20px; }
.counted b { font-weight: 500; color: var(--ink); }
.counted span { color: var(--mute); font-size: 14px; }

/* buttons */
.btn { height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; font-size: 15px; font-weight: 500; white-space: nowrap; transition: transform 160ms var(--ease-out), background-color 150ms ease, opacity 150ms ease; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.soft { background: var(--soft-2); border: 1px solid var(--edge); color: var(--ink); box-shadow: var(--shadow-soft); }
.btn.ghost { color: var(--ink); }
.btn.ghost:hover { background: var(--soft-2); }
.btn.tint { height: 32px; padding: 0 14px; background: var(--tint); color: var(--accent); font-weight: 600; }
.btn.icon { width: 36px; padding: 0; justify-content: center; }
.btn.sm { height: 32px; }

/* list stamps + status words */
.stamp-s { display: inline-block; transform: rotate(-6deg); border: 2px solid currentColor; border-radius: 6px; padding: 1px 8px; font-size: 14px; font-weight: 700; letter-spacing: .1em; line-height: 17px; text-align: center; opacity: .55; white-space: nowrap; }
.ok { color: var(--ok-fg); } .bad { color: var(--bad-fg); } .warn { color: var(--warn-fg); } .info { color: var(--info-fg); }

/* KPI strip + toolbar (PO list) */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 12px 16px; box-shadow: var(--shadow-soft); }
.kpi .l { font-size: 14px; color: var(--body); }
.kpi .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.field { height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 8px; font-size: 14px; color: var(--mute); background: #fff; }

/* ── sheets / dialogs ────────────────────────────────────── */
.scrim { position: fixed; inset: 48px 0 0 0; background: rgba(248, 248, 249, .72); z-index: 20; transition: opacity 200ms ease; }
.scrim.top { z-index: 40; background: rgba(248, 248, 249, .5); }
.sheet {
  position: fixed; top: 68px; right: 20px; bottom: 20px; z-index: 30; width: min(928px, calc(100vw - 40px));
  background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-sheet); box-shadow: var(--shadow-sheet);
  display: flex; flex-direction: column; overflow: hidden;
  transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
}
.sheet.review { width: min(896px, calc(100vw - 40px)); }
.sheet.top { z-index: 50; }
.enter-from { opacity: 0 !important; transform: translateX(12px) scale(.99); }
.scrim.enter-from { transform: none; }
.sh-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 12px 28px; border-bottom: 1px solid var(--hairline); min-height: 68px; }
.sh-head h2 { margin: 0; font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: -0.18px; }
.sh-head h2.s16 { font-size: 16px; line-height: 23px; display: flex; align-items: center; gap: 8px; }
.sh-head .sub { color: var(--mute); }
.sh-head .x { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); margin-top: 6px; margin-right: -6px; }
.sh-head .x:hover { background: var(--soft-2); }
.sh-body { flex: 1; overflow-y: auto; padding: 20px 28px 28px; display: flex; flex-direction: column; gap: 18px; position: relative; }
.sh-body > * { flex-shrink: 0; }
.sh-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--hairline); }
.sh-foot .grow { flex: 1; }
.sh-foot .said { color: var(--body); }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
.facts .l { font-size: 14px; color: var(--body); line-height: 18px; }
.facts .v { font-size: 14px; color: var(--ink); line-height: 22px; margin-top: 4px; }
.factline { display: flex; flex-wrap: wrap; gap: 8px 48px; }
.factline span { color: var(--mute); margin-right: 10px; }

/* tables inside sheets */
.st { border: 1px solid var(--hairline); border-radius: var(--r-card); overflow: hidden; }
.st th { padding: 10px 16px; background: var(--soft); border-bottom: 1px solid var(--hairline); color: var(--body); font-size: 14px; font-weight: 500; text-align: left; white-space: nowrap; }
.st td { padding: 14px 16px; vertical-align: middle; border-bottom: 1px solid var(--hairline); color: var(--ink); }
.st tbody tr:last-child td { border-bottom: 0; }
.st tfoot td { background: var(--soft-2); padding: 14px 16px; border-top: 1px solid var(--hairline); }
.st tfoot tr + tr td { background: var(--soft); }
.st tr.off td { color: var(--mute); }
.st td.ok { color: var(--ok-fg); } .st td.warn { color: var(--warn-fg); } .st td.bad { color: var(--bad-fg); }
.st tr.pick { cursor: pointer; }
.st .item { display: flex; gap: 12px; align-items: flex-start; }
.st .thumb { width: 32px; height: 32px; border-radius: 6px; background: var(--soft-2); display: grid; place-items: center; color: var(--ink); flex-shrink: 0; }
.pill { display: inline-block; padding: 4px 10px; border-radius: 8px; font-weight: 500; }
.pill.bad { background: var(--bad-bg); color: var(--bad-fg); }
.pill.over { background: var(--bad-bg); color: var(--bad-fg); }
.cb { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--edge); display: inline-grid; place-items: center; background: #fff; transition: background-color 120ms ease, border-color 120ms ease; vertical-align: middle; }
.cb.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.cb.on svg { width: 13px; height: 13px; stroke-width: 3; }
.cb.dis { background: var(--soft-2); }
.note { display: flex; align-items: center; gap: 10px; padding: 0 4px; color: var(--body); }
.note b { color: var(--ink); font-weight: 500; }
.ask { display: flex; flex-direction: column; gap: 12px; }
.ask h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 23px; }
textarea { width: 100%; min-height: 88px; resize: vertical; padding: 10px 12px; border: 1px solid var(--edge); border-radius: 8px; font-size: 15px; line-height: 22px; outline: none; transition: border-color 150ms ease, box-shadow 150ms ease; }
textarea:focus, .qty:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
.qty { width: 76px; height: 34px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 8px; text-align: center; font-variant-numeric: tabular-nums; outline: none; background: #fff; }
.qty:disabled { background: var(--soft-2); color: var(--mute); }
.unit { width: 88px; height: 34px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 8px; display: inline-flex; align-items: center; justify-content: space-between; background: #fff; }
.unit svg { width: 14px; height: 14px; color: var(--mute); }
.another { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--body); font-size: 14px; }
.another svg { width: 14px; height: 14px; }
.cnt { display: flex; gap: 8px; align-items: center; }

/* the PO sheet's stamp: it changes with the order, so it is pressed on, not swapped */
.stamp { position: absolute; top: 18px; right: 30px; z-index: 2; transform: rotate(-6deg); border: 2px solid currentColor; border-radius: 8px; padding: 2px 12px; font-size: 18px; font-weight: 700; letter-spacing: .14em; line-height: 26px; opacity: .4; pointer-events: none; white-space: nowrap; transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out), filter 220ms ease; }
.stamp.pressing { opacity: 0; transform: rotate(-6deg) scale(1.12); filter: blur(2px); }
.fold { display: flex; align-items: center; gap: 6px; color: var(--ink); padding-top: 16px; border-top: 1px solid var(--hairline); }
.fold svg { width: 16px; height: 16px; color: var(--mute); }
.fold .c { color: var(--mute); }
.change { color: var(--mute); font-size: 14px; line-height: 20px; }
.change.hl { color: var(--info-fg); }

/* the PO sheet's count banner (live: CountBanner) */
.banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-card); }
.banner.info { background: #eef4fd; color: var(--info-fg); }
.banner.warn { background: #fdf3ea; color: var(--warn-fg); }
.banner svg { width: 20px; height: 20px; }
.banner b { display: block; font-weight: 600; }
.banner span span { display: block; font-size: 14px; }
svg.lucide.inl { width: 15px; height: 15px; vertical-align: -2px; }
.acts { display: flex; flex-direction: column; gap: 10px; margin: 2px 0 0 22px; }
.acts li { list-style: none; display: flex; flex-direction: column; line-height: 20px; }
.acts li span { color: var(--mute); font-size: 14px; }
.acts li.new b { color: var(--info-fg); }
.acts b { font-weight: 500; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 90; transform: translate(-50%, 0); display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--ink); color: #fff; border-radius: 10px; box-shadow: var(--shadow-sheet); font-size: 15px; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
.toast.enter-from { opacity: 0; transform: translate(-50%, 8px); }
.toast svg { color: #7ee2a0; }

/* phone (414 baseline): no rail/department column, sheets full screen, actions stay in the foot */
@media (max-width: 767px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail, .dept { display: none; }
  .content { padding: 12px 16px 32px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .toolbar .field:not(:first-child), .toolbar .hide-p { display: none; }
  .hide-p { display: none; }
  .sheet, .sheet.review { top: 48px; right: 0; bottom: 0; width: 100vw; border-radius: 0; border: 0; }
  .sh-head { padding: 10px 16px; }
  .sh-body { padding: 16px; }
  .sh-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .sh-foot .btn { height: 44px; }
  .st th, .st td, .st tfoot td { padding-left: 10px; padding-right: 10px; }
  .facts { grid-template-columns: 1fr; }
  .stamp { right: 16px; top: 12px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .toast, .stamp { transition: opacity 150ms ease !important; }
  .enter-from, .toast.enter-from, .stamp.pressing { transform: none !important; filter: none !important; }
}

/* ── additions: dialogs, chips, board, store app ─────────── */
.proto label.tg { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--body); cursor: pointer; }
.proto .lbl { font-size: 14px; color: var(--mute); }
.proto a.ext { font-size: 14px; color: var(--accent); text-decoration: none; }
.dlg { position: fixed; z-index: 60; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-sheet); box-shadow: var(--shadow-sheet); overflow: hidden; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
.dlg.wide { width: min(560px, calc(100vw - 32px)); }
.dlg .d-head { padding: 20px 24px 0; }
.dlg h2 { margin: 0; font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: -0.18px; }
.dlg .d-body { padding: 10px 24px 18px; color: var(--body); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.dlg .d-foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 24px 20px; }
.dlg.enter-from { transform: translate(-50%, calc(-50% + 8px)) scale(.985); }
.scrim.z60 { z-index: 55; background: rgba(248, 248, 249, .55); }
.btn.danger { background: var(--bad-bg); color: var(--bad-fg); }
.btn.warnsoft { background: #fdf3ea; color: var(--warn-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 36px; padding: 0 14px; border: 1px solid var(--edge); border-radius: 18px; font-weight: 500; color: var(--text); background: #fff; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 160ms var(--ease-out); }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--tint); border-color: var(--accent); color: var(--accent); }
.lab { font-weight: 500; color: var(--ink); margin-bottom: 6px; display: block; }
.ack { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-inner); background: var(--bad-bg); color: var(--bad-fg); cursor: pointer; }
.stagerow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--hairline); }
.stagerow:first-child { border-top: 0; padding-top: 0; }
.stagerow .a { color: var(--ink); font-weight: 500; }
.stagerow .q { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.stagerow .s { grid-column: 1 / -1; color: var(--mute); }
.stagerow .s.red { color: var(--bad-fg); }
.step { display: inline-flex; align-items: center; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; background: #fff; }
.step button { width: 34px; height: 34px; display: grid; place-items: center; color: var(--text); }
.step button:hover:not(:disabled) { background: var(--soft-2); }
.step button:disabled { opacity: .35; cursor: default; }
.step input { width: 52px; height: 34px; border: 0; border-left: 1px solid var(--edge); border-right: 1px solid var(--edge); text-align: center; font-variant-numeric: tabular-nums; outline: none; background: #fff; }
.step input:focus { background: var(--tint); }
.tone-ok { color: var(--ok-fg); } .tone-info { color: var(--info-fg); } .tone-warn { color: var(--warn-fg); } .tone-bad { color: var(--bad-fg); } .tone-mute { color: var(--mute); }
.dotw { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.dotw::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dotw.ok::before { background: #36b827; } .dotw.info::before { background: var(--accent); } .dotw.warn::before { background: #c9892e; } .dotw.bad::before { background: #d05151; }
.lane-note { color: var(--mute); padding: 6px 2px 14px; }

/* board */
.lanes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; align-items: start; }
.lane .lh { display: flex; align-items: center; gap: 8px; height: 34px; font-weight: 600; color: var(--ink); }
.lane .lh i { width: 8px; height: 8px; border-radius: 50%; }
.lane .lh .c { color: var(--mute); font-weight: 400; }
.lane .lh .p { margin-left: auto; color: var(--mute); font-weight: 400; font-variant-numeric: tabular-nums; }
.lane .none { padding: 14px; border: 1px dashed var(--edge); border-radius: var(--r-card); color: var(--faint); }

/* store app (frontend-store-new) */
.phonewrap { display: grid; place-items: start center; padding: 22px 16px 40px; background: var(--soft-3); min-height: 100%; }

.phone .ptop { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: #fff; border-bottom: 1px solid var(--hairline); font-weight: 600; font-size: 16px; }
.phone .ptop .me { width: 30px; height: 30px; border-radius: 50%; background: var(--tint); color: var(--accent); display: grid; place-items: center; font-size: 14px; font-weight: 600; }
.phone .pscroll { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

.phone .dock span.on { color: var(--accent); }
.lead { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: hidden; text-align: left; width: 100%; cursor: pointer; transition: transform 160ms var(--ease-out); }
.lead:active { transform: scale(.99); }
.lead .l1 { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px 12px; }
.lead .tt { color: var(--ink); font-weight: 600; }
.lead .sb { color: var(--mute); }
.lead .big { text-align: right; font-size: 24px; font-weight: 600; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
.lead .big span { display: block; font-size: 14px; font-weight: 400; color: var(--mute); }
.lead .l2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--hairline); color: var(--body); }
.pstrip { display: grid; grid-template-columns: 1fr 1fr; background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); }
.pstrip div { padding: 12px 16px; } .pstrip div + div { border-left: 1px solid var(--hairline); }
.pstrip b { display: block; font-size: 18px; font-weight: 600; color: var(--ink); } .pstrip span { color: var(--body); }
.psheet { position: absolute; inset: 14px 0 0 0; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(24, 39, 60, .14); display: flex; flex-direction: column; z-index: 5; transition: transform 240ms var(--ease-out), opacity 200ms ease; }
.psheet.enter-from { transform: translateY(24px); opacity: 0; }
.pscrim { position: absolute; inset: 0; background: rgba(24, 39, 60, .25); z-index: 4; }
.psheet .ph { padding: 14px 18px 10px; border-bottom: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.psheet .ph h3 { margin: 0; font-size: 17px; font-weight: 600; } .psheet .ph .x { width: 36px; height: 36px; display: grid; place-items: center; color: var(--faint); border-radius: 8px; }
.psheet .pb { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.psheet .pf { padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hairline); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.psheet .pf .btn { height: 44px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--hairline); align-items: center; }

.prow .a { color: var(--ink); font-weight: 500; } .prow .b { grid-column: 1 / -1; color: var(--mute); }
.passbadge { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: #fdf3ea; color: var(--warn-fg); font-weight: 500; }
.passbadge.ok { background: #e8f6e6; color: var(--ok-fg); }
.badge-s { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; font-weight: 500; white-space: nowrap; }
.badge-s.warn { background: #fdf3ea; color: var(--warn-fg); } .badge-s.ok { background: #e8f6e6; color: var(--ok-fg); } .badge-s.info { background: #eef4fd; color: var(--info-fg); } .badge-s.bad { background: var(--bad-bg); color: var(--bad-fg); }
.hint { color: var(--mute); }
@media (max-width: 767px) {
  .lanes { grid-template-columns: 1fr; }
  .dlg { top: auto; bottom: 0; left: 0; transform: none; width: 100vw; border-radius: 16px 16px 0 0; max-height: 90vh; }
  .dlg.enter-from { transform: translateY(16px); }
  .dlg .d-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .dlg .d-foot .btn { height: 44px; flex: 1; }
  .dlg .d-head, .dlg .d-body { padding-left: 16px; padding-right: 16px; }
  .chip { height: 44px; }
  .phonewrap { padding: 0; } .phone { width: 100vw; height: calc(100vh - 100px); border-radius: 0; border: 0; box-shadow: none; }
}

/* ── inventory exceptions, journey hint ── */
.inbox { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }

.cli { text-align: left; background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; transition: border-color 120ms ease, transform 160ms cubic-bezier(.23, 1, .32, 1); }
.cli:active { transform: scale(.99); }

.cli .l1, .cli .l3 { display: flex; justify-content: space-between; gap: 10px; }
.cli .l1 .a { color: var(--ink); font-weight: 500; }
.cli .l2 { display: flex; justify-content: space-between; gap: 10px; color: var(--body); }
.cli .l3 { color: var(--mute); }
.cpane { overflow: hidden; }
.cpane .chead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 22px 12px; border-bottom: 1px solid var(--hairline); }

.quote { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--soft-3); border-radius: 0 var(--r-inner) var(--r-inner) 0; color: var(--body); }
.quote b { display: block; color: var(--ink); font-weight: 500; }
.dt tr.grp td { background: var(--soft-3); color: var(--mute); font-weight: 500; padding: 8px 16px; }
.show-p { display: none; }
.proto .jh { flex-basis: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 12px; border-radius: 10px; background: var(--tint); color: var(--info-fg); }
.proto .jh b { color: var(--accent); font-weight: 600; white-space: nowrap; }
.proto .jh .t { color: var(--ink); font-weight: 500; }
.proto .jh .d { color: var(--body); }
.proto .jh .btn.sm { height: 30px; }
@media (max-width: 767px) {
  .inbox { grid-template-columns: 1fr; }
  .show-p { display: block; }
  .proto .jh .d { display: none; }
  .proto #flows { flex-basis: 100%; max-width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .proto #flows button { flex: none; }
  .proto a.ext { display: none; }
  .proto select.scr { flex: 1; max-width: none; }
  .proto .jh { padding: 6px 10px; gap: 8px; }
  .proto .jh .t { flex: 1 1 100px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proto .jh .btn.tint { margin-left: auto; }
  .proto .jh .btn.soft { display: none; }
}
.proto select.scr { height: 30px; border: 1px solid var(--edge); border-radius: 7px; padding: 0 8px; background: #fff; font: inherit; font-size: 14px; color: var(--ink); max-width: 260px; }


/* ── layout overrides: the bar can wrap, so insets read --barh ── */
.shell { inset: var(--barh, 48px) 0 0 0; }
.scrim { inset: var(--barh, 48px) 0 0 0; }
.sheet { top: calc(var(--barh, 48px) + 20px); }
.phonewrap { position: fixed; inset: var(--barh, 48px) 0 0 0; overflow: auto; }
.tabs span { cursor: pointer; }
.proto a.ext { margin-left: auto; }
.proto .reset { margin-left: 0; }
.proto { gap: 8px 14px; }
@media (max-width: 767px) { .sheet, .sheet.review { top: var(--barh, 48px); } .phone { height: calc(100vh - var(--barh, 48px)); } }

</style>
</head>
<body>
<div class="proto" id="bar"></div>
<div id="app"></div>
<script>
const $ = (s) => document.querySelector(s)
const ic = (name, cls = "") => `<i data-lucide="${name}" class="${cls}"></i>`
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const pcs = (n) => `${n.toLocaleString("id-ID")} ${n === 1 ? "pc" : "pcs"}`
const rp = (n) => `Rp ${n.toLocaleString("id-ID")}`

let S
let shown = new Set()
let clock = 9 * 60 + 40
const INIT = {}, SCREENS = {}, OVL = {}, A = {}, FLOWS = [], BADGE = {}
const DEPT = {}
const NAV = {
  ops: [["Workload", "ops-workload"], ["Receiving", "ops-receiving"], ["Allotment", "ops-board"], ["Return from Store", "ops-store-returns"], ["Return PO", "ops-return-po"], ["Activity Log", "ops-log"]],
  buy: [["Purchase Orders", "buy-po"], ["Suppliers"], ["Sourcing"], ["Return PO", "buy-return"]],
  md: [["Allotments", "md-allot"], ["Return to HO", "md-return"], ["New Allotment", "md-new"]],
  inv: [["Stock", "inv-stock"], ["Exceptions", "inv-exceptions"], ["Counts"], ["Movements", "inv-movements"]],
}
const DEPT_HOME = { buy: "buy-po", ops: "ops-workload", md: "md-allot", inv: "inv-stock" }
const DEPT_NAME = { ops: "Ops", buy: "Procurement", md: "Allotment", inv: "Inventory" }
const RAIL = [["shopping-cart", "buy"], ["shirt"], ["truck", "ops"], ["split", "md"], ["boxes", "inv"], ["megaphone"], ["store"], ["landmark"], ["users"], ["book-open"]]

/* ── the ledger every screen reads: one place per pool, one line per movement ── */
const PLACES = ["DC · Stockroom", "DC · Pick area", "DC · Packed", "DC · In transit", "C001 · Warehouse", "C002 · Warehouse", "C003 · Warehouse", "C004 · Warehouse", "DC · Return in transit", "DC · Return stock", "Written off"]
function mv(doc, cause, from, to, qty, by) { if (!qty) return; S.ledger.unshift({ t: stamp(), doc, cause, from, to, qty, by: by || "Operations" }) }
function pool(place) { return S.ledger.reduce((n, e) => n + (e.to === place ? e.qty : 0) - (e.from === place ? e.qty : 0), 0) }
function seed(place, qty, doc) { S.ledger.push({ t: "08 Oct 2026, 08:00", doc: doc || "Opening balance", cause: "Opening balance", from: "Supplier", to: place, qty, by: "Inventory" }) }
function evt(who, text, doc) { S.events.unshift({ t: stamp(), who, text, doc: doc || "" }) }

function stamp() {
  clock += 2 + Math.floor(Math.random() * 5)
  return `09 Oct 2026, ${String(Math.floor(clock / 60)).padStart(2, "0")}:${String(clock % 60).padStart(2, "0")}`
}
function fresh(flowId) {
  clock = 9 * 60 + 40
  const def = FLOWS.find((f) => f.id === (flowId || "all")) || FLOWS[0]
  const base = { flow: def.id, screen: def.start, ov: [], race: false, toast: null, opsTab: "po", sstore: "C001", psheet: null, ledger: [], events: [], cases: [], notices: [], caseSel: null }
  for (const k of Object.keys(INIT)) base[k] = INIT[k]()
  S = base
  if (def.setup) def.setup(base)
  return base
}

/* ── shell: rail, department column, content ──────────────── */
function shell(dept, body) {
  const nav = NAV[dept] || []
  return `<div class="shell">
    <aside class="rail"><div class="logo">C</div>
      ${RAIL.map(([n, d]) => `<span class="ic ${d === dept ? "on" : ""}" ${d ? `data-go="${DEPT_HOME[d]}"` : ""}>${ic(n)}</span>`).join("")}
      <span class="gap"></span>
      <span class="ic">${ic("message-square-text")}</span><span class="ic">${ic("bell")}<span class="badge">89</span></span>
      <span class="ic">${ic("sparkles")}</span><span class="ic">${ic("sliders-horizontal")}</span><span class="me">R</span>
    </aside>
    <aside class="dept"><div class="head">${DEPT_NAME[dept]}${ic("panel-left")}</div>
      <nav>${nav.map(([l, id]) => { const n = id && BADGE[id] ? BADGE[id]() : 0; return `<a class="${id && id === S.screen ? "on" : ""}" ${id ? `data-go="${id}"` : ""}>${l}${n ? `<span class="n">${n}</span>` : ""}</a>` }).join("")}</nav>
      <div class="clock">${ic("clock-3")}Fri 09 Oct 2026 · ${String(Math.floor(clock / 60)).padStart(2, "0")}:${String(clock % 60).padStart(2, "0")}</div>
    </aside>
    <main class="content">${body}</main>
  </div>`
}

/* ── sheets and dialogs ─────────────────────────────────── */
const enterCls = (id) => (shown.has(id) ? "" : " enter-from")
function sheetEl(id, { title, sub, mono, body, foot, cls = "", top = false }) {
  return `<div class="scrim${top ? " top" : ""}${enterCls("s-" + id)}" data-close="${id}"></div>
  <section class="sheet ${cls}${top ? " top" : ""}${enterCls(id)}" data-sheet="${id}" role="dialog" aria-label="${esc(title)}">
    <header class="sh-head"><div>${sub ? `<div class="sub ${mono ? "mono" : ""}">${sub}</div>` : ""}<h2>${title}</h2></div>
      <button class="x" data-close="${id}" aria-label="Close">${ic("x")}</button></header>
    <div class="sh-body">${body}</div>
    <footer class="sh-foot">${foot}</footer>
  </section>`
}
function dlgEl(id, { title, body, foot, wide = false }) {
  return `<div class="scrim z60${enterCls("s-" + id)}" data-close="${id}"></div>
  <section class="dlg${wide ? " wide" : ""}${enterCls(id)}" data-sheet="${id}" role="alertdialog" aria-label="${esc(title)}">
    <div class="d-head"><h2>${title}</h2></div><div class="d-body">${body}</div><div class="d-foot">${foot}</div>
  </section>`
}
function openOv(id) { if (!S.ov.includes(id)) S.ov.push(id); render() }
function closeOv(id) { const i = S.ov.indexOf(id); if (i >= 0) S.ov.length = i; render() }
function say(msg) {
  S.toast = msg; render()
  clearTimeout(say.t)
  say.t = setTimeout(() => { S.toast = null; render() }, 2600)
}
const stepper = (key, val, min, max, off = false) => `<span class="step"><button data-act="step" data-key="${key}" data-d="-1" ${off || val <= min ? "disabled" : ""} aria-label="One less">${ic("minus")}</button><input value="${val}" inputmode="numeric" data-input="${key}" ${off ? "disabled" : ""} aria-label="Quantity"><button data-act="step" data-key="${key}" data-d="1" ${off || val >= max ? "disabled" : ""} aria-label="One more">${ic("plus")}</button></span>`

/* ── prototype bar + render ─────────────────────────────── */
function barHtml() {
  const def = FLOWS.find((f) => f.id === S.flow)
  const known = def.screens.some(([id]) => id === S.screen)
  const scr = def.screens.length <= 3
    ? `<div class="seg">${def.screens.map(([id, label]) => `<button data-go="${id}" aria-pressed="${id === S.screen}">${label}</button>`).join("")}</div>`
    : `<select class="scr" data-input="scr" aria-label="Go to screen">${def.screens.map(([id, label]) => `<option value="${id}" ${id === S.screen ? "selected" : ""}>${label}</option>`).join("")}${known ? "" : `<option value="${S.screen}" selected>Elsewhere</option>`}</select>`
  return `<div class="seg" id="flows">${FLOWS.map((f) => `<button data-flow="${f.id}" aria-pressed="${f.id === S.flow}">${f.label}</button>`).join("")}</div>
    ${scr}
    ${def.bar ? def.bar() : ""}
    <a class="ext" href="inventory-issues-prototype.html" target="_blank">Inventory cases ↗</a>
    <button class="reset" id="reset">Reset</button>
    ${window.journeyHint && S.flow === "all" ? journeyHint() : ""}`
}
function render() {
  const active = document.activeElement
  const fi = active && active.dataset ? active.dataset.input : null
  const pos = fi && typeof active.selectionStart === "number" ? active.selectionStart : null
  $("#bar").innerHTML = barHtml()
  const screen = SCREENS[S.screen]()
  const ovs = S.ov.map((id) => OVL[id]()).join("")
  const toast = S.toast ? `<div class="toast ${shown.has("toast") ? "" : "enter-from"}" role="status">${ic("check")}${esc(S.toast)}</div>` : ""
  $("#app").innerHTML = (screen.startsWith("<!--phone-->") ? screen : shell(DEPT[S.screen] || "ops", screen)) + ovs + toast
  if (window.lucide) lucide.createIcons()
  document.documentElement.style.setProperty("--barh", $("#bar").offsetHeight + "px")
  const next = new Set()
  for (const id of S.ov) { next.add(id); next.add("s-" + id) }
  if (S.toast) next.add("toast")
  if (S.psheet) { next.add("p-" + S.psheet); next.add("ps-" + S.psheet) }
  shown = next
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".enter-from").forEach((el) => el.classList.remove("enter-from"))))
  if (fi) {
    const el = document.querySelector(`[data-input="${fi}"]`)
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos) } catch (e) {} }
  }
}

/* ── events ─────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  const fl = e.target.closest("[data-flow]")
  if (fl) { S = fresh(fl.dataset.flow); shown = new Set(); render(); return }
  const c = e.target.closest("[data-close]")
  if (c) { closeOv(c.dataset.close); return }
  const g = e.target.closest("[data-go]")
  if (g) { S.screen = g.dataset.go; S.ov = []; S.psheet = null; render(); return }
  const a = e.target.closest("[data-act]")
  if (a && !a.disabled && A[a.dataset.act]) A[a.dataset.act](a, e)
})
document.addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.input
  if (k && A["input:" + k]) { A["input:" + k](e.target.value, e.target); render() }
  else if (k && A["input:*"]) { A["input:*"](k, e.target.value); render() }
})
document.addEventListener("click", (e) => {
  if (e.target.id === "reset" || e.target.closest("#reset")) { S = fresh(S.flow); shown = new Set(); render() }
})
A["input:scr"] = (v) => { S.screen = v; S.ov = []; S.psheet = null }
A.step = (el) => {
  const k = el.dataset.key, d = Number(el.dataset.d)
  if (A["step:" + k]) { A["step:" + k](d); render() }
  else if (A["step:*"]) { A["step:*"](k, d); render() }
}
A["ops-tab"] = (el) => { S.opsTab = el.dataset.tab; render() }

/* ═══ Flow 1 · Supplier → PO → DC: Recall before acceptance, a correction after ═══ */
FLOWS.push({
  id: "po", label: "1 · PO → DC", start: "ops-receiving",
  screens: [["ops-receiving", "Ops › Receiving"], ["buy-po", "Procurement › Purchase Orders"]],
  bar: () => `<div class="seg"><button data-act="po-mode" data-m="over" aria-pressed="${S.po.mode === "over"}">Extra: 20 of 12</button><button data-act="po-mode" data-m="short" aria-pressed="${S.po.mode === "short"}">Short: 585 of 600</button></div>
    <label class="tg"><input type="checkbox" data-act="race" ${S.race ? "checked" : ""}>The other side acts first</label>`,
})
A.race = (el) => { S.race = el.checked; render() }
DEPT["ops-receiving"] = "ops"; DEPT["buy-po"] = "buy"

/* The two ways a count can differ. "Extra" is a PO counted above its order; "Short" is a PO counted below it, with pieces that are not what was ordered. */
const PDATA = {
  over: { po: "PO-041026-007", sup: "Indorama, PT", art: "Kaos Uji UJI4", sub: "Pria · Kaos", ordered: 12, counted: 20, nao: 0, price: 40000, delivery: "07 Oct 2026", created: "07 Oct 2026",
    others: [["PO-041026-010", "Garmen AA, UD"], ["PO-041026-011", "Indorama, PT"]] },
  short: { po: "PO-041026-010", sup: "Garmen AA, UD", art: "Kemeja Blus", sub: "Wanita · Blus", ordered: 600, counted: 585, nao: 15, price: 85000, delivery: "08 Oct 2026", created: "07 Oct 2026",
    others: [["PO-041026-007", "Indorama, PT"], ["PO-041026-011", "Indorama, PT"]] },
}
const PD = () => PDATA[S.po.mode]
const poFresh = (mode, isNew = false) => {
  const d = PDATA[mode]
  const base = { mode, status: "counted", ordered: d.ordered, counted: d.counted, nao: d.nao, accepted: 0, by: "Rina Kusuma", at: "08 Oct 2026, 09:40",
    was: null, reason: "", recalledAt: null, edit: null, rmode: "decide", why: "", evidenceText: "",
    log: [{ t: `Counted ${pcs(d.counted)}`, who: "Rina Kusuma", at: "08 Oct 2026, 09:40" }, { t: "Issued", who: "Rina Kusuma", at: d.created + ", 10:12" }] }
  if (isNew) return { ...base, status: "new", counted: 0, nao: 0, by: "", at: "", edit: { qty: String(d.counted), nao: String(d.nao) }, log: [{ t: "Issued", who: "Rina Kusuma", at: d.created + ", 10:12" }] }
  return base
}
INIT.po = () => poFresh("over")

const poDone = () => ["accepted", "closed"].includes(S.po.status)
/* what an acceptance does to the world: stock comes in, wrong and extra pieces become a Return PO */
function poAccepted(how) {
  const p = S.po, d = PD(), stockIn = Math.min(p.counted, p.ordered), back = Math.max(0, p.counted - p.ordered) + p.nao
  mv(d.po, "Receipt", "Supplier", "DC · Stockroom", stockIn, "Rina Kusuma")
  if (back > 0) mv(d.po, "Receipt · to return", "Supplier", "DC · To supplier", back, "Rina Kusuma")
  evt("Buying", `${d.po}: ${how}. ${pcs(stockIn)} in stock${back ? `, ${pcs(back)} go back to the supplier` : ""}`, d.po)
  if (back > 0) {
    const no = `RS-${String(7 + (S.sup ? 1 : 0)).padStart(8, "0")}`
    S.sup = supMk({ no, n: back, reason: "over", po: d.po, sup: d.sup, art: d.art, sub: d.sub, at: stamp() })
  }
}

function poReceivingTable() {
  const p = S.po, d = PD()
  const row = ([po, sup]) => `<tr class="row"><td><span class="two"><span class="a">${sup}</span><span class="b mono">${po}</span></span></td>
    <td class="r num hide-p">1</td><td class="r"><button class="btn tint" data-act="po-other">Count receive</button></td></tr>`
  let cell
  if (p.status === "new") {
    cell = `<button class="btn tint" data-act="open-count">Count receive</button>`
  } else if (p.status === "recalled") {
    cell = `<span class="counted"><button class="btn tint" data-act="open-count">Count again</button><span>${p.reason ? "Sent back · " + esc(p.reason) : "Recalled · was " + pcs(p.was)}</span></span>`
  } else {
    cell = `<span class="counted num"><b>${pcs(p.counted)}</b><span>${p.by} · ${p.at}</span>${p.nao ? `<span>+ ${pcs(p.nao)} Not as Ordered</span>` : ""}<span class="${poDone() ? "ok" : "info"}">${poDone() ? "Accepted" : "Waiting for review"}${p.was ? " · was " + pcs(p.was) : ""}</span></span>`
  }
  return `<div class="card"><table class="dt">
    <thead><tr><th>PO ⌃</th><th class="r hide-p" style="width:120px">Items</th><th class="r" style="width:320px">Count</th></tr></thead>
    <tbody>${d.others.map(row).join("")}
      <tr class="row ${!["recalled", "new"].includes(p.status) ? "click" : ""}" ${!["recalled", "new"].includes(p.status) ? 'data-act="open-count"' : ""}><td><span class="two"><span class="a">${d.sup}</span><span class="b mono">${d.po}</span></span></td>
        <td class="r num hide-p">1</td><td class="r">${cell}</td></tr></tbody></table></div>`
}

/* the reviewer decides; a race with a recall is refused */
function reviewGuard() {
  const p = S.po
  if (S.race) { p.was = p.counted; p.status = "recalled"; p.reason = ""; p.recalledAt = stamp(); p.edit = { qty: String(p.counted), nao: String(p.nao) }; p.log.unshift({ t: `Count recalled · was ${pcs(p.was)}`, who: "Rina Kusuma", at: p.recalledAt }); S.ov = ["po", "review", "refusedb"]; render(); return true }
  return false
}
A["review-submit"] = () => {
  if (reviewGuard()) return
  const p = S.po

function mkAlloc(no, src, stores) {

}

const unsentOf = (s) => s.b.pick + s.b.picked + s.b.packed
const floorOf = (s) => s.b.transit + s.b.received
const sumOf = (al, f) => al.stores.reduce((n, s) => n + f(s), 0)
const tripNo = (s) => `DSP-HO-GUDANG-${String(s.trip).padStart(6, "0")}`

/* MD reduces or raises a store's target (never below what is sent) */
function mdTarget(s, to) {
  const floor = floorOf(s)
  to = Math.max(floor, to)
  let r = unsentOf(s) - (to - floor)
  if (r < 0) { s.b.pick += -r }
  else {
    const fromPick = Math.min(r, s.b.pick); s.b.pick -= fromPick; r -= fromPick
    const fromPicked = Math.min(r, s.b.picked - s.owe.picked); s.owe.picked += fromPicked; r -= fromPicked
    const fromPacked = Math.min(r, s.b.packed - s.owe.packed); s.owe.packed += fromPacked; r -= fromPacked
  }
  s.target = to
}
function moveBack(s, from, to, q) {
  const owedHere = Math.min(q, s.owe[from])
  s.b[from] -= q; s.owe[from] -= owedHere
  if (to === "pick") s.b.pick += q - owedHere
  else { s.b.picked += q; s.owe.picked += owedHere }
  const al = alOf(s)
  if (from === "picked") mv(al.no, "Move back", "DC · Pick area", srcPlace(s), q)
  else if (to === "picked") mv(al.no, "Move back", "DC · Packed", "DC · Pick area", q)
  else mv(al.no, "Move back", "DC · Packed", srcPlace(s), q)
}
function allotStatus(al) {
  if (al.cancelled) return ["Cancelled", "bad"]
  const live = al.stores.filter((s) => s.target > 0)
  const done = live.length && live.every((s) => s.got !== null)
  if (done) return live.some((s) => s.issue) ? ["Completed · issue", "warn"] : ["Completed", "ok"]
  if (al.stores.some((s) => s.sent > 0)) return ["Part sent", "info"]
  return ["Active", "info"]
}

}

function whereOf(s) {
  const out = []
  if (s.b.pick) out.push(`To pick ${s.b.pick}${s.short ? " · Short pick" : ""}`)
  if (s.b.picked) out.push(`Picked ${s.b.picked}${s.owe.picked ? ` · ${s.owe.picked} to move back` : ""}`)
  if (s.b.packed) out.push(`Packed ${s.b.packed}${s.owe.packed ? ` · ${s.owe.packed} to move back` : ""}`)
  if (s.b.transit) out.push(`In transit ${s.b.transit}`)
  if (s.got !== null) out.push(`Received ${s.got} of ${s.sent}${s.issue ? " · issue" : ""}`)
  return out.join(" · ") || "—"
}

A["step:*"] = (k, d) => {
  if (k.startsWith("dcd~")) { const id = k.slice(4), al = DC(), s = storeOf(id); al.draft[id] = Math.max(floorOf(s), al.draft[id] + d * 5) }
  else if (k === "mb") { const m = S.dc.mb; m.q = Math.max(0, Math.min(storeOf(m.store).b[m.from], m.q + d)) }
  else if (k === "rc") S.rcCount = Math.max(0, Math.min(rcMax(), (S.rcCount ?? rcMax()) + d))
  else if (k.startsWith("nf~")) { const f = S.dc.nf, c = k.slice(3); f.q[c] = Math.max(0, Math.min(newMax() - Object.entries(f.q).filter(([x]) => x !== c).reduce((n, [, v]) => n + v, 0), (f.q[c] || 0) + d * 5)) }
  else if (k === "pk") { const f = S.dc.short; f.found = Math.max(0, Math.min(f.max, f.found + d)) }
}
A["input:*"] = (k, v) => {
  const n = Number(String(v).replace(/\D/g, "")) || 0
  if (k.startsWith("dcd~")) { const id = k.slice(4), s = storeOf(id); DC().draft[id] = Math.max(floorOf(s), n) }
  else if (k === "mb") { const m = S.dc.mb; m.q = Math.max(0, Math.min(storeOf(m.store).b[m.from], n)) }
  else if (k === "rc") S.rcCount = Math.max(0, Math.min(rcMax(), n))
  else if (k === "pk") { const f = S.dc.short; f.found = Math.max(0, Math.min(f.max, n)) }
}
A["allot-save"] = () => {
  const al = DC(); let owed = 0
  al.stores.forEach((s) => {
    if (al.draft[s.id] === s.target) return
    const before = s.owe.picked + s.owe.packed, was = s.target; mdTarget(s, al.draft[s.id])
    owed += s.owe.picked + s.owe.packed - before
    al.log.unshift({ t: `${s.name}: ${was} → ${s.target} pcs`, who: "Rina Kusuma", at: stamp() })
    evt("MD", `${al.no} ${s.name}: ${was} → ${s.target} pcs`, al.no)
  })
  al.editing = false
  say(owed ? `Saved. ${pcs(owed)} the warehouse moves back` : "Saved")
}

  const body = `<div>${row("To pick", pk, "picklists removed")}${row("Picked", pd, "the warehouse puts it back", true)}${row("Packed", pa, "the warehouse unpacks it", true)}${row("Sent", sn, "keeps going")}</div>
    ${work ? `<label class="ack" data-act="ack"><span class="cb ${al.ack ? "on" : ""}">${al.ack ? ic("check") : ""}</span><span>The warehouse has to move back ${pcs(work)} that are already picked or packed.</span></label>` : ""}
    <div><span class="lab">Reason</span><div class="chips">${CANCEL_WHY.map((w) => `<button class="chip ${al.reason === w ? "on" : ""}" data-act="why" data-w="${w}">${w}</button>`).join("")}</div></div>`

}

function cardsFor(lane) {
  const out = []
  allStores().forEach((s) => {
    const n = s.b[lane]; if (!n && !(lane === "received" && s.got !== null)) return
    const al = alOf(s), owe = s.owe[lane] || 0

    const stampb = off ? `<div class="stampb"><span>CANCELLED</span></div>` : ""
    const doc = lane === "transit" || lane === "received" ? tripNo(s) : s.al
    const fig = lane === "received" ? s.got : n
    let foot
    if (owe) foot = `<span>${lane === "picked" ? "1 picklist" : "1 carton"}</span><span class="btn tint" data-act="mb-open" data-store="${s.id}" data-from="${lane}">Move back</span>`
    else if (lane === "pick") foot = `<span>1 SKU</span><span class="btn tint" data-act="adv" data-store="${s.id}" data-from="pick">Pick</span>`
    else if (lane === "picked") foot = `<span>1 picklist</span><span class="btn tint" data-act="adv" data-store="${s.id}" data-from="picked">Pack</span>`
    else if (lane === "packed") foot = `<span>1 carton</span><span class="btn tint" data-act="adv" data-store="${s.id}" data-from="packed">Dispatch</span>`

}
A["ops-sup-open"] = (el, e) => { if (e) e.stopPropagation(); openOv("opssup") }
OVL.opssup = () => {
  const u = SU()

    ${["handed", "settle", "closed"].includes(u.st) ? `<p class="note" style="margin:0"><span class="info">${ic("lock")}</span><span>Handed over to the supplier. It does not move back.</span></p>` : ""}
    ${u.st === "cancelled" ? `<p class="note" style="margin:0"><span class="bad">${ic("circle-x")}</span><span>Cancelled by Buying. The work is released.</span></p>` : ""}`

A["opssup-back"] = () => { const u = SU(); u.st = "issued"; u.log.unshift({ t: `Moved back ${pcs(u.n)}. The surat jalan is voided, the return stays issued`, who: "Operations", at: stamp() }); S.ov = []; say("Moved back. The letter is voided") }

/* ═══ Inventory + Operations home: Stock, Movements, Exceptions (cases), Workload, Activity Log ═══ */
DEPT["inv-stock"] = "inv"; DEPT["inv-exceptions"] = "inv"; DEPT["inv-movements"] = "inv"; DEPT["ops-workload"] = "ops"; DEPT["ops-log"] = "ops"

const STOCK_ART = () => (S.flow === "po" ? PD().art : S.flow === "ret" ? R().art : "Kemeja Blus")
const CAUSES = { Receiving: ["DC packing", "In transit", "Store", "Unknown"], "Return count": ["Store packing", "In transit", "DC receiving", "Unknown"], "Stock check": ["Damaged", "Not at the rack", "Unknown"] }
const KIND_NAME = { Receiving: "Delivery difference", "Return count": "Return difference", "Stock check": "Stock check" }
BADGE["inv-exceptions"] = () => S.cases.filter((c) => c.st !== "done").length
BADGE["md-allot"] = () => S.notices.filter((n) => !n.done).length
BADGE["ops-workload"] = () => workItems().length

/* ── cases ─────────────────────────────────────────────────────────────── */
function openCase(spec) {
  const id = `EX-${String(S.cases.length + 1).padStart(4, "0")}`
  const c = { id, st: "open", ask: "", answer: "", found: 0, where: "dc", cause: "", result: "", at: stamp(), ...spec }
  S.cases.unshift(c); if (!S.caseSel) S.caseSel = id
  evt("Inventory", `${id} opened: ${KIND_NAME[c.kind]} on ${c.doc}, ${pcs(c.short)} short`, c.doc)
}
const curCase = () => S.cases.find((c) => c.id === S.caseSel)
const lostOf = (c) => c.short - c.found

function caseFacts(c) {
  if (c.kind === "Stock check") return `<div><div class="l">Asked to pick</div><div class="v num">${pcs(c.sent)}</div></div><div><div class="l">Picked</div><div class="v num">${pcs(c.got)}</div></div><div><div class="l">Cannot continue</div><div class="v num bad">${pcs(c.short)}</div></div><div><div class="l">Reason</div><div class="v">${esc(c.reason)}</div></div>`
  return `<div><div class="l">Sent</div><div class="v num">${pcs(c.sent)}</div></div><div><div class="l">Counted</div><div class="v num">${pcs(c.got)}</div></div><div><div class="l">Difference</div><div class="v num bad">−${pcs(c.short)}</div></div><div><div class="l">${c.kind === "Receiving" ? "Store" : "From"}</div><div class="v">${esc(c.store)}</div></div>`
}
function casePane(c) {
  if (!c) return `<div class="card cpane"><div style="padding:36px;text-align:center;color:var(--mute)">Nothing waiting. Cases open themselves when a count differs or a pick cannot continue.</div></div>`
  const done = c.st === "done", lost = lostOf(c), causes = CAUSES[c.kind]
  const evidence = c.ask === "answered" ? `<div class="quote"><b>Operations</b>${esc(c.answer)}</div>` : c.ask === "asked" ? `<p class="note" style="margin:0"><span class="info">${ic("clock-3")}</span><span>Asked Operations. They answer from Ops › Workload.</span></p>` : ""
  const decide = done ? `<div class="banner ok">${ic("circle-check")}<span><b>Decided</b><span>${esc(c.result)}</span></span></div>` : `
    <div class="sec">Does the stock exist?</div>
    <div class="st"><table><thead><tr><th>Item</th><th class="r">Difference</th><th class="r" style="width:190px">Found</th></tr></thead>
      <tbody><tr><td><span class="two"><span class="a" style="font-weight:400">${STOCK_ART()}</span><span class="b">${c.kind === "Stock check" ? "At the rack" : c.kind === "Receiving" ? "Sent, not counted" : "Left the store, not counted"}</span></span></td><td class="r num">${c.short}</td><td class="r">${stepper("cf", c.found, 0, c.short)}</td></tr></tbody>
      <tfoot><tr><td colspan="2">Lost</td><td class="r num ${lost ? "bad" : ""}">${pcs(lost)}</td></tr></tfoot></table></div>
    ${c.found > 0 && c.kind !== "Stock check" ? `<div><span class="lab">Where are the ${c.found} found?</span><div class="chips"><button class="chip ${c.where === "dc" ? "on" : ""}" data-act="case-where" data-w="dc">${c.kind === "Receiving" ? "Still at the DC" : "At the DC"}</button><button class="chip ${c.where === "store" ? "on" : ""}" data-act="case-where" data-w="store">At the store</button></div></div>` : ""}
    ${lost > 0 ? `<div><span class="lab">Where were the ${lost} lost? <span class="bad">*</span></span><div class="chips">${causes.map((w) => `<button class="chip ${c.cause === w ? "on" : ""}" data-act="case-cause" data-w="${w}">${w}</button>`).join("")}</div></div>` : ""}`
  const foot = done ? "" : `<div class="cfoot">${c.ask ? "" : `<button class="btn soft" data-act="case-ask">Ask Operations for evidence</button>`}<span class="grow"></span>
    <button class="btn primary" data-act="case-confirm" ${lost > 0 && !c.cause ? "disabled" : ""}>${c.kind === "Stock check" ? "Confirm" : "Confirm and send to MD"}</button></div>`
  return `<div class="card cpane"><div class="chead"><div><div class="sub mono">${c.id} · ${c.doc}</div><h2>${KIND_NAME[c.kind]}</h2></div><span class="dotw ${done ? "ok" : c.ask === "asked" ? "info" : "warn"}">${done ? "Decided" : c.ask === "asked" ? "Asked Operations" : "Open"}</span></div>
    <div class="cbody"><div class="facts">${caseFacts(c)}</div>${evidence}${decide}</div>${foot}</div>`
}
SCREENS["inv-exceptions"] = () => {
  const tab = S.exTab || "open", open = S.cases.filter((c) => c.st !== "done"), decided = S.cases.filter((c) => c.st === "done")
  const list = tab === "open" ? open : decided
  if (!curCase() || (tab === "open" ? curCase().st === "done" : curCase().st !== "done")) S.caseSel = list[0] ? list[0].id : null
  const item = (c) => `<button class="cli ${c.id === S.caseSel ? "on" : ""}" data-act="case-pick" data-id="${c.id}"><div class="l1"><span class="a">${KIND_NAME[c.kind]}</span><span class="num">${c.short} pcs</span></div><div class="l2"><span class="mono">${c.doc}</span><span>${esc(c.store)}</span></div><div class="l3"><span class="dotw ${c.st === "done" ? "ok" : c.ask === "asked" ? "info" : "warn"}">${c.st === "done" ? "Decided" : c.ask === "asked" ? "Asked Operations" : "Open"}</span><span>${c.at}</span></div></button>`
  return `<h1 class="page-title">Exceptions</h1>
    <div class="kpis"><div class="kpi"><div class="l">Open</div><div class="v num">${open.filter((c) => !c.ask).length}</div></div><div class="kpi"><div class="l">Asked Operations</div><div class="v num">${open.filter((c) => c.ask === "asked").length}</div></div><div class="kpi"><div class="l">Pieces in question</div><div class="v num">${open.reduce((n, c) => n + c.short, 0)}</div></div><div class="kpi"><div class="l">Decided</div><div class="v num">${decided.length}</div></div></div>
    <div class="tabs"><span class="${tab === "open" ? "on" : ""}" data-act="ex-tab" data-tab="open">Open ${open.length}</span><span class="${tab === "done" ? "on" : ""}" data-act="ex-tab" data-tab="done">Decided ${decided.length}</span></div>
    <div class="inbox"><div class="clist">${list.map(item).join("") || `<div class="none" style="padding:18px;border:1px dashed var(--edge);border-radius:var(--r-card);color:var(--faint)">Nothing here</div>`}</div>${casePane(curCase())}</div>`
}
A["ex-tab"] = (el) => { S.exTab = el.dataset.tab; render() }
A["case-pick"] = (el) => { S.caseSel = el.dataset.id; render() }
A["step:cf"] = (d) => { const c = curCase(); c.found = Math.max(0, Math.min(c.short, c.found + d)); if (!lostOf(c)) c.cause = "" }
A["input:cf"] = (v) => { const c = curCase(); c.found = Math.max(0, Math.min(c.short, Number(v.replace(/\D/g, "")) || 0)); if (!lostOf(c)) c.cause = "" }
A["case-where"] = (el) => { curCase().where = el.dataset.w; render() }
A["case-cause"] = (el) => { curCase().cause = el.dataset.w; render() }
A["case-ask"] = () => { const c = curCase(); c.ask = "asked"; evt("Inventory", `${c.id}: asked Operations for evidence on ${c.doc}`, c.doc); say("Asked Operations") }
A["case-confirm"] = () => {
  const c = curCase(), lost = lostOf(c), code = c.code || (c.store || "").slice(0, 4)
  const foundTo = c.kind === "Stock check" ? "DC · Stockroom" : c.where === "store" ? `${code} · Warehouse` : c.kind === "Return count" ? "DC · Return stock" : "DC · Stockroom"
  const from = c.kind === "Receiving" ? "DC · In transit" : c.kind === "Return count" ? "DC · Return in transit" : "DC · Stockroom"
  if (c.kind !== "Stock check") mv(c.doc, "Found", from, foundTo, c.found, "Inventory")
  mv(c.doc, `Lost · ${c.cause}`, from, "Written off", lost, "Inventory")
  c.st = "done"
  const parts = []
  if (c.found) parts.push(`Found ${c.found}${c.kind === "Stock check" ? "" : c.where === "store" ? " at the store" : " at the DC"}`)
  if (lost) parts.push(`Lost ${lost} · ${c.cause}`)
  c.result = `${parts.join(" · ")}. ${c.kind === "Stock check" ? (lost ? "MD was told." : "Operations can continue.") : "MD was told. Nothing is reopened."}`
  evt("Inventory", `${c.id}: ${parts.join(", ")}`, c.doc)
  if (c.kind === "Receiving") {
    const s = storeOf(c.sid); if (s) s.issue = false
    const again = lost + (c.where === "dc" ? c.found : 0)
    S.notices.push({ id: "N" + (S.notices.length + 1), kind: again ? "new" : "ok", qty: again, code, title: `${c.store}: ${pcs(c.short)} not counted on ${c.doc}`,
      text: `Inventory: ${parts.join(", ")}. The allotment stays closed at ${c.got}.${again ? " A new allotment can send the rest." : ""}`, done: false })
  } else if (c.kind === "Return count") {
    S.notices.push({ id: "N" + (S.notices.length + 1), kind: "ok", qty: 0, code, title: `${c.doc}: ${pcs(c.short)} short at the DC`, text: `Inventory: ${parts.join(", ")}. The return stays closed at ${c.got}.`, done: false })
  } else {
    const s = storeOf(c.sid)
    if (lost > 0 && s) S.notices.push({ id: "N" + (S.notices.length + 1), kind: "close", qty: lost, sid: s.id, code, title: `${c.store}: ${pcs(lost)} cannot be picked on ${c.doc}`, text: `Inventory: ${parts.join(", ")}. There is no stock for ${pcs(lost)}.`, done: false })
    else if (s) s.short = null
  }
  S.exTab = "open"; say(c.kind === "Stock check" ? "Decided. Stock is updated" : "Decided. MD was told")
}

/* ── Operations answers an evidence request ─────────────────────────────── */
const EVID = { Receiving: ["The carton was packed with the full quantity and the slip matched", "The carton was opened and recounted: the count differs", "No record of this carton"], "Return count": ["The return arrived sealed and the count matches the slip", "The return was opened and recounted: the count differs", "No record of this return"], "Stock check": ["The rack was recounted and the pieces are not there", "Some pieces are at the rack, in another bin", "No record"] }
A["ans-open"] = (el) => { S.ansId = el.dataset.id; S.ansPick = ""; openOv("opsans") }
OVL.opsans = () => {
  const c = S.cases.find((x) => x.id === S.ansId)
  return dlgEl("opsans", { title: "Answer Inventory", wide: true,
    body: `<span>${KIND_NAME[c.kind]} on <b class="mono">${c.doc}</b> · ${pcs(c.short)} short</span><div class="chips" style="flex-direction:column;align-items:stretch">${EVID[c.kind].map((w) => `<button class="chip ${S.ansPick === w ? "on" : ""}" style="height:auto;min-height:36px;padding:8px 14px;text-align:left;border-radius:10px" data-act="ans-pick" data-w="${esc(w)}">${w}</button>`).join("")}</div>`,
    foot: `<button class="btn ghost" data-close="opsans">Cancel</button><button class="btn primary" data-act="ans-send" ${S.ansPick ? "" : "disabled"}>Send answer</button>` })
}
A["ans-pick"] = (el) => { S.ansPick = el.dataset.w; render() }
A["ans-send"] = () => { const c = S.cases.find((x) => x.id === S.ansId); c.ask = "answered"; c.answer = S.ansPick; evt("Operations", `${c.id}: answered Inventory on ${c.doc}`, c.doc); S.ov = []; say("Answer sent to Inventory") }

/* ── Inventory › Stock ──────────────────────────────────────────────────── */
SCREENS["inv-stock"] = () => {
  const P = (n) => pool(n), sum = (...n) => n.reduce((a, b) => a + P(b), 0)
  const dc = sum("DC · Stockroom", "DC · Pick area", "DC · Packed"), road = sum("DC · In transit", "DC · Return in transit")
  const stores = sum("C001 · Warehouse", "C002 · Warehouse", "C003 · Warehouse", "C004 · Warehouse")
  const grp = (title, rows) => `<tr class="grp"><td colspan="3">${title}</td></tr>${rows.map(([p, label, note]) => `<tr class="row click" data-act="stock-row" data-p="${esc(p)}"><td><span class="two"><span class="a" style="font-weight:400">${label}</span>${note ? `<span class="b">${note}</span>` : ""}</span></td><td class="r num">${pcs(P(p))}</td><td class="r hide-p num" style="color:var(--mute)">${(() => { const n = S.ledger.filter((e) => e.to === p || e.from === p).length; return n + (n === 1 ? " movement" : " movements") })()}</td></tr>`).join("")}`
  return `<h1 class="page-title">Stock</h1>
    <div class="kpis"><div class="kpi"><div class="l">At the DC</div><div class="v num">${pcs(dc)}</div></div><div class="kpi"><div class="l">On the road</div><div class="v num">${pcs(road)}</div></div><div class="kpi"><div class="l">At the stores</div><div class="v num">${pcs(stores)}</div></div><div class="kpi"><div class="l">Return stock</div><div class="v num">${pcs(P("DC · Return stock"))}</div></div></div>
    <div class="toolbar"><span class="field" style="width:200px">${ic("search")}${STOCK_ART()}</span><span style="flex:1"></span><span class="hint">Written off ${pcs(P("Written off"))}</span></div>
    <div class="card"><table class="dt"><thead><tr><th>Where</th><th class="r" style="width:150px">Quantity</th><th class="r hide-p" style="width:170px"></th></tr></thead><tbody>
      ${grp("DC", [["DC · Stockroom", "Stockroom", "Available to allot"], ["DC · Pick area", "Picked", "Waiting to be packed"], ["DC · Packed", "Packed", "Waiting to be dispatched"], ["DC · Return stock", "Return stock", "Counted back from the stores"], ["DC · To supplier", "Waiting for the supplier", "Extra and Not as Ordered"]])}
      ${grp("On the road", [["DC · In transit", "In transit to stores", "Dispatched, not counted yet"], ["DC · Return in transit", "Returns on the road", "Sent by stores, not counted at the DC"]])}
      ${grp("Stores", ["C001", "C002", "C003", "C004"].map((c) => [`${c} · Warehouse`, STORES[c], ""]))}</tbody></table></div>`
}
A["stock-row"] = (el) => { S.mvPlace = el.dataset.p; S.screen = "inv-movements"; render() }

/* ── Inventory › Movements ──────────────────────────────────────────────── */
SCREENS["inv-movements"] = () => {
  const pl = S.mvPlace, rows = S.ledger.filter((e) => !pl || e.to === pl || e.from === pl).slice(0, 60)
  return `<h1 class="page-title">Movements</h1>
    <div class="toolbar"><span class="field" style="width:200px">${ic("search")}Search documents</span>${pl ? `<span class="chip on" style="height:34px;display:inline-flex;align-items:center;gap:6px">${pl}<button data-act="mv-clear" aria-label="Clear" style="display:grid;place-items:center">${ic("x")}</button></span>` : ""}<span style="flex:1"></span><span class="hint">${rows.length} movements</span></div>
    <div class="card"><table class="dt"><thead><tr><th style="width:170px">When</th><th>Document</th><th class="hide-p">Cause</th><th class="hide-p">From → To</th><th class="r" style="width:110px">Quantity</th></tr></thead><tbody>
      ${rows.map((e) => `<tr class="row"><td style="color:var(--mute)">${e.t}</td><td><span class="two"><span class="a mono" style="font-weight:400">${e.doc}</span><span class="b">${e.by}</span></span></td><td class="hide-p">${esc(e.cause)}</td><td class="hide-p" style="color:var(--body)">${esc(e.from)} → ${esc(e.to)}</td><td class="r num">${pcs(e.qty)}</td></tr>`).join("") || `<tr><td colspan="5" style="padding:30px;text-align:center;color:var(--mute)">No movements yet</td></tr>`}</tbody></table></div>`
}
A["mv-clear"] = () => { S.mvPlace = null; render() }

/* ── Ops › Workload ─────────────────────────────────────────────────────── */
function workItems() {
  const out = []
  if (S.po && ["new", "recalled"].includes(S.po.status)) out.push(["Count the delivery", `${PD().po} · ${PD().sup}`, pcs(PD().ordered) + " ordered", "ops-receiving", "Count receive"])
  allStores().forEach((s) => {
    if (s.owe.picked + s.owe.packed > 0) out.push(["Move back", `${s.al} · ${s.name}`, pcs(s.owe.picked + s.owe.packed), "ops-board", "Open board"])
    if (s.b.pick > 0 && !alOf(s).cancelled) out.push([s.short ? "Pick (short)" : "Pick", `${s.al} · ${s.name}`, pcs(s.b.pick), "ops-board", "Open board"])
    if (s.b.picked - s.owe.picked > 0) out.push(["Pack", `${s.al} · ${s.name}`, pcs(s.b.picked - s.owe.picked), "ops-board", "Open board"])
    if (s.b.packed - s.owe.packed > 0) out.push(["Dispatch", `${s.al} · ${s.name}`, pcs(s.b.packed - s.owe.packed), "ops-board", "Open board"])
  })
  if (S.ret && S.ret.st === "transit") out.push(["Count the store return", `${S.ret.no} · ${S.ret.store}`, pcs(S.ret.sent) + " sent", "ops-store-returns", "Count receive"])
  if (S.sup && ["issued", "packed"].includes(S.sup.st)) out.push([S.sup.st === "issued" ? "Pick and pack the Return PO" : "Hand over the Return PO", `${S.sup.no} · ${S.sup.sup}`, pcs(S.sup.n), "ops-return-po", "Open"])
  S.cases.filter((c) => c.ask === "asked").forEach((c) => out.push(["Answer Inventory", `${c.id} · ${c.doc}`, pcs(c.short) + " in question", null, "Answer", c.id]))
  return out
}
SCREENS["ops-workload"] = () => {
  const w = workItems()
  return `<h1 class="page-title">Workload</h1>
    <div class="kpis"><div class="kpi"><div class="l">Waiting for Operations</div><div class="v num">${w.length}</div></div><div class="kpi"><div class="l">To pick</div><div class="v num">${allStores().reduce((n, s) => n + s.b.pick, 0)}</div></div><div class="kpi"><div class="l">To move back</div><div class="v num">${allStores().reduce((n, s) => n + s.owe.picked + s.owe.packed, 0)}</div></div><div class="kpi"><div class="l">Asked by Inventory</div><div class="v num">${S.cases.filter((c) => c.ask === "asked").length}</div></div></div>
    <div class="card"><table class="dt"><thead><tr><th>Task</th><th class="hide-p">Document</th><th class="r hide-p" style="width:150px">Quantity</th><th class="r" style="width:150px"></th></tr></thead><tbody>
      ${w.map(([t, d, q, go, label, id]) => `<tr class="row"><td><span class="two"><span class="a">${t}</span><span class="b mono show-p">${d}</span></span></td><td class="hide-p mono" style="color:var(--body)">${d}</td><td class="r num hide-p">${q}</td><td class="r">${go ? `<button class="btn tint" data-go="${go}">${label}</button>` : `<button class="btn tint" data-act="ans-open" data-id="${id}">${label}</button>`}</td></tr>`).join("") || `<tr><td colspan="4" style="padding:30px;text-align:center;color:var(--mute)">Nothing waiting. Allot, count or return something and it shows up here.</td></tr>`}</tbody></table></div>`
}

/* ── Ops › Activity Log ─────────────────────────────────────────────────── */
SCREENS["ops-log"] = () => `<h1 class="page-title">Activity Log</h1>
  <div class="toolbar"><span class="field" style="width:200px">${ic("search")}Search the log</span><span style="flex:1"></span><span class="hint">${S.events.length} entries</span></div>
  <div class="card"><table class="dt"><thead><tr><th style="width:170px">When</th><th style="width:130px">Who</th><th>What</th></tr></thead><tbody>
    ${S.events.slice(0, 80).map((e) => `<tr class="row"><td style="color:var(--mute)">${e.t}</td><td>${e.who}</td><td><span class="two"><span class="a" style="font-weight:400">${esc(e.text)}</span>${e.doc ? `<span class="b mono">${e.doc}</span>` : ""}</span></td></tr>`).join("") || `<tr><td colspan="3" style="padding:30px;text-align:center;color:var(--mute)">Nothing has happened yet</td></tr>`}</tbody></table></div>`

/* ═══ The whole journey: PO → DC → allotment → stores → a store returns → DC → allotted again ═══ */
FLOWS.push({
  id: "all", label: "★ Whole journey", start: "buy-po",
  screens: [["buy-po", "Procurement › Purchase Orders"], ["buy-return", "Procurement › Return PO"], ["ops-workload", "Ops › Workload"], ["ops-receiving", "Ops › Receiving"], ["ops-board", "Ops › Allotment"], ["ops-store-returns", "Ops › Return from Store"], ["ops-return-po", "Ops › Return PO"], ["ops-log", "Ops › Activity Log"], ["md-allot", "Allotment › Allotments"], ["md-new", "Allotment › New Allotment"], ["md-return", "Allotment › Return to HO"], ["inv-stock", "Inventory › Stock"], ["inv-exceptions", "Inventory › Exceptions"], ["inv-movements", "Inventory › Movements"], ["store-receive", "Store app › Receive"], ["store-return", "Store app › Return to HO"]],
  setup: (b) => {
    b.po = poFresh("short", true)
    seed("DC · Stockroom", 120, "Opening balance")
    ;["C001", "C002", "C003", "C004"].forEach((c) => seed(`${c} · Warehouse`, 30, "Opening balance"))
  },
  bar: () => storeSwitch(),
})
window.journeyHint = function () {
  const p = S.po, r = S.ret, dcs = S.dc.list.filter((a) => a.src === "dc"), rets = S.dc.list.filter((a) => a.src === "ret")
  const inTransit = (als) => als.flatMap((a) => a.stores).find((s) => s.b.transit > 0 && s.got === null)
  const notSent = (als) => als.some((a) => !a.cancelled && a.stores.some((s) => s.b.pick + s.b.picked + s.b.packed > 0))
  let n = 12, t = "", d = "", go = "", store = ""
  if (p.status === "new") { n = 1; t = "Goods arrive at the DC"; d = "Operations counts the delivery. 585 and 15 Not as Ordered are prefilled."; go = "ops-receiving" }
  else if (["counted", "recalled"].includes(p.status)) { n = 2; t = p.status === "counted" ? "Buying reviews the count" : "The warehouse counts again"; d = p.status === "counted" ? "Open the PO, Review Count, then Partial Receive. You can also Recall it from Ops first." : "Submit the new count."; go = p.status === "counted" ? "buy-po" : "ops-receiving" }
  else if (!dcs.length) { n = 3; t = "Stock is in. MD allots it"; d = "60 to C001 and 40 to C002 are prefilled."; go = "md-new" }
  else if (notSent(dcs)) { n = 4; t = "The warehouse picks, packs and dispatches"; d = "MD can still edit or cancel until it is sent. Move back reverses picked and packed work. Cannot continue on a pick opens a Stock check."; go = "ops-board" }
  else if (inTransit(dcs)) { n = 5; t = "Stores count what arrived"; d = "The count is blind. Try fewer than sent at one store to open an exception."; go = "store-receive"; store = inTransit(dcs).code }
  else if (r.st === "none") { n = 6; t = "MD asks a store to send some back"; d = "C001 · Cikupa, 20 pcs. New return."; go = "md-return" }
  else if (r.st === "requested") { n = 7; t = "The store packs and sends"; d = "Actual quantity, and why fewer if it is fewer."; go = "store-return"; store = r.code }
  else if (r.st === "transit") { n = 8; t = "The DC counts the return"; d = "Blind count. It becomes return stock."; go = "ops-store-returns" }
  else if (r.st === "received" && !r.realloc) { n = 9; t = "The return stock goes out again"; d = "Open the return, New allotment from the return stock."; go = "md-return" }
  else if (notSent(rets)) { n = 10; t = "Dispatch the second allotment"; d = "Same board, same rules."; go = "ops-board" }
  else if (inTransit(rets)) { n = 11; t = "The other store counts it"; d = "Blind count again."; go = "store-receive"; store = inTransit(rets).code }
  else { n = 12; t = "Back where it started"; d = "Every number on Inventory › Stock and Movements follows from the clicks you made."; go = "inv-stock" }
  const open = S.cases.filter((c) => c.st !== "done").length
  const sup = S.sup && ["issued", "packed"].includes(S.sup.st) ? S.sup : null
  return `<div class="jh" title="${esc(d)}"><b>Step ${n} of 12</b><span class="t">${t}</span><span class="d">${d}</span>
    <button class="btn tint sm" data-act="jgo" data-s="${go}" data-store="${store}">Go</button>
    ${open ? `<button class="btn soft sm" data-act="jgo" data-s="inv-exceptions">${open} ${open === 1 ? "exception" : "exceptions"} for Inventory</button>` : ""}
    ${sup ? `<button class="btn soft sm" data-act="jgo" data-s="ops-return-po">Return PO ${sup.no} · ${pcs(sup.n)}</button>` : ""}</div>`
}
A.jgo = (el) => { if (el.dataset.store) S.sstore = el.dataset.store; S.screen = el.dataset.s; S.ov = []; S.psheet = null; render() }
FLOWS.unshift(FLOWS.pop())

S = fresh()
render()
</script>
</body>
</html>
