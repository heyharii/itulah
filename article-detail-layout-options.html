<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article detail · Table focus options</title>
<style>
@font-face{font-family:Inter;src:url('frontend-hub/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f;background:#eef1f5}header{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 18px;background:white;border-bottom:1px solid #e3e5e9}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}strong{font-weight:600;white-space:nowrap}nav{display:flex;gap:3px;border-radius:11px;background:#f1f2f4;padding:3px;overflow:auto}button,select{font:inherit;color:inherit;cursor:pointer}button{border:0;background:none;min-height:36px;border-radius:8px;padding:0 12px;color:#6e6e73;white-space:nowrap}button[aria-pressed=true]{background:white;color:#1d1d1f;box-shadow:0 1px 3px #1d1d1f17}select{height:40px;border:1px solid #e1e3e8;border-radius:9px;background:white;padding:0 28px 0 11px;margin-left:auto;max-width:220px}button:focus-visible,select:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}p{margin:0;color:#6e6e73}main{flex:1;min-height:0}iframe{width:100%;height:100%;border:0;display:block}.recommended{color:#1d4ed8}@media(max-width:850px){strong{display:none}nav{max-width:100%}.controls{gap:8px}select{max-width:100%}}@media(max-width:550px){header{padding:10px 12px}nav{width:100%}button{padding-inline:11px}select{height:40px}}
</style></head><body>
<header><div class="controls"><strong>Article detail</strong><nav aria-label="Detail layout"><button data-layout="now" aria-pressed="false">Now · Spread</button><button data-layout="header" aria-pressed="false">A · Grouped header</button><button data-layout="strip" aria-pressed="true">B · Compact strip</button><button data-layout="below" aria-pressed="false">C · Table first</button><button data-layout="properties" aria-pressed="false">D · Properties rail</button><button data-layout="properties-top" aria-pressed="false">E · Two columns</button></nav><select id="sample" aria-label="Example article"><option value="47">Celana Anak Essential</option><option value="2">Kemeja Oxford</option><option value="1">Blus Rayon</option></select></div><p id="description"></p></header>
<main><iframe id="preview" title="Article detail layout preview"></iframe></main>
<script>
const notes={now:'Susunan awal: tiga blok informasi menyebar selebar sheet, lalu judul Variants dan tabel.',header:'Informasi tetap berlabel dan dikelompokkan menurut panjang isinya di bawah nama artikel.',strip:'Recommended · Informasi berlabel dalam satu baris ringkas, lalu tabel. Judul Variants yang berulang dihapus.',below:'Tabel langsung setelah identitas artikel. Division dan Price range menjadi informasi sekunder di bawah tabel.',properties:'Informasi vertikal dengan ikon kecil di samping tabel. Di layar sempit, properti turun ke bawah tabel.','properties-top':'Division dan Price range dalam dua kolom; jumlah variants menjadi pengantar tabel.'};
const params=new URLSearchParams(location.search);let layout=params.get('layout')||'strip';if(!notes[layout])layout='strip';const sample=document.getElementById('sample');sample.value=['47','2','1'].includes(params.get('article'))?params.get('article'):'47';
function render(){document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===layout)));document.getElementById('description').textContent=notes[layout];const frame=document.getElementById('preview');frame.src='white-hierarchy-options.html?v=stone&detail='+layout+'&article='+sample.value+'&embed=1';history.replaceState(null,'','?layout='+layout+'&article='+sample.value)}
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;render()});sample.onchange=render;render();
</script></body></html>
