<script>
/* ═══ Drag and drop, and a reduction on a Picked card ══════════════════════
   Desk only, as in the hub: a drop NEVER writes — it opens the sheet that owns
   the step, and that sheet asks. Forward moves open the next station; going
   back opens the card's own sheet. A card with work owed cannot move forward
   (the lane says why, in red) and has one more place to go: "Back in stock".
   The card's own button stays: it is the keyboard and the phone way in.
   ──────────────────────────────────────────────────────────────────────── */
let DR=null;
const laneIx=k=>LANES.findIndex(l=>l.k===k);
const FWD={
  'pick>picked':c=>finishPick(c.id),
  'picked>packed':c=>openPack(c.id),
  'packed>transit':c=>{S.sel.add(c.id);openDispatch()},
  'packed>picked':c=>openDetail(c.id),
  'picked>pick':c=>openDetail(c.id),
  'transit>packed':c=>openDetail(c.id)
};
function dropRule(c,lane){
  if(c.lane===lane)return{ok:false,silent:true};
  if(c.cancelled)return lane==='BIS'?{ok:true,act:()=>openDetail(c.id)}:{ok:false,msg:'Cancelled by MD · remove the picklist'};
  const p=pend(c);
  if(p>0){
    if(lane==='BIS'||laneIx(lane)<laneIx(c.lane))return{ok:true,act:()=>openDetail(c.id)};
    return{ok:false,msg:`${verbOf(c)} ${p} pcs first`};
  }
  if(lane==='BIS')return{ok:false,silent:true};
  const f=FWD[c.lane+'>'+lane];
  return f?{ok:true,act:()=>f(c)}:{ok:false,silent:true};
}
function dragStart(e,cid){
  const c=C.find(x=>x.id===cid);DR={cid};
  e.dataTransfer.setData('text/plain',String(cid));e.dataTransfer.effectAllowed='move';
  document.body.classList.add('dragging');
  document.querySelectorAll('#board .lane').forEach(l=>{const r=dropRule(c,l.dataset.lane);l.classList.toggle('drop-ok',!!r.ok);l.classList.toggle('drop-no',!r.ok&&!r.silent)});
  if(fixOf(c)&&dropRule(c,'BIS').ok)$('bis').classList.add('on');
}
function dragEnd(){
  DR=null;document.body.classList.remove('dragging');
  document.querySelectorAll('#board .lane').forEach(l=>l.classList.remove('drop-ok','drop-no','over','over-no'));
  $('bis').classList.remove('on','over');
}
(function(){
  const bis=document.createElement('div');bis.id='bis';bis.className='bis';bis.innerHTML='<i data-lucide="package-check"></i>Back in stock';document.body.appendChild(bis);
  const board=$('board');
  board.addEventListener('dragover',e=>{
    if(!DR)return;const lane=e.target.closest('.lane');if(!lane)return;
    const c=C.find(x=>x.id===DR.cid);if(!c)return;const r=dropRule(c,lane.dataset.lane);
    board.querySelectorAll('.lane').forEach(l=>l.classList.remove('over','over-no'));
    if(r.ok){e.preventDefault();e.dataTransfer.dropEffect='move';lane.classList.add('over')}
    else if(r.msg){lane.dataset.msg=r.msg;lane.classList.add('over-no')}
  });
  board.addEventListener('drop',e=>{
    if(!DR)return;const lane=e.target.closest('.lane');if(!lane)return;
    const c=C.find(x=>x.id===DR.cid);const r=dropRule(c,lane.dataset.lane);e.preventDefault();dragEnd();if(r.ok)r.act();
  });
  bis.addEventListener('dragover',e=>{if(DR){e.preventDefault();bis.classList.add('over')}});
  bis.addEventListener('dragleave',()=>bis.classList.remove('over'));
  bis.addEventListener('drop',e=>{e.preventDefault();const c=C.find(x=>x.id===(DR&&DR.cid));dragEnd();if(c){const r=dropRule(c,'BIS');if(r.ok)r.act()}});
  addEventListener('dragend',dragEnd);
})();

/* ── the pack sheet can change under the packer's hands too ───────────── */
const packOpen=()=>PK.cid!=null&&/Close koli|Everything is in a koli/.test($('dlg').innerHTML);
const _renderPack=renderPack;
renderPack=function(){
  _renderPack();
  const c=C.find(x=>x.id===PK.cid);if(!c)return;
  const p=pend(c);if(!c.cancelled&&p===0)return;
  const db=document.querySelector('#dlg .db'),df=document.querySelector('#dlg .df .btn.pri');
  if(db)db.insertAdjacentHTML('afterbegin',`<div class="banner red"><i data-lucide="octagon-x"></i><span>${c.cancelled?'MD cancelled this store · move everything back first · packing waits.':`MD reduced this store · ${verbOf(c).toLowerCase()} ${id(p)} pcs first · packing waits.`}</span></div>`);
  if(df)df.disabled=true;
  icons();
};
const _doPack=doPack;
doPack=function(){const c=C.find(x=>x.id===PK.cid);if(c&&(c.cancelled||pend(c)>0)){toast(`${verbOf(c)} ${pend(c)} pcs first`);return}_doPack()};
const _refreshAll=refreshAll;
refreshAll=function(){_refreshAll();if(packOpen())renderPack()};

/* ── one more simulate button: −50 on a Picked card ───────────────────── */
const _sim=sim;
sim=function(kind){
  if(kind==='reducePicked'){
    const c=C.find(x=>x.a==='ALT-0410'&&x.s==='Store BSD'&&x.lane==='picked');
    if(!c){toast('Store BSD has already moved on');return}
    if(pend(c)>0){toast('ALT-0410 · Store BSD is already reduced');return}
    const L=ens(c);applyDraft('ALT-0410',{[c.id]:{0:Math.max(0,L[0].qty-20),1:Math.max(0,L[1].qty-30)}},[]);return;
  }
  _sim(kind);
};
$('sseg').innerHTML='<span class="lbl">MD does</span><button onclick="sim(\'reduce\')">−50 · packed</button><button onclick="sim(\'reducePicked\')">−50 · picked</button><button onclick="sim(\'add\')">+30 on ALT-0412</button><button onclick="sim(\'cancel\')">Cancel ALT-0412</button><button onclick="skip()">+3 h</button><button onclick="location.reload()">Reset</button>';
paintView();
</script>

<script>
/* ═══ Moving a card back ═══════════════════════════════════════════════════
   (owner, 9 Oct) The warehouse can undo its own work: Picked → To pick,
   Packed → Picked or To pick. Never from In transit. It is a physical thing,
   so it asks first (a drop, or the card sheet's "Move back…", opens the
   question); on confirm the card changes lane, pieces that went back to a rack
   are in stock again, and MD's numbers follow.
   ──────────────────────────────────────────────────────────────────────── */
const BACK_WORD={pick:'To pick',picked:'Picked'};
function openRevert(cid,to){
  const c=C.find(x=>x.id===cid);
  if(!c||c.cancelled||isSent(c))return;
  if(!(to==='pick'||to==='picked')||laneIx(to)>=laneIx(c.lane))return;
  S.rv={cid,to};paintRevert();
}
function paintRevert(){
  const{cid,to}=S.rv,c=C.find(x=>x.id===cid);if(!c){closeDlg();return}
  const from=c.lane,L=ens(c),p=pend(c);
  const opts=from==='packed'?['picked','pick']:['pick'];
  const outcome=from==='packed'
    ?(to==='picked'?`${c.koli} koli opened · labels void · ${id(c.pcs)} pcs go back to the picked pile`
                   :`${c.koli} koli opened · labels void · ${id(c.pcs)} pcs go back to their racks · in stock`)
    :`${id(c.pcs)} pcs go back to their racks · in stock`;
  const chips=opts.length>1?`<div class="rch">${opts.map(o=>`<button class="${to===o?'on':''}" onclick="S.rv.to='${o}';paintRevert()">${BACK_WORD[o]}</button>`).join('')}</div>`:'';
  $('dlg').innerHTML=`<div class="veil" onmousedown="if(event.target===this)closeDlg()"><div class="dlg packw" style="width:min(40rem,100%)"><div class="dh"><div class="g"><h2>Move ${c.s} back?</h2><p class="mono">${c.a} · ${id(c.pcs)} pcs · now ${WORD[from].toLowerCase()}</p></div><button class="ib" onclick="closeDlg()" aria-label="Close"><i data-lucide="x"></i></button></div>`
    +`<div class="db">${chips}<div class="tcard"><table><thead><tr><th class="n">No.</th><th>SKU</th><th>${from==='packed'?'In koli':'Rack'}</th><th class="r">Qty</th></tr></thead><tbody>`
    +L.map((l,i)=>`<tr><td class="n">${i+1}</td><td><span class="nm">${l.name} · ${l.size}</span><span class="sk">${l.sku}</span></td><td class="mono">${from==='packed'?kName(kOf(c,i)):l.rack}</td><td class="r">${l.qty}</td></tr>`).join('')
    +`</tbody><tfoot><tr><td></td><td colspan="2">Total</td><td class="r">${id(c.pcs)}</td></tr></tfoot></table></div>`
    +`<p style="color:var(--body);margin:14px 0 0">${outcome}${p>0&&to==='pick'?` · ${id(p)} of them were already to put back`:''}</p></div>`
    +`<div class="df"><span class="g"></span><button class="btn" onclick="closeDlg()">Keep</button><button class="btn pri" onclick="confirmRevert()">Move back to ${BACK_WORD[to]}</button></div></div></div>`;
  icons();
}
function confirmRevert(){
  const{cid,to}=S.rv,c=C.find(x=>x.id===cid);if(!c){closeDlg();return}
  const from=c.lane,had=c.pcs,kolis=c.koli;
  if(to==='pick'){
    c.lines=ens(c).map(l=>({...l,qty:wantOf(l),want:wantOf(l)})).filter(l=>l.qty>0);
    c.pcs=c.lines.reduce((t,l)=>t+l.qty,0);c.t0=null;c.edit=null;
  }
  move(c,to);c.koli=undefined;c.kolis=undefined;S.sel.delete(c.id);
  logEv(c.a,`${WHN} moved ${c.s} back to ${BACK_WORD[to]}`);
  toast(from==='packed'
    ?`${c.s} · ${kolis} koli opened · back to ${BACK_WORD[to]}`
    :`${c.s} · ${id(had)} pcs back on the racks · to pick again`);
  S.rv=null;closeDlg();if(S.open===c.id)renderDetail();refreshAll();
}

/* drag rules: back moves ask; In transit never moves */
dropRule=function(c,lane){
  if(c.lane===lane)return{ok:false,silent:true};
  if(c.cancelled)return lane==='BIS'?{ok:true,act:()=>openDetail(c.id)}:{ok:false,msg:'Cancelled by MD · remove the picklist'};
  if(isSent(c))return{ok:false,silent:true};
  const p=pend(c);
  if(lane==='BIS')return p>0?{ok:true,act:()=>openRevert(c.id,'pick')}:{ok:false,silent:true};
  if(laneIx(lane)<laneIx(c.lane))return(lane==='pick'||lane==='picked')?{ok:true,act:()=>openRevert(c.id,lane)}:{ok:false,silent:true};
  if(p>0)return{ok:false,msg:`${verbOf(c)} ${p} pcs first`};
  const f=FWD[c.lane+'>'+lane];return f?{ok:true,act:()=>f(c)}:{ok:false,silent:true};
};

/* the card sheet gets "Move back…" for Picked and Packed cards */
const _renderDetail=renderDetail;
renderDetail=function(){
  _renderDetail();
  const c=C.find(x=>x.id===S.open);
  if(c&&!c.cancelled&&pend(c)===0&&(c.lane==='picked'||c.lane==='packed')){
    const sf=document.querySelector('#side .sf');
    if(sf)sf.insertAdjacentHTML('afterbegin',`<button class="btn" style="margin-right:auto" onclick="openRevert(${c.id},'${c.lane==='packed'?'picked':'pick'}')">Move back…</button>`);
  }
};
paintView();
</script>

<script>
/* ═══ Moving back a part ═══════════════════════════════════════════════════
   (owner, 9 Oct) Not the whole card: pick the lines and the quantity.
   Packed → Picked: those pieces leave their koli (the koli's label is
   reprinted; a koli left empty goes away) and join the card of the same store
   in Picked. Picked → To pick: those pieces go back on their racks and the
   store's picklist asks for them again. Pieces MD already took out of the
   allotment (work owed) go back first and are not asked for again.
   ──────────────────────────────────────────────────────────────────────── */
const kolisOf=c=>[...new Set(ens(c).map((l,i)=>kOf(c,i)))].sort((a,b)=>a-b);
function revertPlan(c,m){
  const L=ens(c);let moved=0,excess=0,keep=0;const touched=new Set(),left=new Set();
  L.forEach((l,i)=>{
    const q=Math.min(m[i]!=null?m[i]:l.qty,l.qty),e=Math.min(q,takeOf(l));
    moved+=q;excess+=e;keep+=q-e;
    if(q>0)touched.add(kOf(c,i));
    if(l.qty-q>0)left.add(kOf(c,i));
  });
  const total=L.reduce((s,l)=>s+l.qty,0);
  const t=[...touched].sort((a,b)=>a-b),emptied=t.filter(k=>!left.has(k));
  return{moved,excess,keep,total,touched:t,emptied,all:moved===total};
}
function openRevert(cid,to){
  const c=C.find(x=>x.id===cid);
  if(!c||c.cancelled||isSent(c))return;
  if(!(to==='pick'||to==='picked')||laneIx(to)>=laneIx(c.lane))return;
  const m={},edited=pend(c)>0;ens(c).forEach((l,i)=>{m[i]=edited?takeOf(l):l.qty});
  S.rv={cid,to,m};paintRevert();
}
function rvq(i,d){const c=C.find(x=>x.id===S.rv.cid),l=ens(c)[i];S.rv.m[i]=Math.max(0,Math.min(l.qty,(S.rv.m[i]!=null?S.rv.m[i]:l.qty)+d));paintRevert()}
function rvset(i,v){const c=C.find(x=>x.id===S.rv.cid),l=ens(c)[i];S.rv.m[i]=Math.max(0,Math.min(l.qty,parseInt(v)||0));paintRevert()}
function rvFill(all){const c=C.find(x=>x.id===S.rv.cid);ens(c).forEach((l,i)=>{S.rv.m[i]=all==='excess'?takeOf(l):all?l.qty:0});paintRevert()}
function paintRevert(){
  const{cid,to,m}=S.rv,c=C.find(x=>x.id===cid);if(!c){closeDlg();return}
  const from=c.lane,L=ens(c),pl=revertPlan(c,m);
  const opts=from==='packed'?['picked','pick']:['pick'];
  const chips=opts.length>1?`<div class="rch">${opts.map(o=>`<button class="${to===o?'on':''}" onclick="S.rv.to='${o}';paintRevert()">${BACK_WORD[o]}</button>`).join('')}</div>`:'';
  const ks=pl.touched.map(kName).join(', ');
  let outcome='';
  if(!pl.moved)outcome='Choose what goes back.';
  else if(from==='packed'){
    const lab=pl.all?`${c.koli} koli opened · labels void`:`${ks} reopened · ${pl.touched.length===1?'label':'labels'} reprinted${pl.emptied.length?` · ${pl.emptied.map(kName).join(', ')} empty, removed`:''}`;
    outcome=to==='picked'?`${lab} · ${id(pl.moved)} pcs join the picked pile`
      :`${lab} · ${id(pl.moved)} pcs go back to their racks · ${pl.keep?id(pl.keep)+' to pick again':'nothing to pick again'}`;
  }else outcome=`${id(pl.moved)} pcs go back to their racks · ${pl.keep?id(pl.keep)+' to pick again':'nothing to pick again'}`;
  if(pl.excess&&pl.moved)outcome+=` · ${id(pl.excess)} of them were already to put back`;
  $('dlg').innerHTML=`<div class="veil" onmousedown="if(event.target===this)closeDlg()"><div class="dlg packw" style="width:min(46rem,100%)"><div class="dh"><div class="g"><h2>Move back from ${c.s}</h2><p class="mono">${c.a} · ${id(c.pcs)} pcs · now ${WORD[from].toLowerCase()}</p></div><button class="ib" onclick="closeDlg()" aria-label="Close"><i data-lucide="x"></i></button></div>`
    +`<div class="db"><div class="khead">${chips||'<span></span>'}<span>${pend(c)>0?`<button class="link" onclick="rvFill('excess')">MD’s edit</button> · `:''}<button class="link" onclick="rvFill(true)">All</button> · <button class="link" onclick="rvFill(false)">None</button></span></div>`
    +`<div class="tcard"><table><thead><tr><th class="n">No.</th><th>SKU</th><th>${from==='packed'?'In koli':'Rack'}</th><th class="r">Now</th><th class="r" style="width:14rem">Move back</th></tr></thead><tbody>`
    +L.map((l,i)=>{const q=m[i]!=null?m[i]:l.qty;return `<tr${q===0?' class="gone"':''}><td class="n">${i+1}</td><td><span class="nm">${l.name} · ${l.size}</span><span class="sk">${l.sku}</span></td><td class="mono">${from==='packed'?kName(kOf(c,i)):l.rack}</td><td class="r">${l.qty}</td><td class="r"><span class="qs"><button onclick="rvq(${i},-1)"${q?'':' disabled'} aria-label="One less"><i data-lucide="minus"></i></button><input value="${q}" inputmode="numeric" onchange="rvset(${i},this.value)"><button onclick="rvq(${i},1)"${q<l.qty?'':' disabled'} aria-label="One more"><i data-lucide="plus"></i></button></span></td></tr>`}).join('')
    +`</tbody><tfoot><tr><td></td><td colspan="2">Total</td><td class="r">${id(pl.total)}</td><td class="r">${id(pl.moved)}</td></tr></tfoot></table></div>`
    +`<p style="color:var(--body);margin:14px 0 0">${outcome}</p></div>`
    +`<div class="df"><span class="g">${pl.moved?`${id(pl.moved)} of ${id(pl.total)} pcs`:''}</span><button class="btn" onclick="closeDlg()">Keep</button><button class="btn pri"${pl.moved?'':' disabled'} onclick="confirmRevert()">Move back ${pl.all?'all':id(pl.moved)+' pcs'}</button></div></div></div>`;
  icons();
}
function confirmRevert(){
  const{cid,to,m}=S.rv,c=C.find(x=>x.id===cid);if(!c){closeDlg();return}
  const from=c.lane,L=ens(c),pl=revertPlan(c,m);if(!pl.moved)return;
  const dest=[];
  L.forEach((l,i)=>{
    const q=Math.min(m[i]!=null?m[i]:l.qty,l.qty);if(q<=0)return;
    const W=wantOf(l),e=Math.min(q,l.qty-W),k=q-e;
    if(to==='picked')dest.push({name:l.name,sku:l.sku,size:l.size,rack:l.rack,qty:q,want:k});
    else if(k>0)dest.push({name:l.name,sku:l.sku,size:l.size,rack:l.rack,qty:k,want:k});
    l.qty-=q;l.want=Math.max(0,W-k);
  });
  const rest=L.filter(l=>l.qty>0),oldKoli=c.koli;
  const sum=a=>a.reduce((t,l)=>t+l.qty,0);
  let landed=null;
  if(!rest.length){
    // everything went back: the card itself moves (or is gone when nothing is to be picked again)
    if(!dest.length){C.splice(C.indexOf(c),1);S.sel.delete(c.id);if(S.open===c.id){S.open=null;$('side').innerHTML=''}}
    else{c.lines=dest;c.pcs=sum(dest);c.t0=null;c.edit=null;move(c,to);c.koli=undefined;c.kolis=undefined;if(to==='pick')c.again=true;S.sel.delete(c.id);landed=c}
  }else{
    c.lines=rest;c.pcs=sum(rest);
    if(from==='packed'){c.koli=new Set(rest.map(l=>l.k)).size;c.kolis=undefined}
    if(pend(c)===0){c.t0=null;c.edit=null}
    if(dest.length){
      let d=C.find(x=>x.id!==c.id&&x.a===c.a&&x.s===c.s&&x.lane===to&&!x.cancelled);
      if(d){const DL=ens(d);dest.forEach(n=>{const f=DL.find(l=>l.sku===n.sku);if(f){f.qty+=n.qty;f.want=(f.want!=null?f.want:f.qty-n.qty)+n.want}else DL.push(n)});d.pcs=sum(DL);d.moved=(d.moved||0)+sum(dest)}
      else{d={id:++seq,s:c.s,a:c.a,sup:c.sup,pcs:sum(dest),lane:to,age:0,lines:dest,moved:sum(dest),again:to==='pick'};C.unshift(d)}
      landed=d;
    }
  }
  if(landed){S.fresh=landed.id;S.pulse.add(landed.id);if(pend(landed)>0){landed.t0=S.clock;landed.edit=landed.edit||{by:MDN,at:hhmm(S.clock)}}}
  logEv(c.a,`${WHN} moved ${id(pl.moved)} pcs of ${c.s} back to ${BACK_WORD[to]}`);
  toast(from==='packed'
    ?`${c.s} · ${pl.all?oldKoli+' koli opened':pl.touched.map(kName).join(', ')+' reopened · label reprinted'} · ${id(pl.moved)} pcs to ${BACK_WORD[to]}`
    :`${c.s} · ${id(pl.moved)} pcs back on the racks${pl.keep?' · to pick again':''}`);
  S.rv=null;closeDlg();if(S.open===c.id)renderDetail();refreshAll();
}
paintView();
</script>

<script>
/* ═══ Cancel at any stage before it is sent ════════════════════════════════
   (owner, 9 Oct, late) Cancel no longer waits for every picklist to be on the
   Pick List: it is "reduce everything not sent to nothing", so it uses the same
   machinery as an edit. A cancelled To-pick card is removed in one tap; a
   cancelled Picked / Packed card carries the CANCELLED stamp and has to be
   moved back, all of it. What the cost is — pieces the warehouse must move
   back — is said in the dialog and has to be ticked. Sent stays sent.
   ──────────────────────────────────────────────────────────────────────── */
S.ack=false;
function whyNo(g){
  if(!g.length||g.every(c=>c.cancelled))return '';
  return g.every(c=>isSent(c))?'Everything has already been sent':'';
}
function cancelDlg(){
  const a=S.mdA,g=C.filter(c=>c.a===a);if(!canCancel(g))return;
  S.why=null;S.note='';S.ack=false;paintCancel();
}
function paintCancel(){
  const a=S.mdA,g=C.filter(c=>c.a===a&&!isSent(c)&&!c.cancelled),sent=C.filter(c=>c.a===a&&isSent(c));
  const by=k=>g.filter(c=>c.lane===k),pc=k=>by(k).reduce((s,c)=>s+c.pcs,0);
  const work=pc('picked')+pc('packed');
  const row=(k,label,detail,red)=>by(k).length?`<div style="display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--hairline)"><span style="width:6.5rem;color:var(--body)">${label}</span><span style="flex:1;${red?'color:var(--bad-fg)':'color:var(--text)'}">${detail}</span><span style="font-variant-numeric:tabular-nums;color:var(--ink)">${id(pc(k))} pcs</span></div>`:'';
  const koli=by('packed').reduce((s,c)=>s+(c.koli||0),0);
  $('dlg').innerHTML=`<div class="veil" onmousedown="if(event.target===this)closeDlg()"><div class="dlg" style="width:min(34rem,100%)"><div class="dh"><div class="g"><h2>Cancel ${a}?</h2></div><button class="ib" onclick="closeDlg()" aria-label="Close"><i data-lucide="x"></i></button></div>`
    +`<div class="db"><div style="margin-bottom:16px">`
    +row('pick','To pick',`${by('pick').length} picklist${by('pick').length===1?'':'s'} · removed`,false)
    +row('picked','Picked',`${by('picked').length} store${by('picked').length===1?'':'s'} · the warehouse puts it back`,true)
    +row('packed','Packed',`${by('packed').length} store${by('packed').length===1?'':'s'} in ${koli} koli · the warehouse unpacks it`,true)
    +(sent.length?`<div style="display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--hairline);color:var(--mute)"><span style="width:6.5rem">Sent</span><span style="flex:1">keeps going</span><span style="font-variant-numeric:tabular-nums">${id(sent.reduce((s,c)=>s+c.pcs,0))} pcs</span></div>`:'')
    +`</div>`
    +(work>0?`<label style="display:flex;gap:10px;align-items:flex-start;background:#fbeaea;color:var(--bad-fg);border-radius:10px;padding:12px 14px;margin-bottom:16px;cursor:pointer"><input type="checkbox" ${S.ack?'checked':''} onchange="S.ack=this.checked;paintCancel()" style="margin-top:4px;width:18px;height:18px;accent-color:var(--bad-fg)"><span>The warehouse has to move back ${id(work)} pcs that are already ${pc('picked')&&pc('packed')?'picked or packed':pc('packed')?'packed':'picked'}.</span></label>`:'')
    +`<span class="tlabel">Reason</span><div class="rch">${WHYS.map((w,i)=>`<button class="${S.why===w?'on':''}" onclick="S.why=WHYS[${i}];paintCancel()">${w}</button>`).join('')}</div>`
    +`<textarea class="nt" placeholder="Note (optional)" oninput="S.note=this.value">${esc(S.note)}</textarea></div>`
    +`<div class="df"><span class="g">${work>0?'The warehouse moves it back and confirms':'The warehouse removes the picklists'}</span><button class="btn" onclick="closeDlg()">Keep</button><button class="btn dsolid"${S.why&&(work===0||S.ack)?'':' disabled'} onclick="confirmCancel()">Cancel allotment</button></div></div></div>`;
  icons();
}
function doCancel(a,why,note){
  const g=C.filter(c=>c.a===a&&!isSent(c)&&!c.cancelled);if(!g.length)return;
  const reason=why+(note?` · ${note}`:'');
  CINFO[a]={pcs:g.reduce((s,c)=>s+c.pcs,0),stores:g.length,reason,by:MDN,at:hhmm(S.clock),sup:g[0].sup};
  g.forEach(c=>{
    if(c.lane==='picked'||c.lane==='packed')ens(c).forEach(l=>{l.want=0});
    c.cancelled=true;c.cx={by:MDN,reason,at:hhmm(S.clock)};c.t0=S.clock;S.pulse.add(c.id);S.sel.delete(c.id);
  });
  logEv(a,`Cancelled by ${MDN} · ${reason}`);
  toast(`MD cancelled ${a} · ${g.length} store${g.length===1?'':'s'}`);
  refreshAll();
  if(pickOpen())renderPicked();
  if(packOpen())renderPack();
}
function checkGone(a){
  if(!C.some(x=>x.a===a)&&CINFO[a]&&!GONE[a]){GONE[a]={...CINFO[a],confirmed:hhmm(S.clock)};logEv(a,'Cancelled · everything is back')}
}
const _confirmRevert6=confirmRevert;
confirmRevert=function(){const c=S.rv&&C.find(x=>x.id===S.rv.cid),a=c&&c.a;_confirmRevert6();if(a)checkGone(a);paintView()};

function lockedTick(cid){
  const c=C.find(x=>x.id===cid);
  toast(c.cancelled?`${c.s} can’t go · cancelled by MD, move it back`:`${c.s} can’t go yet · move back ${pend(c)} pcs first`);
}
function openRevert(cid,to){
  const c=C.find(x=>x.id===cid);
  if(!c||isSent(c)||(c.cancelled&&c.lane==='pick'))return;
  if(!(to==='pick'||to==='picked')||laneIx(to)>=laneIx(c.lane))return;
  const m={},edited=pend(c)>0;ens(c).forEach((l,i)=>{m[i]=edited?takeOf(l):l.qty});
  S.rv={cid,to,m};paintRevert();
}
dropRule=function(c,lane){
  if(c.lane===lane)return{ok:false,silent:true};
  if(isSent(c))return{ok:false,silent:true};
  if(c.cancelled){
    if(c.lane==='pick')return lane==='BIS'?{ok:true,act:()=>openDetail(c.id)}:{ok:false,msg:'Cancelled by MD · remove the picklist'};
    if(lane==='BIS')return{ok:true,act:()=>openRevert(c.id,'pick')};
    if(laneIx(lane)<laneIx(c.lane)&&(lane==='pick'||lane==='picked'))return{ok:true,act:()=>openRevert(c.id,lane)};
    return{ok:false,msg:'Cancelled by MD · move it back'};
  }
  const p=pend(c);
  if(lane==='BIS')return p>0?{ok:true,act:()=>openRevert(c.id,'pick')}:{ok:false,silent:true};
  if(laneIx(lane)<laneIx(c.lane))return(lane==='pick'||lane==='picked')?{ok:true,act:()=>openRevert(c.id,lane)}:{ok:false,silent:true};
  if(p>0)return{ok:false,msg:`${verbOf(c)} ${p} pcs first`};
  const f=FWD[c.lane+'>'+lane];return f?{ok:true,act:()=>f(c)}:{ok:false,silent:true};
};
paintView();
</script>

<script>
/* stacked toasts: a longer message stays a little longer */
function toast(m){
  let box=$('toasts');if(!box){box=document.createElement('div');box.id='toasts';document.body.appendChild(box)}
  const t=document.createElement('div');t.className='toast';t.textContent=m;box.appendChild(t);
  setTimeout(()=>t.remove(),Math.min(6000,2400+m.length*35));
}
</script>

<script>
/* ═══ Cannot continue — Ops reports, it does not decide ═══════════════════
   (owner's correction, 9 Oct) A short pick used to create an Inventory
   "Missing" at once. Wrong owner. Now:
     Ops        reports "Cannot continue picking · N pcs unfulfilled", the reason,
                and who acts next. That is all it says.
     MD         sees what is Still needed and decides: Wait or Close short.
     Inventory  only when the reason is about stock: a Stock check, which it
                settles through its own process (Found / Lost).
     Ops        resumes when the blocker is gone and the demand is still open.
   An operational reason (label, equipment) stays with Ops: no Inventory case.
   A cancelled demand is never revived by a Found.
   ──────────────────────────────────────────────────────────────────────── */
const REASONS=[
  ['Stock at rack could not be confirmed','Inventory','Stock unconfirmed'],
  ['Item not found at the rack','Inventory','Not at rack'],
  ['Item damaged','Inventory','Damaged'],
  ['Label or equipment problem','Ops','Label / equipment'],
  ['Other','Ops','Other']
];
const sumQ=a=>a.reduce((t,l)=>t+l.qty,0);
const nextOf=owner=>owner==='Inventory'?'Inventory stock check':'Ops resolves it';
const demandWord=u=>({open:'Still needed',wait:'Waiting for stock',closed:'Closed short',cancelled:'Demand cancelled',again:'Picking again'}[u.state]);

/* ── the pick sheet asks WHY, not "who is told" ────────────────────────── */
const _finishPick7=finishPick;
finishPick=function(cid){PQ.why=null;_finishPick7(cid)};
function renderPicked(){
  const c=C.find(x=>x.id===PQ.cid);if(!c){closeDlg();return}
  const L=linesOf(c);L.forEach((l,i)=>{if(PQ.got[i]==null||PQ.got[i]>l.qty)PQ.got[i]=l.qty});
  const got=L.reduce((s,l,i)=>s+PQ.got[i],0),short=c.pcs-got,cx=!!c.cancelled;
  const banner=cx?`<div class="banner red"><i data-lucide="octagon-x"></i><span>MD cancelled this picklist. Put back anything you took.</span></div>`
    :c.bn?`<div class="banner acc"><i data-lucide="info"></i><span>MD changed this picklist · ${id(c.bn.from)} → ${id(c.bn.to)} pcs</span></div>`:'';
  const why=short>0&&!cx?`<div class="blkbox"><b>${id(short)} ${short===1?'pc':'pcs'} can’t be picked</b><div class="rch">${REASONS.map((r,i)=>`<button class="${PQ.why===i?'on':''}" onclick="PQ.why=${i};renderPicked()">${r[0]}</button>`).join('')}</div>${PQ.why==null?'<p>Say why picking can’t continue.</p>':''}</div>`:'';
  $('dlg').innerHTML=`<div class="veil" onmousedown="if(event.target===this)closeDlg()"><div class="dlg packw"><div class="dh"><div class="g"><h2>${c.s}</h2><p class="mono">${c.a} · ${id(c.pcs)} pcs</p></div><button class="ib" onclick="closeDlg()" aria-label="Close"><i data-lucide="x"></i></button></div>`
    +`<div class="db">${banner}<div class="tcard"><table><thead><tr><th class="n">No.</th><th>SKU</th><th class="r">To pick</th><th class="r" style="width:13rem">Picked</th></tr></thead><tbody>`
    +L.map((l,i)=>{const q=PQ.got[i];return `<tr${!cx&&q<l.qty?' class="shortrow"':''}><td class="n">${i+1}</td><td><span class="nm">${l.name} · ${l.size}</span><span class="sk">${l.sku}</span></td><td class="r">${l.qty}</td><td class="r">`
      +(cx?'<span style="color:var(--mute)">—</span>':`<span class="qs"><button onclick="pq(${i},-1)"${q?'':' disabled'} aria-label="One less"><i data-lucide="minus"></i></button><input value="${q}" inputmode="numeric" onchange="pqset(${i},this.value)"><button onclick="pq(${i},1)"${q<l.qty?'':' disabled'} aria-label="One more"><i data-lucide="plus"></i></button></span>`)+'</td></tr>'}).join('')
    +`</tbody><tfoot><tr><td></td><td>Total</td><td class="r">${id(c.pcs)}</td><td class="r"${short&&!cx?' style="color:var(--bad-fg)"':''}>${cx?'—':id(got)}</td></tr></tfoot></table></div>${why}</div>`
    +`<div class="df"><span class="g">${cx?'Anything in your hands goes back to its rack':short?`<b style="color:var(--bad-fg)">${id(short)} ${short===1?'pc':'pcs'} unfulfilled</b>`:'Everything picked'}</span>`
    +(cx?`<button class="btn pri" onclick="closeDlg();confirmFix(${c.id})">Confirm cancelled</button>`
       :short?`<button class="btn pri"${PQ.why==null?' disabled':''} onclick="confirmPicked()">${got?`Picked ${id(got)} · report ${id(short)}`:'Report · cannot continue'}</button>`
       :`<button class="btn pri" onclick="confirmPicked()">Picked ${id(got)} pcs</button>`)+'</div></div></div>';
  icons();
}
function confirmPicked(){
  const c=C.find(x=>x.id===PQ.cid);if(!c)return;
  const L=linesOf(c),got=L.reduce((s,l,i)=>s+PQ.got[i],0),short=c.pcs-got;
  if(short<=0){c.lines=L.map((l,i)=>({...l,qty:PQ.got[i]}));closeDlg();move(c,'picked');render();toast(`${c.s} picked`);return}
  if(PQ.why==null)return;
  const why=REASONS[PQ.why];
  const pickedL=L.map((l,i)=>({...l,qty:PQ.got[i],want:PQ.got[i]})).filter(l=>l.qty>0);
  const missL=L.map((l,i)=>({...l,qty:l.qty-PQ.got[i],want:l.qty-PQ.got[i]})).filter(l=>l.qty>0);
  let b;
  if(!pickedL.length){b=c;c.lines=missL;c.pcs=sumQ(missL)}
  else{
    c.lines=pickedL;c.pcs=sumQ(pickedL);move(c,'picked');
    b={id:++seq,s:c.s,a:c.a,sup:c.sup,pcs:sumQ(missL),lane:'pick',age:0,lines:missL};C.unshift(b);
  }
  b.t0=S.clock;
  const first=missL[0],label=missL.length===1?`${first.name} · ${first.size}`:`${first.name} · ${first.size} +${missL.length-1} more`;
  const uid='u'+(++fseq);
  b.blk={reason:why[0],tag:why[2],owner:why[1],status:'blocked',by:WHN,at:hhmm(S.clock),uid};
  UNF.unshift({id:uid,a:c.a,s:c.s,sku:missL.length===1?first.sku:`${missL.length} SKUs`,name:label,qty:sumQ(missL),state:'open',reason:why[0],owner:why[1],inv:why[1]==='Inventory'?'checking':null,cardId:b.id});
  if(why[1]==='Inventory')MIS.unshift({id:'m'+fseq,sku:missL.length===1?first.sku:`${missL.length} SKUs`,name:label,rack:first.rack,qty:sumQ(missL),from:`${c.a} · ${c.s}`,by:WHN,when:'Just now',state:'open',unf:uid});
  logEv(c.a,`${WHN} · cannot continue picking · ${c.s} · ${sumQ(missL)} pcs unfulfilled · ${why[0]}`);
  S.pulse.add(b.id);S.fresh=b.id;closeDlg();render();paintView();
  toast(`Cannot continue picking · ${sumQ(missL)} pcs unfulfilled`);
}

const _rd7=renderDetail;
renderDetail=function(){
  _rd7();
  const c=C.find(x=>x.id===S.open);
  if(c&&c.blk&&!c.cancelled){
    const b=c.blk,sb=document.querySelector('#side .sb');
    if(sb)sb.insertAdjacentHTML('afterbegin',`<dl class="facts"><div><dt>Short pick</dt><dd>${esc(b.reason)}</dd></div><div><dt>Reported by</dt><dd>${b.by} · ${b.at}</dd></div>${b.status==='lost'?'<div><dt>Inventory</dt><dd>Lost · MD decides</dd></div>':''}</dl>`);
  }
};
/* ── MD: what is still needed, and what to do about it ────────────────── */
function unfStatus(u){
  if(u.state==='cancelled')return {a:'Demand cancelled · no further picking',b:u.inv==='Found'?`Inventory: found ${u.qty} · back in available stock`:u.inv==='checking'?'Inventory: stock check continues':u.inv==='Lost'?`Inventory: lost ${u.qty}`:''};
  const a=`Cannot continue picking · ${u.reason}`;
  let b='';
  if(u.owner==='Inventory')b=u.inv==='checking'?'Inventory: stock check in progress':u.inv==='Found'?`Inventory: found ${u.qty} · ${u.state==='closed'?'back in available stock':'picking can resume'}`:`Inventory: lost ${u.qty}`;
  else b=u.state==='again'?'Ops: resumed':'Ops: resolving';
  return{a,b};
}
function mdUnfilled(){
  const live=UNF.filter(u=>u.state==='open'||u.state==='wait'||(u.state==='cancelled'&&!u.seen)),rest=UNF.filter(u=>!live.includes(u));
  const act=u=>{
    if(u.state==='open')return `<button class="btn" onclick="mdDecide('${u.id}','wait')">Wait</button> <button class="btn" onclick="mdDecide('${u.id}','closed')">Close short</button>`;
    if(u.state==='wait')return u.inv==='Lost'?`<button class="btn" onclick="mdDecide('${u.id}','closed')">Close short</button>`:'<span class="pill info">Waiting for stock</span>';
    return `<span class="pill${u.state==='again'?' ok':''}">${demandWord(u)}</span>`;
  };
  const row=(u,i)=>{const s=unfStatus(u);return `<tr><td class="n">${i+1}</td><td class="mono">${u.a}</td><td class="strong">${u.s}</td><td><span class="nm">${u.name}</span><span class="sk">${u.sku}</span></td><td class="r">${u.qty} pcs</td><td style="white-space:normal;min-width:16rem">${s.a}${s.b?`<span class="sk" style="margin-top:2px">${s.b}</span>`:''}</td><td class="act">${act(u)}</td></tr>`};
  const head='<thead><tr><th class="n">No.</th><th>Allotment</th><th>Store</th><th>SKU</th><th class="r">Still needed</th><th>Why</th><th class="act"></th></tr></thead>';
  return `<h3 class="vt">Still needed <span>${live.length}</span></h3>`
    +(live.length?`<div class="tcard"><table>${head}<tbody>${live.map(row).join('')}</tbody></table></div>`:'<div class="none">Nothing is waiting on a decision.</div>')
    +(rest.length?`<h3 class="vt">Decided</h3><div class="tcard"><table><tbody>${rest.map(row).join('')}</tbody></table></div>`:'');
}
function mdDecide(uid,what){
  const u=UNF.find(x=>x.id===uid);if(!u)return;
  u.state=what;const card=C.find(c=>c.id===u.cardId);
  if(what==='closed'){
    if(card&&card.blk){C.splice(C.indexOf(card),1);if(S.open===card.id){S.open=null;$('side').innerHTML=''}}
    logEv(u.a,`Closed short by ${MDN} · ${u.s} · ${u.qty} pcs`);
    toast(`Closed short · ${u.s} gets ${u.qty} pcs less`);
  }else{logEv(u.a,`${MDN} · waiting for stock · ${u.s} · ${u.qty} pcs`);toast('Waiting for stock')}
  paintView();
}

/* ── Inventory: stock checks, settled by Inventory ─────────────────────── */
function invView(){
  const open=MIS.filter(m=>m.state==='open'),rest=MIS.filter(m=>m.state!=='open');
  const dem=m=>{const u=UNF.find(x=>x.id===m.unf);return u?demandWord(u):'—'};
  const row=(m,i)=>`<tr><td class="n">${i+1}</td><td><span class="nm">${m.name}</span><span class="sk">${m.sku}</span></td><td class="mono">${m.rack}</td><td class="r">${m.qty} pcs</td><td><span class="nm" style="font-weight:400">${m.from}</span><span class="sk">Reported by ${m.by} · ${m.when}</span></td><td>${dem(m)}</td><td class="act">${m.state==='open'?`<button class="btn" onclick="invDecide('${m.id}','found')">Found</button> <button class="btn" onclick="invDecide('${m.id}','lost')">Lost</button>`:`<span class="pill${m.state==='found'?' ok':' bad'}">${m.state==='found'?'Found':'Lost'}</span>`}</td></tr>`;
  const head='<thead><tr><th class="n">No.</th><th>SKU</th><th>Rack</th><th class="r">Qty</th><th>Reported</th><th>MD</th><th class="act"></th></tr></thead>';
  return '<div class="vh"><h1>Stock checks</h1></div>'
    +`<h3 class="vt">Open <span>${open.length}</span></h3>`
    +(open.length?`<div class="tcard"><table>${head}<tbody>${open.map(row).join('')}</tbody></table></div>`:'<div class="none">No stock checks open.</div>')
    +(rest.length?`<h3 class="vt">Settled</h3><div class="tcard"><table><tbody>${rest.map(row).join('')}</tbody></table></div>`:'');
}
function invDecide(mid,what){
  const m=MIS.find(x=>x.id===mid);if(!m)return;
  m.state=what;const u=UNF.find(x=>x.id===m.unf);
  if(u)u.inv=what==='found'?'Found':'Lost';
  const card=u?C.find(c=>c.id===u.cardId):null;
  if(what==='found'){
    if(u&&card&&card.blk&&(u.state==='open'||u.state==='wait')&&!card.cancelled){card.blk=null;u.state='again';S.pulse.add(card.id);toast(`Found ${m.qty} · ${card.s} can be picked`)}
    else toast(`Found ${m.qty} · back in available stock${u&&u.state==='cancelled'?' · demand cancelled':u&&u.state==='closed'?' · demand closed':''}`);
  }else{
    if(card&&card.blk)card.blk.status='lost';
    toast(`Lost ${m.qty} · MD decides what is still needed`);
  }
  logEv(m.from.split(' · ')[0],`Inventory · stock check · ${what==='found'?'found':'lost'} ${m.qty}`);
  paintView();
}

/* ── a cancelled demand is never revived by a Found ───────────────────── */
const _doCancel7=doCancel;
doCancel=function(a,why,note){
  _doCancel7(a,why,note);
  UNF.filter(u=>u.a===a&&u.state!=='closed').forEach(u=>{u.state='cancelled'});
  paintView();
};

/* ── Received short is not Completed ───────────────────────────────────── */
function statusOf(g){
  if(g.every(c=>c.cancelled))return 'Cancelled';
  if(g.every(c=>c.lane==='recv'))return g.some(c=>c.got<c.pcs)?'Received short':'Completed';
  return 'Active';
}

/* ── seed: yesterday's short pick is now a blocked card + a stock check ── */
(function(){
  const u=UNF[0];if(!u||u.cardId)return;
  const card={id:++seq,s:'Store Bintaro',a:'ALT-0409',sup:'Konveksi Anugerah',pcs:3,lane:'pick',age:1,
    lines:[{name:'Kaos Crew Basic',sku:'KAO-CRW-BS-XXL',size:'XXL',rack:'C-04',qty:3,want:3}],
    blk:{reason:'Stock at rack could not be confirmed',tag:'Stock unconfirmed',owner:'Inventory',status:'blocked',by:WHN,at:'Yesterday',uid:u.id},t0:-1500};
  C.push(card);
  Object.assign(u,{reason:'Stock at rack could not be confirmed',owner:'Inventory',inv:'checking',cardId:card.id});
})();
paintView();
</script>

<script>
/* ═══ The shortfall stays on the picklist ══════════════════════════════════
   (owner, 9 Oct) Target 100, picked 95: the 95 go on (Picked → Packed → sent);
   the 5 stay on To pick for the same allotment and store. The shortfall does not
   hold the 95 back, and MD does not have to choose "Wait". MD sees
   "Target 100 · Sent 95 · To pick 5" and can close the remaining 5 when they are
   not needed. Ops reports "5 pcs can’t be picked yet"; it never sets Missing.
   The blocked card is stamped BLOCKED, like the other cards that cannot move.
   ──────────────────────────────────────────────────────────────────────── */
const ageWord=h=>h>=24?`${Math.floor(h/24)} d`:`${h} h`;
const _confirmPicked8=confirmPicked;

function stageCell(c){
  if(c.blk){const b=c.blk;return `To pick${b.picked?`<span class="sub2" style="display:block;font-size:14px;color:var(--mute)">Short · picked ${id(b.picked)} of ${id(b.target)}</span>`:`<span class="sub2" style="display:block;font-size:14px;color:var(--mute)">Short</span>`}`}
  return WORD[c.lane];
}

/* ── MD: target, sent, what is left — and one decision ────────────────── */
function unfNumbers(u){
  const cards=C.filter(c=>c.a===u.a&&c.s===u.s);
  const sent=cards.filter(isSent).reduce((s,c)=>s+(c.lane==='recv'?c.got:c.pcs),0);
  const left=cards.filter(c=>c.blk&&c.blk.uid===u.id).reduce((s,c)=>s+c.pcs,0)||(u.state==='closed'?0:u.qty);
  const target=u.target||(sent+left);
  const doing=Math.max(0,target-sent-left-(u.state==='closed'?u.qty:0));
  return{target,sent,doing,left};
}
function unfStatus(u){
  const nb=unfNumbers(u);
  const a=`Target ${id(nb.target)} · Sent ${id(nb.sent)}${nb.doing?` · In progress ${id(nb.doing)}`:''} · To pick ${id(u.state==='closed'?0:nb.left)}`;
  let b;
  if(u.state==='cancelled')b=u.inv==='Found'?`Demand cancelled · Inventory found ${u.qty} · back in available stock`:'Demand cancelled · no further picking';
  else if(u.state==='closed')b=`Remaining ${u.qty} closed`;
  else if(u.state==='again')b='Picking again';
  else{
    const why=esc(u.reason);
    if(u.owner==='Inventory')b=u.inv==='checking'?`${why} · Inventory stock check in progress`:u.inv==='Found'?`${why} · Inventory found ${u.qty} · picking can resume`:`${why} · Inventory: lost ${u.qty}`;
    else b=`${why} · Ops is resolving it`;
  }
  return{a,b};
}
function mdUnfilled(){
  const live=UNF.filter(u=>u.state==='open'),rest=UNF.filter(u=>u.state!=='open');
  const act=u=>u.state==='open'?`<button class="btn" onclick="mdDecide('${u.id}','closed')">Close remaining</button>`:`<span class="pill${u.state==='again'?' ok':''}">${{closed:'Closed short',cancelled:'Demand cancelled',again:'Picking again'}[u.state]}</span>`;
  const row=(u,i)=>{const s=unfStatus(u);return `<tr><td class="n">${i+1}</td><td class="mono">${u.a}</td><td class="strong">${u.s}</td><td><span class="nm">${u.name}</span><span class="sk">${u.sku}</span></td><td style="white-space:normal;min-width:20rem"><span class="nm" style="font-weight:500">${s.a}</span><span class="sk" style="margin-top:2px">${s.b}</span></td><td class="act">${act(u)}</td></tr>`};
  const head='<thead><tr><th class="n">No.</th><th>Allotment</th><th>Store</th><th>SKU</th><th>Target · Sent · To pick</th><th class="act"></th></tr></thead>';
  return `<h3 class="vt">Still needed <span>${live.length}</span></h3>`
    +(live.length?`<div class="tcard"><table>${head}<tbody>${live.map(row).join('')}</tbody></table></div>`:'<div class="none">Nothing is left over.</div>')
    +(rest.length?`<h3 class="vt">Decided</h3><div class="tcard"><table><tbody>${rest.map(row).join('')}</tbody></table></div>`:'');
}
function mdDecide(uid,what){
  const u=UNF.find(x=>x.id===uid);if(!u||what!=='closed')return;
  u.state='closed';const card=C.find(c=>c.id===u.cardId);
  if(card&&card.blk){C.splice(C.indexOf(card),1);if(S.open===card.id){S.open=null;$('side').innerHTML=''}}
  logEv(u.a,`Remaining ${u.qty} closed by ${MDN} · ${u.s}`);
  toast(`Closed · ${u.s} gets ${u.qty} pcs less`);
  paintView();
}
/* an allotment that finished with a closed remainder is Closed short, not Completed */
const _statusOf8=statusOf;
statusOf=function(g){
  const st=_statusOf8(g);
  if(st==='Completed'&&UNF.some(u=>u.a===g[0].a&&u.state==='closed'))return 'Closed short';
  return st;
};
/* the pick sheet's report carries the target and what was picked */
confirmPicked=function(){
  const c=C.find(x=>x.id===PQ.cid);if(!c)return;
  const L=linesOf(c),target=L.reduce((s,l)=>s+l.qty,0),got=L.reduce((s,l,i)=>s+PQ.got[i],0);
  const before=new Set(C.map(x=>x.id)),wasBlk=c.blk,left=target-got;
  _confirmPicked8();
  if(wasBlk&&left<=0){const u0=UNF.find(x=>x.id===wasBlk.uid);if(u0&&u0.state==='open')u0.state='again';c.blk=null}
  C.filter(x=>x.blk&&!before.has(x.id)||x.id===c.id&&x.blk).forEach(b=>{if(b.blk.target==null){b.blk.target=target;b.blk.picked=got}});
  const u=UNF[0];if(u&&u.target==null&&u.a===c.a&&u.s===c.s){u.target=target;u.picked=got}
  paintView();
};
(function(){const u=UNF.find(x=>x.cardId);if(u&&u.target==null){u.target=3;u.picked=0}const c=C.find(x=>x.blk&&x.blk.target==null);if(c){c.blk.target=3;c.blk.picked=0}})();
paintView();
</script>

<script>
/* ═══ Strips: Short pick is amber, Edited is red; Cancelled keeps the big stamp ═══
   (owner, 9 Oct) A strip across the top of the card says what is different
   about it and leaves the card itself alone — Short pick is still pickable, an
   edited card still has its Move back button. Only Cancelled is switched off.
   ──────────────────────────────────────────────────────────────────────── */
S.mark='C';
const isSP=c=>!!c.blk&&c.lane==='pick'&&!c.cancelled;
const isEd=c=>S.cue==='E'&&!c.cancelled&&pend(c)>0;
const spClass=c=>(isSP(c)||isEd(c))?' sp sp-C':'';
function spTop(c){
  if(isSP(c))return `<div class="spstrip" title="${esc(c.blk.reason)}">Short pick</div>`;
  if(isEd(c))return `<div class="spstrip red" title="MD edited this store">Edited −${id(pend(c))}</div>`;
  return '';
}
function spMark(c){return ''}
paintView();
</script>
</body>
