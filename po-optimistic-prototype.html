<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PO Optimistic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens measured on the running hub (:5480, 11 Oct 2026). */
:root{
  --ink:#20242c;--text:#394150;--body:#565f6d;--mute:#666f7d;--faint:#b9c0c9;
  --canvas:#fff;--soft:#f8f8f9;--soft-2:#f0f0f2;--soft-3:#f6f6f7;
  --hairline:#e6e6e9;--hairline-2:#dadade;--hairline-strong:#c6c6cc;--backdrop:#e0e0e4;
  --rail:#242526;--rail-3:#393b3d;--rail-text:#c3c4c7;--rail-mute:#a1a3a8;
  --scrim:rgba(246,246,247,.72);
  --accent:#2563eb;--accent-bg:#eff5ff;--cta:#2563eb;--cta-hover:#1d4ed8;
  --info-bg:#ddebfa;--info-fg:#2c57bf;
  --new-fg:#d6447e;
  --ok-fg:#137a37;--ok-bg:#d9f4d2;--warn-fg:#a64a08;--warn-bg:#faeacd;--bad:#d05151;--bad-fg:#be123c;--bad-bg:#fbeaea;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --shadow-soft:0 1px 3px rgb(24 39 60 / 4%);
  --shadow-pop:0 4px 8px rgb(24 39 60 / 4%),0 12px 32px rgb(24 39 60 / 8%);
  --shadow-shell:0 10px 34px rgb(24 39 60 / 8%);
  --shadow-float:0 8px 24px rgb(24 39 60 / 6%),0 24px 64px rgb(24 39 60 / 12%);
  --rot:-6deg;
  --pbar-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--backdrop);
  -webkit-font-smoothing:antialiased;letter-spacing:-.006em;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{flex-shrink:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;letter-spacing:0}
.num,.fig,.sub,.kpi .v{font-variant-numeric:tabular-nums}
.grow{flex:1}
[hidden]{display:none!important}

/* ---------- prototype bar (not part of the app) ---------- */
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 16px;background:#191b20;color:var(--rail-text);font-size:14px;flex-shrink:0;z-index:5}
.pgrp{display:flex;align-items:center;gap:8px}
.plabel{color:var(--rail-mute)}
.seg{display:inline-flex;background:#303234;border-radius:8px;padding:2px;gap:2px}
.seg button{height:30px;padding:0 10px;border-radius:6px;color:var(--rail-text);font-size:14px;font-weight:500;white-space:nowrap;
  transition:background-color 120ms ease,color 120ms ease,transform 120ms var(--ease-out)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink)}
.seg button:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.seg button:not([aria-pressed=true]):hover{color:#fff}}
.wire{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:30px}
.req{height:30px;display:inline-flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;background:#303234;color:#fff;white-space:nowrap}
.req b{font-weight:500;font-variant-numeric:tabular-nums;color:#8fb6ff}
.req.waiting b{color:#f2c27b}.req.held b{color:var(--rail-mute)}
.req.idle{background:none;color:var(--rail-mute);padding:0}

/* ---------- stage + device ---------- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
.stage.desk{background:#fff;align-items:stretch}
.stage.phone{padding:20px;align-items:center}
.app{position:relative;overflow:hidden;background:#fff;isolation:isolate}
.app.desk{width:100%;min-width:1280px;height:100%;display:grid;grid-template-columns:68px 232px minmax(0,1fr)}
.app.phone{--rot:-12deg;width:414px;height:min(896px,calc(100dvh - var(--pbar-h) - 40px));border-radius:32px;border:1px solid var(--hairline-strong);
  box-shadow:var(--shadow-shell);display:flex;flex-direction:column;background:var(--soft-3)}
@media (max-width:600px){.stage.phone{padding:0;align-items:stretch}.app.phone{width:100%;height:auto;border-radius:0;border:0;box-shadow:none}}

/* ---------- desk shell ---------- */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.logo{width:36px;height:36px;border-radius:10px;background:#fff;color:#191b20;font-weight:700;font-size:20px;display:grid;place-items:center;margin-bottom:10px;position:relative}
.logo i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);right:9px;bottom:10px}
.rail .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--rail-mute)}
.rail .ic.on{background:var(--rail-3);color:#fff}
.dept{border-right:1px solid var(--hairline);display:flex;flex-direction:column;min-width:0}
.dept-head{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--hairline);font-weight:600;font-size:15px;letter-spacing:-.01em}
.dept-nav{padding:8px;display:flex;flex-direction:column;gap:2px}
.dept-nav a{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--body)}
.dept-nav a.on{background:var(--accent-bg);color:var(--accent)}
.dept-nav .cnt{color:var(--bad-fg);font-variant-numeric:tabular-nums}
.main{overflow:auto;padding:24px 32px 40px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.title{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:20px;margin-top:2px}
.sync{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);margin-top:6px;min-height:20px;white-space:nowrap}
.sync button{display:inline-flex;align-items:center;gap:6px;color:inherit}
.sync .sep{color:var(--faint)}
.kpis{display:flex;border:1px solid var(--hairline);border-radius:10px;box-shadow:var(--shadow-soft);overflow:hidden;background:#fff}
.kpi{padding:8px 14px;border-left:1px solid var(--hairline);min-width:84px}
.kpi:first-child{border-left:0}
.kpi .l{font-size:14px;color:var(--body);line-height:20px;white-space:nowrap}
.kpi .v{font-size:18px;font-weight:600;line-height:24px;letter-spacing:-.02em;white-space:nowrap}
.tabs{display:flex;border-bottom:1px solid var(--hairline);margin-top:12px}
.tab{padding:8px 12px 10px;font-size:14px;font-weight:500;color:var(--body);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
  transition:color 120ms ease,border-color 120ms ease}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.tab .c{color:var(--mute);margin-left:4px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;align-items:center;margin:19px 0 12px}
.input{height:34px;border:1px solid var(--hairline-2);border-radius:8px;padding:0 10px;font-size:14px;color:var(--mute);display:inline-flex;align-items:center;gap:8px;background:#fff;white-space:nowrap}
.input.search{width:176px}.input.date{width:136px;justify-content:space-between}

/* ---------- buttons ---------- */
.btn{height:36px;padding:0 16px;border-radius:8px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  transition:transform 120ms var(--ease-out),background-color 120ms ease,opacity 120ms ease}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{cursor:default}
.btn.primary{background:var(--cta);color:#fff}
.btn.outline{background:#fff;border:1px solid var(--hairline-2);color:var(--text)}
.btn.ghost{color:var(--body);font-size:14px;padding:0 9px}
.btn.danger{background:var(--bad-fg);color:#fff}
.btn.danger-t{color:var(--bad-fg)}
.btn.sm{height:28px;padding:0 10px;font-size:14px}
.btn[aria-busy=true]{opacity:.85}
.btn:disabled:not([aria-busy=true]):not(.said){opacity:.5}
@media (hover:hover) and (pointer:fine){
  .btn.primary:hover:not(:disabled){background:var(--cta-hover)}
  .btn.outline:hover:not(:disabled),.btn.ghost:hover:not(:disabled){background:var(--soft)}
}
.btn.rc{height:28px;padding:0 10px;font-size:14px;background:var(--cta);color:#fff;border-radius:6px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin 600ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- table ---------- */
.tcard{border:1px solid var(--hairline);border-radius:10px;box-shadow:var(--shadow-soft);overflow:hidden;background:#fff}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 150px 172px 172px 200px}
.thead{height:40px;background:var(--soft);border-bottom:1px solid var(--hairline-2);font-size:14px;font-weight:500;color:var(--body)}
.thead>div{padding:0 20px;display:flex;align-items:center}
.thead .r,.tfoot .r{justify-content:flex-end}
.r{text-align:right}
.rowwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows 260ms var(--ease-out),opacity 200ms ease}
.rowwrap.in,.rowwrap.out{grid-template-rows:0fr;opacity:0}
.rowwrap.out{transition-duration:220ms,160ms;pointer-events:none}
.row{min-height:0;overflow:hidden}
.trow{border-bottom:1px solid var(--hairline);cursor:pointer;transition:background-color 120ms ease}
.trow>div{padding:20px;min-width:0;display:flex;flex-direction:column;justify-content:center}
@media (hover:hover) and (pointer:fine){.trow:hover{background:#fafafb}}
.trow.alert{background:color-mix(in oklab,var(--bad-bg) 50%,#fff)}
/* A PO made here, not opened yet: on top, washed sky (info = issued, in
   motion; accent stays "selected"), and/or the hub's own New pill. */
.trow.is-new,.card.is-new,.card.is-new .c-foot{background:color-mix(in oklab,var(--info-bg) 45%,#fff)}
.card.is-new{border-color:color-mix(in oklab,var(--info-fg) 22%,var(--hairline))}
.trow.is-new.alert,.card.is-new .c-foot.alert{background:color-mix(in oklab,var(--bad-bg) 50%,#fff)}
.supline{display:flex;align-items:flex-start;gap:8px;min-width:0}
.supline .sup{min-width:0}
.supline .newpill{margin-top:-1px}
.card .supline .newpill{margin-top:0}
/* Apple's "new" mark: the blue dot an app gets on the home screen after it is
   installed or updated, gone once it is opened. Sits on the first line. */
.supline{position:relative}
/* Hangs in the cell's left padding, as Mail's unread dot does, so names stay in line. */
.newdot{position:absolute;left:-14px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.card .newdot{left:-12px;top:7px}
/* The PO number while the server is giving it: a bar where it will stand. */
.numsk{display:inline-block;width:108px;height:14px;border-radius:4px;vertical-align:-2px;
  background:linear-gradient(90deg,rgb(32 36 44 / 7%),rgb(32 36 44 / 14%),rgb(32 36 44 / 7%));background-size:200% 100%;animation:sk 1.2s linear infinite}
.numsk.lg{width:136px;height:18px;vertical-align:-3px}
@media (prefers-reduced-motion:reduce){.numsk{animation:none}}
.newpill{height:22px;padding:0 7px;border:1px solid color-mix(in oklab,var(--new-fg) 30%,transparent);color:var(--new-fg);background:#fff;border-radius:6px;
  font-size:14px;font-weight:500;line-height:20px;display:inline-flex;align-items:center;flex-shrink:0}
.sup{font-size:14px;font-weight:500;color:var(--ink);line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:14px;color:var(--mute);line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig{font-weight:500;color:var(--ink);line-height:24px;white-space:nowrap}
.fig2{line-height:24px;white-space:nowrap}
.bad{color:var(--bad-fg)}.mute{color:var(--mute)}
.overdue{color:var(--bad-fg);font-weight:500}
.tfoot{min-height:57px;background:var(--soft);border-top:1px solid var(--hairline-2)}
.tfoot>div{padding:8px 20px;display:flex;flex-direction:column;justify-content:center;font-size:14px;color:var(--body)}
.tfoot .r{align-items:flex-end}
.tfoot .fig{font-size:15px}
.word{font-size:15px;line-height:20px}
.t-ok{color:var(--ok-fg)}.t-info{color:var(--info-fg)}.t-warn{color:var(--warn-fg)}.t-bad{color:var(--bad-fg)}.t-done{color:var(--ink)}.t-neutral{color:var(--mute)}
.stc{align-items:flex-start}
.stc [data-c=ss]:empty{display:none}
.stc [data-c=ss]{margin-top:6px}
.stamp-on [data-c=ss]{margin-top:12px}

/* sync words: where a change stands on its way to the server */
.syncword{display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:20px;white-space:nowrap}
.syncword .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.s-live{color:var(--mute)}
.s-live .dot{background:var(--accent)}
.s-off{color:var(--warn-fg)}
.s-bad{color:var(--bad-fg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.word.syncword{font-size:15px}

/* the rubber stamp of a finished order */
.stamp{display:inline-block;transform:rotate(var(--rot));border:3px double currentColor;border-radius:6px;padding:2px 10px;font-size:14px;line-height:20px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85;mix-blend-mode:multiply;white-space:nowrap;text-align:center}
.stamp small{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.stamp.land{animation:stamp-land 220ms var(--ease-out) both}
@keyframes stamp-land{from{transform:rotate(var(--rot)) scale(1.45);opacity:0}to{transform:rotate(var(--rot)) scale(1);opacity:.85}}
.st-ok{color:var(--ok-fg)}.st-bad{color:var(--bad-fg)}.st-mute{color:var(--mute)}

@keyframes row-fresh{0%,55%{background-color:var(--accent-bg);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 28%,transparent)}100%{background-color:transparent;box-shadow:inset 0 0 0 1px transparent}}
@keyframes row-undo{0%,40%{background-color:var(--bad-bg);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--bad) 30%,transparent)}100%{background-color:transparent;box-shadow:inset 0 0 0 1px transparent}}
@keyframes card-fresh{0%,55%{background-color:var(--accent-bg);box-shadow:0 0 0 1px color-mix(in oklab,var(--accent) 28%,transparent)}100%{background-color:#fff;box-shadow:var(--shadow-soft)}}
@keyframes card-undo{0%,40%{background-color:var(--bad-bg);box-shadow:0 0 0 1px color-mix(in oklab,var(--bad) 30%,transparent)}100%{background-color:#fff;box-shadow:var(--shadow-soft)}}
.trow.row-fresh{animation:row-fresh 3.2s var(--ease-out) both}
.trow.row-undo{animation:row-undo 2.4s var(--ease-out) both}
.card.row-fresh{animation:card-fresh 3.2s var(--ease-out)}
.card.row-undo{animation:card-undo 2.4s var(--ease-out)}

/* ---------- phone shell ---------- */
.ptop{height:52px;background:#fff;border-bottom:1px solid var(--hairline);display:flex;align-items:center;padding:0 16px;gap:6px;font-size:15px;font-weight:600;flex-shrink:0;white-space:nowrap}
.ptop .crumb{color:var(--mute);font-weight:500}
.ptop .sep{color:var(--faint)}
.pscroll{flex:1;overflow:auto;padding:12px 16px 104px;overscroll-behavior:contain}
.pscroll .sync{margin:0 0 12px}
.app.phone .kpis{display:grid;grid-template-columns:1fr 1fr}
.app.phone .kpi{min-width:0}
.app.phone .kpi:nth-child(odd){border-left:0}
.app.phone .kpi:nth-child(n+3){border-top:1px solid var(--hairline)}
.app.phone .tabs{margin:12px 0 12px}
.app.phone .tab{flex:1;padding:8px 6px 10px}
.card{background:#fff;border:1px solid var(--hairline);border-radius:10px;box-shadow:var(--shadow-soft);overflow:hidden;cursor:pointer}
.cards .row{padding-bottom:12px}
.c-head{display:flex;gap:12px;padding:16px 16px 14px;justify-content:space-between}
.c-left{min-width:0}
.card .sup{font-size:16px;line-height:22px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.c-lead{text-align:right;flex-shrink:0}
.c-lead .big{font-size:18px;font-weight:600;line-height:24px;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--hairline);min-height:52px;transition:background-color 200ms ease}
.c-foot.alert{background:color-mix(in oklab,var(--bad-bg) 50%,#fff)}
.c-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.c-right [data-c=ss]:empty{display:none}
.pill{height:28px;padding:0 10px;border:1px solid color-mix(in oklab,currentColor 30%,transparent);border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;background:#fff;white-space:nowrap}
.pill.syncword{font-size:15px}
.dock{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--hairline);display:flex;align-items:center;gap:12px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:20}
.dsearch{flex:1;height:44px;border:1px solid var(--hairline-2);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mute);font-size:15px}
.fab{width:48px;height:48px;border-radius:50%;background:var(--cta);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgb(37 99 235 / 28%);
  transition:transform 120ms var(--ease-out)}
.fab:active{transform:scale(.95)}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 200ms ease;z-index:30}
.scrim.on{opacity:1}
.sheet{position:absolute;top:20px;right:20px;bottom:20px;width:min(928px,calc(100% - 40px));background:#fff;border:1px solid var(--hairline);border-radius:16px;
  box-shadow:var(--shadow-float);display:flex;flex-direction:column;z-index:31;transform:translateX(calc(100% + 28px));
  transition:transform 200ms var(--ease-out)}
.sheet.on{transform:none;transition:transform 280ms var(--ease-drawer)}
.sheet.form{width:min(1248px,calc(100% - 40px));z-index:32}
.app.phone .sheet{top:16px;left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0;border-bottom:0;transform:translateY(100%);transition:transform 200ms var(--ease-out)}
.app.phone .sheet.on{transform:none;transition:transform 450ms var(--ease-drawer)}
.instant,.instant *{transition:none!important}
.sh-head{display:flex;align-items:center;gap:16px;padding:12px 28px;border-bottom:1px solid var(--hairline);min-height:77px;flex-shrink:0}
.sh-tl{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.sh-title{font-size:18px;font-weight:600;line-height:24px;letter-spacing:-.01em}
.sh-sub{font-size:15px;color:var(--mute);margin-top:2px}
.sh-head .stamp{margin-left:6px}
.app.phone .sh-head .stamp{margin:6px 0 12px 4px}
.xbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--body);transition:transform 120ms var(--ease-out)}
.xbtn:active{transform:scale(.95)}
.sh-body{flex:1;overflow:auto;padding:24px 28px 28px;display:flex;flex-direction:column;gap:20px}
.sh-foot{border-top:1px solid var(--hairline);padding:17px 28px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.sh-foot:empty{display:none}
.app.phone .sh-head{padding:16px;min-height:0;align-items:flex-start}
.app.phone .sh-tl{flex-direction:column;align-items:flex-start;gap:6px}
.app.phone .sh-body{padding:16px 16px 24px}
.app.phone .sh-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.app.phone .sh-foot .btn{height:44px;flex:1;font-size:15px}
.app.phone .sh-foot .grow{display:none}
.app.phone .sh-foot .syncword{flex:1;justify-content:center;height:44px}
.banner{display:flex;gap:10px;border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.6}
.banner.bad{background:var(--bad-bg);color:var(--bad-fg)}.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.facts dt{font-size:14px;line-height:18px;color:var(--body)}
.facts dd{font-size:14px;line-height:22px;color:var(--ink);margin-top:4px}
.seclabel{font-size:14px;color:var(--mute);margin-bottom:10px}
.itable{border:1px solid var(--hairline);border-radius:10px;overflow:hidden}
.ig{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 150px 170px}
.ig>div{padding:14px 16px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ig .r{align-items:flex-end}
.ihead{background:var(--soft);font-size:14px;font-weight:500;color:var(--body)}
.ihead>div{padding:10px 16px}

<script>
/* =====================================================================

   ===================================================================== */

const clone = o => JSON.parse(JSON.stringify(o));
const items = n => `${n} ${n === 1 ? 'item' : 'items'}`;

const I = (p, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {

};

/* ---------- the book ---------- */

const ORDER = o => Object.assign({ id: 'o' + (++seq), local: false, sync: null, by: 'Rina Kusuma', terms: '30 days', method: 'Giro', review: false, excess: 0, finishedAt: null }, o);
const SUPPLIERS = ['Garmen AA, UD', 'Indorama, PT', 'Sinar Jaya Textile, CV', 'Busana Prima, PT'];

let orders = [
  ORDER({ po: 'PO-041026-012', supplier: 'Indorama, PT', issued: '2026-10-04', delivery: '2026-10-14', lifecycle: 'ACTIVE', review: true, excess: 30, lines: [L('kaos', 200, 39000, 200)] }),

  ORDER({ po: 'PO-031026-004', supplier: 'Sinar Jaya Textile, CV', issued: '2026-10-03', delivery: '2026-10-12', lifecycle: 'PARTIALLY_RECEIVED', terms: '45 days', method: 'Transfer', lines: [L('dress', 200, 120000, 200), L('rok', 180, 65000, 100), L('hoodie', 100, 140000)] }),

  ORDER({ po: 'PO-290926-003', supplier: 'Busana Prima, PT', issued: '2026-09-29', delivery: '2026-10-06', lifecycle: 'FULLY_RECEIVED', finishedAt: '2026-10-06', lines: [L('jaket', 120, 185000, 120)] }),
  ORDER({ po: 'PO-280926-001', supplier: 'Garmen AA, UD', issued: '2026-09-28', delivery: '2026-10-04', lifecycle: 'SHORT_RECEIVED', finishedAt: '2026-10-05', lines: [L('kaos', 300, 36000, 260)] }),
  ORDER({ po: 'PO-250926-002', supplier: 'Indorama, PT', issued: '2026-09-25', delivery: '2026-10-02', lifecycle: 'FULLY_RECEIVED', finishedAt: '2026-10-02', lines: [L('kemeja', 500, 52000, 500), L('chino', 250, 90000, 250)] }),
  ORDER({ po: 'PO-300926-002', supplier: 'Sinar Jaya Textile, CV', issued: '2026-09-30', delivery: '2026-10-08', lifecycle: 'CANCELLED', finishedAt: '2026-10-01', lines: [L('dress', 80, 118000)] }),
];

const PRESETS = [
  { supplier: 'Garmen AA, UD', delivery: '2026-10-18', terms: '30 days', method: 'Giro', lines: [['kaos', 120, 35000], ['chino', 60, 95000]] },
  { supplier: 'Busana Prima, PT', delivery: '2026-10-21', terms: '45 days', method: 'Transfer', lines: [['jaket', 80, 185000]] },

];
let presetAt = 0;

const STATUS = {
  ACTIVE: ['Active', 'ok'], PARTIALLY_RECEIVED: ['Partially received', 'info'],
  SHORT_RECEIVED: ['Closed short', 'done'], FULLY_RECEIVED: ['Fully received', 'done'], CANCELLED: ['Cancelled', 'neutral'],
};
const FINISHED = new Set(['SHORT_RECEIVED', 'FULLY_RECEIVED', 'CANCELLED']);
const STAMP_TONE = { FULLY_RECEIVED: 'st-ok', SHORT_RECEIVED: 'st-bad', CANCELLED: 'st-mute' };
const REFUSE = {

};

const FLAKY_MSG = 'Could not reach the server. Try again.';

const qtyOf = o => o.lines.reduce((s, l) => s + l.qty, 0);
const valOf = o => o.lines.reduce((s, l) => s + l.qty * l.price, 0);
const recOf = o => o.lines.reduce((s, l) => s + Math.min(l.rec, l.qty), 0);
const recValOf = o => o.lines.reduce((s, l) => s + Math.min(l.rec, l.qty) * l.price, 0);
const isOpen = o => o.local ? o.sync?.state !== 'refused' : (o.lifecycle === 'ACTIVE' || o.lifecycle === 'PARTIALLY_RECEIVED');
const owedVal = o => o.lines.reduce((s, l) => s + Math.max(0, l.qty - l.rec) * l.price, 0);
const byId = id => orders.find(o => o.id === id);
const lifeTab = l => (l === 'ACTIVE' || l === 'PARTIALLY_RECEIVED') ? 'active' : l === 'CANCELLED' ? 'cancelled' : 'completed';
const tabOf = o => o.stay || (o.local ? 'active' : lifeTab(o.lifecycle));
let poSeq = 0;
const nextPo = () => `PO-111026-${String(++poSeq).padStart(3, '0')}`;

/* ---------- state ---------- */
const S = {
  mode: 'optimistic', net: 'fast', server: 'ok', cancelStyle: 'undo', device: 'desk', cue: 'dot', updPos: 'place',
  tab: 'active', sheet: null, form: null, dlg: null, cache: new Set(), updatedAt: clock(), flip: false,
};
const forcedPhone = matchMedia('(max-width: 600px)').matches;
if (forcedPhone) S.device = 'phone';
const isPhone = () => S.device === 'phone';
const rot = () => isPhone() ? -12 : -6;
const app = document.getElementById('app');
const K = k => app.querySelector(`[data-k="${k}"]`);
const rows = new Map();

/* ---------- small motion helpers ---------- */
function fadeIn(el) {
  if (REDUCED()) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160 }); return; }
  el.animate([{ opacity: 0, filter: 'blur(2px)' }, { opacity: 1, filter: 'blur(0px)' }], { duration: 220, easing: EASE_OUT });
}
/// Put new HTML into a slot; when it differs and `animate`, cross-fade it in.
/// A stamp that arrives lands; a stamp that goes is lifted off first.
/// Optimistic saves do not move: the screen is already right.
const still = () => S.mode === 'optimistic';
function patch(el, html, animate) {
  if (!el || el._html === html) return;
  if (still() && !el.matches('button')) animate = false;
  const old = el._html; el._html = html;
  const had = old != null && old.includes('class="stamp'), has = html.includes('class="stamp');
  const put = () => {
    if (el._html !== html) return;
    el.innerHTML = html;
    if (!animate || old == null) return;
    if (has && !had) el.querySelector('.stamp')?.classList.add('land');
    else if (html.trim()) fadeIn(el);
  };
  if (animate && had && !has && !REDUCED()) {
    const st = el.querySelector('.stamp');
    if (st) {
      st.animate([{ opacity: .85, transform: `rotate(${rot()}deg) scale(1)` }, { opacity: 0, transform: `rotate(${rot()}deg) scale(1.18)` }],
        { duration: 180, easing: EASE_OUT, fill: 'forwards' }).finished.then(put, put);
      return;
    }
  }
  put();
}
function flash(id, cls) {
  const el = app.querySelector(`[data-row-id="${id}"]`); if (!el) return;
  el.classList.remove('row-fresh', 'row-undo'); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 3300);
}
function scroller() { return isPhone() ? K('scroll') : app.querySelector('.main'); }

/// The PO screen's pull-in (lib/pull-in.ts): a pill from the pressed button
/// into the row the save changed, which glows as it lands.
async function flyPill(from, rowId, words) {
  if (REDUCED() || !from) { flash(rowId, 'row-fresh'); return; }
  const fx = from.left, fy = from.top + (from.height - 28) / 2;
  const pill = document.createElement('div');
  pill.className = 'flypill'; pill.textContent = words; pill.style.transform = `translate(${fx}px,${fy}px)`;
  document.body.appendChild(pill);
  await wait(220);
  const row = app.querySelector(`[data-row-id="${rowId}"]`);
  if (!row) { pill.remove(); return; }
  let box = row.getBoundingClientRect();
  const sc = scroller().getBoundingClientRect();

/* ---------- toasts (Sonner-like, bottom right; held while pointed at) ---------- */

  const same = id && [...box.children].find(x => x._id === id && !x._gone);
  if (same) { same._update({ title, desc, action }); return same._handle; }
  const t = document.createElement('div');
  t._id = id;

  t.innerHTML = `${type === 'error' ? ICON.alert : ICON.ok}<div class="tx"><div class="tt"></div>${desc ? '<div class="td"></div>' : ''}</div>${action ? '<button class="tact"></button>' : ''}`;
  t.querySelector('.tt').textContent = title;
  if (desc) t.querySelector('.td').textContent = desc;
  box.appendChild(t);

  if (live.length > 4) live[0]._dismiss(true);

  const pause = () => { clearTimeout(timer); left -= performance.now() - start; };

    const b = t.querySelector('.tact');
    if (b && next.action) { b.textContent = next.action.label; b.onclick = () => { dismiss(false); next.action.onClick(); }; }
    clearTimeout(timer); left = duration; run();

/* ---------- the wire (prototype bar): what is travelling right now ---------- */

    const s = ((performance.now() - w.t0) / 1000).toFixed(1);

/* ---------- network ---------- */
const latency = () => ({ fast: 450, slow: 3000, flaky: 1400, offline: 0 })[S.net];
let onlineWaiters = [];
function whenOnline(fn) { if (S.net !== 'offline') fn(); else onlineWaiters.push(fn); }

/// Today's request: the button waits on this. A cancel/close-short is held by
/// TanStack while offline (networkMode "online"), so it spins until the
/// connection is back; an edit fails at once.
function call(label, refusal, { pausable = false } = {}) {
  return new Promise((resolve, reject) => {
    let wid = 0;
    const run = () => {
      if (wid) wireSet(wid, 'flight'); else wid = wireAdd(label);
      setTimeout(() => {
        if (S.net === 'offline') { if (pausable) { wireSet(wid, 'waiting'); whenOnline(run); return; } wireDone(wid); return reject(new Error(OFFLINE_MSG)); }
        wireDone(wid);
        if (S.net === 'flaky' && (S.flip = !S.flip)) return reject(new Error(FLAKY_MSG));
        if (S.server === 'refuse') return reject(new Error(refusal));
        S.updatedAt = clock();
        resolve();
      }, latency());
    };
    if (S.net === 'offline') {
      if (!pausable) return reject(new Error(OFFLINE_MSG));

    } else run();

}

/* ---------- the outbox: every optimistic write, and every offline order ---------- */

function closeForm(instant) { if (!S.form) return; S.form = null; hide(K('fsheet'), instant); scrimTo(instant); }
function formError(msg) { patch(K('fsheet').querySelector('[data-p="error"]'), msg ? `<div class="banner bad">${esc(msg)}</div>` : '', true); }

  const f = S.form;

function setBtn(btn, state, label) {

async function submit(btn) {

}
function newOrder(d) {
  return ORDER({ po: null, local: true, supplier: d.supplier, issued: TODAY, delivery: d.delivery, terms: d.terms, method: d.method, lifecycle: 'ACTIVE', lines: d.lines, madeAt: clock(), draft: d });
}
function insertOrder(o) {
  const at = orders.findIndex(x => !x.review);
  orders.splice(at < 0 ? 0 : at, 0, o);
}
function toActiveTab() { if (S.tab !== 'active') { S.tab = 'active'; syncList(false); } }

/* -- optimistic: the screen changes now; the outbox tells the server -- */
function createNow(d, btn) {
  const resume = S.form.resume ? byId(S.form.orderId) : null;
  let o;
  if (resume) { dropJobs(resume.id); Object.assign(resume, newOrder(d), { id: resume.id }); o = resume; orders = orders.filter(x => x !== o); }
  else o = newOrder(d);
  // Newest first, above everything, whatever the list was showing.
  orders.unshift(o);
  o.cue = 'new';
  o.sync = { kind: 'create', state: 'sending' };
  closeForm(true);
  toActiveTab();
  syncList(false); renderHead(false);
  scroller().scrollTop = 0;
  enqueue({ kind: 'create', orderId: o.id });
}
function editNow(id, d, btn) {
  const o = byId(id);
  const before = { lines: clone(o.lines), delivery: o.delivery, terms: o.terms, method: o.method };
  Object.assign(o, { lines: d.lines, delivery: d.delivery, terms: d.terms, method: d.method });
  o.sync = { kind: 'edit', state: 'sending' };
  if (o.cue !== 'new') o.cue = 'updated';
  if (S.updPos === 'top') { orders = orders.filter(x => x !== o); orders.unshift(o); }
  closeForm(true);
  refresh(o, false);
  if (S.updPos === 'top') scroller().scrollTop = 0;
  enqueue({ kind: 'edit', orderId: o.id, before, after: d });
}
function finishNow(kind, id, reason) {
  const o = byId(id);
  const before = { lifecycle: o.lifecycle, finishedAt: o.finishedAt, lines: clone(o.lines) };
  o.lifecycle = kind === 'cancel' ? 'CANCELLED' : 'SHORT_RECEIVED';
  o.finishedAt = TODAY; o.stay = 'active';
  return before;
}
function cancelNow(kind, id, reason) {
  const o = byId(id);
  const before = finishNow(kind, id, reason);
  if (kind === 'cancel' && S.cancelStyle === 'undo') {
    // Nothing is sent while the toast can still take it back.
    o.sync = { kind, state: 'held' };
    const job = { kind, orderId: id, before, state: 'held' };
    enqueue(job);
    job.wid = wireAdd(`Cancel ${o.po}`, 'held');
    refresh(o);
    const t = toast({ title: `${o.po} cancelled`, duration: 10000, onClose: () => heldToasts.delete(t), action: { label: 'Undo', onClick: () => {
      if (job.state !== 'held') return;

  enqueue({ kind, orderId: id, before });
}

/* -- today: the button waits, says it, then the sheet closes -- */
async function createToday(d, btn) {
  const resume = S.form.resume ? byId(S.form.orderId) : null;
  if (S.net === 'offline') {
    // Today's offline order: kept on the device, sent by the outbox later.
    let o;
    if (resume) { dropJobs(resume.id); Object.assign(resume, newOrder(d), { id: resume.id }); o = resume; }
    else { o = newOrder(d); insertOrder(o); }
    o.sync = { kind: 'create', state: 'offline' };
    closeForm(); toActiveTab(); syncList(true); renderHead(true);
    toast({ title: 'Saved on this device. It will be sent when you are back online.' });
    enqueue({ kind: 'create', orderId: o.id });
    return;
  }
  setBtn(btn, 'pending', 'Submitting…');
  try { await call('Create order', REFUSE.create({ supplier: d.supplier })); }
  catch (e) { setBtn(btn, 'idle', 'Submit'); return formError(e.message.startsWith('Could') ? e.message : `The order was not accepted: ${e.message}`); }
  setBtn(btn, 'said', 'Created');
  await wait(650);
  const from = btn.getBoundingClientRect();
  const o = newOrder(d); o.local = false; o.po = nextPo(); o.draft = null;
  if (resume) { dropJobs(resume.id); orders = orders.filter(x => x !== resume); }
  closeForm(); insertOrder(o); toActiveTab(); syncList(false); renderHead(true);
  await flyPill(from, o.id, o.po);
  toast({ title: `${o.po} created`, desc: `${o.supplier} · ${rp(valOf(o))}`, action: { label: 'View', onClick: () => openOrder(o.id) } });
}

  const o = byId(id);
  setBtn(btn, 'pending', 'Updating…');
  try { await call(`Update ${o.po}`, cap(REFUSE.edit(o)), { pausable: false }); }
  catch (e) { setBtn(btn, 'idle', 'Update'); return formError(e.message); }
  setBtn(btn, 'said', 'Updated');
  await wait(650);
  const from = btn.getBoundingClientRect();
  Object.assign(o, { lines: d.lines, delivery: d.delivery, terms: d.terms, method: d.method });
  closeForm(); refresh(o, false);
  await flyPill(from, o.id, o.po);

/* ---------- confirm dialog ---------- */

    short: { title: 'Close This Short?', desc: `${pcs(owed)} will be removed from the order, and the PO completes as received. This can't be undone.`, go: 'Close Short', reason: 'Reason for Closing' },

function closeDialog(instant) { if (!S.dlg) return; S.dlg = null; hide(K('dlg'), instant); hide(K('dscrim'), instant); }
async function confirmDialog(btn) {
  const { kind, id } = S.dlg;
  const o = byId(id);
  const reason = K('dlg').querySelector('[data-reason]')?.value ?? '';
  if (kind === 'delete') {
    dropJobs(id);
    orders = orders.filter(x => x.id !== id);
    closeDialog(); closeSheet(); syncList(true); renderHead(true);
    return;
  }
  if (S.mode === 'optimistic') { closeDialog(true); cancelNow(kind, id, reason); return; }
  // Today: the dialog holds until the server answers; offline it waits for the connection.

  K('dlg').querySelector('[data-act="dlg-keep"]').disabled = true;
  try { await call(label, cap(REFUSE[kind](o)), { pausable: true }); }
  catch (e) {

    patch(K('dlg').querySelector('[data-p="err"]'), esc(e.message), true); return;

/// A held cancel is not left to a page that may be put away: when the tab is
/// hidden (phone locked, app switched) it goes at once, and the outbox picks
/// up again the moment the page is back.
const heldToasts = new Set();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) [...heldToasts].forEach(t => t.dismiss(true));
  else pump();
});

/* ---------- actions ---------- */

}

}
app.addEventListener('click', e => {

    if (act === 'new') openForm({ mode: 'new' });
    else if (act === 'close' || act === 'scrim') closeTop();
    else if (act === 'submit') submit(a);
    else if (act === 'addline') { const k = Object.keys(ITEMS)[Math.floor(Math.random() * 7)]; S.form.lines.push(L(k, 50, [35000, 65000, 95000, 120000][seq % 4])); renderLines(); }
    else if (act === 'rmline') { S.form.lines = S.form.lines.filter(l => l.key !== a.dataset.key); renderLines(); }
    else if (act === 'edit') editPressed();
    else if (act === 'cancel') cancelPressed();
    else if (act === 'short') openConfirm('short');
    else if (act === 'delete') openConfirm('delete');

    else if (act === 'dlg-go') confirmDialog(a);
    else if (act === 'open') openOrder(a.closest('[data-row-id]').dataset.rowId);
    else if (act === 'tab') { S.tab = a.dataset.tab; renderHead(false); syncList(false); }
    else if (act === 'sync') { const o = orders.find(x => x.sync?.state === 'refused'); if (o) { if (tabOf(o) !== S.tab) { S.tab = tabOf(o); renderHead(false); syncList(false); } openOrder(o.id); } }

app.addEventListener('input', e => {

  if (q) { const l = S.form.lines.find(x => x.key === q); l.qty = e.target.value.replace(/\D/g, ''); e.target.value = l.qty; updateTotals(); return; }

// Keyboard acts at once: no animation on N or Esc.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeTop(true); return; }
  if (e.target.closest('input,select,textarea')) return;
  if ((e.key === 'n' || e.key === 'N') && !S.form && !S.dlg && !e.metaKey && !e.ctrlKey) { e.preventDefault(); openForm({ mode: 'new' }, true); }
});

/* ---------- shell ---------- */
function build() {
  rows.clear(); S.sheet = null; S.form = null; S.dlg = null;
  app.className = 'app ' + S.device;
  document.getElementById('stage').className = 'stage ' + S.device;
  const layers = `<div class="scrim" data-k="scrim" data-act="scrim" hidden></div><section class="sheet" data-k="osheet" role="dialog" hidden></section>
    <section class="sheet form" data-k="fsheet" role="dialog" hidden></section><div class="dscrim" data-k="dscrim" data-act="dlg-keep" hidden></div>
    <div class="dlg" data-k="dlg" role="alertdialog" hidden></div><div class="toasts" data-k="toasts"></div>`;
  app.innerHTML = isPhone() ? `
    <header class="ptop"><span class="crumb">Procurement</span><span class="sep">/</span><span>Purchase Orders</span>${ICON.chev}</header>
    <div class="pscroll" data-k="scroll"><div class="sync" data-k="sync"></div><div class="kpis" data-k="kpis"></div><div class="tabs" data-k="tabs" role="tablist"></div><div class="cards" data-k="list"></div></div>
    <div class="dock"><span class="dsearch">${ICON.search}Search orders</span><button class="fab" data-act="new" aria-label="New order">${ICON.plus}</button></div>${layers}` : `
    <nav class="rail"><div class="logo">C<i></i></div><span class="ic on">${ICON.cart}</span><span class="ic">${ICON.shirt(18)}</span><span class="ic">${ICON.box}</span><span class="ic">${ICON.store}</span><span class="ic">${ICON.bank}</span><span class="ic">${ICON.users}</span></nav>
    <nav class="dept"><div class="dept-head">Procurement</div><div class="dept-nav"><a class="on">Purchase Orders<span class="cnt">2</span></a><a>Suppliers</a><a>Sourcing</a><a>Return PO<span class="cnt">2</span></a></div></nav>
    <main class="main">
      <div class="head"><div><div class="title">Purchase Orders</div><div class="sync" data-k="sync"></div></div><div class="kpis" data-k="kpis"></div></div>
      <div class="tabs" data-k="tabs" role="tablist"></div>
      <div class="toolbar"><span class="input search">${ICON.search}Search orders</span><span class="input date">Issued ${ICON.cal}</span><span class="input date">Delivery date ${ICON.cal}</span><span class="grow"></span>
        <button class="btn ghost">${ICON.cols} Columns</button><button class="btn primary" data-act="new">New order</button></div>
      <div class="tcard"><div class="tgrid thead"><div>PO</div><div>Delivery Date</div><div class="r">Ordered</div><div class="r">Received</div><div>Status</div></div>
        <div data-k="list"></div><div class="tgrid tfoot" data-k="tfoot"></div></div>
    </main>${layers}`;
  renderHead(false); syncList(false);
}

/* ---------- prototype bar ---------- */
function paintBar() {
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', S[seg.dataset.set] === b.dataset.val)));
  document.getElementById('cancelGrp').style.opacity = S.mode === 'optimistic' ? 1 : .45;
  document.getElementById('cueGrp').style.opacity = S.mode === 'optimistic' ? 1 : .45;
  document.getElementById('updGrp').style.opacity = S.mode === 'optimistic' ? 1 : .45;
  document.getElementById('deviceGrp').hidden = forcedPhone;
  document.documentElement.style.setProperty('--pbar-h', document.getElementById('pbar').offsetHeight + 'px');
}
document.getElementById('pbar').addEventListener('click', e => {
  const b = e.target.closest('.seg button'); if (!b) return;
  const key = b.closest('.seg').dataset.set, val = b.dataset.val;
  if (S[key] === val) return;
  const was = S[key]; S[key] = val; paintBar();
  if (key === 'device') build();
  if (key === 'mode') { renderHead(false); syncList(false); if (S.sheet) renderSheet(false); }
  if (key === 'cue') syncList(false);
  if (key === 'net') { if (was === 'offline') wentOnline(); pump(); }
});
addEventListener('resize', paintBar);
paintBar(); renderWire(); build();
</script>
</body>
</html>
