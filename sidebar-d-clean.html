<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central · Clean sidebar</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242628;background:#fdfdfb;font-size:13px;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{color:inherit;border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #647d98;outline-offset:3px}button, input{-webkit-tap-highlight-color:transparent}svg{width:17px;height:17px;stroke-width:1.65;flex-shrink:0}button{transition:background .14s,color .14s}button:hover{background:#eeefea} .app{display:flex;height:100dvh;min-height:460px}.sidebar{width:232px;flex-shrink:0;background:#f5f5f1;border-right:1px solid #e6e7e0;display:flex;flex-direction:column;padding:0 12px}.brand{height:76px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:16px;font-weight:650;letter-spacing:-.5px}.mark{width:27px;height:27px;background:#292d2e;border-radius:8px;color:white;display:grid;place-items:center;font-size:17px;font-weight:650}.search{display:flex;align-items:center;gap:9px;border:1px solid #e4e6e6;background:white;border-radius:7px;height:34px;padding:0 10px;color:#71777a;margin:0 4px 25px;text-align:left}.search svg{width:15px}.search kbd{margin-left:auto;font:10px inherit;color:#93999c}nav{overflow:auto;flex:1;min-height:0;scrollbar-width:thin}.section-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#929799;padding:20px 12px 9px;font-weight:600}.nav-row{width:100%;height:37px;display:flex;align-items:center;gap:11px;padding:0 12px;margin-bottom:3px;border-radius:6px;text-align:left;color:#62686b;position:relative}.nav-row svg{color:#81888b}.nav-row.active{color:#344e43;background:#e8eeea;font-weight:600}.nav-row.active svg{color:#4e695a}.nav-row.expanded{background:#eeefea;color:#303638}.nav-row .count{font-size:10px;margin-left:auto;background:#edeeee;border-radius:4px;min-width:21px;height:19px;display:grid;place-items:center;color:#7b8285}.nav-row .chevron{margin-left:auto;width:13px;opacity:0}.nav-row:hover .chevron,.nav-row.expanded .chevron,.nav-row:focus-visible .chevron{opacity:1}.footer{padding:12px 0 0}.footer .nav-row{font-size:12px}.profile{border-top:1px solid #e6e8e8;margin-top:10px;display:flex;align-items:center;gap:10px;width:100%;height:70px;padding:0 12px;text-align:left}.avatar{width:29px;height:29px;border-radius:50%;background:#e5e9e7;color:#5d7169;display:grid;place-items:center;font-size:12px}.profile strong{display:block;font-size:12px;font-weight:550}.profile small{display:block;font-size:10px;color:#919699;margin-top:3px}.profile svg{margin-left:auto;color:#9ca1a3;width:14px}.main{flex:1;min-width:0;overflow:auto}.breadcrumb{height:60px;display:flex;align-items:center;gap:10px;padding:0 40px;color:#969b9e;font-size:11px;border-bottom:1px solid #f0f1f1}.breadcrumb svg{width:12px}.breadcrumb span:last-child{color:#656d71}.page{padding:35px 40px;max-width:1400px;margin:auto}.eyebrow{font-size:11px;color:#92999d;margin-bottom:10px}h1{font-size:26px;letter-spacing:-.8px;font-weight:550;margin:0 0 10px}.subtitle{font-size:12px;color:#8b9296;margin:0}.tabs{display:flex;align-items:center;gap:23px;border-bottom:1px solid #e9ebec;margin-top:28px;overflow:auto}.tab{height:42px;white-space:nowrap;padding:0;font-size:12px;color:#8b9296;border-bottom:2px solid transparent;border-radius:0}.tab:hover{background:none;color:#343a3d}.tab.selected{color:#405b4c;border-bottom-color:#60786a;font-weight:550}.tab.more{display:flex;align-items:center;gap:5px}.tab.more svg{width:12px}.content{margin-top:28px}.content-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.content-head h2{font-size:13px;font-weight:550;margin:0}.demo-tag{font-size:10px;color:#959c9f;border:1px solid #e9ebec;padding:4px 7px;border-radius:4px}.empty-state{background:#fff;min-height:270px;border:1px solid #e9ebec;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#a3aaae}.empty-state svg{width:24px;height:24px;margin-bottom:16px;color:#a4aeae;stroke-width:1.2}.empty-state strong{font-size:12px;font-weight:500;color:#737c80}.empty-state p{font-size:11px;line-height:1.7;margin:7px 20px}.flyout{position:fixed;left:240px;top:100px;z-index:10;width:max-content;max-width:calc(100vw - 256px);padding:9px;background:#fff;border:1px solid #e5e8e8;border-radius:10px;box-shadow:0 8px 32px #22303012,0 2px 5px #22303004;max-height:calc(100dvh - 24px);overflow:auto}.flyout[hidden]{display:none}.fly-title{font-size:12px;font-weight:600;padding:9px 10px 14px;border-bottom:1px solid #f0f1f1;margin-bottom:8px;display:flex;justify-content:space-between;gap:25px}.fly-title span{font-size:10px;font-weight:400;color:#a1a7a9}.groups{display:flex;gap:10px}.group{min-width:190px}.group-label{padding:9px 10px 6px;color:#92999c;font-size:10px}.sub{display:flex;align-items:center;gap:10px;width:100%;height:34px;text-align:left;padding:0 10px;color:#646d71;font-size:12px;border-radius:5px}.sub svg{width:15px;color:#8f989c}.sub.selected{background:#f0f2f2;color:#30383b}.sub.selected svg{color:#3a484c}dialog{border:1px solid #e4e7e7;border-radius:12px;padding:14px;width:450px;max-width:90vw;box-shadow:0 20px 80px #17252520}dialog::backdrop{background:#202d3033}dialog input{width:100%;padding:12px;border:0;border-bottom:1px solid #eee;margin-bottom:10px}#results{max-height:340px;overflow:auto}.result{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px;border-radius:6px;text-align:left}.result small{color:#91999d;font-size:10px}.no-result{padding:16px;color:#899296}.close-search{font-size:10px;color:#92999d;padding:10px;width:100%;text-align:right}@media(min-width:1450px){.page{padding-top:44px}}@media(max-width:1050px){.tabs{gap:18px}.page{padding:28px}.breadcrumb{padding:0 28px}.groups{flex-wrap:wrap;max-width:420px}}@media(max-width:760px){.sidebar{width:64px;padding:0 7px}.brand{justify-content:center;padding:0}.brand-name,.search span,.search kbd,.section-label,.nav-row>span,.profile .identity,.profile>svg{display:none}.search{padding:0;justify-content:center;margin:0 4px 20px}.nav-row{justify-content:center;padding:0;height:39px}.nav-row .count,.nav-row .chevron{display:none}.section-label{display:block;font-size:0;height:16px;padding:0}.profile{justify-content:center;padding:0}.flyout{left:72px;max-width:calc(100vw - 84px)}.groups{flex-direction:column;flex-wrap:nowrap}.group{min-width:195px}.page{padding:24px 20px}.breadcrumb{padding:0 20px}.tabs{gap:20px}.footer .nav-row{height:34px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><span class="mark">c</span><span class="brand-name">Central</span></div><button class="search" id="search" aria-label="Search navigation"><i data-lucide="search"></i><span>Search anything…</span><kbd>⌘ K</kbd></button><nav aria-label="Main navigation" id="nav"></nav><div class="footer"><button class="nav-row" data-utility="Ask" title="Ask"><i data-lucide="sparkles"></i><span>Ask</span></button><button class="nav-row" data-utility="System" title="System"><i data-lucide="settings-2"></i><span>System</span></button><button class="profile" data-utility="Profile" aria-label="Rina profile"><span class="avatar">R</span><span class="identity"><strong>Rina</strong><small>Buyer · Head office</small></span><i data-lucide="chevrons-up-down"></i></button></div></aside><main class="main" id="main"></main></div><div class="flyout" id="flyout" hidden></div><dialog id="search-dialog"><input id="query" placeholder="Search pages…" aria-label="Search pages"><div id="results"></div><button class="close-search">Esc to close</button></dialog><script>
const D = [
  {id:"executive",label:"Executive",icon:"layout-dashboard",groups:[{items:[["Overview","gauge"],["Sales","chart-line"],["Stock","boxes"],["Cash","wallet"]]}]},
  {id:"buying",label:"Buying",icon:"shopping-cart",groups:[{items:[["Purchase orders","file-text"],["Suppliers","building-2"],["Review count","clipboard-check"],["Returns","undo-2"]]}]},
  {id:"merchandise",label:"Merchandise",icon:"shirt",n:12,groups:[{items:[["Articles","tags"],["New articles","sparkles"],["Allotment","split"],["Pricelist","badge-percent"]]}]},
  {id:"ops",label:"Ops",icon:"truck",groups:[
    {label:"Receiving",items:[["Receiving","package-open"],["Printing","printer"]]},
    {label:"Outbound",items:[["Picking","hand"],["Packing","package"],["Dispatch","truck"]]},
    {label:"Stock",items:[["Stock","boxes"],["Count","list-checks"],["Stock ledger","scroll-text"]]}]},
  {id:"inventory",label:"Inventory",icon:"boxes",groups:[{items:[["Stock by store","store"],["Transfers","arrow-left-right"],["Adjustments","sliders-horizontal"]]}]},
  {id:"marketing",label:"Marketing",icon:"megaphone",groups:[{items:[["Promotions","ticket-percent"],["Campaigns","flag"],["Vouchers","ticket"]]}]},
  {id:"selling",label:"Sales",icon:"store",tabs:["Store","Division","Tag","Article","SKU","PO","Supplier","Campaign","Payment","Cashier session"],
    more:["Receipts","Store analytics","Returns","Shop floor","Stores","Exceptions","Members","Segments","Points ledger"],
    groups:[{label:"Sales by",items:[["Store","store"],["Division","layers"],["Tag","tag"],["Article","shirt"],["SKU","barcode"],["PO","file-text"],["Supplier","building-2"],["Campaign","flag"],["Payment","credit-card"],["Cashier session","monitor"]]},
      {label:"More",items:[["Receipts","receipt"],["Store analytics","chart-column"],["Returns","undo-2"],["Shop floor","layout-grid"],["Stores","store"],["Exceptions","triangle-alert"],["Members","users-round"],["Segments","pie-chart"],["Points ledger","coins"]]}]},
  {id:"finance",label:"Finance",icon:"landmark",groups:[
    {label:"Payables",items:[["Purchase Invoice","file-text"],["Credit Note","file-minus"],["Accounts Payable","book-open"]]},
    {label:"Receivables",items:[["Sales Postings","receipt"],["Accounts Receivable","book-open"]]},
    {label:"Payments",items:[["Payment Entry","banknote"],["BKK","arrow-up-right"],["BKM","arrow-down-left"]]}]},
  {id:"hr",label:"HR",icon:"users",groups:[{items:[["Employees","contact"],["Attendance","clock"],["Leave","calendar"],["Payroll","banknote"]]}]},
  {id:"ga",label:"GA",icon:"messages-square",groups:[{items:[["Requests","inbox"],["Assets","package"],["Contracts","file-signature"],["Places","map-pin"]]}]},
];
let active='selling',page='Store',opened=null;const nav=document.querySelector('#nav'),main=document.querySelector('#main'),fly=document.querySelector('#flyout'),dialog=document.querySelector('dialog'),query=document.querySelector('#query');const icon=n=>`<i data-lucide="${n}"></i>`;const icons=()=>window.lucide?.createIcons();
function render(){nav.innerHTML=D.map((d,i)=>`${i===1?'<div class="section-label">Workspace</div>':''}<button class="nav-row ${d.id===active?'active':''}" data-dep="${d.id}" title="${d.label}" aria-expanded="false" aria-controls="flyout" ${d.id===active?'aria-current="true"':''}>${icon(d.icon)}<span>${d.label}</span>${d.n?`<span class="count">${d.n}</span>`:icon('chevron-right').replace('<i ','<i class="chevron" ')}</button>`).join('');const d=D.find(d=>d.id===active);const sales=active==='selling';main.innerHTML=`<div class="breadcrumb">Workspace ${icon('chevron-right')}<span>${d?.label||active}</span></div><div class="page"><div class="eyebrow">${sales?'Sales & performance':d?'Workspace':'Your workspace'}</div><h1>${sales?'Sales':d?.label||active}</h1><p class="subtitle">${sales?'A clear view of your sales, across every store.':d?'Everything you need, in one place.':'Workspace preferences and tools.'}</p>${sales?`<div class="tabs" aria-label="Sales views">${d.tabs.map(t=>`<button class="tab ${page===t?'selected':''}" data-page="${t}" ${page===t?'aria-current="page"':''}>${t}</button>`).join('')}<button class="tab more ${d.more.includes(page)?'selected':''}" id="more" aria-expanded="false">${d.more.includes(page)?page:'More'}${icon('chevron-down')}</button></div>`:''}<section class="content"><div class="content-head"><h2>${sales?'Sales by '+page.toLowerCase():page}</h2><span class="demo-tag">Preview</span></div><div class="empty-state">${icon(sales?'chart-no-axes-combined':d?.icon||'settings-2')}<strong>${page==='Store'?'Your store performance, at a glance':page}</strong><p>This is a navigation preview.<br>Your workspace content will appear here.</p></div></section></div>`;icons()}
function closeFly(){fly.hidden=true;opened=null;document.querySelectorAll('[aria-expanded="true"]').forEach(b=>{b.setAttribute('aria-expanded','false');b.classList.remove('expanded')})}
function openFly(id,anchor,more=false){if(opened===id+(more?'-more':'')){closeFly();return}closeFly();const d=D.find(x=>x.id===id);opened=id+(more?'-more':'');anchor.setAttribute('aria-expanded','true');anchor.classList.add('expanded');const groups=more?[d.groups[1]]:d.groups;fly.innerHTML=`<div class="fly-title">${d.label}<span>Navigate to</span></div><div class="groups">${groups.map(g=>`<div class="group">${g.label?`<div class="group-label">${g.label}</div>`:''}${g.items.map(([p,i])=>`<button class="sub ${id===active&&p===page?'selected':''}" data-select="${id}" data-page="${p}">${icon(i)}${p}</button>`).join('')}</div>`).join('')}</div>`;fly.hidden=false;icons();const r=anchor.getBoundingClientRect();fly.style.left=more?Math.max(12,Math.min(r.left,innerWidth-fly.offsetWidth-12))+'px':'';fly.style.top=Math.max(12,Math.min(r.top-8,innerHeight-fly.offsetHeight-12))+'px'}
function select(id,p){active=id;page=p;closeFly();render()}
document.addEventListener('click',e=>{const s=e.target.closest('[data-select]');if(s){select(s.dataset.select,s.dataset.page);dialog.close();return}const d=e.target.closest('[data-dep]');if(d){openFly(d.dataset.dep,d);return}const p=e.target.closest('[data-page]');if(p){select(active,p.dataset.page);return}const more=e.target.closest('#more');if(more){openFly('selling',more,true);return}const u=e.target.closest('[data-utility]');if(u){select(u.dataset.utility,u.dataset.utility==='Ask'?'Ask your workspace':u.dataset.utility==='Profile'?'Rina · Buyer':'Workspace settings');return}if(!e.target.closest('#flyout'))closeFly()});
function results(){const q=query.value.toLowerCase().trim();const items=D.flatMap(d=>d.groups.flatMap(g=>g.items.map(([p])=>({d,p})))).filter(({d,p})=>`${d.label} ${p}`.toLowerCase().includes(q));document.querySelector('#results').innerHTML=items.map(({d,p})=>`<button class="result" data-select="${d.id}" data-page="${p}">${p}<small>${d.label}</small></button>`).join('')||'<div class="no-result">No pages found.</div>'}
function search(){closeFly();query.value='';results();dialog.showModal();query.focus()}document.querySelector('#search').onclick=search;query.oninput=results;document.querySelector('.close-search').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search()}if(e.key==='Escape'){const trigger=document.querySelector('[aria-expanded="true"]');closeFly();trigger?.focus()}if(e.key==='ArrowDown'&&e.target.matches('[data-dep],#more')){e.preventDefault();if(fly.hidden)openFly(e.target.dataset.dep||'selling',e.target,e.target.id==='more');fly.querySelector('button')?.focus()}});window.addEventListener('resize',closeFly);render();
</script></body></html>
