<!doctype html>
<html lang="en" data-tpl="list" data-click="row" data-panel="mist" data-initial>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Layout templates</title>
<style>
@font-face{font-family:Inter;src:url('/frontend-hub/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
/* ── Central's premium grey, 15px floor (owner, 14 Oct) ── */
:root{
 --shell:#e9e9ed;--panel:#f5f5f7;--panel-on:#fff;--panel-on-ring:0 0 0 1px rgb(0 0 0 / 5%),0 1px 3px rgb(0 0 0 / 8%);--panel-ring:0 0 0 1px rgb(0 0 0 / 4%),0 1px 3px rgb(0 0 0 / 4%);
 --ink:#1d1d1f;--mute:#6e6e73;--faint:#a1a1a6;--hair:#e8e8ec;--hair-2:#dcdce1;--band:#fafafb;--hover:#f7f7f9;
 --blue:#2862dc;--blue-h:#2055c7;--blue-bg:#eef3fc;--red:#d70015;--red-h:#b80013;--green:#248a3d;--warn:#a66c1f;
 --scrim:rgb(208 208 213 / 48%);
 --ease-ui:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
 --t-in:340ms;--t-out:200ms;--t-swap-out:100ms;--t-swap-in:160ms;
 --label:15px;--body:15px;--value:16px;--title:17px;
 --gut:28px;--blk:24px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-.006em;color:var(--ink);background:var(--shell);-webkit-font-smoothing:antialiased;overflow:hidden}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ── shell: rail · panel · page, 12px of grey between ── */
.shell{display:flex;height:100vh;height:100dvh}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;color:#55555b}
.rail .ic{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;transition:background-color .15s,transform .12s var(--ease-ui)}
.rail .ic:active{transform:scale(.97)}
.rail .ic.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / 7%)}
@media(hover:hover) and (pointer:fine){.rail .ic:not(.on):hover{background:rgb(255 255 255 / 55%)}}
.rail .gap{height:10px}
.rail .end{margin-top:auto}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:15px;font-weight:600;line-height:1}
.rail .badge{position:absolute;top:-3px;right:-6px;min-width:18px;height:18px;padding:0 5px;font-size:15px;box-shadow:0 0 0 2px var(--shell)}
.panel{width:216px;flex:none;display:flex;flex-direction:column;margin:12px 12px 12px 0;padding:14px 10px;border-radius:16px;background:var(--panel);box-shadow:var(--panel-ring);transition:background-color .2s ease,box-shadow .2s ease}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 14px 10px}
.panel-head b{font-weight:600}
.panel-head button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.panel-head button svg{width:16px;height:16px}
.panel .grp{margin:14px 10px 6px;color:var(--mute);font-size:15px}
.nav{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 10px;border-radius:8px;color:#45454a;cursor:pointer;transition:background-color .15s}
.nav.on{background:var(--panel-on);color:var(--ink);font-weight:500;box-shadow:var(--panel-on-ring)}
.nav i{font-style:normal;color:var(--mute)}
@media(hover:hover) and (pointer:fine){.nav:not(.on):hover{background:rgb(0 0 0 / 3.5%)}}
.panel .foot-time{margin-top:auto;padding:0 10px 4px;color:var(--mute)}
.page{flex:1;min-width:0;display:flex;flex-direction:column;margin:12px 12px 12px 0;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0 / 5%),0 2px 8px rgb(0 0 0 / 4%);overflow:hidden}
.page-in{flex:1;overflow:auto;padding:0 var(--gut) 40px;opacity:1;transition:opacity var(--t-swap-in) ease}
.page-in.out{opacity:0;transition:opacity var(--t-swap-out) ease}

/* ── panel greys (owner, 14 Oct: "opsi abu abu premium untuk inner sidebar") ── */
html[data-panel="pearl"]{--panel:#fafafc;--panel-on:#ececf0;--panel-on-ring:none}
html[data-panel="silver"]{--panel:#f0f0f3}
html[data-panel="smoke"]{--panel:#ebebef;--panel-ring:0 0 0 1px rgb(0 0 0 / 5%)}
html[data-panel="flush"] .panel{background:transparent;box-shadow:none;margin-left:-6px}
html[data-panel="white"]{--panel:#fff;--panel-on:#f0f0f3;--panel-on-ring:none}

/* ── one head for every page: crumb · 17px title · action at the right ── */
.head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 calc(-1 * var(--gut)) 20px;padding:var(--blk) var(--gut) 16px;background:#fff;border-bottom:1px solid var(--hair)}
.head>div{min-width:0}
.crumb{color:var(--mute);margin-bottom:2px}
h1,h2{margin:0;font-size:var(--title);line-height:24px;font-weight:600;letter-spacing:-.3px}
.acts{display:flex;gap:8px;align-items:center;flex:none}
.btn{height:36px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap;transition:transform .16s var(--ease-ui),background-color .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
a.btn{text-decoration:none}
.primary{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 1px 2px rgb(20 50 100 / 12%)}
.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair-2)}
.danger{background:var(--red);color:#fff;font-weight:600}
@media(hover:hover) and (pointer:fine){.primary:hover{background:var(--blue-h)}.ghost:hover{background:#f5f5f7}.danger:hover{background:var(--red-h)}}
.btn.sm{height:30px;padding:0 10px}
.word{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 4px;color:var(--ink);font-weight:500}

/* KPI strip: 15 grey over 16 */
.kpis{display:flex;margin:0 0 20px}
.kpi{padding:0 24px;border-left:1px solid var(--hair);min-width:0}
.kpi:first-child{padding-left:0;border:0}
.kpi span{display:block;color:var(--mute);line-height:20px}
.kpi b{display:block;font-size:var(--value);line-height:22px;font-weight:600;white-space:nowrap}
.kpi small{font-size:15px;font-weight:400;color:var(--mute);margin-left:6px}
/* tabs: page only, never in a record */
.tabs{display:flex;gap:20px;box-shadow:inset 0 -1px 0 var(--hair);margin:0 0 16px}
.tab{padding:6px 0 10px;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab i{font-style:normal;font-weight:400;margin-left:6px;color:var(--mute)}
/* the bar: search · Filter · (the rest at the right) */
.bar{display:flex;align-items:center;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;width:280px;height:36px;padding:0 11px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hair-2);color:var(--mute)}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;color:var(--ink)}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--blue),0 0 0 3px rgb(40 98 220 / 12%)}
.select{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hair-2);background:#fff;white-space:nowrap;cursor:pointer}
.select em{font-style:normal;color:var(--mute)}
.select svg{width:15px;height:15px;color:var(--mute)}
.sp{flex:1}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:#f0f0f3}
.seg b{height:32px;padding:0 12px;display:grid;place-items:center;border-radius:7px;font-weight:500;color:var(--mute);cursor:pointer}
.seg b.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / 8%)}

/* the framed table: one size, one figure a cell */
.frame{border:1px solid var(--hair);border-radius:10px;overflow:clip}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:var(--head-h,0px);z-index:1;height:42px;padding:0 16px;text-align:left;font-weight:500;color:var(--mute);background:var(--band);box-shadow:inset 0 -1px 0 var(--hair);white-space:nowrap}
td{height:50px;padding:0 16px;border-bottom:1px solid var(--hair);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
.m{color:var(--mute)}
.late{color:var(--red)}
tfoot td{position:sticky;bottom:0;z-index:1;background:var(--band);box-shadow:inset 0 1px 0 var(--hair);border-bottom:0;font-weight:400}
.page tfoot td{bottom:-40px}
td.chev{width:1%;padding:0 12px 0 0;color:var(--faint)}
td.chev svg{width:16px;height:16px;opacity:0;transition:opacity .12s ease}
tr[data-open]{cursor:pointer}
@media(hover:hover) and (pointer:fine){tr[data-open]:hover td{background:var(--hover)}tr[data-open]:hover td.chev svg{opacity:1}}
.it{display:flex;align-items:center;gap:12px}
.thumb{width:36px;height:36px;flex:none;border-radius:8px;background:#f0f0f3;display:grid;place-items:center;color:var(--faint)}
.thumb svg{width:18px;height:18px}

/* ── what can be clicked (owner, 14 Oct: "bisa di klik … warna biru atau tidak
   ini membingungkan") — three rules on a switch, one at a time ──
   .obj = a word that opens something (a supplier, an item, a PO number).
   .id  = a row's own name.  .rel = another record named in a row.          */
.obj,.rel{border-radius:4px;text-decoration-line:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:color .15s ease,text-decoration-color .15s ease}
.obj{cursor:pointer}
.id{font-weight:500}
/* 1 · Row opens (Apple): a row is one target — no blue in it; a chevron on hover.
       Blue is only a word that opens something, outside a row. */
html[data-click="row"] .obj{color:var(--blue)}
@media(hover:hover) and (pointer:fine){html[data-click="row"] .obj:hover{text-decoration-color:currentColor}}
/* 2 · All ink: nothing blue at rest, blue + underline under the pointer (the hub today). */
html[data-click="ink"] td.chev svg{display:none}
@media(hover:hover) and (pointer:fine){html[data-click="ink"] :is(.obj,.rel):hover{color:var(--blue);text-decoration-color:currentColor}}
html[data-click="ink"] .rel{cursor:pointer}
/* 3 · All blue: everything that opens is blue — the row's name and every other record. */
html[data-click="blue"] :is(.obj,.id,.rel){color:var(--blue)}
html[data-click="blue"] .rel{cursor:pointer}
html[data-click="blue"] td.chev svg{display:none}
@media(hover:hover) and (pointer:fine){html[data-click="blue"] :is(.obj,.rel):hover{text-decoration-color:currentColor}}

/* ── the rail and panel as the hub draws them ── */
.rail{gap:2px;padding:12px 0 14px}
.rail .ic{width:40px;height:40px}
.rail .badge.solo{position:static;box-shadow:none}
.rail .me{width:28px;height:28px;margin:6px 0;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px rgb(0 0 0 / 6%)}
.panel-head span{display:flex;gap:2px}
.panel-list{flex:1;min-height:0;overflow:auto;margin:0 -4px;padding:0 4px}
.nav>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-r{display:flex;align-items:center;gap:6px;flex:none}
.nav-r em{display:grid;color:var(--mute)}
.nav-r em svg{width:15px;height:15px}
.nav.sub{padding-left:22px}
.foot-time{display:flex;align-items:center;gap:8px;padding-top:10px!important;color:var(--ink)!important}
.foot-time svg{width:16px;height:16px;color:var(--mute)}
.topbar,.greet,.range-top{display:none}

/* ── A · List — the hub's Purchase Orders, copied as it is (owner, 14 Oct:
   "lebih rapi yg kita punya sebelumnya") ── */
.cards,.dock,.tabbar{display:none}
.sub{display:block;color:var(--mute)}
.code{letter-spacing:.04em}
td.tl{height:auto;padding-top:13px;padding-bottom:13px;line-height:22px}
.bad{color:var(--red)}
.good{color:var(--green)}
.datef{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:176px;height:36px;padding:0 11px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hair-2);color:var(--mute);white-space:nowrap}
.datef svg{width:16px;height:16px}
.datef .clr{display:inline-flex;gap:6px;color:var(--mute)}
.datef .clr svg:first-child{width:13px;height:13px;margin-top:1.5px}
.sect-t{margin:22px 0 10px;font-weight:600}
.sect-t i{font-style:normal;font-weight:400;color:var(--mute);margin-left:6px}
.terms{margin-top:22px}
.terms>span:first-child{display:block;color:var(--mute);margin-bottom:8px}
.disc{display:flex;align-items:center;gap:6px;margin-top:20px;padding-top:14px;border-top:1px solid var(--hair);color:var(--mute);cursor:pointer}
.disc svg{width:15px;height:15px}
.above{display:flex;justify-content:flex-end;margin:-6px 0 10px}
.toggle{display:inline-flex;align-items:center;gap:10px;color:var(--mute)}
.toggle i{width:34px;height:20px;border-radius:10px;background:#e3e3e8;position:relative;transition:background-color .15s ease}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / 20%);transition:transform .2s var(--ease-ui)}
.toggle[aria-pressed=true] i{background:var(--green)}
.toggle[aria-pressed=true] i::after{transform:translateX(14px)}
.sheet:has([data-toggle][aria-pressed=true]) [data-matched]{display:none}
.totals2{display:grid;grid-template-columns:auto 190px;justify-content:end;margin-top:16px;padding-right:16px}
.totals2>*{padding:9px 0}
.totals2 span{color:var(--mute);padding-right:48px}
.totals2 b{text-align:right;font-weight:500}
.totals2 .acc{border-top:1px solid var(--hair);color:var(--ink);font-weight:600}
h2 .alert{display:inline-grid;color:var(--red);vertical-align:-3px;margin-left:8px}
h2 .alert svg{width:17px;height:17px}
.ok-dot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin:0 7px 1px 0}

/* ── B · Report — the hub's Profit and Loss Statement, as it is ── */
.scope{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.scope .select{min-width:120px;justify-content:space-between}
.scope .datef{min-width:150px}
.scope .to{color:var(--mute)}
.check{display:inline-flex;align-items:center;gap:8px;margin-left:6px;cursor:pointer}
.check i{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--hair-2)}
.scope-cap{color:var(--mute);margin:0 0 18px}
.chartbox{border:1px solid var(--hair);border-radius:10px;padding:16px 20px 14px;margin:0 0 16px}
.cw{position:relative;height:180px;margin:8px 0 0 52px}
.cw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;stroke:none;stroke-width:1}
.cy span{position:absolute;right:calc(100% + 10px);transform:translateY(-50%);color:var(--mute);white-space:nowrap;line-height:20px}
.cx{position:relative;height:24px;margin-left:52px}
.cx span{position:absolute;top:4px;transform:translateX(-50%);color:var(--mute)}
.card .axis{margin-left:52px}
.legend{display:flex;gap:16px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tree .cd{color:var(--mute);margin-right:8px}
.tree tr.d0 td{background:var(--band);font-weight:500}
.tree tr.d0 .cd{color:var(--ink)}
.tree tr.d1 td:first-child{padding-left:30px}
.tree tr.d2 td:first-child{padding-left:44px}
.tree tr.d3 td:first-child{padding-left:58px}

/* ── C · Dashboard — the hub's Executive Overview, as it is ── */
.dbar{display:flex;align-items:center;gap:8px;margin:0 0 20px}
.dbar .seg b{height:30px}
.dbar .range,.range-top{color:var(--mute)}
.dbar .range{margin-left:auto}
.dbar .range span,.range-top span{color:var(--faint);margin:0 4px}
.kpi em{display:block;font-style:normal;color:var(--mute);line-height:20px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
.dgrid .full{grid-column:1/-1}
.card-h .obj{font-weight:400}
.cfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--mute);margin-top:12px}
.cfoot b{color:var(--ink);font-weight:600}
.cfoot .legend{margin:0}
.prow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair)}
.prow .v{display:flex;gap:16px}
.prow.b{font-weight:600;border-bottom:0}
.pnote{color:var(--mute);margin:10px 0 0}
.pnote b{color:var(--ink);font-weight:500}
table.plain th{position:static;background:none;box-shadow:inset 0 -1px 0 var(--hair);height:38px;padding:0 8px}
table.plain td{height:44px;padding:0 8px}
table.plain th:first-child,table.plain td:first-child{padding-left:0}
.card table.plain{margin-top:-4px}

/* ── E · Form — the hub's settings page: facts on the page, Edit opens a sheet ── */
.fcard{border:1px solid var(--hair);border-radius:10px;padding:16px 18px 12px;margin:0 0 16px}
.fcard h3{margin:0 0 10px;font-size:15px;font-weight:600}
.frow{display:flex;justify-content:space-between;gap:24px;padding:4px 0}
.frow span{color:var(--mute)}
.frow b{font-weight:400;text-align:right}
.page-foot.view-only{display:none}
.fform{display:grid;gap:18px}
.fform label{display:grid;gap:8px;color:var(--mute)}
.fform .hint{display:flex;justify-content:space-between}
.fform .hint em{font-style:normal;color:var(--faint)}
textarea.inp{height:80px;padding:10px 12px;resize:vertical;font:inherit;line-height:1.45}
.fform .cb{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.fform .cb input{width:16px;height:16px;margin:3px 0 0;flex:none;accent-color:var(--blue)}
.fform .cb em{font-style:normal}
.req{color:var(--red);margin-left:2px}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{border:1px solid var(--hair);border-radius:12px;padding:16px 18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h b{font-weight:600}
.axis{display:flex;justify-content:space-between;color:var(--mute);margin-top:6px}
.inp{height:40px;width:100%;padding:0 12px;border:0;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hair-2);background:#fff;color:var(--ink);outline:0}
.inp:focus{box-shadow:inset 0 0 0 1px var(--blue),0 0 0 3px rgb(40 98 220 / 12%)}
.page-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px var(--gut);border-top:1px solid var(--hair);background:#fff}

/* ── Board: the lanes and cards as they are today (owner: "kanban jangan
   diubah"), inside the shell like every other page (owner: "tetap ada
   sidebarnya") — head · bar · lanes ── */
.lanes{display:flex;gap:24px;align-items:flex-start;margin:0 calc(-1 * var(--gut));padding:4px var(--gut) 0;overflow-x:auto}
.lane{width:286px;flex:none}
.lane-h{display:flex;align-items:center;gap:10px;height:30px;padding:0 16px 0 8px;font-weight:600}
.lane-h .dot{width:7px;height:7px;border-radius:50%;background:#77777c}
.lane-h i{font-style:normal;font-weight:400;color:var(--mute);margin-left:auto}
.lane-sub{display:flex;justify-content:space-between;padding:0 8px 6px;color:var(--mute)}
.fold{width:22px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute);padding-top:6px}
.fold span{writing-mode:vertical-rl;font-weight:500}
.fold .dot{width:7px;height:7px;border-radius:50%}
.bcard{border:1px solid var(--hair);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;cursor:pointer;transition:transform .16s var(--ease-ui)}
.bcard:active{transform:scale(.99)}
@media(hover:hover) and (pointer:fine){.bcard:hover{border-color:var(--hair-2);box-shadow:0 2px 8px rgb(0 0 0 / 5%)}}
.bcard .t{display:flex;justify-content:space-between;gap:8px}
.bcard .t b{font-size:16px;font-weight:600}
.bcard .f{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.lane-foot{padding:8px;color:var(--mute)}

/* ── Screens (the map): every audited screen, by template ── */
.shot{width:84px;height:52px;border-radius:6px;border:1px solid var(--hair);object-fit:cover;object-position:top left;display:block;background:#f5f5f7}
td.sc{white-space:normal;min-width:240px}

/* ── layers ── */
const stack = []
function open(s) {
 if (!s) return
 const at = stack.findIndex((e) => e.dataset.key === s.key)
 if (at >= 0) { while (stack.length > at + 1) close(); return }
 const el = document.createElement('section')
 el.dataset.key = s.key
 el.className = 'sheet' + (s.size === 'narrow' ? ' narrow' : '')
 el.setAttribute('role', 'dialog')
 el.style.setProperty('--inset', 12 + 12 * stack.length + 'px')
 el.innerHTML = `<div class="sh-head"><div style="min-width:0">${s.head}</div><button class="x" data-close aria-label="Close">${svg('x')}</button></div><div class="sh-body">${s.body}</div><div class="sh-foot">${s.foot}</div>`
 $('#sheets').append(el)
 stack.forEach((u) => u.setAttribute('data-under', ''))
 stack.push(el)
 H.setAttribute('data-sheets', '')
 el.getBoundingClientRect()
 requestAnimationFrame(() => el.setAttribute('data-open', ''))
}
function close() {
 const el = stack.pop()
 if (!el) return
 el.removeAttribute('data-open')
 setTimeout(() => el.remove(), 220)
 const top = stack[stack.length - 1]
 if (top) top.removeAttribute('data-under')
 else H.removeAttribute('data-sheets')
}
function closeAll() { while (stack.length) close() }

/* ── clicks ── */
document.addEventListener('click', (e) => {
 const t = e.target
 const go = t.closest('[data-go]')
 if (go && go.dataset.go) { closeAll(); H.dataset.tpl = go.dataset.go; render(true); return }
 if (t.closest('[data-close]') || t === $('#veil')) { close(); return }
 const tg = t.closest('[data-toggle]'); if (tg) { tg.setAttribute('aria-pressed', String(tg.getAttribute('aria-pressed') !== 'true')); return }
 if (t.closest('[data-review]')) { e.stopPropagation(); open(poSheet(+t.closest('[data-i]').dataset.i)); return }
 const sup = t.closest('[data-sup]')
 if (sup) { e.stopPropagation(); open(supSheet(sup.dataset.sup)); return }
 if (t.closest('[data-edit]')) { open(editSheet()); return }
 const mt = t.closest('[data-mt]'); if (mt) { MAP.tpl = mt.dataset.mt; render(); return }
 const dp = t.closest('[data-dept]'); if (dp) { MAP.dept = dp.dataset.dept; render(); return }
 const row = t.closest('[data-open]')
 if (row) {
  const k = row.dataset.open
  if (k === 'po') open(poSheet(+row.dataset.i))
  else if (k === 'item') open(itemSheet(row.dataset.n))
  else if (k === 'acc') open(accSheet(+row.dataset.i))
  else if (k === 'screen') open(screenSheet(row.dataset.p))
 }
})
document.addEventListener('input', (e) => {
 if (e.target.id === 'why') $('#submit').disabled = !e.target.value.trim()
 if (e.target.id === 'mq') { MAP.q = e.target.value.toLowerCase(); const pos = e.target.selectionStart; render(); const q = $('#mq'); q.focus(); q.setSelectionRange(pos, pos) }
})
document.addEventListener('keydown', (e) => {
 if (e.key === 'Escape' && stack.length) close()
 if (e.target.matches('input')) return
 const n = '123456'.indexOf(e.key); if (n >= 0) { closeAll(); H.dataset.tpl = ['list', 'report', 'dashboard', 'board', 'form', 'map'][n]; render(true) }
})

 const b = e.target.closest('button'); if (!b) return
 e.stopPropagation()
 if (b.dataset.t) { closeAll(); H.dataset.tpl = b.dataset.t; render(true) }
 if (b.dataset.c) { H.dataset.click = b.dataset.c; picker(); save() }
 if (b.dataset.g) { H.dataset.panel = b.dataset.g; picker(); save() }
 if (b.id === 'pick-phone') phone(true)
 if (b.id === 'pick-min') { const m = $('#pick').toggleAttribute('data-min'); b.textContent = m ? 'Show the switch' : 'Hide'; $('#pick-phone').hidden = m }
 syncPhone()
})
function phone(on) {
 $('#phone').hidden = !on
 if (on) $('#phone-frame').src = `layout-templates.html?frame=1&tpl=${H.dataset.tpl}&click=${H.dataset.click}&panel=${H.dataset.panel}`
}
function syncPhone() {
 const w = $('#phone-frame').contentWindow
 if ($('#phone').hidden || !w || !w.applyState) return
 w.applyState(H.dataset.tpl, H.dataset.click, H.dataset.panel)
}
$('#phone-x').onclick = () => phone(false)
window.applyState = (t, c, p) => { if (t !== H.dataset.tpl) { closeAll(); H.dataset.tpl = t; render(true) } H.dataset.click = c; H.dataset.panel = p }
function save() { try { localStorage.setItem('layout-templates', JSON.stringify({ t: H.dataset.tpl, c: H.dataset.click, p: H.dataset.panel })) } catch (_) {} }

/* ── start ── */
const qs = new URLSearchParams(location.search)
try { const s = JSON.parse(localStorage.getItem('layout-templates') || 'null'); if (s && !qs.has('tpl')) { H.dataset.tpl = s.t; H.dataset.click = s.c; H.dataset.panel = s.p } } catch (_) {}
if (qs.has('frame')) H.setAttribute('data-frame', '')
for (const [k, a] of [['tpl', 'tpl'], ['click', 'click'], ['panel', 'panel']]) if (qs.get(k)) H.dataset[a] = qs.get(k)
fetch('outputs/layout-audit/mapping.json').then((r) => r.json()).then((rows) => {
 MAP.rows = rows
 rows.forEach((r) => { r.dept = r.dept.charAt(0).toUpperCase() + r.dept.slice(1) })
 const by = {}; rows.forEach((r) => { by[r.dept] = (by[r.dept] || 0) + 1 })
 MAP.depts = Object.entries(by).sort((a, b) => b[1] - a[1]).map(([d, n]) => [d, n])
 render()
}).catch(() => render())
render()
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => render(), 150) })
requestAnimationFrame(() => requestAnimationFrame(() => H.removeAttribute('data-initial')))
</script>
</body>
</html>
