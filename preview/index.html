.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-block:32px 24px}
.crumb{font-weight:500;color:var(--mute);margin-bottom:5px}
h1{font-size:1.375rem;line-height:1.875rem;letter-spacing:-.02em;font-weight:600;margin:0}
.sub{margin:4px 0 0;color:var(--body);line-height:1.375rem;max-width:80ch}
.ph-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rolebox{display:inline-flex;align-items:center;gap:8px;color:var(--body);font-weight:500}
.rolebox .sel{height:32px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 10px;border-radius:var(--r-inner);font-weight:500;white-space:nowrap;
  border:1px solid var(--hairline-2);background:var(--canvas);color:var(--text);box-shadow:var(--shadow-soft);transition-property:color,background-color,border-color,scale}
.btn:hover{background:var(--soft-2);color:var(--ink)}
.btn:active{scale:.97}
.btn.primary{background:var(--cta);border-color:var(--cta);color:#fff;box-shadow:none}
.btn.primary:hover{background:var(--cta-hover)}
.btn.quiet{border-color:transparent;background:none;box-shadow:none;color:var(--body)}
.btn.quiet:hover{background:var(--soft-2);color:var(--ink)}
.btn.danger{border-color:transparent;background:var(--bad-bg);color:var(--bad-fg);box-shadow:none}
.btn.sm{height:28px;padding:0 8px}
.btn:disabled{opacity:.5;pointer-events:none}
.btn[aria-busy=true]{opacity:.75}
.btn svg{width:16px;height:16px;flex:none}
.hint{color:var(--mute)} .hint b{color:var(--text);font-weight:500}
.inp,.sel{height:36px;border:1px solid var(--hairline-2);background:var(--canvas);border-radius:var(--r-inner);padding:0 10px;min-width:0;color:var(--ink)}
.inp:focus,.sel:focus,.num-in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.sel:disabled{opacity:.55}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;width:100%}
.num-in{width:84px;height:32px;text-align:right;border:1px solid var(--hairline-2);border-radius:var(--r-inner);padding:0 8px;background:var(--canvas);font-variant-numeric:tabular-nums}
.num-in.bad{border-color:var(--bad);background:var(--bad-bg)}
@media (pointer:coarse){.inp,.sel,.num-in,textarea{font-size:16px}.btn{height:40px}}

.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;border-radius:var(--r-inner);background:var(--soft-2);padding:2px}
.seg button{height:28px;border:0;background:none;border-radius:6px;padding:0 10px;font-weight:500;color:var(--body);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected=true]{background:var(--canvas);color:var(--ink);box-shadow:var(--shadow-soft)}
.count{color:var(--mute);font-variant-numeric:tabular-nums;font-weight:500}
.seg .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad-bg);color:var(--bad-fg);font-weight:600;font-size:14px;line-height:20px;text-align:center}
.seg .badge.zero{background:var(--soft-2);color:var(--mute)}

.pill{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 9px;border-radius:var(--r-inner);border:1px solid var(--hairline-2);background:var(--canvas);font-weight:500;white-space:nowrap;color:var(--body)}
.pill.ok{color:var(--ok-fg);border-color:color-mix(in srgb,var(--ok-fg) 30%,transparent)}
.pill.warn{color:var(--warn-fg);border-color:color-mix(in srgb,var(--warn-fg) 30%,transparent)}
.pill.bad{color:var(--bad-fg);border-color:color-mix(in srgb,var(--bad-fg) 30%,transparent)}
.pill.info{color:var(--info-fg);border-color:color-mix(in srgb,var(--info-fg) 30%,transparent)}
.pill.new{color:var(--new-fg);border-color:color-mix(in srgb,var(--new-fg) 30%,transparent)}
.pill.done{color:var(--text);background:var(--soft-2);border-color:color-mix(in srgb,var(--body) 40%,transparent)}
.status{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;color:var(--text)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--mute)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;background:var(--soft-2);color:var(--body);font:600 14px/1 var(--mono);white-space:nowrap}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;padding:10px 14px;border-radius:var(--r-card);background:var(--canvas);border:1px solid var(--hairline);box-shadow:var(--shadow-soft)}
.banner .t{font-weight:500;color:var(--ink)}
.banner .x{color:var(--body);flex:1;min-width:200px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:20px}
.toolbar .spacer{flex:1}
.toolbar .sel{width:184px;max-width:100%}
.toolbar .inp[type=search]{width:240px;max-width:100%}

/* board: the lane header is the summary, the cards are the work */
.board-wrap{overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px}
.board{display:grid;grid-template-columns:repeat(5,minmax(216px,1fr));gap:14px;align-items:start}
.lane{background:var(--soft-2);border-radius:12px;display:flex;flex-direction:column;min-width:0;scroll-snap-align:start}
.lane-h{padding:16px 16px 14px}
.lane-t{display:flex;align-items:center;gap:8px;color:var(--body);font-weight:500}
.lane-t .dot{width:8px;height:8px}
.lane-t h2{margin:0;font:inherit;color:var(--text)}
.lane-t .n{margin-left:auto;min-width:24px;height:22px;padding:0 7px;border-radius:11px;background:var(--canvas);color:var(--body);font-weight:500;text-align:center;line-height:22px;font-variant-numeric:tabular-nums}
.lane-q{margin-top:10px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.lane-q b{font-size:1.5rem;line-height:1.1;font-weight:600;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.lane-q span{color:var(--mute)}
.lane-a{margin-top:10px;padding-top:10px;border-top:1px solid var(--hairline-2);display:flex;align-items:center;gap:6px;color:var(--mute);min-height:39px}
.lane-a svg{width:14px;height:14px;flex:none}
.lane-a .btn{margin-left:auto;flex:none}
.lane-a .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-b{padding:0 10px 10px;display:flex;flex-direction:column;gap:10px;max-height:calc(100dvh - 330px);min-height:120px;overflow-y:auto}
.lane-b>*{flex-shrink:0}
.lane{position:relative}
.grip{position:absolute;top:0;right:-11px;width:12px;height:100%;cursor:col-resize;z-index:3;touch-action:none}
.grip::after{content:"";position:absolute;left:5px;top:16px;bottom:16px;width:2px;border-radius:1px;background:transparent;transition:background 120ms}
.grip:hover::after,.grip.on::after{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
.lane[data-key=pick] .lane-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));align-content:start}
.lane[data-key=pick] .grp-h,.lane[data-key=pick] .empty{grid-column:1/-1}
.grp-h[data-fold]{cursor:pointer;border-radius:6px}

.grp-h[data-fold]:hover{background:var(--hairline-2)}
.grp-h .chev{display:inline-block;width:12px;color:var(--mute);transition:transform 150ms}
.grp-h.folded .chev{transform:rotate(-90deg)}
.sp-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.sp-head .seg .count{color:var(--mute);font-variant-numeric:tabular-nums}
.sp-head .seg .dot{width:8px;height:8px}
.warn-t{color:var(--warn-fg)}
.sp-sum{color:var(--mute)}.sp-sum b{color:var(--ink);font-size:1.25rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-right:4px}
.spread{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.spread>.lane{flex:0 0 264px}
.sp-stack{margin-top:10px;min-width:0}
.sp-leg,.sp-legend{display:flex;gap:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.sp-leg{margin-top:6px}
.sp-leg>span,.sp-legend>span{display:inline-flex;align-items:center;gap:6px}
.sp-leg .dot,.sp-legend .dot,.spread .grp-h .dot{width:8px;height:8px;display:inline-block;border-radius:50%}
.spread .grp-h{padding-top:8px}
.spread>.lane.slim{flex:0 0 52px;min-height:200px}
.spread .lane-h .sub{margin-top:2px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spread .lane-q{margin-top:8px}
.lane.slim{align-items:center;padding:16px 0;gap:10px;min-height:260px}
.lane.slim .dot{width:8px;height:8px}
.lane.slim .vt{writing-mode:vertical-rl;color:var(--body);font-weight:500;white-space:nowrap}
.lane.slim .n{min-width:24px;height:22px;padding:0 7px;border-radius:11px;background:var(--canvas);color:var(--mute);font-weight:500;text-align:center;line-height:22px}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}

.kc{display:flex;flex-direction:column;text-align:left;width:100%;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-soft);padding:14px 16px 12px;color:inherit;transition-property:border-color,box-shadow,scale}
button.kc:hover,.kc.sel-card:hover{border-color:var(--hairline-strong);box-shadow:var(--shadow-pop)}
button.kc:active{scale:.99}
.kc.is-picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kc.ask{border-color:color-mix(in srgb,var(--warn-fg) 40%,transparent)}
.kc.cut{border-color:color-mix(in srgb,var(--bad-fg) 45%,transparent);background:color-mix(in srgb,var(--bad-bg) 55%,var(--canvas))}
.kc{position:relative}
.kc.stamped{container-type:inline-size}
.kc.stamped .kc-sub{padding-right:56px}.kc.stamped .kc-foot{padding-right:96px}
@container (max-width:200px){
  .stamp{padding:2px 6px 3px;font-size:10px;letter-spacing:.08em;outline-offset:1px;bottom:12px;right:10px}
  .stamp small{display:none}
  .kc.stamped .kc-sub{padding-right:0}.kc.stamped .kc-foot{padding-right:72px}
  .kc.stamped .kc-foot .q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
}
.stamp{position:absolute;bottom:10px;right:12px;pointer-events:none;background:color-mix(in srgb,var(--canvas) 70%,transparent);display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:3px 9px 4px;border:2px solid currentColor;border-radius:6px;outline:1px solid currentColor;outline-offset:2px;font:700 12px/1.1 var(--font-sans,inherit);letter-spacing:.12em;text-transform:uppercase;rotate:-8deg;transform-origin:center;opacity:.9;mix-blend-mode:multiply}
.stamp small{font:600 11px/1.1 var(--font-mono,monospace);letter-spacing:0;text-transform:none}
.stamp.bad{color:var(--bad-fg)}.stamp.warn{color:var(--warn-fg)}
.kc.gap{border-color:color-mix(in srgb,var(--warn-fg) 45%,transparent);background:color-mix(in srgb,var(--warn-bg) 45%,var(--canvas))}.stamp.ok{color:var(--ok-fg,#15803d)}
.kc.done-dim{background:var(--soft-3);box-shadow:none}
.kc.done-dim>*:not(.kc-top),.kc.done-dim .kc-title{opacity:.55}
.kc.done-dim .stamp{opacity:.75}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .stamp{mix-blend-mode:normal}}
:root[data-theme=dark] .stamp{mix-blend-mode:normal}
.kc.cut:hover,.kc.cut.sel-card:hover{border-color:var(--bad-fg)}
.kc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;min-height:24px}
.kc-title{flex:1;min-width:0;font-size:.9375rem;line-height:24px;font-weight:600;letter-spacing:-.01em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc-title.mono{font-family:var(--mono);font-size:14px;letter-spacing:-.02em}
.kc-sub{margin-top:2px;color:var(--mute);line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--hairline);line-height:20px}
.kc-foot .q{color:var(--mute);white-space:nowrap}
.kc-foot .q b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.kc-foot .r{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kc .pill{height:22px;padding:0 7px;flex:none}
.kc .open{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.kc .open:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.kc-top .open{flex:1}
.chk{display:grid;place-items:center;width:28px;height:28px;margin:-2px -6px -2px 0;border-radius:6px;cursor:pointer;flex:none}
.chk:hover{background:var(--soft-2)}
.chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 4px 0;color:var(--text);font-weight:500}
.grp-h:first-child{padding-top:0}
.grp-h span{color:var(--mute);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.grp-h b{font-weight:500;color:var(--mute);flex:none}
.lane-more{padding:6px 4px 2px;color:var(--mute);text-align:center}
.mseg{display:none}
body.has-selbar .lane-b{padding-bottom:84px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-8px 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:var(--accent-bg);color:var(--accent);font-weight:500}
.chip button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:10px;background:none;color:inherit}
.chip button:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chip svg{width:12px;height:12px}

/* merchandise: one row per allotment */
.ahead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.alist{display:flex;flex-direction:column;gap:10px}
.arow{display:block;width:100%;text-align:left;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-soft);padding:14px 16px;color:inherit;transition-property:border-color,box-shadow}
.arow:hover{border-color:var(--hairline-strong);box-shadow:var(--shadow-pop)}
.arow-top{display:flex;align-items:center;gap:10px;min-width:0}
.arow-top .code{font:600 14px var(--mono);color:var(--ink);flex:none}
.arow-top .nt{flex:1;min-width:0;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow-meta{margin-top:2px;color:var(--mute)}
.pipe{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft-2);margin:12px 0 8px}
.pipe i{display:block;height:100%}
.pnums{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;color:var(--mute)}
.pnums b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pnums .sisa{margin-left:auto;color:var(--body)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:110px auto minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--hairline)}
.tl .when{color:var(--mute);white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;background:var(--soft-2);color:var(--text);font-weight:500;white-space:nowrap}
.who i{width:6px;height:6px;border-radius:50%;background:var(--mute)}
.who.md i{background:var(--a-violet)} .who.ops i{background:var(--a-blue)} .who.toko i{background:var(--a-green)} .who.inv i{background:var(--a-orange)}
.radio{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)}
.radio input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.decide{display:flex;flex-direction:column;gap:10px}
.decide .row2{align-items:center}

.arow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 28px;align-items:center}
.sup{font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;gap:28px}
.stat{min-width:92px;text-align:right}
.stat .n{display:block;font-size:1.75rem;line-height:1.1;font-weight:600;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .l{color:var(--mute)}
@media (max-width:720px){.arow2{grid-template-columns:minmax(0,1fr)}.stats{justify-content:space-between;gap:12px}.stat{text-align:left;min-width:0}}

/* cards, tables */
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-soft)}
.card+.card,.grid2+.card{margin-top:16px}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:14px 16px 11px}
.card-h h3{margin:0;font-size:.9375rem;font-weight:600;letter-spacing:-.01em}
.card-h p{margin:2px 0 0;color:var(--body)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.dt th{height:44px;padding:0 12px;text-align:left;font-weight:500;color:var(--body);border-bottom:1px solid var(--hairline);white-space:nowrap;background:var(--canvas)}
.dt td{height:52px;padding:0 12px;border-bottom:1px solid var(--hairline);white-space:nowrap;color:var(--text)}
.dt tbody tr:last-child td{border-bottom:0}
.dt tr.click{cursor:pointer}
.dt tr.click:hover td{background:var(--soft)}
.dt tr.click:focus-visible td{background:var(--accent-bg)}
.dt tfoot td{font-weight:600;color:var(--ink);background:var(--soft);border-top:1px solid var(--hairline);border-bottom:0}
.r{text-align:right!important}
.ink{color:var(--ink)!important;font-weight:500}
.dim{color:var(--faint)!important}
.neg{color:var(--bad-fg)!important;font-weight:500}
.pos{color:var(--ok-fg)!important;font-weight:500}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--soft-2);min-width:140px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--body)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:8px;height:8px;border-radius:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2 .card+.card{margin-top:0}
.exq .gh{display:flex;align-items:center;gap:8px;padding:10px 16px 8px;border-top:1px solid var(--hairline);background:var(--soft);color:var(--text);font-weight:500}
.exq .gh .dot{width:8px;height:8px}
.exq .gh .count{margin-left:auto}
.exq .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px 12px 32px;border-top:1px solid var(--hairline)}
.exq .t{font-weight:500;color:var(--ink)}
.exq .d{color:var(--body);margin-top:2px}
.checks{list-style:none;margin:0;padding:0 16px 8px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--hairline)}
.checks .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:600;margin-top:1px}
.checks .ic.ok{background:var(--ok-bg);color:var(--ok-fg)} .checks .ic.bad{background:var(--bad-bg);color:var(--bad-fg)}
.formula{display:flex;flex-wrap:wrap;gap:4px 18px;padding:12px 16px;border-top:1px solid var(--hairline);color:var(--body);background:var(--soft);border-radius:0 0 var(--r-card) var(--r-card)}
.formula b{color:var(--ink);font-weight:500}

/* inbound: two stacked rails sharing two columns */
.ib-cols,.rail{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1fr);gap:14px}
.ib-cols{padding:0 14px 8px;color:var(--body);font-weight:500}
.ib-cols div{display:flex;align-items:center;gap:8px}
.ib-cols .dot{width:8px;height:8px}
.rail{background:var(--soft-2);border-radius:12px;padding:14px;align-items:start}
.rail+.rail{margin-top:14px}
.rail-h{padding:2px 4px}
.rail-h h2{margin:0;font-size:.9375rem;font-weight:600;letter-spacing:-.01em}
.rail-h .lane-q{margin-top:8px}
.rail-h .mute{margin-top:2px}
.rail-h .btn{margin-top:12px}
.rail-lane{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;align-content:start;min-height:60px}

<script>
(() => {
const S = { stores: [], articles: [], allots: [], pls: [], packs: [], sjs: [], adjs: [], pos: [], grns: [], rets: [], reqs: [], loaded: new Set(), canWrite: true, db: null };
const F = { store: 'all', allot: 'all', q: '' };
const SEL = new Set(), MADE = new Set();
let SP = { col: 'sup' }; try { Object.assign(SP, JSON.parse(localStorage.getItem('ob-sp') || '{}')); } catch (e) {}
let LW = { pick: 1.7, picked: 1, packed: 1, transit: 1, recv: 1 }, FOLD = new Set();
try { Object.assign(LW, JSON.parse(localStorage.getItem('ob-lw') || '{}')); FOLD = new Set(JSON.parse(localStorage.getItem('ob-fold') || '[]')); } catch (e) {}
const LANES = ['pick', 'picked', 'packed', 'transit', 'recv'];
const laneTpl = slim => LANES.map(k => slim[k] ? '52px' : `minmax(180px,${LW[k].toFixed(3)}fr)`).join(' ');
let TAB = 'board', DR = null, busy = false, NA = null, MLANE = 'pick', ALF = 'active', ARG = null, ACC = null;
const COLS = ['stores', 'articles', 'allotments', 'picklists', 'packs', 'sj', 'adjustments', 'pos', 'grns', 'returns', 'requests'];
const KEY = { stores: 'stores', articles: 'articles', allotments: 'allots', picklists: 'pls', packs: 'packs', sj: 'sjs', adjustments: 'adjs', pos: 'pos', grns: 'grns', returns: 'rets', requests: 'reqs' };
const STAGE = { pick: 'var(--st-pick)', picked: 'var(--st-picked)', packed: 'var(--st-packed)', transit: 'var(--st-transit)', recv: 'var(--st-recv)', short: 'var(--st-short)' };
const MDC = { belum: 'var(--hairline-strong)', dipack: 'var(--a-violet)', jalan: 'var(--info)', recv: 'var(--ok)', gap: 'var(--warn)', closed: 'var(--body)' };
const IC = {
  x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  arrow: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>',
  truck: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M1.5 4h8v7h-8zM9.5 6.5h3l2 2.5V11h-5"/><circle cx="4.5" cy="11.5" r="1.3"/><circle cx="12" cy="11.5" r="1.3"/></svg>',
};

/* roles: who may press which button. A prototype switch, so the ownership is visible. */
const ROLES = { md: 'Merchandise', ops: 'Ops gudang', toko: 'Toko', inv: 'Inventory' };
const RSHORT = { md: 'Merchandise', ops: 'Ops', toko: 'Toko', inv: 'Inventory' };
const OWN = {
  createAllot: 'md', addSku: 'md', mdDecide: 'md', createPo: 'md', closePo: 'md', saveArt: 'md',
  completePick: 'ops', makeKoli: 'ops', unpackRack: 'ops', unpack: 'ops', unpackFor: 'ops', returnRack: 'ops', dispatch: 'ops', finishRequest: 'ops', countPo: 'ops', countRet: 'ops',
  receive: 'toko', createRet: 'toko', resolve: 'inv', resolveGrn: 'inv', saveAdj: 'inv',
};
let ROLE = 'ops'; try { ROLE = localStorage.getItem('ob-role') || 'ops'; } catch (e) {}
if (!ROLES[ROLE]) ROLE = 'ops';
const may = act => !OWN[act] || OWN[act] === ROLE;
const gate = (act, html) => may(act) ? html : `<span class="hint">Dilakukan <b>${ROLES[OWN[act]]}</b></span>`;

/* "baru": what arrived since this viewer last looked */
let SEEN = 0; try { SEEN = +localStorage.getItem('ob-seen') || 0; } catch (e) {}
const markSeen = () => { try { localStorage.setItem('ob-seen', String(Date.now())); } catch (e) {} };
addEventListener('pagehide', markSeen); document.addEventListener('visibilitychange', () => { if (document.hidden) markSeen(); });
const isNew = iso => !!SEEN && !!iso && new Date(iso).getTime() > SEEN;

/* helpers */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n || 0).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (a, f) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const clone = o => JSON.parse(JSON.stringify(o));
const nowISO = () => new Date().toISOString();
const p2 = n => String(n).padStart(2, '0');
const ymd = (d = new Date()) => String(d.getFullYear()).slice(2) + p2(d.getMonth() + 1) + p2(d.getDate());
const fdt = iso => { if (!iso) return '–'; const d = new Date(iso); return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); };
const dshort = iso => new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
const ageDays = iso => (Date.now() - new Date(iso)) / 864e5;
const ago = iso => { const h = (Date.now() - new Date(iso)) / 36e5; if (h < 1) return Math.max(1, Math.round(h * 60)) + ' mnt'; if (h < 24) return Math.round(h) + ' jam'; return Math.floor(h / 24) + ' hari'; };
const store = code => S.stores.find(s => s.code === code) || { code, name: code, city: '', order: 99 };
const art = sku => S.articles.find(a => a.sku === sku) || { sku, name: sku, stock: 0 };
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const fail = m => (toast(m, true), 'keep');
const decisionText = r => r.decision === 'move' ? `pindah ke ${r.toStore}` : 'batal';
const baseOf = code => code.replace(/-\d+$/, '');
function nextPlCode(base) { const used = new Set([...S.pls.map(p => p.code), ...MADE]); let i = 2; while (used.has(`${base}-${i}`)) i++; MADE.add(`${base}-${i}`); return `${base}-${i}`; }
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), err ? 5200 : 3200); }

/* filters */
const inStore = st => F.store === 'all' || st === F.store;
const inAllot = code => F.allot === 'all' || code === F.allot;
const qHit = arr => { if (!F.q) return true; const q = F.q.toLowerCase(); return arr.some(s => String(s || '').toLowerCase().includes(q)); };
const isVoid = k => k.status === 'void';
const koliQty = k => sum(k.lines.filter(l => inAllot(l.allotCode)), l => l.qty);
const koliAll = k => sum(k.lines, l => l.qty);
const plIn = p => inStore(p.store) && inAllot(p.allotCode);
const koliIn = k => !isVoid(k) && inStore(k.store) && k.lines.some(l => inAllot(l.allotCode));
const sjIn = s => inStore(s.store) && s.lines.some(l => inAllot(l.allotCode));
const sjLines = s => s.lines.filter(l => inAllot(l.allotCode));
const plTxt = p => [p.code, p.allotCode, p.store, store(p.store).name, ...p.lines.flatMap(l => [l.sku, art(l.sku).name])];
const openQty = p => sum(p.lines, l => l.qty);
const gapOf = l => Math.max(0, l.qty - Math.min(l.recv ?? l.qty, l.qty) - (l.found || 0) - (l.lost || 0));

/* One ledger for the promise, per allotment × store × SKU. Every screen reads this.
   toPack = still promised and not in a koli (includes what is picked and waiting).
   Close Short only takes from toPack; reversals move quantity back into it. */
function acc() {
  if (ACC) return ACC;
  const m = new Map();
  const get = (code, st, sku) => { const k = code + '|' + st + '|' + sku; let x = m.get(k); if (!x) m.set(k, (x = { code, st, sku, allot: 0, closed: 0, koli: 0, dipack: 0, jalan: 0, recv: 0, gap: 0, lost: 0, open: 0, blocked: 0, picked: 0 })); return x; };
  S.allots.forEach(a => a.lines.forEach(l => { const x = get(a.code, l.store, l.sku); x.allot += l.qty; x.closed += l.closed || 0; }));
  S.packs.forEach(k => { if (isVoid(k)) return; k.lines.forEach(l => { const x = get(l.allotCode, k.store, l.sku); x.koli += l.qty; if (!k.sjId) x.dipack += l.qty; }); });
  S.sjs.forEach(s => s.lines.forEach(l => { const x = get(l.allotCode, s.store, l.sku);
    if (s.status !== 'received') { x.jalan += l.qty; return; }
    x.recv += Math.min(l.recv ?? l.qty, l.qty) + (l.found || 0); x.lost += l.lost || 0; x.gap += gapOf(l); }));
  S.pls.forEach(p => p.lines.forEach(l => { const x = get(p.allotCode, p.store, l.sku);
    if (p.status === 'open') { x.open += l.qty; if (p.blocked) x.blocked += l.qty; }
    else if (p.status === 'done') x.picked += (l.picked || 0) - (l.returned || 0); }));
  m.forEach(x => { x.pool = x.picked - x.koli; x.toPack = x.allot - x.closed - x.koli + x.lost; x.excess = Math.max(0, x.open + x.pool - x.toPack);
    x.uncovered = Math.max(0, x.toPack - x.open - x.pool); x.toReceive = x.allot - x.closed - x.recv; });
  return (ACC = m);
}
const accIn = x => inStore(x.st) && inAllot(x.code);
const tot = (rows, k) => sum(rows, x => x[k]);

function packedMap() { const m = {}; S.packs.forEach(k => { if (isVoid(k)) return; k.lines.forEach(l => { const key = l.picklistId + '|' + l.sku; m[key] = (m[key] || 0) + l.qty; }); }); return m; }
/* Picked pool: what a finished picklist left in the pick area, per store. */
function pool(filter = true) {
  const pm = packedMap(), by = {};
  S.pls.filter(p => p.status === 'done' && (!filter || plIn(p))).forEach(p => p.lines.forEach(l => {
    const left = (l.picked || 0) - (l.returned || 0) - (pm[p.id + '|' + l.sku] || 0);
    if (left > 0) (by[p.store] = by[p.store] || []).push({ pl: p, sku: l.sku, left });
  }));
  return by;
}

function totals(filter = true) {
  const rows = [...acc().values()].filter(filter ? accIn : () => true);
  const pls = S.pls.filter(p => p.status === 'open' && openQty(p) > 0 && (!filter || plIn(p)));
  const koli = S.packs.filter(k => !isVoid(k) && !k.sjId && (!filter || koliIn(k)));
  const sjs = S.sjs.filter(s => !filter || sjIn(s));
  return {
    allot: tot(rows, 'allot'), toPick: tot(rows, 'open'), toPack: Math.max(0, tot(rows, 'pool')), toDisp: tot(rows, 'dipack'), transit: tot(rows, 'jalan'),
    recv: tot(rows, 'recv'), gap: tot(rows, 'gap'), closed: tot(rows, 'closed'), belum: tot(rows, 'toPack'), excess: tot(rows, 'excess'),
    nPick: pls.length, nPool: Object.keys(pool(filter)).length, nKoli: koli.length, nTransit: sjs.filter(s => s.status === 'transit').length, nRecv: sjs.filter(s => s.status === 'received').length,
  };
}

function ledger() {
  const A = [...acc().values()];
  return S.articles.slice().sort((a, b) => a.sku.localeCompare(b.sku)).map(a => {
    const X = A.filter(x => x.sku === a.sku);
    const dispatched = sum(S.sjs.flatMap(s => s.lines.filter(l => l.sku === a.sku)), l => l.qty);

    const expected = sum(S.pos.filter(p => p.status !== 'closed').map(poState).flatMap(x => x.lines.filter(l => l.sku === a.sku)), l => l.left) + sum(S.rets.filter(r => r.status === 'transit').flatMap(r => r.lines.filter(l => l.sku === a.sku)), l => l.qty);

function integrity() {

    if (g) ex.push({ tone: 'warn', type: 'Selisih terima', title: `${s.store} kurang ${fmt(g)} pcs`, detail: `${s.no}. ${s.receiveNote || ''}`, act: ['Lihat SJ', `sj:${s.id}`] }); });

  const reqs = S.reqs.filter(r => r.status === 'open' && inStore(r.store) && inAllot(r.allotCode));
  const sjs = S.sjs.filter(s => sjIn(s) && qHit([s.no, s.store, store(s.store).name, s.vehicle, s.driver, ...s.lines.flatMap(l => [l.sku, art(l.sku).name, l.allotCode])]));
  const tr = sjs.filter(s => s.status === 'transit').sort((a, b) => a.createdAt.localeCompare(b.createdAt));
  const gapOpen = s => !s.resolved && sum(sjLines(s), gapOf) > 0;
  const rcAll = sjs.filter(s => s.status === 'received').sort((a, b) => gapOpen(b) - gapOpen(a) || b.receivedAt.localeCompare(a.receivedAt));
  const rc = rcAll.filter(s => gapOpen(s) || ageDays(s.receivedAt) <= 7), rcOld = rcAll.length - rc.length;

  const plPill = p => p.blocked ? '<span class="pill warn">Rak kurang</span>' : p.resend ? '<span class="pill info">Kirim ulang</span>' : p.repick ? '<span class="pill">Pick ulang</span>' : isNew(p.createdAt) ? '<span class="pill new">Baru</span>' : '';
  const plSub = p => p.blocked ? `${esc(p.store)} · sisa, menunggu barang atau keputusan` : p.resend ? `${esc(p.store)} · ${esc(p.reason || 'hilang')}` : p.repick ? `${esc(p.store)} · ${esc(p.reason || 'pick ulang')}` : `${esc(p.store)} · ${esc(store(p.store).city || '')}`;
  const plCard = p => `<button class="kc ${p.cut ? 'cut stamped' : ''}" data-open="pl:${p.id}">${top(esc(store(p.store).name), 0, p.cut ? '' : plPill(p))}${rest(plSub(p), openQty(p), `pcs · ${p.lines.length} SKU`, p.cut ? '' : ago(p.createdAt))}${p.cut ? stamp('bad', 'Dibatalkan', `−${fmt(p.cut)} pcs`) : ''}</button>`;
  const byAllot = {}; openPl.forEach(p => (byAllot[p.allotCode] = byAllot[p.allotCode] || []).push(p));
  const plGroups = Object.entries(byAllot).map(([code, list]) => { const a = S.allots.find(x => x.code === code) || {};
    const f = FOLD.has(code);
    return `<div class="grp-h ${f ? 'folded' : ''}" data-fold="${esc(code)}" role="button" tabindex="0" aria-expanded="${!f}"><span><span class="chev">▾</span> <span class="mono" style="color:var(--text);font-weight:500">${esc(code)}</span> · ${esc(a.note || '')}</span><b>${list.length} · ${fmt(sum(list, openQty))} pcs</b></div>` + (f ? '' : list.map(plCard).join('')); }).join('');
  const recentRev = st => S.packs.some(k => k.store === st && isVoid(k) && ageDays(k.voidedAt) <= 2) || S.pls.some(p => p.store === st && (p.returns || []).some(r => ageDays(r.at) <= 2));
  const poolCard = ([st, rows]) => {
    const pls = [...new Map(rows.map(r => [r.pl.id, r.pl])).values()], last = pls.map(p => p.doneAt).sort().pop();
    const ex = sum([...A.values()].filter(x => x.st === st), x => x.excess);
    const pill = ex ? '' : recentRev(st) ? '<span class="pill">↺ ada mundur</span>' : '';
    return `<button class="kc ${ex ? 'cut stamped' : ''}" data-open="pool:${st}${ex ? ':rack' : ''}">${top(esc(store(st).name), 0, pill)}
      ${rest(`${esc(st)} · ${pls.length > 1 ? pls.length + ' picklist' : esc(pls[0].allotCode)}`, sum(rows, r => r.left), `pcs · ${new Set(rows.map(r => r.sku)).size} SKU`, ex ? '' : ago(last))}${ex ? stamp('bad', 'Dibatalkan', `${fmt(ex)} pcs ke rak`) : ''}</button>`;
  };
  const reqCard = r => `<button class="kc cut stamped" data-open="req:${r.id}">${top(esc(store(r.store).name), 0, `<span class="pill bad">${ago(r.createdAt)}</span>`)}
      ${rest(`${esc(r.store)} · ${esc(r.allotCode)} · ${esc(decisionText(r))}`, sum(r.lines, l => l.qty), 'pcs ditarik', '')}${stamp('bad', 'Dibatalkan', 'oleh MD')}</button>`;
  const koliCard = k => {
    const on = SEL.has(k.id), hit = reqs.some(r => r.store === k.store && k.lines.some(l => l.allotCode === r.allotCode && r.lines.some(x => x.sku === l.sku)));
    return `<div class="kc sel-card ${on ? 'is-picked' : hit ? 'cut' : ''}">
      <div class="kc-top"><button class="open" data-open="koli:${k.id}"><span class="kc-title mono">${esc(k.code)}</span></button>
        ${canDisp ? `<label class="chk w" title="Pilih untuk dispatch"><input type="checkbox" data-sel="${k.id}" ${on ? 'checked' : ''} aria-label="Pilih ${esc(k.code)} untuk dispatch"></label>` : ''}</div>
      <button class="open" data-open="koli:${k.id}">${rest(hit ? '<span class="neg">Ada barang dibatalkan · bongkar</span>' : `${esc(store(k.store).name)} · ${esc(k.store)}`, koliQty(k), `pcs · ${k.lines.length} SKU`, ago(k.createdAt))}</button></div>`;
  };
  const sjCard = s => {
    const L = sjLines(s);
    if (s.status === 'transit') {
      const old = ageDays(s.createdAt) > 3;
      return `<button class="kc" data-open="sj:${s.id}">${top(esc(store(s.store).name), 0, `<span class="pill ${old ? 'warn' : 'info'}">${ago(s.createdAt)}</span>`)}
        ${rest(`<span class="mono">${esc(s.no)}</span>`, sum(L, l => l.qty), `pcs · ${s.koli} koli`, dshort(s.createdAt))}</button>`;
    }
    const g = sum(L, gapOf), v = sum(L, l => (l.recv ?? l.qty) - l.qty);
    const open = g && !s.resolved;
    const mark = open ? stamp('warn', 'Selisih', `−${fmt(g)} pcs`) : stamp('ok', 'Diterima', v ? 'selisih ditutup' : dshort(s.receivedAt));
    return `<button class="kc stamped ${open ? 'gap' : 'done-dim'}" data-open="sj:${s.id}">${top(esc(store(s.store).name), 0, open ? `<span class="pill warn">${dshort(s.receivedAt)}</span>` : '')}
      ${rest(`<span class="mono">${esc(s.no)}</span>`, sum(L, l => Math.min(l.recv ?? l.qty, l.qty) + (l.found || 0)), `pcs · ${s.koli} koli`, '')}${mark}</button>`;
  };
  const allSel = koli.length && koli.every(k => SEL.has(k.id));
  const selTool = koli.length && canDisp ? `<button class="btn quiet sm w" data-selall="${allSel ? 0 : 1}">${allSel ? 'Batal' : 'Pilih semua'}</button>` : '';
  const counts = { pick: openPl.length, picked: poolCards.length, packed: koli.length + reqs.length, transit: tr.length, recv: rc.length };
  const qtys = { pick: t.toPick, picked: t.toPack, packed: t.toDisp, transit: t.transit, recv: t.recv };
  const slimOf = {}; LANES.forEach(k => (slimOf[k] = !counts[k] && !qtys[k])); BOARD_SLIM = slimOf;
  const names = { pick: 'Picklist', picked: 'Picked', packed: 'Packed', transit: 'In transit', recv: 'Received' };
  $('#view-board').innerHTML = `<div class="mseg" role="group" aria-label="Tahap">${Object.keys(names).map(k => `<button data-mlane="${k}" aria-pressed="${MLANE === k}"><span class="dot" style="background:${STAGE[k]}"></span>${names[k]}<span class="count">${counts[k]}</span></button>`).join('')}</div>
    <div class="board-wrap"><div class="board" id="boardGrid" style="grid-template-columns:${laneTpl(slimOf)}">
    ${lane('pick', 'Picklist', t.toPick, 'belum pick', openPl.length, 'Selesaikan picklist', plGroups)}
    ${lane('picked', 'Picked', t.toPack, 'belum pack', poolCards.length, 'Buat koli · kembalikan ke rak', poolCards.map(poolCard).join(''))}
    ${lane('packed', 'Packed', t.toDisp, 'belum dispatch', koli.length, 'Dispatch · bongkar', reqs.map(reqCard).join('') + koli.map(koliCard).join(''), selTool)}
    ${lane('transit', 'In transit', t.transit, 'di jalan', tr.length, 'Toko konfirmasi terima', tr.map(sjCard).join(''))}
    ${lane('recv', 'Received', t.recv, 'diterima', rc.length, 'Selisih ke Inventory', rc.map(sjCard).join('') + (rcOld ? `<div class="lane-more">${rcOld} surat jalan lebih dari 7 hari ada di tab Per toko</div>` : ''))}
  </div></div>`;
}

/* Sebaran: one stage at a time, columns are stores or suppliers. Supplier columns split a doc by its lines, so pcs never count twice. */
function renderSpread() {
  const STG = { pick: 'Picklist', picked: 'Picked', packed: 'Packed' }, bySup = SP.col !== 'store';
  const items = {
    pick: () => S.pls.filter(p => p.status === 'open' && openQty(p) > 0 && plIn(p) && qHit(plTxt(p))).map(p => ({ open: `pl:${p.id}`, st: p.store, code: p.allotCode, sub: p.blocked ? 'Rak kurang' : p.resend ? 'Kirim ulang' : p.repick ? 'Pick ulang' : '', lines: p.lines, at: p.createdAt, cut: p.cut })),
    picked: () => Object.entries(pool()).map(([st, rows]) => { const pls = [...new Set(rows.map(r => r.pl.allotCode))];
      return { open: `pool:${st}`, st, code: pls.length > 1 ? `${pls.length} allotment` : pls[0], lines: rows.map(r => ({ sku: r.sku, qty: r.left })), at: rows.map(r => r.pl.doneAt).sort().pop(), txt: rows.flatMap(r => [r.pl.code, r.pl.allotCode, r.sku, art(r.sku).name]) }; }),
    packed: () => S.packs.filter(k => !k.sjId && koliIn(k)).map(k => ({ open: `koli:${k.id}`, st: k.store, code: k.code, lines: k.lines.filter(l => inAllot(l.allotCode)), at: k.createdAt, txt: [k.code] })),
  };
  const qOf = x => sum(x.lines, l => l.qty);
  // every card (or its supplier part) lands in one column, tagged with its stage; pcs never count twice
  const cols = new Map(), put = (k, v) => (cols.get(k) || cols.set(k, []).get(k)).push(v);
  Object.keys(STG).forEach(stg => items[stg]().filter(x => !x.txt || qHit([x.st, store(x.st).name, ...x.txt, ...x.lines.flatMap(l => [l.sku, art(l.sku).name])])).forEach(x => {
    if (!bySup) return put(x.st, { ...x, stg });
    const by = {}; x.lines.forEach(l => (by[skuSup(l.sku)] = by[skuSup(l.sku)] || []).push(l)); const n = Object.keys(by).length;
    Object.entries(by).forEach(([sp, ls]) => put(sp, { ...x, stg, part: n > 1, whole: qOf(x), lines: ls }));
  }));
  const colQ = k => sum(cols.get(k) || [], qOf);
  const keys = bySup ? [...cols.keys()].sort((a, b) => (a === NOSUP) - (b === NOSUP) || colQ(b) - colQ(a))
    : S.stores.filter(s => inStore(s.code)).sort((a, b) => a.order - b.order).map(s => s.code);
  const card = x => {
    const q = qOf(x), title = bySup ? esc(store(x.st).name) : `<span class="mono">${esc(x.code)}</span>`;
    const sub = bySup ? `${esc(x.st)} · <span class="mono">${esc(x.code)}</span>` : x.sub ? `<span class="warn-t">${esc(x.sub)}</span>` : esc(supplierOf({ lines: x.lines }));
    return `<button class="kc ${x.cut ? 'cut stamped' : ''}" data-open="${x.open}">${top(title, 0)}${rest(sub, q, x.part ? `dari ${fmt(x.whole)} pcs` : `pcs · ${x.lines.length} SKU`, x.cut ? '' : ago(x.at))}${x.cut ? stamp('bad', 'Dibatalkan', `−${fmt(x.cut)} pcs`) : ''}</button>`;
  };
  const column = k => {
    const c = cols.get(k) || [], name = bySup ? k : store(k).name;
    if (!c.length) return `<section class="lane slim" aria-label="${esc(name)}, kosong" title="${esc(name)}: kosong"><span class="vt">${esc(bySup ? name : k + ' · ' + name)}</span><span class="n">0</span></section>`;
    const q = colQ(k), per = Object.keys(STG).map(stg => { const l = c.filter(x => x.stg === stg); return { stg, l, q: sum(l, qOf) }; });
    const body = per.filter(g => g.l.length).map(g => `<div class="grp-h"><span><span class="dot" style="background:${STAGE[g.stg]}"></span> <span style="color:var(--text);font-weight:500">${STG[g.stg]}</span></span><b>${g.l.length} · ${fmt(g.q)} pcs</b></div>` +
      g.l.sort((a, b) => String(a.at).localeCompare(String(b.at))).map(card).join('')).join('');
    return `<section class="lane" aria-label="${esc(name)}"><div class="lane-h"><div class="lane-t"><h2 style="${k === NOSUP ? 'color:var(--warn-fg)' : ''}">${esc(name)}</h2><span class="n">${c.length}</span></div>
      <div class="sub">${bySup ? (k === NOSUP ? 'SKU tanpa PO' : `${new Set(c.map(x => x.st)).size} toko`) : esc(k + ' · ' + (store(k).city || ''))}</div>
      <div class="lane-q"><b>${fmt(q)}</b><span>pcs belum dikirim</span></div>
      <div class="stack sp-stack" role="img" aria-label="${per.map(g => `${STG[g.stg]} ${g.q} pcs`).join(', ')}">${per.map(g => g.q ? `<i style="width:${(g.q / q * 100).toFixed(1)}%;background:${STAGE[g.stg]}"></i>` : '').join('')}</div>
      <div class="sp-leg">${per.map(g => `<span><span class="dot" style="background:${STAGE[g.stg]}"></span>${fmt(g.q)}</span>`).join('')}</div></div>
      <div class="lane-b">${body}</div></section>`;
  };
  const all = [...cols.values()].flat(), total = sum(all, qOf), used = keys.filter(k => cols.has(k)).length;
  $('#view-spread').innerHTML = `<div class="sp-head">
      <div class="seg" role="group" aria-label="Kolom">${[['sup', 'Per supplier'], ['store', 'Per toko']].map(([k, l]) => `<button data-spc="${k}" aria-selected="${SP.col === k || (k === 'sup' && bySup)}">${l}</button>`).join('')}</div>
      <span class="sp-legend">${Object.entries(STG).map(([k, l]) => `<span><span class="dot" style="background:${STAGE[k]}"></span>${l}</span>`).join('')}</span>
      <span class="spacer" style="flex:1"></span>
      <span class="sp-sum"><b>${fmt(total)}</b>pcs di gudang · ${used} ${bySup ? 'supplier' : 'toko'}</span></div>
    ${all.length ? `<div class="spread">${keys.map(column).join('')}</div>` : '<div class="empty">Tidak ada barang di gudang untuk filter ini.</div>'}`;
}

function renderStores() {

      ${c(t.allot)}${c(t.toPick)}${c(t.toPack)}${c(t.toDisp)}${c(t.transit)}${c(t.recv)}<td class="r ${t.gap ? 'neg' : 'dim'}">${t.gap ? '−' + fmt(t.gap) : '–'}</td>${c(t.closed)}<td>${stack(t)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total 13 toko</td><td class="r">${fmt(all.allot)}</td><td class="r">${fmt(all.toPick)}</td><td class="r">${fmt(all.toPack)}</td><td class="r">${fmt(all.toDisp)}</td><td class="r">${fmt(all.transit)}</td><td class="r">${fmt(all.recv)}</td><td class="r">${all.gap ? '−' + fmt(all.gap) : '–'}</td><td class="r">${all.closed ? fmt(all.closed) : '–'}</td><td>${stack(all)}</td></tr></tfoot></table></div></div>`;
}

/* inbound */
const todayISO = () => new Date().toISOString().slice(0, 10);
function poState(po) {
  const rec = {}; S.grns.filter(g => g.type === 'po' && g.refId === po.id).forEach(g => g.lines.forEach(l => (rec[l.sku] = (rec[l.sku] || 0) + l.counted)));
  const lines = po.lines.map(l => ({ ...l, rec: rec[l.sku] || 0, left: Math.max(0, l.qty - (rec[l.sku] || 0)) }));
  return { lines, qty: sum(lines, l => l.qty), rec: sum(lines, l => l.rec), left: po.status === 'closed' ? 0 : sum(lines, l => l.left) };
}
function renderInbound() {

  const rtOpen = S.rets.filter(r => r.status === 'transit' && inStore(r.store) && qHit([r.no, r.store, store(r.store).name, r.reason, ...r.lines.map(l => l.sku)])).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
  const poCard = p => { const st = poState(p), late = p.eta && p.eta < todayISO();
    return `<button class="kc" data-open="po:${p.id}">${top(esc(p.supplier), 0, p.eta ? `<span class="pill ${late ? 'warn' : 'info'}">${late ? 'Terlambat' : 'ETA ' + dshort(p.eta)}</span>` : '')}
      ${rest(`<span class="mono">${esc(p.no)}</span>`, st.left, `pcs sisa · ${st.lines.filter(l => l.left > 0).length} SKU`, st.rec ? `${Math.round(st.rec / st.qty * 100)}% datang` : 'belum datang')}</button>`; };
  const rtCard = r => `<button class="kc" data-open="ret:${r.id}">${top(esc(store(r.store).name), 0, `<span class="pill info">${ago(r.createdAt)}</span>`)}
      ${rest(`<span class="mono">${esc(r.no)}</span>`, sum(r.lines, l => l.qty), `pcs · ${esc(r.reason || '')}`, dshort(r.createdAt))}</button>`;
  const grnCard = g => { const v = sum(g.lines, l => l.counted - l.expected), who = g.type === 'po' ? esc(g.supplier) : esc(store(g.store).name);
    const pill = g.type === 'po' ? (v > 0 ? `<span class="pill ${g.resolved ? 'done' : 'warn'}">+${fmt(v)} pcs</span>` : g.complete ? '<span class="pill ok">Lengkap</span>' : '<span class="pill">Sebagian</span>')
      : (v ? `<span class="pill ${g.resolved ? 'done' : 'bad'}">${signed(v)} pcs</span>` : '<span class="pill ok">Sesuai</span>');
    return `<button class="kc" data-open="grn:${g.id}">${top(who, 0, pill)}${rest(`<span class="mono">${esc(g.no)}</span>`, sum(g.lines, l => l.counted), `pcs · ${g.lines.filter(l => l.counted).length} SKU`, dshort(g.createdAt))}</button>`; };

    <div class="rail-lane" data-label="Sudah dihitung · 7 hari">${poGrn.map(grnCard).join('') || emptyBox('Belum ada penerimaan')}</div></section>`;

/* Ops: a request from Merchandise to pull goods out of koli */

}

function shPool() {
  const st = DR.id, rack = DR.mode === 'rack', rows = pool(false)[st] || [], A = acc(), canOps = may('makeKoli');
  const exLeft = {};
  const R = rows.map(r => { const k = r.pl.allotCode + '|' + r.sku; if (!(k in exLeft)) exLeft[k] = (A.get(r.pl.allotCode + '|' + st + '|' + r.sku) || {}).excess || 0; const ex = Math.min(r.left, exLeft[k]); exLeft[k] -= ex; return { ...r, ex, ok: r.left - ex }; });
  const totEx = sum(R, r => r.ex), pls = [...new Map(R.map(r => [r.pl.id, r.pl])).values()];
  const waiting = S.packs.filter(k => k.store === st && !k.sjId && !isVoid(k)).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
  const revs = [...S.packs.filter(k => k.store === st && isVoid(k)).map(k => [k.voidedAt, 'ops', `Membongkar ${esc(k.code)} · ${esc(k.voidReason || '')}`]),
    ...S.pls.filter(p => p.store === st).flatMap(p => (p.returns || []).map(r => [r.at, 'ops', `Kembalikan ke rak ${fmt(r.qty)} pcs ${esc(r.sku)} · ${esc(r.reason)}`]))].sort((x, y) => y[0].localeCompare(x[0])).slice(0, 8);
  const seg = canOps && R.length ? `<div class="seg" role="group" style="margin-bottom:14px"><button data-mode="" aria-selected="${!rack}">Buat koli</button><button data-mode="rack" aria-selected="${rack}">Kembalikan ke rak</button></div>` : '';
  const exNote = totEx ? `<div class="note warn" style="margin:0 0 14px">${fmt(totEx)} pcs di pick area sudah tidak dijanjikan karena Merchandise menutup janjinya. ${rack ? 'Kembalikan ke rak di bawah.' : 'Barang ini tidak bisa dipack.'}</div>` : '';
  let table = '<div class="note ok" style="margin-top:0">Semua barang picked toko ini sudah masuk koli.</div>';
  if (R.length) table = `<table class="mini"><thead><tr><th>Artikel</th><th class="r">Di pick area</th>${rack ? '' : '<th class="r">Tanpa janji</th>'}<th class="r">${rack ? 'Kembali ke rak' : 'Masuk koli ini'}</th></tr></thead><tbody>`
    + pls.map(p => `<tr class="grp"><td colspan="${rack ? 3 : 4}"><span class="mono ink">${esc(p.code)}</span> · ${esc(p.allotCode)} · selesai ${fdt(p.doneAt)}</td></tr>` + R.filter(r => r.pl.id === p.id).map(r => {
        const max = rack ? r.left : r.ok, def = rack ? r.ex : r.ok, id = `${rack ? 'rk' : 'pc'}-${p.id}-${esc(r.sku)}`;
        const inp = canOps ? `<input class="num-in" type="number" inputmode="numeric" min="0" max="${max}" value="${def || (rack ? '' : 0)}" ${rack ? 'data-rk' : 'data-key'}="${p.id}|${esc(r.sku)}" data-max="${max}" data-allot="${esc(p.allotCode)}" id="${id}" aria-label="${esc(r.sku)}">` : '<span class="dim">–</span>';
        return `<tr>${artCell(r.sku)}<td class="r">${fmt(r.left)}</td>${rack ? '' : `<td class="r ${r.ex ? 'neg' : 'dim'}">${r.ex ? fmt(r.ex) : '–'}</td>`}<td class="r">${inp}</td></tr>`; }).join('')).join('') + '</tbody></table>'
    + (rack ? `<label class="field w" style="margin-top:14px;max-width:320px"><span class="lbl">Alasan</span><select class="sel" id="rkReason">${['Tanpa janji', 'Salah ambil', 'Barang rusak', 'Lainnya'].map(x => `<option ${x === (totEx ? 'Tanpa janji' : 'Salah ambil') ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <div class="note info">Kalau yang dikembalikan ternyata masih dijanjikan, sistem membuat picklist <b>pick ulang</b> untuk toko ini.</div>`
      : '<div class="note info">Boleh pack sebagian. Satu koli bisa berisi barang dari beberapa picklist toko ini.</div>');
  const wl = waiting.length ? `<div class="sect"><h4>Koli menunggu dispatch <span class="count">${waiting.length}</span></h4></div><div class="list">${waiting.map(k => `<button class="linkrow" data-open="koli:${k.id}"><div><div class="mono ink">${esc(k.code)}</div><div class="mute">${k.lines.map(l => esc(l.sku) + ' ×' + l.qty).join(', ')}</div></div><div><b class="num">${fmt(koliAll(k))}</b> pcs</div></button>`).join('')}</div>` : '';
  const rv = revs.length ? `<div class="sect"><h4>Riwayat mundur</h4></div>${tlHtml(revs)}` : '';
  const foot = rack ? `<span class="grow" id="pkSum"></span>${gate('returnRack', '<button class="btn primary w" data-act="returnRack">Kembalikan ke rak</button>')}`
    : `<span class="grow" id="pkSum"></span>${waiting.length && may('dispatch') ? `<button class="btn w" data-seltore="${esc(st)}">Pilih ${waiting.length} koli untuk dispatch</button>` : ''}${R.length ? gate('makeKoli', '<button class="btn primary w" data-act="makeKoli">Buat koli</button>') : ''}`;
  return head(`Picked · ${esc(st)}`, esc(store(st).name), totEx ? `<span class="pill warn">${fmt(totEx)} tanpa janji</span>` : '', `${pls.length} picklist · ${fmt(sum(R, r => r.left))} pcs di pick area`)
    + `<div class="sh-b">${seg}${exNote}${table}${wl}${rv}</div><div class="sh-f">${foot}</div>`;
}

function shKoli() {
  const k = S.packs.find(x => x.id === DR.id); if (!k) return head('', 'Koli tidak ditemukan');
  const sj = S.sjs.find(s => s.id === k.sjId), v = isVoid(k);
  const pill = v ? '<span class="pill done">Dibongkar</span>' : sj ? (sj.status === 'received' ? '<span class="pill ok">Diterima</span>' : '<span class="pill info">In transit</span>') : '<span class="pill">Menunggu dispatch</span>';
  const plCode = id => (S.pls.find(p => p.id === id) || {}).code || id;
  const confirm = DR.mode === 'confirm' && !v && !sj;
  let foot;
  if (v) foot = `<span class="grow">Dibongkar ${fdt(k.voidedAt)} · ${esc(k.voidReason || '')}</span>`;
  else if (sj) foot = `<span class="grow"></span><button class="btn" data-open="sj:${sj.id}">Buka surat jalan</button>`;
  else if (confirm) foot = `<button class="btn quiet" data-mode="">Batal</button><span class="grow"></span>${gate('unpack', '<button class="btn w" data-act="unpackRack" title="Lompat mundur: isi langsung kembali ke rak">Bongkar &amp; kembalikan ke rak</button><button class="btn danger w" data-act="unpack">Bongkar, isi ke Picked</button>')}`;
  else foot = `${may('unpack') ? '<button class="btn quiet w" data-mode="confirm">Bongkar koli</button>' : ''}<span class="grow"></span>${may('dispatch') ? `<button class="btn w" data-toggle="${k.id}">${SEL.has(k.id) ? 'Batal pilih' : 'Pilih untuk dispatch'}</button><button class="btn primary w" data-dispatch-one="${k.id}">${IC.truck}Dispatch koli ini</button>` : gate('dispatch', '')}`;
  return head('Koli', `<span class="mono">${esc(k.code)}</span>`, pill, `ke ${esc(k.store)} ${esc(store(k.store).name)}`)
    + `<div class="sh-b">${facts([['Tujuan', `${esc(k.store)} · ${esc(store(k.store).name)}`], ['Dibuat', fdt(k.createdAt)], ['Isi', `${fmt(koliAll(k))} pcs · ${k.lines.length} SKU`], ['Surat jalan', sj ? `<span class="mono">${esc(sj.no)}</span>` : '–']])}
      <div class="sect" style="margin-top:0"><h4>Isi koli</h4></div><table class="mini"><thead><tr><th>Artikel</th><th>Picklist</th><th class="r">Qty</th></tr></thead>
      <tbody>${k.lines.map(l => `<tr>${artCell(l.sku)}<td class="sku">${esc(plCode(l.picklistId))}</td><td class="r">${fmt(l.qty)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td></td><td class="r">${fmt(koliAll(k))}</td></tr></tfoot></table>
      ${confirm ? `<label class="field" style="margin-top:16px"><span class="lbl">Alasan bongkar <span class="req">*</span></span><select class="sel" id="upReason">${['Salah SKU', 'Salah toko', 'Segel rusak', 'Isi tidak sesuai label', 'Permintaan Merchandise', 'Lainnya'].map(x => `<option>${x}</option>`).join('')}</select></label>
        <div class="note warn">Koli jadi <b>VOID</b>, tidak dihapus: riwayatnya tetap ada. Janji ke toko tidak berubah.<br><b>Bongkar, isi ke Picked</b>: isinya siap dikemas ulang dengan nomor koli baru.<br><b>Bongkar &amp; kembalikan ke rak</b>: lompat mundur dua tahap. Yang masih dijanjikan muncul lagi sebagai picklist pick ulang.</div>` : ''}
      ${v ? `<div class="note warn">Koli ini sudah dibongkar: ${esc(k.voidReason || '')}. Isinya kembali ke Picked ${esc(k.store)}.</div>` : ''}
    </div><div class="sh-f">${foot}</div>`;
}

function shDispatch() {
  const ids = DR.id ? [DR.id] : [...SEL];
  const ks = S.packs.filter(k => ids.includes(k.id) && !k.sjId && !isVoid(k));
  const groups = {}; ks.forEach(k => (groups[k.store] = groups[k.store] || []).push(k));
  const G = Object.entries(groups).sort();
  return head('Dispatch', `${ks.length} koli · ${G.length} surat jalan`, '', 'Satu surat jalan per toko tujuan. Setelah truk berangkat, tidak ada yang bisa dimundurkan.')
    + `<div class="sh-b">${G.map(([st, list], gi) => `<div class="sect" ${gi ? '' : 'style="margin-top:0"'}><h4>${esc(st)} · ${esc(store(st).name)}</h4><span class="body">${list.length} koli · ${fmt(sum(list, koliAll))} pcs</span></div>
        <div class="list">${list.map(k => `<div class="li"><div><div class="a">${esc(k.code)}</div><div class="b">${k.lines.map(l => esc(l.sku) + ' ×' + l.qty).join(', ')}</div></div><div><b class="num">${fmt(koliAll(k))}</b> pcs</div></div>`).join('')}</div>`).join('') || '<div class="empty">Tidak ada koli yang dipilih.</div>'}
      <div class="sect"><h4>Pengiriman</h4></div>
      <div class="row2"><label class="field"><span class="lbl">Kendaraan / plat no.</span><input class="inp" id="dVeh" placeholder="B 1234 XYZ"></label><label class="field"><span class="lbl">Driver</span><input class="inp" id="dDrv" placeholder="Nama driver"></label></div>
    </div><div class="sh-f"><span class="grow">${fmt(sum(ks, koliAll))} pcs keluar dari HO</span>${gate('dispatch', `<button class="btn primary" data-act="dispatch" ${ks.length ? '' : 'disabled'}>${IC.truck}Terbitkan ${G.length} surat jalan</button>`)}</div>`;
}

function shSj() {
  const s = S.sjs.find(x => x.id === DR.id); if (!s) return head('', 'Surat jalan tidak ditemukan');
  const tr = s.status === 'transit', v = sum(s.lines, l => (l.recv ?? l.qty) - l.qty), gap = sum(s.lines, gapOf), canRecv = may('receive') && S.canWrite;
  const koli = S.packs.filter(k => k.sjId === s.id);
  const lines = s.lines.map((l, i) => ({ ...l, i })).sort((a, b) => a.allotCode.localeCompare(b.allotCode) || a.sku.localeCompare(b.sku));
  const pill = tr ? '<span class="pill info">In transit</span>' : gap && !s.resolved ? `<span class="pill bad">Kurang ${fmt(gap)}</span>` : v ? '<span class="pill done">Selisih ditutup</span>' : '<span class="pill ok">Diterima sesuai</span>';
  let tail = '', foot = '';
  if (tr) {
    if (canRecv) tail = `<div class="field w" style="margin-top:16px"><span class="lbl">Catatan penerimaan</span><textarea class="inp" id="rcNote" rows="2" placeholder="Wajib jika ada selisih. Contoh: koli 2 segel rusak"></textarea></div>`;
    foot = `<span class="grow" id="rcSum">Isi qty terima sesuai hitungan fisik di toko.</span>${gate('receive', '<button class="btn primary w" data-act="receive">Konfirmasi diterima</button>')}`;
  } else {
    if (s.receiveNote) tail += `<div class="note warn">Catatan toko: ${esc(s.receiveNote)}</div>`;
    if (s.resolved && v) tail += `<div class="note ok">${s.outcome === 'lost' ? 'Hilang: dikirim ulang lewat picklist baru.' : 'Ditemukan: dihitung sebagai diterima.'} ${esc(s.resolveNote || '')}</div>`;
    else if (gap) {
      tail += may('resolve') ? `<div class="sect"><h4>Hasil investigasi Inventory</h4></div><div class="decide">
        <label class="radio"><input type="radio" name="rsOut" value="found"> Ditemukan: dihitung sebagai diterima toko</label>
        <label class="radio"><input type="radio" name="rsOut" value="lost"> Hilang: janji kembali ke Belum dipack, Ops kirim ulang</label>
        <label class="field"><span class="lbl">Catatan <span class="req">*</span></span><textarea class="inp" id="rsNote" rows="2" placeholder="Contoh: klaim ke ekspedisi"></textarea></label></div>` : '<div class="note info">Selisih ini kasus Inventory: ditemukan atau dinyatakan hilang. Toko tidak perlu konfirmasi ulang.</div>';
      foot = `<span class="grow">Selisih tampil di Kontrol stok sampai diputuskan.</span>${gate('resolve', '<button class="btn primary w" data-act="resolve">Tutup selisih</button>')}`;
    }
  }
  return head(esc(s.no), esc(store(s.store).name), pill, `Surat jalan HO ke ${esc(s.store)} · ${esc(store(s.store).city || '')}`)
    + `<div class="sh-b">${facts([['Dispatch', fdt(s.createdAt)], ['Diterima', s.receivedAt ? fdt(s.receivedAt) : '–'], ['Kendaraan', esc(s.vehicle || '–')], ['Driver', esc(s.driver || '–')], ['Koli', `${s.koli} koli`], ['Isi', `${fmt(sum(s.lines, l => l.qty))} pcs · ${s.lines.length} SKU`]])}
      <div class="sect" style="margin-top:0"><h4>Koli di surat jalan ini</h4></div><div style="display:flex;flex-wrap:wrap;gap:4px">${koli.map(k => `<button class="tag" style="border:0;cursor:pointer" data-open="koli:${k.id}">${esc(k.code)}</button>`).join('')}</div>
      <div class="sect"><h4>Barang</h4>${tr && canRecv ? '<span class="w"><button class="btn quiet sm" data-fill="sent">Isi sesuai kirim</button></span>' : ''}</div>
      <table class="mini"><thead><tr><th>Artikel</th><th>Allotment</th><th class="r">Kirim</th><th class="r">Terima</th>${tr ? '' : '<th class="r">Selisih</th>'}</tr></thead>
      <tbody>${lines.map(l => { const d = (l.recv ?? l.qty) - l.qty; return `<tr>${artCell(l.sku)}<td class="sku">${esc(l.allotCode)}</td><td class="r">${fmt(l.qty)}</td>
        <td class="r">${tr ? (canRecv ? `<input class="num-in" type="number" inputmode="numeric" min="0" value="${l.qty}" data-i="${l.i}" data-sent="${l.qty}" id="rc-${l.i}" aria-label="Terima ${esc(l.sku)}">` : '–') : fmt(l.recv ?? l.qty)}</td>
        ${tr ? '' : `<td class="r ${d ? 'neg' : 'dim'}">${d ? signed(d) : '–'}</td>`}</tr>`; }).join('')}</tbody>
      <tfoot><tr><td>Total</td><td></td><td class="r">${fmt(sum(s.lines, l => l.qty))}</td><td class="r" id="rcTot">${fmt(sum(s.lines, l => l.recv ?? l.qty))}</td>${tr ? '' : `<td class="r ${v ? 'neg' : ''}">${v ? signed(v) : '–'}</td>`}</tr></tfoot></table>
      ${tail}</div>${foot ? `<div class="sh-f">${foot}</div>` : ''}`;
}

function shNewAllot() {
  if (!NA) NA = { note: '', stores: S.stores.map(s => s.code), skus: [], qty: {} };
  const L = ledger(), avail = sku => (L.find(r => r.sku === sku) || {}).available ?? 0;
  const stores = S.stores.slice().sort((a, b) => a.order - b.order), sel = stores.filter(s => NA.stores.includes(s.code));
  const tt = sku => sum(sel, s => +NA.qty[sku + '|' + s.code] || 0);
  const grand = sum(NA.skus, tt), over = NA.skus.filter(sku => tt(sku) > avail(sku));
  const nPl = sel.filter(s => NA.skus.some(k => +NA.qty[k + '|' + s.code] > 0)).length;
  const opts = S.articles.filter(a => !NA.skus.includes(a.sku)).sort((a, b) => a.sku.localeCompare(b.sku)).map(a => `<option value="${esc(a.sku)}">${esc(a.sku)} · ${esc(a.name)} (available ${fmt(avail(a.sku))})</option>`).join('');
  const grid = NA.skus.length ? `<div class="tbl-wrap"><table class="mini grid-in"><thead><tr><th>Artikel</th><th class="r">Available</th><th class="r">Isi semua</th>${sel.map(s => `<th class="c" title="${esc(s.name)}">${esc(s.code)}</th>`).join('')}<th class="r">Total</th><th></th></tr></thead>
    <tbody>${NA.skus.map(sku => { const t = tt(sku), a = avail(sku); return `<tr>${artCell(sku)}<td class="r">${fmt(a)}</td>
      <td class="r"><input class="num-in" type="number" min="0" inputmode="numeric" data-fillrow="${esc(sku)}" id="fr-${esc(sku)}" placeholder="qty" aria-label="Isi semua toko ${esc(sku)}"></td>
      ${sel.map(s => `<td class="c"><input class="num-in ${t > a ? 'bad' : ''}" type="number" min="0" inputmode="numeric" data-cell="${esc(sku)}|${s.code}" id="c-${esc(sku)}-${s.code}" value="${NA.qty[sku + '|' + s.code] || ''}" aria-label="${esc(sku)} ${s.code}"></td>`).join('')}
      <td class="r ${t > a ? 'neg' : 'ink'}">${fmt(t)}</td><td><button class="xbtn" data-rmsku="${esc(sku)}" aria-label="Hapus ${esc(sku)}">${IC.x}</button></td></tr>`; }).join('')}</tbody></table></div>`
    : '<div class="empty" style="border:1px dashed var(--hairline-2);border-radius:var(--r-card)">Tambahkan artikel untuk mulai mengisi qty per toko.</div>';
  return head('Allotment baru', 'Alokasi artikel ke toko', '', 'Setiap toko yang mendapat qty langsung punya 1 picklist di papan Ops.')
    + `<div class="sh-b"><label class="field"><span class="lbl">Nama allotment</span><input class="inp" id="naNote" value="${esc(NA.note)}" placeholder="Contoh: Replenishment minggu 40"></label>
      <div class="sect"><h4>Toko tujuan <span class="count">${sel.length}/13</span></h4><span><button class="btn quiet sm" data-stall="1">Semua</button><button class="btn quiet sm" data-stall="0">Kosongkan</button></span></div>
      <div class="stchips">${stores.map(s => `<button class="stc" data-st="${s.code}" aria-pressed="${NA.stores.includes(s.code)}"><span class="mono">${s.code}</span>${esc(s.name)}</button>`).join('')}</div>
      <div class="sect"><h4>Artikel dan qty</h4></div>
      <div class="row2" style="margin-bottom:12px"><select class="sel" id="naSku" style="flex:1 1 280px"><option value="">Pilih artikel…</option>${opts}</select><button class="btn" data-act="addSku">Tambah</button></div>
      ${grid}${over.length ? `<div class="note bad">Qty melebihi stok available HO untuk ${over.map(esc).join(', ')}. Kurangi qty atau adjust stok dulu.</div>` : ''}</div>
    <div class="sh-f"><span class="grow"><b class="num" style="color:var(--ink)">${fmt(grand)}</b> pcs · ${nPl} picklist akan dibuat</span>${gate('createAllot', `<button class="btn primary" data-act="createAllot" ${!grand || over.length || !sel.length ? 'disabled' : ''}>Buat allotment</button>`)}</div>`;
}

function shAdjust() {
  const r = ledger().find(x => x.sku === DR.id); if (!r) return head('', 'Artikel tidak ditemukan');
  const hist = S.adjs.filter(a => a.sku === r.sku).sort((a, b) => b.at.localeCompare(a.at));
  const line = (k, v, strong, cls = '') => `<tr><td style="${strong ? 'color:var(--ink);font-weight:600' : ''}">${k}</td><td class="r ${cls}" style="${strong ? 'color:var(--ink);font-weight:600' : ''}">${v}</td></tr>`;
  return head(esc(r.sku), esc(r.name), r.shortfall ? '<span class="pill bad">Shortfall</span>' : r.blocked ? '<span class="pill warn">Rak kurang</span>' : '<span class="pill ok">OK</span>', 'Stok HO')
    + `<div class="sh-b"><div class="sect" style="margin-top:0"><h4>Rincian stok</h4></div>
      <table class="mini"><tbody>
        ${line('Stok awal', fmt(r.stock))}${line('Adjust', r.adj ? signed(r.adj) : '0', 0, r.adj ? 'neg' : '')}${line('Masuk (PO + retur)', '+' + fmt(r.inbound))}${line('Keluar (surat jalan)', '−' + fmt(r.dispatched))}${line('On-hand HO', fmt(r.onHand), 1)}
        ${line('Janji ke toko', fmt(r.allotted))}${line('Ditutup Merchandise', r.closed ? '−' + fmt(r.closed) : '0')}${line('Sudah keluar', '−' + fmt(r.dispatched))}${r.lost ? line('Hilang, dikirim ulang', '+' + fmt(r.lost)) : ''}${line('Reserved', fmt(r.reserved), 1)}
        ${line('Available', fmt(r.available), 1)}${r.shortfall ? line('Shortfall', fmt(r.shortfall), 1, 'neg') : ''}
      </tbody></table>
      ${facts([['Akan masuk (PO + retur)', fmt(r.expected)], ['Staging (di HO, belum keluar)', fmt(r.staging)], ['In transit', fmt(r.transit)], ['Diterima toko', fmt(r.recv) + (r.gap ? ` <span class="neg">(−${fmt(r.gap)})</span>` : '')], ['Rak kurang (picklist tertahan)', `<span class="${r.blocked ? 'neg' : ''}">${fmt(r.blocked)}</span>`]]).replace('class="facts"', 'class="facts" style="margin-top:18px"')}
      ${may('saveAdj') ? `<div class="sect"><h4>Adjust stok</h4></div>
      <div class="row2"><label class="field"><span class="lbl">Qty adjust <span class="req">*</span></span><input class="inp" type="number" id="ajQty" inputmode="numeric" value="${r.blocked ? -r.blocked : ''}" placeholder="−5 atau 10"></label>
      <label class="field"><span class="lbl">Alasan <span class="req">*</span></span><select class="sel" id="ajReason">${['Stock opname', 'Stok rak kosong', 'Barang rusak', 'Salah input', 'Retur masuk', 'Lainnya'].map(x => `<option ${r.blocked && x === 'Stok rak kosong' ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
      <label class="field" style="margin-top:12px"><span class="lbl">Catatan</span><textarea class="inp" id="ajNote" rows="2" placeholder="Contoh: hasil cek rak B-07"></textarea></label>
      <div class="note info">Minus mengurangi stok HO. Adjust tidak mengubah janji ke toko; itu keputusan Merchandise.</div>` : '<div class="note info">Adjust stok dilakukan Inventory.</div>'}
      <div class="sect"><h4>Riwayat adjust SKU ini</h4></div>
      <table class="mini"><thead><tr><th>Waktu</th><th class="r">Qty</th><th>Alasan</th></tr></thead><tbody>${hist.length ? hist.map(a => `<tr><td>${fdt(a.at)}<div class="mute">${esc(a.note || '')}</div></td><td class="r ${a.qty < 0 ? 'neg' : 'pos'}">${signed(a.qty)}</td><td>${esc(a.reason)}</td></tr>`).join('') : '<tr><td colspan="3" class="mute">Belum ada.</td></tr>'}</tbody></table>
    </div><div class="sh-f"><span class="grow"></span>${gate('saveAdj', '<button class="btn primary w" data-act="saveAdj">Simpan adjust</button>')}</div>`;
}

function wireSheet() {
  const d = $('#sheet');

    if (DR?.type === 'pl') {
      let tp = 0, ts = 0, bad = false;
      d.querySelectorAll('input[data-max]').forEach(i => { const v = parseInt(i.value), max = +i.dataset.max, b = isNaN(v) || v < 0 || v > max; i.classList.toggle('bad', b); bad ||= b;
        const s = b ? 0 : max - v; tp += b ? 0 : v; ts += s; const c = $('#sh-' + i.dataset.i); if (c) c.innerHTML = s ? `<span class="neg">${fmt(s)}</span>` : '<span class="dim">–</span>'; });
      if ($('#pkTot')) { $('#pkTot').textContent = fmt(tp); $('#shTot').innerHTML = ts ? `<span class="neg">${fmt(ts)}</span>` : '–'; }
      if ($('#shortBox')) $('#shortBox').hidden = !ts;
      if ($('#pkSum')) $('#pkSum').innerHTML = bad ? '<span class="neg">Qty diambil harus 0 sampai allot.</span>' : ts ? `<span class="neg">${fmt(ts)} pcs</span> jadi sisa picklist.` : 'Semua sesuai allot.';
    }
    if (DR?.type === 'pool') {
      let t = 0, bad = false;
      d.querySelectorAll('input[data-max]').forEach(i => { const v = parseInt(i.value) || 0, b = v < 0 || v > +i.dataset.max; i.classList.toggle('bad', b); bad ||= b; t += v; });
      if ($('#pkSum')) $('#pkSum').innerHTML = bad ? '<span class="neg">Qty melebihi yang tersedia.</span>' : d.querySelector('input[data-max]') ? `${DR.mode === 'rack' ? 'Kembali ke rak' : 'Koli baru'}: <b class="num" style="color:var(--ink)">${fmt(t)}</b> pcs` : '';
    }
    if (DR?.type === 'allot') {
      let c = 0, p = 0, bad = false;
      d.querySelectorAll('input[data-cs],input[data-pull]').forEach(i => { const v = parseInt(i.value) || 0, b = v < 0 || v > +i.dataset.max; i.classList.toggle('bad', b); bad ||= b; if ('cs' in i.dataset) c += v; else p += v; });
      const s = $('#mdSum'); if (s) s.innerHTML = bad ? '<span class="neg">Qty melebihi yang tersedia.</span>' : (c || p) ? `Tutup ${fmt(c)} pcs · tarik ${fmt(p)} pcs` : '';
    }
    const cn = [...d.querySelectorAll('input[data-cnt]')];
    if (cn.length) { let t = 0, e = 0, bad = false; cn.forEach(i => { const v = i.value === '' ? 0 : parseInt(i.value); const b = isNaN(v) || v < 0; i.classList.toggle('bad', b); bad ||= b; t += b ? 0 : v; e += +i.dataset.exp; });
      $('#cnTot').textContent = fmt(t); const s = $('#cnSum'); if (s) s.innerHTML = bad ? '<span class="neg">Qty tidak boleh minus.</span>' : t === e ? `${fmt(t)} pcs, sesuai dokumen` : `<span class="${DR?.type === 'ret' || t > e ? 'neg' : ''}">${fmt(t)} dari ${fmt(e)} pcs</span>`; }
    const rc = [...d.querySelectorAll('input[data-sent]')];
    if (rc.length) { const t = sum(rc, i => +i.value || 0), s = sum(rc, i => +i.dataset.sent); $('#rcTot').textContent = fmt(t);
      $('#rcSum').innerHTML = t === s ? `Diterima ${fmt(t)} pcs, sesuai surat jalan.` : `<span class="neg">Selisih ${signed(t - s)} pcs dari surat jalan</span>`; }
  };
  d.oninput = e => {
    const t = e.target; if (DR) DR.dirty = true;
    if (t.dataset?.cell) { NA.qty[t.dataset.cell] = Math.max(0, parseInt(t.value) || 0); refreshNA(t.id); return; }
    if (t.dataset?.fillrow) { const v = Math.max(0, parseInt(t.value) || 0); NA.stores.forEach(st => (NA.qty[t.dataset.fillrow + '|' + st] = v)); refreshNA(t.id); return; }
    if (t.id === 'naNote') { NA.note = t.value; return; }
    if (t.dataset?.ff && DR?.form) { DR.form[t.dataset.ff] = t.value; return; }
    if (t.dataset?.fl != null && DR?.form) { DR.form.lines[+t.dataset.fl].qty = Math.max(0, parseInt(t.value) || 0); const ft = $('#flTot'); if (ft) ft.textContent = fmt(sum(DR.form.lines, l => +l.qty || 0)); return; }
    upd();
  };
  d.onchange = e => {
    const t = e.target; if (DR) DR.dirty = true;
    if (t.name === 'dec') { const s = $('#decStore'); if (s) s.disabled = t.value !== 'move'; }
  };
  upd();
}

/* domain writes shared by several buttons */
async function createAllotment(note, lines, from = '') {
  const d = ymd(), used = new Set([...S.allots.map(a => a.code), ...MADE]); let n = 1; while (used.has(`ALT-${d}-${p2(n)}`)) n++;
  const code = `ALT-${d}-${p2(n)}`; MADE.add(code);
  const at = nowISO(), aRef = S.db.collection('allotments').doc(), stores = [...new Set(lines.map(l => l.store))];
  await aRef.set({ code, createdAt: at, note, stores, skus: [...new Set(lines.map(l => l.sku))], lines: lines.map(l => ({ sku: l.sku, store: l.store, qty: l.qty, closed: 0 })), createdBy: 'Merchandise', from });
  await Promise.all(stores.map(st => S.db.collection('picklists').doc().set({ code: `PL-${d}-${p2(n)}-${st}`, allotId: aRef.id, allotCode: code, store: st, createdAt: at, status: 'open', doneAt: null,
    lines: lines.filter(l => l.store === st).map(l => ({ sku: l.sku, qty: l.qty, picked: 0 })) })));
  return code;
}
/* Close Short: Merchandise gives up quantity that is not packed yet. Open picklists shrink first;
   anything already picked becomes "tanpa janji" and Ops returns it to the rack. */
async function closeShort(a, st, lines, decision, toStore, note, via = '') {
  const al = clone(a.lines);
  lines.forEach(x => { const L = al.find(l => l.store === st && l.sku === x.sku); if (L) L.closed = (L.closed || 0) + x.qty; });
  await S.db.doc('allotments/' + a.id).update({ lines: al, closes: [...(a.closes || []), { at: nowISO(), store: st, lines, decision, toStore: decision === 'move' ? toStore : '', note, via }] });
  const need = {}; lines.forEach(x => (need[x.sku] = (need[x.sku] || 0) + x.qty));
  const opens = S.pls.filter(p => p.allotId === a.id && p.store === st && p.status === 'open').sort((x, y) => (y.blocked ? 1 : 0) - (x.blocked ? 1 : 0) || y.createdAt.localeCompare(x.createdAt));
  for (const p of opens) {
    let changed = false; const nl = clone(p.lines);
    let cutNow = 0;
    nl.forEach(l => { const r = Math.min(need[l.sku] || 0, l.qty); if (r > 0) { l.qty -= r; need[l.sku] -= r; cutNow += r; changed = true; } });
    if (!changed) continue;
    const keep = nl.filter(l => l.qty > 0);
    await S.db.doc('picklists/' + p.id).update(keep.length ? { lines: keep, cut: (p.cut || 0) + cutNow, cutAt: nowISO() } : { lines: nl, status: 'cancelled', cancelledAt: nowISO() });
  }
  if (decision === 'move' && toStore) await createAllotment(`Pindahan dari ${a.code} · ${st}`, lines.map(x => ({ sku: x.sku, store: toStore, qty: x.qty })), a.code);
}
/* Kembalikan ke rak: a reversal of pick. What is still promised comes back as a pick-again picklist. */
async function returnToRack(st, items, reason, noRepick = false) {
  const A = acc(), at = nowISO(), byPl = {};
  items.forEach(it => (byPl[it.plId] = byPl[it.plId] || []).push(it));
  for (const [plId, its] of Object.entries(byPl)) {
    const p = S.pls.find(x => x.id === plId), nl = clone(p.lines);
    its.forEach(it => { const l = nl.find(x => x.sku === it.sku); l.returned = (l.returned || 0) + it.qty; });
    await S.db.doc('picklists/' + plId).update({ lines: nl, returns: [...(p.returns || []), ...its.map(it => ({ at, sku: it.sku, qty: it.qty, reason }))] });
  }
  if (noRepick) return 0;
  const need = {}; items.forEach(it => { const k = it.allotCode + '|' + it.sku; need[k] = (need[k] || 0) + it.qty; });
  const rep = {};
  Object.entries(need).forEach(([k, q]) => { const [code, sku] = k.split('|'); const x = A.get(code + '|' + st + '|' + sku); const re = Math.max(0, q - (x ? x.excess : 0)); if (re > 0) (rep[code] = rep[code] || []).push({ sku, qty: re, picked: 0 }); });
  for (const [code, lines] of Object.entries(rep)) {
    const ref = S.pls.find(p => p.allotCode === code && p.store === st);
    await S.db.collection('picklists').doc().set({ code: nextPlCode(baseOf(ref.code)), allotId: ref.allotId, allotCode: code, store: st, createdAt: at, status: 'open', doneAt: null, repick: true, reason, lines });
  }
  return Object.keys(rep).length;
}

/* Selesaikan picklist. Always lands in Picked: every stage is a physical checkpoint, Ops never skips one. */
async function doPick() {
  const p = S.pls.find(x => x.id === DR.id); if (!p || p.status !== 'open') return fail('Picklist ini sudah tidak terbuka.');
  const vals = [...$('#sheet').querySelectorAll('input[data-max]')].map(i => ({ i: +i.dataset.i, v: parseInt(i.value) }));
  if (vals.some(x => isNaN(x.v) || x.v < 0 || x.v > p.lines[x.i].qty)) return fail('Qty diambil harus 0 sampai allot.');
  const lines = p.lines.map((l, i) => ({ sku: l.sku, qty: l.qty, picked: vals.find(x => x.i === i).v }));
  const rem = lines.filter(l => l.picked < l.qty).map(l => ({ sku: l.sku, qty: l.qty - l.picked, picked: 0 }));
  const note = $('#shortNote')?.value.trim() || '';
  if (rem.length && !note) { $('#shortNote')?.focus(); return fail('Ada barang yang tidak ada di rak. Tulis alasannya dulu.'); }
  const at = nowISO();
  await S.db.doc('picklists/' + p.id).update({ status: 'done', doneAt: at, lines, shortNote: note });

  if (e.key === 'Escape' && DR) closeSheet();
  if (e.key === 'Enter' && e.target.matches?.('tr[data-store]')) { F.store = e.target.dataset.store; setTab('board'); }
  if (e.key === 'Enter' && e.target.matches?.('tr[data-open]')) openSheet(e.target.dataset.open);
});
$('#scrim').addEventListener('click', closeSheet);
$('#btnNew').addEventListener('click', () => { if (TAB === 'inbound') return openSheet('newpo'); NA = null; openSheet('newallot'); });
$('#fStore').addEventListener('change', e => { F.store = e.target.value; render(); });
$('#fAllot').addEventListener('change', e => { F.allot = e.target.value; render(); });
let qt; $('#fQ').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value.trim(); render(); }, 120); });
$('#roleSel').value = ROLE;
$('#roleSel').addEventListener('change', e => { ROLE = e.target.value; try { localStorage.setItem('ob-role', ROLE); } catch (x) {} SEL.clear(); render(); drawSheet(); toast(`Peran: ${ROLES[ROLE]}`); });
try { const t = localStorage.getItem('ob-tab'); if (['allot', 'board', 'spread', 'inbound', 'stores', 'inv'].includes(t)) setTab(t); } catch (e) {}

/* data */
function setLive(s) { $('#live').innerHTML = s === 'live' ? '<span class="dot" style="background:var(--ok)"></span>Live' : s === 'off' ? '<span class="dot" style="background:var(--bad)"></span>Offline' : '<span class="dot"></span>Menghubungkan…'; }
async function boot() {
  const db = await (window.claude?.use ? window.claude.use('db') : Promise.resolve(null));
  if (!db) { setLive('off'); document.body.classList.add('readonly'); $('#view-board').innerHTML = '<div class="banner"><span class="t">Data tidak tersedia di tampilan ini.</span><span class="x">Buka artifact di claude.ai untuk melihat dan mengubah data.</span></div>'; return; }
  S.db = db; setLive('live');
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    S[KEY[c]] = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.add(c); ACC = null; render();
    if (DR && DR.type !== 'newallot' && !DR.dirty && !busy) drawSheet();
  }, err => { console.error(c, err); setLive('off'); }));
  try { const user = await window.claude.use('user'); if (user && (await user.can('data.write')) === false) { S.canWrite = false; document.body.classList.add('readonly'); $('#roPill').hidden = false; render(); } } catch (e) {}
}
boot();
})();
</script>
