// A month's pay is a short road: Check what it stands on, Review what changed
// against last month, Hand the result to Finance. Calculating and approving are
// the two buttons that move you along it.
const BASE = { "HR manager": 7500000, Finance: 6000000, Buyer: 6500000, IT: 6000000, Merchandiser: 5500000, "Store head": 5200000, Cashier: 2350000, "Stock keeper": 2500000, Security: 2400000, Admin: 3000000 };
// Kasbon: a fixed instalment a month. Siti's began in September, Lina's this month.
const LOANS = { p2: { inst: 125000, n: 2, of: 5 }, p9: { inst: 200000, n: 1, of: 3 } };
const BANKS = ["BCA", "BRI", "Mandiri", "BNI"];
const rp = (n) => `${n < 0 ? "−" : ""}Rp ${Math.abs(Math.round(n)).toLocaleString("id-ID")}`;
const num2 = (n) => Math.round(n).toLocaleString("id-ID");
const round1000 = (n) => Math.round(n / 1000) * 1000;
const pph = (gross) => Math.max(0, round1000((gross - 4500000) * 0.05));
function slipOf(pid) {
  const person = personById(pid);
  const base = BASE[person.role] ?? 2400000;
  let worked = 0, absent = 0, late = 0, otH = 0;
  for (const iso of attDays()) {
    const k = attStat(pid, iso).kind;
    if (k === "absent") absent++;
    else if (["ok", "late", "noout", "today", "future", "leave"].includes(k)) { worked++; if (k === "late") late++; }
    otH += dayOT(pid, iso);
  }
  const otRate = unitOf(pid).id === "HO" ? S.rates.ho : S.rates.store;
  const ot = otH * otRate;
  const adjs = S.adj[pid] ?? [];
  const bonus = adjs.filter((a) => a.kind === "earn").reduce((n, a) => n + a.amt, 0), other = adjs.filter((a) => a.kind === "ded").reduce((n, a) => n + a.amt, 0);
  const gross = base + ot + bonus;
  // Absent without notice costs the day; BPJS is the employee's 4 % (1 health, 2 JHT, 1 JP).
  const absence = absent * round1000(base / 22), bpjs = round1000(base * 0.04);
  const loan = LOANS[pid] ?? null, kasbon = loan ? loan.inst : 0;
  const tax = pph(gross);

  // Last month: a full month, no overtime and no absence.
  const prev = base - bpjs - pph(base) - (loan && loan.n > 1 ? loan.inst : 0);
  const change = (net - prev) / prev;
  const why = absent ? `${absent} ${absent === 1 ? "day" : "days"} absent` : loan && loan.n === 1 ? "New loan repayment" : adjs.length ? `${adjs[0].label}${adjs.length > 1 ? ` +${adjs.length - 1}` : ""}` : otH ? `+${fmtH(otH)} overtime` : "";

    // The same figures as lists, for the layouts that fold them into two columns.

    earnTotal: base + ot + bonus, dedTotal: absence + bpjs + kasbon + tax + other, bank: BANKS[hash(pid + "bank") % 4] };
}

        <tr class="grp"><th></th><th colspan="2" class="gh">Earnings</th><th colspan="${dcols}" class="gh sep">Deductions</th><th class="gh sep">Paid</th></tr>
        <tr><th>Person</th><th class="pn2">Base pay</th><th class="pn2">Overtime</th><th class="pn2 sep">Absence</th>${hasLoan ? `<th class="pn2">Loan</th>` : ""}<th class="pn2">BPJS</th><th class="pn2">PPh 21</th>${hasAdj ? `<th class="pn2">Other</th>` : ""}<th class="pn2 sep">Net pay</th></tr>
      </thead>
      <tbody>${shown.map(row).join("")}</tbody><tfoot>${foot}</tfoot></table></div>${payPhoneList(shown)}`;
}

/* ── F–I: earnings in one column, deductions in one. They differ in how the
   parts show themselves when there are some. ── */
const nm1 = (x) => x.person.name.split(" ")[0];
// What still needs settling for this person, as the one small button.
function needBtn(x, pr) {
  const f = fixBtn(x, pr);
  if (f) return `<button class="pc need sm" data-pfix="${f[0]}">${{ pay: "Agree pay", bank: "Add bank account", ot: "Overtime waiting" }[f[0]]}</button>`;
  return esc(x.person.role);
}
const whoCell = (x, pr) => `<td class="who"><div class="person"><div class="av">${initials(x.person.name)}</div><div class="who2"><span class="n">${esc(x.person.name)}</span><span class="r">${needBtn(x, pr)}</span></div></div></td>`;
const extrasOf = (list) => list.filter((c) => !c.std);
const sumRow = (shown, cols) => `<tr><td>Total · ${shown.length} ${shown.length === 1 ? "person" : "people"}</td>${cols}</tr>`;
const totalsTail = (shown) => `<td class="pn2 num">${num2(shown.reduce((n, x) => n + x.earnTotal, 0))}</td><td class="pn2 num">−${num2(shown.reduce((n, x) => n + x.dedTotal, 0))}</td><td class="pn2 num net sep"><b>${num2(shown.reduce((n, x) => n + x.net, 0))}</b></td>`;

/* F · Two columns: the total, and the parts that are not routine written under it. */
function payLinesHTML() {
  const pr = payOf();
  const shown = payRows();
  const lines = (list, sign) => { const e = extrasOf(list); return e.length ? `<span class="s${e.some((c) => c.chg) ? " chg" : ""}" title="${e.map((c) => `${c.label} ${num2(c.amt)}`).join(" · ")}">${e.map((c) => `${c.label} ${sign}${num2(c.amt)}`).join(" · ")}</span>` : ""; };
  const row = (x) => `<tr class="click" data-slip="${x.person.id}">${whoCell(x, pr)}
    <td class="pn2 two"><span class="t num">${num2(x.earnTotal)}</span>${lines(x.earn.filter((c) => c.id !== "base"), "+")}</td>
    <td class="pn2 two"><span class="t num">−${num2(x.dedTotal)}</span>${lines(x.ded, "")}</td>
    <td class="pn2 num net sep"><b>${num2(x.net)}</b></td></tr>`;
  return `<div class="card desk"><table class="grid pay">
      <colgroup><col class="who"><col style="width:300px"><col style="width:300px"><col style="width:170px"></colgroup>
      <thead><tr><th>Person</th><th class="pn2">Earnings</th><th class="pn2">Deductions</th><th class="pn2 sep">Net pay</th></tr></thead>
      <tbody>${shown.map(row).join("")}</tbody><tfoot>${sumRow(shown, totalsTail(shown))}</tfoot></table></div>${payPhoneList(shown)}`;
}

/* G · Badge: the total and a small +n when there are extras; a tap opens the parts. */
function payBadgeHTML() {
  const pr = payOf();
  const shown = payRows();
  const cell = (x, kind) => {
    const list = kind === "earn" ? x.earn : x.ded;
    const extra = extrasOf(list);
    const total = kind === "earn" ? x.earnTotal : x.dedTotal;
    const bad = extra.some((c) => c.chg);
    return `<button class="pcell" data-pcomp="${x.person.id}|${kind}"><span class="num">${kind === "ded" ? "−" : ""}${num2(total)}</span>${extra.length ? `<span class="bd${bad ? " chg" : ""}">+${extra.length}</span>` : `<span class="bd none"></span>`}</button>`;
  };
  const row = (x) => `<tr class="click" data-slip="${x.person.id}">${whoCell(x, pr)}<td class="pn2">${cell(x, "earn")}</td><td class="pn2">${cell(x, "ded")}</td><td class="pn2 num net sep"><b>${num2(x.net)}</b></td></tr>`;
  return `<div class="card desk"><table class="grid pay">
      <colgroup><col class="who"><col style="width:220px"><col style="width:220px"><col style="width:170px"></colgroup>
      <thead><tr><th>Person</th><th class="pn2">Earnings</th><th class="pn2">Deductions</th><th class="pn2 sep">Net pay</th></tr></thead>
      <tbody>${shown.map(row).join("")}</tbody><tfoot>${sumRow(shown, totalsTail(shown))}</tfoot></table></div>${payPhoneList(shown)}`;
}
function openComp(btn) {
  const [pid, kind] = btn.dataset.pcomp.split("|");
  const x = slipOf(pid);
  const list = kind === "earn" ? x.earn : x.ded;
  const menu = $("#menu");
  menu.innerHTML = `<div class="mhead">${esc(nm1(x))} · ${kind === "earn" ? "Earnings" : "Deductions"}</div>${list.map((c) => `<div class="cl${c.chg ? " chg" : ""}"><span>${c.label}</span><span class="num">${kind === "ded" ? "−" : ""}${num2(c.amt)}</span></div>`).join("")}
    <div class="mrule"></div><div class="cl tot"><span>Total</span><span class="num">${kind === "ded" ? "−" : ""}${num2(kind === "earn" ? x.earnTotal : x.dedTotal)}</span></div>`;
  menu.classList.remove("off");
  const r = btn.getBoundingClientRect(), w = menu.offsetWidth, h = menu.offsetHeight;
  const left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8));
  const below = r.bottom + 6 + h <= innerHeight - 8;
  menu.style.left = `${left}px`; menu.style.top = `${below ? r.bottom + 6 : Math.max(8, r.top - 6 - h)}px`;
  menu.style.setProperty("--origin", `${r.right - left - 24}px ${below ? "top" : "bottom"}`);
  S.pcompOpen = true;
}

/* H · Ledger: a row a person, and under it a row a part, in the same two columns. */
function payLedgerHTML() {
  const pr = payOf();
  const shown = payRows();
  const open = (x) => S.pall || S.pexp[x.person.id];
  const body = shown.map((x) => {
    const head = `<tr class="click${open(x) ? " opened" : ""}" data-pexp="${x.person.id}"><td class="who"><div class="person"><i data-lucide="chevron-right" class="exp"></i><div class="av">${initials(x.person.name)}</div><div class="who2"><span class="n">${esc(x.person.name)}</span><span class="r">${needBtn(x, pr)}</span></div></div></td>
      <td class="pn2 num">${num2(x.earnTotal)}</td><td class="pn2 num">−${num2(x.dedTotal)}</td><td class="pn2 num net sep"><b>${num2(x.net)}</b></td></tr>`;
    const subs = open(x) ? [...x.earn.map((c) => ({ ...c, side: "e" })), ...x.ded.map((c) => ({ ...c, side: "d" }))].map((c) => `<tr class="lg"><td class="who"><span class="lbl2${c.chg ? " chg" : ""}">${c.label}</span></td><td class="pn2 num">${c.side === "e" ? num2(c.amt) : ""}</td><td class="pn2 num">${c.side === "d" ? `−${num2(c.amt)}` : ""}</td><td class="sep"></td></tr>`).join("") : "";
    return head + subs;
  }).join("");
  return `<div class="card desk"><table class="grid pay ledger">
      <colgroup><col class="who"><col style="width:220px"><col style="width:220px"><col style="width:170px"></colgroup>
      <thead><tr><th>Person <button class="linkbtn tog" data-act="pall">${S.pall ? "Collapse all" : "Expand all"}</button></th><th class="pn2">Earnings</th><th class="pn2">Deductions</th><th class="pn2 sep">Net pay</th></tr></thead>
      <tbody>${body}</tbody><tfoot>${sumRow(shown, totalsTail(shown))}</tfoot></table></div>${payPhoneList(shown)}`;
}

/* I · Fold: two columns, and a click on a group's name unfolds it into its parts. */
function payFoldHTML() {
  const pr = payOf();
  const shown = payRows();
  const all = slipsOf();
  const keys = (kind) => { const seen = new Map(); for (const x of all) for (const c of (kind === "earn" ? x.earn : x.ded)) if (!seen.has(c.id)) seen.set(c.id, c.label); return [...seen]; };
  const eKeys = keys("earn"), dKeys = keys("ded");
  const open = S.pfold;
  const part = (x, kind, id) => { const c = (kind === "earn" ? x.earn : x.ded).find((y) => y.id === id); return c ? `<span class="${c.chg ? "pc chg" : ""}">${kind === "ded" ? "−" : ""}${num2(c.amt)}</span>` : dot; };
  const eCols = open.earn ? eKeys.length : 1, dCols = open.ded ? dKeys.length : 1;
  const row = (x) => `<tr class="click" data-slip="${x.person.id}">${whoCell(x, pr)}
    ${open.earn ? eKeys.map(([id]) => `<td class="pn2 num">${part(x, "earn", id)}</td>`).join("") : `<td class="pn2 num">${num2(x.earnTotal)}${x.earn.some((c) => c.chg) ? `<i class="cd"></i>` : ""}</td>`}
    ${open.ded ? dKeys.map(([id], i) => `<td class="pn2 num${i === 0 ? " sep" : ""}">${part(x, "ded", id)}</td>`).join("") : `<td class="pn2 num sep">−${num2(x.dedTotal)}${x.ded.some((c) => c.chg) ? `<i class="cd"></i>` : ""}</td>`}
    <td class="pn2 num net sep"><b>${num2(x.net)}</b></td></tr>`;
  const sumOf = (kind, id) => num2(shown.reduce((n, x) => n + ((kind === "earn" ? x.earn : x.ded).find((y) => y.id === id)?.amt ?? 0), 0));
  const foot = `<tr><td>Total · ${shown.length} ${shown.length === 1 ? "person" : "people"}</td>${open.earn ? eKeys.map(([id]) => `<td class="pn2 num">${sumOf("earn", id)}</td>`).join("") : `<td class="pn2 num">${num2(shown.reduce((n, x) => n + x.earnTotal, 0))}</td>`}${open.ded ? dKeys.map(([id]) => `<td class="pn2 num">−${sumOf("ded", id)}</td>`).join("") : `<td class="pn2 num">−${num2(shown.reduce((n, x) => n + x.dedTotal, 0))}</td>`}<td class="pn2 num net sep"><b>${num2(shown.reduce((n, x) => n + x.net, 0))}</b></td></tr>`;
  const tog = (kind, label) => `<button class="gfold" data-pfold="${kind}" aria-expanded="${!!open[kind]}"><i data-lucide="chevron-right"></i>${label}</button>`;
  return `<div class="card desk"><table class="grid pay">
      <colgroup><col class="who">${"<col style=\"width:112px\">".repeat(eCols + dCols)}<col style="width:170px"></colgroup>
      <thead>
        <tr class="grp"><th></th><th colspan="${eCols}" class="gh">${tog("earn", "Earnings")}</th><th colspan="${dCols}" class="gh sep">${tog("ded", "Deductions")}</th><th class="gh sep">Paid</th></tr>
        <tr><th>Person</th>${open.earn ? eKeys.map(([, l]) => `<th class="pn2">${l}</th>`).join("") : `<th class="pn2">Total</th>`}${open.ded ? dKeys.map(([, l], i) => `<th class="pn2${i === 0 ? " sep" : ""}">${l}</th>`).join("") : `<th class="pn2 sep">Total</th>`}<th class="pn2 sep">Net pay</th></tr>
      </thead>
      <tbody>${shown.map(row).join("")}</tbody><tfoot>${foot}</tfoot></table></div>${payPhoneList(shown)}`;
}

/* J · Multi-row: each person is a block; the parts of earnings stack in one
   column and the parts of deductions in the next, so nothing is a blank cell. */
function payStackHTML() {
  const pr = payOf();
  const shown = payRows();
  const lines = (list, sign) => `<div class="stk">${list.map((c) => `<div class="ln${c.chg ? " chg" : ""}${c.std ? "" : " ex"}"><span>${esc(c.label)}</span><span class="num">${sign}${num2(c.amt)}</span></div>`).join("")}</div>`;
  const row = (x) => `<tr class="click stackrow" data-slip="${x.person.id}">${whoCell(x, pr)}
    <td class="stc">${lines(x.earn, "")}${x.earn.length > 1 ? `<div class="ln tt"><span>Total</span><span class="num">${num2(x.earnTotal)}</span></div>` : ""}</td>
    <td class="stc">${lines(x.ded, "−")}${x.ded.length > 1 ? `<div class="ln tt"><span>Total</span><span class="num">−${num2(x.dedTotal)}</span></div>` : ""}</td>
    <td class="pn2 num net sep"><b>${num2(x.net)}</b></td></tr>`;
  return `<div class="card desk"><table class="grid pay stack">
      <colgroup><col class="who"><col style="width:340px"><col style="width:340px"><col style="width:170px"></colgroup>
      <thead><tr><th>Person</th><th>Earnings</th><th>Deductions</th><th class="pn2 sep">Net pay</th></tr></thead>
      <tbody>${shown.map(row).join("")}</tbody><tfoot>${sumRow(shown, `<td class="stc num">${num2(shown.reduce((n, x) => n + x.earnTotal, 0))}</td><td class="stc num">−${num2(shown.reduce((n, x) => n + x.dedTotal, 0))}</td><td class="pn2 num net sep"><b>${num2(shown.reduce((n, x) => n + x.net, 0))}</b></td>`)}</tfoot></table></div>${payPhoneList(shown)}`;
}

/* B · All stores: one row a shop, so head office sees the whole month. */
function payStoresHTML() {
  const rows = STORES.map((st, i) => {
    const slips = slipsOf(st), pr = payOf(st), bl = blockersOf(st);
    const net = slips.reduce((n, x) => n + x.net, 0), prev = slips.reduce((n, x) => n + x.prev, 0);
    const d = (net - prev) / prev;
    const att = attApproved(st) ? `<span class="ok">Approved</span>` : openOf(st).length ? `<span class="bad">${openOf(st).length} to fix</span>` : `<span class="mute">Not approved</span>`;
    const need = slips.filter((x) => needOf(x, pr)).length;
    const status = pr.approved ? `<span class="ok"><i data-lucide="check" class="seen"></i> Approved</span>` : bl.length ? `<span class="mute">${bl.length} to settle</span>` : `<span class="acc">Ready</span>`;
    return { st, i, slips, net, prev, d, att, need, status, bl, pr };
  });
  const tr = (r) => `<tr class="click" data-pstore="${r.i}"><td class="who"><div class="who2"><span class="n">${esc(r.st.name)}</span><span class="r num">${r.st.id}</span></div></td>
    <td class="pn2 num">${r.st.people.length}</td><td class="pn2">${r.att}</td><td class="pn2 num net"><b>${num2(r.net)}</b></td><td class="pn2 num${Math.abs(r.d) >= 0.02 ? " lt2" : " mute"}">${r.d >= 0 ? "+" : "−"}${(Math.abs(r.d) * 100).toFixed(1)}%</td><td class="pn2">${r.status}</td></tr>`;
  const total = rows.reduce((n, r) => n + r.net, 0), people = rows.reduce((n, r) => n + r.st.people.length, 0);
  const list = rows.map((r) => `<button class="prow person" data-pstore="${r.i}"><div class="who2"><span class="n">${esc(r.st.name)}</span><span class="r num">${r.st.id} · ${r.st.people.length} people</span></div><span class="rt num"><b>${num2(r.net)}</b><span class="${r.pr.approved ? "ok" : r.bl.length ? "mute" : "acc"}">${r.pr.approved ? "Approved" : r.bl.length ? `${r.bl.length} to settle` : "Ready"}</span></span></button>`).join("");
  return `<div class="card desk"><table class="grid pay">
      <colgroup><col class="who"><col style="width:90px"><col style="width:150px"><col style="width:170px"><col style="width:110px"><col style="width:150px"></colgroup>
      <thead><tr><th>Store</th><th class="pn2">People</th><th class="pn2">Attendance</th><th class="pn2">Net pay</th><th class="pn2">Change</th><th class="pn2">Payroll</th></tr></thead>
      <tbody>${rows.map(tr).join("")}</tbody>
      <tfoot><tr><td>Total · ${STORES.length} stores</td><td class="pn2 num">${people}</td><td></td><td class="pn2 num net"><b>${num2(total)}</b></td><td></td><td></td></tr></tfoot></table></div>
    <div class="plist">${list}</div>`;
}
function payApproveReady() {
  const ready = STORES.filter((st) => !payOf(st).approved && blockersOf(st).length === 0);
  ready.forEach((st) => { payOf(st).approved = true; });
  render();
  toast(`${ready.length} ${ready.length === 1 ? "store" : "stores"} approved — Finance has them`);
}

/* C · Grouped: people under their job, a subtotal on each, a row opens in place. */
function payGroupedHTML() {
  const pr = payOf();
  const slips = slipsOf();
  const roles = [...new Set(slips.map((x) => x.person.role))];
  const line = (label, value, cls = "") => `<div class="sl2"><span>${label}</span><span class="num ${cls}">${value}</span></div>`;
  const body = roles.map((role) => {
    const group = slips.filter((x) => x.person.role === role);
    const sub = group.reduce((n, x) => n + x.net, 0);
    const rows = group.map((x) => {
      const open = !!S.pexp[x.person.id];
      const fix = fixBtn(x, pr);
      const head = `<tr class="click${open ? " opened" : ""}" data-pexp="${x.person.id}"><td class="who"><div class="person"><i data-lucide="chevron-right" class="exp"></i><div class="av">${initials(x.person.name)}</div><div class="who2"><span class="n">${esc(x.person.name)}</span><span class="r">${x.flagged ? esc(x.why) : "&nbsp;"}</span></div></div></td>
        <td class="pn2 num mute">${num2(x.prev)}</td><td class="pn2 num"><b>${num2(x.net)}</b></td><td class="pn2 num${x.flagged ? " lt2" : ""}">${x.flagged ? pctOf(x) : dot}</td>
        <td class="pn2">${fix ? `<button class="pc need" data-pfix="${fix[0]}">${fix[1]}</button>` : ""}</td></tr>`;
      const more = open ? `<tr class="subrow"><td colspan="5"><div class="split"><div><div class="shd">Earnings</div>${line("Base pay", num2(x.base))}${x.ot ? line("Overtime", `+${num2(x.ot)}`, "lt2") : ""}${x.adjs.filter((a) => a.kind === "earn").map((a) => line(esc(a.label), `+${num2(a.amt)}`, "lt2")).join("")}</div>
        <div><div class="shd">Deductions</div>${line("BPJS", `−${num2(x.bpjs)}`)}${x.tax ? line("PPh 21", `−${num2(x.tax)}`) : ""}${x.absence ? line("Absence", `−${num2(x.absence)}`, "lt2") : ""}${x.kasbon ? line("Loan", `−${num2(x.kasbon)}`, x.loan.n === 1 ? "lt2" : "") : ""}${x.adjs.filter((a) => a.kind === "ded").map((a) => line(esc(a.label), `−${num2(a.amt)}`, "lt2")).join("")}</div>
        <div class="slact"><button class="btn sm ghost" data-slip="${x.person.id}">Open slip</button></div></div></td></tr>` : "";
      return head + more;
    }).join("");
    return `<tr class="gr"><td colspan="2">${role} <span class="mute">· ${group.length}</span></td><td class="pn2 num"><b>${num2(sub)}</b></td><td colspan="2"></td></tr>${rows}`;
  }).join("");
  return `<div class="card desk"><table class="grid pay grouped">
      <colgroup><col class="who"><col style="width:150px"><col style="width:170px"><col style="width:110px"><col style="width:150px"></colgroup>
      <thead><tr><th>Person</th><th class="pn2">Last month</th><th class="pn2">Net pay</th><th class="pn2">Change</th><th></th></tr></thead>
      <tbody>${body}</tbody></table></div>${payPhoneList(slips)}`;
}

/* D · Difference: what moved comes first, and why, in words. */
function payDiffHTML() {
  const pr = payOf();
  const shown = payRows().slice().sort((a, b) => (needOf(b, pr) - needOf(a, pr)) || (b.flagged - a.flagged) || Math.abs(b.change) - Math.abs(a.change));
  const chips = (x) => {
    const c = [];
    if (x.absence) c.push(`<span class="wy bad2">Absence −${num2(x.absence)}</span>`);
    if (x.kasbon && x.loan.n === 1) c.push(`<span class="wy chg">New loan −${num2(x.kasbon)}</span>`);
    if (x.ot) c.push(`<span class="wy chg">Overtime +${num2(x.ot)}</span>`);
    for (const a of x.adjs) c.push(`<span class="wy chg">${esc(a.label)} ${a.kind === "earn" ? "+" : "−"}${num2(a.amt)}</span>`);
    const fix = fixBtn(x, pr);
    if (fix) c.unshift(`<button class="pc need" data-pfix="${fix[0]}">${fix[1]}</button>`);
    return c.join("") || `<span class="mute">No change</span>`;
  };
  const row = (x) => `<tr class="click" data-slip="${x.person.id}"><td class="who"><div class="person"><div class="av">${initials(x.person.name)}</div><div class="who2"><span class="n">${esc(x.person.name)}</span><span class="r">${esc(x.person.role)}</span></div></div></td>
    <td class="why">${chips(x)}</td><td class="pn2 num mute">${num2(x.prev)}</td><td class="pn2 num net"><b>${num2(x.net)}</b></td><td class="pn2 num${x.flagged ? " lt2" : " mute"}">${x.flagged ? pctOf(x) : "·"}</td></tr>`;
  return `<div class="card desk"><table class="grid pay diff">
      <colgroup><col class="who"><col><col style="width:140px"><col style="width:150px"><col style="width:100px"></colgroup>
      <thead><tr><th>Person</th><th>What moved</th><th class="pn2">Last month</th><th class="pn2">Net pay</th><th class="pn2">Change</th></tr></thead>
      <tbody>${shown.map(row).join("")}</tbody></table></div>${payPhoneList(shown)}`;
}

/* E · Queue: three heaps, the one that needs you on top. */
function payQueueHTML() {
  const pr = payOf();
  const slips = slipsOf();
  const need = slips.filter((x) => needOf(x, pr));
  const changed = slips.filter((x) => !needOf(x, pr) && x.flagged);
  const same = slips.filter((x) => !needOf(x, pr) && !x.flagged);
  const row = (x, mode) => {
    const fix = fixBtn(x, pr);
    const note = mode === "need" ? (x.person.id === "p7" ? "No pay agreed" : x.person.id === "p6" ? "No bank account" : "Overtime waiting for a yes") : mode === "chg" ? x.why : x.person.role;
    return `<div class="qrow" data-slip="${x.person.id}" role="button" tabindex="0"><div class="av">${initials(x.person.name)}</div>
      <div class="who2"><span class="n">${esc(x.person.name)}</span><span class="r${mode === "same" ? "" : " lt2"}">${esc(note)}</span></div>
      ${fix ? `<button class="btn sm" data-pfix="${fix[0]}">${fix[1]}</button>` : ""}
      <span class="num qn"><b>${num2(x.net)}</b>${x.flagged ? `<span class="lt2">${pctOf(x)}</span>` : ""}</span></div>`;
  };
  const sec = (key, title, list, mode, openDefault) => {
    if (!list.length) return "";

/* ───────────────────────── picking a day, then its shift ───────────────────────── */
// Press a day, or press and drag across several: they are picked. A small menu
// opens beside the last one with the shifts; one tap on a shift writes it to
// every picked day. Nothing is "switched on" beforehand.
const cellsOf = (key) => document.querySelectorAll(`.cell[data-p="${key.split("|")[0]}"][data-d="${key.split("|")[1]}"]`);
let drag = null;
function mark(key, on) { cellsOf(key).forEach((c) => c.classList.toggle("sel", on)); }
function clearSel() { S.sel.forEach((k) => mark(k, false)); S.sel = []; closeMenu(); }
function shake(el) { el.classList.remove("no"); void el.offsetWidth; el.classList.add("no"); }
function pickCell(el) {
  const { p, d } = el.dataset;
  const key = `${p}|${d}`;
  if (onLeave(p, d)) { shake(el); drag.blocked = true; return; }
  if (S.sel.includes(key)) return;
  S.sel.push(key);
  mark(key, true);
}
document.addEventListener("pointerdown", (e) => {
  if (S.pcompOpen && !e.target.closest?.("#menu, [data-pcomp]")) { closeMenu(); S.pcompOpen = false; }
  if (e.target.closest?.("#menu, #sheet, #pop")) return;
  const el = e.target.closest?.(".cell");
  if (S.swapFrom) { if (e.target.closest?.(".swapbar")) return; e.preventDefault(); return el ? doSwap(el) : cancelSwap(); }
  if (!el || e.button > 0) { if (S.sel.length) clearSel(); return; }
  e.preventDefault();
  clearSel();
  drag = { blocked: false, touch: e.pointerType !== "mouse" };
  pickCell(el);
});
document.addEventListener("pointermove", (e) => {
  if (!drag || drag.touch) return;
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".cell");
  if (el) pickCell(el);
});
document.addEventListener("pointerup", () => {
  if (!drag) return;
  const done = drag; drag = null;
  if (S.sel.length) openMenu();
  else if (done.blocked) toast("On leave — the day stays off the roster");
});

function menuHTML() {
  const cells = S.sel.map((k) => k.split("|"));
  const values = cells.map(([p, d]) => at(p, d));
  const same = (v) => values.every((x) => x === v);
  const who = cells.length === 1 ? `${PEOPLE.find((x) => x.id === cells[0][0]).name.split(" ")[0]} · ${DOW[(new Date(cells[0][1] + "T00:00:00Z").getUTCDay() + 6) % 7]} ${dnum(cells[0][1])}` : `${cells.length} days`;
  const working = values.every((v) => shiftOf(v));
  const otNow = cells.map(([p, d]) => (S.ot[p] || {})[d] || 0);
  const otSame = otNow.every((n) => n === otNow[0]) ? otNow[0] : null;
  const rows = S.shifts.map((sh, i) => `<div class="mrow"><button class="mitem" data-pick="${sh.id}" style="--c:${sh.color}">
      <span class="dot"></span><span class="mn">${esc(sh.name)}</span><span class="mt num">${sh.start}–${sh.end}</span>${same(sh.id) ? `<i data-lucide="check"></i>` : `<span class="mk">${i + 1}</span>`}</button>
      <button class="medit phone-only" data-edit="${sh.id}" aria-label="Edit ${esc(sh.name)}"><i data-lucide="pencil"></i></button></div>`).join("");
  return `<div class="mhead">${who}</div>${rows}
    <div class="mrule"></div>
    <button class="mitem" data-pick="OFF" style="--c:var(--line-ico)"><i data-lucide="moon" class="mi"></i><span class="mn">Off</span>${same("OFF") ? `<i data-lucide="check"></i>` : `<span class="mk">0</span>`}</button>
    <button class="mitem" data-pick="CLEAR" style="--c:var(--line-ico)"><i data-lucide="eraser" class="mi"></i><span class="mn">Clear</span></button>
    ${cells.length === 1 && values[0] ? `<button class="mitem" data-swap="1" style="--c:var(--line-ico)"><i data-lucide="repeat-2" class="mi"></i><span class="mn">Swap with…</span></button>` : ""}
    ${working ? `<div class="mrule"></div><div class="mot"><span class="mn"><i data-lucide="timer" class="mi"></i>Overtime</span>
      <span class="ots">${[0, 1, 2, 3, 4].map((n) => `<button data-ot="${n}" aria-pressed="${otSame === n}">${n === 0 ? "None" : `+${n}`}</button>`).join("")}</span></div>` : ""}
    <button class="mitem phone-only" data-act="add"><i data-lucide="plus" class="mi"></i><span class="mn">New shift</span></button>`;
}
function openMenu() {
  const menu = $("#menu");
  menu.innerHTML = menuHTML();
  icons();
  const last = S.sel[S.sel.length - 1];
  const anchor = [...cellsOf(last)].find((c) => c.offsetParent !== null) || cellsOf(last)[0];
  menu.classList.remove("off");
  if (!phone() && anchor) {
    const r = anchor.getBoundingClientRect();
    const w = menu.offsetWidth, h = menu.offsetHeight;
    const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
    const below = r.bottom + 6 + h <= innerHeight - 8;
    menu.style.left = `${left}px`;
    menu.style.top = `${below ? r.bottom + 6 : Math.max(8, r.top - 6 - h)}px`;
    menu.style.setProperty("--origin", `${r.left - left + 24}px ${below ? "top" : "bottom"}`);
  }
  $("#menuScrim").hidden = !phone();
}
function closeMenu() { $("#menu").classList.add("off"); $("#menuScrim").hidden = true; S.pcompOpen = false; }
$("#menuScrim").addEventListener("pointerdown", clearSel);

// Swap: one day's plan trades places with another's, a person's or the same person's.
function startSwap() {
  S.swapFrom = S.sel[0];
  S.sel.forEach((k) => mark(k, false)); S.sel = [];
  closeMenu(); render();
}
function cancelSwap() { S.swapFrom = null; render(); }
function doSwap(el) {
  const [p1, d1] = S.swapFrom.split("|"), { p: p2, d: d2 } = el.dataset;
  if (`${p2}|${d2}` === S.swapFrom) return cancelSwap();
  if (onLeave(p2, d2)) { shake(el); return toast("On leave — that day can't take a shift"); }
  const pair = [[p1, d1], [p2, d2]];
  const before = pair.map(([p, d]) => [p, d, S.plan[p][d], (S.ot[p] || {})[d]]);
  const [a, b] = before;
  const put = (p, d, v, o) => { if (v === undefined) delete S.plan[p][d]; else S.plan[p][d] = v; S.ot[p] ??= {}; if (o === undefined) delete S.ot[p][d]; else S.ot[p][d] = o; };
  put(a[0], a[1], b[2], b[3]); put(b[0], b[1], a[2], a[3]);
  S.swapFrom = null;
  render();
  const nm = (pid) => PEOPLE.find((x) => x.id === pid).name.split(" ")[0];
  document.querySelectorAll(`.cell[data-p="${p1}"][data-d="${d1}"], .cell[data-p="${p2}"][data-d="${d2}"]`).forEach((c) => c.classList.add("landed"));
  finish({ brush: "SWAP", undo: before, otBlocked: false, blocked: false });
  toast(p1 === p2 ? `${nm(p1)} · ${dlabel(d1)} ⇄ ${dlabel(d2)}` : `${nm(p1)} ⇄ ${nm(p2)} · ${dlabel(d1)}${d1 === d2 ? "" : ` / ${dlabel(d2)}`} swapped`, before);
}

// One shift, or Off, or nothing, or some overtime, onto every picked day.
function pickShift(brush, otValue) {
  const undo = [];
  const done = { brush, otValue, undo, otBlocked: false, blocked: false };
  for (const key of S.sel) {
    const [p, d] = key.split("|");
    if (onLeave(p, d)) { done.blocked = true; continue; }
    const before = S.plan[p][d];
    const beforeOT = (S.ot[p] || {})[d];
    if (brush === "OT") {
      if (!shiftOf(at(p, d))) { done.otBlocked = true; continue; }
      const next = otValue || undefined;
      if (next === beforeOT) continue;
      undo.push([p, d, before, beforeOT]);
      S.ot[p] ??= {};
      if (next) S.ot[p][d] = next; else delete S.ot[p][d];
    } else {
      const next = brush === "CLEAR" ? undefined : brush;
      if (before === next) continue;
      undo.push([p, d, before, beforeOT]);
      if (next === undefined) delete S.plan[p][d]; else S.plan[p][d] = next;
      // No shift, no overtime on top of it.
      if (!shiftOf(next) && S.ot[p]) delete S.ot[p][d];
    }
  }
  const touchedKeys = undo.map(([p, d]) => `${p}|${d}`);
  S.sel = [];
  closeMenu();
  render();
  touchedKeys.forEach((k) => cellsOf(k).forEach((c) => c.classList.add("landed")));
  finish(done);
}
function finish(done) {
  // A change that leaves somebody under the weekly minimum says so at once.
  const touched = new Map();
  for (const [p, d] of done.undo) { const mon = addDays(d, -((new Date(d + "T00:00:00Z").getUTCDay() + 6) % 7)); touched.set(`${p}|${mon}`, [p, mon]); }
  const now = [...touched.values()].filter(([p, mon]) => planned(p, mon) && weekHours(p, mon) < MIN_HOURS);
  const over = [...touched.values()].filter(([p, mon]) => otOver(p, mon));
  const name = (p) => PEOPLE.find((x) => x.id === p).name.split(" ")[0];
  if (over.length) {
    const [p, mon] = over[0];
    const ot = weekOT(p, mon);
    toast(ot > OT_WEEK
      ? `${name(p)} has ${fmtH(ot)} overtime in ${weekLabel(mon)} — over ${OT_WEEK} h`
      : `${name(p)} has a day over ${OT_DAY} h of overtime`, done.undo);
  } else if (done.otBlocked && !done.undo.length) toast("Overtime goes on a working day");
  else if (done.brush === "OT" && done.undo.length) {
    const [p, d] = done.undo[0];
    const h = (S.ot[p] || {})[d];
    toast(h ? `${name(p)} · +${fmtH(h)} overtime, waiting for a yes in the app` : "Overtime taken off", done.undo);
  } else if (now.length) {
    const [p, mon] = now[0];
    toast(`${name(p)} has ${fmtH(weekHours(p, mon))} in ${weekLabel(mon)} — under ${MIN_HOURS} h`, done.undo);
  } else if (done.brush === "SWAP") { /* doSwap says it */ }
  else if (done.blocked && !done.undo.length) toast("On leave — the day stays off the roster");
  else if (done.undo.length > 1) {
    const sh = shiftOf(done.brush);
    toast(`${done.brush === "CLEAR" ? "Cleared" : done.brush === "OFF" ? "Off" : sh?.name} · ${done.undo.length} days`, done.undo);
  }
}

/* ───────────────────────── actions ───────────────────────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest?.("button");
  if (!t) return;
  if (t.dataset.swap) return startSwap();
  if (t.dataset.act === "swapcancel") return cancelSwap();
  if (t.dataset.pick) return pickShift(t.dataset.pick);
  if (t.dataset.ot !== undefined) return pickShift("OT", +t.dataset.ot);
  if (t.dataset.edit) { S.sel.forEach((k) => mark(k, false)); S.sel = []; closeMenu(); return openShift(shiftOf(t.dataset.edit)); }
  if (t.dataset.aview) { S.aview = t.dataset.aview; return render(); }
  if (t.dataset.view) {
    if (t.dataset.view === "month") S.rmonth = addDays(S.week, 3).slice(0, 7);
    else if (S.view === "month") { const first = mondayOfIso(`${S.rmonth}-01`); S.week = S.rmonth === TODAY.slice(0, 7) ? mondayOfIso(TODAY) : first; S.day = S.week; }
    S.view = t.dataset.view; return render();
  }
  if (t.dataset.openWeek) { S.view = "week"; S.week = mondayOfIso(S.rmonth === TODAY.slice(0, 7) ? TODAY : `${S.rmonth}-01`); S.day = S.week; return render(); }
  if (t.dataset.store) { S.store = +t.dataset.store; PEOPLE = STORES[S.store].people; S.storesOpen = false; return render(); }
  if (t.dataset.act === "pickstore") { S.storesOpen = !S.storesOpen; return render(); }
  if (t.dataset.adjkind) { S.adjForm.kind = t.dataset.adjkind; return drawSheet(); }
  if (t.dataset.adjdel) { const [pid, ix] = t.dataset.adjdel.split("|"); S.adj[pid].splice(+ix, 1); render(); drawSheet(); return toast("Adjustment removed"); }
  if (t.dataset.adjfrom) { S.page = "payroll"; S.att = null; S.attP = null; S.slip = t.dataset.adjfrom; S.adjForm = { kind: "ded", label: "", amt: "" }; render(); return drawSheet(); }
  if (t.dataset.pfix) return payFix(t.dataset.pfix);
  if (t.dataset.pgoto) { S.page = "attendance"; return render(); }
  if (t.dataset.pcomp) return openComp(t);
  if (t.dataset.pfold) { S.pfold[t.dataset.pfold] = !S.pfold[t.dataset.pfold]; return render(); }
  if (t.dataset.act === "pall") { S.pall = !S.pall; return render(); }
  if (t.dataset.popt) { S.popt = t.dataset.popt; S.pfilter = "all"; return render(); }
  if (t.dataset.pstore) { S.store = +t.dataset.pstore; PEOPLE = STORES[S.store].people; S.popt = "A"; S.pfilter = "all"; return render(); }
  if (t.dataset.pcol) { const k = t.dataset.pcol; const cur = S.pcol[k] === undefined ? k !== "same" : S.pcol[k]; S.pcol[k] = !cur; return render(); }
  if (t.dataset.pfilter) { S.pfilter = t.dataset.pfilter; return render(); }
  if (t.dataset.slip) { S.slip = t.dataset.slip; S.att = null; S.attP = null; render(); if (!S.sheet) openSheet(); else drawSheet(); return; }
  if (t.dataset.slipgo) { const [pid] = t.dataset.slipgo.split("|"); S.slip = null; S.page = "attendance"; S.attP = pid; render(); return drawSheet(); }
  if (t.dataset.page) { S.page = t.dataset.page; S.sel.forEach((k) => mark(k, false)); S.sel = []; closeMenu(); if (S.sheet) closeSheet(); return render(); }
  if (t.dataset.afilter) { S.afilter = t.dataset.afilter; return render(); }
  if (t.dataset.a) { const [p, d] = t.dataset.a.split("|"); return openAtt(p, d); }
  if (t.dataset.ap) { S.attP = t.dataset.ap; S.att = null; if (!S.sheet) openSheet(); else drawSheet(); return; }
  if (t.dataset.act === "backperson") { S.att = null; return drawSheet(); }
  if (t.dataset.aday) { setAttDate(t.dataset.aday); return render(); }
  if (t.dataset.day) { S.day = t.dataset.day; return render(); }
  const act = t.dataset.act;
  if ((act === "wk-1" || act === "wk+1") && S.view === "month") { S.rmonth = addMonths(S.rmonth, act === "wk+1" ? 1 : -1); S.week = mondayOfIso(`${S.rmonth}-01`); S.day = S.week; return render(); }
  if (act === "wk-1" || act === "wk+1") {
    const step = act === "wk+1" ? 7 : -7;
    S.week = addDays(S.week, step); S.day = addDays(S.day, step);
    return render();
  }
  if (act === "mo-1" || act === "mo+1") { setAttDate(`${addMonths(S.attMonth, act === "mo+1" ? 1 : -1)}-01`); return render(); }
  if (act === "att-1" || act === "att+1") {
    const dir = act === "att+1" ? 1 : -1;
    if (S.aview === "month") setAttDate(`${addMonths(S.attMonth, dir)}-01`);
    else setAttDate(addDays(S.attDate, (S.aview === "week" ? 7 : 1) * dir));
    return render();
  }
  if (act === "approve") return approveWeek();
  if (act === "rates") { S.ratesOpen = true; S.slip = null; if (!S.sheet) openSheet(); else drawSheet(); return; }
  if (act === "saverates") {
    const num = (id) => parseInt(String(document.getElementById(id).value).replace(/\D/g, ""), 10);
    const st = num("rOtS"), ho = num("rOtH");
    if (!(st > 0) || !(ho > 0)) return toast("Enter an amount an hour for both");
    S.rates.store = st; S.rates.ho = ho; S.ratesOpen = false; closeSheet();
    return toast(`Overtime: stores ${rp(st)}, head office ${rp(ho)} an hour`);
  }
  if (act === "adjnew") { S.adjForm = { kind: "earn", label: "", amt: "" }; return drawSheet(); }
  if (act === "adjback") { S.adjForm = null; return drawSheet(); }
  if (act === "adjsave") {
    const f = S.adjForm;
    (S.adj[S.slip] ??= []).push({ label: f.label.trim(), amt: Number(String(f.amt).replace(/\D/g, "")), kind: f.kind });
    S.adjForm = null; render(); drawSheet();
    return toast(`${f.label.trim()} added`);
  }
  if (act === "payapprove") return payApprove();
  if (act === "approveready") return payApproveReady();
  if (act === "copy") return copyLastWeek();
  if (act === "shifts") return openSheet();
  if (act === "closesheet") return closeSheet();
  if (act === "backsheet") { draft = null; return drawSheet(); }
  if (act === "publish") return publishWeek();
  if (act === "add") { S.sel.forEach((k) => mark(k, false)); S.sel = []; closeMenu(); return openShift(null); }
});

// Attendance is approved when nobody is left absent or without a clock-out:
// payroll counts these days, so each one has an answer first.
function approveWeek() {
  const open = openOf();
  if (open.length) return toast(`${open[0].p.name.split(" ")[0]} · ${dlabel(open[0].iso)} still needs a fix`);
  S.aprv[pubKey(STORES[S.store], S.attMonth)] = attSig();
  render();
  toast(`${STORES[S.store].name} · ${monthLabel(S.attMonth)} approved — payroll can count it`);
}

// A roster under the weekly minimum cannot be sent: the people it names are
// short of hours the company owes them work for.
function publishMonth() {
  const store = STORES[S.store];
  const short = monthShort(S.rmonth);
  if (short.length) { const r = short[0]; return toast(`${r.p.name.split(" ")[0]} has ${fmtH(r.h)} in the week of ${weekLabel(r.mon)} — everybody needs ${MIN_HOURS} h before the month is published`); }
  monthWeeks(S.rmonth).forEach((mon) => { S.pub[pubKey(store, mon)] = signature(store, mon); });
  render();
  toast(`${store.name} · ${monthLabel(S.rmonth)} published — everyone sees it in their app`);
}
function publishWeek() {
  if (S.view === "month") return publishMonth();
  const store = STORES[S.store];
  const short = shortOf(S.week);
  if (short.length) {
    const r = short[0];
    return toast(`${r.p.name.split(" ")[0]} has ${fmtH(r.h)} — everybody needs ${MIN_HOURS} h before the week is published`);
  }
  S.pub[pubKey(store, S.week)] = signature(store, S.week);
  render();
  toast(`${store.name} · ${weekLabel(S.week)} published — everyone sees it in their app`);
}

function copyLastWeek() {
  const undo = [];
  const last = addDays(S.week, -7);
  for (const p of PEOPLE) days(S.week).forEach((iso, i) => {
    if (onLeave(p.id, iso)) return;
    const from = S.plan[p.id][addDays(last, i)];
    if (from === undefined || S.plan[p.id][iso] !== undefined) return; // only empty days
    undo.push([p.id, iso, undefined]);
    S.plan[p.id][iso] = from;
  });
  render();
  toast(undo.length ? `${undo.length} days copied from ${weekLabel(last)}` : "Nothing empty to fill", undo.length ? undo : null);
}

document.addEventListener("keydown", (e) => {
  if (S.swapFrom && e.key === "Escape") return cancelSwap();
  if (e.target.closest?.("input") || S.sheet || !S.sel.length) return;
  if (e.key === "Escape") return clearSel();
  if (/^[1-9]$/.test(e.key) && S.shifts[+e.key - 1]) return pickShift(S.shifts[+e.key - 1].id);
  if (e.key === "0") return pickShift("OFF");
  if (e.key === "Backspace" || e.key === "Delete") return pickShift("CLEAR");
});

/* ───────────────────────── the Shifts sheet ───────────────────────── */
// One sheet, two modes: the list of shifts, and the form for one of them.
// Opening a shift swaps the sheet's contents; it does not stack a second
// sheet. The frame stays put.
let draft = null;
function ratesSheetHTML() {
  const close = `<button class="icbtn" data-act="closesheet" aria-label="Close"><i data-lucide="x"></i></button>`;
  const f = (id, label, v) => `<div class="fld"><label for="${id}">${label}</label><input id="${id}" inputmode="numeric" value="${v.toLocaleString("id-ID")}"><span class="rsum num" id="${id}S">${fmtH(4)} → ${rp(4 * v)}</span></div>`;
  return `<div class="shead"><h2>Rates</h2>${close}</div>
    <div class="sbody form roomy"><div class="sform">
      <div class="sub">Overtime per hour</div>
      ${f("rOtS", "Stores", S.rates.store)}
      ${f("rOtH", "Head office", S.rates.ho)}
    </div></div>
    <div class="sfoot sform"><button class="btn" data-act="saverates">Save</button></div>`;
}
function sheetHTML() {
  if (S.ratesOpen) return ratesSheetHTML();
  if (S.att) return attSheetHTML();
  if (S.attP) return attPersonHTML();
  if (S.slip) return slipSheetHTML();
  const close = `<button class="icbtn" data-act="closesheet" aria-label="Close"><i data-lucide="x"></i></button>`;
  if (!draft) {
    const ds = days(S.week);
    const daysOf = (id) => PEOPLE.reduce((n, p) => n + ds.filter((iso) => S.plan[p.id][iso] === id).length, 0);
    const rows = S.shifts.map((sh) => `<button class="srow" data-edit="${sh.id}" style="--c:${sh.color}">
        <span class="tile"><i></i></span>
        <span class="who2"><span class="n">${esc(sh.name)}</span><span class="r num">${sh.start}–${sh.end} · ${fmtH(netHours(sh))}</span></span>
        <span class="cnt num">${daysOf(sh.id)} ${daysOf(sh.id) === 1 ? "day" : "days"} this week</span>
        <i data-lucide="pencil" class="pen"></i>
      </button>`).join("");
    return `<div class="shead"><h2>Shifts</h2>${close}</div>
      <div class="sbody">${rows}</div>
      <div class="sfoot"><button class="btn" data-act="add"><i data-lucide="plus"></i>New shift</button></div>`;
  }
  const valid = draft.name.trim() !== "" && draft.start && draft.end;
  const back = `<button class="icbtn" data-act="backsheet" aria-label="Back to shifts"><i data-lucide="chevron-left"></i></button>`;
  return `<div class="shead">${back}<h2>${draft.id ? esc(shiftOf(draft.id).name) : "New shift"}</h2>${close}</div>
    <div class="sbody form"><div class="sform">
      <div class="fld"><label for="sName">Name</label><input id="sName" value="${esc(draft.name)}" placeholder="Kantor" autocomplete="off"></div>
      <div class="row2">
        <div class="fld"><label for="sStart">Starts</label><input id="sStart" type="time" value="${draft.start}"></div>
        <div class="fld"><label for="sEnd">Ends</label><input id="sEnd" type="time" value="${draft.end}"></div>
      </div>
      <div class="fld"><label>Colour</label><div class="swatches">${COLORS.map((c) => `<button style="--c:${c}" data-color="${c}" aria-pressed="${c === draft.color}" aria-label="Colour"></button>`).join("")}</div></div>
    </div></div>
    <div class="sfoot sform"><span class="sum num" id="sSum">${fmtH(netHours(draft))} of work</span>
      ${draft.id ? `<button class="btn red" data-pop="remove">Remove</button>` : ""}
      <button class="btn" data-pop="save" ${valid ? "" : "disabled"}>${draft.id ? "Save" : "Add shift"}</button></div>`;
}
function drawSheet() { $("#sheet").innerHTML = sheetHTML(); icons(); }
function openSheet() {
  S.sheet = true;
  drawSheet();
  const sheet = $("#sheet"), scrim = $("#sheetScrim");
  scrim.hidden = false;
  sheet.classList.remove("closing");
  sheet.getBoundingClientRect(); scrim.getBoundingClientRect();
  sheet.classList.remove("off"); scrim.classList.remove("off");
}
function closeSheet() {
  S.sheet = false; draft = null; S.att = null; S.attP = null; S.slip = null; S.ratesOpen = false; S.adjForm = null;
  const sheet = $("#sheet"), scrim = $("#sheetScrim");
  sheet.classList.add("closing", "off"); scrim.classList.add("off");
  setTimeout(() => { if (!S.sheet) scrim.hidden = true; }, 200);
  render();
}
function openShift(shift) {
  const used = new Set(S.shifts.map((s) => s.color));
  draft = shift ? { ...shift } : { id: null, name: "", start: "08:00", end: "17:00", color: COLORS.find((c) => !used.has(c)) || COLORS[0] };
  if (!S.sheet) openSheet(); else drawSheet();
  setTimeout(() => $("#sName")?.focus(), 80);
}
document.addEventListener("input", (e) => {
  if (!e.target.closest?.(".sform") || !draft) return;
  const map = { sName: "name", sStart: "start", sEnd: "end" };
  if (!map[e.target.id]) return;
  draft[map[e.target.id]] = e.target.value;
  $("#sSum").textContent = `${fmtH(netHours(draft))} of work`;
  $("[data-pop=save]").disabled = !(draft.name.trim() && draft.start && draft.end);
});
document.addEventListener("keydown", (e) => {
  if (!S.sheet) return;
  if (e.key === "Escape") return draft ? (draft = null, drawSheet()) : (S.att && S.attP) ? (S.att = null, drawSheet()) : closeSheet();
  if (e.key === "Enter" && e.target.closest?.(".sform")) $("[data-pop=save]")?.click();
});
document.addEventListener("click", (e) => {
  if (!e.target.closest?.("#sheet") || !draft) return;
  const sw = e.target.closest("[data-color]");
  if (sw) { draft.color = sw.dataset.color; $("#sheet").querySelectorAll("[data-color]").forEach((b) => b.setAttribute("aria-pressed", b === sw)); return; }
  const b = e.target.closest("[data-pop]");
  if (!b || b.disabled) return;
  if (b.dataset.pop === "save") {
    const name = draft.name.trim();
    if (draft.id) Object.assign(shiftOf(draft.id), draft, { name });
    else { draft.id = "s" + Date.now(); S.shifts.push({ ...draft, name }); }
    toast(`${name} saved`);
  }
  if (b.dataset.pop === "remove") {
    const used = PEOPLE.some((p) => Object.values(S.plan[p.id]).includes(draft.id));
    if (used) { toast(`${draft.name} is on the roster — clear those days first`); return; }
    S.shifts = S.shifts.filter((s) => s.id !== draft.id);
  }
  draft = null;
  render();
  drawSheet();
});
$("#sheetScrim").addEventListener("pointerdown", closeSheet);

/* ───────────────────────── toast + undo ───────────────────────── */
let toastTimer, undoList = null;
function toast(text, undo = null) {
  if (undo === null) undoAtt = false;
  const t = $("#toast");
  t.querySelector("span").textContent = text;
  undoList = undo;
  $("#undo").hidden = !undo;
  t.classList.remove("off");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("off"), 4000);
}
$("#undo").addEventListener("click", () => {
  if (!undoList) return;
  if (undoAtt) {
    for (const [p, d, was] of undoList) S.punch[p][d] = was;
    undoAtt = false; undoList = null;
    $("#toast").classList.add("off");
    return render();
  }
  for (const [p, d, before, beforeOT] of undoList.slice().reverse()) {
    if (before === undefined) delete S.plan[p][d]; else S.plan[p][d] = before;
    S.ot[p] ??= {};
    if (beforeOT === undefined) delete S.ot[p][d]; else S.ot[p][d] = beforeOT;
  }
  undoList = null;
  $("#toast").classList.add("off");
  render();
});

/* ───────────────────────── prototype bar ───────────────────────── */
function devBar() {
  $("#devSeg").innerHTML = [["desk", "Desktop"], ["phone", "Phone"]].map(([v, l]) => `<button aria-pressed="${S.dev === v}" data-dev="${v}">${l}</button>`).join("");
}
$("#devSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  S.dev = b.dataset.dev; devBar();
  $("#phone").hidden = S.dev !== "phone";
  if (S.dev === "phone") $("#phoneFrame").src = `${location.pathname}?embed=1&view=${S.view}`;
});
$("#reset").addEventListener("click", () => { S.store = 0; PEOPLE = STORES[0].people; S.shifts = freshShifts(); S.plan = freshPlan(); S.ot = freshOT(); S.pub = {}; S.week = "2026-10-26"; S.day = TODAY; S.punch = {}; S.aprv = {}; S.att = null; S.attP = null; S.afilter = "all"; S.attMonth = "2026-10"; S.attDate = "2026-10-20"; S.aview = "month"; S.pay = {}; S.slip = null; S.adjForm = null; S.adj = Object.fromEntries(Object.entries(ADJ).map(([k, v]) => [k, [{ ...v }]])); S.pfilter = "all"; S.rates = { store: 8000, ho: 12000 }; S.ratesOpen = false; S.popt = "A"; S.pexp = {}; S.pcol = {}; S.pall = false; S.pfold = { earn: false, ded: false }; render(); });
addEventListener("resize", () => render());

// The inner sidebar steps aside by itself on the month roster and the month of
// attendance, the two pages that want every pixel; it comes back with the others.
let sidePref = "folded";
const syncSide = () => document.body.classList.toggle("folded", sidePref === "folded" || (S.page === "attendance" && S.aview === "month"));
syncSide();
$("#sideSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  sidePref = b.dataset.side;
  syncSide();
  $("#sideSeg").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render();
});
devBar();
render();
</script>
