<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster · Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Tokens and shell from hr-profile-prototype.html (measured on the running
   hub). Floor 15px for every line on screen. */
:root {
  --ink: #20242c; --text: #394150; --body: #565f6d; --mute: #666f7d; --faint: #b9c0c9; --line-ico: #89919d;
  --hairline: #e6e6e9; --edge: #dadade; --soft: #f8f8f9; --soft-2: #f0f0f2; --soft-3: #f6f6f7;
  --accent: #2563eb; --tint: #eff5ff; --info-fg: #2c57bf;
  --bad-fg: #be123c; --bad-bg: #fbeaea; --ok-fg: #137a37; --red: #dc2626;
  --warn-fg: #a64a08; --warn-bg: #fdf3ea;
  --rail: #242526;
  --r-card: 10px; --r-inner: 8px; --r-sheet: 16px;
  --shadow-soft: 0 1px 3px rgba(24, 39, 60, .04);
  --shadow-pop: 0 4px 12px rgba(24, 39, 60, .08), 0 16px 40px rgba(24, 39, 60, .12);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --top: 48px;
  /* One type scale (hub, 14 Oct: "header kecil seperti Apple"):
     title 17 semibold · text 15 · quiet lines 15 in grey. Nothing else.
     Weights: 600 titles and figures, 500 names and controls, 400 the rest.
     Spacing on 4·8·12·16·20; radii 8 controls · 10 cards · 12 popovers. */
  --fs-title: 17px; --lh-title: 24px;
  --fs: 15px; --lh: 22px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font: 400 var(--fs)/var(--lh) "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: -0.09px; color: var(--ink); background: var(--soft-3);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.embed { --top: 0px; }
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
.num { font-variant-numeric: tabular-nums; }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.75; flex-shrink: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mute { color: var(--mute); } .bad { color: var(--bad-fg); } .ok { color: var(--ok-fg); }

/* ── prototype bar ───────────────────────────────────────── */
.proto { position: fixed; inset: 0 0 auto 0; z-index: 100; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--hairline); }
body.embed .proto { display: none; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--soft-2); border-radius: 10px; }
.seg button { height: 30px; padding: 0 12px; border-radius: 7px; font-weight: 500; color: var(--body); transition: background-color 150ms ease, color 150ms ease; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(24, 39, 60, .08), 0 0 0 1px var(--hairline); }
.proto .reset { margin-left: auto; height: 30px; padding: 0 10px; border-radius: 7px; color: var(--body); }
.proto .reset:hover { background: var(--soft-2); }

/* ── shell ───────────────────────────────────────────────── */
.shell { position: fixed; inset: var(--top) 0 0 0; display: grid; grid-template-columns: 68px 232px minmax(0, 1fr); }
body.folded .shell { grid-template-columns: 68px minmax(0, 1fr); }
body.folded .dept { display: none; }
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; }
.rail .logo { width: 28px; height: 28px; border-radius: 8px; background: #fff; color: var(--rail); font-weight: 700; display: grid; place-items: center; margin-bottom: 14px; font-size: 16px; }
.rail .ic { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: #b9bcc2; }
.rail .ic.on { background: rgba(255, 255, 255, .1); color: #fff; }
.dept { background: #fff; border-right: 1px solid var(--hairline); }
.dept .head { height: 52px; display: flex; align-items: center; padding: 0 16px; font-weight: 600; }
.dept nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.dept nav a { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; color: var(--text); }
.dept nav a svg { width: 17px; height: 17px; color: var(--line-ico); }
.dept nav a.on { background: var(--tint); color: var(--accent); font-weight: 500; }
.dept nav a.on svg { color: var(--accent); }
.content { overflow-y: auto; padding: 20px 28px 40px; min-width: 0; }

/* ── the shops ───────────────────────────────────────────── */
.stores { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 4px; margin-bottom: 20px; background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); }
.storepick { display: none; }
.scard .sn, .scard .sc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.scard {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 8px 12px; text-align: left; line-height: 20px;
  background: transparent; border-radius: 8px;
  transition: box-shadow 150ms ease, background-color 150ms ease, transform 160ms var(--ease-out);
}
.scard:active { transform: scale(.98); }
@media (hover: hover) and (pointer: fine) { .scard:hover { background: var(--soft); } }
.scard[aria-pressed="true"] { background: var(--tint); box-shadow: 0 0 0 1.5px var(--accent) inset; }
.scard .sn { font-weight: 500; color: var(--ink); }
.scard .sc { color: var(--mute); }
.scard .ss { display: inline-flex; align-items: center; gap: 4px; color: var(--mute); }
.scard .ss.bad, .scard .ss.ok { font-weight: 500; }
.scard .ss svg { width: 16px; height: 16px; }
.scard .ss.mute { color: var(--body); }

/* ── page head ───────────────────────────────────────────── */
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; min-height: 36px; }
.head .seg { padding: 3px; border-radius: 8px; }
.head .seg button { height: 30px; border-radius: 6px; }
.head h1 { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; margin: 0; }
.head .grow { flex: 1; }
.store { height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; background: #fff; border: 1px solid var(--edge); font-weight: 500; }
.step { display: inline-flex; align-items: center; gap: 2px; }
.step .lbl { min-width: 128px; text-align: center; font-weight: 500; }
.icbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--body); transition: transform 160ms var(--ease-out), background-color 120ms ease; }
.icbtn:active { transform: scale(.94); }
@media (hover: hover) and (pointer: fine) { .icbtn:hover { background: var(--soft-2); color: var(--ink); } }
.btn { height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 8px; font-weight: 500; white-space: nowrap; background: var(--accent); color: #fff; transition: transform 160ms var(--ease-out), opacity 150ms ease; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.red { background: var(--red); }
/* Shifts: the setup of the roster's own words, in green beside Publish. */
.btn.green { background: var(--ok-fg); color: #fff; }
.btn.green svg { color: #fff; }
@media (hover: hover) and (pointer: fine) { .btn.green:hover { background: #106a30; } }
/* A supporting action: neutral, on white. */
.btn.ghost { background: #fff; color: var(--text); box-shadow: 0 0 0 1px var(--edge) inset; }
.btn.ghost svg { color: var(--line-ico); }
@media (hover: hover) and (pointer: fine) { .btn.ghost:hover { background: var(--soft-2); color: var(--ink); } }
.btn svg { width: 16px; height: 16px; }

/* ── the brushes: one per shift ──────────────────────────── */
/* ── the grid ────────────────────────────────────────────── */
.card { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: hidden; }
.grid { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; user-select: none; -webkit-user-select: none; }
.grid th { height: 44px; padding: 0 8px; background: var(--soft); border-bottom: 1px solid var(--hairline); color: var(--body); font-weight: 500; text-align: center; white-space: nowrap; }
.grid th:first-child { text-align: left; padding-left: 16px; }
.grid th.today { color: var(--accent); }
.grid th.wkend { color: var(--mute); }
.grid th.hrs, .grid td.hrs { width: 84px; text-align: right; padding-right: 16px; border-left: 1px solid var(--hairline); }
.grid tfoot td:last-child { border-left: 1px solid var(--hairline); }
@media (hover: hover) and (pointer: fine) { .grid tbody tr:hover td { background: #fbfbfc; } }
.grid col.who { width: 232px; }
.grid td { height: 64px; padding: 6px 3px; border-bottom: 1px solid var(--hairline); vertical-align: middle; transition: background-color 120ms ease; }
.grid tbody tr:last-child td { border-bottom: 0; }
.grid td.who { padding: 0 8px 0 16px; }
.grid tfoot td { height: 44px; background: var(--soft); border-top: 1px solid var(--hairline); border-bottom: 0; text-align: center; color: var(--mute); }
.grid tfoot td:first-child { text-align: left; padding-left: 16px; }
.person { display: flex; align-items: center; gap: 12px; min-width: 0; width: 100%; text-align: left; border-radius: 8px; padding: 6px; margin-left: -6px; transition: background-color 120ms ease; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-weight: 500; color: var(--body); background: linear-gradient(135deg, #e8def4, #f8dde8); }
.who2 { display: flex; flex-direction: column; min-width: 0; line-height: 20px; }
.who2 .n { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 120ms ease; }
.who2 .r { color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrs b { font-weight: 600; }
.hh { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 20px; }
.hh .ot { color: var(--mute); }
.hh .ot.bad, .cell .t.bad { color: var(--bad-fg); font-weight: 500; }

/* a month of the roster: one narrow cell a day, the shift's first letter in its colour */
.cell.mini { width: 100%; max-width: 28px; min-height: 40px; height: 40px; margin: 0 auto; border-radius: 6px; position: relative; }
.cell.mini .s { font-weight: 600; }
.grid.month th.hrs, .grid.month td.hrs { width: 112px; }
.cell.mini .otd { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.cell.mini.empty::after { font-size: 15px; }

/* a day in the plan */
.cell {
  --c: transparent;
  height: 100%; min-height: 52px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center;
  line-height: 20px; cursor: pointer; background: color-mix(in srgb, var(--c) 14%, #fff);
  transition: background-color 120ms ease, box-shadow 120ms ease;
}
.cell .s { font-weight: 500; color: var(--ink); }
.cell .t { color: var(--mute); }
/* A day still to plan: a dashed outline, and a plus when the pointer is on it. */
.cell.empty { background: transparent; outline: 1px dashed var(--edge); outline-offset: -1px; position: relative; }
.cell.empty::after { content: "+"; color: var(--line-ico); font-size: var(--fs-title); opacity: 0; transition: opacity 120ms ease; }
@media (hover: hover) and (pointer: fine) {
  .cell.empty:hover { background: var(--soft); }
  .cell.empty:hover::after { opacity: 1; }
  .cell:not(.empty):not(.leave):hover { box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 45%, var(--edge)) inset; }
  .cell.off:hover { box-shadow: 0 0 0 1px var(--edge) inset; }
}
.cell.sel.empty { outline-color: transparent; }
.cell.sel, .cell.sel.empty:hover { box-shadow: 0 0 0 2px var(--accent) inset; }
.cell.sel.empty { background: var(--tint); }
.cell.off { background: var(--soft); }
.cell.off .s { color: var(--mute); font-weight: 400; }
.cell.leave { cursor: not-allowed; background: repeating-linear-gradient(135deg, var(--soft) 0 6px, #fff 6px 12px); }
.cell.leave .s { color: var(--mute); font-weight: 400; }
.cell.landed { animation: landed 180ms var(--ease-out); }
@keyframes landed { from { transform: scale(.94); } to { transform: scale(1); } }
.cell.no { animation: no 260ms ease; }
@keyframes no { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

/* ── under 40 h: said once, above the grid ───────────────── */
.pubmark { display: inline-flex; align-items: center; gap: 4px; color: var(--ok-fg); font-weight: 500; }
.pubmark svg { width: 16px; height: 16px; }
.btn.publish { }
.scard .ss.info { color: var(--info-fg); }
.warnbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 12px 16px; margin-bottom: 16px; border-radius: var(--r-card); background: var(--bad-bg); color: var(--bad-fg); }
.warnbar svg { width: 18px; height: 18px; }
.warnbar b { font-weight: 500; }
.warnbar .nm { color: var(--bad-fg); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--bad-fg) 35%, transparent); }

/* ── a day at a time (desk) ─────────────────────────────── */
.dayview .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.dayview .days button { height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 22px; color: var(--body); background: #fff; box-shadow: 0 0 0 1px var(--hairline) inset; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
.dayview .days button:active { transform: scale(.97); }
.dayview .days button b { font-weight: 600; color: var(--ink); }
.dayview .days button[aria-pressed="true"] { background: var(--tint); color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent) inset; }
.dayview .days button[aria-pressed="true"] b { color: var(--accent); }
.dayview .days button.today:not([aria-pressed="true"]) b { color: var(--accent); }
.dayview .dayhead { display: flex; justify-content: space-between; height: 44px; align-items: center; padding: 0 16px; background: var(--soft); border-bottom: 1px solid var(--hairline); font-weight: 500; }
.dayview .plist { display: flex; flex-direction: column; padding: 0 16px; }
.dayview .prow { display: grid; grid-template-columns: minmax(0, 1fr) 280px; align-items: center; gap: 16px; padding: 6px 0; min-height: 64px; border-bottom: 1px solid var(--hairline); }
.dayview .prow:last-child { border-bottom: 0; }
.dayview .prow .cell { min-height: 52px; }

/* ── popover: a new shift ────────────────────────────────── */
.pop-scrim { position: fixed; inset: 0; z-index: 60; }
.pop {
  position: fixed; z-index: 61; width: 340px; padding: 20px; background: #fff; border-radius: 14px; border: 1px solid var(--hairline); box-shadow: var(--shadow-pop);
  transform-origin: var(--origin, top left); transition: transform 180ms var(--ease-out), opacity 180ms var(--ease-out);
}
.pop.off { opacity: 0; transform: scale(.96); pointer-events: none; }
.pop h3, .sform h3 { margin: 0 0 16px; font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; }
.fld { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.fld label { color: var(--body); font-weight: 500; }
.fld input { height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--edge); background: #fff; }
.fld input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swatches { display: flex; gap: 8px; }
.swatches button { width: 28px; height: 28px; border-radius: 8px; background: var(--c); transition: transform 160ms var(--ease-out), box-shadow 120ms ease; }
.swatches button:active { transform: scale(.92); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--c); }
.sform .foot { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
.sform .foot .sum { color: var(--mute); margin-right: auto; }

/* ── the Shifts sheet: slides in from the right over a dimmed page ── */
@keyframes formIn { from { opacity: 0; transform: translateY(-4px); } }
.scrim { position: fixed; inset: var(--top) 0 0 0; z-index: 80; background: rgb(40 30 20 / 10%); transition: opacity 340ms var(--ease-drawer); }
.scrim.off { opacity: 0; }
.sheet {
  position: fixed; top: calc(var(--top) + 12px); right: 12px; bottom: 12px; z-index: 81; width: min(480px, calc(100vw - 24px));
  display: flex; flex-direction: column; background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-sheet); box-shadow: var(--shadow-pop);
  transition: transform 340ms var(--ease-drawer);
}
.sheet.off { transform: translateX(calc(100% + 24px)); }
.sheet.closing { transition: transform 200ms var(--ease-out); }
.sheet .shead { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 28px; border-bottom: 1px solid var(--hairline); }
.sheet .shead h2 { margin: 0; flex: 1; font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; }
.sheet .sbody { flex: 1; overflow-y: auto; padding: 16px 16px 24px; }
.sheet .sbody.form { padding: 28px; animation: formIn 160ms var(--ease-out); }
.sheet .sfoot { flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 28px; border-top: 1px solid var(--hairline); }
.sheet .sfoot .sum { margin-right: auto; color: var(--mute); }
.srow { --c: var(--line-ico); width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; text-align: left; transition: background-color 120ms ease, transform 160ms var(--ease-out); }
.srow:active { transform: scale(.99); }
@media (hover: hover) and (pointer: fine) { .srow:hover { background: var(--soft); } .srow:hover .cnt { display: none; } .srow:hover .pen { display: block; } }
.srow .tile { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, #fff); }
.srow .tile i { display: block; width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.srow .cnt { margin-left: auto; color: var(--mute); white-space: nowrap; }
.srow .pen { margin-left: auto; width: 16px; height: 16px; color: var(--line-ico); display: none; }
.sheet .sform .fld { margin-bottom: 24px; }
.sheet .sform .row2 { gap: 16px; }

/* ── attendance ──────────────────────────────────────────── */
.afilters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin: 0 0 20px; }
.afilters .seg { padding: 3px; border-radius: 8px; }
.afilters .seg button { height: 30px; border-radius: 6px; white-space: nowrap; }
.afilters .cn { color: var(--mute); margin-left: 4px; }
.afilters .seg button[aria-pressed="true"] .cn { color: var(--ink); }
.afilters .open { font-weight: 500; }
.acell { width: 100%; height: 100%; min-height: 52px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fff; box-shadow: 0 0 0 1px var(--hairline) inset; color: var(--text); position: relative; transition: background-color 120ms ease, box-shadow 120ms ease, transform 160ms var(--ease-out); }
button.acell { cursor: pointer; }
button.acell:active { transform: scale(.98); }
@media (hover: hover) and (pointer: fine) { button.acell:hover { box-shadow: 0 0 0 1px var(--edge) inset; background: var(--soft); } }
.acell .lt { color: var(--warn-fg); font-weight: 500; }
.acell.absent { background: var(--bad-bg); color: var(--bad-fg); box-shadow: none; font-weight: 500; }
.acell.noout { background: var(--warn-bg); color: var(--warn-fg); box-shadow: none; }
.acell.now { color: var(--info-fg); background: var(--tint); box-shadow: none; }
.acell.off { background: var(--soft); box-shadow: none; color: var(--mute); }
.acell.leave { background: repeating-linear-gradient(135deg, var(--soft) 0 6px, #fff 6px 12px); box-shadow: none; color: var(--mute); }
.acell.none { background: transparent; box-shadow: none; color: var(--faint); }
.acell.fixed::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.empty-note { padding: 32px; text-align: center; color: var(--mute); }
.afacts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-bottom: 24px; }
.afacts .l { display: block; color: var(--mute); }
.afacts .v { display: block; color: var(--ink); font-weight: 500; }
.afacts .v.bad { color: var(--bad-fg); } .afacts .v.warn { color: var(--warn-fg); } .afacts .v.ok { color: var(--ok-fg); }
.anote { margin: 0 0 16px; padding: 12px 16px; border-radius: 8px; background: var(--soft); color: var(--body); }
.rsum { color: var(--mute); }
.xdel { width: 24px; height: 24px; margin-left: 8px; border-radius: 6px; display: inline-grid; place-items: center; color: var(--line-ico); vertical-align: middle; }
.xdel svg { width: 14px; height: 14px; }
@media (hover: hover) and (pointer: fine) { .xdel:hover { background: var(--soft-2); color: var(--ink); } }
.hdtot { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 20px; margin: 0 4px; }
.hdtot .l { color: var(--mute); } .hdtot b { font-weight: 600; color: var(--ink); }
/* The total stays in view while the people scroll under it. */
.card.desk:has(.grid.pay) { overflow: clip; }
.grid.pay tfoot td { position: sticky; bottom: 0; z-index: 3; box-shadow: 0 -1px 0 var(--hairline); }
.sheet .sub { font-weight: 500; color: var(--ink); margin: 24px 0 8px; }
.sheet .sub:first-of-type { margin-top: 0; }
.sheet .sbody.form.roomy { padding: 36px; }

/* ── attendance by the month ─────────────────────────────── */
.grid.month th.am-h { padding: 4px 0; height: 52px; font-weight: 400; line-height: 20px; }
.grid.month th.am-h span { display: block; color: var(--mute); }
.grid.month th.am-h b { display: block; font-weight: 500; color: var(--ink); }
.grid.month th.am-h.wkend span, .grid.month th.am-h.wkend b { color: var(--mute); }
.grid.month th.am-h.today b { color: var(--accent); }
.grid.month td { height: 56px; padding: 0; }
.grid.month td.who { padding: 0 8px 0 16px; }
.grid.month td.amc { padding: 0 1px; text-align: center; }
.grid.month tfoot td.amc { color: var(--mute); }
.grid.month th.tcol, .grid.month td.tcol { text-align: right; padding-right: 12px; border-left: 0; width: auto; }
.grid.month th.tcol:first-of-type, .grid.month td.tcol:first-of-type { border-left: 1px solid var(--hairline); padding-right: 16px; }
.grid.month td.tcol:nth-last-child(3) { border-left: 1px solid var(--hairline); padding-right: 16px; }
.grid.month th.tcol { padding: 0 12px 0 0; }
.grid.month th.tcol:nth-last-child(3) { border-left: 1px solid var(--hairline); padding-right: 16px; }
.lt2 { color: var(--warn-fg); font-weight: 500; }
.grid.month .person { background: none; padding: 6px; }
@media (hover: hover) and (pointer: fine) { .grid.month .person:hover { background: var(--soft); } .grid.month .person:hover .n { color: var(--accent); } }
.am { width: 100%; max-width: 28px; height: 36px; margin: 0 auto; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--faint); position: relative; }
.am.wkend { background: var(--soft); }
button.am { cursor: pointer; transition: background-color 100ms ease, transform 140ms var(--ease-out); }
button.am:active { transform: scale(.94); }
.am.ok { color: var(--line-ico); }
.am.now { color: var(--accent); background: var(--tint); }
.am.late { background: var(--warn-bg); color: var(--warn-fg); font-weight: 500; }
.am.noout { background: var(--warn-bg); color: var(--warn-fg); font-weight: 500; }
.am.absent { background: var(--bad-bg); color: var(--bad-fg); font-weight: 500; }
.am.off { background: var(--soft); }
.am.leave { background: repeating-linear-gradient(135deg, var(--soft) 0 4px, #fff 4px 8px); }
.am.none { background: transparent; }
@media (hover: hover) and (pointer: fine) { button.am.ok:hover { background: var(--soft-2); } button.am:hover { box-shadow: 0 0 0 1px var(--edge) inset; } }
.am.fixed::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 12px 4px; color: var(--mute); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.am-l { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 500; }
.am-l.late, .am-l.noout { background: var(--warn-bg); color: var(--warn-fg); }
.am-l.absent { background: var(--bad-bg); color: var(--bad-fg); }
.am-l.off { background: var(--soft); box-shadow: 0 0 0 1px var(--hairline) inset; }
.am-l.leave { background: repeating-linear-gradient(135deg, var(--soft) 0 4px, #fff 4px 8px); box-shadow: 0 0 0 1px var(--hairline) inset; }
.dotb { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
.drow { width: 100%; display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 8px; text-align: left; }
.drow.click { transition: background-color 120ms ease; }
@media (hover: hover) and (pointer: fine) { .drow.click:hover { background: var(--soft); } }
.drow .dn { color: var(--body); }
.drow .dt { color: var(--ink); }
.drow .st { color: var(--mute); text-align: right; }
.drow .st.late, .drow .st.noout { color: var(--warn-fg); } .drow .st.absent { color: var(--bad-fg); }
.person.prow { width: 100%; }
.person.prow .who2 .r { white-space: normal; }
.chev { margin-left: auto; width: 16px; height: 16px; color: var(--line-ico); }

/* ── payroll ─────────────────────────────────────────────── */
/* grouped */
.grid.grouped tr.gr td { height: 48px; background: var(--soft); border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); color: var(--body); padding: 0 20px 0 24px; font-weight: 500; }
.grid.grouped tr.gr td.pn2 { padding-right: 20px; }
.grid.grouped .exp { width: 16px; height: 16px; color: var(--line-ico); transition: transform 160ms var(--ease-out); flex-shrink: 0; margin-left: -4px; }
.grid.grouped tr.opened .exp { transform: rotate(90deg); }
.grid.grouped tr.subrow td { height: auto; padding: 8px 24px 24px 72px; background: #fbfbfc; }
.split { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0 48px; align-items: start; }
.split .shd { color: var(--mute); margin-bottom: 4px; }
.sl2 { display: flex; justify-content: space-between; gap: 24px; min-height: 36px; align-items: center; }
.slact { align-self: end; }
.grid.pay.grouped td.pn2 .pc.need { margin-right: 0; }
/* difference */
.grid.pay.diff td.why { display: table-cell; padding: 0 16px 0 8px; }
.wy { display: inline-block; padding: 4px 10px; margin: 2px 6px 2px 0; border-radius: 8px; font-variant-numeric: tabular-nums; }
.wy.chg { background: var(--warn-bg); color: var(--warn-fg); } .wy.bad2 { background: var(--bad-bg); color: var(--bad-fg); }
/* queue */
.card.queue { overflow: hidden; }
.qsec + .qsec { border-top: 1px solid var(--hairline); }
.qhead { width: 100%; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 24px; text-align: left; font-weight: 500; background: var(--soft); transition: background-color 120ms ease; }
.qhead svg { width: 16px; height: 16px; color: var(--line-ico); transition: transform 160ms var(--ease-out); }
.qhead[aria-expanded="true"] svg { transform: rotate(90deg); }
.qhead .cn { color: var(--mute); }
.qrow { display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 0 24px; border-top: 1px solid var(--hairline); cursor: pointer; transition: background-color 120ms ease; }
@media (hover: hover) and (pointer: fine) { .qrow:hover { background: var(--soft); } }
.qrow .who2 { flex: 1; }
.qrow .qn { min-width: 150px; display: flex; flex-direction: column; align-items: flex-end; line-height: 20px; }
.qrow .qn b { font-weight: 600; }
.linkbtn { color: var(--accent); font-weight: 500; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
.grid.pay td { height: 72px; padding: 0 20px 0 8px; }
.grid.pay th { height: 52px; padding: 0 20px 0 8px; }
.grid.pay td.who, .grid.pay th:first-child { padding: 0 8px 0 24px; text-align: left; }
.grid.pay .av { width: 40px; height: 40px; }
.grid.pay tr.grp th { height: 40px; background: #fff; border-bottom: 0; color: var(--mute); font-weight: 400; text-align: left; padding: 0 0 0 8px; }
.grid.pay tr.grp th.gh { border-bottom: 1px solid var(--hairline); }
.grid.pay .sep { border-left: 1px solid var(--hairline); }
.grid.pay td.net b { font-weight: 600; }
.grid.pay td.bk { color: var(--body); text-align: right; padding-right: 24px; }
.grid.pay th:last-child { padding-right: 24px; }
.grid.pay tfoot td { height: 52px; background: var(--soft); border-top: 1px solid var(--hairline); color: var(--body); }
.grid.pay tfoot td:first-child { text-align: left; }
.grid.pay .acc { color: var(--accent); font-weight: 500; } .grid.pay .ok { color: var(--ok-fg); font-weight: 500; }
.grid.pay .seen { width: 15px; height: 15px; vertical-align: -2px; }
button.pc.need.sm { justify-content: flex-start; min-height: 24px; margin: 0; padding: 0 8px; white-space: nowrap; }
.pc { display: inline-flex; align-items: center; justify-content: flex-end; min-height: 32px; padding: 0 8px; margin-right: -8px; border-radius: 8px; }
.pc.chg { background: var(--warn-bg); color: var(--warn-fg); }
.pc.bad2 { background: var(--bad-bg); color: var(--bad-fg); }
button.pc.need { background: var(--warn-bg); color: var(--warn-fg); font-weight: 500; box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn-fg) 30%, transparent) inset; transition: transform 140ms var(--ease-out), background-color 120ms ease; }
button.pc.need:active { transform: scale(.96); }
.grid.pay th.pn2, .grid.pay td.pn2 { text-align: right; white-space: nowrap; }
.grid.pay tr.click { cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .grid.pay tr.click:hover td { background: var(--soft); } }
.grid.pay .seen { width: 15px; height: 15px; color: var(--ok-fg); vertical-align: -2px; }
.slipnet { display: flex; flex-direction: column; gap: 4px; margin-bottom: 40px; }
.slipnet .l { color: var(--mute); }
.slipnet .v { font-size: 28px; line-height: 36px; font-weight: 600; color: var(--ink); }
.sl { width: calc(100% + 24px); display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; padding: 0 12px; margin: 0 -12px; border-radius: 8px; text-align: left; }
.sl.click { transition: background-color 120ms ease; }
@media (hover: hover) and (pointer: fine) { .sl.click:hover { background: var(--soft); } }
.person.prow .rt { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; line-height: 20px; }
.person.prow .rt b { font-weight: 500; }

/* ── F–I: two columns ────────────────────────────────────── */
.grid.pay td.two { vertical-align: middle; }
.grid.pay td.two .t { display: block; }
.grid.pay td.two .s { display: block; max-width: 280px; margin-left: auto; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid.pay td.two .s.chg { color: var(--warn-fg); }
.pcell { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; min-height: 36px; padding: 0 8px; margin-right: -8px; border-radius: 8px; transition: background-color 120ms ease; }
@media (hover: hover) and (pointer: fine) { .pcell:hover { background: var(--soft-2); } }
.bd { min-width: 28px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--soft-2); color: var(--body); font-size: 15px; line-height: 22px; text-align: center; }
.bd.chg { background: var(--warn-bg); color: var(--warn-fg); }
.bd.none { visibility: hidden; }
.cl { display: flex; justify-content: space-between; gap: 32px; min-height: 36px; align-items: center; padding: 0 12px; }
.cl.chg { color: var(--warn-fg); } .cl.tot { font-weight: 500; }
.grid.ledger tr.lg td { height: 44px; background: #fbfbfc; border-bottom: 1px solid var(--hairline); }
.grid.ledger tr.lg td.who { padding-left: 88px; }
.grid.ledger tr.lg .lbl2 { color: var(--body); } .grid.ledger tr.lg .lbl2.chg { color: var(--warn-fg); }
.grid.ledger .exp { width: 16px; height: 16px; color: var(--line-ico); transition: transform 160ms var(--ease-out); flex-shrink: 0; margin-left: -4px; }
.grid.ledger tr.opened .exp { transform: rotate(90deg); }
.grid.ledger th .tog { margin-left: 12px; }
.gfold { display: inline-flex; align-items: center; gap: 6px; color: var(--body); font-weight: 500; }
.gfold svg { width: 16px; height: 16px; transition: transform 160ms var(--ease-out); }
.gfold[aria-expanded="true"] svg { transform: rotate(90deg); }
@media (hover: hover) and (pointer: fine) { .gfold:hover { color: var(--ink); } }
.cd { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--warn-fg); margin-left: 8px; vertical-align: middle; }

/* ── swap ── */
.swapbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 16px; border-radius: var(--r-card); background: var(--tint); color: var(--accent); }
.swapbar svg { width: 18px; height: 18px; }
.swapbar span { flex: 1; } .swapbar b { font-weight: 500; }
.cell.swapsrc { box-shadow: 0 0 0 2px var(--accent) inset; background: var(--tint); }
body:has(.swapbar) .cell:not(.leave) { cursor: crosshair; }
/* ── attendance overtime ── */
.am.ot { background: var(--tint); color: var(--accent); font-weight: 500; }
.am.late.otm { background: var(--warn-bg); color: var(--accent); font-weight: 500; }
.am-l.ot { background: var(--tint); color: var(--accent); }
.otc { color: var(--accent); font-weight: 500; }
.acell.hasot { flex-direction: column; gap: 0; line-height: 20px; }
.acell .otm { color: var(--accent); font-weight: 500; }
/* ── J · multi-row ── */
.grid.pay.stack td { height: auto; padding: 12px 24px 12px 8px; vertical-align: top; }
.grid.pay.stack td.who { padding: 14px 8px 12px 24px; vertical-align: top; }
.grid.pay.stack td.net { vertical-align: middle; }
.grid.pay.stack th { text-align: left; }
.grid.pay.stack th.pn2 { text-align: right; }
.grid.pay.stack td.stc { padding: 10px 32px 10px 16px; }
.grid.pay.stack tfoot td.stc { text-align: right; padding: 0 32px 0 16px; vertical-align: middle; height: 52px; }
.stk { display: flex; flex-direction: column; }
.ln { display: flex; justify-content: space-between; gap: 24px; min-height: 30px; align-items: center; color: var(--body); }
.ln .num { color: var(--ink); }
.ln.chg, .ln.chg .num { color: var(--warn-fg); }
.ln.tt { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--hairline); color: var(--mute); }
.ln.tt .num { color: var(--ink); font-weight: 500; }
.grid.pay.stack td.net b { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; }
/* ── the menu on a day ───────────────────────────────────── */
.menu-scrim { position: fixed; inset: 0; z-index: 70; background: rgb(32 36 44 / 14%); }
.menu {
  position: fixed; z-index: 71; width: 264px; padding: 6px; background: #fff; border-radius: 12px; border: 1px solid var(--hairline); box-shadow: var(--shadow-pop);
  transform-origin: var(--origin, top left); transition: transform 150ms var(--ease-out), opacity 150ms var(--ease-out);
}
.menu.off { opacity: 0; transform: scale(.96); pointer-events: none; }
.menu .mhead { padding: 8px 12px 4px; color: var(--mute); }
.mitem { --c: var(--line-ico); width: 100%; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 8px; text-align: left; transition: background-color 100ms ease, transform 120ms var(--ease-out); }
.mitem:active { transform: scale(.98); }
@media (hover: hover) and (pointer: fine) { .mitem:hover { background: var(--soft-2); } }
.mitem .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--c); flex-shrink: 0; }
.mitem .mi, .mot .mi { width: 16px; height: 16px; color: var(--line-ico); }
.mitem .mn { font-weight: 500; }
.mitem .mt { margin-left: auto; color: var(--mute); }
.mitem .mk { margin-left: auto; color: var(--faint); }
.mitem .mt + .mk, .mitem .mt + svg { margin-left: 8px; }
.mitem svg.lucide:last-child:not(.mi) { margin-left: auto; color: var(--accent); width: 16px; height: 16px; }
.mitem .mt + svg.lucide:last-child { margin-left: 8px; }
.menu .mrule { height: 1px; background: var(--hairline); margin: 6px 4px; }
.mot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 4px 12px; }
.mot .mn { display: inline-flex; align-items: center; gap: 12px; font-weight: 500; }
.ots { display: inline-flex; gap: 2px; padding: 2px; background: var(--soft-2); border-radius: 8px; }
.ots button { min-width: 32px; height: 28px; padding: 0 6px; border-radius: 6px; color: var(--body); font-weight: 500; transition: background-color 120ms ease; }
.ots button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px var(--hairline); }
.mrow { display: flex; align-items: center; gap: 2px; }
.mrow .mitem { flex: 1; min-width: 0; }
.medit { width: 40px; height: 40px; display: none; place-items: center; border-radius: 8px; color: var(--line-ico); }
.phone-only { display: none; }

/* ── toast ───────────────────────────────────────────────── */
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 90; transform: translate(-50%, 0); display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 16px; background: var(--ink); color: #fff; border-radius: 10px; box-shadow: var(--shadow-pop); transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
.toast.off { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }
.toast button { height: 30px; padding: 0 12px; border-radius: 7px; background: rgba(255, 255, 255, .14); color: #fff; font-weight: 500; }

/* ── phone frame ─────────────────────────────────────────── */
.phone-stage { position: fixed; inset: var(--top) 0 0 0; z-index: 95; background: var(--soft-3); display: grid; place-items: center; overflow: auto; padding: 20px; }
.phone-stage iframe { width: 414px; height: min(896px, calc(100vh - 88px)); border: 0; border-radius: 28px; background: #fff; box-shadow: 0 0 0 10px #1b1c1e, var(--shadow-pop); }

/* ── phone ───────────────────────────────────────────────── */
.phonebar, .days, .plist { display: none; }
@media (max-width: 767px) {
  body { background: #fff; }
  .shell { display: block; inset: 0; }
  .rail, .dept, .desk-only { display: none !important; }
  .content { position: absolute; inset: 52px 0 0 0; padding: 12px 16px 32px; }
  .phonebar { display: flex; position: absolute; inset: 0 0 auto 0; height: 52px; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--hairline); background: #fff; font-weight: 600; font-size: var(--fs-title); }
  .phonebar .store { height: 32px; font-size: 15px; }
  .head { gap: 10px; margin-bottom: 12px; }
  .head h1 { display: none; }
  .storepick { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 8px 12px; margin-bottom: 10px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px var(--edge) inset; text-align: left; }
  .storepick .who2 .r.ok { color: var(--ok-fg); }
  .storepick svg { transition: transform 200ms var(--ease-out); }
  .storepick[aria-expanded="true"] svg { transform: rotate(180deg); }
  .stores { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
  .stores.open { display: grid; }
  .scard { padding: 6px 10px; }
  .head .seg { display: none; }
  .head .step { width: 100%; justify-content: space-between; }
  .afilters .seg { width: 100%; overflow-x: auto; }
  .afilters .seg button { flex: 1; padding: 0 8px; }
  .head .btn.publish, .head .btn.green { flex: 1; justify-content: center; height: 44px; }
  .head .step .lbl { min-width: 0; }
  .card.desk { display: none; }
  .qhead { padding: 0 16px; }
  .qrow { flex-wrap: wrap; gap: 12px 12px; padding: 14px 16px; min-height: 0; }
  .qrow .who2 { flex: 1 1 0; min-width: 0; }
  .qrow .qn { min-width: 0; }
  .qrow .btn { order: 3; flex: 1 0 100%; justify-content: center; height: 44px; }
  .slipnet .v { font-size: 22px; }
  .plist .prow.person { grid-template-columns: none; display: flex; padding: 10px 0; border-radius: 0; gap: 12px; }

  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 12px; }
  .days button { height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 20px; color: var(--body); transition: background-color 150ms ease, color 150ms ease; }
  .days button b { font-weight: 600; color: var(--ink); }
  .days button[aria-pressed="true"] { background: var(--tint); color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent) inset; }
  .days button[aria-pressed="true"] b { color: var(--accent); }
  .days button.today:not([aria-pressed="true"]) b { color: var(--accent); }

  .plist { display: flex; flex-direction: column; }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) 132px; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--hairline); }
  .prow:last-child { border-bottom: 0; }
  .prow .cell { min-height: 44px; }
  .prow .hr { color: var(--mute); }
  .prow .who2 .r .bad { font-weight: 500; }
  .phead { display: flex; justify-content: space-between; color: var(--body); padding: 4px 0 8px; border-bottom: 1px solid var(--hairline); }

  .menu { left: 8px !important; right: 8px; top: auto !important; bottom: calc(8px + env(safe-area-inset-bottom)); width: auto; transform-origin: bottom center; padding: 8px; border-radius: 16px; }
  .menu.off { transform: translateY(16px); }
  .mitem { height: 48px; }
  .medit { display: grid; }
  .phone-only { display: flex; }
  .mrow .medit.phone-only { display: grid; }
  .ots button { min-width: 40px; height: 36px; }

  .sheet { top: 40px; left: 0; right: 0; bottom: 0; width: auto; border-radius: 16px 16px 0 0; }
  .sheet.off { transform: translateY(100%); }
  .sheet .shead { padding: 0 8px 0 20px; }
  .sheet .sbody.form { padding: 20px; }
  .sheet .sfoot { padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); }
  .sheet .sfoot .btn { height: 44px; flex: 1; justify-content: center; }
  .sheet .sfoot .sum { display: none; }
  .pop { left: 8px !important; right: 8px; top: auto !important; bottom: 8px; width: auto; transform-origin: bottom center; }
  .pop.off { transform: translateY(16px); }
  .pop .fld input { height: 48px; }
  .toast { bottom: 16px; width: max-content; max-width: calc(100% - 32px); }
}

<script>
/* ───────────────────────── data ───────────────────────── */
const Q = new URLSearchParams(location.search);
if (Q.get("embed") === "1") document.body.classList.add("embed");

const COLORS = ["#ee8b2e", "#4a82f0", "#8a6cf0", "#46a06a", "#d65b95", "#1f9fb4", "#b7791f"];
const crew = (rows) => rows.map(([id, name, role]) => ({ id, name, role }));
const STORES = [
  { id: "C001", name: "Purwokerto", people: crew([
    ["p1", "Dewi Lestari", "Store head"], ["p2", "Siti Rahayu", "Cashier"], ["p3", "Bayu Pratama", "Cashier"],
    ["p4", "Nur Aini", "Stock keeper"], ["p5", "Rizky Ananda", "Cashier"], ["p6", "Wulan Sari", "Stock keeper"],
    ["p7", "Fajar Nugroho", "Cashier"], ["p8", "Andi Saputra", "Security"], ["p9", "Lina Marlina", "Admin"]]) },
  { id: "C002", name: "Cilacap", people: crew([
    ["c1", "Hendra Wijaya", "Store head"], ["c2", "Putri Ayu", "Cashier"], ["c3", "Agus Salim", "Cashier"],
    ["c4", "Mega Puspita", "Stock keeper"], ["c5", "Yoga Pratama", "Cashier"], ["c6", "Rina Oktavia", "Admin"],
    ["c7", "Dimas Arya", "Security"]]) },
  { id: "C003", name: "Banjarnegara", people: crew([
    ["b1", "Sri Wahyuni", "Store head"], ["b2", "Eko Saputro", "Cashier"], ["b3", "Fitri Handayani", "Cashier"],
    ["b4", "Joko Susilo", "Stock keeper"], ["b5", "Ani Rahmawati", "Cashier"], ["b6", "Bambang Irawan", "Security"],
    ["b7", "Desi Ratnasari", "Cashier"], ["b8", "Teguh Santoso", "Admin"]]) },
  { id: "C004", name: "Tegal", people: crew([
    ["t1", "Rudi Hartono", "Store head"], ["t2", "Nina Kurnia", "Cashier"], ["t3", "Ilham Maulana", "Cashier"],
    ["t4", "Sari Indah", "Stock keeper"], ["t5", "Wahyu Hidayat", "Security"], ["t6", "Lestari Ningsih", "Cashier"]]) },
];
const TOWNS = [["C005", "Purbalingga"], ["C006", "Kebumen"], ["C007", "Wonosobo"], ["C008", "Magelang"], ["C009", "Brebes"], ["C010", "Pemalang"], ["C011", "Pekalongan"], ["C012", "Batang"]];
const FIRST = ["Ayu", "Budi", "Citra", "Dani", "Erna", "Feri", "Gita", "Hadi", "Indah", "Jaka", "Kiki", "Lukman", "Maya", "Nanda", "Oki", "Prita", "Reza", "Sinta", "Tono", "Umi"];
const LAST = ["Permana", "Lestari", "Setiawan", "Kusuma", "Hidayat", "Wibowo", "Saputri", "Nugraha", "Utami", "Santoso"];
const ROLES = ["Store head", "Cashier", "Cashier", "Stock keeper", "Cashier", "Security", "Admin", "Cashier"];
TOWNS.forEach(([id, name], k) => {
  const n = 6 + (k % 3);
  STORES.push({ id, name, people: crew(Array.from({ length: n }, (_, i) => [`x${k}-${i}`, `${FIRST[(k * 3 + i) % FIRST.length]} ${LAST[(k + i * 7) % LAST.length]}`, ROLES[i]])) });
});
STORES.push({ id: "HO", name: "Head Office", people: crew([
  ["h1", "Rina Kusuma", "HR manager"], ["h2", "Arif Mahendra", "Finance"], ["h3", "Sinta Dewi", "Finance"], ["h4", "Yusuf Hakim", "Buyer"],
  ["h5", "Mira Anggraini", "Buyer"], ["h6", "Dedi Kurniawan", "IT"], ["h7", "Laras Wulandari", "Merchandiser"]]) });
const unitOf = (pid) => STORES.find((st) => st.people.some((p) => p.id === pid));
let PEOPLE = STORES[0].people;
const TODAY = "2026-10-26"; // a Monday
const LEAVE = { p2: ["2026-10-29"], p6: ["2026-11-04", "2026-11-05"] };
const MIN_HOURS = 40;

// Overtime on top of a day's shift, in hours: Fajar stays two on Friday for
// the stock count, Andi one on Thursday.
function freshOT() {
  return { p7: { "2026-10-30": 2, "2026-10-21": 2 }, p8: { "2026-10-29": 1 }, p5: { "2026-10-22": 2, "2026-10-14": 1 }, p2: { "2026-10-08": 1 }, h2: { "2026-10-22": 3 }, h4: { "2026-10-21": 2 } };
}
function freshShifts() {
  return [
    { id: "s1", name: "Pagi", start: "07:30", end: "16:30", color: COLORS[0] },
    { id: "s2", name: "Siang", start: "13:00", end: "22:00", color: COLORS[1] },
    { id: "s3", name: "Middle", start: "10:00", end: "19:00", color: COLORS[2] },
    { id: "s4", name: "Long", start: "07:30", end: "20:30", color: COLORS[3] },
  ];
}
// Last week and this one written, next week half done: a roster mid-build.
function freshPlan() {
  const plan = {};
  const pattern = {
    p1: ["s1", "s1", "s1", "s1", "s1", "OFF", "OFF"],
    p2: ["s1", "s1", "OFF", null, "s2", "s2", "s1"],
    p3: ["s2", "s2", "s2", "OFF", "s2", null, "OFF"],
    p4: ["s1", "s1", "s1", "s1", "OFF", "s1", "OFF"],
    p5: ["s2", "OFF", "s2", "s2", "s2", "s2", "OFF"],
    p6: ["s3", "s3", "s3", "OFF", "s3", "s3", "OFF"],
    p7: ["OFF", "s2", "s2", "s2", "s1", "s1", "OFF"],
    p8: ["s1", "s2", "s1", "s2", "s1", "OFF", "OFF"],
    p9: ["s3", "s3", "s3", "s3", "s3", "OFF", "OFF"],
  };
  // The other shops borrow Purwokerto's weeks, turned a little: Cilacap has
  // two people short, Banjarnegara is done, Tegal has not started this week.
  const base = Object.values(pattern);
  STORES.slice(1).forEach((store, k) => store.people.forEach((p, i) => {
    const week = base[(i + k + 1) % base.length].slice();
    if (store.id === "HO") { pattern[p.id] = ["s1", "s1", "s1", "s1", "s1", "OFF", "OFF"]; return; }
    if (store.id === "C002" && i < 2) week[5] = "OFF";
    if (store.id === "C003" || /^C00[5-9]$|^C01[01]$/.test(store.id) && !["C006","C010"].includes(store.id)) for (let d = 0; d < 7; d++) if (week[d] === null) week[d] = "s1";
    pattern[p.id] = week;
  }));
  for (const p of STORES.flatMap((store) => store.people)) {
    plan[p.id] = {};
    pattern[p.id].forEach((s, i) => {
      if (p.id.startsWith("t") || /^x[258]-/.test(p.id)) { if (s) plan[p.id][addDays("2026-10-19", i)] = s; return; }
      if (s) plan[p.id][addDays("2026-10-19", i)] = s;
      if (s) plan[p.id][addDays("2026-10-26", i)] = s;
      if (s && i < 3 && ["p1", "p4", "p9"].includes(p.id)) plan[p.id][addDays("2026-11-02", i)] = s;
      if (s) for (const mon of ["2026-09-28", "2026-10-05", "2026-10-12"]) plan[p.id][addDays(mon, i)] = s;
    });
  }
  delete plan.p2["2026-10-29"];
  plan.p5["2026-10-31"] = "s4"; // Rizky's Saturday is a long one
  return plan;
}

// One-off extras HR adds for the month: a bonus (earning) and a uniform (deduction).
const ADJ = { p5: { label: "Sales bonus", amt: 150000, kind: "earn" }, p6: { label: "Uniform", amt: 80000, kind: "ded" } };
const S = {
  view: Q.get("view") === "day" ? "day" : "week", rmonth: "2026-10",
  week: "2026-10-26", day: TODAY,
  store: 0, sel: [], swapFrom: null,
  page: ["attendance", "payroll"].includes(Q.get("page")) ? Q.get("page") : "roster",
  adj: Object.fromEntries(Object.entries(ADJ).map(([k, v]) => [k, [{ ...v }]])), adjForm: null,
  rates: { store: 8000, ho: 12000 }, ratesOpen: false, pay: {}, slip: null, pfilter: "all", popt: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"].includes((Q.get("opt") || "").toUpperCase()) ? Q.get("opt").toUpperCase() : "A", pexp: {}, pcol: {}, pall: false, pfold: { earn: false, ded: false }, pcompOpen: false,
  attMonth: "2026-10", attDate: "2026-10-20", aview: "month", afilter: "all", att: null, attP: null, punch: {}, aprv: {},
  shifts: freshShifts(), plan: freshPlan(), ot: freshOT(), pub: {},
  dev: "desk",
};

/* ───────────────────────── helpers ───────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const icons = () => window.lucide && lucide.createIcons();
const phone = () => matchMedia("(max-width: 767px)").matches;
function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dnum = (iso) => +iso.slice(8, 10);
const dlabel = (iso) => `${dnum(iso)} ${MON[+iso.slice(5, 7) - 1]}`;
const weekLabel = (mon) => `${dlabel(mon)} – ${dlabel(addDays(mon, 6))}`;
const days = (mon) => [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(mon, i));
const initials = (n) => n.split(" ").map((w) => w[0]).slice(0, 2).join("");
const shiftOf = (id) => S.shifts.find((s) => s.id === id);
const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
function netHours(s) {
  let span = mins(s.end) - mins(s.start); if (span <= 0) span += 1440;
  if (span > 360) span -= 60; // an hour's break past six hours
  return span / 60;
}
const fmtH = (h) => (Number.isInteger(h) ? `${h}` : h.toFixed(1)) + " h";
const onLeave = (pid, iso) => (LEAVE[pid] || []).includes(iso);
const at = (pid, iso) => (onLeave(pid, iso) ? "LEAVE" : S.plan[pid][iso]);
// A day is eight normal hours at most; what a shift runs past that, and any
// overtime asked on top of it, is overtime (UU 13/2003: at most 4 h a day,
// 18 h a week). Days beyond five are not turned into overtime: the hours column
// says what the roster plans, and overtime only what was asked.
const DAY_NORMAL = 8, OT_DAY = 4, OT_WEEK = 18;
function dayNormalSum(pid, mon) {
  return days(mon).reduce((sum, iso) => { const s = shiftOf(at(pid, iso)); return sum + (s ? Math.min(netHours(s), DAY_NORMAL) : 0); }, 0);
}
const weekHours = (pid, mon) => dayNormalSum(pid, mon);
function dayOT(pid, iso) {
  const s = shiftOf(at(pid, iso));
  if (!s) return 0;
  return Math.max(netHours(s) - DAY_NORMAL, 0) + ((S.ot[pid] || {})[iso] || 0);
}
const weekOT = (pid, mon) => days(mon).reduce((n, iso) => n + dayOT(pid, iso), 0);
const otOver = (pid, mon) => weekOT(pid, mon) > OT_WEEK || days(mon).some((iso) => dayOT(pid, iso) > OT_DAY);

/* ───────────────────────── attendance: what was clocked ───────────────────────── */
// Punches are made up from the roster, the same every time: most people are
// on time, a few are late, one is absent, one forgot to clock out.
const NOW = "10:30"; // the clock on TODAY
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) % 100; }
const hm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const FORCED = { "p2|2026-10-19": { late: 16 }, "p3|2026-10-20": { absent: true }, "p4|2026-10-21": { noout: true }, "p6|2026-10-22": { fix: true, in: "10:05", out: "19:02", note: "Fingerprint would not read" }, "p9|2026-10-23": { late: 22 }, "p7|2026-10-19": { late: 9 } };
function punchOf(pid, iso) {
  S.punch[pid] ??= {};
  if (S.punch[pid][iso] !== undefined) return S.punch[pid][iso];
  let rec = null;
  const sh = shiftOf(S.plan[pid]?.[iso]);
  if (sh && !onLeave(pid, iso) && iso < TODAY) {
    const r = hash(`${pid}${iso}`), f = FORCED[`${pid}|${iso}`] || {};
    const start = mins(sh.start), end = mins(sh.end) + (((S.ot[pid] || {})[iso] || 0) * 60);
    if (f.absent || (!f.late && !f.fix && !f.noout && r < 1 && pid !== "p1")) rec = { absent: true };
    else if (f.fix) rec = { in: f.in, out: f.out, fix: true, note: f.note, src: "HR" };
    else if (f.noout || (r < 2 && pid !== "p1")) rec = { in: hm(start - (r % 7)), out: null, src: "Fingerprint" };
    else if (f.late || r < 12) rec = { in: hm(start + (f.late || 6 + (r % 24))), out: hm(end + (r % 11)), src: "Fingerprint" };
    else rec = { in: hm(start - (r % 9)), out: hm(end + (r % 14)), src: r % 5 === 0 ? "App" : "Fingerprint" };
    // What happened before the 19th was answered long ago.
    if (iso < "2026-10-19" && rec && (rec.absent || !rec.out) && !rec.fix) rec = rec.absent ? { absent: true, fix: true, note: "Confirmed absent", src: "HR" } : { in: rec.in, out: hm(end), fix: true, note: "Forgot to clock out", src: "HR" };
  } else if (sh && !onLeave(pid, iso) && iso === TODAY) {
    const start = mins(sh.start);
    if (start <= mins(NOW)) rec = { in: hm(start - (hash(`${pid}${iso}`) % 8)), out: null, today: true, src: "Fingerprint" };
  }
  S.punch[pid][iso] = rec;
  return rec;
}
const LATE_GRACE = 5;
function attStat(pid, iso) {
  if (onLeave(pid, iso)) return { kind: "leave" };
  const sh = shiftOf(S.plan[pid]?.[iso]);
  const v = S.plan[pid]?.[iso];
  if (v === "OFF") return { kind: "off" };
  if (!sh) return { kind: "none" };
  if (iso > TODAY) return { kind: "future", sh };
  const rec = punchOf(pid, iso);
  if (rec === null) return { kind: "future", sh };
  if (rec.absent) return { kind: "absent", sh, rec };
  if (rec.today) return { kind: "today", sh, rec };
  if (!rec.out) return { kind: "noout", sh, rec };
  const late = mins(rec.in) - mins(sh.start);
  return { kind: late > LATE_GRACE ? "late" : "ok", sh, rec, late };
}
function workedHours(pid, iso) {
  const st = attStat(pid, iso);
  if (!st.rec || !st.rec.in || !st.rec.out) return 0;
  let span = mins(st.rec.out) - mins(st.rec.in); if (span < 0) span += 1440;
  return Math.max(span - (span > 360 ? 60 : 0), 0) / 60;
}
// A period is a month: payroll counts a month, so attendance is approved by one.
const monthDays = (ym) => { const [y, m] = ym.split("-").map(Number); const n = new Date(Date.UTC(y, m, 0)).getUTCDate(); return Array.from({ length: n }, (_, i) => `${ym}-${String(i + 1).padStart(2, "0")}`); };
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const monthLabel = (ym) => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const addMonths = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const attDays = () => monthDays(S.attMonth);
const mondayOfIso = (iso) => addDays(iso, -((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7));
// The days on show: the month, the week around the date, or the day.
const visDays = () => S.aview === "month" ? attDays() : S.aview === "week" ? days(mondayOfIso(S.attDate)) : [S.attDate];
const setAttDate = (d) => { S.attDate = d; S.attMonth = d.slice(0, 7); };
const attWeekHours = (pid) => attDays().reduce((n, iso) => n + workedHours(pid, iso), 0);
const attPlanned = (pid) => attDays().reduce((n, iso) => { const st = attStat(pid, iso); return n + (["ok", "late", "noout", "absent"].includes(st.kind) ? Math.min(netHours(st.sh), DAY_NORMAL) + dayOT(pid, iso) : 0); }, 0);
// A day nobody has answered for: absent, or in without an out.
const isOpen = (st) => (st.kind === "absent" || st.kind === "noout") && !st.rec.fix;
function attCounts(people = PEOPLE) {
  const c = { late: 0, absent: 0, noout: 0 };
  for (const p of people) for (const iso of visDays()) { const k = attStat(p.id, iso).kind; if (k in c) c[k]++; }
  return c;
}
const curStore = () => STORES[S.store];
const openOf = (store = curStore()) => store.people.flatMap((p) => attDays().map((iso) => ({ p, iso, st: attStat(p.id, iso) }))).filter((x) => isOpen(x.st));
const attSig = (store = curStore()) => JSON.stringify(store.people.map((p) => attDays().map((iso) => S.punch[p.id]?.[iso] ?? null)));
// A few shops already had their attendance approved when you came in.
const PRE_APPROVED = new Set(["HO", "C002", "C004", "C005", "C007", "C008", "C010", "C011"]);
function attApproved(store = curStore()) {
  const key = pubKey(store, S.attMonth);
  if (S.aprv[key] === undefined && PRE_APPROVED.has(store.id) && openOf(store).length === 0) S.aprv[key] = attSig(store);
  return S.aprv[key] === attSig(store);
}
const personById = (pid) => STORES.flatMap((st) => st.people).find((x) => x.id === pid);

/* ───────────────────────── one cell ───────────────────────── */
function cellHTML(pid, iso) {
  const v = at(pid, iso);
  const data = `data-p="${pid}" data-d="${iso}"`;
  const sel = S.sel.includes(`${pid}|${iso}`) ? " sel" : S.swapFrom === `${pid}|${iso}` ? " swapsrc" : "";
  if (v === "LEAVE") return `<div class="cell leave${sel}" ${data}><span class="s">Leave</span></div>`;
  if (v === "OFF") return `<div class="cell off${sel}" ${data}><span class="s">Off</span></div>`;
  const s = shiftOf(v);
  if (!s) return `<div class="cell empty${sel}" ${data}></div>`;
  const ot = dayOT(pid, iso);
  return `<div class="cell${sel}" ${data} style="--c:${s.color}" title="${s.start}–${s.end}"><span class="s">${esc(s.name)}</span>${ot ? `<span class="t num${ot > OT_DAY ? " bad" : ""}">+${fmtH(ot)}</span>` : ""}</div>`;
}
const planned = (pid, mon) => days(mon).some((iso) => S.plan[pid][iso] !== undefined);
const hoursHTML = (h, any = true) => (!any ? `<span class="mute">—</span>` : h < MIN_HOURS ? `<b class="bad num">${fmtH(h)}</b>` : `<b class="num">${fmtH(h)}</b>`);
// Normal hours over the overtime, when there is any.
function hoursCell(pid, mon) {
  const ot = weekOT(pid, mon);
  return `<span class="hh">${hoursHTML(weekHours(pid, mon), planned(pid, mon))}${ot ? `<span class="ot num${otOver(pid, mon) ? " bad" : ""}">+${fmtH(ot)}</span>` : ""}</span>`;
}

/* Planned, and under the weekly minimum: the people a roster still owes hours. */
// Everybody under the weekly minimum, planned or not: a week nobody has
// started is not a week that can be sent.
function shortOf(mon, people = PEOPLE) {
  return people.map((p, idx) => ({ p, idx, h: weekHours(p.id, mon) })).filter((r) => r.h < MIN_HOURS);
}
// What a published week looked like. Any change after it makes the week a
// draft again, with no flag to forget to clear — and Undo brings it back.
const signature = (store, mon) => JSON.stringify(store.people.map((p) => days(mon).map((iso) => [at(p.id, iso) ?? null, (S.ot[p.id] || {})[iso] ?? null])));
const pubKey = (store, mon) => `${store.id}|${mon}`;
const isPublished = (store, mon) => S.pub[pubKey(store, mon)] === signature(store, mon);
function otWarnHTML(mon) {
  const list = PEOPLE.map((p, idx) => ({ p, idx })).filter((r) => otOver(r.p.id, mon));
  if (!list.length) return "";
  const names = list.map((r) => `<span class="nm">${esc(r.p.name.split(" ")[0])} +${fmtH(weekOT(r.p.id, mon))}</span>`).join(", ");
  return `<div class="warnbar" role="status"><i data-lucide="timer"></i><b>Overtime past ${OT_DAY} h a day or ${OT_WEEK} h a week</b><span>${names}</span></div>`;
}

/* ───────────────────────── the shops, as cards ───────────────────────── */
// Each shop says the one thing about its week that matters: days still to
// plan, people under the weekly minimum, or that it is ready.
function storeState(store, mon) {
  const ds = days(mon);
  const empty = store.people.reduce((n, p) => n + ds.filter((iso) => at(p.id, iso) === undefined).length, 0);
  const short = store.people.filter((p) => weekHours(p.id, mon) < MIN_HOURS).length;
  if (empty > 0) return { cls: "mute", text: `${empty} ${empty === 1 ? "day" : "days"} to plan`, rank: 2, n: empty };
  if (short > 0) return { cls: "bad", text: `${short} under ${MIN_HOURS} h`, rank: 1, n: short };
  if (isPublished(store, mon)) return { cls: "ok", text: "Published", rank: 0, n: 0, done: true };
  return { cls: "mute", text: "Ready to publish", rank: 0, n: 0 };
}
// Twelve shops, all of them at once: two rows of six, in a fixed order so a
// shop is always where the hand expects it.
function storesHTML() {
  // A phone has no room for twelve cards: the open shop is one row that
  // unfolds them.
  const here = STORES[S.store];
  const pick = `<button class="storepick" data-act="pickstore" aria-expanded="${!!S.storesOpen}"><span class="who2"><span class="r num">${here.id}</span><span class="n">${esc(here.name)}</span></span><i data-lucide="chevron-down"></i></button>`;
  return `${pick}<div class="stores${S.storesOpen ? " open" : ""}">${STORES.map((store, i) => {
    return `<button class="scard" data-store="${i}" aria-pressed="${S.store === i}" title="${store.id} · ${store.people.length} people">
      <span class="sc num">${store.id}</span>
      <span class="sn">${esc(store.name)}</span>
    </button>`;
  }).join("")}</div>`;
}

/* ───────────────────────── views ───────────────────────── */
const monthWeeks = (ym) => { const out = []; let m = mondayOfIso(`${ym}-01`); while (m <= monthDays(ym)[monthDays(ym).length - 1]) { out.push(m); m = addDays(m, 7); } return out; };
const monthShort = (ym) => monthWeeks(ym).flatMap((mon) => shortOf(mon).map((r) => ({ ...r, mon })));
const monthPublished = (store, ym) => monthWeeks(ym).every((mon) => isPublished(store, mon));
function headHTML() {
  const month = S.view === "month";
  const published = month ? monthPublished(STORES[S.store], S.rmonth) : isPublished(STORES[S.store], S.week);
  const short = month ? monthShort(S.rmonth) : shortOf(S.week);
  const stepWeek = `<div class="step"><button class="icbtn" data-act="wk-1" aria-label="${month ? "Previous month" : "Previous week"}"><i data-lucide="chevron-left"></i></button>
      <span class="lbl num">${month ? monthLabel(S.rmonth) : weekLabel(S.week)}</span>
      <button class="icbtn" data-act="wk+1" aria-label="${month ? "Next month" : "Next week"}"><i data-lucide="chevron-right"></i></button></div>`;
  return `<div class="head">
    <h1>${esc(STORES[S.store].name)}</h1>
    ${published ? `<span class="pubmark"><i data-lucide="check"></i>Published</span>` : ""}
    <span class="grow desk-only"></span>
    <div class="seg" role="tablist">
      <button aria-pressed="${S.view === "day"}" data-view="day" class="desk-only">By day</button>
      <button aria-pressed="${S.view === "week"}" data-view="week">By week</button>
    </div>
    ${stepWeek}
    ${S.view === "week" ? `<button class="btn ghost desk-only" data-act="copy"><i data-lucide="copy"></i>Copy last week</button>` : ""}
    <button class="btn green" data-act="shifts"><i data-lucide="clock"></i>Shifts</button>
    <button class="btn publish" data-act="publish" ${published || short.length ? "disabled" : ""} title="${short.length ? `${short.map((r) => `${r.p.name.split(" ")[0]} ${fmtH(r.h)}`).slice(0, 4).join(", ")} — everybody needs ${MIN_HOURS} h to publish` : ""}">${published ? "Published" : month ? "Publish month" : "Publish week"}</button>
  </div>`;
}

/* A month: people × the days, a cell each. Drag across days to paint them; the
   hours column is the month's, and red when any week in it is short. */
function monthRosterHTML() {
  const ym = S.rmonth, ds = monthDays(ym);
  const weeks = monthWeeks(ym);
  const wd = (iso) => (new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7;
  const head = ds.map((iso) => `<th class="am-h${wd(iso) > 4 ? " wkend" : ""}${iso === TODAY ? " today" : ""}"><span>${"MTWTFSS"[wd(iso)]}</span><b class="num">${dnum(iso)}</b></th>`).join("");
  const mini = (pid, iso) => {
    const v = at(pid, iso), data = `data-p="${pid}" data-d="${iso}"`;
    const sel = S.sel.includes(`${pid}|${iso}`) ? " sel" : S.swapFrom === `${pid}|${iso}` ? " swapsrc" : "";
    if (v === "LEAVE") return `<div class="cell mini leave${sel}" ${data} title="Leave"></div>`;
    if (v === "OFF") return `<div class="cell mini off${sel}" ${data} title="Off"><span class="s">·</span></div>`;
    const sh = shiftOf(v);
    if (!sh) return `<div class="cell mini empty${sel}" ${data}></div>`;
    return `<div class="cell mini${sel}" ${data} style="--c:${sh.color}" title="${esc(sh.name)} ${sh.start}–${sh.end}"><span class="s">${esc(sh.name[0])}</span>${dayOT(pid, iso) ? `<i class="otd"></i>` : ""}</div>`;
  };
  const hours = (p) => {
    const h = ds.reduce((n, iso) => { const sh = shiftOf(at(p.id, iso)); return n + (sh ? Math.min(netHours(sh), DAY_NORMAL) : 0); }, 0);
    const ot = ds.reduce((n, iso) => n + dayOT(p.id, iso), 0);
    const bad = weeks.some((mon) => weekHours(p.id, mon) < MIN_HOURS);
    const any = ds.some((iso) => S.plan[p.id][iso] !== undefined);
    return `<span class="hh">${any ? `<b class="num${bad ? " bad" : ""}">${fmtH(h)}</b>` : `<span class="mute">—</span>`}${ot ? `<span class="ot num">+${fmtH(ot)}</span>` : ""}</span>`;
  };
  const rows = PEOPLE.map((p) => `<tr><td class="who"><div class="person"><div class="av">${initials(p.name)}</div><div class="who2"><span class="n">${esc(p.name)}</span><span class="r">${esc(p.role)}</span></div></div></td>${ds.map((iso) => `<td class="amc">${mini(p.id, iso)}</td>`).join("")}<td class="hrs">${hours(p)}</td></tr>`).join("");
  const working = ds.map((iso) => PEOPLE.filter((p) => shiftOf(at(p.id, iso))).length);
  const list = PEOPLE.map((p) => {
    const short = weeks.filter((mon) => weekHours(p.id, mon) < MIN_HOURS).length;
    const h = ds.reduce((n, iso) => { const sh = shiftOf(at(p.id, iso)); return n + (sh ? Math.min(netHours(sh), DAY_NORMAL) : 0); }, 0);
    return `<button class="prow person" data-open-week="${p.id}"><div class="av">${initials(p.name)}</div><div class="who2"><span class="n">${esc(p.name)}</span><span class="r num">${fmtH(h)} this month${short ? ` · <span class="bad">${short} ${short === 1 ? "week" : "weeks"} under ${MIN_HOURS} h</span>` : ""}</span></div><i data-lucide="chevron-right" class="chev"></i></button>`;
  }).join("");
  const legend = `<div class="legend desk-only">${S.shifts.map((sh) => `<span><b class="am-l" style="background:color-mix(in srgb, ${sh.color} 14%, #fff);color:var(--ink)">${esc(sh.name[0])}</b> ${esc(sh.name)}</span>`).join("")}<span><b class="am-l off">·</b> Off</span><span><b class="am-l leave"></b> Leave</span><span><i class="otd" style="position:static;display:inline-block"></i> Overtime</span></div>`;
  return `<div class="card desk"><table class="grid month">
      <colgroup><col class="who">${ds.map(() => "<col>").join("")}<col style="width:112px"></colgroup>
      <thead><tr><th>Person</th>${head}<th class="hrs">Hours</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td>Working</td>${working.map((n) => `<td class="amc num">${n}</td>`).join("")}<td></td></tr></tfoot></table></div>
    ${legend}<div class="plist">${list}</div>`;
}

function weekView() {
  const ds = days(S.week);
  const head = ds.map((iso, i) => `<th class="${iso === TODAY ? "today" : i > 4 ? "wkend" : ""}">${DOW[i]} ${dnum(iso)}</th>`).join("");
  const rows = PEOPLE.map((p, idx) => `<tr>
      <td class="who"><div class="person"><div class="av">${initials(p.name)}</div><div class="who2"><span class="n">${esc(p.name)}</span><span class="r">${esc(p.role)}</span></div></div></td>
      ${ds.map((iso) => `<td>${cellHTML(p.id, iso)}</td>`).join("")}
      <td class="hrs">${hoursCell(p.id, S.week)}</td></tr>`).join("");
  const working = ds.map((iso) => PEOPLE.filter((p) => shiftOf(at(p.id, iso))).length);
  const foot = `<tr><td>Working</td>${working.map((n) => `<td class="num">${n}</td>`).join("")}<td></td></tr>`;

  // phone: a day at a time, a person a row
  const pills = ds.map((iso, i) => `<button data-day="${iso}" aria-pressed="${iso === S.day}" class="${iso === TODAY ? "today" : ""}">${DOW[i]}<b class="num">${dnum(iso)}</b></button>`).join("");
  const list = PEOPLE.map((p, idx) => {
    const h = weekHours(p.id, S.week);
    return `<div class="prow"><div class="person"><div class="av">${initials(p.name)}</div><div class="who2"><span class="n">${esc(p.name)}</span><span class="r num">${h < MIN_HOURS ? `<span class="bad">${fmtH(h)}</span>` : fmtH(h)}${weekOT(p.id, S.week) ? ` <span class="${otOver(p.id, S.week) ? "bad" : ""}">+${fmtH(weekOT(p.id, S.week))}</span>` : ""} this week</span></div></div>${cellHTML(p.id, S.day)}</div>`;
  }).join("");

  if (S.view === "month") return monthRosterHTML();

    const n = PEOPLE.filter((p) => shiftOf(at(p.id, S.day))).length;

      <div class="card"><div class="dayhead"><span>${DOW[(new Date(S.day + "T00:00:00Z").getUTCDay() + 6) % 7]} ${dlabel(S.day)}</span><span class="mute num">${n} working</span></div><div class="plist">${list}</div></div></div>`;
  }
  return `${otWarnHTML(S.week)}<div class="card desk"><table class="grid">
      <colgroup><col class="who">${ds.map(() => "<col>").join("")}<col style="width:84px"></colgroup>
      <thead><tr><th>Person</th>${head}<th class="hrs">Hours</th></tr></thead>

/* ───────────────────────── the Attendance page ───────────────────────── */
function aCellHTML(pid, iso) {
  const st = attStat(pid, iso);
  const data = `data-a="${pid}|${iso}"`;
  const fix = st.rec?.fix ? " fixed" : "";
  const ot = ["ok", "late"].includes(st.kind) ? dayOT(pid, iso) : 0;
  const om = ot ? `<span class="otm num">+${fmtH(ot)}</span>` : "";
  switch (st.kind) {
    case "leave": return `<div class="acell leave"><span>Leave</span></div>`;
    case "off": return `<div class="acell off"><span>Off</span></div>`;
    case "none": case "future": return `<div class="acell none"><span>—</span></div>`;
    case "absent": return `<button class="acell absent${fix}" ${data}><span>Absent</span></button>`;
    case "noout": return `<button class="acell noout${fix}" ${data}><span class="num">${st.rec.in} – ?</span></button>`;
    case "today": return `<button class="acell now" ${data}><span class="num">${st.rec.in} – …</span></button>`;
    case "late": return `<button class="acell${fix}${ot ? " hasot" : ""}" ${data}><span class="num"><b class="lt">${st.rec.in}</b> – ${st.rec.out}</span>${om}</button>`;
    default: return `<button class="acell${fix}${ot ? " hasot" : ""}" ${data}><span class="num">${st.rec.in} – ${st.rec.out}</span>${om}</button>`;
  }
}
function attHeadHTML() {

  const why = open.length ? `${open.slice(0, 4).map((x) => `${x.p.name.split(" ")[0]} ${dlabel(x.iso)}`).join(", ")}${open.length > 4 ? ` and ${open.length - 4} more` : ""} still to fix` : "";
  return `<div class="head">
    <h1>${esc(STORES[S.store].name)}</h1>
    ${approved ? `<span class="pubmark"><i data-lucide="check"></i>Approved</span>` : ""}
    <span class="grow desk-only"></span>
    <div class="seg" role="tablist">${[["day", "Day"], ["week", "Week"], ["month", "Month"]].map(([v, l]) => `<button data-aview="${v}" aria-pressed="${S.aview === v}">${l}</button>`).join("")}</div>
    <div class="step"><button class="icbtn" data-act="att-1" aria-label="Previous"><i data-lucide="chevron-left"></i></button>
      <span class="lbl num">${S.aview === "month" ? monthLabel(S.attMonth) : S.aview === "week" ? weekLabel(mondayOfIso(S.attDate)) : `${DOW[(new Date(S.attDate + "T00:00:00Z").getUTCDay() + 6) % 7]} ${dlabel(S.attDate)}`}</span>

  <div class="afilters"><div class="seg">${chip("all", "All")}${chip("late", "Late", counts.late)}${chip("absent", "Absent", counts.absent)}${chip("noout", "No clock-out", counts.noout)}</div>
    ${open.length ? `<span class="open bad">${open.length} to fix before the month can be approved</span>` : ""}</div>`;

// One compact cell for one day of the month: a letter says what needs saying.
function aMini(pid, iso) {
  const st = attStat(pid, iso);
  const wk = ((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7) > 4 ? " wkend" : "";
  const dn = `${DOW[(new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7]} ${dlabel(iso)}`;
  const who = PEOPLE.find((x) => x.id === pid).name.split(" ")[0];
  const data = `data-a="${pid}|${iso}"`;
  const fix = st.rec?.fix ? " fixed" : "";
  const tip = st.rec ? (st.rec.absent ? "Absent" : `${st.rec.in} – ${st.rec.out || "?"}${dayOT(pid, iso) ? ` · overtime ${fmtH(dayOT(pid, iso))}` : ""}`) : st.kind === "leave" ? "Leave" : st.kind === "off" ? "Off" : "";
  const title = `${who} · ${dn}${tip ? ` · ${tip}` : ""}`;
  const m = {
    leave: ["leave", ""], off: ["off", ""], none: ["none", ""], future: ["none", ""],
  }[st.kind];
  if (m) return `<div class="am ${m[0]}${wk}" title="${title}">${m[1]}</div>`;
  const ot = ["ok", "late"].includes(st.kind) ? dayOT(pid, iso) : 0;
  const body = ot ? [st.kind === "late" ? "late otm" : "ot", `+${ot}`] : { absent: ["absent", "A"], noout: ["noout", "?"], late: ["late", "L"], today: ["now", "•"], ok: ["ok", "•"] }[st.kind];
  return `<button class="am ${body[0]}${fix}${wk}" ${data} title="${title}">${body[1]}</button>`;
}
function attView() {
  if (S.aview === "week") return attWeekHTML();
  if (S.aview === "day") return attDayHTML();
  const ds = attDays();
  const wanted = (p) => S.afilter === "all" || ds.some((iso) => attStat(p.id, iso).kind === S.afilter);
  const people = PEOPLE.filter(wanted);
  const wd = (iso) => (new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7;
  const head = ds.map((iso) => `<th class="am-h${wd(iso) > 4 ? " wkend" : ""}${iso === TODAY ? " today" : ""}"><span>${"MTWTFSS"[wd(iso)]}</span><b class="num">${dnum(iso)}</b></th>`).join("");
  const tot = (p) => {
    const w = attWeekHours(p.id), pl = attPlanned(p.id), d = w - pl;
    const k = ds.map((iso) => attStat(p.id, iso).kind);
    const late = k.filter((x) => x === "late").length, ab = k.filter((x) => x === "absent").length;
    const otSum = ds.reduce((n, iso) => n + (["ok", "late"].includes(attStat(p.id, iso).kind) ? dayOT(p.id, iso) : 0), 0);
    return `<td class="tcol num"><span class="hh"><b>${fmtH(Math.round(w))}</b>${Math.abs(d) >= 1 ? `<span class="ot${d < 0 ? " bad" : ""}">${d < 0 ? "−" : "+"}${fmtH(Math.round(Math.abs(d)))}</span>` : ""}</span></td>
      <td class="tcol num">${otSum ? `<span class="otc">+${fmtH(otSum)}</span>` : `<span class="mute">·</span>`}</td>
      <td class="tcol num">${late ? `<span class="lt2">${late}</span>` : `<span class="mute">·</span>`}</td>
      <td class="tcol num">${ab ? `<span class="bad">${ab}</span>` : `<span class="mute">·</span>`}</td>`;
  };
  const rows = people.map((p) => `<tr>
      <td class="who"><button class="person" data-ap="${p.id}"><div class="av">${initials(p.name)}</div><div class="who2"><span class="n">${esc(p.name)}</span><span class="r">${esc(p.role)}</span></div></button></td>
      ${ds.map((iso) => `<td class="amc">${aMini(p.id, iso)}</td>`).join("")}${tot(p)}</tr>`).join("");
  const present = ds.map((iso) => iso > TODAY ? "" : PEOPLE.filter((p) => ["ok", "late", "noout", "today"].includes(attStat(p.id, iso).kind)).length);
  const foot = `<tr><td>Present</td>${present.map((n) => `<td class="amc num">${n}</td>`).join("")}<td colspan="4"></td></tr>`;
  const list = people.map((p) => {
    const k = ds.map((iso) => attStat(p.id, iso).kind);
    const late = k.filter((x) => x === "late").length, ab = k.filter((x) => x === "absent").length, no = k.filter((x) => x === "noout").length;
    const flags = [ab ? `<span class="bad">${ab} absent</span>` : "", no ? `<span class="lt2">${no} no clock-out</span>` : "", late ? `<span class="lt2">${late} late</span>` : ""].filter(Boolean).join(" · ");
    return `<button class="prow person" data-ap="${p.id}"><div class="av">${initials(p.name)}</div><div class="who2"><span class="n">${esc(p.name)}</span><span class="r num">${fmtH(Math.round(attWeekHours(p.id)))} worked${flags ? ` · ${flags}` : ""}</span></div><i data-lucide="chevron-right" class="chev"></i></button>`;
  }).join("");
  const empty = people.length === 0 ? `<div class="empty-note">Nobody has this in ${monthLabel(S.attMonth)}.</div>` : "";
  return `<div class="card desk"><table class="grid month">
      <colgroup><col class="who">${ds.map(() => "<col>").join("")}<col style="width:84px"><col style="width:72px"><col style="width:52px"><col style="width:56px"></colgroup>
      <thead><tr><th>Person</th>${head}<th class="tcol">Worked</th><th class="tcol">Overtime</th><th class="tcol">Late</th><th class="tcol">Absent</th></tr></thead>
      <tbody>${rows}</tbody><tfoot>${foot}</tfoot></table>${empty}</div>
    <div class="legend desk-only"><span><b class="am-l ot">+2</b> Overtime hours</span><span><b class="am-l late">L</b> Late</span><span><b class="am-l absent">A</b> Absent</span><span><b class="am-l noout">?</b> No clock-out</span><span><b class="am-l leave"></b> Leave</span><span><b class="am-l off"></b> Off</span><span><i class="dotb"></i> Corrected</span></div>
    <div class="plist">${list}</div>`;
}
const aWanted = (p, ds) => S.afilter === "all" || ds.some((iso) => attStat(p.id, iso).kind === S.afilter);
const aPills = (week) => week.map((iso, i) => `<button data-aday="${iso}" aria-pressed="${iso === S.attDate}" class="${iso === TODAY ? "today" : ""}">${DOW[i]}<b class="num">${dnum(iso)}</b></button>`).join("");
const aPersonRow = (p, iso) => `<div class="prow"><button class="person" data-ap="${p.id}"><div class="av">${initials(p.name)}</div><div class="who2"><span class="n">${esc(p.name)}</span><span class="r">${esc(p.role)}</span></div></button>${aCellHTML(p.id, iso)}</div>`;
/* Week: people × seven days, the clock times in every cell. */
function attWeekHTML() {
  const ds = visDays();
