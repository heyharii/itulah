<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finance menu options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Finance menu: five ways to cut today's 90 rows (17 headings) down.
   Hari (28 Sep): "menu sekarang too much … cukup seperti ERPNext?"
   Look: hub v2 · E Quiet — Inter 14, 36px controls, 52px rows, one white
   surface with hairlines, no chips, colour only where something needs
   someone. Nothing on the page is smaller than 14px.
   Every option keeps the one-sidebar shape; only what sits under Finance
   changes. Each old screen has a home in every option ("Where did it go?").
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --font:"Inter",system-ui,sans-serif;
  --ink-900:#20242c;--ink-800:#2b313c;--ink-700:#394150;--ink-600:#4a5261;--ink-500:#626b78;--ink-400:#737c89;--ink-300:#aab1bb;--ink-200:#d5dae1;
  --canvas:#fff;--side:#f8f9fb;--well:#f7f8fa;--sel:#f0f2f5;--sel-subtle:#f8f9fb;
  --hairline:#e7eaf0;--rule:#eef0f4;--line:#d3d8e0;
  --primary:#2563eb;--primary-ink:#1d4ed8;--primary-soft:#eef4ff;
  --ok:#22a55a;--warn:#d99a2b;--warn-fg:#b45309;--bad:#e25555;--bad-fg:#be123c;
  --fin:#5856d6;
  --ease:cubic-bezier(.23,1,.32,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
  --h-ctl:36px;--h-row:52px;--h-nav:34px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 14px/20px var(--font);color:var(--ink-900);background:var(--canvas);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}
.num{font-variant-numeric:tabular-nums}

/* ── Prototype bar (not part of the hub) ── */
.proto{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;min-height:56px;padding:10px 16px;border-bottom:1px solid var(--hairline);background:#fff;flex-wrap:wrap}
.proto .t{font-weight:600;white-space:nowrap}
.proto .t span{color:var(--ink-400);font-weight:500;margin-left:6px}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--well);box-shadow:inset 0 0 0 1px var(--hairline);overflow-x:auto;max-width:100%}
.seg button{height:30px;padding:0 12px;border-radius:8px;color:var(--ink-500);font-weight:500;white-space:nowrap;transition:background-color .2s var(--ease),color .2s}
.seg button:hover{color:var(--ink-900)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink-900);box-shadow:0 1px 2px rgb(24 39 60/.08),0 0 0 1px var(--hairline)}
.seg .star{color:var(--primary)}
.proto .sp{flex:1}

/* ── Layout ── */
.app{display:grid;grid-template-columns:264px minmax(0,1fr) 340px;height:calc(100vh - 57px)}
.app > *{min-height:0}
.side{background:var(--side);border-right:1px solid var(--hairline);overflow:auto;padding:16px 12px 24px}
main{overflow:auto;padding:28px 40px 80px}
.notes{border-left:1px solid var(--hairline);overflow:auto;padding:24px 24px 60px}
.app.compare{grid-template-columns:minmax(0,1fr)}
.app.compare .side,.app.compare .notes{display:none}
@media (max-width:1240px){
  .app{grid-template-columns:248px minmax(0,1fr);height:auto}
  .app > *{overflow:visible}
  .notes{grid-column:1/-1;border-left:0;border-top:1px solid var(--hairline)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--hairline)}
  main{padding:24px 16px 48px}
  .notes{padding:24px 16px}
}

/* ── Sidebar (one sidebar, hub v2) ── */
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
.mark{position:relative;width:32px;height:32px;border-radius:9px;background:#111114;display:grid;place-items:center;color:#fff;font:700 17px/1 var(--font)}
.mark::after{content:"";position:absolute;right:6px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.wm{font:600 20px/24px var(--font);letter-spacing:-.02em}
.qa{display:flex;align-items:center;gap:10px;height:var(--h-ctl);padding:0 10px 0 12px;margin:0 0 12px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline);color:var(--ink-400);white-space:nowrap}
.qa kbd{margin-left:auto;font:500 14px/20px var(--font);color:var(--ink-400);border-radius:6px;padding:0 6px;box-shadow:inset 0 0 0 1px var(--hairline)}
.dep{display:flex;align-items:center;gap:10px;width:100%;height:var(--h-nav);padding:0 8px;border-radius:10px;color:var(--ink-600);font-weight:500;transition:background-color .2s var(--ease)}
.dep:hover{background:var(--sel);color:var(--ink-900)}
.dep .ic{color:var(--ink-400)}
.dep.on{color:var(--ink-900);font-weight:600}
.dep.on .ic{color:var(--fin)}
.dep .chev{margin-left:auto;color:var(--ink-300);transition:transform .25s var(--ease)}
.dep.on .chev{transform:rotate(90deg);color:var(--ink-500)}
.sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 17px;padding-left:10px;border-left:2px solid var(--hairline)}
.sub.opening{animation:sub-open .34s var(--ease)}
@keyframes sub-open{from{opacity:0;transform:translateY(-4px)}}
.si{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 10px;border-radius:9px;color:var(--ink-600);font-weight:500;transition:background-color .2s var(--ease),color .2s}
.si:hover{background:var(--sel);color:var(--ink-900)}
.si[aria-current]{background:var(--sel);color:var(--ink-900);font-weight:600}
.si .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{margin-left:auto;color:var(--ink-400);font-weight:500;white-space:nowrap}
.n.warn{color:var(--warn-fg)}
.n.bad{color:var(--bad-fg);display:inline-flex;align-items:center;gap:6px}
.n.bad::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bad)}
.sg{padding:12px 10px 2px;color:var(--ink-400);font-weight:500}
.sg:first-child{padding-top:2px}
.side-count{margin:10px 8px 0;padding-top:12px;border-top:1px solid var(--hairline);color:var(--ink-400)}
.side-count b{color:var(--ink-900);font-weight:600}

/* ── Page ── */
.page{animation:page-in .3s var(--ease)}
@keyframes page-in{from{opacity:0;transform:translateY(6px)}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{color:var(--ink-400);font-weight:500}
.h1{margin:4px 0 0;font:600 28px/34px var(--font);letter-spacing:-.025em}
.desc{margin:8px 0 0;color:var(--ink-500);max-width:640px;line-height:22px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;height:var(--h-ctl);padding:0 14px;border-radius:10px;font-weight:500;white-space:nowrap;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:background-color .2s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--well)}
.btn:active{transform:scale(.97)}
.btn .ic{color:var(--ink-400)}
.btn-p{background:var(--primary);color:#fff;box-shadow:none;font-weight:600}
.btn-p .ic{color:#fff}
.btn-p:hover{background:var(--primary-ink)}
.btn.sm{height:32px;padding:0 12px}
.btn .cnt{color:var(--ink-400);font-weight:500}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.inp{display:flex;align-items:center;gap:8px;height:var(--h-ctl);padding:0 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-400);min-width:240px;background:#fff}
.inp input{border:0;outline:0;font:inherit;color:var(--ink-900);flex:1;min-width:0;background:none}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--primary)}
.dd{position:relative}
.menu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:260px;max-height:360px;overflow:auto;padding:6px;border-radius:12px;background:#fff;box-shadow:0 14px 36px -10px rgb(24 39 60/.22),0 0 0 1px var(--hairline);transform-origin:top left;animation:pop .18s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-2px)}}
.menu .mi{display:flex;width:100%;align-items:center;gap:8px;min-height:34px;padding:0 10px;border-radius:8px;color:var(--ink-700)}
.menu .mi:hover{background:var(--sel)}
.menu .mi.on{font-weight:600;color:var(--ink-900)}
.menu .mi.on::after{content:"";margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.menu .mh{padding:8px 10px 4px;color:var(--ink-400);font-weight:500}
.menu .sep{height:1px;background:var(--rule);margin:6px 4px}

.panel{border-radius:12px;box-shadow:0 0 0 1px var(--hairline);background:#fff;overflow:hidden}
.panel + .panel{margin-top:20px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 20px 12px;flex-wrap:wrap}
.h2{margin:0;font:600 15px/22px var(--font)}
.pd{color:var(--ink-500)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{height:40px;text-align:left;padding:0 20px;font-weight:500;color:var(--ink-400);border-bottom:1px solid var(--hairline);white-space:nowrap}
.tbl td{height:var(--h-row);padding:0 20px;border-bottom:1px solid var(--rule);color:var(--ink-700)}
.tbl td.r,.tbl td:first-child{white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl td.strong{color:var(--ink-900);font-weight:500}
.tbl .g{color:var(--ink-400);margin-left:8px}
.tbl tr.hl td{background:var(--primary-soft);transition:background-color 1.2s var(--ease)}
.how{display:inline-flex;align-items:center;gap:8px;color:var(--ink-600)}
.how::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c,var(--ink-300))}

/* ERPNext-style workspace: number cards, shortcuts, cards of links */
.lbl{margin:0 0 10px;color:var(--ink-500);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:16px 18px;border-radius:12px;box-shadow:0 0 0 1px var(--hairline)}
.stat b{display:block;font-weight:500;color:var(--ink-500)}
.stat .fig{margin-top:8px;font:600 30px/36px var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .fig small{font-size:15px;color:var(--ink-400);font-weight:500;margin:0 4px 0 0}
.stat .fig small.u{margin:0 0 0 3px}
.stat .hint{margin-top:4px;color:var(--ink-400)}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:32px}
.sc{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:12px;box-shadow:0 0 0 1px var(--hairline);font-weight:500;transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.sc:hover{box-shadow:0 0 0 1px var(--hairline),0 10px 24px -16px rgb(24 39 60/.3);transform:translateY(-1px)}
.sc .ic{color:var(--ink-400)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 32px}
.card h3{margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule);font:600 14px/20px var(--font)}
.card .lk{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 8px;margin-left:-8px;border-radius:8px;color:var(--ink-600)}
.card .lk:hover{background:var(--sel);color:var(--ink-900)}
.card .lk .n{font-weight:500}
.lk.hl,.task.hl,.rep.hl{background:var(--primary-soft)!important}

/* Month-end checklist */
.me-h{padding:14px 20px 4px;font-weight:600;color:var(--ink-500)}
.task{display:flex;align-items:center;gap:12px;min-height:var(--h-row);padding:6px 20px;border-bottom:1px solid var(--rule);transition:background-color .2s}
.task:last-child{border-bottom:0}
.tick{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--ink-300);display:grid;place-items:center;flex:none;transition:background-color .2s var(--ease),box-shadow .2s}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s var(--ease)}
.task.done .tick{background:var(--ink-900);box-shadow:none}
.task.done .tick svg{stroke-dashoffset:0}
.task .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.task .t1{font-weight:500;color:var(--ink-900)}
.task.done .t1{color:var(--ink-500)}
.task .t2{color:var(--ink-400)}
.bar{height:4px;border-radius:4px;background:var(--rule);overflow:hidden;width:160px}
.bar i{display:block;height:100%;width:var(--w);background:var(--ink-800);border-radius:4px;transition:width .4s var(--ease)}
.prog{display:flex;align-items:center;gap:12px;color:var(--ink-500)}

/* To-do inbox */
.todo .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-300);flex:none}
.todo .dot.bad{background:var(--bad)}
.todo .dot.warn{background:var(--warn)}

/* Page tabs (Odoo-like option) */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--hairline);margin:-4px 0 20px;overflow-x:auto}
.tabs button{height:42px;color:var(--ink-500);font-weight:500;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent;transition:color .2s,box-shadow .2s var(--ease)}
.tabs button:hover{color:var(--ink-900)}
.tabs button[aria-selected=true]{color:var(--ink-900);box-shadow:inset 0 -2px 0 var(--ink-900)}

/* Report picker */
.rep{display:flex;align-items:center;gap:16px;width:100%;min-height:var(--h-row);padding:6px 20px;border-bottom:1px solid var(--rule)}
.rep:hover{background:var(--sel-subtle)}
.rep b{font-weight:500;min-width:190px}
.rep span{color:var(--ink-500)}
.rep .ic{margin-left:auto;color:var(--ink-300)}

/* ── Notes column ── */
.notes .kick{color:var(--ink-400);font-weight:500}
.notes .on{margin:4px 0 0;font:600 20px/28px var(--font);letter-spacing:-.02em}
.rec{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--primary-ink);font-weight:600}
.rec::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary)}
.metric{display:flex;gap:28px;margin:18px 0 4px}
.metric b{display:block;font:600 30px/36px var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.metric span{color:var(--ink-400)}
.notes h4{margin:22px 0 6px;font:600 14px/20px var(--font)}
.notes p{margin:0;color:var(--ink-600);line-height:22px}
.notes ul{margin:0;padding-left:18px;color:var(--ink-600);line-height:22px}
.notes li + li{margin-top:4px}
.where{margin-top:26px;padding-top:20px;border-top:1px solid var(--hairline)}
.where .inp{min-width:0;width:100%}
.try{margin-top:8px;color:var(--ink-400)}
.try button{color:var(--ink-600);text-decoration:underline;text-decoration-color:var(--ink-200);text-underline-offset:3px}
.try button:hover{color:var(--ink-900)}
.wl{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.w{display:block;width:100%;padding:8px 10px;border-radius:8px}
.w:hover{background:var(--sel)}
.w b{font-weight:500;color:var(--ink-900)}
.w b small{font:inherit;color:var(--ink-400);font-weight:400;margin-left:6px}
.w span{display:block;color:var(--ink-500)}
.cov{margin-top:14px;color:var(--ink-400)}
.cov.bad{color:var(--bad-fg)}

/* Compare */
.cmp td,.cmp th{white-space:normal;min-width:150px;vertical-align:top}
.cmp td{padding-top:15px;padding-bottom:15px;height:auto;line-height:22px}
.cmp td:first-child{min-width:170px;color:var(--ink-900);font-weight:500}
.cmp th.star{color:var(--primary-ink)}
.cmp .big{font:600 22px/28px var(--font);letter-spacing:-.02em;color:var(--ink-900)}

/* ERPNext AP page */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.blk{margin-bottom:44px}
.blk > .h2{margin-bottom:4px}
.blk > .pd{margin:0 0 18px}
.ws{padding:24px;border-radius:12px;box-shadow:0 0 0 1px var(--hairline)}
.ws .shortcuts{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:24px}
.ws .cards{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:24px}
.ws .new{color:var(--primary-ink)}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:1000px){.why{grid-template-columns:1fr}}
.why div{padding-top:14px;border-top:2px solid var(--ink-900)}
.why b{display:block;font:600 15px/22px var(--font);margin-bottom:6px}
.why p{margin:0;color:var(--ink-600);line-height:22px}
.buckets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.buckets .stat .fig{font-size:22px;line-height:30px}
.buckets .stat.late .fig{color:var(--bad-fg)}
.tbl td.late{color:var(--bad-fg);font-weight:500}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function homeOf(opt, id) {

  <div class="blk"><h2 class="h2">Today’s rows, ERPNext’s way</h2><p class="pd">Nine rows today across four headings become two documents and one report.</p>
    <section class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Row today</th><th>In ERPNext</th><th>In ours</th></tr></thead><tbody>
      ${MAP.map(m => `<tr><td class="strong">${esc(m[0])}<span class="g">${esc(m[1])}</span></td><td>${esc(m[2])}</td><td>${esc(m[3])}</td></tr>`).join('')}
    </tbody></table></div></section></div>
  </div>`;
}

/* ── Notes ── */
function renderNotes() {
  const o = opt();
  const rows = o.id === 'T' ? 90 : o.rows.length;
  const missing = o.id === 'T' ? [] : OLD.filter(x => !homeOf(o, x.id));
  const q = st.q.trim().toLowerCase();
  const hits = q ? OLD.filter(x => (x.label + ' ' + x.group).toLowerCase().includes(q)) : [];
  $('#notes').innerHTML = `
    <div class="kick">Option ${o.id === 'T' ? '· reference' : o.id}</div>
    <div class="on">${esc(o.name)}</div>
    ${o.rec ? '<div class="rec">Recommended</div>' : ''}
    <div class="metric"><div><b>${rows}</b><span>rows</span></div>${o.id === 'T' ? '<div><b>17</b><span>headings</span></div>' : `<div><b>−${90 - rows}</b><span>from today</span></div>`}</div>
    <h4>Follows</h4><p>${esc(o.follows)}</p>
    <h4>The rule</h4><p>${esc(o.principle)}</p>
    <h4>Good</h4><ul>${o.good.map(g => `<li>${esc(g)}</li>`).join('')}</ul>
    <h4>Watch out</h4><ul>${o.watch.map(g => `<li>${esc(g)}</li>`).join('')}</ul>
    ${o.elsewhere ? `<h4>Leaves Finance</h4><ul>${o.elsewhere.map(e => `<li>${e.items.split(' ').map(id => esc(O[id].label)).join(', ')} → ${esc(e.where)}</li>`).join('')}</ul>` : ''}
    <div class="where"><h4 style="margin-top:0">Where did it go?</h4>
      <label class="inp">${ic('search', 's')}<input id="wq" placeholder="A row from today, e.g. giro" value="${esc(st.q)}" /></label>
      ${q ? '' : `<div class="try">Try ${['giro', 'PPN', 'depreciation', 'account links', 'aging'].map(t => `<button type="button" data-try="${t}">${t}</button>`).join(', ')}</div>`}
      <div class="wl">${hits.map(x => { const h = homeOf(o, x.id); return `<button class="w" type="button" data-go="${x.id}"><b>${esc(x.label)}<small>${esc(x.group || 'Finance')}</small></b><span>${h ? '→ ' + esc(h.text) : 'no home'}</span></button>`; }).join('')}${q && !hits.length ? '<p style="color:var(--ink-400);margin-top:8px">No row today by that name.</p>' : ''}</div>
      ${o.id === 'T' ? '' : `<div class="cov ${missing.length ? 'bad' : ''}">${missing.length ? 'No home yet: ' + missing.map(m => m.label).join(', ') : 'All 90 of today’s rows have a home.'}</div>`}
    </div>`;
}

/* ── Render ── */
function render(animateSide) {
  renderSeg();
  const app = $('#app');
  if (st.opt === 'CMP' || st.opt === 'ERP') { app.classList.add('compare'); $('#main').innerHTML = st.opt === 'CMP' ? comparePage() : erpPage(); return; }
  app.classList.remove('compare');
  const o = opt();
  if (!st.row) st.row = o.id === 'T' ? 'ov' : o.rows[0].id;
  renderSide(animateSide);
  $('#main').innerHTML = `<div class="page">${o.id === 'T' ? todayPage(st.row) : pageOf(o, o.rows.find(r => r.id === st.row))}</div>`;
  renderNotes();
  updateChecks();
  const hl = document.querySelector('#main .hl'); if (hl) hl.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function updateChecks() {
  const box = document.getElementById('checks'); if (!box) return;
  const all = box.querySelectorAll('[data-task]'), done = box.querySelectorAll('[data-task].done');
  box.querySelector('.pc').textContent = `${done.length} of ${all.length} done`;
  box.querySelector('.bar i').style.setProperty('--w', (done.length / all.length * 100) + '%');
}
function $(s) { return document.querySelector(s); }

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  document.querySelectorAll('.menu').forEach(m => { if (!t || t.dataset.dd !== m.dataset.menu) m.hidden = true; });
  if (!t) return;
  if (t.dataset.opt) { st.opt = t.dataset.opt; st.row = null; st.tab = 0; st.hl = null; try { localStorage.setItem('fin-menu', JSON.stringify({ opt: st.opt })); } catch (e) {} render(true); return; }
  if (t.dataset.row) { st.row = t.dataset.row; st.tab = 0; st.hl = null; render(); return; }
  if (t.dataset.tab) { st.tab = +t.dataset.tab; st.hl = null; render(); return; }
  if (t.dataset.dd) { const m = document.querySelector(`[data-menu="${t.dataset.dd}"]`); m.hidden = !m.hidden; return; }
  if (t.dataset.try) { st.q = t.dataset.try; renderNotes(); const i = $('#wq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); return; }
  if (t.dataset.go || t.dataset.jump) { goTo(t.dataset.go || t.dataset.jump); return; }
  if (t.classList.contains('tick')) { t.closest('.task').classList.toggle('done'); updateChecks(); return; }
});
function goTo(id) {
  const o = opt();
  if (o.id === 'T') { st.row = id; st.hl = null; render(); return; }
  const h = homeOf(o, id); if (!h || !h.row) return;
  st.row = h.row.id; st.hl = id;
  st.tab = h.sec.how === 'tab' ? h.row.secs.indexOf(h.sec) : 0;
  render();
}
document.addEventListener('input', e => {
  if (e.target.id === 'wq') { st.q = e.target.value; const pos = e.target.selectionStart; renderNotes(); const i = $('#wq'); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.matches('[data-rq]')) { const q = e.target.value.toLowerCase(); document.querySelectorAll('[data-rep]').forEach(b => b.hidden = !b.dataset.rep.includes(q)); document.querySelectorAll('[data-rsec]').forEach(s => s.hidden = !s.querySelector('[data-rep]:not([hidden])')); }
});
render(true);
</script>
</body>
</html>
