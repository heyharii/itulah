<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Return to HO steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* Store app › Stock › Return to HO, matching the hub's Ops › Allotment
   (operations/board/tables.tsx, measured on :5350, 25 Oct 2026): KPI strip,
   icon tabs Picklist · Picked · Packed · In transit · Received, one table each,
   the verbs in the bar above it. The store's differences (owner, 25 Oct):
   no store rail — every koli goes to HO; an article is picked whole or left
   (no part of one); what is left stays in the Picklist. No ALT anywhere. */
:root{
  --ink:#1d1d1f; --body:#6e6e73; --faint:#c7c7cc;
  --soft:#fafafb; --soft-2:#f2f2f5; --canvas-out:#ececf0;
  --hairline:#e8e8ec; --hairline-2:#dcdce1; --row-line:#eeeef1;
  --accent:#2862dc; --accent-bg:#eef3fc;
  --bad:#c62828; --ok-fg:#248a3d;
  --r-card:10px; --r-inner:8px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --font:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);background:#141518;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* prototype bar */
.proto{height:50px;color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;overflow-x:auto}
.proto .t{font-weight:600;white-space:nowrap}
.proto .sp{flex:1}
.seg{display:flex;gap:2px;background:#24262b;border-radius:9px;padding:3px}
.seg button{height:32px;padding:0 12px;border-radius:7px;color:#b9bcc3;white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.seg button.on{background:#fff;color:var(--ink)}
.proto .reset{color:#b9bcc3;white-space:nowrap}
.stage{height:calc(100vh - 50px);display:flex;justify-content:center;align-items:center;background:#e9e9ec;overflow:hidden;position:relative}

/* shell: the store app's — icon rail, Stock panel, main card */
.app{height:100%;width:100%;display:grid;grid-template-columns:52px 216px minmax(0,1fr);background:var(--canvas-out);overflow:hidden;position:relative}
.phone .app{width:414px;height:min(896px,calc(100vh - 74px));grid-template-columns:minmax(0,1fr);border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.phone .rail,.phone .dept{display:none}
.rail{display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;margin-bottom:12px}
.ri{width:36px;height:34px;border-radius:8px;display:grid;place-items:center;color:#55565c}
.ri.on{background:#fff;color:var(--accent);box-shadow:0 0 0 1px var(--hairline)}
.dept{background:#fff;margin:12px 0;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.dept h2{margin:0;height:46px;display:flex;align-items:center;padding:0 8px;font-size:17px;font-weight:600}
.nv{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-radius:8px;color:var(--body)}
.nv.on{background:var(--accent-bg);color:var(--accent);font-weight:500}
.nv .n{min-width:22px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;line-height:20px;text-align:center;padding:0 6px;font-weight:500}
.main{margin:12px;background:#fff;border-radius:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.phone .main{margin:0;border-radius:0}
.head{height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--hairline)}
.phone .head{padding:0 16px;height:54px}
.head h1{margin:0;font-size:17px;font-weight:600;flex:1;line-height:24px}
.search{width:300px;height:40px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--body)}
.phone .search{display:none}
.scroll{flex:1;overflow-y:auto;padding:22px 28px 40px}
.phone .scroll{padding:16px 16px 32px}

/* KPI strip */
.kpis{display:flex;margin-bottom:18px}
.kpi{padding:0 26px 0 20px;border-left:1px solid var(--hairline)}
.kpi:first-child{border-left:0;padding-left:0}
.kpi .l{color:var(--body);white-space:nowrap}
.kpi .v{font-size:16px;font-weight:600;padding-top:4px;white-space:nowrap}
.phone .kpi{padding:0 12px 0 12px;flex:1;min-width:0}
.phone .kpi:first-child{padding-left:0}

/* icon tabs — the hub's */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hairline);margin-bottom:16px}
.tab{position:relative;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 8px;color:var(--body);border-radius:8px 8px 0 0;transition:color .15s ease;white-space:nowrap}
.tab .sq{width:32px;height:32px;border-radius:var(--r-inner);display:grid;place-items:center;background:var(--soft-2);color:#55565c;transition:background-color .15s ease,color .15s ease}
.tab .c{color:var(--body);margin-left:4px}
.tab.on{color:var(--ink);font-weight:500}
.tab.on .sq{background:var(--accent-bg);color:var(--accent)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.phone .tabs{gap:0}
.phone .tab{flex:1 1 0;min-width:0;height:auto;flex-direction:column;gap:4px;padding:8px 2px;text-align:center}
.phone .tab .w{white-space:normal;line-height:1.25}

/* the bar above a table: its verbs */
.bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
.phone .bar .btn{flex:1}
.btn{height:36px;padding:0 12px;border-radius:var(--r-inner);background:var(--accent);color:#fff;font-weight:600;white-space:nowrap;transition:transform .16s var(--ease-out),opacity .15s ease}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.big{height:44px;padding:0 20px}
.red-t{color:var(--bad);font-weight:500;height:32px;padding:0 4px}

/* table */
.tbox{border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th{height:44px;background:var(--soft);color:var(--body);font-weight:500;text-align:left;padding:0 16px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:10px 16px;height:63px;color:var(--body);border-top:1px solid var(--row-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
tbody tr:first-child td{border-top:0}
tr.click{cursor:pointer}
@media (hover:hover){tr.click:hover td{background:var(--soft)}}
tfoot td{background:var(--soft);height:44px;border-top:1px solid var(--hairline)}
.r{text-align:right}
.ink{color:var(--ink)}
.art{display:flex;align-items:center;gap:12px;min-width:0}
.art .ph{width:34px;height:34px;border-radius:6px;border:1px solid var(--hairline);display:grid;place-items:center;flex:none;background:#fff}
.art .ph svg{width:24px;height:24px;stroke:none}
.art .tx{min-width:0}
.art .a{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.art .b{color:var(--body);overflow:hidden;text-overflow:ellipsis}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);display:inline-grid;place-items:center;vertical-align:middle;background:#fff;transition:background-color .12s ease,border-color .12s ease}
.cb svg{width:13px;height:13px;stroke-width:3;color:#fff;opacity:0}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb.on svg{opacity:1}
.blue{color:var(--accent)}
.green{color:var(--ok-fg)}
.empty{padding:40px 16px;text-align:center;color:var(--body)}
.phone .hide-p{display:none}

/* sheet (right) and dialog (centre) */
.scrim{position:absolute;inset:0;background:rgba(20,21,24,.28);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;top:8px;right:8px;bottom:8px;width:560px;max-width:calc(100% - 16px);background:#fff;border-radius:14px;display:flex;flex-direction:column;transform:translateX(calc(100% + 16px));transition:transform .32s var(--ease-drawer);z-index:6;box-shadow:0 12px 40px rgba(0,0,0,.14)}
.sheet.on{transform:none}
.phone .sheet{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;height:86%;border-radius:20px 20px 0 0;transform:translateY(100%)}
.phone .sheet.on{transform:none}
.sh-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 16px 36px;border-bottom:1px solid var(--hairline)}
.phone .sh-h{padding:16px 16px 14px 20px}
.sh-h .k{color:var(--body)}
.sh-h .t{font-weight:600;font-size:17px}
.sh-h .sp{flex:1}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--body)}
.sh-b{flex:1;overflow-y:auto;padding:24px 36px}
.phone .sh-b{padding:20px}
.sh-f{display:flex;justify-content:flex-end;gap:12px;align-items:center;padding:14px 20px 14px 36px;border-top:1px solid var(--hairline)}
.phone .sh-f{padding:12px 16px 22px}
.phone .sh-f .btn{flex:1}
.sh-f .sum{flex:1;color:var(--body)}
.phone .sh-f .sum{display:none}
.card{border:1px solid var(--hairline);border-radius:var(--r-card);margin-bottom:12px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--soft)}
.card-h .tx{flex:1;min-width:0}
.card-h .a{font-weight:500}
.card-h .b{color:var(--body)}
.sku{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-top:1px solid var(--row-line)}
.sku .tx{flex:1;min-width:0}
.sku .b{color:var(--body)}
.inkoli{color:var(--ok-fg);font-weight:500;white-space:nowrap}
.dialog{position:absolute;left:50%;top:50%;width:440px;max-width:calc(100% - 32px);background:#fff;border-radius:14px;z-index:7;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;transition:transform .2s var(--ease-out),opacity .2s ease;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.dialog.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.dialog .sh-h{padding:18px 16px 14px 24px}
.dialog .bd{padding:20px 24px}
.dialog .sh-f{padding:14px 24px}
.field label{display:block;color:var(--body);margin-bottom:8px}
.field input{width:100%;height:47px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);padding:0 14px;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;margin-bottom:20px}
.facts dt{color:var(--body)} .facts dd{margin:0;font-weight:500}

.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#1d1d1f;color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;white-space:nowrap;transition:opacity .2s ease,transform .2s var(--ease-out);z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#8fb2ff;font-weight:500}
@media (prefers-reduced-motion:reduce){.sheet,.dialog,.toast{transition:opacity .2s ease}}
</style>
</head>
<body>
<div class="proto">
  <span class="t">Store · Return to HO — as Ops › Allotment</span>
  <div class="seg" id="dev">
    <button data-dev="desk" class="on">Desk</button>
    <button data-dev="phone">Phone 414</button>
  </div>
  <span class="sp"></span>
  <button class="reset" id="reset">Reset</button>
</div>

<div class="stage" id="stage">
  <div class="app">
    <nav class="rail" id="rail"></nav>
    <aside class="dept">
      <h2>Stock</h2>
      <div class="nv">Stock</div>
      <div class="nv">Receive</div>
      <div class="nv">Count</div>
      <div class="nv on">Return to HO <span class="n" id="navN"></span></div>
      <div class="nv">Stock ledger</div>
    </aside>
    <section class="main">
      <div class="head"><h1>Return to HO</h1><div class="search" id="search"></div></div>
      <div class="scroll" id="view"></div>
    </section>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <div class="dialog" id="dialog"></div>
    <div class="toast" id="toast"><span id="toastT"></span><button id="toastU">Undo</button></div>
  </div>
</div>

<script>
const I = {
  list:'<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  box:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  truck:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  boxok:'<path d="m16 16 2 2 4-4"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m7.5 4.27 9 5.15"/><path d="M3.29 7 12 12l8.71-5"/><path d="M12 22V12"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  grid:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  pct:'<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  layers:'<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
};
const ic = (n, cls="i") => `<svg class="${cls}" viewBox="0 0 24 24">${I[n]}</svg>`;
const SHIRT = (fill) => `<svg viewBox="0 0 24 24"><path fill="${fill}" stroke="#9a9aa0" stroke-width=".8" d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>`;
const PANTS = (fill) => `<svg viewBox="0 0 24 24"><path fill="${fill}" stroke="#9a9aa0" stroke-width=".8" d="M6 2h12l1.5 20h-5L12 9l-2.5 13h-5z"/></svg>`;
const pcs = (n) => `${n} ${n === 1 ? "pc" : "pcs"}`;

document.getElementById("rail").innerHTML =
  `<span class="logo">C</span>` + ["grid","grid","pct","layers","box","users"].map((n,k)=>`<span class="ri ${k===3?"on":""}">${ic(n)}</span>`).join("");
document.getElementById("search").innerHTML = `${ic("search")}Search article`;

// What HO asked this shop to send back, summed by article across its
// requests — goods, never request by request.
const SEED = [
  { id:"00000026", name:"Kemeja Linen Pria", ph:SHIRT("#fff"), skus:[["White","M","103",2],["White","L","104",1],["Black","M","203",2]] },
  { id:"00000027", name:"Celana Chino Slim", ph:PANTS("#222"), skus:[["Black","30","101",1],["Black","32","102",2],["Khaki","32","202",1]] },
  { id:"00000025", name:"Kaos Uji OPSA", ph:SHIRT("#222"), skus:[["Black","M","103",1],["Black","L","104",1]] },
  { id:"00000022", name:"Kemeja Test Demo", ph:SHIRT("#fff"), skus:[["White","All","100",3]] },
  { id:"00000031", name:"Jaket Denim", ph:SHIRT("#3c4f6e"), skus:[["Indigo","M","103",1],["Indigo","L","104",1]] },
  { id:"00000034", name:"Rok Plisket", ph:PANTS("#b98aa0"), skus:[["Rose","S","102",2],["Rose","M","103",2]] },
];

let S;
function reset(){
  S = {
    tab:"pick",
    at:Object.fromEntries(SEED.map(a=>[a.id,"pick"])), // pick | picked | koli:n | sent
    koli:[], nextKoli:4, tick:new Set(), // Koli 1–3 left on the two trips below
    trips:[
      { no:"DSP-C001-000004", left:"23 Oct 2026, 16:10", koli:1, pcs:4, received:false },
      { no:"DSP-C001-000003", left:"20 Oct 2026, 11:42", koli:2, pcs:9, received:true },
    ],
    sheet:null, dialog:null, note:"",
  };
}
reset();

const art = (id) => SEED.find(a=>a.id===id);
const qty = (a) => a.skus.reduce((s,k)=>s+k[3],0);
const inState = (st) => SEED.filter(a=>S.at[a.id]===st);
const sum = (list) => list.reduce((s,a)=>s+qty(a),0);
const sealed = () => S.koli.filter(k=>k.sealed && !k.sent);
const kQty = (k) => sum(k.ids.map(art));
const now = () => "25 Oct 2026, 14:" + String(10 + S.nextKoli * 3).padStart(2,"0");

function artCell(a, line){
  return `<div class="art"><span class="ph">${a.ph}</span><div class="tx"><div class="a">${a.name}</div><div class="b">${line ?? `${a.skus.length} ${a.skus.length===1?"SKU":"SKUs"} · ${a.id}`}</div></div></div>`;
}

function render(){
  const phone = document.getElementById("stage").classList.contains("phone");
  const toPick = inState("pick"), picked = inState("picked"), koli = sealed();
  const transit = S.trips.filter(t=>!t.received), received = S.trips.filter(t=>t.received);
  document.getElementById("navN").textContent = toPick.length || "";
  document.getElementById("navN").style.display = toPick.length ? "" : "none";

  let h = `<div class="kpis">
    <div class="kpi"><div class="l">To pick</div><div class="v num">${pcs(sum(toPick))}</div></div>
    <div class="kpi"><div class="l">Picked</div><div class="v num">${pcs(sum(picked))}</div></div>
    <div class="kpi"><div class="l">Packed</div><div class="v num">${koli.length} koli</div></div>
    <div class="kpi"><div class="l">In transit</div><div class="v num">${transit.reduce((s,t)=>s+t.koli,0)} koli</div></div>
  </div>`;
  const tabs = [["pick","list","Picklist",toPick.length],["picked","bag","Picked",picked.length],["packed","box","Packed",koli.length],["transit","truck","In transit",transit.length],["received","boxok","Received",received.length]];
  h += `<div class="tabs" role="tablist">${tabs.map(([k,i,w,n])=>`<button class="tab ${S.tab===k?"on":""}" role="tab" aria-selected="${S.tab===k}" data-tab="${k}"><span class="sq">${ic(i)}</span><span class="w">${w}<span class="c num">${n}</span></span></button>`).join("")}</div>`;

  if (S.tab==="pick"){
    h += toPick.length ? `<div class="tbox"><table>
      <colgroup><col style="width:56px"><col>${phone?"":`<col style="width:96px">`}<col style="width:96px"></colgroup>
      <thead><tr><th class="r" style="padding-right:0">No.</th><th>Article</th><th class="r hide-p">Qty</th><th></th></tr></thead>
      <tbody>${toPick.map((a,k)=>`<tr class="click" data-open="${a.id}">
        <td class="r num" style="padding-right:0">${k+1}</td>
        <td>${artCell(a, phone ? `${pcs(qty(a))} · ${a.id}` : undefined)}</td>
        <td class="r num hide-p">${pcs(qty(a))}</td>
        <td class="r" style="padding-right:16px"><button class="btn" data-pick="${a.id}">Pick</button></td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="tbox"><div class="empty">Nothing to pick.</div></div>`;
  }

  if (S.tab==="picked"){
    h += `<div class="bar"><button class="btn red" data-act="back" ${picked.length?"":"disabled"}>Back to Picklist</button><button class="btn" data-act="pack" ${picked.length?"":"disabled"}>Pack</button></div>`;
    h += picked.length ? `<div class="tbox"><table>
      <colgroup><col><col style="width:${phone?76:110}px"><col style="width:${phone?84:96}px"></colgroup>
      <thead><tr><th>Article</th><th class="r">Picked</th><th></th></tr></thead>
      <tbody>${picked.map(a=>`<tr class="click" data-open="${a.id}"><td>${artCell(a)}</td><td class="r num">${pcs(qty(a))}</td><td class="r"><button class="red-t" data-unpick="${a.id}">Unpick</button></td></tr>`).join("")}</tbody>
      <tfoot><tr><td>${picked.length} ${picked.length===1?"article":"articles"}</td><td class="r num ink" style="font-weight:600">${pcs(sum(picked))}</td><td></td></tr></tfoot>
    </table></div>` : `<div class="tbox"><div class="empty">Nothing picked.</div></div>`;
  }

  if (S.tab==="packed"){
    const t = koli.filter(k=>S.tick.has(k.n));
    const all = koli.length && t.length===koli.length;
    h += `<div class="bar"><button class="btn red" data-act="unpack" ${t.length?"":"disabled"}>Unpack</button><button class="btn" data-act="dispatch" ${t.length?"":"disabled"}>Dispatch${t.length?` ${t.length} koli`:""}</button></div>`;
    h += koli.length ? `<div class="tbox"><table>
      <colgroup><col style="width:48px"><col>${phone?"":`<col style="width:210px">`}<col style="width:90px"></colgroup>
      <thead><tr><th style="padding-right:0"><span class="cb ${all?"on":""}" data-all>${ic("check","")}</span></th><th>Koli</th><th class="hide-p">Sealed</th><th class="r">Pcs</th></tr></thead>
      <tbody>${koli.map(k=>`<tr class="click" data-koli="${k.n}">
        <td style="padding-right:0"><span class="cb ${S.tick.has(k.n)?"on":""}">${ic("check","")}</span></td>
        <td><div class="ink" style="font-weight:500">Koli ${k.n}</div><div>${k.code}</div></td>
        <td class="hide-p">${k.at}</td><td class="r num ink">${kQty(k)}</td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="tbox"><div class="empty">No koli.</div></div>`;
  }

  if (S.tab==="transit" || S.tab==="received"){
    const rows = S.tab==="transit" ? transit : received;
    h += rows.length ? `<div class="tbox"><table>
      <colgroup><col>${phone?"":`<col style="width:200px">`}<col style="width:60px"><col style="width:60px"><col style="width:110px"></colgroup>
      <thead><tr><th>Trip</th><th class="hide-p">Left</th><th class="r">Koli</th><th class="r">Pcs</th><th class="r">Status</th></tr></thead>
      <tbody>${rows.map(t=>`<tr><td class="ink" style="font-weight:500">${t.no}</td><td class="hide-p">${t.left}</td><td class="r num">${t.koli}</td><td class="r num">${t.pcs}</td><td class="r ${t.received?"green":"blue"}">${t.received?"Received":"In transit"}</td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="tbox"><div class="empty">Nothing here.</div></div>`;
  }

  document.getElementById("view").innerHTML = h;
  renderSheet(); renderDialog();
}

/* sheets: an article (read), the Pack sheet */
function renderSheet(){
  const el = document.getElementById("sheet");
  const on = S.sheet !== null;
  el.classList.toggle("on", on);
  document.getElementById("scrim").classList.toggle("on", on || S.dialog !== null);
  if (!on) return;
  if (S.sheet.kind==="article"){
    const a = art(S.sheet.id), st = S.at[a.id];
    el.innerHTML = `<div class="sh-h"><div><div class="k">${a.id}</div><div class="t">${a.name}</div></div><span class="sp"></span><button class="x" data-close>${ic("x")}</button></div>
      <div class="sh-b"><div class="card"><div class="card-h"><span class="art"><span class="ph">${a.ph}</span></span><div class="tx"><div class="a">${a.name}</div><div class="b">${a.skus.length} ${a.skus.length===1?"SKU":"SKUs"}</div></div><b class="num">${pcs(qty(a))}</b></div>
      ${a.skus.map(k=>`<div class="sku"><div class="tx"><div>${k[0]} · ${k[1]}</div><div class="b">${a.id}·${k[2]}</div></div><span class="num">${pcs(k[3])}</span></div>`).join("")}</div></div>
      ${st==="pick" ? `<div class="sh-f"><span class="sum">${pcs(qty(a))}</span><button class="btn big" data-pick="${a.id}">Pick ${pcs(qty(a))}</button></div>` : ""}`;
  }
  if (S.sheet.kind==="pack"){
    const k = S.koli.find(x=>x.n===S.sheet.koli);
    const list = [...inState("picked"), ...k.ids.map(art)];
    el.innerHTML = `<div class="sh-h"><div><div class="k">Return to HO</div><div class="t">Pack · Koli ${k.n}</div></div><span class="sp"></span><button class="x" data-close>${ic("x")}</button></div>
      <div class="sh-b">${list.map(a=>{const inK = k.ids.includes(a.id); return `<div class="card"><div class="card-h"><span class="art"><span class="ph">${a.ph}</span></span><div class="tx"><div class="a">${a.name}</div><div class="b">${a.skus.length} ${a.skus.length===1?"SKU":"SKUs"} · ${a.id}</div></div><b class="num">${qty(a)}</b>
          ${inK ? `<button class="red-t" data-out="${a.id}">Take out</button>` : `<button class="btn" data-into="${a.id}">Pack</button>`}</div>
        ${a.skus.map(s=>`<div class="sku"><div class="tx"><div>${s[0]} · ${s[1]}</div><div class="b">${a.id}·${s[2]}</div></div><span class="num">${s[3]}</span>${inK?`<span class="inkoli">Koli ${k.n}</span>`:""}</div>`).join("")}</div>`;}).join("")}</div>
      <div class="sh-f"><span class="sum">${k.ids.length ? `Koli ${k.n} · ${pcs(kQty(k))}` : ""}</span><button class="btn big" data-act="done">Done</button></div>`;
  }
}

function renderDialog(){
  const el = document.getElementById("dialog");
  el.classList.toggle("on", S.dialog !== null);
  if (S.dialog===null) return;
  if (S.dialog==="dispatch"){
    const t = sealed().filter(k=>S.tick.has(k.n));
    el.innerHTML = `<div class="sh-h"><div class="t">Dispatch ${t.length} koli</div><span class="sp"></span><button class="x" data-close>${ic("x")}</button></div>
      <div class="bd"><dl class="facts"><dt>To</dt><dd>HO · Gudang</dd><dt>Pcs</dt><dd class="num">${t.reduce((s,k)=>s+kQty(k),0)}</dd></dl>
      <div class="field"><label for="note">Trip note</label><input id="note" placeholder="Courier · plate · driver" value="${S.note}"></div></div>
      <div class="sh-f"><button class="btn big" data-act="send">Dispatch</button></div>`;
  }
  if (S.dialog==="back"){
    const p = inState("picked");
    el.innerHTML = `<div class="sh-h"><div class="t">Back to Picklist</div><span class="sp"></span><button class="x" data-close>${ic("x")}</button></div>
      <div class="bd">${p.length} ${p.length===1?"article":"articles"} · ${pcs(sum(p))}</div>
      <div class="sh-f"><button class="btn big red" data-act="backgo">Back to Picklist</button></div>`;
  }
}

let undo = null, toastTimer;
function toast(text, back){
  undo = back;
  document.getElementById("toastT").textContent = text;
  document.getElementById("toastU").style.display = back ? "" : "none";
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 4000);
}
document.getElementById("toastU").onclick = () => { if (undo) undo(); undo = null; document.getElementById("toast").classList.remove("show"); render(); };
const snap = () => JSON.stringify({...S, tick:[...S.tick]});
const restore = (j) => { const o = JSON.parse(j); S = {...o, tick:new Set(o.tick)}; };
const close = () => { S.sheet = null; S.dialog = null; };

document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-dev],[data-tab],[data-pick],[data-unpick],[data-open],[data-act],[data-into],[data-out],[data-close],[data-tick],[data-all],[data-koli],#scrim");
  if (!el) return;
  const d = el.dataset;
  if (d.dev){
    document.querySelectorAll("#dev button").forEach(b=>b.classList.toggle("on", b===el));
    document.getElementById("stage").classList.toggle("phone", d.dev==="phone");
    return render();
  }
  if (el.id==="scrim" || d.close !== undefined){
    if (S.sheet?.kind==="pack") return finishPack();
    close(); return render();
  }
  if (d.tab){ S.tab = d.tab; S.tick = new Set(); return render(); }
  if (d.pick){
    const was = snap(), a = art(d.pick);
    S.at[a.id] = "picked"; close();
    toast(`${a.name} · ${pcs(qty(a))} now in Picked`, ()=>restore(was));
    return render();
  }
  if (d.unpick){
    const was = snap(), a = art(d.unpick);
    S.at[a.id] = "pick";
    toast(`${a.name} back in Picklist`, ()=>restore(was));
    return render();
  }
  if (d.open){ S.sheet = { kind:"article", id:d.open }; return render(); }
  if (d.koli){
    S.tick.has(+d.koli) ? S.tick.delete(+d.koli) : S.tick.add(+d.koli);
    return render();
  }
  if (d.tick){ return; }
  if (d.all !== undefined){
    const k = sealed(), all = k.every(x=>S.tick.has(x.n));
    S.tick = all ? new Set() : new Set(k.map(x=>x.n));
    return render();
  }
  if (d.into || d.out){
    const k = S.koli.find(x=>x.n===S.sheet.koli);
    if (d.into){ k.ids.push(d.into); S.at[d.into] = "koli:"+k.n; }
    else { k.ids = k.ids.filter(id=>id!==d.out); S.at[d.out] = "picked"; }
    return render();
  }
  if (d.act==="pack"){
    // one koli at a time; only a sealed koli is kept
    S.koli.push({ n:S.nextKoli, code:`KOLI-C001-${String(40+S.nextKoli).padStart(6,"0")}`, ids:[], sealed:false });
    S.sheet = { kind:"pack", koli:S.nextKoli };
    return render();
  }
  if (d.act==="done") return finishPack();
  if (d.act==="back"){ S.dialog = "back"; return render(); }
  if (d.act==="backgo"){
    const was = snap(), p = inState("picked");
    p.forEach(a=>S.at[a.id]="pick"); close();
    toast(`${pcs(sum(p))} back in Picklist`, ()=>restore(was));
    return render();
  }
  if (d.act==="unpack"){
    const was = snap(), t = sealed().filter(k=>S.tick.has(k.n));
    t.forEach(k=>k.ids.forEach(id=>S.at[id]="picked"));
    S.koli = S.koli.filter(k=>!t.includes(k)); S.tick = new Set();
    toast(`${t.length} koli unpacked · back in Picked`, ()=>restore(was));
    return render();
  }
  if (d.act==="dispatch"){ S.dialog = "dispatch"; return render(); }
  if (d.act==="send"){
    const t = sealed().filter(k=>S.tick.has(k.n));
    const p = t.reduce((s,k)=>s+kQty(k),0);
    t.forEach(k=>{ k.sent = true; k.ids.forEach(id=>S.at[id]="sent"); });
    const no = `DSP-C001-${String(5 + S.trips.length - 2).padStart(6,"0")}`;
    S.trips.unshift({ no, left:now(), koli:t.length, pcs:p, received:false });
    S.tick = new Set(); S.note = ""; close(); S.tab = "transit";
    toast(`${no} · ${pcs(p)} on the way to HO`);
    return render();
  }
});

function finishPack(){
  const k = S.koli.find(x=>x.n===S.sheet.koli);
  close();
  if (!k.ids.length){ S.koli = S.koli.filter(x=>x!==k); return render(); }
  k.sealed = true; k.at = now(); S.nextKoli++;
  toast(`Koli ${k.n} sealed · ${pcs(kQty(k))} · label printing`);
  render();
}
document.addEventListener("input", (e)=>{ if (e.target.id==="note") S.note = e.target.value; });
document.getElementById("reset").onclick = () => { reset(); render(); };
render();
</script>
</body>
