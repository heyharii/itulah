<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales one table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* frontend-hub tokens (src/styles/index.css) */
:root{
  --ink:#20242c;--text:#394150;--body:#565f6d;--mute:#666f7d;--faint:#b9c0c9;--line-ico:#89919d;
  --canvas:#ffffff;--soft:#f8f8f9;--soft-2:#f0f0f2;--soft-3:#f6f6f7;
  --hairline:#e6e6e9;--hairline-2:#dadade;--hairline-strong:#c6c6cc;
  --rail:#242526;--rail-2:#303234;--rail-mute:#a1a3a8;
  --accent:#2563eb;--accent-bg:#eff5ff;--bad-fg:#be123c;--good-fg:#15803d;--dark:#191b20;
  --r-card:10px;--r-inner:8px;--r-sheet:16px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--soft-3);color:var(--ink);font:400 15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.pressable{transition:transform 120ms var(--ease-out),background-color 150ms ease,color 150ms ease,box-shadow 150ms ease}
.pressable:active{transform:scale(.97)}

/* prototype chrome */
.proto{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--dark);color:#fff;font-size:14px;flex-wrap:wrap}
.proto b{font-weight:600}
.proto .grp{display:flex;align-items:center;gap:4px}
.proto .grp span{color:#a1a3a8;margin-right:4px}
.proto .grp button{padding:5px 10px;border-radius:999px;color:#c3c4c7}
.proto .grp button.on{background:#fff;color:var(--dark)}
.proto .note{margin-left:auto;color:#a1a3a8}

.app{display:flex;min-height:calc(100vh - 42px)}
.rail{width:64px;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.rail .logo{width:32px;height:32px;border-radius:8px;background:#000;color:#fff;font-weight:700;display:grid;place-items:center;margin-bottom:12px;position:relative}
.rail .logo:after{content:"";position:absolute;right:7px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.rail i{width:36px;height:36px;border-radius:8px;display:block;position:relative}
.rail i:before{content:"";position:absolute;inset:11px;border:1.6px solid var(--rail-mute);border-radius:4px}
.rail i.on{background:var(--rail-2)}
.rail i.on:before{border-color:#fff}
.page{flex:1;min-width:0;padding:22px 28px 28px}

/* header */
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.title h1{margin:0;font-size:22px;line-height:28px;font-weight:600}
.title p{margin:2px 0 0;color:var(--mute)}
.grow{flex:1}
.seg{display:inline-flex;background:var(--soft-2);border-radius:var(--r-inner);padding:3px;gap:2px;flex:none}
.seg button{height:30px;padding:0 12px;border-radius:6px;color:var(--body);font-size:14px;font-weight:500;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.btn{height:36px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;color:var(--text);white-space:nowrap}
.btn svg{color:var(--line-ico)}
.btn .badge{background:var(--ink);color:#fff;border-radius:999px;font-size:13px;line-height:18px;min-width:18px;text-align:center;padding:0 5px}
.btn.on{border-color:var(--ink);color:var(--ink)}

/* KPI */
.kpi{margin-top:18px;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);display:grid}
.k1{grid-template-columns:repeat(6,minmax(0,1fr))}
.k1 .fig+.fig{border-left:1px solid var(--hairline)}
.fig{padding:14px 18px;min-width:0}
.fig .l{color:var(--mute);font-size:14px}
.fig .v{font-size:22px;line-height:30px;font-weight:600;margin-top:2px;white-space:nowrap}
.fig .s{color:var(--mute);font-size:14px;line-height:20px;margin-top:2px}
.fig .s b{font-weight:500;color:var(--body)}
.k2{grid-template-columns:minmax(0,1.1fr) 1px minmax(0,3.4fr)}
.k2 .vol{display:grid;grid-template-columns:1fr 1fr}
.k2 .vr{background:var(--hairline);margin:14px 0}
.eq{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr)}
.op{display:grid;place-items:center;color:var(--faint);font-size:20px;padding:0 2px}
.k3{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:transparent;border:0}
.k3 .fig{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);padding:16px 18px}
.k3 .fig .v{font-size:26px;line-height:34px}
.k3 .rows{margin-top:10px;border-top:1px solid var(--hairline);padding-top:8px}
.k3 .rows div{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;line-height:22px}
.k3 .rows div span:last-child{color:var(--text)}
.delta{font-size:14px;font-weight:500;color:var(--good-fg)}

/* results card */
.card{margin-top:16px;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--hairline);overflow:hidden}
.tabs button{position:relative;padding:0 10px;color:var(--body);font-weight:500;font-size:14px;height:48px;white-space:nowrap}
.tabs button.on{color:var(--ink)}
.tabs button.on:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.tools{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.search{height:36px;width:300px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mute)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 4px;color:var(--text);font-size:14px;font-weight:500}
.switch .t{width:34px;height:20px;border-radius:999px;background:var(--hairline-strong);position:relative;transition:background-color 150ms ease}
.switch .t:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform 160ms var(--ease-out)}
.switch.on .t{background:var(--accent)}
.switch.on .t:after{transform:translateX(14px)}
.applied{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--hairline);color:var(--body);font-size:14px}
.applied button{color:var(--accent);font-weight:500}
.crumb{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--hairline);color:var(--mute);font-size:14px}
.crumb button{color:var(--accent);font-weight:500}

.scroll{overflow:auto;max-height:calc(100vh - 420px);min-height:320px;position:relative}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:0 12px;height:56px;border-bottom:1px solid var(--hairline);text-align:right;white-space:nowrap;background:#fff}
thead th{height:40px;font-size:14px;font-weight:500;color:var(--mute);position:sticky;top:0;z-index:4}
thead tr.g th{height:36px;color:var(--text);border-bottom:0;text-align:center}
thead tr.g th:first-child{text-align:left;color:var(--mute)}
thead tr.g + tr th{top:36px}
thead tr.g + tr th:first-child{left:auto;text-align:right;border-right:0;padding-left:12px;z-index:4}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:2;padding-left:16px;border-right:1px solid var(--hairline)}
thead th:first-child{z-index:6}
.pin{position:sticky;right:0;z-index:2;background:var(--soft)}
th.pin{z-index:6;background:var(--soft)}
.pin-l{border-left:1px solid var(--hairline-2);box-shadow:-6px 0 8px -6px rgba(16,24,40,.12)}
td.name{min-width:230px;max-width:280px;white-space:normal}
td.name .n{font-weight:500;color:var(--ink);line-height:20px}
td.name .d{color:var(--mute);font-size:14px;line-height:20px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
tbody tr:hover td.pin{background:var(--soft-2)}
tfoot td{position:sticky;bottom:0;z-index:3;background:var(--soft-2);font-weight:600;border-top:1px solid var(--hairline-2)}
tfoot td:first-child{z-index:5}
tfoot td.pin{z-index:5;background:var(--soft-2)}
.b{font-weight:600;color:var(--ink)}
.q{color:var(--mute)}
.sep{border-left:1px solid var(--hairline)}
.stack{line-height:20px;text-align:right}
.stack .v{color:var(--ink)}
.stack .w{color:var(--mute);font-size:14px}
td.stackcell{height:76px}
.legend{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}
.legend span{display:inline-block;width:72px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(37,99,235,.04),rgba(37,99,235,.30))}
.foot{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--mute);font-size:14px}
.fade{animation:fade 160ms var(--ease-out)}
@keyframes fade{from{opacity:.5}to{opacity:1}}

/* floating sheet */
.scrim{position:fixed;inset:0;background:rgba(25,27,32,.18);z-index:50;opacity:0;pointer-events:none;transition:opacity 200ms ease}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:58px;right:20px;bottom:20px;width:440px;background:#fff;border-radius:var(--r-sheet);box-shadow:0 24px 64px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.06);z-index:51;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform 260ms var(--ease-drawer)}
.sheet.open{transform:none}
.sheet.wide{width:620px}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--hairline)}
.sh-h h2{margin:0;font-size:18px;font-weight:600}
.sh-h .x{margin-left:auto;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--mute)}
.sh-h .x:hover{background:var(--soft-2)}
.sh-b{flex:1;overflow:auto;padding:4px 20px 16px}
.sh-f{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--hairline)}
.sh-f .primary{margin-left:auto;height:40px;padding:0 18px;border-radius:var(--r-inner);background:var(--ink);color:#fff;font-weight:600}
.sec{padding:14px 0;border-bottom:1px solid var(--hairline)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:15px;font-weight:600;display:flex;align-items:center}
.sec h3 small{margin-left:auto;font-size:14px;font-weight:400;color:var(--mute)}
.opt{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px;border-radius:8px;cursor:pointer;color:var(--text)}
.opt:hover{background:var(--soft)}
.opt .box{width:18px;height:18px;border:1.5px solid var(--hairline-strong);border-radius:5px;display:grid;place-items:center;flex:none}
.opt.on .box{background:var(--ink);border-color:var(--ink)}
.opt.on .box:after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt .c{margin-left:auto;color:var(--mute);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
.mini-search{height:36px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);display:flex;align-items:center;padding:0 10px;margin-bottom:6px;color:var(--mute);gap:8px}
.mini-search input{border:0;outline:0;flex:1;min-width:0}
.two{display:grid;grid-template-columns:200px 1fr;height:100%}
.two nav{border-right:1px solid var(--hairline);padding:8px;overflow:auto}
.two nav button{display:flex;width:100%;align-items:center;height:42px;padding:0 12px;border-radius:8px;color:var(--text);font-weight:500;font-size:14px}
.two nav button.on{background:var(--soft-2);color:var(--ink)}
.two nav button small{margin-left:auto;color:var(--mute);font-weight:400}
.two .pane{padding:12px 16px;overflow:auto}
.row-open{display:flex;align-items:center;height:56px;border-bottom:1px solid var(--hairline);cursor:pointer;gap:10px}
.row-open .k{font-weight:500}
.row-open .val{margin-left:auto;color:var(--mute)}
.row-open .chev{color:var(--line-ico)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;height:36px}

/* calendar popover */
.cal{position:absolute;z-index:45;background:#fff;border:1px solid var(--hairline);border-radius:14px;box-shadow:0 16px 48px rgba(16,24,40,.16);display:flex;transform-origin:top right;animation:pop 160ms var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.cal .pre{border-right:1px solid var(--hairline);padding:10px;width:170px}
.cal .pre button{display:block;width:100%;text-align:left;height:36px;padding:0 10px;border-radius:8px;color:var(--text);font-size:14px}
.cal .pre button:hover{background:var(--soft)}
.cal .pre button.on{background:var(--soft-2);color:var(--ink);font-weight:500}
.cal .mons{padding:14px 16px}
.cal .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .nav button{width:32px;height:32px;border-radius:8px;color:var(--body)}
.cal .nav button:hover{background:var(--soft)}
.cal .pair{display:flex;gap:24px}
.mon h4{margin:0 0 6px;text-align:center;font-size:15px;font-weight:600}
.mon .dow,.mon .days{display:grid;grid-template-columns:repeat(7,36px)}
.mon .dow span{height:28px;display:grid;place-items:center;color:var(--mute);font-size:14px}
.mon .days button{height:36px;font-size:14px;color:var(--text);position:relative}
.mon .days button.out{color:var(--faint);cursor:default}
.mon .days button.in{background:var(--accent-bg)}
.mon .days button.end{background:var(--ink);color:#fff;border-radius:8px}
.mon .days button.today{font-weight:600}
.cal .cf{display:flex;align-items:center;gap:10px;border-top:1px solid var(--hairline);padding:12px 16px;margin:12px -16px -14px}
.cal .cf .primary{margin-left:auto;height:36px;padding:0 14px;border-radius:var(--r-inner);background:var(--ink);color:#fff;font-weight:600}

@media (max-width:760px){
  .page{padding:16px}.rail{display:none}
  .k1{grid-template-columns:1fr 1fr}.k1 .fig+.fig{border-left:0}
  .k2{grid-template-columns:1fr}.k2 .vr{display:none}.eq{grid-template-columns:1fr 1fr}.eq .op{display:none}
  .k3{grid-template-columns:1fr 1fr}
  .search{width:100%}
  .tabs{overflow-x:hidden;flex-wrap:wrap}
  .sheet,.sheet.wide{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:82vh;transform:translateY(calc(100% + 16px))}
  .sheet.open{transform:none}
  .two{grid-template-columns:1fr}.two nav{display:none}
  .proto .note{display:none}
  .hide-phone{display:none}
  th,td{padding:0 8px}
  th:first-child,td:first-child{padding-left:12px}
  td.name{min-width:0;max-width:124px}
  th:not(:first-child),td:not(:first-child){padding:0 6px}
}
</style>
</head>

  const stockCost = D.div.reduce((a, d, i) => a + shown.reduce((b, s, j) => { const c = D.divstore[d.code][s.id]; return b + stockOf(c.sold, i, j) * (c.net / c.sold) * RATIO[d.code]; }, 0), 0);
  return { done, voided, sold, gross: net, discount: 0, returns: 0, net, cost, profit: net - cost, stock, stockCost };
}

function month(y, m) {
  const first = new Date(Date.UTC(y, m, 1)), days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(), lead = (first.getUTCDay() + 6) % 7;
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<span></span>`;
  for (let d = 1; d <= days; d++) {
    const k = iso(new Date(Date.UTC(y, m, d))), a = S.calA, b = S.calB || S.calA;
    const lo = a && b ? (a < b ? a : b) : null, hi = a && b ? (a < b ? b : a) : null;
    const out = k > LAST_DAY || k < "2025-01-01";
    const cls = [out ? "out" : "", lo && (k === lo || k === hi) ? "end" : lo && k > lo && k < hi ? "in" : "", k === LAST_DAY ? "today" : ""].join(" ");
    cells += `<button class="${cls}" ${out ? "disabled" : `data-day="${k}"`}>${d}</button>`;
  }
  return `<div class="mon"><h4>${MONTH_NAMES[m]} ${y}</h4><div class="dow">${["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((x) => `<span>${x}</span>`).join("")}</div><div class="days">${cells}</div></div>`;
}
function calendar() {
  const a = S.calA, b = S.calB;
  const lo = a && b ? (a < b ? a : b) : a, hi = a && b ? (a < b ? b : a) : a;
  const span = lo && hi ? Math.round((parse(hi) - parse(lo)) / 864e5) + 1 : 0;
  const quick = [["Today", LAST_DAY, LAST_DAY], ["Yesterday", addDays(LAST_DAY, -1), addDays(LAST_DAY, -1)], ["Last 7 days", addDays(LAST_DAY, -6), LAST_DAY], ["Last 30 days", addDays(LAST_DAY, -29), LAST_DAY], ["This month", "2025-12-01", LAST_DAY], ["Last month", "2025-11-01", "2025-11-30"], ["This year", "2025-01-01", LAST_DAY]];
  return `<div class="cal" style="right:0;top:44px">

}

      <div class="fig"><div class="l">Net sales</div><div class="v">${rpc(t.net)}</div><div class="s">${rp(t.net / t.done)} per transaction</div></div><div class="op">−</div>
      <div class="fig"><div class="l">Acquisition cost</div><div class="v">${rpc(t.cost)}</div><div class="s">what the goods cost us</div></div><div class="op">=</div>
      <div class="fig"><div class="l">Gross profit</div><div class="v">${rpc(t.profit)}</div><div class="s">${pct(margin)} margin</div></div>

  return `<section class="kpi k3">
    <div class="fig"><div class="l">Transactions</div><div class="v">${num(t.done + t.voided)}</div><div class="rows"><div><span>Completed</span><span>${num(t.done)}</span></div><div><span>Voided</span><span>${num(t.voided)}</span></div><div><span>Pieces each</span><span>${(t.sold / t.done).toLocaleString("id-ID", { maximumFractionDigits: 1 })}</span></div></div></div>
    <div class="fig"><div class="l">Net sales</div><div class="v">${rpc(t.net)}</div><div class="rows"><div><span>Gross sales</span><span>${rpc(t.gross)}</span></div><div><span>Discount</span><span>${rpc(t.discount)}</span></div><div><span>Returns</span><span>${rpc(t.returns)}</span></div></div></div>

/* ── the table ───────────────────────────────────────── */
const ALL_MEASURES = { sales: ["Sales", "Sales"], sold: ["Sold", "Sold"], stock: ["Stock", "Stock"], cost: ["Acquisition", "Acq."], tx: ["Transactions", "Trans."] };
function measures() {
  const g = S.drill ? "article" : S.group;
  if (g === "payment") return ["tx", "sales"];
  if (g === "month" || g === "session") return ["tx", "sold", "sales", "cost"];
  return ["stock", "sold", "sales", "cost"];
}
const MEASURES = []; // filled per render from measures()
const val = (c, m) => (c == null ? null : m === "sales" ? c.net : m === "sold" ? c.sold : m === "stock" ? c.stock : m === "tx" ? c.tx : c.cost);
const fmtM = (v, m, cur = false) => (v == null ? "—" : m === "sales" || m === "cost" ? rpc(v, cur) : num(v));
function totalOf(t, m) { return m === "sales" ? t.net : m === "sold" ? t.sold : m === "stock" ? t.stock : m === "tx" ? t.done : t.cost; }
function heatScale(list, m) {
  const vals = list.flatMap((r) => storesShown().map((s) => val(r.ps[s.id], m))).filter((v) => v != null && v > 0);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  return (v) => (S.heat && v != null && v > 0 ? `background:rgba(37,99,235,${(0.04 + 0.26 * ((v - lo) / (hi - lo || 1))).toFixed(3)})` : "");
}
function nameTd(r) { return `<td class="name"><div class="n">${r.label}</div>${r.detail ? `<div class="d">${r.detail}</div>` : ""}</td>`; }
function pinCols(widths) { let right = 0; const pos = []; for (let i = widths.length - 1; i >= 0; i--) { pos[i] = right; right += widths[i]; } return pos; }

function tableTotals(list) {
  const t = totals();
  const money = isMoney(), pay = !S.drill && S.group === "payment";
  const head = pay
    ? `<th>${groupLabel()}</th><th>Transactions</th><th>Net sales</th><th>Per transaction</th><th>Share</th>`
    : `<th>${groupLabel()}</th>${money ? '<th class="hide-phone">Transactions</th>' : '<th class="hide-phone">Stock</th>'}<th>Sold</th><th class="hide-phone">Gross sales</th><th class="hide-phone">Discount</th><th>Net sales</th><th class="hide-phone">Acquisition</th><th>Gross profit</th><th class="hide-phone">Margin</th><th class="hide-phone">Share</th>`;
  const body = list.map((r) => { const c = rowTotal(r);
    if (pay) return `<tr data-row="${r.key}">${nameTd(r)}<td>${num(c.tx)}</td><td class="b">${rpc(c.net)}</td><td>${rp(c.net / c.tx)}</td><td class="q">${pct(c.net / t.net)}</td></tr>`;
    return `<tr data-row="${r.key}">${nameTd(r)}<td class="hide-phone ${money ? "" : "q"}">${num(money ? c.tx : c.stock)}</td><td>${num(c.sold)}</td><td class="hide-phone">${rpc(c.net)}</td><td class="hide-phone q">Rp 0</td><td class="b">${rpc(c.net)}</td><td class="hide-phone">${rpc(c.cost)}</td><td>${rpc(c.cost == null ? null : c.net - c.cost)}</td><td class="hide-phone">${pct(c.cost == null ? null : (c.net - c.cost) / c.net)}</td><td class="hide-phone q">${pct(c.net / t.net)}</td></tr>`; }).join("");
  const foot = pay
    ? `<tr><td>Total</td><td>${num(t.done)}</td><td>${rpc(t.net)}</td><td>${rp(t.net / t.done)}</td><td>100,0%</td></tr>`
    : `<tr><td>Total</td><td class="hide-phone">${num(money ? t.done : t.stock)}</td><td>${num(t.sold)}</td><td class="hide-phone">${rpc(t.gross)}</td><td class="hide-phone">Rp 0</td><td>${rpc(t.net)}</td><td class="hide-phone">${rpc(t.cost)}</td><td>${rpc(t.profit)}</td><td class="hide-phone">${pct(t.profit / t.net)}</td><td class="hide-phone">100,0%</td></tr>`;
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
}

function tableStores(list) {
  const stores = storesShown(), t = totals(), k = scale();
  const tot = (s) => { const d = D.div.reduce((a, dv, i) => { const c = D.divstore[dv.code][s.id]; a.sold += c.sold * k.sold; a.net += c.net * k.net; a.stock += stockOf(c.sold, i, STORES.indexOf(s)); a.cost += c.net * k.net * RATIO[dv.code]; return a; }, { sold: 0, net: 0, stock: 0, cost: 0 }); return d; };
  const storeTotals = Object.fromEntries(stores.map((s) => [s.id, { ...tot(s), tx: D.rcpt[s.id].done * k.sold }]));
  const money = isMoney();
  if (S.per === 1) {

    const g = `<tr class="g"><th rowspan="2" style="vertical-align:bottom">${groupLabel()}</th>${stores.map((s) => `<th colspan="${sub.length}" class="sep" title="${s.name}">${s.code.replace("-TOKO", "")}</th>`).join("")}${sub.map((x, i) => i === 0 ? `<th colspan="${sub.length}" class="pin pin-l" style="right:0;width:${W * sub.length}px">Totals</th>` : "").join("")}</tr>`;
    const h = `<tr>${stores.map(() => sub.map(([, l], i) => `<th class="${i === 0 ? "sep" : ""}">${l}</th>`).join("")).join("")}${sub.map(([, l], i) => `<th class="pin ${i === 0 ? "pin-l" : ""}" style="right:${pins[i]}px;min-width:${W}px">${l}</th>`).join("")}</tr>`;
    const body = list.map((r) => { const c = rowTotal(r); return `<tr data-row="${r.key}">${nameTd(r)}${stores.map((s) => sub.map(([m], i) => { const v = val(r.ps[s.id], m); return `<td class="${i === 0 ? "sep" : ""} ${m === "sales" ? "" : "q"}" style="${m === "sales" ? heat(v) : ""}">${fmtM(v, m)}</td>`; }).join("")).join("")}${sub.map(([m], i) => `<td class="pin ${i === 0 ? "pin-l" : ""} ${m === "sales" ? "b" : ""}" style="right:${pins[i]}px;min-width:${W}px">${fmtM(val(c, m), m)}</td>`).join("")}</tr>`; }).join("");
    const foot = `<tr><td>Total</td>${stores.map((s) => sub.map(([m], i) => `<td class="${i === 0 ? "sep" : ""}">${fmtM(val(storeTotals[s.id], m), m)}</td>`).join("")).join("")}${sub.map(([m], i) => `<td class="pin ${i === 0 ? "pin-l" : ""}" style="right:${pins[i]}px;min-width:${W}px">${fmtM(totalOf(t, m), m)}</td>`).join("")}</tr>`;
    return `<table><thead>${g}${h}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
  }
  if (S.per === 2) {
    const heat = heatScale(list, "sales");
    const ms = measures();
    const stack = (c, strong) => c ? `<div class="stack"><div class="v ${strong ? "b" : ""}">${rpc(c.net, false)}</div><div class="w">${[ms.includes("tx") && c.tx != null ? num(c.tx) + " trans." : "", ms.includes("sold") && c.sold != null ? num(c.sold) + " sold" : "", ms.includes("stock") && c.stock != null ? num(c.stock) + " stock" : ""].filter(Boolean).join(" · ")}</div><div class="w">${ms.includes("cost") && c.cost != null ? "acq " + rpc(c.cost, false) : ""}</div></div>` : `<div class="stack"><div class="w">—</div></div>`;
    const head = `<th>${groupLabel()}</th>${stores.map((s) => `<th title="${s.name}">${s.code.replace("-TOKO", "")}</th>`).join("")}<th class="pin pin-l" style="right:0;min-width:150px">Totals</th>`;
    const body = list.map((r) => `<tr data-row="${r.key}">${nameTd(r)}${stores.map((s) => `<td class="stackcell" style="${heat(val(r.ps[s.id], "sales"))}">${stack(r.ps[s.id])}</td>`).join("")}<td class="pin pin-l stackcell" style="right:0">${stack(rowTotal(r), true)}</td></tr>`).join("");
    const foot = `<tr><td>Total <span class="q" style="font-weight:400">Rp</span></td>${stores.map((s) => `<td class="stackcell">${stack(storeTotals[s.id])}</td>`).join("")}<td class="pin pin-l stackcell" style="right:0">${stack({ net: t.net, sold: t.sold, stock: t.stock, cost: t.cost, tx: t.done }, true)}</td></tr>`;
    return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
  }
  // 3 — pick the store number, keep every total pinned
  const m = measures().includes(S.measure) ? S.measure : "sales", heat = heatScale(list, m);
  const sub = measures().map((x) => [x, ALL_MEASURES[x][1]]);
  const W = 96, pins = pinCols(sub.map(() => W));
  const g = `<tr class="g"><th rowspan="2" style="vertical-align:bottom">${groupLabel()}</th><th colspan="${stores.length}">${ALL_MEASURES[m][0]} per store${m === "sales" || m === "cost" ? " · Rp" : m === "tx" ? "" : " · pcs"}</th><th colspan="${sub.length}" class="pin pin-l" style="right:0">Totals</th></tr>`;

  const foot = `<tr><td>Total</td>${stores.map((s) => `<td>${fmtM(val(storeTotals[s.id], m), m)}</td>`).join("")}${sub.map(([mm], i) => `<td class="pin ${i === 0 ? "pin-l" : ""}" style="right:${pins[i]}px;min-width:${W}px">${fmtM(totalOf(t, mm), mm)}</td>`).join("")}</tr>`;

}

}

/* ── filters ─────────────────────────────────────────── */
const filterCount = () => ["stores", "divisions", "tags", "payment", "suppliers"].reduce((a, k) => a + (S.f[k].size ? 1 : 0), 0) + (S.f.price !== "all" ? 1 : 0) + (S.f.stock !== "all" ? 1 : 0);
function appliedLine() {
  const parts = [];
  const names = (set, list, key, label) => { if (set.size) parts.push(`${label}: ${[...set].map((c) => (list.find((x) => x[key] === c) || {}).label || c).slice(0, 3).join(", ")}${set.size > 3 ? ` +${set.size - 3}` : ""}`); };
  names(S.f.stores, STORES.map((s) => ({ id: s.id, label: s.code.replace("-TOKO", "") })), "id", "Stores");
  names(S.f.divisions, D.div, "code", "Division");
  names(S.f.tags, TAGS.map((t) => ({ code: t, label: t })), "code", "Tag");
  names(S.f.payment, [{ m: "CASH", label: "Cash" }, { m: "CARD", label: "Card" }, { m: "QRIS", label: "QRIS" }], "m", "Payment");
  if (S.f.price !== "all") parts.push(S.f.price === "full" ? "Full price only" : "Discounted only");
  if (S.f.stock !== "all") parts.push(S.f.stock === "in" ? "In stock" : "Sold out");
  return parts.length ? `<div class="applied">${parts.join(" · ")}<button data-clear="1">Clear</button></div>` : "";
}
const CATS = [
  ["stores", "Stores", () => STORES.map((s) => [s.id, s.name, s.code.replace("-TOKO", "")])],
  ["divisions", "Division", () => D.div.map((d) => [d.code, d.label, ""])],
  ["tags", "Tag", () => TAGS.map((t) => [t, t, ""])],
  ["suppliers", "Supplier", () => ["CV Benang Mas", "PT Sandang Prima", "UD Tenun Jaya", "PT Garmen Nusantara", "CV Kain Indah", "PT Busana Utama"].map((s) => [s, s, ""])],
  ["payment", "Payment method", () => [["CASH", "Cash", ""], ["CARD", "Card", ""], ["QRIS", "QRIS", ""]]],
];
function opts(key, list, cols2) {
  return `<div class="${cols2 ? "grid2" : ""}">${list.map(([v, l, c]) => `<div class="opt ${S.f[key].has(v) ? "on" : ""}" data-opt="${key}|${v}"><span class="box"></span><span>${l}</span>${c ? `<span class="c">${c}</span>` : ""}</div>`).join("")}</div>`;
}
const segPrice = () => `<div class="seg"><button class="pressable ${S.f.price === "all" ? "on" : ""}" data-price="all">All</button><button class="pressable ${S.f.price === "full" ? "on" : ""}" data-price="full">Full price</button><button class="pressable ${S.f.price === "disc" ? "on" : ""}" data-price="disc">Discounted</button></div>`;
const segStock = () => `<div class="seg"><button class="pressable ${S.f.stock === "all" ? "on" : ""}" data-stock="all">All</button><button class="pressable ${S.f.stock === "in" ? "on" : ""}" data-stock="in">In stock</button><button class="pressable ${S.f.stock === "out" ? "on" : ""}" data-stock="out">Sold out</button></div>`;
const summary = (key) => (S.f[key].size ? `${S.f[key].size} chosen` : "All");
function sheet() {
  const el = document.getElementById("sheet");
  el.classList.toggle("wide", S.flt === 2);
  const count = rows().length;
  let body = "";
  if (S.flt === 1) {
    body = CATS.map(([k, l, list]) => `<div class="sec"><h3>${l}<small>${summary(k)}</small></h3>${k === "suppliers" ? `<div class="mini-search">${ICON.search}<input placeholder="Search suppliers"></div>` : ""}${opts(k, list(), k !== "payment" && k !== "suppliers")}</div>`).join("")
      + `<div class="sec"><h3>Price</h3>${segPrice()}</div><div class="sec"><h3>Stock</h3>${segStock()}</div>`;
  } else if (S.flt === 2) {
    const cats = [...CATS, ["price", "Price", null], ["stock", "Stock", null]];
    const cur = cats.find((c) => c[0] === S.pane) || cats[0];
    const pane = cur[2] ? `<div class="mini-search">${ICON.search}<input placeholder="Search ${cur[1].toLowerCase()}"></div>${opts(cur[0], cur[2](), false)}` : cur[0] === "price" ? segPrice() : segStock();
    body = `<div class="two"><nav>${cats.map(([k, l]) => `<button class="pressable ${S.pane === k ? "on" : ""}" data-pane="${k}">${l}<small>${k === "price" ? (S.f.price === "all" ? "All" : "1") : k === "stock" ? (S.f.stock === "all" ? "All" : "1") : S.f[k].size || "All"}</small></button>`).join("")}</nav><div class="pane">${pane}</div></div>`;
  } else {
    if (S.page3) {
      const cur = CATS.find((c) => c[0] === S.page3);
      body = `<button class="back" data-page3="">${ICON.back}Filter</button><div class="sec"><h3>${cur[1]}<small>${summary(cur[0])}</small></h3><div class="mini-search">${ICON.search}<input placeholder="Search ${cur[1].toLowerCase()}"></div>${opts(cur[0], cur[2](), false)}</div>`;
    } else {
      body = CATS.map(([k, l]) => `<div class="row-open pressable" data-page3="${k}"><span class="k">${l}</span><span class="val">${summary(k)}</span><span class="chev">${ICON.chev}</span></div>`).join("")
        + `<div class="sec"><h3>Price</h3>${segPrice()}</div><div class="sec"><h3>Stock</h3>${segStock()}</div>`;
    }
  }
  el.innerHTML = `<div class="sh-h"><h2>Filter</h2><button class="x pressable" data-closefilter="1">${ICON.x}</button></div>
    <div class="sh-b" style="${S.flt === 2 ? "padding:0" : ""}">${body}</div>
    <div class="sh-f"><button class="btn pressable" data-clear="1">Reset</button><button class="primary pressable" data-closefilter="1">Show ${num(count)} ${NOUN[S.drill ? "article" : S.group]}</button></div>`;
  el.classList.toggle("open", S.sheet);
  document.getElementById("scrim").classList.toggle("open", S.sheet);
}

/* ── render & wire ───────────────────────────────────── */
function render() {
  const focus = document.activeElement && document.activeElement.id === "q";
  document.getElementById("page").innerHTML = header() + kpi() + results();
  document.querySelectorAll(".proto [data-k]").forEach((b) => b.classList.toggle("on", +b.dataset.k === S.kpi));
  document.querySelectorAll(".proto [data-p]").forEach((b) => b.classList.toggle("on", +b.dataset.p === S.per));
  document.querySelectorAll(".proto [data-f]").forEach((b) => b.classList.toggle("on", +b.dataset.f === S.flt));
  sheet();
  if (focus) { const q = document.getElementById("q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); }
document.addEventListener("click", (e) => {
  if (S.cal && !e.target.closest(".cal") && !e.target.closest("[data-calbtn]")) { S.cal = false; render(); return; }
  const b = e.target.closest("button,tr,.opt,.row-open");
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.k) S.kpi = +d.k;
  else if (d.p) { S.per = +d.p; S.view = "stores"; }
  else if (d.f) { S.flt = +d.f; S.sheet = true; S.page3 = null; }
  else if (d.preset) { S.preset = d.preset; [, S.from, S.to] = PRESETS[d.preset]; }
  else if (d.calbtn) { S.cal = !S.cal; S.calA = S.preset === "custom" ? S.from : null; S.calB = S.preset === "custom" ? S.to : null; }
  else if (d.calnav) S.calLeft = Math.min(10, Math.max(0, S.calLeft + +d.calnav));
  else if (d.day) { if (!S.calA || S.calB) { S.calA = d.day; S.calB = null; } else S.calB = d.day; }
  else if (d.quick) { [S.calA, S.calB] = d.quick.split("|"); }
  else if (d.calcancel) S.cal = false;
  else if (d.calapply) { const a = S.calA, z = S.calB || S.calA; S.from = a < z ? a : z; S.to = a < z ? z : a; S.preset = "custom"; S.cal = false; }
  else if (d.group) { S.group = d.group; S.drill = null; S.q = ""; }
  else if (d.view) S.view = d.view;
  else if (d.measure) S.measure = d.measure;
  else if (d.heat) S.heat = !S.heat;
  else if (d.openfilter) { S.sheet = true; S.page3 = null; }
  else if (d.closefilter !== undefined && b.dataset.closefilter) S.sheet = false;
  else if (d.pane) S.pane = d.pane;
  else if (d.page3 !== undefined) S.page3 = d.page3 || null;
  else if (d.opt) { const [k, v] = d.opt.split("|"); toggle(S.f[k], v); }
  else if (d.price) S.f.price = d.price;
  else if (d.stock) S.f.stock = d.stock;
  else if (d.clear) { S.f = { stores: new Set(), divisions: new Set(), tags: new Set(), payment: new Set(), suppliers: new Set(), price: "all", stock: "all" }; }
  else if (d.up) S.drill = null;
  else if (d.row && !S.drill && S.group === "division") S.drill = d.row;
  else return;
  render();
});
document.getElementById("scrim").addEventListener("click", () => { S.sheet = false; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.sheet || S.cal)) { S.sheet = false; S.cal = false; render(); } });
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render(); } });
render();
</script>
</body>
</html>
