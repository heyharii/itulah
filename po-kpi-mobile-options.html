<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Strip Mobile Options</title>
<style>
:root{
  --ink:#20242c;--text:#394150;--body:#565f6d;--mute:#666f7d;--line-ico:#89919d;
  --canvas:#fff;--soft:#f8f8f9;--soft-2:#f0f0f2;--page:#f6f6f7;--hairline:#e6e6e9;--hairline-2:#dadade;
  --accent:#2563eb;--accent-bg:#eff5ff;--bad-fg:#be123c;--bad-bg:#fbeaea;
  --shadow-soft:0 1px 2px rgb(24 39 60 / 6%),0 1px 1px rgb(24 39 60 / 4%);
  --ease-out:cubic-bezier(.23,1,.32,1);--t-press:120ms;--w:375px;
}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#e4e4e8;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block;flex:none}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.9}
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 20px;background:rgb(255 255 255 / .92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline-2)}
.bar h1{font-size:15px;font-weight:600;margin-right:6px}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:#d9d9de}
.seg button{padding:5px 11px;border-radius:7px;font-size:14px;font-weight:500;color:#444}
.seg button[aria-pressed=true]{background:#fff;color:#111;box-shadow:0 1px 2px rgb(0 0 0 / .15)}
.lab{font-size:14px;color:#555;margin-right:8px}
.stage{display:flex;gap:28px;padding:24px 20px 60px;overflow-x:auto;align-items:flex-start}
.opt{flex:none}
.opt h2{font-size:15px;font-weight:600;margin:0 4px 2px}
.opt p{font-size:14px;color:#555;margin:0 4px 10px;max-width:var(--w);min-height:63px}
.phone{width:var(--w);height:760px;background:var(--page);border-radius:30px;border:1px solid #cfcfd6;box-shadow:0 18px 40px rgb(0 0 0 / .14);overflow:hidden;display:flex;flex-direction:column}
.topbar{height:51px;flex:none;background:#fff;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px;padding:0 12px 0 16px}
.topbar b{font-weight:600;font-size:17px;letter-spacing:-.01em}.topbar .sp{flex:1}
.topbar .ib{width:36px;height:36px;display:grid;place-items:center;font-size:20px;color:var(--line-ico)}.topbar .ib.ac{color:var(--accent)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:15px}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 24px}
.tabs{height:56px;flex:none;background:#fff;border-top:1px solid var(--hairline);display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:500;color:var(--mute);position:relative}
.tabs button .ico{font-size:22px;color:var(--line-ico)}
.tabs button.on{color:var(--accent);background:linear-gradient(180deg,rgb(37 99 235 / .08),transparent)}.tabs button.on .ico{color:var(--accent)}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--accent)}
.dock{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px;background:rgb(255 255 255 / .96);border-top:1px solid var(--hairline)}
.dock .st{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 14px;border-radius:999px;background:var(--soft-2);font-size:14px;font-weight:500}
.dock .fd{flex:1;display:flex;align-items:center;gap:8px;height:36px;border-radius:999px;background:var(--soft-2);padding:0 12px;color:var(--mute);font-size:14px}
.dock .fab{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px}

/* the list under the strip, for context */
.cards{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.po{border:1px solid var(--hairline);border-radius:10px;background:#fff;box-shadow:var(--shadow-soft);padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.po b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.po .id{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:14px;color:var(--mute)}
.po .d{font-size:14px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-size:14px;font-weight:500;white-space:nowrap}

/* ── KPI strip variants ── */
.tone-bad{color:var(--bad-fg)}
.c{border:1px solid var(--hairline);border-radius:10px;background:var(--canvas);box-shadow:var(--shadow-soft)}
.lbl{font-size:14px;font-weight:500;color:var(--body);white-space:nowrap}
.val{font-size:18px;line-height:1.1;font-weight:600;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.val.z{color:var(--mute);font-weight:500}
/* A */
.a{display:grid;gap:10px}
.a .c{padding:10px 14px;min-width:0}.a .val{margin-top:8px}
.a .c.w{grid-column:1/-1}
/* B */
.b{display:grid;overflow:hidden}
.b .k{padding:10px 14px;min-width:0}
.b .val{margin-top:6px}
/* C */
.cc{display:flex;overflow:hidden}
.cc .k{flex:1;min-width:0;padding:11px 2px 10px;text-align:center}
.cc .k+.k{border-left:1px solid var(--hairline)}
.cc .val{font-size:16px}.cc .lbl{display:block;margin-top:4px;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.cc.r2{flex-wrap:wrap}
.cc.r2 .k{flex:1 1 33%;border-top:1px solid var(--hairline)}
.cc.r2 .k:nth-child(-n+3){border-top:0}
.cc.r2 .k:nth-child(4){border-left:0}
/* D */
.d1{padding:2px 4px;font-size:15px;line-height:1.55;color:var(--body)}
.d1 b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.d1 .s{color:#b9c0c9;margin:0 4px}
/* E */
.e{overflow:hidden}
.e .r{display:flex;align-items:center;justify-content:space-between;height:38px;padding:0 14px;gap:12px}
.e .r+.r{border-top:1px solid var(--hairline)}
.e .val{font-size:16px}
/* F */
.f{overflow:hidden}
.f .h{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 14px}
.f .h .sum{flex:1;min-width:0;font-size:15px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .h .sum b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.f .h .sum .s{color:#b9c0c9;margin:0 5px}
.f .h .chev{font-size:18px;color:var(--line-ico);transition:rotate 200ms var(--ease-out)}
.f.open .h .chev{rotate:180deg}
.f .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--ease-out)}
.f.open .body{grid-template-rows:1fr}
.f .body>div{overflow:hidden}
.f .grid{display:grid;border-top:1px solid var(--hairline)}
.f .grid .k{padding:10px 14px;min-width:0}
.f .grid .val{margin-top:6px}
</style>
</head>
<body>
<div class="bar">
  <h1>KPI Strip · Phone Options</h1>
  <span><span class="lab">Data</span><span class="seg" id="data"></span></span>
  <span><span class="lab">Width</span><span class="seg" id="width"></span></span>
</div>
<div class="stage" id="stage"></div>
<script>
const I={clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',sparkles:'<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/>',chev:'<path d="m6 9 6 6 6-6"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',back:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',clip:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',building:'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/>',cube:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>'};
const svg=n=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* label: the card's name; short: for a cell with no room; inline: the word after the figure; lead: shown when collapsed. */
const SETS={
 "Needs You":[
  {label:"To review",c:"Review",value:"4",inline:"to review",lead:true},
  {label:"Overdue",value:"0",inline:"overdue",lead:true,bad:true},
  {label:"Arriving",value:"2",inline:"arriving this week"},
  {label:"On order",value:"Rp 4,0 billion",short:"Rp 4,0 bn",inline:"on order",money:true},
 ],
 "Needs You · Worst":[
  {label:"To review",c:"Review",value:"1.012",inline:"to review",lead:true},
  {label:"Overdue",value:"142",inline:"overdue",lead:true,bad:true},
  {label:"Arriving",value:"386",inline:"arriving this week"},
  {label:"On order",value:"Rp 128,4 billion",short:"Rp 128,4 bn",inline:"on order",money:true},
 ],
 "PO (4)":[
  {label:"Orders",value:"8",inline:"orders"},
  {label:"Still open",c:"Open",value:"8",inline:"open",lead:true},
  {label:"Overdue",value:"0",inline:"overdue",lead:true,bad:true},
  {label:"On order",value:"Rp 4,0 billion",short:"Rp 4,0 bn",inline:"on order",money:true},
 ],
 "Suppliers (5)":[
  {label:"Active",value:"4",inline:"active",lead:true},
  {label:"Non-active",c:"Non-act.",value:"2",inline:"non-active"},
  {label:"Active PO",value:"8",inline:"active PO",lead:true},
  {label:"Active PO qty",c:"PO qty",value:"21.060 pcs",short:"21.060",inline:"pcs"},
  {label:"Active PO value",c:"PO value",value:"Rp 4,0 billion",short:"Rp 4,0 bn",inline:"value",money:true},
 ],
 "Worst Case":[
  {label:"Orders",value:"1.284",inline:"orders"},
  {label:"Still open",c:"Open",value:"1.012",inline:"open",lead:true},
  {label:"Overdue",value:"142",inline:"overdue",lead:true,bad:true},
  {label:"On order",value:"Rp 128,4 billion",short:"Rp 128,4 bn",inline:"on order",money:true},
 ],
 "Loading":[
  {label:"Orders",value:"—",inline:"orders"},{label:"Still open",c:"Open",value:"—",inline:"open",lead:true},{label:"Overdue",value:"—",inline:"overdue",lead:true,bad:true},{label:"On order",value:"—",short:"—",inline:"on order"},
 ],
};
const WIDTHS=[320,360,375,414];
const q=new URLSearchParams(location.search);
let key=q.get("data")||"Needs You"; if(!SETS[key]) key="PO (4)";
let width=Number(q.get("w"))||375;
const open={};
const z=v=>v==="0"||v==="—";
const vcls=k=>`val ${z(k.value)?"z":""} ${k.bad&&!z(k.value)&&k.value!=="—"?"tone-bad":""}`;
/* Counts share a row; a sum of money, the widest figure, gets a row of its own. */
const plan=ks=>{const rest=ks.filter(k=>!k.money);const cols=rest.length===3?3:2;return {cols}};
const gridCells=(ks,fn)=>{const {cols}=plan(ks);let n=0;return {cols,html:ks.map(k=>{
  if(k.money){return fn(k,`grid-column:1/-1;${n>0?"border-top:1px solid var(--hairline);":""}`)}
  const i=n++;const st=`${i%cols?"border-left:1px solid var(--hairline);":""}${i>=cols?"border-top:1px solid var(--hairline);":""}`;return fn(k,st)}).join("")}};
const V={
 A:ks=>{const {cols}=plan(ks);return `<div class="a" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${ks.map(k=>`<div class="c" style="padding:10px ${cols===3&&!k.money?10:14}px;min-width:0;${k.money?"grid-column:1/-1":""}"><div class="lbl">${k.label}</div><div class="${vcls(k)}" style="margin-top:8px">${k.value}</div></div>`).join("")}</div>`},
 B:ks=>{const g=gridCells(ks,(k,st)=>`<div class="k" style="${st}"><div class="lbl">${k.label}</div><div class="${vcls(k)}">${k.value}</div></div>`);return `<div class="c b" style="grid-template-columns:repeat(${g.cols},minmax(0,1fr))">${g.html}</div>`},
 C:ks=>`<div class="c cc ${ks.length>4?"r2":""}">${ks.map(k=>`<div class="k" style="${ks.length>4?"":`flex:${k.money?1.6:1}`}"><div class="${vcls(k)}">${k.short||k.value}</div><span class="lbl">${k.c||k.label}</span></div>`).join("")}</div>`,
 D:ks=>`<div class="d1">${ks.map((k,i)=>`${i?'<span class="s">·</span>':""}<b class="${k.bad&&!z(k.value)?"tone-bad":""}">${k.value}</b> ${k.inline}`).join("")}</div>`,
 E:ks=>`<div class="c e">${ks.map(k=>`<div class="r"><span class="lbl">${k.label}</span><span class="${vcls(k)}">${k.value}</span></div>`).join("")}</div>`,
 F:(ks,id)=>{const on=!!open[id];const lead=ks.filter(k=>k.lead);const g=gridCells(ks,(k,st)=>`<div class="k" style="${st}"><div class="lbl">${k.label}</div><div class="${vcls(k)}">${k.value}</div></div>`);return `<div class="c f ${on?"open":""}"><button class="h" data-open="${id}" aria-expanded="${on}"><span class="sum">${lead.map((k,i)=>`${i?'<span class="s">·</span>':""}<b class="${k.bad&&!z(k.value)?"tone-bad":""}">${k.value}</b> ${k.inline}`).join("")}</span><span class="chev">${svg("chev")}</span></button>
   <div class="body"><div><div class="grid" style="grid-template-columns:repeat(${g.cols},minmax(0,1fr))">${g.html}</div></div></div></div>`}
};
const OPTIONS=[
 {k:"A",name:"A · Two by Two",blurb:"The same four cards, wrapped into two rows. Familiar; costs about 90px more height than the strip it replaces."},
 {k:"B",name:"B · One Panel",blurb:"One card with a cross of hairlines instead of four boxes. Less chrome than A, same room."},
 {k:"C",name:"C · Four Across",blurb:"One short row: figure over label, the money compacted (Rp 4,0 bn). Smallest of the grids; five figures wrap to 3 + 2."},
 {k:"D",name:"D · One Sentence",blurb:"No boxes: the figures read as a line of text. About 50px tall, overdue goes red; nothing to tap."},
 {k:"E",name:"E · Rows",blurb:"A small list, label left and figure right. Tallest, but the only one that never shortens a figure."},
 {k:"F",name:"F · Open to See",blurb:"Closed it says the two that matter (open, overdue); one tap opens all of them. Costs no height until asked."},
];
const topbar=t=>`<div class="topbar"><b>${t}</b><span class="sp"></span><span class="ib">${svg("clock")}</span><span class="ib ac">${svg("sparkles")}</span><div class="av">R</div></div>`;
const tabs=`<div class="tabs"><button>${svg("back")}Back</button><button class="on">${svg("clip")}Orders</button><button>${svg("building")}Suppliers</button><button>${svg("cube")}Sourcing</button><button>${svg("undo")}Return PO</button></div>`;
const dock=`<div class="dock"><span class="st">Active ${svg("chev")}</span><span class="fd">${svg("search")}Search Orders</span><span class="fab">${svg("plus")}</span></div>`;
const list=`<div class="cards"><div class="po"><div><b>Indorama, PT</b><div class="id">PO-051026-001</div><div class="d">05 Oct</div></div><span class="chip">Review Count</span></div><div class="po"><div><b>Indorama, PT</b><div class="id">PO-041026-012</div><div class="d">04 Oct</div></div><span class="chip">Review Count</span></div><div class="po"><div><b>Garmen AA, UD</b><div class="id">PO-051026-003</div><div class="d">05 Oct</div></div><span class="chip">Review Count</span></div></div>`;

function paint(){
  document.documentElement.style.setProperty("--w",width+"px");
  const ks=SETS[key];
  document.getElementById("stage").innerHTML=OPTIONS.map(o=>`<section class="opt"><h2>${o.name}</h2><p>${o.blurb}</p>
    <div class="phone">${topbar(key.startsWith("Supp")?"Suppliers":"Purchase Orders")}<div class="scroll"><div data-strip="${o.k}">${V[o.k](ks,o.k)}</div>${list}</div>${dock}${tabs}</div></section>`).join("");
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{open[b.dataset.open]=!open[b.dataset.open];paint()});
  seg("data",Object.keys(SETS),key,v=>{key=v;paint();sync()});
  seg("width",WIDTHS.map(String),String(width),v=>{width=Number(v);paint();sync()});
}
function seg(id,values,cur,on){const el=document.getElementById(id);el.innerHTML=values.map(v=>`<button aria-pressed="${v===cur}">${v}</button>`).join("");[...el.children].forEach((b,i)=>b.onclick=()=>on(values[i]))}
function sync(){history.replaceState(null,"","?"+new URLSearchParams({data:key,w:String(width)}))}
paint();
</script>
</body>
</html>
