<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles · 5 list options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* Tokens from frontend-hub/src/styles/index.css, sized to the E · Quiet scale:
   Inter 14, 36px controls, 52px rows, Poppins title 28. Nothing under 14px. */
:root{
  --ink:#20242c; --text:#394150; --body:#626b78; --mute:#737c89; --faint:#b9c0c9; --line-ico:#89919d;
  --canvas:#fff; --soft:#f8f9fb; --soft-2:#f0f2f5; --soft-3:#f7f8fa;
  --hairline:#e7eaf0; --hairline-2:#dce1e8; --hairline-strong:#c7ced8;
  --backdrop:#dfe3ea; --tooltip:#101012;
  --accent:#2563eb; --accent-bg:#eff5ff; --cta:#2563eb; --cta-hover:#1d4ed8;
  --info:#2f86d8; --info-fg:#2c57bf;
  --ok:#36b827; --warn:#c9892e; --warn-bg:#fdf3e1; --warn-fg:#b45309;
  --r-shell:1rem; --r-card:.75rem; --r-inner:.4375rem;
  --shadow-soft:0 1px 3px rgb(24 39 60 / 4%);
  --shadow-pop:0 4px 8px rgb(24 39 60 / 4%),0 12px 32px rgb(24 39 60 / 8%);
  --shadow-shell:0 10px 34px rgb(24 39 60 / 8%);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --row:52px; --ctl:36px;
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--backdrop);color:var(--text);font-size:14px;line-height:20px;
  -webkit-font-smoothing:antialiased;padding:20px 20px 96px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .faint{color:var(--faint)} .warnc{color:var(--warn-fg)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* option switcher (prototype chrome, not part of the screen) */
.top{max-width:90rem;margin:0 auto 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:16px;font-weight:600;color:var(--ink)}
.top p{color:var(--body)}
.lenses{margin-left:auto;display:flex;gap:2px;background:var(--soft-2);padding:3px;border-radius:999px;flex-wrap:wrap}
.lens{border:0;background:transparent;border-radius:999px;padding:6px 14px;color:var(--body);transition:background .15s var(--ease-out),color .15s}
.lens.on{background:var(--canvas);color:var(--ink);font-weight:500;box-shadow:var(--shadow-soft)}

/* the screen */
.pane{max-width:90rem;margin:0 auto;background:var(--canvas);border-radius:var(--r-shell);box-shadow:var(--shadow-shell);padding:24px 28px 24px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h2{font-family:Poppins,Inter,sans-serif;font-size:28px;line-height:36px;font-weight:600;color:var(--ink);letter-spacing:-.025em}
.ph .sub{color:var(--body);margin-top:2px}
.ph .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{height:var(--ctl);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hairline-2);background:var(--canvas);border-radius:var(--r-inner);
  padding:0 12px;color:var(--ink);font-weight:500;white-space:nowrap;transition:background .15s var(--ease-out),transform .1s var(--ease-out)}
.btn:hover{background:var(--soft)} .btn:active{transform:scale(.97)}
.btn.pri{background:var(--cta);border-color:var(--cta);color:#fff;font-weight:600} .btn.pri:hover{background:var(--cta-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--body)} .btn.ghost:hover{background:var(--soft-2)}
.btn.on{background:var(--soft-2);border-color:transparent}
.btn .cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600}
.btn svg.i{color:var(--line-ico)}

.tools{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;position:relative}
.search{position:relative;display:flex;align-items:center;height:var(--ctl);width:22rem;max-width:100%;border:1px solid var(--hairline-2);border-radius:var(--r-inner);
  padding:0 10px;gap:8px;background:var(--canvas);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent}
.search input::placeholder{color:var(--mute)}
.search svg{color:var(--line-ico)}
.kbd{border:1px solid var(--hairline-2);border-radius:5px;padding:0 6px;color:var(--mute);line-height:20px}
.tools .count{margin-left:auto;color:var(--body);white-space:nowrap}
.tools .count b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;background:var(--soft-2);border-radius:var(--r-inner);padding:3px;height:var(--ctl)}
.seg button{border:0;background:transparent;border-radius:5px;padding:0 10px;color:var(--body)}
.seg button.on{background:var(--canvas);color:var(--ink);font-weight:500;box-shadow:var(--shadow-soft)}
.sep{width:1px;height:20px;background:var(--hairline);margin:0 4px}

/* one table grammar, virtualised */
.frame{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden}
.frame.split{grid-template-columns:minmax(0,1fr) 27rem}
.scroll{overflow:auto;height:calc(100vh - 290px);min-height:26rem;position:relative;overscroll-behavior:contain}
table.t{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.t th,.t td{padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.t td{height:var(--row);box-shadow:inset 0 -1px var(--hairline);color:var(--text)}
.t thead th{position:sticky;top:0;z-index:2;height:40px;background:var(--canvas);color:var(--mute);font-weight:400;box-shadow:inset 0 -1px var(--hairline-2);user-select:none}
.t thead th.srt{cursor:pointer} .t thead th.srt:hover{color:var(--ink)}
.t thead th .ar{color:var(--ink)}
.t .n{text-align:right}
.t tbody tr{cursor:default}
.t tbody tr.link{cursor:pointer}
.t tbody tr.link:hover>td{background:var(--soft)}
.t tbody tr.picked>td{background:var(--accent-bg)!important}
.t tbody tr.dim td{color:var(--mute)}
.t tr.sp td{height:auto;box-shadow:none;padding:0}
.t tr.grp>td{background:var(--soft-3);color:var(--ink);font-weight:500;cursor:pointer}
.t tr.grp:hover>td{background:var(--soft-2)}
.t tr.lv1>td{background:#fcfcfd}
.t tr.lv2>td{background:#fcfcfd}
.t td.chk,.t th.chk{padding:0 0 0 14px;width:40px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);vertical-align:-3px;cursor:pointer}

.art{display:flex;gap:10px;align-items:center;min-width:0}
.art .tx{min-width:0;display:flex;flex-direction:column}
.art b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.dim .art b{color:var(--mute)}
.art .code{color:var(--mute)}
.th{width:32px;height:32px;border-radius:var(--r-inner);flex:none;display:grid;place-items:center;position:relative;overflow:hidden}
.th svg{width:18px;height:18px;opacity:.55}
.th.none{border:1px dashed var(--hairline-strong);background:var(--canvas);color:var(--faint)}
.th.big{width:72px;height:72px;border-radius:10px} .th.big svg{width:34px;height:34px}
.dots{display:inline-flex;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px var(--canvas),inset 0 0 0 1px rgb(0 0 0/12%);margin-right:-4px}
.dots .more{margin-left:10px;color:var(--mute)}
.stat{display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
.stat i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--faint))}
.chev{width:16px;height:16px;color:var(--line-ico);transition:transform .2s var(--ease-out);flex:none}
.chev.open{transform:rotate(90deg)}
.tw{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;border:0;background:none;margin-right:4px}
.tw:hover{background:var(--soft-2)}
.tw.ph{visibility:hidden}

/* spreadsheet cells */
.cell{width:100%;height:34px;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 8px;outline:0;transition:border-color .12s,background .12s}
.cell:hover{border-color:var(--hairline-2);background:var(--canvas)}
.cell:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:var(--canvas)}
.cell.dirty{color:var(--accent);background:var(--accent-bg);font-weight:500}
.cell.r{text-align:right;font-variant-numeric:tabular-nums}
select.cell{appearance:none;cursor:pointer}
.sheetnote{display:flex;gap:16px;align-items:center;margin-bottom:10px;color:var(--body);flex-wrap:wrap}
.selbar{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border-radius:var(--r-inner);background:var(--ink);color:#fff;margin-bottom:10px}
.selbar b{font-weight:600;margin-right:6px}
.selbar .btn{background:transparent;border-color:rgb(255 255 255/.2);color:#fff;height:32px}
.selbar .btn:hover{background:rgb(255 255 255/.1)}

/* tabs (option 5) */
.tabs{display:flex;border-bottom:1px solid var(--hairline-2);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--body);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button span{color:var(--mute)}
.tabs button.warn span{color:var(--warn-fg)}
.tabs button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}

/* detail (pane in 1, sheet elsewhere) */
.det{overflow:auto;height:calc(100vh - 290px);min-height:26rem;border-left:1px solid var(--hairline);animation:slide .22s var(--ease-out)}
.det .hd{display:flex;gap:14px;padding:18px 18px 14px;align-items:flex-start}
.det .hd h3{font-size:18px;line-height:24px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.det .hd .x{margin-left:auto}
.det .sec{padding:12px 18px;border-top:1px solid var(--hairline)}
.det .sec h4{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px;display:flex;align-items:center}
.det .sec h4 span{margin-left:auto;font-weight:400;color:var(--mute)}
.facts{display:grid;grid-template-columns:8.5rem 1fr;row-gap:8px}
.facts dt{color:var(--mute)} .facts dd{color:var(--ink)}
.issue{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:var(--r-inner);background:var(--warn-bg);color:var(--warn-fg);margin-bottom:6px}
.issue .btn{margin-left:auto;height:30px}
.mx{border-collapse:separate;border-spacing:0;width:100%}
.mx th,.mx td{padding:0 8px;height:40px;text-align:right;white-space:nowrap;box-shadow:inset 0 -1px var(--hairline)}
.mx th{color:var(--mute);font-weight:400;height:32px}
.mx th:first-child,.mx td:first-child{text-align:left;padding-left:0}
.mx td.z{color:var(--faint)}
.mx td.no{color:var(--warn-fg)}
.mx td.hl{background:var(--accent-bg);color:var(--accent);font-weight:600;border-radius:6px}
.mx .cw{display:flex;align-items:center;gap:8px}
.mx .cw .dot{margin:0}
.mx tfoot td{color:var(--ink);font-weight:500;box-shadow:none}
.shade{position:fixed;inset:0;background:rgb(16 16 18/.18);z-index:30;animation:fade .2s}
.sheet{position:fixed;top:12px;right:12px;bottom:12px;width:32rem;max-width:calc(100vw - 24px);background:var(--canvas);border-radius:var(--r-shell);z-index:31;
  box-shadow:var(--shadow-pop);overflow:auto;animation:slide .25s var(--ease-out)}
.sheet .det{height:auto;border:0;animation:none;overflow:visible}

/* popovers */
.pop{position:absolute;z-index:40;min-width:17rem;max-height:30rem;overflow:auto;background:var(--canvas);border-radius:var(--r-card);box-shadow:var(--shadow-pop),0 0 0 1px var(--hairline);
  padding:6px;animation:pop .16s var(--ease-out);transform-origin:top left}
.pop h6{font-size:14px;font-weight:500;color:var(--mute);padding:8px 10px 4px}
.pop label,.pop .opt{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.pop label:hover,.pop .opt:hover{background:var(--soft)}
.pop .opt.on{font-weight:500;color:var(--ink)}
.pop .opt .ck{width:16px;color:var(--ink)}
.pop label span:last-child,.pop .opt span:last-child{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums}
.pop hr{border:0;border-top:1px solid var(--hairline);margin:6px 4px}
.pop .foot{display:flex;justify-content:space-between;padding:6px 4px 2px}

/* notes under the screen */
.why{max-width:90rem;margin:14px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.why div{background:var(--canvas);border-radius:var(--r-card);padding:14px 16px;box-shadow:var(--shadow-soft)}
.why h5{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}
.why p{color:var(--body)}

/* research */
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:12px}
.res article{border:1px solid var(--hairline);border-radius:var(--r-card);padding:14px 16px}
.res h5{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px}
.res ul{padding-left:18px;color:var(--text)} .res li{margin:3px 0}
.res .tk{margin-top:8px;color:var(--accent)}
.lead{color:var(--body);max-width:58rem;margin-bottom:16px}
table.pat{border-collapse:separate;border-spacing:0;width:100%;margin:6px 0 22px}
.pat th,.pat td{text-align:left;padding:10px 12px;vertical-align:top;box-shadow:inset 0 -1px var(--hairline)}
.pat th{color:var(--mute);font-weight:400}
.pat td:first-child{color:var(--ink);font-weight:500;width:15rem}
.pat td:last-child{width:9rem}

.toast{position:fixed;left:50%;bottom:20px;z-index:50;background:var(--tooltip);color:#fff;border-radius:999px;transform:translateX(-50%);
  padding:9px 18px;animation:rise .25s var(--ease-out);box-shadow:var(--shadow-pop)}
.tray{position:fixed;left:50%;bottom:20px;z-index:45;display:flex;align-items:center;gap:12px;background:var(--canvas);border-radius:999px;transform:translateX(-50%);
  box-shadow:var(--shadow-pop),0 0 0 1px var(--hairline);padding:6px 6px 6px 18px;animation:rise .25s var(--ease-out)}
.tray b{color:var(--ink);font-weight:600}
.tray .btn{border-radius:999px}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1100px){.frame.split{grid-template-columns:minmax(0,1fr)} .frame.split .det{display:none} .why{grid-template-columns:1fr}}
@media (max-width:760px){body{padding:12px 12px 96px}.pane{padding:16px}.lenses{margin-left:0}.ph .act{margin-left:0}.search{width:100%}}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>Articles: 5 list options for a 12.480-article master</h1>
    <p>No card grid. Every option is a table that stays fast at thousands of rows. Try searching <span class="mono">kemeja linen</span> or scanning a SKU like <span class="mono" id="demoSku"></span>.</p>
  </div>
  <div class="lenses" id="lenses">
    <button class="lens on" data-v="1">1 · List + side panel</button>
    <button class="lens" data-v="2">2 · Article › colour › size</button>
    <button class="lens" data-v="3">3 · One row per SKU</button>
    <button class="lens" data-v="4">4 · Edit as sheet</button>
    <button class="lens" data-v="5">5 · Worklists + groups</button>
    <button class="lens" data-v="r">Research</button>
  </div>
</div>

<div class="pane" id="pane"></div>
<div class="why" id="why"></div>

<script>
/* ---------- icons ---------- */
const I={
  search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  scan:'<svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>',
  filter:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  cols:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>',
  views:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
  down:'<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',

  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 5 5M14 14l2-2 5 5"/></svg>',
  up:'<svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
  dl:'<svg class="i" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>',
};

/* ---------- a deterministic 12.480-article master ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20260928);
const pick=a=>a[Math.floor(R()*a.length)];
const DIVS=[{c:'MEN',l:'Menswear',w:.32},{c:'WOMEN',l:'Womenswear',w:.34},{c:'KIDS',l:'Kids',w:.14},{c:'ACC',l:'Accessories',w:.12},{c:'FOOT',l:'Footwear',w:.08}];
const DIVL=Object.fromEntries(DIVS.map(d=>[d.c,d.l]));
const TYPES={
  MEN:[['Kaos','Tops',59,149],['Kemeja','Tops',149,299],['Polo','Tops',129,219],['Celana Chino','Bottoms',199,349],['Celana Jeans','Bottoms',249,449],['Jaket Bomber','Outerwear',299,549],['Hoodie','Outerwear',219,399],['Sweater','Outerwear',199,329],['Kemeja Flanel','Tops',179,299],['Celana Pendek','Bottoms',119,199]],
  WOMEN:[['Blouse','Tops',129,259],['Dress Midi','Dresses',199,429],['Rok Plisket','Bottoms',149,259],['Kulot','Bottoms',149,249],['Tunik','Tops',159,279],['Cardigan','Outerwear',179,329],['Kaos','Tops',69,139],['Kemeja','Tops',149,279],['Gamis','Dresses',249,499],['Outer Kimono','Outerwear',169,299]],
  KIDS:[['Kaos Anak','Tops',49,99],['Setelan Anak','Sets',99,189],['Celana Anak','Bottoms',69,139],['Dress Anak','Dresses',99,179],['Hoodie Anak','Outerwear',129,219],['Piyama Anak','Sets',89,159]],
  ACC:[['Topi Baseball','Headwear',79,149],['Tas Tote','Bags',99,249],['Kaos Kaki','Socks',29,59],['Ikat Pinggang','Small leather',99,219],['Dompet','Small leather',129,299],['Scarf','Headwear',69,149],['Bucket Hat','Headwear',89,159]],
  FOOT:[['Sneakers','Footwear',349,799],['Sandal Slide','Footwear',99,199],['Loafer','Footwear',399,699],['Slip On','Footwear',249,449],['Sepatu Kanvas','Footwear',199,379]],
};
const DESC={MEN:['Oversize','Slim Fit','Linen','Basic','Stripe','Pocket','Garment Dye','Heavyweight','Boxy','Relaxed','Twill','Corduroy','Denim'],
  WOMEN:['Rayon','Linen','Basic','Ruffle','Plisket','Crinkle','Katun','Satin','Stripe','Floral','Polka','Relaxed'],

  if(S.opt==='1'&&!typing&&(e.key==='ArrowDown'||e.key==='ArrowUp')&&V&&V.list&&V.list.length){e.preventDefault();
    const L=V.list;let k=S.sel===null?-1:L.findIndex(a=>a.i===S.sel);k=Math.max(0,Math.min(L.length-1,k+(e.key==='ArrowDown'?1:-1)));S.sel=L[k].i;
    const h=getRow(),sc=V.sc,top=k*h;const st=sc.scrollTop;render();const nsc=V.sc;nsc.scrollTop=st;
    if(top<nsc.scrollTop)nsc.scrollTop=top;else if(top+h>nsc.scrollTop+nsc.clientHeight-40)nsc.scrollTop=top+h-nsc.clientHeight+40;V.draw()}
});
document.getElementById('lenses').onclick=e=>{const b=e.target.closest('.lens');if(!b)return;document.querySelectorAll('.lens').forEach(x=>x.classList.toggle('on',x===b));
  S.opt=b.dataset.v;S.reset=true;S.sel=null;if(S.opt==='5'&&S.view==='all')S.view='attention';if(S.opt!=='5'&&S.opt!=='r'&&S.view==='attention')S.view='all';render()};
{const a=ARTS[ARTS.length-37];document.getElementById('demoSku').textContent=skuCode(a,0,Math.min(1,a.sizes.length-1))}
</script>
<template id="research"><div style="padding:4px 0">
  <div class="ph"><div><h2>Research</h2><div class="sub">How ten back-offices list thousands of products, and what each option borrows.</div></div></div>
  <p class="lead">One finding runs through all of them: past a few hundred products, nobody keeps a card grid as the main list. Odoo ships kanban by default and implementers routinely switch it to the list view. Cards survive only as a merchandising browse. The client said the same about our grid.</p>
  <table class="pat">
    <thead><tr><th>Pattern</th><th>Who does it</th><th>Here</th></tr></thead>
    <tbody>
      <tr><td>Dense table as the default</td><td>Shopify, ERPNext Report view, Accurate, SAP B1, Square item library</td><td>All five</td></tr>
      <tr><td>Parent row, variants folded underneath</td><td>Shopify (product → variants), Lightspeed X-Series (family, up to 200 variants), Cin7 (product families)</td><td>Option 2</td></tr>
      <tr><td>Every variant is its own row</td><td>ERPNext (each variant is an Item), Retail Pro Prism (each size × colour is an item inside a style), Accurate, 7Soft</td><td>Option 3</td></tr>
      <tr><td>Colour × size matrix inside the article, not as the list</td><td>Retail Pro Prism styles, Odoo product matrix, Lightspeed R-Series matrices</td><td>Detail in every option</td></tr>
      <tr><td>Saved views as navigation</td><td>NetSuite saved searches (the “list” is a library of named queries), Shopify saved views</td><td>Views menu (1–4), tabs (5)</td></tr>
      <tr><td>Bulk edit as its own mode</td><td>Shopify bulk editor, Square table view, ERPNext Report view</td><td>Option 4</td></tr>
      <tr><td>Columns chosen by the user</td><td>ERPNext list settings, Shopify, Cin7, Accurate</td><td>Columns menu</td></tr>
      <tr><td>Inactive is a filter, not a separate archive</td><td>Shopify (active / draft / archived), NetSuite “show inactives”, Accurate</td><td>Status filter + Cancelled view</td></tr>
      <tr><td>Small thumbnail in the row only</td><td>Shopify, Accurate (optional)</td><td>32px in the row, 72px in the detail</td></tr>
    </tbody>
  </table>
  <div class="res">
    <article><h5>Shopify Admin</h5><ul><li>Table: checkbox, thumbnail, title, status, stock.</li><li>Lists products only; “4 variants” lives on the product page.</li><li>Search, filters and saved views are one bar.</li><li>Bulk editor is a separate grid: one row per variant, columns you pick.</li></ul><div class="tk">We keep: saved views, bulk mode. We skip: filter chips (they crowd the hub).</div></article>
    <article><h5>Lightspeed Retail</h5><ul><li>X-Series: a variant family with one parent. Children inherit and override only SKU, price and stock.</li><li>Up to 3 options (colour, size, fabric).</li><li>R-Series builds an explicit matrix per style.</li></ul><div class="tk">Matches our article → colourway → size. Option 2.</div></article>
    <article><h5>Odoo</h5><ul><li>Kanban by default, list one click away. Implementers make list the default.</li><li>A template with attribute lines (size, colour) and a separate variants list.</li><li>A product matrix popup for size × colour entry.</li></ul><div class="tk">Evidence against the grid. Group-by in option 5.</div></article>
    <article><h5>ERPNext / Frappe</h5><ul><li>List view with a filter side panel, plus a Report view: a spreadsheet you can edit in place and export.</li><li>List settings choose the columns.</li><li>Filter builder: field + operator, AND only.</li></ul><div class="tk">Report view → option 4. Each variant is an item → option 3.</div></article>
    <article><h5>NetSuite</h5><ul><li>For tens of thousands of items, the working list is a saved search.</li><li>Each saved search can be published as a list view or dashboard.</li></ul><div class="tk">Worklists as tabs with live counts. Option 5.</div></article>
    <article><h5>Cin7 Core</h5><ul><li>Product families group colour and size; every member needs its own SKU.</li><li>Columns picked from a settings gear.</li><li>Cancelling a family cascades to its variants.</li></ul><div class="tk">Same as us: cancelling an article cancels its SKUs.</div></article>
    <article><h5>Retail Pro Prism</h5><ul><li>A “style” groups items that vary by size and colour.</li><li>Each size × colour is a real inventory item.</li></ul><div class="tk">Apparel’s classic matrix. The detail panel’s colour × size table.</div></article>
    <article><h5>SAP Business One</h5><ul><li>Item master is one full-page form with tabs (purchasing, sales, inventory, planning).</li><li>Search is a “Find” mode of the same window, not a list.</li></ul><div class="tk">Full page for editing; our list stays for finding.</div></article>
    <article><h5>Square for Retail</h5><ul><li>Item library with bulk actions after ticking rows.</li><li>Variations edited in a table view (many at once) or one at a time.</li></ul><div class="tk">Bulk bar in option 4.</div></article>
    <article><h5>Accurate Online, 7Soft</h5><ul><li>Accurate: a flat table (code, name, type, unit, price, active) with configurable columns and an optional image.</li><li>Basic filters, no saved views.</li></ul><div class="tk">What the client’s team already knows. Option 3 is closest.</div></article>
  </div>
</div></template>
