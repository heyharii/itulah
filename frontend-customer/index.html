<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- The Central icon, Matte · Deep: the same picture as frontend-hub's
         mark and home-screen icons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Central" />
    <!-- A phone in a shop queue is the ordinary case for this surface, so the
         viewport is declared before anything else renders. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Cloud Hub is always light: the browser is told so explicitly rather
         than left to guess from the system, which would otherwise paint form
         controls and the address bar from a dark palette this app does not
         have. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5f6fa" />
    <title>Central Member</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
