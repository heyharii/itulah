name: POS Windows build

on:
  push:
    paths:
      - "pos-desktop/**"
      - ".github/workflows/pos-windows.yml"
  pull_request:
    paths:
      - "pos-desktop/**"
      - ".github/workflows/pos-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build and test POS for Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-desktop/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pos-desktop/src-tauri -> target

      - name: Install POS UI dependencies
        working-directory: pos-desktop/ui
        run: npm ci

      # The SDK comes before the tests: on Windows the Tauri build script checks
      # every resource in tauri.windows.conf.json, so `cargo test` cannot even
      # compile until rfid-native/ holds every DLL listed there.
      - name: Download and verify the official Chainway R3 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://chainwayeurope.com/upload/materials/chainway-support/_shared/sdk/Demo_Windwos_R3.rar'
          $archive = Join-Path $env:RUNNER_TEMP 'chainway-r3-sdk.rar'
          $extract = Join-Path $env:RUNNER_TEMP 'chainway-r3-sdk'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $archiveHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($archiveHash -ne '65fcb027a146a8e38cba5dcc2c674262e14f278c61ce4ed3999bd45bfb888ce3') {
            throw "Official Chainway SDK archive hash changed: $archiveHash"
          }

          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZip) { $sevenZip = Get-Command 7z.exe -ErrorAction Stop }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & $sevenZip.Source x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed: $LASTEXITCODE" }

          # The DLLs are not in the outer archive itself: they sit in a second
          # archive inside it, C#/API/win-UHF_LIB_<date>.rar. Only that one is
          # opened, so a copy of UHFAPI.dll from the demo or the app archive can
          # never be the one picked.
          $lib = Get-ChildItem -Path $extract -Filter 'win-UHF_LIB_*.rar' -Recurse |
            Select-Object -First 1
          if (-not $lib) { throw 'The verified Chainway SDK archive has no win-UHF_LIB archive.' }
          $libDir = Join-Path $env:RUNNER_TEMP 'chainway-r3-lib'
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          & $sevenZip.Source x $lib.FullName "-o$libDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction of $($lib.Name) failed: $LASTEXITCODE" }

          $api = Get-ChildItem -Path $libDir -Filter UHFAPI.dll -Recurse |
            Where-Object { $_.Directory.Name -ieq 'x64' } |
            Select-Object -First 1
          if (-not $api) { throw 'The verified Chainway SDK archive has no x64 UHFAPI.dll.' }
          $usb = Join-Path $api.DirectoryName 'libusb-1.0.dll'
          if (-not (Test-Path $usb)) { throw 'The verified Chainway SDK archive has no matching x64 libusb DLL.' }

          $expected = @{
            'UHFAPI.dll' = '25c044a8f0160d3365df4bb31608f645074f13cf153eaa1476bb91c42e1cdef8'
            'libusb-1.0.dll' = '5072054cb3002ae071f382ad5c2c2b0092d9451c537d0c13444c2b6f968f7251'
          }
          foreach ($name in $expected.Keys) {
            $file = if ($name -eq 'UHFAPI.dll') { $api.FullName } else { $usb }
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$name]) { throw "$name hash did not match the verified R3 SDK." }
          }

          $native = Join-Path $env:GITHUB_WORKSPACE 'pos-desktop/src-tauri/rfid-native'
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item $api.FullName (Join-Path $native 'UHFAPI.dll')
          Copy-Item $usb (Join-Path $native 'libusb-1.0.dll')

      # UHFAPI.dll imports MSVCP140, VCRUNTIME140 and VCRUNTIME140_1 (libusb
      # imports VCRUNTIME140), and a shop PC may not have the Visual C++
      # redistributable. Microsoft allows these three to be deployed app-local,
      # so they ship in rfid-native beside the SDK and rfid.rs loads them from
      # there before libusb and UHFAPI. Taken from this x64 runner's own
      # System32, and refused unless each one is an x64 image.
      - name: Ship the Visual C++ runtime beside the R3 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:GITHUB_WORKSPACE 'pos-desktop/src-tauri/rfid-native'
          $system = Join-Path $env:SystemRoot 'System32'
          foreach ($name in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            $source = Join-Path $system $name
            if (-not (Test-Path $source)) { throw "$name is not in $system on this runner." }
            $bytes = [System.IO.File]::ReadAllBytes($source)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne 0x8664) { throw "$name in $system is not an x64 image." }
            Copy-Item $source (Join-Path $native $name)
            Write-Host "$name $((Get-Item $source).VersionInfo.FileVersion)"
          }

      # The ZKTeco fingerprint scanner needs its vendor driver (libzkfp.dll,
      # its capture plug-ins and the libusb0 kernel driver), which only the
      # vendor's Inno Setup installer puts in place. It is committed beside
      # the app (ZKFinger Standard SDK 5.3.0.33, from the owner's working
      # attendance terminal), shipped as a resource, and run from Till devices
      # -> Fingerprint -> Install driver; fingerprint.rs then loads libzkfp.dll
      # from System32. Refused here unless it is that exact installer.
      - name: Verify the ZKFinger driver installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'pos-desktop/src-tauri/fingerprint-native/ZKFinger-setup.exe'
          if (-not (Test-Path $setup)) { throw 'fingerprint-native/ZKFinger-setup.exe is missing.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($hash -ne '10a420e2d7a3a7c73b5421638cc7a2a1a7d96d7bed4cc10c3ae9f43f75faf877') {
            throw "ZKFinger-setup.exe is not the verified ZKFinger SDK 5.3.0.33 installer: $hash"
          }

      # Checks that report but do not stop the run, so one build shows every
      # problem at once.
      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --manifest-path pos-desktop/src-tauri/Cargo.toml --check

      - name: Type-check the POS UI
        continue-on-error: true
        working-directory: pos-desktop/ui
        run: npm run typecheck

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --manifest-path pos-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test POS native commands
        run: cargo test --manifest-path pos-desktop/src-tauri/Cargo.toml --lib

      # No scanner on a runner, but everything short of one can be proved: the
      # vendor installer runs silently, libzkfp.dll lands in System32 and loads
      # with its imports, every export fingerprint.rs binds resolves, and the
      # SDK initialises, counts zero scanners, and builds and frees a 1:N cache.
      - name: Install the ZKFinger driver and probe libzkfp.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'pos-desktop/src-tauri/fingerprint-native/ZKFinger-setup.exe'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$env:RUNNER_TEMP\zk-install.log" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Get-Content "$env:RUNNER_TEMP\zk-install.log" -Tail 60 -ErrorAction SilentlyContinue; throw 'ZKFinger installer did not finish in 5 minutes' }
          Write-Host "installer exit code: $($p.ExitCode)"
          Get-Content "$env:RUNNER_TEMP\zk-install.log" -Tail 40 -ErrorAction SilentlyContinue
          $dll = Join-Path $env:SystemRoot 'System32\libzkfp.dll'
          if (-not (Test-Path $dll)) { throw "libzkfp.dll is not in System32 after the install" }
          Write-Host "libzkfp.dll $((Get-Item $dll).VersionInfo.FileVersion) $((Get-FileHash $dll).Hash)"
          foreach ($n in 'ZKFPCap.dll','fpslib.dll') {
            Write-Host "$n : $(Test-Path (Join-Path $env:SystemRoot "System32\$n"))"
          }

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Zk {
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibraryExW(string p, IntPtr h, uint f);
            [DllImport("kernel32", CharSet=CharSet.Ansi)] public static extern IntPtr GetProcAddress(IntPtr m, string n);
            public delegate int Int0();
            public delegate IntPtr Ptr0();
            public delegate int Free1(IntPtr h);
          }
          '@
          $lib = [Zk]::LoadLibraryExW($dll, [IntPtr]::Zero, 8)   # LOAD_WITH_ALTERED_SEARCH_PATH, as fingerprint.rs
          if ($lib -eq [IntPtr]::Zero) { throw "libzkfp.dll did not load: Win32 error $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          $want = @(
            @('ZKFPM_Init'), @('ZKFPM_Terminate'), @('ZKFPM_GetDeviceCount'), @('ZKFPM_OpenDevice'),
            @('ZKFPM_CloseDevice'), @('ZKFPM_GetParameters'), @('ZKFPM_AcquireFingerprint'),
            @('ZKFPM_DBInit','ZKFPM_CreateDBCache'), @('ZKFPM_DBFree','ZKFPM_CloseDBCache'),
            @('ZKFPM_DBAdd','ZKFPM_AddRegTemplateToDBCache'), @('ZKFPM_DBIdentify','ZKFPM_Identify'),
            @('ZKFPM_DBMatch','ZKFPM_MatchFinger'), @('ZKFPM_DBMerge','ZKFPM_GenRegTemplate')
          )
          $addr = @{}
          $missing = @()
          foreach ($names in $want) {
            $hit = $names | Where-Object { [Zk]::GetProcAddress($lib, $_) -ne [IntPtr]::Zero } | Select-Object -First 1
            if ($hit) { $addr[$names[0]] = [Zk]::GetProcAddress($lib, $hit); Write-Host "export ok: $hit" } else { $missing += $names[0] }
          }
          if ($missing) { throw "libzkfp.dll lacks: $($missing -join ', ')" }

          $init  = [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer($addr['ZKFPM_Init'], [Zk+Int0])
          $count = [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer($addr['ZKFPM_GetDeviceCount'], [Zk+Int0])
          $dbi   = [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer($addr['ZKFPM_DBInit'], [Zk+Ptr0])
          $dbf   = [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer($addr['ZKFPM_DBFree'], [Zk+Free1])
          $term  = [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer($addr['ZKFPM_Terminate'], [Zk+Int0])
          $a = $init.Invoke();  Write-Host "ZKFPM_Init -> $a"
          $c = $count.Invoke(); Write-Host "ZKFPM_GetDeviceCount -> $c (no scanner on a runner)"
          $h = $dbi.Invoke();   Write-Host "ZKFPM_DBInit -> $h"
          if ($h -eq [IntPtr]::Zero) { throw 'ZKFPM_DBInit returned no cache' }
          Write-Host "ZKFPM_DBFree -> $($dbf.Invoke($h))"
          Write-Host "ZKFPM_Terminate -> $($term.Invoke())"
          if ($a -ne 0 -and $a -ne 1) { throw "ZKFPM_Init answered $a" }

      - name: Build the Windows installer
        working-directory: pos-desktop
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --config src-tauri/tauri.windows.conf.json

      # Install the MSI as a shop would, start the till, and prove it stays
      # up with its window drawn.
      - name: Install the MSI and start the till
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $msi = Get-ChildItem pos-desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v pos-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content pos-install.log -Tail 60; throw "POS install: $($p.ExitCode)" }
          $exe = Get-ChildItem 'C:\Program Files\Central POS\*.exe', "$env:LOCALAPPDATA\Programs\Central POS\*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'Central POS is not where the installer puts it' }
          $dir = $exe.DirectoryName
          foreach ($f in 'rfid-native\UHFAPI.dll','rfid-native\libusb-1.0.dll','fingerprint-native\ZKFinger-setup.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "installed app lacks $f" }
          }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save('shots/pos-after-30s.png', [System.Drawing.Imaging.ImageFormat]::Png)
          $alive = -not $app.HasExited
          Write-Host "till still running after 30 s: $alive"
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Measure-Object | ForEach-Object { Write-Host "webview2 processes: $($_.Count)" }
          if (-not $alive) { throw "the till exited with code $($app.ExitCode)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-windows-shots-${{ github.sha }}
          path: |
            shots/
            pos-install.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: itulah-pos-windows-x64-${{ github.sha }}
          path: pos-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
