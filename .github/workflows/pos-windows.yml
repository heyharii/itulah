name: POS Windows build

on:
  push:
    paths:
      - "pos-desktop/**"
      - ".github/workflows/pos-windows.yml"
  pull_request:
    paths:
      - "pos-desktop/**"
      - ".github/workflows/pos-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build and test POS for Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-desktop/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pos-desktop/src-tauri -> target

      - name: Install POS UI dependencies
        working-directory: pos-desktop/ui
        run: npm ci

      # The SDK comes before the tests: on Windows the Tauri build script checks
      # every resource in tauri.windows.conf.json, so `cargo test` cannot even
      # compile until rfid-native/ holds every DLL listed there.
      - name: Download and verify the official Chainway R3 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://chainwayeurope.com/upload/materials/chainway-support/_shared/sdk/Demo_Windwos_R3.rar'
          $archive = Join-Path $env:RUNNER_TEMP 'chainway-r3-sdk.rar'
          $extract = Join-Path $env:RUNNER_TEMP 'chainway-r3-sdk'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $archiveHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($archiveHash -ne '65fcb027a146a8e38cba5dcc2c674262e14f278c61ce4ed3999bd45bfb888ce3') {
            throw "Official Chainway SDK archive hash changed: $archiveHash"
          }

          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZip) { $sevenZip = Get-Command 7z.exe -ErrorAction Stop }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & $sevenZip.Source x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed: $LASTEXITCODE" }

          # The DLLs are not in the outer archive itself: they sit in a second
          # archive inside it, C#/API/win-UHF_LIB_<date>.rar. Only that one is
          # opened, so a copy of UHFAPI.dll from the demo or the app archive can
          # never be the one picked.
          $lib = Get-ChildItem -Path $extract -Filter 'win-UHF_LIB_*.rar' -Recurse |
            Select-Object -First 1
          if (-not $lib) { throw 'The verified Chainway SDK archive has no win-UHF_LIB archive.' }
          $libDir = Join-Path $env:RUNNER_TEMP 'chainway-r3-lib'
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          & $sevenZip.Source x $lib.FullName "-o$libDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction of $($lib.Name) failed: $LASTEXITCODE" }

          $api = Get-ChildItem -Path $libDir -Filter UHFAPI.dll -Recurse |
            Where-Object { $_.Directory.Name -ieq 'x64' } |
            Select-Object -First 1
          if (-not $api) { throw 'The verified Chainway SDK archive has no x64 UHFAPI.dll.' }
          $usb = Join-Path $api.DirectoryName 'libusb-1.0.dll'
          if (-not (Test-Path $usb)) { throw 'The verified Chainway SDK archive has no matching x64 libusb DLL.' }

          $expected = @{
            'UHFAPI.dll' = '25c044a8f0160d3365df4bb31608f645074f13cf153eaa1476bb91c42e1cdef8'
            'libusb-1.0.dll' = '5072054cb3002ae071f382ad5c2c2b0092d9451c537d0c13444c2b6f968f7251'
          }
          foreach ($name in $expected.Keys) {
            $file = if ($name -eq 'UHFAPI.dll') { $api.FullName } else { $usb }
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$name]) { throw "$name hash did not match the verified R3 SDK." }
          }

          $native = Join-Path $env:GITHUB_WORKSPACE 'pos-desktop/src-tauri/rfid-native'
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item $api.FullName (Join-Path $native 'UHFAPI.dll')
          Copy-Item $usb (Join-Path $native 'libusb-1.0.dll')

      # UHFAPI.dll imports MSVCP140, VCRUNTIME140 and VCRUNTIME140_1 (libusb
      # imports VCRUNTIME140), and a shop PC may not have the Visual C++
      # redistributable. Microsoft allows these three to be deployed app-local,
      # so they ship in rfid-native beside the SDK and rfid.rs loads them from
      # there before libusb and UHFAPI. Taken from this x64 runner's own
      # System32, and refused unless each one is an x64 image.
      - name: Ship the Visual C++ runtime beside the R3 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:GITHUB_WORKSPACE 'pos-desktop/src-tauri/rfid-native'
          $system = Join-Path $env:SystemRoot 'System32'
          foreach ($name in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            $source = Join-Path $system $name
            if (-not (Test-Path $source)) { throw "$name is not in $system on this runner." }
            $bytes = [System.IO.File]::ReadAllBytes($source)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne 0x8664) { throw "$name in $system is not an x64 image." }
            Copy-Item $source (Join-Path $native $name)
            Write-Host "$name $((Get-Item $source).VersionInfo.FileVersion)"
          }

      # The ZKTeco fingerprint scanner needs its vendor driver (libzkfp.dll,
      # its capture plug-ins and the libusb0 kernel driver), which only the
      # vendor's Inno Setup installer puts in place. It is committed beside
      # the app (ZKFinger Standard SDK 5.3.0.33, from the owner's working
      # attendance terminal), shipped as a resource, and run from Till devices
      # -> Fingerprint -> Install driver; fingerprint.rs then loads libzkfp.dll
      # from System32. Refused here unless it is that exact installer.
      - name: Verify the ZKFinger driver installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'pos-desktop/src-tauri/fingerprint-native/ZKFinger-setup.exe'
          if (-not (Test-Path $setup)) { throw 'fingerprint-native/ZKFinger-setup.exe is missing.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($hash -ne '10a420e2d7a3a7c73b5421638cc7a2a1a7d96d7bed4cc10c3ae9f43f75faf877') {
            throw "ZKFinger-setup.exe is not the verified ZKFinger SDK 5.3.0.33 installer: $hash"
          }

      - name: Test POS native commands
        run: cargo test --manifest-path pos-desktop/src-tauri/Cargo.toml --lib

      - name: Build the Windows installer
        working-directory: pos-desktop
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --config src-tauri/tauri.windows.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: itulah-pos-windows-x64-${{ github.sha }}
          path: pos-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
