name: POS Windows build

on:
  push:
    paths:
      - "pos-desktop/**"
      - "backend/**"
      - "deploy/windows/**"
      - "deploy/edge/store.env.example"
      - ".github/workflows/pos-windows.yml"
  pull_request:
    paths:
      - "pos-desktop/**"
      - "backend/**"
      - "deploy/windows/**"
      - "deploy/edge/store.env.example"
      - ".github/workflows/pos-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build and test POS for Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-desktop/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pos-desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install POS UI dependencies
        working-directory: pos-desktop/ui
        run: npm ci

      - name: Restore the verified Chainway R3 SDK cache
        uses: actions/cache/restore@v4
        with:
          path: pos-desktop/src-tauri/rfid-native
          key: chainway-r3-sdk-windows-x64-65fcb027a146a8e38cba5dcc2c674262e14f278c61ce4ed3999bd45bfb888ce3

      - name: Download and verify the official Chainway R3 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:GITHUB_WORKSPACE 'pos-desktop/src-tauri/rfid-native'
          $apiPath = Join-Path $native 'UHFAPI.dll'
          $usbPath = Join-Path $native 'libusb-1.0.dll'
          if ((Test-Path $apiPath) -and (Test-Path $usbPath)) {
            $apiHash = (Get-FileHash -Algorithm SHA256 $apiPath).Hash.ToLowerInvariant()
            $usbHash = (Get-FileHash -Algorithm SHA256 $usbPath).Hash.ToLowerInvariant()
            if (($apiHash -eq '25c044a8f0160d3365df4bb31608f645074f13cf153eaa1476bb91c42e1cdef8') -and
                ($usbHash -eq '5072054cb3002ae071f382ad5c2c2b0092d9451c537d0c13444c2b6f968f7251')) {
              Write-Output 'Using Chainway R3 SDK DLLs previously verified against the official archive.'
              return
            }
          }
          $url = 'https://chainwayeurope.com/upload/materials/chainway-support/_shared/sdk/Demo_Windwos_R3.rar'
          $archive = Join-Path $env:RUNNER_TEMP 'chainway-r3-sdk.rar'
          $extract = Join-Path $env:RUNNER_TEMP 'chainway-r3-sdk'
          $downloaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 90
              $downloaded = $true
              break
            } catch {
              Remove-Item $archive -Force -ErrorAction SilentlyContinue
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $downloaded) { throw 'Could not download the official Chainway SDK after five attempts.' }
          $archiveHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($archiveHash -ne '65fcb027a146a8e38cba5dcc2c674262e14f278c61ce4ed3999bd45bfb888ce3') {
            throw "Official Chainway SDK archive hash changed: $archiveHash"
          }

          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZip) { $sevenZip = Get-Command 7z.exe -ErrorAction Stop }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & $sevenZip.Source x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed: $LASTEXITCODE" }

          $apiArchive = Get-ChildItem -Path $extract -Filter 'win-UHF_LIB_20250829.rar' -Recurse -File |
            Select-Object -First 1
          if (-not $apiArchive) { throw 'The official Chainway package has no R3 Windows API archive.' }
          $apiArchiveHash = (Get-FileHash -Algorithm SHA256 $apiArchive.FullName).Hash.ToLowerInvariant()
          if ($apiArchiveHash -ne '6026ea51bd3f69aee5880f83f4f5b7d1cd0198905fde8fb4dc59e686bda3e4f3') {
            throw "Chainway API archive hash changed: $apiArchiveHash"
          }
          $apiExtract = Join-Path $env:RUNNER_TEMP 'chainway-r3-api'
          New-Item -ItemType Directory -Force -Path $apiExtract | Out-Null
          & $sevenZip.Source x $apiArchive.FullName "-o$apiExtract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Chainway API extraction failed: $LASTEXITCODE" }

          $apiCandidates = Get-ChildItem -Path $apiExtract -Filter UHFAPI.dll -Recurse -File
          $api = $apiCandidates |
            Where-Object { (Get-FileHash -Algorithm SHA256 $_.FullName).Hash -ieq '25c044a8f0160d3365df4bb31608f645074f13cf153eaa1476bb91c42e1cdef8' } |
            Select-Object -First 1
          if (-not $api) {
            $found = ($apiCandidates | ForEach-Object { $_.FullName }) -join "`n"
            throw "The verified Chainway SDK archive has no expected x64 UHFAPI.dll. Candidates: $found"
          }
          $usb = Join-Path $api.DirectoryName 'libusb-1.0.dll'
          if (-not (Test-Path $usb)) { throw 'The verified Chainway SDK archive has no matching x64 libusb DLL.' }

          $expected = @{
            'UHFAPI.dll' = '25c044a8f0160d3365df4bb31608f645074f13cf153eaa1476bb91c42e1cdef8'
            'libusb-1.0.dll' = '5072054cb3002ae071f382ad5c2c2b0092d9451c537d0c13444c2b6f968f7251'
          }
          foreach ($name in $expected.Keys) {
            $file = if ($name -eq 'UHFAPI.dll') { $api.FullName } else { $usb }
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$name]) { throw "$name hash did not match the verified R3 SDK." }
          }

          $native = Join-Path $env:GITHUB_WORKSPACE 'pos-desktop/src-tauri/rfid-native'
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item $api.FullName (Join-Path $native 'UHFAPI.dll')
          Copy-Item $usb (Join-Path $native 'libusb-1.0.dll')

      - name: Cache the verified Chainway R3 SDK
        uses: actions/cache/save@v4
        with:
          path: pos-desktop/src-tauri/rfid-native
          key: chainway-r3-sdk-windows-x64-65fcb027a146a8e38cba5dcc2c674262e14f278c61ce4ed3999bd45bfb888ce3

      - name: Test POS native commands
        run: cargo test --manifest-path pos-desktop/src-tauri/Cargo.toml --lib

      - name: Build Store Edge for Windows x64
        run: cargo build --release --manifest-path backend/Cargo.toml --bin store

      - name: Package Store Edge for Windows deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'itulah-store-edge-windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'backend/target/release/store.exe' $package
          Copy-Item 'deploy/windows/install-store-edge.ps1' $package
          Copy-Item 'deploy/windows/run-store-edge.ps1' $package
          Copy-Item 'deploy/windows/README.md' $package
          Copy-Item 'deploy/edge/store.env.example' (Join-Path $package 'store.env.example')
          $zip = Join-Path $env:RUNNER_TEMP 'itulah-store-edge-windows-x64.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip -Force
          Write-Output "Packaged $zip"

      - name: Build the Windows installer
        working-directory: pos-desktop
        run: npm exec --yes --package=@tauri-apps/cli@2.11.5 -- tauri build --config src-tauri/tauri.windows.conf.json

      - name: Attach the MSI to a draft GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -Path 'pos-desktop/src-tauri/target/release/bundle' -Filter '*.msi' -Recurse -File |
            Select-Object -First 1
          if (-not $msi) { throw 'The Windows build produced no MSI installer.' }
          $store = Join-Path $env:RUNNER_TEMP 'itulah-store-edge-windows-x64.zip'
          if (-not (Test-Path $store)) { throw 'The Store Edge Windows package is missing.' }
          $tag = "pos-windows-$env:GITHUB_SHA"
          gh release create $tag $msi.FullName $store --draft --title "Itulah POS and Store Edge Windows x64 $env:GITHUB_SHA" --notes 'Windows POS MSI and Store Edge package built by GitHub Actions. Draft assets for controlled deployment.'
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the MSI to draft release $tag." }
