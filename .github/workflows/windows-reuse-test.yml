name: Windows reuse test

# A PC that is not new: first another program holds port 8082 and the store
# server's installer must say who and stop cleanly; then the server installs
# and joins a store, head office disconnects it in Central (by hand, while
# this waits), and the installer window must offer "Start as a new store",
# move the old data aside and wait for a new install code. Screenshots are
# the `shots` artifact.
#
# Started by pushing `.github/windows-reuse-test.json`:
#   { "msi_url": "https://storage.googleapis.com/…/central-store-server-x.y.z-x64.msi" }
# The install code is the `ENROLL_CODE` secret.

on:
  push:
    paths: [".github/windows-reuse-test.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse:
    name: Port taken, then start over
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Port taken, install, disconnect, start over
        shell: pwsh
        env:
          ENROLL_CODE: ${{ secrets.ENROLL_CODE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content -Raw .github/windows-reuse-test.json | ConvertFrom-Json
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public class U { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
           [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
           [DllImport("user32.dll")] public static extern void mouse_event(int f,int x,int y,int d,int e); }
          '@
          New-Item -ItemType Directory -Force shots | Out-Null
          $script:n = 0
          function Shot([string]$name) {
            $script:n++
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save(("shots/{0:d2}-{1}.png" -f $script:n, $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $all = [System.Windows.Automation.Condition]::TrueCondition
          # An element named like $pattern, under the windows of $process — or
          # under every top-level window when $process is '*'.
          function Find([string]$process, [string]$pattern, [int]$seconds = 60) {
            $until = (Get-Date).AddSeconds($seconds)
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            while ((Get-Date) -lt $until) {
              $windows = if ($process -eq '*') { $root.FindAll([System.Windows.Automation.TreeScope]::Children, $all) } else {
                Get-Process $process -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 |
                  ForEach-Object { [System.Windows.Automation.AutomationElement]::FromHandle($_.MainWindowHandle) } }
              foreach ($w in $windows) {
                if ($w.Current.Name -like $pattern) { return $w }
                foreach ($e in $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, $all)) {
                  if ($e.Current.Name -like $pattern) { return $e }
                }
              }
              Start-Sleep -Milliseconds 800
            }
            Shot ("missing-" + ($pattern -replace '\W', '-'))
            throw "Never saw '$pattern' in $process"
          }
          function Click($e) {
            $r = $e.Current.BoundingRectangle
            [U]::SetCursorPos([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2)); Start-Sleep -Milliseconds 150
            [U]::mouse_event(2,0,0,0,0); [U]::mouse_event(4,0,0,0,0); Start-Sleep -Milliseconds 700
          }
          function Step([string]$title) { Write-Host "::group::$title"; "- $title" >> $env:GITHUB_STEP_SUMMARY }

          Invoke-WebRequest $cfg.msi_url -OutFile server.msi

          Step 'Another program holds 8082: the installer names it and stops'
          $squatter = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, 8082)
          $squatter.Start()
          $msi = Start-Process msiexec -ArgumentList '/i', "$PWD\server.msi", '/qn', '/l*v', "$PWD\shots\port-taken.log" -PassThru
          $box = Find '*' '*Port 8082 is in use by*' 180
          Shot 'port-taken-message'
          "  - message: $($box.Current.Name)" >> $env:GITHUB_STEP_SUMMARY
          # Its own OK: focus the message itself, then Enter.
          Click $box
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          $msi.WaitForExit()
          "  - msiexec exit code $($msi.ExitCode); service: $([bool](Get-Service ItulahStore -ErrorAction SilentlyContinue))" >> $env:GITHUB_STEP_SUMMARY
          if ($msi.ExitCode -eq 0) { throw 'The install went ahead on a taken port' }
          $squatter.Stop()

          Step 'Install and join the store'
          Start-Process msiexec -ArgumentList '/i', "$PWD\server.msi", '/l*v', "$PWD\shots\install.log" -Wait
          Click (Find 'msedge' 'Continue' 180)
          Find 'msedge' 'Connect this PC to Central' 30 | Out-Null
          Start-Sleep 2
          [System.Windows.Forms.SendKeys]::SendWait($env:ENROLL_CODE)
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Find 'msedge' '*server is ready' 300 | Out-Null
          Shot 'ready'

          Step 'Head office disconnects this server in Central; the window offers a new start'
          Find 'msedge' 'This PC was *' 1500 | Out-Null
          Shot 'refused'
          Click (Find 'msedge' 'Start as a new store' 30)
          Start-Sleep 3
          Shot 'windows-asks'
          try { Click (Find 'msedge' 'Open' 30) } catch { Write-Host 'No protocol prompt' }
          Find 'msedge' 'Check this PC' 180 | Out-Null
          Start-Sleep 3
          Shot 'check-this-pc-again'
          Get-ChildItem "$env:ProgramData\itulah" | Select-Object Name | Out-String | Write-Host
          if (-not (Get-ChildItem "$env:ProgramData\itulah" -Filter 'store.old-*')) { throw 'The old data was not kept' }
          "  - old data kept: $((Get-ChildItem "$env:ProgramData\itulah" -Filter 'store.old-*').Name)" >> $env:GITHUB_STEP_SUMMARY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
