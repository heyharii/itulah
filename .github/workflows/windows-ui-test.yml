name: Windows UI test

# A real Windows machine without owning one: install the store server MSI with
# an install code, let it enrol with a Central, open the store app, install
# Central POS beside it, and save screenshots of what a shop would see. Run by
# hand with the runs that built the MSIs and a fresh install code (good for
# one hour, once).

on:
  # A push of the inputs file runs it too: a workflow_dispatch workflow can
  # only be started by hand once it is on the default branch.
  push:
    paths: [".github/windows-ui-test.json"]
  workflow_dispatch:
    inputs:
      store_run_id:
        description: "Run of store-server.yml that built the MSI"
        required: true
      pos_run_id:
        description: "Run of pos-windows.yml that built Central POS"
        required: true
      cloud_url:
        description: "The Central the server enrols with"
        required: true
      enroll_code:
        description: "Install code from Central > Stores > the store > Server"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  ui:
    name: Install, enrol and look
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Read the inputs
        id: in
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $j = Get-Content -Raw .github/windows-ui-test.json | ConvertFrom-Json
          } else {
            $j = @{ store_run_id = '${{ inputs.store_run_id }}'; pos_run_id = '${{ inputs.pos_run_id }}'; cloud_url = '${{ inputs.cloud_url }}'; enroll_code = '${{ inputs.enroll_code }}' }
          }
          "store_run_id=$($j.store_run_id)" >> $env:GITHUB_OUTPUT
          "pos_run_id=$($j.pos_run_id)" >> $env:GITHUB_OUTPUT
          "cloud_url=$($j.cloud_url)" >> $env:GITHUB_OUTPUT
          "enroll_code=$($j.enroll_code)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: msi/store
          run-id: ${{ steps.in.outputs.store_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: itulah-pos-windows-x64-*
          merge-multiple: true
          path: msi/pos
          run-id: ${{ steps.in.outputs.pos_run_id }}
          github-token: ${{ github.token }}
      - name: Install, enrol and take screenshots
        shell: pwsh
        env:
          CLOUD_URL: ${{ steps.in.outputs.cloud_url }}
          ENROLL_CODE: ${{ steps.in.outputs.enroll_code }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot([string]$name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "screenshot $name ($($b.Width)x$($b.Height))"
          }
          function Answer([string]$url) {
            try { (Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 5).StatusCode } catch { 0 }
          }

          $store = Get-ChildItem msi/store/*.msi | Select-Object -First 1
          Write-Host "store server: $($store.Name)"
          $p = Start-Process msiexec -ArgumentList "/i `"$($store.FullName)`" /qn /l*v store-install.log ENROLL_CODE=$env:ENROLL_CODE CLOUD_URL=$env:CLOUD_URL" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content store-install.log -Tail 60; throw "store install: $($p.ExitCode)" }

          # Enrolled and serving the shop once /api/v1/health answers.
          $ready = $false
          foreach ($i in 1..60) {
            if ((Answer 'http://127.0.0.1:8082/api/v1/health') -eq 200) { $ready = $true; break }
            Start-Sleep -Seconds 5
          }
          Write-Host "enrolled and serving: $ready"
          & "C:\Program Files\itulah Store\store.exe" diagnose
          $global:LASTEXITCODE = 0

          Start-Process msedge -ArgumentList '--no-first-run','--no-default-browser-check','--start-maximized','http://localhost:8082/'
          Start-Sleep -Seconds 15
          Shot '1-store-app'

          $pos = Get-ChildItem msi/pos/*.msi | Select-Object -First 1
          Write-Host "Central POS: $($pos.Name)"
          $p = Start-Process msiexec -ArgumentList "/i `"$($pos.FullName)`" /qn /l*v pos-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content pos-install.log -Tail 60; throw "POS install: $($p.ExitCode)" }
          $exe = Get-ChildItem 'C:\Program Files\Central POS\*.exe', "$env:LOCALAPPDATA\Programs\Central POS\*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          Write-Host "POS executable: $exe"
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process $exe.FullName
          Start-Sleep -Seconds 20
          Shot '2-pos-first-screen'
          Start-Sleep -Seconds 20
          Shot '3-pos-after-40s'
          Get-ChildItem "$env:ProgramData\itulah\store\logs" -ErrorAction SilentlyContinue | Copy-Item -Destination . -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-shots
          path: |
            shots/
            *.log
