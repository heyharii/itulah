name: Windows client test

# A second Windows PC we do not own: a clean runner installs Central POS and
# Central Store from the public bucket, as a shop would, and joins a store
# server running on another machine — riza-1, reached through a temporary
# tunnel (or any address the runner can reach). Head
# office approves the POS in Central while this waits. Screenshots of every
# step are kept as the `shots` artifact.
#
# Started by pushing `.github/windows-client-test.json`:
#   { "server_url": "https://<tunnel>.trycloudflare.com:443" }

on:
  push:
    paths: [".github/windows-client-test.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Install, join, open
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install from the bucket and join
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = (Get-Content -Raw .github/windows-client-test.json | ConvertFrom-Json).server_url
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public class U { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
           [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
           [DllImport("user32.dll")] public static extern void mouse_event(int f,int x,int y,int d,int e); }
          '@
          New-Item -ItemType Directory -Force shots | Out-Null
          $n = 0
          function Shot([string]$name) {
            $script:n++
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save(("shots/{0:d2}-{1}.png" -f $script:n, $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          # An element of the app's window by the words a person reads, waited for.
          function Find([string]$process, [string]$name, [int]$seconds = 60) {
            $until = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $until) {
              $p = Get-Process $process -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | Select-Object -First 1
              if ($p) {
                [U]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
                $w = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
                $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
                $e = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
                if ($e) { return $e }
              }
              Start-Sleep -Milliseconds 700
            }
            Shot "missing-$($name -replace '\W','-')"
            throw "Never saw '$name' in $process"
          }
          function Click($e) {
            $r = $e.Current.BoundingRectangle
            [U]::SetCursorPos([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2)); Start-Sleep -Milliseconds 150
            [U]::mouse_event(2,0,0,0,0); [U]::mouse_event(4,0,0,0,0); Start-Sleep -Milliseconds 600
          }
          function TypeInto($e, [string]$text) { Click $e; [System.Windows.Forms.SendKeys]::SendWait($text); Start-Sleep -Milliseconds 400 }

          Write-Host "Server: $server"
          Invoke-WebRequest "$server/api/v1/node/identity" -UseBasicParsing | Select-Object -Expand Content

          $bucket = 'https://storage.googleapis.com/itulah-central-desktop'
          Invoke-WebRequest "$bucket/pos/Central-POS-setup.exe" -OutFile pos-setup.exe
          Invoke-WebRequest "$bucket/store-app/Central-Store-setup.exe" -OutFile store-setup.exe
          Start-Process .\pos-setup.exe -ArgumentList '/S' -Wait
          Start-Process .\store-setup.exe -ArgumentList '/S' -Wait

          # Central POS, never joined: the door offers joining; the address is
          # typed because this runner shares no LAN with the server.
          Start-Process "$env:LOCALAPPDATA\Central POS\pos-desktop.exe"
          Click (Find 'pos-desktop' 'Gabungkan kasir ini ke server toko' 90)
          Shot 'pos-find'
          TypeInto (Find 'pos-desktop' 'Atau ketik alamat server') $server
          Click (Find 'pos-desktop' 'Periksa alamat')
          Click (Find 'pos-desktop' 'Minta bergabung' 30)
          Start-Sleep 3
          Shot 'pos-waiting-for-head-office'
          # Head office approves in Central; this waits up to 20 minutes.
          Find 'pos-desktop' 'POS ini sudah tergabung' 1200 | Out-Null
          Shot 'pos-joined'
          Click (Find 'pos-desktop' 'Selesai')
          Start-Sleep 4
          Shot 'pos-door'

          # Central Store: nothing on this PC or its LAN, so it says so and
          # takes the address once; then the store app's sign-in.
          Start-Process "$env:LOCALAPPDATA\Central Store\store-desktop.exe"
          TypeInto (Find 'store-desktop' 'Store server address' 60) $server
          Click (Find 'store-desktop' 'Open')
          Start-Sleep 8
          Shot 'store-app'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
