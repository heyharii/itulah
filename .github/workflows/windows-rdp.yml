name: Windows RDP session

# A Windows machine to look at and click through, without owning one: the
# store server enrols with a Central, Central POS is installed beside it, and
# the desktop is reachable over RDP through a Cloudflare quick tunnel for as
# long as `minutes` says (a GitHub-hosted job ends at 6 hours) or until the run
# is cancelled. The tunnel's address is uploaded as the `rdp-host` artifact;
# connect with `cloudflared access rdp --hostname <it> --url rdp://localhost:3390`
# and RDP to localhost:3390 as runneradmin (password: WINTEST_RDP_PASSWORD).

on:
  push:
    paths: [".github/windows-rdp.json"]

permissions:
  contents: read
  actions: read

jobs:
  rdp:
    name: Windows desktop over RDP
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Read the inputs
        id: in
        shell: pwsh
        run: |
          $j = Get-Content -Raw .github/windows-rdp.json | ConvertFrom-Json
          foreach ($k in 'store_run_id','pos_run_id','cloud_url','enroll_code','minutes') { "$k=$($j.$k)" >> $env:GITHUB_OUTPUT }
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: msi/store
          run-id: ${{ steps.in.outputs.store_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: itulah-pos-windows-x64-*
          merge-multiple: true
          path: msi/pos
          run-id: ${{ steps.in.outputs.pos_run_id }}
          github-token: ${{ github.token }}
      - name: Install the store server and Central POS
        shell: pwsh
        env:
          CLOUD_URL: ${{ steps.in.outputs.cloud_url }}
          ENROLL_CODE: ${{ steps.in.outputs.enroll_code }}
        run: |
          $ErrorActionPreference = 'Stop'
          $store = Get-ChildItem msi/store/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($store.FullName)`" /qn /l*v store-install.log ENROLL_CODE=$env:ENROLL_CODE CLOUD_URL=$env:CLOUD_URL" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "store install: $($p.ExitCode)" }
          $pos = Get-ChildItem msi/pos/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($pos.FullName)`" /qn /l*v pos-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "POS install: $($p.ExitCode)" }
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8082/api/v1/health -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { break } } catch {}
            Start-Sleep -Seconds 5
          }
          & "C:\Program Files\itulah Store\store.exe" diagnose
          $global:LASTEXITCODE = 0
          # Shortcuts on the desktop for whoever connects.
          $desk = [Environment]::GetFolderPath('CommonDesktopDirectory')
          Set-Content "$desk\Store app.url" "[InternetShortcut]`r`nURL=http://localhost:8082/"
      - name: Open RDP for runneradmin
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.WINTEST_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          net user runneradmin "$env:RDP_PASSWORD" | Out-Null
          Restart-Service TermService -Force
      - name: Start the tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
          Start-Process .\cloudflared.exe -ArgumentList 'tunnel','--no-autoupdate','--url','rdp://localhost:3389' -RedirectStandardError tunnel.log -WindowStyle Hidden
          $host_ = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            $m = Select-String -Path tunnel.log -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($m) { $host_ = ($m.Matches[0].Value -replace '^https://', ''); break }
          }
          if (-not $host_) { Get-Content tunnel.log -Tail 30; throw "no tunnel address" }
          New-Item -ItemType Directory -Force rdp | Out-Null
          Set-Content rdp/host.txt $host_
          Write-Host "tunnel ready"
      - uses: actions/upload-artifact@v4
        with:
          name: rdp-host
          path: rdp/host.txt
      - name: Stay up
        shell: pwsh
        run: |
          $minutes = [int]'${{ steps.in.outputs.minutes }}'
          Write-Host "staying up for $minutes minutes (cancel the run to end sooner)"
          Start-Sleep -Seconds ($minutes * 60)
