name: Store server packages

# The store server a shop installs: a Linux tarball with its installer and a
# Windows MSI. Built on every change to the node or its packaging, published
# as workflow artifacts; a `store-v*` tag is a release. See
# STORE-SERVER-PLAN.md §3.

on:
  push:
    # Branches as well as tags: with only a tag filter, GitHub would skip
    # every branch push, and the packages would first be built on release day.
    branches: ["**"]
    tags: ["store-v*"]
    paths:
      - "backend/src/edge/**"
      - "backend/src/sync/**"
      - "backend/src/bin/store.rs"
      - "backend/Cargo.toml"
      - "deploy/edge/**"
      - "deploy/windows/**"
      - "frontend-store-new/**"
      - ".github/workflows/store-server.yml"
  workflow_dispatch:
    inputs:
      cloud_url:
        description: "Head office address baked into the node and the MSI (nobody types it)"
        required: false

permissions:
  contents: read

env:
  ITULAH_DEFAULT_CLOUD_URL: ${{ inputs.cloud_url || vars.ITULAH_CLOUD_URL }}
  # The public half of the release key (deploy/release/sign-release.sh pubkey).
  # Without it the built node accepts no updates — safe, but not updatable.
  ITULAH_RELEASE_PUBLIC_KEY: ${{ vars.ITULAH_RELEASE_PUBLIC_KEY }}

jobs:
  web:
    name: Shop web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-store-new/package-lock.json
      - working-directory: frontend-store-new
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: frontend-store-new/dist

  linux:
    name: Linux x64 tarball
    needs: web
    runs-on: ubuntu-22.04 # the oldest glibc we promise to run on
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      # Every build its own version, so a newer MSI always upgrades an older
      # one (MajorUpgrade replaces only a LOWER version) and `store --version`
      # says the same: the tag's on a release (store-v1.2.3 → 1.2.3), else
      # Cargo.toml's major.minor and this workflow's run number. Bump
      # Cargo.toml's minor along with a release tag, or later branch builds
      # read as older than the release.
      - name: Stamp the version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/store-v* ]]; then
            version="${GITHUB_REF_NAME#store-v}"
          else
            base="$(sed -nE 's/^version = "([0-9]+\.[0-9]+)\.[0-9]+"$/\1/p' backend/Cargo.toml | head -n 1)"
            version="$base.$GITHUB_RUN_NUMBER"
          fi
          [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,5}$ ]] || { echo "not a version an MSI can carry: $version" >&2; exit 1; }
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$version\"/" backend/Cargo.toml
          echo "version $version"
      - name: Test the node's unattended parts
        working-directory: backend
        run: cargo test --lib -- edge::node edge::enrolment edge::diagnose edge::removal sync::enrolment sync::node_ops
      - name: Build
        working-directory: backend
        run: cargo build --release --bin store
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: package/web
      - name: Package
        run: |
          set -euo pipefail
          version="$(backend/target/release/store --version | awk '{print $2}')"
          cp backend/target/release/store package/
          cp deploy/edge/store-edge.service deploy/edge/install-store.sh \
             deploy/edge/central-status.sh deploy/edge/nftables-store-lan.conf package/
          chmod +x package/install-store.sh package/central-status.sh package/store
          name="itulah-store-${version}-linux-x64"
          mv package "$name"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: itulah-store-*-linux-x64.tar.gz*

  windows:
    name: Windows x64 MSI
    needs: web
    runs-on: windows-2022
    env:
      # "true" only when the bucket's service-account key is set as a
      # repository secret (the key itself stays out of the job's environment);
      # the publish steps below run only then.
      HAVE_DOWNLOADS_KEY: ${{ secrets.CENTRAL_DOWNLOADS_GCP_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      # The same rule as the Linux job's step of the same name.
      - name: Stamp the version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -like 'refs/tags/store-v*') {
            $version = $env:GITHUB_REF_NAME -replace '^store-v', ''
          } else {
            $base = (Select-String -Path backend/Cargo.toml -Pattern '^version = "(\d+\.\d+)\.\d+"$' | Select-Object -First 1).Matches[0].Groups[1].Value
            $version = "$base.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d{1,3}\.\d{1,3}\.\d{1,5}$') { throw "not a version an MSI can carry: $version" }
          $toml = Get-Content -Raw backend/Cargo.toml
          $toml = ([regex]'(?m)^version = "[^"]+"').Replace($toml, "version = ""$version""", 1)
          [System.IO.File]::WriteAllText("$PWD/backend/Cargo.toml", $toml)
          Write-Host "version $version"
      - name: Test the node's unattended parts
        working-directory: backend
        run: cargo test --lib -- edge::node edge::enrolment edge::diagnose edge::removal sync::enrolment sync::node_ops
      - name: Build
        working-directory: backend
        run: cargo build --release --bin store
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: bin/web
      - name: Build the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item backend/target/release/store.exe bin/
          $version = ((& bin/store.exe --version) -split ' ')[1]
          # The tray script ships as source; refuse one that does not parse.
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\deploy\windows\store-tray.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; throw "store-tray.ps1 does not parse" }
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $msi = "central-store-server-$version-x64.msi"
          $defines = @("-d", "Version=$version", "-d", "BinDir=$PWD\bin", "-d", "TrayScript=$PWD\deploy\windows\store-tray.ps1")
          # Central's address, the same one cargo baked into store.exe: it is
          # the installer's default for CLOUD_URL, so nobody types it.
          if ($env:ITULAH_DEFAULT_CLOUD_URL) { $defines += @("-d", "CloudUrl=$env:ITULAH_DEFAULT_CLOUD_URL") }
          wix build deploy/windows/store.wxs -arch x64 -ext WixToolset.Util.wixext -ext WixToolset.UI.wixext @defines -o $msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed: $LASTEXITCODE" }
          (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant() | Out-File -Encoding ascii "$msi.sha256"
      # Unsigned until a signing identity exists (STORE-SERVER-PLAN §10.3).
      # An unsigned MSI installs, but SmartScreen warns "unknown publisher".
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem central-store-server-*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; throw "install failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 10
          $svc = Get-Service ItulahStore
          if ($svc.Status -ne 'Running') { throw "service is $($svc.Status)" }
          # Not enrolled yet, so the setup page answers on loopback.
          $page = Invoke-WebRequest http://127.0.0.1:8082/setup -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw "setup page answered $($page.StatusCode)" }
          & "C:\Program Files\itulah Store\store.exe" diagnose
          # A connected server goes only with head office's release
          # (edge/removal.rs): the uninstall stops, nothing changed.
          $data = "$env:ProgramData\itulah\store"
          Set-Content -Encoding ascii -Path "$data\node.env" -Value "INVENTORY_SITE_ID=smoke"
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn /l*v refused.log" -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw "a connected server was uninstalled without head office's release" }
          if ((Get-Service ItulahStore).Status -ne 'Running') { Get-Content refused.log -Tail 60; throw "the refused uninstall left the service $((Get-Service ItulahStore).Status)" }
          if (-not (Test-Path "$data\node.env")) { throw "the refused uninstall touched the data" }
          # Released (what Prepare for removal writes on the node): it goes.
          $now = (Get-Date).ToUniversalTime()
          @{ action_id = $null; reason = "smoke test"; released_at = $now.ToString("o"); until = $now.AddHours(1).ToString("o") } |
            ConvertTo-Json | Set-Content -Encoding ascii "$data\removal-release.json"
          & "C:\Program Files\itulah Store\store.exe" can-uninstall
          if ($LASTEXITCODE -ne 0) { throw "can-uninstall refused a released server: $LASTEXITCODE" }
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 80; throw "uninstall failed: $($p.ExitCode)" }
          # Nothing was unsent, so no copy is kept, and the data went with the program.
          if (Test-Path $data) { throw "uninstall left the shop's data on the PC" }
          if (Test-Path "$env:ProgramData\itulah\backups") { throw "a copy was kept although nothing was unsent" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: central-store-server-*-x64.msi*
      # Release only: a store-v* tag, and only when the bucket's key is set.
      # Mirrors frontend-hub/desktop/scripts/publish.sh: the file under its
      # version, then the feed (latest.json) that the Server page in Central
      # reads, never cached.
      - name: Publish to gs://itulah-central-desktop/store-server/
        if: ${{ startsWith(github.ref, 'refs/tags/store-v') && env.HAVE_DOWNLOADS_KEY == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CENTRAL_DOWNLOADS_GCP_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ startsWith(github.ref, 'refs/tags/store-v') && env.HAVE_DOWNLOADS_KEY == 'true' }}
      - name: Upload the MSI and latest.json
        if: ${{ startsWith(github.ref, 'refs/tags/store-v') && env.HAVE_DOWNLOADS_KEY == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem central-store-server-*-x64.msi | Select-Object -First 1
          $version = $msi.Name -replace '^central-store-server-(.+)-x64\.msi$', '$1'
          $sha256 = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLowerInvariant()
          $bucket = 'gs://itulah-central-desktop/store-server'
          $url = "https://storage.googleapis.com/itulah-central-desktop/store-server/$version/$($msi.Name)"
          gcloud storage cp $msi.FullName "$bucket/$version/$($msi.Name)"
          if ($LASTEXITCODE -ne 0) { throw "upload failed: $LASTEXITCODE" }
          # The same file under a stable name: the hub's Download button points at it.
          gcloud storage cp --cache-control=no-cache $msi.FullName "$bucket/latest.msi"
          if ($LASTEXITCODE -ne 0) { throw "latest.msi upload failed: $LASTEXITCODE" }
          @{ version = $version; url = $url; sha256 = $sha256 } | ConvertTo-Json | Set-Content -Encoding utf8 latest.json
          gcloud storage cp --cache-control=no-cache --content-type=application/json latest.json "$bucket/latest.json"
          if ($LASTEXITCODE -ne 0) { throw "feed upload failed: $LASTEXITCODE" }
          Write-Host "published $version: $url"
