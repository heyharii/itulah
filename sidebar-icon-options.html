<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sidebar Icons</title>
<style>
@font-face{font-family:Inter;src:url('/frontend-hub/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--ink:#1d1d1f;--body:#3a3a3c;--mute:#6e6e73;--line:#ececf0;--blue:#2563eb;--blue-bg:#eaf1ff;--red:#d70015;
 --stone:#e9e9ed;--panel:#f5f5f7;--side-ink:#636366;--side-mute:#8e8e93;--hover:rgb(0 0 0 / 5%);--edge:rgb(0 0 0 / 5%);
 --ring:0 0 0 1px rgb(0 0 0 / 5%),0 2px 8px rgb(0 0 0 / 4%),0 24px 72px rgb(0 0 0 / 8%);
 --pict:#3d3d40}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--stone);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{flex:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* options strip */
.opts{position:fixed;top:14px;right:18px;z-index:5;display:flex;gap:4px;padding:4px;border-radius:12px;background:#fff;box-shadow:var(--ring)}
.opts button{height:34px;padding:0 14px;border-radius:8px;color:var(--mute);font-weight:500;white-space:nowrap}
.opts button[aria-pressed=true]{background:var(--ink);color:#fff}

/* shell */
.shell{display:flex;height:100vh}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0;color:var(--side-ink)}
.logo{width:32px;height:32px;border-radius:9px;background:#2f63d8;color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.ic{position:relative;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;transition:background-color .15s ease,box-shadow .15s ease,color .15s ease}
.ic:not(.on):hover{background:var(--hover)}
.ic .lbl{display:none}
.ic .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--stone)}
.rail .end{margin-top:auto}
.panel{width:216px;flex:none;display:flex;flex-direction:column;padding:16px 10px;margin:12px 12px 12px 0;border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px var(--edge),0 2px 6px rgb(0 0 0 / 4%)}
.panel h2{margin:4px 10px 14px;font-size:15px;font-weight:650}
.item{display:flex;align-items:center;height:34px;padding:0 10px;border-radius:8px;color:var(--side-ink)}
.item.on{background:#fff;color:var(--ink);font-weight:550;box-shadow:0 0 0 1px rgb(0 0 0 / 6%),0 1px 3px rgb(0 0 0 / 6%)}
.page{flex:1;min-width:0;background:#fff;margin:12px 12px 12px 0;border-radius:16px;box-shadow:var(--ring);overflow:auto;padding:26px 32px}
h1{margin:0 0 6px;font-size:17px;font-weight:650}
.say{color:var(--mute);margin:0 0 22px}

/* the set at full size, on the page */
.sheet{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;max-width:760px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 12px;border-radius:12px;background:#fafafa;box-shadow:inset 0 0 0 1px var(--line)}
.cell span{color:var(--body)}

/* ── NOW: the hub's line icons (lucide, 1.7) ── */
[data-o="now"] .p{display:none}
[data-o="now"] .ic svg.n{width:20px;height:20px;stroke-width:1.7}
[data-o="now"] .ic.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / 7%)}
[data-o="now"] .cell svg.n{width:40px;height:40px;stroke-width:1.5}
:not([data-o="now"]) > * .n{}
[data-o]:not([data-o="now"]) .n{display:none}

/* ── PICTOGRAM: the reference's taste — a heavier dark-grey line, small inner
   details, filled wheels and knobs; drawn on 32, shown at 26 ── */
[data-o]:not([data-o="now"]) .p{width:26px;height:26px;stroke-width:1.9;color:var(--pict)}
[data-o]:not([data-o="now"]) .p .f{fill:currentColor;stroke:none}
[data-o]:not([data-o="now"]) .p .w{fill:#fff}
[data-o]:not([data-o="now"]) .p text{fill:currentColor;stroke:none;font:700 6.2px Inter,sans-serif;letter-spacing:.1px}
.cell .p{width:56px!important;height:56px!important;stroke-width:1.6!important}

/* A · Line: the pictograms alone, lit blue where you are */
[data-o="a"] .ic.on{background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / 7%)}
[data-o="a"] .ic.on .p{color:var(--blue)}

/* B · Tile: each on the reference's grey tile — white at the top, a soft
   grey under, a hairline; the lit one turns blue-white */
[data-o="b"] .rail{gap:6px}
[data-o="b"] .ic{background:linear-gradient(#fff,#ececef);box-shadow:inset 0 0 0 1px rgb(0 0 0 / 7%),0 1px 1px rgb(0 0 0 / 5%)}
[data-o="b"] .ic:not(.on):hover{background:linear-gradient(#fff,#e4e4e8)}
[data-o="b"] .ic.on{background:linear-gradient(#fff,#e2ebff);box-shadow:inset 0 0 0 1.5px var(--blue),0 1px 2px rgb(37 99 235 / 18%)}
[data-o="b"] .ic.on .p{color:var(--blue)}
[data-o="b"] .cell{background:linear-gradient(#fff,#ececef);box-shadow:inset 0 0 0 1px rgb(0 0 0 / 7%)}

/* C · Labelled: a wider rail, the word under each picture */
[data-o="c"] .rail{width:86px;gap:2px}
[data-o="c"] .ic{width:78px;height:60px;gap:2px;align-content:center}
[data-o="c"] .ic .lbl{display:block;font-size:15px;line-height:16px;color:var(--side-ink);letter-spacing:-.2px}
[data-o="c"] .ic .p{width:24px;height:24px}
[data-o="c"] .ic.on{background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / 7%)}
[data-o="c"] .ic.on .p,[data-o="c"] .ic.on .lbl{color:var(--blue)}
[data-o="c"] .ic.on .lbl{font-weight:600}
[data-o="c"] .ic .dot{top:5px;right:20px}
</style>
</head>
<body data-o="a">
<div class="opts" role="group" aria-label="Option">
  <button data-set="now">Now</button>
  <button data-set="a">A · Line</button>
  <button data-set="b">B · Tile</button>
  <button data-set="c">C · Labelled</button>
</div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Departments"></nav>
  <aside class="panel">
    <h2>Ops</h2>
    <div class="item on">Allotment</div>
    <div class="item">Receiving</div>
    <div class="item">Returns</div>
    <div class="item">Stock</div>
    <div class="item">Printing</div>
  </aside>
  <main class="page">
    <h1 id="title">A · Line</h1>
    <p class="say" id="say"></p>
    <div class="sheet" id="sheet"></div>
  </main>
</div>

<script>
const DEPTS = [
  ["search", "Search"],
  ["exec", "Executive"],
  ["buy", "Procurement", true],
  ["merch", "Merchandise", true],
  ["ops", "Ops"],
  ["inv", "Inventory"],
  ["mkt", "Marketing"],
  ["sales", "Sales"],
  ["fin", "Finance", true],
  ["hr", "HR", true],
  ["ga", "GA"],
  ["master", "Master"],
]
const SAY = {
  now: "Today's line icons, as on osretail.site.",
  a: "The pictograms of the reference: a heavier dark-grey line, small inner details, filled wheels. The one you are in turns blue on a white chip.",
  b: "The same pictograms on the reference's grey tile. The one you are in gets a blue ring.",
  c: "The pictograms with their word under them, so nobody has to guess what a picture means.",
}
const icon = (id) =>
  `<svg class="n" viewBox="0 0 24 24"><use href="#n-${id}"/></svg><svg class="p" viewBox="0 0 32 32"><use href="#p-${id}"/></svg>`
const rail = document.getElementById("rail")
rail.innerHTML =
  `<div class="logo">C</div>` +
  DEPTS.map(([id, label, dot]) =>
    `<button class="ic${id === "ops" ? " on" : ""}" title="${label}">${icon(id)}<span class="lbl">${label === "Procurement" ? "Buying" : label === "Merchandise" ? "Merch" : label}</span>${dot ? '<span class="dot"></span>' : ""}</button>`
  ).join("")
rail.querySelectorAll(".ic").forEach((b) =>
  b.addEventListener("click", () => {
    rail.querySelectorAll(".ic").forEach((x) => x.classList.toggle("on", x === b))
  })
)
document.getElementById("sheet").innerHTML = DEPTS.map(
  ([id, label]) => `<div class="cell">${icon(id)}<span>${label}</span></div>`
).join("")

const set = (o) => {
  document.body.dataset.o = o
  document.querySelectorAll(".opts button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.set === o))
  document.getElementById("title").textContent = document.querySelector(`.opts [data-set="${o}"]`).textContent
  document.getElementById("say").textContent = SAY[o]
  try { localStorage.setItem("sidebar-icons", o) } catch {}
}
document.querySelectorAll(".opts button").forEach((b) => b.addEventListener("click", () => set(b.dataset.set)))
let first = "a"
try { first = new URLSearchParams(location.search).get("o") || localStorage.getItem("sidebar-icons") || "a" } catch {}
set(first)
</script>
</body>
</html>
