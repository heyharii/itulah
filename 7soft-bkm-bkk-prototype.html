.win *{position:absolute;white-space:nowrap}
.win .tx{position:absolute}
.win .c{transform:translate(-50%,-50%)}

.dd{width:17px;height:17px;right:0;top:0;border:1px solid;border-color:#fff #808080 #808080 #fff;background:#e7f1fe}

.dd.dis::after{border-top-color:#a0a0a0}
.dots{width:17px;height:17px;background:#e7f1fe;border:1px solid #9aa3b0;border-radius:2px}
.dots::after{content:"···";left:2px;top:2px;font-size:9px;letter-spacing:-1px;font-weight:bold}
.lb{font-size:11px;transform:translateY(-50%);color:#000}
.tbtn{font-size:11px;transform:translate(-50%,-50%)}

.sel{background:#e7f1fe}
.gl{background:#000}
.hd{font-weight:bold;font-size:11px;transform:translate(-50%,-50%);color:#000}

 /* status */
 h+=A('',12,722,400,20,'','border:1px solid;border-color:#919ba9 #fbfbfc #fbfbfc #919ba9;background:#dfecfb');
 h+=A('',412,722,862,20,'<span class="tx c" style="left:433px;top:10px;font:bold 11px Tahoma,Verdana,sans-serif">READ ONLY</span>','border:1px solid;border-color:#919ba9 #fbfbfc #fbfbfc #919ba9;background:#dfecfb');
 if(S.foot){
  h+=T('c',99,757,'ADMIN','transform:translate(-50%,-50%)')+T('m',207,757,'PERIODE : FEB 2016&nbsp;&nbsp;&nbsp;&nbsp;2/1/2016&nbsp;&nbsp;-&nbsp;&nbsp;2/29/2016')+T('m',524,757,'SERVER : Demo on Localhost');
 }
 if(S.tip)h+=A('tip',S.tip.x,S.tip.y,S.tip.w,19,`<span class="tx" style="left:5px;top:3px">${S.tip.t}</span>`,'z-index:9');
 return h;
}

/* ===== page ===== */
let st={mode:'bkm',rec:0,tab:'detail'},view='replica';
const $=q=>document.querySelector(q);
const shot=x=>SCREENS.find(s=>s.mode===x.mode&&s.rec===x.rec&&s.tab===x.tab);
/* a state the manual has no screenshot of borrows the size of its record's page */
function screenOf(x){
 const hit=shot(x);if(hit)return{...hit,orig:true};
 const base=SCREENS.find(s=>s.mode===x.mode&&s.rec===x.rec);
 return{...base,k:x.mode+'-'+x.tab,tab:x.tab,orig:false,tip:null,foot:false};
}
function draw(){
 const S=screenOf(st);
 const win=$('#win'),img=$('#orig'),fit=$('#fit');
 const v=S.orig?view:'replica';
 win.style.width=S.w+'px';win.style.height=S.h+'px';
 win.innerHTML=frame(S);
 if(S.orig){img.src='7soft-ref/'+S.k+'.png';img.style.width=S.w+'px';img.style.height=S.h+'px'}
 win.style.display=v==='original'?'none':'block';
 img.style.display=v==='replica'?'none':'block';
 img.style.opacity=v==='overlay'?.5:1;img.style.mixBlendMode=v==='difference'?'difference':'normal';
 fit.style.width=S.w+'px';fit.style.height=S.h+'px';
 $('#note').textContent=S.orig?'':'Layar ini tidak ada di manual — hanya replika, belum ada gambar asli untuk dibandingkan.';
 scale();
 $('#scr').innerHTML=SCREENS.map(s=>`<button data-k="${s.mode}.${s.rec}.${s.tab}" aria-pressed="${s.mode===st.mode&&s.rec===st.rec&&s.tab===st.tab}">${LABEL[s.k]}</button>`).join('');
 $('#view').innerHTML=[['replica','Replika'],['original','Asli'],['overlay','Overlay'],['difference','Selisih']].map(([k,l])=>`<button data-v="${k}" aria-pressed="${view===k}">${l}</button>`).join('');
}
function scale(){
 const S=screenOf(st),fit=$('#fit'),avail=window.innerWidth-40,s=Math.min(1.6,avail/S.w);
 fit.style.transform=`scale(${s})`;
 fit.parentElement.style.height=(S.h*s+40)+'px';
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(b&&b.dataset.k){const[m,r,t]=b.dataset.k.split('.');st={mode:m,rec:+r,tab:t};draw();return}
 if(b&&b.dataset.v){view=b.dataset.v;draw();return}
 /* inside the window: the tabs and the record arrows work */
 const tab=e.target.closest('[data-tab]');
 if(tab){st.tab=tab.dataset.tab;draw();return}
 const nav=e.target.closest('[data-nav]');
 if(nav){const n=RECS[st.mode].length-1;st.rec=nav.dataset.nav==='first'?0:nav.dataset.nav==='last'?n:Math.max(0,Math.min(n,st.rec+(nav.dataset.nav==='next'?1:-1)));draw()}
});
window.addEventListener('resize',scale);
draw();
</script>
