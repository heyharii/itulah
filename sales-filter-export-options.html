<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sales filter and export</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* Sales › By place › Store, 20 Oct 2026: the bar over the table (search,
   Filter, period, Heatmap, Export) "kurang rapi". Now = as the hub draws it;
   A One bar · B Scope on top (picked 20 Oct) · C Chips · D Division radios · E Side filters.
   Then "kpi nya ga rapi": KPI switch Now · K1 Five · K2 Stock apart ★ · K3 Figures only · K4 Four.
   Second switch: Export as Straight ★ · Menu · Look first.
   Shell and sizes copied from sales-store-tidy-options.html (measured on :5350
   at 1440 on 17 Oct): title 17/600, KPI 15/16, tabs 15/500, bar 36, th 40.
   Filter button, clause chips, value lists: design-system FilterPanel/FilterChips. */
:root{
  --ink:#1d1d1f; --body:#3a3a3c; --mute:#6e6e73; --faint:#c7c7cc; --ico:#8e8e93;
  --canvas:#fff; --soft:#fafafb; --soft-2:#f2f2f5; --shell:#e8ebf0;
  --hairline:#e8e8ec; --hairline-2:#dcdce1; --row-line:#eeeef1; --hover:#f6f7f9;
  --accent:#2862dc; --accent-bg:#eef3fc; --chip:#667085;
  --ring:0 0 0 1px rgb(0 0 0/5%),0 2px 8px rgb(0 0 0/4%),0 12px 32px rgb(0 0 0/6%);
  --pop:0 0 0 1px rgb(0 0 0/6%),0 8px 24px rgb(0 0 0/12%);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --font:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);background:var(--shell);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;height:100vh}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0}
button{cursor:pointer}
button[disabled]{cursor:default}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
td,.fig .v,.num{font-variant-numeric:tabular-nums}

/* ── prototype chrome ── */
.proto{min-height:50px;background:#141518;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px 8px 18px;flex:none}
.proto .grp{display:flex;align-items:center;gap:8px}
.proto .t{font-weight:600;white-space:nowrap}
.proto .lbl{color:#8b8f97;white-space:nowrap}
.proto .sp{flex:1}
.seg{display:flex;gap:2px;background:#24262b;border-radius:9px;padding:3px}
.seg button{height:32px;padding:0 11px;border-radius:7px;color:#b9bcc3;white-space:nowrap;transition:background-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.seg button b{font-weight:600;color:#fff;margin-right:5px}
.seg button.on{background:#fff;color:var(--ink)}
.seg button.on b{color:var(--ink)}
.seg .star{color:#f4b740;margin-left:4px}
.note{flex:none;height:36px;background:#1c1e22;color:#a7abb3;display:flex;align-items:center;padding:0 18px;border-top:1px solid #26282d;white-space:nowrap;overflow:hidden}
.note b{color:#fff;font-weight:500;margin-right:8px}
.note .txt{overflow:hidden;text-overflow:ellipsis}
.note .cm{margin-left:auto;padding-left:16px;color:#7d818a}

/* ── hub shell ── */
.app{flex:1;min-height:0;display:grid;grid-template-columns:68px 216px minmax(0,1fr);padding:12px 12px 12px 0;overflow:hidden}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
.rail .ri{width:40px;height:36px;border-radius:10px;display:grid;place-items:center;color:#3a3a3c}
.rail .ri.on{background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/5%),0 2px 6px rgb(0 0 0/4%);color:var(--accent)}
.panel{background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgb(0 0 0/5%),0 2px 6px rgb(0 0 0/4%);display:flex;flex-direction:column;min-height:0;margin-right:12px}
.panel h2{margin:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0 16px;font-size:20px;font-weight:600;color:#1d2939;letter-spacing:-.01em}
.panel h2 .i{width:16px;height:16px;color:var(--ico)}
.nav{padding:10px;display:flex;flex-direction:column;overflow-y:auto}
.sec{display:flex;flex-direction:column;gap:1px;margin-top:22px}
.sec:first-child{margin-top:0}
.chipl{align-self:flex-start;height:22px;line-height:22px;margin:0 0 4px 6px;padding:0 8px;border-radius:6px;background:var(--soft-2);color:var(--chip);font-size:12px;font-weight:600}
.nrow{height:36px;display:flex;align-items:center;padding:0 10px;border-radius:8px}
.nrow.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.page{background:#fff;border-radius:16px;box-shadow:var(--ring);min-width:0;min-height:0;position:relative;overflow:hidden}
.main{height:100%;overflow-y:auto;overscroll-behavior:contain}
.content{padding:24px 28px 40px}
.swap{animation:swapin .16s ease-out}
@keyframes swapin{from{opacity:0}}

/* ── page: head · figures · tabs · card ── */
.head{margin-bottom:24px}
.head h1{margin:0;font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.3px}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-8px 0 28px}
.figs{display:flex;margin-bottom:28px}
.fig{padding:0 24px;border-left:1px solid var(--hairline);min-width:0}
.fig:first-child{border-left:0;padding-left:0}
.fig .l{color:var(--mute);white-space:nowrap}
.fig .v{font-size:16px;line-height:22px;font-weight:600;padding-top:4px;white-space:nowrap;letter-spacing:-.02em}
.fig .s{color:var(--mute);margin-top:6px;white-space:nowrap}
.fig.apart{margin-left:auto;text-align:right;padding-right:0}

.tabs{display:flex;gap:20px;border-bottom:1px solid var(--hairline);margin-bottom:16px}
.tab{height:43px;color:var(--mute);font-weight:500;position:relative;transition:color .15s ease}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}

.card{border:1px solid var(--hairline);border-radius:10px;background:#fff;overflow:clip}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--hairline)}
.bar .sp{flex:1 1 0;min-width:0}
.bar .brk{flex-basis:100%;height:0}
.bar.now .search{flex:0 0 288px;max-width:none}
.tabs .tv{margin-left:auto;align-self:center;display:flex;gap:8px}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--hairline)}
.row2 .sp{flex:1}
.bar.nw,.row2.nw{flex-wrap:nowrap;align-items:flex-start}
.grow{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row2.nw .grow{min-height:32px}
.vr{width:1px;height:22px;background:var(--hairline-2);margin:0 4px;flex:none}

/* controls, all 36 */
.search{height:36px;flex:1 1 160px;max-width:260px;min-width:160px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border:1px solid var(--hairline-2);border-radius:8px;transition:border-color .15s ease,box-shadow .15s ease}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search .i{width:16px;height:16px;color:var(--ico)}
.search input{flex:1;min-width:0;outline:none}
.search input::placeholder{color:var(--mute)}
.search .clr{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ico)}
.search .clr .i{width:14px;height:14px}
.search .clr.hide{visibility:hidden}
.btn{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:1px solid var(--hairline-2);border-radius:8px;background:#fff;font-weight:500;white-space:nowrap;flex:none;transition:transform .16s var(--ease-out),background-color .15s ease}
.btn .i{width:16px;height:16px}
.btn .chev{width:15px;height:15px;color:var(--ico)}
.btn .cnt{color:var(--mute)}
.btn.open{background:var(--soft-2)}
.btn.acc{color:var(--accent)}
.btn.pending{pointer-events:none}
.mini{height:28px;padding:0 9px;border:1px solid var(--hairline-2);border-radius:7px;background:#fff;font-weight:500;white-space:nowrap;transition:transform .16s var(--ease-out),background-color .15s ease}
.pbtn{height:36px;padding:0 14px;border-radius:8px;background:var(--accent);color:#fff;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:transform .16s var(--ease-out),opacity .15s ease}
.pbtn .i{width:16px;height:16px}
.pbtn[disabled]{opacity:.4}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sg{display:inline-flex;gap:2px;background:#f2f2f4;border-radius:9px;padding:3px;flex:none}
.sg button{height:30px;padding:0 10px;border-radius:6px;color:var(--mute);font-weight:500;white-space:nowrap;transition:background-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.sg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--hairline),0 1px 2px rgb(0 0 0/6%)}
.sw{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 11px 0 7px;border:1px solid var(--hairline);border-radius:8px;font-weight:500;white-space:nowrap;flex:none;transition:transform .16s var(--ease-out)}
.sw .k{width:30px;height:18px;border-radius:9px;background:#d9d9de;position:relative;transition:background-color .2s ease}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/20%);transition:transform .2s var(--ease-out)}
.sw.on .k{background:var(--accent)}
.sw.on .k::after{transform:translateX(12px)}
.sw.off{opacity:.45;pointer-events:none}

/* clause chips (FilterChips) */
.cl{display:inline-flex;align-items:stretch;height:32px;border-radius:16px;background:var(--soft-2);overflow:hidden;max-width:100%;flex:none}
.cl button{display:inline-flex;align-items:center;white-space:nowrap;transition:background-color .15s ease}
.cl .c{padding:0 8px 0 12px;font-weight:500}
.cl .o{padding:0 8px;background:var(--soft);color:var(--body);border-left:1px solid var(--hairline);border-right:1px solid var(--hairline)}
.cl .v{padding:0 10px;color:var(--accent);font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;display:block;line-height:32px}
.cl .v.draft{color:var(--mute)}
.cl .x{width:30px;justify-content:center;color:var(--ico);border-left:1px solid var(--hairline)}
.cl .x .i{width:14px;height:14px}
.cl.date .c .i{width:16px;height:16px;color:var(--ico);margin-right:6px}
.cl.date .v{padding-right:12px}
.cl.open{box-shadow:0 0 0 2px var(--accent-bg),0 0 0 1px var(--accent)}

/* D · icon radios, one Segmented with icons */
.radg{display:inline-flex;flex-wrap:wrap;gap:2px;background:#f2f2f4;border-radius:9px;padding:3px;max-width:100%}
.rad{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 8px;border-radius:6px;color:var(--body);font-weight:500;white-space:nowrap;flex:none;transition:transform .16s var(--ease-out),background-color .15s ease,color .15s ease,box-shadow .15s ease}
.rad .i{width:16px;height:16px;color:var(--ico);transition:color .15s ease}
.rad em{font-style:normal;color:var(--mute);font-weight:400}
.rad.on{background:#fff;color:var(--accent);box-shadow:0 0 0 1px var(--hairline),0 1px 2px rgb(0 0 0/6%)}
.rad.on .i{color:var(--accent)}

/* E · side filters */
.split{display:flex;align-items:flex-start}
.split .tw{flex:1;min-width:0}
.facets{width:232px;flex:none;align-self:flex-start;position:sticky;top:0;max-height:calc(100vh - 110px);overflow-y:auto;overscroll-behavior:contain;padding:6px 8px 16px}
.split .tw{border-left:1px solid var(--hairline)}
.split td,.split th{padding:0 10px}
.split th:first-child,.split td:first-child{padding-left:14px}
.split .mx td,.split .mx th{padding:0 6px}
.fs{padding:12px 6px 6px;border-top:1px solid var(--row-line)}
.fs:first-child{border-top:0}
.fs h5{margin:0 0 4px;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:15px;font-weight:600}
.fwrap{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 4px}
.fmore{margin:4px 0 2px 6px}
.cc{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 6px;border-radius:16px;border:1px solid var(--hairline-2);background:#fff;white-space:nowrap;transition:transform .16s var(--ease-out),background-color .15s ease,border-color .15s ease,color .15s ease}
.cc .dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgb(0 0 0/14%)}
.cc.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:500}
.sz{min-width:44px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--hairline-2);background:#fff;transition:transform .16s var(--ease-out),background-color .15s ease,border-color .15s ease,color .15s ease}
.sz.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:500}

/* rows in lists: facets, sheet, popovers */
.fr{width:100%;min-height:38px;display:flex;align-items:center;gap:10px;padding:0 8px;border-radius:7px;text-align:left;transition:background-color .12s ease,transform .16s var(--ease-out)}
.fr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr em{font-style:normal;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.fr .dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgb(0 0 0/14%);flex:none}
.fr.on span{font-weight:500}
.bx{width:16px;height:16px;border-radius:4px;border:1.5px solid #b8b8c0;display:grid;place-items:center;flex:none;transition:background-color .12s ease,border-color .12s ease}
.bx .i{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0;transform:scale(.6);transition:opacity .12s ease,transform .16s var(--ease-out)}
.on>.bx{background:var(--accent);border-color:var(--accent)}
.on>.bx .i{opacity:1;transform:none}
.rd{width:16px;height:16px;border-radius:50%;border:1.5px solid #b8b8c0;flex:none;transition:border-width .12s ease,border-color .12s ease}
.on>.rd{border:5px solid var(--accent)}

/* ── the table ── */
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
th{position:sticky;top:0;z-index:3;height:40px;background:var(--soft);color:var(--mute);font-weight:500;text-align:right;padding:0 12px;white-space:nowrap;border-bottom:1px solid var(--hairline)}
td{height:60px;padding:0 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--row-line);overflow:hidden;text-overflow:ellipsis}
th:first-child,td:first-child{text-align:left;padding-left:16px}
tbody tr:last-child td{border-bottom:0}
tbody td{transition:background-color .12s ease}
tfoot td{position:sticky;bottom:0;z-index:2;background:var(--soft);font-weight:600;border-top:1px solid var(--hairline-2);border-bottom:0}
.two{display:flex;flex-direction:column;align-items:flex-end;line-height:20px}
td:first-child .two{align-items:flex-start}
.two .u{color:var(--mute);font-weight:400}
.nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.b{font-weight:600}
.m{color:var(--mute)}
.mono{letter-spacing:.06em}
.empty td{height:120px;text-align:center;color:var(--mute)}
.mx td,.mx th{padding:0 6px;height:52px}
.mx th:first-child,.mx td:first-child{padding-left:16px}
.mx .tc{border-left:1px solid var(--hairline-2);padding:0 12px}
.wide{overflow-x:auto}
.wide td:first-child,.wide th:first-child{position:sticky;left:0;z-index:2;background:#fff}
.wide th:first-child{z-index:4;background:var(--soft)}
.wide tfoot td:first-child{background:var(--soft)}
.foot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--hairline);color:var(--mute);white-space:nowrap}
.foot .lg{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
.foot .lg i{width:72px;height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 4%,transparent),color-mix(in srgb,var(--accent) 32%,transparent))}
.applied{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--hairline);color:var(--body)}
.applied button{color:var(--accent);font-weight:500}

/* ── popover ── */
.pop{position:fixed;z-index:50;min-width:240px;max-width:360px;background:#fff;border-radius:10px;box-shadow:var(--pop);padding:5px;opacity:0;transform:scale(.97);pointer-events:none;transition:opacity .15s var(--ease-out),transform .15s var(--ease-out)}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop .ph{padding:8px 10px 6px;color:var(--mute);font-weight:600}
.pop .ps{height:36px;display:flex;align-items:center;gap:8px;margin:3px 3px 5px;padding:0 10px;border:1px solid var(--hairline-2);border-radius:8px}
.pop .ps:focus-within{border-color:var(--accent)}
.pop .ps .i{width:16px;height:16px;color:var(--ico)}
.pop .ps input{flex:1;min-width:0;outline:none}
.pop .ps input::placeholder{color:var(--mute)}
.pop .pl{max-height:272px;overflow-y:auto;overscroll-behavior:contain}
.pop hr{border:0;border-top:1px solid var(--hairline);margin:5px 4px}
.pop .nil{padding:10px;color:var(--mute)}
.pr{width:100%;min-height:38px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:7px;text-align:left;transition:background-color .12s ease,transform .16s var(--ease-out)}
.pr>span{flex:1;min-width:0}
.pr em{font-style:normal;color:var(--mute);white-space:nowrap}
.pr>.i{width:16px;height:16px;color:var(--ico)}
.pr .tick{color:var(--accent);visibility:hidden}
.pr.on .tick{visibility:visible}
.pr.on>span{font-weight:500}
.pr.tall{min-height:52px}
.pr .sub{display:block;color:var(--mute)}
/* calendar */
.cal{width:300px;padding:6px}
.cal .ch{display:flex;align-items:center;gap:8px;height:36px;margin-bottom:4px}
.cal .ch b{flex:1;text-align:center;font-weight:600}
.cal .nv{width:32px;height:32px;border-radius:8px;border:1px solid var(--hairline-2);display:grid;place-items:center;transition:transform .16s var(--ease-out)}
.cal .nv .i{width:16px;height:16px}
.cal .nv[disabled]{opacity:.35}
.cal .wk,.cal .gd{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .wk span{height:28px;line-height:28px;text-align:center;color:var(--mute)}
.cal .gd{row-gap:2px}
.cal .dy{height:36px;font-variant-numeric:tabular-nums;border-radius:8px;transition:background-color .1s ease}
.cal .dy.in{background:var(--accent-bg);border-radius:0;color:var(--accent)}
.cal .dy.a,.cal .dy.b{background:var(--accent);color:#fff;border-radius:8px;font-weight:500}
.cal .dy[disabled]{color:var(--faint)}
.cal .cf{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:10px;border-top:1px solid var(--hairline)}
.cal .cf span{flex:1;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .cf span.set{color:var(--ink);font-weight:500}
/* export · look first */
.look{width:340px;padding:10px 12px 12px}
.look .fl{display:flex;align-items:center;gap:10px;padding:2px 0 12px;font-weight:600}
.look .fl .i{width:22px;height:22px;color:#1d7a46}
.look .fact{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--row-line)}
.look .fact .k{color:var(--mute);white-space:nowrap}
.look .fact .vv{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.look .tiles{display:flex;gap:8px;padding:12px 0 14px;border-top:1px solid var(--row-line)}
.look .tl{flex:1;height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;border:1px solid var(--hairline-2);transition:transform .16s var(--ease-out),background-color .15s ease,border-color .15s ease}
.look .tl.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:500}
.look .pbtn{width:100%;justify-content:center}

/* ── filter sheet (layer) ── */
.veil{position:absolute;inset:0;z-index:30;background:rgb(40 30 20/10%);opacity:0;pointer-events:none;transition:opacity .2s var(--ease-out)}
.veil.open{opacity:1;pointer-events:auto;transition-duration:.28s}
.sheet{position:absolute;top:12px;right:12px;bottom:12px;width:560px;background:#fff;border-radius:16px;box-shadow:var(--ring);z-index:31;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .2s var(--ease-out)}
.sheet.open{transform:none;transition:transform .28s var(--ease-drawer)}
.sheet .hd{display:flex;align-items:center;gap:12px;padding:22px 24px 18px 28px;border-bottom:1px solid var(--hairline)}

.pn{width:100%;height:42px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:7px;font-weight:500;transition:background-color .15s ease,transform .16s var(--ease-out)}
.pn .i{width:16px;height:16px;color:var(--ico)}

.pn.on{background:var(--soft-2)}
.sheet .list{flex:1;min-width:0;overflow-y:auto;padding:12px 14px}

.sheet .ss .i{width:16px;height:16px;color:var(--ico)}
.sheet .ss input{flex:1;min-width:0;outline:none}
.sheet .ft{display:flex;align-items:center;gap:8px;padding:14px 24px;border-top:1px solid var(--hairline)}
.sheet .ft .sp{flex:1}
.save{display:flex;gap:8px;margin:0 2px 12px}
.save input{flex:1;min-width:0;height:36px;padding:0 10px;border:1px solid var(--hairline-2);border-radius:8px;outline:none}

/* ── toast (Sonner-like) ── */
.toast{position:fixed;left:50%;bottom:28px;z-index:60;display:flex;align-items:center;gap:12px;min-width:340px;padding:13px 16px;background:#fff;border-radius:12px;box-shadow:var(--pop);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .24s var(--ease-out)}

.toast .ok{width:24px;height:24px;border-radius:50%;background:#e7f5ec;color:#1d7a46;display:grid;place-items:center;flex:none}
.toast .ok .i{width:14px;height:14px;stroke-width:2.4}
.toast b{display:block;font-weight:500}
.toast em{display:block;font-style:normal;color:var(--mute)}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ── the figures ── */
function range(){if(S.period==='custom')return S.range;const p=PRESETS.find(p=>p.k===S.period);return{from:p.from,to:p.to}}
function periodName(){return S.period==='custom'?rangeText(S.range):PRESETS.find(p=>p.k===S.period).l}
function factor(s,skip){
  let f=1;
  for(const key of ['divisions','tags','suppliers','colours','sizes']){
    if(key===skip)continue;const sel=S.f[key];if(!sel.length)continue;
    f*=VAL[key].reduce((a,x,i)=>a+(sel.includes(x.v)?SH[key][s][i]:0),0);
  }
  return f;
}
function rawSales(s,r){return monthsIn(r).reduce((a,x)=>a+storeMonth(s,x.y,x.m)*x.frac,0)}
function monthCols(r){
  const ms=monthsIn(r),lastY=pd(r.to).y,cross=pd(r.from).y!==lastY;
  if(ms.length<=12)return ms.map(x=>({label:MON[x.m]+(cross?' '+String(x.y).slice(2):''),parts:[x]}));
  const byY={},out=[];
  ms.forEach(x=>{if(x.y<lastY)(byY[x.y]=byY[x.y]||{label:String(x.y),parts:[]}).parts.push(x)});
  Object.keys(byY).sort().forEach(y=>out.push(byY[y]));
  ms.filter(x=>x.y===lastY).forEach(x=>out.push({label:MON[x.m],parts:[x]}));
  return out;
}
function compute(){
  const r=range();
  const inStores=S.f.stores.length?DB.filter(d=>S.f.stores.includes(d.code)):DB;
  const rows=inStores.map(d=>{
    const f=factor(d.s),sales=rawSales(d.s,r)*f,pcsN=sales/d.price,gp=sales*(1-d.cost),stock=Math.round(d.stock*f);
    return{d,f,sales,pcs:pcsN,disc:sales*d.disc/(1-d.disc),gp,margin:sales?gp/sales:0,stock,value:stock*d.unit,trx:pcsN/d.ppr};
  });
  const tot=rows.reduce((a,x)=>a+x.sales,0);
  rows.forEach(x=>x.share=tot?x.sales/tot:0);
  const needle=S.q.trim().toLowerCase();
  const vis=needle?rows.filter(x=>(x.d.name+' '+x.d.code).toLowerCase().includes(needle)):rows;
  const sum=(list,k)=>list.reduce((a,x)=>a+x[k],0);
  const k={trx:sum(rows,'trx'),sold:sum(rows,'pcs'),sales:tot,disc:sum(rows,'disc'),gp:sum(rows,'gp'),stock:sum(rows,'stock'),worth:sum(rows,'value')};
  k.void=Math.round(k.trx*.0032);k.each=k.trx?k.sold/k.trx:0;k.avg=k.trx?k.sales/k.trx:0;k.cogs=k.sales-k.gp;k.cogsPct=k.sales?k.cogs/k.sales:0;k.margin=k.sales?k.gp/k.sales:0;
  return{r,rows,vis,k,cols:monthCols(r)};
}
/* a value's share of sales in the period, before its own filter */
function facetShare(key,i){
  const r=range();
  const stores=S.f.stores.length?DB.filter(d=>S.f.stores.includes(d.code)):DB;
  if(key==='stores'){
    const all=DB.map(d=>rawSales(d.s,r)*factor(d.s));const t=all.reduce((a,b)=>a+b,0);return t?all[i]/t:0;
  }
  let t=0,p=0;
  stores.forEach(d=>{const v=rawSales(d.s,r)*factor(d.s,key);t+=v;p+=v*SH[key][d.s][i]});
  return t?p/t:0;
}

/* ── the table ── */
function cellsTotals(x){
  return `<td><div class="two"><span class="nm">${esc(x.d.name)}</span><span class="u mono">${x.d.code}-TOKO</span></div></td>
    <td><div class="two"><span class="b">${rp(x.sales)}</span><span class="u">${pcs(x.pcs)}</span></div></td>
    <td class="m">${rp(x.disc)}</td>
    <td><div class="two"><span>${rp(x.gp)}</span><span class="u">${pcI(x.margin)}</span></div></td>
    <td><div class="two"><span>${pcs(x.stock)}</span><span class="u">${rp(x.value)}</span></div></td>
    <td class="m">${pc(x.share)}</td>`;
}
function tableTotals(D){
  const v=D.vis,sum=k=>v.reduce((a,x)=>a+x[k],0),s=sum('sales'),gp=sum('gp');
  const body=v.length?v.map(x=>`<tr>${cellsTotals(x)}</tr>`).join(''):`<tr class="empty"><td colspan="6">No store matches “${esc(S.q)}”.</td></tr>`;
  return `<table><colgroup><col style="width:${S.o==='e'&&S.rail?24:26}%"><col><col><col><col><col style="width:11%"></colgroup>
    <thead><tr><th>Store</th><th>Sales</th><th>Discount</th><th>Gross profit</th><th>Stock · Value</th><th>Share</th></tr></thead>
    <tbody>${body}</tbody>
    ${v.length?`<tfoot><tr><td>Total</td><td><div class="two"><span>${rp(s)}</span><span class="u">${pcs(sum('pcs'))}</span></div></td><td class="m">${rp(sum('disc'))}</td><td><div class="two"><span>${rp(gp)}</span><span class="u">${pcI(s?gp/s:0)}</span></div></td><td><div class="two"><span>${pcs(sum('stock'))}</span><span class="u">${rp(sum('value'))}</span></div></td><td>${pc(sum('share'))}</td></tr></tfoot>`:''}
  </table>`;
}
function tableMonth(D){
  const cols=D.cols,cell=(x,c)=>c.parts.reduce((a,p)=>a+storeMonth(x.d.s,p.y,p.m)*p.frac,0)*x.f;
  const grid=D.vis.map(x=>cols.map(c=>cell(x,c)));
  const body=D.vis.length?D.vis.map((x,i)=>{
    const vals=grid[i],lo=Math.min(...vals),hi=Math.max(...vals),t=vals.reduce((a,b)=>a+b,0);
    return `<tr><td><div class="two"><span class="nm">${esc(x.d.name)}</span><span class="u mono">${x.d.code}-TOKO</span></div></td>${vals.map(v=>{
      const a=hi>lo?4+28*(v-lo)/(hi-lo):0,bg=S.heat&&v>0?` style="background:color-mix(in srgb,var(--accent) ${a.toFixed(1)}%,transparent)"`:'';
      return `<td${bg}>${v>0?rpc(v):'<span class="m">–</span>'}</td>`}).join('')}<td class="tc b">${t>0?rpc(t):'<span class="m">–</span>'}</td></tr>`;
  }).join(''):`<tr class="empty"><td colspan="${cols.length+2}">No store matches “${esc(S.q)}”.</td></tr>`;
  const colT=cols.map((c,j)=>grid.reduce((a,r)=>a+r[j],0)),all=colT.reduce((a,b)=>a+b,0);
  return `<div class="wide"><table class="mx" style="min-width:${170+96+cols.length*64}px"><colgroup><col style="width:170px">${cols.map(()=>'<col>').join('')}<col style="width:96px"></colgroup>
    <thead><tr><th>Store · Sales, Rp</th>${cols.map(c=>`<th>${c.label}</th>`).join('')}<th class="tc">Total</th></tr></thead>
    <tbody>${body}</tbody>
    ${D.vis.length?`<tfoot><tr><td>Total</td>${colT.map(v=>`<td>${rpc(v)}</td>`).join('')}<td class="tc">${rpc(all)}</td></tr></tfoot>`:''}
  </table></div>`;
}
function table(D){return S.tab==='totals'?tableTotals(D):tableMonth(D)}
function foot(D){
  const n=D.vis.length,all=STORES.length;
  const lg=S.tab==='month'&&S.heat?`<span class="lg">Lowest <i></i> highest month, per row</span>`:'';
  if(S.o==='now')return `<span>${cnt(n)} ${n===1?'store':'stores'}</span><span>${rangeText(D.r)} · ${all} stores</span>${lg}`;
  return `<span>${n===all?`${all} stores`:`${n} of ${all} stores`} · ${rangeText(D.r)}</span>${lg}`;
}

/* ── the page ── */
function figs(k){
  const T={trx:['Transactions',cnt(k.trx),`${cnt(k.void)} voided`],sold:['Sold',pcs(k.sold),`${dec(k.each)} pcs each`],sales:['Sales',rp(k.sales),`${rp(k.disc)} discount`],
    gp:['Gross profit',rp(k.gp),`${pcI(k.margin)} margin`],stock:['Stock',pcs(k.stock),`worth ${rp(k.worth)}`],cogs:['COGS',rp(k.cogs),`${pcI(k.cogsPct)} of sales`]};
  const cell=([l,v,s],cls='')=>cls.includes('bare')
    ?`<div class="fig ${cls}" title="${esc(s)}"><div class="l">${l}</div><div class="v">${v}</div></div>`
    :`<div class="fig ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  let F;
  switch(S.k){
    case 'now':T.sales[2]=`${rp(k.disc)} discount · avg ${rp(k.avg)}`;F=['trx','sold','sales','cogs','gp','stock'].map(x=>cell(T[x]));break;
    case 'k1':F=['trx','sold','sales','gp','stock'].map(x=>cell(T[x]));break;
    case 'k2':F=['trx','sold','sales','gp'].map(x=>cell(T[x])).concat(cell(['Stock today',T.stock[1],T.stock[2]],'apart'));break;
    case 'k3':F=['trx','sold','sales','gp'].map(x=>cell(T[x],'bare')).concat(cell(['Stock today',T.stock[1],T.stock[2]],'apart bare'));break;
    case 'k4':F=['sales','gp','sold','trx'].map(x=>cell(T[x]));break;
  }
  return `<div class="figs">${F.join('')}</div>`;
}
function renderAll(){
  const D=compute(),main=$('#main'),top=main.scrollTop;
  const tabs=`<div class="tabs" role="tablist">${[['totals','Totals'],['month','Per month']].map(([k,l])=>`<button class="tab${S.tab===k?' on':''}" role="tab" aria-selected="${S.tab===k}" data-act="tab" data-v="${k}">${l}</button>`).join('')}${S.o!=='now'&&S.tab==='month'?`<div class="tv">${heat()}</div>`:''}</div>`;
  const data=`<div id="tbl">${table(D)}</div><div class="foot" id="foot">${foot(D)}</div>`;
  const card=S.o==='e'&&S.rail?`<div class="card">${bar()}<div class="split">${facets()}<div class="tw">${data}</div></div></div>`:`<div class="card">${bar()}${data}</div>`;
  main.innerHTML=`<div class="content${swapNext?' swap':''}"><div class="head"><h1>Sales by Store</h1></div>${S.o==='b'?scope():''}${figs(D.k)}${tabs}${card}</div>`;
  main.scrollTop=top;swapNext=false;
  if(POP)placePop();
  if(SHEET.open)renderSheet();
}
function renderData(){
  const D=compute();$('#tbl').innerHTML=table(D);$('#foot').innerHTML=foot(D);
  const c=document.querySelector('.search .clr');if(c)c.classList.toggle('hide',!S.q);
}

/* ── popovers ── */
function openPop(kind,anchor,extra={}){
  const el=$('#pop');el.classList.remove('open');
  POP={kind,anchor:`[data-anchor="${anchor}"]`,...extra};POPQ='';
  if(kind==='dates'){const r=range(),b=pd(r.to);CAL={y:b.y,m:b.m,a:S.period==='custom'?S.range.from:null,b:S.period==='custom'?S.range.to:null}}
  renderAll();renderPop();
  void el.offsetWidth;el.classList.add('open');
  const s=el.querySelector('.ps input');if(s)s.focus();
}
function closePop(){
  if(!POP)return;
  POP=null;$('#pop').classList.remove('open');
  if(S.draft){S.draft=null}
  renderAll();
}
function placePop(){
  const el=$('#pop'),an=document.querySelector(POP.anchor);
  if(!an){POP=null;el.classList.remove('open');return}
  const r=an.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
  let left=r.left,ox='left';
  if(left+w>innerWidth-12){left=Math.max(12,r.right-w);ox='right'}
  let top=r.bottom+6,oy='top';
  if(top+h>innerHeight-12&&r.top-h-6>12){top=r.top-h-6;oy='bottom'}
  el.style.left=left+'px';el.style.top=top+'px';el.style.transformOrigin=`${oy} ${ox}`;
}
function valueRows(key,q){
  const n=q.trim().toLowerCase();
  const rows=VAL[key].map((x,i)=>({...x,i})).filter(x=>!n||x.l.toLowerCase().includes(n));
  if(!rows.length)return `<div class="nil">Nothing matches.</div>`;
  return rows.map(x=>`<button class="fr${S.f[key].includes(x.v)?' on':''}" data-act="val" data-key="${key}" data-v="${esc(x.v)}"><i class="bx">${ico('check')}</i>${x.hex?`<i class="dot" style="background:${x.hex}"></i>`:''}<span>${esc(x.l)}</span><em>${pcF(facetShare(key,x.i))}</em></button>`).join('');
}
function calHtml(){
  const{y,m,a,b}=CAL,first=(new Date(y,m,1).getDay()+6)%7,days=dim(y,m);
  const lo=pd(LO),hi=pd(HI),canPrev=y>lo.y||m>lo.m,canNext=y<hi.y||m<hi.m;
  let cells='';for(let i=0;i<first;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const k=iso(y,m,d),off=k<LO||k>HI;
    const cls=['dy',k===a?'a':'',k===b?'b':'',a&&b&&k>a&&k<b?'in':''].join(' ');
    cells+=`<button class="${cls}" data-act="cal-day" data-v="${k}" ${off?'disabled':''}>${d}</button>`;
  }
  const said=a&&b?rangeText({from:a,to:b}):a?`From ${rangeText({from:a,to:a})}`:'Pick the first day';
  return `<div class="cal"><div class="ch"><button class="nv" data-act="cal-nav" data-v="-1" ${canPrev?'':'disabled'} aria-label="Previous month">${ico('left')}</button><b>${MONL[m]} ${y}</b><button class="nv" data-act="cal-nav" data-v="1" ${canNext?'':'disabled'} aria-label="Next month">${ico('right')}</button></div>
    <div class="wk">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<span>${d}</span>`).join('')}</div><div class="gd">${cells}</div>
    <div class="cf"><span class="${a&&b?'set':''}">${said}</span><button class="pbtn" data-act="cal-apply" ${a&&b?'':'disabled'}>Apply</button></div></div>`;
}
function renderPop(){
  if(!POP)return;
  const el=$('#pop');let h='';
  const D=POP.kind.startsWith('x')?compute():null;
  switch(POP.kind){
    case 'dates':h=calHtml();break;
    case 'values':{
      const key=POP.key,many=VAL[key].length>8;
      h=`${many?`<label class="ps">${ico('search')}<input id="pq" placeholder="Search ${FL[key].pl}" autocomplete="off" spellcheck="false" value="${esc(POPQ)}"></label>`:''}<div class="pl" id="plist">${valueRows(key,POPQ)}</div>`;
      break;
    }
    case 'cols':
      h=`<div class="ph">Filter by</div>`+FILTERS.map(f=>`<button class="pr${S.f[f.k].length?' on':''}" data-act="col" data-key="${f.k}">${ico(f.ic)}<span>${f.l}</span>${S.f[f.k].length?`<em>${esc(valText(f.k))}</em>`:''}</button>`).join('');
      break;
    case 'datechip':
      h=PRESETS.map(p=>`<button class="pr${S.period===p.k?' on':''}" data-act="dpreset" data-v="${p.k}">${ico('check','i tick')}<span>${p.l}</span><em>${rangeText(p)}</em></button>`).join('')
        +`<hr><button class="pr${S.period==='custom'?' on':''}" data-act="dpick">${ico('check','i tick')}<span>Pick dates</span>${S.period==='custom'?`<em>${rangeText(S.range)}</em>`:''}${ico('right')}</button>`;
      break;
    case 'xmenu':{
      const n=D.vis.length;
      h=[['totals','This table',`Totals · ${n} ${n===1?'store':'stores'}`],['month','Per month',`${n} ${n===1?'store':'stores'} × ${D.cols.length} ${D.cols.length===1?'month':'months'}`],['both','Both, as two sheets','Totals and Per month']]
        .map(([k,l,s])=>`<button class="pr tall" data-act="xrun" data-v="${k}">${ico('xls')}<span>${l}<span class="sub">${s}</span></span></button>`).join('');
      break;
    }
    case 'xlook':{
      const n=D.vis.length,narrow=FILTERS.filter(f=>S.f[f.k].length).map(f=>[f.l,S.f[f.k].map(v=>VAL[f.k].find(x=>x.v===v).l).join(', ')]);
      if(S.q)narrow.push(['Search',`“${S.q}”`]);
      h=`<div class="look"><div class="fl">${ico('xls')}<span>${esc(fileName())}</span></div>
        <div class="fact"><span class="k">Period</span><span class="vv">${rangeText(D.r)}</span></div>
        <div class="fact"><span class="k">Rows</span><span class="vv">${n} of ${STORES.length} stores + Total</span></div>
        ${narrow.map(([k,v])=>`<div class="fact"><span class="k">${k}</span><span class="vv" title="${esc(v)}">${esc(v)}</span></div>`).join('')}
        <div class="tiles"><button class="tl${LOOK.totals?' on':''}" data-act="xtile" data-v="totals"><i class="bx">${ico('check')}</i>Totals</button><button class="tl${LOOK.month?' on':''}" data-act="xtile" data-v="month"><i class="bx">${ico('check')}</i>Per month</button></div>
        <button class="pbtn" data-act="xrun" data-v="look">${ico('down')}Download Excel</button></div>`;
      break;
    }
  }
  el.innerHTML=h;placePop();
}
/* tiles use .on>.bx, so the box sits directly in the tile */

/* ── the filter sheet ── */
function sheetPanes(){return FILTERS.filter(f=>!(S.o==='d'&&f.k==='divisions')).concat([{k:'saved',l:'Saved views',ic:'bookmark'}])}
function sheetList(){
  if(SHEET.pane==='saved'){
    return `<div class="save"><input id="vname" placeholder="Name this view" aria-label="Name this view"><button class="btn" data-act="saveview">Save view</button></div>`
      +SAVED.map((v,i)=>`<button class="fr" data-act="view" data-v="${i}"><span>${esc(v.n)}</span>${ico('right','i')}</button>`).join('');
  }
  return valueRows(SHEET.pane,SHEET.q);
}
function renderSheet(){
  const el=$('#sheet'),D=compute(),n=D.vis.length;
  const panes=sheetPanes().map(p=>{const c=p.k==='saved'?String(SAVED.length):S.f[p.k].length?String(S.f[p.k].length):'All';
    return `<button class="pn${SHEET.pane===p.k?' on':''}" data-act="pane" data-v="${p.k}">${ico(p.ic)}${p.l}<small>${c}</small></button>`}).join('');
  const many=SHEET.pane!=='saved'&&VAL[SHEET.pane].length>8;
  el.innerHTML=`<div class="hd"><h3>Filter</h3><button class="xb" data-act="sheet-close" aria-label="Close">${ico('x')}</button></div>
    <div class="bd"><nav class="panes">${panes}</nav><div class="list">${many?`<label class="ss">${ico('search')}<input id="sq" placeholder="Search ${FL[SHEET.pane].pl}" value="${esc(SHEET.q)}" autocomplete="off" spellcheck="false"></label>`:''}<div id="slist">${sheetList()}</div></div></div>
    <div class="ft"><button class="btn" data-act="reset">Reset</button><div class="sp"></div><button class="pbtn" data-act="sheet-close">Show ${n} ${n===1?'store':'stores'}</button></div>`;
}
function openSheet(pane){
  SHEET.open=true;SHEET.q='';if(pane)SHEET.pane=pane;
  if(S.o==='d'&&SHEET.pane==='divisions')SHEET.pane='stores';
  renderSheet();$('#sheet').classList.add('open');$('#veil').classList.add('open');$('#sheet').setAttribute('aria-hidden','false');renderAll();
}
function closeSheet(){SHEET.open=false;$('#sheet').classList.remove('open');$('#veil').classList.remove('open');$('#sheet').setAttribute('aria-hidden','true');renderAll()}

/* ── export ── */
function fileName(){return `Sales by Store · ${periodName()}.xlsx`}
let toastT=0;
function toast(html){const t=$('#toast');t.innerHTML=html;t.classList.add('open');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('open'),3200)}
function runExport(what){
  const b=document.querySelector('[data-anchor="export"]');
  if(b){b.classList.add('pending');b.querySelector('.i').outerHTML=ico('load','i spin')}
  const D=compute(),n=D.vis.length;
  const sheets=what==='look'?[LOOK.totals&&'Totals',LOOK.month&&'Per month'].filter(Boolean).join(' and '):what==='both'?'Totals and Per month':what==='month'||S.tab==='month'&&what==='screen'?'Per month':'Totals';
  setTimeout(()=>{renderAll();toast(`<span class="ok">${ico('check')}</span><div><b>${esc(fileName())}</b><em>${sheets} · ${n} ${n===1?'store':'stores'}</em></div>`)},650);
}

/* ── one handler for every press ── */
function toggle(key,v){const s=S.f[key];S.f[key]=s.includes(v)?s.filter(x=>x!==v):[...s,v]}
function afterFilter(){renderAll();if(POP)renderPop();if(SHEET.open)renderSheet()}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'),inPop=!!e.target.closest('#pop');
  if(!t){if(POP&&!inPop)closePop();return}
  const a=t.dataset.act,v=t.dataset.v,key=t.dataset.key;
  const anchor=t.closest('[data-anchor]')?.dataset.anchor;
  if(POP&&!inPop){
    const same=anchor&&POP.anchor===`[data-anchor="${anchor}"]`;
    closePop();
    if(same&&a!=='unchip')return;
  }
  switch(a){
    case 'opt':lastSwitch='o';S.o=v;S.draft=null;if(SHEET.open)closeSheet();swapNext=true;chrome();renderAll();break;
    case 'exp':S.x=+v;lastSwitch='x';chrome();renderAll();break;
    case 'kpi':S.k=v;lastSwitch='k';chrome();renderAll();break;
    case 'tab':S.tab=v;chrome();renderAll();break;
    case 'period':S.period=v;S.range=null;renderAll();break;
    case 'heat':S.heat=!S.heat;renderAll();break;
    case 'filter':if(S.o==='c')openPop('cols','cols');else openSheet();break;
    case 'dates':openPop('dates','dates');break;
    case 'datechip':openPop('datechip','datechip');break;
    case 'dpreset':S.period=v;S.range=null;closePop();break;
    case 'dpick':{POP.kind='dates';const r=range(),b=pd(r.to);CAL={y:b.y,m:b.m,a:S.period==='custom'?S.range.from:null,b:S.period==='custom'?S.range.to:null};renderPop();break}
    case 'cal-nav':{let m=CAL.m+ +v,y=CAL.y;if(m<0){m=11;y--}if(m>11){m=0;y++}CAL.m=m;CAL.y=y;renderPop();break}
    case 'cal-day':if(!CAL.a||CAL.b){CAL.a=v;CAL.b=null}else if(v<CAL.a){CAL.b=CAL.a;CAL.a=v}else CAL.b=v;renderPop();break;
    case 'cal-apply':S.period='custom';S.range={from:CAL.a,to:CAL.b};closePop();break;
    case 'chip':openPop('values','chip-'+key,{key});break;
    case 'unchip':S.f[key]=[];if(S.draft===key)S.draft=null;afterFilter();break;
    case 'clearall':case 'reset':FILTERS.forEach(f=>S.f[f.k]=[]);afterFilter();break;
    case 'col':if(S.f[key].length){openPop('values','chip-'+key,{key})}else{S.draft=key;openPop('values','chip-'+key,{key})}break;
    case 'val':toggle(key,v);afterFilter();break;
    case 'divradio':S.f.divisions=v==='all'?[]:[v];renderAll();break;
    case 'more':S.more[key]=!S.more[key];renderAll();break;
    case 'rail':S.rail=!S.rail;renderAll();break;
    case 'q-clear':S.q='';renderAll();$('#q').focus();break;
    case 'sheet-close':closeSheet();break;
    case 'pane':SHEET.pane=v;SHEET.q='';renderSheet();break;
    case 'saveview':{const i=$('#vname');const n=i.value.trim();if(!n)break;SAVED.push({n,period:S.period,range:S.range,f:JSON.parse(JSON.stringify(S.f))});renderSheet();toast(`<span class="ok">${ico('check')}</span><div><b>Saved ${esc(n)}</b><em>Filter › Saved views</em></div>`);break}
    case 'view':{const sv=SAVED[+v];FILTERS.forEach(f=>S.f[f.k]=[...(sv.f[f.k]||[])]);S.period=sv.period;S.range=sv.range||null;closeSheet();break}
    case 'export':if(S.o==='now'||S.x===1)runExport('screen');else openPop(S.x===2?'xmenu':'xlook','export');break;
    case 'xtile':LOOK[v]=!LOOK[v];if(!LOOK.totals&&!LOOK.month)LOOK[v==='totals'?'month':'totals']=true;renderPop();break;
    case 'xrun':{POP=null;$('#pop').classList.remove('open');renderAll();runExport(v);break}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;renderData()}
  if(e.target.id==='pq'){POPQ=e.target.value;$('#plist').innerHTML=valueRows(POP.key,POPQ)}
  if(e.target.id==='sq'){SHEET.q=e.target.value;$('#slist').innerHTML=sheetList()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(POP)closePop();else if(SHEET.open)closeSheet();return}
  if(e.target.matches?.('input'))return;
  const n=+e.key;
  if(n>=1&&n<=6){lastSwitch='o';S.o=OPTS[n-1].k;S.draft=null;if(POP){POP=null;$('#pop').classList.remove('open')}if(SHEET.open)closeSheet();swapNext=true;chrome();renderAll()}
  if(e.key==='x'){S.x=S.x%3+1;lastSwitch='x';chrome();renderAll()}
  if(e.key==='k'){const i=KPIS.findIndex(x=>x.k===S.k);S.k=KPIS[(i+1)%KPIS.length].k;lastSwitch='k';chrome();renderAll()}
  if(e.key==='t'){S.tab=S.tab==='totals'?'month':'totals';chrome();renderAll()}
});
$('#main').addEventListener('scroll',()=>{if(POP)placePop()},{passive:true});
addEventListener('resize',()=>{if(POP)placePop()});

chrome();renderAll();
</script>
</body>
</html>
