<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Article detail · options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Hub tokens, measured on the running hub (pos-e2e :5480, 8 Oct 2026). */
:root {
  --ink: #20242c; --text: #394150; --body: #565f6d; --mute: #666f7d; --faint: #89919d;
  --hairline: #e6e6e9; --edge: #dadade; --soft: #f8f8f9; --soft-2: #f0f0f2; --soft-3: #f6f6f7;
  --accent: #2563eb; --info-fg: #2c57bf; --tint: #eff5ff;
  --bad-fg: #be123c; --bad-bg: #fbeaea; --warn-fg: #a64a08; --warn-bg: #fdf3ea; --ok-fg: #137a37; --ok-bg: #e8f6e6;
  --rail: #242526;
  --r-card: 10px; --r-inner: 8px; --r-sheet: 16px;
  --shadow-soft: 0 1px 3px rgba(24, 39, 60, .04);
  --shadow-sheet: 0 8px 24px rgba(24, 39, 60, .06), 0 24px 64px rgba(24, 39, 60, .12);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 400 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: -0.09px; color: var(--ink); background: #ececef;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
.mono { font-family: var(--mono); font-size: 14px; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.75; flex-shrink: 0; }

/* ── prototype bar ── */
.proto { position: fixed; inset: 0 0 auto 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--hairline); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--soft-2); border-radius: 10px; }
.seg button { height: 30px; padding: 0 12px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--body); transition: background-color 150ms ease, color 150ms ease; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(24, 39, 60, .08), 0 0 0 1px var(--hairline); }
.proto .what { font-size: 14px; color: var(--mute); }
#stage { position: fixed; inset: var(--barh, 48px) 0 0 0; display: grid; place-items: start center; overflow: hidden; padding: 16px; }
.scaler { position: relative; }
.dev { position: relative; overflow: hidden; background: #fff; border: 1px solid var(--edge); box-shadow: 0 10px 40px rgba(24, 39, 60, .12); }
.dev-desk { width: 1360px; height: 860px; border-radius: 12px; }
.dev-tablet { width: 834px; height: 1112px; border-radius: 28px; }
.dev-phone { width: 414px; height: 896px; border-radius: 36px; }
@media (max-width: 500px) {
  #stage { padding: 0; } .dev-phone { border: 0; border-radius: 0; box-shadow: none; width: 100vw; height: calc(100vh - var(--barh, 48px)); }
}

/* ── hub shell (behind the sheet) ── */
.shell { position: absolute; inset: 0; display: grid; grid-template-columns: 68px 232px minmax(0, 1fr); }
.dev-tablet .shell { grid-template-columns: 68px minmax(0, 1fr); }
.dev-tablet .dept { display: none; }
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; }
.rail .logo { width: 28px; height: 28px; border-radius: 8px; background: #fff; color: var(--rail); font-weight: 700; display: grid; place-items: center; margin-bottom: 14px; font-size: 16px; position: relative; }
.rail .logo::after { content: ""; position: absolute; right: 5px; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.rail .ic { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: #b9bcc2; }
.rail .ic.on { background: rgba(255, 255, 255, .1); color: #fff; }
.dept { background: #fff; border-right: 1px solid var(--hairline); display: flex; flex-direction: column; }
.dept .head { height: 52px; display: flex; align-items: center; padding: 0 16px; font-weight: 600; }
.dept nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.dept nav a { height: 36px; display: flex; align-items: center; padding: 0 10px; border-radius: 8px; color: var(--text); font-size: 14px; }
.dept nav a.on { background: var(--tint); color: var(--accent); font-weight: 500; }
.content { position: relative; overflow: hidden; padding: 14px 28px; background: var(--soft-3); }
.page-title { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 12px 16px; }
.kpi .l { font-size: 14px; color: var(--body); } .kpi .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
.card { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: hidden; }
table.dt { width: 100%; border-collapse: collapse; font-size: 14px; }
.dt th { height: 40px; text-align: left; font-weight: 500; color: var(--body); padding: 0 16px; background: var(--soft); border-bottom: 1px solid var(--hairline); }
.dt td { height: 58px; padding: 0 16px; border-bottom: 1px solid var(--hairline); color: var(--text); }
.dt .r { text-align: right; }
.two { display: flex; flex-direction: column; line-height: 20px; }
.two .a { color: var(--ink); font-weight: 500; } .two .b { color: var(--mute); }

/* phone app behind */
.papp { position: absolute; inset: 0; background: var(--soft-3); display: flex; flex-direction: column; }
.papp .top { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--hairline); font-weight: 600; }
.papp .list { flex: 1; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pcard { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; }
.pcard .big { font-size: 22px; font-weight: 600; text-align: right; line-height: 1.1; } .pcard .big span { display: block; font-size: 14px; font-weight: 400; color: var(--mute); }
.papp .dock { height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid var(--hairline); }
.papp .dock span { display: grid; place-items: center; color: var(--mute); font-size: 14px; }

/* ── the sheet ── */
.scrim { position: absolute; inset: 0; background: rgba(24, 39, 60, .22); transition: opacity 200ms ease; }
.sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; background: #fff; border-radius: var(--r-sheet); box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; overflow: hidden;
  transition: transform 260ms var(--ease-out), opacity 200ms ease, width 240ms var(--ease-out); }
.sheet.enter { transform: translateX(28px); opacity: 0; }
.dev-phone .sheet { top: 44px; left: 0; right: 0; bottom: 0; width: auto !important; border-radius: 18px 18px 0 0; transition: transform 320ms var(--ease-drawer), opacity 200ms ease; }
.dev-phone .sheet.enter { transform: translateY(100%); opacity: 1; }
.dev-phone .sheet::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--edge); margin: 8px auto 0; flex-shrink: 0; }
.sh-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; }
.dev-phone .sh-head { padding: 10px 16px 10px; }
.sh-head .back { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; color: var(--accent); margin-bottom: 4px; }
.sh-head .back svg { width: 16px; height: 16px; }
.sh-head h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sh-head .sub, .idcard .origin { color: var(--mute); font-size: 14px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 0 6px; min-width: 0; }
.origin a { overflow-wrap: anywhere; }
.sh-head .x { margin-left: auto; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); flex-shrink: 0; }
.sh-head .x:hover { background: var(--soft-2); }
.sh-body { flex: 1; overflow-y: auto; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 20px; }
.dev-phone .sh-body { padding: 0 16px 16px; gap: 18px; }
.sh-body > * { flex-shrink: 0; }
.sh-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--hairline); }
.dev-phone .sh-foot { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.dev-phone .sh-foot .btn { height: 44px; flex: 1; }
.btn { height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform 160ms var(--ease-out), background-color 150ms ease; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.soft { background: #fff; border: 1px solid var(--edge); color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .btn.soft:hover { background: var(--soft); } }

/* parts */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
.sec-h .aside { font-size: 14px; font-weight: 400; color: var(--mute); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; }
.facts.one { grid-template-columns: minmax(0, 1fr); }
.dev-phone .facts { grid-template-columns: minmax(0, 1fr); gap: 0; }
.fact .l { font-size: 14px; color: var(--mute); } .fact .v { font-size: 15px; color: var(--ink); overflow-wrap: anywhere; }
.dev-phone .fact { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
.dev-phone .fact:last-child { border-bottom: 0; }
.dev-phone .fact .v { text-align: right; }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--hairline); margin: 0 -20px; padding: 0 20px; position: sticky; top: 0; background: #fff; z-index: 2; }
.dev-phone .subtabs { margin: 0 -16px; padding: 0 16px; }
.subtabs button { position: relative; height: 40px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--body); white-space: nowrap; }
.subtabs button[aria-selected="true"] { color: var(--ink); }
.subtabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }
.subtabs .c { color: var(--faint); font-weight: 400; margin-left: 4px; }
.photo { position: relative; border-radius: var(--r-card); background: var(--soft-3); border: 1px solid var(--hairline); display: grid; place-items: center; overflow: hidden; }
.photo svg { width: 62%; height: 78%; }
.photo .tag { position: absolute; left: 10px; bottom: 10px; font-size: 14px; color: var(--body); background: rgba(255,255,255,.86); padding: 2px 8px; border-radius: 6px; }
.dots { display: flex; flex-wrap: wrap; gap: 8px; }
.dot { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(24, 39, 60, .14); position: relative; transition: transform 160ms var(--ease-out); }
.dot:active { transform: scale(.92); }
.dev-phone .dot::before { content: ""; position: absolute; inset: -6px; }
.photo.swap svg { animation: swapIn 160ms var(--ease-out); }
@keyframes swapIn { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: blur(0); } }
.dot[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ink); }
.dev-phone .dot { width: 32px; height: 32px; }
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
.fig .l { font-size: 14px; color: var(--mute); } .fig .v { font-size: 18px; font-weight: 600; line-height: 24px; font-variant-numeric: tabular-nums; }
.fig .v small { font-size: 14px; font-weight: 400; color: var(--mute); margin-left: 3px; }
.quiet { color: var(--mute); font-size: 14px; }
.grid-wrap { border: 1px solid var(--hairline); border-radius: var(--r-card); overflow-x: auto; overscroll-behavior-x: contain; }
.vg th:first-child, .vg td:first-child { position: sticky; left: 0; z-index: 1; background: #fff; box-shadow: 1px 0 0 var(--hairline); max-width: 180px; }
.vg th:first-child { background: var(--soft); }
table.vg { border-collapse: collapse; width: 100%; font-size: 14px; }
.vg th { height: 38px; padding: 0 10px; font-weight: 500; color: var(--body); background: var(--soft); border-bottom: 1px solid var(--hairline); text-align: right; white-space: nowrap; }
.vg th:first-child { text-align: left; }
.vg td { height: 52px; padding: 0 10px; border-bottom: 1px solid var(--hairline); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); position: relative; }
.vg tr:last-child td { border-bottom: 0; }
.vg td:first-child { text-align: left; }
.vg .cl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.vg .cl i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(24, 39, 60, .14); flex-shrink: 0; }
.vg .cl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vg .diff { color: var(--accent); font-weight: 500; } .vg .low { color: var(--bad-fg); } .vg .off { color: var(--faint); text-decoration: line-through; } .vg .none { color: var(--faint); }
.vg td .s2 { display: block; font-size: 14px; color: var(--mute); line-height: 18px; }
.vg td .pop { display: none; position: absolute; right: 4px; bottom: calc(100% - 6px); z-index: 5; background: #20242c; color: #fff; font-size: 14px; padding: 2px 8px; border-radius: 5px; white-space: nowrap; pointer-events: none; }
@media (hover: hover) { .vg td:hover .pop { display: block; } }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
.row:last-child { border-bottom: 0; }
.row .a { color: var(--ink); font-weight: 500; overflow-wrap: anywhere; } .row .b { color: var(--mute); font-size: 14px; }
.row .r { text-align: right; font-variant-numeric: tabular-nums; }
.dotw { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
.dotw::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dotw.ok::before { background: #36b827; } .dotw.info::before { background: var(--accent); } .dotw.warn::before { background: #c9892e; }
a.lk { color: var(--accent); text-decoration: none; } a.lk:hover { text-decoration: underline; }
/* per-colour list (phone variants: never sideways) */
.colist { display: flex; flex-direction: column; gap: 10px; }
.cobox { border: 1px solid var(--hairline); border-radius: var(--r-card); overflow: hidden; }
.cobox .ch { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--soft); }
.cobox .ch i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(24, 39, 60, .14); flex-shrink: 0; }
.cobox .ch b { font-weight: 500; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cobox .sz { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px; border-top: 1px solid var(--hairline); align-items: baseline; font-variant-numeric: tabular-nums; }
.cobox .sz .k { font-weight: 500; } .cobox .sz .m { color: var(--mute); font-size: 14px; } .cobox .sz .r { text-align: right; }

/* figures, period, places */
.fig .note { font-size: 14px; color: var(--mute); }
.pseg { align-self: flex-start; }
.vg.pt td:first-child { max-width: 260px; }
.vg .tot td { font-weight: 600; background: var(--soft); }
.vg s, .prow2 s, .rows s, .cobox s { color: var(--faint); }
.bands { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.prow2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--hairline); }
.prow2 .pl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.prow2 .pl b { font-weight: 500; overflow-wrap: anywhere; }
.prow2 .lead { text-align: right; font-size: 18px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.prow2 .lead span { display: block; font-size: 14px; font-weight: 400; color: var(--mute); }

.kpis-plain { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 16px; }
.kpis-plain .figs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dev-phone .kpis-plain .figs, .dev-tablet .kpis-plain .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.hero > .figs { align-content: start; }

.sws { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.sw { display: inline-flex; align-items: center; gap: 6px; height: 28px; font-size: 15px; color: var(--body); transition: color 150ms ease; }
.sw i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(24, 39, 60, .16); flex-shrink: 0; transition: box-shadow 150ms ease; }
.sw[aria-pressed="true"] { color: var(--ink); font-weight: 500; }
.sw[aria-pressed="true"] i { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }
.sw:active { transform: scale(.97); }
.dev-phone .sw { height: 36px; }
.dev-phone .fact .v .sws { justify-content: flex-end; }

.side { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
.side-l { display: flex; flex-direction: column; gap: 18px; }
.dev-tablet .side { grid-template-columns: 260px minmax(0, 1fr); }
.panel { padding-bottom: 16px; }

/* the shop block */
.buy { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.price { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.3px; font-variant-numeric: tabular-nums; }
.price s { color: var(--faint); font-weight: 500; }
.ident .nm { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.2px; overflow-wrap: anywhere; }
.sh-head.slim { padding: 10px 12px 0; justify-content: flex-end; }
.dev-phone .sh-head.slim { padding: 4px 10px 0; }
.price-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.mk { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--ok-bg); color: var(--ok-fg); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mk.neg { background: var(--bad-bg); color: var(--bad-fg); }
.opt-l { font-size: 14px; color: var(--mute); margin-bottom: 8px; } .opt-l b { color: var(--ink); font-weight: 500; margin-left: 4px; }
.szs { display: flex; flex-wrap: wrap; gap: 6px; }
.szc { min-width: 38px; height: 30px; padding: 0 10px; font-size: 14px; border: 1px solid var(--edge); border-radius: 8px; background: #fff; font-weight: 500; transition: background-color 150ms ease, border-color 150ms ease, transform 160ms var(--ease-out); }
.szc:active { transform: scale(.97); }
.szc[aria-pressed="true"] { background: var(--tint); border-color: var(--accent); color: var(--accent); }
.szc.out { color: var(--faint); text-decoration: line-through; }
.dev-phone .szc { height: 40px; min-width: 44px; }
.avail { font-size: 14px; color: var(--mute); display: flex; gap: 10px; align-items: baseline; }
.avail b { font-size: 15px; font-weight: 600; color: var(--ink); }
.kind { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--hairline); min-width: 0; }
.div-l { display: flex; align-items: flex-start; gap: 8px; color: var(--ink); font-weight: 500; line-height: 22px; }
.div-l span { min-width: 0; overflow-wrap: anywhere; }
.div-l svg { width: 16px; height: 16px; margin-top: 3px; color: var(--mute); }
.tags-l { display: flex; align-items: flex-start; gap: 8px; color: var(--mute); font-size: 14px; line-height: 22px; }
.tags-l > svg { width: 16px; height: 16px; margin-top: 3px; }
.tags-l > span { min-width: 0; display: flex; flex-wrap: wrap; gap: 0 14px; }
.tg { overflow-wrap: anywhere; }
.shop { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
.dev-tablet .shop { grid-template-columns: 240px minmax(0, 1fr); }
/* the variants matrix */
.mini { width: 36px; height: 36px; border-radius: 8px; background: var(--soft-3); display: grid; place-items: center; flex-shrink: 0; }
.mini svg { width: 28px; height: 28px; }
.vg.mx td { height: auto; padding: 8px 6px; vertical-align: top; }
.vg.mx th { padding: 0 6px; }
.vg.mx td:first-child, .vg.mx th:first-child { padding-left: 10px; }
.vg.mx .cl span:last-child { white-space: normal; overflow: visible; text-overflow: clip; }
.vg.mx td:first-child { vertical-align: middle; }
.vg.mx .cellb { cursor: pointer; transition: background-color 150ms ease; }

</div>

const DIVISIONS = ["Wanita", "Pria", "Anak", "Aksesoris"]
const TAG_BOOK = [...new Set(["Atasan", "Bawahan", "Kaos", "Kemeja", "Blus", "Celana", "Rok", "Jaket", "Dress", "Hijab", "Basic", "Office", "Casual", "Sale", "Clearance", "Lebaran", "Natal", "Payday", "Back to school", "Best seller Q3", "Premium Cotton", "Ramadan 2026", "Kemeja Formal Lengan Panjang", ...Array.from({ length: 230 }, (_, i) => `Koleksi ${String(i + 1).padStart(3, "0")}`)])].sort((x, y) => x.localeCompare(y))
const picKey = (o) => Object.entries(o).filter(([, v]) => v === "new").map(([k]) => k).sort().join(",")
const startEdit = () => { const a = D(); S.editing = true; S.discarding = false; S.tagq = ""; S.tagOpen = false; S.draft = { name: a.name, division: a.division, tags: [...a.tags], active: a.active !== false, main: a.main || "set", pics: { ...(a.pics || {}) } } }
const dirty = () => { const a = D(), d = S.draft; return d.name.trim() !== a.name || d.division !== a.division || [...d.tags].sort().join("|") !== [...a.tags].sort().join("|") || d.active !== (a.active !== false) || d.main !== (a.main || "set") || JSON.stringify(Object.entries(d.pics).sort()) !== JSON.stringify(Object.entries(a.pics || {}).sort()) }
const valid = () => S.draft.name.trim() !== ""
const canSave = () => dirty() && valid()
/// Tags are a vocabulary of hundreds: the ones this article carries are tokens, the rest are searched.
const tagMatches = () => { const q = (S.tagq || "").trim().toLowerCase(); return TAG_BOOK.filter((t) => !S.draft.tags.includes(t) && (!q || t.toLowerCase().includes(q))) }
function tagListHtml() {

  return (shown.length ? shown.map((t) => `<button type="button" role="option" class="topt" data-act="addtag" data-v="${esc(t)}">${esc(t)}</button>`).join("") : `<div class="tmore">No tag matches “${esc(S.tagq || "")}”</div>`) + (m.length > 8 ? `<div class="tmore">${n(m.length - 8)} more, keep typing</div>` : "")
}
/// A thumbnail of what the colour shows now: its own picture, the main picture (dashed), or nothing.

}
const newBadge = '<span class="newb">New</span>'

const picActions = (c, st, main) => st

const picCaption = (st, main) => (st ? "" : `<span class="quiet">${main === "none" ? "No picture" : "Main picture"}</span>`)
/// The variants matrix again, with each colour's picture editable. Quantities and prices stay read-only.

        <div class="taglist" id="tag-list" role="listbox" aria-label="Tags" ${S.tagOpen ? "" : "hidden"}>${tagListHtml()}</div></div></div>
    <div class="stat-box span2"><span class="stat-t"><span id="st-l" class="stat-h">${d.active ? "Active" : "Non-active"}</span><span class="stat-s">${d.active ? "Shown in the catalogue." : "Hidden from the catalogue."}</span></span>
      <button type="button" role="switch" class="swt" aria-checked="${d.active}" aria-labelledby="st-l" data-act="status"><span></span></button></div></div>
  <section><h3 class="sec-h">Variants <span class="aside">${n(totals().all)} pcs</span></h3>${matrixEdit()}</section>`
}
function editFoot() {
  if (S.discarding) return `<footer class="sh-foot"><span class="said">Discard your changes?</span><span class="grow"></span><button class="btn soft" data-act="keep">Keep editing</button><button class="btn danger" data-act="discard">Discard</button></footer>`

/* ═══ render ═══ */
function bar() {
  return `<div class="seg">${[["desk", "Desk"], ["tablet", "Tablet"], ["phone", "Phone"]].map(([v, l]) => `<button data-act="dev" data-v="${v}" aria-pressed="${S.dev === v}">${l}</button>`).join("")}</div>
    <div class="seg"><button data-act="worst" data-v="0" aria-pressed="${!S.worst}">Demo data</button><button data-act="worst" data-v="1" aria-pressed="${S.worst}">Worst case</button></div>
    <span class="what">Wide sheet: the picture beside price, colours and sizes. On a phone the same, stacked.</span>`
}
function render(enter) {
  const bscroll = document.getElementById("bscroll"), keep = bscroll ? bscroll.scrollTop : 0
  document.getElementById("bar").innerHTML = bar()
  document.documentElement.style.setProperty("--barh", document.getElementById("bar").offsetHeight + "px")
  let inner
  {
    const o = { A: optA, B: optB }[S.opt]()
    const back = phone() ? phoneBack() : shell(articleList())
    inner = `<div class="dev dev-${S.dev}">${back}<div class="scrim" data-act="close"></div>${S.toast ? `<div class="toast" role="status">${ic("check")}${esc(S.toast)}</div>` : ""}<section class="sheet ${enter ? "enter" : ""}" style="${phone() ? "" : `width:${o.width}px`}" role="dialog" aria-label="Article">${o.html}</section></div>`
  }
  const scaler = document.getElementById("scaler")
  scaler.innerHTML = inner
  if (window.lucide) lucide.createIcons()
  fit()
  S.swap = false
  const nb = document.getElementById("bscroll"); if (nb) nb.scrollTop = keep
  if (enter) requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".enter").forEach((e) => e.classList.remove("enter"))))
}
function fit() {
  const dev = document.querySelector(".dev"), stage = document.getElementById("stage"), scaler = document.getElementById("scaler")
  if (!dev) return
  if (innerWidth <= 500 && S.dev === "phone") { dev.style.transform = "none"; scaler.style.width = ""; scaler.style.height = ""; return }
  const w = dev.offsetWidth, h = dev.offsetHeight
  const k = Math.min(1, (stage.clientWidth - 32) / w, (stage.clientHeight - 32) / h)
  scaler.style.width = `${w * k}px`
  scaler.style.height = `${h * k}px`
  dev.style.transformOrigin = "top left"
  dev.style.transform = `scale(${k})`
}
addEventListener("resize", fit)
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) { if (e.target.closest("a[href='#']")) e.preventDefault(); return }
  if (el.tagName === "A") e.preventDefault()
  const v = el.dataset.v, act = el.dataset.act
  if (act === "opt") { S.opt = v; render(true) }
  else if (act === "dev") { S.dev = v; render(true) }
  else if (act === "worst") { S.worst = v === "1"; S.colour = 0; S.editing = false; S.discarding = false; render(false) }
  else if (act === "colour") { S.colour = Number(el.dataset.i); S.swap = true; render(false) }
  else if (act === "size") { S.size = Number(el.dataset.i); render(false) }
  else if (act === "cell") { S.colour = Number(el.dataset.c); S.size = Number(el.dataset.s); S.swap = true; render(false) }
  else if (act === "edit") { startEdit(); render(false) }
  else if (act === "pic") { const digit = el.dataset.c; if (v === "inherit") delete S.draft.pics[digit]; else S.draft.pics[digit] = v; render(false) }
  else if (act === "mainpic") { S.draft.main = v; render(false) }
  else if (act === "addtag") { if (!S.draft.tags.includes(v)) S.draft.tags.push(v); S.tagOpen = true; render(false); refocusTag() }
  else if (act === "untag") { S.draft.tags = S.draft.tags.filter((t) => t !== v); render(false); refocusTag() }
  else if (act === "status") { S.draft.active = !S.draft.active; render(false) }
  else if (act === "keep") { S.discarding = false; render(false) }
  else if (act === "discard") { S.editing = false; S.discarding = false; render(false) }
  else if (act === "save") {
    if (!canSave()) return
    const a = D(), d = S.draft
    a.name = d.name.trim(); a.division = d.division; a.tags = [...d.tags]; a.active = d.active; a.main = d.main; a.pics = { ...d.pics }
    S.editing = false; S.toast = "Saved"; render(false)
    clearTimeout(window.__t); window.__t = setTimeout(() => { S.toast = null; render(false) }, 2200)
  }
  else if (act === "close") {
    if (S.editing) { if (dirty()) { S.discarding = true } else { S.editing = false } render(false); return }
    const s = document.querySelector(".sheet"); if (s) { s.classList.add("enter"); setTimeout(() => render(true), 260) }
  }
})
/// Typing never re-renders: the box would lose its caret. Only the Save button, the error and the tag list follow.
function refocusTag() { const i = document.getElementById("f-tag"); if (i && S.tagOpen) { i.focus(); i.setSelectionRange(i.value.length, i.value.length) } }
document.addEventListener("input", (e) => {
  if (e.target.matches && e.target.matches("[data-tagq]")) { S.tagq = e.target.value; S.tagOpen = true; const l = document.getElementById("tag-list"); l.hidden = false; l.innerHTML = tagListHtml(); return }
  const el = e.target.closest("[data-in]"); if (!el || !S.draft) return
  S.draft[el.dataset.in] = el.value
  if (el.dataset.in === "division") { const v = document.getElementById("div-v"); if (v) { v.textContent = el.value || "Unclassified"; v.className = el.value ? "" : "quiet" } }
  const save = document.getElementById("save"); if (save) save.disabled = !canSave()
  const err = document.getElementById("f-name-err"); if (err) err.hidden = valid()
  const box = document.getElementById("f-name"); if (box) box.classList.toggle("err", !valid())
})
document.addEventListener("focusin", (e) => { if (e.target.id === "f-tag") { S.tagOpen = true; const l = document.getElementById("tag-list"); if (l) { l.hidden = false; l.innerHTML = tagListHtml() } } })
document.addEventListener("click", (e) => { const bx = e.target.closest(".tbx"); if (bx && !e.target.closest("button, input")) { const i = document.getElementById("f-tag"); if (i) i.focus() } })
document.addEventListener("click", (e) => { if (S.tagOpen && !e.target.closest(".tagbox")) { S.tagOpen = false; const l = document.getElementById("tag-list"); if (l) l.hidden = true } })
document.addEventListener("keydown", (e) => {
  const t = e.target
  if (t.id === "f-tag") {
    if (e.key === "Enter") { e.preventDefault(); const m = tagMatches(); if (m.length) { S.draft.tags.push(m[0]); S.tagq = ""; S.tagOpen = true; render(false); refocusTag() } }
    else if (e.key === "Escape") { S.tagOpen = false; document.getElementById("tag-list").hidden = true }
    else if (e.key === "Backspace" && !t.value && S.draft.tags.length) { S.draft.tags.pop(); render(false); refocusTag() }
  }
})
render(true)
</script>
</body>
</html>
