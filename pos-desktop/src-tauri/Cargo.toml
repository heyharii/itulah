[package]
name = "pos-desktop"
version = "0.1.0"
edition = "2021"
description = "The counter, as a desktop terminal over a store-edge node"
publish = false

[lib]
name = "pos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking, on Tauri's own worker threads. A till makes one call at a time and
# waits for it in front of a customer; an async runtime here would buy
# concurrency nobody at a counter can use, and cost a second scheduler.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
