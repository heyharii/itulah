[package]
name = "pos-desktop"
version = "0.1.0"
edition = "2021"
description = "The counter, as a desktop terminal over a store-edge node"
publish = false

[lib]
name = "pos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking, on Tauri's own worker threads. A till makes one call at a time and
# waits for it in front of a customer; an async runtime here would buy
# concurrency nobody at a counter can use, and cost a second scheduler.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# The terminal signs its own claims. Same construction the RFID lane already
# uses on the node (`backend/src/edge/rfid.rs`), so the two ends cannot drift:
# HMAC-SHA256 over method, path, terminal, clock, sequence and body.
hmac = "0.12"
sha2 = "0.10"
# Finding the shop's node on the LAN (`src/discovery.rs`): a DNS-SD browse
# for `_itulah-store._tcp`, the service the node advertises
# (`backend/src/edge/discovery.rs`). Its own thread and sockets; default
# features off because they are an async receiver and `log`, and this shell
# listens for three seconds on a blocking thread and logs to stderr.
mdns-sd = { version = "0.21", default-features = false }
# The key a till mints when it joins its node (`src/join.rs`), from the
# operating system's generator. Already in the lock file under Tauri.
getrandom = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.7.4"
