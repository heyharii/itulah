<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allotment review flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens: frontend-hub/design-system/tokens.css (All white). Board, cards and sheets copied from allotment-board-options.html (17 Oct, measured on :5350). */
:root {
  --ink: #1d1d1f; --body: #6e6e73; --mute: #6e6e73; --faint: #c7c7cc;
  --canvas: #fff; --soft: #fafafb; --soft-2: #f2f2f5; --segment-track: #f2f2f4;
  --row-line: #eeeef1; --hairline: #e8e8ec; --hairline-strong: #c7c7cc; --stone: #e8ebf0;
  --accent: #2862dc; --accent-bg: #eef3fc; --warn: #c9892e; --warn-fg: #a66c1f; --warn-bg: #fbf3e6;
  --bad-fg: #d70015; --bad-bg: #fdecee; --ok: #36b827; --ok-fg: #248a3d; --ok-bg: #eaf6ec;
  --shadow-soft: 0 1px 2px rgba(0,0,0,.04); --shadow-segment: 0 1px 3px rgba(0,0,0,.12);
  --hatch: repeating-linear-gradient(135deg, color-mix(in oklab, var(--ink) 5%, transparent) 0 7px, transparent 7px 14px);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --font: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; font-family: var(--font); font-size: 15px; line-height: 1.45; color: var(--ink); background: var(--stone); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { display: block; }
p { margin: 0; }

/* ── Prototype chrome ─────────────────────────────────────────────────── */
.chrome { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--canvas); border-bottom: 1px solid var(--hairline); }
.chrome .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; flex-basis: 100%; }
.chrome .row[hidden] { display: none; }
.lab { color: var(--body); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--segment-track); max-width: 100%; }
.seg[hidden] { display: none; }
.seg button { height: 30px; padding: 0 11px; border: 0; border-radius: 6px; background: none; color: var(--body); font-weight: 500; white-space: nowrap; cursor: pointer; }
.seg button[aria-pressed="true"] { border-radius: 7px; background: var(--canvas); color: var(--ink); box-shadow: var(--shadow-segment); }
.seg .n { margin-left: 6px; color: var(--warn-fg); font-weight: 600; }
.chrome .reset, .chrome .helper { height: 30px; border: 0; background: none; color: var(--accent); font-weight: 500; cursor: pointer; }
.chrome .reset { margin-left: auto; }
.chrome .helper[hidden] { display: none; }

/* ── Shell ────────────────────────────────────────────────────────────── */
.stage { position: relative; flex: 1 0 auto; min-height: 640px; display: flex; gap: 12px; width: 100%; margin: 0 auto; padding: 12px; overflow: hidden; }
.stage[data-device="phone"] { flex: none; height: 860px; min-height: 0; max-width: 414px; margin: 12px auto; padding: 0; border-radius: 28px; background: var(--canvas); box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 20px 50px rgba(0,0,0,.12); }
.stage[data-device="phone"] .panel { display: none; }
.panel { flex: none; width: 216px; display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; border-radius: 12px; background: var(--canvas); }
.panel h2 { margin: 2px 10px 12px; font-size: 17px; font-weight: 600; }
.panel .chip { margin: 12px 10px 6px; align-self: flex-start; padding: 0 8px; border-radius: 6px; background: var(--soft-2); color: var(--body); font-size: 12px; line-height: 22px; }
.nav { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--ink); }
.nav.on { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--bad-fg); color: #fff; font-weight: 600; font-size: 13px; line-height: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.page { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px 24px; border-radius: 16px; background: var(--canvas); box-shadow: 0 0 0 1px rgba(0,0,0,.05); overflow: hidden; }
.stage[data-device="phone"] .page { padding: 0; border-radius: 0; box-shadow: none; }
.head { flex: none; display: flex; align-items: center; gap: 8px; min-height: 40px; margin-bottom: 16px; }
.head h1 { margin: 0 auto 0 0; font-size: 17px; line-height: 24px; font-weight: 600; }
.ghost { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--canvas); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color 150ms ease, transform 160ms var(--ease-out); }
.ghost:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .ghost:hover { background: var(--soft); } }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }

/* ── Lanes + cards (board) ────────────────────────────────────────────── */
.lanes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr) 16px minmax(0, 1fr); gap: 4px; }
.arrow { display: flex; justify-content: center; padding-top: 17px; color: var(--faint); }
.lane { min-height: 0; display: flex; flex-direction: column; border-radius: 12px; background: var(--soft-2); }
.lane-h { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.lane-h h2 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
.lane-h .n { margin-left: auto; color: var(--body); font-weight: 500; font-variant-numeric: tabular-nums; }
.lane-b { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 0 8px 8px; }
.none { padding: 28px 8px; text-align: center; color: var(--body); }
.card { position: relative; flex: none; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--hairline); border-radius: 10px; background: var(--canvas); box-shadow: var(--shadow-soft); text-align: left; cursor: pointer; transition: border-color 150ms var(--ease-out), transform 160ms var(--ease-out); }
.card:active:not(.off) { transform: scale(.985); }
@media (hover: hover) and (pointer: fine) { .card:not(.off):hover { border-color: var(--hairline-strong); } }
.card.off { background: var(--soft); cursor: default; }
.card.off .c-in { opacity: .6; }
.card.arrive { animation: arrive 900ms var(--ease-out); }
@keyframes arrive { 0% { box-shadow: 0 0 0 3px rgba(40,98,220,.45); border-color: var(--accent); } 100% { box-shadow: 0 0 0 0 rgba(40,98,220,0); } }
.strip { flex: none; display: flex; align-items: center; height: 28px; padding: 0 16px; color: #fff; font-weight: 600; white-space: nowrap; }
.strip.info { background: var(--accent); }
.strip.warn { background: var(--warn-fg); }
.strip.grey { background: var(--soft-2); color: var(--body); }
.c-in { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; }
.c-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.c-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; line-height: 24px; font-weight: 600; }
.c-fig { flex: none; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.c-fig small { font-size: 15px; font-weight: 400; color: var(--body); }
.c-sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--body); }
.c-lines { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--hairline); }
.c-line { display: flex; justify-content: space-between; gap: 12px; color: var(--body); font-variant-numeric: tabular-nums; }
.c-line .wait { color: var(--warn-fg); font-weight: 500; }
.c-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 30px; margin-top: 10px; }
.c-meta { min-width: 0; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tint { flex: none; display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-weight: 600; white-space: nowrap; }
.tint.mute { color: var(--body); font-weight: 500; }
.chev { flex: none; margin-right: -4px; color: var(--faint); }

/* ── Phone board / lists ──────────────────────────────────────────────── */
.ph-top { flex: none; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 20px; border-bottom: 1px solid var(--hairline); font-size: 20px; font-weight: 600; }
.ph-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 104px; }
.ph-h { display: flex; align-items: center; gap: 8px; padding: 14px 4px 8px; }
.ph-h b { font-size: 16px; font-weight: 600; }
.ph-h .n { color: var(--mute); font-variant-numeric: tabular-nums; }
.ph-sec { display: flex; flex-direction: column; gap: 10px; }
.dock { position: absolute; left: 10px; right: 10px; bottom: 14px; z-index: 6; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 28px; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.12); }
.dock select { flex: 1; height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: var(--soft-2); font-weight: 500; outline: none; }

/* ── MD page ──────────────────────────────────────────────────────────── */
.kpis { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-bottom: 18px; }
.kpi { padding: 0 16px; border-left: 1px solid var(--hairline); }
.kpi:first-child { padding-left: 0; border-left: 0; }
.kpi .l { color: var(--body); font-size: 14px; }
.kpi .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .v.bad { color: var(--bad-fg); }
.kpi .v.warn { color: var(--warn-fg); }
.tabs { flex: none; display: flex; gap: 24px; margin-bottom: 16px; border-bottom: 1px solid var(--hairline); }
.tabs button { position: relative; height: 40px; padding: 0; border: 0; background: none; color: var(--body); font-weight: 500; cursor: pointer; }
.tabs button .n { margin-left: 6px; color: var(--mute); font-variant-numeric: tabular-nums; }
.tabs button .n.hot { color: var(--warn-fg); font-weight: 600; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
.dcard { border: 1px solid var(--hairline); border-radius: 12px; background: var(--canvas); }
.dcard.fresh { animation: arrive 900ms var(--ease-out); }
.d-in { padding: 16px 18px; }
.d-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.d-sup { font-size: 17px; line-height: 24px; font-weight: 600; }
.d-fig { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.d-fig.warn { color: var(--warn-fg); }
.d-sub { color: var(--body); }
.d-sub .mono, .mono { font-family: var(--mono); font-size: 14px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tile { display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 8px; background: var(--soft-2); }
.tile b { font-weight: 500; }
.tile .w { display: inline-flex; align-items: center; gap: 6px; color: var(--body); }
.tile .w i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.tile .w.info i { background: var(--accent); } .tile .w.ok i { background: var(--ok); } .tile .w.pk i { background: var(--warn); }
.tile.review { background: var(--warn-bg); }
.tile.review .w { color: var(--warn-fg); font-weight: 600; }
.tile.review .w i { background: var(--warn-fg); }
.d-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--hairline); }
.d-foot .who { margin-right: auto; color: var(--body); }
.why-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 10px; }
.tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 7px; font-weight: 500; white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
.tag.bad { background: var(--bad-bg); color: var(--bad-fg); }
.tag.info { background: var(--accent-bg); color: var(--accent); }
.tag.ok { background: var(--ok-bg); color: var(--ok-fg); }
.tag.grey { background: var(--soft-2); color: var(--body); }
.empty { padding: 56px 16px; text-align: center; color: var(--body); }

/* ── Buttons ──────────────────────────────────────────────────────────── */
.btn-s { flex: none; height: 30px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform 160ms var(--ease-out), filter 150ms ease; }
.btn-s.red { background: var(--bad-fg); }
.btn-s:disabled { opacity: .35; cursor: default; filter: none; transform: none; }
.btn-s.ghost { border: 1px solid var(--hairline); background: var(--canvas); color: var(--ink); font-weight: 500; }
@media (hover: hover) and (pointer: fine) { .btn-s.ghost:hover { filter: none; background: var(--soft); } }
.btn-s:active, .btn:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .btn-s:hover, .btn:hover { filter: brightness(1.08); } }
.btn { height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform 160ms var(--ease-out), filter 150ms ease, opacity 150ms ease; }
.btn:disabled { opacity: .4; cursor: default; filter: none; transform: none; }
.btn.ghosty { border: 1px solid var(--hairline); background: var(--canvas); color: var(--ink); }
.btn.red { background: var(--bad-fg); color: #fff; }
.plain { height: 40px; padding: 0 4px; border: 0; background: none; color: var(--accent); font-weight: 500; cursor: pointer; white-space: nowrap; }
.plain.red { color: var(--bad-fg); }

/* ── Sheet ────────────────────────────────────────────────────────────── */
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(208,208,213,.48); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease-out); }
.scrim.on { opacity: 1; pointer-events: auto; transition-duration: 340ms; }
.sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; z-index: 31; width: min(760px, calc(100% - 24px)); display: flex; flex-direction: column; border-radius: 16px; background: var(--canvas); box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 24px 64px rgba(0,0,0,.14); transform: translateX(calc(100% + 24px)); transition: transform 200ms var(--ease-out); }
.sheet.on { transform: none; transition: transform 340ms var(--ease-drawer); }
/* A narrow window gives the lanes the room the side menu would take. */
@media (max-width: 900px) { .stage[data-device="desk"] .panel { display: none; } .stage[data-device="desk"] .page { padding: 16px; } }
/* Desk: the sheet, its veil and the toasts hold to the window, so a short window still shows them. */
.stage[data-device="desk"] .scrim, .stage[data-device="desk"] .sheet, .stage[data-device="desk"] .toasts { position: fixed; }
.stage[data-device="phone"] .sheet { top: 8px; right: 8px; bottom: 8px; width: calc(100% - 16px); border-radius: 22px; }
.sh-h { flex: none; display: flex; align-items: flex-start; gap: 12px; padding: 22px 24px 16px; border-bottom: 1px solid var(--hairline); }
.sh-h .eyebrow { color: var(--body); }
.sh-h h3 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; }
.x { flex: none; display: grid; place-items: center; width: 36px; height: 36px; margin: -6px -8px 0 auto; border: 0; border-radius: 8px; background: none; color: var(--body); cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .x:hover { background: var(--soft-2); color: var(--ink); } }
.sh-b { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 24px 20px; }
.stage[data-device="phone"] .sh-b, .stage[data-device="phone"] .sh-h, .stage[data-device="phone"] .sh-f { padding-left: 16px; padding-right: 16px; }
.sh-f { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 12px; padding: 14px 24px; border-top: 1px solid var(--hairline); }
.sh-f .note { margin-right: auto; color: var(--body); }
.sh-f .note.bad { color: var(--bad-fg); }
.sh-f .left { margin-right: auto; }
.stage[data-device="phone"] .sh-f .btn { flex: 1; height: 44px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 20px 0 6px; font-weight: 600; }
.sec-h span { color: var(--body); font-weight: 400; }
.sh-b > .sec-h:first-child { margin-top: 8px; }
.art-h { display: flex; align-items: center; gap: 12px; margin: 16px 0 4px; }
.sw { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.thumb { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--soft-2); color: var(--body); }
.art-h b { display: block; font-weight: 600; }
.art-h span { color: var(--body); }
.t { width: 100%; border-collapse: collapse; }
.t th { height: 40px; color: var(--body); font-weight: 500; text-align: left; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
.t td { height: 52px; border-bottom: 1px solid var(--row-line); font-variant-numeric: tabular-nums; }
.t tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; }
.t .sub { display: block; color: var(--body); font-family: var(--mono); font-size: 14px; }
.t .bad { color: var(--bad-fg); font-weight: 600; }
.t .warn { color: var(--warn-fg); font-weight: 600; }
.t .ok { color: var(--ok-fg); }
.t tfoot td { height: 48px; font-weight: 600; border-top: 1px solid var(--hairline); border-bottom: 0; }
.step { display: inline-flex; align-items: center; height: 36px; border: 1px solid var(--hairline); border-radius: 8px; }
.step button { width: 34px; height: 34px; border: 0; background: none; color: var(--body); font-size: 17px; cursor: pointer; }
.step button:disabled { opacity: .3; cursor: default; }
.step b { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
.chips button { height: 36px; padding: 0 14px; border: 1px solid var(--hairline); border-radius: 18px; background: var(--canvas); cursor: pointer; transition: transform 160ms var(--ease-out), background-color 150ms ease; }
.chips button:active { transform: scale(.97); }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.lbl { display: block; margin: 18px 0 6px; font-weight: 500; }
.lbl span { color: var(--bad-fg); }
.field { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--canvas); outline: none; }
textarea.field { height: 72px; padding: 10px 12px; resize: none; }
.field:focus { border-color: var(--accent); }
.tick { display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid var(--row-line); cursor: pointer; }
.tick input { width: 18px; height: 18px; accent-color: var(--accent); }
.tick.red input { accent-color: var(--bad-fg); }
.tick .grow { flex: 1; }
.tick .sub { display: block; color: var(--body); }
.why-box { display: flex; flex-direction: column; gap: 2px; margin: 12px 0 4px; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); }
.why-box b { color: var(--warn-fg); font-weight: 600; }
.why-box span { color: var(--body); }
.rkpi { display: flex; flex-wrap: wrap; gap: 0; margin: 12px 0 4px; }
.rkpi[hidden] { display: none; }
.rkpi .kpi { min-width: 96px; }
.receipt { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.receipt .r-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--hairline); border-radius: 10px; }
.receipt .r-row svg { flex: none; margin-top: 2px; }
.receipt .r-row b { font-weight: 600; }
.receipt .r-row span { display: block; color: var(--body); }
.pair { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin: 8px 0; border: 1px solid var(--warn); border-radius: 10px; background: var(--warn-bg); }
.pair .grow { flex: 1; min-width: 0; }
.pair b { display: block; font-weight: 600; }
.pair span { display: block; color: var(--body); }
.scan { position: relative; }
.scan svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--mute); }
.scan input { padding-left: 38px; }
.cnt { width: 64px; height: 40px; border: 1px solid var(--hairline); border-radius: 8px; text-align: center; font-weight: 600; outline: none; }
.cnt:focus { border-color: var(--accent); }
.rm { width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--body); cursor: pointer; }
.stampw { display: inline-block; rotate: -6deg; padding: 0 10px; border: 2.5px double currentColor; border-radius: 8px; font-size: 13px; line-height: 24px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.stampw.ok { color: var(--ok-fg); }

  if (d.nao) out.push({ sku: null, n: d.nao });

function stageOf(alt, store) {
  if (openReviews().some((r) => r.alt === alt && r.stores.includes(store))) return ['Review', 'review'];
  const dl = S.deliveries.filter((d) => d.alt === alt && d.store === store);
  const pick = S.picks.find((p) => p.alt === alt && p.store === store && p.state === 'open');
  const inPile = (S.piles[store] || []).some((l) => l.alt === alt);
  const inKoli = S.koli.some((k) => k.store === store && k.state === 'ready' && k.lines.some((l) => l.alt === alt));
  if (pick) return [inPile || inKoli || dl.length ? 'Picking' : 'To pick', ''];
  if (inPile) return ['Picked', ''];
  if (inKoli) return ['Packed', 'pk'];
  if (dl.length) return dl.every((d) => d.state === 'done') ? ['Received', 'ok'] : ['Dispatched', 'info'];

}

/* MD review */
function receiveSummary(r) {
  const ds = r.stores.map((s) => S.deliveries.find((d) => d.trip === r.trip && d.alt === r.alt && d.store === s));
  const diff = {}; // sku -> {store: diff}
  let nao = 0, sent = 0, counted = 0;
  for (const d of ds) {
    if (!d || d.state !== 'review') continue;
    nao += d.nao; sent += sumOf(d.sent); counted += sumOf(d.count) + d.nao;
    for (const sku of new Set([...Object.keys(d.sent), ...Object.keys(d.count)])) {
      const v = (d.count[sku] || 0) - (d.sent[sku] || 0);
      if (v) (diff[sku] ||= {})[d.store] = v;
    }
  }
  const pairs = [], shorts = [], extras = [];
  for (const [sku, by] of Object.entries(diff)) {
    const minus = Object.entries(by).filter(([, v]) => v < 0).map(([s, v]) => [s, -v]);
    const plus = Object.entries(by).filter(([, v]) => v > 0);
    for (const m of minus) for (const p of plus) {
      const n = Math.min(m[1], p[1]);
      if (n > 0) { pairs.push({ sku, from: m[0], to: p[0], n }); m[1] -= n; p[1] -= n; }
    }
    for (const [s, v] of minus) if (v > 0) shorts.push({ sku, store: s, n: v });
    for (const [s, v] of plus) if (v > 0) extras.push({ sku, store: s, n: v });
  }
  return { ds, pairs: pairs.reduce((a, p) => a + p.n, 0), short: shorts.reduce((a, p) => a + p.n, 0), extra: extras.reduce((a, p) => a + p.n, 0), nao, sent, counted, pairList: pairs, shortList: shorts, extraList: extras };
}

    N: `${note || (left ? `<span class="note">${left} to decide</span>` : '')}<button class="btn" data-act="decide" data-v="mix" ${lock || (left ? 'disabled' : '')}>Done</button>`,
    O: counts && `${['asis', 'refill'].map((w) => `<button class="opt" role="radio" aria-checked="${S.sheet.way === w}" data-act="way" data-v="${w}"><b>${WAY[w]}</b>${counts[w].map((t) => `<span>${t}</span>`).join('')}</button>`).join('')}<span class="opt-go">${note}<button class="btn" data-act="decide" data-v="${S.sheet.way}" ${lock || (S.sheet.way ? '' : 'disabled')}>Confirm</button></span>`,
  }[sm];
  return `${head(`At the store · <span class="mono">${r.alt}</span> · <span class="mono">${r.trip}</span>`, artOf(r.alt).name)}
    <div class="sh-b">
      <div class="rkpi"${sm === 'S' ? ' hidden' : ''}><div class="kpi"><div class="l">Sent</div><div class="v">${pcs(sum.sent)}</div></div><div class="kpi"><div class="l">Counted</div><div class="v">${pcs(sum.counted)}</div></div>${sum.pairs ? `<div class="kpi"><div class="l">Wrong store</div><div class="v warn">${pcs(sum.pairs)}</div></div>` : ''}${sum.short ? `<div class="kpi"><div class="l">Not received</div><div class="v bad">${pcs(sum.short)}</div></div>` : ''}${sum.extra ? `<div class="kpi"><div class="l">Extra</div><div class="v bad">${pcs(sum.extra)}</div></div>` : ''}${sum.nao ? `<div class="kpi"><div class="l">Not as Ordered</div><div class="v bad">${pcs(sum.nao)}</div></div>` : ''}</div>
      ${top}
      ${who ? `<p class="d-sub" style="margin-top:12px">${who}</p>` : ''}
      ${reviewMatrix(receiveModel(r), opts)}
    </div>
    <div class="sh-f${sm === 'O' ? ' opts' : ''}">${foot || `${note}<button class="btn red" data-act="re" data-v="1" data-hl="refill" ${lock}>Return &amp; reallot</button><button class="btn" data-act="decide" data-v="asis" data-hl="asis" ${lock}>Accept as delivered</button>`}</div>
    ${sm === 'M' ? confirmBox(list, S.sheet.ask) : ''}${S.sheet.re ? reallotDialog(r) : ''}`;
}

/* Store count: the hub's Receiving count sheet, blind. The store did not
   order, so there is no Not as Ordered: a piece of an article that is not on
   the list is added by search. Count sheet "List + add" lists the delivery's
   articles (no quantities); "Start empty" lists nothing until the store adds. */
function countSheet() {
  const d = S.deliveries.find((x) => x.sj === S.sheet.id);
  const sh = S.sheet;
  sh.counts ||= { ...(d.count || {}) };
  sh.added ||= [];
  const empty = S.csVer === 'empty';
  const inDelivery = empty ? [] : [...new Set(Object.keys(d.sent).map((s) => SKUS[s].art))];
  const arts = [...new Set([...inDelivery, ...sh.added, ...Object.keys(sh.counts).filter((s) => SKUS[s]).map((s) => SKUS[s].art)])];
  const unknown = Object.keys(sh.counts).filter((s) => !SKUS[s]);
  const block = (art) => {
    const skus = Object.keys(SKUS).filter((s) => SKUS[s].art === art);
    const n = skus.reduce((a, s) => a + (sh.counts[s] || 0), 0);
    const added = !inDelivery.includes(art);
    return `<div class="cs-art"><div class="cs-row top"><div>${artCell(art)}</div><span class="cs-mid">${added ? `${empty ? '' : '<span class="tag info">Added</span>'}<button class="plain red" data-act="rmArt" data-v="${art}">Remove</button>` : ''}</span><span class="cs-tot">${n ? pcs(n) : '—'}</span></div>
      ${skus.map((s) => `<div class="cs-row"><span class="cs-v"><i class="sw" style="background:${SKUS[s].hex}"></i>${skuName(s)}<span class="mono">${s}</span></span><span class="cs-in"><input inputmode="numeric" autocomplete="off" placeholder="0" value="${sh.counts[s] || ''}" data-change="cnt" data-v="${s}" aria-label="Counted ${ART[art].name} ${skuName(s)}"><span>pcs</span></span><span class="cs-tot"></span></div>`).join('')}</div>`;
  };
  const bad = unknown.length > 0;
  const total = sumOf(sh.counts);
  const add = `<div class="cs-add"><div class="scan">${SCAN}<input class="field" id="addIn" placeholder="Add an article · name, code or SKU" data-key="add" autocomplete="off"></div><div class="hits" id="artHits"></div></div>`;
  // MD's notes on the allotment, read-only above the count — the way the hub's
  // Receiving sheet shows the PO Notes.
  const notes = (ALTS[d.alt].notes || '').trim();
  return `${head(d.sj, 'Count')}<div class="sh-b">
      ${notes ? `<div class="nt"><span>Allotment Notes</span><p>${esc(notes)}</p></div>` : ''}
      <div class="cs"><div class="cs-h"><span>Article</span><span class="cs-mid">Counted</span><span class="cs-tot">In pieces</span></div>
        ${empty ? add : ''}
        ${arts.map(block).join('')}
        ${unknown.map((s) => `<div class="cs-row"><span class="cs-v" style="color:var(--bad-fg)">No SKU ${esc(s)}</span><span class="cs-in"><input inputmode="numeric" value="${sh.counts[s]}" data-change="cnt" data-v="${esc(s)}"><button class="rm" data-act="rm" data-v="${esc(s)}" aria-label="Remove">${X}</button></span><span class="cs-tot"></span></div>`).join('')}
        ${empty ? '' : add}
        <div class="cs-row cs-foot"><b>Total Counted</b><span class="cs-mid"></span><b class="cs-tot">${pcs(total)}</b></div>
      </div>
    </div><div class="sh-f">${bad ? '<span class="note bad">Check the red rows</span>' : ''}<button class="btn" data-act="countDone" ${total && !bad ? '' : 'disabled'}>Submit count</button></div>`;
}
function artHits(q) {
  const needle = q.trim().toLowerCase();
  const listed = S.csVer === 'empty' ? [] : Object.keys(S.deliveries.find((x) => x.sj === S.sheet.id).sent).map((s) => SKUS[s].art);
  const shown = new Set([...(S.sheet.added || []), ...listed, ...Object.keys(S.sheet.counts || {}).filter((s) => SKUS[s]).map((s) => SKUS[s].art)]);
  if (!needle) return '';
  return Object.entries(ART).filter(([code, a]) => !shown.has(code) && (a.name.toLowerCase().includes(needle) || code.includes(needle))).slice(0, 6)
    .map(([code, a]) => `<button data-act="addArt" data-v="${code}"><span class="mx-thumb sm">${garment(code, firstHex(code))}</span><span><b>${a.name}</b><span class="mono">${code} · ${a.div}</span></span></button>`).join('') || '<p class="none" style="padding:14px;text-align:left">No article matches.</p>';
}
function resultSheet() {
  const d = S.deliveries.find((x) => x.sj === S.sheet.id);
  const rows = Object.entries(d.count).map(([sku, n]) => `<tr><td>${ART[SKUS[sku].art].name} ${skuName(sku)}<span class="sub">${sku}</span></td><td class="r">${n}</td></tr>`).join('');
  const hold = onHoldOf(d);
  const holdRows = hold.map((l) => `<tr><td>${l.sku ? `${ART[SKUS[l.sku].art].name} ${skuName(l.sku)}<span class="sub">${l.sku}</span>` : 'Not as Ordered'}</td><td class="r">${l.n}</td></tr>`).join('');
  return `${head(d.sj, d.notArrived ? 'Not arrived' : 'In review')}<div class="sh-b">
      ${hold.length ? `<div class="sec-h">On hold<span>${pcs(hold.reduce((a, l) => a + l.n, 0))}</span></div><table class="t"><thead><tr><th>Article</th><th class="r">Set aside</th></tr></thead><tbody>${holdRows}</tbody></table>` : ''}
      <div class="sec-h">Counted<span>${COUNTER[d.store]} · ${d.countAt}</span></div>
      ${d.notArrived ? '<p class="d-sub">Nothing arrived.</p>' : `<table class="t"><thead><tr><th>Article</th><th class="r">Counted</th></tr></thead><tbody>${rows}${d.nao ? `<tr><td>Not as Ordered</td><td class="r">${d.nao}</td></tr>` : ''}</tbody><tfoot><tr><td>Total Counted</td><td class="r">${pcs(sumOf(d.count) + d.nao)}</td></tr></tfoot></table>`}
    </div><div class="sh-f"><button class="btn" data-act="recall" data-v="${d.sj}">Recall count</button></div>`;
}

/* ── Actions ─────────────────────────────────────────────────────────── */
function addReview(r) {
  r.id = `r${Math.random().toString(36).slice(2, 7)}`;
  r.state = 'open'; r.at = now();
  S.reviews.unshift(r); S.fresh = r.id;
  return r;
}
function addToPile(store, alt, sku, qty) {
  const pile = (S.piles[store] ||= []);
  const l = pile.find((x) => x.alt === alt && x.sku === sku);
  if (l) l.qty += qty; else pile.push({ alt, sku, qty });
}
function act(name, el) {
  const v = el?.dataset.v, k = el?.dataset.k;
  if (GACT[name]) return GACT[name](v, el);
  const sh = S.sheet;
  switch (name) {
    case 'role': S.role = v; S.sheet = null; S.page = null; S.grid = null; return render();
    case 'device': S.device = v; return render();
    case 'store': S.store = v; S.sheet = null; S.rtBanner = null; return render();
    case 'waiting': S.waiting = v; return render();
    case 'reset': for (const k of Object.keys(ALTS)) { if (ALTS[k].refillOf || ALTS[k].made) delete ALTS[k]; else delete ALTS[k].cancelled; } S = fresh(); return render();
    case 'mdTab': S.mdTab = v; return render();
    case 'edRule': if (S.grid?.mode === 'edit') { S.grid.cells = Object.fromEntries(Object.entries(S.grid.base).filter(([, l]) => l.now).map(([k, l]) => [k, l.now])); } S.edRule = v; return render();
    case 'edVer': S.edVer = v; if (S.grid) S.grid.view = 'now'; return render();
    case 'close': return closeSheet();
    case 'nope': return toast('Not part of this prototype');
    case 'edit': return openEdit(v);
    case 'open': {
      if (v.startsWith('pack:')) return openSheet('pack', v.slice(5));
      if (v.startsWith('ship:')) return openSheet('ship', v.slice(5));
      return openSheet('pick', v);
    }
    case 'stepM': case 'stepP': {
      const map = sh[k];
      map[v] = (map[v] || 0) + (name === 'stepP' ? 1 : -1);
      return renderSheet();
    }
    case 'cannot': sh.cannot = true; sh.why = null; return renderSheet();
    case 'uncannot': sh.cannot = false; sh.why = null; sh.out = {}; sh.bad = {}; return renderSheet();
    case 'why': sh.why = v; return renderSheet();
    case 'pickDone': case 'pickLater': case 'pickReview': {
      const p = S.picks.find((x) => x.id === sh.id);
      const short = {};
      for (const [sku, n] of Object.entries(p.lines)) {
        const got = sh.picked[sku];
        if (got) addToPile(p.store, p.alt, sku, got);
        if (n - got > 0) short[sku] = n - got;
      }
      S.fresh = `pack:${p.store}`;
      if (name === 'pickLater') { p.lines = short; p.again = null; toast('Pick saved', 'The rest stays on the picklist'); }
      else if (name === 'pickReview') {
        const r = addReview({ kind: 'pick', alt: p.alt, stores: [p.store], why: sh.why, lines: Object.keys(p.lines).map((sku) => ({ sku, asked: p.lines[sku], short: short[sku] || 0 })), pick: p.id });
        p.lines = short; p.state = 'review'; p.review = r.id; p.again = null;
        toast(`${pcs(sumOf(short))} short · sent to MD`, `${p.alt} · ${shop(p.store)}`);
      } else { p.state = 'closed'; toast('Picklist accepted', `${p.alt} · ${shop(p.store)}`); }
      return closeSheet();
    }
    case 'packDone': case 'packReview': {
      const store = sh.id;
      const pile = S.piles[store];
      if (name === 'packReview') {
        const byAlt = {};
        for (const [key, n] of Object.entries(sh.out)) if (n) { const [alt, sku] = key.split('|'); (byAlt[alt] ||= []).push({ sku, n }); }
        for (const [alt, ls] of Object.entries(byAlt)) {
          addReview({ kind: 'pack', alt, stores: [store], why: sh.why, lines: ls.map(({ sku, n }) => ({ sku, asked: pile.find((l) => l.alt === alt && l.sku === sku).qty, short: n })) });
          for (const { sku, n } of ls) { const l = pile.find((x) => x.alt === alt && x.sku === sku); l.qty -= n; }
        }
        S.piles[store] = pile.filter((l) => l.qty > 0);
        toast(`${pcs(sumOf(sh.out))} can't go · sent to MD`, `${shop(store)} · the rest stays to pack`);
        return closeSheet();
      }
      const no = `A${String(S.koliSeq++).padStart(5, '0')}`;
      S.koli.push({ no, store, lines: pile.map((l) => ({ ...l })), state: 'ready' });
      S.piles[store] = []; S.fresh = `ship:${store}`;
      toast(`Koli packed · ${pcs(pile.reduce((a, l) => a + l.qty, 0))}`, `${no} · label printing`);
      return closeSheet();
    }
    case 'shipDone': case 'shipReview': {
      const ready = S.koli.filter((kk) => kk.state === 'ready');
      if (name === 'shipReview') {
        for (const kk of ready.filter((x) => sh.bad[x.no])) {
          kk.state = 'review';
          addReview({ kind: 'dispatch', alt: kk.lines[0].alt, stores: [kk.store], why: sh.why, koli: kk.no, lines: kk.lines.map((l) => ({ sku: l.sku, asked: l.qty, short: l.qty })) });
        }
        toast(`${Object.values(sh.bad).filter(Boolean).length} koli can't go · sent to MD`);
        return closeSheet();
      }
      const going = ready.filter((x) => sh.tick[x.no]);
      const trip = `DSP-HO-GUDANG-${String(S.tripSeq++).padStart(6, '0')}`;
      S.trips.push({ no: trip, at: now(), note: sh.note || '' });
      for (const kk of going) {
        kk.state = 'sent';
        const alts = [...new Set(kk.lines.map((l) => l.alt))];
        for (const alt of alts) {
          const sent = {};
          for (const l of kk.lines.filter((x) => x.alt === alt)) sent[l.sku] = (sent[l.sku] || 0) + l.qty;
          S.deliveries.push({ sj: `SJ-HO-GUDANG-${String(S.sjSeq++).padStart(6, '0')}`, trip, alt, store: kk.store, koli: 1, sent, count: null, nao: 0, state: 'transit' });
        }
      }
      toast(`${trip} dispatched`, 'In transit');
      return closeSheet();
    }
    case 'review': S.fresh = null; return openSheet('review', v);
    case 'decide': {
      const r = S.reviews.find((x) => x.id === sh.id);
      if (v === 'mix') r.choices = { ...sh.choice };
      decide(r, v);
      // Accept as delivered just closes: no dialog, no receipt (owner, 18 Oct).
      if (v === 'asis') closeSheet();
      return;
    }
    case 'way': sh.way = v; return renderSheet();
    case 're': sh.re = !!v; return renderSheet();
    case 'reVer': S.reVer = v; return render();
    case 'hlKind': {
      sh.hk = sh.hk === v ? null : v;
      // On a phone the matrix shows one store: show the one with this issue.
      const first = sh.hk && issuesOf(S.reviews.find((x) => x.id === sh.id)).find((i) => i.kind === sh.hk);
      if (first && S.device === 'phone') S.mxStore = first.kind === 'pair' ? first.to : first.at;
      renderSheet();
      document.querySelector('#sheet td.hl')?.closest('tr')?.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      return;
    }
    case 'ask': sh.ask = v || null; return renderSheet();
    case 'choose': { const [id, w] = v.split('|'); sh.choice = { ...(sh.choice || {}), [id]: w }; return renderSheet(); }
    case 'count': return openSheet('count', v);
    case 'result': return openSheet('result', v);
    case 'rm': delete sh.counts[v]; return renderSheet();
    case 'story': {
      const st = STORY[sh.id];
      sh.counts = { ...st.counts };
      return renderSheet();
    }
    case 'countDone': {
      const d = S.deliveries.find((x) => x.sj === sh.id);
      submitCount(d, Object.fromEntries(Object.entries(sh.counts).filter(([, n]) => n > 0)), 0);
      return closeSheet();
    }
    // The lorry never came: the same as a count of nothing, so it is reviewed.
    case 'notArrived': {
      const d = S.deliveries.find((x) => x.sj === v);
      d.notArrived = true;
      submitCount(d, {}, 0);
      return render();
    }
    case 'reviewer': S.reviewer = v; return render();
    case 'mxVer': S.mxVer = v; return render();
    case 'mxSize': S.mxSize = v; return render();
    case 'smVer': S.smVer = v; if (S.sheet) { S.sheet.hl = null; S.sheet.ask = null; } return render();
    case 'csVer': S.csVer = v; return render();
    case 'mxFold': S.sheet.open = !S.sheet.open; return renderSheet();
    case 'hl': {
      const n = Number(v);
      S.sheet.hl = S.sheet.hl === n ? null : n;
      renderSheet();
      document.querySelector('#sheet td.hl')?.closest('tr')?.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      return;
    }
    case 'mxShow': S.mxShow = v; return renderSheet();
    case 'mxStore': S.mxStore = v; return renderSheet();
    case 'addArt': { sh.added = [...(sh.added || []), v]; renderSheet(); return; }
    case 'rmArt': {
      sh.added = (sh.added || []).filter((x) => x !== v);
      for (const sku of Object.keys(sh.counts)) if (SKUS[sku]?.art === v) delete sh.counts[sku];
      return renderSheet();
    }
    // The whole story at once: a pick short, a damaged piece at the pack bench,
    // a koli that cannot be found, and both stores of DSP-…-000002 counted.
    case 'play': {
      for (const kk of Object.keys(ALTS)) if (ALTS[kk].refillOf) delete ALTS[kk];
      S = fresh();
      const p1 = S.picks.find((x) => x.id === 'p1');
      S.sheet = { type: 'pick', id: 'p1', picked: { ...p1.lines, '00000016105': 0 }, cannot: true, why: 'Item not found in the pool' };
      act('pickReview');
      S.sheet = { type: 'pack', id: 'C001', out: { 'ALT-00000015|00000016004': 1 }, cannot: true, why: 'Item damaged' };
      act('packReview');
      S.sheet = { type: 'ship', id: null, tick: {}, bad: { A00009: true }, cannot: true, why: 'Koli not found' };
      act('shipReview');
      for (const d of S.deliveries) if (STORY[d.sj]) submitCount(d, { ...STORY[d.sj].counts }, STORY[d.sj].nao);
      S.toasts = []; S.fresh = null; S.role = 'md'; S.mdTab = 'review';
      toast('Story played', '4 reviews wait for MD');
      return render();
    }
    case 'recall': {
      const d = S.deliveries.find((x) => x.sj === v);
      d.state = 'transit'; d.notArrived = false;
      const r = openReviews().find((x) => x.kind === 'receive' && x.trip === d.trip && x.alt === d.alt);
      if (r) { r.stores = r.stores.filter((s) => s !== d.store); if (!r.stores.length) S.reviews = S.reviews.filter((x) => x !== r); }
      toast('Count recalled', 'Count again and submit');
      return openSheet('count', v);
    }
  }
}

/* A store's count: a match completes by itself; anything else waits for MD.
   What matches the delivery goes into stock at once, the rest is on hold. */
function submitCount(d, count, nao) {
  d.count = count; d.nao = nao; d.countAt = now();
  const match = !d.notArrived && nao === 0 && Object.keys({ ...d.sent, ...count }).every((s) => (d.sent[s] || 0) === (count[s] || 0));
  if (match) { d.state = 'done'; d.doneAt = 'Completed'; toast('Received', `${d.sj} · ${pcs(sumOf(count))}`); return; }
  d.state = 'review';
  let r = openReviews().find((x) => x.kind === 'receive' && x.trip === d.trip && x.alt === d.alt);
  if (!r) r = addReview({ kind: 'receive', trip: d.trip, alt: d.alt, stores: [] });
  if (!r.stores.includes(d.store)) r.stores.push(d.store);
  r.counted = r.stores.map((s) => COUNTER[s]).join(', ');
  S.fresh = r.id;
  const booked = Object.keys(count).reduce((a, s) => a + Math.min(count[s], d.sent[s] || 0), 0);
  const hold = onHoldOf(d).reduce((a, l) => a + l.n, 0);
  if (d.notArrived) toast('Marked not arrived', `${d.sj} · waiting for MD`);
  else toast('Count sent', `${pcs(booked)} into stock${hold ? ` · ${pcs(hold)} on hold` : ''} · waiting for MD`);
}

/* Where the pieces of an accepted short go: the reason Ops gave decides it. */
function whereTo(r, n) {
  const w = r.why;
  if (w === 'Item damaged' || w === 'Koli damaged') return ['back', `${pcs(n)} to Reject`, r.koli ? `Koli ${r.koli} opened · label void` : 'Not sellable · Inventory decides'];
  if (w === 'Koli not found' || w === 'Not in the picked pile') return ['lost', `${pcs(n)} to Inventory · Missing`, 'Found / Lost'];
  if (w === 'Stock in the pool could not be confirmed' || w === 'Item not found in the pool') return ['lost', `Stock check at Inventory`, `${pcs(n)} · Found / Lost`];
  if (r.kind === 'pick') return ['back', 'Nothing to put back', 'The pieces never left the pool'];
  return ['back', `${pcs(n)} back to stock`, r.koli ? `Koli ${r.koli} opened · label void` : 'Put back by the Gudang'];
}
function decide(r, how) {
  r.state = 'done'; r.by = S.reviewer; r.byAt = now();
  const art = artOf(r.alt);
  const out = [];
  if (r.kind !== 'receive') {
    const short = r.lines.reduce((a, l) => a + l.short, 0);
    const store = r.stores[0];
    if (how === 'continue') {
      if (r.kind === 'pick') {
        const p = S.picks.find((x) => x.id === r.pick);
        p.state = 'open'; p.again = 'continue picking'; p.againBy = S.reviewer; S.fresh = p.id;
      } else if (r.kind === 'pack') {
        const lines = Object.fromEntries(r.lines.map((l) => [l.sku, l.short]));
        const id = `p${Math.random().toString(36).slice(2, 6)}`;
        S.picks.push({ id, alt: r.alt, store, lines, state: 'open', again: 'pick again', againBy: S.reviewer }); S.fresh = id;
      } else {
        const kk = S.koli.find((x) => x.no === r.koli);
        kk.state = 'ready'; S.fresh = `ship:${store}`;
      }
      out.push(['ok', `Continue · ${pcs(short)} back on the ${r.kind === 'dispatch' ? 'Dispatch' : 'Pick'} lane`, `${shop(store)} · ${OPS} is told`]);
      toast(`${r.alt} continues`, `${pcs(short)} · ${shop(store)}`);
    } else {
      S.plan[r.alt][store] -= short;
      if (r.kind === 'pick') S.picks.find((x) => x.id === r.pick).state = 'closed';
      if (r.kind === 'dispatch') S.koli.find((x) => x.no === r.koli).state = 'gone';
      out.push(['lost', `Closed short · ${pcs(short)}`, `${shop(store)} gets ${pcs(S.plan[r.alt][store])}`]);
      out.push(whereTo(r, short));

  }
  const sum = receiveSummary(r);
  const retBy = {}, refill = {};
  const addRet = (store, n, line) => { (retBy[store] ||= { qty: 0, lines: [] }); retBy[store].qty += n; retBy[store].lines.push(line); };
  // One way for everything, or (N · per issue) the way MD chose for each.
  const way = (id) => (how === 'mix' ? r.choices?.[id] : how);
  for (const p of sum.pairList) {
    if (way(`pair:${p.sku}:${p.from}:${p.to}`) === 'asis') {

      out.push(['ok', `As delivered · ${p.to} keeps ${pcs(p.n)} ${skuName(p.sku)}`, `${p.from} ${S.plan[r.alt][p.from] + p.n} → ${S.plan[r.alt][p.from]} · ${p.to} ${S.plan[r.alt][p.to] - p.n} → ${S.plan[r.alt][p.to]}`]);

      addRet(p.to, p.n, `${p.n} ${skuName(p.sku)}`); S.plan[r.alt][p.from] -= p.n; (refill[p.from] ||= []).push([p.sku, p.n]);
    }

  for (const s of sum.shortList) {
    S.plan[r.alt][s.store] -= s.n;
    if (way(`short:${s.sku}:${s.store}`) === 'refill') (refill[s.store] ||= []).push([s.sku, s.n]);
    out.push(['lost', `${pcs(s.n)} ${skuName(s.sku)} to Inventory · Missing`, `${shop(s.store)}`]);
  }
  for (const e of sum.extraList) addRet(e.store, e.n, `${e.n} ${skuName(e.sku)}`);
  for (const d of sum.ds) if (d && d.state === 'review') { const n = d.nao; if (n) addRet(d.store, n, `${n} Not as Ordered`); d.state = 'done'; d.doneAt = `Reviewed by ${S.reviewer.split(' ')[0]}`; }
  for (const [store, ret] of Object.entries(retBy)) {
    const no = `RTH-${String(S.rtSeq++).padStart(6, '0')}`;
    S.returns.push({ no, store, qty: ret.qty, lines: ret.lines, state: 'open' });
    out.push(['back', `Return to HO · ${shop(store)} · ${pcs(ret.qty)}`, `<span class="mono">${no}</span> · ${ret.lines.join(', ')}`]);
  }

  const take = {}, none = [];

  if (refillStores.length) {
    const no = altNo();

    ALTS[no] = { art: ALTS[r.alt].art, date: 'Today', refillOf: r.alt };
    S.plan[no] = {};
    for (const [store, ls] of Object.entries(take)) {
      S.plan[no][store] = ls.reduce((a, [, n]) => a + n, 0);
      const id = `p${Math.random().toString(36).slice(2, 6)}`;
      S.picks.push({ id, alt: no, store, lines: Object.fromEntries(ls), state: 'open', again: `reallot of ${r.alt}`, againBy: S.reviewer });

  }
  for (const [store, sku, n] of none) out.push(['lost', `Closed short · ${pcs(n)} ${skuName(sku)}`, `${shop(store)} · no stock at the DC to reallot`]);

  render();
}

/* Allotment lines as they stand ─────────────────────────────────────── */
/* key → what of the line is still to pick, picked, in koli, sent. */
function altLines(alt) {
  const L = {};
  const add = (sku, store, f, n) => { const k = gkey(sku, store); (L[k] ||= { sku, store, toPick: 0, picked: 0, packed: 0, sent: 0 })[f] += n; };
  for (const p of S.picks) if (p.alt === alt && p.state !== 'closed') for (const [sku, n] of Object.entries(p.lines)) add(sku, p.store, 'toPick', n);
  for (const [store, pile] of Object.entries(S.piles)) for (const l of pile) if (l.alt === alt) add(l.sku, store, 'picked', l.qty);
  for (const k of S.koli) if (k.state !== 'sent') for (const l of k.lines) if (l.alt === alt) add(l.sku, k.store, 'packed', l.qty);
  for (const d of S.deliveries) if (d.alt === alt) for (const [sku, n] of Object.entries(d.sent)) add(sku, d.store, 'sent', n);
  for (const l of Object.values(L)) l.now = l.toPick + l.picked + l.packed + l.sent;
  return L;
}

/* Edit: what Save changes would do ─────────────────────────────────── */
function editPlan() {
  const g = S.grid;
  const keys = new Set([...Object.keys(g.base), ...Object.keys(g.cells)]);
  const out = { was: 0, now: 0, changed: 0, added: 0, plus: 0, minus: 0, fromKoli: 0, owed: 0, diffs: [] };
  for (const k of keys) {
    const b = g.base[k] || { now: 0, toPick: 0, picked: 0, packed: 0, sent: 0 };
    const n = g.cells[k] || 0;
    out.was += b.now; out.now += n;
    if (n === b.now) continue;

/* Typing a cell: held between what is already sent and what the row can
   still give; a refused keystroke shakes the box. */
function typeCell(el) {
  const g = S.grid, k = el.dataset.cell, [sku] = k.split('|');
  const want = (Number(el.value.replace(/\D/g, '')) || 0) + Number(el.dataset.extra || 0);
  const here = g.cells[k] || 0;
  const most = Math.max(0, gFree(sku) - (gRow(sku) - here));
  const least = gFloor(k);
  const v = Math.max(least, Math.min(most, want));
  if (v) g.cells[k] = v; else delete g.cells[k];
  g.focus = SKUS[sku].art;
  renderGrid();
  if (v !== want) {
    const box = document.querySelector(`[data-cell="${k}"]`);
    if (box) { box.value = (v - Number(box.dataset.extra || 0)) || ''; box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake', 'capped'); setTimeout(() => box.classList.remove('capped'), 900); }
  }
}
function fillRows(art, stores) {
  const g = S.grid, all = GSTORES();
  let idx = 0;
  for (const sku of skusOf(art)) {
    const free = gFree(sku);
    if (free <= 0) continue;
    const n = stores.length, base = Math.floor(free / n), extra = free % n, start = idx % n;
    idx++;
    for (const st of all) {
      const at = stores.indexOf(st);
      let v = at < 0 ? 0 : base + (((at - start + n) % n) < extra ? 1 : 0);
      const k = gkey(sku, st);
      v = Math.max(v, gFloor(k));
      if (v) g.cells[k] = v; else delete g.cells[k];
    }
  }
}
/* One article saved as one allotment: a picklist per store for Ops. */
function saveArticle(art) {
  const g = S.grid, plan = {}, alt = altNo();
  const byStore = {};
  for (const sku of skusOf(art)) for (const st of GSTORES()) {
    const k = gkey(sku, st), n = g.cells[k] || 0;
    if (!n) continue;
    (byStore[st] ||= {})[sku] = n;
    poolAdd(sku, -n);
    delete g.cells[k];
  }
  ALTS[alt] = { art, date: '18 Oct', made: true };
  for (const [st, lines] of Object.entries(byStore)) {
    plan[st] = sumOf(lines);
    S.picks.push({ id: `p${S.seq}${st}`, alt, store: st, lines, state: 'open' });
  }
  S.plan[alt] = plan;

function applyEdit() {
  const g = S.grid, alt = g.alt;
  const p = editPlan();
  for (const [k, d] of p.diffs) {
    const [sku, st] = k.split('|');
    if (d > 0) {
      let pk = S.picks.find((x) => x.alt === alt && x.store === st && x.state === 'open');
      if (!pk) { pk = { id: `p${S.seq++}e${st}`, alt, store: st, lines: {}, state: 'open' }; S.picks.push(pk); }
      pk.lines[sku] = (pk.lines[sku] || 0) + d; pk.edited = true;
      poolAdd(sku, -d);
      continue;
    }
    let rem = -d;
    poolAdd(sku, rem);
    for (const pk of S.picks.filter((x) => x.alt === alt && x.store === st && x.state !== 'closed' && x.lines[sku])) {
      const take = Math.min(rem, pk.lines[sku]); pk.lines[sku] -= take; rem -= take; pk.edited = true;
      if (!pk.lines[sku]) delete pk.lines[sku];
      if (!Object.keys(pk.lines).length) pk.state = 'closed';
    }
    for (const l of S.piles[st] || []) if (rem && l.alt === alt && l.sku === sku) { const take = Math.min(rem, l.qty); l.qty -= take; rem -= take; }
    if (S.piles[st]) S.piles[st] = S.piles[st].filter((l) => l.qty > 0);
    for (const kk of S.koli.filter((x) => x.store === st)) for (const l of kk.lines) if (rem && l.alt === alt && l.sku === sku) { const take = Math.min(rem, l.qty); l.qty -= take; rem -= take; }
    for (const kk of S.koli) kk.lines = kk.lines.filter((l) => l.qty > 0);

  }
  const plan = {};
  for (const [k, n] of Object.entries(g.cells)) { const st = k.split('|')[1]; plan[st] = (plan[st] || 0) + n; }
  S.plan[alt] = plan;

}

});

/* ── Allotment sheet + Cancel (hub allotments.tsx AllotmentSheet,
   store-lines.tsx StoreLines, cancel-dialog.tsx CancelDialog, 18 Oct) ──
   cxVer 'now'   the hub today: StoreLines' ticks are only drawn while
                 `editing`, and nothing sets a draft any more (Edit went to
                 the grid), so the sheet has no ticks and Cancel is always
                 for every store with something left.
   cxVer 'ticks' the ticks as StoreLines was written: tick stores, Cancel is
                 for those; no tick = every store. */
const CX_WHY = ['Wrong quantity', 'Wrong store', 'Stock problem', 'Supplier', 'Other'];
/* A store's lines by stage. */
function stagesAt(alt, stores) {
  const L = Object.values(altLines(alt)).filter((l) => !stores || stores.includes(l.store));
  const recv = S.deliveries.filter((d) => d.alt === alt && d.state === 'done' && (!stores || stores.includes(d.store))).reduce((a, d) => a + sumOf(d.sent), 0);
  const s = { toPick: 0, picked: 0, packed: 0, dispatched: 0, received: recv };
  for (const l of L) { s.toPick += l.toPick; s.picked += l.picked; s.packed += l.packed; s.dispatched += l.sent; }
  s.allotted = s.toPick + s.picked + s.packed + s.dispatched;
  s.room = s.allotted - s.dispatched;
  return s;
}
const altStores = (alt) => [...new Set(Object.values(altLines(alt)).map((l) => l.store))].sort();
function cxScope() {
  const sh = S.sheet, alt = sh.id;
  const ticked = S.cxVer === 'ticks' ? Object.keys(sh.ticked || {}).filter((k) => sh.ticked[k]) : [];
  const all = altStores(alt);
  const ids = (ticked.length ? ticked : all).filter((st) => stagesAt(alt, [st]).room > 0);
  return { ids, whole: ticked.length === 0, all };
}
const whoOf = (names) => (names.length === 0 ? '' : names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} and ${names[1]}` : `${names.length} stores`);
function storeNote(alt, st) {
  const s = stagesAt(alt, [st]);
  if (ALTS[alt].cancelled?.stores?.includes(st) && s.allotted === s.dispatched && s.dispatched === 0) return ['Cancelled', 'bad'];
  if (s.allotted > 0 && s.dispatched >= s.allotted) return s.received >= s.dispatched ? ['Received', 'ok'] : ['In transit', 'info'];
  return null;
}
function altSheet() {
  const sh = S.sheet, alt = sh.id, art = artOf(alt), ticks = S.cxVer === 'ticks';
  const stores = altStores(alt);
  const fig = (n, strong) => `<span class="${n ? (strong ? 'sl-strong' : '') : 'faint'}">${n}</span>`;
  const rows = stores.map((st) => {
    const s = stagesAt(alt, [st]), on = ticks && sh.ticked?.[st], note = storeNote(alt, st), open = !sh.folded?.[st];
    const skus = Object.values(altLines(alt)).filter((l) => l.store === st);
    return `<div class="sl-row${on ? ' on' : ''}${ticks ? ' t' : ''}">
      ${ticks ? `<input type="checkbox" data-change="cxTick" data-v="${st}" ${on ? 'checked' : ''} aria-label="${shop(st)}">` : ''}
      <button class="sl-name" data-act="slFold" data-v="${st}" aria-expanded="${open}"><span class="g-fold${open ? ' open' : ''}">${CHEVR}</span><span><b>${shop(st)}</b>${note ? `<span class="sl-note ${note[1]}">${note[0]}</span>` : ''}<span class="sl-ph">To pick ${s.toPick} · In stock ${s.picked + s.packed} · Dispatched ${s.dispatched} · Received ${s.received}</span></span></button>
      <span class="sl-n">${fig(s.allotted, true)}</span><span class="sl-n sl-d">${fig(s.toPick)}</span><span class="sl-n sl-d">${fig(s.picked + s.packed)}</span><span class="sl-n sl-d">${fig(s.dispatched)}</span><span class="sl-n sl-d">${fig(s.received)}</span></div>
      ${open ? `<div class="sl-art${ticks ? ' t' : ''}">${ticks ? '<span></span>' : ''}<span class="sl-an"><b>${esc(art.name)}</b><span>${ALTS[alt].art}</span></span><span class="sl-n">${skus.reduce((a, l) => a + l.now, 0)}</span></div>` : ''}`;
  }).join('');
  const t = stagesAt(alt), all = ticks && stores.every((st) => sh.ticked?.[st]), some = ticks && stores.some((st) => sh.ticked?.[st]);
  const scope = cxScope();
  const allSent = t.room === 0;
  const body = `<div class="sl">
    <div class="sl-hd${ticks ? ' t' : ''}">${ticks ? `<input type="checkbox" data-change="cxAll" ${all ? 'checked' : ''} aria-label="All stores" ${some && !all ? 'data-ind="1"' : ''}>` : ''}<span>Store</span><span class="sl-n">Allotted</span><span class="sl-n sl-d">To pick</span><span class="sl-n sl-d">In stock</span><span class="sl-n sl-d">Dispatched</span><span class="sl-n sl-d">Received</span></div>
    ${rows}
    <div class="sl-tot${ticks ? ' t' : ''}">${ticks ? '<span></span>' : ''}<span class="sl-tn">Total</span><span class="sl-n">${fig(t.allotted, true)}</span><span class="sl-n sl-d">${fig(t.toPick)}</span><span class="sl-n sl-d">${fig(t.picked + t.packed)}</span><span class="sl-n sl-d">${fig(t.dispatched)}</span><span class="sl-n sl-d">${fig(t.received)}</span></div></div>`;
  const foot = ALTS[alt].cancelled?.whole ? '' : `<div class="sh-f">${allSent ? '<span class="note">Everything has already been dispatched.</span>' : ''}<button class="btn red" data-act="cxOpen" ${scope.ids.length ? '' : 'disabled'}>Cancel</button><button class="btn" data-act="edit" data-v="${alt}">Edit</button></div>`;
  return `${head(`Allotments / <span class="mono">${alt}</span>`, `${art.sup}${ALTS[alt].cancelled?.whole ? ' <span class="tag bad">Cancelled</span>' : ''}`)}<div class="sh-b">${body}</div>${foot}${sh.cx ? cancelDialog() : ''}`;
}
function cancelDialog() {
  const sh = S.sheet, alt = sh.id, cx = sh.cx;
  const { ids, whole } = cxScope();
  const st = stagesAt(alt, ids);
  const at = (f) => ids.filter((s) => f(stagesAt(alt, [s])) > 0).map(shop);
  const koli = whole ? S.koli.filter((k) => k.lines.some((l) => l.alt === alt)).length : undefined;
  const rows = [
    ['To pick', st.toPick, `${whoOf(at((s) => s.toPick))} · removed`, 'quiet'],
    ['Picked', st.picked, `${whoOf(at((s) => s.picked))} · the warehouse puts it back`, 'warn'],
    [koli === undefined ? 'Packed' : `Packed · ${koli} koli`, st.packed, `${whoOf(at((s) => s.packed))} · the warehouse puts it back`, 'warn'],
    ['Dispatched', st.dispatched, `Stays at ${whoOf(at((s) => s.dispatched))}`, 'bad'],
  ].filter((r) => r[1] > 0);
  const names = ids.map(shop), rest = st.dispatched > 0, gone = at((s) => s.dispatched);
  const who = whoOf(names);
  const title = whole ? (rest ? `Cancel the rest of ${alt}?` : `Cancel ${alt}?`) : rest ? `Cancel the rest for ${who}?` : `Cancel ${who}?`;
  const verb = rest ? 'Cancel the rest' : whole ? 'Cancel allotment' : `Cancel ${names.length === 1 ? 'store' : `${names.length} stores`}`;
  const nothing = st.room === 0;
  return `<div class="cx-veil" data-act="cxKeep"></div><div class="cx-dlg" role="dialog" aria-modal="true">
    <h3>${title}</h3>
    <ul class="cx-rows">${rows.map(([l, n, d, tone]) => `<li class="${tone}"><span class="cx-f"><span>${l}</span><b>${pcs(n)}</b></span><span class="cx-d">${esc(d)}</span></li>`).join('')}</ul>
    ${rest ? `<p class="cx-ask">Ask ${gone.length === 1 ? gone[0] : 'the stores'} to return the ${pcs(st.dispatched)}.</p>` : ''}
    ${nothing ? '<p class="cx-none">Nothing left to cancel · everything is dispatched</p>' : `
    <label class="cx-lab" for="cxNote">Note</label><textarea id="cxNote" rows="2" data-input="cxNote">${esc(cx.note || '')}</textarea>`}
    <div class="cx-foot"><button class="btn ghosty" data-act="cxKeep">Keep</button><button class="btn red" data-act="cxGo" ${nothing ? 'disabled' : ''}>${verb}</button></div></div>`;
}
/* Every scoped line down to what is dispatched: To pick removed, picked and
   packed put back into the pool by the warehouse. */
function applyCancel() {
  const sh = S.sheet, alt = sh.id, { ids, whole } = cxScope();
  const anyDispatched = stagesAt(alt).dispatched > 0;
  const st = stagesAt(alt, ids);
  const owed = st.picked + st.packed;
  const was = sumOf(S.plan[alt]);
  for (const store of ids) {
    for (const p of S.picks) if (p.alt === alt && p.store === store && p.state !== 'closed') { for (const [sku, n] of Object.entries(p.lines)) poolAdd(sku, n); p.state = 'closed'; }
    if (S.piles[store]) { for (const l of S.piles[store]) if (l.alt === alt) poolAdd(l.sku, l.qty); S.piles[store] = S.piles[store].filter((l) => l.alt !== alt); }
    for (const k of S.koli) if (k.store === store) { for (const l of k.lines) if (l.alt === alt) poolAdd(l.sku, l.qty); k.lines = k.lines.filter((l) => l.alt !== alt); }
    S.koli = S.koli.filter((k) => k.lines.length);
    S.plan[alt][store] = stagesAt(alt, [store]).dispatched;
  }
  const reason = sh.cx.note?.trim() || '';
  const c = ALTS[alt].cancelled ||= { stores: [], reason, at: now(), was };
  c.stores.push(...ids); c.reason = reason; c.at = now();
  if (whole && !anyDispatched) {
    c.whole = true;
    return toast(`${alt} cancelled`, owed ? `${pcs(owed)} put back by the warehouse` : '');
  }
  if (whole) c.rest = true;
  toast(`${alt} ${st.dispatched ? 'rest cancelled' : 'cancelled'}`, whole ? '' : whoOf(ids.map(shop)));
}
function cancelledCard(alt) {
  const art = artOf(alt), c = ALTS[alt].cancelled;
  return `<article class="dcard"><div class="d-in"><div class="d-top"><span class="d-sup">${art.sup}</span><span class="d-fig">${pcs(c.was)}</span></div>
    <div class="d-sub"><span class="mono">${alt}</span> · ${art.name} · ${ALTS[alt].date}</div>

    <div class="d-foot"><button class="btn-s ghost" data-act="altOpen" data-v="${alt}">Open</button></div></article>`;
}
Object.assign(GACT, {
  altOpen: (v) => openSheet('alt', v, { ticked: {}, folded: {} }),

/* ── Return to HO (store → Gudang HO), as the code is today (18 Oct) ──────

const rtPcs = (r) => sumOf(r.lines);
const rtArts = (r) => [...new Set(Object.keys(r.lines).map((s) => SKUS[s].art))];
const rtSup = (r) => [...new Set(rtArts(r).map((a) => ART[a].sup))].join(', ') || 'No supplier';
const rtGot = (r) => sumOf(r.count || {});
const siteId = (st) => `store-${st.slice(1)}`;
function rtStockOf(st) { return S.rtStock[st] ||= JSON.parse(JSON.stringify(RT_STOCK[st] || {})); }

/* MD › Return HO ─────────────────────────────────────────────────────── */
function renderMdReturns() {
  const all = S.rets;

  const tab = S.rtTab || 'progress';
  const tabs = [['progress', 'In progress', prog.length], ['completed', 'Completed', done.length], ['cancelled', 'Cancelled', gone.length]];
  const tile = (r) => {
    const [w, tone] = r.state === 'asked' ? ['To pick', ''] : r.state === 'transit' ? ['Dispatched', 'info'] : rtGot(r) < rtPcs(r) ? [`Received ${rtGot(r)} of ${rtPcs(r)}`, 'ok'] : ['Received', 'ok'];

    <div class="d-sub"><span class="mono">${r.alt}</span> · ${rtArts(r).length} ${rtArts(r).length === 1 ? 'article' : 'articles'} · ${r.at}</div><div class="tiles">${tile(r)}</div></div>

      <div class="tiles"><span class="tile"><b>HO · Gudang</b><span class="w">${pcs(n)}</span></span></div></div></article>`;

    const off = r.count && rtGot(r) !== rtPcs(r);
    const res = r.state === 'transit' ? `<button class="btn-s" data-act="rtCount" data-v="${r.alt}">Count receive</button>` : `<span class="${off ? 'warn' : 'ok'}">${pcs(rtGot(r))}${extra ? ` · ${extra} extra` : ''}</span>`;
    return `<tr data-act="rtCount" data-v="${r.alt}" style="cursor:pointer"><td>${i + 1}</td><td class="mono">${r.sj}</td><td>${shop(r.store)}</td><td>${r.sentOn}</td><td class="r">${r.koli}</td><td class="r">${res}</td></tr>`;
  }).join('');
  const body = list.length ? `<table class="t"><thead><tr><th>No.</th><th>Return</th><th>Store</th><th>Sent on</th><th class="r">Cartons</th><th class="r"></th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="empty">${tab === 'in' ? 'Nothing to receive.' : 'Nothing received yet.'}</p>`;
  const tabs = `<div class="tabs" role="tablist"><button role="tab" aria-selected="${tab === 'in'}" data-act="rtOpsTab" data-v="in">To receive<span class="n">${coming.length}</span></button><button role="tab" aria-selected="${tab === 'got'}" data-act="rtOpsTab" data-v="got">Received<span class="n">${got.length}</span></button></div>`;
  const kpis = `<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><div class="l">To receive</div><div class="v">${coming.reduce((a, r) => a + r.koli, 0)} cartons</div></div><div class="kpi"><div class="l">Received</div><div class="v">${pcs(got.reduce((a, r) => a + rtGot(r), 0))}</div></div></div>`;
  if (S.device === 'phone') { $('#page').innerHTML = `<div class="ph-top">Receiving Return</div><div class="ph-body">${kpis}${tabs}${body}</div>`; return; }
  $('#page').innerHTML = `<div class="head"><h1>Receiving Return</h1></div>${kpis}${tabs}<div class="scroll">${body}</div>`;
}
function rtCountSheet() {
  const r = S.rets.find((x) => x.alt === S.sheet.id), sh = S.sheet;
  const facts = `<div class="rt-facts"><div><span>Store</span><b>${shop(r.store)}</b></div><div><span>Delivery note</span><b class="mono">${r.sj}</b></div><div><span>Cartons</span><b>${r.koli}</b></div><div><span>Sent on</span><b>${r.sentOn}</b></div></div>`;
  if (r.state === 'received') {
    const skus = [...new Set([...Object.keys(r.lines), ...Object.keys(r.count)])];
    return `${head('Receiving Return', `From ${siteId(r.store)}`)}<div class="sh-b">${facts}<p style="margin:12px 0">This delivery is recorded as received.</p>
      <table class="t"><thead><tr><th>SKU</th><th class="r">Expected</th><th class="r">Received</th><th class="r">Extra</th></tr></thead><tbody>${skus.map((s) => { const e = r.lines[s] || 0, g = r.count[s] || 0; return `<tr><td>${SKUS[s] ? skuName(s) : s}<span class="sub">${s}</span></td><td class="r">${e}</td><td class="r">${g}</td><td class="r">${g > e ? `<span class="warn">${g - e}</span>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
  }
  sh.counts ||= {};
  const skus = Object.keys(sh.counts);
  const total = sumOf(sh.counts);
  return `${head('Receiving Return', `From ${siteId(r.store)}`)}<div class="sh-b">${facts}
    <div class="seg" style="margin:14px 0 10px"><button aria-pressed="true">By count</button><button data-act="nope">By handheld</button></div>
    <input class="rt-scan" data-key="rtscan" placeholder="Scan or type a SKU" aria-label="Scan or type a SKU" autocomplete="off">
    ${skus.length ? `<table class="t"><thead><tr><th>SKU</th><th class="r">Quantity</th><th></th></tr></thead><tbody>${skus.map((s) => `<tr><td>${SKUS[s] ? skuName(s) : 'Unknown'}<span class="sub">${s}</span></td><td class="r"><input class="rt-in" inputmode="numeric" data-rtcnt="${s}" value="${sh.counts[s]}"></td><td class="r"><button class="plain red" data-act="rtRemove" data-v="${s}">Remove</button></td></tr>`).join('')}</tbody></table>` : '<p class="empty" style="padding:24px">Nothing counted.</p>'}
    </div><div class="sh-f"><span class="note">${pcs(total)} counted</span><button class="btn" data-act="rtSubmitCount" ${total ? '' : 'disabled'}>Submit count</button></div>`;
}

Object.assign(GACT, {
  goPage: (v) => { S.page = v; S.sheet = null; if (v === 'mdNewReturn') S.rtNew = { store: '', send: {} }; render(); },
  rtTab: (v) => { S.rtTab = v; render(); },
  rtOpsTab: (v) => { S.rtOpsTab = v; render(); },
  rtSubmit: () => {
    const st = S.rtNew.store, lines = {}, src = {}, stock = rtStockOf(st);
    for (const [key, n] of Object.entries(S.rtNew.send)) {
      const [pool, sku] = key.split('|');
      if (!(n > 0 && n <= (stock[pool]?.[sku] || 0))) continue;
      lines[sku] = (lines[sku] || 0) + n; src[key] = n;
    }
    const alt = altNo();
    S.rets.unshift({ alt, store: st, lines, src, state: 'asked', at: '18 Oct' });
    // The hub means to say "ALT-… created", but its receipt lives on the New
    // Return page, which closes in the same render: no toast ever shows.
    S.page = 'mdReturns'; S.rtTab = 'progress';
    render();
  },
  rtCancel: (v) => {
    const r = S.rets.find((x) => x.alt === v);
    const note = window.prompt(`Cancel ${v}?\n${pcs(rtPcs(r))} still to pack is released. Anything already picked stays picked.\n\nNote (optional):`, '');
    if (note === null) return;
    r.state = 'cancelled'; r.note = note.trim(); r.doneAt = '18 Oct';
    toast(`${v} cancelled`);
    render();
  },
  rtEdit: (v) => toast(`${v}`, 'Edit opens the sheet only · a return has no Edit (it needs a to-store allotment)'),
  rtSend: (v) => {
    const r = S.rets.find((x) => x.alt === v);
    if (!window.confirm(`Send ${rtPcs(r)} pcs to HO?`)) return;
    const stock = rtStockOf(r.store);
    for (const [key, n] of Object.entries(r.src || {})) { const [pool, sku] = key.split('|'); stock[pool][sku] = Math.max(0, (stock[pool][sku] || 0) - n); }
    r.state = 'transit'; r.sentOn = '18 Oct'; r.koli = 1; r.count = null;
    r.sj = `SJ-${r.store}-${String(S.sjSeq++).padStart(6, '0')}`;
    S.rtBanner = { store: r.store, text: `<b class="mono">${r.sj}</b> · ${pcs(rtPcs(r))} on the way to HO` };
    render();
  },
  rtCount: (v) => openSheet('rcount', v, { counts: {} }),
  rtRemove: (v) => { delete S.sheet.counts[v]; renderSheet(); },
  rtSubmitCount: () => {
    const r = S.rets.find((x) => x.alt === S.sheet.id);
    r.count = { ...S.sheet.counts }; r.state = 'received'; r.doneAt = '18 Oct';
    toast('Received', `${pcs(rtGot(r))} into Return · ${r.store} at Gudang HO`);
    renderSheet(); render();
  },
});
document.addEventListener('change', (e) => {
  const t = e.target, key = t.dataset?.change;
  if (key === 'rtStore') { S.rtNew = { store: t.value, send: {} }; render(); }
  if (key === 'rtTab') { S.rtTab = t.value; render(); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset?.rtsend) {
    t.value = t.value.replace(/\D/g, '');
    S.rtNew.send[t.dataset.rtsend] = Number(t.value) || 0;
    const stock = rtStockOf(S.rtNew.store);
    const total = Object.entries(S.rtNew.send).reduce((a, [key, n]) => { const [pool, sku] = key.split('|'); return a + (n > 0 && n <= (stock[pool]?.[sku] || 0) ? n : 0); }, 0);
    $('.rt-foot span').textContent = pcs(total);
    $('[data-act="rtSubmit"]').disabled = !total;
  }
  if (t.dataset?.rtcnt) { S.sheet.counts[t.dataset.rtcnt] = Number(t.value.replace(/\D/g, '')) || 0; }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.target.dataset?.key !== 'rtscan') return;
  const raw = e.target.value.trim().toUpperCase();
  if (!raw) return;
  S.sheet.counts[raw] = (S.sheet.counts[raw] || 0) + 1;
  renderSheet();
  $('.rt-scan')?.focus();
});

render();
</script>

  /* ── Board: board.tsx + step-card.tsx ─────────────────────────────── */
  function stepCard({ id, title, pieces, sub, meta, lines, strip, step, off, dot, fresh }) {
    const tag = off ? 'div' : 'button';
    const at = off ? '' : ` type="button" data-act="open" data-v="${esc(id)}"`;
    return `<${tag} class="bcard${off ? ' off' : ''}${fresh ? ' arrive' : ''}"${at} data-card="${esc(id)}">
      ${strip ? `<span class="bstrip ${strip.tone}"${strip.title ? ` title="${esc(strip.title)}"` : ''}>${esc(strip.label)}</span>` : ''}
      <span class="bin"><span class="btop"><span class="btitle">${dot ? '<i class="bdot"></i>' : ''}${esc(title)}</span><span class="bfig">${pieces} <small>${pieces === 1 ? 'pc' : 'pcs'}</small></span></span>
        ${sub ? `<span class="bsub">${sub}</span>` : ''}
        ${lines?.length ? `<span class="blines">${lines.map((l) => `<span class="bline"><span>${esc(l.label)}</span><span>${pcs(l.pieces)}</span></span>`).join('')}</span>` : ''}

  }
  function lanes() {
    const pick = [], pack = [], ship = [];
    let pickN = 0, packN = 0, shipN = 0;
    for (const p of S.picks) {
      if (p.state === 'closed') continue;
      const n = sumOf(p.lines), skus = Object.keys(p.lines).length;
      const base = { id: p.id, title: artOf(p.alt).name, pieces: n, sub: `${shop(p.store)} · ${p.alt}`, meta: many(skus, 'SKU'), fresh: S.fresh === p.id };
      let strip = null;
      if (p.state === 'review') {
        if (NEW()) {
          // The decided flow: MD answers Continue or Accept short first.
          if (S.waiting !== 'shown') continue;
          pick.push({ strip: true, html: stepCard({ ...base, strip: { tone: 'grey', label: 'Waiting for MD' }, step: { label: 'Waiting', tone: 'mute', chevron: false }, off: true }) });
          continue;
        }
        // The hub: a short pick stays on Pick with its amber band.
        strip = { tone: 'warn', label: 'Short pick', title: `${p.why} · ${pcs(n)} short` };
      } else if (NEW() && p.back) strip = { tone: 'warn', label: `Back from ${p.back.from}`, title: `${pcs(p.back.n)} · ${p.back.by} · ${p.back.at}` };
      else if (NEW() && p.again) strip = { tone: 'info', label: `MD: ${p.again}` };
      else if (p.edited) strip = { tone: 'info', label: 'Edited by MD' };
      pickN += n;
      pick.push({ strip: !!strip, html: stepCard({ ...base, strip, step: { label: 'Pick' } }) });
    }
    for (const [store, pile] of Object.entries(S.piles)) {
      const n = pile.reduce((a, l) => a + l.qty, 0);
      if (!n) continue;
      const alts = [...new Set(pile.filter((l) => l.qty > 0).map((l) => l.alt))];
      packN += n;
      pack.push({ strip: false, html: stepCard({ id: `pack:${store}`, title: shop(store), pieces: n, sub: alts.length === 1 ? alts[0] : `${alts.length} allotments`, meta: many(alts.length, 'picklist'), step: { label: 'Pack' }, fresh: S.fresh === `pack:${store}` }) });
    }
    const byStore = {};

    }
    const only = (list) => (S.attn ? list.filter((c) => c.strip) : list).map((c) => c.html);
    return [
      { id: 'pick', title: 'Pick', tone: 'var(--mute)', cards: only(pick), pieces: pickN, empty: 'Nothing to pick', art: 'box' },
      { id: 'pack', title: 'Pack', tone: 'var(--warn)', cards: only(pack), pieces: packN, empty: 'Nothing to pack', art: 'box' },

  window.renderBoard = function () {
    const all = lanes();

      $('#page').innerHTML = `<div class="ph-top">Allotment</div><div class="ph-body">${all.map(sec).join('')}</div>

    const tray = (l) => `<section class="tray" aria-label="${l.title}"><header><i style="background:${l.tone}"></i><h2>${l.title}</h2><span>${l.cards.length}</span></header><div class="tray-b">${l.cards.join('') || `<div class="estate">${emptyPic(S.attn ? 'done' : l.art)}<p>${S.attn ? 'Nothing needs attention' : l.empty}</p></div>`}</div></section>`;
