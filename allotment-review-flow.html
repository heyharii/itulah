  /* ── Sheet head and foot (Sheet, SheetFooter) ─────────────────────── */
  const sheetHead = (title, { caption, kpi } = {}) => `<div class="hs-h"><div class="hs-ht"><span class="hs-crumb">Allotment</span><h2>${title}</h2>${caption ? `<span class="hs-cap">${caption}</span>` : ''}</div>${kpi ? `<div class="hs-kpi"><span>${kpi[0]}</span><b>${kpi[1]}</b></div>` : ''}<button class="hs-x" data-act="close" aria-label="Close">${svg(I.x, 18)}</button></div>`;
  const hstep = (key, sku, val, max, warn, label) => `<span class="hstep"><button class="hbtn step" data-act="${key === 'koli' ? 'kStepM' : 'stepM'}" data-k="${key}" data-v="${sku}" ${val <= 0 ? 'disabled' : ''} aria-label="One less">${svg(I.minus)}</button><input class="hin${warn && val < max ? ' bad' : ''}" inputmode="numeric" value="${val}" data-hstep="${key}" data-v="${sku}" data-max="${max}" aria-label="${label}"><button class="hbtn step" data-act="${key === 'koli' ? 'kStepP' : 'stepP'}" data-k="${key}" data-v="${sku}" ${val >= max ? 'disabled' : ''} aria-label="One more">${svg(I.plus)}</button></span>`;

  /* ── Pick: picking.tsx AcceptSheet + pick-lines.tsx ───────────────── */
  window.pickSheet = function () {
    const sh = S.sheet;
    const p = S.picks.find((x) => x.id === sh.id);
    sh.picked ||= { ...p.lines };
    const art = ALTS[p.alt].art, a = ART[art];
    const got = (sku) => Math.min(sh.picked[sku] ?? p.lines[sku], p.lines[sku]);
    const asked = sumOf(p.lines);
    const left = asked - Object.keys(p.lines).reduce((t, s) => t + got(s), 0);
    const cannot = !!sh.cannot && left > 0;
    const colours = {};
    for (const sku of Object.keys(p.lines)) (colours[SKUS[sku].colour] ||= []).push(sku);
    const facts = [];
    if (p.state === 'review') facts.push(['Short pick', `${esc(p.why)} · ${OPS} · ${p.whyAt}`]);
    if (NEW() && p.back) facts.push([`Back from ${p.back.from}`, `${pcs(p.back.n)} · ${p.back.by} · ${p.back.at}`]);
    const lines = `<div class="pl"><div class="pl-art">${thumb(art)}<div><b>${esc(a.name)}</b><span><span class="mono" style="font-size:15px">${art}</span> · ${a.div}</span><span>${esc(a.sup)}</span></div></div>
      ${Object.entries(colours).map(([colour, skus]) => {
        const n = skus.reduce((t, s) => t + p.lines[s], 0);
        return `<div class="pl-col"><div class="pl-colh"><i style="background:${SKUS[skus[0]].hex}"></i><div><b>${colour}</b><span>${skus.length === 1 ? '1 size' : `${skus.length} sizes`} · ${pcs(n)}</span></div></div>
          <table class="ht"><thead><tr><th>Size</th><th class="r">To pick</th><th class="r">Picked</th></tr></thead><tbody>${skus.map((sku) => `<tr><td><b>${SKUS[sku].size}</b><span class="mono">${sku}</span></td><td class="r">${p.lines[sku]}</td><td class="r">${hstep('picked', sku, got(sku), p.lines[sku], true, 'Picked')}</td></tr>`).join('')}</tbody></table></div>`;
      }).join('')}</div>`;
    const why = cannot ? `<div class="why" role="radiogroup" aria-label="Why?"><span class="why-l">Why?<em>*</em></span>${PICK_WHY.map((w) => `<button class="why-r${sh.why === w ? ' on' : ''}" role="radio" aria-checked="${sh.why === w}" data-act="why" data-v="${esc(w)}"><i></i>${esc(w)}</button>`).join('')}</div>` : '';
    const again = NEW() && p.again ? `<div class="hbanner"><b>MD: ${esc(p.again)}</b><span>${p.againBy || MD}</span></div>` : '';
    let status = '';
    if (left > 0) status = cannot ? `<p class="st bad">${pcs(left)} short${sh.why ? '' : '<span> · choose why</span>'}</p>` : `<p class="st">${pcs(left)} left on the picklist</p>`;
    const buttons = [`<button class="hbtn" data-act="nope">${svg(I.printer)}Print</button>`];
    if (left > 0 && !cannot) buttons.push(NEW() ? '<button class="hbtn red" data-act="cpOpen">Cannot pick</button>' : '<button class="hbtn" data-act="cannot">Cannot pick the rest</button>', `<button class="hbtn primary" data-act="pickLater" ${asked - left <= 0 ? 'disabled' : ''}>${!NEW() ? 'Continue later' : asked - left > 0 ? `Submit ${pcs(asked - left)}` : 'Submit'}</button>`);
    else buttons.push(`<button class="hbtn primary" data-act="pickDone" ${cannot && !sh.why ? 'disabled' : ''}>Submit</button>`);
    return `${sheetHead(`Pick · ${esc(shop(p.store))}`, { caption: p.alt, kpi: ['To pick', pcs(asked)] })}
      <div class="sh-b"><div class="hcol">${again}${facts.length ? `<dl class="hfacts">${facts.map(([t, v]) => `<div><dt>${t}</dt><dd>${v}</dd></div>`).join('')}</dl>` : ''}${lines}${why}</div></div>
      <div class="hs-f">${status}${buttons.join('')}</div>${NEW() && sh.cp ? cpDialog(p, sh) : ''}`;
  };
  /* New: Cannot pick asks only for a note (Hari, 18 Oct), in the look of the
     hub's CancelDialog: what cannot be picked, a Note, Keep, red Cannot pick. */
  function cpDialog(p, sh) {
    const rows = Object.keys(p.lines).map((sku) => [sku, p.lines[sku] - Math.min(sh.picked[sku] ?? p.lines[sku], p.lines[sku])]).filter(([, n]) => n > 0);
    const n = rows.reduce((a, [, k]) => a + k, 0);
    return `<div class="cx-veil" data-act="cpKeep"></div><div class="cx-dlg" role="dialog" aria-modal="true" aria-label="Cannot pick">
      <h3>Cannot pick ${pcs(n)}</h3>
      <ul class="cx-rows">${rows.map(([sku, k]) => `<li><span class="cx-f"><span>${esc(skuName(sku))}</span><b>${pcs(k)}</b></span><span class="cx-d">${sku}</span></li>`).join('')}</ul>
      <label class="cx-lab" for="cpNote">Note</label><textarea id="cpNote" rows="2" data-input="cpNote">${esc(sh.cp.note || '')}</textarea>
      <div class="cx-foot"><button class="btn ghosty" data-act="cpKeep">Keep</button><button class="btn red" data-act="cpGo">Cannot pick</button></div></div>`;
  }
  /* Submit, Continue later and the one Cannot continue. */
  function submitPick(how) {
    const sh = S.sheet;
    const p = S.picks.find((x) => x.id === sh.id);
    const short = {};
    let took = 0;
    for (const [sku, n] of Object.entries(p.lines)) {
      const g = Math.min(sh.picked?.[sku] ?? n, n);
      if (g) addToPile(p.store, p.alt, sku, g);
      took += g;
      if (n - g > 0) short[sku] = n - g;
    }
    const said = `${p.alt} · ${shop(p.store)}`;
    const left = sumOf(short);
    if (how === 'later') {
      p.lines = short;
      // New: what was found goes to Pack; the rest stays on the picklist.
      if (NEW()) toast(`${pcs(took)} to Pack`, `${pcs(left)} left on the picklist`);
      else toast('Pick saved · the rest stays on the picklist');
    } else if (left > 0) {
      for (const r of S.reviews) if (r.pick === p.id && r.state === 'open') r.state = 'gone';
      S.reviews = S.reviews.filter((r) => r.state !== 'gone');
      const r = addReview({ kind: 'pick', alt: p.alt, stores: [p.store], why: sh.why, lines: Object.keys(p.lines).map((sku) => ({ sku, asked: p.lines[sku], short: short[sku] || 0 })), pick: p.id });
      p.lines = short; p.state = 'review'; p.review = r.id; p.why = sh.why; p.whyAt = now(); p.again = null; p.back = null;
      toast(NEW() ? `${pcs(left)} short · sent to MD` : `${pcs(left)} short reported`, said);
    } else {
      p.state = 'closed';
      S.reviews = S.reviews.filter((r) => !(r.pick === p.id && r.state === 'open'));
      toast('Picklist accepted', said);
    }
    S.fresh = took ? `pack:${p.store}` : S.fresh;
    closeSheet();
  }

  /* ── Pack: pack-sheet.tsx ─────────────────────────────────────────── */
  const kp = (k) => sumOf(k.items);
  function fitted(draft, left) {
    const koli = draft.koli.map((k) => ({ no: k.no, items: { ...k.items } }));
    for (const k of koli) for (const sku of Object.keys(k.items)) if (!left.has(sku) || !k.items[sku]) delete k.items[sku];
    for (const [sku, n] of left) {
      let have = koli.reduce((t, k) => t + (k.items[sku] || 0), 0);
      for (let i = koli.length - 1; i >= 0 && have > n; i--) {
        const take = Math.min(koli[i].items[sku] || 0, have - n);
        koli[i].items[sku] -= take; have -= take;
        if (!koli[i].items[sku]) delete koli[i].items[sku];
      }
    }
    if (!left.size) return { koli: [], active: null };
    return { koli, active: koli.some((k) => k.no === draft.active) ? draft.active : (koli.at(-1)?.no ?? null) };
  }
  function packState() {
    const sh = S.sheet, store = sh.id;
    const left = leftOf(store), packed = packedOf(store);
    let draft = fitted(S.drafts[store] || { koli: [], active: null }, left);
    // Opening Pack with no koli open: the next koli starts with everything.
    if (!sh.opened) {
      sh.opened = true;
      if (draft.koli.every((k) => !kp(k)) && left.size) { const no = packed.length + 1; draft = { koli: [{ no, items: Object.fromEntries(left) }], active: no }; }
    }
    S.drafts[store] = draft;
    const pile = [...left].map(([sku, n]) => [sku, n - draft.koli.reduce((t, k) => t + (k.items[sku] || 0), 0)]).filter(([, n]) => n > 0);
    return { store, left, packed, draft, pile, active: draft.koli.find((k) => k.no === draft.active) ?? null };
  }
  window.packSheet = function () {
    const st = packState();
    const { store, left, packed, draft, pile, active } = st;
    const shownNo = (no) => packed.length + draft.koli.findIndex((k) => k.no === no) + 1;
    const pileN = pile.reduce((t, [, n]) => t + n, 0), leftN = [...left.values()].reduce((a, b) => a + b, 0);
    const rows = (entries, filling) => {
      const byArt = {};
      for (const e of [...entries].sort((x, y) => x[0].localeCompare(y[0]))) (byArt[SKUS[e[0]].art] ||= []).push(e);
      return `<div class="pk-arts">${Object.entries(byArt).map(([art, list]) => `<div class="pk-art"><div class="pk-ah">${thumb(art, SKUS[list[0][0]].hex)}<div><b>${esc(ART[art].name)}</b><span><span class="mono" style="font-size:15px">${art}</span> · ${ART[art].div}</span></div></div>
        <div>${list.map(([sku, n]) => { const free = pile.find(([s]) => s === sku)?.[1] ?? 0; return `<div class="pk-row"><i style="background:${SKUS[sku].hex}"></i><div><b>${skuName(sku)}</b><span class="mute-mono">${sku}</span></div>${filling ? hstep('koli', sku, n, n + free, false, 'In koli') : `<b>${n}</b>`}</div>`; }).join('')}</div></div>`).join('')}</div>`;
    };
    const backLabel = NEW() ? 'Back to Pick' : 'Put back';
    const putBack = `<button class="hbtn danger" data-act="obBack" data-v="${store}">${svg(I.undo)}${backLabel}</button>`;
    let foot;
    if (active) foot = `<p class="st">${pileN ? `${pcs(pileN)} not in a koli` : ''}</p>${putBack}<button class="hbtn primary" data-act="kSubmit" ${kp(active) ? '' : 'disabled'}>Submit</button>`;
    else if (leftN) foot = `<p class="st"></p>${putBack}<button class="hbtn primary" data-act="kAdd">Add koli</button>`;
    else foot = `<p class="st">${packed.length ? `${packed.length} koli · ${pcs(packed.reduce((a, k) => a + koliN(k), 0))}` : ''}</p><button class="hbtn primary" data-act="close">Done</button>`;
    const body = `<div class="pk">
      ${pile.length ? `<div class="pk-box pile"><div class="pk-bh"><b>Not in a koli</b><span>${pcs(pileN)}</span><span class="sp"></span>${active ? `<button class="hbtn tint sm" data-act="kAll">All to koli ${shownNo(active.no)}</button>` : ''}</div>${rows(pile, false)}</div>` : ''}
      ${draft.koli.map((k) => { const on = k.no === active?.no; const entries = Object.entries(k.items).filter(([, n]) => n > 0); return `<div class="pk-box${on ? ' on' : ''}"><div class="pk-bh${on ? '' : ' pickable'}" ${on ? '' : `data-act="kPick" data-v="${k.no}" role="button" tabindex="0"`}><i class="pk-radio"></i><b>Koli ${shownNo(k.no)}</b><span>${pcs(kp(k))}</span><span class="sp"></span>${kp(k) ? '' : `<button class="hbtn sm" data-act="kRemove" data-v="${k.no}">Remove</button>`}</div>${entries.length ? rows(entries, on) : ''}</div>`; }).join('')}
      ${leftN ? `<button class="pk-add" data-act="kAdd">${svg(I.plus)}Add koli</button>` : ''}
      ${packed.length ? `<div class="pk-done">Packed · ${packed.length} koli</div>${packed.map((k, i) => { const open = S.sheet.unfold?.[k.no]; const arts = [...new Set(k.lines.map((l) => SKUS[l.sku].art))]; return `<section class="pk-fold${open ? ' open' : ''}"><button data-act="kFold" data-v="${k.no}" aria-expanded="${!!open}">${svg(I.chevD)}<b>Koli ${i + 1}</b><span class="mono">${k.no}</span><span class="sp"></span><span>${many(arts.length, 'article')} · ${pcs(koliN(k))}</span></button><div class="pk-fold-b">${arts.map((art) => { const ls = k.lines.filter((l) => SKUS[l.sku].art === art); return `<div class="pk-line">${thumb(art, SKUS[ls[0].sku].hex)}<div><b>${esc(ART[art].name)}</b><span class="mono" style="font-size:15px">${art}</span><span>${ls.map((l) => `${skuName(l.sku)} ${l.qty}`).join(' · ')}</span></div><b>${pcs(ls.reduce((a, l) => a + l.qty, 0))}</b></div>`; }).join('')}<button class="hbtn tint sm" style="align-self:flex-start" data-act="nope">Open koli</button></div></section>`; }).join('')}` : ''}
      ${!leftN && !packed.length ? '<p class="pk-empty">Nothing left to pack for this store.</p>' : ''}
    </div>`;
    return `${sheetHead(`Pack · ${esc(shop(store))}`)}<div class="sh-b">${body}</div><div class="hs-f">${foot}</div>`;
  };
  const saveDraft = (draft) => { S.drafts[S.sheet.id] = draft; renderSheet(); };
  function setInActive(sku, qty) {
    const { draft, active } = packState();
    if (!active) return;
    saveDraft({ ...draft, koli: draft.koli.map((k) => (k.no === active.no ? { no: k.no, items: Object.fromEntries(Object.entries({ ...k.items, [sku]: qty }).filter(([, n]) => n > 0)) } : k)) });
  }
  function packKoli() {
    const { store, draft, active, packed } = packState();
    const pile = S.piles[store];
    const lines = [];
    for (const [sku, qty] of Object.entries(active.items)) {
      let n = qty;
      for (const l of pile) {
        if (l.sku !== sku || !n || !l.qty) continue;
        const t = Math.min(l.qty, n);
        l.qty -= t; n -= t;
        lines.push({ alt: l.alt, sku, qty: t });
      }
    }
    S.piles[store] = pile.filter((l) => l.qty > 0);
    const no = `A${String(S.koliSeq++).padStart(5, '0')}`;
    S.koli.push({ no, store, lines, state: 'ready', at: now() });
    const rest = draft.koli.filter((k) => k.no !== active.no);
    S.drafts[store] = { koli: rest, active: rest.at(-1)?.no ?? null };
    S.fresh = `ship:${store}`;
    toast(`Koli ${packed.length + 1} packed · ${pcs(lines.reduce((a, l) => a + l.qty, 0))} · label printing`);
    render();
  }

  /* ── Dispatch: trucks.tsx DispatchSheet ───────────────────────────── */
  window.shipSheet = function () {
    const sh = S.sheet;
    const ready = S.koli.filter((k) => k.state === 'ready');
    sh.tick ||= Object.fromEntries(ready.map((k) => [k.no, true]));
    for (const k of ready) if (!(k.no in sh.tick)) sh.tick[k.no] = true;
    const by = {};
    for (const k of ready) (by[k.store] ||= []).push(k);
    const ids = Object.keys(by).sort();
    const cur = by[sh.focus] ? sh.focus : by[sh.id] ? sh.id : ids[0];
    const going = ids.filter((s) => by[s].some((k) => sh.tick[k.no]));
    const goingK = ready.filter((k) => sh.tick[k.no]);
    const mine = by[cur] || [];
    const ticked = mine.filter((k) => sh.tick[k.no]).length;
    const rail = `<div class="dp-rail"><div><b>Stores</b><span>${going.length} going</span></div>${ids.map((s) => { const t = by[s].filter((k) => sh.tick[k.no]).length; return `<button class="${s === cur ? 'on' : ''}" data-act="dFocus" data-v="${s}"><span>${esc(shop(s))}</span>${t === 0 ? '<span class="faint">—</span>' : t === by[s].length ? `<span>${t} koli</span>` : `<span>${t}<span class="mute"> / ${by[s].length}</span></span>`}</button>`; }).join('')}</div>`;
    const act = NEW() ? 'Back to Pick' : 'Unpack';
    const table = `<div style="overflow-x:auto"><table class="dp-t"><thead><tr><th style="width:32px"><input type="checkbox" data-change="dAll" aria-label="Every koli" ${ticked === mine.length ? 'checked' : ''}></th><th>Koli</th><th class="r">Pcs</th><th class="r">Packed</th><th><span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">${act}</span></th></tr></thead>
      <tbody>${mine.map((k) => { const arts = [...new Set(k.lines.map((l) => SKUS[l.sku].art))]; return `<tr><td><input type="checkbox" data-change="tick" data-v="${k.no}" ${sh.tick[k.no] ? 'checked' : ''} aria-label="${k.no}"></td><td><span class="no${sh.tick[k.no] ? '' : ' off'}">${k.no}</span><span class="ph">${arts.map((art) => `<span>${garment(art, SKUS[k.lines.find((l) => SKUS[l.sku].art === art).sku].hex)}</span>`).join('')}</span></td><td class="r">${koliN(k)}</td><td class="r">${k.at || '20:58'}</td><td class="r"><button class="hbtn sm" data-act="obUnpack" data-v="${k.no}">${act}</button></td></tr>`; }).join('')}</tbody></table></div>`;
    const body = ready.length ? `<div class="dp">${rail}<div class="dp-main"><h4>${esc(shop(cur))}</h4>${ticked ? '' : '<p>Not going on this trip</p>'}${table}</div></div>` : '<p class="pk-empty">No packed koli is waiting for a trip.</p>';
    return `${sheetHead('Dispatch')}<div class="sh-b">${body}<label class="hfield"><span>Trip data</span><textarea data-input="note">${esc(sh.note || '')}</textarea></label></div>
      <div class="hs-f"><p class="st">${goingK.length ? `${many(going.length, 'store')} · ${goingK.length} koli · ${pcs(goingK.reduce((a, k) => a + koliN(k), 0))}` : 'Tick the koli going on it'}</p><button class="hbtn primary" data-act="shipDone" ${goingK.length ? '' : 'disabled'}>Submit</button></div>`;
  };

  /* ── Put back: move-back.tsx MoveBackDialog ───────────────────────── */
  function dlgSource(d) {
    if (d.from === 'packed') {
      const k = S.koli.find((x) => x.no === d.koli);
      const by = {};
      for (const l of k?.lines || []) by[l.sku] = (by[l.sku] || 0) + l.qty;
      return Object.entries(by).map(([sku, n]) => ({ sku, where: d.koli, now: n }));
    }
    const by = {};
    for (const l of S.piles[d.store] || []) if (l.qty > 0) { (by[l.sku] ||= { now: 0, alts: new Set() }); by[l.sku].now += l.qty; by[l.sku].alts.add(l.alt); }
    return Object.entries(by).map(([sku, x]) => ({ sku, where: [...x.alts].sort().join(', '), now: x.now }));
  }
  function openDlg(d) {
    // New: at Pack the missing pieces are chosen from nothing; a koli that
    // cannot go goes back whole. The hub starts every line at all of it.
    const lines = dlgSource(d);
    d.qty = Object.fromEntries(lines.map((l) => [l.sku, d.mode === 'new' && d.from === 'picked' ? 0 : l.now]));
    d.enter = true;
    S.dlg = d;
    renderDlg();
  }
  function renderDlg() {
    const d = S.dlg;
    if (!d) { dlgEl.innerHTML = ''; return; }
    const lines = dlgSource(d);
    const isNew = d.mode === 'new', packed = d.from === 'packed';
    const qOf = (l) => Math.max(0, Math.min(l.now, d.qty[l.sku] ?? 0));
    let moved = 0, total = 0;
    for (const l of lines) { moved += qOf(l); total += l.now; }
    const everything = total > 0 && moved === total;
    const to = d.to;
    const kWord = packed ? (everything ? `${d.koli} opened · label void` : `${d.koli} reopened · label reprinted`) : null;
    let note;
    if (!moved) note = 'Choose what goes back.';
    else if (isNew) note = [kWord, `${pcs(moved)} to pick again`].filter(Boolean).join(' · ');
    else note = [kWord, to === 'picked' ? `${pcs(moved)} join the picked pile` : `${pcs(moved)} back to stock`, to === 'pick' ? `${moved} to pick again` : null].filter(Boolean).join(' · ');
    const WHERE = { picked: 'Picked', pick: 'Picklist' };
    const title = isNew ? `Back to Pick · ${esc(shop(d.store))}` : `Put back from ${esc(shop(d.store))}`;
    const id = packed ? d.koli : [...new Set(lines.map((l) => l.where))].join(', ');
    const col = isNew ? 'Back to Pick' : 'Put back';
    const split = (q, keep) => `<small>${isNew ? 'Back' : 'Put back'} <b>${q}</b> · Keep <b>${keep}</b></small>`;
    const stepper = (l) => `<span><button class="hbtn icon" data-act="dlgM" data-v="${l.sku}" ${qOf(l) <= 0 ? 'disabled' : ''} aria-label="One less, ${l.sku}">${svg(I.minus)}</button><input inputmode="numeric" value="${qOf(l)}" data-hstep="dlg" data-v="${l.sku}" data-max="${l.now}" aria-label="${col} ${l.sku}"><button class="hbtn icon" data-act="dlgP" data-v="${l.sku}" ${qOf(l) >= l.now ? 'disabled' : ''} aria-label="One more, ${l.sku}">${svg(I.plus)}</button></span>`;
    const phone = S.device === 'phone';
    // Only the opening animates; a step redraws the dialog in place.
    const enter = d.enter ? ' in' : '';
    d.enter = false;
    const table = phone
      ? `<div class="hd-cards">${lines.map((l) => `<div class="${qOf(l) ? '' : 'zero'}"><div class="top"><div><div>${esc(fullName(l.sku))}</div><span class="mute-mono">${l.sku}${l.where ? ` · ${l.where}` : ''}</span></div><span style="white-space:nowrap">Now <b>${l.now}</b></span></div><span class="hd-st">${stepper(l)}${split(qOf(l), l.now - qOf(l))}</span></div>`).join('')}<div style="flex-direction:row;justify-content:space-between;background:var(--soft-2);font-weight:500"><span>Total</span><span>${total} now · ${moved} back</span></div></div>`
      : `<div class="hd-wrap"><table class="hd-t"><thead><tr><th style="width:48px">No.</th><th>SKU</th><th>${packed ? 'Koli' : 'Picklist'}</th><th class="r" style="width:80px">Now</th><th class="c" style="width:224px">${col}</th></tr></thead>
        <tbody>${lines.map((l, i) => `<tr class="${qOf(l) ? '' : 'zero'}"><td class="idx">${i + 1}</td><td><div>${esc(fullName(l.sku))}</div><span class="mute-mono">${l.sku}</span></td><td class="wh">${l.where}</td><td class="r">${l.now}</td><td class="c"><span class="hd-st">${stepper(l)}${split(qOf(l), l.now - qOf(l))}</span></td></tr>`).join('')}</tbody>
        <tfoot><tr><td></td><td colspan="2">Total</td><td class="r">${total}</td><td class="c">${moved}</td></tr></tfoot></table></div>`;
    const chips = packed && !isNew ? `<div class="hd-chips" role="group" aria-label="To">${['picked', 'pick'].map((w) => `<button aria-pressed="${to === w}" data-act="dlgTo" data-v="${w}">${WHERE[w]}</button>`).join('')}</div>` : '<span></span>';
    const primary = isNew ? (moved ? `Back to Pick · ${pcs(moved)}` : 'Back to Pick') : moved ? `Put back ${pcs(moved)} to ${WHERE[to]}` : 'Put back';
    dlgEl.innerHTML = `<div class="hd-scrim${enter}" data-act="dlgClose"></div><div class="hd${enter}" role="dialog" aria-modal="true" aria-label="${title}">
      <div class="hd-h"><div><b>${title}</b><p><span class="mono">${esc(id)}</span> · ${pcs(total)} · now ${packed ? 'packed' : 'picked'}</p></div><button class="hbtn quiet icon" data-act="dlgClose" aria-label="Close">${svg(I.x)}</button></div>
      <div class="hd-b">${lines.length ? `<div class="hd-tools">${chips}<div style="display:flex;gap:4px"><button class="hbtn quiet sm" data-act="dlgFill" data-v="all">All</button><button class="hbtn quiet sm" data-act="dlgFill" data-v="none">None</button></div></div>${table}` : '<p class="pk-empty">Nothing is waiting here any more.</p>'}</div>
      <div class="hd-f">${lines.length ? `<p>${note}</p>` : ''}<div><button class="hbtn" data-act="dlgClose">Keep</button><button class="hbtn primary" data-act="dlgGo" ${moved ? '' : 'disabled'}>${primary}</button></div></div></div>`;
  }
  /* What a move back does to the prototype's goods: out of the pile or the
     koli; to the picked pile, or onto the picklist again (marked in New). */
  function applyBack(d, quiet) {
    const moved = {};
    const take = (list, sku, want) => {
      let n = want;
      for (const l of list) {
        if (l.sku !== sku || !n || !l.qty) continue;
        const t = Math.min(l.qty, n);
        l.qty -= t; n -= t;
        (moved[l.alt] ||= {})[sku] = (moved[l.alt][sku] || 0) + t;
      }
    };
    let k = null;
    if (d.from === 'picked') {
      for (const [sku, n] of Object.entries(d.qty)) if (n > 0) take(S.piles[d.store] || [], sku, n);
      S.piles[d.store] = (S.piles[d.store] || []).filter((l) => l.qty > 0);
    } else {
      k = S.koli.find((x) => x.no === d.koli);
      for (const [sku, n] of Object.entries(d.qty)) if (n > 0) take(k.lines, sku, n);
      k.lines = k.lines.filter((l) => l.qty > 0);
      if (!k.lines.length) k.state = 'gone';
    }
    const total = Object.values(moved).reduce((a, m) => a + sumOf(m), 0);
    let again = 0;
    if (d.to === 'picked') {
      for (const [alt, skus] of Object.entries(moved)) for (const [sku, n] of Object.entries(skus)) addToPile(d.store, alt, sku, n);
      S.fresh = `pack:${d.store}`;
    } else {
      const from = d.from === 'picked' ? 'Pack' : 'Dispatch';
      for (const [alt, skus] of Object.entries(moved)) {
        let p = S.picks.find((x) => x.alt === alt && x.store === d.store && x.state === 'open');
        if (!p) { p = { id: `p${Math.random().toString(36).slice(2, 6)}`, alt, store: d.store, lines: {}, state: 'open' }; S.picks.push(p); }
        for (const [sku, n] of Object.entries(skus)) p.lines[sku] = (p.lines[sku] || 0) + n;
        const n = sumOf(skus);
        again += n;
        p.back = { from, n: (p.back?.from === from ? p.back.n : 0) + n, by: OPS, at: now() };
        S.fresh = p.id;
      }
    }
    if (quiet) return;
    if (d.mode === 'new') toast(`${pcs(total)} back to Pick`, [shop(d.store), k && k.state === 'gone' ? `${k.no} emptied` : k ? 'label reprinted' : null].filter(Boolean).join(' · '));
    else toast(`${pcs(total)} put back`, [d.to === 'picked' ? 'Picked' : 'Picklist', k && k.state === 'gone' ? `${k.no} emptied` : k ? 'label reprinted' : null, d.to === 'pick' && again ? `${pcs(again)} to pick again` : null].filter(Boolean).join(' · '));
  }
  /* The re-pick finds nothing: the one Cannot continue, at Pick. */
  function repickFails(store, from, why) {
    for (const p of S.picks.filter((x) => x.store === store && x.state === 'open' && x.back?.from === from)) {
      S.sheet = { type: 'pick', id: p.id, picked: Object.fromEntries(Object.keys(p.lines).map((s) => [s, 0])), cannot: true, why };
      submitPick('done');
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && S.dlg) { e.stopImmediatePropagation(); S.dlg = null; renderDlg(); }
    else if (e.key === 'Escape' && S.sheet?.cp) { e.stopImmediatePropagation(); S.sheet.cp = null; renderSheet(); }
  }, true);
  document.addEventListener('input', (e) => { if (e.target.dataset?.input === 'cpNote' && S.sheet?.cp) S.sheet.cp.note = e.target.value; });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset?.hstep) {
      const n = Math.max(0, Math.min(Number(t.dataset.max), Number(t.value.replace(/\D/g, '')) || 0));
      if (t.dataset.hstep === 'dlg') { S.dlg.qty[t.dataset.v] = n; return renderDlg(); }
      if (t.dataset.hstep === 'koli') return setInActive(t.dataset.v, n);
      S.sheet[t.dataset.hstep][t.dataset.v] = n;
      return renderSheet();
    }
    if (t.dataset?.change === 'dAll') {
      const sh = S.sheet;
      const ready = S.koli.filter((k) => k.state === 'ready');
      const ids = [...new Set(ready.map((k) => k.store))].sort();
      const cur = ids.includes(sh.focus) ? sh.focus : ids.includes(sh.id) ? sh.id : ids[0];
      for (const k of ready) if (k.store === cur) sh.tick[k.no] = t.checked;
      renderSheet();
    }
  });

  Object.assign(GACT, {
    obVer: (v) => { S.board = v; S.dlg = null; if (S.sheet && ['pick', 'pack', 'ship'].includes(S.sheet.type)) S.sheet.cannot = false; render(); },
    obAttn: () => { S.attn = !S.attn; render(); },
    obFold: (v) => { S.pfold[v] = !S.pfold[v]; render(); },
    pickDone: () => submitPick('done'),
    pickReview: () => submitPick('done'),
    pickLater: () => submitPick('later'),
    cpOpen: () => { S.sheet.cp = { note: '' }; renderSheet(); $('#cpNote')?.focus(); },
    cpKeep: () => { S.sheet.cp = null; renderSheet(); },
    // The note is what MD reads on the review; none written, it says Cannot pick.
    cpGo: () => { const sh = S.sheet; sh.why = sh.cp.note.trim() || 'Cannot pick'; sh.cp = null; submitPick('done'); },
    kAdd: () => { const { draft, packed } = packState(); const no = Math.max(packed.length, ...draft.koli.map((k) => k.no)) + 1; saveDraft({ koli: [...draft.koli, { no, items: {} }], active: no }); },
    kPick: (v) => { const { draft } = packState(); saveDraft({ ...draft, active: Number(v) }); },
    kRemove: (v) => { const { draft } = packState(); const koli = draft.koli.filter((k) => k.no !== Number(v)); saveDraft({ koli, active: draft.active === Number(v) ? (koli.at(-1)?.no ?? null) : draft.active }); },
    kAll: () => { const { draft, pile, active } = packState(); saveDraft({ ...draft, koli: draft.koli.map((k) => (k.no === active.no ? { no: k.no, items: pile.reduce((m, [sku, n]) => ({ ...m, [sku]: (m[sku] || 0) + n }), { ...k.items }) } : k)) }); },
    kStepM: (v) => { const { active } = packState(); setInActive(v, (active.items[v] || 0) - 1); },
    kStepP: (v) => { const { active } = packState(); setInActive(v, (active.items[v] || 0) + 1); },
    kSubmit: () => packKoli(),
    kFold: (v) => { S.sheet.unfold = { ...(S.sheet.unfold || {}), [v]: !S.sheet.unfold?.[v] }; renderSheet(); },
    dFocus: (v) => { S.sheet.focus = v; renderSheet(); },
    // Pack sheet's Put back (Now) / Back to Pick (New): over the sheet.
    obBack: (v) => openDlg({ from: 'picked', store: v, to: 'pick', mode: S.board }),
    // Dispatch sheet's Unpack (Now) / Back to Pick (New): the sheet closes and
    // the dialog opens over the board, as board.tsx does.
    obUnpack: (v) => {
      const k = S.koli.find((x) => x.no === v);
      closeSheet();
      openDlg({ from: 'packed', store: k.store, koli: v, to: S.board === 'new' ? 'pick' : 'picked', mode: S.board });
    },
    dlgClose: () => { S.dlg = null; renderDlg(); },
    dlgTo: (v) => { S.dlg.to = v; renderDlg(); },
    dlgFill: (v) => { for (const l of dlgSource(S.dlg)) S.dlg.qty[l.sku] = v === 'all' ? l.now : 0; renderDlg(); },
    dlgM: (v) => { S.dlg.qty[v] = Math.max(0, (S.dlg.qty[v] || 0) - 1); renderDlg(); },
    dlgP: (v) => { S.dlg.qty[v] = (S.dlg.qty[v] || 0) + 1; renderDlg(); },
    dlgGo: () => { const d = S.dlg; S.dlg = null; applyBack(d); render(); },
    // The story's damaged piece at the bench and its koli that cannot be
    // found: no Cannot continue at Pack or Dispatch any more (18 Oct). They go
    // back to Pick; the re-pick cannot go on, and that is the one report.
    packReview: () => {
      const sh = S.sheet;
      const qty = {};
      for (const [key, n] of Object.entries(sh.out || {})) if (n) { const sku = key.split('|')[1]; qty[sku] = (qty[sku] || 0) + n; }
      applyBack({ from: 'picked', store: sh.id, to: 'pick', qty, mode: 'new' }, true);
      repickFails(sh.id, 'Pack', sh.why === 'Item damaged' ? 'Item damaged' : 'Item not found in the pool');
      S.sheet = null;
    },
    shipReview: () => {
      const sh = S.sheet;
      for (const k of S.koli.filter((x) => x.state === 'ready' && sh.bad?.[x.no])) {
        const qty = {};
        for (const l of k.lines) qty[l.sku] = (qty[l.sku] || 0) + l.qty;
        applyBack({ from: 'packed', store: k.store, koli: k.no, to: 'pick', qty, mode: 'new' }, true);
        repickFails(k.store, 'Dispatch', sh.why === 'Koli damaged' ? 'Item damaged' : 'Item not found in the pool');
      }
      S.sheet = null;
    },
  });

  render();
})();
</script>
</body>
</html>
