<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pack sheet options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1d1f;--body:#6e6e73;--faint:#c7c7cc;--canvas:#fff;--soft:#fafafb;
  --hair:#e8e8ec;--row:#eeeef1;--scrim:rgb(208 208 213 / 48%);
  --accent:#2862dc;--accent-bg:#eef3fc;--ok:#248a3d;--ok-bg:#eaf6ee;--bad:#d70015;--warn:#a66c1f;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:#f2f2f5;color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}

/* proto bar */
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--hair)}
.bar b{font-weight:600;margin-right:4px}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:#f0f0f3}
.seg button{padding:5px 11px;border-radius:7px;color:var(--body)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/8%)}
.grp{display:flex;align-items:center;gap:6px}
.grp>span{color:var(--body)}

/* stage + board ghost */
.stage{display:flex;justify-content:center;padding:24px 16px 60px}
.frame{position:relative;width:1180px;height:820px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/5%),0 8px 30px rgb(0 0 0/6%)}
.frame.phone{width:414px;height:896px;border-radius:40px}
.frame.tablet{width:820px;height:1180px;border-radius:28px}
.tablet .sheet{top:20px;bottom:20px;width:760px}
.ghost{position:absolute;inset:0;padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;filter:saturate(.6)}
.ghost .lane{background:#f5f6f8;border-radius:14px;padding:12px}
.ghost .lane i{display:block;height:84px;border-radius:12px;background:#fff;margin-top:10px}
.phone .ghost{grid-template-columns:1fr}
.scrim{position:absolute;inset:0;background:var(--scrim)}

/* sheet */
.sheet{position:absolute;left:50%;top:24px;bottom:24px;width:760px;transform:translateX(-50%);background:#fff;border-radius:18px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgb(0 0 0/14%);overflow:hidden}
.phone .sheet{left:0;right:0;width:auto;top:56px;bottom:0;transform:none;border-radius:18px 18px 0 0}
.head{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--hair)}
.phone .head{padding:16px 16px 14px}
.head .crumb{color:var(--body)}
.head h2{margin:2px 0 0;font-size:19px;font-weight:600}
.head .fig{margin-left:auto;text-align:right}
.head .fig strong{display:block;font-size:24px;font-weight:700;line-height:1.1}
.head .fig span{color:var(--body)}
.head .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--body);flex:none}
.head .x:hover{background:#f2f2f5}
.body{flex:1;overflow:auto;padding:18px 24px 24px;overscroll-behavior:contain}
.phone .body{padding:14px 16px 20px}
.foot{display:flex;align-items:center;gap:12px;padding:14px 24px calc(14px + var(--safe,0px));border-top:1px solid var(--hair)}
.phone .foot{--safe:20px;padding-left:16px;padding-right:16px}
.foot .grow{flex:1}

.btn{white-space:nowrap;height:40px;padding:0 18px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;transition:transform 160ms var(--ease-out),opacity 150ms}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--bad)}
.btn[disabled]{opacity:.35;pointer-events:none}
.phone .foot .btn.main{flex:1;height:48px}
.link{color:var(--accent);font-weight:500;padding:6px 0}
.link.red{color:var(--bad)}
.link:active{opacity:.6}

/* article + rows */
.art{display:flex;gap:12px;align-items:center;padding:4px 0 12px}
.ph{width:46px;height:46px;border-radius:9px;background:#f2f2f5;display:grid;place-items:center;flex:none}
.art b{display:block;font-weight:600}
.art span{color:var(--body)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.rowl{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid var(--row)}
.nm{flex:1;min-width:0}
.nm b{font-weight:500;display:block}
.nm span{color:var(--body)}
.step{display:flex;gap:6px;align-items:center}
.step button{width:38px;height:38px;border-radius:9px;border:1px solid var(--hair);display:grid;place-items:center;font-size:19px;transition:transform 120ms var(--ease-out)}
.step button:active{transform:scale(.94)}
.step button[disabled]{color:var(--faint);pointer-events:none}
.step output{width:50px;height:38px;border:1px solid var(--hair);border-radius:9px;display:grid;place-items:center}
.box{border:1.5px solid var(--accent);border-radius:14px;padding:12px 16px 4px}
.boxhd{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.boxhd b{font-weight:600}
.muted{color:var(--body)}
.add{width:100%;margin-top:12px;height:46px;border:1.5px dashed var(--hair);border-radius:12px;color:var(--accent);font-weight:500}
.sec{margin:20px 0 8px;color:var(--body)}

/* packed strip */
.packed{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pk{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;background:var(--soft);border:1px solid var(--hair);transition:transform 160ms var(--ease-out),background 150ms}
.pk:active{transform:scale(.97)}
.pk svg{color:var(--ok)}
.pk[aria-expanded=true]{background:var(--accent-bg);border-color:transparent}
.pk.new{animation:land 420ms var(--ease-out)}
@keyframes land{from{transform:translateY(-14px) scale(.96);opacity:0}}
.pkdetail{width:100%;padding:10px 14px;border-radius:10px;background:var(--soft);margin-top:-4px}
.pkdetail div{display:flex;justify-content:space-between;padding:3px 0}

/* rolling number */
.roll{display:inline-block}
.roll.bump{animation:bump 220ms var(--ease-out)}
@keyframes bump{from{transform:translateY(5px);opacity:.3}}

/* A · tap to drop */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.phone .two{grid-template-columns:1fr}
.pile{border-radius:14px;background:var(--soft);padding:6px 14px}
.pile .rowl:first-child{border-top:0}
.tap{width:100%;text-align:left;display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--row);transition:transform 120ms var(--ease-out)}
.tap:first-of-type{border-top:0}
.tap:active{transform:scale(.98)}
.tap .n{min-width:34px;height:34px;border-radius:17px;background:#fff;box-shadow:0 0 0 1px var(--hair);display:grid;place-items:center;font-weight:600}
.tap[disabled]{opacity:.35;pointer-events:none}
.zone{border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;min-height:180px;position:sticky;top:0;background:#fff}
.phone .zone{position:static}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:18px;background:var(--accent-bg);color:var(--ink);transition:transform 120ms var(--ease-out)}
.chip:active{transform:scale(.95)}
.chip.pop{animation:pop 260ms var(--ease-out)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.empty{color:var(--body);padding:28px 0;text-align:center}
.fly{position:fixed;z-index:99;pointer-events:none;padding:4px 10px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600}

/* B · tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--hair);display:flex;align-items:center;gap:8px;transition:transform 120ms var(--ease-out)}
.tab:active{transform:scale(.97)}
.tab[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg)}
.tab.plus{color:var(--accent);border-style:dashed}
.lft{width:74px;text-align:right}
.lft b{font-weight:600}
.lft.zero{color:var(--ok)}

/* D · count in */
.cnt{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;border-top:1px solid var(--row);text-align:left}
.cnt .of{font-weight:600;min-width:64px;text-align:right}
.cnt .of span{color:var(--body);font-weight:400}
.cnt.full .nm b,.cnt.full .of{color:var(--ok)}
.plusbig{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px;transition:transform 120ms var(--ease-out)}
.plusbig:active{transform:scale(.92)}
.plusbig[disabled]{background:var(--ok-bg);color:var(--ok);pointer-events:none}
.minus{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--body);font-size:20px}
.minus[disabled]{visibility:hidden}

/* C · leftover line */
.wait{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.wait b{font-weight:600}

/* done + toast */
.done{display:grid;place-items:center;text-align:center;padding:70px 0 40px}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:12px}
.done b{font-size:19px;font-weight:600}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:12px;background:#1d1d1f;color:#fff;box-shadow:0 8px 24px rgb(0 0 0/20%);transition:transform 260ms var(--ease-out),opacity 200ms;white-space:nowrap;z-index:20}
.toast[hidden]{display:flex;opacity:0;transform:translate(-50%,10px);pointer-events:none}
.toast button{color:#8ab4ff;font-weight:600}
.koli-out{animation:out 300ms var(--ease-io) forwards}
@keyframes out{to{transform:translateY(-24px) scale(.97);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important}.fly{display:none}}
@media (hover:hover) and (pointer:fine){.tap:hover{background:rgb(0 0 0/2%)}.chip:hover{background:#e3ebfa}}

/* E · boxes */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-bottom:6px}
.phone .shelf{grid-template-columns:repeat(3,1fr)}
.kt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:86px;padding:12px;border-radius:14px;border:1.5px solid var(--hair);background:#fff;text-align:left;transition:transform 160ms var(--ease-out),border-color 150ms,background 150ms}
.kt:active{transform:scale(.97)}
.kt b{font-weight:600}
.kt .muted{font-size:15px}
.kt svg.ic{color:var(--body);margin-bottom:4px}
.kt.active{border-color:var(--accent);background:var(--accent-bg)}
.kt.active svg.ic{color:var(--accent)}
.kt.target{border-color:rgb(40 98 220/45%)}
.kt.target svg.ic{color:var(--accent)}
.kt.sealed{background:var(--soft)}
.kt.sealed svg.ic{color:var(--ok)}
.kt.sealed[aria-expanded=true]{border-color:var(--ink)}
.kt.add{width:auto;height:auto;margin-top:0;border-style:dashed;color:var(--accent);justify-content:center;align-items:center;font-weight:600}
.kt.add.first{grid-column:1/-1;min-height:110px;font-size:17px}
.kt.born{animation:born 320ms var(--ease-out)}
@keyframes born{from{transform:scale(.9);opacity:0}}
.kt.hit{animation:hit 220ms var(--ease-out)}
@keyframes hit{40%{transform:scale(1.04)}}
.kt.seal svg.ic{animation:pop 300ms var(--ease-out)}
.kt .tag{position:absolute;top:10px;right:10px;color:var(--body)}
.inside{margin:10px 0 0;padding:12px 14px;border-radius:12px;background:var(--accent-bg)}
.inside.sealedbox{background:var(--soft)}
.inside .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.inside .hd b{font-weight:600}
.inside .chips{margin-top:4px}
.inside .chip{background:#fff}
.inside .ln{display:flex;justify-content:space-between;padding:3px 0}
.grouphd{display:flex;gap:12px;align-items:center;padding:16px 0 8px}
.grouphd b{display:block;font-weight:600}
.grouphd span{color:var(--body)}
.put{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid var(--row);cursor:pointer}
.put .left{font-weight:600;min-width:36px;text-align:right;font-size:17px}
.put.zero{opacity:.4}
.put .all{color:var(--accent);font-weight:500;padding:8px 4px}
.put .all[disabled]{visibility:hidden}
.tabletitle{display:flex;align-items:baseline;gap:8px;margin-top:18px}
.tabletitle b{font-weight:600;font-size:17px}
.swatch{border:1px solid rgb(0 0 0/12%)}

.pad{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgb(0 0 0/18%);animation:fade 160ms ease-out}
@keyframes fade{from{opacity:0}}
.padc{width:380px;margin-bottom:40px;background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 60px rgb(0 0 0/20%);animation:rise 240ms var(--ease-out)}
.phone .padc{width:100%;margin:0;border-radius:18px 18px 0 0;padding-bottom:38px}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.padc .t{display:flex;justify-content:space-between;align-items:baseline}
.padc .t b{font-weight:600}
.padc .big{font-size:40px;font-weight:700;text-align:center;padding:10px 0 2px}
.padc .of{text-align:center;color:var(--body);margin-bottom:12px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:52px;border-radius:12px;background:#f2f2f5;font-size:20px;font-weight:500;transition:transform 100ms var(--ease-out)}
.keys button:active{transform:scale(.95);background:#e6e6eb}
.padc .btn{width:100%;height:48px;margin-top:12px}
.amt{min-width:56px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--hair);display:grid;place-items:center;font-weight:600;font-size:17px;background:#fff}
.amt:active{transform:scale(.96)}

.kt .rd{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;border:1.6px solid var(--faint);transition:border-color 150ms,border-width 150ms}
.kt.on{border-color:var(--accent);background:var(--accent-bg)}
.kt.on .rd{border:6px solid var(--accent)}
.kt.on svg.ic{color:var(--accent)}
.kt.sealed svg.ic,.kt.sealed.on svg.ic{color:var(--ok)}
.kt.sealed .tag{top:auto;bottom:12px}
.kt.zero b,.kt.zero .muted{opacity:.5}
.into{display:flex;align-items:center;gap:10px;margin-top:18px}
.into .seg{flex-wrap:wrap}
.into .seg button{min-height:34px;padding:0 14px;border-radius:7px;color:var(--body);font-weight:500;transition:transform 120ms var(--ease-out)}
.into .seg button:active{transform:scale(.97)}
.into .seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/8%)}
.put.calm{transition:background 150ms}
.put.calm.asking{background:var(--soft)}
.put.hrow{cursor:default}
.ph.skuph{width:44px;height:44px;transition:transform 120ms var(--ease-out),box-shadow 150ms}
.ph.skuph:active{transform:scale(.95)}
@media (hover:hover) and (pointer:fine){.ph.skuph:hover{box-shadow:0 0 0 1.5px var(--accent)}}
.dlg.ipvw{z-index:45}
.dlgc.ipv{position:relative;width:420px;padding:16px}
.dlgc.ipv .prtx{position:absolute;top:12px;right:12px}
.ipvimg{height:320px;border-radius:12px;background:#f2f2f5;display:grid;place-items:center}
.ipvimg svg{width:180px;height:180px}
.dlgc.ipv .pdh{margin-top:12px}
.ph.skuph svg{width:24px;height:24px}
.ask{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 14px;animation:askin 180ms var(--ease-out)}
@keyframes askin{from{opacity:0;transform:translateY(-4px)}}
.ask button{height:40px;padding:0 18px;border-radius:10px;background:var(--accent-bg);color:var(--accent);font-weight:600;transition:transform 120ms var(--ease-out)}
.ask button:active{transform:scale(.97)}
.qty{min-width:40px;text-align:right;font-weight:600;font-size:17px}
.put.calm button.go{width:40px;height:40px;border-radius:10px;color:var(--body);transition:background 150ms,color 150ms,transform 120ms var(--ease-out)}
.put.calm button.go:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.put.calm button.go:hover{background:#fff;color:var(--accent);box-shadow:0 0 0 1px var(--hair)}}
.put.calm.asking button.go{color:var(--accent)}
.pop{position:absolute;z-index:40;width:220px;padding:6px;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgb(0 0 0/6%),0 12px 32px rgb(0 0 0/16%);animation:popin 160ms var(--ease-out)}
@keyframes popin{from{opacity:0;transform:scale(.96)}}
.popq{display:flex;align-items:center;gap:10px;padding:6px 6px 10px}
.popq input.amt{width:72px;height:40px;border:1px solid var(--hair);border-radius:10px}
.pop .pgo{width:100%;height:40px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;transition:transform 120ms var(--ease-out)}
.pop .pk2{display:flex;align-items:center;justify-content:space-between;width:100%;height:42px;padding:0 12px;border-radius:8px;transition:background 120ms,transform 120ms var(--ease-out)}
.pop .pk2 b{font-weight:600}
.pop button:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.pop .pk2:hover{background:var(--soft)}}
.dlgc.putd{width:480px}
.dlg.keep,.dlgc.putd.keep{animation:none}
.pdbody.stepped{animation:stepin 180ms var(--ease-out)}
@keyframes stepin{from{opacity:0;transform:translateX(10px)}}
.pdbody.stepped.back{animation-name:stepback}
@keyframes stepback{from{opacity:0;transform:translateX(-10px)}}
.pdk{display:flex;align-items:center;gap:8px;margin-top:18px;padding:10px 12px;border-radius:12px;background:var(--accent-bg)}
.pdk svg{color:var(--accent)}
.pdk b{font-weight:600}
.pdk .link{margin-left:auto}
@media (hover:hover) and (pointer:fine){.kt.mini.pick:hover{border-color:var(--accent)}.kt.mini.pick:hover svg.ic{color:var(--accent)}}
.pdh b{display:block;font-size:19px;font-weight:600}
.pdh .muted{display:block;margin-top:2px}
.pdl{margin:18px 0 8px;color:var(--body)}
.ktiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kt.mini{min-height:76px;padding:10px 12px}
.kt.mini.add{min-height:76px}
.kt.mini.add.on{border-style:solid;background:var(--accent-bg)}
.pdq{display:flex;align-items:center;gap:12px}
.pdq input.amt{width:96px;height:48px;border:1px solid var(--hair);border-radius:10px;font-size:19px}
.putd .acts .btn{min-width:180px}
.phone .dlg:has(.putd){align-items:end}
.phone .dlgc.putd{width:100%;max-width:100%;border-radius:18px 18px 0 0;padding-bottom:34px}
.phone .putd .acts .btn{flex:1;height:48px}
.phone .putd .acts>div{display:none}
.pop .pk2{margin-top:6px;gap:10px;justify-content:flex-start;background:var(--accent-bg);color:var(--accent)}
.pop .pk2 svg{flex:none}
.pop .pk2 .num{margin-left:auto;color:var(--accent);opacity:.75}
.kl.calm{transition:background 150ms}
.kl button.go{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--body);transition:background 150ms,color 150ms,transform 120ms var(--ease-out)}
.kl button.go:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.kl button.go:hover{background:#fff;color:var(--accent);box-shadow:0 0 0 1px var(--hair)}}
.kph{width:46px;height:46px;flex:none;border-radius:9px;background:#f2f2f5;display:grid;place-items:center;color:var(--body);transition:color 150ms,transform 120ms var(--ease-out)}
.kph.sm{width:34px;height:34px;border-radius:8px}
.kph:active{transform:scale(.95)}
.kname{display:block;text-align:left;font-weight:600}
@media (hover:hover) and (pointer:fine){.kph:hover{color:var(--accent)}.kname:hover{text-decoration:underline}}
.dlgc.kinfo{width:520px}
.kinrows{margin-top:6px}
.rk{display:flex;align-items:center;gap:10px;padding:6px 0 6px 14px}
.rk .muted{margin-left:auto}

.dlgc.dbk{width:560px}
.kl.pickrow{cursor:pointer}
.dcb{width:22px;height:22px;flex:none;border-radius:6px;border:1.6px solid var(--faint);display:grid;place-items:center;color:#fff;transition:background 120ms,border-color 120ms}
.kl.pickrow.on .dcb{background:var(--bad);border-color:var(--bad)}
.kacts{gap:16px}
.sealtag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:9px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.sealtag .num{color:var(--ok)}

<script>
const OPTS=[["h","H · Ask only if 2 open ★"],["e","E · Boxes"],["now","Now"],["a","A · Tap to drop"],["b","B · Koli tabs"],["c","C · One koli at a time"],["d","D · Count in"]];
const STARTS=[["none","No koli yet"],["some","2 koli packed"]];
const STORES=[["c001","C001 · Cikupa"],["c005","C005 · Jambi"]];
const SHEETS=[["pick","Full flow"],["pack","Pack options"],["dispatch","Dispatch only"]];

  "87167":{name:"87167 Jaket",code:"00000004",div:"Ladies",ico:"jacket"},
  "2562":{name:"2562 Rok",code:"00000005",div:"Ladies",ico:"skirt"},
  "87175":{name:"87175 Jaket",code:"00000003",div:"Ladies",ico:"jacket"},
};
// sku, article, colour, size, pieces picked for the store
const CAT={
  c001:{name:"C001 · Cikupa",lines:[
    ["5101","2562","BROKEN WHITE","XXL",30],["5102","2562","OLIVE","XL",25],
    ["3003","87175","HITAM","M",1],["3004","87175","HITAM","L",1],
    ["4003","87167","HITAM","M",1],["4004","87167","HITAM","L",1],["4005","87167","HITAM","XL",1],
    ["4103","87167","NAVY","M",2],["4104","87167","NAVY","L",3],["4105","87167","NAVY","XL",2]]},
  c009:{name:"C009 · Serang",lines:[["5101","2562","BROKEN WHITE","XXL",12],["4104","87167","NAVY","L",4],["4105","87167","NAVY","XL",4]]},
  c005:{name:"C005 · Jambi",lines:[["4003","87167","HITAM","M",1],["4005","87167","HITAM","XL",2],["4105","87167","NAVY","XL",2]]},
};
const PACKED_SOME={c001:[{no:1,code:"A00002",items:{"5101":30,"5102":25}},{no:2,code:"A00003",items:{"3003":1,"3004":1}}],c005:[]};

const q=new URLSearchParams(location.search);
let S={pics:q.get("pics")||"off",sheet:q.get("sheet")||"pack",pstart:q.get("pstart")||"new",opt:q.get("opt")||"h",td:q.get("td")||"art",pn:q.get("pn")||"cols",pc:q.get("pc")||"tabs",rg:q.get("rg")||"single",pu:q.get("pu")||"store",ask:q.get("ask")||"dlg",start:q.get("start")||"none",store:q.get("store")||"c001",dev:q.get("dev")||"desk"};
let W, hist=[], openPk=null, toastT, pad=null, fx={};

const L=()=>S.sheet==="pick"&&P&&P.card?card().lines:S.sheet==="pick"&&F.open?.kind==="pack"?PB.plines[S.store]:CAT[S.store].lines;
const line=sku=>L().find(l=>l[0]===sku);
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const inKoli=sku=>W.koli.reduce((a,k)=>a+(k.items[sku]||0),0);
const free=sku=>(W.left[sku]||0)-inKoli(sku)-((W.back||{})[sku]||0);
const totalLeft=()=>sum(W.left);
const onTable=()=>L().reduce((a,l)=>a+Math.max(0,free(l[0])),0);
const live=()=>L().filter(l=>(W.left[l[0]]||0)>0);
const nextNo=()=>Math.max(0,...W.packed.map(p=>p.no),...W.koli.map(k=>k.no))+1;
const save=()=>{hist.push(JSON.stringify(W));if(hist.length>60)hist.shift()};
let ask=null,typed={},typedOut={},bdlg=null,adding=null,pp=null,layerIn=false,plist=null,kinfo=null,kpl=null,prt=null,ipv=null,prtPaper={size:"A5",way:"portrait"};
const pcs=n=>n===1?"1 pc":`${n} pcs`;

function fresh(){
  const packed=S.start==="some"?(PACKED_SOME[S.store]||[]).map(p=>({...p,items:{...p.items}})):[];
  const left={};L().forEach(l=>left[l[0]]=l[4]);
  packed.forEach(p=>Object.entries(p.items).forEach(([k,n])=>left[k]-=n));
  Object.keys(left).forEach(k=>{if(left[k]<=0)delete left[k]});
  W={left,packed,koli:[],active:0,code:2+packed.length,view:"p"};
  if(!isE()){ // the older options open the first koli by themselves
    const all={};live().forEach(l=>all[l[0]]=W.left[l[0]]);
    W.koli=[{no:nextNo(),items:(S.opt==="now"||S.opt==="c")?all:{}}];

  hist=[];openPk=null;pad=null;ask=null;openArt=new Set();typed={};typedOut={};bdlg=null;adding=null;pp=null;
}

/* ---------- pieces ---------- */
const ICO={
  jacket:`<svg width="28" height="28" viewBox="0 0 24 24"><path d="M8 3l4 2 4-2 4 3-1 14h-4V9.5L12 11l-3-1.5V20H5L4 6z" fill="#1d1d1f"/></svg>`,

const svgBox=`<svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg>`;
const svgSealed=`<svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z" opacity=".18"/><path d="M8 12.5l3 3 5.5-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const bare=c=>String(c).replace(/^0+(?=\d)/,"");
/// H: a picked row shows its quantity and a put-in button (owner, 18 Oct 2026: "ga usah ada input … cukup quantity saja").
const skuName=l=>`${ART[l[1]].name} · ${l[2]} · ${l[3]}`;

const skuRows=(rows,fn,o={})=>{
  if(S.rg!=="stack")return rows.map(fn).join("");
  const by=[];rows.forEach(l=>{const g=by.find(x=>x.art===l[1]);g?g.rows.push(l):by.push({art:l[1],rows:[l]})});
  return by.map(g=>{const l=g.rows[0],n=g.rows.length,tot=o.qty?g.rows.reduce((a,r)=>a+(o.qty(r)||0),0):null;
    const key=(o.ctx||"")+"|"+g.art,fold=o.fold!==false&&n>1,open=!fold||openArt.has(key);
    const hd=`<div class="arthd${fold?" fold":""}"${fold?` data-art="${key}" role="button" aria-expanded="${open}"`:""}><button class="ph skuph" data-ipv="${l[0]}" aria-label="Picture of ${ART[g.art].name}">${ICO[ART[g.art].ico]}</button><div class="nm"><b>${ART[g.art].name}</b><span class="num">${bare(ART[g.art].code)} · ${ART[g.art].div}</span></div><span class="stkn num">${n} ${n===1?"SKU":"SKUs"}${tot!==null?` · ${pcs(tot)}`:""}</span>${fold?`<span class="stkchev">${svgChev}</span>`:""}${o.artPut&&!open?`<button class="go" data-goart="${g.art}" aria-label="Put all of ${ART[g.art].name} in">${svgInto}<span>Put all in</span></button>`:""}</div>`;
    return `<div class="artgrp stk${fold&&!open?" shut":""}">${hd}${open?`<div class="stkrows${unstack===key?" in":""}">${g.rows.map(fn).join("")}</div>`:""}</div>`}).join("");
};

function tile(id,label,sub,on,cls,ico,tag){

function vE(){
  const act=W.koli[W.active];
  const view=W.view??"p";
  const pk=onTable();
  const into=act?act.no:nextNo();
  const all=[...W.packed.map(p=>({s:1,no:p.no,items:p.items,code:p.code})),...W.koli.map(k=>({s:0,no:k.no,items:k.items}))].sort((a,b)=>a.no-b.no);
  let h=`<div class="shelf" role="radiogroup">`+(S.opt==="i"?"":tile("p","Picked",pcs(pk),view==="p",pk?"":"zero",svgPile));
  const ring=("fg".includes(S.opt)||(S.opt==="h"&&W.koli.length===1))&&view==="p";
  all.forEach(t=>h+=tile(t.no,`Koli ${t.no}`,pcs(sum(t.items)),view==t.no,t.s?"sealed":ring&&act&&t.no===act.no?"target":"",t.s?svgSealed:svgBox));
  const bk=sum(W.back||{});
  if(bk)h+=tile("b","Back to Pick",pcs(bk),view==="b","bad",svgBackIc);
  if(pk>0)h+=`<button class="kt add" data-newkoli>+ Koli ${nextNo()}</button>`;
  h+=`</div>`;

  const cur=all.find(t=>t.no==view);
  // Calm rows: no verb on the row; the row is the press, the number opens the keypad.
  const askRow=sku=>`<div class="ask">${W.koli.map((k,i)=>`<button data-askk="${i}" data-sku="${sku}">Koli ${k.no}</button>`).join("")}</div>`;
  const calm=rows=>grouped(rows,l=>`<div class="put calm${ask===l[0]?" asking":""}" data-put="${l[0]}">${nm(l)}<button class="amt num" data-amt="${l[0]}" aria-label="How many">${free(l[0])}</button><span class="go" aria-hidden="true">${svgInto}</span></div>`+(ask===l[0]?askRow(l[0]):""),
    a=>`<div class="grouphd">${artHead(a)}</div>`);
  const left=live().filter(l=>free(l[0])>0);
  // H: nothing goes into a koli by itself; every put says which (owner, 18 Oct 2026).
  if(view==="p"&&S.opt==="h"){
    if(left.length){
      h+=`<div class="tabletitle"><div style="flex:1"></div><button class="link" data-askall>All in</button></div>`;
      h+=skuRows(left,hRow,{qty:l=>free(l[0]),ctx:"p",artPut:true});
    }else if(W.koli.length)h+=`<div class="empty">Nothing left</div>`;
    else h+=doneBody();
  }else if(cur&&!cur.s&&S.opt==="h"){
    // A koli tab shows only what is in it; "Add to Koli N" brings the picked rows (owner, 18 Oct 2026).
    const rows=L().filter(l=>cur.items[l[0]]);
    {
      h+=`<div class="inkoli"><div class="tabletitle kacts"><div style="flex:1"></div>${pk>0?`<button class="link" data-addto="${cur.no}">+ Add to Koli ${cur.no}</button>`:""}</div>`;
      h+=(rows.length?skuRows(rows,l=>`<div class="put still">${skuNm(l)}<span class="qty num">${cur.items[l[0]]}</span><button class="to red" data-out="${l[0]}">Take out</button></div>`,{qty:l=>cur.items[l[0]],ctx:"k"+cur.no}):`<div class="empty">Empty</div>`)+`</div>`;
    }
  }else if(view==="b"){
    h+=`<div style="height:6px"></div>`+grouped(L().filter(l=>(W.back||{})[l[0]]),l=>`<div class="put still">${nm(l)}<span class="left num">${W.back[l[0]]}</span><button class="to red" data-bout="${l[0]}">Take out</button></div>`,a=>`<div class="grouphd">${artHead(a)}</div>`);
  }else if(view==="p"){
    const rows=live().filter(l=>free(l[0])>0);
    if(rows.length){
      if(S.opt==="f"){
        // Which koli the rows go into, said once (owner, 18 Oct 2026: "kalau mau masukin ke koli 3 gimana dari picked?").
        const opts=W.koli.length?W.koli.map((k,i)=>`<button data-into="${i}" aria-pressed="${i===W.active}">Koli ${k.no}</button>`).join(""):`<button aria-pressed="true">Koli ${into}</button>`;
        h+=`<div class="into"><span class="muted">Into</span><div class="seg">${opts}</div><div style="flex:1"></div><button class="link" data-everything>All in</button></div>`+calm(rows);
      }else if(S.opt==="i"){
        h+=`<div class="tabletitle"><b>Picked</b><span class="muted num">${pcs(pk)}</span><div style="flex:1"></div><button class="link" data-everything>All in Koli ${into}</button></div>`+calm(rows);
      }else if(S.opt==="g"||S.opt==="h"){
        h+=`<div class="tabletitle"><div style="flex:1"></div><button class="link" data-everything>All in Koli ${into}</button></div>`+calm(rows);
      }else{
      h+=`<div class="tabletitle"><div style="flex:1"></div><button class="link" data-everything>Everything into Koli ${into}</button></div>`;
      h+=grouped(rows,l=>`<div class="put" data-put="${l[0]}">${nm(l)}<button class="amt num" data-amt="${l[0]}" aria-label="How many">${free(l[0])}</button><span class="to">Koli ${into} ›</span></div>`,
        a=>`<div class="grouphd">${artHead(a)}<div style="flex:1"></div><button class="link" data-artall="${a}">All in</button></div>`);
      }
    }else if(W.koli.length)h+=`<div class="empty">Nothing left</div>`;
    else h+=doneBody();
  }else if(cur&&!cur.s&&fillsOpen()){
    const rows=L().filter(l=>cur.items[l[0]]);
    h+=`<div class="tabletitle"><b>In Koli ${cur.no}</b><span class="muted num">${pcs(sum(cur.items))}</span></div>`;
    h+=rows.length?grouped(rows,l=>`<div class="put still">${nm(l)}<button class="amt num" data-amtout="${l[0]}" aria-label="How many">${cur.items[l[0]]}</button><button class="to" data-out="${l[0]}">Take out</button></div>`,
      a=>`<div class="grouphd">${artHead(a)}</div>`):`<div class="none muted">Empty</div>`;
    if(left.length)h+=`<div class="tabletitle fromp"><b>Picked</b><span class="muted num">${pcs(pk)}</span><div style="flex:1"></div><button class="link" data-everything>All in</button></div>`+calm(left);
  }else if(cur&&!cur.s){
    const rows=L().filter(l=>cur.items[l[0]]);
    h+=rows.length?`<div style="height:6px"></div>`+grouped(rows,l=>`<div class="put still">${nm(l)}<button class="amt num" data-amtout="${l[0]}" aria-label="How many">${cur.items[l[0]]}</button><button class="to" data-out="${l[0]}">Take out</button></div>`,
      a=>`<div class="grouphd">${artHead(a)}</div>`):`<div class="empty">Empty</div>`;
  }else if(cur&&S.opt==="h"){
    h+=`<div class="tabletitle"><span class="sealtag">${svgCheck}Sealed · <span class="num">${cur.code}</span></span><div style="flex:1"></div>${printWord(`data-plist="${cur.no}"`)}<button class="link red" data-unpack="${cur.no}" style="margin-left:16px">Unpack</button></div>`;
    h+=skuRows(L().filter(l=>cur.items[l[0]]),l=>`<div class="put still">${skuNm(l)}<span class="qty num">${cur.items[l[0]]}</span></div>`,{qty:l=>cur.items[l[0]],ctx:"s"+cur.no});
  }else if(cur){
    h+=`<div class="tabletitle"><span class="muted num">${cur.code}</span><div style="flex:1"></div><button class="link" data-reprint>Reprint label</button><button class="link red" data-unpack="${cur.no}" style="margin-left:16px">Unpack</button></div>`;
    h+=grouped(L().filter(l=>cur.items[l[0]]),l=>`<div class="put still">${nm(l)}<span class="left num">${cur.items[l[0]]}</span></div>`,a=>`<div class="grouphd">${artHead(a)}</div>`);
  }

  // One Submit for everything in the sheet: every open koli sealed, every put-back sent to Pick.
  const openK=W.koli.filter(k=>sum(k.items)),openP=openK.reduce((a,k)=>a+sum(k.items),0);
  let foot;
  if(openP||bk){
    const parts=[openK.length?`${openK.length} koli · ${pcs(openP)}`:"",bk?`${pcs(bk)} back to Pick`:""].filter(Boolean).join(" · ");
    foot=`<span class="sum num">${parts}</span><div class="grow"></div><button class="btn main" data-submitall>Submit</button>`;
  }else foot=`<div class="grow"></div><button class="btn main" disabled>Submit</button>`;
  if(S.opt==="h"){
    const sealedN=W.packed.length,openN=W.koli.filter(k=>sum(k.items)).length;
    const said=[openN?`${openN} koli open · ${pcs(openP)}`:"",sealedN?`${sealedN} sealed`:""].filter(Boolean).join(" · ");
    const here=cur&&!cur.s&&sum(cur.items)?cur:!pk?W.koli.find(k=>sum(k.items)):null;
    foot=(pk>0?`<button class="link red" data-backdlg>Back to Pick</button>`:"")+`<span class="sum num">${said}</span><div class="grow"></div>`+
      (here?`<button class="link" data-pdone>Done</button><button class="btn main" data-sealone="${here.no}">Seal & print Koli ${here.no}</button>`:`<button class="btn main" data-pdone>Done</button>`);
  }
  fx={};
  return [head(),h,foot];
}

function padHtml(){
  if(!pad)return"";
  const act=W.koli[W.active],out=pad.mode==="out";
  const ko=out?W.koli.find(k=>k.no==W.view):null;
  const max=out?(ko?.items[pad.sku]||0):free(pad.sku);

function pclickG(c,t,e){

    const full=pairs.every(([x,s])=>gsOf(x,s)>=x.left[s]);psave();pairs.forEach(([x,s])=>setGs(x,s,full?0:x.left[s]));sync();render("fig");return true};

}

    save();k.items[sku]=(k.items[sku]||0)+dd;if(!k.items[sku])delete k.items[sku];return render("r"+sku)}
  if(d.drop){const k=W.koli[0];if(free(d.drop)<=0)return;save();const r=t.getBoundingClientRect();k.items[d.drop]=(k.items[d.drop]||0)+1;render("fig");return fly(r,document.getElementById("zone"),"+1")}
  if(d.takeout){const k=W.koli[W.active];save();
    if(isE())delete k.items[d.takeout];else{k.items[d.takeout]--;if(!k.items[d.takeout])delete k.items[d.takeout]}
    return render("fig")}
  if(d.everything!==undefined)return putMany(live().map(l=>l[0]),t);
  if(d.artall)return putMany(live().filter(l=>l[1]===d.artall).map(l=>l[0]),t);
  if(d.tab){W.active=+d.tab;openPk=null;return render()}
  if(d.into!==undefined){W.active=+d.into;return render()}
  if(d.askk!==undefined){
    if(d.askk==="new"){W.koli.push({no:nextNo(),items:{}});W.active=W.koli.length-1;fx.born=W.koli[W.active].no}else W.active=+d.askk;
    const f=d.for;ask=null;
    if(f==="all")return putMany(live().map(l=>l[0]),document.querySelector("[data-askall]"));
    const n=typedOf(f);delete typed[f];return put(f,n,document.querySelector(`[data-put="${f}"]`)?.getBoundingClientRect())}
  if(d.goart){const skus=live().filter(l=>l[1]===d.goart&&free(l[0])>0).map(l=>l[0]);
    if(adding!==null){W.active=W.koli.findIndex(k=>k.no===adding);return putMany(skus,t)}
    if(W.koli.length<2){if(W.koli.length===1)W.active=0;return putMany(skus,t)}
    pp={for:"art:"+d.goart,step:1,whole:true};return render()}
  if(d.askall!==undefined){if(W.koli.length<2){if(W.koli.length===1)W.active=0;return putMany(live().map(l=>l[0]),t)}pp=S.ask==="dlg"?{for:"all",step:1,whole:true}:pp&&pp.for==="all"?null:{for:"all",amt:false};return render()}
  if(d.backdlg!==undefined){bdlg={};ask=null;return render()}
  if(d.bkeep!==undefined){bdlg=null;return render()}
  if(d.bstep){const s=d.bstep,v=(bdlg[s]||0)+(+d.bd);if(v<0||v>free(s))return;bdlg[s]=v;if(!v)delete bdlg[s];return render()}
  if(d.bgo!==undefined&&S.opt==="h"){save();const back={...bdlg};
    Object.entries(back).forEach(([s,n])=>{W.left[s]-=n;if(W.left[s]<=0)delete W.left[s]});
    if(S.sheet==="pick")backToPickFromPack(S.store,back);
    bdlg=null;render("fig");return toast(`${pcs(sum(back))} back to Pick`,true)}
  if(d.pdone!==undefined){if(S.sheet==="pick"){F.open=null;return render()}return toast("Closed · everything is saved",false)}
  if(d.bgo!==undefined){save();W.back=W.back||{};Object.entries(bdlg).forEach(([s,n])=>W.back[s]=(W.back[s]||0)+n);bdlg=null;fx.hit="b";return render("fig")}
  if(d.newkoli!==undefined){save();const no=nextNo();W.koli.push({no,items:{}});W.active=W.koli.length-1;fx.born=no;openPk=null;if(S.opt==="i"||(isE()&&W.view!=="p"))W.view=no;ask=null;return render()}
  if(d.pack!==undefined)return pack(+d.pack||0);
  if(d.back!==undefined)return toast("Back to Pick · opens the move-back dialog",false);
  if(d.dispatch!==undefined){S.sheet="dispatch";freshD(true);return render()}
});
document.addEventListener("input",e=>{
  const i=e.target.closest?.("[data-typed],[data-typedout]");if(!i)return;
  const v=+i.value.replace(/\D/g,"")||0;
  if(i.dataset.typed){const s=i.dataset.typed;typed[s]=Math.min(free(s),v)}
  else{const s=i.dataset.typedout,k=W.koli.find(k=>k.no==W.view);typedOut[s]=Math.min(k?.items[s]||0,v)}
});
document.addEventListener("input",e=>{if(pp&&e.target.id==="popv"){pp.v=e.target.value;const b=document.querySelector("[data-dgo]");if(b){b.textContent=dgoLabel();b.disabled=!dgoOk()}
  const m=document.getElementById("popmax"),n=+String(pp.v).replace(/\D/g,"")||0;if(m){m.textContent=n>dgoMax()?`Only ${dgoMax()} here`:`max ${dgoMax()}`;m.classList.toggle("bad",n>dgoMax())}}});
document.addEventListener("focusin",e=>{if(e.target.matches?.("[data-typed],[data-typedout]"))e.target.select()});
document.addEventListener("keydown",e=>{
  if(pp&&e.key==="Escape"){pp=null;render();return}
  if(pp&&e.key==="Enter"&&e.target.id==="popv"){document.querySelector("#pop [data-dgo],#pop [data-popgo],#pop [data-popk]")?.click();return}
  if(e.key==="Enter"&&e.target.matches?.("[data-typedout]")){document.querySelector(`[data-out="${e.target.dataset.typedout}"]`)?.click();return}
  if(S.sheet==="pick"&&P.pad){if(/^[0-9]$/.test(e.key))document.querySelector(`[data-pkey="${e.key}"]`)?.click();else if(e.key==="Backspace")document.querySelector(`[data-pkey="⌫"]`)?.click();else if(e.key==="Enter")document.querySelector("[data-ppadgo]:not([disabled])")?.click();else if(e.key==="Escape"){P.pad=null;render()}return}
  if(!pad)return;
  if(/^[0-9]$/.test(e.key))document.querySelector(`[data-key="${e.key}"]`)?.click();
  else if(e.key==="Backspace")document.querySelector(`[data-key="⌫"]`)?.click();
  else if(e.key==="Enter")document.querySelector("[data-padput]:not([disabled])")?.click();
  else if(e.key==="Escape"){pad=null;render()}
});
fresh();freshD(false);freshP();render();
</script>
