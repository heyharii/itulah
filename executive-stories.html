<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Executive stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frontend-hub/design-system/tokens.css">
<style>
/* Tokens: frontend-hub/design-system/tokens.css (All white, 17 Oct 2026). Taste from the Headroom cards: a sentence that is the answer, one chart, a detail panel for the chosen row, a key for every mark. */
:root {
  --font: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --g1: #ececf0; --g2: #d4d4da; --g3: #b0b0b7; --g4: #85858c; --g5: #4a4a50;
  --hatch-bad: repeating-linear-gradient(135deg, rgba(215,0,21,.30) 0 1.5px, transparent 1.5px 6px);
  --hatch-warn: repeating-linear-gradient(135deg, rgba(201,137,46,.55) 0 1.5px, transparent 1.5px 6px);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: 15px; line-height: 1.45; color: var(--ink); background: var(--stone); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
svg { display: block; overflow: visible; }
svg text { font-family: var(--font); font-size: 15px; fill: var(--body); }
p, h1, h2, h3 { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ── Prototype chrome ── */
.chrome { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--canvas); border-bottom: 1px solid var(--hairline); }
.chrome .lab { color: var(--body); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--segment-track); max-width: 100%; }
.seg button { height: 30px; padding: 0 11px; border: 0; border-radius: 7px; background: none; color: var(--body); font-weight: 500; white-space: nowrap; cursor: pointer; transition: transform 160ms var(--ease-out); }
.seg button:active { transform: scale(.97); }
.seg button[aria-pressed="true"] { background: var(--canvas); color: var(--ink); box-shadow: var(--shadow-segment); }
@media (hover: hover) { .seg button:hover { color: var(--ink); } }

/* ── Shell ── */
.stage { display: flex; gap: 12px; padding: 12px; margin: 0 auto; }
.stage[data-device="phone"] { max-width: 414px; padding: 12px 0; }
.rail { flex: none; width: 56px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 4px; }
.rail .tile { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--rail-mute); }
.rail .tile.on { background: var(--canvas); box-shadow: var(--shadow-rail-tile); color: var(--ink); }
.rail .brand { background: var(--brand-tile); color: #fff; font-weight: 600; position: relative; }
.rail .brand::after { content: ""; position: absolute; right: 9px; bottom: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.panel { flex: none; width: 216px; align-self: flex-start; position: sticky; top: 64px; background: var(--canvas); border-radius: 16px; box-shadow: var(--shadow-panel); padding: 20px 12px 16px; }
.panel h1 { font-size: 20px; line-height: 28px; font-weight: 600; padding: 0 10px 14px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--panel-body); font-weight: 500; text-align: left; cursor: pointer; }
.nav button .dot { margin-left: auto; }
@media (hover: hover) { .nav button:hover { background: var(--panel-hover); } }
.nav button[aria-current="page"] { background: var(--accent-bg); color: var(--accent); }
.page { flex: 1; min-width: 0; background: var(--canvas); border-radius: 16px; box-shadow: var(--shadow-page); padding: 24px 28px 40px; }
.stage[data-device="phone"] .rail, .stage[data-device="phone"] .panel { display: none; }
.stage[data-device="phone"] .page { padding: 0 16px 32px; border-radius: 16px; }
.phonebar { display: none; align-items: center; gap: 6px; height: 52px; margin: 0 -16px 8px; padding: 0 16px; border-bottom: 1px solid var(--hairline); }
.phonebar .crumb { color: var(--body); }
.phonebar select { border: 0; background: none; font: inherit; font-weight: 600; color: var(--ink); padding: 0; }
.stage[data-device="phone"] .phonebar { display: flex; }

/* ── Page head ── */
.head { display: flex; align-items: center; gap: 12px; min-height: 36px; margin-bottom: 24px; }
.head h1 { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -.3px; }
.head .tools { margin-left: auto; display: flex; gap: 8px; }
.stage[data-device="phone"] .head h1 { display: none; }
.stage[data-device="phone"] .head .tools { margin-left: 0; }
.stage[data-device="phone"] .head.empty { display: none; }

.pick { position: relative; }
.pick > button { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 12px; border: 1px solid var(--hairline-2); border-radius: 8px; background: var(--canvas); font-weight: 500; cursor: pointer; white-space: nowrap; transition: transform 160ms var(--ease-out); }
.pick > button:active { transform: scale(.97); }
.pick > button svg { color: var(--line-ico); }
.pop { position: absolute; right: 0; top: 40px; z-index: 20; min-width: 240px; max-height: 420px; overflow: auto; padding: 4px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: 10px; box-shadow: var(--shadow-pop); transform-origin: top right; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out); }
.stage[data-device="phone"] .pop { left: 0; right: auto; transform-origin: top left; }
.pop[hidden] { display: block; opacity: 0; transform: scale(.97); pointer-events: none; }
.pop button { display: flex; width: 100%; align-items: center; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; }
.pop button[aria-current="true"] { color: var(--accent); font-weight: 500; }
@media (hover: hover) { .pop button:hover { background: var(--soft-2); } }

/* ── Story card ── */
.story { border: 1px solid var(--hairline); border-radius: 10px; }
.story + .story { margin-top: 24px; }
.story-head { display: flex; align-items: flex-start; gap: 16px; padding: 20px 24px 0; }
.story-head h2 { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -.3px; text-wrap: balance; }
.story-head p { margin-top: 4px; color: var(--body); max-width: 780px; text-wrap: pretty; }
.story-head .seg { margin-left: auto; flex: none; }
.story-body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
.story-body.wide { grid-template-columns: minmax(0, 1fr); }
.plot { min-width: 0; padding: 16px 24px 20px; }
.side { border-left: 1px solid var(--hairline); padding: 20px 24px 20px; min-width: 0; }
.stage[data-device="phone"] .story { border: 0; border-radius: 0; margin: 0 -16px; }
.stage[data-device="phone"] .story-head { flex-direction: column; gap: 12px; padding: 4px 16px 0; }
.stage[data-device="phone"] .story-head .seg { margin-left: 0; }
.stage[data-device="phone"] .story-body { grid-template-columns: minmax(0, 1fr); }
.stage[data-device="phone"] .plot { padding: 16px 16px 20px; }
.stage[data-device="phone"] .side { border-left: 0; border-top: 1px solid var(--hairline); padding: 20px 16px; }

.swap { transition: opacity 160ms var(--ease-out), filter 160ms var(--ease-out); }
.swap.out { opacity: 0; filter: blur(2px); transition-duration: 100ms; }
@media (prefers-reduced-motion: reduce) { .swap, .swap.out { transition: opacity 120ms linear; filter: none; } }

/* key: one line per mark, over the plot */
.key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; color: var(--body); margin-bottom: 12px; }
.key span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.k-line { width: 16px; height: 2px; border-radius: 1px; background: var(--accent); }
.k-grey { width: 16px; height: 2px; border-radius: 1px; background: var(--g3); }
.k-dash { width: 16px; height: 0; border-top: 2px dashed var(--accent); }
.k-dash.ink { border-top-color: var(--ink); }
.k-dash.grey { border-top-color: var(--hairline-strong); }
.k-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.k-ring { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); background: var(--canvas); }
.k-hatch { width: 16px; height: 12px; border-radius: 2px; background: var(--hatch-bad), var(--bad-bg); }
.k-hatch.warn { background: var(--hatch-warn), var(--warn-bg); }
.k-tick { width: 2px; height: 14px; border-radius: 1px; background: var(--ink); }
.k-sw { display: inline-flex !important; gap: 2px !important; }
.k-sw i { width: 12px; height: 12px; border-radius: 3px; }
.k-out { width: 12px; height: 12px; border-radius: 3px; border: 1.5px dashed var(--hairline-strong); }

/* side panel */
.who { display: flex; flex-direction: column; gap: 2px; }
.who b { font-size: 16px; line-height: 20px; font-weight: 600; }
.who span { color: var(--body); }
.hero { display: flex; align-items: baseline; gap: 8px; margin-top: 18px; }
.hero b { font-size: 24px; line-height: 30px; font-weight: 600; }
.hero span { color: var(--body); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-top: 18px; }
.fact .l { color: var(--body); }
.fact .v { margin-top: 4px; font-size: 16px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fact .v small { font-size: 15px; font-weight: 400; color: var(--body); }
.sub-t { margin-top: 18px; color: var(--ink); font-weight: 600; }
.sec { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--hairline); }
.sec h3 { font-size: 15px; line-height: 20px; font-weight: 600; margin-bottom: 8px; }
.sec h3 span { font-weight: 400; color: var(--body); }
.rank { display: flex; flex-direction: column; margin: 0 -10px; }
.rank button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; }
@media (hover: hover) { .rank button:hover { background: var(--soft-2); } }
.rank button[aria-current="true"] { background: var(--accent-bg); }
.rank .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank button .n small { display: block; font-size: 15px; color: var(--body); }
.rank button .n small.warn-t { color: var(--warn-fg); }
.rank button:has(small) { min-height: 56px; padding-top: 6px; padding-bottom: 6px; }
.rank .x { font-weight: 600; font-variant-numeric: tabular-nums; }
.rank .note { flex: none; min-width: 132px; text-align: right; color: var(--body); font-variant-numeric: tabular-nums; }
.rank.static .row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; }
.rank.static .note { min-width: 56px; }

.ok-t { color: var(--ok-fg) !important; }
.warn-t { color: var(--warn-fg) !important; }
.bad-t { color: var(--bad-fg) !important; }
.mute { color: var(--body); }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.ok { background: var(--ok); } .dot.info { background: var(--info); } .dot.none { background: var(--faint); }

/* overview */
.brief { border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; }
.brief button { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 16px; align-items: center; gap: 4px 12px; width: 100%; padding: 16px 20px; border: 0; border-top: 1px solid var(--row-line); background: none; text-align: left; cursor: pointer; }
.brief button:first-child { border-top: 0; }
@media (hover: hover) { .brief button:hover { background: var(--soft); } }
.brief b { font-weight: 600; }
.brief .s { grid-column: 2; color: var(--body); }
.brief .t { grid-column: 3; grid-row: 1 / span 2; color: var(--body); white-space: nowrap; }
.brief svg.chev { grid-column: 4; grid-row: 1 / span 2; color: var(--line-ico); }
.brief .dot { grid-row: 1; justify-self: center; }
.stage[data-device="phone"] .brief { border: 0; border-radius: 0; margin: 0 -16px; }
.stage[data-device="phone"] .brief button { padding: 14px 16px; grid-template-columns: 14px minmax(0, 1fr) 16px; }
.stage[data-device="phone"] .brief .t { grid-column: 2; grid-row: auto; }
.stage[data-device="phone"] .brief svg.chev { grid-column: 3; }

/* forecast rows (sell-out) */
.fc { display: grid; grid-template-columns: 196px minmax(0, 1fr) 176px; column-gap: 14px; }
.fc .hd { color: var(--body); padding-bottom: 8px; }
.fc .days { display: grid; grid-template-columns: repeat(var(--n, 14), minmax(0, 1fr)); gap: 3px; }
.fc .days span { text-align: center; white-space: nowrap; }
.fc[style*="--n:24"] .days span { text-align: left; overflow: visible; width: 0; }
.fc .days span.now { color: var(--ink); font-weight: 500; }
.fc .r { display: contents; cursor: pointer; }
.fc .r > * { padding: 10px 0; border-top: 1px solid var(--row-line); }
.fc .r.on > * { background: var(--accent-bg); }
.fc .r.on > :first-child { box-shadow: -10px 0 0 var(--accent-bg); border-radius: 8px 0 0 8px; }
.fc .r.on > :last-child { box-shadow: 10px 0 0 var(--accent-bg); border-radius: 0 8px 8px 0; }
@media (hover: hover) { .fc .r:hover > * { background: var(--soft); } .fc .r.on:hover > * { background: var(--accent-bg); } }
.fc .nm b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc .nm span { color: var(--body); }
.fc .cells { display: grid; grid-template-columns: repeat(var(--n, 14), minmax(0, 1fr)); gap: 3px; align-items: center; position: relative; }
.fc[style*="--n:24"] .cells, .fc[style*="--n:24"] .days { gap: 2px; }
.fc .cells i.over { background: var(--hatch-warn), var(--warn-bg); }
.fc .cells i.gone { background: var(--soft-2); }
.fc .cells i.aim::before { content: ""; position: absolute; left: -2px; top: -5px; bottom: -5px; width: 2px; border-radius: 1px; background: var(--ink); }
.fc .days span.aim { color: var(--ink); font-weight: 500; text-align: left; white-space: nowrap; overflow: visible; }
.fc .cells i { position: relative; height: 34px; border-radius: 4px; }
.fc .cells i.empty { background: var(--hatch-bad), var(--bad-bg); }
.fc .cells i.out { background: var(--bad-bg); }
.fc .cells i.out::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--canvas); }
.fc .cells i.del::before { content: ""; position: absolute; left: -3px; top: -5px; bottom: -5px; width: 2px; border-radius: 1px; background: var(--ink); }
.fc .rt b { display: block; font-weight: 500; font-variant-numeric: tabular-nums; }
.fc .rt span { color: var(--body); }
.stage[data-device="phone"] .fc { grid-template-columns: minmax(0, 1fr); }
.stage[data-device="phone"] .fc .hd.nmh, .stage[data-device="phone"] .fc .hd.rth { display: none; }
.stage[data-device="phone"] .fc .r > * { border-top: 0; padding: 4px 0; }
.stage[data-device="phone"] .fc .r > .nm { border-top: 1px solid var(--row-line); padding-top: 12px; }
.stage[data-device="phone"] .fc .r > .rt { padding-bottom: 12px; display: flex; justify-content: space-between; gap: 8px; }
.stage[data-device="phone"] .fc .cells i { height: 26px; }
.stage[data-device="phone"] .fc .r.on > * { box-shadow: -16px 0 0 var(--accent-bg), 16px 0 0 var(--accent-bg); border-radius: 0; }

/* week table (stores) */
.wk { display: grid; column-gap: 12px; align-items: center; }
.wk .hd { color: var(--body); padding-bottom: 8px; line-height: 20px; }
.wk .hd b { display: block; color: var(--ink); font-weight: 500; }
.wk .r { display: contents; cursor: pointer; }
.wk .r > * { padding: 10px 0; border-top: 1px solid var(--row-line); height: 100%; }
.wk .r.on > * { background: var(--accent-bg); }
.wk .r.on > :first-child { box-shadow: -10px 0 0 var(--accent-bg); border-radius: 8px 0 0 8px; }
.wk .r.on > :last-child { box-shadow: 10px 0 0 var(--accent-bg); border-radius: 0 8px 8px 0; }
@media (hover: hover) { .wk .r:hover > * { background: var(--soft); } .wk .r.on:hover > * { background: var(--accent-bg); } }
.wk .nm { font-weight: 500; display: flex; align-items: center; min-width: 0; }
.wk .cell { display: flex; flex-direction: column; gap: 4px; }
.wk .cell .ix { font-weight: 600; font-variant-numeric: tabular-nums; }
.wk .cell .ix.fc { color: var(--body); font-weight: 500; }
.wk .gr b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
.wk .gr span { color: var(--body); font-variant-numeric: tabular-nums; }

/* small multiples */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.mini { border: 1px solid var(--hairline); border-radius: 10px; padding: 14px 16px 12px; cursor: pointer; min-width: 0; }
.mini.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mini b { display: block; font-size: 16px; line-height: 20px; font-weight: 600; }
.mini p { color: var(--body); margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
.stage[data-device="phone"] .cards { grid-template-columns: minmax(0, 1fr); }


/* matrix (hours) */
.mx { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 24px; }
.stage[data-device="phone"] .mx { grid-template-columns: minmax(0, 1fr); }

/* table view */
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { height: 40px; padding: 0 12px; text-align: left; font-weight: 500; color: var(--body); background: var(--band); border-bottom: 1px solid var(--hairline); white-space: nowrap; }
.tbl td { height: 52px; padding: 0 12px; border-bottom: 1px solid var(--row-line); white-space: nowrap; }
.tbl .r { text-align: right; }
.tbl tr.on td { background: var(--accent-bg); }
.tbl tbody tr { cursor: pointer; }
@media (hover: hover) { .tbl tbody tr:hover td { background: var(--soft); } .tbl tbody tr.on:hover td { background: var(--accent-bg); } }
.tblwrap { border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; }
.stage[data-device="phone"] .tblwrap { overflow-x: auto; }


/* ── B · Simple: one page, four cards, each = the answer, one figure, one plain chart or a short list ── */
.stage.simple .panel { display: none; }
.cards2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.card2 { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--hairline); border-radius: 10px; padding: 18px 24px 8px; }
.card2 .lab { display: flex; align-items: center; justify-content: space-between; color: var(--body); }
.card2 .lab button { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.card2 h2 { margin-top: 4px; font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -.3px; text-wrap: balance; }
.card2 .fig { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
.card2 .fig b { font-size: 24px; line-height: 30px; font-weight: 600; }
.card2 .fig span { color: var(--body); }
.card2 .ch { margin-top: 12px; }
.card2 .rows { margin-top: 8px; }
.card2 .rows button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 0; border: 0; border-top: 1px solid var(--row-line); background: none; text-align: left; cursor: pointer; }
.card2 .rows button:first-child { border-top: 0; }
.card2 .ch + .rows button:first-child { border-top: 1px solid var(--row-line); }
@media (hover: hover) { .card2 .rows button:hover { background: var(--soft); box-shadow: -12px 0 0 var(--soft), 12px 0 0 var(--soft); } }
.card2 .rows .a { flex: 1; min-width: 0; }
.card2 .rows .a b, .card2 .rows .z b { display: block; font-weight: 500; }
.card2 .rows .a b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card2 .rows .a span, .card2 .rows .z span { color: var(--body); }
.card2 .rows .z { flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.stage[data-device="phone"] .cards2 { grid-template-columns: minmax(0, 1fr); gap: 0; }
.stage[data-device="phone"] .card2 { border: 0; border-radius: 0; border-top: 8px solid var(--soft-2); margin: 0 -16px; padding: 18px 16px 8px; }
.stage[data-device="phone"] .card2:first-child { border-top: 0; }

/* tooltip */
.tip { position: fixed; z-index: 50; pointer-events: none; min-width: 180px; padding: 10px 12px; background: var(--canvas); border: 1px solid var(--hairline); border-radius: 8px; box-shadow: var(--shadow-pop); opacity: 0; transform: translateY(2px); transition: opacity 120ms var(--ease-out), transform 120ms var(--ease-out); }
.tip.on { opacity: 1; transform: none; }
.tip .t { font-weight: 500; margin-bottom: 4px; }
.tip .l { display: flex; align-items: center; gap: 8px; color: var(--body); }
.tip .l b { margin-left: auto; padding-left: 16px; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.tip .l i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
</style>
</head>
<body>
<div class="chrome">
  <span class="lab">Version</span>
  <div class="seg" id="version">
    <button aria-pressed="false" data-v="stories">A · Stories</button>
    <button aria-pressed="true" data-v="simple">B · Simple</button>
  </div>
  <span class="lab">Device</span>
  <div class="seg" id="device">
    <button aria-pressed="true" data-v="desk">Desktop</button>
    <button aria-pressed="false" data-v="phone">Phone</button>
  </div>
</div>
<div class="stage" id="stage" data-device="desk">
  <nav class="rail" aria-label="Departments">

    <div class="tile on" title="Executive"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></div>
    <div class="tile" title="Selling"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg></div>

<div class="tip" id="tip"></div>

<script>
/* ═════════ utilities ═════════ */
const NS = "http://www.w3.org/2000/svg";
function S(tag, a, p) { const e = document.createElementNS(NS, tag); if (a) for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function H(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261017);
const nf = (v, d = 0) => v.toLocaleString("id-ID", { minimumFractionDigits: d, maximumFractionDigits: d });
const MINUS = "−";
function rpc(v) {
  const a = Math.abs(v), s = v < 0 ? MINUS : "";
  if (a >= 1e9) return s + "Rp " + nf(a / 1e9, a >= 1e10 ? 1 : 2) + " B";
  if (a >= 1e6) return s + "Rp " + nf(a / 1e6, a >= 1e8 ? 0 : 1) + " M";
  if (a >= 1e3) return s + "Rp " + nf(a / 1e3) + " K";
  return s + "Rp " + nf(a);
}
const rpAxis = v => v === 0 ? "0" : (v >= 1e9 ? nf(v / 1e9, v % 1e9 ? 1 : 0) + " B" : nf(v / 1e6) + " M");
const pct = (v, d = 0) => nf(v * 100, d) + "%";
const sgnPct = v => (v >= 0 ? "+" : MINUS) + nf(Math.abs(v * 100), Math.abs(v) < .095 ? 1 : 0) + "%";
const times = v => nf(v, 2) + "×";
const pcs = v => nf(Math.round(v)) + " pcs";
const andList = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTH = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const WDN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const WDL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const DAYMS = 864e5;
const D = (y, m, d) => new Date(y, m, d, 12);
const addDays = (d, n) => new Date(d.getTime() + n * DAYMS);
const short = d => d.getDate() + " " + MON[d.getMonth()];
const wshort = d => WDN[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()];
const full = d => d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear();
const wfull = d => WDN[d.getDay()] + " " + full(d);
const TODAY = D(2026, 9, 17);          // Sat 17 Oct 2026, read at 15:00
const DONE = 0.42;                      // the share of a Saturday's trade done by 15:00
const CHEV = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const CHEV_R = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

const tip = document.getElementById("tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.classList.add("on");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 16, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 16;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.classList.remove("on");
const tline = (colour, label, value) => `<div class="l">${colour ? `<i style="background:${colour}"></i>` : ""}${label}<b>${value}</b></div>`;
function hoverable(node, html) { node.addEventListener("mousemove", e => showTip(typeof html === "function" ? html() : html, e)); node.addEventListener("mouseleave", hideTip); }

/* ═════════ data: 13 stores, 1 Jul → 17 Oct 2026 ═════════ */
const STORES = [
  ["C001", "Cikupa", 420, .03], ["C002", "Kota Baru Parahyangan", 380, .013], ["C003", "Muaro Bungo", 300, .011],
  ["C004", "Muara Enim", 265, -.016], ["C005", "Lubuk Linggau", 340, .02], ["C006", "Prabumulih", 290, .008],
  ["C007", "Baturaja", 270, .01], ["C008", "Lahat", 235, -.02], ["C009", "Serpong", 455, .025],
  ["C010", "Bintaro", 410, .015], ["C011", "Depok", 360, .002], ["C012", "Bekasi", 395, .012], ["C013", "Karawaci", 330, -.006],
].map(([id, name, base, g]) => ({ id, name, base, g }));
const WD = [1.38, .82, .80, .84, .88, 1.05, 1.45];
const WDM = WD.reduce((a, b) => a + b) / 7;
const START = D(2026, 6, 1);
const idx = d => Math.round((d - START) / DAYMS);
const NDAYS = idx(TODAY) + 1;
const ANCHOR = D(2026, 8, 14);
for (const s of STORES) {
  s.daily = [];
  for (let i = 0; i < NDAYS; i++) {
    const d = addDays(START, i), w = (d - ANCHOR) / DAYMS / 7;
    const pay = d.getDate() >= 25 || d.getDate() <= 2 ? 1.12 : 1;
    let v = s.base * 1e6 / 30 * WD[d.getDay()] / WDM * Math.pow(1 + s.g, w) * pay * (1 + (R() - .5) * .26);
    if (i === NDAYS - 1) v *= DONE;
    s.daily.push(v);
  }
}
const ALL = { id: "all", name: "All stores", daily: Array.from({ length: NDAYS }, (_, i) => STORES.reduce((a, s) => a + s.daily[i], 0)) };
const ENT = [ALL, ...STORES];
const byId = id => ENT.find(e => e.id === id) || ALL;
const sum = (arr, from, to) => { let t = 0; for (let i = from; i <= to; i++) t += arr[i] || 0; return t; };

/* ═════════ state ═════════ */
const state = { version: "simple", page: "overview", device: "desk", store: "all", views: {}, sel: {} };
const view = (id, def) => state.views[id] || def;

/* ═════════ chart helpers ═════════ */
function frame(host, height, m) {
  const cs = getComputedStyle(host);
  const W = Math.max(220, host.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  const svg = S("svg", { width: W, height, role: "img" }, host);
  return { svg, W, H: height, m, iw: W - m.l - m.r, ih: height - m.t - m.b };
}
function gridY(f, ticks, y, fmt) {
  for (const t of ticks) {
    S("line", { x1: f.m.l, x2: f.W - f.m.r, y1: y(t), y2: y(t), stroke: "var(--row-line)" }, f.svg);
    const tx = S("text", { x: f.m.l - 10, y: y(t) + 5, "text-anchor": "end" }, f.svg); tx.textContent = fmt(t);
  }
}
function xLabel(f, x, text, anchor = "middle", cls) {
  const t = S("text", { x, y: f.H - 8, "text-anchor": anchor }, f.svg); t.textContent = text;
  if (cls) t.style.fill = cls; return t;
}
const pathOf = pts => pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
function label(f, x, y, text, opts = {}) {
  const t = S("text", { x, y, "text-anchor": opts.anchor || "start" }, f.svg);
  t.textContent = text; t.style.fill = opts.fill || "var(--ink)"; if (opts.weight) t.style.fontWeight = opts.weight;
  return t;
}
function haloLabel(f, x, y, text, opts = {}) {
  const t = label(f, x, y, text, opts);
  t.setAttribute("paint-order", "stroke"); t.setAttribute("stroke", "var(--canvas)"); t.setAttribute("stroke-width", "4"); t.setAttribute("stroke-linejoin", "round");
  return t;
}
function crosshair(f, xs, onMove) {
  const line = S("line", { y1: f.m.t, y2: f.H - f.m.b, stroke: "var(--hairline-strong)", opacity: 0 }, f.svg);
  const hit = S("rect", { x: f.m.l, y: f.m.t, width: f.iw, height: f.ih, fill: "transparent" }, f.svg);
  hit.addEventListener("mousemove", e => {
    const r = f.svg.getBoundingClientRect(), px = e.clientX - r.left;
    let best = 0; for (let i = 1; i < xs.length; i++) if (Math.abs(xs[i] - px) < Math.abs(xs[best] - px)) best = i;
    line.setAttribute("x1", xs[best]); line.setAttribute("x2", xs[best]); line.setAttribute("opacity", 1);
    showTip(onMove(best), e);
  });
  hit.addEventListener("mouseleave", () => { line.setAttribute("opacity", 0); hideTip(); });
}
function keyRow(items) { return `<div class="key">${items.map(([g, t]) => `<span>${g}${t}</span>`).join("")}</div>`; }
function seg(id, opts, cur) { return `<div class="seg" data-seg="${id}">${opts.map(([v, l]) => `<button data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join("")}</div>`; }
function facts(list) { return `<div class="facts">${list.map(([l, v, cls]) => `<div class="fact"><div class="l">${l}</div><div class="v ${cls || ""}">${v}</div></div>`).join("")}</div>`; }

/* ═════════ story 1 · Sales Pace ═════════ */
const SEP0 = idx(D(2026, 8, 1)), SEP1 = idx(D(2026, 8, 30)), OCT0 = idx(D(2026, 9, 1));
const ELAPSED = 16 + DONE;
function paceOf(e) {
  const sep = sum(e.daily, SEP0, SEP1);
  const cum = [0]; let c = 0;
  for (let i = OCT0; i < NDAYS; i++) { c += e.daily[i]; cum.push(c); }
  const used = c / sep, even = ELAPSED / 31, x = used / even, rate = c / ELAPSED, end = rate * 31;
  const passDay = end > sep ? sep / rate : null;
  return { e, sep, cum, c, used, even, x, end, endPct: end / sep, passDay };
}
const passDate = p => D(2026, 9, Math.floor(p.passDay) + 1);
function paceNote(p) {
  return p.passDay != null ? { t: "Passes Sep " + short(passDate(p)), cls: "" } : { t: "~" + pct(p.endPct) + " at month end", cls: "warn-t" };
}
const PACE = {
  id: "pace", nav: "Sales Pace",
  brief() {
    const a = paceOf(ALL), behind = STORES.filter(s => paceOf(s).endPct < 1).length;
    return { tone: behind > 3 ? "warn" : "none", title: `October is ${times(a.x)} September's pace`, sub: `Closes near ${rpc(a.end)} if the pace holds. ${behind} of 13 stores are behind.` };
  },
  head() {
    const p = paceOf(byId(state.store));
    const others = STORES.filter(s => s.id !== state.store);
    const behind = others.filter(s => paceOf(s).endPct < 1).length;
    const name = p.e.id === "all" ? "October" : p.e.name;
    const verdict = p.x >= 1 ? `${name} is ${times(p.x)} September's pace` : `${name} is behind September's pace, at ${times(p.x)}`;
    const when = p.passDay != null ? `Passes September's ${rpc(p.sep)} on ${wshort(passDate(p))} and closes near ${rpc(p.end)} if the pace holds.` : `Closes near ${rpc(p.end)} if the pace holds, ${pct(1 - p.endPct)} short of September.`;
    const rest = p.e.id === "all" ? `${behind} of 13 stores are behind.` : `${behind} of the other 12 stores are behind.`;
    return { title: verdict, sub: when + " " + rest, views: [["month", "This month"], ["past", "Past months"]], def: "month" };
  },
  plot(host) {
    const v = view("pace", "month");
    if (v === "past") return pastMonths(host);
    host.innerHTML = keyRow([['<i class="k-line"></i>', "Sold so far"], ['<i class="k-dash"></i>', "If the pace holds"], ['<i class="k-grey"></i>', "Other stores"], ['<i class="k-dash grey"></i>', "Even pace to September"]]);
    const sel = paceOf(byId(state.store));
    const all = ENT.map(paceOf);
    const ymax = Math.max(1.25, Math.ceil((sel.endPct + .05) * 4) / 4);
    const f = frame(host, 330, { l: 52, r: 20, t: 12, b: 34 });
    const x = d => f.m.l + f.iw * d / 31, y = v => f.m.t + f.ih * (1 - v / ymax);
    S("path", { d: `M${x(0)},${y(0)}L${x(31)},${y(1)}L${x(31)},${y(ymax)}L${x(0)},${y(ymax)}Z`, fill: "var(--soft)" }, f.svg);
    const ticks = []; for (let t = 0; t <= ymax + 1e-9; t += .25) ticks.push(t);
    gridY(f, ticks, y, t => pct(t));
    label(f, x(.6), y(ymax) + 22, "Ahead", { fill: "var(--body)" });
    label(f, x(30.4), y(0) - 10, "Behind", { fill: "var(--body)", anchor: "end" });
    S("line", { x1: x(0), y1: y(0), x2: x(31), y2: y(1), stroke: "var(--hairline-strong)", "stroke-dasharray": "5 4", "stroke-width": 1.5 }, f.svg);
    const ang = Math.atan2(y(1) - y(0), x(31) - x(0)) * 180 / Math.PI;
    const ex = x(25.5), ey = y(25.5 / 31) - 8;
    haloLabel(f, ex, ey, "Even pace", { fill: "var(--body)", anchor: "middle" }).setAttribute("transform", `rotate(${ang} ${ex} ${ey})`);
    // now marker
    S("line", { x1: x(ELAPSED), x2: x(ELAPSED), y1: f.m.t, y2: f.H - f.m.b, stroke: "var(--hairline-2)" }, f.svg);
    [[0, "1 Oct"], [7, "8 Oct"], [21, "22 Oct"], [31, "31 Oct"]].forEach(([d, t]) => xLabel(f, x(d), t, d === 0 ? "start" : d === 31 ? "end" : "middle"));
    xLabel(f, x(ELAPSED), "Now", "middle", "var(--ink)");
    const ptsOf = p => p.cum.map((c, k) => [x(k === p.cum.length - 1 ? ELAPSED : k), y(c / p.sep)]);
    for (const p of all) {
      if (p.e.id === state.store) continue;
      S("path", { d: pathOf(ptsOf(p)), fill: "none", stroke: p.e.id === "all" ? "var(--g4)" : "var(--g2)", "stroke-width": p.e.id === "all" ? 1.75 : 1.25, "stroke-linejoin": "round" }, f.svg);
    }
    // projection + line of the chosen one
    const nowX = x(ELAPSED), nowY = y(sel.used);
    S("path", { d: `M${nowX},${nowY}L${x(31)},${y(sel.endPct)}`, stroke: "var(--accent)", "stroke-width": 1.75, "stroke-dasharray": "5 4", fill: "none" }, f.svg);
    const pts = ptsOf(sel);
    S("path", { d: pathOf(pts) + `L${nowX},${y(0)}L${x(0)},${y(0)}Z`, fill: "var(--accent)", opacity: .07 }, f.svg);
    S("path", { d: pathOf(pts), fill: "none", stroke: "var(--accent)", "stroke-width": 2.25, "stroke-linejoin": "round" }, f.svg);
    // labels: the chosen one, the fastest and the slowest store
    const placed = [];
    const put = (px, py, text, fill, weight) => { if (placed.some(q => Math.abs(q - py) < 20)) return; placed.push(py); haloLabel(f, px + 10, py + 5, text, { fill, weight }); };
    S("circle", { cx: nowX, cy: nowY, r: 4.5, fill: "var(--canvas)", stroke: "var(--accent)", "stroke-width": 2 }, f.svg);
    put(nowX, nowY, pct(sel.used) + " · " + (sel.e.id === "all" ? "All stores" : sel.e.name), "var(--ink)", 600);
    const ranked = STORES.map(paceOf).filter(p => p.e.id !== state.store).sort((a, b) => b.x - a.x);
    for (const p of [ranked[0], ranked[ranked.length - 1]]) {
      const py = y(p.used); S("circle", { cx: nowX, cy: py, r: 3, fill: "var(--g4)" }, f.svg);
      put(nowX, py, `${pct(p.used)} · ${p.e.name}`, "var(--body)");
    }
    if (sel.passDay != null) {
      const px = x(sel.passDay), py = y(1);
      S("circle", { cx: px, cy: py, r: 5, fill: "var(--canvas)", stroke: "var(--accent)", "stroke-width": 2 }, f.svg);
      haloLabel(f, px, py - 12, "Passes September · " + short(passDate(sel)), { anchor: px > f.W - 160 ? "end" : "middle", weight: 500 });
    } else {
      const py = y(sel.endPct);
      S("circle", { cx: x(31), cy: py, r: 5, fill: "var(--canvas)", stroke: "var(--warn)", "stroke-width": 2 }, f.svg);
      haloLabel(f, x(31) - 10, py + 22, "~" + pct(sel.endPct) + " at month end", { anchor: "end", fill: "var(--warn-fg)", weight: 500 });
    }
    const xs = sel.cum.map((_, k) => x(k === sel.cum.length - 1 ? ELAPSED : k));
    crosshair(f, xs, k => {
      const day = k === 0 ? "1 Oct 2026, opening" : (k === sel.cum.length - 1 ? "17 Oct 2026, 15:00" : wfull(D(2026, 9, k)) + ", close");
      const evenK = (k === sel.cum.length - 1 ? ELAPSED : k) / 31;
      return `<div class="t">${day}</div>` + tline("var(--accent)", sel.e.name, pct(sel.cum[k] / sel.sep) + " · " + rpc(sel.cum[k])) + tline("var(--hairline-strong)", "Even pace", pct(evenK));
    });
  },
  side(host) {
    const p = paceOf(byId(state.store));
    const n = paceNote(p);
    const list = ENT.map(paceOf).sort((a, b) => (a.e.id === "all" ? -1 : b.e.id === "all" ? 1 : b.x - a.x));
    host.innerHTML = `
      <div class="who"><b>${p.e.name}</b><span>${p.e.id === "all" ? "13 stores" : p.e.id} · September ${rpc(p.sep)}</span></div>
      <div class="hero"><b>${times(p.x)}</b><span>September's pace</span></div>
      ${facts([["Sold so far", pct(p.used)], ["Even pace", pct(p.even)]])}
      <div class="sub-t">If the pace holds</div>
      ${facts([["Month end", rpc(p.end)], p.passDay != null ? ["Passes Sep", short(passDate(p))] : ["Against September", sgnPct(p.endPct - 1), "warn-t"]])}
      <div class="sec"><h3>All stores <span>· fastest first</span></h3><div class="rank">${list.map(q => {
        const nn = paceNote(q);
        return `<button data-store="${q.e.id}" aria-current="${q.e.id === state.store}"><span class="n">${q.e.name}<small class="${nn.cls}">${nn.t}</small></span><span class="x">${times(q.x)}</span></button>`;
      }).join("")}</div></div>`;
  },
};
function pastMonths(host) {
  const e = byId(state.store);
  host.innerHTML = keyRow([['<i class="k-line"></i>', "October"], ['<i class="k-dash"></i>', "If the pace holds"], ['<i class="k-grey"></i>', "July to September"]]);
  const months = [6, 7, 8, 9].map(m => {
    const days = new Date(2026, m + 1, 0).getDate(), i0 = idx(D(2026, m, 1));
    const cum = [0]; let c = 0;
    for (let d = 0; d < days && i0 + d < NDAYS; d++) { c += e.daily[i0 + d]; cum.push(c); }
    return { m, days, cum, total: c };
  });
  const oct = months[3], rate = oct.total / ELAPSED, end = rate * 31;
  const ymax = Math.max(end, ...months.map(m => m.total)) * 1.08;
  const f = frame(host, 330, { l: 64, r: 120, t: 12, b: 34 });
  const x = d => f.m.l + f.iw * d / 31, y = v => f.m.t + f.ih * (1 - v / ymax);
  const step = ymax > 4e9 ? 1e9 : ymax > 1.6e9 ? 5e8 : ymax > 8e8 ? 2e8 : 1e8;
  const ticks = []; for (let t = 0; t <= ymax; t += step) ticks.push(t);
  gridY(f, ticks, y, rpAxis);
  [[0, "Day 1"], [10, "10"], [20, "20"], [31, "31"]].forEach(([d, t]) => xLabel(f, x(d), t, d === 0 ? "start" : "middle"));
  const placed = [];
  const put = (py, text, fill, weight) => { let yy = py + 5; while (placed.some(q => Math.abs(q - yy) < 19)) yy += 19; placed.push(yy); haloLabel(f, x(31) + 10, yy, text, { fill, weight }); };
  months.slice(0, 3).forEach((mm, i) => {
    const pts = mm.cum.map((c, k) => [x(k * 31 / mm.days), y(c)]);
    S("path", { d: pathOf(pts), fill: "none", stroke: ["var(--g2)", "var(--g3)", "var(--g4)"][i], "stroke-width": 1.5 }, f.svg);
    put(y(mm.total), `${MON[mm.m]} ${rpc(mm.total)}`, "var(--body)");
  });
  const pts = oct.cum.map((c, k) => [x(k === oct.cum.length - 1 ? ELAPSED : k), y(c)]);

  if (state.page === "overview") {
    const rows = STORIES.map(s => ({ s, b: s.brief() })).sort((a, b) => ({ bad: 0, warn: 1, none: 2 }[a.b.tone] - { bad: 0, warn: 1, none: 2 }[b.b.tone]));
    page.innerHTML = phoneBar() + `<div class="head"><h1>Overview</h1></div><div class="brief">${rows.map(({ s, b }) => `<button data-page="${s.id}"><i class="dot ${b.tone}"></i><b>${b.title}</b><span class="s">${b.sub}</span><span class="t">${s.nav}</span>${CHEV_R}</button>`).join("")}</div>`;
    return;
  }
  const s = STORIES.find(x => x.id === state.page);
  const hd = s.head(), v = view(s.id, hd.def);
  page.innerHTML = phoneBar() + `<div class="head ${PICKER[s.id] ? "" : "empty"}"><h1>${s.nav}</h1><div class="tools">${PICKER[s.id] ? storePicker() : ""}</div></div>
    <section class="story"><div class="story-head"><div class="swap" id="sh"><h2>${hd.title}</h2><p>${hd.sub}</p></div>${seg(s.id, hd.views, v)}</div>
    <div class="story-body ${s.wide ? "wide" : ""}"><div class="plot swap" id="plot"></div>${s.wide ? "" : '<div class="side swap" id="side"></div>'}</div></section>`;
  s.plot(page.querySelector("#plot"));
  if (!s.wide) s.side(page.querySelector("#side"));
}
// a choice inside the card swaps the card's contents in place (the hub's "mode" move: out 100ms, in 160ms)
function swapRender() {
  const parts = page.querySelectorAll(".swap");
  if (!parts.length || matchMedia("(prefers-reduced-motion: reduce)").matches) return render();
  parts.forEach(p => p.classList.add("out"));
  setTimeout(() => { render(); page.querySelectorAll(".swap").forEach(p => { p.classList.add("out"); requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove("out"))); }); }, 100);
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-row], [data-store-row], [data-stockrow], .r");
  const pop = document.getElementById("pop");
  if (pop && !e.target.closest(".pick")) pop.hidden = true;
  if (!t) return;
  if (t.id === "pickbtn") { pop.hidden = !pop.hidden; return; }
  if (t.dataset.page) { state.page = t.dataset.page; hideTip(); render(); window.scrollTo({ top: 0 }); return; }
  const segEl = t.closest("[data-seg]");
  if (segEl && t.dataset.v) { state.views[segEl.dataset.seg] = t.dataset.v; hideTip(); swapRender(); return; }
  if (t.closest("#version")) { state.version = t.dataset.v; document.querySelectorAll("#version button").forEach(b => b.setAttribute("aria-pressed", b === t)); if (state.version === "stories") state.page = "overview"; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.goto) { const [pg, id] = t.dataset.goto.split(":"); state.version = "stories"; state.page = pg; if (id && pg === "sellout") state.sel.sellout = id; if (id && pg === "stock") state.sel.stock = id; document.querySelectorAll("#version button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === "stories")); hideTip(); render(); window.scrollTo({ top: 0 }); return; }
  if (t.closest("#device")) { state.device = t.dataset.v; document.querySelectorAll("#device button").forEach(b => b.setAttribute("aria-pressed", b === t)); render(); return; }
  if (t.dataset.store) { state.store = t.dataset.store; if (state.page === "stores") state.sel.stores = null; swapRender(); return; }
  if (t.dataset.coh) { state.sel.through = t.dataset.coh; swapRender(); return; }
  const sk = e.target.closest("[data-stockrow]");
  if (sk) { state.sel.stock = sk.dataset.stockrow; swapRender(); return; }
  const row = e.target.closest("[data-row]");
  if (row) { state.sel.sellout = row.dataset.row; swapRender(); return; }
  const sr = e.target.closest("[data-store-row]");
  if (sr) { if (state.store !== "all") state.store = sr.dataset.storeRow; else state.sel.stores = sr.dataset.storeRow; swapRender(); return; }
});
document.addEventListener("change", e => { if (e.target.id === "phonepage") { state.page = e.target.value; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { const pop = document.getElementById("pop"); if (pop) pop.hidden = true; } });
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(render, 80); }).observe(page);
const hashPage = location.hash.slice(1); if (hashPage) { state.page = hashPage; state.version = "stories"; document.querySelectorAll("#version button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === "stories")); }
render();
</script>
</body>
