function badge(){const options={issued:['Issued',''],partial:['Partly received',''],review:['Issued',''],finished:['Fully received','ok'],cancelled:['Cancelled','bad'],short:['Closed short','ok']};const [label,tone]=options[state.status];return `<span class="pill ${tone}">${label}</span>`;}
function btn(text,action,classes='',disabled=false){return `<button type="button" class="btn ${classes}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;}
function identity(line,detail,allowToggle=true){const open=state.expanded.includes(line.id);const arrivals=detail&&received(line)>0&&!proposed()?`<div class="receipt">Received<br>10 Oct · ${num(received(line))} pcs</div>`:'';return `<div class="identity"><span class="thumb" aria-hidden="true">${icon.shirt}</span><div><div class="item-name">${esc(line.name)}</div><div class="filed">${esc(line.division)} · ${esc(line.tag)}</div>${arrivals}${proposed()&&allowToggle?`<button class="variant-toggle" data-variants="${line.id}" aria-expanded="${open}">${open?'− Hide':'＋ Show'} variants</button>`:''}</div></div>`;}
function itemsTable({detail=false,review=false}={}){
 const t=totals(),columns=4+(detail?1:0)+(!detail&&!review?1:0),span=detail?4:3;
 const filtered=state.lines.filter(line=>!proposed()||state.view!=='detail'||line.name.toLowerCase().includes(state.query.toLowerCase()));
 const rows=filtered.map(line=>`<tr><td class="item-cell">${identity(line,detail)}</td><td class="num">${num(line.quantity)} pcs</td>${detail?`<td class="num">${received(line)?num(received(line))+' pcs':'—'}</td>`:''}<td class="num">${money(line.price)} / pc</td><td class="amount num">${money(line.quantity*line.price)}</td>${!detail&&!review?`<td><div class="row-actions"><button data-edit="${line.id}" aria-label="Edit ${esc(line.name)}" ${frozen()?'disabled':''}>${icon.edit}</button><button data-remove="${line.id}" aria-label="Remove ${esc(line.name)}" ${frozen()?'disabled':''}>${icon.trash}</button></div></td>`:''}</tr>${!proposed()||state.expanded.includes(line.id)?`<tr class="variant"><td>${esc(line.colours)} · ${esc(line.size.split(', ')[0])}</td><td class="num">${num(Math.ceil(line.quantity/2))} pcs</td>${'<td></td>'.repeat(columns-2)}</tr><tr class="variant"><td>${esc(line.colours)} · ${esc(line.size.split(', ')[1]||line.size.split(', ')[0])}</td><td class="num">${num(Math.floor(line.quantity/2))} pcs</td>${'<td></td>'.repeat(columns-2)}</tr>${detail&&proposed()&&received(line)?`<tr class="expanded-receipt"><td colspan="${columns}">Received · 10 Oct 2026 · ${num(received(line))} pcs</td></tr>`:''}`:''}`).join('');
 return `<div class="table-wrap ${proposed()?'compact-items':''}"><table><colgroup><col><col style="width:${proposed()?90:110}px">${detail?'<col style="width:90px">':''}<col style="width:${proposed()?130:145}px"><col style="width:${proposed()?130:145}px">${!detail&&!review?'<col style="width:64px">':''}</colgroup><thead><tr><th>Item</th><th>Quantity</th>${detail?'<th>Received</th>':''}<th>Unit Price</th><th>Amount</th>${!detail&&!review?'<th><span aria-label="Actions"></span></th>':''}</tr></thead><tbody>${rows||`<tr><td colspan="${columns}" style="text-align:center">No matching items.</td></tr>`}</tbody><tfoot><tr><td>${proposed()?'Subtotal':'Total'}</td><td class="num">${num(t.quantity)} pcs</td>${detail?`<td class="num">${num(receivedTotal())} pcs</td>`:''}<td></td><td class="num" data-total="gross">${money(t.gross)}</td>${!detail&&!review?'<td></td>':''}</tr>${(detail||review)&&t.discount?`<tr class="discount"><td colspan="${span}">Discount · ${num(Math.round(t.discount/(t.gross||1)*10000)/100)}%</td><td class="num">−${money(t.discount)}</td></tr>`:''}${t.closed?`<tr class="discount"><td colspan="${span}">Closed Short · ${num(t.quantity-receivedTotal())} pcs</td><td class="num">−${money(t.closed)}</td></tr>`:''}${detail||review?`<tr class="grand"><td colspan="${span}">Grand Total</td><td class="num">${money(t.grand)}</td></tr>`:''}</tfoot></table></div>`;
}
function facts(){return `<dl class="facts"><div class="supplier-fact"><dt>Supplier</dt><dd>${esc(state.supplier||'—')}</dd></div><div><dt>Delivery Date</dt><dd>${state.arrival?day(state.arrival):'—'}</dd></div>${state.terms?`<div><dt>Payment Terms</dt><dd>${esc(state.terms)}</dd></div>`:''}<div><dt>Payment Method</dt><dd>${({TRANSFER:'Transfer',CASH:'Cash',GIRO:'Giro'})[state.method]||'—'}</dd></div></dl>`;}
function noteSections(detail){const notes=state.notes.trim()?`<section><h3 class="section-title">Notes</h3><p class="text-block">${esc(state.notes)}</p></section>`:'';const conditions=state.conditions.trim()?`<section><h3 class="section-title">Terms and Conditions</h3><p class="text-block">${esc(state.conditions)}</p></section>`:'';return detail&&!proposed()?conditions+notes:notes+conditions;}
function currentDetailBody(){const t=totals(),r=state.lines.reduce((sum,line)=>sum+received(line),0),finished=['finished','cancelled','short'].includes(state.status);return `<div class="body-stack">${finished&&!proposed()?`<span class="stamp ${state.status==='cancelled'?'bad':''}" aria-hidden="true">${state.status==='cancelled'?'CANCELLED':state.status==='short'?'CLOSED SHORT':'FULLY RECEIVED'}</span>`:''}${facts()}<section><h3 class="section-title">Items (${state.lines.length})</h3>${itemsTable({detail:true})}${r?`<dl class="receipt-card"><dt>Total Received</dt><dd class="num">${num(r)} pcs</dd><dt>${state.status==='short'?'Short':'Still Expected'}</dt><dd class="num">${num(Math.max(0,t.quantity-r))} pcs</dd></dl>`:''}</section>${noteSections(true)}</div>`;}
function field(label,control,key,required=false){return `<div class="field"><label class="field-label" for="${key}">${label}${required?'<span class="required">*</span>':''}</label>${control}${state.errors[key]?`<p class="problem" id="${key}-problem">${state.errors[key]}</p>`:''}</div>`;}
function calendar(){const blanks='<span></span>'.repeat(3);return `<div class="calendar"><header>October 2026<button class="btn icon ghost" data-action="close-calendar" aria-label="Close calendar">${icon.close}</button></header><div class="calendar-grid">${['M','T','W','T','F','S','S'].map(day=>`<span>${day}</span>`).join('')}${blanks}${Array.from({length:31},(_,i)=>`<button data-date="2026-10-${String(i+1).padStart(2,'0')}" ${i+1<11?'disabled':''} class="${state.arrival==='2026-10-'+String(i+1).padStart(2,'0')?'on':''}">${i+1}</button>`).join('')}</div></div>`;}
function currentCreateBody(){return `<div class="body-stack">${frozen()?'<div class="banner">Goods have been received on this order. Only the delivery date and the notes can change.</div>':''}<div class="form-grid">${field('Supplier',`<select class="control ${state.errors.supplier?'error':''}" id="supplier" data-field="supplier" ${state.editing?'disabled':''}><option value="">Choose a supplier</option>${['Garmen Nusantara, PT','Indorama, PT','Tekstil Jaya, CV'].map(name=>`<option ${state.supplier===name?'selected':''}>${name}</option>`).join('')}</select>`,'supplier',!state.editing)}${field('Delivery Date',`<div class="date-field"><button class="control date-button ${state.errors.arrival?'error':''}" id="arrival" data-action="calendar">${day(state.arrival)}${icon.calendar}</button>${state.calendar?calendar():''}</div>`,'arrival',true)}${field('Payment Terms',`<select class="control" id="terms" data-field="terms" ${frozen()?'disabled':''}>${['','Net 30','Net 60','Due on receipt'].map(term=>`<option value="${term}" ${state.terms===term?'selected':''}>${term||'None'}</option>`).join('')}</select>`,'terms')}${field('Payment Method',`<select class="control ${state.errors.method?'error':''}" id="method" data-field="method" ${frozen()?'disabled':''}><option value="">Choose a method</option>${[['GIRO','Giro'],['TRANSFER','Transfer'],['CASH','Cash']].map(([value,label])=>`<option value="${value}" ${state.method===value?'selected':''}>${label}</option>`).join('')}</select>`,'method',true)}</div><section><div class="section-head"><h3 class="section-title">Items</h3>${btn('＋ '+(proposed()?'Add item':'New item'),'add','',!state.supplier||frozen())}</div>${state.lines.length?itemsTable():`<div class="empty">${state.supplier?'Nothing on this order yet. Add what is being ordered.':'Choose a supplier, then add what is being ordered.'}</div>`}${state.errors.items?`<p class="problem">${state.errors.items}</p>`:''}</section><section><h3 class="section-title">Discount</h3><div class="form-grid">${field('Discount Amount',`<input class="control" id="discount-amount" data-field="discountAmount" type="number" min="0" value="${totals().discount||''}" placeholder="Rp" ${frozen()?'disabled':''}>`,'discount-amount')}${field('Discount Percentage',`<div class="suffix"><input class="control" id="discount-percent" data-field="discountPct" type="number" min="0" max="100" step="0.1" value="${state.discountAmount===null?state.discountPct:Math.round(totals().discount/(totals().gross||1)*10000)/100}" ${frozen()?'disabled':''}><span>%</span></div>`,'discount-percent')}</div></section>${proposed()?`<details class="extras" id="extra-fields"><summary>Additional information<small>${state.notes.trim()?'Notes filled · ':''}${state.conditions.trim()?'Default terms filled':'Optional'}</small></summary><div class="extras-content">${extraFields()}</div></details>`:extraFields()}</div>`;}
function extraFields(){return `<section><h3 class="section-title">Notes</h3><textarea class="control" data-field="notes" rows="2" aria-label="Notes">${esc(state.notes)}</textarea></section><section><h3 class="section-title">Terms and Conditions</h3><textarea class="control" data-field="conditions" rows="3" aria-label="Terms and conditions" ${frozen()?'disabled':''}>${esc(state.conditions)}</textarea></section>`;}
function currentReviewBody(){return `<div class="body-stack">${facts()}<section><h3 class="section-title">Items (${state.lines.length})</h3>${itemsTable({review:true})}</section>${noteSections(false)}</div>`;}

const LAYOUTS=[['workspace','A · Workspace'],['document','B · Document'],['split','C · Split']];
const receivedTotal=()=>state.lines.reduce((sum,line)=>sum+received(line),0);
function orderFields(keys=['supplier','arrival','terms','method']){
 const controls={
 supplier:field('Supplier',`<select class="control ${state.errors.supplier?'error':''}" id="supplier" data-field="supplier" ${state.editing?'disabled':''}><option value="">Choose a supplier</option>${['Garmen Nusantara, PT','Indorama, PT','Tekstil Jaya, CV'].map(name=>`<option ${state.supplier===name?'selected':''}>${name}</option>`).join('')}</select>`,'supplier',!state.editing),
 arrival:field('Delivery date',`<div class="date-field"><button class="control date-button ${state.errors.arrival?'error':''}" id="arrival" data-action="calendar">${day(state.arrival)}${icon.calendar}</button>${state.calendar?calendar():''}</div>`,'arrival',true),
 terms:field('Payment terms',`<select class="control" id="terms" data-field="terms" ${frozen()?'disabled':''}>${['','Net 30','Net 60','Due on receipt'].map(term=>`<option value="${term}" ${state.terms===term?'selected':''}>${term||'None'}</option>`).join('')}</select>`,'terms'),
 method:field('Payment method',`<select class="control ${state.errors.method?'error':''}" id="method" data-field="method" ${frozen()?'disabled':''}><option value="">Choose a method</option>${[['GIRO','Giro'],['TRANSFER','Transfer'],['CASH','Cash']].map(([value,label])=>`<option value="${value}" ${state.method===value?'selected':''}>${label}</option>`).join('')}</select>`,'method',true)
 };return keys.map(key=>controls[key]).join('');
}
function discountFields(){return `<div class="form-grid">${field('Discount (Rp)',`<input class="control" id="discount-amount" data-field="discountAmount" type="number" min="0" value="${totals().discount||''}" placeholder="0" ${frozen()?'disabled':''}>`,'discount-amount')}${field('Discount (%)',`<input class="control" id="discount-percent" data-field="discountPct" type="number" min="0" max="100" step="0.1" value="${state.discountAmount===null?state.discountPct:Math.round(totals().discount/(totals().gross||1)*10000)/100}" ${frozen()?'disabled':''}>`,'discount-percent')}</div>`;}
function costSummary(){const t=totals();return `<dl class="cost-lines"><div><dt>Subtotal</dt><dd class="num" data-total="gross">${money(t.gross)}</dd></div><div><dt>Discount</dt><dd class="num" data-total="discount">−${money(t.discount)}</dd></div>${t.closed?`<div><dt>Closed short</dt><dd class="num">−${money(t.closed)}</dd></div>`:''}</dl><div class="cost-grand"><span>Grand total</span><b class="num" data-total="grand">${money(t.grand)}</b></div><div class="cost-quantity" data-total="quantity">${state.lines.length} items · ${num(t.quantity)} pcs</div>`;}
function costCard(edit=false){return `<section class="cost-card"><h3>${edit?'Payment & total':'Order total'}</h3>${edit?`${orderFields(['method','terms'])}<div class="divider"></div>${discountFields()}<div class="divider"></div>`:''}${costSummary()}</section>`;}
function extras(){return `<details class="extras" id="extra-fields"><summary>Notes & terms<small>${state.notes.trim()?'Notes filled · ':''}${state.conditions.trim()?'Terms filled':'Optional'}</small></summary><div class="extras-content">${extraFields()}</div></details>`;}
function itemError(){return state.errors.items?`<p class="problem" role="alert">${state.errors.items}</p>`:'';}
function emptyItems(){return `<div class="empty">${state.supplier?'Add the first item to this order.':'Choose a supplier to start adding items.'}</div>`;}
function lockedBanner(){return frozen()?'<div class="banner">Goods have been received. You can change the delivery date and notes only.</div>':'';}
function itemsSection(review=false,number=''){return `<section><div class="section-head"><h3 class="section-title">${number?`<span class="section-number">${number}</span>`:''}Order items <span class="item-count">${state.lines.length} items</span></h3>${review?'':btn('＋ Add item','add','',!state.supplier||frozen())}</div>${state.lines.length?itemsTable({review}):emptyItems()}${itemError()}</section>`;}
function progress(){const q=totals().quantity,r=receivedTotal(),pct=q?Math.round(r/q*100):0;return `<div class="progress-row"><div class="progress-track ${pct===100?'complete':''}" role="progressbar" aria-label="Received quantity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" style="--progress:${pct}%"><i></i></div><span>${pct}% received${state.status==='short'?' · remainder closed':''}</span></div>`;}
function hero(){const t=totals(),r=receivedTotal();return `<section class="order-hero"><div class="hero-top"><div><span class="eyebrow">Supplier</span><h3>${esc(state.supplier||'—')}</h3></div><div class="hero-due"><span class="eyebrow">Delivery date</span><b>${day(state.arrival)}</b></div></div><div class="hero-stats"><div class="hero-stat"><span>Grand total</span><b class="num">${money(t.grand)}</b></div><div class="hero-stat"><span>Received</span><b class="num">${num(r)} <small>/ ${num(t.quantity)} pcs</small></b></div><div class="hero-stat"><span>${state.status==='short'?'Closed short':state.status==='cancelled'?'Cancelled quantity':'Still expected'}</span><b class="num">${num(t.quantity-r)} <small>pcs</small></b></div></div>${progress()}</section>`;}
function activity(){const r=receivedTotal();return `<div class="history">${['cancelled','short','finished'].includes(state.status)?`<div class="history-entry"><b>${state.status==='cancelled'?'Order cancelled':state.status==='short'?'Closed short':'Fully received'}</b><p>${state.status==='short'?'Outstanding quantities closed.':state.status==='cancelled'?'No further receipts expected.':'All ordered pieces received.'}</p><small>11 Oct 2026 · example</small></div>`:''}${r?`<div class="history-entry"><b>Goods received</b><p>${num(r)} pcs received · ${state.lines.length} items</p><small>10 Oct 2026 · Warehouse · example</small></div>`:''}<div class="history-entry"><b>Purchase order issued</b><p>${esc(state.supplier)} · ${num(totals().quantity)} pcs</p><small>10 Oct 2026 · Hari · example</small></div></div>`;}
function workspaceDetail(){return `<div class="detail-workspace">${hero()}<nav class="document-nav" aria-label="Order sections">${[['items','Items · '+state.lines.length],['activity','Activity'],['information','Order information']].map(([key,label])=>`<button data-detail-tab="${key}" class="${state.detailTab===key?'on':''}" aria-pressed="${state.detailTab===key}">${label}</button>`).join('')}</nav><div class="detail-content">${state.detailTab==='items'?`<div class="items-heading"><h3>Order items</h3><input class="control item-search" data-item-search placeholder="Find an item…" aria-label="Find an item" value="${esc(state.query)}"></div><div id="items-slot">${itemsTable({detail:true})}</div>`:state.detailTab==='activity'?activity():`<div class="info-stack">${facts()}${noteSections(true)}</div>`}</div></div>`;}
function workspaceCreate(review=false){return `<div class="body-stack">${lockedBanner()}<div class="workspace"><div class="work-main">${review?`<section class="section-card"><h3 class="section-title">Order information</h3>${facts()}</section>`:`<section class="section-card"><h3 class="section-title">Order information</h3><div class="form-grid">${orderFields(['supplier','arrival'])}</div></section>`}${itemsSection(review)}${review?noteSections(false):extras()}</div><aside class="context-rail">${costCard(!review)}${review?'<section class="context-card"><h3>Ready to create?</h3><p>Check the supplier, item quantities and payment details before creating this order.</p></section>':''}</aside></div></div>`;}
function paperHead(){return `<header class="paper-head"><div><span class="paper-label">Supplier</span><h3>${esc(state.supplier||'—')}</h3><span class="muted">${state.view==='detail'||state.editing?esc(state.orderNumber):'Draft purchase order'} · ${state.lines.length} items</span></div><div class="paper-total"><span class="paper-label">Grand total</span><b class="num">${money(totals().grand)}</b></div></header>`;}
function documentDetail(review=false){return `<div class="document-layout">${paperHead()}${facts().replace('class="facts"','class="facts paper-facts"')}${!review?`<div class="document-progress"><b>${num(receivedTotal())} / ${num(totals().quantity)} pcs received</b><div class="sp"></div><span>${num(totals().quantity-receivedTotal())} pcs ${state.status==='short'?'closed short':state.status==='cancelled'?'cancelled':'still expected'}</span></div>`:''}<section><h3 class="section-title">Order items</h3>${itemsTable(review?{review:true}:{detail:true})}</section><div class="document-payment">${noteSections(true)}</div></div>`;}
function documentCreate(){return `<div class="document-layout">${lockedBanner()}<section class="section-card"><div class="section-head"><h3 class="section-title"><span class="section-number">1</span>Order information</h3><span class="muted">Who & when</span></div><div class="form-grid">${orderFields()}</div></section>${itemsSection(false,'2')}<div class="document-payment"><section class="section-card"><h3 class="section-title"><span class="section-number">3</span>Discount</h3>${discountFields()}</section>${costCard()}</div>${extras()}</div>`;}
function itemSelector(){const selected=state.selectedItem||state.lines[0]?.id;return `<ul class="item-selector">${state.lines.filter(line=>line.name.toLowerCase().includes(state.query.toLowerCase())).map(line=>`<li><button data-select-item="${line.id}" class="${selected===line.id?'on':''}" aria-pressed="${selected===line.id}"><b>${esc(line.name)}</b><span>${num(received(line))} / ${num(line.quantity)} pcs received</span></button></li>`).join('')||'<li class="empty">No matching items.</li>'}</ul>`;}
function inspector(){const line=state.lines.find(line=>line.id===state.selectedItem)||state.lines[0];if(!line)return emptyItems();return `<article class="item-inspector"><div class="inspector-head"><span class="thumb">${icon.shirt}</span><div><h3>${esc(line.name)}</h3><span class="muted">${esc(line.division)} · ${esc(line.tag)}</span></div></div><div class="line-stats"><div><span>Ordered</span><b>${num(line.quantity)} pcs</b></div><div><span>Received</span><b>${num(received(line))} pcs</b></div><div><span>${state.status==='short'?'Closed short':state.status==='cancelled'?'Cancelled':'Still expected'}</span><b>${num(line.quantity-received(line))} pcs</b></div></div><section class="inspector-section"><h4>Variant breakdown</h4><div class="mini-table"><table><thead><tr><th>Variant</th><th>Ordered</th><th>Received</th></tr></thead><tbody>${line.size.split(', ').map((size,i)=>`<tr><td>${esc(line.colours)} · ${esc(size)}</td><td>${num(i?Math.floor(line.quantity/2):Math.ceil(line.quantity/2))} pcs</td><td>${num(i?Math.floor(received(line)/2):Math.ceil(received(line)/2))} pcs</td></tr>`).join('')}</tbody></table></div></section><section class="inspector-section"><h4>Receipt history</h4>${received(line)?`<div class="history"><div class="history-entry"><b>${num(received(line))} pcs received</b><p>Warehouse receipt · example</p><small>10 Oct 2026</small></div></div>`:'<p class="muted">No receipts yet.</p>'}</section><div class="line-price"><span>Unit price · ${money(line.price)} / pc<br>Item subtotal before order discount</span><b class="num">${money(line.quantity*line.price)}</b></div></article>`;}
function splitDetail(){return `<div class="split-layout"><aside class="split-context"><section class="context-card"><div class="split-order-name">${esc(state.supplier)}</div><p>Delivery · ${day(state.arrival)}</p><div class="divider"></div>${costSummary()}</section><section><div class="item-list-title"><h3>Items</h3><span class="muted">${state.lines.length}</span></div><input class="control item-search" data-item-search placeholder="Find an item…" aria-label="Find an item" value="${esc(state.query)}"><div id="selector-slot" style="margin-top:12px">${itemSelector()}</div></section></aside><div id="inspector-slot">${inspector()}</div></div>`;}
function editorCards(review=false){return `<div class="editor-cards">${state.lines.map(line=>`<article class="editor-card"><div class="editor-card-head">${identity(line,false,false)}${review?'':`<div class="row-actions"><button data-edit="${line.id}" aria-label="Edit ${esc(line.name)}" ${frozen()?'disabled':''}>${icon.edit}</button><button data-remove="${line.id}" aria-label="Remove ${esc(line.name)}" ${frozen()?'disabled':''}>${icon.trash}</button></div>`}</div><div class="editor-inputs">${review?`<div><span class="muted">Quantity</span><p>${num(line.quantity)} pcs</p></div><div><span class="muted">Unit price</span><p>${money(line.price)} / pc</p></div>`:`<label class="field"><span class="field-label">Quantity (pcs)</span><input class="control ${line.quantity<1||!Number.isInteger(line.quantity)?'error':''}" aria-invalid="${line.quantity<1||!Number.isInteger(line.quantity)}" data-inline="${line.id}" data-prop="quantity" type="number" min="1" step="1" value="${line.quantity}" ${frozen()?'disabled':''}></label><label class="field"><span class="field-label">Unit price (Rp)</span><input class="control ${line.price<=0?'error':''}" aria-invalid="${line.price<=0}" data-inline="${line.id}" data-prop="price" type="number" min="1" value="${line.price}" ${frozen()?'disabled':''}></label>`}<div class="line-amount"><span>Item subtotal</span><b class="num" data-line-amount="${line.id}">${money(line.quantity*line.price)}</b></div></div><div class="variant-strip"><span>${esc(line.colours)} · ${esc(line.size)}</span><span>2 variants</span></div></article>`).join('')||emptyItems()}</div>`;}
function splitCreate(review=false){return `<div class="body-stack">${lockedBanner()}<div class="split-layout"><aside class="split-context">${review?`<section class="context-card"><h3>Order information</h3>${facts()}</section>${costCard()}`:`<section class="section-card"><h3>Order information</h3><div class="form-grid">${orderFields()}</div></section><section class="cost-card"><h3>Discount & total</h3>${discountFields()}<div class="divider"></div>${costSummary()}</section>`}</aside><div class="work-main"><section><div class="section-head"><h3 class="section-title">Order items <span class="item-count">${state.lines.length} items</span></h3>${review?'':btn('＋ Add item','add','',!state.supplier||frozen())}</div>${editorCards(review)}${itemError()}</section>${review?noteSections(false):extras()}</div></div></div>`;}
function detailBody(){return !proposed()?currentDetailBody():state.layout==='workspace'?workspaceDetail():state.layout==='document'?documentDetail():splitDetail();}
function createBody(){return !proposed()?currentCreateBody():state.layout==='workspace'?workspaceCreate():state.layout==='document'?documentCreate():splitCreate();}
function reviewBody(){return !proposed()?currentReviewBody():state.layout==='workspace'?workspaceCreate(true):state.layout==='document'?documentDetail(true):splitCreate(true);}
function repaintTotals(){const t=totals();document.querySelectorAll('[data-total]').forEach(node=>node.textContent=node.dataset.total==='quantity'?`${state.lines.length} items · ${num(t.quantity)} pcs`:(node.dataset.total==='discount'?'−':'')+money(t[node.dataset.total]));document.querySelectorAll('[data-line-amount]').forEach(node=>{const line=state.lines.find(line=>line.id===Number(node.dataset.lineAmount));if(line)node.textContent=money(line.quantity*line.price);});const total=document.querySelector('.foot-total b');if(total)total.textContent=money(t.grand);const quantity=document.querySelector('.foot-quantity');if(quantity)quantity.textContent=`${state.lines.length} items · ${num(t.quantity)} pcs`;}
function summaryFooter(){if(!proposed()||!state.lines.length)return '';const t=totals();return `<div class="foot-summary"><div class="foot-quantity num">${state.lines.length} items · ${num(t.quantity)} pcs</div><div class="foot-total"><span>Grand Total</span><b class="num">${money(t.grand)}</b></div></div>`;}
function footer(){let actions='';if(state.view==='detail'){if(state.status==='partial')actions+=btn('Close Short','close-short','ghost');if(['issued','review'].includes(state.status))actions+=btn('Cancel','cancel-order','ghost',state.status==='review');if(['issued','partial','review'].includes(state.status))actions+=btn('Edit','edit',state.status==='review'?'ghost':'pri');if(state.status==='review')actions+=btn('Review Count','count','pri');}else if(state.step==='edit'){actions=btn('Cancel','discard','ghost')+btn('Review order','review','pri');}else{actions=btn('‹ Back to editing','back','ghost')+btn(proposed()?(state.editing?'Save changes':'Create PO'):'Submit','submit','pri');}return `<footer class="sheet-foot">${summaryFooter()}<div class="foot-actions">${actions}</div></footer>`;}
function render({keepScroll=false}={}){
 const oldBody=document.getElementById('sheet-body'),top=keepScroll&&oldBody?oldBody.scrollTop:0;
 document.getElementById('view-controls').innerHTML=[['detail','PO detail'],['create','PO create']].map(([key,label])=>`<button data-view="${key}" class="${state.view===key?'on':''}">${label}</button>`).join('');
 document.getElementById('version-controls').innerHTML=[['current','Sekarang'],['proposed','Usulan']].map(([key,label])=>`<button data-version="${key}" class="${state.version===key?'on':''}">${label}</button>`).join('');
 document.getElementById('row-controls').innerHTML=[3,12].map(count=>`<button data-count="${count}" class="${state.lines.length===count?'on':''}">${count} items</button>`).join('');
 const status=document.getElementById('status-control');status.hidden=state.view!=='detail';status.value=state.status==='short'?'finished':state.status;
 const currentDescription=state.view==='detail'?(proposed()?'Judul 20px · status konsisten · kolom sticky · total + aksi di footer':'Struktur OrderSheet saat ini: judul 18px · facts 2 kolom · tabel & total · footer aksi'):(proposed()?'Alur isi → review tetap · kolom sticky · total setelah diskon di footer · informasi tambahan dilipat':'Struktur OrderComposer saat ini: 4 field · items · diskon · notes · terms · review → Submit');
 const description=proposed()?({workspace:state.view==='detail'?'Ringkasan penerimaan → item / aktivitas / informasi · tabel lebar':'Item sebagai area kerja · pembayaran & total di kanan · panel sticky',document:'Alur vertikal seperti dokumen · metadata → item → diskon & total',split:state.view==='detail'?'Daftar item di kiri → pemeriksaan varian & penerimaan per item di kanan':'Informasi pesanan di kiri · kartu item dengan kuantitas & harga yang bisa diedit langsung'})[state.layout]:currentDescription;
 const layouts=document.getElementById('layout-controls');layouts.hidden=!proposed();layouts.innerHTML=LAYOUTS.map(([key,label])=>`<button data-layout="${key}" class="${state.layout===key?'on':''}" aria-pressed="${state.layout===key}">${label}</button>`).join('');
 document.getElementById('explain').innerHTML=`<b>${proposed()?'Usulan':'Sekarang'} · ${state.view==='detail'?'PO detail':state.step==='review'?'PO review':'PO create'}</b><span>${description}</span><div class="sp"></div><span>Desktop · data contoh · tidak menyimpan PO</span>`;
 const sheet=document.getElementById('sheet');sheet.className='sheet '+state.view+' '+(proposed()?'proposed layout-'+state.layout:'');
 const title=state.view==='detail'?state.orderNumber:state.editing?(state.step==='edit'?'Edit '+state.orderNumber:'Review the changes'):(state.step==='edit'?'New PO':'Review this order');
 const finished=['finished','cancelled','short'].includes(state.status),headerBadge=state.view==='detail'&&(!finished||proposed())?badge():'';
 sheet.innerHTML=`<header class="sheet-head"><div class="sheet-heading"><div class="title-row"><h2 id="sheet-title">${esc(title)}</h2>${headerBadge}${state.view==='create'&&proposed()?`<span class="step-mark">${state.step==='edit'?'<b>1 · Isi</b> → 2 · Review':'1 · Isi → <b>2 · Review</b>'}</span>`:''}</div>${state.view==='detail'?'<div class="caption">Created by Hari · 10 Oct 2026</div>':''}</div><div class="head-actions">${state.view==='detail'?btn(icon.print+'<span class="print-label">Print</span>','print','ghost'):''}<button class="btn ghost icon" data-action="close" aria-label="Close sheet">${icon.close}</button></div></header><div class="sheet-body" id="sheet-body" tabindex="0">${state.view==='detail'?detailBody():state.step==='review'?reviewBody():createBody()}</div>${footer()}`;
 document.getElementById('sheet-body').scrollTop=top;
}
function toast(message){clearTimeout(toastTimer);document.getElementById('toast-slot').innerHTML=`<div class="toast">${esc(message)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast-slot').innerHTML='',3200);}
function closeDialog(){document.getElementById('dialog-slot').innerHTML='';dialogKey=null;}
function confirmDialog(type){const cancel=type==='cancel-order',discard=type==='discard';document.getElementById('dialog-slot').innerHTML=`<div class="mini-veil"><section class="mini" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><header class="mini-head"><h3 id="confirm-title">${discard?'Discard this order?':cancel?'Cancel '+esc(state.orderNumber)+'?':'Close this short?'}</h3></header><div class="mini-body"><p class="note">${discard?'This only resets the example draft.':cancel?'The warehouse will stop receiving against this order. It stays on record as cancelled.':'The outstanding pieces will be closed short. This prototype changes example data only.'}</p>${!discard?'<label class="field">Reason (optional)<textarea class="control" id="reason" rows="2"></textarea></label>':''}</div><footer class="mini-foot">${btn(discard?'Keep editing':cancel?'Keep order':'Back','dialog-close','ghost')}<button class="btn danger" data-confirm="${type}">${discard?'Discard':cancel?'Cancel order':'Close Short'}</button></footer></section></div>`;document.querySelector('#dialog-slot button')?.focus();}
function lineDialog(id=null){if(frozen())return;dialogKey=id;const line=state.lines.find(line=>line.id===id)||{name:'Kaos Baru',division:'Dewasa',tag:'Kaos',quantity:100,price:25000,colours:'Hitam'};document.getElementById('dialog-slot').innerHTML=`<div class="mini-veil"><section class="mini" role="dialog" aria-modal="true" aria-labelledby="item-title"><header class="mini-head"><h3 id="item-title">${id?'Edit item':'Add item'}</h3>${btn(icon.close,'dialog-close','icon ghost')}</header><form id="item-form"><div class="mini-body"><p class="note">${esc(state.supplier)} · contoh form item untuk mencoba alur PO</p><label class="field">Item name<input class="control" name="name" required value="${esc(line.name)}"></label><div class="form-grid"><label class="field">Division<select class="control" name="division"><option ${line.division==='Dewasa'?'selected':''}>Dewasa</option><option ${line.division==='Anak'?'selected':''}>Anak</option></select></label><label class="field">Tag<input class="control" name="tag" required value="${esc(line.tag)}"></label><label class="field">Purchase price / pc<input class="control" name="price" type="number" min="1" required value="${line.price}"></label><label class="field">Quantity (pcs)<input class="control" name="quantity" type="number" min="1" max="999999" required value="${line.quantity}"></label></div></div><footer class="mini-foot">${btn('Cancel','dialog-close','ghost')}<button class="btn pri" type="submit">${proposed()?(id?'Save item':'Add to order'):'Submit'}</button></footer></form></section></div>`;document.querySelector('#item-form input')?.focus();}
function validate(){const errors={};if(!state.supplier)errors.supplier='Choose a supplier.';if(!state.arrival)errors.arrival='Choose the delivery date.';if(!state.method)errors.method='Choose the payment method.';if(!state.lines.length)errors.items='Add at least one item.';else if(state.lines.some(line=>!Number.isInteger(line.quantity)||line.quantity<1||!Number.isFinite(line.price)||line.price<=0))errors.items='Enter a whole quantity and a positive price for every item.';state.errors=errors;return Object.keys(errors).length===0;}
function reset(){Object.assign(state,{detailTab:'items',expanded:[],selectedItem:null,query:'',step:'edit',editing:false,status:'partial',orderNumber:'PO-101026-003',supplier:'Garmen Nusantara, PT',arrival:'2026-10-14',terms:'Net 30',method:'TRANSFER',discountPct:5,discountAmount:null,notes:'Call the warehouse before the truck leaves.',conditions:'Delivery Monday–Saturday, 08:00–16:00. Please include the PO number on the delivery note.',lines:sampleLines(state.count),errors:{},calendar:false});closeDialog();render();}
document.addEventListener('click',event=>{
 const layout=event.target.closest('[data-layout]');if(layout){state.layout=layout.dataset.layout;state.query='';render();return;}
 const tab=event.target.closest('[data-detail-tab]');if(tab){state.detailTab=tab.dataset.detailTab;state.query='';render({keepScroll:true});return;}
 const variants=event.target.closest('[data-variants]');if(variants){const id=Number(variants.dataset.variants);state.expanded=state.expanded.includes(id)?state.expanded.filter(key=>key!==id):[...state.expanded,id];render({keepScroll:true});return;}
 const selected=event.target.closest('[data-select-item]');if(selected){state.selectedItem=Number(selected.dataset.selectItem);document.getElementById('inspector-slot').innerHTML=inspector();document.getElementById('selector-slot').innerHTML=itemSelector();return;}
 const view=event.target.closest('[data-view]');if(view){state.view=view.dataset.view;state.query='';state.detailTab='items';if(state.view==='create')state.status='issued';state.step='edit';state.editing=false;state.errors={};render();return;}
 const version=event.target.closest('[data-version]');if(version){state.version=version.dataset.version;render({keepScroll:true});return;}
 const count=event.target.closest('[data-count]');if(count){state.count=Number(count.dataset.count);state.lines=sampleLines(state.count);state.selectedItem=null;state.expanded=[];state.query='';render();return;}
 const date=event.target.closest('[data-date]');if(date){state.arrival=date.dataset.date;state.calendar=false;delete state.errors.arrival;render({keepScroll:true});return;}
 const remove=event.target.closest('[data-remove]');if(remove&&!frozen()){state.lines=state.lines.filter(line=>line.id!==Number(remove.dataset.remove));render({keepScroll:true});return;}
 const edit=event.target.closest('[data-edit]');if(edit){lineDialog(Number(edit.dataset.edit));return;}
 const confirmation=event.target.closest('[data-confirm]');if(confirmation){if(confirmation.dataset.confirm==='discard'){state.lines=[];state.notes='';state.view='create';state.step='edit';state.editing=false;}else state.status=confirmation.dataset.confirm==='cancel-order'?'cancelled':'short';closeDialog();render();return;}
 const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;
 if(action==='scroll'){document.getElementById('sheet-body').scrollTo({top:540,behavior:'smooth'});return;}
 if(action==='reset'){reset();return;}if(action==='blank'){Object.assign(state,{view:'create',step:'edit',editing:false,status:'issued',supplier:'',arrival:'',terms:'',method:'',lines:[],notes:'',discountPct:0,discountAmount:null,errors:{},calendar:false});render();return;}if(action==='calendar'){state.calendar=!state.calendar;render({keepScroll:true});return;}if(action==='close-calendar'){state.calendar=false;render({keepScroll:true});return;}
 if(action==='add'){lineDialog();return;}if(action==='dialog-close'){closeDialog();return;}
 if(action==='print'){toast('Prototype: Print menu / PDF preview.');return;}if(action==='count'){toast('Prototype: membuka Review Count; pemeriksaan gudang tetap langkah terpisah.');return;}
 if(action==='close'){if(state.view==='create')confirmDialog('discard');else toast('Prototype: kembali ke daftar PO.');return;}
 if(action==='discard'||action==='cancel-order'||action==='close-short'){confirmDialog(action);return;}
 if(action==='edit'){state.view='create';state.editing=true;state.step='edit';render();return;}
 if(action==='review'){if(validate()){state.step='review';render();}else{render();const first=document.querySelector('.problem');first?.scrollIntoView({block:'center'});document.querySelector('.control.error')?.focus();}return;}
 if(action==='back'){state.step='edit';render();return;}
 if(action==='submit'){state.orderNumber=state.editing?state.orderNumber:'PO-DEMO-001';state.view='detail';if(!state.editing)state.status='issued';state.editing=false;state.step='edit';render();toast('PO contoh '+state.orderNumber+' · tidak disimpan ke server.');}
});
function updateDraftInput(target){
 const key=target.dataset.field;if(!key)return;
 if(key==='discountPct'){state.discountPct=Math.max(0,Math.min(100,Number(target.value)||0));state.discountAmount=null;const amount=document.getElementById('discount-amount');if(amount)amount.value=totals().discount||'';}
 else if(key==='discountAmount'){state.discountAmount=Math.max(0,Number(target.value)||0);const percent=document.getElementById('discount-percent');if(percent)percent.value=Math.round(totals().discount/(totals().gross||1)*10000)/100;}
 else state[key]=target.value;
 repaintTotals();
 const summary=document.querySelector('#extra-fields summary small');if(summary)summary.textContent=(state.notes.trim()?'Notes filled · ':'')+(state.conditions.trim()?'Default terms filled':'Optional');
 delete state.errors[key];
}
document.addEventListener('input',event=>{
 const target=event.target;
 if(target.hasAttribute('data-item-search')){state.query=target.value;const slot=document.getElementById(state.layout==='split'?'selector-slot':'items-slot');if(slot)slot.innerHTML=state.layout==='split'?itemSelector():itemsTable({detail:true});return;}
 if(target.dataset.inline){if(frozen())return;const line=state.lines.find(line=>line.id===Number(target.dataset.inline));if(!line)return;line[target.dataset.prop]=Number(target.value)||0;const valid=line.quantity>=1&&Number.isInteger(line.quantity)&&line.price>0;target.classList.toggle('error',!valid);target.setAttribute('aria-invalid',String(!valid));repaintTotals();const amount=document.getElementById('discount-amount');if(amount&&state.discountAmount===null)amount.value=totals().discount;const percent=document.getElementById('discount-percent');if(percent&&state.discountAmount!==null)percent.value=Math.round(totals().discount/(totals().gross||1)*10000)/100;return;}
 if(['discountPct','discountAmount','notes','conditions'].includes(event.target.dataset.field))updateDraftInput(event.target);});
document.addEventListener('change',event=>{
 if(event.target.id==='status-control'){state.status=event.target.value;render();return;}
 const key=event.target.dataset.field;if(!key)return;
 updateDraftInput(event.target);
 if(!['discountPct','discountAmount','notes','conditions'].includes(key))render({keepScroll:true});
});
document.addEventListener('submit',event=>{if(event.target.id!=='item-form')return;event.preventDefault();const data=new FormData(event.target),line={id:dialogKey||++lineKey,name:String(data.get('name')).trim(),division:String(data.get('division')),tag:String(data.get('tag')).trim(),quantity:Number(data.get('quantity')),price:Number(data.get('price')),colours:'Hitam',size:'M, L'};if(!line.name||!line.tag||!Number.isInteger(line.quantity)||line.quantity<1||line.price<=0)return;if(dialogKey)state.lines=state.lines.map(old=>old.id===dialogKey?line:old);else state.lines.push(line);closeDialog();delete state.errors.items;render({keepScroll:true});});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('dialog-slot').innerHTML)closeDialog();else if(state.calendar){state.calendar=false;render({keepScroll:true});}}});
const params=new URLSearchParams(location.search);if(['detail','create'].includes(params.get('view')))state.view=params.get('view');if(['current','proposed'].includes(params.get('version')))state.version=params.get('version');if(LAYOUTS.some(([key])=>key===params.get('layout')))state.layout=params.get('layout');if(params.get('items')==='12'){state.count=12;state.lines=sampleLines(12);}render();
</script>
</body>
</html>
