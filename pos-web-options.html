<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POS web options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   POS web (pos-desktop/ui, web edition): Today + five options A–E.
   Today is drawn from pos-desktop/ui/src/till.tsx + pos.css as of 12 Oct.
   A–E use the hub tokens (frontend-hub/src/styles/index.css): Inter, 15px
   body, 14px floor, soft-3 page, white cards r12, hairlines, one blue CTA.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --ink:#20242c; --text:#394150; --body:#565f6d; --mute:#666f7d; --faint:#b9c0c9; --line-ico:#89919d;
  --canvas:#fff; --soft:#f8f8f9; --soft-2:#f0f0f2; --soft-3:#f6f6f7;
  --hairline:#e6e6e9; --hairline-2:#dadade; --hairline-strong:#c6c6cc;
  --rail:#242526; --rail-2:#303234; --rail-3:#393b3d; --rail-text:#c3c4c7; --rail-mute:#a1a3a8;
  --accent:#2563eb; --accent-bg:#eff5ff; --cta-hover:#1d4ed8;
  --ok:#36b827; --ok-fg:#137a37; --ok-bg:#e6f6e2; --warn-fg:#a64a08; --warn-bg:#faeacd; --bad:#d05151; --bad-fg:#be123c; --bad-bg:#fbeaea;
  --shadow-soft:0 1px 3px rgb(24 39 60 / 4%);
  --shadow-pop:0 4px 8px rgb(24 39 60 / 4%),0 12px 32px rgb(24 39 60 / 8%);
  --shadow-float:0 8px 16px rgb(24 39 60 / 6%),0 24px 64px rgb(24 39 60 / 16%);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --font:"Inter","Inter Variable",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--soft-3);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
input{outline:0}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fat{stroke-width:3}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:14px;letter-spacing:0}
.sp{flex:1}

/* ── prototype chrome (not part of the POS) ── */
.proto{height:48px;background:#141518;color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px 0 18px;position:relative;z-index:70}
.proto .t{font-weight:600;font-size:15px;white-space:nowrap}
.seg{display:flex;gap:2px;background:#24262b;border-radius:9px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg button{height:30px;padding:0 11px;border-radius:7px;font-size:14px;color:#b9bcc3;white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.seg button b{font-weight:600;color:#fff;margin-right:5px}
.seg button.on{background:#fff;color:var(--ink)}
#optseg{flex:0 1 auto;min-width:0}
#fseg,#pseg,#stateseg,.pbtn{flex:none}
.seg button.on b{color:var(--ink)}
.pbtn{height:30px;padding:0 12px;border-radius:7px;border:1px solid #3a3d44;color:#e7e8ea;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.pbtn .i{width:17px;height:17px}
#stage{height:calc(100% - 48px);position:relative}
#toast{position:fixed;left:50%;bottom:28px;z-index:95;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:#191b20;color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;box-shadow:var(--shadow-pop);transition:opacity .2s ease,transform .2s var(--ease-out)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ════════════════════════════ options A–E: shared ════════════════════════════ */
.op{height:100%;display:flex;flex-direction:column;background:var(--soft-3);color:var(--ink)}
.hdr{height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px 0 20px;background:var(--canvas);border-bottom:1px solid var(--hairline)}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.meta{font-size:14px;color:var(--mute);white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--mute);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.who{display:inline-flex;align-items:center;gap:9px;font-size:15px;color:var(--text);white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;background:var(--soft-2);color:var(--body);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none}
.vr{width:1px;height:24px;background:var(--hairline);flex:none}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--hairline-2);background:var(--canvas);font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.btn .i{width:18px;height:18px;color:var(--line-ico)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri .i{color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--text)}
.btn.bad{color:var(--bad-fg)}
.btn.danger{background:var(--bad-fg);border-color:var(--bad-fg);color:#fff}
.btn.lg{height:48px;padding:0 18px}
.btn.xl{height:56px;padding:0 20px;font-size:16px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled),.ib:active,.tl-btn:active:not(:disabled),.chip:active,.np button:active,.pre button:active,.mseg button:active,.mgrid button:active,.mlist button:active,.r-it:active,.key:active,.link:active{transform:scale(.97)}
kbd{font-family:var(--font);font-size:14px;font-weight:500;color:inherit;opacity:.6}
.btn.pri kbd{opacity:.75}
.ib{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:8px;color:var(--line-ico);flex:none;transition:background-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.ib.sm{width:32px;height:32px}
.ib.sm .i{width:17px;height:17px}
.link{font-size:15px;font-weight:500;color:var(--accent);padding:6px 8px;margin-right:-8px;border-radius:6px}

.tl-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;transition:background-color .15s ease,transform .16s var(--ease-out)}
.tl-btn .i{width:19px;height:19px;color:var(--line-ico)}
.tl-btn:disabled{opacity:.4}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;line-height:1}

.scan{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px 0 16px;background:var(--canvas);border:1px solid var(--hairline-2);border-radius:12px;box-shadow:var(--shadow-soft);transition:border-color .15s ease,box-shadow .15s ease}
.scan:focus-within{border-color:#93b4f5;box-shadow:0 0 0 4px rgb(37 99 235 / 8%)}
.scan>.i{color:var(--line-ico)}
.scan input{flex:1;min-width:0;height:100%;border:0;background:none;font-size:16px;color:var(--ink)}
.scan input::placeholder{color:var(--mute)}

.lines{flex:1;min-height:0;overflow-y:auto}
.ln{display:grid;grid-template-columns:44px minmax(0,1fr) auto 40px;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--hairline)}
.ln.new{background:var(--accent-bg)}
@keyframes flash{from{background:var(--accent-bg)}to{background:transparent}}
.sw{width:44px;height:52px;border-radius:8px;background:var(--soft-2);display:grid;place-items:center;flex:none}
.sw svg{width:32px;height:32px}
.sw.sm{width:34px;height:40px;border-radius:7px}
.sw.sm svg{width:26px;height:26px}
.tx{min-width:0}
.nm{font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:14px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:15px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rm{color:var(--faint)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mute);font-size:15px;padding:40px 20px}
.empty .i{width:32px;height:32px;color:var(--faint);stroke-width:1.5}

.tots{display:flex;flex-direction:column}
.tl{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:30px;font-size:15px;color:var(--body)}
.tl .v{font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
.tl.cut .v{color:var(--ok-fg)}
.tl.warn .v{color:var(--warn-fg)}
.tl .i{width:17px;height:17px;color:var(--ok-fg);vertical-align:-3px;margin-right:6px}
.gt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px;margin-top:8px;border-top:1px solid var(--hairline)}
.gt span{font-size:15px;font-weight:600}
.gt strong{font-size:32px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.paybtn{justify-content:space-between}
.paybtn span{display:inline-flex;align-items:center;gap:12px}

.addrow{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--hairline);font-size:15px;color:var(--text)}
.addrow>.i{color:var(--line-ico)}
.addrow .k{white-space:nowrap}
.addrow .v{margin-left:auto;color:var(--ink);font-weight:500;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow .v small{font-size:14px;font-weight:400;color:var(--mute);margin-left:6px}
.addrow .link{margin-left:auto}
.stp{margin-left:auto;display:inline-flex;align-items:center;gap:4px}
.stp b{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stp .ib{width:36px;height:36px;border:1px solid var(--hairline-2)}

/* payment pieces */
.pb{display:flex;flex-direction:column;gap:16px}
.lbl{font-size:14px;font-weight:500;color:var(--mute);margin-bottom:8px}
.due{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.mseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--soft-2);border-radius:10px}
.mseg button{height:44px;border-radius:8px;font-size:15px;font-weight:500;color:var(--body);display:flex;align-items:center;justify-content:center;gap:6px;transition:background-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.mseg button .i{width:18px;height:18px}
.mseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(24 39 60 / 10%),0 0 0 1px rgb(24 39 60 / 4%)}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mgrid button{min-height:52px;padding:6px 8px;border:1px solid var(--hairline-2);border-radius:10px;background:#fff;font-size:14px;font-weight:500;color:var(--text);line-height:1.25;transition:background-color .15s ease,border-color .15s ease,transform .16s var(--ease-out)}
.mgrid button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.mlist{display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:12px;overflow:hidden}
.mlist button{display:flex;align-items:center;gap:12px;height:50px;padding:0 16px;font-size:15px;color:var(--text);border-bottom:1px solid var(--hairline);text-align:left;transition:background-color .15s ease}
.mlist button:last-child{border-bottom:0}
.mlist button .i{color:var(--line-ico)}
.mlist button .ck{margin-left:auto;color:var(--accent);opacity:0}
.mlist button.on{background:var(--accent-bg);color:var(--ink);font-weight:500}
.mlist button.on .i{color:var(--accent)}
.mlist button.on .ck{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border:1px solid var(--hairline-2);border-radius:8px;font-size:15px;font-weight:500;background:#fff;color:var(--text);transition:background-color .15s ease,border-color .15s ease,transform .16s var(--ease-out)}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.chip .i{width:16px;height:16px}
.amt{display:flex;align-items:center;gap:10px;height:64px;padding:0 18px;border:1px solid var(--hairline-2);border-radius:12px;background:#fff;transition:border-color .15s ease,box-shadow .15s ease}
.amt:focus-within{border-color:#93b4f5;box-shadow:0 0 0 4px rgb(37 99 235 / 8%)}
.amt span{font-size:18px;color:var(--mute)}
.amt input{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amt input::placeholder{color:var(--faint)}
.pre{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pre button{height:44px;border:1px solid var(--hairline-2);border-radius:8px;font-size:15px;font-variant-numeric:tabular-nums;background:#fff;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease,transform .16s var(--ease-out)}
.pre button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.np button{height:48px;border-radius:10px;background:var(--soft);border:1px solid var(--hairline);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;transition:background-color .1s ease,transform .1s var(--ease-out)}
.np button .i{width:22px;height:22px;margin:auto}
.fld label{display:block;font-size:15px;font-weight:500;color:var(--text);margin-bottom:8px}
.fld input{width:100%;height:48px;padding:0 14px;border:1px solid var(--hairline-2);border-radius:10px;font-size:16px;background:#fff;transition:border-color .15s ease,box-shadow .15s ease}
.fld input:focus{border-color:#93b4f5;box-shadow:0 0 0 4px rgb(37 99 235 / 8%)}
.fld input::placeholder{color:var(--faint)}
.inl{display:flex;gap:8px}
.inl input{flex:1}
.chg{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-radius:10px;background:var(--ok-bg);font-size:15px;color:var(--ok-fg)}
.chg strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.paid{display:flex;flex-direction:column;padding:4px 14px;border-radius:10px;background:var(--soft)}

/* sheet + scrim */
.scrim{position:fixed;inset:48px 0 0;z-index:40;background:rgb(32 36 44 / 22%)}
.scrim.enter{animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.sheet-pos{position:fixed;inset:48px 0 0;z-index:45;display:grid;place-items:center;padding:24px;pointer-events:none}
.sheet{pointer-events:auto;width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:var(--shadow-float);overflow:hidden}
.sheet.enter{animation:pop .2s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.sh-h{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 24px}
.sh-h h2{margin:0;font-size:18px;font-weight:600;flex:1;letter-spacing:-.01em}
.sh-b{padding:4px 24px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.sh-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--hairline)}
.hrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--hairline)}
.hrow:last-child{border-bottom:0}
.hrow .grow{flex:1;min-width:0}
.appr{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--soft);font-size:15px;color:var(--text)}
.appr .i{width:26px;height:26px;color:var(--accent);stroke-width:1.5}
.mgrid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid6 button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:88px;border:1px solid var(--hairline);border-radius:12px;font-size:15px;color:var(--text);transition:background-color .15s ease,transform .16s var(--ease-out)}
.mgrid6 button:active{transform:scale(.97)}
.mgrid6 .i{width:22px;height:22px;color:var(--line-ico)}

/* done */
.done{margin:auto;width:min(460px,100%);padding:36px 32px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.done.enter{animation:pop .24s var(--ease-out)}
.seal{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok-fg);display:grid;place-items:center;margin-bottom:10px}
.seal .i{width:26px;height:26px;stroke-width:2.2}
.done .big{font-size:44px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.done .lbl{margin:0;font-size:15px}
.done .row{display:flex;gap:10px;width:100%;margin-top:22px}
.done .row .btn{flex:1}

/* ── A · Receipt ── */
.A .a-main{flex:1;min-height:0;display:flex;justify-content:center;padding:20px 24px 24px}
.A .a-col{width:100%;max-width:760px;display:flex;flex-direction:column;gap:10px;min-height:0}
.A .a-tools{display:flex;align-items:center;gap:2px;margin:0 -6px}
.A .a-rcpt{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.A .a-rcpt .ln:last-child{border-bottom:0}
.A .a-foot{flex:none;padding:0 20px 20px;border-top:1px solid var(--hairline)}
.A .a-foot .tots{padding-top:10px}
.A .a-foot .paybtn{margin-top:16px}
.a-drawer{position:fixed;left:50%;bottom:0;z-index:50;width:min(760px,calc(100% - 32px));transform:translateX(-50%);background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgb(24 39 60 / 14%);max-height:calc(100% - 100px);display:flex;flex-direction:column}
.a-drawer.enter{animation:up .34s var(--ease-drawer)}
@keyframes up{from{transform:translate(-50%,100%)}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--hairline-2);margin:10px auto 0;flex:none}
.dr-h{display:flex;align-items:center;gap:12px;padding:10px 20px 10px 14px;flex:none}
.dr-h .lbl{margin:0}
.a-drawer .pb{padding:8px 28px 28px;overflow-y:auto}

/* ── B · Register ── */
.B .b-scan{flex:1;max-width:560px;margin-left:20px}
.B .b-scan .scan{height:44px;border-radius:10px;box-shadow:none;background:var(--soft)}
.B .b-scan .scan:focus-within{background:#fff}
.B .b-main{flex:1;min-height:0;display:flex;gap:16px;padding:16px 20px 20px}
.B .b-bask{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;transition:opacity .25s ease}
.B .b-bask.dim{opacity:.5}
.B .b-bar{display:flex;align-items:center;gap:6px;height:60px;flex:none;padding:0 10px 0 20px;border-bottom:1px solid var(--hairline)}
.B .b-bar h2{margin:0 4px 0 0;font-size:16px;font-weight:600}
.B .b-th,.B .bln{display:grid;grid-template-columns:minmax(0,1fr) 150px 130px 40px;align-items:center;gap:16px;padding:0 12px 0 20px}
.B .b-th{height:40px;flex:none;background:var(--soft);border-bottom:1px solid var(--hairline);font-size:14px;color:var(--mute);font-weight:500}
.B .b-th .r{text-align:right}
.B .bln{min-height:72px;border-bottom:1px solid var(--hairline)}
.B .bln.new{background:var(--accent-bg)}
.B .bln .it{display:flex;align-items:center;gap:14px;min-width:0}
.B .bln .mono{color:var(--body)}
.B .b-panel{width:420px;flex:none;display:flex;flex-direction:column;overflow:hidden}
.B .b-panel.swap>*{animation:swap .22s var(--ease-out)}
@keyframes swap{from{opacity:0;filter:blur(3px)}}
.B .b-sec{padding:4px 20px 0}
.B .b-sec .addrow:last-child{border-bottom:0}
.B .b-tot{padding:10px 20px 0;border-top:1px solid var(--hairline)}
.B .b-act{display:flex;gap:10px;padding:16px 20px 20px}
.B .b-act .paybtn{flex:1}

@media (hover:hover) and (pointer:fine){.F .qk button:hover{border-color:var(--hairline-strong)}.F .kp4 button:hover{background:var(--soft-2)}.F .kp4 .pk:hover:not(.on){background:var(--soft)}}

.F .led{flex:1;min-width:0}

.F .paydlg .led .gt{display:block;margin-top:10px;padding-top:14px}

.D .d-sugg.on{display:block;animation:pop .14s var(--ease-out);transform-origin:top center}
.D .sg{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 12px;border-radius:8px;text-align:left;font-size:15px;color:var(--ink)}

.D .d-main{flex:1;min-height:0;margin:14px 24px 0;display:flex;flex-direction:column;overflow:hidden}
.D .d-th,.D .dln{display:grid;grid-template-columns:36px minmax(0,1fr) 130px 90px 150px 130px 40px;align-items:center;gap:14px;padding:0 10px 0 18px}

/* ── E · Steps ── */
.E .hdr{display:grid;grid-template-columns:1fr auto 1fr}

.E .e-sec{padding:20px 0;border-bottom:1px solid var(--hairline)}

/* ════════════════════════════ Today (pos-desktop/ui as is) ════════════════════════════ */
.td{--line:#e5e9ef;--line-soft:#eef1f6;--blue:#2563eb;--blue-dark:#1d4ed8;--pale:#eff5ff;--green:#327858;--amber:#885610;--red:#ac4949;--muted:#687280;--shadow:0 1px 3px #18273c05;--shadow-lg:0 20px 80px #20304a20;
  height:100%;display:flex;flex-direction:column;overflow:hidden;background:#f7f8fa;color:#20242c;font-size:14px;line-height:1.5;letter-spacing:0}
.td svg.i{width:20px;height:20px}

.td .brand-mark{width:32px;height:32px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:9px;font-size:14px;letter-spacing:-1px;font-weight:700}
.td .top-right{display:flex;align-items:center;gap:16px;margin-left:auto}

@media (hover:hover) and (pointer:fine){
  .pbtn:hover{background:#24262b}
  .btn:hover:not(:disabled){background:var(--soft)}
  .btn.pri:hover:not(:disabled){background:var(--cta-hover);border-color:var(--cta-hover)}
  .btn.ghost:hover:not(:disabled){background:var(--soft-2)}
  .ib:hover{background:var(--soft-2);color:var(--ink)}
  .link:hover{background:var(--accent-bg)}
  .tl-btn:hover:not(:disabled){background:var(--canvas)}
  .rm:hover{color:var(--bad-fg);background:var(--bad-bg)}
  .pre button:not(.on):hover{background:var(--soft)}
  .btn.danger:hover:not(:disabled){background:#9f1239;border-color:#9f1239}
  .np button:hover{background:var(--soft-2)}
  .mgrid6 button:hover{background:var(--soft)}
  .B .b-bar .tl-btn:hover:not(:disabled){background:var(--soft-2)}
  .C .r-it:hover{background:var(--rail-2);color:#fff}
  .C .c-bfoot .tl-btn:hover:not(:disabled){background:var(--soft-2)}
  .D .key:hover{background:var(--canvas)}
}
/* Exits: faster than the way in, ease-out, only when a pointer closed it. */
.sheet.leave,.pop.leave{opacity:0;transform:scale(.97);transition:opacity .13s var(--ease-out),transform .13s var(--ease-out)}
.scrim.leave{opacity:0;transition:opacity .13s var(--ease-out)}
@media (max-width:899px){
  .FT .f-money.open.leave{transform:translateY(100%);transition:transform .2s var(--ease-out)}
  .FT .f-dim.leave{opacity:0;transition:opacity .2s var(--ease-out)}
}
/* Reduced motion: keep the fades that explain a change, drop every movement. */
@media (prefers-reduced-motion:reduce){
  .sheet.enter,.pop.enter,.f-menu.enter,.done.enter,.D .d-sugg.on,.E .e-center.enter,.E .e-left.enter{animation:fade .15s ease-out}
  .a-drawer.enter,.c-drawer.enter,.FT .f-money.open.up{animation:fade .2s ease-out}
  .sheet.leave,.pop.leave{transform:none}
  .FT .f-money.open.leave{transform:none;opacity:0;transition:opacity .15s ease-out}
  *:active{transform:none!important}
  #toast{transform:translate(-50%,0)}
}
@media (max-width:1180px){
  .B .b-panel{width:380px}
  .D .d-th,.D .dln{grid-template-columns:30px minmax(0,1fr) 100px 70px 0 120px 40px}
  .D .d-th>:nth-child(5),.D .dln>:nth-child(5){display:none}
  .E .st span{display:none}
  .C .c-sum,.E .e-right{width:340px}
}
/* ═══════ Lark looks for F · Flipped (12 Oct, Hari: "lark version … tetap ikut
   Flipped, Labels") — the hub's Lark taste on the till: soft frame, rounded
   sheets, pill controls, colour tiles that name things (member, coupon, bags,
   each payment method), big friendly figures. Same layout and keys as F.
   L1 Soft · L2 Cards · L3 Fresh; switch in the bar, `#F.l2`. ═══════ */
body[data-look^="l"] { --lk-frame: #f2f3f5; --lk-fill: #f2f3f5; --lk-fill-h: #ebecef;
  --t-blue: #2457d6; --b-blue: #e8efff; --t-green: #1f8a3c; --b-green: #e3f4e6; --t-orange: #c2610c; --b-orange: #fdeedd;
  --t-purple: #6d3ad6; --b-purple: #efe9fd; --t-teal: #0f7f75; --b-teal: #ddf3f1; --t-red: #c4281c; --b-red: #fdecea; }
/* header toolbar: pills */
body[data-look^="l"] .FT .hdr { background: transparent; border-bottom: 0; }
body[data-look^="l"] .FT .tb { border-radius: 999px; padding: 0 14px; }
body[data-look^="l"] .FT .tb.bad { background: var(--b-red); color: var(--t-red); }
body[data-look^="l"] .FT .tb.bad .i { color: var(--t-red); }
body[data-look^="l"] .FT .me { background: var(--canvas); box-shadow: 0 0 0 1px rgb(16 24 40 / 6%); }
body[data-look^="l"] .FT .me .av { background: var(--b-blue); color: var(--t-blue); }
/* scan: a soft filled pill */
body[data-look^="l"] .FT .scan { height: 56px; border-radius: 999px; border-color: transparent; background: var(--lk-fill); box-shadow: none; padding: 0 8px 0 20px; }
body[data-look^="l"] .FT .scan:focus-within { background: var(--canvas); border-color: #93b4f5; box-shadow: 0 0 0 4px rgb(37 99 235 / 10%); }
body[data-look^="l"] .FT .scan .ib { border-radius: 999px; }
/* the newest line: a soft blue band, no bar */
body[data-look^="l"] .FT .fln.last { background: #f1f5ff; }
body[data-look^="l"] .FT .fln.last::before { display: none; }
/* member / coupon / bags: a colour tile names each row */
body[data-look^="l"] .FT .f-rows .addrow > .i:first-child { box-sizing: content-box; width: 20px; height: 20px; padding: 9px; border-radius: 11px; flex: none; }
body[data-look^="l"] .FT .f-rows > .addrow:nth-child(1) > .i:first-child { background: var(--b-blue); color: var(--t-blue); }
body[data-look^="l"] .FT .f-rows > .addrow:nth-child(2) > .i:first-child { background: var(--b-orange); color: var(--t-orange); }
body[data-look^="l"] .FT .f-rows > .bag-head > .i:first-child { background: var(--b-green); color: var(--t-green); }
body[data-look^="l"] .FT .addrow { min-height: 64px; gap: 14px; font-size: 16px; }
body[data-look^="l"] .FT .addrow .link { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--b-blue); color: var(--t-blue); font-weight: 500; display: inline-flex; align-items: center; }
body[data-look^="l"] .FT .bgr .bico2 { background: var(--b-green); color: var(--t-green); border-radius: 12px; }
body[data-look^="l"] .FT .bpk { border-radius: 14px; }
/* totals and Pay */
body[data-look^="l"] .FT .gt strong { font-size: 36px; }
body[data-look^="l"] .FT .paybtn { height: 60px; border-radius: 999px; padding: 0 24px; font-size: 17px; box-shadow: 0 8px 20px -8px rgb(37 99 235 / 55%); }
body[data-look^="l"] .FT .badge { border-radius: 999px; }
/* pay dialog */
body[data-look^="l"] .F .paydlg { border-radius: 24px; }
body[data-look^="l"] .F .dl-l { background: linear-gradient(160deg, #f3f6ff 0%, #f7f3ff 100%); border-left: 0; }
body[data-look^="l"] .F .dl-m { background: var(--lk-fill); border-radius: 16px; padding: 5px; gap: 5px; }
body[data-look^="l"] .F .dl-m button { height: 52px; border-radius: 12px; gap: 8px; color: var(--body); }
body[data-look^="l"] .F .dl-m button .i { width: 18px; height: 18px; }
body[data-look^="l"] .F .dl-m button[data-v="CASH"] .i { color: var(--t-green); }
body[data-look^="l"] .F .dl-m button[data-v="DEBIT"] .i { color: var(--t-blue); }
body[data-look^="l"] .F .dl-m button[data-v="CREDIT"] .i { color: var(--t-purple); }
body[data-look^="l"] .F .dl-m button[data-v="QRIS"] .i { color: var(--t-teal); }
body[data-look^="l"] .F .dl-m button[data-v="VOUCHER"] .i { color: var(--t-orange); }
body[data-look^="l"] .F .dl-m button.on[data-v="CASH"] { background: var(--b-green); color: var(--t-green); box-shadow: none; }
body[data-look^="l"] .F .dl-m button.on[data-v="DEBIT"] { background: var(--b-blue); color: var(--t-blue); box-shadow: none; }
body[data-look^="l"] .F .dl-m button.on[data-v="CREDIT"] { background: var(--b-purple); color: var(--t-purple); box-shadow: none; }
body[data-look^="l"] .F .dl-m button.on[data-v="QRIS"] { background: var(--b-teal); color: var(--t-teal); box-shadow: none; }
body[data-look^="l"] .F .dl-m button.on[data-v="VOUCHER"] { background: var(--b-orange); color: var(--t-orange); box-shadow: none; }
body[data-look^="l"] .F .paydlg .amt { border-color: transparent; background: var(--lk-fill); border-radius: 16px; }
body[data-look^="l"] .F .paydlg .amt:focus-within { background: var(--canvas); border-color: #93b4f5; }
body[data-look^="l"] .F .paydlg .pre button, body[data-look^="l"] .F .paydlg .chip { border-radius: 999px; border-color: transparent; background: var(--lk-fill); }
body[data-look^="l"] .F .paydlg .pre button.on, body[data-look^="l"] .F .paydlg .chip.on { background: var(--b-blue); color: var(--t-blue); }
body[data-look^="l"] .F .paydlg .dl-in { border-color: transparent; background: var(--lk-fill); border-radius: 12px; }
body[data-look^="l"] .F .paydlg .np button { border: 0; background: var(--lk-fill); border-radius: 14px; }
@media (hover: hover) and (pointer: fine) {
  body[data-look^="l"] .FT .tb:not(.bad):hover { background: rgb(16 24 40 / 5%); }
  body[data-look^="l"] .F .paydlg .np button:hover, body[data-look^="l"] .F .paydlg .pre button:not(.on):hover { background: var(--lk-fill-h); }
  body[data-look^="l"] .FT .addrow .link:hover { background: #dbe6ff; }
}
body[data-look^="l"] .F .paydlg .led .tl.pd .i { color: var(--t-green); }

/* ── L1 Soft: the hub's frame — grey, with the two columns as white sheets ── */
body[data-look="l1"] .FT { background: var(--lk-frame); }
body[data-look="l1"] .FT .card { border: 0; border-radius: 20px; box-shadow: 0 0 0 1px rgb(16 24 40 / 4%), 0 1px 3px rgb(16 24 40 / 4%); }
body[data-look="l1"] .FT .f-main { padding: 4px 20px 20px; }
body[data-look="l1"] .FT .f-scan { padding: 16px 16px 10px; }
body[data-look="l1"] .FT .f-tot { border-top: 0; background: linear-gradient(160deg, #f6f8ff 0%, #f8f6ff 100%); margin: 0 12px 12px; padding: 12px 18px 18px; border-radius: 16px; }

/* ── L2 Cards: the most colour — every line, every row, the total: a card ── */
body[data-look="l2"] .FT { background: var(--lk-frame); }
body[data-look="l2"] .FT .f-main { padding: 4px 20px 20px; gap: 20px; }
body[data-look="l2"] .FT .f-bask, body[data-look="l2"] .FT .f-money:not(.done-host) { background: transparent; border: 0; box-shadow: none; border-radius: 0; overflow: visible; }
body[data-look="l2"] .FT .f-scan { padding: 0 0 12px; border-bottom: 0; }
body[data-look="l2"] .FT .f-money .done { background: var(--canvas); border-radius: 20px; box-shadow: 0 0 0 1px rgb(16 24 40 / 5%), 0 1px 3px rgb(16 24 40 / 4%); height: 100%; }
body[data-look="l2"] .FT .f-bask .scan { background: var(--canvas); box-shadow: 0 0 0 1px rgb(16 24 40 / 5%), 0 1px 3px rgb(16 24 40 / 4%); }
body[data-look="l2"] .FT .lines { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 2px 2px 8px; }
body[data-look="l2"] .FT .fln { border: 0; border-radius: 16px; background: var(--canvas); box-shadow: 0 0 0 1px rgb(16 24 40 / 5%), 0 1px 2px rgb(16 24 40 / 4%); min-height: 72px; }
body[data-look="l2"] .FT .fln.last { background: var(--canvas); box-shadow: 0 0 0 2px #9db8f7, 0 4px 12px -4px rgb(37 99 235 / 25%); }
body[data-look="l2"] .FT .fln .sw { border-radius: 12px; }
body[data-look="l2"] .FT .f-scroll { overflow: visible; flex: 1; min-height: 0; overflow-y: auto; }
body[data-look="l2"] .FT .f-rows { padding: 0 2px; display: flex; flex-direction: column; gap: 10px; }

function payBody(style,c,{cta=true,numpad=false,paidList=true,compact=false}={}){
  const m=METH[S.method], entered=S.typed?+S.typed:0;
  const offer=entered||c.out, change=m.k==='CASH'&&offer>c.out?offer-c.out:0;
  let h=`<div class="pb">`;
  if(paidList&&S.paid.length)h+=`<div class="paid">${S.paid.map(p=>`<div class="tl"><span>${ic('check')}${p.l}</span><span class="v">${rp(p.amt)}</span></div>`).join('')}</div>`;
  h+=methodsHTML(style);
  if(m.bank)h+=`<div><div class="lbl">Bank</div><div class="chips">${BANKS.map(b=>`<button class="chip${S.bank===b?' on':''}" data-a="bank" data-v="${b}">${b}</button>`).join('')}</div></div>`;
  if(m.ref)h+=`<div class="fld"><label>${m.ref}</label><input data-in="ref" value="${esc(S.ref)}" autocomplete="off"></div>`;
  h+=`<div><div class="lbl">${m.k==='CASH'?'Received':'Amount'}</div><label class="amt"><span>Rp</span><input data-in="amount" inputmode="numeric" value="${entered?entered.toLocaleString('id-ID'):''}" placeholder="${c.out.toLocaleString('id-ID')}" aria-label="Amount"></label></div>`;
  if(m.k==='CASH')h+=`<div class="pre">${presets(c.out).map(p=>`<button class="${entered===p?'on':''}" data-a="pre" data-v="${p}">${compact?p.toLocaleString('id-ID'):rp(p)}</button>`).join('')}</div>`;
  if(numpad&&m.k==='CASH')h+=`<div class="np">${['7','8','9','4','5','6','1','2','3','000','0','del'].map(k=>`<button data-a="k" data-v="${k}" aria-label="${k==='del'?'Delete one digit':k}">${k==='del'?ic('del'):k}</button>`).join('')}</div>`;
  if(change)h+=`<div class="chg"><span>Change</span><strong>${rp(change)}</strong></div>`;
  if(cta)h+=ctaHTML(c);
  return h+`</div>`;
}
function doneHTML(card=true){
  const d=S.sold; if(!d)return '';
  return `<section class="${card?'card ':''}done${S.anim==='done'&&viaPointer?' enter':''}">
    <span class="seal">${ic('check')}</span>
    <div class="lbl">${d.change?'Change':'Paid'}</div>
    <div class="big">${rp(d.change||d.total)}</div>
    <div class="meta" style="margin-top:6px">${rp(d.total)} · ${d.how}</div>
    <div class="meta mono">${d.id}</div>
    <div class="row"><button class="btn lg" data-a="print">${ic('print')}Reprint</button><button class="btn pri lg" data-a="next">Next sale<kbd>Enter</kbd></button></div>
  </section>`;
}

/* ── sheets ── */
function sheetHTML(){
  if(!S.sheet)return '';
  const an=S.anim==='sheet'&&viaPointer?' enter':'', c=calc();
  let h='',b='',f='';
  if(S.sheet==='held'){
    h='Held';
    b=S.held.length?`<div>${S.held.map((x,i)=>`<div class="hrow"><div class="grow"><div class="nm">${plural(x.items.length,'item')} · ${rp(x.items.reduce((a,t)=>a+t.price,0))}</div><div class="mt">${x.at} · ${x.items.map(t=>t.name).join(', ')}</div></div><button class="btn" data-a="resume" data-v="${i}">Resume</button></div>`).join('')}</div>`:`<div class="empty" style="padding:24px">Nothing held</div>`;
  }else if(S.sheet==='cancel'){
    h='Cancel sale';
    b=`<div class="mt" style="margin:0">${plural(S.items.length,'item')} · ${rp(c.total)}</div>
      <div class="chips">${['Customer changed mind','Wrong items','Price issue'].map(r=>`<button class="chip${S.reason===r?' on':''}" data-a="reason" data-v="${r}">${r}</button>`).join('')}</div>
      <div class="appr">${ic('finger')}Supervisor fingerprint</div>`;
    f=`<button class="btn" data-a="close">Back</button><button class="btn danger" data-a="cancelok">Cancel sale</button>`;
  }else if(S.sheet==='remove'){
    const it=S.items.find(x=>x.id==S.sheetV); if(!it){S.sheet=null;return ''}
    h='Remove item';
    b=`<div class="ln" style="padding:0;border:0;grid-template-columns:44px minmax(0,1fr) auto">${sw(it)}<div class="tx"><div class="nm">${it.name}</div><div class="mt">${it.col} · ${it.size}</div></div><div class="pr">${rp(it.price)}</div></div>
      <div class="appr">${ic('finger')}Supervisor fingerprint</div>`;
    f=`<button class="btn" data-a="close">Back</button><button class="btn pri" data-a="approve">Approve</button>`;
  }else if(S.sheet==='member'){
    h='Member';
    b=`<div class="fld"><label>Member number</label><input data-in="sheet" placeholder="0812 3456 7788" autocomplete="off"></div>`;
    f=`<button class="btn" data-a="close">Back</button><button class="btn pri" data-a="sheetok">Add</button>`;
  }else if(S.sheet==='coupon'){
    h='Coupon';
    b=`<div class="fld"><label>Coupon code</label><input data-in="sheet" placeholder="HEMAT50" autocomplete="off" style="text-transform:uppercase"></div>`;
    f=`<button class="btn" data-a="close">Back</button><button class="btn pri" data-a="sheetok">Apply</button>`;
  }else if(S.sheet==='bags'&&S.opt!=='today'){
    h='Bags';
    b=bagCards();
    const q=nb(),fee=calc().bags;
    f=`<span class="bsum">${q?`${plural(q,'bag')}${fee?' · '+rp(fee):''}`:''}</span><button class="btn pri" data-a="close">Done</button>`;
  }else if(S.sheet==='bags'){
    h='Shopping bags';
    b=`<div>${BAGS.map(x=>`<button class="hrow bagpick" data-a="bag" data-v="${x.k}">${ic('bag')}<span class="grow nm">${x.l}</span><span class="pz">${x.p?rp(x.p):'Free'}</span></button>`).join('')}</div>`;
  }else if(S.sheet==='receipt'){
    h=S.sheetV;
    b=`<div class="fld"><label>Receipt number</label><input data-in="sheet" placeholder="S-0412-1086" autocomplete="off"></div><div class="appr">${ic('finger')}Supervisor fingerprint</div>`;
    f=`<button class="btn" data-a="close">Back</button><button class="btn pri" data-a="sheetok">Find</button>`;
  }else if(S.sheet==='more'){
    h='More';
    b=`<div class="mgrid6">${[['return','Return'],['void','Void'],['star','Redeem points'],['rfid','From handheld'],['wallet','Shift & cash'],['lock','Lock']].map(([i,l])=>`<button data-a="tool" data-v="${l}">${ic(i)}${l}</button>`).join('')}</div>`;
  }
  return `<div class="scrim${an}" data-a="close"></div><div class="sheet-pos"><section class="sheet${an}" role="dialog" aria-label="${h}"><div class="sh-h"><h2>${h}</h2><button class="ib" data-a="close" aria-label="Close">${ic('x')}</button></div><div class="sh-b">${b}</div>${f?`<div class="sh-f">${f}</div>`:''}</section></div>`;
}

function todayPay(c){
  const m=METH[S.method], entered=S.typed?+S.typed:0, settled=S.paid.length&&c.out<=0;
  const offer=entered||c.out;
  let left;
  if(settled){
    left=`<div class="pay-done"><span class="seal">${ic('check')}</span><h3>Lunas</h3><p>${c.change?`Change <strong class="num">${rp(c.change)}</strong>`:'No change'}</p></div>
      <div class="pay-cta"><button class="btn primary" data-a="complete">${ic('check')}Complete sale <kbd>Enter</kbd></button></div>`;
  }else{
    left=`<div><span class="label">Payment method</span><div class="method-grid">${MK.map(k=>`<button class="method${S.method===k?' on':''}" data-a="m" data-v="${k}">${ic(METH[k].i)}${METH[k].t}</button>`).join('')}</div></div>
      ${m.bank?`<div><span class="label">Bank / mesin EDC</span><div class="bank-grid">${BANKS.map(b=>`<button class="${S.bank===b?'on':''}" data-a="bank" data-v="${b}">${b}</button>`).join('')}</div></div>`:''}
      ${m.ref?`<label class="field">${m.k==='DEBIT'||m.k==='CREDIT'?'EDC approval code':m.k==='VOUCHER'?'Voucher code':m.k==='BENEFIT'?'Employee balance code':m.l+' reference number'}<input data-in="ref" value="${esc(S.ref)}" autocomplete="off"></label>`:''}
      <div><span class="label">Amount</span><div class="amount-field"><span class="rp">Rp</span><input data-in="amount" inputmode="numeric" value="${entered?entered.toLocaleString('id-ID'):''}" placeholder="${c.out.toLocaleString('id-ID')}"></div></div>
      ${m.k==='CASH'?`<div class="numpad">${['7','8','9','4','5','6','1','2','3','del','0','000'].map(k=>`<button class="${k==='del'?'del':''}" data-a="k" data-v="${k}">${k==='del'?'⌫':k}</button>`).join('')}</div>
      <div class="presets">${presets(c.out).map(p=>`<button class="${entered===p?'on':''}" data-a="pre" data-v="${p}">${rp(p)}</button>`).join('')}</div>`:''}
      <div class="pay-cta"><button class="btn primary" data-a="pay">${ic('wallet')}${ctaLabel(c)} <kbd>Enter</kbd></button></div>`;

  return `<main class="pay-page">

      <button class="pay-back" data-a="back">${ic('back')}Back to basket <kbd>Esc</kbd></button>

        ${S.paid.length?`<span class="label" style="margin-top:4px">Payments</span>${S.paid.map(p=>`<div class="recorded"><span>${ic('check')}${p.l}</span><strong class="num">${rp(p.amt)}</strong></div>`).join('')}`:''}

  return groupItems().map(g=>{const q=g.units.length,last=!lock&&g.units.some(u=>u.id===S.lastId);
    return `<div class="fln${last?' last':''}"><div class="it">${sw(g)}<div class="tx"><div class="nm">${g.name}</div><div class="mt">${g.col} · ${g.size}${sku?` · <span class="mono">${g.sku}</span>`:''}</div></div></div><div class="q">${q>1?'× '+q:''}</div><div class="pr">${rp(g.price*q)}${q>1?`<div class="mt">${rp(g.price)} each</div>`:''}</div>${lock?'<span></span>':`<button class="ib rm" data-a="rm" data-v="${g.units[q-1].id}" aria-label="Remove one ${g.name}">${ic('x')}</button>`}</div>`}).join('');
}

const GRP=MK.map(k=>[k,METH[k].l,METH[k].i,[k]]);
/* Pay 5 · Dialog: payment is one focused task → a centred two-column dialog.
   Emil: modal stays centred, scale .96→1 + fade 200ms ease-out, pointer only
   (F10 opens it instantly); closes in 130ms. */
function fPayDlg(c){
  const m=METH[S.method], entered=S.typed?+S.typed:0, offer=entered||c.out, change=m.k==='CASH'&&offer>c.out?offer-c.out:0;
  const an=S.anim==='pay'&&viaPointer?' enter':'';
  const led=!S.paid.length
    ?`<div class="dl-due"><div class="lbl">Due</div><div class="due">${rp(c.out)}</div></div>`
    :`<div class="led"><div class="tl"><span>Total</span><span class="v">${rp(c.total)}</span><span></span></div>
      ${S.paid.map((p,i)=>`<div class="tl pd"><span>${ic('check')}${p.l}</span><span class="v">${rp(-p.amt)}</span><button class="ib sm" data-a="unpay" data-v="${i}" aria-label="Remove ${p.l} payment">${ic('x')}</button></div>`).join('')}
      <div class="gt"><span>Still due</span><strong>${rp(c.out)}</strong><span></span></div></div>`;
  const methods=`<div class="mseg dl-m">${MK.map(k=>`<button class="${S.method===k?'on':''}" data-a="m" data-v="${k}">${ic(METH[k].i)}${METH[k].l}</button>`).join('')}</div>`;
  const amt=`<div><div class="lbl f-lr"><span>${m.k==='CASH'?'Received':'Amount'}</span>${change?`<span class="chgv">Change ${rp(change)}</span>`:''}</div><label class="amt"><span>Rp</span><input data-in="amount" inputmode="numeric" value="${entered?entered.toLocaleString('id-ID'):''}" placeholder="${c.out.toLocaleString('id-ID')}" aria-label="Amount"></label></div>`;
  /* One slot, one height, whatever the method: the layout never moves. */
  const field=ph=>`<input class="dl-in" data-in="ref" value="${esc(S.ref)}" placeholder="${ph}" aria-label="${ph}" autocomplete="off">`;
  const slot=m.k==='CASH'
    ?`<div class="dl-slot pre p4">${presets(c.out).map((p,i)=>`<button class="${entered===p?'on':''}" data-a="pre" data-v="${p}">${i===0?'Exact':p.toLocaleString('id-ID')}</button>`).join('')}</div>`
    :m.bank
      ?`<div class="dl-slot dl-bank">${BANKS.map(b=>`<button class="chip${S.bank===b?' on':''}" data-a="bank" data-v="${b}">${b}</button>`).join('')}${field('Approval code')}</div>`
      :`<div class="dl-slot">${field(m.ref)}</div>`;
  const pad=`<div class="np">${['7','8','9','4','5','6','1','2','3','000','0','del'].map(k=>`<button data-a="k" data-v="${k}" aria-label="${k==='del'?'Delete one digit':k}">${k==='del'?ic('del'):k}</button>`).join('')}</div>`;
  return `<div class="scrim${an}" data-a="back"></div><div class="sheet-pos"><section class="sheet paydlg${an}" role="dialog" aria-label="Payment">
    <button class="ib dl-x" data-a="back" aria-label="Close">${ic('x')}</button>
    <div class="dl-r">${methods}${amt}${slot}${pad}<span class="sp"></span>${ctaHTML(c)}</div>
    <div class="dl-l">${led}</div>
  </section></div>`;
}

/* ════════ D · Command ════════ */
function suggestions(q){
  q=q.trim(); if(!q)return [];
  if(q.startsWith('/')){
    const cmds=[['hold','Hold this basket','hold'],['held','Held baskets','list'],['bag','Add a paper bag','bag'],['member','Add member','user'],['coupon','Apply coupon','tag'],['return','Return','return'],['cancel','Cancel sale','x']];
    return cmds.filter(x=>x[0].startsWith(q.slice(1).toLowerCase())).map(x=>({t:'cmd',v:x[0],l:x[1],i:x[2],r:'/'+x[0]}));
  }
  const out=[], d=q.replace(/[\s-]/g,'');
  if(/^(\+?62|0)8\d{6,}$/.test(d)||/^M1:/i.test(q))out.push({t:'member',v:q,l:`Add member ${q}`,i:'user',r:'Member'});
  const ql=q.toLowerCase();
  const arts=CAT.filter(a=>(a.name+' '+a.col+' '+a.sku).toLowerCase().includes(ql)).slice(0,5);
  if(/^[A-Za-z]{3,}\d+$/.test(q)&&!arts.length)out.push({t:'coupon',v:q.toUpperCase(),l:`Apply coupon ${q.toUpperCase()}`,i:'tag',r:'Coupon'});
  arts.forEach(a=>out.push({t:'item',v:a.sku,l:`${a.name} · ${a.col} · ${a.size}`,a,r:rp(a.price)}));
  if(!out.length)out.push({t:'scan',v:q,l:`Tag ${q}`,i:'scan',r:'Scan'});
  return out;
}

  }else if(st===2){
    main=`<main class="e-main"><section class="card e-center${an}">
      <div class="e-sec"><h3>Member</h3>${S.member?`<div class="mcard"><span class="av">AW</span><div class="grow"><div class="nm">${S.member.name}</div><div class="mt">${S.member.tier} · ${S.member.pts.toLocaleString('id-ID')} points · ${S.member.no}</div></div><button class="btn ghost" data-a="dropm">Remove</button></div>`
        :`<div class="fld inl"><input data-in="m2" placeholder="0812 3456 7788" autocomplete="off" aria-label="Member number"><button class="btn lg" data-a="m2">Add</button></div>`}</div>
      <div class="e-sec"><h3>Coupon</h3><div class="fld inl"><input data-in="c2" placeholder="HEMAT50" autocomplete="off" aria-label="Coupon code" style="text-transform:uppercase"><button class="btn lg" data-a="c2">Apply</button></div>
        ${S.coupons.length?`<div class="chips" style="margin-top:12px">${S.coupons.map(x=>`<button class="chip on" data-a="dropc" data-v="${x}">${x}${x==='HEMAT50'?'':' · no discount'}${ic('x')}</button>`).join('')}</div>`:''}</div>
      <div class="e-sec" style="border:0;padding-bottom:0">${totalsHTML(c)}</div>
      <div class="e-nav"><button class="btn lg" data-a="back">${ic('back')}Basket</button><span class="sp"></span><button class="btn pri lg" data-a="go">Continue to payment<kbd>F10</kbd></button></div>
    </section></main>`;
  }else if(st===3){
    main=`<main class="e-main"><section class="card e-pay${an}">${payBody('grid',c,{numpad:true})}</section>
      <aside class="card e-right"><div class="e-items">${S.items.map(it=>`<div class="ln">${sw(it,'sm')}<div class="tx"><div class="nm">${it.name}</div><div class="mt">${it.col} · ${it.size}</div></div><div class="pr">${rp(it.price)}</div></div>`).join('')}</div>
      ${totalsHTML(c)}${S.paid.length?`<div class="tl" style="color:var(--bad-fg)"><span>Still due</span><span class="v" style="color:inherit">${rp(c.out)}</span></div>`:''}
      <button class="btn lg block" style="margin-top:14px" data-a="back">${ic('back')}Customer</button></aside></main>`;
  }else main=`<main class="e-main">${doneHTML()}</main>`;
  return `<div class="op E">${hdr}${main}${sheetHTML()}</div>`;
}

/* ── state changes ── */
function addItem(q){
  if(S.stage==='done'){reset();}
  else if(S.stage==='pay'){toast('Finish the payment first');return}
  const raw=(q||'').trim();
  if(/^M1:/i.test(raw)||/^(\+?62|0)8[\d\s-]{7,}$/.test(raw)){setMember(raw.replace(/^M1:/i,''));toast('Member added');return}
  if(/^[A-Za-z]{3,}\d+$/.test(raw)&&!CAT.some(x=>x.sku.toLowerCase().startsWith(raw.toLowerCase()))){applyCoupon(raw);toast('Coupon applied');return}
  q=raw.toLowerCase();
  let a=q?CAT.find(x=>(x.name+' '+x.col+' '+x.sku).toLowerCase().includes(q)):null;
  if(!a){a=CAT[S.cursor%CAT.length];S.cursor++}
  const it=mk(a); S.items.push(it); S.flash=it.id; S.lastId=it.id;
  if(S.opt==='C')S.place='sell';
  if(S.opt==='E'&&S.step!==1){S.step=1}
  render();
}
function reset(){
  Object.assign(S,{bagPick:false,pop:null,menu:false,items:[],member:null,coupons:[],bags:{},paid:[],typed:'',ref:'',stage:'sell',sold:null,step:1,place:'sell',method:'CASH',bank:null,otherOpen:false,cmd:'',sel:0});
  S.saleNo++;
}
function openPay(){
  if(!S.items.length||S.stage!=='sell')return;
  if(S.opt==='E'&&S.step===1){S.step=2;S.anim='step';render();return}
  Object.assign(S,{stage:'pay',method:'CASH',bank:null,typed:'',ref:'',anim:S.opt==='E'?'step':'pay',otherOpen:false});
  if(S.opt==='E')S.step=3;
  render();
}
function back(){
  if(S.opt==='E'){
    if(S.step===3){S.stage='sell';S.step=2;S.anim='step';render();return}
    if(S.step===2){S.step=1;S.anim='step';render();return}
  }
  if(S.stage==='pay'){S.stage='sell';S.anim='back';render()}
}
function pay(){
  const c=calc(), m=METH[S.method];
  if(S.opt==='today'&&S.paid.length&&c.out<=0){complete();return}
  if(m.bank&&!S.bank){toast('Choose the bank');return}
  let amt=S.typed?+S.typed:c.out; if(m.k!=='CASH')amt=Math.min(amt,c.out);
  if(amt<=0)return;
  S.paid.push({k:m.k,l:m.l+(m.bank?' '+S.bank:''),amt});
  S.typed='';S.ref='';
  if(calc().out<=0&&S.opt!=='today'){complete();return}
  S.method='CASH';S.bank=null;S.otherOpen=false;
  render();
}
function complete(){
  const c=calc();
  S.sold={total:c.total,change:c.change,how:[...new Set(S.paid.map(p=>p.l))].join(' + '),id:'S-0412-'+(1087+S.saleNo)};
  S.stage='done';S.step=4;S.anim='done';render();
}
function hold(){
  if(!S.items.length||S.stage!=='sell')return;
  S.held.unshift({items:S.items,member:S.member,coupons:S.coupons,bags:S.bags,at:now()});
  const seat=S.saleNo; reset(); S.saleNo=seat; toast('Held'); render();
}
function resume(i){
  const x=S.held.splice(i,1)[0]; if(!x)return;
  if(S.items.length)S.held.unshift({items:S.items,member:S.member,coupons:S.coupons,bags:S.bags,at:now()});
  Object.assign(S,{items:x.items,member:x.member,coupons:x.coupons,bags:x.bags,stage:'sell',paid:[],sheet:null,place:'sell',step:1});
  render();
}
function setMember(v){
  v=(v||'').trim()||'0812 3456 7788';
  S.member={no:v,name:'Ani Wijaya',tier:'Gold',pts:1240};
  S.sheet=null;render();
}
function applyCoupon(v){
  const code=(v||'').trim().toUpperCase()||'HEMAT50';
  if(!S.coupons.includes(code))S.coupons.push(code);
  S.sheet=null;render();
}
function openSheet(name,v){if(S.stage==='done')return;S.sheet=name;S.sheetV=v;S.reason=null;S.anim='sheet';render()}
function jump(v){
  S.sheet=null; const keep=S.saleNo; reset(); S.saleNo=keep;
  if(v!=='empty'){
    S.items=[CAT[0],CAT[1],CAT[2]].map(mk); S.cursor=3;
    if(v==='pay'||v==='done'){S.stage='pay';S.step=3}
    if(v==='done'){S.paid=[{k:'CASH',l:'Cash',amt:850000}];complete();return}
  }
  render();
}
function runCmd(){
  const q=S.cmd.trim();
  if(!q){addItem('');return}
  const s=suggestions(q)[S.sel]; if(!s)return;
  S.cmd='';S.sel=0;
  if(s.t==='item')addItem(s.v);
  else if(s.t==='scan')addItem('');
  else if(s.t==='member')setMember(s.v);
  else if(s.t==='coupon')applyCoupon(s.v);
  else if(s.t==='cmd'){
    if(s.v==='hold')hold(); else if(s.v==='held')openSheet('held'); else if(s.v==='bag'){openSheet('bags')}
    else if(s.v==='member')openSheet('member'); else if(s.v==='coupon')openSheet('coupon');
    else if(s.v==='return'){toast('Return');render()} else if(s.v==='cancel'){S.items.length?openSheet('cancel'):render()}
  }
}
function updateSugg(){const el=$('#sugg');if(!el)return;const s=suggestions(S.cmd);el.classList.toggle('on',s.length>0);el.innerHTML=s.map(sgHTML).join('')}
function leave(sel,then,ms=130){
  const els=[...document.querySelectorAll('#stage '+sel.split(',').join(',#stage '))];
  if(!viaPointer||!els.length||matchMedia('(prefers-reduced-motion: reduce)').matches){then();return}
  els.forEach(e=>e.classList.add('leave'));
  setTimeout(then,ms);
}
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1800)}

const ACT={
  opt:v=>{S.opt=v;try{history.replaceState(null,'','#'+v+(v==='F'?'.'+S.look:''))}catch(e){}S.sheet=null;S.place='sell';S.cmd='';
    if(S.stage==='pay'&&S.paid.length&&calc().out<=0){complete();return}
    S.step=S.stage==='pay'?3:S.stage==='done'?4:1;render()},
  jump,
  scan:()=>addItem(''),
  scanbtn:()=>{const el=$('[data-in="scan"]');addItem(el?el.value:'')},
  go:openPay, pay, complete,
  back:()=>S.opt==='F'&&S.stage==='pay'&&(S.pv||'5')==='5'?leave('.sheet,.scrim',back):innerWidth<900&&S.opt==='F'?leave('.FT .f-money.open,.FT .f-dim',back,200):back(),
  next:()=>{reset();render()},
  m:v=>{S.method=v;S.bank=null;S.typed='';S.ref='';if(MAIN.includes(v))S.otherOpen=false;render()},
  other:()=>{S.otherOpen=!S.otherOpen;if(S.otherOpen&&!OTHER.includes(S.method)){S.method='EWALLET';S.bank=null;S.typed=''}else if(!S.otherOpen){S.method='CASH'}render()},
  bank:v=>{S.bank=v;render()},
  pre:v=>{S.typed=String(v);render()},
  k:v=>{S.typed=v==='del'?S.typed.slice(0,-1):String(Number(S.typed+v)||'').slice(0,10);S.focus='[data-in="amount"]';render()},
  hold, held:()=>openSheet('held'), resume:v=>resume(+v),
  bagpick:()=>{S.bagPick=!S.bagPick;S.bagPickAnim=S.bagPick;render()},
  bag:v=>{if(v){S.bags={...S.bags,[v]:(S.bags[v]||0)+1};S.bagPick=false;if(S.sheet==='bags'&&S.opt==='today'){S.sheet=null;toast(BAGS.find(b=>b.k===v).l+' added')}render();return}
    if(S.stage!=='sell')return;
    if(document.querySelector('#stage .bag-head')){S.bagPick=true;render();return}
    openSheet('bags')},
  bagm:v=>{const k=v||[...BAGS].reverse().find(b=>S.bags[b.k])?.k;if(!k)return;S.bags={...S.bags,[k]:Math.max(0,(S.bags[k]||0)-1)};render()},
  rm:v=>openSheet('remove',v),
  approve:()=>{S.items=S.items.filter(x=>x.id!=S.sheetV);S.sheet=null;toast('Removed');render()},
  cancel:()=>{if(S.items.length)openSheet('cancel')},
  reason:v=>{S.reason=v;render()},
  cancelok:()=>{const k=S.saleNo;reset();S.saleNo=k;toast('Sale cancelled');render()},
  sheet:v=>openSheet(v),
  close:()=>leave('.sheet,.scrim',()=>{S.sheet=null;render()}),
  sheetok:()=>{const el=$('[data-in="sheet"]');if(S.sheet==='receipt'){S.sheet=null;toast('Receipt S-0412-1086 found');render();return}if(S.sheet==='member')setMember(el&&el.value);else applyCoupon(el&&el.value)},
  dropc:v=>{S.coupons=v?S.coupons.filter(x=>x!==v):[];render()},
  dropm:()=>{S.member=null;render()},
  more:()=>openSheet('more'),
  tool:v=>{S.sheet=null;toast(v);render()},
  finish:()=>toast('Drawer count'),
  lock:()=>toast('Locked'),
  print:()=>toast('Receipt printed'),
  place:v=>{S.place=v;render()},
  pick:v=>{S.sel=+v;runCmd()},
  slash:()=>{S.cmd='/';S.sel=0;render()},
  m2:()=>{const el=$('[data-in="m2"]');setMember(el&&el.value)},
  c2:()=>{const el=$('[data-in="c2"]');applyCoupon(el&&el.value)},
  tcoupon:()=>{const el=$('[data-in="tcoupon"]');applyCoupon(el&&el.value)},
  fcoupon:()=>{const el=$('[data-in="fcoupon"]');applyCoupon(el&&el.value)},
  unpay:v=>{S.paid.splice(+v,1);toast('Payment removed');render()},
  fv:v=>{S.fv=v;S.place='sell';S.menu=false;render()},
  look:v=>{S.look=v;try{history.replaceState(null,'','#'+S.opt+'.'+v)}catch(e){}render()},
  menu:()=>{S.menu=!S.menu;S.menuAnim=S.menu;render()},
  menuclose:()=>{S.menu=false;render()},
  pop:v=>{if(S.pop===v){ACT.popclose();return}S.pop=v;S.popAnim=true;render()},
  popclose:()=>leave('.pop',()=>{S.pop=null;render()}),
  receipt:v=>{S.pop=null;openSheet('receipt',v)},
  retmode:v=>{S.retMode=v;render()},
  pv:v=>{S.pv=v;S.otherAmt=false;render()},
  grp:v=>{const g=GRP.find(x=>x[0]===v);S.method=g[3][0];S.bank=null;S.typed='';S.ref='';S.otherAmt=false;render()},
  quick:v=>{S.typed=String(v);pay()},
  otheramt:()=>{S.otherAmt=true;S.focus='[data-in="amount"]';render()},
  noop:()=>{},
};

/* ── render ── */
function render(){
  const V={today:viewToday,F:viewF,A:viewA,B:viewB,B2:viewB2,C:viewC,D:viewD,E:viewE}[S.opt];
  $('#stage').innerHTML=V();
  document.querySelectorAll('#optseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.opt));
  $('#fseg').style.display=S.opt==='F'&&S.stage!=='pay'?'':'none';
  /* Lark looks (round "lark"): only F wears them. */
  document.body.dataset.look=S.opt==='F'?S.look:'base';
  $('#lookseg').style.display=S.opt==='F'?'':'none';
  document.querySelectorAll('#lookseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.look));
  $('#pseg').style.display=S.opt==='F'&&S.stage==='pay'?'':'none';
  document.querySelectorAll('#pseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===(S.pv||'5')));
  document.querySelectorAll('#fseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.fv));
  const st=S.stage==='done'?'done':S.stage==='pay'?'pay':S.items.length?'basket':'empty';
  document.querySelectorAll('#stateseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===st));
  $('#scanbtn').innerHTML=`${ic('scan')}Scan item`;
  if(S.flash){const el=$('#stage .new');if(el)el.scrollIntoView({block:'nearest'})}
  focusAfter();
  S.flash=null;S.anim=null;S.focus=null;S.menuAnim=false;S.popAnim=false;S.bagPickAnim=false;
}
function focusAfter(){
  let sel=S.focus;
  if(!sel){
    if(S.sheet)sel='[data-in="sheet"]';
    else if(S.stage==='pay'){const m=METH[S.method];sel=m.bank&&!S.bank?null:m.k==='CASH'?'[data-in="amount"]':'[data-in="ref"]'}
    else if(S.stage==='sell'){
      if(S.opt==='E'&&S.step===2)sel=S.member?'[data-in="c2"]':'[data-in="m2"]';
      else if((S.opt==='C'||S.opt==='F')&&S.place!=='sell')sel='[data-in="pl"]';
      else sel='[data-in="scan"],[data-in="cmd"]';
    }
  }
  if(!sel)return;
  const el=$('#stage').querySelector(sel); if(!el)return;
  el.focus({preventScroll:true});
  try{const l=el.value.length;el.setSelectionRange(l,l)}catch(e){}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled)return;
  viaPointer=true;
  const f=ACT[b.dataset.a]; if(f){e.preventDefault();if(S.pop&&!['pop','popclose'].includes(b.dataset.a))S.pop=null;if(S.menu&&!['menu','menuclose'].includes(b.dataset.a))S.menu=false;f(b.dataset.v)}
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;
  if(k==='amount'){S.typed=t.value.replace(/\D/g,'').slice(0,10);S.focus='[data-in="amount"]';render()}
  else if(k==='cmd'){S.cmd=t.value;S.sel=0;updateSugg()}
  else if(k==='ref'){S.ref=t.value}
});
document.addEventListener('keydown',e=>{
  viaPointer=false;
  const t=e.target,k=t.dataset&&t.dataset.in,K=e.key;
  if(K==='Escape'){
    e.preventDefault();
    if(S.pop){S.pop=null;render();return}
    if(S.menu){S.menu=false;render();return}
    if(S.sheet){S.sheet=null;render();return}
    if(S.opt==='D'&&S.cmd){S.cmd='';render();return}
    back();return;
  }
  if(K==='F10'){e.preventDefault();if(!S.sheet)openPay();return}
  if(K==='F9'){e.preventDefault();if(S.stage==='sell')openSheet('held');return}
  if(K==='F4'){e.preventDefault();if(S.stage==='sell')ACT.bag();return}
  if(K==='F8'){e.preventDefault();if(S.stage==='sell')ACT.cancel();return}
  if(K==='F3'&&S.opt==='F'&&S.fv[0]==='t'&&S.stage==='sell'){e.preventDefault();openSheet('receipt','Return items');return}
  if(K==='F3'||K==='F6'){e.preventDefault();toast(K==='F3'?'Return':'From handheld');return}
  if(k==='cmd'&&(K==='ArrowDown'||K==='ArrowUp')){
    const n=suggestions(S.cmd).length; if(!n)return; e.preventDefault();
    S.sel=(S.sel+(K==='ArrowDown'?1:-1)+n)%n; updateSugg(); return;
  }
  if(S.opt==='D'&&S.stage==='pay'&&(K==='ArrowDown'||K==='ArrowUp')){
    e.preventDefault(); const i=MK.indexOf(S.method);
    S.method=MK[(i+(K==='ArrowDown'?1:-1)+MK.length)%MK.length]; S.bank=null;S.typed='';render(); return;
  }
  if(K==='Enter'){
    if(k==='scan'){e.preventDefault();addItem(t.value);return}
    if(k==='cmd'){e.preventDefault();runCmd();return}
    if(k==='amount'||k==='ref'){e.preventDefault();pay();return}
    if(k==='sheet'){e.preventDefault();ACT.sheetok();return}
    if(k==='m2'){e.preventDefault();setMember(t.value);return}
    if(k==='c2'){e.preventDefault();applyCoupon(t.value);return}
    if(k==='tcoupon'||k==='fcoupon'){e.preventDefault();applyCoupon(t.value);return}
    if(k==='fmember'){e.preventDefault();setMember(t.value);return}
    if(k==='tmember'){e.preventDefault();if(t.value.trim()){S.member={no:t.value.trim(),name:t.value.trim(),tier:'',pts:0};render()}return}
    if(k==='pl'){e.preventDefault();toast('Found');return}
    if(S.stage==='done'&&!S.sheet){e.preventDefault();reset();render();return}
    if(S.opt==='today'&&S.stage==='pay'&&S.paid.length&&calc().out<=0){e.preventDefault();complete();return}
  }
});

{const h=(location.hash||'#F').slice(1).split('.');S.opt=h[0];if(['base','l1','l2','l3'].includes(h[1]))S.look=h[1];S.boot=h[2]}
if(!['today','F','A','B','B2','C','D','E'].includes(S.opt))S.opt='F';
jump('basket');
if(S.boot==='pay'){openPay()}else if(S.boot==='bags'){S.bags={sp:1,spl:2};render()}
</script>
</body>
