<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Supply Requests · Category filter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* GA › Supply Requests — the category filter, tidied. Now (two lines of
   chips, empty ones too) against five answers: A keeps chips, B–E drop them.
   Look copied from the running hub (white.css tokens + owner's screenshot,
   20 Oct 2026). */
:root{
  --ink:#1d1d1f; --body:#6e6e73; --mute:#6e6e73; --ph:#8e8e93;
  --soft:#fafafb; --soft-2:#f2f2f5; --soft-3:#f5f5f7; --rail-3:#efeff2;
  --hairline:#e8e8ec; --hairline-2:#dcdce1; --hairline-strong:#c7c7cc; --row-line:#eeeef1; --band:#fafafb;
  --accent:#2862dc; --accent-bg:#eef3fc; --bad:#d70015;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --font:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:20px;color:var(--ink);background:#141518;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;text-align:left}
input{font:inherit;letter-spacing:inherit;color:inherit}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:16px;height:16px}

/* prototype chrome (not the product) */
.proto{height:50px;overflow-x:auto;background:#141518;color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px}
.proto .t{font-weight:600;white-space:nowrap}
.seg{display:flex;gap:2px;background:#24262b;border-radius:9px;padding:3px;flex:none}
.seg button{height:32px;padding:0 11px;border-radius:7px;color:#b9bcc3;white-space:nowrap;transition:background-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.seg button:active{transform:scale(.97)}
.seg button b{font-weight:600;color:#fff;margin-right:5px}
.seg button.on{background:#fff;color:var(--ink)} .seg button.on b{color:var(--ink)}
.seg .star{color:#f4b740;margin-left:4px}
.proto .sp{flex:1}
.note{min-height:36px;background:#1c1e22;color:#a7abb3;line-height:24px;padding:6px 18px;border-top:1px solid #26282d}
.note b{color:#fff;font-weight:500}
.stage{height:calc(100vh - 86px);overflow:auto;background:#141518}

/* hub shell: rail · panel · page, white cards on the grey */
.app{display:grid;grid-template-columns:68px 244px minmax(0,1fr);background:#ececef;min-height:900px;margin:0 auto}
.rail{display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;color:#3a3a3c}
.rail .ri{width:40px;height:36px;border-radius:9px;display:grid;place-items:center}
.rail .ri.on{background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/.05)}
.rail .sp{flex:1}
.av{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:600;box-shadow:0 0 0 1px var(--hairline)}
.panel{background:#fff;margin:12px 12px 12px 0;border-radius:20px;box-shadow:0 0 0 1px rgb(0 0 0/.04);padding:14px 10px}
.panel h2{margin:0 0 10px;padding:6px 10px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.nv{height:36px;display:flex;align-items:center;padding:0 10px;border-radius:8px;color:#3a3a3c;width:100%}
.nv.on{background:var(--rail-3);color:var(--ink);font-weight:500}
.panel hr{border:0;border-top:1px solid var(--hairline);margin:6px 10px}
.card{background:#fff;margin:12px 12px 12px 0;border-radius:20px;box-shadow:0 0 0 1px rgb(0 0 0/.04);min-width:0;display:flex;flex-direction:column}
.head{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--hairline)}
.head h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.012em}
.btn{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 14px 0 12px;border-radius:9px;font-weight:500;transition:background-color .15s ease,transform .16s var(--ease-out)}
.btn:active,.ghost:active,.chip:active,.tile:active,.cl:active,.swp:active,.txt:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.content{padding:28px 28px 32px}

/* figures */
.kpis{display:flex;margin:0 0 32px -1px}
.kpi{padding:0 40px 0 20px;border-left:1px solid var(--hairline);display:flex;flex-direction:column;gap:6px;border-radius:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi .lab{color:var(--mute);transition:color .15s ease}
.kpi .val{font-size:18px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .val.bad{color:var(--bad)}
.kpi.on .lab{color:var(--accent)}
.kpi.on .val:not(.bad){color:var(--accent)}

/* tabs */
.tabs{display:flex;gap:34px;border-bottom:1px solid var(--hairline);margin-bottom:28px}
.tab{height:44px;display:flex;align-items:center;gap:6px;font-size:16px;color:var(--mute);position:relative}
.tab .n{font-variant-numeric:tabular-nums}
.tab.on{color:var(--ink);font-weight:500}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}

/* the bar */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar .sp{flex:1}
.search{height:36px;flex:0 1 280px;min-width:150px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:8px;color:var(--ph);transition:border-color .15s ease,box-shadow .15s ease}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgb(40 98 220/12%)}
.search input{border:0;outline:0;flex:1;min-width:0;background:none;color:var(--ink)}
.search input::placeholder{color:var(--ph)}
.swp{height:36px;display:inline-flex;align-items:center;gap:10px;padding:0 14px 0 10px;border:1px solid var(--hairline-2);border-radius:9px;font-weight:500;transition:transform .16s var(--ease-out),background-color .15s ease}
.swp .n{color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums;margin-left:-4px}
.sw{width:32px;height:20px;border-radius:999px;background:#e5e5ea;position:relative;transition:background-color .16s ease}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.18);transition:transform .16s var(--ease-out)}
.swp.on .sw{background:var(--accent)} .swp.on .sw::after{transform:translateX(12px)}
.ghost{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 13px 0 11px;border:1px solid var(--hairline-2);border-radius:9px;background:#fff;font-weight:500;transition:background-color .15s ease,transform .16s var(--ease-out)}
.ghost.open{background:var(--soft-2)}
.ghost .n{color:var(--accent);font-variant-numeric:tabular-nums}
.txt{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 8px;border-radius:9px;color:var(--ink);transition:background-color .15s ease,transform .16s var(--ease-out)}
.txt .i{color:var(--mute)}
.txt.open{background:var(--soft-2)}
.anchor{position:relative}

/* chips (Now, A) — FilterChips as the hub draws it */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips.one{flex-wrap:nowrap;overflow:hidden}
.chip{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 14px 0 10px;border-radius:999px;border:1px solid transparent;background:var(--soft-2);font-weight:500;white-space:nowrap;flex:none;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.chip .i{color:var(--mute)}
.chip .n{color:var(--mute);font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.chip.on .i,.chip.on .n{color:var(--accent)}
.chip.more{padding:0 14px;color:var(--mute)}

/* tokens: what is on, with its ✕ (D, E) */
.token{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 4px 0 11px;border-radius:999px;background:var(--soft-2);font-weight:500;white-space:nowrap}
.token .i{color:var(--mute)}
.token.new{animation:tokIn .18s var(--ease-out)}
@keyframes tokIn{from{opacity:0;transform:scale(.94)}}
.token .x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:background-color .15s ease,color .15s ease}

/* popovers */
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgb(0 0 0/.06),0 10px 30px rgb(0 0 0/.12);padding:6px;min-width:220px;opacity:0;transform:scale(.96);transform-origin:top left;transition:opacity .18s var(--ease-out),transform .18s var(--ease-out)}
.pop.right{left:auto;right:0;transform-origin:top right}
.pop.in{opacity:1;transform:none}
.pop.out{transition-duration:.12s}
.mi{height:36px;width:100%;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;white-space:nowrap}
.mi .ck{width:16px;color:var(--accent)}
.mi .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--hairline-strong);display:grid;place-items:center;color:#fff}
.mi .box.on{background:var(--accent);border-color:var(--accent)}
.pop.filter{width:600px;padding:18px}
.pop .lab{color:var(--mute);margin:0 2px 10px}
.pop .sec+.sec{margin-top:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles.four{grid-template-columns:repeat(4,1fr)}
.tile{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:10px;min-width:0;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.tile .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .i,.tile .n{color:var(--mute)}
.tile .n{font-variant-numeric:tabular-nums}
.tile.zero{color:var(--mute)}
.tile.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.tile.on .i,.tile.on .n{color:var(--accent)}
.pf{margin-top:18px;padding-top:14px;border-top:1px solid var(--hairline);display:flex}
.tint{height:36px;padding:0 12px;border-radius:9px;background:var(--accent-bg);color:var(--accent);font-weight:500}

/* B: the side list */
.split{display:grid;grid-template-columns:272px minmax(0,1fr);gap:24px;align-items:start}
.catlist{display:flex;flex-direction:column;gap:2px}
.cl{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:9px;transition:background-color .15s ease,transform .16s var(--ease-out)}
.cl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .i{color:var(--mute)}
.cl .n{color:var(--mute);font-variant-numeric:tabular-nums}
.cl.zero{color:var(--mute)}
.cl.zero .i{opacity:.6}
.cl.on{background:var(--rail-3);font-weight:500}
.cl.on .i{color:var(--ink)}

/* the framed table */
.frame{border:1px solid var(--hairline);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{height:42px;background:var(--band);color:var(--mute);font-weight:400;text-align:left;padding:0 16px;border-bottom:1px solid var(--hairline);white-space:nowrap}
th.num,td.num{text-align:right}
th .srt{display:inline-flex;align-items:center;gap:4px;color:inherit}
th .srt .i{width:14px;height:14px;transition:transform .16s var(--ease-out)}
th .srt.desc .i{transform:rotate(180deg)}
td{padding:0 16px;height:68px;border-top:1px solid var(--row-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr:first-child td{border-top:0}
td.num{font-variant-numeric:tabular-nums}
td.bad{color:var(--bad)}
td.why{color:var(--mute)}
.itm{display:flex;align-items:center;gap:12px;min-width:0}
.tl{width:32px;height:32px;border-radius:8px;background:var(--soft-2);display:grid;place-items:center;color:var(--mute);flex:none;transition:background-color .15s ease,color .15s ease}
.itx{min-width:0}
.itx .nm{overflow:hidden;text-overflow:ellipsis}
.itx .sub{color:var(--mute);overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.st{display:inline-flex;align-items:center;gap:9px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:#8e8e93}
.st.billed::before{background:#248a3d} .st.rejected::before{background:var(--bad)}
tfoot td{height:48px;background:var(--band);border-top:1px solid var(--hairline)}
tfoot .cnt{color:var(--mute)} tfoot .cnt b{color:var(--ink);font-weight:500}
.empty td{height:120px;text-align:center;color:var(--mute)}
/* E: the category word in a row is the filter */
.catw{color:var(--mute);border-radius:4px;transition:color .15s ease}
.catw.on{color:var(--accent)}
button.tl.on{background:var(--accent-bg);color:var(--accent)}
/* C: bands per category */
tr.grp td{height:48px;background:var(--band);border-top:1px solid var(--hairline)}
tbody tr.grp:first-child td{border-top:0}
tr.grp + tr:not(.grp) td{border-top:1px solid var(--hairline)}
.gh{display:inline-flex;align-items:center;gap:10px;font-weight:600}
.gh .chev{color:var(--mute);transition:transform .16s var(--ease-out)}
tr.grp:not(.folded) .chev{transform:rotate(90deg)}
.gh .i:not(.chev){color:var(--mute)}
.gh .n{color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
tr.grp td.num{color:var(--mute)}
tr.grp{cursor:pointer}

@media (hover:hover) and (pointer:fine){
  .chip:not(.on):hover{background:#e9e9ee}
  .ghost:hover,.txt:hover{background:var(--soft-2)}
  .swp:hover{background:var(--soft-3)}
  .btn.primary:hover{background:#2055c7}
  .mi:hover{background:var(--soft-3)}
  .tile:not(.on):hover{background:var(--soft-3);border-color:var(--hairline-strong)}
  .cl:not(.on):hover{background:var(--soft-3)}
  .token .x:hover{background:#e3e3e8;color:var(--ink)}
  tbody tr:not(.grp):not(.empty):hover td{background:#fbfbfc}
  tr.grp:hover td{background:#f5f5f7}
  .catw:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  button.tl:hover{background:var(--accent-bg);color:var(--accent)}
}
@media (prefers-reduced-motion:reduce){
  .pop{transform:none!important}
  .token.new{animation:fade .18s ease}
  @keyframes fade{from{opacity:0}}
  .btn:active,.ghost:active,.chip:active,.tile:active,.cl:active,.swp:active,.txt:active{transform:none}
}
</style>
</head>
<body>
<div class="proto">
  <span class="t">Category filter</span>
  <div class="seg" id="opts">
    <button data-opt="NOW"><b>Now</b></button>
    <button data-opt="A"><b>A</b>Only used<span class="star">★</span></button>
    <button data-opt="B"><b>B</b>Side list</button>
    <button data-opt="C"><b>C</b>Grouped</button>
    <button data-opt="D"><b>D</b>Filter button</button>
    <button data-opt="E"><b>E</b>From the row</button>
  </div>
  <span class="sp"></span>
  <div class="seg" id="datas"><button data-data="demo">Demo 2</button><button data-data="busy">Busy 18</button></div>
  <div class="seg" id="widths"><button data-w="1440">1440</button><button data-w="1280">1280</button></div>
</div>
<div class="note" id="note"></div>
<div class="stage" id="stage">
  <div class="app" id="app">
    <nav class="rail" id="rail"></nav>
    <aside class="panel">
      <h2>GA</h2>
      <button class="nv">Overview</button><hr>
      <button class="nv on">Supply Requests</button><button class="nv">Repairs</button><button class="nv">Service Schedule</button><hr>
      <button class="nv">Assets</button><button class="nv">Contracts</button><button class="nv">Sites</button><button class="nv">Suppliers</button><hr>
      <button class="nv">Letters</button><button class="nv">Files</button>
    </aside>
    <main class="card" id="card"></main>
  </div>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s)
const ICON = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  printer: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
  house: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .7-1.5l7-6a2 2 0 0 1 2.6 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  store: '<path d="m2 7 4.4-4.4A2 2 0 0 1 7.8 2h8.4a2 2 0 0 1 1.4.6L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-2-.9 2.7 2.7 0 0 1-2 .9 2.7 2.7 0 0 1-2-.9 2.7 2.7 0 0 1-2 .9 2.7 2.7 0 0 1-2-.9 2.7 2.7 0 0 1-2 .9 2.7 2.7 0 0 1-2-.9A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/>',
  plug: '<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  bed: '<path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/>',
  search: '<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>',
  filter: '<path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/>',
  columns: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  chevR: '<path d="m9 18 6-6-6-6"/>',
  chevUp: '<path d="m18 15-6-6-6 6"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  pin: '<path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/>',
  chat: '<path d="M4 5h11v8H8l-4 3z"/><path d="M9 13v3h7l4 3V10h-5"/>',
}
const svg = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;")
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
const day = (s) => { const [y, m, d] = s.split("-").map(Number); return `${d} ${MON[m - 1]} ${y}` }
const num = (n) => n.toLocaleString("id-ID")
const rp = (n) => "Rp " + num(n)
const TODAY = "2026-10-20"

// the seven GA categories, in the chart's order
const CATS = [
  { k: "ATK", name: "ATK & barang cetakan", ic: "printer" },
  { k: "RUMAH", name: "Rumah tangga", ic: "house" },

function view() {
  const q = S.q.trim().toLowerCase()
  const match = (r) => !q || [r.item, r.by, SITE[r.site], CAT[r.cat].name].some((s) => s.toLowerCase().includes(q))
  const base = DATA[S.data].filter((r) => match(r) && (!S.site || r.site === S.site))
  const of = (tab) => base.filter((r) => TAB_OF[r.status] === tab)
  const open = of("OPEN")
  const tabs = { OPEN: open.length, DONE: of("DONE").length, REJECTED: of("REJECTED").length }
  const kpi = {
    approve: open.filter((r) => STAGE.approve.includes(r.status)).length,
    procurement: open.filter((r) => STAGE.procurement.includes(r.status)).length,
    bill: open.filter((r) => STAGE.bill.includes(r.status)).length,
    late: open.filter(isLate).length,
  }
  let f = of(S.tab)
  if (S.tab === "OPEN" && S.stage) f = f.filter((r) => STAGE[S.stage].includes(r.status))
  if (S.tab === "OPEN" && S.late) f = f.filter(isLate)
  const counts = Object.fromEntries(CATS.map((c) => [c.k, f.filter((r) => r.cat === c.k).length]))
  const shown = (S.cat ? f.filter((r) => r.cat === S.cat) : f).sort((a, b) => S.dir * a.need.localeCompare(b.need))
  return { tabs, kpi, counts, all: f.length, shown }
}

// What fits the card (the hub's fitted columns): Requested by goes first, then Location.
function columns() {
  const contentW = S.w - 68 - 244 - 12 - 56
  const tableW = contentW - (S.opt === "B" ? 296 : 0)
  const auto = { req: tableW >= 900, loc: tableW >= 640 }
  const on = (k) => S.cols[k] ?? auto[k]
  const cols = [{ k: "item", h: "Item" }]
  if (on("loc")) cols.push({ k: "loc", h: "Location", w: 108 })
  if (on("req")) cols.push({ k: "req", h: "Requested by", w: 168 })
  cols.push(S.tab === "REJECTED" ? { k: "why", h: "Reason", w: 220 } : { k: "need", h: "Needed by", w: 132 })
  cols.push({ k: "est", h: S.tab === "DONE" ? "Billed" : "Estimate", w: 136, num: true })
  cols.push({ k: "status", h: "Status", w: 124 })
  return { cols, on, auto }
}

// ── pieces ────────────────────────────────────────────────────────────────
const head = () => `<div class="head"><h1>Supply Requests</h1><button class="btn primary">${svg("plus", "i s")}Request supplies</button></div>`

function kpis(v) {

const tabs = (v) => `<div class="tabs" role="tablist">${[["OPEN", "Open"], ["DONE", "Completed"], ["REJECTED", "Rejected"]].map(([k, l]) => `<button class="tab ${S.tab === k ? "on" : ""}" role="tab" data-tab="${k}">${l} <span class="n">${v.tabs[k]}</span></button>`).join("")}</div>`

function popCls(name) { return S.menu === name && S.shown === name ? "in" : "" }

function locMenu() {

function colsMenu() {
  const { on } = columns()

  return `<div class="anchor"><button class="ghost ${S.menu === "cols" ? "open" : ""}" data-menu="cols">${svg("columns", "i s")}Columns</button>${S.menu === "cols" ? `<div class="pop right ${popCls("cols")}" data-pop>${items.map(([k, l]) => `<button class="mi" data-col="${k}"><span class="box ${on(k) ? "on" : ""}">${on(k) ? svg("check", "i s") : ""}</span>${l}</button>`).join("")}</div>` : ""}</div>`

function token(kind, ic, label, fresh) {
  return `<span class="token ${fresh ? "new" : ""}">${svg(ic, "i s")}${esc(label)}<button class="x" data-clear="${kind}" aria-label="Remove ${esc(label)}">${svg("x", "i s")}</button></span>`
}

let prevCat = null, prevSite = null
function filterPanel(v) {
  const catTile = (k, ic, name, n) => `<button class="tile ${S.cat === k ? "on" : ""} ${n === 0 && S.cat !== k ? "zero" : ""}" data-cat="${k ?? ""}" role="radio" aria-checked="${S.cat === k}">${svg(ic, "i s")}<span class="t">${esc(name)}</span><span class="n">${n}</span></button>`
  const siteTile = (k, l) => `<button class="tile ${S.site === k ? "on" : ""}" data-site="${k ?? ""}" role="radio" aria-checked="${S.site === k}">${svg(k ? "pin" : "grid", "i s")}<span class="t">${l}</span></button>`
  return `<div class="pop filter ${popCls("filter")}" data-pop>
    <div class="sec"><div class="lab">Category</div><div class="tiles" role="radiogroup" aria-label="Category">${catTile(null, "grid", "All", v.all)}${CATS.map((c) => catTile(c.k, c.ic, c.name, v.counts[c.k])).join("")}</div></div>
    <div class="sec"><div class="lab">Location</div><div class="tiles four" role="radiogroup" aria-label="Location">${siteTile(null, "All")}${SITES.map(([k, l]) => siteTile(k, l)).join("")}</div></div>
    ${S.cat || S.site ? `<div class="pf"><button class="tint" data-clear="all">Clear filters</button></div>` : ""}
  </div>`
}

function bar(v) {
  const search = `<label class="search">${svg("search", "i s")}<input id="q" placeholder="Search requests" value="${esc(S.q)}" autocomplete="off" /></label>`
  const late = S.tab === "OPEN" ? `<button class="swp ${S.late ? "on" : ""}" data-act="late" role="switch" aria-checked="${S.late}"><span class="sw"></span>Overdue <span class="n">${v.kpi.late}</span></button>` : ""
  const freshCat = S.cat !== prevCat, freshSite = S.site !== prevSite
  const catTok = S.cat ? token("cat", CAT[S.cat].ic, CAT[S.cat].name, freshCat) : ""
  if (S.opt === "D") {
    const n = (S.cat ? 1 : 0) + (S.site ? 1 : 0)
    const filter = `<div class="anchor"><button class="ghost ${S.menu === "filter" ? "open" : ""}" data-menu="filter">${svg("filter", "i s")}Filter${n ? ` <span class="n">${n}</span>` : ""}</button>${S.menu === "filter" ? filterPanel(v) : ""}</div>`
    const siteTok = S.site ? token("site", "pin", SITE[S.site], freshSite) : ""
    return `<div class="bar">${search}${filter}${late}${catTok}${siteTok}<span class="sp"></span>${colsMenu()}</div>`
  }
  if (S.opt === "E") return `<div class="bar">${search}${late}${locMenu()}${catTok}<span class="sp"></span>${colsMenu()}</div>`
  return `<div class="bar">${search}${late}${locMenu()}<span class="sp"></span>${colsMenu()}</div>`
}

function chip(k, ic, name, n, extra = "") {
  return `<button class="chip ${S.cat === k ? "on" : ""}" data-cat="${k ?? ""}" role="radio" aria-checked="${S.cat === k}" ${extra}>${svg(ic, "i s")}${esc(name)} <span class="n">${n}</span></button>`

function chipsRow(v) {
  if (S.opt === "NOW") return `<div class="chips" role="radiogroup" aria-label="Category">${chip(null, "grid", "All", v.all)}${CATS.map((c) => chip(c.k, c.ic, c.name, v.counts[c.k])).join("")}</div>`
  if (S.opt === "A") {
    const used = CATS.filter((c) => v.counts[c.k] > 0 || S.cat === c.k).sort((a, b) => v.counts[b.k] - v.counts[a.k])
    if (used.length < 2 && !S.cat) return ""
    return `<div class="chips ${S.more ? "" : "one"}" id="chips" role="radiogroup" aria-label="Category">${chip(null, "grid", "All", v.all)}${used.map((c) => chip(c.k, c.ic, c.name, v.counts[c.k])).join("")}<button class="chip more" data-act="more"><span>+9</span></button></div>`

}

function sideList(v) {
  const it = (k, ic, name, n) => `<button class="cl ${S.cat === k ? "on" : ""} ${n === 0 && S.cat !== k ? "zero" : ""}" data-cat="${k ?? ""}" role="radio" aria-checked="${S.cat === k}">${svg(ic, "i s")}<span class="t">${esc(name)}</span><span class="n">${n}</span></button>`
  return `<nav class="catlist" role="radiogroup" aria-label="Category">${it(null, "grid", "All", v.all)}${CATS.map((c) => it(c.k, c.ic, c.name, v.counts[c.k])).join("")}</nav>`

function cell(c, r) {
  switch (c.k) {
    case "item": {
      const cat = CAT[r.cat]
      const asFilter = S.opt === "E"
      const tile = asFilter
        ? `<button class="tl ${S.cat === r.cat ? "on" : ""}" data-cat="${r.cat}" title="Only ${esc(cat.name)}">${svg(cat.ic, "i s")}</button>`
        : `<span class="tl">${svg(cat.ic, "i s")}</span>`
      const word = S.opt === "C" ? "" : asFilter
        ? ` · <button class="catw ${S.cat === r.cat ? "on" : ""}" data-cat="${r.cat}">${esc(cat.name)}</button>`
        : ` · ${esc(cat.name)}`
      return `<td><div class="itm">${tile}<div class="itx"><div class="nm">${esc(r.item)}</div><div class="sub">${num(r.qty)} ${r.unit}${word}</div></div></div></td>`
    }
    case "loc": return `<td>${SITE[r.site]}</td>`
    case "req": return `<td>${esc(r.by)}</td>`
    case "need": return `<td class="${isLate(r) ? "bad" : ""}">${day(r.need)}</td>`
    case "why": return `<td class="why">${esc(r.why)}</td>`
    case "est": return `<td class="num">${rp(S.tab === "DONE" ? r.billed : r.est)}</td>`
    case "status": return `<td><span class="st ${r.status.toLowerCase()}">${r.status}</span></td>`
  }
}

function table(v) {
  const { cols } = columns()
  const money = (r) => (S.tab === "DONE" ? r.billed : r.est)
  const colgroup = `<colgroup>${cols.map((c) => `<col ${c.w ? `style="width:${c.w}px"` : ""}>`).join("")}</colgroup>`
  const thead = `<thead><tr>${cols.map((c) => c.k === "need" ? `<th><button class="srt ${S.dir < 0 ? "desc" : ""}" data-act="sort">${c.h}${svg("chevUp", "i")}</button></th>` : `<th class="${c.num ? "num" : ""}">${c.h}</th>`).join("")}</tr></thead>`
  const row = (r) => `<tr>${cols.map((c) => cell(c, r)).join("")}</tr>`
  const estAt = cols.findIndex((c) => c.k === "est")
  let body
  if (!v.shown.length) body = `<tr class="empty"><td colspan="${cols.length}">${S.q ? "Nothing matches your search." : S.late ? "Nothing is overdue." : "No request matches these filters."}</td></tr>`
  else if (S.opt === "C") {
    body = CATS.filter((c) => v.shown.some((r) => r.cat === c.k)).map((c) => {
      const rows = v.shown.filter((r) => r.cat === c.k)
      const folded = S.fold.has(c.k)
      const sub = rows.reduce((s, r) => s + money(r), 0)
      return `<tr class="grp ${folded ? "folded" : ""}" data-fold="${c.k}" aria-expanded="${!folded}"><td colspan="${estAt}"><span class="gh">${svg("chevR", "i s chev")}${svg(c.ic, "i s")}${esc(c.name)}<span class="n">${rows.length}</span></span></td><td class="num">${rp(sub)}</td><td></td></tr>${folded ? "" : rows.map(row).join("")}`
    }).join("")
  } else body = v.shown.map(row).join("")
  const total = v.shown.reduce((s, r) => s + money(r), 0)
  const foot = `<tfoot><tr><td colspan="${estAt}" class="cnt"><b>${v.shown.length}</b> request${v.shown.length === 1 ? "" : "s"}</td><td class="num">${rp(total)}</td><td></td></tr></tfoot>`
  return `<div class="frame"><table>${colgroup}${thead}<tbody>${body}</tbody>${foot}</table></div>`
}

// ── render ───────────────────────────────────────────────────────────────
function render() {
  document.querySelectorAll("[data-opt]").forEach((b) => b.classList.toggle("on", b.dataset.opt === S.opt))
  document.querySelectorAll("[data-data]").forEach((b) => b.classList.toggle("on", b.dataset.data === S.data))
  document.querySelectorAll("[data-w]").forEach((b) => b.classList.toggle("on", +b.dataset.w === S.w))
  $("#note").innerHTML = NOTES[S.opt]
  fitZoom()
  const v = view()
  const q = document.activeElement?.id === "q" ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null
  const body = S.opt === "B" ? `<div class="split">${sideList(v)}${table(v)}</div>` : table(v)
  $("#card").innerHTML = head() + `<div class="content">${kpis(v)}${tabs(v)}${bar(v)}${chipsRow(v)}${body}</div>`
  prevCat = S.cat; prevSite = S.site
  if (q) { const el = $("#q"); el.focus(); el.setSelectionRange(q[0], q[1]) }
  if (S.opt === "A") fitChips()
  const pop = $("[data-pop]:not(.in)")
  // Flush the closed style, then open: the transition runs once, on the press
  // that opened it, never on a re-render while it is open.
  if (pop) { getComputedStyle(pop).opacity; pop.classList.add("in"); S.shown = S.menu }
}

// A: one line — what does not fit folds into +N; the chosen chip always stays.
function fitChips() {
  const box = $("#chips"); if (!box) return
  const more = $(".more", box)
  if (S.more) { more.hidden = true; return }
  const kids = [...box.children].filter((c) => c !== more)
  const gap = 6, avail = box.clientWidth
  const widths = kids.map((k) => k.offsetWidth)
  const total = widths.reduce((a, w) => a + w + gap, -gap)
  if (total <= avail) { more.hidden = true; return }
  const moreW = more.offsetWidth + gap
  let x = 0
  const keep = kids.map((k, i) => { const w = widths[i] + (i ? gap : 0); if (x + w + moreW <= avail) { x += w; return true } return false })
  const on = kids.findIndex((k) => k.classList.contains("on"))
  if (on > 0 && !keep[on]) {
    keep[on] = true; x += widths[on] + gap
    for (let i = keep.length - 1; i > 0 && x + moreW > avail; i--) if (keep[i] && i !== on) { keep[i] = false; x -= widths[i] + gap }
  }
  let hid = 0
  kids.forEach((k, i) => { if (!keep[i]) { k.hidden = true; hid++ } })
  $("span", more).textContent = "+" + hid
}

function fitZoom() {
  const app = $("#app")
  app.style.width = S.w + "px"
  app.style.zoom = Math.min(1, window.innerWidth / S.w)
}

function closeMenu(then) {
  const pop = $("[data-pop].in")
  const done = () => { S.menu = null; S.shown = null; then?.(); render() }
  if (!pop || matchMedia("(prefers-reduced-motion: reduce)").matches) return done()
  pop.classList.add("out"); pop.classList.remove("in")
  setTimeout(done, 120)
}

// ── events ───────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-fold]")
  // A press outside closes the open menu: animated when that is all it does,
  // at once when the press also does something else.
  if (S.menu && !e.target.closest(".anchor")) {
    if (!t) return closeMenu()
    S.menu = null; S.shown = null
  }
  if (!t) return
  const d = t.dataset
  if (d.opt) { S.opt = d.opt; S.more = false; S.menu = null; S.shown = null; save(); return render() }
  if (d.data) { S.data = d.data; S.cat = null; S.site = null; S.stage = null; S.late = false; S.more = false; S.fold.clear(); save(); return render() }
  if (d.w) { S.w = +d.w; S.more = false; save(); return render() }
  if (d.menu) { if (S.menu === d.menu) return closeMenu(); S.menu = d.menu; S.shown = null; return render() }
  if (d.kpi) {
    S.tab = "OPEN"
    if (d.kpi === "late") S.late = !S.late
    else S.stage = S.stage === d.kpi ? null : d.kpi
    return render()
  }
  if (d.tab) { S.tab = d.tab; S.stage = null; S.late = false; return render() }
  if (d.act === "late") { S.late = !S.late; return render() }
  if (d.act === "more") { S.more = true; return render() }
  if (d.act === "sort") { S.dir = -S.dir; return render() }
  if (d.cat !== undefined) {
    const k = d.cat || null
    // E: the row's category toggles; the radios (chips, list, tiles) just choose
    S.cat = S.opt === "E" && S.cat === k ? null : k
    S.more = false
    return render()
  }
  if (d.site !== undefined) {
    S.site = d.site || null
    return S.menu === "loc" ? closeMenu() : render()
  }
  if (d.col) { const { on } = columns(); S.cols[d.col] = !on(d.col); return render() }
  if (d.clear) {
    if (d.clear === "cat" || d.clear === "all") S.cat = null
    if (d.clear === "site" || d.clear === "all") S.site = null
    return render()
  }
  if (d.fold) { S.fold.has(d.fold) ? S.fold.delete(d.fold) : S.fold.add(d.fold); return render() }
  render()
})
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render() } })
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.menu) return closeMenu()
  if (e.target.closest("input")) return
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const i = OPTS.indexOf(S.opt) + (e.key === "ArrowRight" ? 1 : -1)
    if (OPTS[i]) { S.opt = OPTS[i]; S.more = false; S.menu = null; save(); render() }
  }
})
addEventListener("resize", () => { fitZoom(); if (S.opt === "A") render() })

$("#rail").innerHTML = ["grid", "box", "store", "users", "chat", "printer"].map((n, i) => `<div class="ri ${n === "chat" ? "on" : ""}">${svg(n)}</div>`).join("") + `<div class="sp"></div><div class="av">A</div>`
render()
</script>
</body>
</html>
