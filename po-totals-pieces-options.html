<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PO totals · short, over, not as ordered</title>
<style>
/* Hub tokens, as po-detail-clear.html */
:root{--ink:#20242c;--text:#394150;--body:#565f6d;--mute:#666f7d;--faint:#b9c0c9;
  --canvas:#fff;--soft:#f8f8f9;--soft-2:#f0f0f2;--soft-3:#f6f6f7;--hairline:#e6e6e9;--hairline-2:#dadade;
  --accent:#2563eb;--ok-fg:#137a37;--warn-fg:#a64a08;--bad-fg:#be123c;
  --r-card:10px;--r-inner:8px;--shadow-soft:0 1px 3px rgb(24 39 60/4%);--shadow-pop:0 4px 8px rgb(24 39 60/4%),0 12px 32px rgb(24 39 60/8%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/20px Inter,system-ui,sans-serif;color:var(--text);background:var(--soft-3);-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--canvas);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:20}
.top h1{font-size:15px;font-weight:600;color:var(--ink)}
.top .ref{color:var(--body);margin-left:auto}
.top .ref b{font-weight:500;color:var(--ink)}
.page{padding:20px;display:grid;gap:32px}
.opt>h2{font-size:15px;line-height:22px;font-weight:600;color:var(--ink);margin-bottom:12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.opt>h2 b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;font-size:14px;font-weight:600}
.opt>h2 .note{font-size:14px;font-weight:400;color:var(--body)}
.opt>h2 .star{color:var(--warn-fg);font-weight:500;font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(560px,100%),1fr));gap:16px}
.frame{background:var(--canvas);border-radius:12px;box-shadow:var(--shadow-soft),0 0 0 1px var(--hairline);padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.frame h4{font-size:14px;font-weight:500;color:var(--mute)}
.frame h4 b{font-weight:500;color:var(--ink)}

/* items, as the sheet draws them */
.itw{border:1px solid var(--hairline);border-radius:var(--r-inner);overflow-x:auto}
table.items{width:100%;min-width:32rem;border-collapse:collapse;table-layout:fixed}
.items th{height:36px;padding:0 12px;text-align:right;font-weight:500;color:var(--body);background:var(--canvas);border-bottom:1px solid var(--hairline);white-space:nowrap}
.items th:first-child,.items td:first-child{text-align:left}
.items td{padding:10px 12px;text-align:right;color:var(--ink);border-top:1px solid var(--hairline);vertical-align:top;font-variant-numeric:tabular-nums;white-space:nowrap}
.items tbody tr:first-child td{border-top:0}
.items tfoot td{background:var(--soft-2);border-top:1px solid var(--hairline);font-weight:500;color:var(--body)}
.items tfoot td.v{color:var(--warn-fg)}
.it{white-space:normal}
.it small{display:block;color:var(--body);font-size:14px;line-height:20px}
.under{color:var(--body);font-size:14px;display:block;font-weight:400}
.bad{color:var(--bad-fg)}
.warn{color:var(--warn-fg)}
.dash{color:var(--faint)}

/* totals: one box, two halves */
.two{display:flex;justify-content:flex-end}
.tbox{display:flex;align-items:stretch;background:var(--soft);border:1px solid var(--hairline);border-radius:var(--r-card);font-size:15px;font-variant-numeric:tabular-nums;max-width:100%}
.tbox dl{display:grid;grid-template-columns:auto auto;gap:8px 28px;align-content:start;padding:10px 14px}
.tbox dl+dl{border-left:1px solid var(--hairline-2)}
.tbox dt{color:var(--ink)}
.tbox dd{text-align:right;font-weight:600;color:var(--ink)}
.tbox dt.l{color:var(--body);font-weight:400}
.tbox dd.l{font-weight:400;color:var(--ink)}
.tbox dt.s,.tbox dd.s{color:var(--body);font-weight:400;font-size:14px;margin-top:-4px}
.tbox dt.s{padding-left:14px}
.tbox dt small{color:var(--mute);font-size:14px;margin-left:6px}
.tbox hr{grid-column:1/-1;border:0;border-top:1px solid var(--hairline-2)}
.tbox dd.bad{color:var(--bad-fg)}
.tbox dd.warn{color:var(--warn-fg)}
/* on a phone the halves stack, as the sheet's own box does */
@media(max-width:560px){.two{justify-content:stretch}.tbox{flex-direction:column;width:100%}.tbox dl{grid-template-columns:1fr auto}.tbox dl+dl{border-left:0;border-top:1px solid var(--hairline-2)}.top .ref{margin-left:0}}
</style>
</head>
<body>
<header class="top">
  <h1>PO totals · when less, more, or not as ordered came</h1>
  <span class="ref">Words from Review Count (owner, 10 Oct 2026): <b>Total Accepted</b> · <b>Not as Ordered</b> · <b>To Be Returned</b></span>
</header>
<div class="page" id="page"></div>

<script>
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID')
const money = n => n < 0 ? '–' + rp(-n) : rp(n)
const num = n => Math.round(n).toLocaleString('id-ID')
const pcs = n => num(n) + ' pcs'
const LINES = [
  {name:'Kemeja Gelambir', filed:'Pria · Kemeja', q:200, price:40000},
  {name:'Kaos Uji UJI3', filed:'Pria · Kaos', q:120, price:35000},
  {name:'Celana Chino Slim', filed:'Pria · Celana', q:80, price:90000}
]
/* The six things that can happen. rec = pieces that matched the order (accepted into stock);
   extra = pieces over a line; nao = pieces matching no line at all; short = closed short. */
const STATES = [
  {id:'part', n:'Part received', sub:'320 of 400 came', life:'PART', rec:[200, 120, 0]},
  {id:'short', n:'Closed short', sub:'360 came, 40 never will', life:'SHORT', rec:[200, 120, 40], short:40},
  {id:'over', n:'Extra', sub:'430 came, 30 over on Kemeja', life:'FULL', rec:[200, 120, 80], extra:[30, 0, 0]},
  {id:'nao', n:'Not as ordered', sub:'400 matched, 12 matched nothing', life:'FULL', rec:[200, 120, 80], nao:12},
  {id:'overnao', n:'Extra + not as ordered', sub:'400 matched, 30 over, 12 unknown', life:'FULL', rec:[200, 120, 80], extra:[30, 0, 0], nao:12},
  {id:'partover', n:'Part received + extra', sub:'320 matched, 30 over, 80 still to come', life:'PART', rec:[200, 120, 0], extra:[30, 0, 0]}
]
function fig(st) {
  const pieces = LINES.reduce((s, l) => s + l.q, 0)
  const gross = LINES.reduce((s, l) => s + l.q * l.price, 0)
  const accepted = st.rec.reduce((s, n) => s + n, 0)
  const over = (st.extra || [0, 0, 0]).reduce((s, n) => s + n, 0)
  const nao = st.nao || 0, short = st.short || 0
  const shortGross = short * LINES[2].price
  const discount = Math.round((gross - shortGross) * .025)
  return {pieces, gross, accepted, over, nao, short, toReturn: over + nao, delivered: accepted + over + nao, owed: pieces - accepted - short, shortGross, discount, grand: gross - shortGross - discount}
}

/* ── the options: what the pieces half of the box says ── */
const r = (t, v, c = '') => `<dt class="${c}">${t}</dt><dd class="${c}">${v}</dd>`
const gap = (st, f) => st.life === 'SHORT' ? r('Short', pcs(f.short), 'bad') : f.owed > 0 ? r('Still Expected', pcs(f.owed)) : ''
const OPTS = [
 {id:'A', n:'Review Count\'s three words', note:'Total Accepted · Still Expected / Short · Not as Ordered · To Be Returned. The over is not named in the box — it is on its row — only its sum is.',
  box(st, f){ let h = r('Total Accepted', pcs(f.accepted)) + gap(st, f); if (f.nao) h += r('Not as Ordered', pcs(f.nao), 'warn'); if (f.toReturn) h += r('To Be Returned', pcs(f.toReturn), 'bad'); return h }},
 {id:'B', n:'Every kind named', note:'Total Accepted · Still Expected / Short · Over · Not as Ordered, then a line and To Be Returned as their sum. The fullest ledger.',
  box(st, f){ let h = r('Total Accepted', pcs(f.accepted)) + gap(st, f); if (f.over) h += r('Over', '+' + pcs(f.over), 'warn'); if (f.nao) h += r('Not as Ordered', pcs(f.nao), 'warn'); if (f.toReturn) h += '<hr>' + r('To Be Returned', pcs(f.toReturn), 'bad'); return h }},
 {id:'C', n:'From what came, down to what stays', note:'Delivered, minus Not as Ordered, minus Over, a line, Total Accepted — the same shape as the money half (Total → Discount → Grand Total). Then Still Expected / Short.',
  box(st, f){ let h = ''; if (f.toReturn) { h += r('Delivered', pcs(f.delivered), 'l'); if (f.nao) h += r('Not as Ordered', '–' + pcs(f.nao), 'l'); if (f.over) h += r('Over', '–' + pcs(f.over), 'l'); h += '<hr>' } h += r('Total Accepted', pcs(f.accepted)) + gap(st, f); return h }},
 {id:'D', n:'In, then back — with its parts', note:'Total Accepted and Still Expected / Short; a line; To Be Returned with Over and Not as Ordered as small indented parts under it.',
  box(st, f){ let h = r('Total Accepted', pcs(f.accepted)) + gap(st, f); if (f.toReturn) { h += '<hr>' + r('To Be Returned', pcs(f.toReturn), 'bad'); if (f.over) h += r('Over', pcs(f.over), 's'); if (f.nao) h += r('Not as Ordered', pcs(f.nao), 's') } return h }},
 {id:'E', n:'Against the order', note:'Ordered first, so the gap reads as arithmetic: Ordered · Total Accepted · Still Expected / Short; a line; what came beyond the order.',
  box(st, f){ let h = r('Ordered', pcs(f.pieces), 'l') + r('Total Accepted', pcs(f.accepted)) + gap(st, f); if (f.toReturn) { h += '<hr>'; if (f.nao) h += r('Not as Ordered', pcs(f.nao), 'warn'); if (f.over) h += r('Over', '+' + pcs(f.over), 'warn') } return h }},
 {id:'F', n:'As Review Count draws it', note:'Not as Ordered is a row at the foot of the table, where the review puts it; the box is the column\'s sums: Total Accepted (the black figures) · Still Expected / Short · To Be Returned (the amber ones).', star:true, tfoot:true,
  box(st, f){ let h = r('Total Accepted', pcs(f.accepted)) + gap(st, f); if (f.toReturn) h += r('To Be Returned', pcs(f.toReturn), 'bad'); return h }}
]

function frame(opt, st) {
  const f = fig(st)
  const recCell = i => { const rec = st.rec[i], l = LINES[i], ex = (st.extra || [0, 0, 0])[i]; if (rec <= 0) return '<span class="dash">—</span>'; let u = ''; if (ex) u += `<span class="under warn">+${num(ex)} over</span>`; if (st.life === 'SHORT' && i === 2) u += `<span class="under bad">${num(st.short)} short</span>`; else if (st.life === 'PART' && l.q > rec) u += `<span class="under">${num(l.q - rec)} still expected</span>`; return pcs(rec) + u }
  const rows = LINES.map((l, i) => `<tr><td><div class="it">${l.name}<small>${l.filed}</small></div></td><td>${pcs(l.q)}</td><td>${recCell(i)}</td><td style="font-weight:500">${rp(l.q * l.price)}</td></tr>`).join('')
  const tfoot = opt.tfoot && f.nao ? `<tfoot><tr><td>Not as Ordered</td><td></td><td class="v">${pcs(f.nao)}</td><td></td></tr></tfoot>` : ''
  const table = `<div class="itw"><table class="items"><colgroup><col><col style="width:6.5rem"><col style="width:8.5rem"><col style="width:8rem"></colgroup><thead><tr><th>Item</th><th>Quantity</th><th>Received</th><th>Amount</th></tr></thead><tbody>${rows}</tbody>${tfoot}</table></div>`
  let m = r('Total', money(f.gross), 'l')
  if (f.short) m += r(`Closed Short<small>${pcs(f.short)}</small>`, money(-f.shortGross), 'l')
  m += r('Discount · 2,5%', money(-f.discount), 'l') + '<hr>' + r('Grand Total', money(f.grand))
  return `<div class="frame"><h4><b>${st.n}</b> · ${st.sub}</h4>${table}<div class="two"><div class="tbox"><dl>${opt.box(st, f)}</dl><dl>${m}</dl></div></div></div>`
}
document.getElementById('page').innerHTML = OPTS.map(o => `<section class="opt"><h2><b>${o.id}</b>${o.n}${o.star ? '<span class="star">★ my pick</span>' : ''}<span class="note">${o.note}</span></h2><div class="row">${STATES.map(st => frame(o, st)).join('')}</div></section>`).join('')
</script>
</body>
</html>
