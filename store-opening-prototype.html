<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stores, people and POS · Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Measured on the running hub (pos-e2e :5480, 8 Oct 2026): Receiving list,
   Review Count dialog, PO sheet, Count receive sheet. */
:root {
  --ink: #20242c; --text: #394150; --body: #565f6d; --mute: #666f7d; --faint: #89919d;
  --hairline: #e6e6e9; --edge: #dadade; --soft: #f8f8f9; --soft-2: #f0f0f2; --soft-3: #f6f6f7;
  --accent: #2563eb; --info-fg: #2c57bf; --tint: #eff5ff;
  --bad-fg: #be123c; --bad-bg: #fbeaea; --warn-fg: #a64a08; --ok-fg: #137a37;
  --rail: #242526;
  --r-card: 10px; --r-inner: 8px; --r-sheet: 16px;
  --shadow-soft: 0 1px 3px rgba(24, 39, 60, .04);
  --shadow-sheet: 0 8px 24px rgba(24, 39, 60, .06), 0 24px 64px rgba(24, 39, 60, .12);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font: 400 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: -0.09px; color: var(--ink); background: #fff;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.75; flex-shrink: 0; }

/* ── prototype bar ───────────────────────────────────────── */
.proto {
  position: fixed; inset: 0 0 auto 0; z-index: 100; min-height: 48px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px;
  background: #fff; border-bottom: 1px solid var(--hairline);
}
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--soft-2); border-radius: 10px; }
.seg button { height: 30px; padding: 0 12px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--body); transition: background-color 150ms ease, color 150ms ease; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(24, 39, 60, .08), 0 0 0 1px var(--hairline); }
.seg .live { margin-left: 6px; font-size: 14px; color: var(--ok-fg); }
.proto .reset { margin-left: auto; height: 30px; padding: 0 10px; border-radius: 7px; font-size: 14px; color: var(--body); }
.proto .reset:hover { background: var(--soft-2); }

/* ── shell ───────────────────────────────────────────────── */
.shell { position: fixed; inset: 48px 0 0 0; display: grid; grid-template-columns: 68px 232px minmax(0, 1fr); }
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; }
.rail .logo { width: 28px; height: 28px; border-radius: 8px; background: #fff; color: var(--rail); font-weight: 700; display: grid; place-items: center; margin-bottom: 14px; font-size: 16px; }
.rail .ic { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: #b9bcc2; position: relative; }
.rail .ic.on { background: rgba(255, 255, 255, .1); color: #fff; }
.rail .gap { flex: 1; }
.rail .badge { position: absolute; top: 2px; right: 1px; background: var(--accent); color: #fff; font-size: 14px; line-height: 16px; padding: 0 4px; border-radius: 8px; transform: scale(.75); transform-origin: top right; }
.rail .me { width: 28px; height: 28px; border-radius: 50%; background: #3a3b3d; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 600; margin-top: 6px; }
.dept { background: #fff; border-right: 1px solid var(--hairline); display: flex; flex-direction: column; }
.dept .head { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 600; }
.dept .head svg { color: var(--mute); }
.dept nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.dept nav a { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; }
.dept nav a.on { background: var(--tint); color: var(--accent); font-weight: 500; }
.dept nav a .n { color: var(--warn-fg); font-size: 14px; }
.dept .addstore { margin: 2px 12px 10px; justify-content: center; }
.dept .dsearch { margin: 0 12px 8px; position: relative; }
.dept .dsearch input { width: 100%; height: 34px; border: 1px solid var(--edge); border-radius: 8px; padding: 0 10px 0 32px; font-size: 14px; background: #fff; outline: none; }
.dept .dsearch input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
.dept .dsearch svg { position: absolute; left: 10px; top: 8px; width: 16px; height: 16px; color: var(--mute); }
.dept nav { overflow-y: auto; flex: 1; }
.dept nav .grp { font-size: 14px; color: var(--mute); padding: 12px 10px 4px; }
.dept nav a .sname { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dept nav a .sname em { font-style: normal; font-family: var(--mono); font-size: 14px; color: var(--mute); }
.dept nav a .cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; display: grid; place-items: center; line-height: 1; transform: scale(.85); }
.dept nav a { cursor: pointer; }
.dept .clock { margin-top: auto; border-top: 1px solid var(--hairline); height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 14px; color: var(--text); }
.content { overflow-y: auto; padding: 14px 32px 40px; }
.page-title { font-size: 15px; font-weight: 600; margin: 0 0 8px; line-height: 22px; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 18px; }
.tabs span { padding: 8px 12px 10px; font-size: 14px; font-weight: 500; color: var(--body); position: relative; }
.tabs span.on { color: var(--ink); }
.tabs span.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }

/* cards + tables */
.card { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: hidden; }
table { border-collapse: collapse; width: 100%; }
.dt th { height: 40px; padding: 0 12px; background: var(--soft); border-bottom: 1px solid var(--hairline); color: var(--body); font-size: 14px; font-weight: 500; letter-spacing: .04em; text-align: left; white-space: nowrap; }
.dt td { padding: 12px; color: var(--text); border-bottom: 1px solid var(--hairline); vertical-align: middle; }
.dt tbody tr:last-child td { border-bottom: 0; }
.dt tr.row { height: 75px; }
.dt tr.click { cursor: pointer; transition: background-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .dt tr.click:hover { background: var(--soft); } }
.r { text-align: right !important; }
.two { display: flex; flex-direction: column; line-height: 20px; gap: 2px; min-width: 0; }
.two .a { color: var(--ink); font-weight: 500; }
.two .b { color: var(--mute); font-size: 14px; }
.two .q { color: var(--body); }
.counted { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 20px; }
.counted b { font-weight: 500; color: var(--ink); }
.counted span { color: var(--mute); font-size: 14px; }

/* buttons */
.btn { height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; font-size: 15px; font-weight: 500; white-space: nowrap; transition: transform 160ms var(--ease-out), background-color 150ms ease, opacity 150ms ease; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.soft { background: var(--soft-2); border: 1px solid var(--edge); color: var(--ink); box-shadow: var(--shadow-soft); }
.btn.ghost { color: var(--ink); }
.btn.ghost:hover { background: var(--soft-2); }
.btn.tint { height: 32px; padding: 0 14px; background: var(--tint); color: var(--accent); font-weight: 600; }
.btn.icon { width: 36px; padding: 0; justify-content: center; }
.btn.sm { height: 32px; }

/* list stamps + status words */
.stamp-s { display: inline-block; transform: rotate(-6deg); border: 2px solid currentColor; border-radius: 6px; padding: 1px 8px; font-size: 14px; font-weight: 700; letter-spacing: .1em; line-height: 17px; text-align: center; opacity: .55; white-space: nowrap; }
.ok { color: var(--ok-fg); } .bad { color: var(--bad-fg); } .warn { color: var(--warn-fg); } .info { color: var(--info-fg); }

/* KPI strip + toolbar (PO list) */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 12px 16px; box-shadow: var(--shadow-soft); }
.kpi .l { font-size: 14px; color: var(--body); }
.kpi .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.field { height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 8px; font-size: 14px; color: var(--mute); background: #fff; }

/* ── sheets / dialogs ────────────────────────────────────── */
.scrim { position: fixed; inset: 48px 0 0 0; background: rgba(248, 248, 249, .72); z-index: 20; transition: opacity 200ms ease; }
.scrim.top { z-index: 40; background: rgba(248, 248, 249, .5); }
.sheet {
  position: fixed; top: 68px; right: 20px; bottom: 20px; z-index: 30; width: min(928px, calc(100vw - 40px));
  background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-sheet); box-shadow: var(--shadow-sheet);
  display: flex; flex-direction: column; overflow: hidden;
  transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
}
.sheet.review { width: min(896px, calc(100vw - 40px)); }
.sheet.top { z-index: 50; }
.enter-from { opacity: 0 !important; transform: translateX(12px) scale(.99); }
.scrim.enter-from { transform: none; }
.sh-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 12px 28px; border-bottom: 1px solid var(--hairline); min-height: 68px; }
.sh-head h2 { margin: 0; font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: -0.18px; }
.sh-head h2.s16 { font-size: 16px; line-height: 23px; display: flex; align-items: center; gap: 8px; }
.sh-head .sub { color: var(--mute); }
.sh-head .x { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); margin-top: 6px; margin-right: -6px; }
.sh-head .x:hover { background: var(--soft-2); }
.sh-body { flex: 1; overflow-y: auto; padding: 20px 28px 28px; display: flex; flex-direction: column; gap: 18px; position: relative; }
.sh-body > * { flex-shrink: 0; }
.sh-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--hairline); }
.sh-foot .grow { flex: 1; }
.sh-foot .said { color: var(--body); }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
.facts .l { font-size: 14px; color: var(--body); line-height: 18px; }
.facts .v { font-size: 14px; color: var(--ink); line-height: 22px; margin-top: 4px; }
.factline { display: flex; flex-wrap: wrap; gap: 8px 48px; }
.factline span { color: var(--mute); margin-right: 10px; }

/* tables inside sheets */
.st { border: 1px solid var(--hairline); border-radius: var(--r-card); overflow: hidden; }
.st th { padding: 10px 16px; background: var(--soft); border-bottom: 1px solid var(--hairline); color: var(--body); font-size: 14px; font-weight: 500; text-align: left; white-space: nowrap; }
.st td { padding: 14px 16px; vertical-align: middle; border-bottom: 1px solid var(--hairline); color: var(--ink); }
.st tbody tr:last-child td { border-bottom: 0; }
.st tfoot td { background: var(--soft-2); padding: 14px 16px; border-top: 1px solid var(--hairline); }
.st tfoot tr + tr td { background: var(--soft); }
.st tr.off td { color: var(--mute); }
.st td.ok { color: var(--ok-fg); } .st td.warn { color: var(--warn-fg); } .st td.bad { color: var(--bad-fg); }
.st tr.pick { cursor: pointer; }
.st .item { display: flex; gap: 12px; align-items: flex-start; }
.st .thumb { width: 32px; height: 32px; border-radius: 6px; background: var(--soft-2); display: grid; place-items: center; color: var(--ink); flex-shrink: 0; }
.pill { display: inline-block; padding: 4px 10px; border-radius: 8px; font-weight: 500; }
.pill.bad { background: var(--bad-bg); color: var(--bad-fg); }
.pill.over { background: var(--bad-bg); color: var(--bad-fg); }
.cb { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--edge); display: inline-grid; place-items: center; background: #fff; transition: background-color 120ms ease, border-color 120ms ease; vertical-align: middle; }
.cb.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.cb.on svg { width: 13px; height: 13px; stroke-width: 3; }
.cb.dis { background: var(--soft-2); }
.note { display: flex; align-items: center; gap: 10px; padding: 0 4px; color: var(--body); }
.note b { color: var(--ink); font-weight: 500; }
.ask { display: flex; flex-direction: column; gap: 12px; }
.ask h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 23px; }
textarea { width: 100%; min-height: 88px; resize: vertical; padding: 10px 12px; border: 1px solid var(--edge); border-radius: 8px; font-size: 15px; line-height: 22px; outline: none; transition: border-color 150ms ease, box-shadow 150ms ease; }
textarea:focus, .qty:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
.qty { width: 76px; height: 34px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 8px; text-align: center; font-variant-numeric: tabular-nums; outline: none; background: #fff; }
.qty:disabled { background: var(--soft-2); color: var(--mute); }
.unit { width: 88px; height: 34px; padding: 0 10px; border: 1px solid var(--edge); border-radius: 8px; display: inline-flex; align-items: center; justify-content: space-between; background: #fff; }
.unit svg { width: 14px; height: 14px; color: var(--mute); }
.another { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--body); font-size: 14px; }
.another svg { width: 14px; height: 14px; }
.cnt { display: flex; gap: 8px; align-items: center; }

/* the PO sheet's stamp: it changes with the order, so it is pressed on, not swapped */
.stamp { position: absolute; top: 18px; right: 30px; z-index: 2; transform: rotate(-6deg); border: 2px solid currentColor; border-radius: 8px; padding: 2px 12px; font-size: 18px; font-weight: 700; letter-spacing: .14em; line-height: 26px; opacity: .4; pointer-events: none; white-space: nowrap; transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out), filter 220ms ease; }
.stamp.pressing { opacity: 0; transform: rotate(-6deg) scale(1.12); filter: blur(2px); }
.fold { display: flex; align-items: center; gap: 6px; color: var(--ink); padding-top: 16px; border-top: 1px solid var(--hairline); }
.fold svg { width: 16px; height: 16px; color: var(--mute); }
.fold .c { color: var(--mute); }
.change { color: var(--mute); font-size: 14px; line-height: 20px; }
.change.hl { color: var(--info-fg); }

/* the PO sheet's count banner (live: CountBanner) */
.banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-card); }
.banner.info { background: #eef4fd; color: var(--info-fg); }
.banner.warn { background: #fdf3ea; color: var(--warn-fg); }
.banner svg { width: 20px; height: 20px; }
.banner b { display: block; font-weight: 600; }
.banner span span { display: block; font-size: 14px; }
svg.lucide.inl { width: 15px; height: 15px; vertical-align: -2px; }
.acts { display: flex; flex-direction: column; gap: 10px; margin: 2px 0 0 22px; }
.acts li { list-style: none; display: flex; flex-direction: column; line-height: 20px; }
.acts li span { color: var(--mute); font-size: 14px; }
.acts li.new b { color: var(--info-fg); }
.acts b { font-weight: 500; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 90; transform: translate(-50%, 0); display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--ink); color: #fff; border-radius: 10px; box-shadow: var(--shadow-sheet); font-size: 15px; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
.toast.enter-from { opacity: 0; transform: translate(-50%, 8px); }
.toast svg { color: #7ee2a0; }

/* phone (414 baseline): no rail/department column, sheets full screen, actions stay in the foot */
@media (max-width: 767px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail, .dept { display: none; }
  .content { padding: 12px 16px 32px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .toolbar .field:not(:first-child), .toolbar .hide-p { display: none; }
  .hide-p { display: none; }
  .sheet, .sheet.review { top: 48px; right: 0; bottom: 0; width: 100vw; border-radius: 0; border: 0; }
  .sh-head { padding: 10px 16px; }
  .sh-body { padding: 16px; }
  .sh-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .sh-foot .btn { height: 44px; }
  .st th, .st td, .st tfoot td { padding-left: 10px; padding-right: 10px; }
  .facts { grid-template-columns: 1fr; }
  .stamp { right: 16px; top: 12px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .toast, .stamp { transition: opacity 150ms ease !important; }
  .enter-from, .toast.enter-from, .stamp.pressing { transform: none !important; filter: none !important; }
}

/* ── additions: dialogs, chips, board, store app ─────────── */
.proto label.tg { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--body); cursor: pointer; }
.proto .lbl { font-size: 14px; color: var(--mute); }
.proto a.ext { font-size: 14px; color: var(--accent); text-decoration: none; }
.dlg { position: fixed; z-index: 60; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-sheet); box-shadow: var(--shadow-sheet); overflow: hidden; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
.dlg.wide { width: min(560px, calc(100vw - 32px)); }
.dlg .d-head { padding: 20px 24px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dlg .d-head .x { width: 32px; height: 32px; margin: -4px -8px 0 0; border-radius: 8px; display: grid; place-items: center; color: var(--mute); flex-shrink: 0; }
.dlg .d-head .x:hover { background: var(--soft-2); }
.dlg h2 { margin: 0; font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: -0.18px; }
.dlg .d-body { padding: 10px 24px 18px; color: var(--body); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.dlg .d-foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 24px 20px; }
.dlg.enter-from { transform: translate(-50%, calc(-50% + 8px)) scale(.985); }
.scrim.z60 { z-index: 55; background: rgba(248, 248, 249, .55); }
.btn.danger { background: var(--bad-bg); color: var(--bad-fg); }
.btn.warnsoft { background: #fdf3ea; color: var(--warn-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 36px; padding: 0 14px; border: 1px solid var(--edge); border-radius: 18px; font-weight: 500; color: var(--text); background: #fff; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 160ms var(--ease-out); }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--tint); border-color: var(--accent); color: var(--accent); }
.lab { font-weight: 500; color: var(--ink); margin-bottom: 6px; display: block; }
.ack { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-inner); background: var(--bad-bg); color: var(--bad-fg); cursor: pointer; }
.stagerow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--hairline); }
.stagerow:first-child { border-top: 0; padding-top: 0; }
.stagerow .a { color: var(--ink); font-weight: 500; }
.stagerow .q { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.stagerow .s { grid-column: 1 / -1; color: var(--mute); }
.stagerow .s.red { color: var(--bad-fg); }
.step { display: inline-flex; align-items: center; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; background: #fff; }
.step button { width: 34px; height: 34px; display: grid; place-items: center; color: var(--text); }
.step button:hover:not(:disabled) { background: var(--soft-2); }
.step button:disabled { opacity: .35; cursor: default; }
.step input { width: 52px; height: 34px; border: 0; border-left: 1px solid var(--edge); border-right: 1px solid var(--edge); text-align: center; font-variant-numeric: tabular-nums; outline: none; background: #fff; }
.step input:focus { background: var(--tint); }

.lane-note { color: var(--mute); padding: 6px 2px 14px; }

/* board */

.tile .nm { color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
.tile .dc { color: var(--mute); }

.tile .chg { padding: 2px 14px 10px; color: var(--body); font-variant-numeric: tabular-nums; }
.tile .chg b { color: var(--ink); font-weight: 600; } .tile .chg .m { color: var(--bad-fg); font-weight: 500; }
.tile .ft { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--hairline); color: var(--mute); }
.tile.off { background-image: repeating-linear-gradient(135deg, rgba(24, 39, 60, .04) 0 6px, transparent 6px 12px); }
.tile.off .t1 { opacity: .55; }
.tile .stampb { display: grid; place-items: center; padding: 10px 0 14px; }
.tile .stampb span { transform: rotate(-7deg); border: 3px solid var(--bad-fg); color: var(--bad-fg); border-radius: 10px; padding: 0 14px; font-size: 22px; line-height: 32px; font-weight: 700; letter-spacing: .06em; }
.tile .btn.tint { height: 32px; }

/* store app (frontend-store-new) */
.phonewrap { display: grid; place-items: start center; padding: 22px 16px 40px; background: var(--soft-3); min-height: 100%; }
.phone { width: 414px; max-width: 100%; height: min(820px, calc(100vh - 110px)); border: 1px solid var(--edge); border-radius: 30px; overflow: hidden; background: var(--soft-3); position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-sheet); }

.phone .ptop .me { width: 30px; height: 30px; border-radius: 50%; background: var(--tint); color: var(--accent); display: grid; place-items: center; font-size: 14px; font-weight: 600; }

.lead { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: hidden; text-align: left; width: 100%; cursor: pointer; transition: transform 160ms var(--ease-out); }

.lead .sb { color: var(--mute); }

.lead .big span { display: block; font-size: 14px; font-weight: 400; color: var(--mute); }
.lead .l2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--hairline); color: var(--body); }
.pstrip { display: grid; grid-template-columns: 1fr 1fr; background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); }
.pstrip div { padding: 12px 16px; } .pstrip div + div { border-left: 1px solid var(--hairline); }
.pstrip b { display: block; font-size: 18px; font-weight: 600; color: var(--ink); } .pstrip span { color: var(--body); }
.psheet { position: absolute; inset: 14px 0 0 0; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(24, 39, 60, .14); display: flex; flex-direction: column; z-index: 5; transition: transform 240ms var(--ease-out), opacity 200ms ease; }

.psheet .pb { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.psheet .pf { padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hairline); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.psheet .pf .btn { height: 44px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--hairline); align-items: center; }

.passbadge { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: #fdf3ea; color: var(--warn-fg); font-weight: 500; }
.passbadge.ok { background: #e8f6e6; color: var(--ok-fg); }
.badge-s { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; font-weight: 500; white-space: nowrap; }
.badge-s.warn { background: #fdf3ea; color: var(--warn-fg); } .badge-s.ok { background: #e8f6e6; color: var(--ok-fg); } .badge-s.info { background: #eef4fd; color: var(--info-fg); } .badge-s.bad { background: var(--bad-bg); color: var(--bad-fg); }

@media (max-width: 767px) {
  .lanes { grid-template-columns: 1fr; }

  .dlg.enter-from { transform: translateY(16px); }
  .dlg .d-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .dlg .d-foot .btn { height: 44px; flex: 1; }
  .dlg .d-head, .dlg .d-body { padding-left: 16px; padding-right: 16px; }
  .chip { height: 44px; }
  .phonewrap { padding: 0; } .phone { width: 100vw; height: calc(100vh - 100px); border-radius: 0; border: 0; box-shadow: none; }
}


/* ══ New store prototype additions ══════════════════════════════════ */
:root { --barh: 48px; --ease-in-out: cubic-bezier(.77, 0, .175, 1); --okdot: #36b827; --warndot: #c9892e; --baddot: #d05151; }
.shell, .scrim { top: var(--barh); }
.proto .brand { font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; }
.proto .seg button { position: relative; }
.proto .seg button .ping { position: absolute; top: 5px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--soft-2); }
.proto .demo { height: 30px; padding: 0 12px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--accent); background: var(--tint); }
.proto .demo:active { transform: scale(.97); }

/* page header (PageHeader) */
.phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 4px 0 16px; }
.phead .crumb { font-size: 14px; color: var(--mute); }
.phead h1 { margin: 2px 0 0; font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -0.02em; }
.phead .s { color: var(--body); font-size: 14px; margin-top: 2px; }
.lnk { color: var(--accent); cursor: pointer; }

/* store rows (StoreRow) */
.slist { list-style: none; margin: 0; padding: 0; }
.srow { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); cursor: pointer; transition: background-color 150ms ease; }
.srow:last-child { border-bottom: 0; }
@media (hover: hover) and (pointer: fine) { .srow:hover { background: var(--soft-2); } }
.srow .m { flex: 1; min-width: 0; }
.srow .m b { font-weight: 600; font-size: 15px; }
.srow .m .code { font-family: var(--mono); color: var(--mute); font-size: 14px; margin-left: 8px; }
.srow .m .sub { display: block; color: var(--body); font-size: 14px; }
.srow .srv { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--body); width: 168px; }
.srow .tl { width: 150px; text-align: right; font-size: 14px; color: var(--body); }
.srow.fresh { animation: rowIn 420ms var(--ease-out) both; }
@keyframes rowIn { from { background: var(--tint); } to { background: #fff; } }
.ring { width: 34px; height: 34px; flex-shrink: 0; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; display: inline-block; }
.sdot.ok { background: var(--okdot); } .sdot.warn { background: var(--warndot); } .sdot.info { background: var(--accent); } .sdot.bad { background: var(--baddot); }
.sdot.live { animation: live 1.6s ease-in-out infinite; }
@keyframes live { 0%, 100% { box-shadow: 0 0 0 0 rgba(201, 137, 46, .35); } 50% { box-shadow: 0 0 0 5px rgba(201, 137, 46, 0); } }

/* sub tabs on the store page */
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--hairline); margin-bottom: 18px; overflow-x: auto; }
.subtabs button { padding: 8px 12px 10px; font-size: 14px; font-weight: 500; color: var(--body); position: relative; white-space: nowrap; }
.subtabs button.on { color: var(--ink); }
.subtabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.subtabs button .n { margin-left: 6px; color: var(--warn-fg); }
.col { max-width: 720px; display: flex; flex-direction: column; gap: 14px; }
.statusline { display: flex; align-items: center; gap: 8px; }
.statusline b { font-size: 15px; font-weight: 600; }
.statusline .age { font-size: 14px; color: var(--mute); }
.statusline .grow { flex: 1; }

/* the install code card */
.codecard { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
.codehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.codehead .l { font-size: 14px; color: var(--body); }

.copy { display: inline-flex; align-items: center; gap: 6px; }

.machinetabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--soft-2); border-radius: 10px; align-self: flex-start; }

.machinetabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(24, 39, 60, .08), 0 0 0 1px var(--hairline); }
.dl { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.cmd { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #16181c; color: #e6e8eb; border-radius: var(--r-inner); padding: 10px 10px 10px 14px; font-family: var(--mono); font-size: 14px; overflow-x: auto; }
.cmd span { white-space: nowrap; }
.cmd .btn { background: rgba(255, 255, 255, .1); color: #fff; height: 30px; flex-shrink: 0; }

/* connected machine + first data */
.mrow { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.mrow .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--soft-2); display: grid; place-items: center; color: var(--ink); flex-shrink: 0; }

.plist { border-top: 1px solid var(--hairline); }

.prow2 .tick svg { width: 12px; height: 12px; stroke-width: 3; color: #fff; opacity: 0; transform: scale(.6); transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
.prow2.done .tick { background: var(--okdot); border-color: var(--okdot); }

@keyframes spin { to { transform: rotate(360deg); } }
.prow2 .n { font-variant-numeric: tabular-nums; color: var(--body); }

.facts3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 24px; padding: 16px; }
.facts3 .l { font-size: 14px; color: var(--body); } .facts3 .v { font-size: 14px; color: var(--ink); margin-top: 4px; }
.appaddr { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-top: 1px solid var(--hairline); }

/* ready-to-open checklist */
.chk { display: flex; flex-direction: column; }
.chkrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--hairline); cursor: pointer; text-align: left; width: 100%; transition: background-color 150ms ease; }
.chkrow:last-child { border-bottom: 0; }
@media (hover: hover) and (pointer: fine) { .chkrow:hover { background: var(--soft); } }
.chkrow .tick { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--edge); display: grid; place-items: center; transition: background-color 200ms ease, border-color 200ms ease; }
.chkrow .tick svg { width: 12px; height: 12px; stroke-width: 3; color: #fff; }
.chkrow.ok .tick { background: var(--okdot); border-color: var(--okdot); }
.chkrow .t { color: var(--ink); font-weight: 500; }
.chkrow .d { display: block; color: var(--body); font-size: 14px; }
.chkrow > svg { color: var(--faint); }
.chkrow { grid-template-columns: 22px minmax(0, 1fr) auto auto; }
.chkrow.plain { cursor: default; }
@media (hover: hover) and (pointer: fine) { .chkrow.plain:hover { background: none; } }
.comp { padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
.comp:last-child { border-bottom: 0; }
.comp .ch { display: flex; align-items: center; gap: 10px; }
.comp .w { font-size: 14px; color: var(--body); } .comp .w.ok { color: var(--ok-fg); } .comp .w.warn { color: var(--warn-fg); } .comp .w.bad { color: var(--bad-fg); }
.ubars { display: grid; grid-template-columns: repeat(90, minmax(0, 1fr)); gap: 2px; height: 26px; margin-top: 10px; }
.ubars i { border-radius: 2px; background: var(--okdot); }

.comp .ax { display: flex; justify-content: space-between; font-size: 14px; color: var(--mute); margin-top: 4px; }
.own { font-size: 14px; color: var(--body); background: var(--soft-2); border-radius: 6px; padding: 2px 8px; }
.openbar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--hairline); background: var(--soft); }
.openbar .grow { flex: 1; color: var(--body); font-size: 14px; }
.factsgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 24px; padding: 16px; }
.factsgrid .l { font-size: 14px; color: var(--body); } .factsgrid .v { font-size: 14px; color: var(--ink); margin-top: 4px; }
.sectionh { padding: 14px 16px 10px; font-weight: 600; border-bottom: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: baseline; }

/* add store sheet */
.addgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 6px; }

.fld input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
.fld .h { font-size: 14px; color: var(--mute); }
.added { display: flex; flex-direction: column; gap: 14px; }
.linkrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--hairline); border-radius: var(--r-inner); }

.notes { position: fixed; top: calc(var(--barh) + 12px); right: 16px; z-index: 95; display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 32px)); }
.notex { background: #fff; border: 1px solid var(--hairline); border-radius: 12px; box-shadow: var(--shadow-sheet); padding: 12px 12px 12px 14px; display: flex; gap: 12px; align-items: flex-start; transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); }
.notex.enter-from { opacity: 0; transform: translateY(-8px) scale(.98); }
.notex .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: #e8f6e6; color: var(--ok-fg); flex-shrink: 0; }

.notex .x { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--faint); }

/* ── a PC at the store (Windows) ── */
.desk { position: fixed; inset: var(--barh) 0 0 0; overflow: hidden; background: radial-gradient(1200px 600px at 30% 20%, #e9eef7, transparent), linear-gradient(160deg, #dde4ef, #eceff4 50%, #e5e9f0); }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: rgba(246, 247, 249, .9); backdrop-filter: blur(14px); border-top: 1px solid rgba(0, 0, 0, .06); display: flex; align-items: center; justify-content: center; gap: 4px; }
.taskbar .tk { width: 38px; height: 38px; border-radius: 6px; display: grid; place-items: center; position: relative; }
.taskbar .tk.on::after { content: ""; position: absolute; bottom: 3px; width: 14px; height: 3px; border-radius: 2px; background: var(--accent); }
.taskbar .tray { position: absolute; right: 14px; display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--text); }

.trayflyout { position: absolute; right: 12px; bottom: 54px; width: 300px; background: #fff; border-radius: 10px; box-shadow: 0 20px 60px rgba(24, 39, 60, .2), 0 0 0 1px rgba(24, 39, 60, .08); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
.trayflyout.enter-from { opacity: 0; transform: translateY(6px); }

<script>
/* ═══ New store, from Central to the first till ═══════════════════════════
   One state, four screens: head office in Central (hub), the store's PC
   (Windows installer, or a Linux mini PC prepared at HO), a phone with the
   store app, and the tills (Central POS). What one screen does shows up on
   the others: the hub hears the server connect, the phone finds the QR once
   the server is Ready, Kasir 2 waits for a supervisor's PIN at Kasir 1.
   Naskah B of docs/research/2026-10-10-tambah-toko-install-naskah.md. */
const $ = (s, r = document) => r.querySelector(s)
const ic = (n, c = "") => `<i data-lucide="${n}" class="${c}"></i>`
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const fmt = (n) => n.toLocaleString("id-ID")
const CODE = "KGD4TX7Q"
const showCode = (c) => c.slice(0, 4) + "-" + c.slice(4)
const APP_URL = "http://c014.local:8082"
const STAGES = [
  ["articles", "Articles", 12480, 1700],
  ["prices", "Price books", 4, 600],
  ["staff", "Staff", 6, 500],
  ["pay", "Payment methods", 1, 400],
  ["promos", "Promotions", 3, 500],
]
const MACHINE = {
  win: { name: "SHOP-PC-C014", os: "Windows 11 Pro", icon: "monitor" },
  linux: { name: "CENTRAL-C014", os: "Ubuntu Server 24.04", icon: "server" },
}
const OTHER_STORES = [
  ["Cikupa", "C001", "Cikupa", 3],
  ["Muaro Bungo", "C002", "Muaro Bungo", 2],
  ["Purbalingga", "C003", "Purbalingga", 2],
  ["Bumiayu", "C004", "Bumiayu", 2],
]

let S, timers = [], shown = new Set()
function fresh(machine = "win") {
  return {
    screen: "hub", machine, tv: 0,
    unread: { hub: 0, pc: 0, phone: 0, till: 0 },
    hub: { page: "list", tab: "server", sheet: null, dlg: null, form: { name: "Purwokerto", manager: "Dewi Lestari" }, copied: false, fresh: false },
    store: { added: false, server: "none", data: {}, stage: 0, connectedAt: "", team: false, firstStock: false, received: 0, opened: false },
    pc: { page: "code", a: "", b: "", err: "", pct: 0, step: 0, flyout: false },
    lx: { page: "cmd", lines: [], input: "" },
    phone: { page: "scan", found: false, recv: false },
    tills: [{ state: "find", found: false, tests: {} }, { state: "find", found: false, tests: {} }],
    pos: { review: false, pin: "", pinFor: null },
    notes: [], toast: null,
    ...partsFresh(),
  }
}
S = fresh()
const later = (ms, fn) => { const t = setTimeout(fn, ms); timers.push(t); return t }
const clearTimers = () => { timers.forEach(clearTimeout); timers = [] }
const anyTillReady = () => S.tills.some((t) => t.state === "ready")
const ping = (screen) => { if (S.screen !== screen) S.unread[screen] = 1 }
let noteSeq = 0
function note(title, sub) {
  S.notes.unshift({ id: ++noteSeq, title, sub })
  ping("hub")
  const id = noteSeq
  later(9000, () => { S.notes = S.notes.filter((n) => n.id !== id); render() })
}
function toast(msg) {
  S.toast = msg; render()
  clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render() }, 2400)
}

/* a QR-looking pattern: three finders, deterministic noise */
function qr(seed = 7, n = 25) {
  let x = seed * 9301 + 49297
  const rnd = () => ((x = (x * 9301 + 49297) % 233280) / 233280)
  const cells = []
  const finder = (r, c) => r < 7 && c < 7 || r < 7 && c >= n - 7 || r >= n - 7 && c < 7
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (finder(r, c)) continue
    if (rnd() > 0.52) cells.push(`<rect x="${c}" y="${r}" width="1" height="1"/>`)
  }
  const f = (x0, y0) => `<rect x="${x0}" y="${y0}" width="7" height="7"/><rect x="${x0 + 1}" y="${y0 + 1}" width="5" height="5" fill="#fff"/><rect x="${x0 + 2}" y="${y0 + 2}" width="3" height="3"/>`
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" class="qr" shape-rendering="crispEdges" fill="#111214"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/>${cells.join("")}${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}</svg>`
}
function ringSvg(done, total, complete) {
  const r = 14, C = 2 * Math.PI * r, k = complete ? 1 : done / total
  return `<svg class="ring" viewBox="0 0 34 34"><circle cx="17" cy="17" r="${r}" fill="none" stroke="#f0f0f2" stroke-width="3"/>
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="${complete ? "#36b827" : "#2563eb"}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C * k} ${C}" transform="rotate(-90 17 17)" style="transition:stroke-dasharray 400ms cubic-bezier(.23,1,.32,1)"/>
    ${complete ? `<path d="M11.5 17.5l3.5 3.5 7-7" fill="none" stroke="#36b827" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>` : `<text x="17" y="21" text-anchor="middle" font-size="11" font-weight="600" fill="#394150">${done}</text>`}</svg>`
}

/* ── the first data: one ticker, shown in the hub and on the store PC ── */
function startData() {
  const st = S.store
  st.server = "data"; st.connectedAt = now(); st.stage = 0
  STAGES.forEach(([k]) => (st.data[k] = 0))
  note(`Purwokerto's server is connected`, `${MACHINE[S.machine].name} · ${MACHINE[S.machine].os}`)
  let i = 0
  const runStage = () => {
    if (i >= STAGES.length) {
      st.server = "ready"; st.stage = STAGES.length
      note(`Purwokerto's server is ready`, "Data up to 09:43")
      if (S.machine === "win") { S.pc.page = "ready"; ping("pc") } else lxReady()
      ping("phone")
      render(); return
    }
    const [k, , total, ms] = STAGES[i]
    st.stage = i
    const t0 = performance.now()
    const tick = () => {
      const p = Math.min(1, (performance.now() - t0) / ms)
      st.data[k] = Math.round(total * (1 - Math.pow(1 - p, 3)))
      paintData()
      if (p < 1) later(60, tick)
      else { i++; later(120, runStage) }
    }
    tick()
  }
  later(500, runStage)
}
function dataRows() {
  const st = S.store
  return STAGES.map(([k, label, total], i) => {
    const done = st.server === "ready" || i < st.stage || (i === st.stage && st.data[k] === total)
    const nowc = st.server === "data" && i === st.stage && !done
    const v = st.server === "ready" ? total : st.data[k] || 0
    return `<div class="prow2 ${done ? "done" : ""} ${nowc ? "now" : ""}" data-stage="${k}"><span class="tick">${ic("check")}</span><span>${label}</span><span class="n num">${v ? fmt(v) : "—"}</span></div>`
  }).join("")
}
/* paint only the rows while ticking, so inputs and focus elsewhere survive */
function paintData() {
  document.querySelectorAll(".plist").forEach((el) => { el.innerHTML = dataRows() })
  if (window.lucide) lucide.createIcons()
  document.querySelectorAll("[data-paint=stagecount]").forEach((el) => (el.textContent = `${Math.min(S.store.stage + 1, STAGES.length)} of ${STAGES.length}`))
}

/* ── one place each part's journey is set up from ─────────────────── */
function partJump(n) {
  clearTimers()
  const m = S.machine, part = S.part
  S = Object.assign(fresh(m), partsFresh(), { part })
  openStoreBase()
  S.stepAt[part] = n
  const mg = S.mg, pp = S.pp, dv = S.dv
  if (part === "store") {
    if (n >= 2) { mg.status = "stopped"; mg.reason = "Renovasi"; mg.stoppedAt = "10 Okt 2026, 14:05" }
    if (n >= 3) { mg.status = "open" }
    if (n === 4) { S.hub.tab = "server"; mg.sheet = "replace" }
    if (n >= 5) { mg.status = "stopped"; mg.reason = "Tutup permanen"; mg.dlg = "remove" }
    S.screen = n === 2 ? "till" : "hub"
  }
  if (part === "people") {
    S.hub.page = "store"; S.hub.tab = "people"
    if (n === 1) { pp.sheet = "add" }
    if (n >= 2) { pp.added = true }
    if (n === 2) { pp.sheet = "added" }
    if (n >= 3) { pp.joined = true; pp.pos = "door" }
    if (n >= 4) { pp.fp.dewi = { k: "RIGHT_INDEX", st: "pending", at: "13:58", by: "dewi" }; pp.pos = "in" }
    if (n >= 5) { pp.fp.dewi.st = "active"; pp.pos = "team" }
    if (n >= 6) { pp.fp.andi = { k: "RIGHT_INDEX", st: "active", at: "14:06", by: "dewi" }; pp.pos = "door" }
    if (n >= 7) { pp.access = "stopped"; pp.reason = "Investigasi selisih kas"; pp.pos = "door" }
    if (n === 7) { pp.sheet = "person"; pp.person = "andi" }
    if (n >= 8) { pp.access = "allowed"; pp.leave = "done"; pp.fp.andi = null; pp.sheet = "person"; pp.person = "andi" }
    S.screen = n === 3 || n === 5 || n === 6 ? "till" : "hub"
  }
  if (part === "devices") {
    S.hub.tab = "pos"
    if (n === 2) { dv.ask = true; S.screen = "hub" }
    if (n >= 3) { dv.list[1].st = "stopped"; dv.reason = "Laci rusak"; dv.unsent = 2; S.tv = 1 }
    if (n >= 4) { dv.list[1].st = "removed"; dv.unsent = 0; dv.sent = true }
    if (n === 5) { S.hub.page = "updates" }
    if (n >= 6) { dv.down = true; S.tv = 0; S.screen = "till" }
    if (n === 3 || n === 4) S.screen = "till"
  }
  S.unread = { hub: 0, pc: 0, phone: 0, till: 0 }
  render()
}

/* ── the clicks ─────────────────────────────────────────────────────── */
function partClick(e) {
  const t = (s) => e.target.closest(s)
  let el
  if (t("[data-other-store]")) { toast("Every store opens the same page; Purwokerto is the one in this prototype"); return true }
  if (t("[data-test-print]")) { toast("Test page asked. It prints at the POS in a few seconds"); return true }
  if (t("[data-hub-add]") && S.part !== "new") { clearTimers(); const m = S.machine; S = Object.assign(fresh(m), partsFresh()); shown = new Set(); S.hub.sheet = "add"; render(); return true }
  if ((el = t("[data-part]"))) {
    const part = el.dataset.part
    if (part === S.part) return true
    if (part === "new") { clearTimers(); const m = S.machine; S = Object.assign(fresh(m), partsFresh()); shown = new Set(); render(); return true }
    S.part = part; partJump(1); return true
  }
  if ((el = t("[data-pjump]"))) { partJump(Number(el.dataset.pjump)); return true }
  if (S.part === "new" && !t("[data-pp]")) return false
  const mg = S.mg, pp = S.pp, dv = S.dv
  if ((el = t("[data-mg]"))) {
    const a = el.dataset.mg
    if (a === "stop") { mg.dlg = "stop" }
    else if (a === "stopgo") { mg.reason = ($("#mgreason") || {}).value || "Renovasi"; mg.status = "stopped"; mg.stoppedAt = "10 Okt 2026, 14:05"; mg.dlg = null; bump("store", 2); ping("till"); toast("Purwokerto stopped. Every POS there stops selling") }
    else if (a === "resume") { mg.status = "open"; bump("store", 3); ping("till"); toast("Purwokerto resumed") }
    else if (a === "remove") { mg.dlg = "remove" }
    else if (a === "removego") { if ((($("#mgcode") || {}).value || "").trim().toUpperCase() !== "C014") { toast("Type C014 to confirm"); return true } mg.status = "removed"; mg.dlg = null; bump("store", 5); ping("till"); toast("Purwokerto removed") }
    else if (a === "replace") { mg.sheet = "replace"; mg.menu = false; bump("store", 4) }
    else if (a === "disconnect") { mg.dlg = "disconnect" }
    else if (a === "closetills") { mg.closedTills = true }
    else if (a === "prep") { mg.menu = false; if (mg.sheet === "replace") { mg.prep = "run"; render(); later(1400, () => { mg.prep = "done"; mg.released = true; render() }) } else mg.dlg = "prep" }
    else if (a === "prepgo") { mg.dlg = null; mg.prep = "run"; render(); later(1400, () => { mg.prep = "done"; mg.released = true; render() }) ; return true }
    else if (a === "uninstall") { mg.uninstalled = true }
    else if (a === "newcode") { mg.dlg = null; mg.sheet = null; mg.uninstalled = "gone"; mg.released = false; mg.prep = null; ping("till"); toast(`${MACHINE[S.machine].name} disconnected. New install code issued`) }
    render(); return true
  }
  if (t("[data-mg-menu]")) { mg.menu = !mg.menu; render(); return true }
  if ((el = t("[data-mg-act]"))) { mg.menu = false; toast(`${el.dataset.mgAct}: asked. It shows in Activity when the server answers`); return true }
  if ((el = t("[data-pp]"))) {
    const a = el.dataset.pp, who = el.dataset.who
    if (a === "add") pp.sheet = "add"
    else if (a === "addgo") { pp.form.name = ($("#ppname") || {}).value || pp.form.name; PEOPLE.andi.name = pp.form.name; pp.added = true; pp.sheet = "added"; S.hub.fresh = true; bump("people", 2) }
    else if (a === "joingo") { pp.joined = true; pp.sheet = null; bump("people", 3); toast(`${pp.form.name} joined · andi.saputra`) }
    else if (a === "open") { pp.sheet = "person"; pp.person = who }
    else if (a === "list") pp.page = "list"
    else if (a === "enrol") { pp.dlg = "enrol"; pp.press = 0; pp.pick = "RIGHT_INDEX" }
    else if (a === "press") {
      if (pp.press < 3) { pp.press++; render(); return true }
      pp.fp[pp.person] = { k: pp.pick, st: "active", at: "HR desk", by: null }
      pp.dlg = null; pp.press = 0; toast(`${fingerName(pp.pick)} enrolled at HR desk`)
    }
    else if (a === "approvefp") { pp.fp[who].st = "active"; bump("people", who === "dewi" ? 4 : 6); ping("till"); toast(`${PEOPLE[who].name}'s fingerprint approved. It works at every POS of Purwokerto`) }
    else if (a === "approveall") { waitingFingers().forEach(([w]) => { pp.fp[w].st = "active" }); ping("till"); toast("Approved") }
    else if (a === "refusefp") { pp.fp[who] = null; toast(`${PEOPLE[who].name}'s fingerprint refused and deleted`) }
    else if (a === "withdraw") { pp.fp[who] = null; toast("Withdrawn. Purwokerto's POS forgets it within 5 minutes") }
    else if (a === "stop") pp.dlg = "stop"
    else if (a === "stopgo") { pp.reason = ($("#ppreason") || {}).value || "Investigasi selisih kas"; pp.access = "stopped"; pp.dlg = null; pp.pos = "door"; bump("people", 7); ping("till"); toast(`${pp.form.name}'s POS access stopped`) }
    else if (a === "add" && S.part === "new") { pp.sheet = "add" }
    else if (a === "resume") { pp.access = "allowed"; pp.pos = "door"; toast("POS access resumed") }
    else if (a === "leave") { pp.dlg = "leave"; pp.when = "today" }
    else if (a === "leavego") { pp.dlg = null; bump("people", 8); if (pp.when === "dated") { pp.leave = "dated"; toast("Approved. The login closes on 31 Oct 2026") } else { pp.leave = "done"; pp.fp.andi = null; pp.access = "allowed"; pp.pos = "door"; ping("till"); toast("Approved. Login closed; fingerprint deleted") } }
    render(); return true
  }
  if ((el = t("[data-finger]"))) { pp.pick = el.dataset.finger; pp.press = 0; pp.dup = false; render(); return true }
  if ((el = t("[data-when]"))) { pp.when = el.dataset.when; render(); return true }
  if ((el = t("[data-pos]"))) {
    const a = el.dataset.pos
    if (a === "door") pp.pos = "door"
    else if (a === "pw") pp.pos = "pw"
    else if (a === "pwgo") { pp.pos = pp.fp.dewi ? "in" : "selfenrol"; pp.press = 0; pp.pick = "RIGHT_INDEX" }
    else if (a === "team") pp.pos = "team"
    else if (a === "teamgo") { pp.pos = "teamcap"; pp.who = el.dataset.who; pp.press = 0; pp.pick = "RIGHT_INDEX"; pp.dup = false }
    else if (a === "dup") { pp.dup = true }
    else if (a === "press") {
      pp.dup = false
      if (pp.press < 3) { pp.press++; render(); return true }
      const who = pp.pos === "selfenrol" ? "dewi" : pp.who
      pp.fp[who] = { k: pp.pick, st: "pending", at: who === "dewi" ? "13:58" : "14:06", by: "dewi" }
      pp.press = 0; pp.pos = who === "dewi" ? "in" : "team"; ping("hub"); bump("people", who === "dewi" ? 4 : 5)
      toast(who === "dewi" ? "Terkirim. Menunggu persetujuan kantor pusat" : "Terkirim. Menunggu persetujuan kantor pusat")
    }
    else if (a === "fdewi") pp.pos = pp.fp.dewi && pp.fp.dewi.st === "active" ? "in" : "refused"
    else if (a === "fandi") pp.pos = pp.fp.andi && pp.fp.andi.st === "active" && pp.access === "allowed" && pp.leave !== "done" ? "andi" : "refused"
    render(); return true
  }
  if ((el = t("[data-dv]"))) {
    const a = el.dataset.dv, i = Number(el.dataset.i)
    if (a === "stop") { dv.target = i; dv.dlg = "stop" }
    else if (a === "stopgo") { dv.reason = ($("#dvreason") || {}).value || "Laci rusak"; dv.list[dv.target].st = "stopped"; dv.unsent = 2; dv.sent = false; dv.dlg = null; S.tv = dv.target; bump("devices", 3); ping("till"); toast(`${dv.list[dv.target].n} stopped`) }
    else if (a === "resume") { dv.list[i].st = "active"; toast(`${dv.list[i].n} resumed`) }
    else if (a === "remove") { dv.target = i; dv.dlg = "remove" }
    else if (a === "removego") { dv.list[dv.target].st = "removed"; dv.dlg = null; bump("devices", 4); ping("till"); toast(`${dv.list[dv.target].n} removed`) }
    else if (a === "sendnow") { dv.unsent = 0; dv.sent = true }
    else if (a === "seats") dv.dlg = "seats"
    else if (a === "approve3") { dv.list.push({ n: "Kasir 3", m: "POS-DESKTOP-3", st: "active", v: "1.4.2" }); dv.ask = false; toast("Approved. Kasir 3 joined Purwokerto") }
    else if (a === "refuse3") { dv.ask = false; toast("Refused. POS-DESKTOP-3 cannot join") }
    else if (a === "rollout") dv.dlg = "rollout"
    else if (a === "rolloutgo") { dv.rel.out = true; dv.dlg = null; bump("devices", 5); toast("1.5.0 goes to Purwokerto tonight") }
    else if (a === "morning") { dv.rel.morning = true; dv.list.forEach((d) => { if (d.st === "active") d.v = "1.5.0" }); ping("till") }
    else if (a === "paycash") { dv.off++; toast(`Struk dicetak · ${dv.off} menunggu terkirim`) }
    render(); return true
  }
  if ((el = t("[data-seats]"))) { dv.seats = Number(el.dataset.seats); render(); return true }
  if (t("[data-dv-up]")) { dv.down = false; toast(`${dv.off} penjualan terkirim ke server toko`); dv.off = 0; render(); return true }
  if ((el = t("[data-pnav]"))) { const p = el.dataset.pnav; if (p === "updates" || p === "store") { S.hub.page = p === "updates" ? "updates" : "store" } else { S.hub.page = "people"; pp.page = p } render(); return true }
  if (t("[data-close]")) { mg.dlg = null; mg.sheet = null; pp.dlg = null; pp.sheet = null; dv.dlg = null; S.hub.sheet = null; S.hub.dlg = null; render(); return true }
  return false
}

function partOverlays() {
  if (S.part === "store") return (S.mg.sheet === "replace" ? replaceSheet() : "") + mgDialogs() + ppOverlays()
  if (S.part === "people") return ppOverlays()
  return dvDialogs() + ppOverlays()
}

/* ═══ render ═════════════════════════════════════════════════════════════ */
function render() {
  const fo = document.activeElement && document.activeElement.id
  const pos = fo && document.activeElement.selectionStart
  $("#bar").innerHTML = barHtml()
  document.documentElement.style.setProperty("--barh", $("#bar").offsetHeight + "px")
  let html = ""
  if (S.screen === "hub") {
    let page
    if (S.part === "new") page = S.hub.page === "store" && S.store.added ? storePage() : hubList()
    else if (S.hub.page === "updates") page = updatesPage()
    else page = S.hub.page === "store" ? mgStorePage() : hubList()
    html = shell(page) + (S.part === "new" ? hubOverlays() + ppOverlays() : partOverlays())
  }
  else if (S.screen === "pc") html = S.machine === "win" ? pcWin() : lxScreen()
  else if (S.screen === "phone") html = phoneScreen()
  else html = S.part === "new" ? tillScreen() : partPos()
  if (S.toast) html += `<div class="toast ${shown.has("toast") ? "" : "enter-from"}" data-key="toast">${ic("check")}${esc(S.toast)}</div>`
  $("#app").innerHTML = html
  if (window.lucide) lucide.createIcons()
  const next = new Set()
  document.querySelectorAll("[data-key]").forEach((el) => next.add(el.dataset.key))
  shown = next
  /* a timer, not two animation frames: frames pause while the page is hidden */
  setTimeout(() => document.querySelectorAll(".enter-from").forEach((el) => el.classList.remove("enter-from")), 30)
  if (fo) { const el = document.getElementById(fo); if (el) { el.focus(); try { el.setSelectionRange(pos, pos) } catch (e) {} } }
  S.hub.fresh = false
}

/* ═══ actions ════════════════════════════════════════════════════════════ */
function go(screen) { S.screen = screen; S.unread[screen] = 0; render() }
function jump(n) {
  clearTimers()
  const m = S.machine
  S = fresh(m)
  const st = S.store
  if (n >= 2) { st.added = true; st.server = "waiting"; S.hub.page = "store"; S.hub.tab = "server" }
  if (n >= 3) {
    st.server = "data"; st.connectedAt = now(); st.stage = 0
    S.pc.page = m === "win" ? "data" : "code"
    if (m === "linux") { S.lx.page = "running"; S.lx.input = showCode(CODE); S.lx.lines = [`<span class="b">==&gt;</span> Connected to Central`] }
    startDataFromJump()
  }
  if (n >= 4) { clearTimers(); finishData() }
  if (n >= 5) { st.team = true; S.phone.page = "home" }
  if (n >= 6) { S.tills[0].state = "ready" }
  S.notes = []
  S.screen = n === 1 ? "hub" : n === 2 ? "pc" : n === 3 ? "hub" : n === 4 ? "phone" : n === 5 ? "till" : "hub"
  if (n === 6) S.hub.tab = "overview"
  S.unread = { hub: 0, pc: 0, phone: 0, till: 0 }
  render()
}
function startDataFromJump() { startData(); S.notes = [] }
function finishData() {
  const st = S.store
  st.server = "ready"; st.stage = STAGES.length
  STAGES.forEach(([k, , total]) => (st.data[k] = total))
  if (S.machine === "win") S.pc.page = "closed"
  else { S.lx.page = "status" }
}
function addStore() {
  const f = S.hub.form
  if (!f.manager.trim()) return
  S.store.added = true; S.store.server = "waiting"; S.hub.fresh = true; S.hub.sheet = "added"
  render()
}
function install() {
  const p = S.pc, code = (p.a + p.b).toUpperCase()
  if (S.store.server !== "waiting" || code !== CODE) {
    p.err = "This code is not valid. It may be mistyped, used, or expired."
    render(); const cb = $("#codebox"); if (cb) { cb.classList.remove("shake"); void cb.offsetWidth; cb.classList.add("shake") }
    return
  }
  p.err = ""; p.page = "installing"; p.pct = 0; p.step = 0; render()
  const t0 = performance.now()
  const tick = () => {
    const k = Math.min(1, (performance.now() - t0) / 2400)
    p.pct = Math.round(k * 100); p.step = k < 0.45 ? 0 : k < 0.8 ? 1 : 2
    if (S.screen === "pc" && S.pc.page === "installing") {
      const bar = $(".bar i"); if (bar) bar.style.width = p.pct + "%"
      const lede = $(".inst .lede"); if (lede) lede.textContent = ["Installing the service", "Opening ports 8082 and 5353 for tills", "Connecting to Central"][p.step]
      const pc = $(".inst .foot .grow"); if (pc) pc.textContent = p.pct + "%"
    }
    if (k < 1) later(50, tick)
    else { p.page = "data"; startData(); render() }
  }
  tick()
}

document.addEventListener("click", (e) => {
  const t = (s) => e.target.closest(s)
  let el
  if (t("#reset") && S.part !== "new") return partJump(1)
  if (partClick(e)) return
  if (t("#reset")) { clearTimers(); const m = S.machine; S = fresh(m); shown = new Set(); render(); return }
  if ((el = t("[data-jump]"))) return jump(Number(el.dataset.jump))
  if ((el = t("[data-screen]"))) return go(el.dataset.screen)
  if ((el = t("[data-machine]"))) {
    if (S.machine === el.dataset.machine) return
    if (S.store.server === "data" || S.store.server === "ready") { toast("Disconnect the server first to switch the machine"); return }
    S.machine = el.dataset.machine; render(); return
  }
  if ((el = t("[data-tv]"))) { S.tv = Number(el.dataset.tv); S.pos.review = false; render(); return }
  /* hub */
  if (t("[data-hub-add]")) { S.hub.sheet = "add"; render(); return }
  if ((el = t("[data-hub]"))) { S.hub.page = el.dataset.hub; S.hub.sheet = null; render(); return }
  if (t("[data-open-store]")) { S.hub.page = "store"; S.hub.tab = S.store.server === "ready" ? "overview" : "server"; render(); return }
  if (t("[data-add]")) return addStore()
  if (t("[data-goto-store]")) { S.hub.sheet = null; S.hub.page = "store"; S.hub.tab = "server"; render(); return }
  if ((el = t("[data-tab]"))) { S.hub.tab = el.dataset.tab; render(); return }
  if ((el = t("[data-copy]"))) { navigator.clipboard && navigator.clipboard.writeText(el.dataset.copy).catch(() => {}); if (el.closest(".codecard") && !el.closest(".cmd")) { S.hub.copied = true; render() } else toast("Copied"); return }
  if ((el = t("[data-download]"))) { const d = el.dataset.download; toast(d === "WhatsApp" ? "Opened WhatsApp with the link" : /›|seats/i.test(d) ? `Opens ${d}` : `${d} downloaded`); return }
  if (t("[data-newcode]")) { S.hub.copied = false; toast("New code issued. The old one stops working"); return }
  if (t("[data-actions]")) { toast("Restart server · Sync now · Back up now · Diagnose · Update server"); return }
  if (t("[data-disconnect]")) { S.hub.dlg = "disconnect"; render(); return }
  if (t("[data-disconnect-go]")) {
    clearTimers(); const st = S.store
    st.server = "waiting"; st.stage = 0; st.data = {}; S.hub.dlg = null; S.hub.copied = false
    S.pc = fresh().pc; S.lx = fresh().lx; S.phone.page = S.phone.page === "home" ? "home" : "scan"
    toast(`${MACHINE[S.machine].name} disconnected. New install code issued`); return
  }
  if (t("[data-open]")) { S.hub.dlg = "open"; render(); return }
  if (t("[data-open-go]")) { S.store.opened = true; S.hub.dlg = null; ping("till"); toast("Purwokerto is open"); return }
  if ((el = t("[data-note-x]"))) { S.notes = S.notes.filter((n) => n.id !== Number(el.dataset.noteX)); render(); return }
  if (t("[data-note-open]")) { S.hub.page = "store"; S.hub.tab = "server"; S.hub.sheet = null; render(); return }
  if (t("[data-close]")) { S.hub.sheet = null; S.hub.dlg = null; S.pp.sheet = null; S.pp.dlg = null; render(); return }
  /* store PC */
  if (t("[data-install]")) return install()
  if (t("[data-finish]")) { S.pc.page = "closed"; render(); return }
  if (t("[data-tray]")) { S.pc.flyout = !S.pc.flyout; render(); return }
  if (t("[data-lxrun]")) return lxRun()
  /* phone */
  if (t("[data-scan]")) { S.phone.found = true; render(); return }
  if (t("[data-open-app]")) { S.phone.page = "signin"; render(); return }
  if (t("[data-signin]")) { S.phone.page = "home"; S.store.team = true; ping("hub"); render(); return }
  if (t("[data-recv]")) { S.phone.recv = true; render(); return }
  if (t("[data-recv-x]")) { S.phone.recv = false; render(); return }
  if (t("[data-recv-go]")) { const v = Number(($("#cnt") || {}).value || 0); if (!v) return; S.store.firstStock = true; S.store.received = v; S.phone.recv = false; ping("hub"); toast(v < 240 ? "Received. Completed · issue" : "Received. Completed"); return }
  /* tills */
  if (t("[data-first-sign]")) { S.pos.first.signed = true; render(); return }
  if ((el = t("[data-first-kind]"))) { S.pos.first.kind = el.dataset.firstKind; render(); return }
  if (t("[data-first-approve]")) { S.tills[S.tv].state = "test"; S.pos.first = null; render(); return }
  if (t("[data-ask]")) { const i = S.tv; S.tills[i].state = "waiting"; if (i === 1 && S.tills[0].state === "ready") ping("till"); render(); return }
  if ((el = t("[data-pin]"))) {
    const kind = el.dataset.pinfor, d = el.dataset.pin
    if (S.pos.pinFor !== kind) { S.pos.pinFor = kind; S.pos.pin = "" }
    S.pos.pin = d === "⌫" ? S.pos.pin.slice(0, -1) : (S.pos.pin + d).slice(0, 6)
    if (S.pos.pin.length === 6) {
      render()
      later(220, () => {
        const target = kind === "first" ? S.tv : 1
        S.tills[target].state = "test"; S.pos.pin = ""; S.pos.pinFor = null; S.pos.review = false
        if (kind === "second") toast("Kasir 2 approved")
        render()
      })
      return
    }
    render(); return
  }
  if (t("[data-review]")) { S.pos.review = true; render(); return }
  if (t("[data-review-x]")) { S.pos.review = false; render(); return }
  if ((el = t("[data-test]"))) { S.tills[S.tv].tests[el.dataset.test] = true; render(); return }
  if (t("[data-test-done]")) { S.tills[S.tv].state = "ready"; ping("hub"); ping("phone"); render(); return }
})

document.addEventListener("input", (e) => {
  const el = e.target
  if (el.dataset.f) { S.hub.form[el.dataset.f] = el.value; const b = $("[data-add]"); if (b) b.disabled = !S.hub.form.manager.trim(); return }
  if (el.id === "ca" || el.id === "cb") {
    let v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, "")
    if (el.id === "ca" && v.length > 4) { S.pc.a = v.slice(0, 4); S.pc.b = v.slice(4, 8); $("#ca").value = S.pc.a; $("#cb").value = S.pc.b; $("#cb").focus() }
    else if (el.id === "ca") { S.pc.a = v; el.value = v; if (v.length === 4) $("#cb").focus() }
    else { S.pc.b = v.slice(0, 4); el.value = S.pc.b }
    if (S.pc.err) { S.pc.err = ""; const cb = $("#codebox"); cb && cb.classList.remove("bad"); const er = $(".err"); er && er.remove() }
    const b = $("[data-install]"); if (b) b.disabled = (S.pc.a + S.pc.b).length !== 8
    return
  }
  if (el.id === "lxcode") { S.lx.input = el.value.toUpperCase(); el.value = S.lx.input; return }
  if (el.id === "cnt") { const b = $("[data-recv-go]"); if (b) b.disabled = !Number(el.value); return }
})
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "lxcode") lxRun()
  if (e.key === "Enter" && (e.target.id === "ca" || e.target.id === "cb") && (S.pc.a + S.pc.b).length === 8) install()
  if (e.key === "Backspace" && e.target.id === "cb" && !e.target.value) $("#ca").focus()
})
window.addEventListener("resize", () => document.documentElement.style.setProperty("--barh", $("#bar").offsetHeight + "px"))
render()
</script>
</body>
</html>
