<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allotment sheet options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="frontend-hub/design-system/tokens.css">
<style>
:root{--font:"Inter",system-ui,sans-serif;--accent:#2862dc;--ink:#111;--body:#555;--mute:#8a8a92;--hair:#e8e8ec;--soft:#fafafb}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9e9ee;font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.pbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--hair)}
.pbar b{font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:9px;background:#ececf0}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;color:#555}
.seg button.on{background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.why{color:#666}
.stage{display:flex;justify-content:center;padding:24px 16px}
.sheet{width:min(1000px,100%);background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);display:flex;flex-direction:column;min-height:640px}
.shead{display:flex;gap:24px;align-items:center;padding:22px 32px;border-bottom:1px solid var(--hair)}
.shead .back{color:var(--body)}
.crumb{color:var(--body)}
.shead h2{margin:2px 0 0;font-size:17px;font-weight:600}
.sbody{padding:24px 32px;display:flex;flex-direction:column;gap:12px;flex:1}
.act{border-top:1px solid var(--hair);padding-top:14px;margin-top:8px;color:var(--body)}
.sfoot{border-top:1px solid var(--hair);padding:16px 32px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sfoot .note{color:var(--body)}
.btn{border:0;border-radius:9px;padding:8px 14px;font-weight:500}
.btn.red{background:#e7a1a1;color:#fff}.btn.blue{background:var(--accent);color:#fff}
.thumb{width:44px;height:44px;border-radius:10px;border:1px solid var(--hair);background:#f6f6f8;display:grid;place-items:center;flex-shrink:0}
.thumb i{width:18px;height:24px;background:#c9c9d0;border-radius:3px 3px 1px 1px}
.name{font-weight:600;font-size:16px}
.code{font-family:ui-monospace,Menlo,monospace;color:var(--body);font-size:15px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.num{font-variant-numeric:tabular-nums}
/* the mini table */
.mt{border:1px solid var(--hair);border-radius:10px;overflow:hidden;width:fit-content;max-width:100%}
.mt .r{display:grid;grid-template-columns:7.5rem minmax(6rem,12rem) 3rem;gap:12px;align-items:center;padding:6px 12px;border-top:1px solid var(--hair)}
.mt .r.h{background:var(--soft);color:var(--mute);border-top:0;padding:4px 12px}
.mt .r span:last-child{text-align:right;font-weight:600}
.mt .r.h span:last-child{font-weight:400}
.mt .st{color:var(--body)}
.card{border:1px solid var(--hair);border-radius:14px;padding:16px}
/* Now */
.now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
.art{display:flex;gap:14px;align-items:flex-start}
.art .meta{display:flex;flex-direction:column}
/* A */
.a{display:grid;grid-template-columns:17rem auto;gap:20px;align-items:start}
/* B */
.b .top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.b .top .meta{flex:1;display:flex;flex-direction:column}
.b .top .pcs{font-weight:600}
.b .mt{margin-left:58px}
/* C */
.c{border:1px solid var(--hair);border-radius:14px;overflow:hidden;width:fit-content;max-width:100%}
.c .r{display:grid;grid-template-columns:18rem 7.5rem minmax(6rem,12rem) 3rem;gap:12px;align-items:center;padding:7px 16px;border-top:1px solid var(--hair)}
.c .r.h{background:var(--soft);color:var(--mute);border-top:0;padding:7px 16px}
.c .r span:last-child{text-align:right;font-weight:600}
.c .r.h span:last-child{font-weight:400}
.c .r.first{border-top:1px solid #dcdce1}
.c .r.h + .r.first{border-top:0}
.c .who{display:flex;gap:12px;align-items:center}
.c .who .meta{display:flex;flex-direction:column;line-height:1.3}
.c .cont{border-top-color:transparent}
/* D */
.d{display:flex;flex-direction:column;gap:22px}
.d .top{display:flex;gap:14px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--hair)}
.d .top .meta{flex:1;display:flex;flex-direction:column}
.d .rows{width:fit-content;max-width:100%}
.d .rows .r{display:grid;grid-template-columns:7.5rem minmax(6rem,12rem) 3rem;gap:12px;padding:6px 0 6px 58px;border-bottom:1px solid #f0f0f3}
.d .rows .r:last-child{border-bottom:0}
.d .rows .r span:last-child{text-align:right;font-weight:600}
@media (max-width:760px){
  .now,.a{grid-template-columns:1fr}
  .b .mt{margin-left:0}
  .c .r{grid-template-columns:7.5rem minmax(0,1fr) 3.5rem}
  .c .r > :first-child{grid-column:1/-1}
  .c .r.h > :first-child{display:none}
  .d .rows .r{padding-left:0}
  .shead,.sbody,.sfoot{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="pbar">
  <b>Allotment sheet · article + stores</b>
  <div class="seg" id="seg"></div>
  <span class="why" id="why"></span>
</div>
<div class="stage"><div class="sheet">
  <div class="shead"><span class="back">‹ Back</span><div><div class="crumb">Allotments / ALT-00000015</div><h2>Garmen Nusantara</h2></div></div>
  <div class="sbody" id="body"></div>
  <div class="sfoot"><span class="note">3 pcs already dispatched, so it can no longer be cancelled. Lower the rest with Edit.</span><span style="display:flex;gap:8px"><button class="btn red">Cancel</button><button class="btn blue">Edit</button></span></div>
</div></div>
<script>
const C = {dispatched:"#2f86d8",missing:"#d70015",received:"#36b827",cancelled:"#b8b8c0",pick:"#dcdce1",picked:"#e9c88f"};
const ARTS = [
  {name:"Celana Chino Slim Fit", code:"00000016", pcs:16, stores:3, rows:[["Dispatched","dispatched","C002",5],["Missing","missing","C001",1],["Received","received","C001, C003",10]]},
  {name:"Kaos Uji UJ16", code:"00000012", pcs:3, stores:2, rows:[["Dispatched","dispatched","C001",3],["Cancelled","cancelled","C002",4]]},
];
const thumb = `<span class="thumb"><i></i></span>`;
const st = (w,k) => `<span class="st"><i class="dot" style="background:${C[k]}"></i>${w}</span>`;
const mini = a => `<div class="mt"><div class="r h"><span>Status</span><span>Stores</span><span>Pcs</span></div>${a.rows.map(([w,k,s,n])=>`<div class="r">${st(w,k)}<span class="num">${s}</span><span class="num">${n}</span></div>`).join("")}</div>`;
const meta = a => `<div class="meta"><span class="name">${a.name}</span><span class="code">${a.code}</span><span class="num" style="margin-top:4px"><b>${a.pcs} pcs</b> <span style="color:var(--body)">· ${a.stores} stores</span></span></div>`;
const OPTS = {
  "Now": ["two sides, table pushed right — a gap in the middle",
    () => ARTS.map(a => `<div class="card now"><div class="art">${thumb}${meta(a)}</div>${mini(a)}</div>`).join("")],
  "A · Tight sides": ["the article keeps a fixed 17rem; the table takes the rest, no gap",
    () => ARTS.map(a => `<div class="card a"><div class="art">${thumb}${meta(a)}</div>${mini(a)}</div>`).join("")],
  "B · Head over table ★": ["article in one line on top (pcs at the right), table under it lined up with the name",
    () => ARTS.map(a => `<div class="card b"><div class="top">${thumb}<div class="meta"><span class="name">${a.name}</span><span class="code">${a.code} · ${a.stores} stores</span></div><span class="pcs num">${a.pcs} pcs</span></div>${mini(a)}</div>`).join("")],
  "C · One table": ["one table for the whole sheet: Article · Status · Stores · Pcs; the article says itself once",
    () => `<div class="c"><div class="r h"><span>Article</span><span>Status</span><span>Stores</span><span>Pcs</span></div>${ARTS.map(a => a.rows.map(([w,k,s,n],i)=>`<div class="r ${i===0?"first":"cont"}">${i===0?`<span class="who">${thumb}<span class="meta"><span class="name">${a.name}</span><span class="code">${a.code} · ${a.pcs} pcs</span></span></span>`:"<span></span>"}${st(w,k)}<span class="num">${s}</span><span class="num">${n}</span></div>`).join("")).join("")}</div>`],
  "D · No boxes": ["no card, no table frame: a head line per article and plain rows under it",
    () => `<div class="d">${ARTS.map(a => `<div><div class="top">${thumb}<div class="meta"><span class="name">${a.name}</span><span class="code">${a.code} · ${a.stores} stores</span></div><span class="num" style="font-weight:600">${a.pcs} pcs</span></div><div class="rows">${a.rows.map(([w,k,s,n])=>`<div class="r">${st(w,k)}<span class="num">${s}</span><span class="num">${n}</span></div>`).join("")}</div></div>`).join("")}</div>`],
};
const keys = Object.keys(OPTS);
let on = new URLSearchParams(location.search).get("o") ?? keys[3];
function draw(){
  document.getElementById("seg").innerHTML = keys.map(k=>`<button class="${k===on?"on":""}" data-k="${k}">${k}</button>`).join("");
  document.getElementById("why").textContent = OPTS[on][0];
  document.getElementById("body").innerHTML = OPTS[on][1]() + `<div class="act">› Activity (8)</div>`;
}
document.getElementById("seg").onclick = e => { const k = e.target.dataset.k; if (k) { on = k; draw(); } };
draw();
</script>
</body>
</html>
