# Windows POS installer on Cloud Build, no Windows PC needed.
#   deploy/windows/stage-pos.sh        stages the tree and submits this
#   deploy/windows/fetch-pos.sh <id>   downloads the installer afterwards
# The Cloud Build account cannot write to a bucket, so the installer is pushed
# as a scratch image (itulah/win-pos:<build id>) and fetched from the registry.
steps:
  - name: rust:1.98-bookworm
    entrypoint: bash
    args: ["deploy/windows/build-pos.sh"]
    env:
      - GUDANG=${_GUDANG}
      - DEBUG=${_DEBUG}
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "asia-southeast2-docker.pkg.dev/${PROJECT_ID}/itulah/win-pos:${BUILD_ID}",
           "-f", "deploy/windows/Dockerfile.out", "out"]
images:
  - asia-southeast2-docker.pkg.dev/${PROJECT_ID}/itulah/win-pos:${BUILD_ID}
options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
substitutions:
  _GUDANG: "0"
  _DEBUG: "0"
