#!/usr/sbin/nft -f
#
# Lock the distribution centre down to the fleet and its own warehouse floor.
#
# # Why this is not simply the shop rule set
#
# A shop box can be sealed almost completely: it sells from its own SQLite and
# nothing on the shop network needs to reach it. A DC cannot. The portals that
# read tags and the printer that writes them are separate machines on the
# warehouse LAN, so the DC box has to accept connections from one and open
# connections to the other. Loading nftables-store.conf here would leave the
# portals silently dropped and every print run timing out at five seconds, and
# both failures look like broken hardware rather than a firewall.
#
# The extra openings are deliberately narrow: two named subnets, two ports,
# one direction each.
#
# # Fill these in before loading
#
# Both defaults are RFC 5737 documentation ranges, so an unedited copy of this
# file blocks the readers and the printer rather than admitting a subnet
# somebody did not mean to admit. A dead portal is a better first symptom than
# an open port.

define HEADSCALE_ADDR = 203.0.113.10     # <-- the control server's real IP
define NTP_SERVERS    = { 216.239.35.0, 216.239.35.4 }

define READER_NET     = 198.51.100.0/24  # <-- the RFID portals' subnet
define PRINTER_ADDR   = 198.51.100.20    # <-- the label printer (Printronix)
define PRINTER_PORT   = 9100             # raw socket; the Edge default

# The port the DC Edge listens on. It must match BIND_ADDR in /etc/itulah/dc.env.
define EDGE_PORT      = 8081

flush ruleset

table inet fleet {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # Traffic from inside the tunnel: the cloud replying to us. The
        # headscale policy has already decided what may arrive here.
        iifname "tailscale0" accept

        # The RFID portals posting observations. Signed per reader with an
        # HMAC the Edge verifies, so this rule is a coarse first filter and
        # not the thing that decides whether a burst is genuine — an
        # unenrolled reader on this subnet is still refused by the Edge.
        ip saddr $READER_NET tcp dport $EDGE_PORT accept

        icmp type echo-request limit rate 5/second accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert } accept
    }

    chain forward {
        # A DC edge is not a router between the warehouse LAN and the tailnet.
        # Everything that crosses does so through the Edge process, which is
        # what makes the fleet's view of the DC auditable.
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        ct state established,related accept
        oif lo accept

        # Anything the fleet sends, sends through the tunnel.
        oifname "tailscale0" accept

        # The label printer. Opened by the print-session handler, which dials
        # the host named in the request — so this rule, not the request, is
        # what confines printing to the one machine that should receive it.
        ip daddr $PRINTER_ADDR tcp dport $PRINTER_PORT accept

        # The control server, over TLS.
        ip daddr $HEADSCALE_ADDR tcp dport 443 accept

        # WireGuard's own traffic: the source port is chosen at random per
        # boot and the destination is whatever peer or relay we reach, so this
        # is matched by the process rather than by address.
        meta skuid "itulah-tailscale" udp accept
        udp dport 3478 accept                      # STUN, to find our own address

        # DNS and time. Both are prerequisites for everything above, and a
        # drifted clock breaks TLS and WireGuard in ways that look unrelated
        # to time.
        udp dport 53 accept
        tcp dport 53 accept
        ip daddr $NTP_SERVERS udp dport 123 accept

        # Deliberately absent: 80/443 to the wider internet, and any route to
        # a shop. Receiving stock is unaffected while this blocks things — the
        # DC works from its own SQLite and its outbox drains when the tunnel
        # returns.
    }
}
