#!/usr/sbin/nft -f
#
# Lock a shop box down to the fleet, and nothing else.
#
# # Why this file exists at all
#
# It is tempting to assume the tailnet already does this. It does not. The
# headscale policy governs traffic BETWEEN fleet nodes — it is what stops
# store-07 reaching store-12. It says nothing about the shop box browsing the
# web, reaching a random server, or being used as a general computer. If you
# want a till to be a till, that is this file's job, not the tailnet's.
#
# # What must stay open, and why
#
# A shop box cannot be fully sealed or it can never join the fleet:
#
#   * the control server, to enrol and to learn about changes
#   * the DERP relay, for shops whose ISP forbids a direct connection
#   * WireGuard's own UDP, for the shops that CAN connect directly
#   * DNS, to resolve the control server's name
#   * NTP, because a clock that has drifted breaks both TLS and WireGuard,
#     and the failure looks like nothing to do with time
#
# Everything else is refused. Note what is NOT listed: the cloud itself. Its
# traffic arrives inside the WireGuard tunnel, so it needs no rule here.
#
# Trading is unaffected while this blocks things: the shop sells from its own
# SQLite and its outbox drains when the tunnel returns.

define HEADSCALE_ADDR = 203.0.113.10   # <-- the control server's real IP
define NTP_SERVERS    = { 216.239.35.0, 216.239.35.4 }

flush ruleset

table inet fleet {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # Traffic from inside the tunnel: the cloud replying to us. The
        # headscale policy has already decided what may arrive here.
        iifname "tailscale0" accept

        icmp type echo-request limit rate 5/second accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert } accept
    }

    chain forward {
        # A till is not a router.
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        ct state established,related accept
        oif lo accept

        # Anything the fleet sends, sends through the tunnel.
        oifname "tailscale0" accept

        # The control server, over TLS.
        ip daddr $HEADSCALE_ADDR tcp dport 443 accept

        # WireGuard's own traffic: source port is chosen at random per boot,
        # and the destination is whatever peer or relay we are reaching, so
        # this is matched by the process rather than by address.
        meta skuid "itulah-tailscale" udp accept
        udp dport 3478 accept                      # STUN, to find our own address

        # DNS and time. Both are prerequisites for everything above.
        udp dport 53 accept
        tcp dport 53 accept
        ip daddr $NTP_SERVERS udp dport 123 accept

        # Deliberately absent: 80/443 to the wider internet. A shop box that
        # needs a package update gets it during a maintenance window, with
        # this rule temporarily relaxed — not as a standing permission.
    }
}
