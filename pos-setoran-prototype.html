<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setoran sementara · kasir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1d1d1f;--body:#4b5563;--mute:#6b7280;--faint:#a1a1aa;--hairline:#e6e6e9;--hairline-2:#d9d9de;--soft:#f6f6f7;--soft-2:#eeeef0;--accent:#2563d9;--accent-bg:#ebf1fd;--ok:#15803d;--bad:#d70015;--shadow:0 24px 60px rgba(15,23,42,.18),0 2px 8px rgba(15,23,42,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:#e9ebef;font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 20px;background:rgba(233,235,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline-2)}
.top b{font-size:17px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:#dfe1e6}
.seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:none;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.lbl{color:var(--mute)}
.stage{position:relative;height:calc(100vh - 58px);min-height:760px;overflow:hidden}
.till{position:absolute;inset:0;padding:18px 24px;filter:blur(1.5px);opacity:.5}
.till div{height:52px;border-radius:10px;background:#fff;margin-bottom:8px}
.veil{position:absolute;inset:0;background:rgba(30,35,45,.28);display:grid;place-items:center;padding:24px}

.dlg{background:#fff;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%;overflow:hidden;animation:pop 220ms cubic-bezier(.23,1,.32,1) both}
@keyframes pop{from{opacity:0;scale:.97}}
@media (prefers-reduced-motion:reduce){.dlg{animation:none}}
.head{display:flex;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid var(--hairline)}
.head .ttl{flex:1;margin:0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.x{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:9px;background:none;cursor:pointer;color:var(--body)}
.x:hover{background:var(--soft-2);color:var(--ink)}
.x svg{width:20px;height:20px}
.kbd{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:5px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);font-size:14px;font-weight:500}
.go{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:60px;padding:0 16px 0 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:18px;font-weight:600;cursor:pointer;transition:scale 120ms cubic-bezier(.23,1,.32,1),background-color 150ms ease}
.go:active:not(:disabled){scale:.98}
.go:disabled{background:var(--soft-2);color:var(--mute);cursor:default}
.go:disabled .kbd{background:#fff;box-shadow:inset 0 0 0 1px var(--hairline-2);color:var(--mute)}

/* the money chips, as the till draws them */
.note{position:relative;width:52px;height:30px;border-radius:6px;flex:none}
.note::before{content:"";position:absolute;right:6px;top:6px;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.35)}
.note::after{content:"";position:absolute;left:8px;bottom:7px;width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.45)}
.coin{width:30px;height:30px;border-radius:50%;flex:none;margin:0 11px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12),inset 0 -3px 6px rgba(0,0,0,.08)}

/* a counting row */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) 168px 120px;align-items:center;gap:12px;height:54px;padding:0 12px;margin:0 -12px;border-radius:10px;transition:background-color 120ms ease}
.row:focus-within{background:var(--accent-bg)}
.row .val{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.step{display:flex;align-items:center;gap:6px;justify-content:center}
.step button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline-2);font-size:20px;cursor:pointer;transition:scale 120ms cubic-bezier(.23,1,.32,1)}
.step button:active{scale:.94}
.step input{width:72px;height:40px;border:1px solid var(--hairline-2);border-radius:9px;background:#fff;text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.step input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,217,.18)}
.step input::placeholder{color:var(--faint);font-weight:500}
.amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.amt.zero{color:var(--faint);font-weight:400}
.hrow{display:grid;grid-template-columns:56px minmax(0,1fr) 168px 120px;gap:12px;padding:0 0 8px;color:var(--mute)}
.hrow .c{text-align:center}.hrow .r{text-align:right}
.sep{height:1px;background:var(--hairline);margin:6px 0}

/* A: left counting, right summary — the Tutup kasir layout */
.a{width:min(1080px,100%);height:min(720px,100%)}
.a .body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.a .left{padding:22px 28px;overflow:auto}
.a .right{display:flex;flex-direction:column;gap:18px;padding:22px 24px 24px;border-left:1px solid var(--hairline);background:#fff}
.who{display:flex;align-items:center;gap:12px}
.av{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#efe3f6;color:#7a3e9d;font-weight:600}
.who b{display:block}
.facts{display:grid;gap:8px}
.facts div{display:flex;justify-content:space-between;gap:12px}
.facts span{color:var(--mute)}
.facts b{font-weight:600;font-variant-numeric:tabular-nums}
.big .k{color:var(--mute)}
.big .v{font-size:40px;line-height:46px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big .n{color:var(--mute);margin-top:2px}
.sp{flex:1}

/* B: notes left, coins right, total and button along the bottom */
.b{width:min(1080px,100%)}
.b .body{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;padding:22px 28px}
.b .row{grid-template-columns:56px minmax(0,1fr) 168px}
.b .hrow{grid-template-columns:56px minmax(0,1fr) 168px}
.b .foot{display:flex;align-items:center;gap:24px;padding:16px 28px;border-top:1px solid var(--hairline)}
.b .foot .go{width:300px}
.b .tot{flex:1;display:flex;align-items:baseline;gap:14px}
.b .tot .v{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.b .tot .k{color:var(--mute)}

/* Now: the dialog as the till has it */
.now{width:540px}
.now .body{padding:18px 28px;overflow:auto}
.now .row{height:48px;grid-template-columns:52px minmax(0,1fr) 150px 70px}
.now .hrow{grid-template-columns:52px minmax(0,1fr) 150px 70px}
.now .step button{width:32px;height:32px;font-size:18px}
.now .step input{width:64px;height:32px;font-size:16px}
.now .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline)}
.now .total b{font-size:26px}
.now .foot{display:flex;justify-content:flex-end;padding:12px 24px;border-top:1px solid var(--hairline)}
.now .go{width:auto;height:44px;font-size:16px;gap:14px}
</style>
</head>
<body>
<header class="top">
  <b>Setoran sementara</b>
  <span class="lbl">Versi</span><div class="seg" id="ver"></div>
</header>
<div class="stage">
  <div class="till"><div></div><div></div><div></div><div></div></div>
  <div class="veil" id="veil"></div>
</div>
<script>
const D = [
  [100000, 'note', '#c95050'], [50000, 'note', '#3b6fb6'], [20000, 'note', '#4a8f62'], [10000, 'note', '#7a52a8'],
  [5000, 'note', '#9e7445'], [2000, 'note', '#7b7d86'], [1000, 'note', '#6b9b88'],
  [500, 'coin', 'radial-gradient(circle at 35% 30%,#f3e3a6,#c9a94f)'], [200, 'coin', 'radial-gradient(circle at 35% 30%,#f4f4f6,#bfc1c7)'], [100, 'coin', 'radial-gradient(circle at 35% 30%,#f4f4f6,#bfc1c7)'],
]
const VERS = [['now', 'Sekarang'], ['a', 'A · Kiri-kanan ★'], ['b', 'B · Kertas | koin']]
let V = 'a'
try { V = localStorage.getItem('st.v') || V } catch {}
const N = {}
const rp = n => 'Rp ' + n.toLocaleString('id-ID')
const total = () => D.reduce((a, [v]) => a + v * (N[v] || 0), 0)
const pcs = () => D.reduce((a, [v]) => a + (N[v] || 0), 0)
const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
const chip = (kind, bg) => kind === 'note' ? `<span class="note" style="background:${bg}"></span>` : `<span class="coin" style="background:${bg}"></span>`
const row = ([v, kind, bg], amt = true) => `<div class="row">${chip(kind, bg)}<span class="val">${rp(v)}</span>
  <span class="step"><button data-d="${v}:-1" aria-label="Kurangi satu ${rp(v)}">−</button><input data-n="${v}" inputmode="numeric" placeholder="0" value="${N[v] || ''}" aria-label="Jumlah lembar ${rp(v)}"><button data-d="${v}:1" aria-label="Tambah satu ${rp(v)}">+</button></span>
  ${amt ? `<span class="amt${N[v] ? '' : ' zero'}" data-a="${v}">${N[v] ? rp(v * N[v]) : '—'}</span>` : ''}</div>`
const goBtn = () => `<button class="go" ${total() > 0 ? '' : 'disabled'}><span>Setor ${total() > 0 ? rp(total()) : ''}</span><span class="kbd">Enter</span></button>`

function now() {
  return `<section class="dlg now"><div class="head"><p class="ttl" style="font-size:20px">Setoran sementara</p><button class="x" aria-label="Tutup">${X}</button></div>
    <div class="body"><div class="hrow"><span style="grid-column:1/3">Uang kertas &amp; koin</span><span class="c">Jumlah</span><span class="r">Nilai</span></div>
      <div class="rows">${D.map(d => row(d)).join('')}</div>
      <div class="total"><span>Total setoran</span><b data-t>${rp(total())}</b></div></div>
    <div class="foot">${goBtn()}</div></section>`
}
function a() {
  return `<section class="dlg a"><div class="head"><p class="ttl">Setoran sementara</p><button class="x" aria-label="Tutup (Esc)">${X}</button></div>
    <div class="body">
      <div class="left"><div class="hrow"><span style="grid-column:1/3">Uang kertas &amp; koin</span><span class="c">Jumlah</span><span class="r">Nilai</span></div>
        <div class="rows">${D.slice(0, 7).map(d => row(d)).join('')}<div class="sep"></div>${D.slice(7).map(d => row(d)).join('')}</div></div>
      <div class="right">
        <div class="who"><span class="av">RP</span><div><b>Rizky Pratama</b><span class="lbl">Kasir 1</span></div></div>
        <div class="facts"><div><span>Shift dibuka</span><b>29 Okt 2026, 12:01</b></div><div><span>Modal awal</span><b>Rp 500.000</b></div><div><span>Diterima oleh</span><b>Kepala toko</b></div></div>
        <div class="big"><div class="k">Total setoran</div><div class="v" data-t>${rp(total())}</div><div class="n" data-p>${pcs()} lembar/keping</div></div>
        <span class="sp"></span>${goBtn()}
      </div>
    </div></section>`
}
function b() {
  return `<section class="dlg b"><div class="head"><p class="ttl">Setoran sementara</p><button class="x" aria-label="Tutup (Esc)">${X}</button></div>
    <div class="body">
      <div><div class="hrow"><span style="grid-column:1/3">Uang kertas</span><span class="c">Jumlah</span></div><div class="rows">${D.slice(0, 7).map(d => row(d, false)).join('')}</div></div>
      <div><div class="hrow"><span style="grid-column:1/3">Koin</span><span class="c">Jumlah</span></div><div class="rows">${D.slice(7).map(d => row(d, false)).join('')}</div></div>
    </div>
    <div class="foot"><div class="tot"><span class="k">Total setoran</span><span class="v" data-t>${rp(total())}</span><span class="k" data-p>${pcs()} lembar/keping</span></div>${goBtn()}</div></section>`
}
function render() {
  document.getElementById('ver').innerHTML = VERS.map(([k, l]) => `<button class="${k === V ? 'on' : ''}" data-v="${k}">${l}</button>`).join('')
  document.getElementById('veil').innerHTML = V === 'now' ? now() : V === 'a' ? a() : b()
  const first = document.querySelector('[data-n]'); first && first.focus()
}
// Counting updates figures in place, so the field keeps its focus and caret.
function refresh() {
  document.querySelectorAll('[data-a]').forEach(el => { const v = +el.dataset.a; el.textContent = N[v] ? rp(v * N[v]) : '—'; el.classList.toggle('zero', !N[v]) })
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = rp(total()))
  document.querySelectorAll('[data-p]').forEach(el => el.textContent = pcs() + ' lembar/keping')
  const go = document.querySelector('.go'); go.disabled = total() <= 0; go.querySelector('span').textContent = 'Setor' + (total() > 0 ? ' ' + rp(total()) : '')
}
document.addEventListener('click', e => {
  const v = e.target.closest('[data-v]'); if (v) { V = v.dataset.v; try { localStorage.setItem('st.v', V) } catch {} render(); return }
  const d = e.target.closest('[data-d]'); if (d) { const [val, s] = d.dataset.d.split(':'); N[val] = Math.max(0, (N[val] || 0) + +s); const inp = document.querySelector(`[data-n="${val}"]`); inp.value = N[val] || ''; refresh() }
})
document.addEventListener('input', e => { const v = e.target.dataset.n; if (!v) return; e.target.value = e.target.value.replace(/\D/g, ''); N[v] = +e.target.value || 0; refresh() })
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return
  const all = [...document.querySelectorAll('[data-n]')], i = all.indexOf(document.activeElement); if (i < 0) return
  e.preventDefault(); all[Math.max(0, Math.min(all.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus()
})
render()
</script>
</body>
</html>
