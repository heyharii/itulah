const THEMES = [{"id": "fog", "name": "Fog", "tag": "Abu netral", "desc": "Rail abu netral, menu aktif abu tipis, dan badge angka abu. Paling dekat dengan Paper, dengan aksen yang lebih tenang.", "recommend": true, "activeStyle": "soft", "badgeStyle": "soft", "colors": {"panel": "#ffffff", "text": "#39424e", "muted": "#65707d", "heading": "#202831", "line": "#e8ebef", "edge": "#dde2e7", "hover": "#f3f5f7", "scroll": "#bcc4cc", "frame": "#e8ebef", "rail": "#e2e6eb", "rail-ink": "#53606f", "rail-hover": "#d2d9e1", "rail-active": "#ffffff", "rail-on": "#273440"}}, {"id": "pearl", "name": "Pearl", "tag": "Putih berlapis", "desc": "Rail putih tulang, menu aktif cukup lewat garis kiri dan bobot teks. Notifikasi berupa angka berbingkai agar tetap terbaca.", "recommend": false, "activeStyle": "line", "badgeStyle": "outline", "colors": {"panel": "#ffffff", "text": "#39424e", "muted": "#65707d", "heading": "#202831", "line": "#e8ebef", "edge": "#dde2e7", "hover": "#f3f5f7", "scroll": "#bcc4cc", "frame": "#eff0f2", "rail": "#f6f6f5", "rail-ink": "#5c646e", "rail-hover": "#e7e9eb", "rail-active": "#e6e8eb", "rail-on": "#252d36"}}, {"id": "linen", "name": "Linen", "tag": "Abu hangat", "desc": "Rail abu hangat dengan menu aktif berbingkai tipis. Angka notifikasi memakai warna tanah yang redup.", "recommend": false, "activeStyle": "outline", "badgeStyle": "warm", "colors": {"panel": "#ffffff", "text": "#39424e", "muted": "#65707d", "heading": "#202831", "line": "#e8ebef", "edge": "#dde2e7", "hover": "#f3f5f7", "scroll": "#bcc4cc", "frame": "#eae7e1", "rail": "#e4e0d8", "rail-ink": "#655d51", "rail-hover": "#d6d0c6", "rail-active": "#ffffff", "rail-on": "#443b30"}}, {"id": "cloud", "name": "Cloud", "tag": "Biru abu lembut", "desc": "Panel menu tetap putih; warna hanya muncul di rail luar. Menu aktif berbingkai netral dan badge abu, tanpa dominasi biru di menu.", "recommend": false, "activeStyle": "outline", "badgeStyle": "soft", "colors": {"panel": "#ffffff", "text": "#39424e", "muted": "#65707d", "heading": "#202831", "line": "#e8ebef", "edge": "#dde2e7", "hover": "#f3f5f7", "scroll": "#bcc4cc", "frame": "#e6ebf2", "rail": "#dce4ee", "rail-ink": "#4b5e76", "rail-hover": "#cbd6e4", "rail-active": "#ffffff", "rail-on": "#31435a"}}, {"id": "ink", "name": "Ink rail", "tag": "Arang + putih", "desc": "Rail arang memisahkan navigasi utama dari panel putih. Menu aktif abu lembut dan badge angka gelap memberi penanda yang jelas.", "recommend": true, "activeStyle": "soft", "badgeStyle": "solid", "colors": {"panel": "#ffffff", "text": "#39424e", "muted": "#65707d", "heading": "#202831", "line": "#e8ebef", "edge": "#dde2e7", "hover": "#f3f5f7", "scroll": "#bcc4cc", "frame": "#e8ebee", "rail": "#282e35", "rail-ink": "#bac3ce", "rail-hover": "#3b444f", "rail-active": "#f3f5f7", "rail-on": "#28323e"}}, {"id": "midnight", "name": "Midnight", "tag": "Navy + putih", "desc": "Rail biru malam dengan panel putih. Menu aktif arang penuh memberi kontras paling kuat; notifikasi hanya angka agar tidak bersaing.", "recommend": false, "activeStyle": "solid", "badgeStyle": "text", "colors": {"panel": "#ffffff", "text": "#39424e", "muted": "#65707d", "heading": "#202831", "line": "#e8ebef", "edge": "#dde2e7", "hover": "#f3f5f7", "scroll": "#bcc4cc", "frame": "#e7ebf0", "rail": "#1e2c40", "rail-ink": "#becce0", "rail-hover": "#30445f", "rail-active": "#edf2f8", "rail-on": "#233c5b"}}];
const ACTIVE={
 soft:{label:'Abu lembut',active:'#eceff2',on:'#27323e',marker:'transparent','active-edge':'#e2e6eb','active-shadow':'0 0 0 0 transparent'},
 outline:{label:'Bingkai tipis',active:'#ffffff',on:'#27323e',marker:'transparent','active-edge':'#a8b4c1','active-shadow':'0 1px 2px #182a3c0a'},
 line:{label:'Garis kiri',active:'#ffffff',on:'#202c39',marker:'#4b5b6e','active-edge':'transparent','active-shadow':'0 0 0 0 transparent'},
 solid:{label:'Arang penuh',active:'#333d49',on:'#ffffff',marker:'transparent','active-edge':'#333d49','active-shadow':'0 0 0 0 transparent'}
};
const BADGES={
 soft:{label:'Abu lembut',badge:'#e8ecf0','badge-ink':'#455363','badge-border':'transparent'},
 solid:{label:'Angka gelap',badge:'#455363','badge-ink':'#ffffff','badge-border':'#455363'},
 outline:{label:'Bingkai tipis',badge:'#ffffff','badge-ink':'#4c5969','badge-border':'#c3cbd4'},

 warm:{label:'Tanah lembut',badge:'#eee7dc','badge-ink':'#705735','badge-border':'transparent'}
};
function resolveColors(t,current=false){const a=current?state.active:t.activeStyle,b=current?state.badge:t.badgeStyle;return {...t.colors,...ACTIVE[a],...BADGES[b],'badge-radius':b==='solid'?'999px':'5px','rail-badge':b==='text'?t.colors.rail:BADGES[b].badge,'rail-badge-ink':b==='text'?t.colors['rail-ink']:BADGES[b]['badge-ink']}}
function applyStyle(){const t=theme();$('nav').style.cssText=Object.entries(resolveColors(t,true)).filter(([k])=>k!=='label').map(([k,v])=>`--${k}:${v}`).join(';');$('shell').style.background=t.colors.frame;$('active-style').value=state.active;$('badge-style').value=state.badge;$('nav').dataset.badge=state.badge;}
function railBadge(d){const count=d.g.flatMap(g=>g.r).reduce((s,r)=>s+rowCount(r),0);return count?`<span class="rail-count" aria-label="${count} menunggu">${count}</span>`:''}

const state={theme:'fog',dept:'buying',layout:'labels',view:'preview',active:'soft',badge:'soft',selected:{},open:{},setup:{}};
D.forEach(d=>state.selected[d.id]=d.on);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rowName=r=>Array.isArray(r)?r[0]:r;
const rowCount=r=>Array.isArray(r)?r[1]:0;
const styleOf=t=>Object.entries(resolveColors(t)).map(([k,v])=>`--${k}:${v}`).join(';');
const theme=()=>THEMES.find(t=>t.id===state.theme);
function row(r,d){const name=rowName(r),n=rowCount(r),active=state.selected[d.id]===name;return `<button class="item${active?' on':''}" data-row="${esc(name)}" title="${esc(name)}"${active?' aria-current="page"':''}><span class="label">${esc(name)}</span>${n?`<span class="badge" aria-label="${n} menunggu">${n}</span>`:''}</button>`}
function group(g,i,d,fold){const key=`${d.id}:${i}`,inside=g.r.some(r=>rowName(r)===state.selected[d.id]),open=state.open[key]??inside;return `<div class="group${fold?(open?' open':' shut'):''}">${g.l?fold?`<button class="glabel" data-fold="${key}" aria-expanded="${open}"><span>${esc(g.l)}</span>${svg('chev')}</button>`:`<div class="glabel">${esc(g.l)}</div>`:''}<div class="fold"${fold&&!open?' inert':''}>${g.r.map(r=>row(r,d)).join('')}</div></div>`}
function updateUrl(){const u=new URL(location.href);u.searchParams.set('theme',state.theme);u.searchParams.set('d',state.dept);u.searchParams.set('layout',state.layout);u.searchParams.set('view',state.view);u.searchParams.set('active',state.active);u.searchParams.set('badge',state.badge);try{history.replaceState(null,'',u)}catch{}}
function renderNav(){const d=D.find(d=>d.id===state.dept);applyStyle();$('dept').textContent=d.l;$('rail').innerHTML=`<div class="ic" title="Itulah">${svg('home')}</div>`+D.map(x=>`<button class="ic${x.id===d.id?' on':''}" data-dept="${x.id}" title="${esc(x.l)}" aria-label="${esc(x.l)}"${x.id===d.id?' aria-current="true"':''}>${svg(x.ic)}${railBadge(x)}</button>`).join('')+`<div class="ic end" title="Workspace">${svg('cog')}</div>`;
 const fold=state.layout!=='labels';$('list').innerHTML=d.g.map((g,i)=>state.layout==='setup'&&g.s?'':group(g,i,d,fold)).join('');const set=d.g.filter(g=>g.s),hasSelected=set.some(g=>g.r.some(r=>rowName(r)===state.selected[d.id])),open=state.setup[d.id]??hasSelected;
 $('foot').innerHTML=state.layout==='setup'&&set.length?`<div class="setup ${open?'open':'shut'}"><button class="glabel" data-setup aria-expanded="${open}"><span>${svg('cog')}Setup</span>${svg('chev')}</button><div class="fold"${!open?' inert':''}>${set.map(g=>`<div class="subhead">${esc(g.l)}</div>${g.r.map(r=>row(r,d)).join('')}`).join('')}</div></div>`:'';
 $('layout').value=state.layout;$('department').value=state.dept;
}
function renderPalettes(){$('palettes').innerHTML=THEMES.map((t,i)=>`<button class="palette" data-theme="${t.id}" aria-pressed="${t.id===state.theme}" title="${esc(t.tag)}"><span class="swatches" aria-hidden="true"><i style="background:${t.colors.panel}"></i><i style="background:${t.colors.rail}"></i><i style="background:${resolveColors(t).active}"></i><i style="background:${resolveColors(t).text}"></i></span><strong><span class="n">0${i+1}</span>${t.name}</strong></button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===state.view))}
function luminance(h){const c=h.match(/[\da-f]{2}/gi).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722}
function contrast(a,b){const x=[luminance(a),luminance(b)].sort((a,b)=>a-b);return ((x[1]+.05)/(x[0]+.05)).toFixed(1)}
function sample(t){
 const d=D.find(d=>d.id===state.dept),sel=state.selected[d.id],g=d.g.find(g=>g.r.some(r=>rowName(r)===sel));
 const rows=g.r.slice(0,5);if(!rows.some(r=>rowName(r)===sel))rows[rows.length-1]=g.r.find(r=>rowName(r)===sel);
 const other=d.g.find(x=>x!==g&&x.r.some(r=>rowCount(r)))??d.g.find(x=>x!==g);
 const smallRow=r=>`<div class="item${rowName(r)===sel?' on':''}"><span class="label">${esc(rowName(r))}</span>${rowCount(r)?`<span class="badge">${rowCount(r)}</span>`:''}</div>`;
 const colors=resolveColors(t);
 return `<article class="sample"><div class="sample-title"><strong>${t.name}</strong><span>${t.tag}</span></div><div class="mini" style="${styleOf(t)}" data-badge="${t.badgeStyle}"><div class="mini-rail">${svg('home')}<span class="mini-on">${svg(d.ic)}${railBadge(d)}</span>${svg('fin')}${svg('cog')}</div><div class="mini-panel"><h3>${esc(d.l)}</h3><div class="glabel">${esc(g.l??'Workspace')}</div>${rows.map(smallRow).join('')}${other?`<div class="glabel">${esc(other.l??'Workspace')}</div>${other.r.slice(0,2).map(smallRow).join('')}`:''}</div></div><div class="sample-details">${ACTIVE[t.activeStyle].label} · ${BADGES[t.badgeStyle].label.toLowerCase()}</div><button class="sample-pick" data-theme="${t.id}" aria-pressed="${state.theme===t.id}">${state.theme===t.id?'Pakai ulang kombinasi ini':'Coba '+t.name}</button><p class="contrast">Teks ${contrast(colors.text,colors.panel)}:1 · label ${contrast(colors.muted,colors.panel)}:1</p></article>`
}

function renderContent(){const t={...theme(),colors:resolveColors(theme(),true)},d=D.find(d=>d.id===state.dept);if(state.view==='compare'){$('content').innerHTML=`<p class="compare-caption">Departemen dan menu aktif mengikuti sidebar kiri. Setiap kartu menampilkan kombinasi awalnya, termasuk angka notifikasi. Klik Coba untuk memakainya di sidebar kiri.</p><div class="comparison">${THEMES.map(sample).join('')}</div>`;return}
 const tokens=[['Rail luar','rail'],['Panel','panel'],['Menu aktif','active'],['Notifikasi','badge']];$('content').innerHTML=`<div class="theme-note"><div><h2>${t.name} <span style="font-weight:400;color:#697381">/ ${t.tag}</span></h2><p>${t.desc}</p><p class="current-combo">Dipakai: ${ACTIVE[state.active].label} · notifikasi ${BADGES[state.badge].label.toLowerCase()}</p></div>${t.recommend?'<span class="recommend">Pilihan yang disarankan</span>':''}</div><div class="tokens">${tokens.map(([label,key])=>`<span class="token"><i style="background:${t.colors[key]}"></i>${label} <code>${t.colors[key]}</code></span>`).join('')}</div><section class="demo" aria-label="Contoh halaman kerja"><div class="crumb">${esc(d.l)} / Workspace</div><div class="demo-title"><h2>${esc(state.selected[d.id])}</h2><span class="date">15 Okt 2026</span></div><div class="metrics"><div class="metric"><span>Hadir hari ini</span><strong>142 <small>/ 156</small></strong></div><div class="metric"><span>Terlambat</span><strong>6</strong></div><div class="metric"><span>Cuti & izin</span><strong>8</strong></div></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Departemen</th><th>Jadwal</th><th>Masuk</th><th>Status</th></tr></thead><tbody>${[['Alya Pratama','Finance','08:00 – 17:00','07:52','Hadir'],['Bima Santoso','Operations','08:00 – 17:00','07:56','Hadir'],['Citra Dewi','HR','08:00 – 17:00','08:12','Terlambat'],['Dimas Putra','Merchandise','08:00 – 17:00','07:48','Hadir'],['Eva Larasati','Procurement','08:00 – 17:00','07:59','Hadir']].map(r=>`<tr>${r.slice(0,4).map(x=>`<td>${x}</td>`).join('')}<td><span class="status${r[4]==='Terlambat'?' late':''}">${r[4]}</span></td></tr>`).join('')}</tbody></table></div><p class="demo-note">Data contoh untuk menilai sidebar di samping halaman kerja yang terang.</p></section>`}
function render(){renderNav();renderPalettes();renderContent();updateUrl()}
function revealSelected(){$('nav').querySelector('.item.on')?.scrollIntoView({block:'nearest',inline:'nearest'})}
function selectTheme(id){const preset=THEMES.find(t=>t.id===id);if(!preset)return;state.theme=id;state.active=preset.activeStyle;state.badge=preset.badgeStyle;applyStyle();renderPalettes();renderContent();updateUrl()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.theme)return selectTheme(b.dataset.theme);if(b.dataset.view){state.view=b.dataset.view;renderPalettes();renderContent();return updateUrl()}if(b.dataset.dept){state.dept=b.dataset.dept;render();return revealSelected()}if(b.dataset.row){state.selected[state.dept]=b.dataset.row;const old=$('list').scrollTop;renderNav();$('list').scrollTop=old;renderContent();return}if(b.dataset.fold){const g=b.parentElement,open=g.classList.contains('shut');state.open[b.dataset.fold]=open;g.classList.toggle('shut',!open);g.classList.toggle('open',open);b.setAttribute('aria-expanded',open);g.querySelector('.fold').inert=!open;return}if(b.hasAttribute('data-setup')){const g=b.parentElement,open=g.classList.contains('shut');state.setup[state.dept]=open;g.classList.toggle('shut',!open);g.classList.toggle('open',open);b.setAttribute('aria-expanded',open);g.querySelector('.fold').inert=!open}});
$('layout').addEventListener('change',e=>{state.layout=e.target.value;state.open={};render();revealSelected()});$('department').innerHTML=D.map(d=>`<option value="${d.id}">${d.l}</option>`).join('');$('department').addEventListener('change',e=>{state.dept=e.target.value;render();revealSelected()});
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,[contenteditable]')||e.ctrlKey||e.altKey||e.metaKey)return;const t=THEMES[Number(e.key)-1];if(t)selectTheme(t.id)});
const params=new URLSearchParams(location.search);if(THEMES.some(t=>t.id===params.get('theme')))state.theme=params.get('theme');if(D.some(d=>d.id===params.get('d')))state.dept=params.get('d');if(['labels','fold','setup'].includes(params.get('layout')))state.layout=params.get('layout');if(params.get('view')==='compare')state.view='compare';const initial=theme();state.active=ACTIVE[params.get('active')]?params.get('active'):initial.activeStyle;state.badge=BADGES[params.get('badge')]?params.get('badge'):initial.badgeStyle;
$('active-style').addEventListener('change',e=>{state.active=e.target.value;applyStyle();renderContent();updateUrl()});$('badge-style').addEventListener('change',e=>{state.badge=e.target.value;applyStyle();renderContent();updateUrl()});render();revealSelected();
</script>
