function renderTransfer(){return "<div class='overlay' data-overlay><section class='dialog' role='dialog' aria-modal='true' aria-labelledby='dialog-title'><div class='dialog-head'><div><div id='dialog-title' class='dialog-title'>Transfer funds</div><div class='dialog-subtitle'>Move money between your own cash and bank accounts.</div></div><button class='close-btn' data-action='close-modal' aria-label='Close dialog'>"+icon("close")+"</button></div><div class='dialog-grid'><form class='form-pane' id='transfer-form'><div class='form-section'><div class='form-section-head'><span class='form-section-title'>Transfer details</span><span class='form-section-hint'>Internal · Head Office</span></div><div class='form-grid'><div class='field'><label for='source'>From account<span class='required'> *</span></label><select id='source' name='source'>"+optionsForCash(defaultAccount)+"</select></div><div class='field'><label for='destination'>To account<span class='required'> *</span></label><select id='destination' name='destination'>"+optionsForCash(cashAccounts.find(function(a){return a.code!=="1101"}).code)+"</select></div><div class='field'><label for='amount'>Amount<span class='required'> *</span></label><input type='number' name='amount' id='amount' min='1' step='1' placeholder='0'></div><div class='field'><label for='date'>Transfer date<span class='required'> *</span></label><input type='date' name='date' id='date' value='2026-09-27'></div><div class='field span-2'><label for='reference'>Reference</label><input name='reference' id='reference' placeholder='Optional bank reference'></div><div class='field span-2'><label for='note'>Notes</label><textarea name='note' id='note' placeholder='Add a short note'></textarea></div></div></div></form><aside class='preview-pane'><div class='preview-card' id='transfer-preview'></div></aside></div><footer class='dialog-footer'><span class='footer-help' id='transfer-help'>Choose accounts and amount to review the transfer.</span><div class=' function updateManual(){readManualLines();const t=manualTotals(),balanced=t.debit===t.credit&&t.debit>0&&manualLines.every(function(l){return !(l.debit>0&&l.credit>0)}),de=document.getElementById("manual-debit"),cr=document.getElementById("manual-credit"),badge=document.getElementById("manual-balance"),post=document.getElementById("post-manual"),help=document.getElementById("manual-help");if(de)de.textContent=money(t.debit);if(cr)cr.textContent=money(t.credit);if(badge){badge.className="status "+(balanced?"status-paid":"status-open");badge.textContent=balanced?"Balanced":"Out of balance"}if(post)post.disabled=!balanced;if(help)help.textContent=balanced?"Balanced · ready for review":"Enter equal debit and credit totals."}

function commitInvoice(){const f=document.getElementById("invoice-form");if(!f)return;const fd=new FormData(f),amount=Math.floor(Number(fd.get("amount")||0));if(amount<=0||!fd.get("date")||!fd.get("due")){notify("Enter an amount and both dates.");return}const side=modal.side,id=nextInvoiceId(side);invoices.unshift({id:id,side:side,party:fd.get("party"),date:fd.get("date"),due:fd.get("due"),total:amount,remaining:amount,note:fd.get("note")||""});modal=null;renderModal();renderPage();notify(id+" recorded as an open balance")}
