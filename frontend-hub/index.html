<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so full-screen sheets can pad away from the notch and
         home bar themselves (`env(safe-area-inset-*)` is 0 without it);
         interactive-widget so Android's keyboard shrinks the layout the way
         iOS's does, and a bottom-pinned button rises with it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- Installable (see `pwa` in vite.config.ts). The manifest link is added
         by the build. iOS still reads these rather than the manifest: without
         `apple-mobile-web-app-capable` "Add to Home Screen" makes a bookmark,
         and a bookmark cannot receive Web Push. -->
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Central" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Central Dashboard</title>
    <!-- The launch screen, drawn before any script has loaded: white, the mark
         in the middle (owner, 2026-10-06). React replaces it on first render
         with the same picture (`Launch` in `components/brand-mark.tsx`) while
         the session is asked, so nothing changes between the first paint and
         the sign-in page or Home that follows. -->
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="88" height="88">
          <rect width="32" height="32" rx="7.5" fill="#111214" />
          <path
            d="M18.2 11.6A6.5 6.5 0 1 0 18.2 20.4"
            fill="none"
            stroke="#fff"
            stroke-width="3.6"
            stroke-linecap="round"
          />
          <circle cx="23.4" cy="16" r="2.2" fill="#2563eb" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
