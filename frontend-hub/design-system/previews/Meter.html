<!-- @dsCard group="Figures" height=423 subtitle="Static rendition of meter.tsx in the All white look" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Meter — preview</title><style>body{margin:0}
/* Meter: bundle .ds-meter draws the track; accent is the default tone, and Progress and Dial are drawn here. */
.ds-meter-accent > span{background:var(--accent)}
.ds-meter-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 48px}
.ds-meter-tile{display:flex;flex-direction:column;gap:12px;min-width:0}
.ds-meter-line{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.ds-meter-figure{font-size:16px;line-height:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ds-meter-of{color:var(--body);font-variant-numeric:tabular-nums}
.ds-meter-spend{display:flex;align-items:center;gap:12px}
.ds-meter-spend .ds-meter{flex:1 1 0;width:auto;min-width:48px}
.ds-meter-spend .ds-meter-of{flex:none}
.ds-meter-row{display:flex;align-items:center;gap:10px;max-width:480px}
.ds-meter-row .ds-meter{flex:1 1 0;width:auto;min-width:48px}
.ds-meter-label{flex:none;width:88px;color:var(--ink)}
.ds-meter-value{flex:none;width:52px;text-align:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ds-meter-dials{display:flex;flex-wrap:wrap;gap:12px 40px}
.ds-meter-dial{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.ds-meter-dial svg{flex:none;width:16px;height:16px;transform:rotate(-90deg)}
</style></head>
<body>
<div class="ds ds-stage">
  <div class="ds-col">
    <div class="ds-caption">In a sheet summary</div>
    <div class="ds-meter-tiles">
      <div class="ds-meter-tile">
        <div class="ds-meter-line"><span class="ds-meter-figure">Rp 600.000</span><span class="ds-meter-of">of Rp 1.000.000</span></div>
        <span class="ds-meter" role="meter" aria-label="Left of face value" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" aria-valuetext="60%"><span style="width:60%"></span></span>
      </div>
      <div class="ds-meter-tile">
        <div class="ds-meter-line"><span class="ds-meter-figure">Rp 200.000</span><span class="ds-meter-of">of Rp 1.000.000</span></div>
        <span class="ds-meter ds-meter--warn" role="meter" aria-label="Left of face value" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100" aria-valuetext="20%"><span style="width:20%"></span></span>
      </div>
      <div class="ds-meter-tile">
        <div class="ds-meter-spend">
          <span class="ds-meter ds-meter-accent" role="meter" aria-label="Spent" aria-valuenow="52" aria-valuemin="0" aria-valuemax="100" aria-valuetext="52%"><span style="width:52%"></span></span>
          <span class="ds-meter-of">52% of Rp 40.000.000</span>
        </div>
      </div>
      <div class="ds-meter-tile">
        <div class="ds-meter-spend">
          <span class="ds-meter ds-meter--bad" role="meter" aria-label="Spent" aria-valuenow="92" aria-valuemin="0" aria-valuemax="100" aria-valuetext="92%"><span style="width:92%"></span></span>
          <span class="ds-meter-of">92% of Rp 40.000.000</span>
        </div>
      </div>
    </div>
  </div>

  <div class="ds-col">
    <div class="ds-caption">Progress</div>
    <div class="ds-meter-row"><span class="ds-meter-label">Picked</span><span class="ds-meter ds-meter-accent" role="meter" aria-label="Lines picked" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100" aria-valuetext="78%"><span style="width:78%"></span></span><span class="ds-meter-value">78%</span></div>
    <div class="ds-meter-row"><span class="ds-meter-label">Printed</span><span class="ds-meter" role="meter" aria-label="Labels printed" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-valuetext="100%"><span style="width:100%"></span></span><span class="ds-meter-value">100%</span></div>
    <div class="ds-meter-row"><span class="ds-meter-label">Found</span><span class="ds-meter ds-meter--warn" role="meter" aria-label="Pieces found" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" aria-valuetext="62%"><span style="width:62%"></span></span><span class="ds-meter-value">62%</span></div>
    <div class="ds-meter-row"><span class="ds-meter-label">Packed</span><span class="ds-meter ds-meter-accent" role="meter" aria-label="Packed" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-valuetext="0%"><span style="width:0%"></span></span><span class="ds-meter-value">0%</span></div>
  </div>

  <div class="ds-col">
    <div class="ds-caption">Dial, beside the figure it repeats</div>
    <div class="ds-meter-dials">
      <span class="ds-meter-dial">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke-width="2.5" stroke="var(--soft-2)"/><circle cx="8" cy="8" r="6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="28.274 37.699" stroke="var(--accent)"/></svg>
        18 of 24 pcs counted
      </span>
      <span class="ds-meter-dial">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke-width="2.5" stroke="var(--soft-2)"/><circle cx="8" cy="8" r="6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9.425 37.699" stroke="var(--warn)"/></svg>
        6 of 24 pcs counted
      </span>
      <span class="ds-meter-dial">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke-width="2.5" stroke="var(--soft-2)"/><circle cx="8" cy="8" r="6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="37.699 37.699" stroke="var(--ok)"/></svg>
        24 of 24 pcs counted
      </span>
    </div>
  </div>
</div>
</body>
</html>
