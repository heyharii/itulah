<!-- @dsCard group="Status" height=482 subtitle="Static rendition of tag.tsx in the All white look" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Tag — preview</title><style>body{margin:0}
/* Tag (tag.tsx): white.css draws it outlined, 24px, radius 6, the word at 600 in the page's own face. */
.ds-tag-chip{display:inline-flex;align-items:center;max-width:100%;height:24px;padding:0 8px;border-radius:var(--r-chip);box-shadow:inset 0 0 0 1px var(--hairline-2);font-size:15px;font-weight:600;color:var(--body);white-space:nowrap}
.ds-tag-chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-tag-chip--accent{color:var(--accent)}
.ds-tag-chip--ok{color:var(--ok-fg)}
.ds-tag-chip--warn{color:var(--warn-fg)}
.ds-tag-chip--bad{color:var(--bad-fg)}
.ds-tag-chip--info{color:var(--info-fg)}
.ds-tag-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.ds-tag-cell{max-width:120px}
.ds-tag-sheet{max-width:560px}
</style></head>
<body>
<div class="ds ds-stage">
  <div class="ds-tag-row">
    <span class="ds-tag-chip">Pria</span>
    <span class="ds-tag-chip ds-tag-chip--accent">Faktur</span>
    <span class="ds-tag-chip ds-tag-chip--info">POS</span>
    <span class="ds-tag-chip ds-tag-chip--ok">Promotion</span>
    <span class="ds-tag-chip ds-tag-chip--warn">PKWT</span>
    <span class="ds-tag-chip ds-tag-chip--bad">Items don't match the order</span>
  </div>

  <div class="ds-table-card">
    <table class="ds-table">
      <thead><tr><th>Article</th><th>Division</th><th>Stock</th></tr></thead>
      <tbody>
        <tr><td>Kaos Uji Uj16<span class="ds-sub">00000012</span></td><td><span class="ds-tag-chip">Pria</span></td><td class="ds-num">8 pcs</td></tr>
        <tr><td>Tas Selempang Kanvas<span class="ds-sub">00000010</span></td><td><span class="ds-tag-chip">Tas</span></td><td class="ds-num">54 pcs</td></tr>
        <tr><td>Sneakers Kanvas Low<span class="ds-sub">00000009</span></td><td><div class="ds-tag-cell"><span class="ds-tag-chip" title="Sandal dan Sepatu"><span>Sandal dan Sepatu</span></span></div></td><td class="ds-num">98 pcs</td></tr>
      </tbody>
    </table>
  </div>

  <div class="ds-sheet ds-tag-sheet">
    <div class="ds-sheet-head">
      <div class="ds-sheet-headtext">
        <div class="ds-sheet-crumb"><span>Return PO</span><span class="ds-sep">/</span><span>RS-00000001</span></div>
        <div class="ds-sheet-titlerow"><span class="ds-sheet-title">Garmen Nusantara, PT</span></div>
        <div class="ds-sheet-caption"><span class="ds-tag-chip ds-tag-chip--warn">Over-delivery</span></div>
      </div>
      <button class="ds-sheet-close" type="button" aria-label="Close"><span class="ds-ico ds-ico-x ds-ico--17"></span></button>
    </div>
  </div>
</div>
</body>
</html>
