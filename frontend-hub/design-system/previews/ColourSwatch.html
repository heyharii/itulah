<!-- @dsCard group="Media" height=413 subtitle="Static rendition of swatch.tsx in the All white look" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>ColourSwatch — preview</title><style>body{margin:0}
/* ColourSwatch: 12px, ringed in hairline-strong; the fill is the colour master's value, set inline (token stand-ins here). */
.ds-colourswatch-dot{display:inline-block;flex:none;width:12px;height:12px;border-radius:var(--r-full);background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.ds-colourswatch-row{display:inline-flex;align-items:center;gap:4px}
.ds-colourswatch-more{font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.ds-colourswatch-named{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.ds-colourswatch-named > span{display:inline-flex;align-items:center;gap:8px}
.ds-colourswatch-table{max-width:640px}
</style></head>
<body>
<div class="ds ds-stage">
  <div class="ds-colourswatch-named">
    <span><span class="ds-colourswatch-dot" style="background-color:var(--ink)" title="Black"></span>Black</span>
    <span><span class="ds-colourswatch-dot" style="background-color:var(--canvas)" title="White"></span>White</span>
    <span><span class="ds-colourswatch-dot" style="background-color:var(--a-blue)" title="Navy"></span>Navy</span>
    <span><span class="ds-colourswatch-dot" style="background-color:var(--a-pink)" title="Rose"></span>Rose</span>
    <span><span class="ds-colourswatch-dot" title="No value yet"></span>No value yet</span>
  </div>

  <div class="ds-table-card ds-colourswatch-table">
    <table class="ds-table">
      <thead><tr><th>Article</th><th>Colors</th><th>Sizes</th></tr></thead>
      <tbody>
        <tr>
          <td>Kaos Uji Uj16<span class="ds-sub">00000012</span></td>
          <td><span class="ds-colourswatch-row"><span class="ds-colourswatch-dot" style="background-color:var(--ink)" title="Black"></span><span class="ds-colourswatch-dot" style="background-color:var(--canvas)" title="White"></span></span></td>
          <td>M–L</td>
        </tr>
        <tr>
          <td>Sneakers Kanvas Low<span class="ds-sub">00000009</span></td>
          <td><span class="ds-colourswatch-row"><span class="ds-colourswatch-dot" style="background-color:var(--ink)" title="Black"></span><span class="ds-colourswatch-dot" style="background-color:var(--canvas)" title="White"></span><span class="ds-colourswatch-dot" style="background-color:var(--a-blue)" title="Navy"></span></span></td>
          <td>L–XXL</td>
        </tr>
        <tr>
          <td>Flat Shoes Wanita<span class="ds-sub">00000006</span></td>
          <td><span class="ds-colourswatch-row"><span class="ds-colourswatch-dot" style="background-color:var(--ink)" title="Black"></span><span class="ds-colourswatch-dot" style="background-color:var(--a-pink)" title="Rose"></span><span class="ds-colourswatch-dot" style="background-color:var(--a-orange)" title="Orange"></span><span class="ds-colourswatch-dot" style="background-color:var(--a-green)" title="Green"></span><span class="ds-colourswatch-dot" style="background-color:var(--a-violet)" title="Violet"></span><span class="ds-colourswatch-dot" style="background-color:var(--canvas)" title="White"></span><span class="ds-colourswatch-more">+2</span></span></td>
          <td>M–XL</td>
        </tr>
        <tr>
          <td>Loafers Kulit Sintetis<span class="ds-sub">00000007</span></td>
          <td><span class="ds-mute">—</span></td>
          <td>XL–XXXL</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
