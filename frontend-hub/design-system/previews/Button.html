<!-- @dsCard group="Actions" height=200 subtitle="Static rendition of button.tsx in the All white look" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Button — preview</title><style>body{margin:0}</style></head>
<body>
<div class="ds ds-stage">
  <div class="ds-row">
    <button class="ds-btn ds-btn--primary" type="button"><span class="ds-ico ds-ico-plus"></span>New order</button>
    <button class="ds-btn ds-btn--ghost" type="button"><span class="ds-ico ds-ico-columns"></span>Columns</button>
    <button class="ds-btn ds-btn--ghost" type="button"><span class="ds-ico ds-ico-printer"></span>Print</button>
    <button class="ds-btn ds-btn--destructive" type="button">Cancel order</button>
    <button class="ds-btn ds-btn--quiet ds-btn--icon" type="button" aria-label="More"><span class="ds-ico ds-ico-more"></span></button>
  </div>
  <div class="ds-row">
    <button class="ds-btn ds-btn--primary is-hover" type="button">Save changes</button>
    <button class="ds-btn ds-btn--ghost is-hover" type="button">Edit</button>
    <button class="ds-btn ds-btn--ghost ds-btn--takes-away" type="button"><span class="ds-ico ds-ico-trash"></span>Remove</button>
    <button class="ds-btn ds-btn--primary is-pending" type="button" aria-busy="true">Saving…</button>
    <button class="ds-btn ds-btn--ghost" type="button" disabled>Export CSV</button>
  </div>
  <div class="ds-row">
    <button class="ds-btn ds-btn--primary ds-btn--card" type="button">Count receive</button>
    <button class="ds-btn ds-btn--ghost ds-btn--sm" type="button">Undo</button>
    <button class="ds-btn ds-btn--primary ds-btn--tap" type="button">Sign in</button>
    <span class="ds-caption">card 32 · sm 28 · lg 44</span>
  </div>
</div>
</body>
</html>
