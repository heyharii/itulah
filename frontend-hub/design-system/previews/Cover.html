<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">
<meta charset="utf-8">
<title>Central</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .stone { fill: var(--stone); rx: var(--r-sheet); }
  .back { fill: var(--soft-2); rx: var(--r-sheet); }
  .mid { fill: var(--soft-3); rx: var(--r-sheet); }
  .page { fill: var(--canvas); rx: var(--r-sheet); }
  .tile { fill: var(--brand-tile); rx: var(--r-sheet); }
  .act { fill: var(--accent); rx: var(--r-inner); }
  .rule { stroke: var(--hairline); stroke-width: 1; fill: none; }
  .row { stroke: var(--row-line); stroke-width: 1; fill: none; }
  .dot { fill: var(--ok); }
  .words { position: absolute; left: 32px; bottom: 32px; max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: 0.92; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); }
  .tag { margin: 12px 0 0 4px; font-size: 15px; line-height: 20px; color: var(--body); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      stone 448×272 (the shell's ground) bled off the top and right edges · brand-tile 96×96 (the app icon's black) · accent 96×36 (the one primary, a control tall) · canvas, soft-3 and soft-2 sheets on the stone · ok as one 6px dot. That is ≈44% of 960×288.
        arrangement one stone slab with satellites: three sheets stacked on it, each `float` 12px further in, the front one white; the black tile overlapping the slab's lower left edge; the blue block standing last in the front sheet's foot
        pattern     the layer stack, from "a sheet floats 12px off the window, a layer 12px further in, hairlines not shadows": three sheets at a 12px step, ruled by three hairlines at the 52px row pitch (head, a row, the foot)
        scales      offsets `float` 12; corners r-sheet 16, r-inner 8; the button `control` 36 tall; row pitch `row` 52; the dot `dot` 6
      -->
      <rect class="stone" x="48" y="-16" width="448" height="272" rx="16"/>
      <rect class="back" x="120" y="8" width="376" height="224" rx="16"/>
      <rect class="mid" x="132" y="20" width="364" height="224" rx="16"/>
      <rect class="page" x="144" y="32" width="352" height="212" rx="16"/>
      <line class="rule" x1="144" y1="80.5" x2="496" y2="80.5"/>
      <line class="row" x1="164" y1="132.5" x2="496" y2="132.5"/>
      <line class="rule" x1="144" y1="184.5" x2="496" y2="184.5"/>
      <circle class="dot" cx="168" cy="106" r="3"/>
      <rect class="act" x="368" y="196" width="96" height="36" rx="8"/>
      <rect class="tile" x="24" y="168" width="96" height="96" rx="16"/>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Central</h1>
    <p class="tag">One white surface. Colour only where it means something.</p>
  </div>
</div>
</body>
</html>
