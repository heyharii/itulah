<!-- @dsCard group="Actions" height=240 subtitle="Static rendition of tint-button.tsx in the All white look" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>TintButton — preview</title><style>body{margin:0}</style></head>
<body>
<div class="ds ds-stage">
  <div class="ds-row">
    <button class="ds-btn ds-btn--tint" type="button"><span class="ds-ico ds-ico-printer"></span>Print</button>
    <button class="ds-btn ds-btn--tint" type="button">All in</button>
    <button class="ds-btn ds-btn--tint-bad" type="button">Cannot pick</button>
    <button class="ds-btn ds-btn--tint-bad" type="button"><span class="ds-ico ds-ico-download"></span>Download PDF</button>
    <button class="ds-btn ds-btn--primary" type="button">Submit 24 pcs</button>
  </div>
  <div class="ds-row">
    <button class="ds-btn ds-btn--tint is-hover" type="button">Print all</button>
    <button class="ds-btn ds-btn--tint-bad is-hover" type="button">Back to Pick</button>
    <button class="ds-btn ds-btn--tint" type="button" disabled>All picked</button>
    <button class="ds-btn ds-btn--tint-bad" type="button" disabled>Take out</button>
  </div>
  <div class="ds-row">
    <button class="ds-btn ds-btn--tint ds-btn--tint-row" type="button"><span class="ds-ico ds-ico-download"></span>Put in</button>
    <button class="ds-btn ds-btn--tint-bad" type="button">Take out</button>
    <span class="ds-caption">row 38 · md 36 · 44 under a finger · disabled 40%</span>
  </div>
</div>
</body>
</html>
