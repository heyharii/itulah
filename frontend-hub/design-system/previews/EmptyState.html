<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>EmptyState — preview</title>
<style>
body{margin:0}
.ds-emptystate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:24px 28px}
/* a framed table's slot: the empty state stands where the rows would be */
.ds-emptystate-frame{min-width:0;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas)}
/* EmptyIllustration: 136px wide on a 160 x 112 grid */
.ds-emptystate-art{display:block;width:136px;height:auto}
</style></head>
<body>
<div class="ds ds-emptystate-grid">

  <div class="ds-emptystate-frame">

        <path d="M116 78l12 12" stroke="#2563eb" stroke-width="4.5"/>
        <path d="M30 26v7M26.5 29.5h7" stroke-width="1.75"/>

      <p>No order matches these filters.</p>
    </div>
  </div>

  <div class="ds-emptystate-frame">

        <circle cx="80" cy="54" r="44" fill="#fff4e8" stroke="none"/>

        <circle cx="136" cy="80" r="2" fill="#8a93a3" stroke="none" opacity="0.5"/>

      <p>Nothing has been picked out yet.</p>
      <button class="ds-btn ds-btn--ghost" type="button">Go to sourcing</button>

  </div>

  <div class="ds-emptystate-frame">
    <div class="ds-empty">
      <svg class="ds-emptystate-art" viewBox="0 0 160 112" role="presentation" aria-hidden="true" fill="none" stroke="#8a93a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      </svg>
      <p>Every order has arrived in full.</p>
    </div>
  </div>

  <div class="ds-emptystate-frame">
    <div class="ds-empty">

        <path d="M98 66h12" stroke-width="2.5"/>
        <path d="M116 78l12 12" stroke="#2563eb" stroke-width="4.5"/>
        <path d="M30 26v7M26.5 29.5h7" stroke-width="1.75"/>
        <circle cx="131" cy="24" r="3" fill="#2563eb" stroke="none" opacity="0.45"/>
        <circle cx="136" cy="80" r="2" fill="#8a93a3" stroke="none" opacity="0.5"/>
      </svg>
      <p>There are 18 orders here, and not one of them passes the search and filters in force.</p>
      <button class="ds-btn ds-btn--ghost" type="button">Clear the narrowing</button>
    </div>
  </div>

</div>
</body>
</html>
