<!-- @dsCard group="Overlays" height=760 subtitle="Static rendition of sheet-footer.tsx in the All white look" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>SheetFooter — preview</title>
<style>
body{margin:0}
.ds-sheetfooter-set{display:flex;flex-direction:column;gap:16px;padding:24px 28px;min-width:0}
/* each foot stands under a stand-in for the sheet's body, so its hairline reads as the sheet's */
.ds-sheetfooter-card{border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;background:var(--canvas)}
.ds-sheetfooter-body{padding:12px var(--page-gutter);font-weight:500;color:var(--ink)}
/* SheetFooter's root: a column, 12px between the banner, the note and the buttons */
.ds-sheetfooter-col{flex:1 1 100%;display:flex;flex-direction:column;gap:12px;min-width:0}
.ds-sheetfooter-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
/* FootNote: 15/20, quiet by colour */
.ds-sheetfooter-note{font-size:15px;line-height:20px;color:var(--mute)}
/* Problem: a Banner, tone bad (states.tsx): radius 8, padding 10px 14px, relaxed leading */
.ds-sheetfooter-problem{padding:10px 14px;border-radius:var(--r-inner);background:var(--bad-bg);color:var(--bad-fg);font-size:15px;line-height:1.625}
/* white.css: with no primary beside it, Edit is the one blue button */
.ds-btn.ds-sheetfooter-edit{border-color:transparent;background:var(--cta);color:var(--cta-fg);box-shadow:none}
.ds-btn.ds-sheetfooter-edit:hover,.ds-btn.ds-sheetfooter-edit.is-hover{background:var(--cta-hover)}
</style></head>
<body>
<div class="ds ds-sheetfooter-set">

  <div class="ds-sheetfooter-card">
    <div class="ds-sheetfooter-body">Read mode</div>
    <div class="ds-sheet-foot">
      <button class="ds-btn ds-btn--ghost" type="button"><span class="ds-ico ds-ico-printer"></span>Print</button>
      <button class="ds-btn ds-btn--ghost ds-sheetfooter-edit" type="button">Edit</button>
    </div>
  </div>

  <div class="ds-sheetfooter-card">
    <div class="ds-sheetfooter-body">Edit mode</div>
    <div class="ds-sheet-foot">
      <button class="ds-btn ds-btn--destructive" type="button">Cancel</button>
      <button class="ds-btn ds-btn--primary" type="button">Save changes</button>
    </div>
  </div>

  <div class="ds-sheetfooter-card">
    <div class="ds-sheetfooter-body">A document</div>
    <div class="ds-sheet-foot">
      <button class="ds-btn ds-btn--ghost" type="button"><span class="ds-ico ds-ico-printer"></span>Print</button>
      <button class="ds-btn ds-btn--destructive" type="button">Cancel order</button>
      <button class="ds-btn ds-btn--primary" type="button">Review Count</button>
    </div>
  </div>

  <div class="ds-sheetfooter-card">
    <div class="ds-sheetfooter-body">Save is off</div>
    <div class="ds-sheet-foot">
      <div class="ds-sheetfooter-col">
        <p class="ds-sheetfooter-note" role="status">A name, legal form, address and phone number are needed.</p>
        <div class="ds-sheetfooter-row">
          <button class="ds-btn ds-btn--destructive" type="button">Cancel</button>
          <button class="ds-btn ds-btn--primary" type="button" disabled>Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <div class="ds-sheetfooter-card">
    <div class="ds-sheetfooter-body">A write failed</div>
    <div class="ds-sheet-foot">
      <div class="ds-sheetfooter-col">
        <div class="ds-sheetfooter-problem" role="alert">The server could not be reached.</div>
        <div class="ds-sheetfooter-row">
          <button class="ds-btn ds-btn--destructive" type="button">Cancel</button>
          <button class="ds-btn ds-btn--primary" type="button">Save changes</button>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
