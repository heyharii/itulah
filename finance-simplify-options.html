<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Simplify</title>
<style>
@font-face{font-family:Inter;src:url('/frontend-hub/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
/* Paper A · Sheets (sidebar-color-prototypes.html) on All white */
:root{--ink:#1d1d1f;--mute:#6e6e73;--line:#ececf0;--soft:#f3f3f6;--blue:#2563eb;--red:#d70015;--amber:#b25000;--green:#1f8a3b;
 --frame:#e8ecf1;--side-ink:#344054;--side-mute:#667085;--on-bg:#e9f0fc;--on-ink:#1e50b3;--hover:rgb(0 0 0 / 4.5%);
 --ring:0 0 0 1px rgb(0 0 0 / 5%),0 2px 8px rgb(0 0 0 / 4%),0 24px 72px rgb(0 0 0 / 8%);
 --mark:#e8f0fe;--mark-ink:#1e50b3;
 --ease:cubic-bezier(.23,1,.32,1);--drawer:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--frame);-webkit-font-smoothing:antialiased;overflow:hidden}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;text-align:left;padding:0}
.num,td.r,th.r{font-variant-numeric:tabular-nums}

.shell{display:flex;height:100vh}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;color:var(--side-ink)}
.rail .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;opacity:.55}
.rail .ic.on{background:#fff;opacity:1;color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / 7%)}

.panel{width:236px;flex:none;display:flex;flex-direction:column;margin:12px 12px 12px 0;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0 / 5%),0 2px 6px rgb(0 0 0 / 4%);overflow:hidden}
.panel h2{margin:0;padding:18px 24px 10px;font-size:20px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:baseline;justify-content:space-between}
.panel h2 small{font-size:15px;font-weight:500;color:var(--side-mute)}
.list{flex:1;min-height:0;overflow-y:auto;padding:2px 12px 90px;scrollbar-width:none;
 mask-image:linear-gradient(to bottom,transparent 0,#000 8px,#000 calc(100% - 28px),transparent 100%)}
.list::-webkit-scrollbar{display:none}
.list.swap{animation:swap .18s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(4px)}}
.item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;min-height:34px;padding:0 12px;border-radius:8px;color:var(--side-ink);font-weight:450;white-space:nowrap;transition:background-color .15s ease}
.item>span:first-child{overflow:hidden;text-overflow:ellipsis}
@media(hover:hover) and (pointer:fine){.item:not(.on):hover{background:var(--hover)}}
.item.on{background:var(--on-bg);color:var(--on-ink);font-weight:600}
.badge{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:15px;line-height:1;font-weight:600}
.glabel{display:flex;align-items:center;justify-content:space-between;width:100%;height:32px;margin-top:14px;padding:0 12px;color:var(--side-mute);font-weight:600;white-space:nowrap;border-radius:8px}
.group:first-child>.glabel{margin-top:0}
button.glabel{margin-top:2px;color:var(--side-ink);font-weight:450}
@media(hover:hover) and (pointer:fine){button.glabel:hover{background:var(--hover)}}
button.glabel .chev{width:14px;height:14px;opacity:.6;transition:transform .2s var(--ease)}
.group.open>button.glabel{color:var(--ink);font-weight:600}
.group.open>button.glabel .chev{transform:rotate(90deg)}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .2s var(--ease),opacity .2s ease}
.fold>div{min-height:0;overflow:hidden}
.group.shut>.fold{grid-template-rows:0fr;opacity:0;transition-duration:.15s}
.group.folded .item{padding-left:24px}
.cut{height:1px;margin:10px 12px;background:var(--line)}
.ghost{color:#98a2b3}

.page{flex:1;min-width:0;background:#fff;margin:12px 12px 12px 0;border-radius:16px;box-shadow:var(--ring);overflow:hidden;display:flex;flex-direction:column;position:relative}
.page-in{flex:1;overflow:auto;padding:22px 32px 130px}
.page-in.swap{animation:swap .18s var(--ease)}

/* prototype layer: what this screen took in (blue, never in the hub) */
.took{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 20px;padding:10px 14px;border-radius:12px;background:var(--mark);color:var(--mark-ink)}
.took>b{font-weight:600;margin-right:4px}
.took button{padding:3px 10px;border-radius:14px;background:#fff;color:var(--mark-ink);box-shadow:0 0 0 1px rgb(30 80 179 / 18%);max-width:100%;transition:transform .12s ease,box-shadow .15s ease}
.took button:active{transform:scale(.97)}
.took button i{font-style:normal;color:#5b7fc7}
.took .gone{background:none;box-shadow:none;color:#8a6d00;padding:3px 4px}
[data-k].lit{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px;animation:lit 1.1s var(--ease)}
@keyframes lit{0%{outline-color:transparent}20%{outline-color:var(--blue)}}
.dot-m{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:6px;vertical-align:2px}

.crumb{color:var(--mute)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 18px;flex-wrap:wrap}
h1{margin:0;font-size:28px;line-height:34px;font-weight:650;letter-spacing:-.02em}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500;color:var(--ink);transition:background-color .15s ease,transform .12s ease}
.btn:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.btn:hover{background:var(--soft)}}
.btn.pri{background:var(--blue);color:#fff}
@media(hover:hover) and (pointer:fine){.btn.pri:hover{background:#1d4fd8}}
.btn svg{width:14px;height:14px}
.kpis{display:flex;margin:0 0 22px;flex-wrap:wrap;row-gap:12px}
.kpi{padding:0 28px;border-left:1px solid var(--line)}
.kpi:first-child{padding-left:0;border-left:0}
.kpi span{display:block;color:var(--mute)}
.kpi strong{font-size:22px;font-weight:600;letter-spacing:-.01em}
.bar{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.flt{height:34px;padding:0 12px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color .15s ease}
.flt span{color:var(--mute)}
.flt svg{width:14px;height:14px;color:var(--mute);transform:rotate(90deg)}
@media(hover:hover) and (pointer:fine){.flt:hover{background:#fafafb}}
h3{margin:26px 0 8px;font-size:17px;font-weight:600}
h3:first-child{margin-top:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--mute);height:42px;padding:0 14px 0 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{height:48px;padding:0 14px 0 0;border-bottom:1px solid #f4f4f6;white-space:nowrap}
.r{text-align:right}
tbody tr.click{cursor:pointer}
@media(hover:hover) and (pointer:fine){tbody tr.click:hover td{background:#f8f9fb}}
.pill{display:inline-flex;align-items:center;gap:7px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--green)}.pill.warn{color:var(--amber)}.pill.bad{color:var(--red)}.pill.mute{color:var(--mute)}.pill.blue{color:var(--blue)}
.pill b{color:var(--ink);font-weight:450}
.neg{color:var(--red)}

/* popover for a filter or a split button */
.pop{position:fixed;z-index:30;min-width:200px;padding:6px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0 / 7%),0 12px 36px rgb(0 0 0 / 14%);transform-origin:top left;transition:opacity .15s ease,transform .15s var(--ease)}
.pop[hidden]{display:block;opacity:0;transform:scale(.97);pointer-events:none}
.pop div{display:flex;justify-content:space-between;gap:16px;height:36px;align-items:center;padding:0 10px;border-radius:8px;white-space:nowrap}
.pop div:first-child{color:var(--blue)}
.pop i{font-style:normal;color:var(--mark-ink);background:var(--mark);padding:0 8px;border-radius:999px}

/* giro board */
.board{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:12px;overflow-x:auto}
.lane{background:#f6f7f9;border-radius:12px;padding:10px}
.lane>p{margin:2px 4px 10px;font-weight:600;display:flex;justify-content:space-between}
.lane>p span{color:var(--mute);font-weight:450}
.card{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 0 0 1px rgb(0 0 0 / 5%),0 1px 2px rgb(0 0 0 / 4%);margin-bottom:8px}
.card .num{font-weight:600}
.card span{display:block;color:var(--mute)}

/* settings: Apple-Settings rows */
.sets{max-width:720px}
.sets h3{margin:24px 0 8px}
.sets .grp{border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.sets .row{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 16px;border-top:1px solid #f4f4f6}
.sets .row:first-child{border-top:0}
.sets .row span{color:var(--mute);display:flex;gap:10px;align-items:center}
.sets .row svg{width:14px;height:14px}

/* period close checklist */
.steps{max-width:720px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.step{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border-top:1px solid #f4f4f6;transition:background-color .15s ease}
.step:first-child{border-top:0}
@media(hover:hover) and (pointer:fine){.step:hover{background:#f8f9fb}}
.step .tick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1.5px #c9ced6}
.step .tick.done{background:var(--green);box-shadow:none;color:#fff}
.step .tick svg{width:13px;height:13px;stroke-width:2.4}
.step .t{flex:1}
.step .go{color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.step .go svg{width:14px;height:14px}

/* record sheet */
.scrim{position:absolute;inset:0;background:rgb(255 255 255 / 55%);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:20}
.sheet{position:absolute;top:12px;right:12px;bottom:12px;width:min(560px,calc(100% - 24px));background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgb(0 0 0 / 7%),0 24px 64px rgb(0 0 0 / 16%);transform:translateX(calc(100% + 24px));transition:transform .26s var(--drawer);z-index:21;display:flex;flex-direction:column}
.page.sheeted .scrim{opacity:1;pointer-events:auto}
.page.sheeted .sheet{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 8px}
.sheet header h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em}
.sheet header p{margin:2px 0 0;color:var(--mute)}
.sheet .in{flex:1;overflow:auto;padding:8px 22px 22px}

/* flows */
.flows{display:grid;gap:14px;max-width:1080px}
.flow{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px}
.flow h4{margin:0 0 12px;font-size:17px;font-weight:600;display:flex;justify-content:space-between;gap:12px}
.flow h4 span{font-weight:500;color:var(--mute);white-space:nowrap}
.flow h4 span b{color:var(--green);font-weight:600}
.lanes{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;align-items:start}
.lanes>em{font-style:normal;color:var(--mute);padding-top:6px}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.path .st{display:inline-flex;flex-direction:column;padding:6px 12px;border-radius:10px;background:#f6f7f9}
.path .st small{font-size:15px;color:var(--mute)}
.path button.st{background:var(--mark);color:var(--mark-ink);transition:transform .12s ease}
.path button.st:active{transform:scale(.97)}
.path button.st small{color:#5b7fc7}
.path .arr{color:#b0b6c0}
.path .arr svg{width:14px;height:14px}

/* where did it go */
.where-top{display:flex;gap:12px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.where-top input{height:38px;width:300px;max-width:100%;padding:0 12px;border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--line);outline:0}
.where-top input:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
.tally{display:flex;gap:28px;margin:0 0 22px;flex-wrap:wrap}
.how{display:inline-block;padding:1px 9px;border-radius:999px;background:#f2f3f5;color:#424a57}
.how.Row{background:#e7f6ec;color:#16692e}.how.Removed{background:#fff1f0;color:#a8071a}.how.Settings{background:#f4f0ff;color:#5b3cc4}.how.Step{background:#fff6e5;color:#8a5300}
tr.go{cursor:pointer}
@media(hover:hover) and (pointer:fine){tr.go:hover td{background:#f8f9fb}}
td.wrap{white-space:normal;padding-top:10px;padding-bottom:10px}

/* switch */
.switch{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:14px;background:rgb(255 255 255 / 88%);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 0 0 1px rgb(0 0 0 / 7%),0 8px 30px rgb(0 0 0 / 12%);z-index:40;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.switch button{height:40px;padding:0 14px;border-radius:9px;white-space:nowrap;color:var(--mute);font-weight:500;transition:background-color .15s ease,color .15s ease,transform .12s ease}
.switch button:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.switch button:hover{background:rgb(0 0 0 / 4%)}}
.switch button[aria-pressed="true"]{background:#1d1d1f;color:#fff}
.switch b{font-weight:600;margin-right:6px;opacity:.55}
.switch .n{margin-left:6px;opacity:.6;font-variant-numeric:tabular-nums}
.switch .sep{width:1px;margin:6px 4px;background:rgb(0 0 0 / 10%);flex:none}

@media(max-width:820px){
 body{overflow:auto}
 .shell{flex-direction:column;height:auto}
 .rail{display:none}
 .panel{width:auto;margin:12px 12px 0;max-height:44vh}
 .page{margin:12px;min-height:80vh}
 .page-in{padding:18px 16px 130px}
 .lanes{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){.list.swap,.page-in.swap,[data-k].lit{animation:none}.sheet{transition:none}}
</style>
</head>
<body>
<div class="shell">
 <nav class="rail" id="rail" aria-label="Departments"></nav>
 <nav class="panel"><h2>Finance <small id="count"></small></h2><div class="list" id="list"></div></nav>
 <main class="page" id="pageWrap">
  <div class="page-in" id="page"></div>
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" aria-hidden="true"><header><div><h2 id="sheetT"></h2><p id="sheetS"></p></div><button class="btn" id="sheetX">Close</button></header><div class="in" id="sheetIn"></div></aside>
 </main>
</div>
<div class="pop" id="pop" hidden></div>
<div class="switch" id="switch" role="group" aria-label="Version"></div>

<script>
const I={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
 buy:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"/>',
 ops:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
 inv:'<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/>',
 sales:'<path d="M3 10h18M5 10l1-6h12l1 6M5 10v10h14V10M10 20v-5h4v5"/>',
 fin:'<path d="M3 21h18M5 21V10M19 21V10M9 21v-6h6v6M3 10l9-6 9 6"/>',
 hr:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 4a3 3 0 0 1 0 6M21 20a5 5 0 0 0-4-5"/>',
 ga:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M10 21v-4h4v4"/>',
 chev:'<path d="m9 6 6 6-6 6"/>',
 tick:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 down:'<path d="m6 9 6 6 6-6"/>',
}
const svg=k=>`<svg viewBox="0 0 24 24">${I[k]}</svg>`
const $=s=>document.querySelector(s)

/* ───────────────────────── screens ─────────────────────────
   One spec per screen that survives. A key `k` marks an element another
   screen's row now lives in; the blue band points at it. */
const ST=(s,c)=>`<span class="pill ${c}">${s}</span>`
const S={
 overview:{t:'Overview',
  kpis:[['Cash & bank','2,41 M','kpi'],['Owed to suppliers','864,2 jt'],['Due this week','212,5 jt'],['Uncleared giros','148,0 jt']],
  h3:'Payments ahead',
  cols:['Date','To','Document',{t:'Amount',r:1}],
  rows:[['Fri 16 Oct','PT Sinar Garmindo','PI-26-10-0142','48.250.000'],['Mon 19 Oct','CV Benang Emas','Giro BCA 228114','32.000.000'],['Tue 20 Oct','Bank Mandiri','Loan instalment 8 of 24','41.600.000'],['Thu 22 Oct','Tax office','PPh 23 · September','6.180.000']]},
 storeCash:{t:'Store Cash',
  cols:['Shop',{t:'Cash on hand',r:1,k:'cash'},{t:'Petty cash',r:1,k:'petty'},{t:'Cashier float',r:1,k:'float'},{t:'Last count',k:'count'},{t:'Difference',r:1}],
  rows:[['Grand Indonesia','18.420.000','2.150.000','3.000.000','Wed 14 Oct','0'],['Pondok Indah Mall','12.905.500','1.480.000','3.000.000','Wed 14 Oct','<span class="neg">−25.000</span>'],['Senayan City','9.776.000','2.500.000','2.000.000','Tue 13 Oct','0'],['Kota Kasablanka','15.310.000','890.000','3.000.000','Wed 14 Oct','+10.000']],
  sheet:r=>({t:r[0],s:'Cash on hand · Petty cash · Cashier float · Counts',cols:['Date','Entry',{t:'In',r:1},{t:'Out',r:1},{t:'Balance',r:1}],rows:[['Wed 14 Oct','Takings',  '6.240.000','','18.420.000'],['Wed 14 Oct','Count · 0 difference','','',''],['Tue 13 Oct','BKM-26-10-0091 · to BCA','','7.100.000','12.180.000'],['Tue 13 Oct','Takings','5.880.000','','19.280.000']]})},
 salesDay:{t:'Sales by Day',
  filters:[{t:'Shop',v:'All shops'},{t:'Month',v:'October 2026'}],
  cols:['Day','Shop',{t:'Net sales',r:1},{t:'Cash',r:1},{t:'Card & QRIS',r:1,k:'card'},{t:'Posted',k:'posted'}],
  rows:[['Wed 14 Oct','Grand Indonesia','21.480.000','6.240.000','15.240.000',ST('Posted','ok')],['Wed 14 Oct','Pondok Indah Mall','17.105.000','5.020.000','12.085.000',ST('Posted','ok')],['Wed 14 Oct','Senayan City','12.930.000','3.410.000','9.520.000',ST('Not posted','warn')],['Tue 13 Oct','Kota Kasablanka','19.776.000','6.115.000','13.661.000',ST('Posted','ok')]]},
 inventory:{t:'Inventory Valuation',
  filters:[{t:'Unit',v:'All units'}],
  cols:['Unit',{t:'Pieces',r:1},{t:'In transit',r:1,k:'transit'},{t:'Value',r:1},{t:'Ledger',r:1,k:'ledger'},{t:'Difference',r:1,k:'ledger'}],
  rows:[['DC Cikarang','48.210','1.240','3.482.600.000','3.482.600.000','0'],['Grand Indonesia','6.118','—','441.920.000','441.920.000','0'],['Pondok Indah Mall','5.402','—','390.110.000','392.040.000','<span class="neg">−1.930.000</span>'],['Senayan City','4.977','—','359.300.000','359.300.000','0']],
  sheet:r=>({t:'In transit',s:r[0],cols:['Delivery note','To',{t:'Pieces',r:1},{t:'Value',r:1},'Sent'],rows:[['SJ-26-10-0318','Senayan City','640','46.200.000','Tue 13 Oct'],['SJ-26-10-0322','Grand Indonesia','600','43.180.000','Wed 14 Oct']]})},
 cogs:{t:'Cost of Goods Sold',
  filters:[{t:'Year',v:'2026'}],
  cols:['Month',{t:'Net sales',r:1},{t:'COGS',r:1},{t:'Adjustments',r:1,k:'adj'},{t:'Gross margin',r:1},{t:'Margin %',r:1}],
  rows:[['October','1.284.500.000','612.300.000','4.100.000','672.200.000','52,3'],['September','2.410.800.000','1.151.900.000','−2.450.000','1.258.900.000','52,2'],['August','2.388.000.000','1.140.200.000','1.020.000','1.247.800.000','52,3']]},
 pinv:{t:'Purchase Invoice',
  acts:[{t:'Repeat…',k:'repeat'},{t:'New',pri:1,k:'new',opts:['Bill',['Return','Credit Note']]}],

let view=['menu','flows','where'].includes(q.get('view'))?q.get('view'):'menu'
let cur=q.get('s')||'overview'
let todayCur=+q.get('t')||0
let openG=null
const save=()=>{const p=new URLSearchParams({v:ver,view});if(ver==='today')p.set('t',todayCur);else p.set('s',cur);history.replaceState(null,'','?'+p)}

const menuOf=v=>V[v].menu
const inMenu=(v,s)=>{for(const g of menuOf(v))for(const r of g.r){const id=Array.isArray(r)?r[0]:r;if(id===s)return {g,label:Array.isArray(r)?r[1]:S[id].t}}return null}
const rowCount=v=>v==='today'?57:menuOf(v).reduce((n,g)=>n+g.r.length,0)
const step=s=>STEPS.find(x=>x.s===s)
// where a screen sits in version v, as words
const where=(v,s,k)=>{
 if(s==='@accruals')s='period'
 const m=inMenu(v,s)
 if(m)return (m.g.l?m.g.l+' › ':'')+m.label
 const st=step(s); if(st)return 'Period Close › '+st.t
 return '⌘K'
}
const only=(x)=>!x||x==='bcd'&&ver!=='a'||x==='a'&&ver==='a'

/* ───────────────────────── sidebar ───────────────────────── */
function rail(){
 $('#rail').innerHTML=['home','buy','ops','inv','sales','fin','hr','ga'].map(k=>`<span class="ic${k==='fin'?' on':''}">${svg(k)}</span>`).join('')
}
function side(anim){
 const L=$('#list'); let h=''
 if(ver==='today'){
  let i=0
  TODAY.forEach((g,gi)=>{
   const rows=g.r.map(r=>{const j=i++;return `<button class="item${j===todayCur?' on':''}" data-t="${j}"><span>${r[0]}</span>${r[1]?`<span class="badge">${r[1]}</span>`:''}</button>`}).join('')
   if(!g.l){h+=`<div class="group">${rows}</div>`;return}
   const has=g.r.some((r,ri)=>todayIndex(gi,ri)===todayCur)
   const open=openG===null?has:openG===g.l
   const bd=g.r.reduce((n,r)=>n+(r[1]||0),0)
   h+=`<div class="group folded ${open?'open':'shut'}"><button class="glabel" data-g="${g.l}"><span>${g.l}</span>${!open&&bd?`<span class="badge">${bd}</span>`:svg('chev')}</button><div class="fold"><div>${rows}</div></div></div>`
  })
 } else {
  const v=V[ver]
  menuOf(ver).forEach(g=>{
   const rows=g.r.map(r=>{const id=Array.isArray(r)?r[0]:r,lab=Array.isArray(r)?r[1]:S[id].t,b=BADGE[id]
    return `<button class="item${id===cur?' on':''}" data-s="${id}"><span>${lab}</span>${b?`<span class="badge">${b}</span>`:''}</button>`}).join('')
   if(g.cut)h+='<div class="cut"></div>'
   if(!g.l){h+=`<div class="group">${rows}</div>`;return}
   if(!v.fold){h+=`<div class="group"><div class="glabel">${g.l}</div>${rows}</div>`;return}
   const has=g.r.some(r=>(Array.isArray(r)?r[0]:r)===cur)
   const open=openG===null?has:openG===g.l
   const bd=g.r.reduce((n,r)=>n+(BADGE[Array.isArray(r)?r[0]:r]||0),0)
   h+=`<div class="group folded ${open?'open':'shut'}"><button class="glabel" data-g="${g.l}"><span>${g.l}</span>${!open&&bd?`<span class="badge">${bd}</span>`:svg('chev')}</button><div class="fold"><div>${rows}</div></div></div>`
  })
 }
 L.innerHTML=h
 $('#count').textContent=rowCount(ver)+' rows'
 if(anim){L.classList.remove('swap');void L.offsetWidth;L.classList.add('swap')}
}
function todayIndex(gi,ri){let n=0;for(let g=0;g<gi;g++)n+=TODAY[g].r.length;return n+ri}
const todayRow=j=>{let n=0;for(const g of TODAY)for(const r of g.r){if(n===j)return {label:r[0],group:g.l||''};n++}}

/* ───────────────────────── page: one screen ───────────────────────── */
const cell=c=>typeof c==='string'?{t:c}:c
const mk=k=>k?` data-k="${k}"`:''
function screenHTML(id){
 const sp=S[id]
 const m=ver==='today'?null:inMenu(ver,id)
 let crumb='Finance'+(m&&m.g.l&&ver==='a'?' · '+m.g.l:'')
 if(!m&&ver!=='today'){const st=step(id);if(st)crumb='Finance · Period Close'}
 const took=OLD.filter(o=>{const d=dest(o,ver);return d.s===id||(id==='period'&&d.s==='@accruals')})
 let h=''
 const chips=took.map(o=>{const d=dest(o,ver);const self=d.how==='Row'&&!d.k&&o[0]===sp.t
    return self?'':`<button data-hl="${d.k||''}">${o[0]}${d.note?` <i>· ${d.note}</i>`:d.how!=='Row'?` <i>· ${d.how.toLowerCase()}</i>`:''}</button>`}).join('')
 if(chips)h+=`<div class="took"><b>Took in</b>${chips}</div>`
 h+=`<div class="crumb">${crumb}</div><div class="head"><h1>${sp.t}</h1><div class="acts">${(sp.acts||[]).map((a,i)=>`<button class="btn${a.pri?' pri':''}"${mk(a.k)} ${a.opts?`data-pop="${id}:a${i}"`:''}>${a.t}${a.opts?svg('down'):''}${a.k&&!a.pri?'<span class="dot-m"></span>':''}</button>`).join('')}</div></div>`
 if(sp.kpis)h+=`<div class="kpis"${mk('kpi')}>${sp.kpis.map(k=>`<div class="kpi"><span>${k[0]}</span><strong class="num">${k[1]}</strong></div>`).join('')}</div>`
 if(sp.board)return h+giroBoard()
 if(sp.sets)return h+settingsHTML()
 if(sp.accounts&&ver!=='a')h+=`<div${mk('accounts')}><table><thead><tr><th>Account</th><th class="r">Book balance</th><th class="r">Statement</th><th class="r">To match</th><th>Last statement</th></tr></thead><tbody>
  <tr><td>BCA 0812</td><td class="r">1.402.300.000</td><td class="r">1.396.075.000</td><td class="r">8</td><td>14 Oct</td></tr>
  <tr><td>Mandiri 1220</td><td class="r">884.150.000</td><td class="r">884.150.000</td><td class="r">4</td><td>14 Oct</td></tr>
  <tr><td>BRI 4471</td><td class="r">121.900.000</td><td class="r">121.900.000</td><td class="r">0</td><td>9 Oct</td></tr></tbody></table></div><h3>BCA 0812</h3>`
 if(sp.h3)h+=`<h3>${sp.h3}</h3>`
 const fl=(sp.filters||[]).filter(f=>only(f.only))
 if(fl.length)h+=`<div class="bar">${fl.map((f,i)=>`<button class="flt"${mk(f.k)} ${f.opts?`data-pop="${id}:f${(sp.filters||[]).indexOf(f)}"`:''}><span>${f.t}</span>${f.v}${svg('chev')}</button>`).join('')}</div>`
 const cols=sp.cols.map(cell)
 const rows=sp.rows.filter(r=>{const l=r[r.length-1];return !(l&&typeof l==='object'&&!only(l.only))}).map(r=>r.filter(c=>typeof c!=='object'))
 h+=`<table${mk(sp.k)}><thead><tr>${cols.map(c=>`<th class="${c.r?'r':''}"${mk(c.k)}>${c.t}${c.k?'<span class="dot-m"></span>':''}</th>`).join('')}</tr></thead><tbody>${rows.map((r,ri)=>`<tr class="${sp.sheet?'click':''}" data-row="${ri}"${ri===0&&sp.rowk?mk(sp.rowk):''}>${r.map((c,ci)=>`<td class="${cols[ci]&&cols[ci].r?'r':''}">${String(c).replace(/^ +/,m=>'&nbsp;'.repeat(m.length*2))}</td>`).join('')}</tr>`).join('')}</tbody></table>`
 if(sp.period)h+=periodSteps()
 return h
}
function giroBoard(){
 const L=[['Written',[['GR-228116','PT Kain Nusantara','24.000.000','due 30 Oct']]],['Delivered',[['GR-228114','CV Benang Emas','32.000.000','due 19 Oct'],['MD-551203','PT Sinar Garmindo','48.000.000','due 26 Oct']]],['Due',[['GR-228109','PT Jasa Angkut','12.000.000','due 15 Oct']]],['Cleared',[['GR-228101','PT Kain Nusantara','36.000.000','cleared 9 Oct']],'clear'],['Bounced',[]]]
 return `<div class="board">${L.map(l=>`<div class="lane"${mk(l[2])}><p>${l[0]}<span class="num">${l[1].length}</span></p>${l[1].map(c=>`<div class="card"><div class="num">${c[2]}</div><span>${c[1]}</span><span>${c[0]} · ${c[3]}</span></div>`).join('')}</div>`).join('')}</div>`
}
function settingsHTML(){
 return `<div class="sets">${SETS.map(g=>{const rows=g.r.filter(r=>only(r[2]||0))
  return `<h3>${g.h}</h3><div class="grp"${mk(g.k)}>${rows.map(r=>`<div class="row"><div>${r[0]}</div><span>${r[3]?`<span class="badge">${r[3]}</span>`:''}${svg('chev')}</span></div>`).join('')}</div>`}).join('')}</div>`
}
function periodSteps(){
 return `<h3>October 2026</h3><div class="steps">${STEPS.map((s,i)=>{
  const tgt=s.s==='@accruals'?'Accruals':S[s.s].t
  return `<button class="step" data-step="${i}"${s.k==='accruals'?mk('accruals'):''}><span class="tick ${s.done?'done':''}">${s.done?svg('tick'):''}</span><span class="t">${s.t}</span><span class="go">${tgt}${svg('chev')}</span></button>`}).join('')}</div>`
}
function todayPage(){
 const r=todayRow(todayCur)
 const os=OLD.filter(o=>o[2]==='m'&&o[0]===r.label&&o[1]===(r.group==='Overview'&&r.label==='Overview'?'':r.group))
 const o=os[0]||OLD.find(o=>o[0]===r.label)
 let h=`<div class="crumb">Finance${r.group?' · '+r.group:''}</div><div class="head"><h1>${r.label}</h1></div>`
 h+=`<table><thead><tr><th>Version</th><th>Lives in</th><th>As</th><th></th></tr></thead><tbody>${['a','b','c','d'].map(v=>{const d=dest(o,v)
  return `<tr class="go" data-v="${v}" data-s="${d.s||''}" data-hl="${d.k||''}"><td>${V[v].n} · ${V[v].name}</td><td>${d.s?(d.how==='Settings'?where(v,'settings')+' › '+(SETS.find(g=>g.k===d.k)||{}).h:where(v,d.s)):'—'}</td><td><span class="how ${d.how}">${d.how}</span></td><td class="wrap" style="color:var(--mute)">${d.note||''}</td></tr>`}).join('')}</tbody></table>`
 return h
}

/* ───────────────────────── flows ───────────────────────── */
// today steps: [where, action]; version steps: [screen, key, action, versions?]
const FLOWS=[
 {t:'Close the month',today:[['Payables › Accruals','book'],['Inventory › Stock vs Ledger','check'],['Inventory › Cost of Goods Sold','check'],['Assets › Asset','depreciate'],['Tax › Tax Payables','owe'],['Closing › Period Close','tick'],['Accounting Masters › Accounting Period','close']],
  now:[['period','accruals','Accruals and prepaids'],['inventory','ledger','Difference'],['asset','dep','Depreciate'],['tax','','owe'],['period','','Close October']]},
 {t:'Close the year',today:[['Closing › Period Closing Voucher','close'],['Financial Reports › Profit and Loss by Unit','read'],['Financial Reports › Balance Sheet 2 Years','read'],['Financial Reports › Statement of Changes in Equity','read']],
  now:[['period','year','Close the year'],['pl','cols','Columns: Unit'],['bs','cmp','Compare: Last year'],['equity','','read']]},
 {t:'A store’s day',today:[['Stores › Sales by Day','read'],['Stores › Cash on Hand','balance'],['Stores › Cash Counts','difference'],['Receivables › Card & EDC Settlement','settle'],['Banking › Bank Reconciliation','match']],
  now:[['salesDay','posted','Posted'],['storeCash','count','Last count'],['recon','','match']]},
 {t:'Match the bank',today:[['Banking › Bank Transactions','upload'],['Banking › Bank Reconciliation','match'],['Banking › Bank Rules','add rule'],['Financial Reports › Bank Reconciliation Summary','print']],
  now:[['recon','show','Upload · match'],['recon','rules','Rules…'],['recon','summary','Summary']]},
 {t:'What we owe, and when',today:[['Payables › Accounts Payable','ageing'],['Payables › Supplier Bills','per supplier'],['⌘K › Supplier Ledger','movements'],['Payables › Payment Projection','calendar'],['Payables › Loans','instalments']],
  now:[['ap','group','By supplier'],['ap','ledger','click a supplier'],['ap','party','Party: Lender','bcd'],['projection','','calendar'],['loans','','instalments','a']]},
 {t:'Supplier takes goods back',today:[['Payables › Credit Note','new'],['Payables › Purchase Invoice','next bill']],
  now:[['pinv','new','New ⌄ Return'],['pinv','kind','Kind: Return']]},
 {t:'Pay the month’s PPh',today:[['Tax › Tax Payables','owe'],['Tax › Tax Withholding Details','list'],['Payments › BKK','pay']],
  now:[['tax','withheld','click PPh 23'],['withholding','','list','a'],['bkk','','pay']]},
 {t:'Set up a store’s EDC',today:[['Payments › Mode of Payment','method'],['⌘K › Shop Payment Methods','per shop'],['⌘K › EDC & MDR','MDR']],
  now:[['settings','set-pay','Payments']]},
]
const places=steps=>new Set(steps.map(s=>s[0])).size
function flowsHTML(){
 if(ver==='today')return `<div class="crumb">Flows</div><div class="head"><h1>Pick a version</h1></div>`
 return `<div class="crumb">Flows · ${V[ver].n} ${V[ver].name}</div><div class="head"><h1>Same jobs, fewer places</h1></div><div class="flows">${FLOWS.map((f,fi)=>{
  const now=f.now.filter(s=>only(s[3]))
  const pt=places(f.today.map(s=>[s[0]])),pn=places(now)
  return `<div class="flow"><h4>${f.t}<span>${pt} places → <b>${pn}</b></span></h4><div class="lanes"><em>Today</em><div class="path">${f.today.map((s,i)=>`${i?`<span class="arr">${svg('chev')}</span>`:''}<span class="st">${s[0]}<small>${s[1]}</small></span>`).join('')}</div><em>${V[ver].n}</em><div class="path">${now.map((s,i)=>`${i?`<span class="arr">${svg('chev')}</span>`:''}<button class="st" data-go="${s[0]}" data-hl="${s[1]}">${where(ver,s[0])}<small>${s[2]}</small></button>`).join('')}</div></div></div>`}).join('')}</div>`
}

/* ───────────────────────── where did it go ───────────────────────── */
let qtxt=''
function whereHTML(){
 const v=ver==='today'?'a':ver
 const removed=OLD.filter(o=>!dest(o,v).s).length
 const screens=new Set(OLD.map(o=>dest(o,v).s).filter(Boolean)).size
 let h=`<div class="crumb">Where did it go · ${V[v].n} ${V[v].name}</div><div class="head"><h1>Every row today</h1></div>
 <div class="tally"><div class="kpi"><span>Today</span><strong class="num">57 + 28</strong></div><div class="kpi"><span>${V[v].n} menu</span><strong class="num">${rowCount(v)}</strong></div><div class="kpi"><span>Screens left</span><strong class="num">${screens}</strong></div><div class="kpi"><span>Removed</span><strong class="num">${removed}</strong></div></div>
 <div class="where-top"><input id="q" placeholder="Search a row" value="${qtxt}"></div>`
 const rows=OLD.filter(o=>!qtxt||(o[0]+' '+o[1]).toLowerCase().includes(qtxt.toLowerCase()))
 h+=`<table><thead><tr><th>Today</th><th>Group</th><th>Seen</th><th>Now</th><th>As</th><th></th></tr></thead><tbody>${rows.map(o=>{const d=dest(o,v)
  const loc=!d.s?'—':d.how==='Settings'?where(v,'settings')+' › '+(SETS.find(g=>g.k===d.k)||{}).h:where(v,d.s)
  return `<tr class="${d.s?'go':''}" data-v="${v}" data-s="${d.s||''}" data-hl="${d.k||''}"><td>${o[0]}</td><td style="color:var(--mute)">${o[1]||'—'}</td><td style="color:var(--mute)">${{m:'Menu',k:'⌘K',h:'Hidden'}[o[2]]}</td><td>${loc}</td><td><span class="how ${d.how}">${d.how}</span></td><td class="wrap" style="color:var(--mute)">${d.note||''}</td></tr>`}).join('')}</tbody></table>`
 return h
}

/* ───────────────────────── render ───────────────────────── */
function page(anim){
 closeSheet(); hidePop()
 const P=$('#page')
 P.innerHTML=view==='flows'?flowsHTML():view==='where'?whereHTML():ver==='today'?todayPage():screenHTML(cur)
 if(anim){P.classList.remove('swap');void P.offsetWidth;P.classList.add('swap')}
 const qi=$('#q'); if(qi){qi.oninput=e=>{qtxt=e.target.value;const pos=e.target.selectionStart;page();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
}
function sw(){
 const vs=['today','a','b','c','d']
 $('#switch').innerHTML=vs.map((v,i)=>`<button data-v="${v}" aria-pressed="${ver===v}">${v==='today'?'Today':`<b>${V[v].n}</b>${V[v].name}${V[v].star?' ★':''}`}<span class="n">${rowCount(v)}</span></button>`).join('')+'<span class="sep"></span>'+[['menu','Menu'],['flows','Flows'],['where','Where did it go']].map(([k,l])=>`<button data-view="${k}" aria-pressed="${view===k}">${l}</button>`).join('')
}
function all(anim){side(anim);page(anim);sw();save()}
function hl(k){
 if(!k)return
 requestAnimationFrame(()=>{const els=document.querySelectorAll(`[data-k="${k}"]`);els.forEach(e=>{e.classList.remove('lit');void e.offsetWidth;e.classList.add('lit')});if(els[0])els[0].scrollIntoView({block:'nearest',behavior:'smooth'})})
}
function go(s,k){
 if(s==='@accruals'){s='period';k='accruals'}
 if(ver==='today')ver='a'
 cur=s;view='menu';openG=null;all(true);hl(k)
}

/* sheet */
function openSheet(t,s,cols,rows){
 $('#sheetT').textContent=t;$('#sheetS').textContent=s||''
 const c=cols.map(cell)
 $('#sheetIn').innerHTML=`<table><thead><tr>${c.map(x=>`<th class="${x.r?'r':''}">${x.t}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${c[i].r?'r':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`
 $('#pageWrap').classList.add('sheeted');$('#sheet').setAttribute('aria-hidden','false')
}
function closeSheet(){$('#pageWrap').classList.remove('sheeted');$('#sheet').setAttribute('aria-hidden','true')}

/* popover */
function showPop(btn,key){
 const [id,ref]=key.split(':'),sp=S[id]
 const src=ref[0]==='a'?sp.acts[+ref.slice(1)]:sp.filters[+ref.slice(1)]
 const P=$('#pop')
 P.innerHTML=src.opts.filter(o=>!Array.isArray(o)||only(o[2])).map(o=>Array.isArray(o)?`<div>${o[0]}<i>${o[1]}</i></div>`:`<div>${o}</div>`).join('')
 const r=btn.getBoundingClientRect()
 P.style.left=Math.min(r.left,innerWidth-260)+'px';P.style.top=(r.bottom+6)+'px'
 P.hidden=false
}
function hidePop(){$('#pop').hidden=true}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,tr')
 if(!e.target.closest('[data-pop]')&&!e.target.closest('#pop'))hidePop()
 if(!t)return
 if(t.dataset.pop){e.stopPropagation();$('#pop').hidden?showPop(t,t.dataset.pop):hidePop();return}
 if(t.id==='sheetX'){closeSheet();return}
 if(t.dataset.v&&t.closest('#switch')){ver=t.dataset.v;openG=null;if(ver!=='today'&&!inMenu(ver,cur)&&!step(cur))cur='overview';all(true);return}
 if(t.dataset.view){view=t.dataset.view;all(true);return}
 if(t.dataset.g!==undefined&&t.classList.contains('glabel')){const g=t.dataset.g,grp=t.parentElement;openG=grp.classList.contains('open')?'':g;side();return}
 if(t.dataset.t!==undefined){todayCur=+t.dataset.t;view='menu';openG=null;all(true);return}
 if(t.dataset.s!==undefined&&t.closest('#list')){cur=t.dataset.s;view='menu';all(true);return}
 if(t.matches('tr.go')&&t.dataset.s){ver=t.dataset.v;go(t.dataset.s,t.dataset.hl);return}
 if(t.dataset.go){go(t.dataset.go,t.dataset.hl);return}
 if(t.dataset.hl!==undefined&&t.closest('.took')){hl(t.dataset.hl);return}
 if(t.dataset.step!==undefined){const s=STEPS[+t.dataset.step]
  if(s.s==='@accruals'){openSheet('Accruals and prepaids','October 2026',['What','Account',{t:'Amount',r:1},'Until'],[['Electricity · all shops, no bill yet','6201 · Utilities','31.400.000','bill arrives'],['Rent · Senayan City paid ahead','1401 · Prepaid rent','45.000.000','Mar 2027'],['Insurance · stock','1402 · Prepaid insurance','4.200.000','Dec 2026']]);return}
  go(s.s,s.k);return}
 if(t.matches('tr.click')){const sp=S[cur];if(sp&&sp.sheet){const rows=sp.rows.filter(r=>{const l=r[r.length-1];return !(l&&typeof l==='object'&&!only(l.only))});const d=sp.sheet(rows[+t.dataset.row]);openSheet(d.t,d.s,d.cols,d.rows)}}
})
$('#scrim').onclick=closeSheet
addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return
 if(e.key==='Escape'){closeSheet();hidePop();return}
 const m={'0':'today','1':'a','2':'b','3':'c','4':'d'}[e.key]
 if(m){ver=m;openG=null;if(ver!=='today'&&!inMenu(ver,cur)&&!step(cur))cur='overview';all(true);return}
 const w={m:'menu',f:'flows',w:'where'}[e.key];if(w){view=w;all(true)}
})
addEventListener('resize',hidePop)
rail();all()
</script>
</body>
</html>
