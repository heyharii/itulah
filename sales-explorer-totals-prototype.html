<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales totals prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* frontend-hub tokens (src/styles/index.css) */
:root{
  --ink:#20242c;--text:#394150;--body:#565f6d;--mute:#666f7d;--faint:#b9c0c9;--line-ico:#89919d;
  --canvas:#ffffff;--soft:#f8f8f9;--soft-2:#f0f0f2;--soft-3:#f6f6f7;
  --hairline:#e6e6e9;--hairline-2:#dadade;--hairline-strong:#c6c6cc;
  --rail:#242526;--rail-2:#303234;--rail-text:#c3c4c7;--rail-mute:#a1a3a8;--rail-hair:#343638;
  --accent:#2563eb;--accent-bg:#eff5ff;--bad-fg:#be123c;--good-fg:#15803d;
  --r-card:10px;--r-inner:8px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--soft-3);color:var(--ink);font:400 15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.pressable{transition:transform 120ms var(--ease-out),background-color 150ms ease,color 150ms ease}
.pressable:active{transform:scale(.97)}

/* prototype chrome: option switcher, outside the app */
.proto{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--dark,#191b20);color:#fff;font-size:14px}
.proto b{font-weight:600;margin-right:8px}
.proto button{padding:6px 12px;border-radius:999px;color:#c3c4c7}
.proto button.on{background:#fff;color:#191b20}
.proto .note{margin-left:auto;color:#a1a3a8}

/* app shell: rail + page, no department sidebar */
.app{display:flex;min-height:calc(100vh - 44px)}
.rail{width:64px;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.rail .logo{width:32px;height:32px;border-radius:8px;background:#000;color:#fff;font-weight:700;display:grid;place-items:center;margin-bottom:12px;position:relative}
.rail .logo:after{content:"";position:absolute;right:7px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.rail i{width:36px;height:36px;border-radius:8px;display:block;background:transparent;position:relative}
.rail i:before{content:"";position:absolute;inset:11px;border:1.6px solid var(--rail-mute);border-radius:4px}
.rail i.on{background:var(--rail-2)}
.rail i.on:before{border-color:#fff}
.page{flex:1;min-width:0;padding:22px 28px 28px}

/* header */
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.title h1{margin:0;font-size:22px;line-height:28px;font-weight:600}
.title p{margin:2px 0 0;color:var(--mute)}
.head .grow{flex:1}
.seg{display:inline-flex;background:var(--soft-2);border-radius:var(--r-inner);padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:6px;color:var(--body);font-size:14px;font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.search{height:36px;width:240px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mute)}
.search input{border:0;outline:0;font:inherit;flex:1;min-width:0;color:var(--ink);background:transparent}

/* the totals band: transactions → pieces → gross − discount − returns = net */
.band{margin-top:18px;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 1px minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) 1px minmax(0,1fr);align-items:stretch}
.fig{padding:14px 16px;min-width:0}
.fig .l{color:var(--mute);font-size:14px}
.fig .v{font-size:22px;line-height:30px;font-weight:600;margin-top:2px;white-space:nowrap}
.fig .s{color:var(--mute);font-size:14px;margin-top:2px;line-height:20px}
.op{display:grid;place-items:center;color:var(--faint);font-size:20px;padding:0 2px}
.vr{background:var(--hairline);margin:14px 0}
.fig.net .v{color:var(--ink)}
.delta{font-size:14px;font-weight:500;margin-left:6px}
.up{color:var(--good-fg)}.down{color:var(--bad-fg)}

/* results card */
.card{margin-top:16px;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--hairline);min-height:52px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;align-self:stretch}
.tabs button{position:relative;padding:0 10px;color:var(--body);font-weight:500;font-size:14px;min-height:52px}
.tabs button.on{color:var(--ink)}
.tabs button.on:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.card-h .grow{flex:1}
.btn{height:34px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.btn .badge{background:var(--ink);color:#fff;border-radius:999px;font-size:12px;line-height:18px;padding:0 6px}
.crumb{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--hairline);color:var(--mute);font-size:14px}
.crumb button{color:var(--accent);font-weight:500}

.scroll{overflow:auto;max-height:calc(100vh - 360px)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:0 16px;height:56px;border-bottom:1px solid var(--hairline);text-align:right;white-space:nowrap}
th{height:44px;font-size:14px;font-weight:500;color:var(--mute);background:#fff;position:sticky;top:0;z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
th:first-child{z-index:3}
td.name{min-width:240px}
td.name .n{font-weight:500;color:var(--ink)}
td.name .d{color:var(--mute);font-size:14px}
tbody tr{cursor:pointer;transition:background-color 120ms ease}
tbody tr:hover td{background:var(--soft)}
tfoot td{position:sticky;bottom:0;background:var(--soft);font-weight:600;border-top:1px solid var(--hairline-2);z-index:2}
tfoot td:first-child{z-index:3}
.num-b{font-weight:600;color:var(--ink)}
.q{color:var(--mute)}
.share{color:var(--body)}
.rank{color:var(--faint);width:40px}
td.heat{transition:background-color 150ms ease}
table.tight th,table.tight td{padding:0 9px}
table.tight th:first-child,table.tight td:first-child{padding-left:16px}
table.tight td.name{min-width:200px}
.unit{color:var(--faint);font-weight:400}
.caret{display:inline-block;width:16px;color:var(--line-ico);transition:transform 150ms var(--ease-out)}
.open>.name .caret{transform:rotate(90deg)}
tr.lvl2 td.name{padding-left:40px}
tr.lvl3 td.name{padding-left:64px}
tr.lvl2 td,tr.lvl3 td{background:#fcfcfd}
.fade{animation:fade 160ms var(--ease-out)}
@keyframes fade{from{opacity:.4;transform:translateY(2px)}to{opacity:1;transform:none}}
.foot{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--mute);font-size:14px}
.legend{display:inline-flex;align-items:center;gap:6px}
.legend span{display:inline-block;width:72px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(37,99,235,.04),rgba(37,99,235,.45))}

@media (max-width:760px){
  .page{padding:16px}
  .rail{display:none}
  .band{grid-template-columns:1fr 1fr}
  .band .op,.band .vr{display:none}
  .head .grow{display:none}
  .search{width:100%}
  .seg{overflow:hidden}
  .seg button{padding:0 8px}
  .tabs{flex-wrap:wrap}
  .tabs button{min-height:44px}
  .hide-phone{display:none}
  th,td{padding:0 8px;height:52px}
  th:first-child,td:first-child{padding-left:12px}
  td.name{min-width:0;white-space:normal}
  .proto .note{display:none}
  .proto{overflow-x:auto}
}
</style>
</head>
<body>
<div class="proto">
  <b>Sales — prototype</b>
  <button class="pressable on" data-opt="A">A · One table</button>
  <button class="pressable" data-opt="B">B · Store board</button>
  <button class="pressable" data-opt="C">C · Division tree</button>
  <span class="note">Real 2025 totals from the 1M-sale server · tag, supplier, colour and size splits are sample (the load data has none)</span>
</div>
<div class="app">
  <nav class="rail"><div class="logo">C</div><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i></nav>
  <main class="page" id="page"></main>
</div>

function totals() {
  const k = scale();
  const done = D.receipts.done * k.sold, voided = D.receipts.voided * k.sold;
  const sold = YEAR.sold * k.sold, net = YEAR.net * k.net;
  return { done, voided, sold, gross: net, discount: 0, returns: 0, net, perTx: net / done };
}

/* ── rows per grouping ───────────────────────────────── */
const STORES = D.store;
function sampleSplit(labels, weights, salt) {
  const k = scale();
  const tw = weights.reduce((a, b) => a + b, 0);
  return labels.map((label, i) => {
    const w = weights[i] / tw;
    const perStore = {};
    STORES.forEach((s, j) => { const wob = 1 + (((i * 7 + j * 3 + salt) % 9) - 4) / 400; perStore[s.id] = { sold: s.sold * w * wob * k.sold, net: s.net * w * wob * k.net }; });
    return { key: label, label, detail: null, articles: Math.round(12000 * w), sold: YEAR.sold * w * k.sold, net: YEAR.net * w * k.net, perStore };
  });
}
const TAGS = D.tags.map((t) => t.label);
const TAG_W = [9, 14, 7, 8, 5, 6, 4, 5, 3, 11, 2, 7, 5, 6, 3, 2, 2, 3, 4, 3, 2];
function rows() {
  const k = scale();
  if (S.drill) {
    const d = D.div.find((x) => x.code === S.drill);
    const arts = D.art[S.drill].map((a, i) => ({
      key: a.code, label: a.name, detail: a.code + " · " + d.label + " · " + TAGS[(i * 5 + 3) % TAGS.length],
      articles: 1, sold: a.sold * k.sold, net: a.net * k.net, perStore: perStoreOf(a.net * k.net, a.sold * k.sold, i),
    }));
    return arts;
  }
  switch (S.group) {
    case "division":
      return D.div.map((d) => ({
        key: d.code, label: d.label, detail: null, articles: d.articles, sold: d.sold * k.sold, net: d.net * k.net,
        perStore: Object.fromEntries(STORES.map((s) => [s.id, { sold: D.divstore[d.code][s.id].sold * k.sold, net: D.divstore[d.code][s.id].net * k.net }])),
      }));
    case "tag": return sampleSplit(TAGS, TAG_W, 1).sort((a, b) => b.net - a.net);
    case "store":
      return STORES.map((s) => ({ key: s.id, label: s.name, detail: s.code, articles: 12000, sold: s.sold * k.sold, net: s.net * k.net, perStore: { [s.id]: { sold: s.sold * k.sold, net: s.net * k.net } }, tx: D.rcpt[s.id].done * k.sold }));
    case "supplier": return sampleSplit(["CV Benang Mas", "PT Sandang Prima", "UD Tenun Jaya", "PT Garmen Nusantara", "CV Kain Indah", "PT Busana Utama", "No supplier"], [18, 16, 15, 14, 13, 12, 12], 2);
    case "colour": return sampleSplit(["Black", "White", "Navy", "Grey"], [27, 25, 24, 24], 3);
    case "size": return sampleSplit(["XS", "S", "M", "L"], [21, 26, 29, 24], 4);
    case "article": {
      const all = Object.entries(D.art).flatMap(([code, list]) => list.slice(0, 2).map((a) => ({ ...a, div: D.div.find((x) => x.code === code).label })));
      return all.sort((a, b) => b.net - a.net).map((a, i) => ({ key: a.code, label: a.name, detail: a.code + " · " + a.div, articles: 1, sold: a.sold * k.sold, net: a.net * k.net, perStore: perStoreOf(a.net * k.net, a.sold * k.sold, i) }));
    }
    case "sku": return sampleSplit(["90001408 · Black / M", "90004063 · Navy / S", "90001348 · White / L", "90004003 · Grey / M", "90001288 · Black / S", "90003943 · Navy / M"], [6, 6, 5, 5, 5, 5], 5);
    case "month":
      return D.month.map((m) => ({ key: m.m, label: new Date(m.m + "T00:00:00").toLocaleDateString("en-GB", { month: "long", year: "numeric" }), detail: null, articles: 12000, sold: m.sold, net: m.net, perStore: perStoreOf(m.net, m.sold, 1) }));
  }
}
function perStoreOf(net, sold, salt) {
  return Object.fromEntries(STORES.map((s, j) => { const w = (1 + (((salt + j * 5) % 7) - 3) / 60) / STORES.length; return [s.id, { net: net * w, sold: sold * w }]; }));
}
const GROUPS = [["division", "Division"], ["tag", "Tag"], ["article", "Article"], ["sku", "SKU"], ["store", "Store"], ["supplier", "Supplier"], ["colour", "Colour"], ["size", "Size"], ["month", "Month"]];
const NOUN = { division: ["division", "divisions"], tag: ["tag", "tags"], article: ["article", "articles"], sku: ["SKU", "SKUs"], store: ["store", "stores"], supplier: ["supplier", "suppliers"], colour: ["colour", "colours"], size: ["size", "sizes"], month: ["month", "months"] };

/* ── pieces of the screen ────────────────────────────── */
function header() {
  const p = PERIODS[S.period];
  return `<div class="head">
    <div class="title"><h1>Sales</h1><p>${p.text} · 13 stores</p></div>
    <div class="grow"></div>
    <div class="seg" role="tablist">${Object.entries(PERIODS).map(([k, v]) => `<button class="pressable ${S.period === k ? "on" : ""}" data-period="${k}">${v.label}</button>`).join("")}</div>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search" value="${S.q}"></label>
  </div>`;
}
function band() {
  const t = totals();
  return `<section class="band" aria-label="Totals">
    <div class="fig"><div class="l">Transactions</div><div class="v">${num(t.done + t.voided)}</div><div class="s">${num(t.done)} completed<br>${num(t.voided)} voided</div></div>
    <div class="fig"><div class="l">Sold</div><div class="v">${num(t.sold)} pcs</div><div class="s">${(t.sold / t.done).toLocaleString("id-ID", { maximumFractionDigits: 1 })} per transaction</div></div>
    <div class="vr"></div>
    <div class="fig"><div class="l">Gross sales</div><div class="v">${rpc(t.gross)}</div><div class="s">at full price</div></div>
    <div class="op">−</div>
    <div class="fig"><div class="l">Discount</div><div class="v">${rpc(t.discount)}</div><div class="s">${pct(t.discount / t.gross)} of gross</div></div>
    <div class="op">−</div>
    <div class="fig"><div class="l">Returns</div><div class="v">${rpc(t.returns)}</div><div class="s">0 pcs back</div></div>
    <div class="op">=</div>
    <div class="fig net"><div class="l">Net sales</div><div class="v">${rpc(t.net)}</div><div class="s">${rp(t.perTx)}<br>per transaction</div></div>
    <div class="vr"></div>
    <div class="fig"><div class="l">Gross profit</div><div class="v">—</div><div class="s">${num(t.sold)} pcs<br>without cost</div></div>
  </section>`;
}
function tabs(extra) {
  const g = S.drill ? "article" : S.group;
  return `<div class="card-h">
    <div class="tabs">${GROUPS.map(([k, l]) => `<button class="pressable ${g === k ? "on" : ""}" data-group="${k}">${l}</button>`).join("")}</div>
    <div class="grow"></div>${extra}
    <button class="btn pressable">Filter</button>
    <button class="btn pressable hide-phone">Export</button>
  </div>`;
}
function crumb() {
  if (!S.drill) return "";
  const d = D.div.find((x) => x.code === S.drill);
  return `<div class="crumb"><button data-up="1">All divisions</button><span>›</span><span>${d.label}</span><span>·</span><span>${num(d.articles)} articles, top 8 shown</span></div>`;
}
function filtered(list) {
  const q = S.q.trim().toLowerCase();
  return q ? list.filter((r) => (r.label + " " + (r.detail || "")).toLowerCase().includes(q)) : list;
}
function nameCell(r, i) {
  return `<td class="name"><div class="n">${r.label}</div>${r.detail ? `<div class="d">${r.detail}</div>` : ""}</td>`;
}
function countLine(list) {
  const g = S.drill ? "article" : S.group;
  const n = NOUN[g];
  return `<div class="foot">${num(list.length)} ${list.length === 1 ? n[0] : n[1]}${S.group === "tag" && !S.drill ? " · an article under two tags counts in both" : ""}</div>`;
}

/* A — one table: totals band, the grouping as tabs, one table; stores on request */
function optA() {
  const list = filtered(rows()).sort((a, b) => b.net - a.net);
  const t = totals();
  const per = S.perStore;
  const head = per
    ? `<th>${GROUPS.find((x) => x[0] === (S.drill ? "article" : S.group))[1]}</th>${STORES.map((s) => `<th>${s.code.replace("-TOKO", "")}</th>`).join("")}<th>All stores</th>`
    : `<th>${GROUPS.find((x) => x[0] === (S.drill ? "article" : S.group))[1]}</th><th class="hide-phone">Articles</th><th>Sold</th><th class="hide-phone">Gross sales</th><th class="hide-phone">Discount</th><th>Net sales</th><th>Share</th>`;
  const body = list.map((r, i) => per
    ? `<tr data-row="${r.key}">${nameCell(r, i)}${STORES.map((s) => `<td>${short(r.perStore[s.id] ? r.perStore[s.id].net : 0)}</td>`).join("")}<td class="num-b">${short(r.net)}</td></tr>`
    : `<tr data-row="${r.key}">${nameCell(r, i)}<td class="hide-phone q">${num(r.articles)}</td><td>${num(r.sold)}</td><td class="hide-phone">${rpc(r.net)}</td><td class="hide-phone q">Rp 0</td><td class="num-b">${rpc(r.net)}</td><td class="share">${pct(r.net / t.net)}</td></tr>`).join("");
  const foot = per
    ? `<tr><td>Total <span class="unit">Rp</span></td>${STORES.map((s) => `<td>${short(s.net * scale().net)}</td>`).join("")}<td>${short(t.net)}</td></tr>`
    : `<tr><td>Total</td><td class="hide-phone">${num(S.drill ? D.div.find((x) => x.code === S.drill).articles : 12000)}</td><td>${num(S.drill ? list.reduce((a, r) => a + r.sold, 0) : t.sold)}</td><td class="hide-phone">${rpc(S.drill ? list.reduce((a, r) => a + r.net, 0) : t.net)}</td><td class="hide-phone">Rp 0</td><td>${rpc(S.drill ? list.reduce((a, r) => a + r.net, 0) : t.net)}</td><td>${S.drill ? pct(list.reduce((a, r) => a + r.net, 0) / t.net) : "100,0%"}</td></tr>`;
  const toggle = `<div class="seg"><button class="pressable ${!per ? "on" : ""}" data-per="0">Totals</button><button class="pressable ${per ? "on" : ""}" data-per="1">Per store</button></div>`;
  return `${band()}<section class="card">${tabs(toggle)}${crumb()}<div class="scroll fade"><table class="${per ? "tight" : ""}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>${countLine(list)}</section>`;
}

/* B — store board: the grouping down, the 13 stores across, one number per cell */
function optB() {
  const list = filtered(rows()).sort((a, b) => b.net - a.net);
  const key = S.metric;
  const vals = list.flatMap((r) => STORES.map((s) => (r.perStore[s.id] ? r.perStore[s.id][key] : 0)));
  const max = Math.max(...vals, 1), min = Math.min(...vals.filter((v) => v > 0), max);
  const tint = (v) => (S.tint && v > 0 ? `style="background:rgba(37,99,235,${(0.04 + 0.41 * ((v - min) / (max - min || 1))).toFixed(3)})"` : "");
  const fmt = (v) => (key === "net" ? short(v) : num(v));
  const t = totals(), k = scale();
  const head = `<th>${GROUPS.find((x) => x[0] === (S.drill ? "article" : S.group))[1]}</th>${STORES.map((s) => `<th title="${s.name}">${s.code.replace("-TOKO", "")}</th>`).join("")}<th>All stores</th>`;
  const txRow = !S.drill ? `<tr class="q" style="cursor:default"><td class="name"><div class="n">Transactions</div></td>${STORES.map((s) => `<td>${num(D.rcpt[s.id].done * k.sold)}</td>`).join("")}<td class="num-b">${num(t.done)}</td></tr>` : "";
  const body = list.map((r) => `<tr data-row="${r.key}">${nameCell(r)}${STORES.map((s) => { const v = r.perStore[s.id] ? r.perStore[s.id][key] : 0; return `<td class="heat" ${tint(v)}>${v ? fmt(v) : "—"}</td>`; }).join("")}<td class="num-b">${fmt(r[key])}</td></tr>`).join("");
  const foot = `<tr><td>Total${key === "net" ? ' <span class="unit">Rp</span>' : ' <span class="unit">pcs</span>'}</td>${STORES.map((s) => `<td>${fmt(key === "net" ? s.net * k.net : s.sold * k.sold)}</td>`).join("")}<td>${fmt(key === "net" ? t.net : t.sold)}</td></tr>`;
  const extra = `<div class="seg"><button class="pressable ${key === "net" ? "on" : ""}" data-metric="net">Net sales</button><button class="pressable ${key === "sold" ? "on" : ""}" data-metric="sold">Sold</button></div>
    <div class="seg"><button class="pressable ${S.tint ? "on" : ""}" data-tint="1">Tint</button><button class="pressable ${!S.tint ? "on" : ""}" data-tint="0">Plain</button></div>`;
  return `${band()}<section class="card">${tabs(extra)}${crumb()}<div class="scroll fade"><table class="tight"><thead><tr>${head}</tr></thead><tbody>${txRow}${body}</tbody><tfoot>${foot}</tfoot></table></div><div class="foot">${S.tint ? `<span class="legend">Low <span></span> High</span> · ` : ""}${num(list.length)} ${NOUN[S.drill ? "article" : S.group][1]}</div></section>`;
}

/* C — division tree: division → tag → article, one set of columns */
function optC() {
  const k = scale(), t = totals();
  const divs = filtered(D.div.map((d) => ({ ...d, sold: d.sold * k.sold, net: d.net * k.net }))).sort((a, b) => b.net - a.net);
  const cols = (r) => `<td>${num(r.sold)}</td><td class="hide-phone">${rpc(r.net)}</td><td class="hide-phone q">Rp 0</td><td class="num-b">${rpc(r.net)}</td><td class="share">${pct(r.net / t.net)}</td>`;
  let body = "";
  divs.forEach((d, di) => {
    const open = S.open.has(d.code);
    body += `<tr class="${open ? "open" : ""}" data-tree="${d.code}"><td class="name"><span class="caret">›</span><span class="n">${d.label}</span> <span class="d">· ${num(d.articles)} articles</span></td>${cols(d)}</tr>`;
    if (!open) return;
    const picks = [0, 1, 2, 3].map((j) => TAGS[(di * 3 + j * 5) % TAGS.length]);
    const w = [0.38, 0.27, 0.21, 0.14];
    picks.forEach((tag, j) => {
      const tr = { sold: d.sold * w[j], net: d.net * w[j] };
      body += `<tr class="lvl2" data-tag="${d.code}:${j}"><td class="name"><span class="n">${tag}</span></td>${cols(tr)}</tr>`;
      if (j === 0) D.art[d.code].slice(0, 3).forEach((a) => {
        body += `<tr class="lvl3"><td class="name"><span class="n">${a.name}</span> <span class="d">${a.code}</span></td>${cols({ sold: a.sold * k.sold, net: a.net * k.net })}</tr>`;
      });
    });
  });
  const head = `<th>Division › Tag › Article</th><th>Sold</th><th class="hide-phone">Gross sales</th><th class="hide-phone">Discount</th><th>Net sales</th><th>Share</th>`;
  const foot = `<tr><td>Total</td><td>${num(t.sold)}</td><td class="hide-phone">${rpc(t.net)}</td><td class="hide-phone">Rp 0</td><td>${rpc(t.net)}</td><td>100,0%</td></tr>`;
  const card = `<div class="card-h"><div class="tabs"><button class="on">Division › Tag › Article</button></div><div class="grow"></div><button class="btn pressable" data-expand="1">Open all</button><button class="btn pressable" data-collapse="1">Close all</button><button class="btn pressable">Filter</button></div>`;
  return `${band()}<section class="card">${card}<div class="scroll fade"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div><div class="foot">${divs.length} divisions</div></section>`;
}

/* ── render & wire ───────────────────────────────────── */
function render() {
  const page = document.getElementById("page");
  const focus = document.activeElement && document.activeElement.id === "q";
  page.innerHTML = header() + (S.opt === "A" ? optA() : S.opt === "B" ? optB() : optC());
  document.querySelectorAll(".proto [data-opt]").forEach((b) => b.classList.toggle("on", b.dataset.opt === S.opt));
  if (focus) { const q = document.getElementById("q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button,tr");
  if (!b) return;
  const ds = b.dataset;
  if (ds.opt) { S.opt = ds.opt; S.drill = null; }
  else if (ds.period) S.period = ds.period;
  else if (ds.group) { S.group = ds.group; S.drill = null; }
  else if (ds.per) S.perStore = ds.per === "1";
  else if (ds.metric) S.metric = ds.metric;
  else if (ds.tint) S.tint = ds.tint === "1";
  else if (ds.up) S.drill = null;
  else if (ds.expand) S.open = new Set(D.div.map((d) => d.code));
  else if (ds.collapse) S.open = new Set();
  else if (ds.tree) { S.open.has(ds.tree) ? S.open.delete(ds.tree) : S.open.add(ds.tree); }
  else if (ds.row && S.group === "division" && !S.drill) S.drill = ds.row;
  else return;
  render();
});
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render(); } });
render();
</script>
</body>
</html>
