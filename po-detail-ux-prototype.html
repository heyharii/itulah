/* what the foot offers, by the hub's own rules (actionsOf) */
function footOf(b, o) {
  if (b.held === 'offline') return {left:['Delete Order'], right:['Edit|line','Send Now|pri|off']}
  if (b.held === 'refused') return {left:['Delete Order'], right:['Edit|pri']}
  const f = []
  const reviewing = o.lines.some(l => l.cnt !== null)
  if (o.life === 'PART') f.push('Close Short')
  if (o.life === 'ACTIVE') f.push(reviewing ? 'Cancel|off' : 'Cancel')
  if (o.life === 'ACTIVE') f.push(reviewing ? 'Edit|line' : 'Edit|pri')
  if (reviewing) f.push('Review Count|pri')
  return {left:[], right:f}
}

/* ───────────── numbers ───────────── */
function figures(o) {
  const L = o.lines
  const pieces = L.reduce((s, l) => s + l.q, 0)
  const gross = L.reduce((s, l) => s + l.q * l.price * o.pm, 0)
  const recd = L.reduce((s, l) => s + l.rec, 0)
  const counted = L.some(l => l.cnt !== null) ? L.reduce((s, l) => s + (l.cnt ?? 0), 0) : null
  const shortPcs = L.reduce((s, l) => s + l.short, 0)
  const discount = Math.round(gross * o.disc)
  const shortValue = Math.round(L.reduce((s, l) => s + l.short * l.price * o.pm, 0) * (1 - o.disc))
  const owed = pieces - recd - shortPcs
  const extra = L.reduce((s, l) => s + l.extra, 0)
  return {pieces, gross, recd, counted, shortPcs, discount, shortValue, grand: gross - discount - shortValue, owed, extra}
}
const latest = o => {
  const all = o.lines.flatMap(l => l.rc)
  if (!all.length) return null
  const seen = [...new Set(all.sort((a, b) => new Date(a.d) - new Date(b.d)).map(r => r.g))]
  return seen.at(-1) + (seen.length > 1 ? ' +' + (seen.length - 1) : '')
}
const priceText = (l, o, mode) => mode === 'kodi' ? rp(l.kodiPrice * o.pm) + ' / kodi' : rp(l.price * o.pm) + ' / pc'
const unit = (n, kodi) => kodi ? n / 20 + ' kodi' : null

function itemTable(o,f){return `<section class="order-items"><div class="section-title"><h2>Ordered items <span class="muted">· ${o.lines.length}</span></h2>${summaryLayout==='e'?`<div class="caption-qty">Ordered <strong>${pcs(f.pieces)}</strong><span>·</span>Received <strong>${pcs(f.recd)}</strong></div>`:'<small>Quantities in pcs</small>'}</div><div class="tablewrap desktop-table"><table><thead><tr><th>Item</th><th class="right">Ordered</th><th class="right">Received</th><th class="right">Unit price</th><th class="right">Order amount</th></tr></thead><tbody>${o.lines.map(l=>`<tr><td>${itemLabel(l)}${l.short?`<span class="sub">${pcs(l.short)} closed unfulfilled</span>`:''}</td><td class="right">${num(l.q)}${S.lines==='kodi'?`<span class="sub">${l.q/20} kodi</span>`:''}</td><td class="right">${num(l.rec)}</td><td class="right">${rp((S.lines==='kodi'?l.kodiPrice:l.price)*o.pm)}<span class="sub">per ${S.lines==='kodi'?'kodi':'pc'}</span></td><td class="right">${rp(l.q*l.price*o.pm)}</td></tr>`).join('')}</tbody>${summaryLayout==='c'?tableFoot(o,f):''}</table></div><div class="mobile-items">${o.lines.map(l=>`<div class="itemcard">${itemLabel(l)}<dl><div><dt>Ordered</dt><dd>${pcs(l.q)}${S.lines==='kodi'?`<span class="sub">${l.q/20} kodi</span>`:''}</dd></div><div><dt>Received</dt><dd>${pcs(l.rec)}</dd></div></dl>${l.short?`<p class="sub">${pcs(l.short)} closed unfulfilled</p>`:''}<div class="returnrow" style="margin-top:14px"><span class="muted">${priceText(l,o,S.lines)}</span><span>${rp(l.q*l.price*o.pm)}</span></div></div>`).join('')}</div></section>`;}
function isReferenceLayout(){return ['k','l','m'].includes(summaryLayout);}
function receivingFacts(o,f){
 let extra=0,wrong=0,returned=0,returnOpen=0;
 o.lines.forEach(l=>{const w=Math.min(l.wrong||0,l.extra||0);wrong+=w;extra+=Math.max(0,(l.extra||0)-w);});
 returnOpen=extra+wrong;
 o.returns.forEach(r=>{let q=0;r.parts.forEach(p=>{q+=p[1];if(p[0]==='Item unknown')wrong+=p[1];else extra+=p[1];});if(r.state==='Confirmed')returned+=q;else returnOpen+=q;});
 return {extra,wrong,arrived:f.recd+extra+wrong,returnOpen,returned,shortfall:Math.max(0,f.pieces-f.recd-f.shortPcs)};
}
function ledgerRow(label,value,cls=''){return `<div class="ledger-row ${cls}"><span>${label}</span><span>${value}</span></div>`;}
function exceptionStates(o,f,r){const bits=[];
 if(o.life==='CANCELLED')bits.push({title:'Order cancelled',text:'No delivery expected',tone:'neutral'});
 else if(f.shortPcs)bits.push({title:`Closed short · ${pcs(f.shortPcs)}`,text:'No longer expected',tone:'neutral'});
 else if(r.shortfall>0)bits.push({title:`Short received · ${pcs(r.shortfall)}`,text:o.late?'Still expected · delivery overdue':'Still expected',tone:'amber'});
 else bits.push({title:'Order quantity fulfilled',text:`${pcs(f.recd)} accepted`,tone:'green'});
 if(r.returnOpen)bits.push({title:`To return · ${pcs(r.returnOpen)}`,text:[r.extra?`${pcs(r.extra)} extra`:'',r.wrong?`${pcs(r.wrong)} not as ordered`:''].filter(Boolean).join(' + '),tone:'amber',action:'returnDetails'});
 if(r.returned)bits.push({title:`Returned · ${pcs(r.returned)}`,text:'Handed back to supplier',tone:'green',action:'returnDetails'});
 return bits;
}
function referenceSummary(o,f){

 const subtotal=f.gross-closedGross;
 const discount=subtotal-f.grand;
 const quantities=ledgerRow('Total ordered',pcs(f.pieces))+ledgerRow('Total received',pcs(f.recd));
 const money=ledgerRow('Subtotal',rp(subtotal))+ledgerRow('Discount · 2.5%','−'+rp(discount))+ledgerRow('Grand total',rp(f.grand),'ledger-total');
 return `<section class="reference-summary" aria-label="Order summary"><div class="reference-columns"><div class="receiving-ledger" aria-label="Quantity totals">${quantities}</div><div class="money-ledger" aria-label="Order totals">${money}</div></div></section>`;
}

function audit(){return `<section class="audit" lang="id"><div class="eyebrow">Review UI, UX & microcopy</div><h1>Sudah rapi, belum selalu jelas.</h1><p class="intro">Masalah utamanya ada pada arti angka, status yang tumpang tindih, dan langkah berikutnya. P1 = berisiko salah keputusan; P2 = memperjelas penggunaan. Ini audit heuristik terhadap prototipe dan kode terkait, belum uji pengguna.</p><div class="notice"><div><h3>Prinsip rekomendasi</h3><p>Ordered = pesanan awal. Received = jumlah disetujui sesuai PO. Remaining = yang masih ditunggu. Hitungan baru dan retur selalu terpisah. Satu CTA utama hanya ketika ada tugas nyata.</p></div></div><div class="tablewrap" style="margin-top:20px"><table><thead><tr><th>Cabang</th><th>Risiko saat ini</th><th>Rekomendasi</th></tr></thead><tbody>${BR.map((b,i)=>`<tr><td><span class="severity">${UX[b.id][4]}</span><br><button class="linkbutton" data-branch="${b.id}">${String(i+1).padStart(2,'0')} · ${names[b.id]}</button></td><td>${UX[b.id][5]}</td><td>${UX[b.id][6]}</td></tr>`).join('')}</tbody></table></div><details class="disclosure" open style="margin-top:22px"><summary>Aturan, batasan, dan koreksi data contoh</summary><p>Harga dan data memakai fixture asli. Hitungan baru membandingkan sisa sebelum penerimaan: eligible = min(counted − not as ordered, remaining). Contoh count dengan pengecualian: 430 fisik → 388 sesuai PO + 30 ekstra + 12 tidak sesuai; sisa PO 12.</p><p>Retur “Generated” merujuk pada surat jalan menurut kode supplier-return-groups.tsx. “Confirmed” pada fixture ini memiliki aktivitas serah-terima, sehingga disebut “Handed over”. Jangan mengganti semua status Confirmed secara global tanpa memeriksa arti endpoint.</p><p>Fixture ret3 asli berisi retur 42 pcs tetapi riwayat fisik hanya 430 pcs. Proposal menambahkan 12 pcs ke catatan kedatangan Kaos, sehingga total fisik 442 = 400 diterima + 42 diretur. Ini koreksi data demonstrasi, bukan data produksi.</p><p>Mode Long content hanya menguji teks panjang dan nilai besar. Tidak menambahkan penerimaan palsu yang mengubah total. Varian warna/ukuran adalah jumlah pesanan; data penerimaan per varian tidak tersedia. Tidak menebak alokasinya.</p><p>Print tetap di footer. Cancel memakai Undo sesuai perilaku yang sudah ada. Recount cukup tercatat di riwayat, tanpa banner baru. Menutup sisa sementara ada count diblokir dalam proposal sampai review diselesaikan; aturan ini perlu diselaraskan di server jika diterapkan.</p><p>Tanggal acuan demo: 12 Oct 2026. Semua perubahan hanya simulasi lokal dalam memori dan kembali saat Reset scenario atau muat ulang. Belum mencakup permission pengguna, konflik data serentak, dan detail kegagalan API selain cabang offline/rejected.</p></details></section>`;}
function renderUX(){document.body.dataset.view=S.view;document.body.dataset.closed='false';document.querySelector('.desk-background').inert=true;let b=branch();$('#nav').innerHTML=groupNames.map((g,i)=>`<h3>${g}</h3>${BR.filter(b=>b.g===i).map(b=>`<button data-branch="${b.id}" class="${b.id===S.branch?'on':''}" ${b.id===S.branch?'aria-current="page"':''}><span class="idx">${String(BR.indexOf(b)+1).padStart(2,'0')}</span>${names[b.id]}</button>`).join('')}`).join('');$('#scenario').textContent=names[S.branch];$('#scenario-select').innerHTML=groupNames.map((g,i)=>`<optgroup label="${g}">${BR.filter(b=>b.g===i).map(b=>`<option value="${b.id}" ${b.id===S.branch?'selected':''}>${names[b.id]}</option>`).join('')}</optgroup>`).join('');$('#stage').className=S.dev==='phone'?'phone':'';$('#stage').innerHTML=S.view==='audit'?audit():renderSheet(getOrder());$('#note').innerHTML=S.view==='audit'?'':`<b>Catatan desain:</b> ${UX[S.branch][6]} ${S.branch==='offline'&&!localOrder?.demoSubmitted?'<button class="linkbutton" data-action="connect">Simulate reconnect →</button>':''}`;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view===S.view));document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('on',x.dataset.device===S.dev));$('#stress').setAttribute('aria-pressed',S.worst);$('#stress').style.background=S.worst?'#e9f0ff':'';$('#itemmode').value=S.lines;document.querySelector('[data-view="audit"]').textContent='Audit · '+BR.length+' branches';$('#layout-select').value=summaryLayout;history.replaceState(null,'','#'+S.branch+'/'+summaryLayout);}
function toast(message,undo=false){clearTimeout(toastTimer);$('#toast').className='toast';$('#toast').innerHTML=`<span>${esc(message)}</span>${undo?action('Undo','undo'):action('Dismiss','toastClose')}`;if(!undo)toastTimer=setTimeout(()=>{$('#toast').className='';$('#toast').innerHTML=''},6500);}
function closeDialog(){const d=$('#dialog');d.close();focusBeforeDialog?.focus();}
function dialog(title,body,footer){focusBeforeDialog=document.activeElement;$('#dialog').className=S.dev==='phone'?'dialog-phone':'';$('#dialog').innerHTML=`<div class="dialoghead"><h2 id="dialog-title">${title}</h2><button data-action="closeDialog" aria-label="Close dialog">×</button></div><div class="dialogbody">${body}<p id="dialog-error" class="error" role="alert"></p></div><div class="dialogfooter">${footer}</div>`;$('#dialog').showModal();}
function reviewCards(o,c){return `<div class="review-cards">${o.lines.map((l,i)=>{let r=c.rows[i];return `<div class="itemcard"><strong>${esc(l.name)}</strong><dl><div><dt>Remaining before review</dt><dd>${pcs(r.remaining)}</dd></div><div><dt>Counted this delivery</dt><dd>${pcs(r.count)}</dd></div><div><dt>Receive against PO</dt><dd>${pcs(r.accept)}</dd></div><div><dt>Remaining after review</dt><dd>${pcs(r.after)}</dd></div></dl>${r.extra?`<p class="exception">${pcs(r.extra)} extra → return</p>`:''}${r.wrong?`<p class="exception">${pcs(r.wrong)} not as ordered → return</p>`:''}</div>`}).join('')}</div>`;}
function openReview(){const o=getOrder(),c=countStats(o);dialog('Review warehouse count',`<p class="muted">${esc(o.countedBy||'Dedi Santoso')} · This delivery only. Review or request a recount before cancelling or closing the remainder.</p><div class="tablewrap review-table"><table><thead><tr><th>Item</th><th class="right">Remaining<br>before review</th><th class="right">Counted</th><th class="right">Receive<br>against PO</th></tr></thead><tbody>${o.lines.map((l,i)=>{const r=c.rows[i];return `<tr><td>${esc(l.name)}${r.extra?`<span class="sub ambertext">${pcs(r.extra)} extra → return</span>`:''}${r.wrong?`<span class="sub ambertext">${pcs(r.wrong)} not as ordered → return</span>`:''}</td><td class="right">${pcs(r.remaining)}</td><td class="right">${pcs(r.count)}</td><td class="right">${pcs(r.accept)}<span class="sub">${pcs(r.after)} remain</span></td></tr>`}).join('')}</tbody></table></div>${reviewCards(o,c)}<div class="notice"><div><h3>${pcs(c.accept)} will be received against this PO</h3><p>Total received becomes ${pcs(figures(o).recd+c.accept)}. ${pcs(c.after)} will still be expected.${c.extra+c.wrong?` ${pcs(c.extra+c.wrong)} will remain separate and need a return.`:''}</p></div></div>${c.extra+c.wrong?'<label class="check"><input type="checkbox" id="ack">I reviewed the extra and incorrect goods. They are excluded from the PO receipt.</label>':''}`,action('Back','closeDialog')+action('Request recount','requestRecount')+action(`Accept ${pcs(c.accept)}`,'acceptCount','primary'));}
function takeAction(id){const o=getOrder(),f=figures(o);
const secondary={
 layoutInfo:()=>['Opsi '+($('#layout-select').selectedIndex+1)+' · '+LAYOUTS[summaryLayout][0],`<p>${LAYOUTS[summaryLayout][1]}</p><p>${LAYOUTS[summaryLayout][2]}</p>`],
 moneyDetails:()=>['Order value breakdown',moneyDetails(o,f)],
 termsDetails:()=>['Payment & delivery terms',`<dl class="facts"><div><dt>Payment terms</dt><dd>${o.terms}</dd></div><div><dt>Payment method</dt><dd>${o.method}</dd></div></dl><p>Receive goods Monday–Saturday, 08:00–15:00. Break: 12:00–13:00; Friday: 11:30–13:00.</p>${o.notes?`<p>${esc(o.notes)}</p>`:''}`],
 deliveryDetails:()=>['Delivery history',receivingHistory(o).replace('<details class="disclosure">','<details class="disclosure" open>')],
 activityDetails:()=>['Order activity',activities(o).replace('<details class="disclosure" >','<details class="disclosure" open>')],
 returnDetails:()=>['Supplier return',returnSectionUX(o,f)],
 contextDetails:()=>['Order status',notice(o,f)],
 quantityDetails:()=>['What the quantities mean','<p><strong>Ordered</strong> is the original order quantity.</p><p><strong>Received</strong> is the quantity accepted against this PO. It excludes unreviewed counts, extra goods and goods not as ordered.</p><p><strong>Remaining</strong> is still expected, before any new count is accepted. Closed unfulfilled quantities are no longer expected. For a cancelled order, Remaining is not applicable.</p>']
};
if(secondary[id]){const [title,body]=secondary[id]();dialog(title,body,action('Done','closeDialog','primary'));return;}
if(id==='closeDialog'){closeDialog();return;}if(id==='toastClose'){$('#toast').className='';$('#toast').innerHTML='';return;}if(id==='review'){openReview();return;}if(id==='acceptCount'){const c=countStats(o);if(c.extra+c.wrong&&!$('#ack').checked){$('#dialog-error').textContent='Confirm that you reviewed the extra and incorrect goods.';return;}localOrder=structuredClone(o);localOrder.lines.forEach((l,i)=>{l.rec+=c.rows[i].accept;l.extra=c.rows[i].extra+c.rows[i].wrong;l.rc.push({d:'12 Oct 2026',g:'GRN-HO-GUDANG-000023',q:c.rows[i].count});l.cnt=null;});localOrder.life=c.after?'PART':'FULL';localOrder.countedBy=null;localOrder.demoStatus=c.after?'Partially received':'Fully received';localOrder.demoMessage=['Count accepted',`${pcs(c.accept)} received against the PO. ${pcs(c.after)} still expected.${c.extra+c.wrong?` ${pcs(c.extra+c.wrong)} need a return.`:''}`];localOrder.activity.unshift(`Accepted ${pcs(c.accept)} against the PO.`);closeDialog();renderUX();toast('Count accepted in this prototype.');return;}
if(id==='requestRecount'){dialog('Request a recount',`<p>The current count will no longer be available to accept. Received quantities will stay unchanged.</p><label class="formfield">What should the warehouse check?<textarea id="reason" placeholder="e.g. Please verify the 12 incorrect items."></textarea></label>`,action('Back','review')+action('Send recount request','confirmRecount','primary'));return;}
if(id==='confirmRecount'){const reason=$('#reason').value.trim();if(!reason){$('#dialog-error').textContent='Add a note so the warehouse knows what to check.';return;}localOrder=structuredClone(o);localOrder.lines.forEach(l=>l.cnt=null);localOrder.countedBy=null;localOrder.demoMessage=['Recount requested','Waiting for the warehouse to submit an updated count. Received quantities are unchanged.'];localOrder.activity.unshift('Recount requested: '+reason);closeDialog();renderUX();toast('Recount requested in this prototype.');return;}
if(id==='cancel'){undoOrder=structuredClone(o);localOrder=structuredClone(o);localOrder.life='CANCELLED';localOrder.demoStatus='Cancelled';localOrder.demoMessage=['This order was cancelled','No deliveries are expected. Use Undo to restore this order.'];localOrder.activity.unshift('Rina Kusuma cancelled this order.');renderUX();toast('Order cancelled in this prototype.',true);return;}
if(id==='undo'){localOrder=undoOrder;undoOrder=null;renderUX();toast('Order restored.');return;}
if(id==='closeShort'){dialog(`Close remaining ${pcs(f.owed)}?`,`<p>${pcs(f.recd)} already received will stay recorded. The remaining ${pcs(f.owed)} will no longer be expected. This cannot be undone.</p><label class="formfield">Reason <span class="muted">(optional)</span><textarea id="reason" placeholder="e.g. Supplier is out of stock"></textarea></label>`,action('Keep order open','closeDialog')+action(`Close ${pcs(f.owed)} unfulfilled`,'confirmShort','primary danger'));return;}
if(id==='confirmShort'){localOrder=structuredClone(o);localOrder.reason=$('#reason').value.trim()||'No reason recorded';localOrder.closedBy='Rina Kusuma · 12 Oct 2026';localOrder.lines.forEach(l=>l.short=l.q-l.rec);localOrder.life='SHORT';localOrder.demoStatus=`Closed with ${pcs(f.owed)} unfulfilled`;localOrder.demoMessage=['Order closed with unfulfilled items',`${pcs(f.recd)} received. ${pcs(f.owed)} closed unfulfilled. No more deliveries are expected.`];localOrder.activity.unshift(`Closed ${pcs(f.owed)} unfulfilled. Reason: ${localOrder.reason}`);closeDialog();renderUX();toast('Remaining quantities closed in this prototype.');return;}
if(id==='createReturn'){dialog('Create a supplier return',`<p>Return ${pcs(f.extra)} to ${esc(o.sup)}. These goods are separate from the received order quantities.</p>${o.lines.filter(l=>l.extra).map(l=>`<div class="returnrow"><span>${l.wrong?'Not as ordered / extra goods linked to '+esc(l.name):esc(l.name)}</span><strong>${pcs(l.extra)}</strong></div>`).join('')}<p class="muted">Next: generate a return slip, then let the warehouse record the handover.</p>`,action('Back','closeDialog')+action('Create return','confirmReturn','primary'));return;}
if(id==='confirmReturn'){localOrder=structuredClone(o);localOrder.returns=[{no:'RS-00000005',state:'Not Generated',parts:localOrder.lines.flatMap(l=>{const wrong=Math.min(l.wrong,l.extra),extra=l.extra-wrong;return [...(extra?[[l.name,extra,extra*l.price]]:[]),...(wrong?[['Item unknown',wrong,null]]:[])]})}];localOrder.lines.forEach(l=>l.extra=0);localOrder.demoMessage=['Return created · slip needed','Generate the return slip before the warehouse hands the goods to the supplier.'];localOrder.activity.unshift('Created return RS-00000005.');closeDialog();renderUX();toast('Return created in this prototype.');return;}
if(id==='generateReturn'){localOrder=structuredClone(o);localOrder.returns[0].state='Generated';localOrder.demoMessage=['Return slip ready','Waiting for the warehouse to hand over the goods and record the handover.'];localOrder.activity.unshift('Generated the return slip.');renderUX();toast('Return slip generated in this prototype.');return;}
if(id==='viewReturn'){const r=o.returns[0];dialog(r.state==='Confirmed'?'Return handed over':'Return slip',`<div class="eyebrow">${r.no} · ${esc(o.sup)}</div><h2>${r.state==='Confirmed'?'Goods handed back to supplier':'Awaiting warehouse handover'}</h2>${r.parts.map(p=>`<div class="returnrow"><span>${p[0]==='Item unknown'?'Unidentified item':esc(p[0])}</span><strong>${pcs(p[1])}</strong></div>`).join('')}<p class="muted">${r.state==='Confirmed'?'Recorded by the warehouse · 11 Oct 2026':'The warehouse records handover after the goods leave. Generating this slip does not complete the return.'}</p>`,action('Done','closeDialog','primary'));return;}
if(id==='edit'){dialog(branch().held==='refused'?'Fix order':'Edit order',`<p class="muted">${branch().held==='refused'?'Set the missing supplier catalogue price before resubmitting.':'Change the expected delivery date. Order quantities stay unchanged in this focused prototype.'}</p><label class="formfield">Expected delivery<input id="delivery" type="date" value="2026-10-14"></label>${branch().held==='refused'?'<label class="formfield">Catalogue price · Celana Chino Slim (Rp / pc)<input type="number" id="price" min="1" placeholder="Enter catalogue price"></label>':''}`,action('Back','closeDialog')+action(branch().held==='refused'?'Save & resubmit':'Save changes','saveEdit','primary'));return;}
if(id==='saveEdit'){if(!$('#delivery').value){$('#dialog-error').textContent='Choose an expected delivery date.';return;}if($('#price')&&Number($('#price').value)<=0){$('#dialog-error').textContent='Enter a catalogue price greater than zero.';return;}localOrder=structuredClone(o);localOrder.deliv=new Date($('#delivery').value+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});localOrder.late=$('#delivery').value<'2026-10-12';localOrder.overdueDays=Math.max(0,Math.round((new Date('2026-10-12T12:00:00')-new Date($('#delivery').value+'T12:00:00'))/86400000));localOrder.suppressNotice=true;if(localOrder.late)localOrder.demoMessage=[`Delivery is ${localOrder.overdueDays} days overdue`,`${pcs(f.owed)} are still expected. Check the schedule with the supplier.`];if($('#price')){localOrder.lines[2].price=Number($('#price').value);localOrder.lines[2].kodiPrice=localOrder.lines[2].price*20;localOrder.demoSubmitted=true;localOrder.demoStatus='Awaiting delivery';localOrder.demoMessage=['Order submitted','The server accepted this order. Awaiting delivery from the supplier.'];}localOrder.activity.unshift('Expected delivery updated to '+localOrder.deliv);closeDialog();renderUX();toast('Changes saved in this prototype.');return;}
if(id==='connect'){localOrder=structuredClone(o);localOrder.demoSubmitted=true;localOrder.demoStatus='Awaiting delivery';localOrder.demoMessage=['Order submitted','Connection restored. The queued order was submitted automatically.'];localOrder.activity=['created'];renderUX();toast('Reconnect simulated · order submitted.');return;}
if(id==='delete'){dialog('Delete this local draft?',`<p>This draft has not been submitted. Deleting it removes the saved order from this device.</p>`,action('Keep draft','closeDialog')+action('Delete draft','confirmDelete','primary danger'));return;}
if(id==='confirmDelete'){closeDialog();$('#stage').innerHTML='<div class="sheet empty"><h1>Draft deleted</h1><p class="muted">The local draft was removed in this simulation.</p>'+action('Restore scenario','restore','primary')+'</div>';return;}
if(id==='dismiss'){$('#stage').innerHTML='';document.body.dataset.closed='true';document.querySelector('.desk-background').inert=false;document.querySelector('.reopen-order').focus();return;}
if(id==='restore'){renderUX();return;}if(id==='print'){dialog('Print preview',`<p>${o.po} · ${esc(o.sup)}</p><p>${pcs(f.pieces)} ordered · ${pcs(f.recd)} received</p><p>Order value: <strong>${rp(f.grand)}</strong></p><p class="muted">Use your browser’s Print command to print this prototype. The page includes a print layout.</p>`,action('Done','closeDialog','primary'));return;}}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.summaryTab){summaryTab=t.dataset.summaryTab;renderUX();document.querySelector('#tab-'+summaryTab)?.focus();}else if(t.dataset.branch){S.branch=t.dataset.branch;S.view='sheet';localOrder=null;undoOrder=null;$('#toast').className='';$('#toast').innerHTML='';renderUX();}else if(t.dataset.view){document.querySelector('.preview-settings').open=false;S.view=t.dataset.view;renderUX();}else if(t.dataset.device){S.dev=t.dataset.device;renderUX();}else if(t.id==='stress'){S.worst=!S.worst;localOrder=null;renderUX();}else if(t.id==='reset'){localOrder=null;undoOrder=null;renderUX();toast('Scenario reset.');}else if(t.dataset.action)takeAction(t.dataset.action);});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-summary-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();summaryTab=e.key==='Home'?'quantity':e.key==='End'?'value':summaryTab==='quantity'?'value':'quantity';renderUX();document.querySelector('#tab-'+summaryTab).focus()}});
$('#layout-select').addEventListener('change',e=>{summaryLayout=e.target.value;summaryTab='quantity';document.querySelector('.preview-settings').open=false;renderUX()});
$('#scenario-select').addEventListener('change',e=>{document.querySelector('.preview-settings').open=false;S.branch=e.target.value;S.view='sheet';localOrder=null;renderUX()});
$('#itemmode').addEventListener('change',e=>{S.lines=e.target.value;renderUX()});
function loadHash(){let parts=location.hash.slice(1).split('/'),h=parts[0];if(BR.some(b=>b.id===h))S.branch=h;summaryLayout='k';localOrder=null;renderUX();}
window.addEventListener('hashchange',loadHash);loadHash();
</script></body></html>
