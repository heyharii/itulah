<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketing labels</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* frontend-hub tokens, All white look (styles/white.css) */
:root {
  --ink: #1d1d1f;
  --body: #6e6e73;
  --faint: #c7c7cc;
  --canvas: #ffffff;
  --soft: #fafafb;
  --soft-2: #f2f2f5;
  --soft-3: #f5f5f7;
  --hairline: #e8e8ec;
  --hairline-2: #dcdce1;
  --accent: #2862dc;
  --accent-bg: #eef3fc;
  --warn-fg: #a66c1f;
  --warn-bg: #fbf1e1;
  --bad-fg: #d70015;
  --good: #2f9e55;
  --r-inner: 8px;
  --r-card: 10px;
  --r-sheet: 16px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --font: "Inter Variable", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 22px;
  color: var(--ink);
  background: var(--soft-3);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { font: inherit; }

.board { max-width: 1180px; margin: 0 auto; padding: 32px 24px 120px; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.head h1 { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
.head .figs { display: flex; gap: 28px; }
.fig .l { color: var(--body); }
.fig .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* tabs (SubTabs) */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--hairline); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; padding: 10px 0 12px; color: var(--body); font-weight: 500; white-space: nowrap; }
.tab .n { margin-left: 6px; color: var(--body); font-weight: 400; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }

.bar[hidden] { display: none; }
.bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: var(--r-inner); background: var(--soft-2); }
.seg button { height: 30px; padding: 0 12px; border-radius: 6px; color: var(--body); font-weight: 500; transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out); }
.seg button[aria-pressed="true"] { background: var(--canvas); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 8%), 0 0 0 1px rgb(0 0 0 / 4%); }
.legend { margin-left: auto; color: var(--body); }
.legend b { color: var(--accent); font-weight: 600; }

.card { background: var(--canvas); border-radius: var(--r-card); box-shadow: 0 0 0 1px rgb(0 0 0 / 5%); overflow: clip; margin-bottom: 16px; }
.card h2 { padding: 14px 20px; font-weight: 600; border-bottom: 1px solid var(--hairline); background: var(--soft); }

table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { text-align: left; font-weight: 500; color: var(--body); padding: 10px 20px; border-bottom: 1px solid var(--hairline); }
td { padding: 12px 20px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
col.c-kind { width: 13%; }
col.c-now { width: 22%; }
col.c-shows { width: 29%; }
.kind { color: var(--body); }
.now { font-weight: 500; }
.now.fine { font-weight: 400; color: var(--body); }
.shows { color: var(--body); }
.note { display: block; margin-top: 4px; color: var(--warn-fg); }

.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 11px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--hairline-2); color: var(--ink); text-align: left; transition: box-shadow 160ms var(--ease-out), background-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 120ms var(--ease-out); }
.opt:active { transform: scale(0.97); }
.opt .star { color: var(--accent); font-size: 13px; line-height: 1; }
.opt.keep { color: var(--body); }
.opt[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: none; }
.opt[aria-pressed="true"] .star { color: #fff; }
@media (hover: hover) { .opt:hover:not([aria-pressed="true"]) { box-shadow: inset 0 0 0 1px var(--faint); background: var(--soft); } }
.ok { color: var(--good); }

/* glossary */
.gl td.word { font-weight: 600; }
.gl .old { color: var(--body); text-decoration: line-through; text-decoration-color: var(--faint); }

/* foot */
.foot { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; border-radius: 999px; background: var(--ink); color: #fff; box-shadow: 0 12px 32px rgb(0 0 0 / 22%); }
.foot[hidden] { display: none; }
.foot .count { font-variant-numeric: tabular-nums; white-space: nowrap; }
.foot button { height: 36px; padding: 0 16px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 500; white-space: nowrap; }
.foot button.ghost { background: rgb(255 255 255 / 12%); }

@media (max-width: 760px) {
  .board { padding: 20px 16px 120px; }
  .head .figs { gap: 20px; }
  .legend { margin-left: 0; width: 100%; }
  table, tbody, tr, td { display: block; width: 100%; }
  thead, colgroup { display: none; }
  tr { padding: 14px 16px; border-bottom: 1px solid var(--hairline); }
  tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; }
  td.kind { margin-bottom: 2px; }
  td.shows { margin: 2px 0 10px; }
  .card h2 { padding: 12px 16px; }
  .gl td[data-l] { margin-top: 6px; }
  .gl td[data-l]::before { content: attr(data-l); display: block; color: var(--ink); font-weight: 500; }
}
@media (prefers-reduced-motion: reduce) { .opt, .seg button { transition: none; } .opt:active { transform: none; } }
</style>
</head>
<body>
<div class="board">
  <div class="head">
    <h1>Marketing labels</h1>
    <div class="figs">
      <div class="fig"><div class="l">Labels</div><div class="v" id="f-all">—</div></div>
      <div class="fig"><div class="l">To rename</div><div class="v" id="f-ren">—</div></div>
      <div class="fig"><div class="l">Picked</div><div class="v" id="f-pick">0</div></div>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="bar">
    <div class="seg" id="view">
      <button data-v="rename" aria-pressed="true">To rename</button>
      <button data-v="all" aria-pressed="false">All labels</button>
    </div>
    <div class="legend"><b>★</b> my pick · tap an option to choose it</div>
  </div>
  <div id="out"></div>
</div>
<div class="foot" id="foot" hidden>
  <span class="count" id="foot-n">0 picked</span>
  <button class="ghost" id="clear">Clear</button>
  <button id="copy">Copy picks</button>
</div>

/* ---------- picks ---------- */
const KEY = "marketing-copy-picks-v2";
let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { picks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} };

let screen = "promotions";
let view = "rename";
try { const s = localStorage.getItem(KEY + ":tab"); if (s && SCREENS.some(x => x.id === s)) screen = s; } catch (e) {}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]).replace(/Rp /g, "Rp&nbsp;");
const options = (row) => row.slice(3).filter(o => !o.startsWith("!") && o !== row[1]);
const notes = (row) => row.slice(3).filter(o => o.startsWith("!")).map(o => o.slice(1));
const toRename = (row) => row.length > 3;
const idOf = (s, g, i) => `${s}|${g}|${i}`;

function counts(sc) {
  let all = 0, ren = 0;
  for (const g of sc.groups || []) for (const r of g.rows) { all++; if (toRename(r)) ren++; }
  return { all, ren };
}

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = SCREENS.map(sc => {
    const n = sc.glossary ? sc.glossary.length : counts(sc).ren;
    return `<button class="tab" role="tab" data-s="${sc.id}" aria-selected="${sc.id === screen}">${esc(sc.title)}<span class="n">${n}</span></button>`;
  }).join("");
}

function renderFigures() {
  let all = 0, ren = 0;
  for (const sc of SCREENS) { const c = counts(sc); all += c.all; ren += c.ren; }
  document.getElementById("f-all").textContent = all.toLocaleString("id-ID");
  document.getElementById("f-ren").textContent = ren.toLocaleString("id-ID");
  const n = Object.keys(picks).length;
  document.getElementById("f-pick").textContent = n.toLocaleString("id-ID");
  document.getElementById("foot").hidden = n === 0;
  document.getElementById("foot-n").textContent = `${n} picked`;
}

function finalOf(row) { return options(row)[0] ?? row[1]; }
const clean = (t) => t.replace(/\s*\(\d+\)$/, "").replace(/\s*\d+\s*\/\s*\d+$/, "").replace(/:$/, "").trim().toLowerCase();
function landsIn(word) {
  const wanted = word.split(" · ").map(w => w.toLowerCase());
  const hits = [];
  for (const sc of SCREENS) {
    if (!sc.groups) continue;
    const found = sc.groups.some(g => g.rows.some(r => finalOf(r).split(" · ").map(clean).some(x => wanted.includes(x))));
    if (found) hits.push(sc.title);
  }
  return hits.join(" · ") || "—";
}
function renderGlossary(sc) {
  return `<div class="card gl"><table>
    <colgroup><col style="width:19%"><col style="width:25%"><col style="width:22%"><col style="width:20%"><col></colgroup>
    <thead><tr><th>One word</th><th>Instead of</th><th>Means</th><th>In Marketing</th><th>Hub already says it</th></tr></thead>
    <tbody>${sc.glossary.map(([w, old, m, hub]) => `<tr><td class="word">${esc(w)}</td><td data-l="Instead of"><span class="old">${esc(old)}</span></td><td class="shows" data-l="Means">${esc(m)}</td><td class="shows" data-l="In Marketing">${esc(landsIn(w))}</td><td class="shows" data-l="Hub already says it">${esc(hub || "—")}</td></tr>`).join("")}</tbody>
  </table></div>`;
}

function renderRows(sc) {
  return sc.groups.map((g, gi) => {
    const rows = g.rows.map((r, i) => ({ r, i })).filter(({ r }) => view === "all" || toRename(r));
    if (rows.length === 0) return "";
    return `<div class="card"><h2>${esc(g.name)}</h2><table>
      <colgroup><col class="c-kind"><col class="c-now"><col class="c-shows"><col></colgroup>
      <thead><tr><th>Kind</th><th>Today</th><th>Shows</th><th>Options</th></tr></thead>
      <tbody>${rows.map(({ r, i }) => {
        const id = idOf(sc.id, gi, i);
        const opts = options(r);
        const picked = picks[id]?.to;
        const chips = opts.length === 0 ? (notes(r).length ? "" : `<span class="ok">Fine</span>`) : [
          ...opts.map((o, k) => `<button class="opt" data-id="${esc(id)}" data-to="${esc(o)}" aria-pressed="${picked === o}">${k === 0 ? '<span class="star">★</span>' : ""}${esc(o)}</button>`),
          `<button class="opt keep" data-id="${esc(id)}" data-to="__keep" aria-pressed="${picked === "__keep"}">Keep</button>`,
        ].join("");
        return `<tr>
          <td class="kind">${esc(r[0])}</td>
          <td class="now ${toRename(r) ? "" : "fine"}">${esc(r[1])}</td>
          <td class="shows">${esc(r[2])}${notes(r).map(n => `<span class="note">${esc(n)}</span>`).join("")}</td>
          <td><div class="opts">${chips}</div></td>
        </tr>`;
      }).join("")}</tbody></table></div>`;
  }).join("") || `<div class="card"><h2>Nothing to rename here</h2></div>`;
}

function render() {
  renderTabs();
  renderFigures();
  const sc = SCREENS.find(x => x.id === screen);
  document.querySelector(".bar").hidden = !!sc.glossary;
  document.getElementById("out").innerHTML = sc.glossary ? renderGlossary(sc) : renderRows(sc);
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  screen = b.dataset.s; try { localStorage.setItem(KEY + ":tab", screen); } catch (err) {}
  render(); window.scrollTo({ top: 0 });
});
document.getElementById("view").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  for (const x of document.querySelectorAll("#view button")) x.setAttribute("aria-pressed", String(x === b));
  render();
});
document.getElementById("out").addEventListener("click", (e) => {
  const b = e.target.closest(".opt"); if (!b) return;
  const id = b.dataset.id, to = b.dataset.to;
  if (picks[id]?.to === to) delete picks[id];
  else {
    const [s, g, i] = id.split("|");
    const sc = SCREENS.find(x => x.id === s); const grp = sc.groups[+g]; const row = grp.rows[+i];
    picks[id] = { to, where: `${sc.title} › ${grp.name} › ${row[0]}`, now: row[1] };
  }
  save();
  for (const x of document.querySelectorAll(`.opt[data-id="${CSS.escape(id)}"]`)) x.setAttribute("aria-pressed", String(picks[id]?.to === x.dataset.to));
  renderFigures();
});
document.getElementById("clear").addEventListener("click", () => { picks = {}; save(); render(); });
document.getElementById("copy").addEventListener("click", async () => {
  const lines = Object.values(picks).map(p => p.to === "__keep" ? `${p.where}: ${p.now} — keep` : `${p.where}: ${p.now} → ${p.to}`);
  const text = lines.join("\n");
  const btn = document.getElementById("copy");
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (err) {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); btn.textContent = "Copied"; } catch (e2) { btn.textContent = "Copy failed"; }
    t.remove();
  }
  setTimeout(() => { btn.textContent = "Copy picks"; }, 1400);
});
render();
</script>
