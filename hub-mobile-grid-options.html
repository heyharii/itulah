<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Mobile Grid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="frontend-hub/design-system/tokens.css">
<link rel="stylesheet" href="frontend-hub/design-system/bundle.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Central tokens come from tokens.css; the few below are the hub's own
   (white.css / index.css) that the tile and the press need. */
:root{--t-press:120ms;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter Variable",Inter,system-ui,sans-serif;background:var(--stone);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}

/* the switch above the phone (not part of the design) */
.ctl{position:relative;z-index:20;background:var(--stone);padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;background:var(--soft-2);border-radius:9px;padding:2px}
.seg button{padding:6px 12px;border-radius:7px;font-weight:500;color:var(--mute);font-size:15px}
.seg button[aria-pressed=true]{background:var(--canvas);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/8%)}
.row-ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.stage{display:flex;justify-content:center;padding:8px 16px 48px}
.phone{position:relative;width:414px;height:896px;background:var(--canvas);border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #111,0 30px 60px rgb(0 0 0/16%);display:flex;flex-direction:column}
.phone.w375{width:375px;height:812px}
.status{height:47px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-weight:600}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px var(--phone-gutter,16px) 24px}
.scroll::-webkit-scrollbar{display:none}

/* greeting — AppLauncher */
.date{font-weight:500;color:var(--mute)}
.hello{font-size:28px;line-height:1.12;font-weight:600;letter-spacing:-.025em;margin-top:2px}

/* a section head with its count at the right end (SubHead aside) */
.sub{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin:24px 4px 10px}
.sub .aside{font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.sub a{font-weight:500;color:var(--accent);text-decoration:none}

/* the department tile — AppIcon (.app-icon) */
.tile{display:grid;place-items:center;color:#fff;flex:none;position:relative;
  background:linear-gradient(180deg,rgb(255 255 255/.2),rgb(255 255 255/0) 58%),var(--tile,var(--app-system));
  box-shadow:0 1px 2px rgb(24 39 60/12%),inset 0 0 0 .5px rgb(0 0 0/6%);transition:transform var(--t-press) var(--ease-out)}
.tile svg{stroke-width:1.9}
.tile.lg{width:56px;height:56px;border-radius:16px}.tile.lg svg{width:26px;height:26px}
.tile.md{width:36px;height:36px;border-radius:10px}.tile.md svg{width:18px;height:18px}
.tile.sm{width:32px;height:32px;border-radius:10px}.tile.sm svg{width:17px;height:17px}
.dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--bad-fg);box-shadow:0 0 0 2px var(--canvas)}

/* CountBadge */
.count{min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bad-fg);color:var(--on-dark);font-size:15px;font-weight:600;line-height:20px;text-align:center;font-variant-numeric:tabular-nums;flex:none}

/* the grid of apps */
.grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);row-gap:20px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.app:active .tile{transform:scale(.92)}
.app .name{font-weight:500;line-height:1.2;white-space:nowrap;letter-spacing:-.015em}
.cols3 .grid{--cols:3}

/* framed list — rows are not boxes */
.list{border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;width:100%;transition:background var(--t-press)}
.li+.li{border-top:1px solid var(--row-line)}
.li:active{background:var(--soft)}
.li .w{flex:1;min-width:0;font-weight:500}
.li .w small{display:block;font-size:15px;font-weight:400;color:var(--mute)}
.chev{width:16px;height:16px;color:var(--line-ico);flex:none}

/* B — figure cards */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{border:1px solid var(--hairline);border-radius:var(--r-card);padding:14px;display:flex;flex-direction:column;gap:2px;transition:transform var(--t-press) var(--ease-out)}
.fc:active{transform:scale(.97)}
.fc .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.fc .fig{font-size:24px;line-height:30px;font-weight:600;font-variant-numeric:tabular-nums}
.fc .what{color:var(--mute);line-height:1.3}

/* C/D — PhoneCards */
.cards{display:flex;flex-direction:column;gap:10px}
.pc{border:1px solid var(--hairline);border-radius:var(--r-card);transition:transform var(--t-press) var(--ease-out);display:block;width:100%}
.pc:active{transform:scale(.985)}
.pc .top{display:flex;justify-content:space-between;gap:12px;padding:14px 16px}
.pc .nm{font-size:16px;line-height:20px;font-weight:600;letter-spacing:-.16px}
.pc .ln{color:var(--mute);line-height:20px}
.pc .lead{font-size:24px;line-height:30px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 16px;border-top:1px solid var(--row-line);color:var(--mute)}
.who{display:flex;align-items:center;gap:8px}
.st{display:inline-flex;align-items:center;gap:6px;color:var(--warn-fg)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.btn{height:32px;padding:0 14px;border-radius:var(--r-inner);background:var(--cta);color:#fff;font-weight:500;flex:none}
.more{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;font-weight:500;color:var(--accent);width:100%}

/* D — one up next */
.next{border:1px solid var(--hairline);border-radius:var(--r-card)}
.next .top{padding:16px;display:flex;gap:12px;align-items:flex-start}
.next .nm{font-size:16px;font-weight:600;line-height:20px}
.next .ln{color:var(--mute)}
.next .foot{display:flex;gap:8px;padding:0 16px 16px}
.next .foot .btn{flex:1;height:44px}
.next .foot .ghost{flex:1;height:44px;border-radius:var(--r-inner);border:1px solid var(--hairline-2);font-weight:500;text-align:center}
.after{margin-top:2px}
.after .li{min-height:48px;padding:0 4px;border-top:1px solid var(--row-line)}
.after .li:first-child{border-top:0}

/* empty */
.calm{display:flex;align-items:center;gap:10px;color:var(--mute);padding:4px}
.calm svg{width:20px;height:20px;color:var(--ok-fg)}

/* the dock — Home tab, search capsule, account orb */
.dock{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + 26px);border-top:1px solid var(--hairline);background:var(--canvas)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500;color:var(--accent);width:64px;flex:none}
.tab svg{width:24px;height:24px}
.search{flex:1;height:44px;border-radius:999px;background:var(--soft-2);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mute)}
.search svg{width:18px;height:18px}
.orb{width:44px;height:44px;border-radius:50%;background:var(--soft-2);display:grid;place-items:center;font-weight:600;flex:none;position:relative}
/* colour levels — how much hue the Home carries */
.t-plain .list .tile,.t-glyph .list .tile,.t-grey .list .tile,.t-calm .list .tile{display:none}
.t-plain .list .li,.t-glyph .list .li,.t-grey .list .li,.t-calm .list .li{min-height:52px}
.t-glyph .grid .tile{background:var(--soft-3);color:var(--tile);box-shadow:none}
.t-grey .grid .tile,.t-calm .grid .tile{background:var(--soft-2);color:var(--ink);box-shadow:none}
.t-calm .grid .dot{display:none}
.t-calm .list .count{background:none;color:var(--ink);padding:0;font-weight:600}
/* icon styles — the grid's art */
.art{position:relative;width:60px;height:60px;display:grid;place-items:center;flex:none;transition:transform var(--t-press) var(--ease-out)}
.app:active .art{transform:scale(.92)}
.art .bgd{position:absolute;inset:0;border-radius:18px;background:color-mix(in srgb,var(--tile) 12%,white)}
.art svg{position:relative;width:30px;height:30px;color:color-mix(in srgb,var(--tile) 85%,black);fill:color-mix(in srgb,var(--tile) 24%,white);stroke-width:1.8}
.art img{position:relative;display:block}
.i-gojek .art img{width:54px;height:54px;transform:translate(5px,-7px);filter:drop-shadow(0 3px 4px rgb(24 39 60/16%))}
.i-float .art .bgd{display:none}
.i-float .art img{width:54px;height:54px;filter:drop-shadow(0 6px 6px rgb(24 39 60/14%))}
.i-flat .art .bgd{background:var(--soft-3)}
.i-flat .art img{width:34px;height:34px}
.tag{position:absolute;top:-9px;left:-10px;height:22px;padding:0 7px;border-radius:8px 8px 8px 2px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;line-height:22px;font-variant-numeric:tabular-nums;z-index:1;box-shadow:0 0 0 2px var(--canvas)}
.i-hue .grid,.i-pop .grid,.i-duo .grid,.i-gojek .grid,.i-float .grid,.i-flat .grid{row-gap:22px}
/* Hub colour — our own pictures, drawn in each department's hue (three tones) */
.hz{position:relative;width:60px;height:60px;flex:none;transition:transform var(--t-press) var(--ease-out)}
.app:active .hz{transform:scale(.92)}
.hz .bgd{position:absolute;inset:0;border-radius:18px;background:color-mix(in srgb,var(--c) 17%,white)}
.hz svg{position:absolute;left:7px;top:7px;width:46px;height:46px;overflow:visible;filter:drop-shadow(0 2px 2px color-mix(in srgb,var(--c) 30%,transparent))}
.i-pop .hz svg{left:11px;top:-3px;width:50px;height:50px}
.hz .b{fill:var(--c)}
.hz .d{fill:color-mix(in srgb,var(--c) 68%,black)}
.hz .l{fill:color-mix(in srgb,var(--c) 42%,white)}
.hz .w{fill:#fff}
.hz .sd{fill:none;stroke:color-mix(in srgb,var(--c) 68%,black);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.hz .sl{fill:none;stroke:color-mix(in srgb,var(--c) 42%,white);stroke-width:3.2;stroke-linecap:round}
.hz .sw{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:2.4;stroke-linecap:round}
.hz .hl{fill:#fff;fill-opacity:.28}
.tag.red{background:var(--bad-fg)}
.tag.red::after{content:"";position:absolute;left:0;bottom:-5px;border-left:7px solid var(--bad-fg);border-bottom:6px solid transparent}
.tag.red{border-radius:8px 8px 8px 0;box-shadow:none}
/* Gloss — the same pictures with light falling from the top */
.i-gloss .hz .b,.i-plinth .hz .b{fill:var(--gb)}
.i-gloss .hz .d,.i-plinth .hz .d{fill:var(--gd)}
.i-gloss .hz .l,.i-plinth .hz .l{fill:var(--gl)}
.i-gloss .hz .b[stroke],.i-plinth .hz .b[stroke]{stroke:var(--gb)}
.i-gloss .hz .d[stroke],.i-plinth .hz .d[stroke]{stroke:var(--gd)}
.i-gloss .hz .bgd{background:linear-gradient(165deg,color-mix(in srgb,var(--c) 7%,white),color-mix(in srgb,var(--c) 24%,white));box-shadow:inset 0 1px 0 #fff,inset 0 -3px 6px color-mix(in srgb,var(--c) 14%,transparent)}
.i-gloss .hz svg{filter:drop-shadow(0 3px 3px color-mix(in srgb,var(--c) 38%,transparent))}
/* Plinth — the object stands on a pastel step, bigger than its tile */
.i-plinth .hz .bgd{top:auto;bottom:0;height:28px;left:1px;right:1px;border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,white),color-mix(in srgb,var(--c) 16%,white))}
.i-plinth .hz svg{left:5px;top:-4px;width:50px;height:50px;filter:drop-shadow(0 4px 3px color-mix(in srgb,var(--c) 40%,transparent))}
/* Sticker — a white die-cut edge, set a little crooked */
.i-sticker .hz svg{left:8px;top:8px;width:44px;height:44px;filter:drop-shadow(1.7px 0 0 #fff) drop-shadow(-1.7px 0 0 #fff) drop-shadow(0 1.7px 0 #fff) drop-shadow(0 -1.7px 0 #fff) drop-shadow(0 3px 3px rgb(24 39 60/.2));transform:rotate(-7deg)}
.i-sticker .app:nth-child(2n) .hz svg{transform:rotate(6deg)}
.i-sticker .app:nth-child(3n) .hz svg{transform:rotate(-3deg)}
.i-sticker .hz .bgd{background:color-mix(in srgb,var(--c) 20%,white)}
/* Solid — the hue fills the tile and the picture is drawn in its light */
.i-solid .hz .bgd{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,white),var(--c) 70%);box-shadow:0 2px 4px color-mix(in srgb,var(--c) 35%,transparent),inset 0 1px 0 rgb(255 255 255/.35)}
.i-solid .hz .b{fill:#fff}
.i-solid .hz .b[stroke]{stroke:#fff}
.i-solid .hz .l{fill:color-mix(in srgb,var(--c) 30%,white)}
.i-solid .hz .d{fill:color-mix(in srgb,var(--c) 55%,black)}
.i-solid .hz .w{fill:var(--c)}
.i-solid .hz .sw{stroke:var(--c);stroke-opacity:.6}
.i-solid .hz .sl{stroke:color-mix(in srgb,var(--c) 30%,white)}
.i-solid .hz .hl{fill-opacity:0}
.i-solid .hz svg{filter:drop-shadow(0 2px 2px color-mix(in srgb,var(--c) 70%,black))}
/* three across: the same art, a size up */
.cols3 .hz{zoom:1.2}
/* Sticker A–E — straight, the picture steps out of its pastel square (Gojek) */
.hz.g3 .b{fill:var(--gb)}.hz.g3 .d{fill:var(--gd)}.hz.g3 .l{fill:var(--gl)}
.hz.g3 .b[stroke]{stroke:var(--gb)}.hz.g3 .d[stroke]{stroke:var(--gd)}
.hz.out{width:64px;height:60px}
.hz.out .bgd{inset:auto;left:0;top:0;width:50px;height:50px;border-radius:15px;background:color-mix(in srgb,var(--c) 22%,white);box-shadow:none}
.hz.out svg{left:15px;top:11px;width:49px;height:49px;filter:drop-shadow(0 3px 3px color-mix(in srgb,var(--c) 36%,transparent))}
.hz.out .tag{top:-9px;left:-9px}
.hz.edge svg{filter:drop-shadow(1.6px 0 0 #fff) drop-shadow(-1.6px 0 0 #fff) drop-shadow(0 1.6px 0 #fff) drop-shadow(0 -1.6px 0 #fff) drop-shadow(0 3px 3px rgb(24 39 60/.18))}
.i-stb .hz.out .bgd{width:46px;height:46px;top:6px}
.i-stb .hz.out svg{left:11px;top:-2px;width:57px;height:57px}
.i-stc .hz.out .bgd{border-radius:50%}
.i-stc .hz.out svg{left:14px;top:12px;width:48px;height:48px}
.cols3 .hz.out{zoom:1.15}
/* Matte — Gojek: a soft square, a solid-coloured picture, no shine, no edge */
.hz .a{fill:#ffc531}
.hz .sa{fill:none;stroke:#ffc531;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.hz.matte .hl{display:none}
.hz.matte svg{filter:none}
.hz.matte .bgd{background:var(--cb,color-mix(in srgb,var(--c) 16%,white))}
.hz.matte .d{fill:var(--cd,color-mix(in srgb,var(--c) 66%,black))}
.hz.matte .l{fill:var(--cl,color-mix(in srgb,var(--c) 78%,white))}
.hz.matte .sl{stroke:var(--cl,color-mix(in srgb,var(--c) 78%,white))}
.hz.matte .a{fill:#f7b928}.hz.matte .sa{stroke:#f7b928}
.tag.ink{background:var(--bad-fg);border-radius:8px 8px 8px 0}
.tag.ink::after{content:"";position:absolute;left:0;bottom:-5px;border-left:7px solid var(--bad-fg);border-bottom:6px solid transparent}
.i-matte .app .name,.i-matteb .app .name{color:#484848}
.i-matteb .hz.out .bgd{border-radius:50%}
/* Matte, shaded — Gojek's clay: each part darkens toward its foot, no shine; a contact shadow on the square */
.hz.matte{--kd:var(--cd,color-mix(in srgb,var(--c) 66%,black));--kl:var(--cl,color-mix(in srgb,var(--c) 78%,white))}
.hz.matte.sh .b{fill:var(--gb)}.hz.matte.sh .d{fill:var(--gd)}.hz.matte.sh .l{fill:var(--gl)}
.hz.matte.sh .b[stroke]{stroke:var(--gb)}.hz.matte.sh .d[stroke]{stroke:var(--gd)}
.hz.matte .w{fill:#f4f2ee}

/* tasks under the grid — PhoneCards */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);transition:transform var(--t-press) var(--ease-out)}
.task:active{transform:scale(.985)}
.task .kind{display:flex;align-items:center;gap:8px;padding:12px 16px 0;color:var(--mute);font-weight:500}
.hz.mini{width:26px;height:26px}
.hz.mini svg{position:static;width:26px;height:26px;filter:none}
.task .kind .st{margin-left:auto}
.task .top{display:flex;justify-content:space-between;gap:12px;padding:8px 16px 14px}
.task .nm{font-size:16px;line-height:20px;font-weight:600;letter-spacing:-.16px;overflow-wrap:anywhere}
.task .ln{color:var(--mute);line-height:20px}
.task .lead{font-size:24px;line-height:30px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.task .thumbs{display:flex;gap:6px;padding:0 16px 14px}
.task .thumbs span{width:44px;height:44px;border-radius:8px;background:var(--soft-3);display:grid;place-items:center}
.task .thumbs svg{width:30px;height:30px}
.task .thumbs .more-n{font-weight:500;color:var(--mute)}
.task .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 16px;border-top:1px solid var(--row-line);color:var(--mute)}
.task .foot b{font-weight:400;color:var(--ink)}

/* the hub's own bottom: one Home tab and the floating account orb */
.hbar{flex:none;border-top:1px solid rgb(0 0 0/6%);background:rgb(255 255 255/.8);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);padding-bottom:26px;position:relative;z-index:4}
.htab{position:relative;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500;color:var(--accent);line-height:1.2;letter-spacing:.005em}
.htab::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 15%,transparent),transparent)}
.htab::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:40px;height:3px;border-radius:0 0 999px 999px;background:var(--accent)}
.htab svg{position:relative;width:22px;height:22px;fill:var(--accent);stroke:var(--accent)}
.htab span{position:relative}
.orb2{position:absolute;right:16px;bottom:calc(52px + 26px + 16px);width:56px;height:56px;border-radius:50%;background:rgb(255 255 255/.92);backdrop-filter:blur(14px);box-shadow:0 0 0 2px var(--accent),var(--shadow-float);display:grid;place-items:center;z-index:6}
.orb2 .face{width:42px;height:42px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:17px;font-weight:600;display:grid;place-items:center}
.orb2 .count{position:absolute;top:1px;right:1px;box-shadow:0 0 0 2px var(--canvas)}
.has-orb .scroll{padding-bottom:88px}
/* the hub's phone top bar (shell header, 52px) */
.tbar{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--hairline);background:var(--canvas)}
.tbar svg{width:28px;height:28px;flex:none}
.tbar b{font-weight:600;letter-spacing:-.01em}

/* The account orb, AssistiveTouch-like. Position is written to transform by JS;
   rest/held/open are scale + opacity, properties of their own so they never fight it. */
.aorb{position:absolute;left:0;top:0;z-index:8;width:56px;height:56px;border-radius:50%;border:0;padding:0;background:rgb(255 255 255/.92);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);box-shadow:0 0 0 2px var(--accent),var(--shadow-float);display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;will-change:transform;transition:opacity 300ms ease,scale var(--t-press) var(--ease-out)}
.aorb .face{width:42px;height:42px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:17px;font-weight:600;display:grid;place-items:center;pointer-events:none}

 el.innerHTML=opts.map(([v,l])=>`<button data-v="${v}">${l}</button>`).join('');
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[key]=typeof S[key]==='number'?+b.dataset.v:b.dataset.v;render()};
}
const q=new URLSearchParams(location.search);
for(const k of Object.keys(S))if(q.has(k))S[k]=typeof S[k]==='number'?+q.get(k):q.get(k);
if(!V[S.v])S.v='a';
if(S.ex!=='tiles')S.ex='none';
addEventListener('keydown',e=>{const k='abcde'[+e.key-1];if(k){S.v=k;render()}});
render();
</script>
</body>
</html>
