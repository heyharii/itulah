function luminance(h){const c=h.match(/[\da-f]{2}/gi).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722}
function contrast(a,b){const x=[luminance(a),luminance(b)].sort((a,b)=>a-b);return ((x[1]+.05)/(x[0]+.05)).toFixed(1)}
function sample(t){const d=D.find(d=>d.id===state.dept),sel=state.selected[d.id],selectedGroup=d.g.find(g=>g.r.some(r=>rowName(r)===sel)),rows=selectedGroup.r.slice(0,6);if(!rows.some(r=>rowName(r)===sel))rows[rows.length-1]=selectedGroup.r.find(r=>rowName(r)===sel);const other=d.g.find(g=>g!==selectedGroup);return `<article class="sample"><div class="sample-title"><strong>${t.name}</strong><span>${t.tag}</span></div><div class="mini" style="${styleOf(t)}"><div class="mini-rail">${svg('home')}<span class="mini-on">${svg(d.ic)}</span>${svg('fin')}${svg('cog')}</div><div class="mini-panel"><h3>${esc(d.l)}</h3><div class="glabel">${esc(selectedGroup.l??'Workspace')}</div>${rows.map(r=>`<div class="item${rowName(r)===sel?' on':''}"><span class="label">${esc(rowName(r))}</span></div>`).join('')}${other?`<div class="glabel">${esc(other.l??'Workspace')}</div><div class="item"><span class="label">${esc(rowName(other.r[0]))}</span></div>`:''}</div></div><button class="sample-pick" data-theme="${t.id}" aria-pressed="${state.theme===t.id}">${state.theme===t.id?'Sedang dipakai':'Coba '+t.name}</button><p class="contrast">Teks ${contrast(t.colors.text,t.colors.panel)}:1 · label ${contrast(t.colors.muted,t.colors.panel)}:1</p></article>`}
function pvCard(v){const d=D.find(d=>d.id===state.dept),c=v.colors,css=c?styleOf(v):'',name=c?`${v.id.toUpperCase()} · ${v.name}`:'Paper asli';return `<article class="pv-card"><div class="pv-card-title"><strong>${name}${v.rec?' ★':''}</strong><span>${esc(v.tag)}</span></div><div class="pv-win pvx"${c?` data-pv="${v.id}"`:''} data-count="${state.count}" style="${css}" inert><div class="nav-surface" style="${c?css:styleOf(THEMES[0])}"><div class="rail">${railHTML(d)}</div><div class="panel"><div class="panel-head"><div class="eyebrow">ITULAH / WORKSPACE</div><h2>${esc(d.l)}</h2></div><div class="list">${listHTML(d)}</div>${setupHTML(d)}<div class="panel-foot">${footText(c)}</div></div></div><div class="page pv-sliver"><div class="pv-sliver-head">${esc(state.selected[d.id])}</div><i></i><i></i><i></i><i></i><i></i><i></i></div></div><button class="pv-pick" data-pick-pv="${v.id}" aria-pressed="${state.pv===v.id}">${state.pv===v.id?'Sedang dipakai':'Coba '+(c?v.id.toUpperCase():'asli')}</button></article>`}
function renderContent(){const t=theme(),v=pvActive(),d=D.find(d=>d.id===state.dept);if(state.view==='compare'){$('content').innerHTML=`<p class="compare-caption">Departemen dan menu aktif mengikuti sidebar kiri. Perhatikan pemisahan rail, label grup, dan baris aktif di setiap opsi.</p><div class="comparison">${THEMES.map(sample).join('')}</div>`;return}
 if(state.view==='paper'){$('content').innerHTML=`<div class="pv-compare">${PV.map(pvCard).join('')}</div>`;fades();return}
 const c=v?v.colors:t.colors,tokens=(v?[['Bingkai','frame']]:[]).concat([['Latar','panel'],['Teks menu','text'],['Label grup','muted'],['Menu aktif','active']]);$('content').innerHTML=`<div class="theme-note"><div><h2>${v?`${t.name} · ${v.id.toUpperCase()} ${v.name}`:t.name} <span style="font-weight:400;color:#697381">/ ${v?v.tag:t.tag}</span></h2><p>${v?v.desc:t.desc}</p></div>${v?(v.rec?'<span class="recommend">★ Versi yang disarankan</span>':''):(t.recommend?'<span class="recommend">Pilihan yang disarankan</span>':'')}</div><div class="tokens">${tokens.map(([label,key])=>`<span class="token"><i style="background:${c[key]}"></i>${label} <code>${c[key]}</code></span>`).join('')}</div><section class="demo" aria-label="Contoh halaman kerja"><div class="crumb">${esc(d.l)} / Workspace</div><div class="demo-title"><h2>${esc(state.selected[d.id])}</h2><span class="date">15 Okt 2026</span></div><div class="metrics"><div class="metric"><span>Hadir hari ini</span><strong>142 <small>/ 156</small></strong></div><div class="metric"><span>Terlambat</span><strong>6</strong></div><div class="metric"><span>Cuti & izin</span><strong>8</strong></div></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Departemen</th><th>Jadwal</th><th>Masuk</th><th>Status</th></tr></thead><tbody>${[['Alya Pratama','Finance','08:00 – 17:00','07:52','Hadir'],['Bima Santoso','Operations','08:00 – 17:00','07:56','Hadir'],['Citra Dewi','HR','08:00 – 17:00','08:12','Terlambat'],['Dimas Putra','Merchandise','08:00 – 17:00','07:48','Hadir'],['Eva Larasati','Procurement','08:00 – 17:00','07:59','Hadir']].map(r=>`<tr>${r.slice(0,4).map(x=>`<td>${x}</td>`).join('')}<td><span class="status${r[4]==='Terlambat'?' late':''}">${r[4]}</span></td></tr>`).join('')}</tbody></table></div><p class="demo-note">Data contoh untuk menilai sidebar di samping halaman kerja yang terang.</p></section>`}
function render(){renderNav();renderPalettes();renderContent();updateUrl()}
function revealSelected(){$('nav').querySelector('.item.on')?.scrollIntoView({block:'nearest',inline:'nearest'})}
function keepScroll(fn){const old=$('list').scrollTop;fn();$('list').scrollTop=old;fades()}
function selectTheme(id){if(!THEMES.some(t=>t.id===id))return;state.theme=id;if(id!=='paper'&&state.view==='paper')state.view='preview';keepScroll(renderNav);renderPalettes();renderContent();updateUrl()}
function selectPv(id){if(!PV.some(v=>v.id===id))return;state.theme='paper';state.pv=id;keepScroll(renderNav);renderPalettes();renderContent();updateUrl()}
// a department's screens rise into place when the rail changes department
function swap(){const l=$('list');l.classList.remove('swap');void l.offsetWidth;l.classList.add('swap')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pickPv)return selectPv(b.dataset.pickPv);if(b.dataset.theme)return selectTheme(b.dataset.theme);if(b.dataset.view){state.view=b.dataset.view;if(state.view==='paper'&&state.theme!=='paper'){state.theme='paper';renderNav()}renderPalettes();renderContent();return updateUrl()}if(b.dataset.dept){state.dept=b.dataset.dept;render();swap();return revealSelected()}if(b.dataset.row){state.selected[state.dept]=b.dataset.row;keepScroll(renderNav);renderContent();return}if(b.dataset.fold){const g=b.parentElement,open=g.classList.contains('shut');state.open[b.dataset.fold]=open;g.classList.toggle('shut',!open);g.classList.toggle('open',open);b.setAttribute('aria-expanded',open);g.querySelector('.fold').inert=!open;return fades()}if(b.hasAttribute('data-setup')){const g=b.parentElement,open=g.classList.contains('shut');state.setup[state.dept]=open;g.classList.toggle('shut',!open);g.classList.toggle('open',open);b.setAttribute('aria-expanded',open);g.querySelector('.fold').inert=!open;fades()}});
$('list').addEventListener('animationend',e=>e.currentTarget.classList.remove('swap'));
document.addEventListener('scroll',e=>{const l=e.target;if(l.classList&&l.classList.contains('list'))fade(l)},true);addEventListener('resize',fades);
$('count').addEventListener('change',e=>{state.count=e.target.value;applyLook();if(state.view==='paper')renderContent();updateUrl()});$('layout').addEventListener('change',e=>{state.layout=e.target.value;state.open={};render();revealSelected()});$('department').innerHTML=D.map(d=>`<option value="${d.id}">${d.l}</option>`).join('');$('department').addEventListener('change',e=>{state.dept=e.target.value;render();revealSelected()});
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,[contenteditable]')||e.ctrlKey||e.altKey||e.metaKey)return;const t=THEMES[Number(e.key)-1];if(t)return selectTheme(t.id);const v=PV.find(v=>(v.colors?v.id:'0')===e.key.toLowerCase());if(v)selectPv(v.id)});
const params=new URLSearchParams(location.search);if(THEMES.some(t=>t.id===params.get('theme')))state.theme=params.get('theme');if(D.some(d=>d.id===params.get('d')))state.dept=params.get('d');if(['labels','fold','setup'].includes(params.get('layout')))state.layout=params.get('layout');if(PV.some(v=>v.id===params.get('pv')))state.pv=params.get('pv');if(params.get('count')==='num')state.count='num';if(['compare','paper'].includes(params.get('view')))state.view=params.get('view');render();revealSelected();
</script>
</body>
</html>
