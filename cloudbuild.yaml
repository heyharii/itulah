steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - '${_IMAGE_URI}:build-${BUILD_ID}'
      - --label
      - 'org.opencontainers.image.revision=${_COMMIT_SHA}'
      - --label
      - 'org.opencontainers.image.source=https://github.com/heyharii/itulah'
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_IMAGE_URI}:build-${BUILD_ID}'

  - id: deploy-by-digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        image_digest="$$(gcloud artifacts docker images describe '${_IMAGE_URI}:build-${BUILD_ID}' --format='value(image_summary.digest)')"
        if [[ ! "$${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "Artifact Registry did not return an immutable image digest" >&2
          exit 1
        fi
        image_ref='${_IMAGE_URI}@$${image_digest}'
        remote_script="/tmp/itulah-deploy-cloud-${BUILD_ID}"

        gcloud compute scp deploy/gcp/deploy-cloud.sh "${_INSTANCE}:$${remote_script}" \
          --project="${PROJECT_ID}" --zone="${_ZONE}" --tunnel-through-iap --quiet
        gcloud compute ssh "${_INSTANCE}" \
          --project="${PROJECT_ID}" --zone="${_ZONE}" --tunnel-through-iap --quiet \
          --command="sudo install -o root -g root -m 0755 '$${remote_script}' /usr/local/sbin/itulah-deploy-cloud && sudo /usr/local/sbin/itulah-deploy-cloud '$${image_ref}'"

images:
  - '${_IMAGE_URI}:build-${BUILD_ID}'

serviceAccount: projects/project-21f41328-b088-4894-b3f/serviceAccounts/itulah-cloudbuild-deploy@project-21f41328-b088-4894-b3f.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3600s
