<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unfilled after a short pick (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --ink:#20242c; --text:#394150; --body:#626b78; --mute:#737c89; --faint:#b9c0c9; --line-ico:#89919d;
  --canvas:#fff; --soft:#f8f8f9; --soft-2:#f0f0f2; --soft-3:#f6f6f7;
  --hairline:#e6e6e9; --hairline-2:#dadade; --hairline-strong:#c6c6cc;
  --rail:#242526; --rail-3:#393b3d; --rail-text:#c3c4c7;
  --scrim:rgba(246,246,247,.72);
  --accent:#2563eb; --accent-bg:#eff5ff; --cta:#2563eb; --cta-hover:#1d4ed8;
  --ok:#36b827; --ok-bg:#e8f6ee; --ok-fg:#15803d;
  --warn:#c9892e; --warn-bg:#fdf1dd; --warn-fg:#b45309;
  --bad:#d05151; --bad-bg:#fbeaea; --bad-fg:#be123c; --info:#2f86d8;
  --r-card:.75rem; --r-inner:.4375rem;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --shadow-pop:0 4px 8px rgb(24 39 60/4%),0 12px 32px rgb(24 39 60/8%);
  --shadow-float:0 2px 6px rgb(24 39 60/5%),0 24px 64px rgb(24 39 60/16%);
}
*{box-sizing:border-box}
html{font-size:16px}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;font-size:15px;color:var(--text);background:var(--soft-3);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:var(--ink)}
svg.lucide{width:17px;height:17px;stroke-width:1.7;flex-shrink:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px}
.shell{display:flex;height:100vh}
.col{width:68px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;flex-shrink:0}
.mark{width:30px;height:30px;border-radius:8px;background:#0b0b0b;color:#fff;display:grid;place-items:center;font-weight:600;position:relative;margin-bottom:10px}
.mark::after{content:"";position:absolute;right:5px;bottom:5px;width:5px;height:5px;border-radius:50%;background:#3b82f6}
.ci{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--rail-text)}
.ci.on{background:var(--rail-3);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 32px;border-bottom:1px solid var(--hairline);color:var(--body);flex-shrink:0}
.bar b{color:var(--ink);font-weight:500}
.bar svg{width:15px;height:15px;color:var(--faint)}
.page{flex:1;overflow-y:auto}
.page.beside{padding-right:42rem}
.page.beside .hb{display:none}
.content{max-width:100rem;margin:0 auto;padding:28px 32px 120px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.ph h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.ph p{margin:6px 0 0;color:var(--body)}
.ph .act{margin-left:auto;display:flex;gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--body);margin-bottom:8px}
.back:hover{color:var(--ink)}
.btn{height:40px;padding:0 14px;border-radius:var(--r-inner);border:1px solid var(--hairline-2);background:var(--canvas);color:var(--ink);display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--cta);color:#fff;border-color:var(--cta)}
.btn.pri:hover{background:var(--cta-hover)}
.btn.sm{height:36px;padding:0 12px}
.btn.danger{color:var(--bad-fg)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:16px;height:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hairline);margin-bottom:16px}
.tabs button{height:44px;padding:0 12px;color:var(--body);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs button span{color:var(--mute);font-weight:400}
.card{background:var(--canvas);border-radius:var(--r-card);border:1px solid var(--hairline);overflow:clip}
table{width:100%;border-collapse:collapse}
th{height:44px;text-align:left;font-weight:500;color:var(--body);padding:0 16px;border-bottom:1px solid var(--hairline);background:var(--soft);font-size:14px;white-space:nowrap;position:sticky;top:0;z-index:2}
td{height:56px;padding:0 16px;border-bottom:1px solid var(--hairline);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
tbody tr.sel td{background:var(--accent-bg)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.n,th.n{width:56px;color:var(--mute);text-align:right;padding-right:8px}
td.strong{color:var(--ink);font-weight:500}
td.act,th.act{text-align:right;width:1%}
tfoot td{position:sticky;bottom:0;background:var(--soft);font-weight:600;color:var(--ink);border-top:1px solid var(--hairline);border-bottom:0}
.nm{display:block;color:var(--ink);font-weight:500}
.sk{display:block;color:var(--mute);font-size:14px}
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.need{color:var(--warn-fg);font-weight:500}
.empty{padding:28px;text-align:center;color:var(--mute)}
.fld{display:inline-flex;height:40px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);overflow:hidden;background:var(--canvas)}
.fld:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgb(37 99 235/.12)}
.fld input{width:5rem;border:0;outline:none;text-align:right;padding:0 10px;font-variant-numeric:tabular-nums}
.fld span{display:flex;align-items:center;padding:0 10px;border-left:1px solid var(--hairline);background:var(--soft);color:var(--body)}
.split{display:grid;grid-template-columns:17rem 1fr;gap:16px;align-items:start}
.pickl{padding:6px}
.pickl button{width:100%;display:flex;flex-direction:column;padding:10px 12px;border-radius:var(--r-inner)}
.pickl button:hover{background:var(--soft)}
.pickl button.on{background:var(--accent-bg)}
.pickl button.on .nm{color:#1e40af}
.foot{position:sticky;bottom:0;margin-top:16px;display:flex;align-items:center;gap:12px;padding:14px 0;background:var(--soft-3);border-top:1px solid var(--hairline);color:var(--body)}
.foot .g{flex:1}

/* the allotment sheet */
.sheet{position:fixed;z-index:30;top:20px;right:20px;bottom:20px;width:40rem;max-width:calc(100vw - 40px);background:var(--canvas);border:1px solid var(--hairline);border-radius:1rem;box-shadow:var(--shadow-float);display:flex;flex-direction:column;overflow:hidden;animation:slide 260ms cubic-bezier(.32,.72,0,1)}
@keyframes slide{from{transform:translateX(calc(100% + 20px))}}
.sh{display:flex;align-items:flex-start;gap:12px;padding:20px 16px 16px 28px;border-bottom:1px solid var(--hairline)}
.sh .g{flex:1}
.sh h2{margin:0;font-size:20px;font-weight:600;color:var(--ink)}
.sh p{margin:4px 0 0;color:var(--body)}
.ib{width:36px;height:36px;border-radius:var(--r-inner);display:grid;place-items:center;color:var(--line-ico)}
.ib:hover{background:var(--soft-2)}
.sb{flex:1;overflow-y:auto;padding:20px 28px}
.sf{border-top:1px solid var(--hairline);padding:14px 28px;display:flex;gap:8px;align-items:center}
.sf .g{flex:1;color:var(--body)}
.sb td{height:64px}
.unf{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.unf .need{margin-right:4px}
.rowact{display:flex;gap:6px;justify-content:flex-end}

/* dialog */
.veil{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade 160ms}
@keyframes fade{from{opacity:0}}
.dlg{width:min(34rem,100%);background:var(--canvas);border:1px solid var(--hairline);border-radius:1rem;box-shadow:var(--shadow-float);overflow:hidden}
.dh{padding:20px 24px 4px}
.dh h2{margin:0;font-size:20px;font-weight:600;color:var(--ink)}
.db{padding:12px 24px 20px;color:var(--body);line-height:1.6}
.db ul{margin:8px 0 0;padding-left:18px}
.df{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--hairline)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#191b20;color:#fff;padding:12px 18px;border-radius:10px;z-index:80;box-shadow:var(--shadow-pop)}
.proto{position:fixed;left:84px;bottom:16px;z-index:90;background:#191b20;border-radius:12px;padding:4px;box-shadow:var(--shadow-float);font-size:14px}
.proto .seg{display:flex;background:#2a2c31;border-radius:9px;padding:3px}
.proto .seg button{height:32px;padding:0 12px;border-radius:6px;color:#a9abb1;white-space:nowrap}
.proto .seg button.on{background:#fff;color:#191b20;font-weight:500}

/* spacious: every row breathes, and a two-line cell (name over SKU) gets room above and below */
td{padding-top:14px!important;padding-bottom:14px!important;min-height:64px}
tbody td{height:64px}
.tree td{height:52px}
.nm{line-height:1.4}
.sk{line-height:1.4;margin-top:4px}
.ci{position:relative}
.ci .badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:14px;line-height:18px;text-align:center;font-weight:500}
.step{display:inline-flex;align-items:center;border:1px solid var(--hairline-2);border-radius:var(--r-inner);overflow:hidden;height:40px}
.step button{width:40px;height:40px;display:grid;place-items:center;color:var(--body)}
.step button:hover{background:var(--soft)}
.step b{min-width:3rem;text-align:center;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.short{color:var(--warn-fg);font-weight:500}
.tl{list-style:none;margin:4px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:4rem 14px 1fr;gap:12px;align-items:start;padding:10px 0}
.tl time{color:var(--mute);font-variant-numeric:tabular-nums}
.tl .dot{margin-top:7px}
.tl .what{color:var(--ink)}
.tl .ref{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.dimrow td{color:var(--mute)}
</style>
</head>
<body>
<div class="shell">
  <nav class="col"><span class="mark">C</span>
    <span class="ci"><i data-lucide="house"></i></span>
    <span class="ci"><i data-lucide="shopping-cart"></i></span>
    <span class="ci" id="nMd"><i data-lucide="shirt"></i><span class="badge" id="mdBadge" hidden></span></span>
    <span class="ci" id="nOps"><i data-lucide="warehouse"></i></span>
    <span class="ci"><i data-lucide="boxes"></i></span>
  </nav>
  <div class="main">
    <header class="bar" id="crumb"></header>
    <div class="page"><div class="content" id="view"></div></div>
  </div>
</div>
<div id="dlg"></div>
<div class="proto"><div class="seg" id="seg"></div></div>

<script>
/* Short pick → the pieces not found become an RFID count (built). Each store
   share left short is "unfilled" and lands on Merchandise › Allotments ›
   Unfilled, with a badge on the MD menu. The count answers first:
     found     → back to pick by itself, nothing for MD to do
     not found → pieces are Missing; MD closes it short (the store
                 gets less). More goods go out on a new allotment.           */
const C={counting:{l:'Counting',c:'var(--warn)'},notfound:{l:'Not found',c:'var(--bad)'},found:{l:'Found · back to pick',c:'var(--ok)'},
         cancelled:{l:'Closed short',c:'var(--faint)'}};
const ROWS=[
  {id:1,art:'Kemeja Oxford Slim',sku:'KOS-WHT-L',store:'Store PIK',alt:'ALT-0412',day:'29 Sep',asked:12,sent:10,st:'notfound',
   tl:[['10:12','Picked 10 of 12','PCK-0091 · Andi'],['10:12','Count raised','CNT-0231'],['10:41','2 not found','Missing at Gudang']]},
  {id:2,art:'Celana Chino Regular',sku:'CCR-KHK-32',store:'Store Kemang',alt:'ALT-0412',day:'29 Sep',asked:20,sent:17,st:'notfound',
   tl:[['09:30','Picked 17 of 20','PCK-0090 · Andi'],['09:30','Count raised','CNT-0229'],['10:05','3 not found','Missing at Gudang']]},
  {id:3,art:'Kaos Basic Crew',sku:'KBC-BLK-M',store:'Store Senayan',alt:'ALT-0410',day:'27 Sep',asked:30,sent:28,st:'counting',
   tl:[['11:02','Picked 28 of 30','PCK-0093 · Dewi'],['11:02','Count raised','CNT-0233']]},
  {id:4,art:'Jaket Denim Trucker',sku:'JDT-IND-L',store:'Store BSD',alt:'ALT-0408',day:'25 Sep',asked:8,sent:7,st:'cancelled',
   tl:[['30 Sep','Picked 7 of 8','PCK-0085 · Andi'],['30 Sep','1 not found','Missing at Gudang'],['30 Sep','1 closed short','Sari']]},
];
let view='md', tab='open', dlg=null;
const ico=()=>lucide.createIcons();
const open=r=>['counting','notfound'].includes(r.st);
const needsMd=()=>ROWS.filter(r=>r.st==='notfound').length;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}

/* ── Ops · picking (where the short happens) ─────────────────────────────── */
const PICK=[{art:'Kemeja Oxford Slim',sku:'KOS-WHT-M',ask:14,got:14},{art:'Kemeja Oxford Slim',sku:'KOS-WHT-L',ask:12,got:10},{art:'Kemeja Oxford Slim',sku:'KOS-WHT-XL',ask:6,got:6}];
function ops(){
  crumb('Operations','Outbound');
  const short=PICK.reduce((s,p)=>s+(p.ask-p.got),0);
  return `<div class="ph"><div><h1>PCK-0091</h1><p>Store PIK · ALT-0412</p></div></div>
  <div class="card"><table><thead><tr><th class="n">No.</th><th>Article</th><th class="r">To pick</th><th class="r">Picked</th><th class="r">Short</th></tr></thead><tbody>
  ${PICK.map((p,i)=>`<tr><td class="n">${i+1}</td><td><span class="nm">${p.art}</span><span class="sk mono">${p.sku}</span></td><td class="r">${p.ask}</td>
  <td class="r"><span class="step"><button onclick="bump(${i},-1)"><i data-lucide="minus"></i></button><b>${p.got}</b><button onclick="bump(${i},1)"><i data-lucide="plus"></i></button></span></td>
  <td class="r ${p.ask>p.got?'short':''}">${p.ask>p.got?p.ask-p.got:'—'}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="foot"><span class="g">${short?`<span class="short">${short} short</span>`:'Complete'}</span><button class="btn pri" onclick="donePick(${short})">Done</button></div>`;
}
function bump(i,d){const p=PICK[i];p.got=Math.max(0,Math.min(p.ask,p.got+d));paint()}
function donePick(short){
  if(!short){toast('Picked');return}
  const r=ROWS.find(x=>x.id===1); r.st='counting'; r.sent=12-short; r.tl=[['now',`Picked ${12-short} of 12`,'PCK-0091 · Andi'],['now','Count raised','CNT-0234']];
  toast(`${short} short · count raised`); view='md'; paint();
}

/* ── MD · Allotments › Unfilled ──────────────────────────────────────────── */
function md(){
  crumb('Merchandise','Allotments');
  const rows=ROWS.filter(r=>tab==='open'?open(r):!open(r));
  const nOpen=ROWS.filter(open).length;
  return `<div class="ph"><h1>Allotments</h1></div>
  <div class="tabs"><button>Active <span>14</span></button><button class="${tab==='open'?'on':''}" onclick="tab='open';paint()">Unfilled <span>${nOpen}</span></button>
  <button class="${tab==='done'?'on':''}" onclick="tab='done';paint()">Closed short <span>${ROWS.length-nOpen}</span></button><button>Completed <span>212</span></button></div>
  <div class="card">${rows.length?`<table><thead><tr><th class="n">No.</th><th>Article</th><th>Store</th><th>Allotment</th>
  <th class="r">Allotted</th><th class="r">Picked</th><th class="r">Unfilled</th><th>Status</th><th class="act"></th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr class="click ${open(r)?'':'dimrow'}" onclick="detail(${r.id})"><td class="n">${i+1}</td>
   <td><span class="nm">${r.art}</span><span class="sk mono">${r.sku}</span></td><td class="strong">${r.store}</td>
   <td><span class="nm mono">${r.alt}</span><span class="sk">${r.day}</span></td>
   <td class="r">${r.asked}</td><td class="r">${r.sent}</td><td class="r ${open(r)?'need':''}">${r.asked-r.sent}</td>
   <td><span class="st"><span class="dot" style="background:${C[r.st].c}"></span>${C[r.st].l}</span></td>
   <td class="act" onclick="event.stopPropagation()">${acts(r)}</td></tr>`).join('')}</tbody></table>`
  :`<div class="empty">${tab==='open'?'Nothing unfilled.':'Nothing closed short.'}</div>`}</div>`;
}
function acts(r){
  if(r.st==='counting')return '';
  if(!open(r))return '';
  return `<div class="rowact"><button class="btn sm" onclick="ask(${r.id})">Close short</button></div>`;
}
function ask(id){const r=ROWS.find(x=>x.id===id);dlg=`<div class="veil" onclick="if(event.target===this){dlg=null;paint()}"><div class="dlg">
  <div class="dh"><h2>Close short</h2></div><div class="db">${r.store} gets ${r.sent} of ${r.asked}.</div>
  <div class="df"><button class="btn" onclick="dlg=null;paint()">Back</button><button class="btn pri" onclick="cancelRest(${id})">Close short</button></div></div></div>`;paint()}
function cancelRest(id){const r=ROWS.find(x=>x.id===id);const n=r.asked-r.sent;r.st='cancelled';r.tl.push(['now',`${n} closed short`,'Sari']);dlg=null;toast(`${n} pcs closed short`);paint()}
function detail(id){const r=ROWS.find(x=>x.id===id);dlg=`<div class="veil" onclick="if(event.target===this){dlg=null;paint()}"><div class="dlg" style="width:min(40rem,100%)">
  <div class="dh"><h2>${r.art}</h2><p class="sk mono" style="margin:4px 0 0">${r.sku} · ${r.store} · ${r.alt}</p></div>
  <div class="db"><ul class="tl">${r.tl.map(t=>`<li><time>${t[0]}</time><span class="dot" style="background:${dotOf(t[1])}"></span><span><span class="what">${t[1]}</span><span class="ref">${t[2]}</span></span></li>`).join('')}</ul></div>
  <div class="df">${open(r)&&r.st!=='counting'?acts(r).replace('class="rowact"','class="rowact" style="width:100%"'):'<button class="btn" onclick="dlg=null;paint()">Close</button>'}</div></div></div>`;paint()}
const dotOf=w=>/not found|Missing/.test(w)?'var(--bad)':/Count/.test(w)?'var(--warn)':/found/.test(w)?'var(--ok)':/closed short/.test(w)?'var(--faint)':'var(--line-ico)';

/* prototype only: the RFID count answers */
function answer(found){
  const r=ROWS.find(x=>x.st==='counting'); if(!r){toast('No count running');return}
  const n=r.asked-r.sent;
  if(found){r.st='found';r.tl.push(['now',`${n} found`,'Back to pick · PCK-0091']);toast(`${n} found · back to pick`)}
  else{r.st='notfound';r.tl.push(['now',`${n} not found`,'Missing at Gudang']);toast(`${r.art} · ${n} unfilled`)}
  paint();
}

function crumb(a,b){document.getElementById('crumb').innerHTML=`${a} <i data-lucide="chevron-right"></i> <b>${b}</b>`}
function paint(){
  document.getElementById('view').innerHTML=view==='ops'?ops():md();
  document.getElementById('dlg').innerHTML=dlg||'';
  const n=needsMd(),b=document.getElementById('mdBadge'); b.hidden=!n; b.textContent=n;
  document.getElementById('nMd').classList.toggle('on',view==='md'); document.getElementById('nOps').classList.toggle('on',view==='ops');
  document.getElementById('seg').innerHTML=`<button class="${view==='ops'?'on':''}" onclick="view='ops';dlg=null;paint()">Ops · Pick</button>
   <button class="${view==='md'?'on':''}" onclick="view='md';dlg=null;paint()">MD · Unfilled</button>
   <button onclick="answer(true)">Count: found</button><button onclick="answer(false)">Count: not found</button>`;
  ico();
}
paint();
</script>
</body>
</html>
