<!doctype html>
<html lang="en" data-color="lark" data-surface="wells" data-shape="tight" data-title="hub" data-screen="list" data-device="desk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PO Lark × Apple</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@500..600&display=swap" rel="stylesheet" />
<style>
/* PO list · detail · create in combinations of Lark taste and Apple simplicity (12 Oct 2026).
   Four axes, one DOM: Colour (Lark soft | Mono), Surface (Wells | Grouped), Shape (Soft | Tight),
   Title (Hub | Large). Buttons are always one clear primary; everything else is tint text or ⋯. */
:root {
  --ink: #20242c; --text: #394150; --body: #565f6d; --mute: #666f7d; --faint: #89919d;
  --hairline: #eceef1; --edge: #e1e3e8; --well: #f2f3f5; --band: #f5f6f8;
  --accent: #2563eb; --accent-hover: #1d4ed8; --tint: #eaf0ff;
  --red: #c4281c; --green: #1f8a3c; --amber: #b4570b;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --r-card: 14px; --r-ctl: 10px; --r-sheet: 20px; --r-chip: 999px; --r-big: 18px;
  --shell: #eef1f6; --page: #ffffff; --grp: transparent;
}
/* Palettes for the Lark colour (Hari, 12 Oct: "kasih beberapa opsi warna dari B") */
:root { --k1: #f3f6ff; --k1i: #2457d6; --k2: #f0f8f3; --k2i: #1f8a3c; --k3: #fff4f3; --k3i: #c4281c; --k4: #f6f3ff; --k4i: #6d3ad6;
  --ava: #edf1f9; --ava-i: #3d5aa8; --recv: #eaf0ff; --recv-i: #2457d6; }
html[data-palette="one"] { --k2: #f3f6ff; --k2i: #2457d6; --k3: #f3f6ff; --k3i: #2457d6; --k4: #f3f6ff; --k4i: #2457d6; }
html[data-palette="meaning"] { --k1: #f5f6f8; --k1i: #565f6d; --k2: #f5f6f8; --k2i: #565f6d; --k4: #f5f6f8; --k4i: #565f6d; --ava: #f0f1f4; --ava-i: #394150; }
/* Hero (Hari: "one colour stand out, blue pekat, lainnya abu abu"): the first figure is a solid deep-blue card, every other card grey */
html[data-palette="hero"] { --k1: #2457d6; --k1i: #ffffff; --k2: #f5f6f8; --k2i: #565f6d; --k3: #f5f6f8; --k3i: #565f6d; --k4: #f5f6f8; --k4i: #565f6d; --ava: #f0f1f4; --ava-i: #394150; }
html[data-palette^="hero"][data-color="lark"][data-surface="wells"] .kpi:nth-child(1) .ki { background: rgb(255 255 255 / 16%); box-shadow: none; }
html[data-palette="heroink"] { --k1: #20242c; --k1i: #ffffff; --k2: #f5f6f8; --k2i: #565f6d; --k3: #f5f6f8; --k3i: #565f6d; --k4: #f5f6f8; --k4i: #565f6d; --ava: #f0f1f4; --ava-i: #394150; }
html[data-palette^="hero"][data-color="lark"][data-surface="wells"] .kpi:nth-child(1) .kl { color: #fff; }
html[data-palette^="hero"][data-color="lark"][data-surface="wells"] .kpi:nth-child(1) .kv, html[data-palette^="hero"][data-color="lark"][data-surface="wells"] .kpi:nth-child(1) .kv span { color: #fff !important; }
/* Card (Hari: "versi pake border, putih border … atau shadow saja, putih shadow"): the grey KPI cards turn white */
html[data-card="border"] .kpi, html[data-card="shadow"] .kpi { background: #fff !important; }
html[data-card="border"] .kpi { box-shadow: 0 0 0 1px var(--edge); }
html[data-card="shadow"] .kpi { box-shadow: 0 0 0 1px rgb(16 24 40 / 3%), 0 1px 2px rgb(16 24 40 / 6%), 0 6px 16px rgb(16 24 40 / 6%); }
html[data-card][data-palette^="hero"][data-color="lark"][data-surface="wells"] .kpi:nth-child(1) { background: var(--k1) !important; box-shadow: none; }
html[data-card="shadow"][data-palette^="hero"][data-color="lark"][data-surface="wells"] .kpi:nth-child(1) { box-shadow: 0 6px 16px color-mix(in srgb, var(--k1) 28%, transparent); }
html[data-palette="indigo"] { --accent: #4f46e5; --accent-hover: #4338ca; --tint: #eeedff; --k1: #f5f4ff; --k1i: #4f46e5; --k2: #f5f4ff; --k2i: #4f46e5; --k4: #f5f4ff; --k4i: #4f46e5;
  --ava: #efeefe; --ava-i: #4338ca; --recv: #eeedff; --recv-i: #4338ca; }
html[data-palette="ink"] { --accent: #20242c; --accent-hover: #000000; --tint: #eef0f3; --k1: #f5f6f8; --k1i: #394150; --k2: #f5f6f8; --k2i: #394150; --k4: #f5f6f8; --k4i: #394150;
  --ava: #f0f1f4; --ava-i: #20242c; --recv: #e9ecf1; --recv-i: #20242c; }
html[data-shape="tight"] { --r-card: 10px; --r-ctl: 8px; --r-sheet: 14px; --r-chip: 6px; --r-big: 12px; }
html[data-surface="grouped"] { --shell: #f2f2f7; --page: #f2f2f7; --grp: #ffffff; --band: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 400 15px/1.45 var(--sans); letter-spacing: -0.006em; color: var(--ink); background: #e8e9ec; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.mono { font-family: var(--mono); font-size: 14px; font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }

/* ── prototype bar (not the design) ── */
.proto { position: fixed; inset: 0 0 auto; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--hairline); font-size: 14px; }
.proto .lbl { color: var(--mute); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: #f0f0f2; }
.seg button { height: 28px; padding: 0 10px; border-radius: 7px; color: var(--body); font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(24 39 60 / 10%); }
.seg.presets button { min-width: 30px; }
.proto .name { color: var(--ink); font-weight: 600; }

/* ── stage: desk fills the window; phone is an iPhone XR frame ── */
.stage { position: fixed; top: var(--bar-h, 50px); left: 0; right: 0; bottom: 0; display: grid; place-items: center; }
.app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--shell); container: app / inline-size; transform: translateZ(0); }
html[data-device="phone"] .app { width: 414px; height: min(896px, calc(100vh - var(--bar-h, 50px) - 24px)); border-radius: 44px; border: 10px solid #1b1c1f; box-shadow: 0 30px 80px rgb(0 0 0 / 25%); }

/* ── shell: rail + panel + the page ── */
.shell { display: grid; grid-template-columns: 64px 220px minmax(0, 1fr); height: 100%; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; }
.rail .logo { width: 32px; height: 32px; border-radius: var(--r-ctl); background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; margin-bottom: 12px; }
.rail .ic { width: 40px; height: 40px; border-radius: var(--r-ctl); display: grid; place-items: center; color: #5b6472; }
.rail .ic.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(16 24 40 / 8%); }
.rail .gap { flex: 1; }
.panel { padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.panel .ph { height: 36px; display: flex; align-items: center; padding: 0 10px; font-weight: 600; margin-bottom: 6px; }
.panel .pl { padding: 14px 10px 6px; font-size: 14px; color: var(--mute); }
.panel a { height: 36px; display: flex; align-items: center; padding: 0 10px; border-radius: var(--r-ctl); color: var(--text); text-decoration: none; }
.panel a.on { background: #fff; color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgb(16 24 40 / 6%); }
.page { position: relative; margin: 8px 8px 8px 0; border-radius: var(--r-sheet); background: var(--page); box-shadow: 0 0 0 1px rgb(16 24 40 / 4%); overflow: auto; }
html[data-surface="grouped"] .page { margin: 0; border-radius: 0; box-shadow: none; }
html[data-surface="grouped"] .rail .ic.on, html[data-surface="grouped"] .panel a.on { background: #e3e3e9; box-shadow: none; }
.page-in { padding: 24px 32px 48px; max-width: 1240px; }

/* titles */
.head { display: flex; align-items: center; gap: 12px; }
.head h1 { flex: 1; margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.015em; }
html[data-title="large"] .head h1 { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.024em; }
html[data-title="large"] .head { align-items: flex-end; }

/* buttons: one solid primary, everything else is tint text */
.btn { height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 16px; border-radius: var(--r-ctl); background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; transition: background-color 150ms ease, transform 160ms var(--ease-out); }
html[data-shape="soft"] .btn { border-radius: 999px; }
.btn:active { transform: scale(0.97); background: var(--accent-hover); }
@media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--accent-hover); } }
.btn svg.i { width: 17px; height: 17px; stroke-width: 2.2; }
.btn.lg { height: 44px; padding: 0 22px; font-size: 16px; }
.btn:disabled { background: #b9c9f1; cursor: default; transform: none; }
.link { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px; color: var(--accent); font-weight: 500; white-space: nowrap; transition: color 120ms ease, transform 160ms var(--ease-out); }
.link:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .link:hover { color: var(--accent-hover); } }
.link svg.i { width: 16px; height: 16px; }
.link.ink { color: var(--text); }
.link.ink svg.i { color: var(--faint); }
.icon-b { width: 36px; height: 36px; border-radius: var(--r-ctl); display: grid; place-items: center; color: var(--body); transition: background-color 120ms ease, transform 160ms var(--ease-out); }
.icon-b:active { transform: scale(0.95); }
@media (hover: hover) and (pointer: fine) { .icon-b:hover { background: var(--well); color: var(--ink); } }

/* KPI: compact cards that hug their figure */
.kpis { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.kpi { display: flex; align-items: center; gap: 12px; padding: 12px 22px 12px 12px; border-radius: var(--r-card); background: var(--band); }
.kpi .ki { width: 36px; height: 36px; border-radius: var(--r-ctl); display: grid; place-items: center; background: #fff; color: var(--body); box-shadow: 0 1px 2px rgb(16 24 40 / 6%); }
.kpi .kl { font-size: 14px; color: var(--body); }
.kpi .kv { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpi .kv.bad { color: var(--red); }
html[data-color="lark"] .kpi:nth-child(1) { background: var(--k1); } html[data-color="lark"] .kpi:nth-child(1) .ki { color: var(--k1i); }
html[data-color="lark"] .kpi:nth-child(2) { background: var(--k2); } html[data-color="lark"] .kpi:nth-child(2) .ki { color: var(--k2i); }
html[data-color="lark"] .kpi:nth-child(3) { background: var(--k3); } html[data-color="lark"] .kpi:nth-child(3) .ki { color: var(--k3i); }
html[data-color="lark"] .kpi:nth-child(4) { background: var(--k4); } html[data-color="lark"] .kpi:nth-child(4) .ki { color: var(--k4i); }
/* Icons off (Hari: "coba B dengan tanpa icon"): only the icons that work stay — search, ⌄, ›, ×, ⋯, ✓ */
html[data-icons="off"] .kpi .ki, html[data-icons="off"] .meta svg.i, html[data-icons="off"] .btn svg.i, html[data-icons="off"] .link:not(.ink) svg.i { display: none; }
html[data-icons="off"] .kpi { padding-left: 16px; }
html[data-color="mono"] .kpi .ki { display: none; }
html[data-color="mono"] .kpi { padding-left: 16px; }
/* grouped: the KPIs sit in one white group, split by hairlines (Apple Health summary) */
html[data-surface="grouped"] .kpis { gap: 0; display: inline-flex; background: #fff; border-radius: var(--r-card); padding: 4px; }
html[data-surface="grouped"] .kpi, html[data-surface="grouped"][data-color] .kpi:nth-child(n) { background: none; border-radius: 0; padding: 10px 24px 10px 14px; }
html[data-surface="grouped"] .kpi + .kpi { box-shadow: inset 1px 0 0 var(--hairline); }
html[data-surface="grouped"] .kpi .ki { box-shadow: none; background: var(--well); }

/* segmented control (Apple) */
.sc { display: inline-flex; padding: 3px; gap: 2px; border-radius: calc(var(--r-ctl) + 2px); background: #eeeff2; }
html[data-surface="grouped"] .sc { background: #e3e3e9; }
.sc button { height: 30px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 500; color: var(--body); transition: background-color 150ms ease, color 150ms ease; }
.sc button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgb(16 24 40 / 12%); }
.sc .c { margin-left: 4px; color: var(--faint); font-weight: 400; }
.bar { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
.bar .sp { flex: 1; }
.search { height: 36px; width: 280px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: var(--r-ctl); background: var(--well); color: var(--mute); }
html[data-surface="grouped"] .search { background: #e3e3e9; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); }
.search svg.i { width: 16px; height: 16px; }

/* table */
.grp { margin-top: 14px; background: var(--grp); border-radius: var(--r-card); }
html[data-surface="grouped"] .grp { padding: 4px 4px 6px; }
table.t { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
.t th { height: 40px; padding: 0 14px; background: var(--band); font-size: 14px; font-weight: 500; color: var(--body); text-align: left; white-space: nowrap; }
.t th:first-child { border-radius: var(--r-ctl) 0 0 var(--r-ctl); }
.t th:last-child { border-radius: 0 var(--r-ctl) var(--r-ctl) 0; }
html[data-surface="grouped"] .t th { height: 36px; color: var(--mute); }
.t td { height: 64px; padding: 0 14px; border-top: 1px solid var(--hairline); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t tbody tr:first-child td { border-top: 0; }
html[data-surface="grouped"] .t tbody tr:first-child td { border-top: 1px solid var(--hairline); }
.t .r { text-align: right; }
.t tbody tr.click { cursor: pointer; transition: background-color 120ms ease; }
@media (hover: hover) and (pointer: fine) { .t tbody tr.click:hover td { background: #f7f9fe; } }
.t tbody tr.click:active td { background: #f0f4fd; }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.who > div { min-width: 0; }
.sup { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.sub { color: var(--mute); font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.sub .mono { color: var(--body); }
.fig b { display: block; font-weight: 500; color: var(--ink); }
.fig small { display: block; font-size: 14px; color: var(--mute); }
.fig.zero b, .fig.zero small { color: var(--faint); font-weight: 400; }
.late { color: var(--red); font-weight: 500; }
.ava { width: 36px; height: 36px; flex-shrink: 0; border-radius: var(--r-ctl); display: grid; place-items: center; background: var(--ava); color: var(--ava-i); font-size: 14px; font-weight: 600; }
html[data-color="mono"] .ava.opt { display: none; }
/* status: Lark = soft chip, Mono = coloured dot + word */
.st { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-chip); font-size: 14px; font-weight: 500; }
.st i { display: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
html[data-color="lark"] .st.recv { background: var(--recv); color: var(--recv-i); }
html[data-color="lark"] .st.issued { background: #f0f1f4; color: var(--body); }
html[data-color="lark"] .st.late { background: #fff0f0; color: var(--red); }
html[data-color="mono"] .st { padding: 0; height: auto; color: var(--text); font-weight: 400; }
html[data-color="mono"] .st i { display: block; }
html[data-color="mono"] .st.recv i { background: var(--accent); } html[data-color="mono"] .st.issued i { background: #b6bbc4; } html[data-color="mono"] .st.late { color: var(--red); font-weight: 500; }
.chip { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: var(--r-chip); background: var(--well); color: var(--body); }

/* ── sheets (detail + create): float 8 from the edge ── */
.veil { position: absolute; inset: 0; z-index: 20; background: rgb(20 24 33 / 14%); opacity: 0; pointer-events: none; transition: opacity 200ms ease; }
.veil.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; z-index: 30; top: 8px; right: 8px; bottom: 8px; width: min(980px, calc(100% - 16px)); display: flex; flex-direction: column; background: #fff; border-radius: var(--r-sheet); box-shadow: 0 0 0 1px rgb(16 24 40 / 5%), 0 24px 64px rgb(16 24 40 / 16%); transform: translateX(24px); opacity: 0; pointer-events: none; transition: transform 160ms ease-in, opacity 160ms ease; }
.sheet.on { transform: none; opacity: 1; pointer-events: auto; transition: transform 260ms var(--ease-out), opacity 200ms ease; }
html[data-surface="grouped"] .sheet { background: #f2f2f7; }
.sheet.item { width: min(520px, calc(100% - 16px)); z-index: 50; }
.veil.v2 { z-index: 40; }
.sh-h { display: flex; align-items: flex-start; gap: 14px; padding: 22px 28px 10px; }
.sh-h .t { flex: 1; min-width: 0; }
.sh-h h2 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.015em; }
html[data-title="large"] .sh-h h2 { font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.022em; }
.sh-h .ava { width: 44px; height: 44px; border-radius: var(--r-card); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 10px; color: var(--body); }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg.i { width: 16px; height: 16px; color: var(--faint); }
.meta .bad, .meta .bad svg.i { color: var(--red); font-weight: 500; }
.sh-b { flex: 1; overflow: auto; padding: 8px 28px 28px; display: flex; flex-direction: column; gap: 18px; }
.sh-b > * { flex-shrink: 0; }
.sh-f { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-top: 1px solid var(--hairline); }
html[data-surface="grouped"] .sh-f { border-top: 0; background: rgb(242 242 247 / 82%); backdrop-filter: blur(20px) saturate(180%); }
.sh-f .sp { flex: 1; }
.sh-f .said { color: var(--body); font-variant-numeric: tabular-nums; }
.box { background: var(--grp); border-radius: var(--r-card); }
html[data-surface="grouped"] .box { padding: 4px 16px; }
html[data-surface="grouped"] .box.pad { padding: 16px; }
.sec-t { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
.sec-t .n { color: var(--mute); font-weight: 400; }
.sec-t .sp { flex: 1; }
html[data-surface="grouped"] .sec-t { padding: 0 4px; margin-bottom: 6px; font-size: 14px; color: var(--mute); font-weight: 500; text-transform: none; }
/* the items table inside a sheet */
.t.lines td { height: 60px; }
.thumb { width: 36px; height: 36px; flex-shrink: 0; border-radius: var(--r-ctl); display: grid; place-items: center; background: var(--ava); color: var(--ava-i); font-weight: 600; font-size: 14px; }
html[data-color="mono"] .thumb { background: var(--well); color: var(--body); }
.got { color: var(--green); font-weight: 500; }
.got svg.i { width: 15px; height: 15px; vertical-align: -2px; margin-right: 3px; stroke-width: 2.2; }
.t.lines .chev td:last-child { width: 40px; }
.t.lines .of { display: none; }
.t.lines tr.click td.cv { color: var(--faint); text-align: right; }
/* figures under the table: cards left, totals right */
.bottom { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.bottom .kpis { margin-top: 0; }
.tot > div { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 36px; color: var(--body); font-variant-numeric: tabular-nums; }
.tot > div > span:last-child { color: var(--ink); text-align: right; white-space: nowrap; }

    <div class="dock"><div class="cap"><button>Active ${IC.chevd}</button><span class="sep"></span><button class="grow">${IC.search}Search</button><button aria-label="Filter">${IC.filter}</button></div><button class="fab" data-go="create" aria-label="New PO">${IC.plus}</button></div>
    <div class="veil" id="veil"></div><aside class="sheet" id="sheet"></aside>
    <div class="veil v2" id="veil2"></div><aside class="sheet item" id="isheet"></aside>
    <div class="menu" id="menu"><button>${IC.print}Print</button><button>${IC.clock}Activity</button><hr /><button class="red">${IC.stop}Close short</button><button class="red">${IC.ban}Cancel order</button></div>`;
  $("page").innerHTML = listPage();
  const open = S.screen !== "list";
  if (open) $("sheet").innerHTML = S.screen === "detail" ? detailSheet(S.sel) : createSheet();
  $("sheet").classList.toggle("on", open);
  $("veil").classList.toggle("on", open);
  const io = F.item !== null && S.screen === "create";
  if (io) $("isheet").innerHTML = itemSheet(F.item);
  $("isheet").classList.toggle("on", io);
  $("veil2").classList.toggle("on", io);
  $("menu").classList.remove("on");
  document.documentElement.style.setProperty("--bar-h", $("proto").offsetHeight + "px");
}
function set(k, v) { S[k] = v; if (k === "screen" && v !== "create") F.item = null; render(); if(k === "device" && S.polish === "refined") $("page").scrollTop = 0; }
document.addEventListener("click", (e) => {
  const t = e.target;
  const seg = t.closest(".proto .seg[data-k] button");
  if (seg) return set(seg.parentElement.dataset.k, seg.dataset.v);
  const pr = t.closest("[data-p]");
  if (pr) { Object.assign(S, PRESETS[pr.dataset.p]); const url=new URL(location.href); url.searchParams.set('p',pr.dataset.p); if(root.dataset.review==='true') url.searchParams.set('review','1'); history.replaceState(null,'',url); return render(); }
  if (t.closest('[data-options]')) { $('proto').classList.toggle('expanded'); return; }
  if (t.closest('[data-overdue]')) { L.overdue=!L.overdue; L.tab='Active'; return render(); }
  const lt=t.closest('[data-list-tab]'); if(lt) { L.tab=lt.dataset.listTab; return render(); }
  if (!t.closest(".menu") && !t.closest("[data-menu]")) $("menu").classList.remove("on");
  if (t.closest("[data-menu]")) {
    const b = t.closest("[data-menu]").getBoundingClientRect(), a = $("app").getBoundingClientRect();
    const m = $("menu"); m.style.top = b.bottom - a.top + 6 + "px"; m.style.right = a.right - b.right + "px"; m.classList.toggle("on"); return;
  }
  if (t.closest("[data-close-item]")) { F.item = null; return render(); }
  if (t.closest("[data-close]") || t.id === "veil") return set("screen", "list");
  if (t.id === "veil2") { F.item = null; return render(); }
  if (t.closest("[data-edit]")) { F.edit = S.sel; F.sup = POS[S.sel][0]; return set("screen", "create"); }
  const go = t.closest("[data-go]"); if (go) { F.edit = null; F.sup = "Indorama, PT"; return set("screen", go.dataset.go); }
  const row = t.closest("tr[data-i]"); if (row) { S.sel = +row.dataset.i; return set("screen", "detail"); }
  const it = t.closest("[data-item]"); if (it) { F.item = it.dataset.item === "new" ? "new" : +it.dataset.item; return render(); }
  const u = t.closest("[data-u]");
  if (u && u.dataset.u !== F.unit) {
    const total = F.lines.reduce((a, l) => a + l[2] * l[4], 0);
    F.disc = u.dataset.u === "rp" ? Math.round(total * F.disc / 100) : Math.round((F.disc / total) * 10000) / 100;
    F.unit = u.dataset.u; return render();
  }
  const tab = t.closest("[data-tabs] button");
  if (tab) tab.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === tab)));
});
document.addEventListener('change', e=>{ if(e.target.matches('.supplier-filter')) { L.supplier=e.target.value; render(); } });
document.addEventListener("input", (e) => {
  if(e.target.id==='po-search') { const pos=e.target.selectionStart; L.query=e.target.value; $('page').innerHTML=refinedList(); const input=$('po-search'); input.focus(); input.setSelectionRange(pos,pos); return; }
  if (e.target.id !== "disc") return;
  const v = +String(e.target.value).replace(/[^\d,]/g, "").replace(",", ".") || 0;
  F.disc = v;
  const total = F.lines.reduce((a, l) => a + l[2] * l[4], 0), cut = F.unit === "pct" ? Math.round(total * v / 100) : v;
  document.querySelector(".sum .grand b").textContent = RP(total - cut);
});
addEventListener("keydown", (e) => {
  if (e.target.closest("input,select")) return;
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('tr[data-i]')) { e.preventDefault(); S.sel=+e.target.dataset.i; return set('screen','detail'); }
  if (e.key === "Escape") { if (F.item !== null) { F.item = null; render(); } else if (S.screen !== "list") set("screen", "list"); }
  const p = "ABCDE"["12345".indexOf(e.key)]; if (p) { Object.assign(S, PRESETS[p]); render(); }
});
new ResizeObserver(()=>root.style.setProperty('--bar-h', $('proto').offsetHeight+'px')).observe($('proto'));
render();
</script>
</body>
