<!doctype html>
<html lang="en" data-look="white">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report a
         real number, and the whole bottom of this app — the dock, the tab bar,
         a sheet's footer — is positioned clear of the home indicator with it.
         `user-scalable=no` because the back office is tapped fast with a thumb
         and a double-tap that zooms the screen mid-count is a fault, not a
         feature. `interactive-widget` so Android's keyboard shrinks the layout
         the way iOS's does, and a bottom-pinned button rises with it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Central" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Central</title>
    <!-- The launch screen, drawn before any script has loaded: white, the mark
         in the middle. React replaces it on first render with the same picture
         (`Launch` in `components/brand-mark.tsx`) while the session is asked,
         so nothing changes between the first paint and the sign-in page or the
         app that follows. -->
    <!-- The launch screen, drawn before any script has loaded: the shell's
         own silhouette — rail, screens panel, a content column — in the app's
         own values, so the first paint is the shape that follows rather than a
         logo that is replaced by one (owner, 2026-10-10: "hapus loading yang
         nampilin logo, kita maunya instant"). React clears it on first render
         and draws the same picture (`components/boot-skeleton.tsx`).
         Styled inline on purpose: this must paint before the stylesheet
         arrives, on a shop line where that is a second or two. -->
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        gap: 0.75rem;
        padding: 0.75rem 0.75rem 0.75rem 0;
        /* the hub's All white shell: grey, the panel and page white cards */
        background: #e8ebf0;
      }
      #boot .b-rail {
        flex: 0 0 4.25rem;
        margin: -0.75rem 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 0.875rem;
        gap: 1.375rem;
      }
      #boot .b-mark {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 0.375rem;
        background: #1d1d1f;
      }
      #boot .b-dot {
        width: 1.375rem;
        height: 1.375rem;
        border-radius: 0.4375rem;
        background: rgb(0 0 0 / 7%);
      }
      #boot .b-panel {
        flex: 0 0 13.5rem;
        background: #ffffff;
        border-radius: 16px;
        padding: 0.9375rem 0.875rem;
      }
      #boot .b-label,
      #boot .b-row,
      #boot .b-cell,
      #boot .b-head {
        border-radius: 0.375rem;
        background: #e6e6e9;
      }
      #boot .b-label {
        width: 6.5rem;
        height: 0.75rem;
        margin-bottom: 1rem;
      }
      #boot .b-row {
        height: 0.8125rem;
        margin-bottom: 0.75rem;
        background: #eaeaed;
      }
      #boot .b-body {
        flex: 1;
        padding: 1.5rem 1.75rem;
        background: #ffffff;
        border-radius: 16px;
      }
      #boot .b-head {
        width: 11rem;
        height: 1.125rem;
        margin-bottom: 1.25rem;
      }
      #boot .b-cell {
        height: 2.5rem;
        margin-bottom: 0.5rem;
        background: #f2f2f5;
      }
      #boot .b-cell:first-of-type {
        background: #eaeaed;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <div class="b-rail">
          <div class="b-mark"></div>
          <div class="b-dot"></div>
          <div class="b-dot"></div>
          <div class="b-dot"></div>
          <div class="b-dot"></div>
        </div>
        <div class="b-panel">
          <div class="b-label"></div>
          <div class="b-row"></div>
          <div class="b-row" style="width: 78%"></div>
          <div class="b-row" style="width: 86%"></div>
          <div class="b-row" style="width: 70%"></div>
        </div>
        <div class="b-body">
          <div class="b-head"></div>
          <div class="b-cell"></div>
          <div class="b-cell"></div>
          <div class="b-cell"></div>
          <div class="b-cell"></div>
          <div class="b-cell"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
