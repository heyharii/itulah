<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PO · Responsive preview</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,Inter,sans-serif;color:#303744;background:#eef0f3}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid #e1e5eb;position:sticky;top:0;z-index:2}nav{display:flex;gap:4px;background:#f3f4f6;padding:4px;border-radius:12px}button,select{font:inherit;min-height:40px;border:0;border-radius:9px;padding:0 14px;color:#515d6c;background:transparent;cursor:pointer}button[aria-pressed=true]{background:white;color:#242830;box-shadow:0 1px 3px #27374a12}select{border:1px solid #e1e5eb;background:white}label{display:flex;gap:8px;align-items:center}.size{color:#697383;margin-left:auto}main{display:flex;justify-content:center;padding:24px 16px 40px;overflow:auto}iframe{border:1px solid #dce1e8;border-radius:18px;box-shadow:0 8px 28px #26365312;background:white;flex:none}button:focus-visible,select:focus-visible{outline:2px solid #1d4ed8;outline-offset:3px}@media(max-width:650px){header{gap:10px;padding:10px 12px}.size{margin:0}main{justify-content:flex-start;padding:12px}}
</style></head><body><header><nav aria-label="Ukuran preview"><button data-device="mobile">Mobile</button><button data-device="tablet">Tablet</button><button data-device="desktop">Desktop</button></nav><label>Screen<select id="screen"><option value="detail">PO detail</option><option value="review-count">Review count</option><option value="receipt">Receipt example</option><option value="create">PO create</option><option value="list">PO list</option></select></label><span class="size" id="size"></span></header><main><iframe title="Purchase Orders responsive preview" id="preview"></iframe></main><script>
const params=new URLSearchParams(location.search),sizes={mobile:[390,844],tablet:[834,1112],desktop:[1440,1000]};let device=params.get('device')||'mobile';if(!sizes[device])device='mobile';const screen=document.getElementById('screen');screen.value=['detail','review-count','receipt','create','list'].includes(params.get('view'))?params.get('view'):'detail';function render(){const [w,h]=sizes[device];document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.device===device));const frame=document.getElementById('preview');frame.style.width=w+'px';frame.style.height=h+'px';const url='po-list-refined.html'+(screen.value==='list'?'':'?view='+screen.value);if(frame.getAttribute('src')!==url)frame.src=url;document.getElementById('size').textContent=w+' × '+h;history.replaceState(null,'','?device='+device+'&view='+screen.value)}document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{device=b.dataset.device;render()});screen.onchange=render;render();
</script></body></html>
