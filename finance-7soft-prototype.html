<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance · every 7Soft feature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="frontend-hub/design-system/tokens.css">
<link rel="stylesheet" href="frontend-hub/design-system/bundle.css">
<style>
:root{--font-sans:"Inter Variable","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--bar-h:57px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stone);font-family:var(--font-sans);font-size:15px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

/* ── prototype chrome (not part of the design) ── */
.pbar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:var(--bar-h);padding:10px 16px;background:#fff;border-bottom:1px solid var(--hairline)}
.pbar b{font-weight:600;margin-right:2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:var(--r-segment-track);background:var(--segment-track)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:var(--r-segment);color:var(--body);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-segment)}
.seg .star{color:var(--accent)}

/* ── desk shell (hub sizes) ── */
.stage{overflow-x:auto}
.shell{min-width:1260px;min-height:calc(100vh - var(--bar-h));align-items:flex-start}
.shell .ds-rail{position:sticky;top:var(--bar-h);align-self:flex-start}
.shell .ds-rail-btn{border-radius:var(--r-inner)}
.shell .ds-rail-btn .ds-ico{width:18px;height:18px}
.shell .ds-rail-btn.is-current{color:var(--accent)}
.shell .ds-rail .find{margin-bottom:10px;color:var(--rail-text)}
.shell .ds-panel{position:sticky;top:calc(var(--bar-h) + var(--float));display:flex;flex-direction:column;height:calc(100vh - var(--bar-h) - 2 * var(--float));padding:0}
.p-head{display:flex;align-items:center;height:52px;padding:0 8px 0 16px}
.p-head .ds-panel-title{flex:1;padding:0}
.p-fold{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:var(--r-inner);background:none;color:var(--body)}
@media (hover:hover){.p-fold:hover{background:var(--soft-2)}}
.shell .ds-rail-btn[role=button]{cursor:pointer}
.p-body{flex:1;padding:6px 10px;overflow:auto}
.p-body .ds-nav-row.is-active{font-weight:600}
.nav-label{display:inline-block;margin:14px 0 4px 10px;padding:0 7px;border-radius:var(--r-chip);background:var(--soft-2);color:var(--body);font-size:15px;line-height:22px}
.p-foot{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;font-weight:500;color:var(--panel-ink);font-variant-numeric:tabular-nums}
.p-foot .ds-ico{width:18px;height:18px;color:var(--line-ico)}
.shell .ds-page{min-height:calc(100vh - var(--bar-h) - 2 * var(--float));overflow:visible}

/* door head: title + actions, then the door's tabs (DoorTabs) */
.door-head{display:flex;flex-direction:column;gap:12px;margin:0 calc(-1 * var(--page-gutter)) 24px;padding:0 var(--page-gutter);border-bottom:1px solid var(--hairline)}
.door-top{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:36px}
.door-actions{position:relative;display:flex;align-items:center;gap:8px}
.door-tabs{margin-bottom:0;box-shadow:none}
.ds-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* figures that filter */
.kpis .ds-kpi{border:0;background:none;text-align:left;font:inherit;color:inherit}
.kpis button.ds-kpi{cursor:pointer}
@media (hover:hover){.kpis button.ds-kpi:hover .ds-kpi-label{color:var(--ink)}}
.kpis .ds-kpi.on .ds-kpi-label,.kpis .ds-kpi.on .ds-kpi-value{color:var(--accent)}
.page .kpis{margin-bottom:24px}

/* bar */
.sel{position:relative;flex:none}
.sel select{appearance:none;-webkit-appearance:none;height:var(--control);padding:0 34px 0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);font:inherit;color:var(--ink);cursor:pointer;outline:none}
.sel select:focus-visible{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.sel .ds-ico{position:absolute;right:11px;top:50%;margin-top:-8px;color:var(--line-ico);pointer-events:none}
.bar-count{color:var(--body);white-space:nowrap}
@media (max-width:1500px){.page .ds-search{flex-basis:200px}}
@media (max-width:1300px){.page .ds-search{flex-basis:160px}.page .chip{padding:0 10px}}

/* table */
.tbl{table-layout:fixed}
.tbl td{white-space:nowrap}
.tbl td:first-child{font-weight:400}
.tbl td.fx{white-space:normal;overflow-wrap:anywhere}
.tbl td.fx > *{display:block}
.tbl td.wrap{white-space:normal;overflow-wrap:anywhere}
.tbl td.wrap > *{display:block}
.tbl .nm{font-weight:500}
.tbl tr.grp td{padding:9px 16px;background:var(--band);color:var(--body);font-weight:500}
.tbl tr.opening td{color:var(--body)}
@media (hover:hover){.tbl tr.ds-opens:hover td{background:var(--soft)}}
.tbl td.act{text-align:right;padding-top:0;padding-bottom:0}
.tbl tfoot td{white-space:nowrap}
.mute{color:var(--body)}
.late{color:var(--bad-fg)}
.need{color:var(--warn-fg)}
.okc{display:inline-flex;align-items:center;gap:6px;color:var(--body)}
.okc .ds-ico{color:var(--ok-fg)}
.one{display:block;overflow:hidden;text-overflow:ellipsis}
.one .nm{font-weight:500}
.ds-btn--sm.cell{height:30px;padding:0 12px}
.tbl td.mcell{white-space:normal}
.mc{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mc-t{display:flex;flex-direction:column;min-width:0}

/* the New menu (Menu card) */
.menu{position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:220px;padding:5px;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);box-shadow:var(--shadow-pop);transform-origin:top right;animation:pop var(--t-pop) var(--ease-out)}
.menu button{display:flex;justify-content:space-between;gap:16px;width:100%;padding:7px 8px;border:0;border-radius:var(--r-inner);background:none;text-align:left;white-space:nowrap}
@media (hover:hover){.menu button:hover{background:var(--soft-2)}}
@keyframes pop{from{opacity:0;transform:scale(.97)}}

/* layers: a sheet slides in from the right; what's under it dims and stays put */
.layers{position:fixed;inset:0;z-index:60;pointer-events:none}
.layers.open{pointer-events:auto}
.layers .veil{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;transition:opacity var(--t-sheet) var(--ease-out)}
.layers.open .veil{opacity:1}
.sheet-wrap{position:absolute;top:var(--float);right:var(--float);bottom:var(--float);display:flex;max-width:calc(100vw - 2 * var(--float));transform:translateX(calc(100% + 24px));transition:transform var(--t-sheet) var(--ease-drawer)}
.sheet-wrap.on{transform:none}
.sheet-wrap.out{transform:translateX(calc(100% + 24px));transition:transform var(--t-exit) var(--ease-out)}
.sheet-wrap .ds-sheet{height:100%;max-width:calc(100vw - 2 * var(--float))}
.sheet-wrap .ds-sheet-body{flex:1;overflow:auto}
.sheet-wrap.under .ds-sheet::after{content:"";position:absolute;inset:0;z-index:5;border-radius:inherit;background:var(--scrim)}
.ds-sheet--rail{width:var(--sheet-rail)}
.ds-sheet--wide{width:var(--sheet-wide)}
.ds-sheet--workspace{width:var(--sheet-workspace)}
.sheet-wrap .ds-kpis{margin-bottom:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.foot-left{margin-right:auto}
.acts{display:flex;flex-direction:column;gap:6px}
.acts div{display:flex;gap:16px}
.acts .mute{flex:none;width:112px}
.purpose{line-height:22px}

/* E · one account: two big balances, money in beside money out */
.bal2{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--hairline);border-radius:var(--r-card)}
.bal2 > div{padding:20px 24px}
.bal2 > div + div{border-left:1px solid var(--hairline)}
.bal2 .big{margin:6px 0 2px;font-size:24px;line-height:30px;font-weight:600;letter-spacing:-0.6px;font-variant-numeric:tabular-nums}
.kpi-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.kpi-row .kpis{flex:1;min-width:0}
.toasts{position:fixed;left:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toasts .ds-toast{align-items:center;transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
.toasts .ds-toast.in{animation:toast-in 220ms var(--ease-out)}
.toasts .ds-toast.gone{opacity:0;transform:translateY(6px)}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}}
.ds-toast-action{cursor:pointer}

/* filters are icon radios: icon, word, count; one picked */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:var(--control);padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);color:var(--ink);font-weight:500;white-space:nowrap;transition:background-color var(--t-hover) var(--ease-out),color var(--t-hover) var(--ease-out),scale var(--t-press) var(--ease-out)}
.chip .ds-ico{color:var(--line-ico)}
.chip .n{color:var(--body);font-weight:400;font-variant-numeric:tabular-nums}
.chip[aria-checked="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.chip[aria-checked="true"] .ds-ico,.chip[aria-checked="true"] .n{color:var(--accent)}
.chips.seg{gap:2px;padding:3px;background:var(--soft-2);border-radius:var(--r-inner)}
.chips.seg .chip{height:calc(var(--control) - 6px);border:0;border-radius:6px;background:transparent;color:var(--body)}
.chips.seg .chip .ds-ico{color:var(--body)}
.chips.seg .chip[aria-checked="true"]{background:var(--canvas);color:var(--ink);box-shadow:var(--shadow-segment)}
.chips.seg .chip[aria-checked="true"] .ds-ico{color:var(--ink)}
@media (hover:hover){.chip[aria-checked="false"]:hover{background:var(--soft-2)}}
.chip:active{scale:.97}

/* ── this prototype ── */
.pbar .sp{flex:1}
.pbar small{color:var(--body)}
.nav-row-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:0 10px;height:34px;border-radius:var(--r-inner);color:var(--panel-ink)}
@media (hover:hover){.nav-row-btn:hover{background:var(--soft-2)}}
.nav-row-btn.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav-row-btn .tag7{font-size:15px;color:var(--body);font-weight:400}
.page-sub{color:var(--body);margin:-8px 0 16px}
.bar-spacer{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card7{border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);padding:20px 24px}
.card7 h3{margin:0 0 12px;font-size:16px;font-weight:600}
.field7{display:flex;flex-direction:column;gap:6px;min-width:0}
.field7>span{font-weight:500}
.field7 input,.field7 select{height:44px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);font:inherit;color:var(--ink)}
.field7 input:focus,.field7 select:focus{outline:0;border-color:var(--accent);box-shadow:var(--shadow-focus)}
.field7 input[readonly]{background:var(--soft);color:var(--body)}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 24px;margin-bottom:24px}
.form-grid .span2{grid-column:span 2}
.form-grid .span4{grid-column:span 4}
.tbl td.is-num,.tbl th.is-num{text-align:right}
.tbl tr.total td{font-weight:600;border-top:2px solid var(--ink)}
.cb7{width:18px;height:18px;accent-color:var(--accent)}
.empty-note{padding:40px;text-align:center;color:var(--body)}
.tree-row{display:flex;align-items:center;gap:10px;height:40px;padding-right:16px;border-bottom:1px solid var(--hairline)}
.tree-row .code{font-variant-numeric:tabular-nums;color:var(--body);min-width:120px}
.tree-row .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.ok{color:var(--ok-fg)}.bad{color:var(--bad-fg)}.warn{color:var(--warn-fg)}
.t7{table-layout:fixed}
.pill7{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--r-chip);background:var(--soft-2);color:var(--body);font-size:15px}
.pill7.ok{background:var(--ok-bg);color:var(--ok-fg)}.pill7.bad{background:var(--bad-bg);color:var(--bad-fg)}.pill7.warn{background:var(--warn-bg);color:var(--warn-fg)}

.v7bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 20px}
.v7note{color:var(--body);min-width:0;overflow-wrap:anywhere}
.chips.seg .chip{font-size:15px}

.ba{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.ba-col{min-width:0}
.ba-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.ba-tag{display:inline-flex;align-items:center;flex:none;height:28px;padding:0 12px;border-radius:var(--r-chip);font-weight:600}
.ba-tag.b{background:var(--soft-2);color:var(--ink)}
.ba-tag.a{background:var(--accent-bg);color:var(--accent)}
.ba-frame{border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);padding:16px;overflow-x:auto}
.ba-zoom{}
/* a dense screen is compared top-to-bottom so its table keeps its real size */
.ba--stack{grid-template-columns:minmax(0,1fr);gap:28px}
.ba--stack .ba-col.b .shots{max-width:1280px}
.ba--stack .ba-col.a .ba-frame{margin-top:0}
.ba--stack .ba-head{margin-bottom:12px}

.shots{display:flex;flex-direction:column;gap:16px}
.shot{margin:0}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--hairline);border-radius:var(--r-inner);image-rendering:auto}
.shot figcaption{margin-top:6px;color:var(--body)}
.ba-col.b .ba-zoom,.ba-col .shots{zoom:1}
.ba-col:first-child .ba-zoom{zoom:1}
.shots.big{max-width:1280px}

/* history: an audit log, read as a table */
.hist-bar{row-gap:10px}
.hist-bar .sel select{min-width:156px}
.hist-filters{margin-bottom:12px}
.hist-filters .chips{row-gap:6px}
.hist-kpis{flex-wrap:wrap}
.hist-kpis button.ds-kpi{cursor:pointer;border-radius:var(--r-inner);transition:background-color var(--t-hover) var(--ease-out)}
.hist-kpis button.ds-kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){.hist-kpis button.ds-kpi:hover{background:var(--soft)}}
.hact{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.hact::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-ico)}
.hact--added::before{background:var(--ok-fg)}
.hact--edited::before{background:var(--warn-fg)}
.hact--deleted::before{background:var(--bad-fg)}
.hact--exported::before{background:var(--accent)}
.hist-note{margin:0 0 16px;color:var(--body);max-width:70ch}
.hist-pager{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
.hist-pager .bar-count{margin-left:auto;padding-left:12px}
.hist-pager .ds-btn{height:30px;padding:0 10px}
.doc-wrap,.cell-wrap{white-space:normal!important;overflow:visible;text-overflow:clip;line-height:1.3}
.hist-table-wrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas)}
.hist-table-wrap .ds-table-card{border:0;border-radius:0;overflow:visible}
.hist-table-wrap .tbl{min-width:1080px}
.hist-foot{display:flex;justify-content:space-between;gap:16px;margin-top:10px;color:var(--body)}
.hist-foot .hist-sort{white-space:nowrap}

/* print: the audit trail itself, without the prototype chrome */
@media print{
  .pbar,.ds-rail,.ds-panel,.v7bar,.door-actions,.ds-bar,.hist-filters,.hist-pager{display:none!important}
  body{background:#fff}
  .stage{overflow:visible}
  .shell{display:block;min-width:0}
  .ds-page{min-height:0}
  .ds-page-content{padding:0}
  .ba{display:block!important}
  .ba-col.b{display:none!important}
  .ba-col.a .ba-frame{border:0;padding:0;overflow:visible}
  .ba-col.a .ba-zoom{width:auto!important;zoom:1!important}
  .kpis{margin-bottom:12px}
  .hist-table-wrap{overflow:visible;border:0}
  .hist-table-wrap .ds-table-card{border:1px solid var(--hairline)}
  .hist-table-wrap .tbl{min-width:0}
  .tbl{font-size:10.5px}
  .tbl th,.tbl td{padding:4px 8px}
  .tbl tr{break-inside:avoid}
  .hist-foot{display:flex!important}
  @page{margin:10mm}
}

.cov{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin:0 0 20px}
.cov-card{border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cov-t{font-weight:600}
.cov-n{color:var(--body)}
.cov-miss{margin:0;padding-left:18px;color:var(--ink)}
.cov-miss li{margin:2px 0}

</style>
</head>
<body>
<div class="pbar"><b>Finance</b><small>Every 7Soft finance feature, in Central's design · Central Fashion Store books</small><span class="sp"></span><small id="pcount"></small></div>
<div class="stage" id="stage"></div>
<div class="layers" id="layers"></div>
<div class="toasts" id="toasts"></div>
<script>

function invJournal(F) {
  const c = calc(F.lines, F.dm, F.dv, F.ppn), loc = F.wh, vat = c.tax ? [[A.vat, c.tax, 0]] : []
  const out = []
  if (F.type === 'U') out.push({ title: 'Down payment invoice', rows: [[A.um, c.grand, 0], [A.ap, 0, c.grand]] })
  else if (F.type === 'M' && F.grn) out.push({ title: 'Matching invoice, goods already received', rows: [[A.susp, c.net, 0], ...vat, [A.ap, 0, c.grand]] })
  else out.push({ title: F.type === 'M' ? 'Matching invoice, no receipt yet' : 'Standard invoice', rows: [[A.stock, c.net, 0], ...vat, [A.ap, 0, c.grand]] })
  const ap = sum(F.um, u => u.amt)
  if (ap) out.push({ title: 'Down payment applied', rows: [[A.ap, ap, 0], [A.um, 0, ap]] })
  return { blocks: out, loc }
}
function retJournal(src, c) {
  const vat = c.tax ? [[A.vat, 0, c.tax]] : []
  return { loc: src.wh, blocks: [{ title: src.grn ? 'Return of received goods' : 'Return without receipt', rows: [[A.ap, c.grand, 0], [src.grn ? A.susp : A.stock, 0, c.net], ...vat] }] }
}
function vchJournal(p) {
  const cash = sum(p.lines, l => l.pay), disc = sum(p.lines, l => l.disc), apn = cash + disc
  const rows = []
  if (apn > 0) rows.push([A.ap, apn, 0]); else if (apn < 0) rows.push([A.ap, 0, -apn])
  if (cash > 0) rows.push([p.acct, 0, cash]); else if (cash < 0) rows.push([p.acct, -cash, 0])
  if (disc) rows.push([A.disc, 0, disc])
  return { loc: 'HO', blocks: [{ title: p.method === 'Giro' ? 'Payment by giro' : cash < 0 ? 'Money received' : 'Payment', rows }] }
}
function journalSheet(j, crumb, title) {
  const body = j.blocks.map(b => section(b.title, table({
    cols: [{ l: 'Account', k: 'a' }, { l: 'Debit', k: 'd', num: 1, w: 150 }, { l: 'Credit', k: 'c', num: 1, w: 150 }],
    rows: b.rows.map(([a, d, c]) => ({ c: { a: accRow(a, j.loc), d: z(d), c: z(c) } })),
    foot: { a: 'Total', d: num(sum(b.rows, r => r[1])), c: num(sum(b.rows, r => r[2])) },

}

const RT = { no: '', isNew: true, date: TODAY, sup: 'S-0077', src: '', qty: [], ref: '' }
const srcOf = () => INV.find(i => i.no === RT.src)
const invsOf = s => INV.filter(i => i.sup === s && i.type !== 'U').sort((a, b) => b.date.localeCompare(a.date))
function newRet() { Object.assign(RT, { isNew: true, no: 'RBL-26-10-' + String(1 + Math.max(...RET.map(r => +r.no.slice(-5)))).padStart(5, '0'), date: TODAY, ref: '' }); setSrc(RT.sup, invsOf(RT.sup)[0].no) }
function setSrc(s, no) { RT.sup = s; RT.src = no; const l = srcOf().lines; RT.qty = l.map((x, i) => i === 0 && x.item !== 'Freight & handling' ? Math.min(2, x.q) : 0) }
function loadRet(no) { const r = RET.find(x => x.no === no); Object.assign(RT, { isNew: false, no, date: r.date, sup: r.sup, src: r.src, qty: r.qty.slice(), ref: r.ref }) }
window.buyRLoad = v => { v === '__new' ? newRet() : loadRet(v); S.f['buy-return'] = { mode: 'partial' }; render() }
window.buyR = (k, v) => { if (k === 'sup') setSrc(v, invsOf(v)[0].no); else if (k === 'src') setSrc(RT.sup, v); else RT[k] = v; render() }
window.buyRq = (i, v) => { RT.qty[i] = Math.min(Math.max(0, pn(v)), srcOf().lines[i].q); render() }
const rqEff = () => filt('buy-return', 'mode', 'partial') === 'full' ? srcOf().lines.map(l => l.q) : RT.qty
window.buyRJournal = () => { const c = retCalc(srcOf(), rqEff()); journalSheet(retJournal(srcOf(), c), ['Purchase return', RT.no], 'Journal') }
window.buyRSave = () => {
  const src = srcOf(); if (!src) return
  const qty = rqEff(), c = retCalc(src, qty)
  const due = addD(RT.date, TERM_DAYS[supOf(RT.sup).term])
  const d = RET.find(r => r.no === RT.no)
  if (d) Object.assign(d, { date: RT.date, sup: RT.sup, src: RT.src, qty: qty.slice(), ref: RT.ref, due, calc: c, amt: -c.grand, grn: src.grn, ppn: src.ppn })

  SHM[loc] = { name: SHOP[loc], days, fl, cc: lastDep, pc: addD('2026-10-26', -Math.floor(r() * 9)), fc: fl.length ? fl[fl.length - 1].date : '', short: s.shorts || {} }
})

/* ═════════ numbering, journal lines, entries ═════════ */
RAW.sort((x, y) => x.date.localeCompare(y.date) || x.i - y.i)
const VOUCHERS = RAW, VBY = {}, seq = {}
VOUCHERS.forEach(v => {
  const loc = locOf(v.acct), k = `${v.type}|${loc}|${v.date.slice(2, 7)}`
  seq[k] = (seq[k] || 0) + 1
  v.loc = loc
  v.no = loc === 'HO' ? `${v.type}-${v.date.slice(2, 4)}-${v.date.slice(5, 7)}-${pad(seq[k], 5)}` : `${v.type}-${loc}-${v.date.slice(2, 4)}-${v.date.slice(5, 7)}-${pad(seq[k], 4)}`
  v.period = perOf(v.date)
  v.total = v.lines.reduce((a, l) => a + (l.t === 's' ? l.pay : l.amt), 0)
  VBY[v.no] = v
})
VOUCHERS.forEach(v => {
  const bkk = v.type === 'BKK', jr = []
  jr.push(bkk ? { acc: v.acct, dr: 0, cr: v.total } : { acc: v.acct, dr: v.total, cr: 0 })
  v.lines.forEach(l => {
    if (l.t === 's') {
      const ac = l.acc || (bkk ? AP : AR), side = n => bkk ? { dr: n, cr: 0 } : { dr: 0, cr: n }, other = n => bkk ? { dr: 0, cr: n } : { dr: n, cr: 0 }
      jr.push({ acc: ac, ...side(l.pay + l.pot) })
      if (l.pot) jr.push({ acc: l.potAcc, ...other(l.pot) })
    } else jr.push({ acc: l.acc, dr: bkk ? l.amt : 0, cr: bkk ? 0 : l.amt })
  })
  v.jr = jr
  if (v.replaces) { const g = VOUCHERS.find(x => x.giro && x.giro.no === v.replaces); if (g) g.repl = v.no }
})
const partyOf = (v, acc) => {
  if (v.party && v.party.name) return v.party.name
  if (acc === v.acct) { const o = v.jr.find(r => r.acc !== v.acct); return o ? alab(o.acc) : '' }
  return alab(v.acct)
}
const ENT = []
const push = (acc, date, no, type, party, dr, cr, v) => { if (AM[acc]) ENT.push({ acc, date, no, type, party, dr, cr, v, i: ENT.length }) }
VOUCHERS.forEach(v => {
  v.jr.forEach(r => push(r.acc, v.date, v.no, v.type, partyOf(v, r.acc), r.dr, r.cr, v))
  const g = v.giro
  if (g && g.state === 'Cleared' && g.on <= TODAY) { push(g.bank, g.on, v.no, 'Giro cleared', partyOf(v, v.acct), 0, v.total, v); push(v.acct, g.on, v.no, 'Giro cleared', partyOf(v, v.acct), v.total, 0, v) }
  if (g && g.state === 'Bounced' && g.on <= TODAY) push(v.acct, g.on, v.no, 'Giro bounced', partyOf(v, v.acct), v.total, 0, v)
})
SALES.forEach(s => push(a12(CASH, s.loc), s.date, `SD-${s.loc}-${s.date.slice(2, 4)}-${s.date.slice(5, 7)}-${s.date.slice(8)}`, 'Daily sales', 'Cash sales', s.amt, 0, null))
ENT.sort((x, y) => x.date.localeCompare(y.date) || x.i - y.i)
const E_BY = {}
ENT.forEach(e => (E_BY[e.acc] = E_BY[e.acc] || []).push(e))
/* runtime postings must reach both the flat list and the per-account index */
function postEntry(acc, date, no, type, party, dr, cr, v) {
  if (!AM[acc]) return
  const e = { acc, date, no, type, party, dr, cr, v, i: ENT.length }
  ENT.push(e); (E_BY[acc] = E_BY[acc] || []).push(e)
  E_BY[acc].sort((a, b) => a.date.localeCompare(b.date))
}

/* opening balances: head office from the books at 1 Oct, the shops from their last count; 1 Sep is derived */
const net = (acc, before) => (E_BY[acc] || []).reduce((a, e) => a + (e.date < before ? e.dr - e.cr : 0), 0)
const OCT_HO = { [a12(CASH)]: KAS[0].open, [a12(PETTY)]: KAS[1].open, [a12(FLOAT)]: KAS[2].open, [BCA]: KAS[3].open, [MDR]: KAS[4].open, [TAB]: KAS[5].open }
OCT_HO[OGB] = -VOUCHERS.filter(v => v.giro && v.acct === OGB && v.date < '2026-10-01' && (!v.giro.on || v.giro.on >= '2026-10-01')).reduce((a, v) => a + v.total, 0)
OCT_HO[OGM] = -VOUCHERS.filter(v => v.giro && v.acct === OGM && v.date < '2026-10-01' && (!v.giro.on || v.giro.on >= '2026-10-01')).reduce((a, v) => a + v.total, 0)
Object.keys(OCT_HO).forEach(a => { OPEN0[a] = OCT_HO[a] - net(a, '2026-10-01') })
ACCTS.forEach(a => { if (OPEN0[a.code] == null) OPEN0[a.code] = 0 })

function flows(acc, p) {
  const es = E_BY[acc] || []; let open = OPEN0[acc] || 0, dr = 0, cr = 0
  for (const e of es) { if (e.date < p.from) open += e.dr - e.cr; else if (e.date <= p.to) { dr += e.dr; cr += e.cr } }
  return { open, dr, cr, close: open + dr - cr }
}
const bal = (acc, to = TODAY) => flows(acc, { from: '0000', to }).close
const entriesIn = (acc, p) => (E_BY[acc] || []).filter(e => e.date >= p.from && e.date <= p.to)

/* ── reconciliation: statement lines vs book entries ──
   The bank statement is the book plus the lines the bank knows and the books do not.
   A line can be matched to its voucher, ignored, or turned into a real BKK/BKM. */
const EXTRA_LINES = acc => {
  if (acc !== BCA && acc !== MDR) return []
  const base = `${acc}|extra`
  return [
    { id: `${base}|charge`, date: '2026-10-26', desc: 'Bank charges · October', amount: -25000, extra: true },
    ...(acc === BCA ? [{ id: `${base}|credit`, date: '2026-10-24', desc: 'Transfer from Toko Maju Jaya', amount: 12500000, extra: true }] : []),
  ]
}
const reconState = (id, fallback) => (RECON_STATE[id] = RECON_STATE[id] || { state: fallback, match: '' })
function stmtFor(acc, p) {
  const rows = []
  entriesIn(acc, p).forEach(e => {
    const id = `${acc}|${e.no}|${e.date}|${e.type}|${e.dr - e.cr}`
    const h = [...id].reduce((a, c) => a + c.charCodeAt(0), 0)
    const st = reconState(id, e.date < TODAY && h % 31 === 0 ? 'unmatched' : 'matched')
    if (st.state === 'posted') return
    rows.push({ id, date: e.date, desc: `${e.type} · ${e.party || an(acc)}`, amount: e.dr - e.cr, doc: e.no, extra: false, state: st.state, match: st.match || (st.state === 'matched' ? e.no : '') })
  })
  EXTRA_LINES(acc).forEach(x => {
    const st = reconState(x.id, 'unmatched')
    if (st.state === 'posted') return
    rows.push({ ...x, doc: '', state: st.state, match: st.match || '' })
  })
  return rows.sort((a, b) => a.date.localeCompare(b.date))
}
function reconSummary(acc, p) {
  const lines = stmtFor(acc, p), book = flows(acc, p).close
  const openExtras = lines.filter(l => l.extra && l.state !== 'ignored')
  const extraNet = openExtras.reduce((a, l) => a + l.amount, 0)
  const statement = book + extraNet
  return { lines, book, statement, diff: statement - book, extraNet, unmatched: lines.filter(l => l.state === 'unmatched').length, ignored: lines.filter(l => l.state === 'ignored').length, openExtras }
}
const bankAccount = () => {

}

const EXP_ACCS = ['6010310004', '6010310002', '6010310005', '6010410007', '6010110007', '6010310003', '6010310006']
const INC_ACCS = ['8010110007', '8010110001', '8010110003']
function postVoucher({ type, date, acct, party, note, contra, amt }) {
  const no = `${type}-${date.slice(2, 4)}-${date.slice(5, 7)}-${String(POST_SEQ++).padStart(4, '0')}`
  const v = { type, date, acct, party: party || NOP, note, lines: [{ t: 'o', acc: contra, desc: note, amt }], by: 'Rina Kusuma', loc: locOf(acct), no, period: perOf(date), total: amt }
  v.jr = type === 'BKK'
    ? [{ acc: acct, dr: 0, cr: amt }, { acc: contra, dr: amt, cr: 0 }]
    : [{ acc: acct, dr: amt, cr: 0 }, { acc: contra, dr: 0, cr: amt }]
  VOUCHERS.push(v); VBY[no] = v
  postEntry(acct, date, no, type, (party && party.name) || note, type === 'BKM' ? amt : 0, type === 'BKK' ? amt : 0, v)
  return v
}
function voucherForm(type, opts = {}) {
  const isIn = type === 'BKM'
  const accs = ACCTS.filter(a => a.active && a.grp !== 'Giro')
  const acctOpts = accs.map(a => `<option value="${a.code}" ${a.code === (opts.acct || BCA) ? 'selected' : ''}>${a.code} · ${esc(a.name)} ${a.loc}</option>`).join('')
  const contra = isIn ? INC_ACCS : EXP_ACCS
  const contraOpts = contra.map(c => `<option value="${c}" ${c === (opts.contra || contra[0]) ? 'selected' : ''}>${c} · ${esc(accName(c))}</option>`).join('')
  const body = `<div class="form-grid">
    ${field('Date', `<input type="date" id="nv-date" value="${opts.date || TODAY}">`)}
    ${field(isIn ? 'Received into' : 'Paid from', `<select id="nv-acct">${acctOpts}</select>`)}
    ${field('Amount', `<input id="nv-amt" inputmode="numeric" value="${opts.amt ? num(opts.amt) : ''}" placeholder="0">`)}
    ${field(isIn ? 'Income account' : 'Expense account', `<select id="nv-contra">${contraOpts}</select>`)}
    ${field('Party', `<input id="nv-party" value="${opts.party ? esc(opts.party) : ''}" placeholder="Name on the document">`, 'span2')}
    ${field('Note', `<input id="nv-note" value="${opts.note ? esc(opts.note) : ''}" placeholder="What this is for">`, 'span2')}
  </div><p class="page-sub">Posting here changes the demo ledger immediately: the account balance, the ledger card, the reports and the reconciliation all read it.</p>`
  openSheet({
    crumb: ['Cash & bank', type], title: opts.title || `New ${type}`, size: 'wide', body,
    foot: btn(`Post ${type}`, `saveVoucher('${type}')`),
  })
}
window.openNewVoucher = type => voucherForm(type)
window.saveVoucher = type => {
  const el = id => document.getElementById(id)
  const acct = el('nv-acct')?.value, date = el('nv-date')?.value, contra = el('nv-contra')?.value
  const amt = toNum(el('nv-amt')?.value), party = (el('nv-party')?.value || '').trim(), note = (el('nv-note')?.value || '').trim()
  if (!acct || !date || !contra || !amt) return toast('Check the document', 'Date, account, amount and account code are required')
  const v = postVoucher({ type, date, acct, party: P('', party), note: note || `${type} ${date}`, contra, amt })
  closeSheet(); toast(`${type} posted`, `${v.no} · ${money(amt)}`); render()
}

    ${field('Date', `<input type="date" id="tr-date" value="${TODAY}">`)}
    ${field('Amount', `<input id="tr-amt" inputmode="numeric" value="${amtPref ? num(Math.round(amtPref)) : ''}" placeholder="0">`)}
    ${field('Note', `<input id="tr-note" value="Transfer between accounts">`, 'span2')}
  </div><p class="page-sub">A transfer posts both sides: money out of one cash/bank account and into the other. A shop deposit is the same movement, from the shop's cash box to its bank.</p>`

    foot: btn('Post transfer', 'saveTransfer()'),

window.openTransfer = (from, to, amt) => transferForm(from, to, amt)
window.saveTransfer = () => {
  const el = id => document.getElementById(id)
  const from = el('tr-from')?.value, to = el('tr-to')?.value, date = el('tr-date')?.value, amt = toNum(el('tr-amt')?.value)
  const note = (el('tr-note')?.value || '').trim() || 'Transfer between accounts'
  if (!from || !to || !date || !amt) return toast('Check the transfer', 'From, to, date and amount are required')
  if (from === to) return toast('Pick two different accounts', 'A transfer needs a source and a destination')
  const no = `TRF-${date.slice(2, 4)}-${date.slice(5, 7)}-${String(TRF_SEQ++).padStart(4, '0')}`
  const v = { type: 'BKK', date, acct: from, party: NOP, note, lines: [{ t: 'o', acc: to, desc: note, amt }], by: 'Rina Kusuma', loc: locOf(from), no, period: perOf(date), total: amt, transfer: true }
  v.jr = [{ acc: from, dr: 0, cr: amt }, { acc: to, dr: amt, cr: 0 }]
  VOUCHERS.push(v); VBY[no] = v
  postEntry(from, date, no, 'Transfer', note, 0, amt, v)
  postEntry(to, date, no, 'Transfer', note, amt, 0, v)
  const fromAcc = AM[from]
  if (fromAcc && fromAcc.base === CASH && SHM[fromAcc.loc]) SHM[fromAcc.loc].cc = date
  closeSheet(); toast('Transfer posted', `${money(amt)} · ${an(from)} → ${an(to)}`); render()
}

window.matchLine = id => {
  const p = periodNow(), line = stmtFor(bankAccount(), p).find(l => l.id === id)
  if (!line) return
  if (line.extra) return openLineEntry(id)
  RECON_STATE[id] = { state: 'matched', match: line.doc }
  toast('Line matched', `${line.doc} · ${money(line.amount)}`); render()
}
window.unmatchLine = id => { RECON_STATE[id] = { state: 'unmatched', match: '' }; render() }
window.ignoreLine = id => { RECON_STATE[id] = { state: 'ignored', match: '' }; render() }
window.restoreLine = id => { RECON_STATE[id] = { state: 'unmatched', match: '' }; render() }
window.finishRecon = () => {
  const acc = bankAccount(), p = periodNow(), s = reconSummary(acc, p)
  if (s.diff !== 0 || s.unmatched !== 0) return toast('Reconciliation is not finished', `${s.unmatched} line(s) open · difference ${money(s.diff)}`)
  RECON_DONE[acc] = TODAY
  toast('Reconciled', `${an(acc)} · ${day(TODAY)}`); render()
}
function openLineEntry(id) {
  const acc = bankAccount(), p = periodNow(), line = stmtFor(acc, p).find(l => l.id === id)
  if (!line || !line.extra) return
  const type = line.amount < 0 ? 'BKK' : 'BKM'
  const contra = type === 'BKK' ? EXP_ACCS : INC_ACCS
  const contraOpts = contra.map(c => `<option value="${c}" ${c === (type === 'BKK' ? '6010310004' : '8010110007') ? 'selected' : ''}>${c} · ${esc(accName(c))}</option>`).join('')
  const body = `<div class="form-grid">
    ${field('Date', `<input value="${day(line.date)}" readonly>`)}
    ${field(type === 'BKK' ? 'Paid from' : 'Received into', `<input value="${acc} · ${esc(an(acc))}" readonly>`)}
    ${field('Amount', `<input value="${num(Math.abs(line.amount))}" readonly>`)}
    ${field(type === 'BKK' ? 'Expense account' : 'Income account', `<select id="le-contra">${contraOpts}</select>`)}
    ${field('Party', `<input id="le-party" value="${esc(line.desc)}">`, 'span2')}
    ${field('Note', `<input id="le-note" value="${esc(line.desc)}">`, 'span2')}
  </div><p class="page-sub">This bank line is not in the books yet. Posting it creates a real ${type} and moves the book balance to the statement.</p>`
  openSheet({ crumb: ['Cash & bank', 'Reconciliation'], title: line.desc, size: 'wide', body, foot: btn(`Post ${type}`, `saveLineEntry('${id}')`) })
}
window.openLineEntry = openLineEntry
window.saveLineEntry = id => {
  const el = id => document.getElementById(id)
  const acc = bankAccount(), p = periodNow(), line = stmtFor(acc, p).find(l => l.id === id)
  if (!line) return
  const type = line.amount < 0 ? 'BKK' : 'BKM'
  const contra = el('le-contra')?.value, party = (el('le-party')?.value || '').trim(), note = (el('le-note')?.value || '').trim()
  const v = postVoucher({ type, date: line.date, acct: acc, party: P('', party), note: note || line.desc, contra, amt: Math.abs(line.amount) })
  RECON_STATE[id] = { state: 'posted', match: v.no }

}

window.openCard = code => { (S.f[ID] = S.f[ID] || {}).acct = code; setTab(ID, 'card') }
function reconCell(a, p) {
  if (a.grp === 'Giro') return `<span class="mute">Giro register</span>`
  if (a.grp === 'Cash') {
    const c = countOf(a.loc), diff = c.diff || 0
    return c.date ? `<span class="${diff ? 'late' : ''}">${diff ? money(diff) : 'Counted'}</span><span class="mute"> · ${dayS(c.date)}</span>` : `<span class="mute">Not counted</span>`
  }
  if (!entriesIn(a.code, p).length) return `<span class="mute">No statement</span>`
  const s = reconSummary(a.code, p)
  if (s.diff === 0 && s.unmatched === 0) return `${pill('Reconciled', 'ok')}<span class="mute"> ${RECON_DONE[a.code] ? dayS(RECON_DONE[a.code]) : ''}</span>`
  return `<span class="${s.diff ? 'late' : ''}">${s.unmatched} open${s.diff ? ' · ' + money(s.diff) : ''}</span>`
}
const accRows = (list, p, ALL, withRecon) => {
  const out = []; let tot = { open: 0, dr: 0, cr: 0, close: 0 }
  ;['Cash', 'Bank', 'Giro'].forEach(grp => {
    const xs = list.filter(a => a.grp === grp); if (!xs.length) return
    if (grp !== 'Giro') out.push({ group: grp === 'Cash' ? 'Cash' : 'Bank' })
    xs.forEach(a => {
      const f = flows(a.code, p); if (grp !== 'Giro') for (const k in tot) tot[k] += f[k]
      const c = {
        code: a.code,
        name: one(esc(a.name + (ALL ? ' · ' + a.loc : ''))),
        bank: a.grp === 'Cash' ? DASH : one(esc(`${a.bank || '—'} ${a.number || ''}`.trim())),
        status: pill(a.active ? 'Active' : 'Inactive', a.active ? 'ok' : 'bad'),
        note: a.note ? one(esc(a.note)) : DASH,
        open: num(f.open), dr: m(f.dr), cr: m(f.cr), close: num(f.close),
      }
      if (withRecon) c.recon = reconCell(a, p)
      out.push({ on: `openCard('${a.code}')`, c })
    })
  })
  return { rows: out, tot }
}

function tabVouchers(p, type) {
  const acc = filt(ID, 'acct', BCA), only = filt(ID, 'only', '1') === '1', q = S.q[ID] || ''
  const own = v => v.acct === acc || (v.giro && v.giro.bank === acc)
  const base = VOUCHERS.filter(v => v.type === type && v.date >= p.from && v.date <= p.to)
  const nThis = base.filter(own).length
  const list = base.filter(v => (!only || own(v)) && hit(q, v.no, v.party && v.party.name, v.party && v.party.code, v.giro && v.giro.no, v.note)).sort((a, b) => b.date.localeCompare(a.date) || b.no.localeCompare(a.no))
  const cols = [{ l: 'Date', k: 'date', w: 84 }, { l: 'Voucher', k: 'no', w: 190 }, ...(only ? [] : [{ l: 'Cash / bank', k: 'acc', w: 150 }]), { l: 'Party code', k: 'code', w: 100 }, { l: 'Party', k: 'party' }, { l: 'Cheque / giro no', k: 'giro', w: 150 }, { l: 'Total', k: 'tot', num: 1, w: 130 }, { l: 'Note', k: 'note', w: 250 }, { l: 'Period', k: 'per', w: 100 }]
  const rows = list.map(v => ({ on: `openVoucher('${v.no}')`, c: { date: dayCell(v.date), no: esc(v.no), acc: one(esc(`${an(v.acct)} ${v.loc}`)), code: partyCode(v), party: partyName(v), giro: v.giro ? esc(v.giro.no) : DASH, tot: num(v.total), note: one(esc(v.note)), per: `<span class="mute">${v.period}</span>` } }))
  const total = list.reduce((a, v) => a + v.total, 0)
  const open = list.filter(v => v.giro && v.giro.state === 'New')
  const late = open.filter(v => v.giro.due < TODAY).length
  const k = [kpi(`${type} vouchers`, String(list.length)), kpi(type === 'BKM' ? 'Total received' : 'Total paid', money(total)), kpi(type === 'BKM' ? 'Largest' : 'Giro not cleared', type === 'BKM' ? money(Math.max(0, ...list.map(v => v.total))) : `${open.length}${late ? ` · ${late} overdue` : ''}`, type === 'BKK' && late > 0)]
  const body = bar(search(ID, `Search ${type}`), chips(ID, 'only', [['1', `This account · ${acc.slice(0, 10)}`, nThis], ['0', 'All accounts', base.length]], '1')) +
    table({ cols, rows, empty: `No ${type} in this period`, foot: rows.length ? { no: 'Total', tot: num(total) } : null })
  return { kpis: k, body, actions: [{ label: `New ${type}`, on: `openNewVoucher('${type}')`, icon: 'plus' }, { label: 'Print', on: `printPage('${type}')`, kind: 'secondary', icon: 'printer' }] }
}

function tabRecon(p) {
  const acc = bankAccount(), s = reconSummary(acc, p)
  const bankOpts = ACCTS.filter(a => a.grp === 'Bank').map(a => [a.code, `${a.code} · ${a.name} ${a.loc}${a.active ? '' : ' · inactive'}`])
  const only = filt(ID, 'rfilter', 'open')
  const lines = only === 'open' ? s.lines.filter(l => l.state === 'unmatched') : s.lines
  const rows = lines.map(l => {
    let act
    if (l.extra) act = `<span class="kas-act"><button type="button" class="kas-mini" onclick="event.stopPropagation();openLineEntry('${l.id}')">Create ${l.amount < 0 ? 'BKK' : 'BKM'}</button><button type="button" class="kas-mini" onclick="event.stopPropagation();${l.state === 'ignored' ? `restoreLine('${l.id}')` : `ignoreLine('${l.id}')`}">${l.state === 'ignored' ? 'Restore' : 'Ignore'}</button></span>`
    else if (l.state === 'matched') act = `<button type="button" class="kas-mini" onclick="event.stopPropagation();unmatchLine('${l.id}')">Unmatch</button>`
    else if (l.state === 'ignored') act = `<button type="button" class="kas-mini" onclick="event.stopPropagation();restoreLine('${l.id}')">Restore</button>`
    else act = `<button type="button" class="kas-mini" onclick="event.stopPropagation();matchLine('${l.id}')">Match</button>`
    return {
      c: {
        date: dayCell(l.date),
        desc: one(esc(l.desc)),
        amt: `<span class="${l.amount < 0 ? '' : 'ok'}">${num(l.amount)}</span>`,
        doc: l.doc ? esc(l.doc) : DASH,
        st: pill(l.state === 'matched' ? 'Matched' : l.state === 'ignored' ? 'Ignored' : 'Unmatched', l.state === 'matched' ? 'ok' : l.state === 'ignored' ? '' : 'warn'),
        act,
      },
    }
  })
  const total = lines.reduce((a, l) => a + l.amount, 0)
  const note = `<p class="page-sub" style="margin:-4px 0 12px">Book <b>${money(s.book)}</b> · statement <b>${money(s.statement)}</b> · difference <b class="${s.diff ? 'late' : 'ok'}">${money(s.diff)}</b>. ${s.openExtras.length} bank-only line(s) not in the books.${RECON_DONE[acc] ? ` Last reconciled ${day(RECON_DONE[acc])}.` : ''}</p>`
  const body = bar(
    sel(ID, 'racct', bankOpts, acc, 'Bank account'),
    chips(ID, 'rfilter', [['open', 'Open lines', s.unmatched], ['all', 'All lines', s.lines.length]], 'open'),
  ) + note + scroll(table({
    cols: [{ l: 'Date', k: 'date', w: 84 }, { l: 'Description', k: 'desc' }, { l: 'Amount', k: 'amt', num: 1, w: 140 }, { l: 'Document', k: 'doc', w: 190 }, { l: 'Status', k: 'st', w: 110 }, { l: '', k: 'act', w: 210 }],
    rows, empty: 'No statement lines in this range', foot: rows.length ? { desc: 'Total of the lines shown', amt: num(total) } : null,
  }))
  return {
    kpis: [kpi('Book balance', money(s.book)), kpi('Bank statement', money(s.statement)), kpi('Difference', money(s.diff), s.diff !== 0), kpi('Unmatched', String(s.unmatched), s.unmatched > 0)],
    body,
    actions: [
      { label: 'Finish reconciliation', on: 'finishRecon()' },
      { label: 'Export', on: 'exportRecon()', kind: 'secondary', icon: 'download' },
      { label: 'Print', on: `printPage('Bank reconciliation')`, kind: 'secondary', icon: 'printer' },
    ],
  }
}

const accsIn = sc => { const acct = filt(RID, 'acct', ''); return ACCTS.filter(a => a.grp !== 'Giro' && (sc === 'ALL' || a.loc === sc) && (!acct || a.code === acct)) }

const RB = {
  daily(p, sc) {
    const accs = accsIn(sc)
    if (p.from === p.to) {
      const rows = accs.map(a => ({ f: flows(a.code, p), a })).filter(x => x.f.open || x.f.dr || x.f.cr).map(({ a, f }) => ({ c: { code: a.code, name: one(esc(a.name + (sc === 'ALL' ? ' · ' + a.loc : ''))), open: num(f.open), dr: m(f.dr), cr: m(f.cr), close: num(f.close) } }))
      const t = accs.reduce((s, a) => { const f = flows(a.code, p); return { o: s.o + f.open, d: s.d + f.dr, c: s.c + f.cr, x: s.x + f.close } }, { o: 0, d: 0, c: 0, x: 0 })
      return { kpis: [kpi('Opening', money(t.o)), kpi('Money in', money(t.d)), kpi('Money out', money(t.c)), kpi('Closing', money(t.x))], html: T(ACC_COLS, rows, { name: 'Total', open: num(t.o), dr: num(t.d), cr: num(t.c), close: num(t.x) }) }
    }
    const by = {}; accs.forEach(a => entriesIn(a.code, p).forEach(e => { const x = by[e.date] = by[e.date] || { dr: 0, cr: 0 }; x.dr += e.dr; x.cr += e.cr }))
    let run = accs.reduce((s, a) => s + flows(a.code, p).open, 0); const open0 = run, rows = []; let td = 0, tc = 0
    rangeD(p.from, p.to).forEach(d => { const x = by[d] || { dr: 0, cr: 0 }, o = run; run += x.dr - x.cr; td += x.dr; tc += x.cr; rows.push({ c: { d: dayCell(d), open: num(o), dr: m(x.dr), cr: m(x.cr), close: num(run) } }) })
    return { kpis: [kpi('Opening', money(open0)), kpi('Money in', money(td)), kpi('Money out', money(tc)), kpi('Closing', money(run))], html: T([{ l: 'Date', k: 'd', w: 90 }, { l: 'Opening', k: 'open', num: 1 }, { l: 'Debit', k: 'dr', num: 1 }, { l: 'Credit', k: 'cr', num: 1 }, { l: 'Closing', k: 'close', num: 1 }], rows, { d: 'Total', dr: num(td), cr: num(tc) }) }
  },
  per(p, sc) {
    const accs = accsIn(sc), { rows, tot } = accRows(accs, p, sc === 'ALL')
    return { kpis: [kpi('Opening', money(tot.open)), kpi('Money in', money(tot.dr)), kpi('Money out', money(tot.cr)), kpi('Closing', money(tot.close))], html: T(ACC_COLS, rows, { name: 'Total', open: num(tot.open), dr: num(tot.dr), cr: num(tot.cr), close: num(tot.close) }) }
  },
  byVoucher(p, sc) {
    const accs = accsIn(sc).filter(a => a.grp === 'Bank'), acc = accs[0] ? accs[0].code : BCA, { rows, f } = ledgerRows(acc, p)
    return { kpis: [kpi(an(acc), acc), kpi('Debit', money(f.dr)), kpi('Credit', money(f.cr)), kpi('Closing', money(f.close))], html: T(LEDGER_COLS, rows) }
  },
  everyLine(p, sc) {
    const vs = vIn(p, sc).filter(v => v.deposit !== true)
    const rows = []; vs.forEach(v => v.jr.forEach(r => rows.push({ c: { d: dayCell(v.date), no: esc(v.no), a: one(esc(`${r.acc} · ${an(r.acc)}`)), dr: m(r.dr), cr: m(r.cr) } })))
    return { kpis: [kpi('Vouchers', String(vs.length)), kpi('Lines', String(rows.length)), kpi('Debit', money(rows.length ? vs.reduce((a, v) => a + sumL(v.jr, 'dr'), 0) : 0)), kpi('Credit', money(vs.reduce((a, v) => a + sumL(v.jr, 'cr'), 0)))], html: T([{ l: 'Date', k: 'd', w: 90 }, { l: 'Voucher', k: 'no', w: 190 }, { l: 'Account', k: 'a' }, { l: 'Debit', k: 'dr', num: 1, w: 130 }, { l: 'Credit', k: 'cr', num: 1, w: 130 }], rows) }
  },
  settleS(p, sc, type) {
    const vs = vIn(p, sc, v => v.type === type && v.lines.some(l => l.t === 's')), cash = v => sumL(v.lines.filter(l => l.t === 's'), 'pay')
    const rows = vs.map(v => ({ on: `openVoucher('${v.no}')`, c: { d: dayCell(v.date), no: esc(v.no), who: pty(v), cash: num(cash(v)), note: one(esc(v.note)) } }))
    const tot = vs.reduce((a, v) => a + cash(v), 0)
    return { kpis: [kpi('Vouchers', String(vs.length)), kpi(type === 'BKK' ? 'Paid in cash' : 'Received in cash', money(tot))], html: T([{ l: 'Date', k: 'd', w: 90 }, { l: 'Voucher', k: 'no', w: 190 }, { l: type === 'BKK' ? 'Supplier' : 'Customer / bank', k: 'who' }, { l: type === 'BKK' ? 'Paid' : 'Received', k: 'cash', num: 1, w: 140 }, { l: 'Note', k: 'note', w: 260 }], rows, { no: 'Total', cash: num(tot) }) }
  },
  settleD(p, sc, type) {
    const vs = vIn(p, sc, v => v.type === type), rows = []; let st = 0, ds = 0, pa = 0
    vs.forEach(v => v.lines.filter(l => l.t === 's').forEach(l => { st += l.pay + l.pot; ds += l.pot; pa += l.pay; rows.push({ on: `openVoucher('${v.no}')`, c: { d: dayCell(v.date), no: esc(v.no), who: pty(v), doc: esc(l.doc), set: num(l.pay + l.pot), po: m(l.pot), pa: num(l.pay) } }) }))
    return { kpis: [kpi('Settled', money(st)), kpi('Discount', money(ds)), kpi(type === 'BKK' ? 'Paid in cash' : 'Received in cash', money(pa))], html: T([{ l: 'Date', k: 'd', w: 90 }, { l: 'Voucher', k: 'no', w: 190 }, { l: type === 'BKK' ? 'Supplier' : 'Customer / bank', k: 'who' }, { l: 'Invoice', k: 'doc', w: 190 }, { l: 'Settled', k: 'set', num: 1, w: 130 }, { l: 'Discount', k: 'po', num: 1, w: 110 }, { l: type === 'BKK' ? 'Paid' : 'Received', k: 'pa', num: 1, w: 130 }], rows, { doc: 'Total', set: num(st), po: num(ds), pa: num(pa) }) }
  },
  otherS(p, sc, type) {
    const vs = vIn(p, sc, v => v.type === type && v.lines.some(l => l.t === 'o')), tot = v => sumL(v.lines.filter(l => l.t === 'o'), 'amt')
    const rows = vs.map(v => ({ on: `openVoucher('${v.no}')`, c: { d: dayCell(v.date), no: esc(v.no), who: pty(v), tot: num(tot(v)), note: one(esc(v.note)) } }))
    const all = vs.reduce((a, v) => a + tot(v), 0)
    return { kpis: [kpi('Vouchers', String(vs.length)), kpi(type === 'BKM' ? 'Other income' : 'Other expenses', money(all))], html: T([{ l: 'Date', k: 'd', w: 90 }, { l: 'Voucher', k: 'no', w: 190 }, { l: type === 'BKK' ? 'Paid to' : 'Received from', k: 'who' }, { l: 'Total', k: 'tot', num: 1, w: 140 }, { l: 'Note', k: 'note', w: 260 }], rows, { no: 'Total', tot: num(all) }) }
  },
  otherD(p, sc, type) {
    const vs = vIn(p, sc, v => v.type === type), rows = []; let all = 0
    vs.forEach(v => v.lines.filter(l => l.t === 'o').forEach(l => { all += l.amt; rows.push({ on: `openVoucher('${v.no}')`, c: { d: dayCell(v.date), no: esc(v.no), who: pty(v), a: one(esc(`${l.acc} · ${an(l.acc)}`)), f: one(esc(l.desc)), amt: num(l.amt) } }) }))
    return { kpis: [kpi('Lines', String(rows.length)), kpi(type === 'BKM' ? 'Other income' : 'Other expenses', money(all))], html: T([{ l: 'Date', k: 'd', w: 90 }, { l: 'Voucher', k: 'no', w: 190 }, { l: type === 'BKK' ? 'Paid to' : 'Received from', k: 'who', w: 200 }, { l: 'Account', k: 'a', w: 280 }, { l: 'For', k: 'f' }, { l: 'Amount', k: 'amt', num: 1, w: 130 }], rows, { f: 'Total', amt: num(all) }) }
  },
  gOut(p, sc) {
    const vs = vIn(p, sc, v => v.giro), tot = sumL(vs, 'total')
    const rows = vs.map(v => ({ on: `openVoucher('${v.no}')`, c: { no: esc(v.giro.no), who: pty(v), made: dayCell(v.date), due: dayCell(v.giro.due), on: v.giro.on ? dayCell(v.giro.on) : DASH, amt: num(v.total), st: stCell(giroState(v)) } }))
    return { kpis: [kpi('Giro', String(vs.length)), kpi('Total', money(tot)), kpi('Not cleared', String(vs.filter(v => v.giro.state === 'New').length))], html: T([{ l: 'Giro no', k: 'no', w: 150 }, { l: 'Supplier', k: 'who' }, { l: 'Created', k: 'made', w: 90 }, { l: 'Due', k: 'due', w: 90 }, { l: 'Cleared / bounced', k: 'on', w: 150 }, { l: 'Amount', k: 'amt', num: 1, w: 130 }, { l: 'Status', k: 'st', w: 120 }], rows, { who: 'Total', amt: num(tot) }) }
  },
  gOutOpen() {
    const vs = VOUCHERS.filter(v => v.giro && v.giro.state === 'New'), by = {}
    vs.forEach(v => (by[v.party.name] = by[v.party.name] || []).push(v))
    const rows = []
    Object.keys(by).sort().forEach(n => {

      by[n].sort((a, b) => a.giro.due.localeCompare(b.giro.due)).forEach(v => rows.push({ on: `openVoucher('${v.no}')`, c: { no: esc(v.giro.no), bkk: esc(v.no), made: dayCell(v.date), due: dayCell(v.giro.due), late: late(gap(TODAY, v.giro.due)), bank: one(esc(an(v.giro.bank))), amt: num(v.total) } }))
    })
    const lt = vs.filter(v => v.giro.due < TODAY)
    return { kpis: [kpi('Giro out', String(vs.length)), kpi('Not yet cleared', money(sumL(vs, 'total'))), kpi('Overdue', `${lt.length} · ${money(sumL(lt, 'total'))}`, lt.length > 0)], html: T([{ l: 'Giro no', k: 'no', w: 150 }, { l: 'BKK', k: 'bkk', w: 190 }, { l: 'Created', k: 'made', w: 90 }, { l: 'Due', k: 'due', w: 90 }, { l: 'Overdue', k: 'late', w: 100 }, { l: 'Paying bank', k: 'bank' }, { l: 'Amount', k: 'amt', num: 1, w: 130 }], rows, { bank: 'Total', amt: num(sumL(vs, 'total')) }) }
  },
  gOutBad(p, sc) {

    rows.forEach((r, i) => { if (vs[i].repl) r.c.st = pill('Replaced', 'ok'); else r.c.st = pill('Open', 'bad') })
    return { kpis: [kpi('Bounced giro', String(vs.length)), kpi('Amount', money(sumL(vs, 'total'))), kpi('Not replaced', String(vs.filter(v => !v.repl).length), vs.some(v => !v.repl))], html: T([{ l: 'Giro no', k: 'no', w: 150 }, { l: 'Supplier', k: 'who' }, { l: 'Bounced on', k: 'on', w: 110 }, { l: 'Amount', k: 'amt', num: 1, w: 130 }, { l: 'Replaced by', k: 'repl', w: 190 }, { l: 'Status', k: 'st', w: 110 }], rows, null, 'No giro has bounced') }
  },
  gIn(p) {

  const rows = [...m.values()].sort((a, b) => (a.code < b.code ? -1 : 1))
  rows.forEach(t => { t.close = t.open + t.d - t.c })
  return rows
}

/* ═════════ gl-journal: Journal entry ═════════ */
const blankLine = () => ({ acc: '', loc: 'HO', memo: '', d: 0, c: 0 })
const JF = { date: TODAY, time: '12:00', ref: '', note: 'Accrue October telephone, head office', auto: false, depWarn: '', lines: [{ acc: '6010310005', loc: 'HO', memo: '', d: 3150000, c: 0 }, { acc: '2012201006', loc: 'HO', memo: 'Accrued', d: 0, c: 3150000 }] }
const BASES = COA.filter(c => c[0].length === 10)
function resolveAcc(t) {
  t = String(t).trim(); const m = t.match(/^\d{10}/)
  if (m && COA_NAME[m[0]]) return m[0]
  const q = t.toLowerCase(); if (q.length < 3) return ''
  const h = BASES.find(([, n]) => n.toLowerCase() === q) || BASES.find(([, n]) => n.toLowerCase().includes(q))
  return h ? h[0] : ''
}
function jfIssue() {
  const ls = JF.lines.filter(l => l.d || l.c)
  const td = JF.lines.reduce((s, l) => s + l.d, 0), tc = JF.lines.reduce((s, l) => s + l.c, 0), diff = td - tc
  const p = periodOf(JF.date)
  let why = ''
  if (!p || !p.open) why = p ? `${p.name} is closed` : 'The date is outside an open period'
  else if (diff !== 0) why = `Difference ${money(Math.abs(diff))}: debit and credit must match`
  else if (ls.some(l => !l.acc)) why = 'Pick an account on every line'
  return { td, tc, diff, p, why, ok: !why && ls.length >= 2 && td > 0 }
}
function jfCalc() {
  const x = jfIssue(), g = id => document.getElementById(id)
  if (!g('jf-d')) return
  g('jf-d').textContent = money(x.td); g('jf-c').textContent = money(x.tc)
  g('jf-diff').textContent = money(x.diff); g('jf-diff').classList.toggle('is-bad', x.diff !== 0)
  g('jf-why').textContent = x.why
  g('jf-per').value = x.p ? x.p.name : ''
  g('jf-post').classList.toggle('is-disabled', !x.ok)
}
window.jfHdr = (k, v) => { JF[k] = v; jfCalc() }
window.jfDT = v => { const [d, t] = String(v).split('T'); JF.date = d || ''; JF.time = t || JF.time; jfCalc() }
window.jfClear = () => { JF.lines = [blankLine(), blankLine()]; JF.depWarn = ''; render() }
window.jfDiscard = () => { JF.ref = ''; JF.note = ''; JF.auto = false; JF.depWarn = ''; JF.date = TODAY; JF.time = '12:00'; JF.lines = [blankLine(), blankLine()]; render(); toast('Draft discarded') }
window.jfJournals = () => { S.tab['gl-info'] = 'journals'; go('gl-info') }
window.jfLine = (i, k, v) => {
  const l = JF.lines[i]
  if (k === 'acc') { l.acc = resolveAcc(v); const n = document.getElementById('jf-n' + i); if (n) n.innerHTML = l.acc ? `${mute(acc12(l.acc, l.loc))} ${esc(accName(l.acc))}` : (v ? '<span class="late">Not in the chart</span>' : ''); }
  else if (k === 'loc') { l.loc = v; const n = document.getElementById('jf-n' + i); if (n && l.acc) n.innerHTML = `${mute(acc12(l.acc, l.loc))} ${esc(accName(l.acc))}` }
  else if (k === 'memo') l.memo = v
  else { l[k] = numOf(v); const o = k === 'd' ? 'c' : 'd'; if (l[k] > 0 && l[o]) { l[o] = 0; const e = document.getElementById(`jf-${o}${i}`); if (e) e.value = '' } }
  jfCalc()
}
window.jfFmt = (el, i, k) => { el.value = JF.lines[i][k] ? dots(JF.lines[i][k]) : '' }
window.jfAcc = (el, i) => { jfLine(i, 'acc', el.value); if (JF.lines[i].acc) el.value = JF.lines[i].acc }
window.jfAdd = () => { JF.lines.push(blankLine()); render() }
window.jfDel = i => { JF.lines.splice(i, 1); if (!JF.lines.length) JF.lines.push(blankLine()); render() }
window.jfDep = () => {
  const dup = J.find(j => j.st === 'New' && j.note === 'Depreciation Oct 2026')
  JF.lines = ASSETS.flatMap(a => [{ acc: a.dep, loc: a.loc, memo: a.name, d: monthly(a), c: 0 }, { acc: a.acc, loc: a.loc, memo: a.name, d: 0, c: monthly(a) }])
  JF.note = 'Depreciation Oct 2026'; JF.ref = 'FA-DEP-2610'; JF.auto = true; JF.depWarn = dup ? dup.no : ''
  render(); toast('Depreciation filled', `${ASSETS.length} assets from the asset master`)
}
window.glRev = no => {
  const j = J.find(x => x.no === no); if (!j) return
  while (S.stack.length) S.stack.pop(); renderLayers()
  JF.lines = j.lines.map(l => ({ acc: l.a, loc: l.l, memo: l.memo, d: l.c, c: l.d }))
  JF.note = `Reversal of ${j.no}, ${j.note}`; JF.ref = j.no; JF.date = TODAY; JF.auto = false; JF.depWarn = ''

window.jfRevPick = () => {
  const rows = J.filter(j => j.src === 'GL' && j.st === 'New' && !j.auto).map(j => ({ on: `glRev('${j.no}')`, c: { date: dayS(j.date), no: j.no, note: esc(j.note), tot: num(jTotal(j)) } }))
  openSheet({ crumb: ['Journal entry'], title: 'Reverse entry', body: table({ tbl: 'gl', cols: [{ l: 'Date', k: 'date', w: 80 }, { l: 'Journal no', k: 'no', w: 160 }, { l: 'Note', k: 'note' }, { l: 'Total', k: 'tot', num: 1, w: 130 }], rows, empty: 'No manual journal to reverse' }) })
}

  J.push({ no, src: 'GL', date: JF.date, time: JF.time, ref: JF.ref, note: JF.note, st: 'New', auto: JF.auto, lines: ls.map(l => ({ a: l.acc, l: l.loc, d: l.d, c: l.c, memo: l.memo })) })
  cache = null
  JF.ref = ''; JF.note = ''; JF.auto = false; JF.depWarn = ''; JF.date = TODAY; JF.time = '12:00'; JF.lines = [blankLine(), blankLine()]
  render(); toast(`${no} posted`, `${money(x.td)} in ${plural(ls.length, 'line')}`)

/* ═════════ gl-closing: Month end ═════════ */
const CS = { sel: OPEN_PERIOD, tests: {}, ignore: false, rp: OPEN_PERIOD }
const sp = () => PER.find(p => p.name === CS.sel) || PER[PER.length - 1]
function findings(kind) {
  const giros = J.filter(j => j.giro && j.st === 'New')
  const girosOut = giros.map(j => ({ doc: j.no, detail: j.note, amt: jTotal(j) }))
  const unbal = J.filter(j => j.st === 'New' && j.lines.reduce((t, l) => t + l.d - l.c, 0) !== 0).map(j => ({ doc: j.no, detail: j.note, amt: Math.abs(j.lines.reduce((t, l) => t + l.d - l.c, 0)) }))
  const unitBad = U4.map(u => ({ u, v: book(OCT1, OCT31).filter(t => t.l === u).reduce((s, t) => s + t.close, 0) })).filter(x => x.v !== 0).map(x => ({ doc: x.u, detail: 'Unit books do not balance', amt: Math.abs(x.v) }))
  const abnormal = book(OCT1, OCT31).filter(t => t.close && ((/^1/.test(t.a) && !/^10(216|1702)/.test(t.a) && t.close < 0) || (/^2/.test(t.a) && t.close > 0))).map(t => ({ doc: t.code, detail: name12(t.a, t.l), amt: Math.abs(t.close) }))
  if (kind === 'trx') return [
    { name: 'Voucher without a period', items: [{ doc: 'BKK-26-11-00001', detail: 'Dated 1 Nov 2026, no open period', amt: 12500000 }] },
    { name: 'Giro not cleared at period end', items: girosOut },
    { name: 'Goods received, no supplier invoice', items: [{ doc: 'GR-26-10-00418', detail: 'Garmen Mitra Sentosa, PT', amt: 88400000 }, { doc: 'GR-26-10-00431', detail: 'Sumber Komputer', amt: 8374200 }] },
    { name: 'Shop takings not posted', items: [] },
  ]
  return [
    { name: 'Journal out of balance', items: [...unbal, { doc: 'Draft, prepaid insurance', detail: 'Draft journal, not posted', amt: 250000 }] },
    { name: 'Unit books not balanced', items: unitBad },
    { name: 'Account with an unusual balance', items: abnormal },
    { name: 'Posting to a group account', items: [] },
  ]
}
const probCount = () => Object.values(CS.tests).reduce((s, t) => s + (t ? t.reduce((a, c) => a + c.items.length, 0) : 0), 0)
function closeIssue() {
  const p = sp()
  if (!p.open) return `${p.name} is already closed`
  if (!CS.tests.trx || !CS.tests.acc) return 'Run both validations first'
  if (probCount() > 0 && !CS.ignore) return 'Tick Ignore validation to close with problems'
  return ''
}
window.glSelPer = n => { CS.sel = n; CS.tests = {}; CS.ignore = false; render() }
window.glTest = k => { CS.tests[k] = findings(k); const n = CS.tests[k].reduce((a, c) => a + c.items.length, 0); render(); toast(n ? `${plural(n, 'problem')} found` : 'No problem found', k === 'trx' ? 'Validate transactions' : 'Validate accounting') }
window.glView = k => {
  const rows = []
  CS.tests[k].filter(c => c.items.length).forEach(c => { rows.push({ group: `${esc(c.name)} · ${c.items.length}` }); c.items.forEach(i => rows.push({ c: { doc: esc(i.doc), detail: esc(i.detail), amt: num(i.amt) } })) })
  openSheet({ crumb: ['Month end'], title: k === 'trx' ? 'Transaction problems' : 'Accounting problems', body: table({ tbl: 'gl', cols: [{ l: 'Document', k: 'doc', w: 200 }, { l: 'Detail', k: 'detail' }, { l: 'Amount', k: 'amt', num: 1, w: 140 }], rows, empty: 'No problem' }) })
}
window.glSaldo = () => { CS.saldo = true; render(); toast('Opening balance processed', 'Into the opening balance sheet') }
window.glIgn = v => { CS.ignore = v; render() }
const lockList = p => `<ul class="gl-list"><li>New transactions dated in ${p.name} are refused</li><li>Giro can no longer be cleared in ${p.name}</li><li>Reprocess needs Undo closing first</li><li>Closing balances become the opening balances of the next period</li></ul>`
window.glClosing = () => {
  const why = closeIssue(); if (why) return
  const p = sp(), n = probCount()
  openSheet({ crumb: ['Month end'], title: `Close ${p.name}`, size: 'rail', body: (n ? `<p class="late" style="margin:0 0 16px">${plural(n, 'problem')} ignored</p>` : '') + lockList(p), foot: btn(`Close ${p.name}`, 'glDoClose()') })
}
window.glDoClose = () => { const p = sp(); p.open = false; CS.tests = {}; CS.ignore = false; closeSheet(); render(); toast(`${p.name} closed`, 'Balances carried to the next period') }
window.glUndo = () => {
  const p = sp(); if (p.open) return

/* ═════════ statements built from the ledger ═════════ */
const PLW = [0.104, 0.099, 0.113, 0.117, 0.111, 0.106, 0.119, 0.123, 0.108]
const CW = PLW.reduce((a, w) => (a.push((a[a.length - 1] || 0) + w), a), [])
const bsLike = b => /^[123]/.test(b)
/* signed P&L per base for month index k (0 Jan … 9 Oct): { m: month, y: year to date }.
   Oct is the real ledger; Jan–Sep spread the September year-to-date balances by fixed weights. */
function plAt(k) {
  const map = new Map()
  book(OCT1, OCT31).filter(t => !bsLike(t.a)).forEach(t => { const x = map.get(t.a) || { open: 0, oct: 0 }; x.open += t.open; x.oct += t.d - t.c; map.set(t.a, x) })
  const out = new Map()
  map.forEach((x, b) => {
    if (k === 9) out.set(b, { m: x.oct, y: x.open + x.oct })
    else { const y = k === 8 ? x.open : Math.round(x.open * CW[k]), y0 = k ? Math.round(x.open * CW[k - 1]) : 0; out.set(b, { m: y - y0, y }) }
  })
  return out
}
const vcells = v => Object.fromEntries(v.map((x, i) => ['v' + i, redIf(x, num(x))]))
const rowT = (label, v, cls = 'total') => ({ cls, vals: v, c: { code: '', name: label, ...vcells(v) } })
/* rows grouped by 5-digit sub-group; val(b) → number[] */
function tree(bases, val, n) {
  const rows = [], tot = Array(n).fill(0), g = new Map()
  bases.forEach(b => { const s = b.slice(0, 5); if (!g.has(s)) g.set(s, []); g.get(s).push(b) })
  g.forEach((bs, s) => {
    const sums = Array(n).fill(0); bs.forEach(b => val(b).forEach((v, i) => { sums[i] += v }))
    rows.push({ cls: 'gl-sub', vals: sums, c: { code: '', name: esc(COA_NAME[s] || s), ...vcells(sums) } })
    bs.forEach(b => { const v = val(b); rows.push({ vals: v, c: { code: mute(b), name: `<span style="padding-left:16px">${esc(accName(b))}</span>`, ...vcells(v) } }) })
    sums.forEach((v, i) => { tot[i] += v })
  })
  return { rows, tot }
}
function plStatement(k) {
  const cur = plAt(k)
  const keys = [...cur.keys()].filter(b => cur.get(b).m || cur.get(b).y).sort()
  const G = (d, label, sg) => {
    const bs = keys.filter(b => b[0] === d)
    if (!bs.length) return { rows: [], tot: [0, 0] }
    const t = tree(bs, b => [sg * cur.get(b).m, sg * cur.get(b).y], 2)
    return { rows: [{ group: label }, ...t.rows], tot: t.tot }
  }
  const r4 = G('4', 'Revenue', -1), r5 = G('5', 'Cost of sales', 1), r6 = G('6', 'Operating expenses', 1), r7 = G('7', 'Other operating expenses', 1), r8 = G('8', 'Non-operating income (expense)', -1)
  const two = f => [f(0), f(1)]
  const gp = two(i => r4.tot[i] - r5.tot[i]), op = two(i => gp[i] - r6.tot[i] - r7.tot[i]), np = two(i => op[i] + r8.tot[i])
  const rows = [...r4.rows, rowT('Total revenue', r4.tot, 'gl-sub'), ...r5.rows, rowT('Total cost of sales', r5.tot, 'gl-sub'), rowT('Gross profit', gp, 'gl-key'),
    ...r6.rows, rowT('Total operating expenses', r6.tot, 'gl-sub'), ...r7.rows, rowT('Total other operating expenses', r7.tot, 'gl-sub'), rowT('Operating profit', op, 'gl-key'),
    ...r8.rows, rowT('Net profit', np)]
  return { rows, rev: r4.tot, cos: r5.tot, gp, op, np, opex: two(i => r6.tot[i] + r7.tot[i]) }
}
/* balance sheet at one or more dates */
function bsView(asofs) {
  const n = asofs.length
  const books = asofs.map(a => book(OCT1, a)), maps = books.map(byBase)
  const pnl = books.map(bk => -bk.filter(t => !bsLike(t.a)).reduce((s, t) => s + t.close, 0))
  const keys = [...new Set(maps.flatMap(m => [...m.keys()]))].filter(b => bsLike(b) && maps.some(m => m.get(b))).sort()
  const sec = (d, sg) => {
    const bs = keys.filter(b => b[0] === d), out = [], tot = Array(n).fill(0), g3 = new Map()
    bs.forEach(b => { const s = b.slice(0, 3); if (!g3.has(s)) g3.set(s, []); g3.get(s).push(b) })
    g3.forEach((xs, s) => { out.push({ group: esc(COA_NAME[s] || s) }); const t = tree(xs, b => maps.map(m => sg * (m.get(b) || 0)), n); out.push(...t.rows); t.tot.forEach((v, i) => { tot[i] += v }) })
    return { rows: out, tot }
  }
  const A = sec('1', 1), Li = sec('2', -1), E0 = sec('3', -1)
  const eq = E0.tot.map((v, i) => v + pnl[i])
  const E = { rows: [...E0.rows, { cls: 'gl-sub', vals: pnl, c: { code: '', name: 'Current year profit', ...vcells(pnl) } }], tot: eq }
  return { A, Li, E, le: Li.tot.map((v, i) => v + eq[i]), pnl, maps }
}

/* cash flow, indirect */
function cfData() {

  const op = np + dep + wc.reduce((s, x) => s + x[1], 0)
  const inv = [['Fixed assets and other assets', eff('10215', '1021701', '103')]]

  const ti = inv.reduce((s, x) => s + x[1], 0), tf = fin.reduce((s, x) => s + x[1], 0), net = op + ti + tf

const acell = (a, cr) => `<span style="${cr ? 'padding-left:28px;' : ''}"><span class="nm">${esc(a.code)}</span> · ${esc(a.name)}${a.flag ? ' <span class="late">Not in the chart yet</span>' : ''}</span>`
const blk = (title, rows) => ({ title, rows })
const jr = (a, dr, cr) => ({ a, dr, cr })
function jSheet(crumb, title, pill, blocks) {
  const body = blocks.map(b => {
    const rows = b.rows.filter(r => r.dr || r.cr)
    const td = sum(rows, r => r.dr || 0), tc = sum(rows, r => r.cr || 0)
    return section(b.title, table({
      cols: [{ l: 'Account', k: 'a' }, { l: 'Debit', k: 'dr', num: true, w: 170 }, { l: 'Credit', k: 'cr', num: true, w: 170 }],
      rows: rows.map(r => ({ c: { a: acell(r.a, !!r.cr), dr: r.dr ? money(r.dr) : '', cr: r.cr ? money(r.cr) : '' } })),
      foot: { a: td === tc ? 'Balanced' : '<span class="late">Out of balance</span>', dr: money(td), cr: money(tc) },
    }))
  }).join('')
  openSheet({ crumb, title, pill, size: 'wide', body })
}
function jrInvoice(F) {
  const G = grand(F), N = net(F), P = ppnOf(F), blocks = []
  const ppnRow = P ? [jr(acc('2012101003', 'HO'), 0, P)] : []
  if (F.type === 'dp') {
    blocks.push(blk('Down payment invoice', [jr(AR, G, 0), jr(UMA_ACC, 0, N), ...ppnRow]))
  } else {
    const cost = costOf(F)
    const stock = [jr(acc('5010110001', 'HO'), cost, 0), jr(acc('1011201001', 'HO', 'Persediaan Barang Dagangan'), 0, cost)]
    if (F.type === 'match' && F.sj) {
      blocks.push(blk(`Invoice, matching ${F.so}`, [jr(AR, G, 0), jr(acc('4010110001', 'HO'), 0, N), ...ppnRow]))
      blocks.push(blk(`Stock out, already booked at delivery note ${F.sj}`, stock))
    } else {
      blocks.push(blk(F.type === 'match' ? `Invoice, matching ${F.so || 'SO'}, no delivery note` : 'Invoice, no sales order', [jr(AR, G, 0), jr(acc('4010110001', 'HO'), 0, N), ...ppnRow, ...stock]))
    }
  }
  const ap = sum(F.applied, a => a.amt)
  if (ap) blocks.push(blk('Down payment applied', [jr(UMA_ACC, ap, 0), jr(AR, 0, ap)]))
  return blocks
}

/* ═════════ 1 · Sales invoice ═════════ */
const soOf = no => SOS.find(s => s.no === no)
const soFree = (cust, keep) => SOS.filter(s => s.cust === cust && (s.no === keep || !INV.some(v => v.type === 'match' && v.so === s.no)))
function loadInv(no) {
  const v = invOf(no)
  V.F = Object.assign(clone(v), { applied: UMA.filter(a => a.inv === no).map(a => ({ um: a.um, amt: a.amt })), isNew: false })
}
function newInv() {
  const c = CUSTOMERS[0]
  V.F = { no: '', date: TODAY, cust: c.code, type: 'std', term: c.term, due: addD(TODAY, termDays(c.term)), so: '', sj: '', sales: SALES[0], wh: 'HO', ref: '', note: '', disc: 0, ppn: 0, dp: 5000000, lines: [L('KF-001', 10)], applied: [], isNew: true }
}
function umLeft(um, F) {
  return grand(invOf(um)) - sum(UMA.filter(a => a.um === um && a.inv !== F.no), a => a.amt) - sum(F.applied.filter(a => a.um === um), a => a.amt)
}
const umAvail = F => sum(INV.filter(v => v.type === 'dp' && v.cust === F.cust && v.no !== F.no), v => Math.max(0, umLeft(v.no, F)))
function dueNow(F) {
  const rec = !F.isNew
  return grand(F) - sum(F.applied, a => a.amt) - (rec ? sum(RET.filter(r => r.inv === F.no), retTotal) + collectedOf(F.no) : 0)
}
function pickSO(F, no) {
  const s = soOf(no)
  F.so = no
  if (!s) { F.sj = ''; return }
  F.sj = s.sj; F.sales = s.sales; F.term = s.term; F.due = addD(F.date, termDays(s.term)); F.lines = clone(s.lines)
}
window.svDelete = () => { if (!V.F) return; if (!V.F.isNew) return toast('Posted invoice', 'Posted documents are not deleted'); svOpen('__new'); toast('Draft discarded') }
window.svInfo = () => { if (!V.F || V.F.isNew) return toast('Not saved yet', 'Save the invoice first'); svOpenInv(V.F.no) }
window.svSave = () => {
  const F = V.F
  if (!F) return
  if (!F.cust || !F.lines.length) return toast('Check the invoice', 'Customer and at least one line are required')
  let no = F.no
  if (F.isNew) {
    const max = Math.max(0, ...INV.filter(v => v.no.startsWith('PJL/HO/2610/')).map(v => +v.no.slice(-4)))
    no = 'PJL/HO/2610/' + String(1 + max).padStart(4, '0')
    F.no = no
  }
  const data = clone(F)
  delete data.isNew; delete data.applied
  data.no = no; data.due = addD(F.date, termDays(F.term))
  const existing = invOf(no)
  if (existing) Object.assign(existing, data); else INV.push(data)
  for (let i = UMA.length - 1; i >= 0; i--) if (UMA[i].inv === no) UMA.splice(i, 1)
  F.applied.forEach(a => UMA.push({ inv: no, um: a.um, amt: a.amt, date: F.date }))
  F.isNew = false
  loadInv(no)
  render(); toast('Invoice saved', `${no} · ${money(grand(invOf(no)))}`)
}
window.svOpen = no => { if (no === '__new') newInv(); else loadInv(no); render() }
window.svSet = (k, v) => {
  const F = V.F
  if (k === 'cust') {
    F.cust = v; F.term = custOf(v).term; F.due = addD(F.date, termDays(F.term)); F.applied = []
    if (F.type === 'match') { const f = soFree(v, '')[0]; if (f) pickSO(F, f.no); else { F.so = ''; F.sj = ''; F.lines = [] } }
  } else if (k === 'so') { if (F.type === 'match') pickSO(F, v); else F.so = v }
  else if (k === 'term') { F.term = v; F.due = addD(F.date, termDays(v)) }
  else if (k === 'ppn') F.ppn = +v
  else F[k] = v
  render()
}
window.svNum = (k, v) => { V.F[k] = pn(v); render() }
window.svDiscPct = v => { const F = V.F, g = gross(F); F.disc = g ? Math.round(g * pn(v) / 100) : 0; render() }

window.svType = t => {
  const F = V.F
  F.type = t
  if (t === 'match') { const f = soFree(F.cust, F.so)[0]; if (f) pickSO(F, f.no); else { F.so = ''; F.sj = ''; if (!F.lines.length) F.lines = [] } }
  else { if (t === 'std') { F.so = ''; F.sj = '' } if (t !== 'dp' && !F.lines.length) F.lines = [L('KF-001', 10)]; if (t === 'dp') F.sj = '' }
  if (t === 'dp') F.applied = []
  render()
}
window.svLine = (i, k, v) => {
  const l = V.F.lines[i]
  if (k === 'code') { l.code = v; l.price = itm(v).price } else l[k] = pn(v)
  render()
}
window.svDel = i => { V.F.lines.splice(i, 1); render() }
window.svAdd = () => { const F = V.F, free = ITEMS.find(i => !F.lines.some(l => l.code === i.code)) || ITEMS[0]; F.lines.push(L(free.code, 1)); render() }
window.svJr = () => { const F = V.F; jSheet(['Sales invoice', F.no || 'New invoice'], 'Journal', `<span class="ds-pill ds-pill--neutral">${typeWord(F.type)}</span>`, jrInvoice(F)) }
window.svApplyOpen = () => {
  const F = V.F, due = dueNow(F)
  const ums = INV.filter(v => v.type === 'dp' && v.cust === F.cust && v.no !== F.no && umLeft(v.no, F) > 0)
  let left = due
  V.ap = {}
  ums.forEach(u => { const a = Math.min(umLeft(u.no, F), Math.max(0, left)); V.ap[u.no] = a; left -= a })
  openSheet({
    crumb: ['Sales invoice', F.no || 'New invoice'], title: 'Apply down payment', size: 'wide',
    body: kpisHTML([{ label: 'Left to collect', value: money(due) }, { label: 'Down payment available', value: money(umAvail(F)) }]).replace('ds-kpis kpis', 'ds-kpis kpis" style="margin-bottom:24px') + table({
      cols: [{ l: 'Down payment invoice', k: 'i' }, { l: 'Date', k: 'd', w: 120 }, { l: 'Reference', k: 'r', w: 190 }, { l: 'Remaining', k: 'm', num: true, w: 140 }, { l: 'Apply', k: 'a', num: true, w: 150 }],
      rows: ums.map(u => ({ c: { i: u.no, d: day(u.date), r: u.so || DASH, m: money(umLeft(u.no, F)), a: cin(num(V.ap[u.no]), `svApAmt('${u.no}',this.value)`) } })),
      empty: 'No down payment left for this customer',
    }),
    foot: btn('Apply', 'svApplyGo()'),
  })
}
window.svApAmt = (um, v) => { V.ap[um] = pn(v) }
window.svApplyGo = () => {
  const F = V.F
  let n = 0
  Object.entries(V.ap).forEach(([um, amt]) => {
    const a = Math.min(amt, umLeft(um, F))
    if (a > 0) { F.applied.push({ um, amt: a }); n += a }
  })
  closeSheet()
  if (n) toast('Down payment applied', money(n))
  render()
}
function pgInvoice() {

  const recOpts = [['__new', 'New invoice'], ...INV.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).map(v => [v.no, `${v.no} · ${custOf(v.cust).name}`])]
  const barHTML = bar(`<span class="mute">Invoice</span>`, barSel(recOpts, F.isNew ? '__new' : F.no, 'svOpen(this.value)'))

    field('Warehouse', sel(LOCS.map(l => [l[0], `${l[0]} · ${l[1]}`]), F.wh || 'HO', "svSet('wh',this.value)")),
    field('No Ref', inp(F.ref || '', "svSet('ref',this.value)")),

  }

    : F.lines.map((l, i) => ({ c: {

  })

      .map(v => ({ i: v.no, d: day(v.date), r: v.so || DASH, t: money(grand(v)), a: money(sum(F.applied.filter(a => a.um === v.no), a => a.amt)), m: money(umLeft(v.no, F)) }))
  const umHTML = table({

const retMax = (R, code) => { const l = invOf(R.inv).lines.find(x => x.code === code); return l.qty - sum(RET.filter(r => r.inv === R.inv && r.no !== R.no), r => sum(r.lines.filter(x => x.code === code), x => x.qty)) }

  let no = R.no
  if (R.isNew) {
    const max = Math.max(0, ...RET.filter(r => r.no.startsWith('RJL/HO/2610/')).map(r => +r.no.slice(-4)))
    no = 'RJL/HO/2610/' + String(1 + max).padStart(4, '0')
    R.no = no
  }
  const data = { no, date: R.date, cust: R.cust, inv: R.inv, goods: R.goods, lines }
  const existing = RET.find(r => r.no === no)
  if (existing) Object.assign(existing, data); else RET.push(data)
  R.isNew = false

}
window.srOpen = no => { if (no === '__new') newRet(); else loadRet(no); render() }

  else if (k === 'inv') { R.inv = v; R.qty = { [invOf(v).lines[0].code]: 1 } }
  else if (k === 'goods') R.goods = v === 'yes'

}
window.srQty = (code, v) => { const R = V.R; R.qty[code] = Math.min(pn(v), retMax(R, code)); render() }

  const blocks = [blk('Return', [jr(acc('4010214001', 'HO'), val, 0), ...(p ? [jr(acc('2012101003', 'HO'), p, 0)] : []), jr(AR, 0, val + p)])]

  return blocks
}
window.srJr = () => { const R = V.R; jSheet(['Sales return', R.no || 'New return'], 'Journal', `<span class="ds-pill ds-pill--neutral">${R.goods ? 'Goods back' : 'Credit only'}</span>`, jrReturn(R)) }
function pgReturn() {

    field('Invoice', sel(invs.map(x => [x.no, `${x.no} · ${day(x.date)}`]), R.inv, "srSet('inv',this.value)"), 's2'),

  /* payment: the vouchers on the source invoice from the return on */

    ...(ppn ? [jr(acc('2012101003', s), 0, ppn)] : []),
    jr(acc('5010110001', s), cost, 0),

const tillTotal = () => sum(TILL.cart, l => l.qty * itm(l.code).price)

const locGrid = c => `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px 16px;padding:4px 0 4px ${c.length === 10 ? 40 : 0}px;font-weight:400">${LOCS.map(([l]) => `<span><span style="font-variant-numeric:tabular-nums;color:var(--ink)">${acc12(c, l)}</span> <span class="mute">${l}</span></span>`).join('')}</div>`

function treeRows(q, grp) {
  const B = build(), out = []
  const mk = (c, d) => {
    const leaf = isLeaf(c), hasKids = !!B.kids[c], o = CM.open.has(c)
    const lead = hasKids ? `<span style="display:inline-block;width:22px;vertical-align:middle;color:var(--line-ico)">${ico(o ? 'chevron-down' : 'chevron-right')}</span>` : `<span style="display:inline-block;width:22px"></span>`
    const w = c.length === 1 ? 600 : leaf ? 400 : 500
    const r = { c: { code: `<span class="${leaf ? '' : 'mute'}">${c}</span>`, name: `<span class="one" style="padding-left:${d * 22}px;font-weight:${w}">${lead}${esc(B.name[c])}</span>` } }
    if (leaf) {
      const w2 = added.find(a => a.c === c)
      r.c.type = esc(typeOf(c))
      r.c.loc = c.length === 10 ? `<span style="display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:500;cursor:pointer" onclick="event.stopPropagation();locTog('${c}')">${LOCS.length} locations ${ico(CM.loc.has(c) ? 'chevron-down' : 'chevron-right')}</span>` : '<span class="mute">One account</span>'
      r.c.act = w2 && !w2.created ? st('Waiting', 'warn') : isActive(c) ? 'Yes' : '<span class="mute">No</span>'
      r.on = `openAcc('${c}')`
    } else r.on = `coaTog('${c}')`
    return r
  }
  if (q) {
    leaves().concat(Object.keys(B.kids).filter(c => c.length === 7)).filter(c => (!grp || c[0] === grp) && hit(q, c, B.name[c])).sort().slice(0, 120).forEach(c => out.push(mk(c, 0)))
    return out
  }
  const walk = (c, d) => { out.push(mk(c, d)); if (CM.open.has(c) && B.kids[c]) B.kids[c].forEach(k => walk(k, d + 1)); if (CM.loc.has(c)) out.push({ group: locGrid(c) }) }
  Object.keys(GRPN).filter(g => !grp || g === grp).forEach(g => walk(g, 0))
  return out
}

/* the per-invoice lines of a party always add up to what the party owes */
function invoicesOf(p, kind) {
  if (!p.owing) return []
  const pre = kind === 'c' ? 'PJL' : 'PB', k = +String(p.code).replace(/\D/g, '') || 7
  const n = p.owing > 20000000 ? 3 : p.owing > 1000000 ? 2 : 1, out = []
  let left = p.owing
  for (let i = 0; i < n; i++) {
    const v = i === n - 1 ? left : Math.round(p.owing * (i === 0 ? 0.5 : 0.3) / 50) * 50
    left -= v
    const m = 8 - i, d = 4 + ((k + i * 7) % 22), dd = `2026-${pad(m, 2)}-${pad(d, 2)}`
    const days = { T7: 7, T14: 14, T30: 30, T45: 45, CASH: 0 }[p.term]
    const due = new Date(Date.parse(dd) + days * 864e5).toISOString().slice(0, 10)
    out.push({ no: `${pre}-26-${pad(m, 2)}-${pad(100 + k * 3 + i, 5)}`, date: dd, due, total: v })
  }
  return out
}

const monthsBetween = (from, to) => { const [fy, fm] = from.split('-'), [ty, tm] = to.split('-'); return (+ty - +fy) * 12 + (+tm - +fm) }
/* depreciation charged up to the end of September 2026 (closed), and the October charge */
function dep(a) {
  if (a.method === 'ND' || !a.life) return { done: 0, month: 0 }
  const n = Math.max(0, Math.min(a.life * 12, monthsBetween(a.use, '2026-10')))
  let done = 0
  if (a.method === 'SL') done = Math.round(a.cost / (a.life * 12) * n)
  else for (let i = 0; i < n; i++) done += Math.round((a.cost - done) * (2 / a.life) / 12)
  const left = a.cost - done
  const m = a.method === 'SL' ? Math.round(a.cost / (a.life * 12)) : Math.round(left * (2 / a.life) / 12)
  return { done, month: Math.min(m, left) }
}
