/* Void: the receipt picked, the Kepala toko's finger, done — no extra
   confirmation (owner, 23 Oct 2026: "simplify, jangan step"). Tukar: the
   receipt opens its items in the same dialog. */
function pkGo(no) {
  const k = S.pk, last = S.receipts.slice(0, 3);
  const r = no ? S.receipts.find(x => x.no === Number(no)) : (pickMatch() || last[k.i]);
  if (!r) return;
  if (r.status !== 'paid') { toast('info', `${rcNo(r.no)} sudah ${r.status === 'voided' ? 'di-void' : 'ditukar'}`); return; }
  S.pick = r.no;
  if (k.mode === 'void') { S.pk = null; S.ov = null; voidAsk(r); return; }
  Object.assign(k, { no: r.no, q: '', back: r.lines.map(() => 0) }); S.focus = 'exq';
}
function voidAsk(r) {
  askSupervisor(`Void ${rcNo(r.no)} · ${rp(r.total)}`, () => { r.status = 'voided'; toast('ok', 'Struk di-void', `${rcNo(r.no)} · barang kembali ke stok`); });

const exValue = () => { const k = S.pk, r = S.receipts.find(x => x.no === k.no); return r ? r.lines.reduce((a, l, i) => a + Math.round(net(l) / l.qty) * (k.back[i] || 0), 0) : 0; };
/* A tag scanned back: the first line that still has a piece to give back. */
function exScan() {
  const k = S.pk, r = S.receipts.find(x => x.no === k.no);
  const i = r ? r.lines.findIndex((l, j) => (k.back[j] || 0) < l.qty) : -1;

}

function exGo() {
  const k = S.pk, r = S.receipts.find(x => x.no === k.no), value = exValue();
  if (!r || !value) return;
  const pcs = k.back.reduce((a, n) => a + n, 0);
  askSupervisor(`Tukar ${pcs} pcs · ${rcNo(r.no)}`, () => {
    r.status = 'returned';
    S.exchange = { no: r.no, value };

/* ── Tukar barang (owner, 23 Oct 2026): one screen, no steps, no money back.
   The receipt opens its items: pick what came back and how many (− / +, or
   the sold tag on the reader). Pengganti: scan the tag or type its SKU — one

const xRc = () => S.receipts.find(r => r.no === S.xc.no);
const xUnit = l => Math.round(net(l) / l.qty);
const xBack = () => { const r = xRc(); return r ? r.lines.reduce((a, l, i) => a + xUnit(l) * (S.xc.back[i] || 0), 0) : 0; };

const xNewPcs = () => S.xc.add.reduce((a, x) => a + x.qty, 0);

  S.xc = { no: null, i: 0, back: [], add: [], q: '', sel: 0 }; S.ov = 'exchange'; S.anim.ov = ptr; S.pop = null; S.focus = 'xq';
}

function xReadSold() {
  const r = xRc(); if (!r) return;
  const i = r.lines.findIndex((l, j) => (S.xc.back[j] || 0) < l.qty);
  if (i >= 0) { S.xc.back[i] = (S.xc.back[i] || 0) + 1; S.xc.sel = i; return; }
  toast('info', `Semua barang struk ${rcNo(S.xc.no)} sudah dipilih`);
}
function xQty(i, d) {
  const r = xRc(); if (!r || !r.lines[i]) return;

/* A replacement read or typed: the same SKU again adds a piece to its row. */
function xReadStock(it) {
  it = it || ITEMS[(S.xc.add.length * 5 + 4) % ITEMS.length];

  if (hit) hit.qty++; else S.xc.add.push({ item: it, qty: 1 });
}

/* Return (client, 23 Oct 2026): the same till screen, marked Return. The pieces

function startReturn(r) {

function retReadSold() {

  const used = i => R.back.filter(b => b.li === i).length;

  if (i < 0) { toast('info', `Semua barang struk ${rcNo(R.no)} sudah dikembalikan`); return; }
  const l = rc.lines[i];

    const rc = S.receipts.find(x => x.no === R.no); if (rc) rc.status = 'returned';

}
function exchangeView() {

      <div class="dlg-body">

        </div>

function xGo() {
  const x = S.xc;
  if (!xBackPcs() || !x.add.length) return;
  const back = xBack(), add = xNew(), extra = Math.max(0, add - back);
  askSupervisor(`Return ${xBackPcs()} → ${xNewPcs()} barang · ${rcNo(x.no)}`, () => {
    const r = xRc(); if (r) r.status = 'returned';
    /* The replacements become the sale; what came back pays for them. */
    S.lines = x.add.map(a => ({ item: a.item, qty: a.qty, disc: null })); S.sel = S.lines.length - 1;
    S.exchange = { no: x.no, value: back };
    S.xc = null; S.ov = null;
    if (extra > 0) { openPay(false); return; }
    const t = totals();
    completeSale({ ...t, grand: add }, [{ m: 'exchange', amount: add }], 0, 0, true);
    toast('ok', 'Return selesai · tanpa bayar', back > add ? `Selisih ${rp(back - add)} tidak dikembalikan` : `Struk ${rcNo(S.seq - 1)}`);
  });
}

function placePop() {
  if (!S.pop) return;
  const pop = frame.querySelector('.pop'), trig = frame.querySelector(`[data-pop="${S.pop.key}"]`);
  if (!pop || !trig) return;
  const f = frame.getBoundingClientRect(), r = trig.getBoundingClientRect();
  const left = (r.left - f.left) / SCALE, right = (f.right - r.right) / SCALE, top = (r.bottom - f.top) / SCALE + 6;
  if (pop.classList.contains('right')) { pop.style.right = right + 'px'; } else { pop.style.left = Math.min(left, frame.clientWidth - pop.offsetWidth - 12) + 'px'; }
  const h = pop.offsetHeight;
  if (top + h > frame.clientHeight - 12) { pop.style.top = ((r.top - f.top) / SCALE - h - 6) + 'px'; pop.style.transformOrigin = pop.classList.contains('right') ? 'bottom right' : 'bottom left'; }
  else pop.style.top = top + 'px';
}

/* ── Actions ──────────────────────────────────────────────────────────── */
function finger(id) {
  if (S.fp === 'reading' || S.fp === 'done') return;
  clearTimers();
  S.fp = 'reading'; S.fpMsg = null; render();
  later(() => {
    const p = PEOPLE[id];
    const shut = p && !p.head && (S.closedIds || []).includes(p.id);
    if (!p || shut || (S.locked && p.id !== S.who.id && !p.head)) {
      S.fp = 'no';
      S.fpMsg = shut ? `${p.name} sudah tutup kasir hari ini` : S.locked && p ? `${STORE.till} sedang dipakai ${S.who.name}` : null;
      render();
      later(() => { S.fp = 'idle'; render(); }, 1700);
      return;
    }
    S.fp = 'done'; render();
    /* The Kepala toko's own finger on the sensor goes straight to "atas nama". */
    later(() => p.head && p.id !== (S.who && S.who.id) ? headIn() : welcome(p), 760);
  }, 980);
}
function welcome(p) {
  S.who = p; S.door = 'welcome'; S.fp = 'idle'; S.fpMsg = null; S.anim.rise = true; render();
  later(afterWelcome, 2050);
}
/* The Kepala toko is in: a locked till opens back for its cashier; a closed
   one asks whose name the shift opens in. */
function headIn() {
  clearTimers();
  S.by = SUPERVISOR; S.fp = 'idle'; S.fpMsg = null; S.pw = { user: '', pass: '' };
  if (S.locked) { welcome(S.who); return; }
  S.door = 'behalf'; S.bi = 0; S.anim.swap = true; render();
}
function headFinger(id) {
  if (S.fp === 'reading' || S.fp === 'done') return;
  clearTimers();
  S.fp = 'reading'; S.fpMsg = null; render();
  later(() => {
    const p = PEOPLE[id];
    if (!p || !p.head) { S.fp = 'no'; S.fpMsg = p ? `${p.name} bukan kepala toko` : null; render(); later(() => { S.fp = 'idle'; render(); }, 1700); return; }
    S.fp = 'done'; render();
    later(headIn, 760);
  }, 980);
}
function headSignIn() {
  const u = S.pw.user.trim().toUpperCase();
  if (!u || !S.pw.pass) { S.fpMsg = null; S.focus = !u ? 'pw-user' : 'pw-pass'; return; }
  const p = Object.values(PEOPLE).find(x => x.user === u || x.user.split(' ')[0] === u);
  if (!p || !p.head) { S.fpMsg = 'Password hanya untuk kepala toko'; S.pw.pass = ''; S.focus = 'pw-user'; return; }
  headIn();
}
function pickBehalf(id) {
  const p = id ? PEOPLE[id] : behalfList()[S.bi];
  if (!p) return;
  welcome(p);
}
function afterWelcome() {
  clearTimers();
  if (S.locked) { S.locked = false; S.screen = 'sell'; S.anim.arrive = true; render(); return; }
  if (S.shift) { S.screen = 'sell'; S.anim.arrive = true; render(); return; }
  S.door = 'float'; S.float = FLOAT_DEFAULT; S.floatFresh = true; S.anim.swap = true; render();
}
function openShift() {
  if (S.float <= 0) return;
  S.shift = { opened: now(), float: S.float, by: S.by && S.by !== S.who ? S.by : null };
  S.screen = 'sell'; S.anim.arrive = true; S.focus = 'scan';
  render();
  toast('ok', 'Kasir dibuka', `Saldo awal ${rp(S.float)}${S.shift.by ? ` · dibukakan ${S.shift.by.name}` : ''}`);

}

function addItem(it, src) {
  const same = l => l.item.sku === it.sku && !l.disc && !l.note && (l.src ? !!src && l.src.k === src.k && src.k !== 'unknown' && l.src.from === src.from : !src);
  if (S.ret && it.kind !== 'bag') { if (!S.ret.back.length) { S.scanErr = 'Scan dulu barang yang dikembalikan'; return; } S.lines.push({ item: it, qty: 1, disc: null, ...(S.ret.sel >= 0 ? { repFor: S.ret.sel } : {}) }); S.sel = S.lines.length - 1; S.last = it; S.scanErr = null; S.scrollSel = true; return; }
  const i = S.lines.findIndex(same);
  if (i >= 0) { S.lines[i].qty += 1; S.sel = i; }
  else { S.lines.push({ item: it, qty: 1, disc: null, ...(src ? { src } : {}) }); S.sel = S.lines.length - 1; }
  S.last = it; S.scanErr = null; S.unk = null; S.scrollSel = true;
}
function scan(raw) {
  let code = raw.trim(), many = 1;
  S.scanVal = '';
  if (!code) return;
  const qm = code.match(/^(\d{1,3})\s*[*xX]\s*(\S+)$/) || code.match(/^(\S+?)\s*[*xX]\s*(\d{1,3})$/);
  if (qm) { const a = /^\d{1,3}$/.test(qm[1]) && qm[2].length > 3; many = Number(a ? qm[1] : qm[2]); code = a ? qm[2] : qm[1]; }
  const digits = code.replace(/[·.\s-]/g, '');
  const member = MEMBERS.find(m => m.phone === digits || m.no.toLowerCase() === code.toLowerCase());
  if (member) { S.scanErr = 'Member dipilih saat Bayar'; return; }
  const coupon = COUPONS[code.toUpperCase()];
  if (coupon) {
    const c = code.toUpperCase();
    if (S.coupons.includes(c)) { S.scanErr = `Kupon ${c} sudah ada di transaksi ini`; return; }
    S.coupons = [...S.coupons, c]; S.scanErr = null;
    const row = totals().promos.find(r => r.code === c);
    toast('ok', `Kupon ${c}`, row && row.applied ? `${row.p.name} · ${rp(-row.cut)}` : `${row ? row.reason : 'Belum ada diskon'}`);
    return;
  }
  if (VOUCHERS[code.toUpperCase()]) { S.price = { q: code.toUpperCase(), i: 0 }; S.ov = 'price'; S.scanErr = null; return; }
  if (REDEEMS[code.toUpperCase()]) { S.rd = { q: code.toUpperCase(), found: null, err: null }; rdGo(); S.ov = 'redeem'; S.scanErr = null; return; }
  /* A SKU typed off the label sells one piece (a tag that will not read):
     "Tanpa tag" when this store has the SKU, "Luar toko" when
     it has none — stock goes minus and head office matches it later. */
  const exact = ITEMS.find(x => x.sku === digits);
  if (exact) { for (let n = 0; n < Math.max(1, many); n++) addItem(exact); return; }
  const bySku = /^\d{8}$/.test(digits) ? ITEMS.find(x => x.sku.startsWith(digits)) : null;
  const byName = /[a-z]/i.test(code) && ITEMS.some(x => x.name.toLowerCase().includes(code.toLowerCase()));
  if (bySku || byName) { S.price = { q: bySku ? bySku.sku : code, i: 0 }; S.ov = 'price'; S.scanErr = null; return; }
  S.scanErr = `“${code}” tidak ada di toko ini · minta barcode baru`;
}
/* The reader hands over every tag it sees, one after another: lines appear
   with no motion, and the chip says it is still reading. */
function rfidRead(items) {
  if (S.screen !== 'sell' || S.ov) return;
  S.reading = true; render();
  items.forEach((it, i) => later(() => { addItem(it); render(); }, 160 + i * 120));
  later(() => { S.reading = false; render(); }, 160 + items.length * 120 + 500);
}
function askRemove(i) {
  const l = S.lines[i];
  if (!l) return;
  const drop = () => { l.qty -= 1; if (l.qty <= 0) { S.lines.splice(S.lines.indexOf(l), 1); S.sel = Math.min(S.sel, S.lines.length - 1); } };
  if (l.item.kind === 'bag') { drop(); return; }
  askSupervisor(`Hapus 1 pcs · ${l.item.name}`, () => { drop(); toast('ok', 'Dihapus dari transaksi', `${l.item.name} · ${rp(l.item.price)}`); });
}
function resetSale() {
  S.lines = []; S.sel = -1; S.last = null; S.member = null; S.saleDisc = null; S.redeem = null; S.exchange = null; S.ret = null; S.coupons = []; S.scanVal = ''; S.scanErr = null;
}
function holdSale() {

  const t = totals();
  S.held.unshift({ id: String(Date.now()), at: now(), by: S.who.name, lines: S.lines, member: S.member, saleDisc: S.saleDisc, redeem: S.redeem, coupons: S.coupons, last: S.last, total: t.grand, pcs: t.pcs });

  toast('ok', 'Transaksi dilanjutkan', `${h.pcs} pcs · ${rp(h.total)}`);
}

function openPay(ptr, asked) {
  if (!S.lines.length) return;
  /* Member first (client): scan the card or type the number, register, or Enter to skip. */
  if (!S.member && !asked) { S.mem = { q: '', i: 0, mode: 'find', then: 'pay' }; S.ov = 'member'; S.anim.ov = ptr; S.pop = null; return; }

function payInput(k) {
  const p = S.pay, f = p.focus;
  let v = p.amt[f];
  if (/^\d+$/.test(k)) {
    const s = (p.fresh ? '' : String(v)) + k;
    const next = Number(s);
    if (String(next).length > 11) return;
    v = next; p.fresh = false;
  } else if (k === 'del') { v = Math.floor(v / 10); p.fresh = false; }
  else if (k === 'clr') { v = 0; p.fresh = true; }
  p.amt[f] = v; p.miss = null;

function doPay() {
  const p = S.pay, ps = payState();

  const need = ['debit', 'credit'].find(m => p.amt[m] > 0 && !p.onus[m]) || (p.vcode.trim() && !p.voucher ? 'voucher' : null);
  if (need) { p.miss = need; p.focus = need; if (need === 'voucher') S.focus = 'vcode'; render(); return; }
  const t = ps.t;
  const pays = METHODS.filter(m => p.amt[m.id] > 0).map(m => ({ m: m.id, amount: p.amt[m.id], mach: ['debit', 'credit', 'qris'].includes(m.id) ? p.mach[m.id] : null, onus: p.onus[m.id] || null, code: m.id === 'voucher' && p.voucher ? `${p.voucher.kind} ${p.voucher.code}` : null }));
  completeSale(t, pays, ps.change, p.amt.cash);
}
/* The sale is paid: its receipt, then the change (or a toast when there is none). */
function completeSale(t, pays, change, cashIn, quiet) {
  const rc = { no: S.seq, at: now(), lines: S.lines.map(l => ({ ...l })), total: t.grand, pcs: t.pcs, pays, cashier: S.who.name, member: S.member, status: 'paid', method: pays.length > 1 ? 'Split' : pays[0].m === 'exchange' ? 'Tukar' : methodName(pays[0].m), promos: [...t.promos.filter(r => r.applied).map(r => ({ name: r.p.name, cut: r.cut, code: r.code })), ...(t.rd ? [{ name: 'Tukar poin', cut: t.rd, code: S.redeem.code }] : []), ...(t.xc ? [{ name: 'Return', cut: t.xc, code: rcNo(S.exchange.no) }] : [])], points: t.points, change };
  S.receipts.unshift(rc); S.lastPaid = rc.no; S.pick = rc.no; S.seq += 1;
  resetSale();
  S.pay = null; S.pay2 = null;
  if (change >= 0) {
    S.ov = 'change';
    S.chg = { change, cash: cashIn, grand: t.grand, no: rc.no, printed: false, notes: countOut(change), points: t.points, member: rc.member };
    later(() => { if (S.chg && S.chg.no === rc.no) { S.chg.printed = true; render(); } }, 1200);
  } else {
    S.ov = null; S.focus = 'scan';
    if (quiet) return;
    toast('ok', `Lunas · ${rp(t.grand)}`, `Struk ${rcNo(rc.no)} tercetak${t.points ? ` · +${fmt(t.points)} poin` : ''}`);
  }
}

function act(name, arg, ptr, el) {
  switch (name) {
    case 'stop': return;
    /* door */
    case 'finger': finger(arg); return;
    case 'headDoor': clearTimers(); S.door = 'head'; S.fp = 'idle'; S.fpMsg = null; S.anim.swap = true; break;
    case 'headBack': clearTimers(); S.door = S.door === 'headpw' ? 'head' : 'touch'; S.fp = 'idle'; S.fpMsg = null; S.pw = { user: '', pass: '' }; if (S.door === 'touch') S.by = null; S.anim.swap = true; break;
    case 'headPw': clearTimers(); S.door = 'headpw'; S.fp = 'idle'; S.fpMsg = null; S.anim.swap = true; break;
    case 'headFinger': headFinger(arg); return;
    case 'headSignIn': headSignIn(); break;
    case 'behalf': pickBehalf(arg); return;
    case 'skipWelcome': afterWelcome(); return;
    case 'notYou': S.who = null; S.by = null; S.door = 'touch'; S.fp = 'idle'; S.float = 0; S.anim.swap = true; break;
    case 'fkey': floatKey(arg); break;
    case 'fpre': S.float = Number(arg); S.floatFresh = true; break;
    case 'openShift': openShift(); return;
    /* till */
    case 'tool': case 'key7': keyAct(arg, ptr); break;
    case 'pay': if (S.ret) retFinish(); else openPay(ptr); break;
    case 'member': keyAct('member', ptr); break;
    case 'memberPick': memberChosen(MEMBERS[Number(arg)]); break;
    case 'memNew': memNew(); break;
    case 'memBack': S.mem.mode = 'find'; break;
    case 'memReg': registerMember(); break;
    case 'pkGo': pkGo(arg); break;
    case 'rdGo': rdGo(); break;
    case 'memberClear': setMember(null); if (S.ov === 'member') { S.ov = null; S.mem = null; S.focus = 'scan'; } break;
    case 'scanFocus': S.focus = 'scan'; break;
    case 'receipts': S.ov = 'receipts'; S.anim.ov = ptr; S.pop = null; break;
    case 'bags': S.pop = S.pop && S.pop.kind === 'bags' ? null : { key: 'bags', kind: 'bags' }; S.anim.pop = ptr; break;
    case 'bagPick': addItem(BAGS[Number(arg)]); S.pop = null; break;
    case 'person': S.pop = S.pop && S.pop.kind === 'person' ? null : { key: 'person', kind: 'person' }; S.anim.pop = ptr; break;
    case 'lock': S.pop = null; S.locked = true; S.by = null; S.screen = 'door'; S.door = 'touch'; S.fp = 'idle'; S.anim.lift = true; break;
    case 'row': S.sel = Number(arg); break;
    case 'noteAt': S.sel = Number(arg); S.focus = 'lnote'; break;
    case 'rm': askRemove(Number(arg)); break;
    case 'pick': S.pick = Number(arg); break;
    case 'rcOpen': S.pick = Number(arg); S.sheet = { no: Number(arg), mode: 'view', ret: [] }; S.ov = 'receipt'; S.anim.ov = ptr; break;
    case 'rcPrint': S.pick = Number(arg); toast('ok', 'Mencetak salinan', rcNo(S.pick)); break;
    case 'held': resumeHeld(arg); if (S.ov === 'receipts') { S.ov = null; S.focus = 'scan'; } break;
    /* pay */
    case 'prow': focusRow(arg); break;
    case 'mach': focusRow(arg); S.pop = S.pop && S.pop.key === 'mach-' + arg ? null : { key: 'mach-' + arg, kind: 'mach', method: arg, i: Math.max(0, machinesFor(arg).findIndex(x => x.id === S.pay.mach[arg])) }; S.anim.pop = ptr; break;
    case 'machPick': S.pay.mach[S.pop.method] = arg; S.pop = null; break;
    case 'onus': { const [m, x] = arg.split(':'); S.pay.onus[m] = x; focusRow(m); if (S.pay.miss === m) S.pay.miss = null; break; }
    case 'key': payInput(arg); break;
    case 'note': S.pay.focus = 'cash'; S.pay.amt.cash += Number(arg); S.pay.fresh = false; settle('cash'); break;
    case 'quick': S.pay.amt[S.pay.focus] = Number(arg); S.pay.fresh = true; S.pay.miss = null; if (S.pay.auto === S.pay.focus) S.pay.auto = null; settle(S.pay.focus); break;
    case 'couponRemove': S.coupons = S.coupons.filter(c => c !== arg); S.pop = null; break;
    case 'promos': S.pop = S.pop && S.pop.kind === 'promos' ? null : { key: 'promos', kind: 'promos' }; S.anim.pop = ptr; break;
    case 'doPay': doPay(); break;
    /* Pay looks A–D */
    case 'p2row': if (S.pay2.focus !== Number(arg)) pay2Focus(Number(arg)); break;
    case 'p2mach': { const [i, id] = arg.split(':'); S.pay2.lines[Number(i)].mach = id; pay2Focus(Number(i)); break; }
    case 'p2onus': { const [i, x] = arg.split(':'); const l = S.pay2.lines[Number(i)]; if (l.edc) { edcSetCard(l, x); pay2Focus(Number(i)); break; } l.onus = x; if (S.pay2.miss === l) S.pay2.miss = null; break; }
    case 'p2edcMore': edcMore(Number(arg)); break;
    case 'vClear': { const l = S.pay2.lines[Number(arg)]; if (l) voucherClear(l); break; }
    case 'p2undo': { const [i, q] = arg.split(':'); const l = S.pay2.lines[Number(i)]; if (l) { edcUndo(l, q); pay2Focus(Number(i)); } break; }
    case 'p2quick': pay2ApplyQuick(Number(arg)); break;
    case 'p2key': pay2Digit(arg); break;
    case 'p2plus': { const l = pay2Target(); if (l) { const lock = pay2Lock(l); if (lock) { pay2Locked(l, lock); break; } pay2Set(l, l.amount + Number(arg), true); S.pay2.fresh = false; } break; }
    case 'p2pay': doPay2(); break;
    case 'p2rm': S.pay2.lines.splice(Number(arg), 1); break;
    case 'p2meth': if (CARDISH(arg)) { S.pay2.draft = payLine(arg); S.pay2.step = 'machine'; } else pay2Begin(arg); break;
    case 'p2tile': { const x = TILES[Number(arg)]; if (x.m === 'edc') edcPick(x.mach); else pay2Begin(x.m, x.mach); break; }
    case 'p2edck': edcKind(arg); break;
    case 'padToggle': padToggle(); break;
    case 'p2bank': { const [i, b] = arg.split(':'); const l = S.pay2.lines[Number(i)]; if (l) { edcSetBank(l, b); pay2Focus(Number(i)); } break; }
    case 'p2kindE': { const [i, m] = arg.split(':'); const l = S.pay2.lines[Number(i)]; if (l) { edcSetKind(l, m); pay2Focus(Number(i)); } break; }
    case 'p2edcc': edcCard(arg); break;
    case 'p2pickm': pay2Begin(S.pay2.draft.m, arg); break;
    case 'p2kind': S.pay2.draft.m = arg; break;
    case 'p2donus': S.pay2.draft.onus = arg; if (S.pay2.miss === S.pay2.draft) S.pay2.miss = null; break;
    case 'p2add': pay2Add(); break;
    case 'newSale': S.ov = null; S.chg = null; S.focus = 'scan'; break;
    case 'closeOv': closeOv(); break;
    case 'veil': {
      if (S.pop) { S.pop = null; break; }
      if (S.ov === 'pay' && payState().paid > 0) return;
      closeOv(); break;
    }
    /* discount */
    case 'dTarget': S.disc.target = arg; S.focus = 'dval'; break;
    case 'dKind': S.disc.kind = arg; S.focus = 'dval'; break;
    case 'dApply': applyDiscount(); break;
    case 'qtyUp': keyAct('new', false); break;
    case 'retSel': if (S.ret) S.ret.sel = S.ret.sel === Number(arg) ? -1 : Number(arg); break;
    case 'retNew': if (S.ret) S.ret.sel = -1; break;
    case 'retDrop': {
      const R = S.ret, j = Number(arg); if (!R || !R.back[j]) break;
      R.back.splice(j, 1);
      S.lines.forEach(l => { if (l.repFor === j) delete l.repFor; else if (l.repFor > j) l.repFor -= 1; });
      R.sel = Math.min(R.sel, R.back.length - 1); S.exchange.value = R.back.reduce((a, b) => a + b.unit, 0);
      break;
    }
    case 'repCycle': { const l = S.lines[Number(arg)]; if (S.ret && l) { const n = l.repFor === undefined ? 0 : l.repFor + 1; if (n < S.ret.back.length) l.repFor = n; else delete l.repFor; } break; }
    case 'drawerOpen': S.pop = null; toast('info', 'Laci dibuka', `${STORE.till} · ${hm(now())}`); break;
    case 'floatAdd': S.pop = null; S.fadd = { v: '' }; S.ov = 'fadd'; S.anim.ov = ptr; S.focus = 'fadd'; break;
    case 'faddGo': faddGo(); break;
    case 'depositNow': S.pop = null; askSupervisor('Setoran sementara', () => { S.slip = { kind: 'setor', no: 'ST-' + String(7 + (S.slipSeq = (S.slipSeq || 0) + 1)).padStart(4, '0'), at: now(), from: S.who.name, to: SUPERVISOR.name }; S.ov = 'slip'; S.anim.ov = true; }, `${S.who.name} · ${STORE.till}`); break;
    case 'slipDone': S.ov = null; S.slip = null; S.focus = S.screen === 'sell' ? 'scan' : null; break;
    case 'slipPrint': toast('ok', 'Mencetak ulang', S.slip.no); break;
    case 'qtyDown': keyAct('minus', false); break;
    case 'benFinger': {
      const p2 = S.pay2, l = p2.lines[Number(arg)]; if (!l) break;
      if (totals().disc) { p2.note = 'Diskon karyawan tidak bisa dipakai bersama promo.'; break; }
      /* The finger shows whose balance it is; the cashier then types how much. */
      pay2Focus(Number(arg));
      askEmployee(b => { l.ben = { name: b.name, balance: b.balance }; l.amount = 0; l.auto = false; l.reveal = true; p2.note = b.balance ? null : `Saldo diskon karyawan ${b.name} kosong`; });
      break;
    }
    case 'benClear': { const l = S.pay2.lines[Number(arg)]; if (l) { l.ben = null; l.amount = 0; pay2Focus(Number(arg)); } break; }
    case 'heldGo': { const h = S.held[Number(arg)]; if (h) { S.ov = null; S.hl = null; resumeHeld(h.id); } break; }
    case 'heldDel': { const h = S.held[Number(arg)]; if (h) askSupervisor('Hapus transaksi tunda', () => { S.held = S.held.filter(x => x !== h); if (!S.held.length) { S.ov = null; S.hl = null; } toast('ok', 'Transaksi tunda dihapus', `${h.pcs} pcs · ${rp(h.total)}`); }, `${hm(h.at)} · ${h.by} · ${rp(h.total)}`); break; }
    case 'payHold': S.ov = null; S.pay = null; S.pay2 = null; holdSale(); S.focus = 'scan'; break;
    case 'gender': S.mem.gender = arg; break;
    case 'chgMember': { const no = S.chg.no; S.mem = { q: '', i: 0, mode: 'find', after: no }; S.ov = 'member'; S.chg = null; break; }
    case 'memSkip': { S.ov = null; S.mem = null; openPay(false, true); break; }
    case 'unkOpen': if (S.unk) openUnknown(S.unk); break;
    case 'unkGo': unkGo(); break;
    case 'dClear': if (S.disc.target === 'line' && S.lines[S.sel]) S.lines[S.sel].disc = null; else S.saleDisc = null; S.ov = null; S.disc = null; break;
    case 'cancelSale': resetSale(); S.ov = null; toast('info', 'Transaksi dibatalkan'); break;
    /* receipt */
    case 'printCopy': toast('ok', 'Mencetak salinan', rcNo(S.sheet.no)); break;
    case 'void': { const r = S.receipts.find(x => x.no === S.sheet.no); S.ov = null; S.sheet = null; voidAsk(r); break; }
    case 'exFrom': S.sheet = null; S.ov = null; openExchange(ptr); break;
    case 'xQty': { const [i, d] = arg.split(':').map(Number); xQty(i, d); S.focus = 'xq'; break; }
    case 'xTap': { S.xc.sel = Number(arg); S.focus = 'xbq'; break; }
    case 'xAddQty': { const [i, d] = arg.split(':').map(Number); xAddQty(i, d); S.focus = 'xq'; break; }
    case 'xReset': Object.assign(S.xc, { no: null, i: 0, back: [], add: [], q: '' }); S.focus = 'xq'; break;
    case 'xGo': xGo(); break;
    case 'xPick': xPick(arg); break;
    case 'exQty': { const [i, d] = arg.split(':').map(Number); const r = S.receipts.find(x => x.no === S.pk.no); S.pk.back[i] = Math.max(0, Math.min(r.lines[i].qty, (S.pk.back[i] || 0) + d)); S.focus = 'exq'; break; }
    case 'exBack': Object.assign(S.pk, { no: null, back: [], q: '' }); break;
    case 'exGo': exGo(); break;
    case 'retMode': { const r = S.receipts.find(x => x.no === S.sheet.no); S.sheet.mode = 'return'; S.sheet.ret = r.lines.map(() => 0); break; }
    case 'retCancel': S.sheet.mode = 'view'; break;
    case 'retQty': { const [i, d] = arg.split(':').map(Number); const r = S.receipts.find(x => x.no === S.sheet.no); S.sheet.ret[i] = Math.max(0, Math.min(r.lines[i].qty, (S.sheet.ret[i] || 0) + d)); break; }
    case 'retDo': {
      const r = S.receipts.find(x => x.no === S.sheet.no);
      const refund = r.lines.reduce((a, l, i) => a + l.item.price * (S.sheet.ret[i] || 0), 0);
      const pcs = S.sheet.ret.reduce((a, n) => a + n, 0);
      askSupervisor(`Retur ${pcs} pcs · ${rp(refund)}`, () => { r.status = 'returned'; S.sheet.mode = 'view'; toast('ok', 'Diretur', `${pcs} pcs · ${rp(refund)} dikembalikan tunai`); });
      break;
    }
    case 'dlgNo': S.dlg2 = null; break;
    case 'dlgYes': return dlgYes();
    case 'supFinger': supFinger(arg); return;
    case 'supCancel': S.sup = null; break;
    /* close cash */
    case 'cRow': if (S.count.focus !== Number(arg)) { S.count.focus = Number(arg); S.count.fresh = true; } break;
    case 'cStep': { const [i, d] = arg.split(':').map(Number); S.count.pcs[i] = Math.max(0, Math.min(9999, S.count.pcs[i] + d)); S.count.focus = i; S.count.fresh = true; break; }
    case 'cBack':
      if (S.count.stage === 'cash' && S.count.edc.length) { S.count.stage = 'edc'; S.anim.stage = ptr; break; }
      S.screen = 'sell'; S.count = null; S.focus = 'scan'; break;
    case 'eRow': if (S.count.efocus !== Number(arg)) { S.count.efocus = Number(arg); S.count.efresh = true; } break;
    case 'eNext': settleEdc(ptr); break;
    case 'cClose': if (countTotal() > 0) { S.dlg2 = { kind: 'closeCash' }; S.anim.dlg2 = ptr; } break;
    case 'floatDeposit': floatDeposit(); break;
    case 'pPrint': S.paper.done = true; S.paper.prints += 1; S.paper.printed = now(); toast('ok', 'Mencetak kertas tutup kasir', `Cetak ke ${S.paper.prints} · ${rp(S.paper.pcs.reduce((a, n, i) => a + n * DENOMS[i].v, 0))}`); break;
    case 'pDone': signOutAfterClose(); break;
    default: return;
  }
  render();
}
/* Every key of the toolbar, pressed or clicked: one place, so a key and its
   tile can never do two different things. */
function keyAct(id, ptr) {
  if (S.screen !== 'sell') return;
  const none = !S.lines.length;
  switch (id) {
    /* 7Soft's Baru: a fresh sale; the one on the counter is held, never lost. */
    case 'new': if (S.lines[S.sel] && S.lines[S.sel].item.kind !== 'bag') { S.lines[S.sel].qty += 1; } break;
    case 'minus': if (S.lines[S.sel]) { if (S.lines[S.sel].qty > 1) S.lines[S.sel].qty -= 1; else askRemove(S.sel); } break;
    case 'void': S.pk = { mode: id, q: '', i: 0, no: null, back: [] }; S.ov = 'pick'; S.anim.ov = ptr; S.pop = null; break;
    case 'return': openExchange(ptr); break;
    case 'check': S.price = { q: '', i: 0 }; S.ov = 'price'; S.anim.ov = ptr; S.pop = null; break;
    case 'drawer': S.pop = S.pop && S.pop.kind === 'drawer' ? null : { key: 'drawer', kind: 'drawer' }; S.anim.pop = ptr; break;
    case 'close':
      if (!none) { toast('info', 'Selesaikan atau tunda transaksi dulu', `${totals().pcs} pcs di keranjang`); break; }
      /* No closing with a held sale (client): pay it, or a supervisor deletes it. */
      if (S.held.length) { toast('info', `Masih ada ${pl(S.held.length, 'transaksi tunda')}`, 'Bayar atau hapus (supervisor) dulu'); S.hl = { i: 0 }; S.ov = 'held'; break; }
      openClose(ptr); break;
    /* Member is asked at Bayar; F5 registers a member, with or without a struk
       (Hari, 24 Oct 2026). A struk number ties that sale and its points to them. */
    case 'member': S.mem = { q: '', i: 0, mode: 'new', phone: '', name: '', err: null, direct: true, f5: true, rcq: '' }; S.ov = 'member'; S.anim.ov = ptr; S.pop = null; break;
    case 'register': S.mem = { q: '', i: 0, mode: 'new', phone: '', name: '', err: null, direct: true }; S.ov = 'member'; S.anim.ov = ptr; S.pop = null; break;
    case 'bags': S.pop = S.pop && S.pop.kind === 'bags' ? null : { key: 'bags', kind: 'bags', i: 0 }; S.anim.pop = ptr; break;
    /* Hold parks the sale; on an empty counter it brings back the last one parked. */
    case 'hold': if (S.ret) { toast('info', 'Return tidak bisa ditunda'); break; } if (S.held.length) { S.hl = { i: 0 }; S.ov = 'held'; S.anim.ov = ptr; S.pop = null; } break;
    case 'discount': if (!none) { S.pop = S.pop && S.pop.kind === 'promos' ? null : { key: 'promos', kind: 'promos' }; S.anim.pop = ptr; } break;
    case 'cancel': if (S.ret) { resetSale(); toast('info', 'Return dibatalkan'); break; } if (!none) { S.ov = 'cancel'; S.anim.ov = ptr; } break;
    case 'redeem': S.rd = { q: '', found: null, err: null }; S.ov = 'redeem'; S.anim.ov = ptr; S.pop = null; break;
    case 'pay': if (S.ret) retFinish(); else openPay(ptr); break;
  }
}
function applyDiscount() {
  const d = S.disc, v = Number(d.val || 0);
  if (!v) return;
  const disc = { kind: d.kind, v: d.kind === '%' ? Math.min(v, 100) : v };
  if (d.target === 'line' && S.lines[S.sel]) S.lines[S.sel].disc = disc;
  else S.saleDisc = disc;
  S.ov = null; S.disc = null; S.focus = 'scan';
}
function closeOv() {
  if (S.ov === 'receipt' && S.sheet && S.sheet.mode === 'return') { S.sheet.mode = 'view'; return; }
  S.ov = null; S.pay = null; S.disc = null; S.mem = null; S.price = null; S.sheet = null; S.pop = null; S.chg = null; S.pk = null; S.rd = null; S.pay2 = null; S.xc = null; S.unkd = null;
  if (S.screen === 'sell') S.focus = 'scan';
}
function dlgYes() {
  const d = S.dlg2;
  S.dlg2 = null;
  if (d.kind === 'void') {
    const r = S.receipts.find(x => x.no === d.no);
    askSupervisor(`Void ${rcNo(r.no)}`, () => { r.status = 'voided'; toast('ok', 'Struk di-void', `${rcNo(r.no)} · ${rp(r.total)} dikembalikan tunai`); });
  } else if (d.kind === 'closeCash') finishClose();
  render();
}

/* ── Events ───────────────────────────────────────────────────────────── */
frame.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !frame.contains(el)) { if (S.pop) { S.pop = null; render(); } return; }
  if (S.pop && !el.closest('.pop') && !(el.dataset.pop)) { S.pop = null; }
  act(el.dataset.act, el.dataset.arg, e.detail > 0, el);
});
frame.addEventListener('input', e => {
  const el = e.target, b = el.dataset && el.dataset.bind;
  if (!b) return;
  const v = el.value;
  switch (b) {
    case 'scan': S.scanVal = v; if (S.scanErr) { S.scanErr = null; S.unk = null; render(); } break;
    case 'find': S.find = v; render(); break;
    case 'vcode': {
      const p = S.pay, vc = VOUCHERS[v.trim().toUpperCase()];
      p.vcode = v;
      if (vc && (!p.voucher || p.voucher.code !== v.trim().toUpperCase())) {
        p.voucher = { code: v.trim().toUpperCase(), ...vc };
        p.focus = 'voucher'; p.fresh = true; p.miss = null;
        if (p.auto && p.auto !== 'voucher') p.amt[p.auto] = 0;
        p.auto = null; p.amt.voucher = restFor('voucher'); settle(null);
        render();
      } else if (!vc && p.voucher) { p.voucher = null; p.amt.voucher = 0; settle(null); render(); }
      else if (p.miss === 'voucher') { p.miss = null; render(); }
      break;
    }
    case 'dval': S.disc.val = v.replace(/\D/g, '').slice(0, 9); render(); break;
    case 'uname': S.unkd.name = v; render(); break;
    case 'fadd': S.fadd.v = v.replace(/\D/g, '').replace(/^0+/, '').slice(0, 9); S.focus = 'fadd'; render(); break;
    case 'uprice': S.unkd.price = v.replace(/\D/g, '').replace(/^0+/, '').slice(0, 9); S.focus = 'uprice'; render(); break;
    case 'mq': S.mem.q = v; S.mem.i = 0; render(); break;
    case 'mphone': S.mem.phone = v; break;
    case 'mname': S.mem.name = v; break;
    case 'mplace': S.mem.place = v; break;
    case 'mbirth': S.mem.birth = v; break;
    case 'maddr': S.mem.addr = v; break;
    case 'memail': S.mem.email = v; break;
    case 'mrc': S.mem.rcq = v; render(); break;
    case 'pkq': S.pk.q = v; S.pk.i = 0; render(); break;
    case 'exq': S.pk.q = v; break;
    case 'xq': S.xc.q = v; S.xc.stage = 'add'; break;
    case 'xbq': S.xc.bq = v; S.xc.stage = 'back'; break;
    case 'rdq': S.rd.q = v; S.rd.found = null; S.rd.err = null; render(); break;
    case 'pq': S.price.q = v; S.price.i = 0; render(); break;
    case 'cnote': S.count.note = v; break;

    case 'byhead': S.screen = 'door'; S.who = PEOPLE.rizky; S.by = SUPERVISOR; S.shift = null; S.door = 'welcome'; setClock(8, 58, 6); break;
    case 'welcome': S.screen = 'door'; S.who = PEOPLE.andi; S.shift = null; S.door = 'welcome'; S.anim.rise = true; setClock(8, 58, 6); render(); later(afterWelcome, 2050); return;
    case 'float': S.screen = 'door'; S.who = PEOPLE.andi; S.shift = null; S.receipts = []; S.door = 'float'; S.float = FLOAT_DEFAULT; S.floatFresh = true; setClock(8, 58, 8); break;
    /* Stills of the key map's dialogs. */
    case 'kvoid': baseShift(); S.screen = 'sell'; photoBasket(); keyAct('void', false); break;
    case 'kcheck': baseShift(); S.screen = 'sell'; photoBasket(); keyAct('check', false); S.price.q = 'GC-7Y3K-22QD'; break;

    case 'pay': baseShift(); S.screen = 'sell'; photoBasket(); openPay(false, true); if (!S.pay2) { S.pay.amt.cash = 1150000; S.pay.fresh = false; } break;
    case 'debit': baseShift(); S.screen = 'sell'; photoBasket(); openPay(false, true); if (S.pay2) { S.pay2 = newPay2(S.payLook); pay2Preset(true); break; } S.pay.amt.debit = 1122000; S.pay.focus = 'debit'; S.pay.mach.debit = 'mandiri'; S.pay.onus.debit = 'On us'; S.pay.fresh = true; break;
    case 'change': {
      baseShift(); S.screen = 'sell'; photoBasket(); openPay(false, true); S.pay.amt.cash = 1150000; doPay();
      if (S.chg) S.chg.printed = true;
      break;
    }
    case 'receipt': baseShift(); S.screen = 'sell'; S.sheet = { no: 2765, mode: 'view', ret: [] }; S.ov = 'receipt'; break;
    case 'void': baseShift(); S.screen = 'sell'; keyAct('void', false); break;
    case 'returnpick': baseShift(); S.screen = 'sell'; openExchange(false); break;
    case 'exchange': baseShift(); S.screen = 'sell'; openExchange(false); xPick(2765); retReadSold(); retReadSold(); S.ret.sel = 0; addItem(ITEMS[4]); S.ret.sel = 1; addItem(ITEMS[0]); break;
    case 'exchange2': baseShift(); S.screen = 'sell'; openExchange(false); xPick(2765); retReadSold(); addItem(ITEMS[10]); break;
    case 'edc': baseShift(); setClock(17, 1, 20); S.screen = 'close'; S.count = newCount(); break;
    case 'close': baseShift(); setClock(17, 4, 52); S.screen = 'close'; S.count = newCount(); slipsMatch(); S.count.stage = 'cash'; S.count.pcs = EXCEL_COUNT.slice(); break;
    case 'paper': baseShift(); setClock(17, 5, 40); S.count = newCount(); slipsMatch(); S.count.pcs = EXCEL_COUNT.slice(); finishClose(); break;
  }
  render();
}
function simButtons() {
  const step = currentStep();
  const b = (label, fn, bad) => `<button class="c-sim${bad ? ' bad' : ''}" data-sim="${fn}">${label}</button>`;
  if (S.screen === 'door' && S.door === 'touch') return `<span class="c-lbl">Jari di sensor</span>${b('Andi Saputra', 'f:andi')}${b('Rizky Pratama', 'f:rizky')}${b('Bima Prasetyo · Kepala toko', 'f:bima')}${b('Jari tak dikenal', 'f:x', true)}<span class="c-lbl" style="margin-left:6px">Enter = Andi · K = dibukakan kepala toko</span>`;
  if (S.screen === 'door' && S.door === 'head') return `<span class="c-lbl">Jari di sensor</span>${b('Bima Prasetyo · Kepala toko', 'h:bima')}${b('Andi (bukan kepala toko)', 'h:andi', true)}<span class="c-lbl" style="margin-left:6px">Enter = Bima · Esc kembali</span>`;
  if (S.screen === 'door' && S.door === 'headpw') return `${b('Isi BIMA C011', 'hpw')}<span class="c-lbl" style="margin-left:6px">Username kasir ditolak · Enter lanjut · Esc kembali</span>`;
  if (S.screen === 'door' && S.door === 'behalf') return `<span class="c-lbl">↑↓ atau 1–3 pilih nama · Enter buka · Esc batal</span>`;
  if (step === 'welcome' || step === 'float') return `${b('Ulangi selamat datang', 'replay')}<span class="c-lbl" style="margin-left:6px">Angka mengubah saldo awal · Enter buka kasir</span>`;
  if (S.ret) return `<span class="c-lbl">Reader</span>${b('Barang kembali (tag terjual)', 'xSold')}${b('Barang pengganti / baru', 'xStock')}${b('Scan berikut = barang baru', 'retNewSim')}<span class="c-lbl" style="margin-left:6px">Klik barang kembali = scan berikut jadi penggantinya (klik lagi = barang baru) · ▾ pindahkan · tong sampah = batalkan barang kembali · F7 batalkan return · F12 selesaikan</span>`;
  if (step === 'sell' || step === 'basket' || step === 'untagged') return `<span class="c-lbl">RFID reader</span>${b('3 barang di reader', 'read3')}${b('Satu tag lagi', 'read1')}${b('Seperti foto', 'fill')}${b('Kupon HEMAT50', 'scanCoupon')}${b('2 Kiddo Polo', 'readKiddo')}${b('Ketik 3*SKU', 'scanPrice')}${b('Tag dari Cikupa', 'readOther')}${b('SKU stok 0', 'typeUnid')}${b('Barang tanpa label', 'scanBad', true)}<span class="c-lbl" style="margin-left:6px">+ baru · − hapus · F1 void · F2 cek · F3 laci · F4 tutup kasir · F5 daftar member · F6 kantong · F8 return · F9 daftar tunda · F12 bayar · Ctrl+P cetak ulang · Ctrl+L kunci</span>`;
  if ((step === 'pay' || step === 'debit') && S.pay2) return `<span class="c-lbl">${S.payLook === 'E' ? 'Tunai: ketik langsung · EDC: 1–3 mesin, lalu ←→ ganti mesin · D Debit / K Kredit / Q QRIS · Y kartu sama / T bank lain · Backspace batalkan pilihan · + tambah EDC (dari baris mana pun) · . = 000 · F9 tunda · Enter pembayaran diterima' : S.payLook === 'A' ? '↑↓ baris · ←→ mesin · Y/T kartu bank mesin? · + kartu lain · F1–F4 saran · . = 000 · Enter bayar' : S.payLook === 'B' ? '↑↓ baris · Spasi On us/Off us · F1–F4 saran · Enter bayar' : S.payLook === 'C' ? '1–5 cara bayar · 1–3 mesin · ←→ On us/Off us · F1–F4 saran · Enter tambah, lalu bayar · Esc kembali' : 'Angka: mesin → Debit / Kredit / QRIS → kartu sama atau beda → jumlah · F1–F4 saran · Enter tambah, lalu bayar · F9 tunda · Esc kembali'}</span>`;
  if (step === 'pay' || step === 'debit') return `<span class="c-lbl">Pelanggan bayar</span>${b('Tunai Rp 1.150.000', 'payCash')}${b('Debit, pas', 'payDebit')}${b('Tunai 500 rb, lalu Debit', 'paySplit')}${b('Gift card GC-7Y3K-22QD', 'payVoucher')}${b('Kartu kelebihan', 'payOver', true)}<span class="c-lbl" style="margin-left:6px">Ketik angka · ↑↓ cara bayar · ← On us · → Off us · Enter bayar · Esc tutup</span>`;
  if (S.ov === 'exchange') return `<span class="c-lbl">Reader</span>${b('Barang kembali (tag terjual)', 'xSold')}${b('Barang pengganti (tag stok)', 'xStock')}<span class="c-lbl" style="margin-left:6px">Enter tukar · Esc batal</span>`;
  if (step === 'receipt') return `${b('Buka struk yang di-void', 'rcVoided')}${b('Buka struk yang diretur', 'rcReturned')}`;
  if (step === 'edc') return `<span class="c-lbl">Slip EDC</span>${b('Isi slip', 'eok')}${b('Kosongkan slip', 'eclear')}<span class="c-lbl" style="margin-left:6px">Ketik total slip · Enter berikutnya · F4 hitung uang</span>`;
  if (step === 'close') return `${b('Isi seperti Excel', 'cxl')}${b('Kosongkan hitungan', 'cclear')}<span class="c-lbl" style="margin-left:6px">Ketik jumlah · Enter baris berikutnya · + − · F4 tutup kasir</span>`;
  return '';
}
function sim(name) {
  const [k, arg] = name.split(':');
  switch (k) {
    case 'f': if (S.screen === 'door' && S.door === 'touch') finger(arg === 'x' ? 'nobody' : arg); return;
    case 'h': if (S.screen === 'door' && S.door === 'head') headFinger(arg); return;
    case 'hpw': if (S.screen === 'door' && S.door === 'headpw') { S.pw = { user: 'BIMA C011', pass: '••••••' }; S.fpMsg = null; S.focus = 'pw-pass'; } break;
    case 'replay': goStep('welcome'); return;
    case 'read3': {
      if (S.screen !== 'sell' || S.ov) return;
      const start = (S.lines.length * 3) % ITEMS.length;
      rfidRead([0, 1, 2].map(k => ITEMS[(start + k * 5) % ITEMS.length])); return;
    }
    case 'read1': if (S.screen !== 'sell' || S.ov) return; rfidRead([ITEMS[(S.lines.length * 7 + 3) % ITEMS.length]]); return;
    case 'scanPrice': if (S.screen !== 'sell' || S.ov) return; scan('3*10077301305'); break;
    case 'scanCoupon': if (S.screen !== 'sell' || S.ov) return; scan('HEMAT50'); S.focus = 'scan'; break;
    case 'readKiddo': if (S.screen !== 'sell' || S.ov) return; rfidRead([ITEMS[10], ITEMS[10]]); return;
    case 'scanBad': if (S.screen !== 'sell' || S.ov) return; scan('Kemeja batik biru'); S.focus = 'scan'; break;
    case 'readOther': if (S.screen !== 'sell' || S.ov) return; S.scanErr = `${ITEMS[1].name} milik Cikupa · tidak bisa dijual di toko ini`; break;
    case 'typeUnid': if (S.screen !== 'sell' || S.ov) return; scan('10095520316'); S.focus = 'scan'; break;
    case 'scanMember': if (S.screen !== 'sell' || S.ov) return; scan(MEMBERS[0].no); S.focus = 'scan'; break;
    case 'fill': if (S.screen !== 'sell' || S.ov) return; resetSale(); rfidRead(PHOTO.flatMap(([i, q]) => Array(q).fill(ITEMS[i]))); return;
    case 'payCash': if (!S.pay) return; Object.assign(S.pay.amt, { cash: 1150000, debit: 0, credit: 0, qris: 0, voucher: 0 }); S.pay.focus = 'cash'; S.pay.fresh = false; break;
    case 'payDebit': if (!S.pay) return; Object.assign(S.pay.amt, { cash: 0, debit: 0, credit: 0, qris: 0, voucher: 0 }); S.pay.auto = null; S.pay.focus = 'cash'; focusRow('debit'); S.pay.onus.debit = 'On us'; break;
    case 'paySplit': {
      if (!S.pay) return;
      Object.assign(S.pay.amt, { cash: 0, debit: 0, credit: 0, qris: 0, voucher: 0 }); S.pay.auto = null;
      S.pay.focus = 'cash'; S.pay.amt.cash = 500000; settle('cash'); focusRow('debit'); S.pay.onus.debit = null; break;
    }
    case 'payVoucher': {
      if (!S.pay) return;
      Object.assign(S.pay.amt, { cash: 0, debit: 0, credit: 0, qris: 0, voucher: 0 }); S.pay.auto = null;
      S.pay.vcode = 'GC-7Y3K-22QD'; S.pay.voucher = { code: 'GC-7Y3K-22QD', ...VOUCHERS['GC-7Y3K-22QD'] }; S.pay.focus = 'voucher';
      S.pay.amt.voucher = restFor('voucher'); settle(null); focusRow('cash'); break;
    }
    case 'payOver': if (!S.pay) return; Object.assign(S.pay.amt, { cash: 0, debit: 0, credit: 0, qris: 0, voucher: 0 }); S.pay.auto = null; S.pay.focus = 'debit'; S.pay.amt.debit = totals().grand + 50000; settle('debit'); break;
    case 'retNewSim': if (S.ret) { S.ret.sel = -1; } break;
    case 'xSold': if (S.ret) { retReadSold(); break; } if (S.xc) { xReadSold(); S.focus = 'xq'; } break;
    case 'xStock': if (S.ret) { addItem(ITEMS[[4, 0, 10, 2][S.lines.length % 4]]); break; } if (S.xc) { xReadStock(); S.focus = 'xq'; } break;
    case 'rcVoided': S.sheet = { no: 2758, mode: 'view', ret: [] }; S.ov = 'receipt'; break;
    case 'rcReturned': S.sheet = { no: 2757, mode: 'view', ret: [] }; S.ov = 'receipt'; break;
    case 'eok': if (S.count) slipsMatch(); break;
    case 'eoff': if (S.count) { slipsMatch(); const m = S.count.edc.find(x => x.id === 'mandiri'); if (m) { m.slip = m.till - 94000; S.count.efocus = S.count.edc.indexOf(m); } } break;
    case 'eclear': if (S.count) { S.count.edc.forEach(m => { m.slip = 0; }); S.count.efocus = 0; S.count.efresh = true; } break;
    case 'cxl': if (S.count) { S.count.pcs = EXCEL_COUNT.slice(); } break;
    case 'cclear': if (S.count) { S.count.pcs = DENOMS.map(() => 0); S.count.focus = COUNT_ORDER[0]; S.count.fresh = true; } break;
  }
  render();
}

let lastChrome = '';
function renderChrome() {
  const step = currentStep();
  const steps = STEPS.map(([id, label], i) => `<button class="${id === step ? 'on' : ''}" data-step="${id}"><b>${i + 1}</b>${label}</button>`).join('');
  const sizes = SIZE_ORDER.map(k => `<button class="${S.size === k ? 'on' : ''}" data-size="${k}">${k === 'full' ? 'Layar penuh' : `${SIZES[k][0]} × ${SIZES[k][1]}`}</button>`).join('');
  const sims = simButtons();
  const vers = VERSIONS.map(([k, l]) => `<button class="${S.ver === k ? 'on' : ''}" data-ver="${k}"><b>${k}</b>${l}</button>`).join('');
  const pays = PAY_LOOKS.map(([k, l]) => `<button class="${S.payLook === k ? 'on' : ''}" data-pay="${k}">${k === 'now' ? '' : `<b>${k}</b>`}${l}</button>`).join('');
  const foots = FOOTS.map(([k, l]) => `<button class="${(S.foot || 'A') === k ? 'on' : ''}" data-foot="${k}"><b>${k}</b>${l}</button>`).join('');
  const sig = vers + pays + foots + steps + sizes + sims;
  if (sig === lastChrome) return;
  lastChrome = sig;
  document.getElementById('c-ver').innerHTML = vers;
  document.getElementById('c-pay').innerHTML = pays;
  document.getElementById('c-steps').innerHTML = steps;
  document.getElementById('c-size').innerHTML = sizes;
  const simRow = document.getElementById('c-sim');
  simRow.innerHTML = sims;
  simRow.style.display = sims ? '' : 'none';
  layout();
}
document.getElementById('chrome').addEventListener('click', e => {
  const st = e.target.closest('[data-step]'); if (st) { goStep(st.dataset.step); return; }
  const vr = e.target.closest('[data-ver]');
  if (vr) { S.ver = vr.dataset.ver; lastChrome = ''; if (S.screen === 'sell') render(); else goStep('basket'); return; }
  const sz = e.target.closest('[data-size]');
  if (sz) { S.size = sz.dataset.size; lastChrome = ''; if (S.size === 'full') goFull(); layout(); render(); return; }
  const sm = e.target.closest('[data-sim]'); if (sm) { sim(sm.dataset.sim); return; }
  const fo = e.target.closest('[data-foot]');
  if (fo) { S.foot = fo.dataset.foot; lastChrome = ''; if (S.screen === 'sell' && !S.ov) render(); else goStep('basket'); return; }
  const pl = e.target.closest('[data-pay]');
  if (pl) { S.payLook = pl.dataset.pay; lastChrome = ''; const st = currentStep(); goStep(st === 'debit' ? 'debit' : 'pay'); return; }
  if (e.target.closest('#c-hide')) toggleBar();
});
function toggleBar() { document.getElementById('chrome').classList.toggle('hidden'); document.body.classList.toggle('bare'); layout(); }
/* Layar penuh: the bar goes, the till takes the whole monitor, and on a
   browser that allows it the page goes fullscreen with every key kept for the
   till (F1–F12 and Esc included; holding Esc leaves). ` brings the bar back. */
function goFull() {
  if (!document.body.classList.contains('bare')) toggleBar();
  const el = document.documentElement;
  if (el.requestFullscreen && !document.fullscreenElement) {
    el.requestFullscreen().then(() => { if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(() => {}); }).catch(() => {});
  }
}
/* The size the layout is drawn for: on the full screen, the nearest of the three. */
function effSize() {
  if (S.size !== 'full') return S.size;
  const w = document.getElementById('stage').clientWidth;
  return w >= 1700 ? '1920' : w < 1200 ? '1024' : '1366';
}

function layout() {
  const ch = document.getElementById('chrome');
  const bare = ch.classList.contains('hidden');
  const top = bare ? 0 : ch.offsetHeight;
  const stage = document.getElementById('stage');
  stage.style.top = top + 'px';
  const full = S.size === 'full';
  document.body.classList.toggle('full', full);
  const sw = stage.clientWidth, sh = stage.clientHeight;
  /* Full: the till is the window, never drawn smaller than 1024 × 640. */
  const [w, h] = full ? [Math.max(1024, sw), Math.max(640, sh)] : SIZES[S.size];
  const pad = bare || full ? 0 : 24;
  const sc = Math.min(1, (sw - pad) / w, (sh - pad) / h);
  SCALE = sc;
  holder.style.width = Math.round(w * sc) + 'px';
  holder.style.height = Math.round(h * sc) + 'px';
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  frame.style.transform = `scale(${sc})`;
  frame.dataset.size = effSize();
  placePop();
}
window.addEventListener('resize', () => { const was = frame.dataset.size; layout(); if (S.size === 'full' && frame.dataset.size !== was) render(); });

/* The clock ticks in place: never a re-render, never animated. */
setInterval(() => {
  const d = now();
  frame.querySelectorAll('[data-clock]').forEach(el => { el.textContent = el.dataset.clock === 'hm' ? hm(d) : dayTime(d); });
}, 10000);

const HASH = (location.hash || '').slice(1).split('.');
if (VERSIONS.some(([k]) => k === HASH[0])) S.ver = HASH[0];
const PAYH = HASH.find(x => /^pay[A-D]$/.test(x)); if (PAYH) S.payLook = PAYH.slice(3);
if (HASH.includes('bare')) { document.getElementById('chrome').classList.add('hidden'); document.body.classList.add('bare'); }
const SIZEH = HASH.find(x => SIZES[x] !== undefined); if (SIZEH) S.size = SIZEH;
/* .still: no motion at all, for a film that draws the screen frame by frame. */
if (HASH.includes('still')) document.head.insertAdjacentHTML('beforeend', '<style>*,*::before,*::after{animation:none!important;transition:none!important}</style>');
if (STEPS.some(([id]) => id === HASH[1]) || ['kvoid', 'kcheck', 'kreg', 'kredeem', 'headpw', 'behalf', 'byhead'].includes(HASH[1])) goStep(HASH[1]);
else { S.anim.lift = true; render(); }
layout();
})();
