<style>
/* POS classic — the client's 7Soft "Penjualan Cash" flow (F-key toolbar, big
   total, barcode line, grid, receipts on the right, pay dialog with every
   method on one page, change, cash close by note) drawn in Central's own
   design system. Tokens and ds-* classes come from frontend-hub/design-system. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-sans);font-size:15px;line-height:1.45;color:var(--ink);background:#d6d9df;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,textarea{border:0;outline:none;background:none;min-width:0}
p,h1,h2,h3,dl,dd{margin:0}
.num{font-variant-numeric:tabular-nums}
svg{flex:none;display:block}
.sp{flex:1}
.mute{color:var(--body)}
.faint{color:var(--faint)}

/* ── Prototype chrome (outside the till) ─────────────────────────────── */
#chrome{position:fixed;left:0;right:0;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--hairline);padding:8px 16px;display:flex;flex-direction:column;gap:6px}
#chrome.hidden{display:none}
.c-row{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.c-title{font-size:17px;font-weight:600;letter-spacing:-.3px;margin-right:6px}
.c-steps{display:flex;gap:2px;flex-wrap:wrap}
.c-steps button{height:30px;padding:0 9px;border-radius:7px;font-size:15px;color:var(--body);white-space:nowrap}
.c-steps button b{font-weight:600;color:var(--faint);margin-right:5px;font-variant-numeric:tabular-nums}
.c-steps button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.c-steps button.on b{color:var(--accent)}
.c-sp{flex:1}
.c-seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--segment-track)}
.c-seg button{height:28px;padding:0 10px;border-radius:7px;font-size:15px;font-weight:500;color:var(--body);white-space:nowrap}
.c-seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-segment)}
.c-seg button b{font-weight:600;margin-right:5px}
.c-btn{height:32px;padding:0 10px;border:1px solid var(--hairline-2);border-radius:8px;background:#fff;font-size:15px;font-weight:500;white-space:nowrap}
.c-lbl{color:var(--body);white-space:nowrap}
.c-sim{height:30px;padding:0 10px;border-radius:7px;font-size:15px;font-weight:600;color:var(--accent);background:var(--accent-bg);white-space:nowrap}
.c-sim.bad{color:var(--bad-fg);background:var(--bad-bg)}
@media (hover:hover) and (pointer:fine){.c-steps button:hover{color:var(--ink)}.c-btn:hover{background:var(--soft-2)}}
#stage{position:fixed;left:0;right:0;bottom:0;display:grid;place-items:center;overflow:hidden}
#holder{position:relative;overflow:hidden;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.14)}
body.bare #holder,body.full #holder{border-radius:0;box-shadow:none}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--stone);font-size:15px;line-height:1.45}

/* ── Motion. Pointer opens animate; keys and scans never do ─────────── */
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.97)}}
@keyframes sheetIn{from{transform:translateX(calc(100% + 24px))}}
@keyframes menuIn{from{opacity:0;transform:scale(.96)}}
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}}
@keyframes swapIn{from{opacity:0;transform:translateY(4px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}
@keyframes lift{from{opacity:0;transform:translateY(8px) scale(.985)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.m-veil{animation:fadeIn 200ms var(--ease-out)}
.m-pop{animation:popIn 200ms var(--ease-out)}
.m-sheet{animation:sheetIn var(--t-sheet) var(--ease-drawer)}
.m-menu{animation:menuIn var(--t-pop) var(--ease-out)}
.m-rise{animation:rise 560ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 80ms)}
.m-arrive{animation:arrive 380ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 50ms)}
.m-swap{animation:swapIn 200ms var(--ease-out) both}
.m-toast{animation:toastIn 200ms var(--ease-out)}
.m-lift{animation:lift 480ms var(--ease-out) both}

/* ── Shared bits ──────────────────────────────────────────────────────── */
.kbd{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:5px;background:var(--soft-3);box-shadow:inset 0 0 0 1px var(--hairline-2);font-size:15px;line-height:1;font-weight:500;color:var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.ds-btn--primary .kbd{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);color:#fff}
.ds-btn--tint .kbd{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--avatar-from),var(--avatar-to));color:var(--ink);font-size:15px;font-weight:600;letter-spacing:-.01em}
.av.md{width:44px;height:44px;font-size:16px}
.av.lg{width:80px;height:80px;font-size:28px;letter-spacing:-.02em}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;animation:live 2.4s var(--ease-out) infinite}
@keyframes live{from{box-shadow:0 0 0 0 rgb(54 184 39/45%)}to{box-shadow:0 0 0 6px rgb(54 184 39/0%)}}
.spin{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid var(--hairline-2);border-top-color:var(--accent);animation:spin 600ms linear infinite;flex:none}
.veil{position:absolute;inset:0;z-index:20;background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:grid;place-items:center}
.veil.top{z-index:30}
.veil.sup-veil{z-index:50}
.x-btn{display:grid;place-items:center;flex:none;width:36px;height:36px;margin:-6px -8px 0 0;border-radius:var(--r-inner);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.x-btn:hover{background:var(--soft-2)}}
.field{width:100%;height:var(--field);padding:0 14px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;font-size:15px;transition:border-color 120ms ease,box-shadow 120ms ease}
.field:focus{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.field[aria-invalid="true"]{border-color:var(--bad)}
.field::placeholder{color:var(--line-ico)}

/* ── The door: sign in; a locked till unlocks by finger with a welcome ── */
.door{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--stone)}
.d-card{position:relative;width:420px;height:612px;border-radius:var(--r-sheet);background:#fff;box-shadow:var(--shadow-page);overflow:hidden}
.d-in{position:absolute;inset:0;padding:40px 32px 30px;display:flex;flex-direction:column;align-items:center}
.d-mark{width:60px;height:60px}
.d-word{margin-top:14px;font-size:28px;line-height:1;font-weight:700;letter-spacing:-.04em}
.d-word i,.t-brand b i{font-style:normal;color:#efa614}
.d-till{margin-top:10px;color:var(--body)}
.d-lockname{margin-top:12px;font-size:17px;font-weight:600;letter-spacing:-.2px}
.d-say{margin-top:26px;font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.2px;text-align:center}
.d-say.bad{color:var(--bad-fg)}
.d-hint{margin-top:4px;min-height:22px;color:var(--body);text-align:center}
.d-foot{margin-top:auto;display:flex;justify-content:center;gap:8px}
.d-chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:var(--r-inner);background:var(--accent-bg);color:var(--accent);font-size:15px;font-weight:600;white-space:nowrap;transition:background-color 150ms ease,scale 160ms var(--ease-out)}
.d-chip:active{scale:.97}
@media (hover:hover) and (pointer:fine){.d-chip:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}}
.d-status{margin-top:22px;display:flex;align-items:center;gap:10px;color:var(--body)}
.d-status .dot{color:var(--faint)}

/* The sensor. Idle it breathes; a finger draws the ridges in from the
   centre while a beam reads down; a match fills it blue with a check. */
.fp{position:relative;margin-top:44px;width:152px;height:152px;border-radius:50%;display:grid;place-items:center;background:var(--soft-2);isolation:isolate;transition:scale 160ms var(--ease-out),background-color 200ms ease}
.fp:active{scale:.98}
.fp::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px var(--hairline-2);transition:box-shadow 200ms ease;z-index:0}
.fp.idle::after{content:"";position:absolute;inset:0;border-radius:50%;animation:breathe 2.8s var(--ease-in-out) infinite}
@keyframes breathe{0%{box-shadow:0 0 0 0 rgb(40 98 220/20%)}70%,100%{box-shadow:0 0 0 16px rgb(40 98 220/0%)}}
@media (hover:hover) and (pointer:fine){.fp.idle:hover{background:var(--segment-track)}}
.fp-glyph{position:relative;z-index:1;width:92px;height:92px}
.fp-glyph path{fill:none;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round}
.fp-base path{stroke:var(--faint)}
.fp-ink path{stroke:var(--accent);stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.fp.reading::before{box-shadow:inset 0 0 0 2px var(--accent)}
.fp.reading .fp-ink path{animation:draw 440ms var(--ease-out) both;animation-delay:calc(var(--o) * 70ms + 60ms)}
.fp.done .fp-ink path,.fp.no .fp-ink path{stroke-dashoffset:0;opacity:1}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}10%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.fp-clip{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;z-index:2}
.fp-beam{position:absolute;left:0;right:0;top:-52px;height:52px;opacity:0;background:linear-gradient(180deg,rgb(40 98 220/0) 0%,rgb(40 98 220/.08) 55%,rgb(40 98 220/.42) 96%,rgb(40 98 220/0) 100%)}
.fp.reading .fp-beam{animation:beam 940ms var(--ease-in-out) forwards}
@keyframes beam{0%{opacity:0;transform:translateY(0)}14%{opacity:1}86%{opacity:1}100%{opacity:0;transform:translateY(204px)}}
.fp-fill{position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:0;transform:scale(.55);z-index:3}
.fp.done .fp-fill{animation:fill 340ms var(--ease-out) forwards}
@keyframes fill{to{opacity:1;transform:scale(1)}}
.fp.done .fp-glyph{animation:fadeBlur 220ms var(--ease-out) forwards}
@keyframes fadeBlur{to{opacity:0;filter:blur(3px)}}
.fp-check{position:absolute;z-index:4;width:60px;height:60px;opacity:0}
.fp.done .fp-check{opacity:1}
.fp-check path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.fp.done .fp-check path{animation:draw 320ms var(--ease-out) 170ms both}
.fp.no::before{box-shadow:inset 0 0 0 2px var(--bad)}
.fp.no .fp-ink path{stroke:var(--bad)}
.fp.no{animation:shake 400ms var(--ease-out)}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}38%{transform:translateX(8px)}58%{transform:translateX(-5px)}78%{transform:translateX(2px)}}
.fp.sm{margin-top:20px;width:120px;height:120px}
.fp.sm .fp-glyph{width:72px;height:72px}
.fp.sm .fp-check{width:48px;height:48px}

/* welcome: the blue check folds into the person's avatar, then the name rises */
.d-center{justify-content:center;padding-bottom:56px;cursor:default}
.w-orb{position:relative;margin-top:44px;width:152px;height:152px;display:grid;place-items:center;flex:none}
.w-av{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--avatar-from),var(--avatar-to));font-size:36px;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.w-blue{position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none}
.w-check{position:absolute;width:60px;height:60px;opacity:0;pointer-events:none}
.w-check path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.w-orb.run .w-blue{animation:orbOut 560ms var(--ease-out) both}
.w-orb.run .w-check{animation:checkOut 200ms var(--ease-out) both}
.w-orb.run .w-av{animation:avIn 600ms var(--ease-out) both}
@keyframes orbOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.7)}}
@keyframes checkOut{0%{opacity:1}100%{opacity:0;transform:scale(.8)}}
@keyframes avIn{0%{opacity:0;transform:scale(1.32)}40%{opacity:1}100%{opacity:1;transform:scale(1)}}
.d-hello{margin-top:22px;font-size:17px;line-height:24px;color:var(--body)}
.d-name{margin-top:2px;font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.035em;text-align:center}
.d-meta{margin-top:10px;color:var(--body);text-align:center}
.d-progress{position:absolute;left:32px;right:32px;bottom:34px;height:3px;border-radius:3px;background:#edf1f8;overflow:hidden}
.d-progress i{position:absolute;inset:0;border-radius:inherit;background:var(--accent);transform:scaleX(0);transform-origin:left}
.d-progress.run i{animation:prog 1900ms linear forwards}
@keyframes prog{to{transform:scaleX(1)}}

/* opening float */
.d-float{padding:30px 32px 28px;align-items:stretch}
.f-who{display:flex;align-items:center;gap:12px}
.f-who-t{flex:1;min-width:0;line-height:20px}
.f-who-t b{display:block;font-weight:600}
.f-who-t span{color:var(--body)}
.f-title{margin-top:22px;font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.3px}
.f-amt{margin-top:10px;height:64px;border-radius:var(--r-inner);background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--accent);box-shadow:var(--shadow-focus)}
.f-amt .cur{font-size:20px;font-weight:500;color:var(--body)}
.f-amt .v{font-size:34px;line-height:40px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.f-amt .v.zero{color:var(--faint)}
.f-amt .v.sel{margin:0 -4px;padding:0 4px;border-radius:6px;background:var(--accent-bg)}
.caret{width:2px;height:30px;border-radius:1px;background:var(--accent);animation:blink 1.06s steps(1) infinite}
.f-pre{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f-pre button{height:40px;border-radius:var(--r-inner);background:var(--accent-bg);color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;transition:scale 120ms var(--ease-out),background-color 150ms ease}
.f-pre button:active{scale:.97}
.f-pre button.on{background:var(--accent);color:#fff}
.f-pad{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f-pad button{height:52px;border-radius:var(--r-inner);background:var(--soft-2);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;display:grid;place-items:center;transition:scale 120ms var(--ease-out),background-color 150ms ease}
.f-pad button:active{scale:.96}
@media (hover:hover) and (pointer:fine){.f-pad button:hover{background:var(--segment-track)}.f-pre button:not(.on):hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}}
.f-open{margin-top:18px;width:100%;height:52px;border-radius:var(--r-inner);justify-content:space-between;padding:0 14px 0 20px;font-size:17px}
.f-open[disabled]{opacity:.45}

.d-chip .kbd{margin:0 -4px 0 8px;height:20px;min-width:22px;background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent)}

/* opened by the Kepala toko: her finger or her password, then whose name */
.d-headtop{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px}
.d-ttl{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.3px}
.d-sub{align-self:stretch;margin-top:4px;color:var(--body)}
.bh-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.bh-row{display:flex;align-items:center;gap:12px;height:60px;padding:0 14px 0 12px;border-radius:var(--r-inner);background:var(--soft-2);text-align:left;transition:scale 120ms var(--ease-out),background-color 150ms ease}
.bh-row:active{scale:.98}
.bh-row.on{background:var(--accent-bg);box-shadow:inset 0 0 0 1.5px var(--accent)}
.bh-t{min-width:0;display:flex;flex-direction:column;line-height:20px}
.bh-t b{font-weight:600}
.bh-t span{color:var(--body)}
.bh-list+.f-open{margin-top:auto}
@media (hover:hover) and (pointer:fine){.bh-row:not(.on):hover{background:var(--segment-track)}}

/* Tukar barang: one screen, two lists */
.veil .dlg.xch{width:min(1120px,calc(100% - 48px));max-width:none;min-height:560px}
.dlg.xch .mem-list .mem{min-height:64px}
.dlg .t-scanbox.xc-scan{display:flex;flex:none;width:100%;font-size:18px;align-items:center;gap:12px;height:60px;padding:0 18px;border-radius:12px;background:#fff;border:1.5px solid var(--accent);box-shadow:var(--shadow-focus);color:var(--body)}
.dlg .xc-scan svg{width:22px;height:22px;flex:none}
.dlg .xc-scan input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:18px;color:var(--ink)}
.dlg .xc-scan input::placeholder{color:var(--body)}
.xc-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:300px}
.xc-col{display:flex;flex-direction:column;gap:6px;min-width:0;padding:12px;border-radius:12px;background:var(--soft-2)}
.xc-k{display:flex;justify-content:space-between;align-items:baseline}
.xc-k b{font-size:17px;font-weight:600}
.xc-k span{font-weight:600}
.xc-col .mini{display:flex;flex-direction:column;gap:4px}
.xc-col .mini-row{background:#fff;border-radius:8px}
.xc-none{padding:6px 2px;color:var(--body)}
.xc-col{padding:16px;gap:12px}
.xc-col .mini{gap:8px}
.xc-col .mini-row{padding:14px 16px;gap:14px;min-height:72px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--hairline)}
.xc-col .mini-row b{display:block;margin-bottom:2px}
.xc-col .mini-row .ret{gap:10px}
.dlg .t-scanbox.xc-scan.idle{border-color:var(--hairline-2);box-shadow:none}
.xc-col .mini-row.xc-pick{cursor:pointer}
.xc-col .mini-row.xc-pick.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.ret button:disabled{opacity:.35}
.dlg .t-scanbox.xc-scan.sm{height:52px;font-size:17px;box-shadow:none;margin-bottom:4px}
.dlg .xc-scan.sm input{font-size:17px}
.xc-sum{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:4px;color:var(--body)}
.xc-sum b{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.03em;color:var(--ink)}

/* password: the Kepala toko's only */
.d-pw{margin-top:30px;width:100%;display:flex;flex-direction:column;gap:14px}
.d-pw label{display:flex;flex-direction:column;gap:8px;color:var(--body)}
.d-pw input{height:var(--field);padding:0 14px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;font-size:16px;color:var(--ink);transition:border-color 120ms ease,box-shadow 120ms ease}
.d-pw input:focus{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.d-pw .ds-btn{height:48px;margin-top:6px;font-size:16px;border-radius:var(--r-inner)}

/* ── The till: toolbar, sale, receipts, status ───────────────────────── */
.till{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:60px minmax(0,1fr) 36px;background:var(--stone)}
.t-top{display:flex;align-items:center;gap:8px;padding:0 12px 0 18px;min-width:0}
.t-brand{display:flex;align-items:center;gap:9px;margin-right:14px;flex:none}
.t-brand svg{width:30px;height:30px}
.t-brand b{font-size:19px;font-weight:700;letter-spacing:-.045em}
.t-tool{gap:8px;padding:0 8px 0 11px;background:#fff}
.t-tool svg{color:var(--line-ico)}
#frame[data-size="1024"] .t-tool .kbd,#frame[data-size="1024"] .t-top .t-person-t{display:none}
/* 7Soft's toolbar: a keycap over its word */
.t-keys7{display:flex;align-items:center;gap:2px;min-width:0}
.k7-gap{flex:none;width:12px}
.k7{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;min-width:54px;padding:0 8px;border-radius:var(--r-inner);white-space:nowrap;transition:background-color 150ms ease,scale 120ms var(--ease-out)}
.k7:active{scale:.96}
@media (hover:hover) and (pointer:fine){.k7:hover{background:rgb(0 0 0/4%)}}
.k7-k{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:5px;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline-2),0 1px 0 var(--hairline-2);font-size:15px;line-height:1;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.k7-l{font-size:15px;line-height:18px;color:var(--body)}
.k7.bad .k7-l{color:var(--bad-fg)}
.k7.go .k7-k{background:var(--accent);color:#fff;box-shadow:none}
.k7.go .k7-l{color:var(--accent);font-weight:600}
.k7[disabled]{opacity:.4;pointer-events:none}
.t-top .t-person{gap:6px;padding:0 6px}
#frame[data-size="1024"] .k7{min-width:0;padding:0 4px}
#frame[data-size="1024"] .k7-gap{width:4px}
#frame[data-size="1024"] .t-brand b{display:none}
.v-C .t-keys{justify-content:center}
.v-C .t-keys7{gap:6px}
/* the member card at the head of the side (A, C) */
.t-mem{padding:16px 16px 14px;border-bottom:1px solid var(--hairline)}
.t-mem-who{display:flex;align-items:center;gap:12px}
.t-mem-none{color:var(--line-ico)}
.t-mem-t{display:flex;flex-direction:column;min-width:0;line-height:20px}
.t-mem-t b{font-weight:600}
.t-mem-t span{color:var(--body)}
.t-mem-t .pts{color:var(--ink);font-variant-numeric:tabular-nums}
.t-mem-act{margin-top:12px;display:flex;gap:8px}
.t-mem-act .ds-btn--sm{height:32px;gap:6px;padding:0 8px 0 12px}
.t-mname{font-weight:500;text-align:left}
.t-side .t-list:has(+.t-prev){flex:none;min-height:0;overflow:visible}
.t-side .t-prev{flex:1 1 0}
.t-side .t-slip{flex:1 1 0;height:auto}
/* dialogs: check, member, receipt picker, redeem */
.chk{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px;border-radius:12px;background:var(--accent-bg)}
.chk-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#fff;color:var(--accent)}
.chk-t{display:flex;flex-direction:column;min-width:0;line-height:20px}
.chk-t b{font-weight:600}
.chk-t span{color:var(--body)}
.chk-v{display:flex;flex-direction:column;align-items:flex-end;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chk-v span{font-size:15px;line-height:20px;font-weight:400;letter-spacing:0;color:var(--body)}
.mem-err{color:var(--bad-fg)}
.mem-k{color:var(--body);font-weight:500;margin-bottom:-8px}
.mem-new .av{color:var(--accent);background:var(--accent-bg)}
.mem-new b{color:var(--accent)!important}
.mem-new .kbd{color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 0 0 1px rgb(40 98 220/30%)}
.mem .bad{color:var(--bad-fg)}
.mem .warn{color:var(--warn-fg)}
.mem .ok{color:var(--ok-fg)}
.t-tool.bad{color:var(--bad-fg)}
.t-tool.bad svg{color:currentColor}
.t-person{margin-left:auto;display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 6px;border-radius:var(--r-inner);flex:none;text-align:left;transition:background-color 120ms ease}
@media (hover:hover) and (pointer:fine){.t-person:hover{background:rgb(0 0 0/4%)}}
.t-person-t{display:flex;flex-direction:column;line-height:19px}
.t-person-t b{font-weight:600}
.t-person-t span{color:var(--body)}
.t-person>svg{color:var(--line-ico)}
.t-main{display:grid;grid-template-columns:minmax(0,1fr) var(--side,320px);gap:12px;padding:0 12px;min-height:0}
.t-page,.t-side{background:#fff;border-radius:16px;box-shadow:var(--shadow-page);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.t-status{display:flex;align-items:center;gap:10px;padding:0 22px;color:var(--body);white-space:nowrap}
.t-status .dot{color:var(--faint)}

.t-hero{display:flex;align-items:flex-end;gap:24px;padding:18px 24px 18px;border-bottom:1px solid var(--hairline)}
.t-hfacts{flex:1;min-width:0;display:flex;align-items:flex-end;padding-bottom:4px}
.t-total{flex:none;text-align:right}
.t-total-k{color:var(--body);line-height:20px}
.t-total-k .ok{color:var(--ok-fg)}
.t-total-fig{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;margin-top:2px}
.t-total-fig .cur{font-size:26px;font-weight:500;color:var(--body);letter-spacing:-.02em}
.t-total-fig .big{font-size:64px;line-height:64px;font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.t-fact{position:relative;display:flex;flex-direction:column;justify-content:center;flex:0 1 auto;min-width:0;padding:0 22px}
.t-ell{min-width:0;overflow:hidden;text-overflow:ellipsis}
.t-fact:first-child{padding-left:0}
.t-fact+.t-fact::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1px;background:var(--hairline)}
.t-fact .k{color:var(--body);line-height:20px}
.t-fact .v{display:flex;align-items:center;gap:8px;min-height:28px;font-weight:500;white-space:nowrap;min-width:0}
.t-fact .v .mute{font-weight:400}
.t-fact .ds-btn--sm{height:28px;gap:6px;padding:0 6px 0 10px}
.t-fact .ds-btn--sm .kbd{height:20px;min-width:24px}
.t-x{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;color:var(--line-ico)}
@media (hover:hover) and (pointer:fine){.t-x:hover{background:var(--soft-2);color:var(--ink)}}
.t-pay{height:56px;padding:0 12px 0 22px;gap:20px;border-radius:var(--r-inner);font-size:17px;margin-bottom:4px}
.t-pay[disabled]{opacity:.4}

.t-scan{display:flex;align-items:center;gap:8px;padding:12px 24px 10px}
.t-rfid{display:flex;align-items:center;gap:11px;flex:none;height:48px;padding:0 18px 0 14px;border-radius:var(--r-inner);background:var(--soft-2)}
.t-rfid-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.t-rfid.on .t-rfid-dot{background:var(--accent);animation:rfidPulse 900ms var(--ease-out) infinite}
@keyframes rfidPulse{from{box-shadow:0 0 0 0 rgb(40 98 220/45%)}to{box-shadow:0 0 0 8px rgb(40 98 220/0%)}}
.t-rfid-t{display:flex;flex-direction:column;line-height:19px;white-space:nowrap}
.t-rfid-t b{font-weight:600}
.t-rfid-t span{color:var(--body);font-variant-numeric:tabular-nums}
.t-rfid.on .t-rfid-t span{color:var(--accent)}
.t-scanbox{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 14px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;cursor:text;transition:border-color 120ms ease,box-shadow 120ms ease}
.t-scanbox:focus-within{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.t-scanbox.bad{border-color:var(--bad);box-shadow:0 0 0 2px rgb(215 0 21/10%)}
.t-scanbox>svg{color:var(--line-ico)}
.t-scanbox input{flex:1;height:100%;font-size:17px;letter-spacing:.01em}
.t-scanbox input::placeholder{color:var(--line-ico)}
.t-scanerr{color:var(--bad-fg);white-space:nowrap}
.t-big{height:48px;padding:0 14px;gap:8px;border-radius:var(--r-inner)}
.t-big svg{color:var(--line-ico)}

.t-grid{flex:1;min-height:0;overflow:auto;margin:0 24px 14px;border:1px solid var(--hairline);border-radius:10px;overscroll-behavior:contain}
.t-grid table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.t-grid th{position:sticky;top:0;z-index:1;height:40px;padding:0 12px;background:var(--band);box-shadow:inset 0 -1px 0 var(--hairline);color:var(--body);font-weight:500;text-align:left;white-space:nowrap}
.t-grid td{height:51px;padding:0 12px;border-bottom:1px solid var(--row-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.t-grid tbody tr:last-child td{border-bottom-color:transparent}
.t-grid th:first-child,.t-grid td:first-child{padding-left:18px}
.t-grid tr.sel td{background:var(--accent-bg)}
.t-grid tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
@media (hover:hover) and (pointer:fine){.t-grid tbody tr:not(.sel):hover td{background:var(--soft)}}
.t-grid .r{text-align:right;font-variant-numeric:tabular-nums}
.t-grid .c{text-align:center}
.t-grid .b{font-weight:500}
.t-grid .disc{color:var(--ok-fg)}
.nm-w{display:flex;align-items:baseline;gap:10px;min-width:0}
.mem-rc{margin-top:6px;color:var(--body);font-variant-numeric:tabular-nums}
.nm-2{display:flex;flex-direction:column;min-width:0;line-height:20px}
.nm-sub{color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm-t{flex:0 1 auto;min-width:112px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.nm-v{flex:0 4 auto;min-width:0;color:var(--body);overflow:hidden;text-overflow:ellipsis}
.nm-w.has-tag .nm-v{display:none}
.nm-w.two .nm-t{min-width:72px}
.t-grid td.t-notec{padding:0 8px;cursor:text}
.t-grid th.t-noteh{padding-left:8px}
.t-note{width:100%;height:34px;padding:0 10px;border:1px solid var(--hairline-2);border-radius:8px;background:#fff;transition:border-color 120ms ease,box-shadow 120ms ease}
.t-note:focus{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.t-note::placeholder{color:var(--line-ico)}
.t-rm{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-inner);color:var(--bad-fg)}
@media (hover:hover) and (pointer:fine){.t-rm:hover{background:var(--bad-bg)}}
.t-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;min-height:180px;color:var(--body)}
.t-empty svg{color:var(--faint)}

.t-side-head{display:flex;align-items:baseline;gap:8px;padding:18px 20px 12px}
.t-side-head h2{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.3px;margin:0}
.t-find{display:flex;align-items:center;gap:8px;margin:0 16px 6px;height:38px;padding:0 10px;border:1px solid var(--hairline-2);border-radius:8px;transition:border-color 120ms ease,box-shadow 120ms ease}
.t-find:focus-within{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.t-find svg{color:var(--line-ico)}
.t-find input{flex:1;height:100%}
.t-find input::placeholder{color:var(--line-ico)}
.t-list{flex:1;min-height:0;overflow:auto;padding:4px 8px 12px;overscroll-behavior:contain}
.t-group{display:flex;gap:6px;padding:12px 12px 6px;color:var(--body);font-weight:500}
.t-group span{font-weight:400}
.t-rc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:1px 12px;width:100%;padding:9px 12px;border-radius:var(--r-inner);text-align:left;transition:background-color 120ms ease}
@media (hover:hover) and (pointer:fine){.t-rc:hover{background:var(--soft-2)}}
.t-rc.on{background:var(--accent-bg)}
.t-rc .no{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-rc .rc-amt{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.t-rc .sub{color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-rc .st{justify-self:end}
.t-rc .st .ds-status{min-height:20px}
.t-rc .ds-btn--sm{pointer-events:none}
.newdot{display:inline-block;width:7px;height:7px;margin:0 7px 2px 0;border-radius:50%;background:var(--accent);vertical-align:middle}
#frame[data-size="1024"] .rc-pre{display:none}
.t-none{padding:20px 12px;color:var(--body)}
/* The list keeps two rows; the preview gives way when the side is short (B). */
.t-list:has(+.t-prev){min-height:124px}
.t-prev{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--hairline)}
.t-slip{flex:0 1 auto;min-height:0;height:var(--slip-h,272px);overflow:auto;padding:14px 12px 0;background:var(--soft-2);cursor:pointer;overscroll-behavior:contain}
#frame[data-size="1920"] .t-slip{--slip-h:420px}
#frame:not([data-size="1920"]) .v-B .t-slip{display:none}
.slip{padding:14px 14px 18px;border-radius:3px 3px 0 0;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/8%),0 6px 18px rgb(0 0 0/6%);font-variant-numeric:tabular-nums;transition:box-shadow 150ms ease}
@media (hover:hover) and (pointer:fine){.t-slip:hover .slip{box-shadow:0 0 0 1px var(--accent),0 6px 18px rgb(0 0 0/6%)}}
.sl-c{text-align:center}
.sl-b{font-weight:600}
.sl-hr{margin:8px 0;border:0;border-top:1px dashed var(--hairline-2)}
.sl-row{display:flex;justify-content:space-between;gap:12px}
.sl-row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-row span:last-child{flex:none}
.sl-mute{color:var(--body)}
.sl-item+.sl-item{margin-top:6px}
.sl-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-prev-foot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--hairline)}
.t-prev-foot .ds-btn{gap:8px;padding:0 14px}

/* ── B · Money right: the lines left; total, Pay and receipts right ───── */
.till.v-B{--side:384px}
.v-B .t-scan{padding:16px 20px 12px}
.v-B .t-grid{margin:0 20px 16px}
.mon{padding:18px 22px 18px;border-bottom:1px solid var(--hairline)}
.mon-k{display:flex;justify-content:space-between;color:var(--body);line-height:20px}
.mon-v{margin-top:6px;display:flex;align-items:baseline;gap:8px;font-size:52px;line-height:56px;font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums;white-space:nowrap}
.mon-v .cur{font-size:22px;font-weight:500;color:var(--body);letter-spacing:-.02em}
.mon-facts{margin-top:14px}
.mon-facts div{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;border-top:1px solid var(--row-line)}
.mon-facts dt{color:var(--body);flex:none}
.mon-facts dd{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500;white-space:nowrap}
.mon-facts .ds-btn--sm{height:28px;gap:6px;padding:0 6px 0 10px}
.mon-facts .ds-btn--sm .kbd{height:20px;min-width:24px}
.mon-pay{margin-top:14px;width:100%;height:52px;border-radius:var(--r-inner);justify-content:space-between;padding:0 12px 0 20px;font-size:17px}
.mon-pay[disabled]{opacity:.4}
.v-B .t-side-head{padding-top:14px}

/* ── C · Key bar: every key in one strip at the foot, Pay at its end ──── */
.till.v-C{grid-template-rows:56px minmax(0,1fr) 76px}
.t-meta{display:flex;align-items:center;gap:10px;margin-left:8px;color:var(--body);white-space:nowrap;min-width:0}
.t-meta b{font-weight:500;color:var(--ink)}
.t-meta .dot{color:var(--faint)}
.t-keys{display:flex;align-items:center;gap:8px;min-width:0;padding:0 12px 2px}
.kt{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px 0 10px;border-radius:var(--r-inner);background:#fff;box-shadow:var(--shadow-panel);font-weight:500;white-space:nowrap;min-width:0;transition:scale 120ms var(--ease-out),background-color 150ms ease}
.kt:active{scale:.97}
.kt .kc{display:inline-grid;place-items:center;min-width:38px;height:28px;padding:0 6px;border-radius:7px;background:var(--soft-2);color:var(--body);font-weight:600;font-variant-numeric:tabular-nums}
.kt .kl{overflow:hidden;text-overflow:ellipsis;max-width:180px}
.kt.bad{color:var(--bad-fg)}
.kt.bad .kc{background:var(--bad-bg);color:var(--bad-fg)}
.kt[disabled]{opacity:.45;pointer-events:none}
@media (hover:hover) and (pointer:fine){.kt:hover{background:var(--soft)}}
.t-keypay{height:56px;padding:0 28px 0 10px;gap:14px;border-radius:var(--r-inner);font-size:17px}
.t-keypay .kc{display:inline-grid;place-items:center;min-width:42px;height:30px;padding:0 6px;border-radius:7px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);font-size:15px;font-weight:600}
.t-keypay[disabled]{opacity:.4}

/* ── D · Full width: the lines take the page; receipts open on F8 ──────── */
.t-main.one{grid-template-columns:minmax(0,1fr)}
.v-D .t-rec{margin-left:auto}
.v-D .t-person{margin-left:8px}
.t-count{color:var(--body);font-variant-numeric:tabular-nums}
.t-sidein{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:14px}

/* ── Pay: every method on one page, the pad beside it ─────────────────── */
.pay{width:1000px;max-width:calc(100% - 48px);border-radius:16px;background:#fff;box-shadow:var(--shadow-sheet);display:grid;grid-template-columns:minmax(0,1fr) 420px;overflow:hidden}
.pay-head{grid-column:1/-1;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px 14px 28px;border-bottom:1px solid var(--hairline)}
.pay-head .cap{color:var(--body)}
.ttl{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.3px}
.pay-l{display:flex;flex-direction:column;padding:16px 28px 22px;min-width:0}
.pay-r{display:flex;flex-direction:column;gap:10px;padding:16px 22px 22px;background:#fff;border-left:1px solid var(--hairline)}
.bill{display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:4px}
.bill .k{color:var(--body)}
.bill .v{text-align:right;font-variant-numeric:tabular-nums}
.bill .gk{font-size:17px;font-weight:600}
.bill .gv{font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.035em;text-align:right;font-variant-numeric:tabular-nums}
.methods{margin-top:12px;padding-top:6px;border-top:1px solid var(--hairline)}
.mrow{display:grid;grid-template-columns:68px minmax(0,1fr) 152px;align-items:center;column-gap:10px;row-gap:8px;padding:6px 8px;margin:0 -8px;border-radius:var(--r-inner);cursor:pointer}
.mrow.on{background:var(--accent-bg)}
.mrow .ml{font-weight:500}
.mrow.on .ml{color:var(--accent);font-weight:600}
.acct{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 10px 0 12px;border:1px solid var(--hairline-2);border-radius:8px;background:#fff;min-width:0;text-align:left}
.acct span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct svg{color:var(--line-ico)}
.mmid{display:flex;align-items:center;gap:8px;min-width:0}
.acct.mach{flex:0 1 auto;gap:8px;padding:0 8px 0 10px}
.acct.mach svg:first-child{color:var(--line-ico)}
.onus{flex:none}
.onus .ds-seg-item{height:34px;padding:0 9px}
.onus.bad{box-shadow:0 0 0 2px var(--bad)}
.pop-mach{width:300px}
.acct-static{color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minput{height:40px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:8px;background:#fff;min-width:0;width:100%;transition:border-color 120ms ease,box-shadow 120ms ease}
.minput:focus{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.minput[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 2px rgb(215 0 21/10%)}
.minput::placeholder{color:var(--line-ico)}
.amt{display:flex;align-items:center;justify-content:flex-end;height:44px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:8px;background:#fff;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.zero{color:var(--faint);font-weight:500}
.amt .cur{margin-right:auto;font-size:15px;font-weight:500;color:var(--body)}
.amt.zero .cur{color:var(--faint)}
.amt.on{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.amt.on::after{content:"";width:2px;height:22px;margin-left:3px;border-radius:1px;background:var(--accent);animation:blink 1.06s steps(1) infinite}
.mrow2{grid-column:2/-1;display:flex;gap:8px;min-width:0}
.mrow2 .ds-seg{flex:none}
.mrow2 .ds-seg-item{height:34px}
.paybox{margin-top:auto;padding-top:12px;border-top:1px solid var(--hairline);display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:4px}
.paybox .k{color:var(--body)}
.paybox .v{text-align:right;font-variant-numeric:tabular-nums}
.paybox .ck{font-size:17px;font-weight:600}
.paybox .cv{font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.035em;text-align:right;font-variant-numeric:tabular-nums}
.paybox .cv.due{color:var(--body)}
.pay-err{grid-column:1/-1;margin-top:4px;color:var(--bad-fg)}
/* Pay looks A–D: suggested amounts, machine chips, rows per machine, steps, tiles */
.pay.p2{width:1240px;grid-template-columns:minmax(0,1fr) 500px}
.pay.p2 .pay-r{min-height:560px}
.pay.p2 .mrow{grid-template-columns:76px minmax(0,1fr) 164px}
.q2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.q2b{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;row-gap:0;align-items:center;min-width:0;height:70px;padding:8px 14px;border-radius:var(--r-inner);background:var(--accent-bg);color:var(--accent);text-align:left;overflow:hidden;transition:scale 120ms var(--ease-out)}
.q2b:active{scale:.97}
.q2b b,.q2b .q2s{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q2b b{font-size:22px;line-height:26px;letter-spacing:-.02em;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.q2b .q2s{font-size:15px;line-height:18px;font-variant-numeric:tabular-nums}
.q2b .k7-k{grid-row:1/3;min-width:30px;height:24px;font-size:15px}
.keys.k2{grid-template-columns:repeat(4,1fr)}
.rib{display:grid;grid-template-columns:auto repeat(6,1fr);gap:6px;align-items:center;margin-top:8px}
.rib-l{font-size:15px;color:var(--body);padding-right:4px}
.key .kh{position:absolute;right:6px;bottom:3px;font-size:12px;color:var(--faint);font-weight:500}
.keys.k2 .key{position:relative}
.ask{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:9px;background:var(--warn-bg);color:var(--warn-fg);white-space:nowrap}
.ask-q{font-weight:600}
.ask.done{background:var(--segment-track);color:var(--body)}
.ask.bad{box-shadow:inset 0 0 0 1.5px var(--bad-fg);background:#fbeaea;color:var(--bad-fg)}
.ask-b{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:7px;background:#fff;color:var(--ink);font-weight:500;transition:scale 120ms var(--ease-out)}
.ask-b:active{scale:.96}
.ask-b.on{background:var(--accent);color:#fff}
.ask-b.on .kbd{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);color:#fff}
.ask-b .kbd{height:20px;min-width:22px}
.key.rib-k{height:40px;font-size:15px;font-weight:600;color:var(--accent);background:var(--accent-bg)}
.p2-hint{color:var(--body);font-size:15px;line-height:20px}
.mchips{display:inline-flex;gap:4px;flex:none}
.mchip{height:34px;padding:0 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hairline-2);background:#fff;font-weight:500;white-space:nowrap}
.mchip.on{background:var(--accent);color:#fff;box-shadow:none}
.methods.many .mrow{padding:2px 8px;grid-template-columns:140px minmax(0,1fr) 150px}
.methods.many .acct-static{flex:1}
.methods.many .amt{height:38px}
.ml-m{display:block;font-weight:400;color:var(--body);font-size:15px;line-height:18px}
.mrow.on .ml-m{color:var(--accent)}
.led{margin-top:12px;padding-top:8px;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:2px}
.led-k{color:var(--body);font-weight:500;margin-bottom:4px}
.led-row{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;align-items:center;gap:8px;min-height:40px;border-bottom:1px solid var(--row-line)}
.led-n{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led-v{font-weight:600;font-variant-numeric:tabular-nums}
.stp-k{font-size:17px;line-height:24px;font-weight:600}
.stp-list{display:flex;flex-direction:column;gap:6px}
.stp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stp{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 12px;border-radius:var(--r-inner);box-shadow:inset 0 0 0 1px var(--hairline);background:#fff;text-align:left;transition:background-color 150ms ease,scale 120ms var(--ease-out)}
.stp:active{scale:.98}
@media (hover:hover) and (pointer:fine){.stp:hover{background:var(--soft)}}
.stp .k7-k{flex:none}
.stp-t{display:flex;flex-direction:column;min-width:0;line-height:20px}
.stp-t b{font-weight:600}
.stp-t span{color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp-segs{display:flex;flex-wrap:wrap;gap:8px}
.stp-segs .ds-seg-item{height:34px;padding:0 10px}
.amt.big{height:56px;font-size:28px;letter-spacing:-.02em}
.p2code{height:44px}
.stp-done{display:flex;flex-direction:column;align-items:center;gap:6px;padding:40px 0 20px;text-align:center}
.stp-done b{font-size:17px}
.stp-done span:last-child{color:var(--body)}
.stp-ok{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--ok-bg,#e8f5ea);color:var(--ok-fg)}
.pay-note{grid-column:1/-1;margin-top:4px;color:var(--body)}
.amt.auto{color:var(--accent)}
.vinfo{flex:none;color:var(--body);white-space:nowrap;font-variant-numeric:tabular-nums}
.ok{color:var(--ok-fg)}
.promo-tag{flex:none;display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--r-chip);background:var(--wash-ok);color:var(--ok-fg);font-weight:500;white-space:nowrap}
.promo-tag.idle{background:var(--soft-2);color:var(--body)}
.id-tag{flex:none;display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--r-chip);background:var(--soft-2);color:var(--body);font-weight:500;white-space:nowrap}
.id-tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.rb-sub{color:var(--body)!important}
tr.rsel td{background:var(--accent-bg)}
.rep-pick{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:6px;color:var(--body);font-weight:500}
.rep-pick:hover{background:var(--soft-2);color:var(--ink)}
.rep-arrow{color:var(--line-ico);margin-right:6px}
.rno{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--soft-2);color:var(--body);font-weight:600}
tr.rsec td{background:var(--canvas);padding-top:12px;padding-bottom:8px;border-bottom:1px solid var(--hairline-2)}
tr.rb-D td{color:var(--body)}
tr.rb-D .rb-sub{text-decoration:line-through}
tr.pg-top td{border-top:1.5px solid var(--hairline-2)}
tr.pg-top td:first-child,tr.pg-mid td:first-child{box-shadow:inset 3px 0 0 var(--hairline-2)}
tr.rb-A td{color:var(--body)}
tr.pg-gap td{height:8px;padding:0;border:0;background:transparent}
tr.rc-row td{padding-top:12px;padding-bottom:12px;vertical-align:top}
.rc-new{display:block;text-align:left;padding:2px 6px;margin:-2px -6px;border-radius:6px}
.rc-new.on{background:var(--accent-bg)}
.mrow.edc{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px;align-items:center}
.edc-grid{display:grid;grid-template-columns:52px auto;align-items:center;column-gap:10px;row-gap:8px;min-width:0}
.edc-k{color:var(--body)}
.edc-k.need{color:var(--warn-fg);font-weight:600}
.edc-k.bad{color:var(--bad-fg);font-weight:600}
.edc-grid .mchip .kbd{margin-left:4px}
.edc-grid .mchip.on .kbd{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);color:#fff}
.mrow.edc .amt{align-self:start}
.edc-tok{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 8px 0 10px;border-radius:8px;background:var(--accent);color:#fff;font-weight:500;white-space:nowrap;transition:scale 120ms var(--ease-out)}
.edc-tok:active{scale:.97}
.edc-tok svg{width:14px;height:14px;opacity:.8}
.edc-keys{display:inline-flex;align-items:center;gap:3px;margin-left:6px}
.mchip{transition:scale 120ms var(--ease-out)}
.mchip:active:not(:disabled){scale:.97}
.amt-none{height:44px}
.t-mode{display:flex;align-items:center;gap:10px;padding:2px 24px 10px}
.mode-flag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:7px;background:var(--accent-bg);color:var(--accent);font-weight:600}
.mode-flag.ret{background:var(--warn-bg);color:var(--warn-fg)}
.mrow.edc .ml{align-self:start;padding-top:8px}
.amt-code{height:44px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.amt-code::placeholder{letter-spacing:0}
.amt-vcode{letter-spacing:0;text-transform:uppercase}
.amt-vcode::placeholder{text-transform:none}
.amt.fixed{background:var(--segment-track);border-color:transparent;color:var(--ink)}
/* An amount opened by a code or a finger comes in focused from a blur, the
   same box the code sat in: rare (a few times a day), so it may move. */
.amt.reveal{animation:amt-in 220ms var(--ease-out) both}
@keyframes amt-in{from{opacity:0;filter:blur(4px);transform:scale(.97)}}
@keyframes amt-fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.amt.reveal{animation:amt-fade 160ms ease both}}
.pad-tog{align-self:stretch;justify-content:space-between;height:40px}
.kind-pill{display:inline-flex;align-items:center;height:22px;margin-left:6px;padding:0 8px;border-radius:6px;font-weight:500;background:var(--soft-2);color:var(--body)}
.kind-pill.kind-return{background:var(--warn-bg);color:var(--warn-fg)}
.kind-pill.kind-void{background:#fdeeee;color:var(--bad-fg)}
.minus-star{color:var(--warn-fg);font-weight:700;margin-left:4px}
.qty-step{display:inline-flex;align-items:center;gap:6px}
.qty-step button{width:28px;height:28px;border-radius:7px;background:var(--segment-track);font-weight:600;transition:scale 120ms var(--ease-out)}
.qty-step button:active{scale:.94}
.t-float{position:sticky;bottom:10px;display:flex;align-items:center;gap:12px;margin:auto 0 0;padding:10px 10px 10px 12px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/6%),0 8px 28px rgb(0 0 0/12%)}
.tf-total{display:flex;flex-direction:column;align-items:flex-end;margin-right:8px;line-height:1.1}
.tf-k{color:var(--body);white-space:nowrap}
.tf-v{font-size:36px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tf-v b{font-weight:700}
.tf-v .cur{font-size:18px;font-weight:500;color:var(--body);margin-right:6px}
.tf-chip{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:var(--r-inner);background:var(--soft-2);white-space:nowrap}
.t-float.fC{background:none;box-shadow:none;padding:0;border-radius:0}
.t-float.fC>.t-big{background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/6%),0 8px 28px rgb(0 0 0/12%)}
.tf-card{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/6%),0 8px 28px rgb(0 0 0/12%)}
.t-float .sp{flex:1}
.t-float .t-bags{background:var(--ok-fg);color:#fff;box-shadow:0 1px 2px rgb(0 0 0/12%)}
.t-float .t-bags svg{color:#fff}
@media (hover:hover) and (pointer:fine){.t-float .t-bags:hover{background:#1e7a35}}
.t-float .t-pay{margin:0;min-width:260px}
.hold-red{background:#d70015!important;color:#fff!important;font-weight:600}
.hold-red .kbd{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);color:#fff}
.dlg.held-dlg{width:720px}
.held-row{display:grid;grid-template-columns:28px minmax(0,1fr) 140px auto auto;align-items:center;column-gap:14px;padding:10px 12px;border-radius:10px;cursor:pointer}
.held-row.on{background:var(--accent-bg)}
.held-row b{font-variant-numeric:tabular-nums;font-weight:600}
.held-k{min-width:24px;text-align:center}
.held-two{display:flex;flex-direction:column;min-width:0;line-height:20px}
.held-two>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.held-two>b{overflow:visible}
.held-two.r{text-align:right;margin-right:6px}
.held-row .ds-btn{min-width:104px;justify-content:center}
.d-pw .seg2{display:flex;gap:8px}
.d-pw .seg2 button{flex:1;height:44px;border-radius:var(--r-inner);box-shadow:inset 0 0 0 1px var(--hairline-2);font-weight:500}
.d-pw .seg2 button.on{background:var(--accent-bg);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.d-pw .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.d-pw .req::after{content:" *";color:var(--bad-fg)}
.chg-k.top{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:2px}
.chg-no{color:var(--body);margin-bottom:14px;font-variant-numeric:tabular-nums}
.chg-acts{display:flex;gap:10px;margin-top:18px}
.chg-acts .chg-go{flex:1;margin:0}
.slip{width:360px;margin:6px auto 0;padding:18px 20px;border:1px dashed var(--hairline-2);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.6}
.slip h4{text-align:center;font-size:15px;margin-bottom:8px}
.slip .sg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;text-align:center}
.slip .sg span{border-top:1px solid var(--ink);padding-top:4px}
.t-scanerr .ds-btn{margin-left:12px;height:30px;gap:8px}
.unk-amt{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border:1px solid var(--hairline-2);border-radius:10px;background:#fff;transition:border-color 120ms ease,box-shadow 120ms ease}
.unk-amt:focus-within{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.unk-amt .cur{color:var(--body);font-size:20px;font-weight:500}
.d-pw .unk-amt input,.d-pw .unk-amt input:focus{flex:1;min-width:0;height:100%;padding:0;border:0;box-shadow:none;outline:0;font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.t-promo{display:inline-flex;align-items:center;gap:6px;height:28px;margin:0 -6px;padding:0 6px;border-radius:8px;font-weight:500;white-space:nowrap}
.t-promo svg{color:var(--line-ico)}
.t-promo .mute{font-weight:400}
@media (hover:hover) and (pointer:fine){.t-promo:hover{background:var(--soft-2)}}
.t-wait{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:var(--r-chip);background:var(--accent-bg);color:var(--accent);font-weight:500}
.pop-promos{width:420px;padding:6px}
.pop-h{display:flex;justify-content:space-between;gap:12px;padding:10px 12px 6px;font-weight:600}
.pr-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--row-line)}
.pr-t{display:flex;flex-direction:column;min-width:0;line-height:20px}
.pr-t b{font-weight:500}
.pr-t span{color:var(--body)}
.pr-t .pr-hint{color:var(--accent);font-weight:500}
.pr-row.idle .pr-t b{color:var(--body)}
.pr-v{display:flex;align-items:center;gap:6px;color:var(--ok-fg);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-v .ds-btn--sm{height:28px;gap:6px;padding:0 6px 0 10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qk{height:48px;border-radius:var(--r-inner);background:var(--accent-bg);color:var(--accent);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;transition:scale 120ms var(--ease-out),background-color 150ms ease}
.qk:active{scale:.97}
.qk.wide{grid-column:1/-1}
.qk-gap{height:48px;grid-column:1/-1}
@media (hover:hover) and (pointer:fine){.qk:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}}
.keys{display:grid;grid-template-columns:repeat(3,58px) repeat(2,minmax(0,1fr));gap:8px}
.key{height:56px;border-radius:var(--r-inner);background:#fff;box-shadow:inset 0 0 0 1px var(--hairline-2);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;display:grid;place-items:center;transition:scale 120ms var(--ease-out),background-color 150ms ease}
.key:active{scale:.95}
.key.fn{font-size:17px;font-weight:600;color:var(--body)}
.key.note{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;padding:0 12px;font-size:15px;font-weight:600}
.key.note i{width:26px;height:6px;border-radius:2px;background:var(--c)}
.key[disabled]{opacity:.35;pointer-events:none}
@media (hover:hover) and (pointer:fine){.key:hover{background:var(--soft-2)}}
.pay-go{margin-top:auto;height:56px;border-radius:var(--r-inner);justify-content:space-between;padding:0 14px 0 20px;font-size:17px}
.pay-go[disabled]{opacity:.4}

/* ── Change ───────────────────────────────────────────────────────────── */
.chg{width:460px;border-radius:16px;background:#fff;box-shadow:var(--shadow-sheet);padding:30px 28px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.chg-k{color:var(--body);font-size:17px}
.chg-v{margin-top:4px;font-size:56px;line-height:60px;font-weight:600;letter-spacing:-.045em}
.chg-notes{margin:24px auto 0;display:flex;flex-direction:column;gap:8px;width:320px}
.chg-note{display:grid;text-align:left;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;height:52px;padding:0 18px 0 14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--hairline-2);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.chg-note b{text-align:right;font-weight:600}
.chg-note .x{color:var(--body);font-weight:500}
.chg-note i{width:44px;height:26px;border-radius:4px;background:var(--c)}
.chg-note i.coin{width:26px;height:26px;border-radius:50%;justify-self:center}
.chg-sub{margin-top:16px;color:var(--body)}
.chg-print{margin-top:6px;display:flex;align-items:center;gap:8px;color:var(--body);min-height:22px}
.chg-print.ok{color:var(--ok-fg)}
.chg.with-struk{width:820px;max-height:calc(100% - 48px);padding:0;flex-direction:row;align-items:stretch;overflow:hidden}
.chg-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 28px 24px}
.sk-well{flex:none;width:360px;overflow:auto;background:var(--segment-track);padding:20px;overscroll-behavior:contain}
.sk-paper{background:#fff;box-shadow:0 1px 2px rgb(0 0 0/8%),0 6px 18px rgb(0 0 0/6%);padding:18px 16px 20px;font:15px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#111;text-align:left;font-variant-numeric:tabular-nums}
.sk-paper hr{border:0;border-top:1px dashed #bbb;margin:8px 0}
.sk-c{text-align:center}
.sk-b{font-weight:700}
.sk-row{display:flex;justify-content:space-between;gap:12px}
.sk-row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk-row span:last-child{flex:none}
.sk-item+.sk-item{margin-top:4px}
.sk-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Printed top-down from the slot, once per sale, while the printer runs. */
.sk-well.printing .sk-paper{animation:sk-print 450ms var(--ease-out) both}
@keyframes sk-print{from{clip-path:inset(0 0 100% 0);transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.sk-well.printing .sk-paper{animation:none}}
.chg-go{margin-top:22px;width:100%;height:52px;border-radius:var(--r-inner);justify-content:space-between;padding:0 14px 0 20px;font-size:17px}

/* ── Small dialogs: discount, member, cancel, confirm, supervisor ─────── */
.dlg{width:480px;max-width:calc(100% - 48px);border-radius:16px;background:#fff;box-shadow:var(--shadow-sheet);display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:560px}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px 14px 28px;border-bottom:1px solid var(--hairline)}
.dlg-head .cap{color:var(--body)}
.dlg-body{display:flex;flex-direction:column;gap:16px;padding:20px 28px 24px}
.dlg-foot{display:flex;align-items:center;gap:8px;padding:12px 24px 12px 28px;border-top:1px solid var(--hairline)}
.dlg-foot .ds-btn{padding:0 16px}
.dlg-foot .ds-btn--primary{gap:10px;padding:0 10px 0 16px}
.dlg-amt{display:flex;align-items:center;gap:10px}
.dlg-amt input{flex:1;height:56px;padding:0 16px;border:1px solid var(--hairline-2);border-radius:10px;font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:border-color 120ms ease,box-shadow 120ms ease}
.dlg-amt input:focus{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.dlg-res{display:flex;justify-content:space-between;color:var(--body)}
.dlg-res b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.mem-list{display:flex;flex-direction:column;gap:2px;margin:-4px -12px 0;max-height:300px;overflow:auto}
.mem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:10px;text-align:left}
.mem.on{background:var(--accent-bg)}
@media (hover:hover) and (pointer:fine){.mem:not(.on):hover{background:var(--soft-2)}}
.mem b{display:block;font-weight:500}
.mem span{color:var(--body)}
.mem .pts{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.cfm{width:400px;border-radius:var(--r-card);background:#fff;box-shadow:var(--shadow-sheet);padding:22px 22px 18px}
.cfm p+p{margin-top:6px;color:var(--body)}
.cfm-act{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.cfm-act .ds-btn{padding:0 16px}
.sup{width:400px;border-radius:16px;background:#fff;box-shadow:var(--shadow-sheet);padding:24px 24px 18px;display:flex;flex-direction:column;align-items:center;text-align:center}
.sup .cap{margin-top:2px;color:var(--body)}
.sup .d-say{margin-top:16px}
.sup-foot{margin-top:14px;align-self:stretch;display:flex;justify-content:center}

/* ── Sheets: a receipt, check price ──────────────────────────────────── */
.veil.side{display:flex;justify-content:flex-end;align-items:stretch;padding:12px}
.sheet{position:relative;display:flex;flex-direction:column;width:480px;max-width:100%;border-radius:16px;background:#fff;box-shadow:var(--shadow-sheet);overflow:hidden}
.sheet.wide{width:560px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 24px 14px 28px;border-bottom:1px solid var(--hairline)}
.sheet-head .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheet-head .cap{margin-top:4px;color:var(--body)}
.sheet-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:24px;padding:20px 28px 24px}
.sheet-foot{display:flex;align-items:center;gap:8px;min-height:var(--sheet-foot);padding:12px 24px 12px 28px;border-top:1px solid var(--hairline)}
.sheet-foot .ds-btn{padding:0 14px}
.sheet .ds-kpis{margin-bottom:0}
.mini{display:flex;flex-direction:column}
.mini-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--row-line)}
.mini-row:last-child{border-bottom:0}
.mini-row .thumb{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--soft-2)}
.mini-row .thumb svg{width:32px;height:32px}
.mini-row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row span{color:var(--body)}
.mini-row .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.mini-row .r span{display:block;font-weight:400}
.ret{display:inline-flex;align-items:center;gap:6px}
.ret button{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline-2);font-size:17px}
.ret b{min-width:46px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.pays{display:flex;flex-direction:column;gap:8px}
.pays div{display:flex;justify-content:space-between;gap:12px}
.pays span{color:var(--body)}
.br-search{margin:16px 28px 0}
.br-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:10px;text-align:left}
.br-row.on{background:var(--accent-bg)}
@media (hover:hover) and (pointer:fine){.br-row:not(.on):hover{background:var(--soft-2)}}
.br-row .thumb{display:grid;place-items:center;width:48px;height:48px;border-radius:10px;background:var(--soft-2)}
.br-row .thumb svg{width:34px;height:34px}
.br-row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-row span{color:var(--body)}
.br-row .r{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.br-row .r span{display:block;font-weight:400;color:var(--body)}

/* ── Popovers: account lookup, bags, person ───────────────────────────── */

.pop-list{max-height:340px;overflow:auto}
.pop-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:40px;padding:6px 10px;border-radius:8px;text-align:left}

.menu-row{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border-radius:8px;text-align:left}

.menu-row .kbd{margin-left:auto}
@media (hover:hover) and (pointer:fine){.menu-row:hover{background:var(--soft-2)}}

/* ── Close cash: every note and coin, then the paper ──────────────────── */
.close{position:absolute;inset:0;display:grid;place-items:center;background:var(--stone)}
.cc{width:1040px;max-width:calc(100% - 40px);height:min(712px,calc(100% - 40px));border-radius:var(--r-sheet);background:#fff;box-shadow:var(--shadow-page);display:grid;grid-template-columns:minmax(0,1fr) 360px;overflow:hidden}
.cc-l{display:flex;flex-direction:column;min-height:0;min-width:0}
.cc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 24px 10px 28px}
.cc-head .cap{color:var(--body)}
.cc-head .ds-btn{gap:10px;padding:0 8px 0 14px}
.cc-list{flex:1;min-height:0;overflow:auto;padding:0 20px 18px}
.cc-sec{display:grid;grid-template-columns:56px minmax(0,1fr) 150px 140px;gap:12px;align-items:end;padding:12px 10px 6px;color:var(--body)}

.coin-chip{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgb(255 255 255/.7) 0,rgb(255 255 255/0) 46%),var(--c);box-shadow:inset 0 0 0 1px rgb(0 0 0/12%),inset 0 0 0 4px rgb(255 255 255/.18)}

.cc-pcs.zero{color:var(--faint);font-weight:500}
.cc-row.on .cc-pcs{box-shadow:inset 0 0 0 1px var(--accent),var(--shadow-focus)}
.cc-row.on .cc-pcs::after{content:"";width:2px;height:20px;margin-left:2px;border-radius:1px;background:var(--accent);animation:blink 1.06s steps(1) infinite}
.duo{position:relative;display:grid}
.duo .coin-chip{position:absolute;right:-6px;bottom:-7px;width:22px;height:22px;box-shadow:0 0 0 2px #fff,inset 0 0 0 1px rgb(0 0 0/12%),inset 0 0 0 3px rgb(255 255 255/.18)}
.cc-row.on .duo .coin-chip{box-shadow:0 0 0 2px var(--accent-bg),inset 0 0 0 1px rgb(0 0 0/12%),inset 0 0 0 3px rgb(255 255 255/.18)}
.cc-sec.ed,.cc-row.ed{grid-template-columns:56px minmax(0,1fr) 220px 180px}
.cc-row.ed{height:60px}
.edc-chip{display:grid;place-items:center;width:44px;height:32px;border-radius:7px;background:var(--soft-2);color:var(--line-ico)}

.cc-mach span{color:var(--body)}

.cc-match.warn{color:var(--warn-fg)}
.cc-amt{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.cc-amt.zero{color:var(--faint);font-weight:400}
.cc-r{display:flex;flex-direction:column;padding:24px;background:#fff;border-left:1px solid var(--hairline);min-height:0}
.cc-who{display:flex;align-items:center;gap:12px;line-height:20px}
.cc-who b{display:block;font-weight:600}
.cc-who span{color:var(--body)}
.cc-facts{margin-top:20px;display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--hairline)}

.cc-facts dt{color:var(--body)}
.cc-facts dd{font-variant-numeric:tabular-nums}

.paper{height:100%;max-height:820px;aspect-ratio:1/1.414;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/8%),0 18px 40px rgb(0 0 0/10%);padding:5% 7%;color:#111;font-size:12px;line-height:1.45;display:flex;flex-direction:column}
.pp-co{font-size:17px;font-weight:700;letter-spacing:.02em}
.pp-date{margin-top:2px}
.pp-title{margin-top:12px;font-size:15px;font-weight:700;letter-spacing:.06em}
.pp-facts{margin-top:12px;display:grid;grid-template-columns:120px 1fr;row-gap:3px}

.pp-facts dd{font-variant-numeric:tabular-nums}
.pp-sec{margin-top:14px;font-weight:700}

.pp-sign .line{margin-top:50px;border-top:1px solid #111}

.toasts{position:absolute;left:16px;bottom:52px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}

.ds-toast--ok svg{color:var(--ok-fg)}
.ds-toast--info svg{color:var(--info-fg)}
.ds-toast--warn svg{color:var(--warn-fg)}

    const lp = linePromo(l);
    if (!lp) continue;
    const row = promos.find(x => x.p === lp.p);
    if (row) { row.cut += lp.cut; row.more = Math.max(row.more, lp.more); } else promos.push({ p: lp.p, cut: lp.cut, more: lp.more });
  }
  const lineCut = promos.reduce((a, r) => a + r.cut, 0);
  let left = sub;
  for (const p of PROMOS.filter(x => x.kind === 'AMOUNT')) {
    if (p.coupon && !coupons.includes(p.coupon)) continue;
    const okMember = !p.members || !!member, okMin = sub >= (p.min || 0);
    if (p.members && !okMin) continue;
    const cut = okMember && okMin ? Math.min(p.amount, left) : 0;
    left -= cut;
    promos.push({ p, cut, code: p.coupon || null, reason: !okMember ? 'Khusus member' : !okMin ? `Min. belanja ${rp(p.min)}` : null });
  }
  promos.forEach(r => { r.applied = r.cut > 0; });
  const sd = !saleDisc ? 0 : saleDisc.kind === '%' ? Math.round(left * Math.min(saleDisc.v, 100) / 100) : Math.min(saleDisc.v, left);
  const rd = redeem ? Math.min(redeem.value, left - sd) : 0;
  /* A Tukar credit pays for the replacements, never more: what is left of it
     is what the replacements still have to reach. */
  const xc = exchange ? Math.min(exchange.value, left - sd - rd) : 0;
  const short = exchange ? exchange.value - xc : 0;
  const grand = left - sd - rd - xc;
  const promoCut = promos.reduce((a, r) => a + r.cut, 0);
  return {
    gross: g, sub, saleD: sd, grand, promos, promoCut, rd, xc, short,
    manual: (ld - lineCut) + sd,
    disc: g - grand - xc,
    pcs: lines.reduce((a, l) => a + (l.item.kind === 'bag' ? 0 : l.qty), 0),
    points: member ? Math.floor(grand / POINTS_PER) : 0,
  };
}
function countOut(amount) {
  const out = []; let rest = Math.round(amount);
  for (const d of DENOMS) { const n = Math.floor(rest / d.v); if (n > 0) { out.push([n, d]); rest -= n * d.v; } }
  return out;
}

const frame = document.getElementById('frame');
const holder = document.getElementById('holder');
const A = (k, cls) => S.anim[k] ? ' ' + cls : '';

function render() {
  const scrolls = {};
  frame.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });
  const act = document.activeElement;
  const prevKey = act && frame.contains(act) ? act.dataset.focus : null;
  const caret = act && prevKey && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;

  frame.innerHTML = view();

  frame.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll]; });
  const keep = prevKey && layerKeys().includes(prevKey) ? prevKey : null;
  const want = S.focus || keep || defaultFocus();
  const el = want ? frame.querySelector(`[data-focus="${want}"]`) : null;
  if (el) {
    el.focus({ preventScroll: true });
    if (typeof el.selectionStart === 'number') {
      const len = el.value.length;
      if (caret && want === prevKey && !S.focus) el.setSelectionRange(Math.min(caret[0], len), Math.min(caret[1], len));
      else el.setSelectionRange(len, len);
    }
  } else if (act && frame.contains(act) === false && document.activeElement === document.body) {
    /* nothing to focus */
  }
  S.focus = null;
  if (S.scrollSel) {
    const row = frame.querySelector('.t-grid tr.sel');
    if (row) row.scrollIntoView({ block: 'nearest' });
    S.scrollSel = false;
  }
  placePop();
  S.anim = {};
  S.toasts.forEach(t => { t.shown = true; });
  renderChrome();
}

function defaultFocus() {

}

/* Return, four looks (client, 24 Oct 2026: "ada beberapa opsi design yg lebih rapi").

const short = n => n.split(' ').slice(0, 2).join(' ');
const circ = j => String(j + 1);
function retGrid(c, cols, head, ncols, lineRow, table) {
  const R = S.ret, look = S.retLook || 'D';
  const reps = j => S.lines.map((l, i) => ({ l, i })).filter(x => x.l.repFor === j);
  const loose = S.lines.map((l, i) => ({ l, i })).filter(x => x.l.repFor === undefined || x.l.repFor >= R.back.length);

      ${c.sku ? `<td class="mute num">${skuText(b.item.sku)}</td>` : ''}<td><div class="nm-2"><div class="nm-w">${o.pre || ''}<span class="nm-t">${esc(b.item.name)}</span>${c.split ? '' : `<span class="nm-v">${esc(variant(b.item))}</span>`}</div>${itemSub(b.item) ? `<span class="nm-sub">${esc(itemSub(b.item))}</span>` : ''}</div></td>${c.split ? `<td>${esc(b.item.colour)}</td><td>${esc(b.item.size)}</td>` : ''}
      <td class="c num">−1</td><td class="r">${fmt(b.unit)}</td>${c.disc ? '<td class="r faint">—</td>' : ''}<td class="r b rb-sub">−${fmt(b.unit)}</td>
      <td class="t-notec">${o.note || ''}</td><td class="c">${R.sel === j ? `<button class="t-rm" data-act="retDrop" data-arg="${j}" aria-label="Batalkan barang kembali ini">${I.trash}</button>` : ''}</td></tr>`;
  const pick = (i, l, text) => `<button class="rep-pick" data-act="repCycle" data-arg="${i}" title="Pindahkan ke barang lain">${text} ▾</button>`;

    const sec = (w, n, v) => `<tr class="rsec"><td colspan="${ncols}"><b>${w}</b><span class="mute"> · ${n} pcs · ${v}</span></td></tr>`;

      + sec('Pengganti', S.lines.length, rp(news)) + S.lines.map((l, i) => lineRow(l, i, { pre: l.repFor !== undefined && R.back[l.repFor] ? `<span class="rno">${circ(l.repFor)}</span>` : '', note: l.repFor !== undefined && R.back[l.repFor] ? pick(i, l, `untuk no. ${circ(l.repFor)}`) : marks(l) })).join(''));
  }
  if (look === 'C') {

      const right = rr.length ? rr.map(x => `<button class="rc-new${x.i === S.sel ? ' on' : ''}" data-act="row" data-arg="${x.i}"><b>${esc(x.l.item.name)}</b><span class="mute"> · ${esc(variant(x.l.item))} · ${fmt(net(x.l))}</span></button>`).join('') : '<span class="mute">Scan barang pengganti</span>';
      return `<tr class="rc-row${R.sel === j ? ' rsel' : ''}" data-act="retSel" data-arg="${j}"><td class="c"><span class="rno">${circ(j)}</span></td>
        <td><b>${esc(b.item.name)}</b><span class="mute"> · ${esc(variant(b.item))} · ${fmt(b.unit)}</span></td><td class="c mute">→</td><td>${right}</td>
        <td class="r b">${rr.length ? (diff > 0 ? '+' : '') + fmt(diff) : '—'}</td></tr>`;

    return `<div class="t-grid" data-scroll="grid"><table><colgroup><col style="width:56px"><col><col style="width:40px"><col><col style="width:140px"></colgroup>
      <thead><tr><th></th><th>Dikembalikan</th><th></th><th>Pengganti</th><th class="r">Selisih</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if (look === 'D') {

    return false;
  }
  if (/^\d$/.test(k) && !rowsLook() && (p.step === 'method' || p.step === 'pick' || p.step === 'machine' || p.step === 'kind' || p.step === 'card')) {
    const n = Number(k) - 1;
    if (p.step === 'method' && TENDERS[n]) { const m = TENDERS[n][0]; if (CARDISH(m)) { p.draft = payLine(m); p.step = 'machine'; } else pay2Begin(m); }
    else if (p.step === 'pick' && TILES[n]) { const x = TILES[n]; if (x.m === 'edc') edcPick(x.mach); else pay2Begin(x.m, x.mach); }
    else if (p.step === 'kind') { const o = edcKinds(p.draft.mach)[n]; if (o) edcKind(o[0]); }
    else if (p.step === 'card') { if (n < 2) edcCard(n === 0 ? 'On us' : 'Off us'); }
    else if (p.step === 'machine') { const x = machinesFor(p.draft.m)[n]; if (x) pay2Begin(p.draft.m, x.id); }
    return true;
  }
  if (rowsLook() && /^[1-9]$/.test(k)) { const l = p.lines[p.focus]; if (l && l.edc && edcDigit(l, Number(k))) return true; }
  if (/^\d$/.test(k)) { pay2Digit(k); return true; }
  /* No 000 key on a keyboard: the numpad's "." (or ",") types 000 — rupiah has no decimals. */
  if (k === '.' || k === ',' || (e.code === 'NumpadDecimal')) { pay2Digit('000'); return true; }
  if (k === 'Backspace') {
    if (!rowsLook() && p.step === 'machine') { pay2Back(); return true; }
    /* An EDC row with no amount: Backspace takes back the last answer. */
    const l = rowsLook() && p.lines[p.focus];
    if (l && l.edc && l.amount === 0 && l.bank) { const a = edcAsk(l); edcUndo(l, a === 'card' ? 'kind' : a === 'kind' ? 'bank' : ONUSED(l.m) ? 'card' : 'kind'); return true; }
    pay2Digit('del'); return true;
  }
  if (k === 'Delete') { pay2Digit('clr'); return true; }
  if (rowsLook()) {
    const l = p.lines[p.focus];
    if (k === 'ArrowDown' || (k === 'Tab' && !e.shiftKey)) { pay2Focus(p.focus + 1); return true; }
    if (k === 'ArrowUp' || (k === 'Tab' && e.shiftKey)) { pay2Focus(p.focus - 1); return true; }
    if ((k === 'ArrowLeft' || k === 'ArrowRight') && l.edc) { const b = MACHINES.card, at = b.findIndex(x => x.id === l.bank); edcSetBank(l, b[at < 0 ? (k === 'ArrowLeft' ? b.length - 1 : 0) : (at + (k === 'ArrowLeft' ? -1 : 1) + b.length) % b.length].id); return true; }
    if (l.edc && /^[dkq]$/i.test(k)) { edcSetKind(l, { d: 'debit', k: 'credit', q: 'qris' }[k.toLowerCase()], true); return true; }
    if (l.edc && /^[yt]$/i.test(k)) { edcSetCard(l, /y/i.test(k) ? 'On us' : 'Off us', true); return true; }
    if ((k === '+' || k === '=') && p.look === 'E') { edcPlus(); return true; }
    if ((k === 'ArrowLeft' || k === 'ArrowRight') && p.look === 'A' && CARDISH(l.m)) { pay2Machine(l, k === 'ArrowLeft' ? -1 : 1); return true; }
    if (k === ' ' && l.m === 'benefit' && !l.ben) { act('benFinger', String(p.focus)); return true; }
    if (k === ' ' && ONUSED(l.m)) { pay2Onus(l); return true; }
    if (ONUSED(l.m) && (l.amount > 0 || l.kindSet) && /^[yt]$/i.test(k)) { l.onus = /y/i.test(k) ? 'On us' : 'Off us'; if (p.miss === l) p.miss = null; return true; }
    if (k === '+' && p.look === 'A') { pay2Another(); return true; }
    if (k === 'Enter') { doPay2(); return true; }
    return false;
  }
  const d = p.draft;
  if (p.step === 'amount' && d) {
    if (ONUSED(d.m) && (k === 'ArrowLeft' || k === 'ArrowRight')) { d.onus = k === 'ArrowLeft' ? 'On us' : 'Off us'; if (p.miss === d) p.miss = null; return true; }
    if (ONUSED(d.m) && k === ' ') { pay2Onus(d); return true; }
    if (p.look === 'D' && ONUSED(d.m) && /^[dk]$/i.test(k)) { d.m = /d/i.test(k) ? 'debit' : 'credit'; return true; }
    if (k === 'Enter') { pay2Add(); return true; }
  }
  if (k === 'Enter') { doPay2(); return true; }
  return false;
}
/* Prototype presets: an empty cash payment (the suggestions show), or a split
   of two debit cards on two machines with the cash rest still to come. */
function pay2Preset(split) {
  const p = S.pay2;
  const set = (l, v, onus) => { l.amount = v; l.onus = onus || null; l.auto = false; };
  if (!split) { if (rowsLook()) pay2Focus(0); else if (p.look === 'C') pay2Begin('cash'); return; }
  if (p.look === 'E') { const e = p.lines[1]; edcSetBank(e, 'bca'); edcSetKind(e, 'debit'); set(e, 500000, 'On us'); const e2 = edcLine('mandiri'); e2.extra = true; edcSetKind(e2, 'debit'); set(e2, 300000, 'Off us'); p.lines.splice(2, 0, e2); pay2Focus(0); return; }
  if (p.look === 'A') { set(p.lines[1], 500000, 'On us'); const c = payLine('debit', 'mandiri'); set(c, 300000, 'Off us'); p.lines.splice(2, 0, c); pay2Focus(0); }
  else if (p.look === 'B') { set(p.lines[1], 500000, 'On us'); set(p.lines[2], 300000, 'Off us'); pay2Focus(0); }
  else { const a = payLine('debit', 'bca'), b = payLine('debit', 'mandiri'); set(a, 500000, 'On us'); set(b, 300000, 'Off us'); p.lines.push(a, b); pay2Begin('cash'); }
}

/* The struk as the printer prints it (Hari, 24 Oct 2026: the done card shows
   the receipt, not only its number). */
function strukView(rc) {
  const row = (k, v, cls) => `<div class="sk-row${cls ? ' ' + cls : ''}"><span>${k}</span><span>${v}</span></div>`;
  /* Lines at their price; every promo on its own row; what is left between
     them and the total is the sale's discount. */
  const sub = rc.lines.reduce((a, l) => a + gross(l), 0);
  const other = sub - rc.promos.reduce((a, x) => a + x.cut, 0) - rc.total;
  const lines = rc.lines.map(l => `<div class="sk-item"><span class="sk-name">${esc(l.item.name)}</span>${row(`${l.qty} × ${fmt(l.item.price)}`, fmt(gross(l)))}</div>`).join('');
  const pays = rc.pays.map(x => row(x.m === 'exchange' ? 'Return' : `${methodName(x.m)}${x.mach ? ' ' + machineOf(x.m, x.mach).name : ''}`, fmt(x.amount))).join('');
  return `<div class="sk-paper" aria-label="Struk ${rcNo(rc.no)}">
    <p class="sk-c sk-b">${STORE.company}</p><p class="sk-c">${STORE.code} ${STORE.name}</p>
    <hr>
    ${row('No.', `<b>${rcNo(rc.no)}</b>`)}${row(day(rc.at), hm(rc.at))}${row('Kasir', esc(rc.cashier.split(' ')[0]) + ' · ' + STORE.till)}
    <hr>
    ${lines}
    <hr>
    ${row(`Subtotal · ${rc.pcs} pcs`, fmt(sub))}
    ${rc.promos.map(x => row(esc(x.name), fmt(-x.cut))).join('')}${other > 0 ? row('Diskon', fmt(-other)) : ''}
    ${row('Total', fmt(rc.total), 'sk-b')}
    ${pays}
    ${row('Kembalian', fmt(rc.change))}
    ${rc.member ? `<hr>${row(esc(rc.member.name), `+${fmt(rc.points || 0)} poin`)}` : ''}
    <hr>
    <p class="sk-c">Terima kasih</p>

}

}

/* A redeem is the member's own: another member on the sale drops it. */
/* A member picked: for this sale, before Bayar, or for a sale already paid. */
function memberChosen(m) {

  }

/* F1 Void and F8 Return start from a receipt: scanned off the paper, or one of

/* Penjualan / Return / Void on every receipt list (client, 23 Oct 2026). */
const kindPill = r => { const k = r.status === 'voided' ? 'Void' : r.status === 'returned' || r.method === 'Tukar' ? 'Return' : 'Penjualan'; return `<span class="kind-pill kind-${k.toLowerCase()}">${k}</span>`; };

}

    return `<div class="veil${A('ov', 'm-veil')}" data-act="veil">

  const list = hit ? row(hit, true) : last.map((r, i) => row(r, i === k.i)).join('');
