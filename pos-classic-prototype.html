<style id="central-bundle">
/* Central — static renditions of the hub kit (frontend-hub/src/components/ui)
   in the All white look, for this system's previews. Every value comes from
   tokens.css (generated from tokens.json) or is the exact value the hub draws
   (white.css, button-style.ts, sheet.tsx), measured on the running hub. These
   classes are for previews and prototypes; a screen in the app uses the React
   component the card names. */

:where(.ds), :where(.ds) * { box-sizing: border-box; }
.ds {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
:where(.ds) :where(button, input, select, textarea) { font: inherit; color: inherit; }
:where(.ds) :where(p, h1, h2, h3, h4, dl, dd) { margin: 0; }
.ds-num { font-variant-numeric: tabular-nums; }
.ds-mute { color: var(--body); }
.ds-ink { color: var(--ink); }
.ds-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Preview scaffolding (not a component): a padded stage and a row of states */
.ds-stage { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.ds-stage--stone { background: var(--stone); }
.ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.ds-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ds-caption { font-size: 15px; line-height: 20px; color: var(--body); }

/* ── Button (button.tsx · button-style.ts) ───────────────────────────── */
.ds-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--icon-gap);
  flex: none; height: var(--control); padding: 0 10px;
  border: 1px solid transparent; border-radius: var(--r-inner);
  background: transparent; color: var(--ink);
  font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap;
  cursor: pointer; text-decoration: none;
  transition: color var(--t-press) var(--ease-out), background-color var(--t-press) var(--ease-out),
    border-color var(--t-press) var(--ease-out), box-shadow var(--t-press) var(--ease-out), scale var(--t-press) var(--ease-out);
}
.ds-btn:active { scale: 0.97; }
.ds-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ds-btn[disabled], .ds-btn.is-disabled { opacity: 0.5; pointer-events: none; }
.ds-btn.is-pending { opacity: 0.75; pointer-events: none; }
.ds-btn--primary { background: var(--cta); color: var(--cta-fg); font-weight: 600; box-shadow: var(--shadow-primary); }
.ds-btn--ghost { border-color: var(--hairline-2); background: var(--canvas); color: var(--ink); }
.ds-btn--quiet { color: var(--ink); }
.ds-btn--destructive { background: var(--bad-fg); color: var(--on-dark); font-weight: 600; }
@media (hover: hover) and (pointer: fine) {
  .ds-btn--primary:hover, .ds-btn--primary.is-hover { background: var(--cta-hover); }
  .ds-btn--ghost:hover, .ds-btn--ghost.is-hover, .ds-btn--quiet:hover, .ds-btn--quiet.is-hover { background: var(--soft-2); }
  .ds-btn--destructive:hover, .ds-btn--destructive.is-hover { background: var(--bad-hover); }
}
.ds-btn--icon { width: var(--control); padding: 0; }
.ds-btn--sm { height: 28px; padding: 0 8px; }
.ds-btn--card { height: var(--card-button); padding: 0 14px; position: relative; }
.ds-btn--card::after { content: ""; position: absolute; inset: -6px; }
.ds-btn--foot { padding: 0 16px; }
.ds-btn--tap { height: var(--tap); padding: 0 16px; }
.ds-btn--takes-away { color: var(--bad-fg); }

/* ── TintButton (tint-button.tsx): a wash of the accent or of red, never repainted ── */
.ds-btn--tint, .ds-btn--tint-bad { padding: 0 14px; font-weight: 600; }
.ds-btn--tint { background: var(--accent-bg); color: var(--accent); }
.ds-btn--tint-bad { background: var(--bad-bg); color: var(--bad-fg); }
.ds-btn--tint-row { height: 38px; padding: 0 12px; }
.ds-btn--tint[disabled], .ds-btn--tint.is-disabled, .ds-btn--tint-bad[disabled], .ds-btn--tint-bad.is-disabled { opacity: 0.4; }
@media (hover: hover) and (pointer: fine) {
  .ds-btn--tint:hover, .ds-btn--tint.is-hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .ds-btn--tint-bad:hover, .ds-btn--tint-bad.is-hover { background: color-mix(in srgb, var(--bad-fg) 15%, transparent); }
}

/* ── Record link (white.css .record-link · lib/openable.ts) ──────────── */
.ds-link {
  border: 0; padding: 0; background: none; font: inherit; cursor: pointer;
  color: var(--accent); border-radius: var(--r-link);
  text-decoration-line: underline; text-decoration-color: transparent; text-underline-offset: 3px;
  transition: text-decoration-color var(--t-hover) var(--ease-out), color var(--t-hover) var(--ease-out);
}
.ds-link:hover, .ds-link.is-hover { text-decoration-color: currentColor; }
.ds-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ds-opens .ds-link { color: inherit; }

/* ── Status, Tag, DocStamp, count (pill.tsx · tag.tsx · doc-stamp.tsx) ── */
/* Status: a state in a list or a card (pill.tsx Status). The dot carries the tone;
   the word is ink, and takes colour only when it waits on somebody (warn) or is a problem (bad). */
.ds-status { display: inline-flex; align-items: center; gap: 8px; min-height: 24px; font-size: 15px; line-height: 20px; font-weight: 400; color: var(--text); white-space: nowrap; }
.ds-status::before { content: ""; flex: none; width: var(--dot); height: var(--dot); border-radius: var(--r-full); background: var(--mute); }
.ds-status--ok::before { background: var(--ok); }
.ds-status--info::before { background: var(--info); }
.ds-status--new::before { background: var(--new-fg); }
.ds-status--warn { color: var(--warn-fg); }
.ds-status--warn::before { background: var(--warn); }
.ds-status--bad { color: var(--bad-fg); }
.ds-status--bad::before { background: var(--bad); }
.ds-status--neutral { color: var(--mute); }
/* Pill: the ONE state in a sheet's head (pill.tsx Pill in the white look): dot and word in the tone's -fg, 500. */
.ds-pill { display: inline-flex; align-items: center; gap: var(--dot-gap); min-height: 24px; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--body); white-space: nowrap; }
.ds-pill::before { content: ""; flex: none; width: var(--dot); height: var(--dot); border-radius: var(--r-full); background: currentColor; }
.ds-pill--ok { color: var(--ok-fg); }
.ds-pill--warn { color: var(--warn-fg); }
.ds-pill--bad { color: var(--bad-fg); }
.ds-pill--info { color: var(--info-fg); }
.ds-pill--new { color: var(--new-fg); }
.ds-pill--neutral { color: var(--body); }
.ds-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--r-chip); box-shadow: inset 0 0 0 1px var(--hairline-2); font-size: 15px; line-height: 20px; font-weight: 600; color: var(--body); white-space: nowrap; }
.ds-stamp {
  display: inline-block; padding: 2px 10px; border: 3px double currentColor; border-radius: 6px;
  transform: rotate(-6deg); opacity: 0.85; mix-blend-mode: multiply; text-align: center; white-space: nowrap;
  font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: 0; pointer-events: none;
}
.ds-stamp-day, .ds-stamp-note { display: block; font-size: 15px; line-height: 20px; font-variant-numeric: tabular-nums; }
.ds-stamp-note { font-weight: 500; max-width: 224px; white-space: normal; }
.ds-stamp--ok { color: var(--ok-fg); }
.ds-stamp--bad { color: var(--bad-fg); }
.ds-stamp--warn { color: var(--warn-fg); }
.ds-stamp--mute { color: var(--mute); }
.ds-count {
  display: inline-grid; place-items: center; min-width: var(--count-badge); height: var(--count-badge); padding: 0 5px;
  border-radius: var(--r-full); background: var(--bad-fg); color: var(--on-dark);
  font-size: 15px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px var(--panel);
}
.ds-dot-alert { display: inline-block; width: 8px; height: 8px; border-radius: var(--r-full); background: var(--bad-fg); box-shadow: 0 0 0 2px var(--stone); }

/* ── Shell: stone, rail, screens panel, floating page (white.css) ────── */
.ds-shell { display: flex; align-items: stretch; min-height: 420px; background: var(--stone); }
.ds-rail { flex: none; width: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 12px; }
.ds-rail-btn { position: relative; display: grid; place-items: center; width: var(--rail-button); height: var(--rail-button); border-radius: var(--r-inner); color: var(--rail-mute); }
.ds-rail-btn:hover, .ds-rail-btn.is-hover { background: var(--rail-hover); }
.ds-rail-btn.is-current { background: var(--rail-tile); color: var(--accent); box-shadow: var(--shadow-rail-tile); }
.ds-rail-btn .ds-dot-alert { position: absolute; top: 6px; right: 6px; }
.ds-panel { flex: none; width: var(--panel-width); margin: var(--float) var(--float) var(--float) 0; padding: 12px 10px; border-radius: var(--r-sheet); background: var(--panel); box-shadow: var(--shadow-panel); }
.ds-panel-title { padding: 0 6px 12px; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.4px; color: var(--panel-ink); }
.ds-nav { display: flex; flex-direction: column; gap: 2px; }
.ds-nav-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: var(--nav-row); padding: 0 10px; border-radius: var(--r-inner); font-size: 15px; line-height: 20px; font-weight: 400; color: var(--panel-body); text-decoration: none; }
.ds-nav-row:hover, .ds-nav-row.is-hover { background: var(--panel-hover); }
.ds-nav-row.is-active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.ds-nav-row .ds-count { box-shadow: 0 0 0 2px var(--panel); }
.ds-page { flex: 1; min-width: 0; margin: var(--float) var(--float) var(--float) 0; border-radius: var(--r-sheet); background: var(--canvas); box-shadow: var(--shadow-page); overflow: hidden; }

/* ── Page anatomy: head · figures · tabs · bar · table (white.css) ───── */
.ds-page-content { padding: var(--page-top) var(--page-gutter); }
.ds-page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 calc(-1 * var(--page-gutter)) var(--head-gap); padding: 0 var(--page-gutter) var(--head-bottom); border-bottom: 1px solid var(--hairline); }
.ds-page-head > div { min-width: 0; }
.ds-crumb { margin-bottom: var(--label-gap); font-size: 15px; line-height: 18px; color: var(--mute); }
.ds-title { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.3px; color: var(--ink); }
.ds-kpis { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 0; margin: 0 0 var(--figures-to-tabs) calc(-1 * var(--figure-pad) - 1px); clip-path: inset(-8px -8px -8px calc(var(--figure-pad) + 1px)); }
.ds-kpi { position: relative; flex: 0 0 auto; min-width: 0; padding: 0 var(--figure-pad); }
.ds-kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--hairline); }
.ds-kpi-label { font-size: 15px; line-height: 20px; color: var(--mute); }
.ds-kpi-value { padding-top: var(--fact-gap); font-size: 16px; line-height: 22px; font-weight: 600; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ds-kpi-value.is-bad { color: var(--bad-fg); }
.ds-kpis--in-sheet { margin-bottom: 8px; }
.ds-tabs { display: flex; gap: var(--tab-gap); margin-bottom: var(--tabs-to-bar); box-shadow: inset 0 -1px 0 var(--hairline); overflow: hidden; }
.ds-tab { min-height: 40px; padding: 8px 0 11px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 15px; line-height: 1.45; font-weight: 500; color: var(--mute); white-space: nowrap; cursor: pointer; }
.ds-tab:hover, .ds-tab.is-hover { color: var(--ink); }
.ds-tab.is-selected { color: var(--ink); border-bottom-color: var(--ink); }
.ds-tab-count { margin-left: 6px; color: var(--mute); font-weight: 400; font-variant-numeric: tabular-nums; }
.ds-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bar-gap); margin-bottom: var(--bar-to-table); }
.ds-bar-spacer { flex: 1 1 0; }
.ds-search { position: relative; flex: 0 1 var(--search); min-width: 160px; }
.ds-search .ds-ico { position: absolute; left: 10px; top: 50%; margin-top: -8px; color: var(--line-ico); }
.ds-search input { width: 100%; height: var(--control); padding: 0 12px 0 32px; border: 1px solid var(--hairline-2); border-radius: var(--r-inner); background: var(--canvas); font-size: 15px; color: var(--ink); outline: none; }
.ds-search input::placeholder { color: var(--line-ico); }
.ds-search input:focus { border-color: var(--accent); box-shadow: var(--shadow-focus); }
.ds-band-sentence { font-size: 15px; line-height: 22px; color: var(--body); }

/* ── Table: framed, a band for the heading, hairlines between rows ───── */
.ds-table-card { border: 1px solid var(--hairline); border-radius: var(--r-card); background: var(--canvas); overflow: clip; }
.ds-table-scroll { overflow-x: auto; }
.ds-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 15px; line-height: 1.45; }
.ds-table th { height: var(--table-head); padding: 0 var(--cell-x); background: var(--band); box-shadow: inset 0 -1px 0 var(--hairline); color: var(--mute); font-weight: 500; text-align: left; white-space: nowrap; }
.ds-table td { padding: var(--cell-y) var(--cell-x); border-bottom: 1px solid var(--row-line); color: var(--ink); vertical-align: middle; }
.ds-table tbody tr:last-child td { border-bottom: 0; }
.ds-table td:first-child { font-weight: 500; }
.ds-table .ds-sub { display: block; font-weight: 400; color: var(--body); }
.ds-table .is-num { text-align: right; font-variant-numeric: tabular-nums; }
.ds-table .is-late { color: var(--bad-fg); }
.ds-table tfoot td { height: 44px; background: var(--band); border-top: 1px solid var(--hairline); border-bottom: 0; font-weight: 500; }
.ds-table tr.ds-opens { cursor: pointer; }
.ds-table tr.ds-opens > td:last-child { position: relative; padding-right: 36px; }
.ds-table tr.ds-opens > td:last-child::after { content: ""; position: absolute; top: 50%; right: 12px; width: 16px; height: 16px; margin-top: -8px; background: var(--mute); opacity: 0; transition: opacity var(--t-hover) var(--ease-out); -webkit-mask: var(--ds-chev) center / contain no-repeat; mask: var(--ds-chev) center / contain no-repeat; }
.ds-table tr.ds-opens:hover > td:last-child::after, .ds-table tr.ds-opens.is-hover > td:last-child::after { opacity: 1; }
.ds-table .ds-sort { display: inline-block; margin-left: 4px; color: var(--mute); }

/* ── Facts and sections (sheet.tsx Facts/Fact · rows.tsx) ────────────── */
.ds-section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ds-section-title { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink); }
.ds-section-count { margin-left: 6px; font-weight: 400; color: var(--mute); }
.ds-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--facts-gap-y) var(--facts-gap-x); }
.ds-fact { min-width: 0; }
.ds-fact--wide { grid-column: span 2; }
.ds-fact dt { font-size: 15px; line-height: 18px; color: var(--body); }
.ds-fact dd { margin-top: var(--fact-gap); font-size: 15px; line-height: 22px; color: var(--ink); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.ds-empty-value { color: var(--faint); }

/* ── Fields (field.tsx · form.tsx) ────────────────────────────────────── */
.ds-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--section-gap); }
.ds-field { display: flex; flex-direction: column; gap: var(--label-gap); min-width: 0; }
.ds-field-label { font-size: 15px; line-height: 20px; color: var(--mute); }
.ds-req { margin-left: 2px; color: var(--bad); }
.ds-input { width: 100%; height: var(--field); padding: 0 14px; border: 1px solid var(--hairline-2); border-radius: var(--r-inner); background: var(--canvas); font-size: 15px; color: var(--ink); outline: none; transition: border-color var(--t-hover) var(--ease-out), box-shadow var(--t-hover) var(--ease-out); }
.ds-input::placeholder { color: var(--line-ico); }
.ds-input:focus, .ds-input.is-focus { border-color: var(--accent); box-shadow: var(--shadow-focus); }
.ds-input[aria-invalid="true"] { border-color: var(--bad); }
.ds-input--area { height: auto; min-height: 88px; padding: 10px 14px; resize: vertical; line-height: 22px; }
.ds-select { position: relative; }
.ds-select .ds-input { padding-right: 36px; display: flex; align-items: center; }
.ds-select .ds-ico { position: absolute; right: 12px; top: 50%; margin-top: -8px; color: var(--line-ico); pointer-events: none; }
.ds-field-error { font-size: 15px; line-height: 20px; color: var(--bad-fg); }
.ds-switch { position: relative; display: inline-flex; align-items: center; flex: none; width: var(--switch-w); height: 18px; padding: 0; border: 0; border-radius: var(--r-full); background: var(--soft-3); cursor: pointer; transition: background-color var(--t-hover) var(--ease-out); }
.ds-switch::after { content: ""; position: absolute; left: 2px; width: 14px; height: 14px; border-radius: var(--r-full); background: var(--canvas); transition: translate var(--t-pop) var(--ease-out); }
.ds-switch.is-on { background: var(--accent); }
.ds-switch.is-on::after { translate: 12px 0; }
.ds-switch-pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--hairline-2); border-radius: var(--r-inner); background: var(--canvas); font-size: 15px; color: var(--ink); white-space: nowrap; }
.ds-check { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
.ds-check-box { display: inline-grid; place-items: center; width: 14px; height: 14px; border: 1px solid var(--hairline-strong); border-radius: 4px; background: var(--canvas); color: var(--on-dark); }
.ds-check-box.is-on { border-color: var(--accent); background: var(--accent); }
.ds-choice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--hairline-2); border-radius: var(--r-inner); background: var(--canvas); }
.ds-choice.is-on { background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); border-color: var(--accent); }

/* ── Segmented (segmented.tsx: Apple's control) ───────────────────────── */
.ds-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-segment-track); background: var(--segment-track); }
.ds-seg-item { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--body); font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: color var(--t-hover) var(--ease-out); }
.ds-seg-item.is-on { border-radius: var(--r-segment); background: var(--canvas); color: var(--ink); box-shadow: var(--shadow-segment); }

/* ── Sheet (sheet.tsx · sheet-footer.tsx · white.css) ─────────────────── */
.ds-veil { position: relative; padding: var(--float); background: var(--scrim); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); display: flex; justify-content: flex-end; }
.ds-sheet { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 100%; border-radius: var(--r-sheet); background: var(--canvas); box-shadow: var(--shadow-sheet); overflow: hidden; }
.ds-sheet--rail { width: var(--sheet-rail); }
.ds-sheet--wide { width: var(--sheet-wide); }
.ds-sheet--table { width: var(--sheet-table); }
.ds-sheet--workspace { width: var(--sheet-workspace); }
.ds-sheet.is-under::after { content: ""; position: absolute; inset: 0; z-index: 5; border-radius: inherit; background: var(--scrim); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.ds-sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: var(--page-top) var(--page-gutter) var(--head-bottom); border-bottom: 1px solid var(--hairline); }
.ds-sheet-headtext { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ds-sheet-crumb { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; font-size: 15px; line-height: 18px; color: var(--mute); }
.ds-sheet-crumb .ds-sep { color: var(--crumb-sep); }
.ds-sheet-titlerow { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.ds-sheet-title { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.3px; color: var(--ink); }
.ds-sheet-caption { font-size: 15px; line-height: 20px; color: var(--mute); }
.ds-sheet-back { display: inline-flex; align-items: center; gap: 2px; font-size: 15px; color: var(--mute); }
.ds-sheet-close { display: grid; place-items: center; flex: none; width: 36px; height: 36px; margin: -4px -6px 0 0; border: 0; border-radius: var(--r-inner); background: none; color: var(--ink); cursor: pointer; }
.ds-sheet-close:hover, .ds-sheet-close.is-hover { background: var(--soft-2); }
.ds-sheet-body { position: relative; display: flex; flex-direction: column; gap: var(--section-gap); padding: var(--sheet-body-top) var(--page-gutter) var(--sheet-body-bottom); min-width: 0; }
.ds-sheet-foot { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; min-height: var(--sheet-foot); padding: var(--foot-y) var(--page-gutter); border-top: 1px solid var(--hairline); }
.ds-sheet-foot .ds-btn { padding: 0 16px; }
.ds-foot-note { margin-right: auto; font-size: 15px; line-height: 20px; color: var(--mute); }
.ds-stamp-corner { position: absolute; top: 0; right: 8px; z-index: 1; }
.ds-swap-out { opacity: 0; transition: opacity var(--t-swap-out) var(--ease-out); }
.ds-swap-in { opacity: 1; transition: opacity var(--t-swap-in) var(--ease-out); }
.ds-drawer { width: 100%; border-radius: var(--r-sheet) var(--r-sheet) 0 0; border-top: 1px solid var(--hairline); background: var(--canvas); box-shadow: var(--shadow-float); overflow: hidden; }
.ds-drawer-grip { width: 36px; height: 4px; margin: 8px auto 4px; border-radius: var(--r-full); background: var(--hairline-strong); }
.ds-drawer .ds-sheet-head, .ds-drawer .ds-sheet-body, .ds-drawer .ds-sheet-foot { padding-left: var(--phone-gutter); padding-right: var(--phone-gutter); }
.ds-drawer .ds-sheet-foot .ds-btn { flex: 1; height: var(--tap); }

/* ── Dialog: a centred confirmation only (dialog.tsx) ─────────────────── */
.ds-dialog { width: 384px; max-width: calc(100% - 32px); padding: 20px; border: 1px solid var(--hairline-2); border-radius: var(--r-card); background: var(--canvas); box-shadow: var(--shadow-float); }
.ds-dialog-title { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
.ds-dialog-body { margin-top: 8px; font-size: 15px; line-height: 22px; color: var(--body); }
.ds-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* ── Toast (toast.tsx: Sonner, bottom left) ───────────────────────────── */
.ds-toast { display: flex; align-items: flex-start; gap: 10px; width: 356px; max-width: 100%; padding: 12px 14px; border: 1px solid var(--hairline); border-radius: var(--r-card); background: var(--canvas); box-shadow: var(--shadow-pop); }
.ds-toast .ds-ico { margin-top: 2px; }
.ds-toast-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ds-toast-title { font-size: 15px; font-weight: 500; color: var(--ink); }
.ds-toast-desc { font-size: 15px; color: var(--body); }
.ds-toast-action { margin-left: auto; flex: none; padding: 4px 10px; border: 0; border-radius: var(--r-full); background: var(--dark); color: var(--on-dark); font-size: 15px; font-weight: 500; }
.ds-toast--ok .ds-ico { color: var(--ok-fg); }
.ds-toast--bad .ds-ico { color: var(--bad-fg); }
.ds-toast--warn .ds-ico { color: var(--warn-fg); }
.ds-toast--info .ds-ico { color: var(--info-fg); }

/* ── States (states.tsx · sheet-states.tsx) ───────────────────────────── */
.ds-empty { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 28em; margin: 0 auto; padding: 48px 16px; text-align: center; }
.ds-empty p { font-size: 15px; line-height: 22px; color: var(--body); }
.ds-skeleton { display: block; height: 14px; border-radius: 6px; background: var(--soft-2); }
.ds-banner { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: var(--r-inner); background: var(--info-bg); color: var(--info-fg); font-size: 15px; line-height: 1.625; }
.ds-banner--bad { background: var(--bad-bg); color: var(--bad-fg); }
.ds-banner--warn { background: var(--warn-bg); color: var(--warn-fg); }
.ds-banner--ok { background: var(--ok-bg); color: var(--ok-fg); }

/* ── Phone: card, dock, Fab, tab bar (phone-cards.tsx · shell/dock*.tsx · fab.tsx · bottom-bar.tsx) ── */
.ds-phone { width: 414px; max-width: 100%; margin: 0 auto; background: var(--canvas); border-radius: 24px; box-shadow: 0 0 0 1px var(--hairline); overflow: hidden; }
.ds-phone-head { padding: 12px var(--phone-gutter) 8px; }
.ds-phone-body { display: flex; flex-direction: column; gap: 12px; padding: 8px var(--phone-gutter) 16px; }
.ds-card { display: flex; flex-direction: column; border: 1px solid var(--hairline); border-radius: var(--r-card); background: var(--canvas); }
.ds-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px; }
.ds-card-name { font-size: 16px; line-height: 20px; font-weight: 600; letter-spacing: -0.16px; color: var(--ink); }
.ds-card-line { font-size: 15px; line-height: 20px; color: var(--mute); }
.ds-card-line b { font-weight: 400; color: var(--ink); }
.ds-card-figure { display: flex; flex-direction: column; align-items: flex-end; text-align: right; font-variant-numeric: tabular-nums; }
.ds-lead { font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.6px; color: var(--ink); }
.ds-lead-unit { margin-left: 3px; font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--mute); }
.ds-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--row-line); font-size: 15px; color: var(--mute); }
.ds-dock { display: flex; align-items: center; gap: 8px; padding: 9px 12px; }
.ds-dock-chip { display: inline-flex; align-items: center; gap: 4px; height: var(--tap); padding: 0 14px; border-radius: var(--r-full); background: var(--soft-2); font-size: 15px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.ds-dock-search { flex: 1; display: inline-flex; align-items: center; gap: 8px; height: var(--tap); padding: 0 14px; border-radius: var(--r-full); background: var(--soft-2); font-size: 15px; color: var(--ink); min-width: 0; }
.ds-fab { display: inline-grid; place-items: center; flex: none; width: var(--tap); height: var(--tap); border: 0; border-radius: var(--r-full); background: var(--cta); color: var(--cta-fg); cursor: pointer; transition: scale var(--t-press) var(--ease-out); }
.ds-fab:active { scale: 0.96; }
.ds-fab--wide { width: 100%; padding: 0 20px; gap: 6px; font-size: 15px; font-weight: 600; }
.ds-tabbar { display: flex; border-top: 1px solid var(--hairline); background: var(--canvas); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ds-tabbar-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; font-size: 15px; font-weight: 500; color: var(--mute); text-decoration: none; }
.ds-tabbar-item.is-active { color: var(--accent); }

/* ── Media (thumbnail.tsx · swatch.tsx · garment.tsx) ─────────────────── */
.ds-thumb { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: var(--r-inner); background: var(--soft-2); color: var(--line-ico); overflow: hidden; }
.ds-thumb img { width: 100%; height: 100%; object-fit: cover; }
.ds-swatch { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: var(--r-full); box-shadow: inset 0 0 0 1px var(--hairline-strong); }
.ds-avatar { display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: var(--r-full); background: linear-gradient(135deg, var(--avatar-from), var(--avatar-to)); color: var(--ink); font-size: 15px; font-weight: 600; }

/* ── Timeline (timeline.tsx · activity-fold.tsx) ──────────────────────── */
.ds-timeline { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }
.ds-timeline li { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; padding-bottom: 16px; }
.ds-timeline li::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 0; width: 1px; background: var(--hairline); }
.ds-timeline li:last-child::before { display: none; }
.ds-timeline-dot { width: 9px; height: 9px; margin: 6px 0 0 3px; border-radius: var(--r-full); background: var(--hairline-strong); }
.ds-timeline-dot.is-current { background: var(--ink); }
.ds-timeline-what { font-size: 15px; line-height: 22px; color: var(--ink); }
.ds-timeline-who { font-size: 15px; line-height: 20px; color: var(--mute); }

/* ── Number pad (number-pad.tsx) and meter (meter.tsx) ────────────────── */
.ds-pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 var(--phone-gutter) 12px; }
.ds-pad-key { height: 56px; border: 0; border-radius: 16px; background: var(--soft-2); font-size: 24px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; transition: scale var(--t-press) var(--ease-out); }
.ds-pad-key:active { scale: 0.96; }
.ds-pad-read { padding: 4px var(--phone-gutter) 12px; font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.ds-meter { display: block; width: 100%; height: 6px; border-radius: var(--r-full); background: var(--soft-2); overflow: hidden; }
.ds-meter > span { display: block; height: 100%; border-radius: inherit; background: var(--ok); }
.ds-meter--warn > span { background: var(--warn); }
.ds-meter--bad > span { background: var(--bad); }

@media (prefers-reduced-motion: reduce) {
  .ds *, .ds *::before, .ds *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  .ds-btn:active, .ds-fab:active { scale: 1; }
}
