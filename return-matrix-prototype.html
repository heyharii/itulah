<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Return Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Measured on the running hub (pos-e2e :5480, 11 Oct 2026): Merchandise ›
   Allotments (Unallotted tab), /allotment/new (the matrix), Return to HO. */
:root {
  --ink: #20242c; --text: #394150; --body: #565f6d; --mute: #666f7d; --faint: #b9c0c9;
  --soft: #f8f8f9; --soft-2: #f0f0f2; --soft-3: #f6f6f7;
  --hairline: #e6e6e9; --hairline-2: #dadade;
  --accent: #2563eb; --accent-bg: #eff5ff;
  --ok-bg: #d9f4d2; --ok-fg: #137a37; --warn-bg: #faeacd; --warn-fg: #a64a08;
  --bad-bg: #fbeaea; --bad-fg: #be123c;
  --rail: #242526;
  --r-inner: 8px; --r-card: 10px; --r-sheet: 16px;
  --shadow-soft: 0 1px 3px rgb(24 39 60 / 4%);
  --shadow-pop: 0 4px 8px rgb(24 39 60 / 4%), 0 12px 32px rgb(24 39 60 / 8%);
  --shadow-sheet: 0 8px 24px rgb(24 39 60 / 6%), 0 24px 64px rgb(24 39 60 / 12%);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --bar: 44px;
  /* The matrix's columns (matrix.tsx IDENTITY / FREE / COLUMN / LEFT). */
  --idw: 280px; --fw: 80px; --cw: 112px; --lw: 88px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font: 400 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: -0.09px; color: var(--ink); background: #fff;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
.tn { font-variant-numeric: tabular-nums; }

/* ---------- prototype bar (not the hub) ---------- */
.pbar {
  position: sticky; top: 0; z-index: 60; min-height: var(--bar);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 6px 16px; background: #1b1d22; color: #d9dbe0; font-size: 14px;
}
.pbar .pb-t { font-weight: 600; color: #fff; margin-right: 4px; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: #2c2f36; }
.seg button { height: 28px; padding: 0 10px; border-radius: 6px; color: #c3c6cc; font-weight: 500; transition: background-color 150ms, color 150ms; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
.pb-reset { height: 28px; padding: 0 10px; border-radius: 6px; color: #c3c6cc; border: 1px solid #3a3e46; }
@media (hover: hover) { .seg button:hover:not([aria-pressed="true"]), .pb-reset:hover { color: #fff; } }

#app { height: calc(100dvh - var(--bar)); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 10px; border-radius: var(--r-inner); white-space: nowrap;
  font-weight: 500; font-size: 15px; color: var(--text); background: #fff;
  border: 1px solid var(--hairline-2);
  transition: transform 120ms var(--ease-out), background-color 150ms, border-color 150ms, color 150ms, opacity 150ms;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.quiet { border-color: transparent; background: transparent; }
.btn.sm { font-size: 14px; }
.btn.danger { background: var(--bad-fg); border-color: transparent; color: #fff; }
.btn .mute { color: var(--mute); font-weight: 400; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled) { background: var(--soft); }
  .btn.primary:hover:not(:disabled) { background: #1f56d6; }
  .btn.danger:hover:not(:disabled) { background: #a50f34; }
}
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin 600ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- hub shell (list screen) ---------- */
.shell { display: flex; height: 100%; background: var(--soft-3); }
.rail { width: 68px; flex: none; background: var(--rail); color: #c3c4c7; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; }
.rail .logo { width: 32px; height: 32px; border-radius: 8px; background: #fff; color: var(--ink); display: grid; place-items: center; font-weight: 700; margin-bottom: 12px; position: relative; }
.rail .logo::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.rail .ri { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; }
.rail .ri.on { background: #3a3c40; color: #fff; }
.rail .sp { flex: 1; }
.rail .av { width: 28px; height: 28px; border-radius: 50%; background: #3a3c40; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 600; }
.dept { width: 232px; flex: none; background: #fff; border-right: 1px solid var(--hairline); display: flex; flex-direction: column; }
.dept h2 { margin: 0; height: 52px; display: flex; align-items: center; padding: 0 16px; font-size: 15px; font-weight: 600; letter-spacing: -0.15px; }
.dept nav { padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
.dept a { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 8px; font-size: 14px; color: var(--body); text-decoration: none; cursor: pointer; }
.dept a.on { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.dept a .n { color: var(--warn-fg); font-weight: 500; }
@media (hover: hover) { .dept a:not(.on):hover { background: var(--soft); } }
.main { flex: 1; min-width: 0; overflow: auto; }
.mtop { display: none; }
.page { max-width: 1600px; margin: 0 auto; padding: 28px 32px 120px; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; margin-bottom: 14px; }
.ph h1 { margin: 0; font-size: 15px; font-weight: 600; line-height: 20px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); padding: 10px 16px; min-height: 66px; }
.kpi .l { font-size: 14px; font-weight: 500; color: var(--body); letter-spacing: .04em; }
.kpi .v { padding-top: 4px; font-size: 18px; font-weight: 600; letter-spacing: -0.36px; line-height: 22px; }
.ksent { display: none; margin: 0 0 16px; color: var(--body); }
.ksent b { color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 16px; }
.tab { height: 40px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--body); position: relative; }
.tab .c { color: var(--mute); font-weight: 400; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
.lbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.search { display: flex; align-items: center; gap: 6px; width: 350px; max-width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--hairline-2); border-radius: 8px; background: #fff; box-shadow: var(--shadow-soft); color: var(--mute); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; font-size: 14px; color: var(--ink); background: transparent; }
.search input::placeholder { color: var(--body); }
.card { background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-soft); overflow: clip; }
.empty { padding: 56px 16px; text-align: center; color: var(--body); }

/* Return stock / Unallotted — the supplier folds (to-allot.tsx COLUMNS). */
.g6 { display: grid; grid-template-columns: 1rem minmax(0, 3fr) 5rem minmax(0, 1.7fr) minmax(0, 1fr) 6.5rem; column-gap: 16px; align-items: center; }
.sup + .sup { border-top: 1px solid var(--hairline); }
.sup.sel { background: linear-gradient(var(--accent-bg), var(--accent-bg)) top / 100% 64px no-repeat; }
.sup-h { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 20px; }
.sup-h .fold { color: var(--mute); width: 20px; height: 20px; display: grid; place-items: center; }
.sup-h .fold svg { transition: transform 150ms var(--ease-out); }
.sup-h .fold[aria-expanded="true"] svg { transform: rotate(90deg); }
.sup-n { display: block; font-weight: 500; }
.sup-s { display: block; font-size: 14px; color: var(--mute); }
.sup-s .acc { color: var(--accent); }
.cols { min-height: 40px; padding: 0 20px 0 48px; border-top: 1px solid var(--hairline); font-size: 14px; color: var(--mute); }
.r { text-align: right; justify-self: end; }
.arow { min-height: 64px; padding: 10px 20px 10px 48px; border-top: 1px solid var(--hairline); cursor: pointer; transition: background-color 120ms; }
.arow.on { background: var(--accent-bg); }
@media (hover: hover) { .arow:not(.on):not(.ro):hover { background: var(--soft); } }
.aid { display: flex; align-items: center; gap: 12px; min-width: 0; }
.aid .an { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aid .ac { display: block; font-family: var(--mono); font-size: 14px; color: var(--mute); }
.thumb { width: 32px; height: 32px; flex: none; border-radius: 6px; background: var(--soft-2); display: grid; place-items: center; }
.dots { display: block; font-size: 14px; color: var(--body); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%); margin-right: 4px; vertical-align: 1px; }
.cell14 { font-size: 14px; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); cursor: pointer; }

/* In progress / Completed / Cancelled */
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl th { height: 40px; background: var(--soft); text-align: left; font-size: 14px; font-weight: 500; color: var(--body); padding: 0 20px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
.tbl td { height: 60px; padding: 8px 20px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .two b { display: block; font-weight: 500; }
.tbl .two span { display: block; font-size: 14px; color: var(--mute); }
.tbl .trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl tr.fresh td { animation: fresh 1600ms var(--ease-out); }
@keyframes fresh { from { background: var(--accent-bg); } to { background: transparent; } }
.zero { color: var(--faint); }

/* selection bar */
.selbar {
  position: fixed; left: calc(50% + 150px); bottom: 24px; z-index: 40;
  display: flex; align-items: center; gap: 16px; padding: 8px 8px 8px 16px;
  background: #fff; border: 1px solid var(--hairline); border-radius: var(--r-card); box-shadow: var(--shadow-pop);
  transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  transition: transform 200ms var(--ease-out), opacity 200ms var(--ease-out);
}
.selbar.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.selbar b { font-weight: 600; }
.selbar .acts { display: flex; gap: 8px; }

/* ---------- the matrix (matrix.tsx) ---------- */
.ed { height: 100%; display: flex; flex-direction: column; background: #fff; }
.ed.ret { --fw: 104px; --lw: 0px; }
.ed.ret .gb { scroll-padding-bottom: 104px; }
.grid.ret { padding-bottom: 0; }
/* Return to HO: the store is the unit — its column ends in what is left and
   its Submit, the way an allotment's article row ends in its gutter. */
.g-head .st-head { gap: 2px; }
.d-line { display: flex; align-items: center; justify-content: center; gap: 4px; max-width: 100%; }
.d-name { max-width: 100%; font-size: 14px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.swand { width: 24px; height: 24px; flex: none; border-radius: 6px; display: grid; place-items: center; color: var(--mute); transition: background-color 150ms, color 150ms, scale 120ms var(--ease-out); }
.swand svg { width: 14px; height: 14px; }
.swand:active { scale: .92; }
.swand[aria-expanded="true"] { background: var(--soft-2); color: var(--ink); }
@media (hover: hover) { .swand:hover { background: var(--soft-2); color: var(--ink); } }
.g-foot { position: sticky; bottom: 0; z-index: 5; min-height: 100px; background: #fff; border-top: 1px solid var(--hairline); box-shadow: 0 -1px 3px rgb(24 39 60 / 4%); }
.g-foot .c-id { display: flex; align-items: center; z-index: 6; font-size: 14px; font-weight: 500; color: var(--mute); }
.g-foot .c-free { z-index: 6; color: var(--body); }
.ft { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.ft .btn { width: 100%; }
.okt { color: var(--ok-fg); font-weight: 500; }
.g6s { display: grid; grid-template-columns: 1rem minmax(0, 2fr) 5rem minmax(0, 2.4fr) minmax(0, 1.4fr) minmax(0, 1.2fr); column-gap: 16px; align-items: center; }
/* The record of one return (sheet), and its printed note. */
.tbl tr.click { cursor: pointer; }
@media (hover: hover) { .tbl tr.click:hover td { background: var(--soft); } }
.sh-h .ttl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sh-h .end { display: flex; align-items: center; gap: 12px; }
.sh-sub { font-size: 14px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--hairline-2); border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pill.info { color: var(--accent); } .pill.ok { color: var(--ok-fg); } .pill.warn { color: var(--warn-fg); } .pill.mute { color: var(--mute); }
.info { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 0 0 24px; }
.info dt { font-size: 14px; color: var(--mute); }
.info dd { margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0; }
.stg > div { border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 10px 14px; }
.stg dt { font-size: 14px; font-weight: 500; color: var(--body); letter-spacing: .04em; }
.stg dd { margin: 4px 0 0; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stg dd.none { color: var(--faint); }
.warnline { margin: 10px 0 0; font-size: 14px; color: var(--warn-fg); }
.sh-b h3 { margin: 28px 0 10px; font-size: 15px; font-weight: 600; }
.ltbl td { height: 52px; }
.ltbl td.grp { background: var(--soft); height: 44px; font-weight: 500; }
.ltbl .sub { display: block; font-size: 14px; color: var(--mute); }
.neg { color: var(--bad-fg); }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--hairline); }
.hist li:first-child { border-top: 0; }
.hist time { flex: none; font-size: 14px; color: var(--mute); }
.hist .warn { color: var(--warn-fg); }
.sh-f .sp { flex: 1; }
.pv { position: fixed; inset: 0; z-index: 95; overflow: auto; background: var(--soft-3); opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease-out); }
.pv.open { opacity: 1; pointer-events: auto; }
.pv-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--hairline); }
.pv-bar .acts { display: flex; gap: 8px; }
.pages { display: flex; justify-content: center; padding: 24px 16px 48px; }
/* Surat Jalan Retur — the approved 8 Oct layout (surat-jalan-retur-prototype.html). */
.sheetA4 { width: 210mm; min-height: 297mm; background: #fff; box-shadow: 0 0 0 1px var(--hairline-2), var(--shadow-pop); zoom: .78; position: relative; color: #1d1f1a; font-size: 14px; letter-spacing: 0; }
.sheetA4 .pg { padding: 14mm 16mm 24mm; }
.sheetA4 .muted { color: #5b6158; }
.sheetA4 .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid #1d1f1a; padding-bottom: 8px; }
.sheetA4 .company { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.sheetA4 h1 { font-size: 18px; letter-spacing: .04em; margin: 0 0 6px; }
.sheetA4 .meta { border-collapse: collapse; flex-shrink: 0; }
.sheetA4 .meta td { padding: 1px 0; vertical-align: top; }
.sheetA4 .meta td:first-child { color: #5b6158; padding-right: 10px; }
.sheetA4 .meta td:last-child { font-weight: 600; }
.sheetA4 .to { margin: 14px 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 0 10px; }
.sheetA4 .label { color: #5b6158; }
.sheetA4 table.lines { width: 100%; border-collapse: collapse; margin-top: 6px; border: 1px solid #1d1f1a; }
.sheetA4 table.lines th { text-align: left; font-weight: 500; color: #5b6158; border: 1px solid #1d1f1a; padding: 7px 8px; }
.sheetA4 table.lines td { border: 1px solid #1d1f1a; padding: 9px 8px; vertical-align: top; }
.sheetA4 table.lines .num { text-align: right; white-space: nowrap; width: 130px; font-variant-numeric: tabular-nums; }
.sheetA4 .it { display: flex; gap: 10px; }
.sheetA4 .it .no { width: 18px; flex-shrink: 0; }
.sheetA4 .it .sub { color: #5b6158; }
.sheetA4 table.lines tr.total td { font-weight: 600; }
.sheetA4 table.lines tr.total td:first-child { text-align: right; }
.sheetA4 .sign { width: 220px; margin-top: 26px; }
.sheetA4 .sign .space { height: 70px; }
.sheetA4 .sign .who { font-weight: 600; }
.sheetA4 .sign .role { color: #5b6158; }
@media print {
  body > *:not(#pv) { display: none !important; }
  .pv { position: static; opacity: 1; background: #fff; overflow: visible; }
  .pv-bar { display: none; }
  .pages { padding: 0; }
  .sheetA4 { zoom: 1; box-shadow: none; }
}
/* What the store holds of an article, SKU by SKU: the names quiet, the
   pieces in ink — the number MD has to see. */
.skus { font-size: 14px; color: var(--mute); line-height: 20px; }
.skus b { color: var(--ink); font-weight: 600; }
.sup-q { margin-left: auto; flex: none; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.sup-q span { font-size: 14px; font-weight: 400; color: var(--mute); }
.dl-list { list-style: none; margin: 4px 0 20px; padding: 0; }
.dl-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hairline); }
.dl-list li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--body); }
.dl-list li b { flex: none; font-weight: 500; font-variant-numeric: tabular-nums; }
.dl-list li.tot { border-top-color: var(--hairline-2); }
.dl-list li.tot span { color: var(--ink); font-weight: 600; }
.dl-list li.tot b { font-weight: 600; }
.arow.ro { cursor: default; }
.ed-top { flex: none; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--hairline); }
.ed-title { margin: 0; min-width: 0; font-size: 15px; font-weight: 600; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-tools { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px 16px 14px; }
.filter { flex: 0 1 672px; min-width: 0; min-height: 34px; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border: 1px solid var(--hairline-2); border-radius: 8px; box-shadow: var(--shadow-soft); color: var(--mute); cursor: text; }
.filter input { flex: 1; min-width: 0; height: 24px; border: 0; outline: none; background: transparent; font-size: 14px; color: var(--ink); }
.filter input::placeholder { color: var(--body); }
.tools-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.gb { flex: 1; min-height: 0; overflow: auto; position: relative; scroll-padding-top: 76px; scroll-padding-left: calc(var(--idw) + var(--fw)); scroll-padding-right: var(--lw); }
.grid { width: max-content; min-width: 100%; padding-bottom: 40px; }
.g-row { display: flex; align-items: stretch; }
.c-id { width: var(--idw); flex: none; padding: 0 12px; background: inherit; }
.st-l { position: sticky; left: 0; z-index: 2; }

<script>
/* ======================================================================
   Data
   ====================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => n.toLocaleString("en-US");
const pcs = (n) => `${fmt(n)} pcs`;
const many = (n, one, more) => (n === 1 ? one : more);
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const sum = (xs, f = (x) => x) => xs.reduce((t, x) => t + f(x), 0);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const HEX = {
  Navy: "#1f2a44", White: "#ffffff", Khaki: "#c3b091", "Light Blue": "#a8c8e8", Grey: "#9aa0a6",
  Black: "#16181c", "Off White": "#f3efe4", Olive: "#6b6b3a", Maroon: "#7a1f2b",
  "Light Heather Blue Melange": "#b7c6d9", "Dusty Rose Pink Pastel": "#d8a7a7", "Charcoal Grey Marl": "#4b4f56",
  "Hijau Botol Tua": "#1f4d3a", "Biru Dongker": "#1d2a5a", "Abu-abu Muda": "#c9ccd1",
};
const SIZE_CODE = { "One Size": "01", S: "02", M: "03", L: "04", XL: "05", XXL: "06", XXXL: "07", "30": "30", "32": "32", "34": "34", "36": "36" };
/// Why the store moved a piece into its return stock — asked by the store app
/// when it moves it, so the return itself never asks.
const REASONS = {
  damaged: { en: "Damaged", id: "Rusak" },
  defect: { en: "Factory defect", id: "Cacat produksi" },
  slow: { en: "Slow moving", id: "Slow moving" },
  wrong: { en: "Wrong item", id: "Salah kirim" },
};
const REASON_IDS = Object.keys(REASONS);
const AREAS = ["Kemang", "Senayan", "Kelapa Gading", "BSD", "Bekasi", "Depok", "Bogor", "Bandung", "Surabaya", "Medan", "Denpasar", "Makassar", "Semarang"];

function article(id, name, code, division, tags, colours, sizes, extra = {}) {
  return {
    id, name, code, division, tags, colours, sizes,
    setup: extra.setup || "02 Oct 2026", dcPer: extra.dcPer ?? 10,
    skus: colours.flatMap((c, ci) => sizes.map((s) => ({ id: `${id}:${ci}:${s}`, art: id, code: code + ci + (SIZE_CODE[s] || "09"), colour: c, size: s }))),
  };
}

function demoData() {
  const stores = AREAS.map((a, i) => ({ id: "s" + (i + 1), code: "C" + String(i + 1).padStart(3, "0"), name: a }));
  const sups = [
    { id: "g", name: "Garmen Nusantara, PT", arts: [
      article("a2", "Kemeja Oxford", "00000002", "Pria", ["Kemeja", "Lengan Pendek"], ["Navy", "White", "Khaki", "Light Blue"], ["M", "L", "XL"], { dcPer: 20 }),
      article("a4", "Gamis", "00000004", "Wanita", ["Gamis"], ["Grey", "White", "Black", "Navy"], ["One Size"], { dcPer: 10 }),
    ] },
    { id: "i", name: "Indorama, PT", arts: [
      article("a5", "Kaos Uji UJI3", "00000005", "Pria", ["Kaos"], ["Black", "White"], ["M", "L"], { dcPer: 1, setup: "04 Oct 2026" }),
      article("a6", "Kaos Uji UJI4", "00000006", "Pria", ["Kaos"], ["Black", "White"], ["M", "L"], { dcPer: 1, setup: "04 Oct 2026" }),
      article("a1", "Kemeja", "00000001", "Wanita", ["Kemeja"], ["Off White", "Grey"], ["L", "XL"], { dcPer: 31 }),
    ] },
    { id: "s", name: "Sinar Busana, CV", arts: [
      article("a7", "Celana Chino", "00000007", "Pria", ["Celana", "Slim Fit"], ["Khaki", "Black", "Olive"], ["30", "32", "34"], { dcPer: 15, setup: "06 Oct 2026" }),
    ] },
  ];
  // Return stock lives in a handful of stores, a few pieces at a time: what a
  // store has set aside to send back. Kaos Uji UJI4 has none.
  const holders = ["s2", "s3", "s5", "s7", "s9", "s11", "s12"];
  const rnd = mulberry32(11);
  const ret = {}, dc = {};
  for (const s of sups) for (const a of s.arts) for (const k of a.skus) {
    dc[k.id] = a.dcPer;
    const m = {};
    if (a.id !== "a6" && rnd() < (a.id === "a2" ? 0.7 : 0.6)) {
      const n = 1 + Math.floor(rnd() * 3);
      for (let j = 0; j < n; j++) {
        const st = holders[Math.floor(rnd() * holders.length)];
        m[st] = (m[st] || 0) + 1 + Math.floor(rnd() * 4);
      }
    }
    ret[k.id] = m;
  }
  return withReasons({ stores, sups, ret, dc }, 21);
}
function withReasons(d, seed) {
  const rnd = mulberry32(seed);
  d.why = {};
  for (const [sku, m] of Object.entries(d.ret)) {
    d.why[sku] = {};
    for (const st of Object.keys(m)) { const x = rnd(); d.why[sku][st] = x < 0.4 ? "damaged" : x < 0.6 ? "defect" : x < 0.9 ? "slow" : "wrong"; }
  }
  return d;
}

function worstData() {
  const names = ["Grand Indonesia East Mall Lantai 3 Unit 27–29", "Ö-Ümlaut Plaza", "Pakuwon Mall", "苏门答腊 Medan Centre", "Tunjungan Plaza 6", "Bintaro Xchange Mall 2", "Summarecon Mal Serpong", "Trans Studio Mall Makassar", "Living World Alam Sutera", "Paris Van Java", "Galaxy Mall 3", "Lippo Mall Puri", "Beachwalk", "Kota Kasablanka", "Mal Bali Galeria", "Sun Plaza", "Paragon Semarang", "Hartono Mall", "Ciputra World", "Cambridge City Square"];
  const stores = names.map((n, i) => ({ id: "ws" + (i + 1), code: "C" + String(i + 1).padStart(3, "0"), name: n }));
  const sups = [
    { id: "wg", name: "PT Garmen Nusantara Sejahtera Abadi Makmur Internasional Tbk (Divisi Ekspor & Grosir)", arts: [
      article("w1", "Kemeja Oxford Lengan Panjang Slim Fit Premium Cotton Stretch Anti Kusut Edisi Lebaran 2026", "00004821", "Pria Dewasa Formal & Semi Formal", ["Kemeja", "Lengan Panjang", "Slim Fit", "Premium", "Lebaran 2026", "Anti Kusut", "Cotton"], ["Light Heather Blue Melange", "Dusty Rose Pink Pastel", "Charcoal Grey Marl", "Hijau Botol Tua", "Biru Dongker", "Abu-abu Muda"], ["S", "M", "L", "XL", "XXL", "XXXL", "One Size"]),
      article("w2", "X", "00000009", "Pria Dewasa Formal & Semi Formal", [], ["Black"], ["M"]),
    ] },
    { id: "wo", name: "CV Ö-Ümlaut 布料 Tekstil & Co.", arts: [
      article("w3", "布料 Kaos Polos Basic 🧵", "00099999", "Unisex", ["Kaos"], ["White"], ["M", "L"]),
    ] },
  ];
  const rnd = mulberry32(99);
  const ret = {}, dc = {};
  for (const s of sups) for (const a of s.arts) for (const k of a.skus) {
    dc[k.id] = rnd() < 0.08 ? 0 : 1 + Math.floor(rnd() * 12500);
    const m = {};
    if (rnd() < 0.85) {
      const n = 2 + Math.floor(rnd() * 10);
      for (let j = 0; j < n; j++) {
        const st = stores[Math.floor(rnd() * stores.length)].id;
        m[st] = (m[st] || 0) + 1 + Math.floor(rnd() * 1250);
      }
    }
    ret[k.id] = m;
  }
  return withReasons({ stores, sups, ret, dc }, 31);
}

let D;
const S = { mode: "return", data: "demo", screen: "matrix" };

function reset(keep) {
  D = S.data === "worst" ? worstData() : demoData();
  Object.assign(S, {
    tab: "stock", sel: new Set(), q: "", cells: {}, shut: new Set(), saved: {}, spoken: new Set(),
    saving: new Set(), filter: "", focus: null, rows: seedRows(S.data === "worst"), seq: 20,
    asking: false, progress: null, supShut: new Set(), fresh: null,
  });
  attachLines();
  if (!keep) { S.mode = "return"; S.screen = "list"; }
  S.arts = defaultArts();
  S.stores = defaultStores();
}

const allArts = () => D.sups.flatMap((s) => s.arts);

/// The seeded returns get lines: a few SKUs, a few pieces each, each with the
/// reason the store gave when it set them aside.
function attachLines() {
  const rnd = mulberry32(5);
  const skus = allArts().flatMap((a) => a.skus);
  for (const r of S.rows.return) {
    const st = D.stores.find((s) => s.name === r.stores[0]) || D.stores[0];
    Object.assign(r, { store: st.id, by: "Rina Wulandari", sender: "Maya Sari", lines: [] });
    let left = r.pcs, i = Math.floor(rnd() * skus.length);
    while (left > 0) {
      const k = skus[i % skus.length];
      const q = Math.min(left, 1 + Math.floor(rnd() * (D === null ? 4 : r.pcs > 100 ? 400 : 4)));
      r.lines.push({ k: k.id, asked: q, why: REASON_IDS[Math.floor(rnd() * 4)] });
      left -= q; i += 3;
    }
    for (const l of r.lines) { l.picked = r.picked ? l.asked : 0; l.sent = r.dispatch ? l.asked : 0; l.recv = r.status === "completed" ? l.sent : 0; }
    let short = r.status === "completed" ? r.dispatch - r.received : 0;
    for (const l of r.lines) { if (short <= 0) break; const t = Math.min(short, l.recv); l.recv -= t; short -= t; }
    r.items = new Set(r.lines.map((l) => skuById(l.k).art)).size;
  }
}
const artById = (id) => allArts().find((a) => a.id === id);
const supOf = (id) => D.sups.find((s) => s.arts.some((a) => a.id === id));
const skuById = (id) => { for (const a of allArts()) for (const k of a.skus) if (k.id === id) return k; };
const storeById = (id) => D.stores.find((s) => s.id === id);
const spokenKey = (art) => `${S.mode}|${art}`;
const isSpoken = (art) => S.spoken.has(spokenKey(art));
const R = () => S.mode === "return";

/// What a SKU still has to give: the chosen stores' return stock (return) or
/// the DC's free stock (allotment). Gone once its store / article is submitted.
function stockOf(k) {
  if (R()) return sum(S.stores || [], (st) => heldAt(k, st));
  return isSpoken(k.art) ? 0 : D.dc[k.id] || 0;
}
/// One store's return stock of a SKU — the most its box may hold. Gone once
/// that store's return is submitted.
const storeSpoken = (id) => S.spoken.has("return|" + id);
function heldAt(k, store) { return storeSpoken(store) ? 0 : (D.ret[k.id] || {})[store] || 0; }
const heldOrig = (k, store) => (D.ret[k.id] || {})[store] || 0;
const artAt = (a, store) => sum(a.skus, (k) => heldAt(k, store));
const storeStock = (id) => sum(allArts(), (a) => artAt(a, id));
function defaultStores() { return D.stores.filter((s) => storeStock(s.id) > 0).slice(0, 3).map((s) => s.id); }
const stockOfArt = (a) => sum(a.skus, stockOf);
const key = (sku, store) => `${sku}|${store}`;
const cellOf = (sku, store) => S.cells[key(sku, store)] || 0;

function defaultArts() {
  const free = (a) => !S.spoken.has("allot|" + a.id) && sum(a.skus, (k) => D.dc[k.id] || 0) > 0;
  for (const s of D.sups) {
    const arts = s.arts.filter(free);
    if (arts.length) return arts.map((a) => a.id);
  }
  return [];
}

/// The columns: every store for an allotment; for a return only the stores
/// that hold return stock of these articles — nothing else can come back.
function destinations(arts) {
  if (!R()) return D.stores;
  const ids = new Set();
  for (const a of arts) for (const k of a.skus) for (const [st, q] of Object.entries(D.ret[k.id] || {})) if (q > 0) ids.add(st);
  return D.stores.filter((s) => ids.has(s.id));
}

function model() {
  if (R()) return returnModel();
  const arts = S.arts.map(artById).filter(Boolean);
  const sups = [...new Set(arts.map((a) => supOf(a.id)))];
  const dests = destinations(arts);
  const f = S.filter.trim().toLowerCase();
  const shown = arts.filter((a) => !f || [a.name, a.code, a.division, ...a.tags].join(" ").toLowerCase().includes(f));
  const st = {};
  for (const a of arts) {
    let stock = 0, given = 0, over = false;
    for (const k of a.skus) {
      const s = stockOf(k), g = sum(dests, (d) => cellOf(k.id, d.id));
      stock += s; given += g; if (g > s) over = true;
    }
    st[a.id] = { stock, given, left: stock - given, over, saved: S.saved[spokenKey(a.id)], ready: given > 0 && given === stock && !over };
  }
  const per = {};
  for (const d of dests) per[d.id] = sum(arts, (a) => sum(a.skus, (k) => cellOf(k.id, d.id)));
  const several = arts.filter((a) => st[a.id].given > 0).length >= 2;
  const pieces = sum(arts, (a) => st[a.id].given);
  const ready = arts.filter((a) => st[a.id].ready && !S.saving.has(a.id));
  const title = `${R() ? "Return to HO" : "Allotment"} - ${sups.length === 1 ? sups[0].name : `${sups.length} suppliers`}`;
  return { arts, shown, dests, st, per, several, pieces, ready, title };
}

/// Return to HO: the columns are the stores chosen on the list, and the rule
/// is the allotment's turned on its side — each STORE's return stock has to be
/// emptied, and each store is submitted as its own return.
function returnModel() {
  const dests = (S.stores || []).map(storeById).filter(Boolean);
  const holds = (k) => dests.some((d) => heldOrig(k, d.id) > 0);
  const arts = allArts().filter((a) => a.skus.some(holds));
  const f = S.filter.trim().toLowerCase();
  const shown = arts.filter((a) => !f || [a.name, a.code, a.division, ...a.tags, supOf(a.id).name].join(" ").toLowerCase().includes(f));
  const per = {};
  for (const d of dests) {
    const stock = sum(arts, (a) => artAt(a, d.id));
    const given = sum(arts, (a) => sum(a.skus, (k) => cellOf(k.id, d.id)));
    per[d.id] = { stock, given, left: stock - given, ready: given > 0 && given === stock, saved: S.saved["return|" + d.id] };
  }
  const st = {};
  for (const a of arts) st[a.id] = { stock: sum(a.skus, stockOf) };
  const pieces = sum(dests, (d) => per[d.id].given);
  const ready = dests.filter((d) => per[d.id].ready && !S.saving.has(d.id));
  const title = `Return to HO - ${dests.length === 1 ? `${dests[0].code} · ${dests[0].name}` : `${dests.length} stores`}`;
  return { arts, shown, dests, st, per, pieces, ready, title, holds };
}

function holdersOf(a) {
  const ids = new Set();
  for (const k of a.skus) for (const [st, q] of Object.entries(D.ret[k.id] || {})) if (q > 0) ids.add(st);
  return D.stores.filter((s) => ids.has(s.id));
}

/// Return stock: one fold per store, ticked whole — a store's return stock
/// goes back all at once, so there is nothing to tick inside it.
function storeGroups() {
  const q = S.q.trim().toLowerCase();
  return D.stores
    .map((s) => ({ s, arts: allArts().filter((a) => artAt(a, s.id) > 0 && (!q || `${a.name} ${a.code} ${s.code} ${s.name}`.toLowerCase().includes(q))) }))
    .filter((g) => g.arts.length);
}
/// An article's pieces in one store's return stock, by the reason given.
function reasonsOf(a, store) {
  const by = {};
  for (const k of a.skus) { const q = heldAt(k, store); if (q) { const w = D.why[k.id][store]; by[w] = (by[w] || 0) + q; } }
  return REASON_IDS.filter((w) => by[w]).map((w) => [w, by[w]]);
}

  return `<div class="card">${groups.map(({ s, arts }) => {
    const total = sum(arts, stockOfArt);
    const picked = arts.filter((a) => S.sel.has(a.id)).length;

/* ======================================================================
   Render: the matrix
   ====================================================================== */
function matrixHTML() {
  const M = model();
  return `<div class="ed ${R() ? "ret" : ""}">
    <header class="ed-top"><button class="btn" data-act="back">Back</button><h1 class="ed-title" title="${esc(M.title)}">${esc(M.title)}</h1></header>
    <div class="ed-tools">
      <label class="filter">${ICON.search}<input id="flt" placeholder="Filter by article, tag or division" value="${esc(S.filter)}" autocomplete="off"></label>
      <div class="tools-r" id="tools">${toolsHTML(M)}</div>
    </div>
    <div class="gb" id="gb"><div class="grid ${R() ? "ret" : ""}" id="grid">${gridHTML(M)}</div></div>
  </div>`;
}

function toolsHTML(M) {
  const r = R();
  if (S.asking)
    return `<button class="btn" data-act="leave">${r ? "Back to returns" : "Back to allotments"}</button>
      <button class="btn primary" data-act="carry">${r ? "Continue returning" : "Continue allotting"}</button>`;
  const busy = !!S.progress;
  return `<button class="btn" data-act="sheet" ${M.pieces ? "" : "disabled"}>${r ? "To be returned" : "To be allotted"}${M.pieces ? ` <span class="mute tn"><span class="tk" data-tick="tp">${pcs(M.pieces)}</span></span>` : ""}</button>
    <button class="btn primary" data-act="submitall" ${M.ready.length && !busy ? "" : "disabled"}>${busy ? `<span class="spin"></span>Submitting ${fmt(S.progress.i)} of ${fmt(S.progress.n)}…` : "Submit all"}</button>`;
}

function gridHTML(M) {
  if (R()) return returnGridHTML(M);
  const r = R();
  if (!M.arts.length) return `<div class="empty">Nothing to ${r ? "return" : "allot"}.</div>`;
  const stockTotal = sum(M.shown, (a) => M.st[a.id].stock);
  let h = `<div class="g-row g-head">
    <div class="c-id st-l"><span class="hl">Article</span><span class="tn">${fmt(M.shown.length)} ${many(M.shown.length, "article", "articles")}<span class="ph-only"> · ${pcs(stockTotal)}</span></span></div>
    <div class="c-free"><span class="hl">${r ? "Return stock" : "Stock"}</span><span class="tn">${pcs(stockTotal)}</span></div>
    ${M.dests.map((d) => {
      const t = M.per[d.id];
      return `<div class="c-col" title="${esc(`${d.code} · ${d.name}`)}"><span class="d-code ${t > 0 ? "on" : ""}">${d.code}</span>${M.several ? `<span class="d-tot tn ${t > 0 ? "on" : ""}" ><span class="tk" data-tick="h:${d.id}">${t > 0 ? fmt(t) : "—"}</span></span>` : ""}</div>`;
    }).join("")}
    <div class="c-left"><button class="more" data-act="more" aria-label="More stores to the right">${ICON.chev}</button>Left</div>
    <div class="c-fill"></div>
  </div>`;
  if (!M.shown.length) return h + `<div class="empty">No article matches this filter.</div>`;
  const divisions = [];
  for (const a of M.shown) { let g = divisions.find((x) => x.name === a.division); if (!g) divisions.push((g = { name: a.division, arts: [] })); g.arts.push(a); }
  for (const g of divisions) {
    h += `<div class="g-row g-div"><div class="c-id st-l"><b>${esc(g.name || "No division")}</b><span class="tn">${fmt(g.arts.length)} ${many(g.arts.length, "article", "articles")}</span></div><div class="c-fill"></div></div>`;
    for (const a of g.arts) {
      h += articleRow(a, M);
      // A return only lists the SKUs some store holds: a row of dashes says
      // nothing. An allotment lists every SKU, as the hub does.
      if (!S.shut.has(a.id)) for (const k of a.skus) if (!R() || sum(Object.values(D.ret[k.id] || {})) > 0) h += skuRow(k, M);
    }
  }
  return h;
}

function articleRow(a, M) {
  const st = M.st[a.id];
  const open = !S.shut.has(a.id);
  const focused = S.focus && S.focus.art === a.id;
  const subs = M.dests.map((d) => {
    const t = sum(a.skus, (k) => cellOf(k.id, d.id));
    const inner = `<span class="tk" data-tick="as:${a.id}:${d.id}">${fmt(t)}</span>`;
    return `<div class="c-col" ${t > 0 ? `title="${esc(`${a.name} ${R() ? "from" : "to"} ${d.name}`)}"` : ""}>${t > 0 ? (M.several ? `<span class="o-chip">${inner}</span>` : inner) : ""}</div>`;
  }).join("");
  return `<div class="g-row g-art ${focused ? "focused" : ""}" data-art="${a.id}">
    <div class="c-id st-l">
      <button class="fold" data-act="fold" data-art="${a.id}" aria-expanded="${open}" aria-label="${open ? "Fold" : "Open"} ${esc(a.name)}">${ICON.chev}</button>
      <button class="a-name" data-act="fold" data-art="${a.id}" aria-expanded="${open}">
        <span class="nm">${esc(a.name)}</span><span class="cd">${esc(a.code)}</span>
        ${a.tags.length ? `<span class="tags">${a.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</span>` : ""}
      </button>
      <button class="wand" data-act="wand" data-art="${a.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Fill ${esc(a.name)}" title="Fill this article">${ICON.wand}</button>
    </div>
    <div class="c-free ${st.stock > 0 ? "" : "faint"}">${fmt(st.stock)}</div>
    ${subs}
    <div class="c-left">${stateHTML(a, st)}</div>
    <div class="c-fill"></div>
  </div>`;
}

/// The article's right-hand gutter, in the order it happens: stock waiting,
/// stock left over, finished and submittable, submitted.
function stateHTML(a, st) {
  if (S.saving.has(a.id)) return `<button class="btn primary sm" disabled aria-label="Submitting"><span class="spin"></span></button>`;
  if (st.given === 0 && st.saved) return `<span class="saved" title="Saved as ${st.saved}">${st.saved}</span>`;
  if (st.given === 0) return `<span class="faint tn">${st.stock ? fmt(st.stock) : ""}</span>`;
  if (st.over) return `<span class="too">Too many</span>`;
  if (st.left > 0)
    return `<button class="btn primary sm" disabled title="${R() ? "Every piece of the return stock has to come back before this article can be submitted" : "Every piece has to go to a store before this article can be saved"}">Submit</button>`;
  return `<button class="btn primary sm" data-act="save" data-art="${a.id}">Submit</button>`;
}

function skuRow(k, M) {
  const stock = stockOf(k);
  const given = sum(M.dests, (d) => cellOf(k.id, d.id));
  const left = stock - given;
  const cells = M.dests.map((d) => {
    const here = cellOf(k.id, d.id);
    if (R()) {
      const held = heldAt(k, d.id);
      if (held === 0 && here === 0) return `<div class="c-col"><span class="nil" title="${esc(d.name)} holds none of this SKU">—</span></div>`;
      return `<div class="c-col"><input class="cell ${here ? "filled" : ""}" type="text" inputmode="numeric" data-cell data-row="${k.id}" data-col="${d.id}" data-art="${k.art}" aria-label="${esc(`${k.code} from ${d.name}`)}" placeholder="${fmt(held)}" value="${here || ""}" title="${esc(`${d.name} holds ${pcs(held)} in return stock`)}"></div>`;
    }
    const most = Math.max(0, stock - (given - here));
    return `<div class="c-col"><input class="cell ${here ? "filled" : ""}" type="text" inputmode="numeric" data-cell data-row="${k.id}" data-col="${d.id}" data-art="${k.art}" aria-label="${esc(`${k.code} to ${d.name}`)}" value="${here || ""}" ${most === 0 ? 'title="Nothing of this SKU is left free in the pool"' : ""}></div>`;
  }).join("");
  const cls = left < 0 ? "bad" : given === 0 ? "idle" : left === 0 ? "ok" : "warn";
  return `<div class="g-row g-sku" data-sku="${k.id}">
    <div class="c-id st-l"><span class="sk-n"><span class="sk-co">${esc(k.colour || "—")}</span>${k.size ? `<span class="sk-sz">&nbsp;· ${esc(k.size)}</span>` : ""}</span><span class="sk-c">${esc(k.code)}</span></div>
    <div class="c-free ${stock > 0 ? "" : "faint"}">${fmt(stock)}</div>
    ${cells}
    <div class="c-left"><span class="chip ${cls}"><span class="tk" data-tick="l:${k.id}">${fmt(given === 0 ? stock : left)}</span></span></div>
    <div class="c-fill"></div>
  </div>`;
}

/* ---------- the return grid: stores across, emptied store by store ---------- */
function returnGridHTML(M) {
  if (!M.dests.length) return `<div class="empty">Choose a store on the list.</div>`;
  const stockTotal = sum(M.dests, (d) => M.per[d.id].stock);
  const leftTotal = sum(M.dests, (d) => M.per[d.id].left);
  let h = `<div class="g-row g-head">
    <div class="c-id st-l"><span class="hl">Article</span><span class="tn">${fmt(M.shown.length)} ${many(M.shown.length, "article", "articles")}<span class="ph-only"> · ${pcs(stockTotal)}</span></span></div>
    <div class="c-free"><span class="hl">Return stock</span><span class="tn">${pcs(stockTotal)}</span></div>
    ${M.dests.map((d) => {
      const p = M.per[d.id];
      return `<div class="c-col st-head" title="${esc(`${d.code} · ${d.name}`)}">
        <span class="d-line"><span class="d-code ${p.given > 0 ? "on" : ""}">${d.code}</span>${p.stock ? `<button class="swand" data-act="swand" data-store="${d.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Fill ${esc(d.name)}" title="Fill this store">${ICON.wand}</button>` : ""}</span>
        <span class="d-name">${esc(d.name)}</span></div>`;
    }).join("")}
    <div class="c-fill"></div>
  </div>`;
  if (!M.shown.length) h += `<div class="empty">No article matches this filter.</div>`;
  else {
    const divisions = [];
    for (const a of M.shown) { let g = divisions.find((x) => x.name === a.division); if (!g) divisions.push((g = { name: a.division, arts: [] })); g.arts.push(a); }
    for (const g of divisions) {
      h += `<div class="g-row g-div"><div class="c-id st-l"><b>${esc(g.name || "No division")}</b><span class="tn">${fmt(g.arts.length)} ${many(g.arts.length, "article", "articles")}</span></div><div class="c-fill"></div></div>`;
      for (const a of g.arts) {
        h += returnArticleRow(a, M);
        if (!S.shut.has(a.id)) for (const k of a.skus) if (M.holds(k)) h += returnSkuRow(k, M);
      }
    }
  }
  h += `<div class="g-row g-foot">
    <div class="c-id st-l">Left</div>
    <div class="c-free"><span class="tk ${M.pieces && leftTotal === 0 ? "okt" : ""}" data-tick="fl">${fmt(leftTotal)}</span></div>
    ${M.dests.map((d) => `<div class="c-col"><div class="ft">${storeState(d, M.per[d.id])}</div></div>`).join("")}
    <div class="c-fill"></div>
  </div>`;
  return h;
}

/// The foot of a store's column, in the order it happens: return stock
/// waiting, some left, emptied and submittable, submitted.
function storeState(d, p) {
  if (S.saving.has(d.id)) return `<span class="chip ok">0</span><button class="btn primary sm" disabled aria-label="Submitting"><span class="spin"></span></button>`;
  if (p.given === 0 && p.saved) return `<span class="saved" title="Saved as ${p.saved}">${p.saved}</span>`;
  const cls = p.given === 0 ? "idle" : p.left === 0 ? "ok" : "warn";
  const chip = `<span class="chip ${cls}"><span class="tk" data-tick="sl:${d.id}">${fmt(p.given === 0 ? p.stock : p.left)}</span></span>`;
  if (p.given === 0) return chip;
  if (p.left > 0) return chip + `<button class="btn primary sm" disabled title="Everything in ${esc(d.name)}'s return stock has to come back before it can be submitted">Submit</button>`;
  return chip + `<button class="btn primary sm" data-act="save" data-art="${d.id}">Submit</button>`;
}

function returnArticleRow(a, M) {
  const open = !S.shut.has(a.id);
  const focused = S.focus && S.focus.art === a.id;
  const stock = M.st[a.id].stock;
  return `<div class="g-row g-art ${focused ? "focused" : ""}" data-art="${a.id}">
    <div class="c-id st-l">
      <button class="fold" data-act="fold" data-art="${a.id}" aria-expanded="${open}" aria-label="${open ? "Fold" : "Open"} ${esc(a.name)}">${ICON.chev}</button>
      <button class="a-name" data-act="fold" data-art="${a.id}" aria-expanded="${open}">
        <span class="nm">${esc(a.name)}</span><span class="cd">${esc(a.code)} · ${esc(supOf(a.id).name)}</span>
        ${a.tags.length ? `<span class="tags">${a.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</span>` : ""}
      </button>
    </div>
    <div class="c-free ${stock > 0 ? "" : "faint"}">${fmt(stock)}</div>
    ${M.dests.map((d) => {
      const t = sum(a.skus, (k) => cellOf(k.id, d.id));
      return `<div class="c-col">${t > 0 ? `<span class="tk" data-tick="as:${a.id}:${d.id}">${fmt(t)}</span>` : ""}</div>`;
    }).join("")}
    <div class="c-fill"></div>
  </div>`;
}

function returnSkuRow(k, M) {
  const stock = stockOf(k);
  const cells = M.dests.map((d) => {
    const here = cellOf(k.id, d.id), held = heldAt(k, d.id);
    if (held === 0 && here === 0) return `<div class="c-col"><span class="nil" title="${esc(d.name)} holds none of this SKU">—</span></div>`;
    return `<div class="c-col"><input class="cell ${here ? "filled" : ""}" type="text" inputmode="numeric" data-cell data-row="${k.id}" data-col="${d.id}" data-art="${k.art}" aria-label="${esc(`${k.code} from ${d.name}`)}" placeholder="${fmt(held)}" value="${here || ""}" title="${esc(`${d.name} holds ${pcs(held)} in return stock`)}"></div>`;
  }).join("");
  return `<div class="g-row g-sku" data-sku="${k.id}">
    <div class="c-id st-l"><span class="sk-n"><span class="sk-co">${esc(k.colour || "—")}</span>${k.size ? `<span class="sk-sz">&nbsp;· ${esc(k.size)}</span>` : ""}</span><span class="sk-c">${esc(k.code)}</span></div>
    <div class="c-free ${stock > 0 ? "" : "faint"}">${fmt(stock)}</div>
    ${cells}
    <div class="c-fill"></div>
  </div>`;
}

/* ---------- partial render while typing ---------- */
const ticks = new Map();
let restoring = false;

function renderGrid(opts = {}) {
  const grid = $("#grid");
  if (!grid) return;
  const M = model();
  grid.innerHTML = gridHTML(M);
  $("#tools").innerHTML = toolsHTML(M);
  const ed = $(".ed-title"); if (ed) ed.textContent = M.title;
  afterGrid(opts);
}

function afterGrid(opts = {}) {
  for (const el of $$("[data-tick]")) {
    const k = el.dataset.tick, v = el.textContent, was = ticks.get(k);
    if (was !== undefined && was !== v && !reduced()) {
      const rose = (parseInt(v.replace(/\D/g, ""), 10) || 0) > (parseInt(was.replace(/\D/g, ""), 10) || 0);
      el.animate([{ transform: `translateY(${rose ? 4 : -4}px)`, opacity: 0.4 }, { transform: "none", opacity: 1 }], { duration: 160, easing: "cubic-bezier(.23,1,.32,1)" });
    }
    ticks.set(k, v);
  }
  if (opts.focus) {
    const el = $(`input[data-row="${CSS.escape(opts.focus.row)}"][data-col="${CSS.escape(opts.focus.col)}"]`);
    if (el) {
      restoring = true; el.focus({ preventScroll: true }); restoring = false;
      const n = el.value.length; el.setSelectionRange(n, n);
      if (opts.refused) {
        el.classList.add("refused");
        setTimeout(() => el.classList.remove("refused"), 700);
        if (!reduced()) el.animate([{ transform: "translateX(0)" }, { transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "translateX(-3px)" }, { transform: "translateX(2px)" }, { transform: "translateX(0)" }], { duration: 280, easing: "cubic-bezier(.23,1,.32,1)" });
      }
    }
  }
  checkMore();
}

function checkMore() {
  const gb = $("#gb");
  if (gb) gb.dataset.more = String(gb.scrollLeft + gb.clientWidth < gb.scrollWidth - 2);
}

/* ======================================================================
   Acts
   ====================================================================== */
function setCell(k, n) { if (n > 0) S.cells[k] = n; else delete S.cells[k]; }

function nowText() {
  const now = new Date();
  return `${String(now.getDate()).padStart(2, "0")} ${now.toLocaleString("en-US", { month: "short" })} ${now.getFullYear()} · ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
}

/// A return is one store's: its column becomes one allotment, store → HO.
function saveStore(id, then) {
  S.saving.add(id);
  renderGrid();
  setTimeout(() => {
    const M = model();
    const d = storeById(id);
    const items = M.arts.filter((a) => sum(a.skus, (k) => cellOf(k.id, id)) > 0).length;
    const num = "ALT-" + String(S.seq++).padStart(8, "0");
    S.rows.return.unshift({ num, stores: [d.name], pcs: M.per[id].given, items, created: nowText(), age: "Today", picked: 0, dispatch: 0, received: 0, status: "active" });
    S.fresh = [...(S.fresh || []), num];
    for (const a of M.arts) for (const k of a.skus) delete S.cells[key(k.id, id)];
    S.spoken.add("return|" + id);
    S.saved["return|" + id] = num;
    S.saving.delete(id);
    renderGrid();
    then && then();
  }, 520);
}

function save(artId, then) {
  if (R()) return saveStore(artId, then);
  S.saving.add(artId);
  renderGrid();
  setTimeout(() => {
    const a = artById(artId);
    const M = model();
    const qty = sum(a.skus, (k) => sum(M.dests, (d) => cellOf(k.id, d.id)));
    const stores = M.dests.filter((d) => sum(a.skus, (k) => cellOf(k.id, d.id)) > 0).map((d) => d.name);
    const num = "ALT-" + String(S.seq++).padStart(8, "0");
    const now = new Date();
    const created = `${String(now.getDate()).padStart(2, "0")} ${now.toLocaleString("en-US", { month: "short" })} ${now.getFullYear()} · ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    S.rows[S.mode].unshift({ num, stores, pcs: qty, items: 1, created, age: "Today", picked: 0, dispatch: 0, received: 0, status: "active" });
    S.fresh = [...(S.fresh || []), num];
    for (const k of a.skus) for (const d of M.dests) delete S.cells[key(k.id, d.id)];
    S.spoken.add(spokenKey(artId));
    S.saved[spokenKey(artId)] = num;
    S.saving.delete(artId);
    renderGrid();
    then && then();
  }, 520);
}

/// Fills (or empties) one store's column, and says what it did with an Undo.
function fillStore(id, take) {
  const M = model();
  const before = {};
  let given = 0;
  for (const a of M.arts) for (const k of a.skus) {
    const kk = key(k.id, id);
    if (S.cells[kk]) before[kk] = S.cells[kk];
    delete S.cells[kk];
    if (take) { const v = heldAt(k, id); setCell(kk, v); given += v; }
  }
  renderGrid();
  const d = storeById(id);
  toast(take ? `Filled ${d.code} · ${pcs(given)}` : "Cleared", () => {
    for (const a of model().arts) for (const k of a.skus) delete S.cells[key(k.id, id)];
    Object.assign(S.cells, before);
    renderGrid();
  });
}
function closeMenu() {
  if (!menuFor) return;
  $("#pop").classList.remove("open");
  menuFor.btn?.setAttribute("aria-expanded", "false");
  menuFor = null;
}

function fill(artId, plan) {
  const a = artById(artId);
  const M = model();
  const before = {};
  for (const k of a.skus) for (const d of M.dests) { const v = cellOf(k.id, d.id); if (v) before[key(k.id, d.id)] = v; }
  for (const k of a.skus) for (const d of M.dests) delete S.cells[key(k.id, d.id)];
  let skus = 0, given = 0;
  for (const k of a.skus) {
    const values = plan(k, M.dests);
    const t = sum(Object.values(values));
    if (t > 0) skus++;
    given += t;
    for (const [d, v] of Object.entries(values)) setCell(key(k.id, d), v);
  }
  renderGrid();
  return { before, skus, given, art: a };
}
function undoable(res, word) {
  toast(word ?? (res.given ? `Filled ${fmt(res.skus)} ${many(res.skus, "SKU", "SKUs")} · ${pcs(res.given)}` : "Nothing to fill"), res.given || word ? () => {
    const M = model();
    for (const k of res.art.skus) for (const d of M.dests) delete S.cells[key(k.id, d.id)];
    Object.assign(S.cells, res.before);
    renderGrid();
  } : null);
}

function stageOf(r) {
  if (r.status === "cancelled") return ["Cancelled", "mute"];
  if (r.status === "completed") return r.received < r.dispatch ? ["Completed · issue", "warn"] : ["Completed", "ok"];
  if (r.dispatch > 0) return ["In transit", "info"];
  if (r.picked > 0) return ["Picked", "info"];
  return ["To pick", "info"];
}
function byArticle(lines) {
  const out = [];

    if (!g) out.push((g = { a: artById(k.art), lines: [] }));
    g.lines.push({ ...l, sku: k });
  }
  return out;
}

  switch (act) {
    case "reset": reset(true); render(); break;
    case "nav": S.mode = t.dataset.mode; S.tab = "stock"; S.sel.clear(); S.cells = {}; S.arts = defaultArts(); S.stores = defaultStores(); render(); break;
    case "tab": S.tab = t.dataset.tab; S.q = ""; render(); break;
    case "supfold": S.supShut.has(t.dataset.sup) ? S.supShut.delete(t.dataset.sup) : S.supShut.add(t.dataset.sup); render(); break;
    case "selclear": S.sel.clear(); render(); break;
    case "make":
      // A store's return stock goes back whole: nothing to type, so no grid —
      // say what will come back, and ask once.
      if (R()) { openAsk(); break; }
      S.arts = [...S.sel];
      S.sel.clear(); S.screen = "matrix"; S.filter = ""; S.asking = false; S.shut.clear(); S.focus = null;
      render(); break;
    case "back": if (model().pieces > 0) openConfirm(); else goList("stock"); break;
    case "discard": closeLayers(); S.cells = {}; goList("stock"); break;
    case "ask": ask(); break;
    case "rec": openRecord(t.dataset.num); break;
    case "print": openPrint(t.dataset.num); break;
    case "pv-close": $("#pv").classList.remove("open"); break;
    case "pv-print": window.print(); break;
    case "rcancel": openCancel(t.dataset.num); break;
    case "dlg-close": $("#dlg").classList.remove("open"); break;
    case "rcancel-yes": {
      const r = S.rows.return.find((x) => x.num === t.dataset.num);
      r.status = "cancelled";
      S.spoken.delete("return|" + r.store);
      delete S.saved["return|" + r.store];
      closeLayers(); render(); toast(`${r.num} cancelled`);
      break;
    }
    case "leave": goList("progress"); break;
    case "carry": S.asking = false; renderGrid(); break;
    case "fold": S.shut.has(art) ? S.shut.delete(art) : S.shut.add(art); renderGrid(); break;
    case "wand": menuFor && menuFor.art === art ? closeMenu() : openMenu(art, t); break;
    case "swand": menuFor && menuFor.store === t.dataset.store ? closeMenu() : openStoreMenu(t.dataset.store, t); break;
    case "m-sall": { const id = menuFor.store; closeMenu(); fillStore(id, true); break; }
    case "m-sclear": { const id = menuFor.store; closeMenu(); fillStore(id, false); break; }
    case "m-back": openMenu(menuFor.art, menuFor.btn, "main"); break;
    case "m-one": openMenu(menuFor.art, menuFor.btn, "stores"); break;
    case "m-all": { const id = menuFor.art; closeMenu(); undoable(fill(id, (k, ds) => Object.fromEntries(ds.map((d) => [d.id, heldAt(k, d.id)])))); break; }
    case "m-even": {
      const id = menuFor.art; closeMenu();
      undoable(fill(id, (k, ds) => { const s = stockOf(k), b = Math.floor(s / ds.length), rem = s % ds.length; return Object.fromEntries(ds.map((d, i) => [d.id, b + (i < rem ? 1 : 0)])); }));
      break;
    }
    case "m-store": { const id = menuFor.art, store = t.dataset.store; closeMenu(); undoable(fill(id, (k) => ({ [store]: stockOf(k) }))); break; }
    case "m-clear": { const id = menuFor.art; closeMenu(); undoable(fill(id, () => ({})), "Cleared"); break; }
    case "undo": toastUndo && toastUndo(); $("#toast").classList.remove("open"); break;
    case "save": save(art); break;
    case "submitall": submitAll(); break;
    case "sheet": openSheet(); break;
    case "sheet-clear": S.cells = {}; closeLayers(); renderGrid(); break;
    case "close-layer": closeLayers(); break;
    case "more": $("#gb").scrollBy({ left: 336, behavior: reduced() ? "auto" : "smooth" }); break;
  }
});

function setSeg(seg, v) {
  if (S[seg] === v) return;
  if (seg === "data") { S.data = v; reset(true); }
  else if (seg === "mode") { S.mode = v; S.cells = {}; S.sel.clear(); S.asking = false; S.shut.clear(); S.focus = null; S.tab = "stock"; S.arts = defaultArts(); S.stores = defaultStores(); }
  else if (seg === "screen") {
    S.screen = v;
    if (v === "matrix" && R() && !S.stores.length) S.stores = defaultStores();
    if (v === "matrix" && !R() && !S.arts.some((id) => stockOfArt(artById(id)) > 0 || S.saved[spokenKey(id)])) S.arts = defaultArts();
  }
  render();
}

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.act === "storesel") { t.checked ? S.sel.add(t.dataset.store) : S.sel.delete(t.dataset.store); render(); }
  if (t.dataset.act === "artsel") { t.checked ? S.sel.add(t.dataset.art) : S.sel.delete(t.dataset.art); render(); }
  if (t.dataset.act === "supsel") {
    const g = listArts().find((x) => x.s.id === t.dataset.sup);
    const all = g.arts.every((a) => S.sel.has(a.id));
    g.arts.forEach((a) => (all ? S.sel.delete(a.id) : S.sel.add(a.id)));
    render();
  }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "flt") { S.filter = t.value; renderGrid(); return; }
  if (t.id === "lq") { S.q = t.value; render(); const el = $("#lq"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); return; }
  if (!t.matches("input[data-cell]")) return;
  const digits = t.value.replace(/\D/g, "");
  let n = digits === "" ? 0 : parseInt(digits, 10);
  const k = skuById(t.dataset.row), d = t.dataset.col;
  let most;
  if (R()) most = heldAt(k, d);
  else { const M = model(); const given = sum(M.dests, (x) => cellOf(k.id, x.id)); most = Math.max(0, stockOf(k) - (given - cellOf(k.id, d))); }
  let refused = false;
  if (n > most) { n = most; refused = true; }
  setCell(key(k.id, d), n);
  renderGrid({ focus: { row: k.id, col: d }, refused });
});

document.addEventListener("focusin", (e) => {
  const t = e.target;
  if (!t.matches || !t.matches("input[data-cell]")) return;
  if (!restoring) setTimeout(() => t.select(), 0);
  const art = t.dataset.art;
  if (!S.focus || S.focus.art !== art) {
    S.focus = { art };
    $$(".g-art.focused").forEach((r) => r.classList.remove("focused"));
    $(`.g-art[data-art="${CSS.escape(art)}"]`)?.classList.add("focused");
  }
});

/// Arrow keys move between the boxes the way a spreadsheet does.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if ($("#pv").classList.contains("open")) $("#pv").classList.remove("open");
    else if (menuFor) { const b = menuFor.btn; closeMenu(); b?.focus(); }
    else if ($("#dlg").classList.contains("open") && $("#sheet").classList.contains("open")) $("#dlg").classList.remove("open");
    else closeLayers();
    return;
  }
  const t = e.target;
  if (!t.matches || !t.matches("input[data-cell]")) return;
  const dir = { ArrowLeft: "l", ArrowRight: "r", ArrowUp: "u", ArrowDown: "d", Enter: "d" }[e.key];
  if (!dir) return;
  const all = $$("#grid input[data-cell]");
  let next;
  if (dir === "l" || dir === "r") {
    const row = all.filter((x) => x.dataset.row === t.dataset.row);
    next = row[row.indexOf(t) + (dir === "r" ? 1 : -1)];
  } else {
    const rows = [...new Set(all.map((x) => x.dataset.row))];
    let i = rows.indexOf(t.dataset.row);
    while (!next) {
      i += dir === "d" ? 1 : -1;
      if (i < 0 || i >= rows.length) break;
      next = all.find((x) => x.dataset.row === rows[i] && x.dataset.col === t.dataset.col);
    }
  }
  if (next) { e.preventDefault(); next.focus(); }
});

document.addEventListener("scroll", (e) => { if (e.target.id === "gb") { checkMore(); closeMenu(); } }, true);
window.addEventListener("resize", () => { checkMore(); closeMenu(); });
new ResizeObserver(() => document.documentElement.style.setProperty("--bar", $("#pbar").offsetHeight + "px")).observe($("#pbar"));

reset(false);
render();
</script>
</body>
