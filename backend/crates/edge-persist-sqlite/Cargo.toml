[package]
name = "edge-persist-sqlite"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared SQLite infrastructure for edge authority nodes: connection conventions, migration runner, node identity, and the ordered sync outbox. No Store or DC business tables."

[dependencies]
chrono = { version = "=0.4.41", features = ["serde"] }
rusqlite = { version = "=0.32.1", features = ["bundled", "chrono"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
uuid = { version = "=1.16.0", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
