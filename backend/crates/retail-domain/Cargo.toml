[package]
name = "inventory-domain"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure domain model for the inventory platform: identifiers, places, movement rules, POS money math, auth ladder, and the sync protocol. No database driver, no HTTP."

[dependencies]
chrono = { version = "=0.4.41", features = ["serde"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
uuid = { version = "=1.16.0", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "=1.6.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
