[package]
name = "inventory-sim"
version = "0.1.0"
edition = "2021"
description = "The retail simulator: drives the real HTTP API of a live rig, on virtual time"

[lints]
workspace = true

[[bin]]
name = "sim"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.41", features = ["serde"] }
rand = "0.8.8"
rand_chacha = "0.3.1"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
