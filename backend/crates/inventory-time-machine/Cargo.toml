[package]
name = "inventory-time-machine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Deterministic inventory divergence debugger: replay, checkpointed time travel, first-divergence search, causal explanation."

# Pure algorithm crate: no async runtime, no HTTP client, no database driver.
# `serde_json` is a runtime dependency (not test-only) because exporting a
# minimal reproduction fixture is part of the public API.
[dependencies]
chrono = { version = "=0.4.41", features = ["serde"] }
hex = "=0.4.3"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
thiserror = "=2.0.12"

[dev-dependencies]
proptest = "=1.6.0"
