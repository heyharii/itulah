<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect to Central</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1b1b19; --muted: #6b6b66;
    --line: #e4e4df; --accent: #1f5eff; --ok: #1a7f4b; --warn: #a15c00; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --card: #1c1c1a; --text: #ededea; --muted: #9a9a94;
      --line: #2e2e2b; --accent: #6b95ff; --ok: #4cc38a; --warn: #f0a847; --bad: #ff7a70;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit;
  }
  input#code { font: 600 20px/1.2 ui-monospace, "Cascadia Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button {
    margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: 600 15px/1 inherit; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--bad); font-size: 13px; margin-top: 12px; min-height: 1em; }
  .address {
    margin: 4px 0 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px;
  }
  .address small { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .address a {
    font: 600 17px/1.3 ui-monospace, "Cascadia Mono", monospace; color: var(--accent);
    word-break: break-all; text-decoration: none;
  }
  .address a:hover { text-decoration: underline; }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.live { animation: pulse 1.6s ease-in-out infinite; }
  .dot.ok { background: var(--ok); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="idle" hidden>
    <h1>Connect this PC to Central</h1>
    <p>Enter the install code from Central › Stores › your store › Server.</p>
    <form id="form">
      <label for="code">Install code</label>
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX" maxlength="13" required autofocus>
      <!-- Only for a build that does not carry Central's address: the installer
           normally has it baked in and this stays hidden. -->
      <div id="cloud-row" hidden>
        <label for="cloud">Cloud address</label>
        <input id="cloud" type="url" placeholder="https://…">
      </div>
      <button id="submit" type="submit">Connect</button>
      <div class="error" id="idle-error" role="alert"></div>
    </form>
  </section>

  <section id="connected" hidden>
    <h1 id="connected-title" aria-live="polite">Connected · Getting data</h1>
    <p id="connected-site"></p>
    <div class="address" id="address" hidden>
      <small>Store app</small>
      <a id="address-link"></a>
    </div>
    <div class="meta"><span class="dot live" id="connected-dot"></span><span id="connected-note">This can take a minute. You can close this page: the server carries on.</span></div>
    <div class="error" id="connected-error" role="alert"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  // idle | connected
  let shown = null;
  // When this page first saw the claim accepted, for the fallback wording.
  let connectedAt = 0;
  // Set once the node answers as itself rather than as the setup page.
  let running = false;
  let lastSite = "";

  function show(name) {
    for (const id of ["idle", "connected"]) $(id).hidden = id !== name;
    if (name === "connected" && shown !== "connected") connectedAt = Date.now();
    shown = name;
  }

  async function getJson(path) {
    try {
      const response = await fetch(path, { cache: "no-store" });
      return response.ok ? await response.json() : null;
    } catch {
      return null;
    }
  }

  // The DNS label the node advertises itself under: its id, lowercase letters,
  // digits and hyphens (edge/discovery.rs host_label).
  function hostLabel(originId) {
    const label = String(originId || "").trim().toLowerCase()
      .replace(/[^a-z0-9]/g, "-").replace(/^-+|-+$/g, "").slice(0, 63);
    return label || "itulah-store";
  }

  function siteName(identity) {
    const words = [identity.site_code, identity.site_name].filter((word) => word && word.trim());
    return words.length ? words.join(" · ") : identity.site_id;
  }

  // The "Connected" screen. `ready` is true once the node has its data from
  // Central, `identity` is the node's own answer when it is running.
  function connected({ site, ready, identity, note }) {
    show("connected");
    if (site) lastSite = site;
    $("connected-title").textContent = ready ? "Ready" : "Connected · Getting data";
    $("connected-site").textContent = lastSite ? "This PC is the store server for " + lastSite + "." : "";
    $("connected-dot").className = "dot " + (ready ? "ok" : "live");
    if (identity && identity.origin_id) {
      const address = "http://" + hostLabel(identity.origin_id) + ".local:" + (location.port || "8082");
      $("address-link").textContent = address;
      $("address-link").href = address;
      $("address").hidden = false;
    }
    $("connected-note").textContent = ready
      ? "Open the store app on tills and tablets at this address."
      : note || "This can take a minute. You can close this page: the server carries on.";
  }

  function render(state) {
    if (state.state === "IDLE") {
      show("idle");
      // Central's address is normally baked into the installer. Ask for it
      // only when there is none (a developer's build).
      const known = Boolean(state.cloud_url);
      $("cloud-row").hidden = known;
      $("cloud").required = !known;
      if (known) $("cloud").value = state.cloud_url;
      // Keep what a failed Connect just said until the next try.
      if (state.error) $("idle-error").textContent = state.error;
    } else if (state.state === "WAITING") {
      // Claimed. Normally approved within seconds; if it is not, say who decides.
      const slow = shown === "connected" && Date.now() - connectedAt > 45000;
      connected({
        site: state.site_label || state.site_id,
        ready: false,
        note: slow ? "Connected. Head office will confirm." : "",
      });
      $("connected-error").textContent = state.error || "";
    } else if (state.state === "ENROLLED") {
      connected({ site: state.site_label || state.site_id, ready: false });
    }
  }

  // Once approved the setup server hands over to the node itself, which keeps
  // the same address. Its own open endpoints say whether it has its data yet:
  // head office's auth policy arrives with the first sync.
  async function probeNode() {
    const health = await getJson("/api/v1/health");
    if (!health || health.status !== "ok") return false;
    const identity = await getJson("/api/v1/node/identity");
    running = true;
    connected({
      site: identity ? siteName(identity) : "",
      ready: Boolean(health.auth_policy),
      identity,
    });
    return true;
  }

  async function refresh() {
    if (await probeNode()) return;
    if (running) {
      // The node was answering a moment ago and is not: it is restarting.
      connected({ ready: false, note: "The server is restarting." });
      return;
    }
    const state = await getJson("/setup/state");
    if (state) render(state);
    else if (shown === "connected" && Date.now() - connectedAt > 90000) {
      connected({ ready: false, note: "Connected. Head office will confirm." });
    }
  }

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("submit").disabled = true;
    $("idle-error").textContent = "";
    try {
      const response = await fetch("/setup/claim", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ code: $("code").value, cloud_url: $("cloud").value }),
      });
      const body = await response.json();
      if (!response.ok) $("idle-error").textContent = body.error || "Failed.";
      else render(body);
    } catch (error) {
      $("idle-error").textContent = "The local server is not answering: " + error;
    } finally {
      $("submit").disabled = false;
    }
  });

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
