[package]
name = "inventory-edge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "inventory_edge"
path = "src/lib.rs"

[[bin]]
name = "inventory-edge"
path = "src/main.rs"

[dependencies]
async-trait = "=0.1.88"
axum = { version = "=0.8.4", features = ["json", "macros"] }
chrono = { version = "=0.4.41", features = ["serde"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
http = "=1.3.1"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "=1.37.1", features = ["serde-with-str"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal", "migrate"] }
thiserror = "=2.0.12"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.6.6", features = ["cors", "fs", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
uuid = { version = "=1.16.0", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "=1.6.0"
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
