[workspace]
members = [".", "crates/inventory-time-machine", "crates/object-store", "crates/pricing-engine", "crates/tax", "crates/sim"]
default-members = ["."]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "inventory-backend"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[lib]
name = "inventory_backend"
path = "src/lib.rs"

[[bin]]
name = "cloud"
path = "src/bin/cloud.rs"

[[bin]]
name = "dc"
path = "src/bin/dc.rs"

[[bin]]
name = "store"
path = "src/bin/store.rs"

[lints]
workspace = true

[features]
# Emits TypeScript for the types the browser actually receives.
#
# Behind a feature so the shipping binary never carries a code generator, and
# so the generated files are refreshed by a deliberate act (`make contract`)
# rather than as a side effect of an ordinary build.
ts = ["dep:ts-rs", "pricing-engine/ts"]

[dependencies]
inventory-time-machine = { path = "crates/inventory-time-machine" }
object-store = { path = "crates/object-store" }
ts-rs = { version = "=12.0.1", optional = true, features = ["uuid-impl", "chrono-impl"] }
pricing-engine = { path = "crates/pricing-engine" }
async-trait = "=0.1.88"
argon2 = "=0.5.3"
axum = { version = "=0.8.4", features = ["json", "macros", "multipart"] }
# Server-sent events need a Stream; this is the one already in the tree.
futures-util = "=0.3.34"
calamine = { version = "=0.36.1", features = ["dates"] }
chrono = { version = "=0.4.41", features = ["serde"] }
csv = "=1.3.1"
dotenvy = "=0.15.7"
hex = "=0.4.3"
# The mail gateway: a blocking IMAP client (on rustls, never native-tls, so the
# binary keeps one TLS stack), the MIME parser that gets attachments off a
# message, and the three readers that turn one into statement lines.
imap = { version = "=3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mail-parser = "=0.11.8"
office-crypto = "=0.3.0"
pdf-extract = "=0.12.0"
regex = "=1.13.1"
http = "=1.3.1"
# `stream` is what lets the assistant read Claude's answer as it is written
# rather than after it is finished; see `cloud/http/assistant.rs`.
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
# Sealing fingerprint templates at rest (`cloud/postgres/enrolment.rs`).
# Biometric data is `data pribadi spesifik` under UU 27/2022, so the bytes in
# the column must not be a fingerprint to anybody who reads the table.
#
# `ring` rather than a new AEAD crate because it is already in the lock file as
# a rustls dependency and is already compiled: naming it here adds a direct
# edge to a graph it was in anyway, and resolves offline.
ring = "=0.17.14"
# Web Push to the hub on a phone (`cloud/push.rs`). `web-push-native` does the
# RFC 8291 payload encryption and nothing else — no HTTP client, no TLS — so
# the request it builds goes out through the `reqwest`/rustls already here
# rather than a second stack (`web-push` itself drags in OpenSSL via `ece`).
# 0.4.0 rather than 0.5 because 0.5 wants `http >= 1.4` and this tree pins
# 1.3.1; default features off because they are `jwt-simple`, and the VAPID
# token (RFC 8292) is one ES256 signature that `p256` below already makes.
# `base64` is the URL-safe alphabet the browser hands keys over in; it was in
# the lock file already, under reqwest.
web-push-native = { version = "=0.4.0", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
base64 = "=0.22.1"
rusqlite ={ version = "=0.32.1", features = ["bundled", "chrono", "blob"] }
rust_decimal = { version = "=1.37.1", features = ["serde-with-str"] }
# The virtual business clock guards its interior state with a parking_lot
# Mutex: `now()` takes the same lock on every read and must stay
# unwrap-free boilerplate (workspace denies unwrap).
parking_lot = "=0.12.5"
serde = { version = "=1.0.219", features = ["derive"] }
retail-tax = { path = "crates/tax" }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal", "migrate"] }
# Pinned at 2.0.20 rather than 2.0.12 because `office-crypto` wants >= 2.0.17,
# and a patch bump of a derive macro is a cheaper way to get an encrypted
# workbook open than a second error crate.
thiserror = "=2.0.20"
tokio = { version = "=1.45.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# The sandbox gateway hands a request to the chosen business's router
# (`cloud::tenancy`); tests drive routers the same way.
tower = { version = "=0.5.2", features = ["util"] }
# `compression-gzip` is the till's catalog/price-book pulls (Phase 2.2):
# a 5,000-SKU JSON book is ~10:1 under gzip, and the desk pulls it whole.
tower-http = { version = "=0.6.6", features = ["cors", "fs", "trace", "compression-gzip"] }
tracing = "=0.1.41"
# Daily log files for an installed node, kept 14 days, one JSON object per
# line so a support bundle can be filtered by level and module without a
# parser of our own. See `edge/node.rs`.
tracing-appender = "=0.2.3"
# Disk and memory for the store server's console and heartbeat. Disk and
# system only: the defaults also pull in network, user and component probes
# a shop node never reports.
sysinfo = { version = "=0.39.6", default-features = false, features = ["disk", "system"] }
# The node says where it is on the shop's LAN (`edge/discovery.rs`): DNS-SD
# over multicast, `_itulah-store._tcp`, so a till, a tablet or a handheld finds
# it without an address typed. Its own thread and sockets, no runtime of its
# own. Default features kept (an async receiver and `log`, neither used): they
# are what `Cargo.lock` was resolved with, and a feature change here is a lock
# change nobody has built yet.
mdns-sd = "=0.21.4"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
uuid = { version = "=1.16.0", features = ["serde", "v4"] }

# The store server as a Windows service: the SCM entry point, and installing
# itself with restart-on-failure. Unix nodes are supervised by systemd and
# need nothing here.
[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.0"
# A USB UPS presents itself as a battery (`edge/power.rs`).
windows-sys = { version = "=0.61.2", features = ["Win32_System_Power", "Win32_Security_Cryptography", "Win32_Foundation"] }

[[test]]
name = "contract_types"
path = "tests/contract_types.rs"
required-features = ["ts"]

[dev-dependencies]
proptest = "=1.6.0"
# Decodes what the encoder produced, so the QR is proven readable by
# something that did not write it.
rqrr = "=0.10.1"
