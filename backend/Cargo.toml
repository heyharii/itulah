[workspace]
members = [".", "crates/inventory-time-machine", "crates/pricing-engine"]
default-members = ["."]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "inventory-backend"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[lib]
name = "inventory_backend"
path = "src/lib.rs"

[[bin]]
name = "cloud"
path = "src/bin/cloud.rs"

[[bin]]
name = "dc"
path = "src/bin/dc.rs"

[[bin]]
name = "store"
path = "src/bin/store.rs"

[lints]
workspace = true

[features]
# Emits TypeScript for the types the browser actually receives.
#
# Behind a feature so the shipping binary never carries a code generator, and
# so the generated files are refreshed by a deliberate act (`make contract`)
# rather than as a side effect of an ordinary build.
ts = ["dep:ts-rs"]

[dependencies]
inventory-time-machine = { path = "crates/inventory-time-machine" }
ts-rs = { version = "=12.0.1", optional = true, features = ["uuid-impl", "chrono-impl"] }
pricing-engine = { path = "crates/pricing-engine" }
async-trait = "=0.1.88"
argon2 = "=0.5.3"
axum = { version = "=0.8.4", features = ["json", "macros"] }
chrono = { version = "=0.4.41", features = ["serde"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
http = "=1.3.1"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
rusqlite = { version = "=0.32.1", features = ["bundled", "chrono"] }
rust_decimal = { version = "=1.37.1", features = ["serde-with-str"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal", "migrate"] }
thiserror = "=2.0.12"
tokio = { version = "=1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "=0.6.6", features = ["cors", "fs", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
uuid = { version = "=1.16.0", features = ["serde", "v4"] }

[[test]]
name = "contract_types"
path = "tests/contract_types.rs"
required-features = ["ts"]

[dev-dependencies]
proptest = "=1.6.0"
# Decodes what the encoder produced, so the QR is proven readable by
# something that did not write it.
rqrr = "=0.10.1"
tower = { version = "=0.5.2", features = ["util"] }
