<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Articles · workbench concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* Hub tokens (frontend-hub/src/styles/index.css, 28 Sep). Inter 14, title 17, controls 34, nothing under 14px. */
:root{--ink:#20242c;--text:#394150;--body:#626b78;--mute:#737c89;--faint:#b9c0c9;--line-ico:#89919d;--canvas:#fff;--soft:#f8f8f9;--soft-2:#f0f0f2;--soft-3:#f6f6f7;
  --hairline:#e6e6e9;--hairline-2:#dadade;--hairline-strong:#c6c6cc;--backdrop:#e0e0e4;--tooltip:#101012;--accent:#2563eb;--accent-bg:#eff5ff;--accent-bd:#bfd3fb;--info-fg:#2c57bf;
  --ok-fg:#15803d;--warn:#c9892e;--warn-bg:#faeacd;--warn-fg:#b45309;--r-shell:16px;--r-card:12px;--r-inner:7px;
  --shadow-soft:0 1px 3px rgb(24 39 60/4%);--shadow-pop:0 4px 8px rgb(24 39 60/4%),0 12px 32px rgb(24 39 60/8%);--shadow-shell:0 10px 34px rgb(24 39 60/8%);--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/20px Inter,system-ui,sans-serif;color:var(--text);background:var(--backdrop);-webkit-font-smoothing:antialiased;padding:16px 16px 80px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
mark{background:#fff3c4;color:inherit;border-radius:3px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.faint{color:var(--faint)}.warnc{color:var(--warn-fg)}.acc{color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:6px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chev{transition:transform .2s var(--ease)}.chev.open{transform:rotate(90deg)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);cursor:pointer}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgb(0 0 0/.14);flex:none}
.dots{display:inline-flex;gap:3px;align-items:center}
.nd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.stat{display:inline-flex;align-items:center;gap:6px;color:var(--mute)}.stat i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.kbd{border:1px solid var(--hairline-2);border-radius:5px;padding:0 6px;color:var(--mute);line-height:20px}

/* prototype chrome */
.top{max-width:96rem;margin:0 auto 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:600;color:var(--ink)}
.top p{color:var(--body);max-width:62rem}
.lenses{margin-left:auto;display:flex;gap:2px;background:var(--canvas);padding:3px;border-radius:999px;box-shadow:0 0 0 1px var(--hairline);flex-wrap:wrap}
.lens{border:0;background:none;border-radius:999px;padding:5px 14px;color:var(--body)}
.lens.on{background:var(--ink);color:#fff;font-weight:500}
.why{max-width:96rem;margin:14px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.why div{background:var(--canvas);border-radius:var(--r-card);padding:14px 16px;box-shadow:var(--shadow-soft)}
.why h5{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}.why p{color:var(--body)}

/* page */
.pane{max-width:96rem;margin:0 auto;background:var(--canvas);border-radius:var(--r-shell);box-shadow:var(--shadow-shell);padding:18px 22px 22px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.ph h2{font-size:17px;line-height:24px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.ph .sub{color:var(--body);margin-top:2px}
.ph .act{margin-left:auto;display:flex;gap:6px}
.btn{height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);color:var(--ink);font-weight:500;white-space:nowrap;transition:background .12s,transform .1s}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.pri:hover{background:#1d4ed8}
.btn.ghost{border-color:transparent;background:none;color:var(--body)}.btn.ghost:hover{background:var(--soft-2);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg.i{color:var(--line-ico)}.btn.pri svg.i{color:#fff}
.x{margin-left:auto}
.seg{display:inline-flex;background:var(--soft-2);border-radius:var(--r-inner);padding:3px;height:34px;flex:none}
.seg button{border:0;background:none;border-radius:5px;padding:0 10px;color:var(--body);white-space:nowrap}
.seg button.on{background:var(--canvas);color:var(--ink);font-weight:500;box-shadow:var(--shadow-soft)}
.seg button[disabled]{opacity:.4;pointer-events:none}
.seg.full{display:flex;height:auto}.seg.full button{flex:1;height:30px}
.big{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);box-shadow:var(--shadow-soft)}
.big:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.big input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;color:var(--ink)}
.big input::placeholder{color:var(--mute)}
.big svg.i{color:var(--line-ico)}
.newin{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 6px 0 14px;min-height:46px;border-radius:var(--r-inner);background:var(--accent-bg);color:var(--info-fg);flex-wrap:wrap}
.newin b{color:var(--ink);font-weight:600}
.newin .nact{margin-left:auto;display:flex;gap:6px;padding:6px 0}

/* rows */
.vl{overflow:auto;position:relative;flex:1;min-height:0;overscroll-behavior:contain}
.vl .vin{position:relative}.vl .it{position:absolute;left:0;right:0}
.lv{display:flex;flex-direction:column;min-height:0}
.row{display:flex;align-items:center;gap:12px;height:100%;padding:0 14px 0 10px;box-shadow:inset 0 -1px var(--hairline);cursor:pointer;min-width:0}
.row:hover{background:var(--soft)}
.row.cur{background:var(--accent-bg)}.row.sel{background:#f4f7ff}
.row .ck,.card .ck{width:20px;display:grid;place-items:center;opacity:0;flex:none}
.row:hover .ck,.anysel .row .ck,.card:hover .ck,.anysel .card .ck{opacity:1}
.row .tx,.card .tx,.lr .tx{min-width:0;flex:1;display:flex;flex-direction:column}
.row .tx b,.card .tx b,.lr .tx b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx>span,.card .tx>span,.lr .tx>span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column}
.row .end b{font-weight:400;color:var(--ink)}.row .end span{color:var(--mute)}
.row .szc{width:4.5rem;text-align:right;flex:none}
.row.dim .tx b,.card.dim .tx b,.trow.dim .nm b{color:var(--mute)}
.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{from{background:#dbe7ff}}
.chip{width:32px;height:32px;border-radius:var(--r-inner);flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0/.08);display:grid;place-items:center;overflow:hidden}
.chip.ph{background:var(--soft-2)}.chip.ph .gm{width:28px;height:28px}
.chip.big{width:64px;height:64px;border-radius:10px}.chip.big.ph .gm{width:56px;height:56px}
.chip.dl{background:var(--accent-bg);color:var(--accent);box-shadow:none}
.lhead{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 14px;border-bottom:1px solid var(--hairline);flex:none;min-width:0}
.lhead .cnt{white-space:nowrap}.lhead .cnt b{color:var(--ink);font-weight:600}
.lhead .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ssel{height:30px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);padding:0 8px;margin-left:auto}
.selbar{display:flex;align-items:center;gap:6px;height:48px;padding:0 8px 0 14px;background:var(--ink);color:#fff;flex:none;min-width:0;flex-wrap:nowrap;overflow:hidden}
.selbar b{font-weight:600;margin-right:4px;white-space:nowrap}
.selbar .btn{background:transparent;border-color:rgb(255 255 255/.22);color:#fff;height:30px}
.selbar .btn:hover{background:rgb(255 255 255/.1)}.selbar .btn svg.i{color:#fff}
.selbar .lnk{border:0;background:none;color:#9cc0ff;font-weight:500;padding:0 6px;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--body)}
.lr{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--hairline)}
.lr:last-child{border-bottom:0}
.lr.link{cursor:pointer}.lr.link:hover{background:var(--soft)}
.lr svg.i{color:var(--line-ico)}
.chk{display:inline-flex;gap:10px;color:var(--mute);white-space:nowrap}
.chk .okc{color:var(--ok-fg)}.chk .wc{color:var(--warn-fg)}
.box{border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;background:var(--canvas)}
.box.hi{border-color:var(--accent-bd)}
.box .bh{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 10px 0 14px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.box.hi .bh{background:var(--accent-bg)}
.box .bh b{color:var(--ink);font-weight:600}
.box .bh .r{margin-left:auto;display:flex;gap:6px}
.subh{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 4px 14px;color:var(--mute);font-weight:500}

/* A · folders & labels */
.a3{display:grid;grid-template-columns:15rem minmax(0,1fr) 27rem;border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;height:calc(100vh - 262px);min-height:30rem;margin-top:12px}
.a3.nodet{grid-template-columns:15rem minmax(0,1fr)}
.a3:not(.nodet) .row .szc{display:none}
.rail{overflow:auto;padding:8px;background:var(--soft-3);border-right:1px solid var(--hairline)}
.rail h6{font-size:14px;font-weight:500;color:var(--mute);padding:12px 10px 4px}
.rn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:6px;cursor:pointer;color:var(--text);white-space:nowrap;border:1px dashed transparent}
.rn .lb{overflow:hidden;text-overflow:ellipsis}
.rn:hover{background:var(--soft-2)}
.rn.on{background:var(--canvas);color:var(--ink);font-weight:500;box-shadow:var(--shadow-soft),0 0 0 1px var(--hairline)}
.rn .c{margin-left:auto;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums;padding-left:6px}
.rn .c.w{color:var(--warn-fg)}
.rn svg.i{color:var(--line-ico)}
.rn.nw .lb{color:var(--accent);font-weight:500}
.rn.add{color:var(--mute)}.rn.add:hover{color:var(--ink)}
.dragging .rn[data-drop]{border-color:var(--hairline-strong)}
.rn.dz,.dragging .rn.dz{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.railhint{margin:14px 4px 6px;padding:10px 12px;border-radius:8px;background:var(--canvas);box-shadow:0 0 0 1px var(--hairline);color:var(--body)}
.mid{display:flex;flex-direction:column;min-width:0;min-height:0}
.side{border-left:1px solid var(--hairline);overflow:auto;min-height:0}
.nib{overflow:auto;padding:12px;height:100%}
.ghost{position:fixed;top:-200px;left:-200px;background:var(--ink);color:#fff;padding:6px 14px;border-radius:999px;font-weight:500;white-space:nowrap}

/* detail */
.det .hd{display:flex;gap:12px;padding:16px;align-items:flex-start}
.det .hd h3{font-size:16px;line-height:22px;font-weight:600;color:var(--ink)}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--hairline)}
.tabs button{border:0;background:none;height:40px;padding:0 10px;color:var(--body);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.sec{padding:14px 16px;border-bottom:1px solid var(--hairline)}
.sec h4{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h4 .r{margin-left:auto;display:flex;gap:6px;font-weight:400}
.facts{display:grid;grid-template-columns:7rem 1fr;row-gap:8px}
.facts dt{color:var(--mute)}.facts dd{color:var(--ink);min-width:0}
.lnk2{border:0;background:none;color:var(--accent);font-weight:500;padding:0}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld>span{color:var(--body)}
.in,.sfld{height:36px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);padding:0 10px;background:var(--canvas);outline:0;width:100%;color:var(--ink)}
.in:focus,.sfld:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.in.ro{display:flex;align-items:center;color:var(--body);background:var(--soft)}
.in.pin{width:9rem;height:32px}
.checks{display:flex;flex-wrap:wrap;gap:2px 14px}
.checks label{display:flex;align-items:center;gap:6px;height:30px;white-space:nowrap}
.checks.col{display:grid;grid-template-columns:1fr 1fr}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{position:relative;width:36px;height:44px;border-radius:8px;border:1px solid var(--hairline);background:var(--canvas);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute)}
.slot i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgb(0 0 0/.12)}
.slot.free{border-style:dashed;color:var(--faint)}.slot.free:hover{border-color:var(--accent);color:var(--accent)}
.slot button{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;border:0;background:var(--ink);color:#fff;line-height:18px;display:none}
.slot:hover button{display:block}
.mxw{overflow-x:auto}
.mx{border-collapse:separate;border-spacing:0;width:100%}
.mx th,.mx td{height:38px;padding:0 6px;text-align:right;white-space:nowrap;box-shadow:inset 0 -1px var(--hairline)}
.mx th{color:var(--mute);font-weight:400;height:30px}
.mx th:first-child,.mx td:first-child{text-align:left;padding-left:0}
.mx td.z{color:var(--faint)}.mx td.un{color:var(--warn-fg)}.mx td.cx{color:var(--faint);text-decoration:line-through}
.mx td.hl{background:var(--accent-bg);color:var(--accent);font-weight:600}
.mx tr.rcx td{color:var(--faint)}
.mx tfoot td{color:var(--ink);font-weight:500;box-shadow:none}
.cw{display:flex;align-items:center;gap:8px;white-space:nowrap}
.dg{color:var(--mute)}
.rowmenu{border:0;background:none;color:var(--line-ico);width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
.rowmenu:hover{background:var(--soft-2);color:var(--ink)}
.note{padding:10px 12px;border-radius:var(--r-inner);background:var(--soft-2);color:var(--body)}
.note.w{background:var(--warn-bg);color:var(--warn-fg)}.note.a{background:var(--accent-bg);color:var(--info-fg)}
.prop{display:flex;align-items:baseline;gap:8px;color:var(--info-fg)}
.prop i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-2px)}

/* overlays */
.shade{position:fixed;inset:0;background:rgb(16 16 18/.16);z-index:30;animation:fade .2s}
.sheet{position:fixed;top:10px;right:10px;bottom:10px;width:30rem;max-width:calc(100vw - 20px);background:var(--canvas);border-radius:var(--r-shell);z-index:31;box-shadow:var(--shadow-pop);overflow:auto;animation:slide .25s var(--ease)}
.still{animation:none}
.scrim{position:fixed;inset:0;background:rgb(16 16 18/.24);z-index:50;display:grid;place-items:center;animation:fade .15s;padding:16px}
.dlg{width:32rem;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;background:var(--canvas);border-radius:var(--r-card);box-shadow:var(--shadow-pop);padding:20px;animation:pop .18s var(--ease)}
.dlg h3{font-size:16px;line-height:22px;font-weight:600;color:var(--ink);margin-bottom:4px}
.dlg .sub{color:var(--body);margin-bottom:12px}
.dlg .ft,.su .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.cons{display:flex;flex-direction:column;gap:6px;margin:10px 0 12px}
.cons div{display:flex;gap:8px;align-items:baseline}
.cons i{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none;transform:translateY(-2px)}
.cons .cin i{background:var(--accent)}.cons .cout i{background:var(--warn)}
.menu{position:fixed;z-index:60;min-width:14rem;max-height:22rem;overflow:auto;background:var(--canvas);border-radius:10px;box-shadow:var(--shadow-pop),0 0 0 1px var(--hairline);padding:4px;animation:pop .14s var(--ease)}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border:0;background:none;border-radius:6px;text-align:left;color:var(--text);white-space:nowrap}
.menu button:hover{background:var(--soft)}.menu button[disabled]{opacity:.4;cursor:default}
.menu button .c{margin-left:auto;color:var(--mute);padding-left:12px}
.menu hr{border:0;border-top:1px solid var(--hairline);margin:4px}
.menu h6{font-size:14px;font-weight:500;color:var(--mute);padding:6px 10px 2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:12px;background:var(--tooltip);color:#fff;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--shadow-pop);animation:rise .25s var(--ease);max-width:calc(100vw - 24px)}
.toast.plain{padding:9px 18px}
.toast button{border:0;background:rgb(255 255 255/.16);color:#fff;border-radius:999px;height:28px;padding:0 12px;font-weight:500}
.tray{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:12px;background:var(--canvas);border-radius:999px;box-shadow:var(--shadow-pop),0 0 0 1px var(--hairline);padding:6px 6px 6px 18px;animation:rise .25s var(--ease)}
.tray b{color:var(--ink);font-weight:600}.tray .btn{border-radius:999px}

/* setup */
.setup-shade{z-index:40}
.setup{width:min(74rem,calc(100vw - 20px));display:flex;flex-direction:column;overflow:hidden;z-index:41}
.su-hd{display:flex;align-items:center;gap:10px;height:56px;padding:0 12px 0 20px;border-bottom:1px solid var(--hairline);flex:none}
.su-hd b{font-size:15px;color:var(--ink);font-weight:600}
.su{display:grid;grid-template-columns:20rem minmax(0,1fr);min-height:0;flex:1}
.su-q{overflow:auto;border-right:1px solid var(--hairline);background:var(--soft-3);padding:6px}
.su-q .lr{border-radius:8px;border-bottom:0}
.su-q .lr.on{background:var(--canvas);box-shadow:0 0 0 1px var(--hairline),var(--shadow-soft)}
.su-f{overflow:auto;padding:18px 22px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.suh{font-size:15px;font-weight:600;color:var(--ink);margin:18px 0 10px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.szb{height:34px;min-width:46px;padding:0 10px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas)}
.szb.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.su .ft{position:sticky;bottom:0;background:var(--canvas);padding:12px 0 16px;border-top:1px solid var(--hairline)}

/* B · board */
.btools{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;min-height:34px}
.bsel{display:inline-flex;align-items:center;gap:6px}.bsel b{color:var(--ink);font-weight:600;margin-right:4px}
.board{display:flex;gap:12px;overflow-x:auto;margin-top:12px;padding-bottom:6px;height:calc(100vh - 318px);min-height:28rem}
.col{flex:0 0 17.5rem;display:flex;flex-direction:column;background:var(--soft-3);border-radius:var(--r-card);border:1px solid var(--hairline);min-height:0;transition:background .12s,border-color .12s}
.col.dz{border-color:var(--accent);background:var(--accent-bg)}
.col .hd{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;flex:none}
.col .hd b{color:var(--ink);font-weight:600}.col .hd .c{color:var(--mute)}
.col .hd .cm{margin-left:auto;padding:0 6px}
.col.new{background:var(--accent-bg);border-color:var(--accent-bd)}

.card.sel{box-shadow:0 0 0 2px var(--ink)}

.gl{display:flex;align-items:flex-end;height:100%;padding:0 6px 8px;color:var(--mute);font-weight:500}

.ctabs{display:flex;gap:2px;border-bottom:1px solid var(--hairline-2);margin-top:10px;overflow-x:auto}

.thead{height:40px;color:var(--mute);border-bottom:1px solid var(--hairline-2);flex:none}

.trow{height:100%;box-shadow:inset 0 -1px var(--hairline);cursor:pointer}
.trow:hover{background:var(--soft)}.trow.sel{background:#f4f7ff}
.trow .n,.thead .n{text-align:right;font-variant-numeric:tabular-nums}

.vrow .cellz{display:flex;gap:14px}.vrow .cellz b{font-weight:500;color:var(--mute);margin-right:5px}

.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.tagscroll{max-height:16rem;overflow:auto}

.spl{display:flex;flex-direction:column;min-height:0;flex:1}
.smid{display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center}
.smid .btn{justify-content:center}

@keyframes fade{from{opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(12px)}}

function nodePred(node){if(!node||node==='all')return()=>true;if(node==='new')return a=>a.created>=NEW_SINCE;const [t,x]=node.split(':');
  if(t==='div')return a=>a.div===x;if(t==='tag')return a=>a.tags.includes(x);if(t==='wl')return WL.find(w=>w[0]===x)[2];return()=>true}
const nodeLabel=node=>!node||node==='all'?'All articles':node==='new'?'New in':node.startsWith('div:')?divL(node.slice(4)):node.startsWith('tag:')?tagL(node.slice(4)):(WL.find(w=>'wl:'+w[0]===node)||[,node])[1];
function checks(a){return `<span class="chk"><span class="${a.price!=null?'okc':'wc'}">${a.price!=null?'✓':'!'} Price</span><span class="${a.unmade.size?'wc':'okc'}">${a.unmade.size?'!':'✓'} SKUs</span><span class="${a.sup?'okc':'wc'}">${a.sup?'✓':'!'} Supplier</span><span>${a.photo?'<span class="okc">✓ Photo</span>':'– Photo'}</span></span>`}

/* ---------- search ---------- */
function parseQ(){const q=S.q.trim();S.hl=null;if(!q)return null;
  if(/^\d{11}$/.test(q)){const a=ARTS[+q.slice(0,8)-20000001];if(a){const d=+q[8],s=+q.slice(9)-1;if(d<a.cols.length&&a.sizes.includes(s)&&cell(a,d,s)==='ok'){S.hl={i:a.i,d,s};return x=>x===a}}return()=>false}
  if(/^\d{3,8}$/.test(q))return a=>a.code.startsWith(q)||a.code.endsWith(q);
  const w=q.toLowerCase().split(/\s+/).filter(Boolean);return a=>w.every(t=>a.s.includes(t))}
const matched=()=>{const f=parseQ();return f?ARTS.filter(f):ARTS};

/* ---------- infrastructure: menus, dialogs, toasts ---------- */
function menu(anchor,items){setTimeout(()=>{closeMenu();const r=anchor.getBoundingClientRect();
  document.body.insertAdjacentHTML('beforeend',`<div class="menu" id="menu">${items.map((it,k)=>it==='-'?'<hr>':it.h?`<h6>${esc(it.h)}</h6>`:`<button data-k="${k}"${it.dis?' disabled':''}>${it.icon||''}<span>${esc(it.l)}</span>${it.c?`<span class="c">${esc(it.c)}</span>`:''}</button>`).join('')}</div>`);
  const m=$('#menu');let top=r.bottom+4,left=r.left;if(top+m.offsetHeight>innerHeight-8)top=Math.max(8,r.top-m.offsetHeight-4);if(left+m.offsetWidth>innerWidth-8)left=Math.max(8,innerWidth-m.offsetWidth-8);
  m.style.top=top+'px';m.style.left=left+'px';
  m.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b||b.disabled)return;const it=items[+b.dataset.k];closeMenu();it.f()})},0)}
function closeMenu(){$('#menu')?.remove()}
function modal(html){closeModal();document.body.insertAdjacentHTML('beforeend',`<div class="scrim" id="scrim"><div class="dlg" role="dialog">${html}</div></div>`);
  const s=$('#scrim');s.addEventListener('mousedown',e=>{if(e.target===s)closeModal()});const d=s.firstChild;
  setTimeout(()=>d.querySelector('input.in:not([type=checkbox]),select.sfld,button.pri')?.focus(),30);return d}
function closeModal(){$('#scrim')?.remove()}
let TT;function toast(m,undo){document.querySelectorAll('.toast').forEach(x=>x.remove());
  document.body.insertAdjacentHTML('beforeend',`<div class="toast${undo?'':' plain'}"><span>${esc(m)}</span>${undo?'<button id="undo">Undo</button>':''}</div>`);
  if(undo)$('#undo').onclick=()=>{document.querySelectorAll('.toast').forEach(x=>x.remove());undo()};
  clearTimeout(TT);TT=setTimeout(()=>document.querySelectorAll('.toast').forEach(x=>x.remove()),undo?7000:2800)}

/* ---------- filing: moving between divisions and tags ---------- */
const applyTags=(tags,ch)=>{let t=tags.filter(x=>!(ch.remove||[]).includes(x));for(const x of ch.add||[])if(!t.includes(x))t.push(x);return t};
const sameTags=(x,y)=>x.length===y.length&&x.every(v=>y.includes(v));
function consequences(arts,next){const out=[];const m=(p,st)=>p.t.div?st.div===p.t.div:st.tags.includes(p.t.tag);
  for(const p of PROMOS){let enter=0,leave=0;for(const a of arts){const b=m(p,a),c=m(p,next(a));if(b&&!c)leave++;else if(!b&&c)enter++}
    if(leave)out.push({k:'cout',t:`${pl(leave)} ${leave===1?'leaves':'leave'} ${p.n}`,w:p.w});if(enter)out.push({k:'cin',t:`${pl(enter)} ${enter===1?'enters':'enter'} ${p.n}`,w:p.w})}return out}
const consHtml=cons=>`<div class="cons">${cons.length?cons.map(c=>`<div class="${c.k}"><i></i><span>${esc(c.t)} <span class="mute">· ${esc(c.w)}</span></span></div>`).join(''):'<div><i></i><span class="mute">No promotion changes.</span></div>'}</div>`;
const T={move:to=>({title:c=>`Move ${pl(c)} to ${divL(to)}?`,done:c=>`Moved ${pl(c)} to ${divL(to)}`}),
  add:t=>({title:c=>`Tag ${pl(c)} “${tagL(t)}”?`,done:c=>`Tagged ${pl(c)} “${tagL(t)}”`}),
  remove:t=>({title:c=>`Remove “${tagL(t)}” from ${pl(c)}?`,done:c=>`Removed “${tagL(t)}” from ${pl(c)}`}),
  replace:(x,y)=>({title:c=>`Move ${pl(c)} from “${tagL(x)}” to “${tagL(y)}”?`,done:c=>`Moved ${pl(c)} from “${tagL(x)}” to “${tagL(y)}”`}),
  edit:a=>({title:()=>`Save changes to ${a.name}?`,done:()=>`Saved ${a.name}`})};
/* One confirm for every way of re-filing: it names what moves, what it touches, and offers Undo after. */
function change(ids,ch,t){
  const arts=ids.map(i=>ARTS[i]);
  const next=a=>({div:ch.div||a.div,tags:(ch.add||ch.remove)?applyTags(a.tags,ch):a.tags});
  const eff=arts.filter(a=>{const x=next(a);return x.div!==a.div||!sameTags(x.tags,a.tags)});
  if(!eff.length){toast(ids.length>1?'They are already there':'It is already there');return}
  const lines=[];
  if(ch.div){const from={};for(const a of eff)if(a.div!==ch.div)from[a.div]=(from[a.div]||0)+1;const f=Object.entries(from);if(f.length)lines.push('From '+f.sort((x,y)=>y[1]-x[1]).map(([dv,c])=>`${divL(dv)} ${n(c)}`).join(', '))}
  if(ch.remove?.length)lines.push('Loses '+ch.remove.map(x=>`“${tagL(x)}”`).join(', '));
  if(ch.add?.length)lines.push('Gets '+ch.add.map(x=>`“${tagL(x)}”`).join(', '));
  if(arts.length>eff.length)lines.push(`${n(arts.length-eff.length)} already there, left alone`);
  const title=t.title(eff.length);
  const d=modal(`<h3>${esc(title)}</h3><div class="sub">${esc(lines.join(' · '))}</div>${consHtml(consequences(eff,next))}
    <div class="note">Codes, SKUs and printed tags don’t change. Only how ${eff.length>1?'these articles are':'this article is'} filed, and it shows in each article’s history.</div>
    <div class="ft"><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="ok">${esc(title.replace(/\?$/,''))}</button></div>`);
  d.querySelector('#ok').onclick=()=>{const snap=eff.map(a=>[a,a.div,a.tags.slice()]);
    for(const a of eff){const x=next(a);a.div=x.div;a.tags=x.tags.slice();a.upd=TODAY;idx(a)}
    closeModal();S.sel.clear();flash(eff.map(a=>a.i));refresh();
    toast(t.done(eff.length),()=>{for(const [a,dv,tg] of snap){a.div=dv;a.tags=tg;idx(a)}refresh();toast('Undone')})};
}
function flash(ids){S.flash=new Set(ids);clearTimeout(flash.t);flash.t=setTimeout(()=>{S.flash=null},1700)}
function moveMenu(anchor,ids,apply){apply=apply||(to=>change(ids,{div:to},T.move(to)));
  const here={};for(const i of ids)here[ARTS[i].div]=(here[ARTS[i].div]||0)+1;
  menu(anchor,[{h:`Move ${pl(ids.length)} to`},...DIVS.map(d=>({l:d.l,icon:I.folder,c:here[d.c]?`${n(here[d.c])} there now`:'',f:()=>apply(d.c)})),'-',
    {l:'New division…',icon:I.plus,f:()=>addTerm('div',c=>{refresh();apply(c)},'',{norefresh:true})}])}
function tagsDialog(ids,apply,pre){
  apply=apply||((ch,t)=>change(ids,ch,t));
  const present={};for(const i of ids)for(const t of ARTS[i].tags)present[t]=(present[t]||0)+1;
  const pres=Object.entries(present).sort((x,y)=>y[1]-x[1]);
  let mode=pre?.mode||(pres.length?'replace':'add'),A=pre?.A||pres[0]?.[0],B=pre?.B||(TAGS.find(t=>!present[t.c])||TAGS[0]).c;
  const d=modal('');
  const draw=()=>{d.innerHTML=`<h3>Tags on ${pl(ids.length)}</h3><div class="sub">Tags are labels: an article can carry several, or none.</div>
    <div class="seg full" style="margin-bottom:14px">${[['add','Add a tag'],['remove','Remove a tag'],['replace','Move to another tag']].map(([m,l])=>`<button data-m="${m}" class="${mode===m?'on':''}"${m!=='add'&&!pres.length?' disabled':''}>${l}</button>`).join('')}</div>
    ${mode!=='add'?`<label class="fld"><span>${mode==='replace'?'From':'Remove'}</span><select class="sfld" id="ta">${pres.map(([t,c])=>`<option value="${t}"${t===A?' selected':''}>${esc(tagL(t))} · on ${n(c)}</option>`).join('')}</select></label>`:''}
    ${mode!=='remove'?`<label class="fld"><span>${mode==='replace'?'To':'Add'}</span><select class="sfld" id="tb">${TAGS.map(t=>`<option value="${t.c}"${t.c===B?' selected':''}>${esc(t.l)}</option>`).join('')}<option value="__new">+ New tag…</option></select></label>`:''}
    <div class="ft"><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="go">Continue</button></div>`;
    d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
    const ta=d.querySelector('#ta'),tb=d.querySelector('#tb');
    if(ta)ta.onchange=()=>A=ta.value;
    if(tb)tb.onchange=()=>{if(tb.value==='__new')addTerm('tag',c=>tagsDialog(ids,apply,{mode,A,B:c}),'',{norefresh:true});else B=tb.value};
    d.querySelector('#go').onclick=()=>{if(mode==='replace'&&A===B){toast('Pick two different tags');return}closeModal();
      if(mode==='add')apply({add:[B]},T.add(B));else if(mode==='remove')apply({remove:[A]},T.remove(A));else apply({add:[B],remove:[A]},T.replace(A,B))}};
  draw();
}
function cancelDialog(ids){const arts=ids.map(i=>ARTS[i]).filter(a=>a.act);if(!arts.length){toast('Already cancelled');return}
  const stock=arts.reduce((t,a)=>t+a.oh,0);
  const d=modal(`<h3>Cancel ${pl(arts.length)}?</h3><div class="sub">They can’t be ordered or set up again. What is already in the shops stays counted and can still be sold.</div>
    ${stock?`<div class="note w">${n(stock)} pieces are still on hand across all sites.</div>`:''}<div class="ft"><button class="btn ghost" data-close>Keep them</button><button class="btn pri" id="ok">Cancel ${pl(arts.length)}</button></div>`);
  d.querySelector('#ok').onclick=()=>{arts.forEach(a=>{a.act=false;a.upd=TODAY});closeModal();S.sel.clear();refresh();
    toast(`Cancelled ${pl(arts.length)}`,()=>{arts.forEach(a=>a.act=true);refresh();toast('Undone')})}}
/* New division or tag: same rules as Articles › Divisions / Tags in the hub (code fixed, retire not delete). */
function addTerm(kind,cb,preset='',opt={}){
  const word=kind==='div'?'division':'tag';
  const d=modal(`<h3>New ${word}</h3><div class="sub">${kind==='div'?'Every article is filed under exactly one division.':'An article can carry several tags, or none.'}</div>
    <label class="fld"><span>Name</span><input class="in" id="tl" value="${esc(preset)}" placeholder="${kind==='div'?'e.g. Unisex':'e.g. Ramadan 2027'}"></label>
    <label class="fld"><span>Code</span><input class="in mono" id="tc" placeholder="${kind==='div'?'UNISEX':'RAMADAN_2027'}"></label>
    <div class="note">Articles point at the code, so it can’t change after this. The name can. Once used, a ${word} can be retired but never deleted.</div>
    <div class="ft"><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="termgo">Create ${word}</button></div>`);
  const tl=d.querySelector('#tl'),tc=d.querySelector('#tc');let touched=false;
  const slug=s=>s.toUpperCase().normalize('NFKD').replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,24);
  if(preset)tc.value=slug(preset);
  tl.oninput=()=>{if(!touched)tc.value=slug(tl.value)};tc.oninput=()=>{touched=true;tc.value=slug(tc.value)};
  const go=()=>{const l=tl.value.trim(),c=tc.value.trim();if(!l||!c){tl.focus();return}const list=kind==='div'?DIVS:TAGS;
    if(list.some(x=>x.c===c)){toast(`${c} already exists`);return}list.push({c,l});closeModal();if(!opt.norefresh)refresh();
    toast(`${kind==='div'?'Division':'Tag'} “${l}” created`);cb&&cb(c)};
  d.querySelector('#termgo').onclick=go;tl.onkeydown=tc.onkeydown=e=>{if(e.key==='Enter')go()};
}

  return `<div class="nib"><div class="box hi"><div class="bh"><i class="nd"></i><b>Waiting for setup</b><span class="mute">${QUEUE.length} deliveries arrived without an article</span>${QUEUE.length?`<span class="r"><button class="btn sm pri" data-setup="0">Set up next</button></span>`:''}</div>
    ${QUEUE.map(qRow).join('')||'<div class="lr mute">Nothing waiting.</div>'}</div>
    <div class="box" style="margin-top:12px"><div class="bh"><b>Set up in the last 7 days</b><span class="mute">${n(rec.length)} articles · check each once</span></div>
    ${rec.slice(0,80).map(a=>`<div class="lr link${S.flash&&S.flash.has(a.i)?' flash':''}" data-i="${a.i}">${chip(a)}<span class="tx"><b>${hi(a.name)}</b><span><span class="mono">${a.code}</span> · ${esc(divL(a.div))} · ${a.skus} SKUs</span></span>${checks(a)}</div>`).join('')}</div></div>`}

/* ---------- A · folders & labels ---------- */
function viewA(p){
  const base=matched(),cnt=f=>{let k=0;for(const a of base)if(f(a))k++;return k};
  const rn=(node,icon,label,c,cls,drop)=>`<div class="rn${S.node===node?' on':''}${cls?' '+cls:''}" data-node="${node}"${drop?` data-drop="${drop}"`:''}>${icon}<span class="lb">${esc(label)}</span>${c!=null?`<span class="c${cls==='w'&&c?' w':''}">${n(c)}</span>`:''}</div>`;
  let rail=rn('all',I.list,'All articles',base.length)+rn('new','<i class="nd"></i>','New in',QUEUE.length+recent().length,'nw');
  rail+='<h6>Divisions</h6>'+DIVS.map(d=>rn('div:'+d.c,I.folder,d.l,cnt(a=>a.div===d.c),'','div:'+d.c)).join('')+`<div class="rn add" data-add="div">${I.plus}<span class="lb">New division</span></div>`;
  rail+='<h6>Tags</h6>'+TAGS.map(t=>rn('tag:'+t.c,I.tag,t.l,cnt(a=>a.tags.includes(t.c)),'','tag:'+t.c)).join('')+`<div class="rn add" data-add="tag">${I.plus}<span class="lb">New tag</span></div>`;
  rail+='<h6>Needs attention</h6>'+WL.map(([k,l,f])=>rn('wl:'+k,I.alert,l,cnt(f),k==='cancelled'?'':'w')).join('');
  const inTag=S.node.startsWith('tag:');
  rail+=`<div class="railhint">Drag articles onto a division to move them there, or onto a tag to tag them.${inTag?` You are in “${esc(tagL(S.node.slice(4)))}”: dropping on another tag moves them there. Hold ⌥ to keep both.`:''}</div>`;
  const det=S.cur!=null;
  p.innerHTML=`${newinBand()}<div class="a3${det?'':' nodet'}"><nav class="rail">${rail}</nav><section class="mid" id="mid"></section>${det?`<aside class="side" id="side">${detailHtml(ARTS[S.cur],true)}</aside>`:''}</div>`;
  p.querySelectorAll('[data-node]').forEach(el=>el.onclick=()=>{S.node=el.dataset.node;S.sel.clear();S.cur=null;render()});
  p.querySelectorAll('[data-go-new]').forEach(el=>el.onclick=()=>{S.node='new';S.sel.clear();render()});
  const mid=$('#mid');
  if(S.node==='new'){mid.innerHTML=newInHtml();mid.onclick=e=>{const r=e.target.closest('[data-i]');if(r&&!e.target.closest('[data-setup]'))openArticle(ARTS[+r.dataset.i])}}
  else listView(mid,base.filter(nodePred(S.node)).sort(SORTS[S.sort]),{key:`A|${S.node}|${S.q}|${S.sort}`,drag:true,from:inTag?S.node:'',
    label:S.node==='all'?'articles':`in ${nodeLabel(S.node)}`,open:a=>{S.cur=S.cur===a.i?null:a.i;S.dtab='overview';S.editing=false;render()}});
  if(det)bindDetail($('#side'),ARTS[S.cur]);
}

/* ---------- B · board: a column per division (or per tag) ---------- */
function cardHtml(r,c){if(r.t==='gl')return `<div class="gl">${esc(r.l)}</div>`;
  if(r.t==='q')return `<div class="card q"><span class="chip dl">${I.box}</span><span class="tx"><b>${esc(titleCase(r.q.desc))}</b><span>${esc(r.q.sup)} · ${n(r.q.qty)} pcs</span></span><button class="btn sm pri" data-setup="${r.k}">Set up</button></div>`;
  const a=r.a,sel=S.sel.has(a.i);
  return `<div class="card${sel?' sel':''}${a.act?'':' dim'}${S.flash&&S.flash.has(a.i)?' flash':''}" data-i="${a.i}" draggable="true" data-drag="${a.i}" data-from="${c.from||''}">
    <span class="ck"><input type="checkbox" tabindex="-1"${sel?' checked':''}></span>${chip(a)}<span class="tx"><b>${hi(a.name)}</b><span><span class="mono">${a.code}</span> · ${sizeSpan(a)}</span></span></div>`}
function viewB(p){
  const base=matched(),byTag=S.bgroup==='tag',sel=S.sel.size,cols=[];
  p.innerHTML=`${newinBand()}<div class="btools"><span class="seg"><button data-g="div" class="${byTag?'':'on'}">By division</button><button data-g="tag" class="${byTag?'on':''}">By tag</button></span>
    ${sel?`<span class="bsel"><b>${n(sel)} selected</b><button class="btn sm" data-act="move">${I.folder}Move to…</button><button class="btn sm" data-act="tags">${I.tag}Tags…</button><button class="btn sm ghost" data-act="clear">Clear</button><span class="mute">or drag them to a column</span></span>`
      :`<span class="mute">${byTag?'Drag a card from one tag to another to move it there. Hold ⌥ while dropping to keep both tags.':'Drag a card to another column to move it. Tick several to move them together.'}</span>`}</div>
    <div class="board${sel?' anysel':''}" id="board"></div>`;
  if(!byTag){const f=parseQ(),rec=recent().filter(a=>!f||f(a));
    cols.push({id:'new',label:'New in',cls:'new',count:QUEUE.length+rec.length,rows:[{t:'gl',l:`Waiting for setup · ${QUEUE.length}`},...QUEUE.map((q,k)=>({t:'q',q,k})),{t:'gl',l:`Set up in the last 7 days · ${n(rec.length)}`},...rec.map(a=>({t:'a',a}))],ids:rec});
    for(const d of DIVS){const arts=base.filter(a=>a.div===d.c).sort(SORTS.new);cols.push({id:'div:'+d.c,label:d.l,drop:'div:'+d.c,count:arts.length,rows:arts.map(a=>({t:'a',a})),ids:arts})}}
  else for(const t of TAGS){const arts=base.filter(a=>a.tags.includes(t.c)).sort(SORTS.new);cols.push({id:'tag:'+t.c,label:t.l,drop:'tag:'+t.c,from:'tag:'+t.c,count:arts.length,rows:arts.map(a=>({t:'a',a})),ids:arts})}
  const board=$('#board');
  board.innerHTML=cols.map((c,k)=>`<div class="col${c.cls?' '+c.cls:''}"${c.drop?` data-drop="${c.drop}"`:''}><div class="hd">${c.cls?'<i class="nd"></i>':''}<b>${esc(c.label)}</b><span class="c">${n(c.count)}</span><button class="btn ghost sm cm" data-cm="${k}" title="Column">${I.more}</button></div><div class="vl" data-col="${k}"></div></div>`).join('')
    +`<div class="col add" data-add="${byTag?'tag':'div'}">${I.plus}<span>New ${byTag?'tag':'division'}</span></div>`;
  cols.forEach((c,k)=>{const el=board.querySelector(`[data-col="${k}"]`);vlist(el,`B|${S.bgroup}|${c.id}|${S.q}`,c.rows,64,r=>cardHtml(r,c));
    el.addEventListener('click',e=>{const r=e.target.closest('[data-i]');if(!r)return;const i=+r.dataset.i;
      if(e.target.closest('.ck')||e.shiftKey||e.metaKey||e.ctrlKey){e.preventDefault();toggleSel(i,e.shiftKey,c.ids);refresh();return}openSheet(ARTS[i])})});
  board.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{const c=cols[+b.dataset.cm];
    menu(b,[{h:`${c.label} · ${n(c.ids.length)}`},{l:`Select all ${n(c.ids.length)}`,f:()=>{c.ids.forEach(a=>S.sel.add(a.i));refresh()}},{l:`Move all ${n(c.ids.length)} to…`,f:()=>moveMenu(b,c.ids.map(a=>a.i))}])});
  p.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.bgroup=b.dataset.g;S.sel.clear();render()});
  p.querySelectorAll('.btools [data-act]').forEach(b=>b.onclick=()=>bulk(b.dataset.act,b));
  p.querySelectorAll('[data-go-new]').forEach(b=>b.onclick=()=>{if(byTag){S.bgroup='div';render()}$('#board').scrollLeft=0});
}


/* ---------- C · sheet: editable cells, changes staged, reviewed together ---------- */
const CCOLS='40px 48px minmax(11rem,1fr) 7.25rem 9.5rem 12rem 6.5rem 6rem 4.75rem 8rem 44px';
function stage(ids,fn){for(const i of ids){const a=ARTS[i],p=S.pend.get(i)||{},cur={div:p.div??a.div,tags:(p.tags??a.tags).slice()},x=fn(a,cur),np={};
    if(x.div!==a.div)np.div=x.div;if(!sameTags(x.tags,a.tags))np.tags=x.tags;if(np.div||np.tags)S.pend.set(i,np);else S.pend.delete(i)}
  S.sel.clear();refresh();toast(`${pl(ids.length)} changed. Nothing is saved until Review & save.`)}
function tagCell(i,pre){const a=ARTS[i],p=S.pend.get(i)||{};let cur=pre||(p.tags??a.tags).slice();
  const d=modal(`<h3>Tags on ${esc(a.name)}</h3><div class="sub">Tick any number.</div><div class="checks col">${TAGS.map(t=>`<label><input type="checkbox" data-t2="${t.c}"${cur.includes(t.c)?' checked':''}>${esc(t.l)}</label>`).join('')}</div>
    <button class="btn ghost sm" id="nt" style="margin-top:6px">${I.plus}New tag</button><div class="ft"><button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="ok">Done</button></div>`);
  d.querySelectorAll('[data-t2]').forEach(c=>c.onchange=()=>{const v=c.dataset.t2;cur=c.checked?[...cur,v]:cur.filter(x=>x!==v)});
  d.querySelector('#nt').onclick=()=>addTerm('tag',c=>tagCell(i,[...cur,c]),'',{norefresh:true});
  d.querySelector('#ok').onclick=()=>{closeModal();stage([i],(a,c)=>({...c,tags:cur}))}}
function reviewPending(){const ids=[...S.pend.keys()],arts=ids.map(i=>ARTS[i]),next=a=>{const p=S.pend.get(a.i);return{div:p.div??a.div,tags:p.tags??a.tags}};
  const dm={},ta={},tr={};for(const a of arts){const x=next(a);if(x.div!==a.div){const k=`${divL(a.div)} → ${divL(x.div)}`;dm[k]=(dm[k]||0)+1}
    for(const t of x.tags)if(!a.tags.includes(t))ta[t]=(ta[t]||0)+1;for(const t of a.tags)if(!x.tags.includes(t))tr[t]=(tr[t]||0)+1}
  const lines=[...Object.entries(dm).map(([k,c])=>`${k}: ${pl(c)}`),...Object.entries(ta).map(([t,c])=>`“${tagL(t)}” added to ${pl(c)}`),...Object.entries(tr).map(([t,c])=>`“${tagL(t)}” removed from ${pl(c)}`)];
  const d=modal(`<h3>Save changes to ${pl(ids.length)}?</h3><div class="cons">${lines.map(l=>`<div><i></i><span>${esc(l)}</span></div>`).join('')}</div>
    <h4 class="suh" style="margin:14px 0 4px">Promotions</h4>${consHtml(consequences(arts,next))}<div class="note">Codes, SKUs and printed tags don’t change.</div>
    <div class="ft"><button class="btn ghost" data-close>Keep editing</button><button class="btn pri" id="ok">Save ${pl(ids.length)}</button></div>`);
  d.querySelector('#ok').onclick=()=>{const snap=arts.map(a=>[a,a.div,a.tags.slice()]);for(const a of arts){const x=next(a);a.div=x.div;a.tags=x.tags.slice();a.upd=TODAY;idx(a)}
    S.pend.clear();closeModal();flash(ids);refresh();toast(`Saved ${pl(ids.length)}`,()=>{for(const [a,dv,tg] of snap){a.div=dv;a.tags=tg;idx(a)}refresh();toast('Undone')})}}
function trayC(){document.querySelectorAll('.tray').forEach(x=>x.remove());if(S.c!=='C'||!S.pend.size)return;
  let ch=0;for(const p of S.pend.values())ch+=(p.div?1:0)+(p.tags?1:0);
  document.body.insertAdjacentHTML('beforeend',`<div class="tray"><span><b>${n(ch)} change${ch>1?'s':''}</b> <span class="mute">on ${pl(S.pend.size)}</span></span><button class="btn ghost" id="tdisc">Discard</button><button class="btn pri" id="trev">Review & save</button></div>`);
  $('#tdisc').onclick=()=>{S.pend.clear();refresh()};$('#trev').onclick=reviewPending}
function crow(r){
  if(r.t==='h')return `<div class="grow static">${esc(r.l)}</div>`;
  if(r.t==='g')return `<div class="grow" data-gk="${r.d.c}" data-drop="div:${r.d.c}">${chevOpen(!S.collapsed.has(r.d.c))}<span>${esc(r.d.l)}</span><span class="mute" style="font-weight:400">${n(r.c)}</span></div>`;
  if(r.t==='q')return `<div class="qrow"><span class="chip dl">${I.box}</span><span class="tx" style="flex:1;min-width:0;display:flex;flex-direction:column"><b style="font-weight:500;color:var(--ink)">${esc(titleCase(r.q.desc))}</b><span class="mute">${esc(r.q.sup)} · ${r.q.po} · ${n(r.q.qty)} pcs · arrived ${r.q.arrived}</span></span><button class="btn sm pri" data-setup="${r.k}">Set up</button></div>`;
  if(r.t==='v'){const a=r.a,d=r.d,c=COLOURS[a.cols[d]];return `<div class="vrow"><span class="cw" style="width:9rem">${dotHtml(c[1])}${c[0]} <span class="dg mono">${d}</span></span><span class="cellz">${a.sizes.map(s=>{const st=cell(a,d,s);
      return `<span><b>${SIZE_ALL[s]}</b>${st==='ok'?n(oh(a,d,s)):st==='un'?'<span class="warnc">not made</span>':'<span class="faint">cancelled</span>'}</span>`}).join('')}</span></div>`}
  if(r.t==='va')return `<div class="vrow"><button class="btn sm" data-vopen="${r.a.i}">Open colours and sizes</button><span class="mute">Add or cancel a colour or size there.</span></div>`;
  const a=r.a,p=S.pend.get(a.i)||{},sel=S.sel.has(a.i),dv=p.div??a.div,tg=p.tags??a.tags;
  return `<div class="trow${sel?' sel':''}${a.act?'':' dim'}${S.flash&&S.flash.has(a.i)?' flash':''}" data-i="${a.i}" draggable="true" data-drag="${a.i}">
    <span><input type="checkbox" class="ck" tabindex="-1"${sel?' checked':''}></span><span>${chip(a)}</span><span class="nm"><b>${hi(a.name)}</b></span><span class="mono mute">${a.code}</span>
    <span><button class="cellbtn${p.div?' dirty':''}" data-cdiv="${a.i}"><span>${esc(divL(dv))}</span>${I.down}</button></span>
    <span><button class="cellbtn${p.tags?' dirty':''}" data-ctag="${a.i}"><span>${tg.length?esc(tg.map(tagL).join(', ')):'<span class="faint">None</span>'}</span>${I.down}</button></span>
    <span>${dotsHtml(a)}</span><span>${sizeSpan(a)}</span><span class="n">${a.unmade.size?`<span class="warnc" title="${a.unmade.size} not made">${a.skus}/${a.skus+a.unmade.size}</span>`:n(a.skus)}</span>
    <span class="n">${money(a)}</span><span><button class="rowmenu" data-exp="${a.i}" title="Colours × sizes">${chevOpen(S.exp.has(a.i))}</button></span></div>`}
function viewC(p){
  const base=matched(),f=parseQ(),rec=recent().filter(a=>!f||f(a)),attn=base.filter(a=>issues(a).length),sel=S.sel.size;
  const rows=[],pushA=a=>{rows.push({t:'a',a});if(S.exp.has(a.i)){a.cols.forEach((_,d)=>rows.push({t:'v',a,d}));rows.push({t:'va',a})}};let arts;
  if(S.ctab==='new'){rows.push({t:'h',l:`Waiting for setup · ${QUEUE.length} deliveries`});QUEUE.forEach((q,k)=>rows.push({t:'q',q,k}));rows.push({t:'h',l:`Set up in the last 7 days · ${n(rec.length)}`});arts=rec;rec.forEach(pushA)}
  else{arts=(S.ctab==='attn'?attn:base).slice().sort(SORTS[S.sort]);
    if(S.cgroup==='div'){for(const d of DIVS){const g=arts.filter(a=>a.div===d.c);if(!g.length)continue;rows.push({t:'g',d,c:g.length});if(!S.collapsed.has(d.c))g.forEach(pushA)}}else arts.forEach(pushA)}
  p.innerHTML=`<div class="ctabs"><button data-ct="all" class="${S.ctab==='all'?'on':''}">All <span>${n(base.length)}</span></button>
      <button data-ct="new" class="${S.ctab==='new'?'on':''}"><i class="nd"></i>New in <span>${QUEUE.length} to set up · ${n(rec.length)} new</span></button>
      <button data-ct="attn" class="${S.ctab==='attn'?'on':''}">Needs attention <span>${n(attn.length)}</span></button></div>
    <div class="ctools">${sel?`<div class="selbar"><b>${n(sel)} selected</b>${sel<arts.length?`<button class="lnk" data-cselall>Select all ${n(arts.length)}</button>`:''}<button class="btn" data-cact="div">${I.folder}Set division…</button><button class="btn" data-cact="tags">${I.tag}Tags…</button><button class="btn x" data-cact="clear">${I.x}</button></div>`
      :`<span class="seg"><button data-cg="div" class="${S.cgroup==='div'?'on':''}">Group by division</button><button data-cg="none" class="${S.cgroup==='none'?'on':''}">No grouping</button></span>
        <span class="mute">Click a Division or Tags cell to change it, or drag rows onto a division. Changes wait until Review & save.</span>
        <select class="ssel" data-sort>${[['new','Newest'],['name','Name A–Z'],['price','Price, high first'],['oh','Most on hand']].map(([v,l])=>`<option value="${v}"${S.sort===v?' selected':''}>${l}</option>`).join('')}</select>`}</div>
    <div class="cwrap" style="--cols:${CCOLS}"><div class="thead"><span><input type="checkbox" data-csel title="Select all"></span><span></span><span>Name</span><span>Code</span><span>Division</span><span>Tags</span><span>Colours</span><span>Sizes</span><span class="n">SKUs</span><span class="n">Price</span><span></span></div><div class="vl" id="cvl"></div></div>`;
  const vl=$('#cvl');vlist(vl,`C|${S.ctab}|${S.cgroup}|${S.q}|${S.sort}`,rows,48,crow);
  vl.addEventListener('click',e=>{const t=e.target;
    const cd=t.closest('[data-cdiv]');if(cd){const i=+cd.dataset.cdiv;moveMenu(cd,[i],to=>stage([i],(a,c)=>({...c,div:to})));return}
    const ct=t.closest('[data-ctag]');if(ct){tagCell(+ct.dataset.ctag);return}
    const ex=t.closest('[data-exp]');if(ex){const i=+ex.dataset.exp;S.exp.has(i)?S.exp.delete(i):S.exp.add(i);refresh();return}
    const vo=t.closest('[data-vopen]');if(vo){openSheet(ARTS[+vo.dataset.vopen],'variants');return}
    const g=t.closest('[data-gk]');if(g){const k=g.dataset.gk;S.collapsed.has(k)?S.collapsed.delete(k):S.collapsed.add(k);refresh();return}
    const r=t.closest('[data-i]');if(!r)return;const i=+r.dataset.i;
    if(t.closest('.ck')||e.shiftKey||e.metaKey||e.ctrlKey){e.preventDefault();toggleSel(i,e.shiftKey,arts);refresh();return}openSheet(ARTS[i])});
  p.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{S.ctab=b.dataset.ct;S.sel.clear();render()});
  p.querySelectorAll('[data-cg]').forEach(b=>b.onclick=()=>{S.cgroup=b.dataset.cg;render()});
  p.querySelector('[data-sort]')?.addEventListener('change',e=>{S.sort=e.target.value;refresh()});
  p.querySelectorAll('[data-csel],[data-cselall]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();if(S.sel.size>=arts.length)S.sel.clear();else arts.forEach(a=>S.sel.add(a.i));refresh()}));
  p.querySelectorAll('[data-cact]').forEach(b=>b.onclick=()=>{const ids=[...S.sel],k=b.dataset.cact;
    if(k==='clear'){S.sel.clear();refresh()}else if(k==='div')moveMenu(b,ids,to=>stage(ids,(a,c)=>({...c,div:to})));
    else tagsDialog(ids,ch=>stage(ids,(a,c)=>({...c,tags:applyTags(c.tags,ch)})))});
}

/* ---------- D · to-do first, with Reorganise for moving many ---------- */
function viewD(p){
  if(S.dview==='sorter')return sorterView(p);
  const back=`<button class="btn ghost" data-dhome>${I.back}Back</button>`;
  const bindBack=()=>p.querySelector('[data-dhome]')?.addEventListener('click',()=>{S.dview='home';S.sel.clear();render()});
  if(S.q.trim()){const arts=matched().sort(SORTS[S.sort]);p.innerHTML=`<div class="dlist" id="dl"></div>`;
    listView($('#dl'),arts,{key:`D|q|${S.q}|${S.sort}`,label:'articles match',open:a=>openSheet(a)});return}
  if(S.dview.startsWith('list:')){const node=S.dview.slice(5),arts=ARTS.filter(nodePred(node)).sort(node==='new'?SORTS.new:SORTS[S.sort]),wl=node==='wl:noprice';
    p.innerHTML=`<div class="crumbs">${back}<b>${esc(nodeLabel(node))}</b><span class="mute">${n(arts.length)} articles${wl?' · type a price and press Enter, it leaves the list':''}</span></div><div class="dlist" id="dl"></div>`;
    listView($('#dl'),arts,{key:`D|${node}|${S.sort}`,label:'articles',open:a=>openSheet(a),nosort:node==='new',
      end:wl?(a=>`<input class="in pin num" data-price="${a.i}" placeholder="Set price" inputmode="numeric">`):node==='new'?checks:null});
    bindBack();return}
  const rec=recent();
  p.innerHTML=`<div class="dgrid"><div class="box hi"><div class="bh"><i class="nd"></i><b>New in</b><span class="mute">${QUEUE.length} to set up · ${n(rec.length)} set up in the last 7 days</span>${QUEUE.length?`<span class="r"><button class="btn sm pri" data-setup="0">Set up next</button></span>`:''}</div>
      <div class="subh">Waiting for setup</div>${QUEUE.slice(0,5).map(qRow).join('')||'<div class="lr mute">Every delivery has an article.</div>'}
      ${QUEUE.length>5?`<div class="lr link" data-setup="0"><span class="acc">All ${QUEUE.length} deliveries ${I.arrow}</span></div>`:''}
      <div class="subh">Set up in the last 7 days · check each once</div>
      ${rec.slice(0,6).map(a=>`<div class="lr link${S.flash&&S.flash.has(a.i)?' flash':''}" data-i="${a.i}">${chip(a)}<span class="tx"><b>${esc(a.name)}</b><span><span class="mono">${a.code}</span> · ${esc(divL(a.div))} · ${a.skus} SKUs</span></span>${checks(a)}</div>`).join('')}
      <div class="lr link" data-dv="list:new"><span class="acc">Review all ${n(rec.length)} ${I.arrow}</span></div></div>
    <div><div class="box"><div class="bh"><b>Needs attention</b></div>${WL.filter(w=>w[0]!=='cancelled').map(([k,l,f])=>`<div class="lr link" data-dv="list:wl:${k}">${I.alert}<span class="tx"><b>${l}</b></span><span class="warnc num">${n(ARTS.filter(f).length)}</span><span class="acc">Fix ${I.arrow}</span></div>`).join('')}</div>
      <div class="box" style="margin-top:12px"><div class="bh"><b>Organise</b><span class="r"><button class="btn sm" data-dv="sorter">Reorganise ${I.arrow}</button></span></div>
        <div class="subh">Divisions<button class="btn ghost sm" data-add="div">${I.plus}New</button></div>
        ${DIVS.map(d=>`<div class="lr link" data-dv="list:div:${d.c}">${I.folder}<span class="tx"><b>${esc(d.l)}</b></span><span class="mute num">${n(ARTS.filter(a=>a.div===d.c).length)}</span></div>`).join('')}
        <div class="subh">Tags<button class="btn ghost sm" data-add="tag">${I.plus}New</button></div>
        <div class="tagscroll">${TAGS.map(t=>`<div class="lr link" data-dv="list:tag:${t.c}">${I.tag}<span class="tx"><b>${esc(t.l)}</b></span><span class="mute num">${n(ARTS.filter(a=>a.tags.includes(t.c)).length)}</span></div>`).join('')}</div>
        <div class="lr link" data-dv="list:all"><span class="acc">Browse all ${n(ARTS.length)} articles ${I.arrow}</span></div></div></div></div>`;
  p.onclick=e=>{if(e.target.closest('[data-setup],[data-add]'))return;const dv=e.target.closest('[data-dv]');if(dv){S.dview=dv.dataset.dv;S.sel.clear();render();return}
    const r=e.target.closest('[data-i]');if(r)openSheet(ARTS[+r.dataset.i])};
}
function sorterView(p){
  const f=parseQ(),srcTag=S.src.startsWith('tag:')?S.src.slice(4):null,dk=S.dst.split(':')[0],k=S.sel.size;
  const src=ARTS.filter(nodePred(S.src)).filter(a=>!f||f(a)).sort(SORTS.new);
  const dst=ARTS.filter(nodePred(S.dst)).sort((x,y)=>((S.flash&&S.flash.has(y.i))?1:0)-((S.flash&&S.flash.has(x.i))?1:0)||y.i-x.i);
  const opts=(val,extra)=>`<optgroup label="Divisions">${DIVS.map(d=>`<option value="div:${d.c}"${val==='div:'+d.c?' selected':''}>${esc(d.l)}</option>`).join('')}</optgroup>
    <optgroup label="Tags">${TAGS.map(t=>`<option value="tag:${t.c}"${val==='tag:'+t.c?' selected':''}>${esc(t.l)}</option>`).join('')}</optgroup>${extra}`;
  p.innerHTML=`<div class="crumbs"><button class="btn ghost" data-dhome>${I.back}Back</button><b>Reorganise</b><span class="mute">Tick on the left, send to the right. The search above narrows the left list.</span></div>
    <div class="sorter"><div class="sp"><div class="sh"><span class="mute">From</span><select class="sfld" id="ssrc">${opts(S.src,`<optgroup label="Other"><option value="all"${S.src==='all'?' selected':''}>All articles</option><option value="new"${S.src==='new'?' selected':''}>New in (7 days)</option></optgroup>`)}</select></div><div class="spl" id="spl"></div></div>
    <div class="smid">${dk==='div'?`<button class="btn pri" data-sgo="move"${k?'':' disabled'}>Move ${k?n(k)+' ':''}${I.arrow}</button>`
        :`<button class="btn pri" data-sgo="add"${k?'':' disabled'}>Tag ${k?n(k)+' ':''}${I.arrow}</button>${srcTag&&srcTag!==S.dst.slice(4)?`<button class="btn" data-sgo="replace"${k?'':' disabled'}>Move from “${esc(tagL(srcTag))}”</button>`:''}`}
      <span class="mute">${k?`${n(k)} ticked`:'Tick articles on the left'}</span></div>
    <div class="sp"><div class="sh"><span class="mute">To</span><select class="sfld" id="sdst">${opts(S.dst,'<option value="__nd">+ New division…</option><option value="__nt">+ New tag…</option>')}</select></div><div class="spl" id="spr"></div></div></div>`;
  listView($('#spl'),src,{key:`S|${S.src}|${S.q}`,simple:true,nosort:true,label:'articles',open:a=>openSheet(a),
    end:a=>`<span class="mute" style="white-space:nowrap">${esc(dk==='div'?divL(a.div):a.tags.map(tagL).join(', ')||'No tag')}</span>`});
  const spr=$('#spr');spr.innerHTML=`<div class="lhead"><span class="cnt"><b>${n(dst.length)}</b> in ${esc(nodeLabel(S.dst))}</span></div><div class="vl"></div>`;
  if(S.flash)SCROLL[`S|dst|${S.dst}`]=0;
  vlist(spr.querySelector('.vl'),`S|dst|${S.dst}`,dst,52,a=>rowHtml(a,{nock:true}));
  spr.querySelector('.vl').onclick=e=>{const r=e.target.closest('[data-i]');if(r)openSheet(ARTS[+r.dataset.i])};
  $('#ssrc').onchange=e=>{S.src=e.target.value;S.sel.clear();render()};
  $('#sdst').onchange=e=>{const v=e.target.value;if(v==='__nd'||v==='__nt'){e.target.value=S.dst;addTerm(v==='__nd'?'div':'tag',c=>{S.dst=(v==='__nd'?'div:':'tag:')+c;render()},'',{norefresh:true});return}S.dst=v;render()};
  p.querySelectorAll('[data-sgo]').forEach(b=>b.onclick=()=>{const ids=[...S.sel],to=S.dst.slice(4),m=b.dataset.sgo;
    if(m==='move')change(ids,{div:to},T.move(to));else if(m==='add')change(ids,{add:[to]},T.add(to));else change(ids,{add:[to],remove:[srcTag]},T.replace(srcTag,to))});
  p.querySelector('[data-dhome]').onclick=()=>{S.dview='home';S.sel.clear();render()};
}

/* ---------- render ---------- */
const NOTES={
  A:[['How it works','Divisions are folders: an article sits in exactly one. Tags are labels: it can carry several. A few: drag them onto a folder or label in the left rail. Hundreds: tick, “Select all”, then Move to… or Tags….'],
     ['Best for','Everyday use by everyone. Finding, filing and checking colours and sizes happen on one screen, and it works like the mail folders people already know.'],
     ['Trade-off','Needs about 1280px for all three panes. Drag is for a handful; the selection bar is for hundreds.']],
  B:[['How it works','Each division is a column. Drag a card across to move it, or tick several and drag them together. By tag shows a column per tag: a drop moves it from that tag, and holding ⌥ keeps both.'],
     ['Best for','Reorganising by hand: you see where everything sits. New in is the first column, with setup and the newly made articles, ready to be dragged to the right division.'],
     ['Trade-off','Columns hold thousands, so you usually search first. Details open as a sheet, and a narrow screen scrolls sideways.']],
  C:[['How it works','Division and Tags are editable cells, like Excel. Tick many and set them once, or drag rows onto a division. Changes wait in a tray; Review & save shows every move and the promotions it touches.'],
     ['Best for','Admins tidying in bulk, and teams used to 7Soft or Excel. Open a row’s arrow to see its colours × sizes without leaving the sheet.'],
     ['Trade-off','The least visual of the four. People must learn that nothing is saved until Review & save.']],
  D:[['How it works','Opens on what needs doing: deliveries to set up, new articles to check, gaps to fix (No price is fixed right in the list). The catalogue is one search away. Moving many has its own tool: Reorganise, two lists side by side.'],
     ['Best for','Teams for whom the Articles menu is mostly upkeep, and anyone who only comes to set up or fix something.'],
     ['Trade-off','Browsing the whole catalogue is one step deeper, and there are two places to move things: a list for a few, Reorganise for many.']],
};
function render(){closeMenu();
  const tot=ARTS.reduce((t,a)=>t+a.skus,0),ph=Math.round(100*ARTS.filter(a=>a.photo).length/ARTS.length);
  $('#pane').innerHTML=`<div class="ph"><div><h2>Articles</h2><div class="sub">${n(ARTS.length)} articles · ${n(tot)} SKUs · ${ph}% have a photo</div></div>
    <div class="act"><button class="btn ghost" data-t="Import from Excel: upload, match columns, preview, apply">${I.up}Import</button><button class="btn ghost" data-t="Exports what is shown">${I.dl}Export</button></div></div>
    <label class="big">${I.search}<input id="q" value="${esc(S.q)}" placeholder="Search ${n(ARTS.length)} articles: name, code, SKU, colour, supplier, or scan" autocomplete="off">${S.q?`<button class="btn ghost sm" id="qx" title="Clear">${I.x}</button>`:'<span class="kbd">/</span>'}</label>
    <div id="body"></div>`;
  ({A:viewA,B:viewB,C:viewC,D:viewD})[S.c]($('#body'));
  const q=$('#q');
  q.oninput=()=>{S.q=q.value;S.sel.clear();const pos=q.selectionStart;render();const nq=$('#q');nq.focus();nq.setSelectionRange(pos,pos);
    if(S.hl){const a=ARTS[S.hl.i];if(S.c==='A'){S.cur=a.i;S.dtab='variants';S.editing=false;render();$('#q').focus()}else openSheet(a,'variants')}};
  $('#qx')?.addEventListener('click',e=>{e.preventDefault();S.q='';S.hl=null;S.sel.clear();render()});
  $('#why').innerHTML=NOTES[S.c].map(([h,t])=>`<div><h5>${h}</h5><p>${t}</p></div>`).join('');
  trayC();
}
function refresh(){render();if(S.sheet)renderSheet(true)}

/* ---------- global wiring ---------- */
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeMenu();
  const s=e.target.closest('[data-setup]');if(s){e.preventDefault();openSetup(+s.dataset.setup);return}
  if(e.target.closest('[data-close]')){closeModal();return}
  const ad=e.target.closest('[data-add]');if(ad&&!ad.closest('.setup')){addTerm(ad.dataset.add);return}
  const t=e.target.closest('[data-t]');if(t)toast(t.dataset.t)});
let DRAG=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest?.('[data-drag]');if(!el)return;const i=+el.dataset.drag,ids=S.sel.has(i)?[...S.sel]:[i];DRAG={ids,from:el.dataset.from||''};
  const g=$('#dragghost');g.textContent=ids.length>1?`Move ${pl(ids.length)}`:ARTS[i].name;e.dataTransfer.setData('text/plain',ids.join(','));e.dataTransfer.effectAllowed='copyMove';
  e.dataTransfer.setDragImage(g,12,12);document.body.classList.add('dragging')});
const endDrag=()=>{DRAG=null;document.body.classList.remove('dragging');document.querySelectorAll('.dz').forEach(x=>x.classList.remove('dz'))};
document.addEventListener('dragend',endDrag);
document.addEventListener('dragover',e=>{const t=e.target.closest?.('[data-drop]');if(!t||!DRAG)return;e.preventDefault();document.querySelectorAll('.dz').forEach(x=>x!==t&&x.classList.remove('dz'));t.classList.add('dz')});
document.addEventListener('dragleave',e=>{const t=e.target.closest?.('[data-drop]');if(t&&!t.contains(e.relatedTarget))t.classList.remove('dz')});
document.addEventListener('drop',e=>{const t=e.target.closest?.('[data-drop]');if(!t||!DRAG)return;e.preventDefault();const [kind,code]=t.dataset.drop.split(':'),{ids,from}=DRAG;endDrag();
  if(S.c==='C'&&kind==='div'){stage(ids,(a,c)=>({...c,div:code}));return}
  if(kind==='div')change(ids,{div:code},T.move(code));
  else if(from.startsWith('tag:')&&!e.altKey&&from.slice(4)!==code)change(ids,{add:[code],remove:[from.slice(4)]},T.replace(from.slice(4),code));
  else change(ids,{add:[code]},T.add(code))});
document.addEventListener('keydown',e=>{const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='Escape'){if($('#menu')){closeMenu();return}if($('#scrim')){closeModal();return}if(S.setup){S.setup=null;renderSetup();return}if(S.sheet){closeSheet();return}
    if(S.c==='A'&&S.cur!=null){S.cur=null;render();return}if(S.sel.size){S.sel.clear();refresh()}return}
  if(e.key==='/'&&!typing){e.preventDefault();$('#q')?.focus()}});
$('#lenses').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;document.querySelectorAll('.lens').forEach(x=>x.classList.toggle('on',x===b));
  S.c=b.dataset.c;S.sel.clear();S.cur=null;S.sheet=false;S.editing=false;renderSheet();render()};
{const a=ARTS.find(x=>x.i>12000&&x.cols.length>1&&x.sizes.length>2&&x.act);document.getElementById('demoSku').textContent=skuCode(a,1,a.sizes[1])}
render();

</script>
</body>
</html>
