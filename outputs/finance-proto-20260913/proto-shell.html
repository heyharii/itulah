<title>Prototipe Finance Central</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#EDF1F5; --panel3:#E4EAF0;
  --ink:#141E28; --ink2:#3C4B59; --mute:#6D7C8A; --faint:#93A1AE;
  --line:#D3DBE3; --line2:#E6EBF0;
  --accent:#1F53D0; --accent-soft:#E1E9FB; --accent-ink:#FFFFFF;
  --good:#12694A; --good-soft:#D6EFE3; --warn:#9A5406; --warn-soft:#FAEBD5;
  --bad:#A81F27; --bad-soft:#F9DADC; --info:#2C5578; --info-soft:#DCE9F4;
  --store:#0B6560; --store-soft:#D3EEEB;
  --code:#EDF1F5;
  --sh:0 1px 2px rgba(20,30,40,.05),0 10px 28px -20px rgba(20,30,40,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1218; --panel:#141B23; --panel2:#1A232C; --panel3:#222D38;
  --ink:#E6ECF2; --ink2:#BFC9D4; --mute:#8795A3; --faint:#68757F;
  --line:#2B3642; --line2:#202932;
  --accent:#6E9CFF; --accent-soft:#1A2A46; --accent-ink:#0D1218;
  --good:#5AD09C; --good-soft:#11322500; --good-soft:#123326; --warn:#EFAE4E; --warn-soft:#382810;
  --bad:#F07C83; --bad-soft:#3C1A1D; --info:#7FB2DE; --info-soft:#152836;
  --store:#4CCFC4; --store-soft:#0F312E;
  --code:#1A232C;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0D1218; --panel:#141B23; --panel2:#1A232C; --panel3:#222D38;
  --ink:#E6ECF2; --ink2:#BFC9D4; --mute:#8795A3; --faint:#68757F;
  --line:#2B3642; --line2:#202932;
  --accent:#6E9CFF; --accent-soft:#1A2A46; --accent-ink:#0D1218;
  --good:#5AD09C; --good-soft:#123326; --warn:#EFAE4E; --warn-soft:#382810;
  --bad:#F07C83; --bad-soft:#3C1A1D; --info:#7FB2DE; --info-soft:#152836;
  --store:#4CCFC4; --store-soft:#0F312E;
  --code:#1A232C;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.22;text-wrap:balance}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.side.open{display:block;position:fixed;inset:0 auto 0 0;width:250px;z-index:40}}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{padding:12px 14px 10px;border-bottom:1px solid var(--line2);display:grid;gap:8px}
.brand .t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.brand .t .dot{width:9px;height:9px;border-radius:2px;background:var(--accent)}
.brand .s{font-size:11px;color:var(--mute)}
.who{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.who button{flex:1;padding:5px 6px;border-radius:4px;font-size:11.5px;font-weight:500;color:var(--mute);white-space:nowrap}
.who button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.who button.on.st{color:var(--store)}
.nav{flex:1;overflow-y:auto;padding:6px 0 16px}
.grp{padding:10px 14px 3px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.grp .cv{width:0;height:0;border:3.5px solid transparent;border-left:5px solid var(--faint);transition:transform .15s}
.grp.open .cv{transform:rotate(90deg)}
.grp .n{margin-left:auto;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
.it{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;padding:5px 14px 5px 16px;width:100%;text-align:left;font-size:13px;color:var(--ink2);border-left:2px solid transparent}
.it:hover{background:var(--panel2)}
.it.sel{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent);font-weight:500}
.it .ic{width:14px;height:14px;opacity:.7;display:block}
.it.sel .ic{opacity:1}
.it .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.bdg.bad{background:var(--bad);color:#fff}.bdg.warn{background:var(--warn);color:#fff}
.kind{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 3px;line-height:13px}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.crumb{font-size:11.5px;color:var(--mute)}
.crumb b{color:var(--ink2);font-weight:500}
.ttl{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.ttl h2{font-size:18px;font-weight:600}
.tg{font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:3px;font-weight:600}
.tg.live{background:var(--good-soft);color:var(--good)}
.tg.partial{background:var(--warn-soft);color:var(--warn)}
.tg.branchD{background:var(--info-soft);color:var(--info)}
.tg.new{background:var(--panel3);color:var(--mute)}
.tg.kind{background:var(--panel2);color:var(--mute);font-weight:500}
.spacer{flex:1}
.stpick{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute)}
.stpick select{font:inherit;font-size:11px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.body{padding:16px 20px 60px;display:grid;gap:14px;align-content:start}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12.5px;color:var(--ink2)}
.ctl b{font-weight:500;color:var(--ink)}
.ctl .k{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.ctl select,.ctl input{background:none;border:none;font:inherit;font-size:12.5px;color:var(--ink);padding:0;min-width:60px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.seg button{padding:4px 10px;border-radius:4px;font-size:12.5px;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:var(--sh)}
.act{display:flex;gap:7px;margin-left:auto}
.btn{padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink2)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.kpi .l{font-size:11.5px;color:var(--mute);margin-top:3px}
.kpi.good .v{color:var(--good)}.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--sh)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:600;background:var(--panel2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:default}
td .mono{font-size:11.5px;color:var(--ink2)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600;white-space:nowrap}
.tag.plain{background:var(--panel3);color:var(--mute)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.foot{padding:7px 11px;font-size:11.5px;color:var(--mute);background:var(--panel2);border-top:1px solid var(--line2)}
.lnk{color:var(--accent);cursor:pointer;font-weight:500}
.lnk:hover{text-decoration:underline}

/* states */
.state{padding:28px 20px;text-align:center;display:grid;gap:7px;justify-items:center}
.state h3{font-size:14px;font-weight:600}
.state p{font-size:12.5px;color:var(--mute);margin:0;max-width:46ch}
.sk{padding:11px}
.sk div{height:11px;border-radius:3px;background:linear-gradient(90deg,var(--panel2),var(--panel3),var(--panel2));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:9px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk div{animation:none}}

/* why panel */
.why{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 13px;display:grid;gap:5px}
.why .h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.why p{margin:0;font-size:12.5px;color:var(--ink2);max-width:96ch}
.why .meta{font-size:11.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 14px}

.jr{display:grid;gap:4px;padding:10px 13px}
.jr .h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:2px}
.jr .l{display:grid;grid-template-columns:70px 1fr;gap:8px;font-size:12px;align-items:baseline}
.jr .l .s{font-weight:600;font-size:11px}
.jr .l .s.dr{color:var(--info)}.jr .l .s.cr{color:var(--warn)}
.jr .l .m{color:var(--mute);font-size:11.5px}

/* store banner */
.banner{background:var(--store-soft);border:1px solid var(--store);border-radius:8px;padding:9px 12px;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink2)}
.banner b{color:var(--store)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.42);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:51;display:none;flex-direction:column;box-shadow:-14px 0 40px -24px rgba(0,0,0,.5)}
.sheet.on{display:flex}
.sh-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sh-h h3{font-size:15px;font-weight:600;flex:1}
.sh-b{flex:1;overflow-y:auto;padding:14px 16px;display:grid;gap:13px;align-content:start}
.sh-f{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fld{display:grid;gap:4px}
.fld label{font-size:11.5px;color:var(--mute);font-weight:500}
.fld .in{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;display:flex;align-items:center;gap:8px;min-height:34px}
.fld .in.btnlike{cursor:pointer}
.fld .in.btnlike:hover{border-color:var(--accent)}
.fld .hint{font-size:11px;color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- account picker ---------- */
.pk{display:grid;gap:11px}
.pk-hd{display:grid;gap:5px}
.pk-hd .big{font-size:12.5px;color:var(--ink2)}
.pk-hd .big b{color:var(--accent)}
.axis{display:grid;gap:6px}
.axis .ax{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;display:flex;gap:7px;align-items:center}
.axis .ax .n{color:var(--faint);font-weight:500;letter-spacing:0;text-transform:none}
.search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px}
.opts{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--line2);cursor:pointer;width:100%;text-align:left}
.opt:last-child{border-bottom:0}
.opt:hover{background:var(--panel2)}
.opt.on{background:var(--accent-soft)}
.opt .fm{font-size:10.5px;color:var(--faint)}
.opt .cd{font-size:10.5px;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip:disabled{opacity:.32;cursor:not-allowed}
.receipt{background:var(--panel2);border:1px dashed var(--line);border-radius:7px;padding:10px 12px;display:grid;gap:4px}
.receipt .cd{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:500;letter-spacing:.02em}
.receipt .nm{font-size:12.5px;color:var(--ink2)}
.receipt .ex{font-size:11px;color:var(--mute)}
.receipt.blocked{border-color:var(--bad);background:var(--bad-soft)}
.receipt.blocked .cd{color:var(--bad);font-size:13px}
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="t"><span class="dot"></span>Finance</div>
      <div class="s">CENTRAL FASHION STORE · Sep 2026</div>

      <div style="display:grid;gap:2px">
        <div class="crumb" id="crumb"></div>

      <span class="spacer"></span>
      <span class="stpick">Keadaan
        <select id="state">
          <option value="normal">normal</option>
          <option value="memuat">memuat</option>

</div>

<div class="scrim" id="scrim"></div>

  <div class="sh-h"><h3 id="shTtl"></h3><button class="btn" id="shX">Tutup</button></div>
  <div class="sh-b" id="shB"></div>
  <div class="sh-f" id="shF"></div>
</aside>

<script>const CUBE = /*__CUBE__*/{};</script>
<script>/*__SCREENS__*/</script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

/* ===== icons (inline, currentColor) ===== */
var IC={
 dash:'M3 13h6V3H3v10zm0 8h6v-6H3v6zm8 0h10V11H11v10zm0-18v6h10V3H11z',
 doc:'M6 2h8l4 4v16H6V2zm8 1.5V7h3.5',
 tool:'M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-2.1-2.1 2.2-2z',
 rep:'M4 20h16M7 16V8m5 8V4m5 12v-5',
 set:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 12h2m14 0h2M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10 1.4 1.4M5.6 18.4 7 17m10-10 1.4-1.4'
};
function icon(kind){
 var d=kind==="dashboard"?IC.dash:kind==="document"?IC.doc:kind==="tool"?IC.tool:kind==="report"?IC.rep:IC.set;
 return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';
}

/* ===== menu (mirrors docs/finance-menu.md) ===== */
var MENU=[
 {g:null,items:["/finance"]},
 {g:"Store money",items:["/finance/sales-days","/finance/deposits","/finance/petty-cash"]},
 {g:"Cash & Bank",items:["/finance/cash","/finance/cash-counts","/finance/banks","/finance/bank-accounts","/finance/bank-transactions","/finance/bank-reconciliation"]},
 {g:"Receivables",items:["/finance/settlements","/finance/unmatched-charges"]},
 {g:"Payables",items:["/finance/bills","/finance/giro","/finance/advances"]},
 {g:"Payments",items:["/finance/payments","/finance/journal"]},
 {g:"Inter-unit",items:["/finance/interunit","/finance/unit-balances"]},
 {g:"Assets",items:["/finance/assets","/finance/depreciation","/finance/projects"],shut:1},
 {g:"Payroll",items:["/finance/payroll-postings","/finance/staff-loans"],shut:1},
 {g:"Periodic & closing",items:["/finance/schedules","/finance/periods","/finance/opening"],shut:1},
 {g:"Reports",items:["/finance/reports","/finance/ledger","/finance/stock-value","/finance/integrity"]},
 {g:"Setup",items:["/finance/accounts","/finance/account-map","/finance/posting-rules","/finance/payment-terms","/finance/giro-print","/finance/settings"],shut:1}
];
var BADGE={"/finance/bills":["warn",6],"/finance/bank-reconciliation":["warn",11],
 "/finance/unmatched-charges":["warn",3],"/finance/periods":["warn",1],"/finance/account-map":["bad",1],"/finance/integrity":["bad",2]};

/* store may only ever touch these meanings, at its own unit */
var STORE_MEANINGS=["1011001001","1011001002","1011001003"];
var STORE_UNIT="C006";

var S={path:"/finance",who:"HO",state:"normal",seg:0,unit:"__all",open:{}};
MENU.forEach(function(m){if(m.g)S.open[m.g]=!m.shut});

function scr(p){return (typeof SCREENS!=="undefined"&&SCREENS[p])||null}
function visible(p){var s=scr(p);return S.who==="HO"?true:!!(s&&s.store)}

/* ===== sidebar ===== */
function drawWho(){
 var w=$("#who");w.innerHTML="";
 [["HO","Head office"],["TOKO","Toko C006"]].forEach(function(o){
   var b=el("button",(S.who===o[0]?"on":"")+(o[0]==="TOKO"?" st":""),esc(o[1]));
   b.onclick=function(){S.who=o[0];if(S.who==="TOKO"&&!visible(S.path))S.path="/finance";S.unit=S.who==="TOKO"?STORE_UNIT:"__all";draw()};
   w.appendChild(b);
 });
}
function drawNav(){
 var n=$("#nav");n.innerHTML="";
 MENU.forEach(function(m){
   var rows=m.items.filter(visible);
   if(!rows.length)return;
   if(m.g){
     var h=el("div","grp"+(S.open[m.g]?" open":""),'<span class="cv"></span>'+esc(m.g)+'<span class="n">'+rows.length+'</span>');
     h.onclick=function(){S.open[m.g]=!S.open[m.g];drawNav()};
     n.appendChild(h);
     if(!S.open[m.g])return;
   }
   rows.forEach(function(p){
     var s=scr(p)||{title:p.split("/").pop().replace(/-/g," ").replace(/^./,function(c){return c.toUpperCase()}),kind:"document"};
     var bg=BADGE[p], b=el("button","it"+(S.path===p?" sel":""));
     b.innerHTML=icon(s.kind)+'<span class="lb">'+esc(s.title||p)+'</span>'+
       (bg?'<span class="bdg '+bg[0]+'">'+bg[1]+'</span>':'<span class="kind">'+esc((s.kind||"").slice(0,4))+'</span>');
     b.onclick=function(){S.path=p;S.seg=0;S.state="normal";$("#state").value="normal";draw()};
     n.appendChild(b);
   });
 });
}

/* ===== account picker: the cube ===== */
var PK={tpl:null,unit:null,cp:null,q:"",onpick:null};
function famName(f){var x=CUBE.fams.filter(function(z){return z.c===f})[0];return x?x.n:f}
function pickerOptions(){
 var allowed=S.who==="TOKO"?CUBE.plain.filter(function(t){return STORE_MEANINGS.indexOf(t.t)>=0}):CUBE.plain;
 var mats=S.who==="TOKO"?[]:CUBE.matrix;
 var q=PK.q.trim().toLowerCase();
 function hit(o){return !q||o.n.toLowerCase().indexOf(q)>=0||o.t.indexOf(q)>=0||famName(o.f).toLowerCase().indexOf(q)>=0}
 return {plain:allowed.filter(hit).slice(0,300),mat:mats.filter(hit)};
}
function unitFor(code){var u=CUBE.units.filter(function(x){return x.code===code})[0];return u}
function resolve(){
 if(!PK.tpl||!PK.unit)return null;
 var u=unitFor(PK.unit);if(!u)return null;
 if(PK.tpl.cp){ if(!PK.cp)return null;
   return {code:PK.tpl.t+PK.cp.q+u.s, name:PK.tpl.n+" "+PK.cp.n+" - "+u.code, three:true};
 }
 return {code:PK.tpl.t+u.s, name:PK.tpl.n+" "+u.code, three:false};
}
function openPicker(ctx,cb){
 PK={tpl:null,unit:S.who==="TOKO"?STORE_UNIT:(S.unit!=="__all"?S.unit:null),cp:null,q:"",onpick:cb};
 sheet("Pilih akun — "+(ctx||"jurnal"),renderPicker,[
   {label:"Batal"},
   {label:"Pakai akun ini",primary:true,act:function(){var r=resolve();if(r&&PK.onpick)PK.onpick(r);return true}}
 ]);
}
function renderPicker(b){
 b.innerHTML="";
 var st=CUBE.stats;
 var hd=el("div","pk-hd");
 hd.innerHTML='<div class="big">Bagan klien punya <b>'+st.leaves.toLocaleString("id")+'</b> akun yang boleh diposting. '+
   'Orang memilih dari <b>'+st.pick+'</b>: '+st.plain+' arti biasa + '+st.matrix+' arti bermatriks. Sisanya dihitung dari sumbunya.</div>'+
   (S.who==="TOKO"?'<div class="big" style="color:var(--store)"><b>Toko:</b> hanya 3 arti, dan hanya di unitnya sendiri. Tidak ada satu pun rekening bank.</div>':'');
 b.appendChild(hd);

 var wrap=el("div","pk");
 /* axis 1 */
 var a1=el("div","axis");
 a1.appendChild(el("div","ax",'Sumbu 1 — arti <span class="n">apa akun ini</span>'));
 var s=el("input","search");s.placeholder="cari arti, keluarga, atau kode template…";s.value=PK.q;
 s.oninput=function(){PK.q=s.value;var o=opts();lst.replaceWith(o);lst=o};
 a1.appendChild(s);
 function opts(){
   var o=pickerOptions(),box=el("div","opts");
   o.mat.forEach(function(t){
     var b2=el("button","opt"+(PK.tpl&&PK.tpl.t===t.t?" on":""));
     b2.innerHTML='<span>'+esc(t.n)+' <span class="fm">· matriks unit × unit</span></span><span class="cd">'+t.t+'</span>';
     b2.onclick=function(){PK.tpl=t;PK.cp=null;renderPicker(b)};box.appendChild(b2);
   });
   o.plain.forEach(function(t){
     var b2=el("button","opt"+(PK.tpl&&PK.tpl.t===t.t?" on":""));
     b2.innerHTML='<span>'+esc(t.n)+' <span class="fm">· '+esc(famName(t.f))+'</span></span><span class="cd">'+t.t+'</span>';
     b2.onclick=function(){PK.tpl=t;PK.cp=null;renderPicker(b)};box.appendChild(b2);
   });
   if(!o.plain.length&&!o.mat.length)box.appendChild(el("div","state",'<p>Tidak ada arti yang cocok.</p>'));
   return box;
 }
 var lst=opts();a1.appendChild(lst);wrap.appendChild(a1);

 /* axis 2 */
 var a2=el("div","axis");
 a2.appendChild(el("div","ax",'Sumbu 2 — unit <span class="n">buku siapa</span>'));
 var c2=el("div","chips");
 CUBE.units.forEach(function(u){
   var b2=el("button","chip"+(PK.unit===u.code?" on":""),esc(u.code));
   b2.title=u.name;
   if(S.who==="TOKO"&&u.code!==STORE_UNIT)b2.disabled=true;
   b2.onclick=function(){PK.unit=u.code;renderPicker(b)};c2.appendChild(b2);
 });
 a2.appendChild(c2);wrap.appendChild(a2);

 /* axis 3 */
 if(PK.tpl&&PK.tpl.cp){
   var a3=el("div","axis");
   a3.appendChild(el("div","ax",'Sumbu 3 — unit lawan <span class="n">hanya untuk '+CUBE.stats.matrix+' arti bermatriks</span>'));
   var c3=el("div","chips");
   PK.tpl.cp.forEach(function(cp){
     var b3=el("button","chip"+(PK.cp&&PK.cp.q===cp.q?" on":""),esc(cp.n));
     b3.onclick=function(){PK.cp=cp;renderPicker(b)};c3.appendChild(b3);
   });
   a3.appendChild(c3);wrap.appendChild(a3);
 }

 /* receipt */
 var r=resolve(),rc=el("div","receipt");
 if(r){
   rc.innerHTML='<div class="cd">'+r.code+'</div><div class="nm">'+esc(r.name)+'</div>'+
     '<div class="ex">'+(r.three?'arti + unit + unit lawan':'arti + unit')+' → kode 12 digit milik klien, dihitung dan bukan dihafal</div>';
 }else{
   var need = !PK.tpl ? "pilih arti dulu" : (!PK.unit ? "pilih unit" : "pilih unit lawan");
   rc.innerHTML='<div class="cd" style="font-size:13px;color:var(--mute)">'+need+'</div>'+
     '<div class="ex">Kode tidak pernah diketik. Ia hasil dari sumbu yang dipilih.</div>';
 }
 wrap.appendChild(rc);
 if(S.who==="TOKO"){
   var bl=el("div","receipt blocked");
   bl.innerHTML='<div class="cd">33 template bank: tidak ditawarkan</div>'+
     '<div class="ex">Setiap rekening bank adalah rekening head office. Toko memegang uang penjualan sebelum disetor, petty cash, dan modal kasir — tiga arti, satu unit.</div>';
   wrap.appendChild(bl);
 }
 b.appendChild(wrap);
}

/* ===== sheet ===== */
function sheet(title,render,btns){
 $("#shTtl").textContent=title;
 var b=$("#shB");b.innerHTML="";render(b);
 var f=$("#shF");f.innerHTML="";
 (btns||[{label:"Tutup"}]).forEach(function(x){
   var bt=el("button","btn"+(x.primary?" pri":""),esc(x.label));
   bt.onclick=function(){if(!x.act||x.act()!==false)closeSheet()};f.appendChild(bt);
 });
 $("#sheet").classList.add("on");$("#scrim").classList.add("on");
}
function closeSheet(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on")}
$("#shX").onclick=closeSheet;$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});

/* ===== generic form sheet ===== */
function formSheet(s,a){
 sheet(a.label+" — "+s.title,function(b){
   var fields=(a.fields||[["Unit","chip"],["Tanggal","date"],["Keterangan","text"]]);
   fields.forEach(function(f){
     var d=el("div","fld");
     d.innerHTML='<label>'+esc(f[0])+'</label>';
     var inn=el("div","in"+(f[1]==="account"?" btnlike":""));
     if(f[1]==="account"){
       inn.innerHTML='<span style="color:var(--mute)">pilih arti + unit →</span>';
       inn.onclick=function(){openPicker(a.label,function(r){inn.innerHTML='<span class="mono">'+r.code+'</span> <span style="color:var(--ink2)">'+esc(r.name)+'</span>';
         setTimeout(function(){formSheetReopen(s,a,inn.innerHTML)},10)})};
     }else if(f[1]==="chip"){
       inn.innerHTML='<span>'+(S.who==="TOKO"?STORE_UNIT:"HO")+'</span><span style="color:var(--faint);font-size:11px">'+(S.who==="TOKO"?"terkunci ke unit Anda":"cakupan Anda: 14 unit")+'</span>';
     }else if(f[1]==="date"){inn.innerHTML='<span>13 September 2026</span>';}
     else if(f[1]==="amount"){inn.innerHTML='<span style="color:var(--mute)">0</span><span style="margin-left:auto;color:var(--faint);font-size:11px">rupiah</span>';}
     else{inn.innerHTML='<span style="color:var(--mute)">…</span>';}
     d.appendChild(inn);
     if(f[2])d.appendChild(el("div","hint",esc(f[2])));
     b.appendChild(d);
   });
   if(s.journal&&s.journal.length){
     var j=el("div","card");var jr=el("div","jr");
     jr.appendChild(el("div","h","Jurnal yang akan ditulis"));
     s.journal.forEach(function(l){
       var row=el("div","l");
       row.innerHTML='<span class="s '+(l.dr?"dr":"cr")+'">'+(l.dr?"Dr":"Cr")+'</span>'+
         '<span><span class="mono">'+esc(l.dr||l.cr)+'</span>'+(l.note?' <span class="m">· '+esc(l.note)+'</span>':'')+'</span>';
       jr.appendChild(row);
     });
     j.appendChild(jr);b.appendChild(j);
   }
 },[{label:"Batal"},{label:a.primary?"Ajukan":"Simpan draf",primary:true}]);
}
var _lastAcc=null;
function formSheetReopen(s,a,html){_lastAcc=html;formSheet(s,a);
 var ins=$("#shB").querySelectorAll(".in.btnlike");if(ins.length)ins[0].innerHTML=html;}

/* ===== screen render ===== */
function tone(t){return ["plain","good","warn","bad","info"].indexOf(t)>=0?t:"plain"}
function drawTop(s){
 var gp=MENU.filter(function(m){return m.items.indexOf(S.path)>=0})[0];
 $("#crumb").innerHTML='Finance'+(gp&&gp.g?' · <b>'+esc(gp.g)+'</b>':'');
 $("#ttl").innerHTML='<h2>'+esc(s.title)+'</h2>'+
   '<span class="tg kind">'+esc(s.kind)+'</span>'+
   '<span class="tg '+esc(s.status||"new")+'">'+esc(s.status||"new")+'</span>'+
   (s.erp&&s.erp!=="\u2014"?'<span class="tg kind" title="'+esc(s.erp)+'">ERPNext: '+esc(s.erp.length>34?s.erp.slice(0,32).replace(/[\s(;,\u2014-]+$/,"")+"\u2026":s.erp)+'</span>':'');
}
function stateBox(kind){
 var M={
  memuat:null,
  kosong:["Belum ada data sama sekali","Layar ini kosong karena belum ada dokumen yang dibuat, bukan karena filter. Mulai dengan tombol di kanan atas."],
  takAdaHasil:["Tidak ada hasil untuk filter ini","Ada data di layar ini, tetapi filter yang dipilih tidak menemukannya. Longgarkan unit atau periode."],
  gagal:["Gagal memuat","Permintaan ke server tidak selesai. Coba lagi; kalau berulang, catat waktunya."],
  takBerizin:["Tidak punya akses","Ini soal izin, bukan soal data tidak ada. Minta akses ke pemilik modul Finance."],
  berubah:["Dokumen berubah sejak dibuka","Orang lain menyimpan perubahan. Muat ulang sebelum melanjutkan supaya tidak menimpa pekerjaannya."],
  diproses:["Sedang diproses","Perintah sudah dikirim dan hasilnya belum pasti. Jangan diulang sebelum diperiksa."]
 };
 if(kind==="memuat"){
  var sk=el("div","sk");for(var i=0;i<7;i++){var d=el("div");d.style.width=(58+((i*17)%40))+"%";sk.appendChild(d)}
  return sk;
 }
 var m=M[kind];if(!m)return null;
 return el("div","state",'<h3>'+esc(m[0])+'</h3><p>'+esc(m[1])+'</p>');
}
function draw(){
 drawWho();drawNav();
 var s=scr(S.path);
 var b=$("#body");b.innerHTML="";
 if(!s){b.appendChild(el("div","card",'<div class="state"><h3>Layar belum ada isinya</h3><p>'+esc(S.path)+'</p></div>'));return}
 drawTop(s);

 /* store banner */
 if(S.who==="TOKO"){
   var bn=el("div","banner");
   bn.innerHTML='<b>Toko</b><span>Anda melihat '+MENU.reduce(function(a,m){return a+m.items.filter(visible).length},0)+
     ' dari 37 baris. Tidak ada rekening bank di mana pun — rekening toko adalah rekening HO. Yang Anda pegang: uang penjualan sebelum disetor, petty cash, dan modal kasir.</span>';
   b.appendChild(bn);
 }

 /* why */
 var w=el("div","why");
 w.innerHTML='<div class="h">Kenapa layar ini begini</div><p>'+esc(s.why||s.job||"")+'</p>'+
   '<div class="meta"><span>Tugas: '+esc(s.job||"-")+'</span></div>';
 b.appendChild(w);

 /* toolbar */
 var bar=el("div","bar");
 (s.toolbar||[]).forEach(function(t){
   if(t==="unit"){
     var c=el("div","ctl");c.innerHTML='<span class="k">Unit</span>';
     var sel=el("select");
     if(S.who!=="TOKO")sel.appendChild(new Option("Semua unit","__all"));
     CUBE.units.forEach(function(u){
       if(S.who==="TOKO"&&u.code!==STORE_UNIT)return;
       var o=new Option(u.code+" · "+u.name,u.code);sel.appendChild(o);
     });
     sel.value=S.who==="TOKO"?STORE_UNIT:S.unit;
     sel.onchange=function(){S.unit=sel.value;draw()};
     c.appendChild(sel);bar.appendChild(c);
   }else if(t==="period"){bar.appendChild(el("div","ctl",'<span class="k">Periode</span><b>September 2026</b>'))}
   else if(t==="asof"){bar.appendChild(el("div","ctl",'<span class="k">Per tanggal</span><b>13 Sep 2026</b>'))}
   else if(t==="search"){bar.appendChild(el("div","ctl",'<span class="k">Cari</span><input placeholder="nomor, pihak, keterangan">'))}
 });
 if(s.segments&&s.segments.length){
   var sg=el("div","seg");
   s.segments.forEach(function(x,i){
     var bt=el("button",i===S.seg?"on":"",esc(x));
     bt.onclick=function(){S.seg=i;draw()};sg.appendChild(bt);
   });
   bar.appendChild(sg);
 }
 if(s.actions&&s.actions.length){
   var ac=el("div","act");
   s.actions.forEach(function(a){
     var bt=el("button","btn"+(a.primary?" pri":""),esc(a.label));
     bt.onclick=function(){formSheet(s,a)};ac.appendChild(bt);
   });
   bar.appendChild(ac);
 }
 if(bar.children.length)b.appendChild(bar);

 /* kpis */
 if(s.kpis&&s.kpis.length&&S.state==="normal"){
   var k=el("div","kpis");
   s.kpis.forEach(function(x){k.appendChild(el("div","kpi "+tone(x.tone),'<div class="v">'+esc(x.value)+'</div><div class="l">'+esc(x.label)+'</div>'))});
   b.appendChild(k);
 }

 /* table / state */
 var card=el("div","card");
 if(S.state!=="normal"){
   card.appendChild(stateBox(S.state));
   b.appendChild(card);
 }else{
   var rows=(s.rows||[]).filter(function(r){
     if(S.unit==="__all")return true;
     return !r._unit||r._unit===S.unit;
   });
   if(s.segments&&s.segments.length){
     var segRows=rows.filter(function(r){return r._seg==null||r._seg===S.seg});
     if(segRows.length)rows=segRows;
   }
   if(!rows.length){
     card.appendChild(el("div","state",'<h3>Tidak ada hasil untuk filter ini</h3><p>Ada data di layar ini, tetapi unit yang dipilih tidak punya baris. Pilih “Semua unit”.</p>'));
   }else{
     var tw=el("div","tw"),t=el("table");
     var th=el("tr");
     (s.columns||[]).forEach(function(c){var e=el("th",c.num?"num":"",esc(c.label));if(c.w)e.style.width=c.w;th.appendChild(e)});
     var thead=el("thead");thead.appendChild(th);t.appendChild(thead);
     var tb=el("tbody");
     rows.forEach(function(r){
       var tr=el("tr");
       (s.columns||[]).forEach(function(c){
         var v=r[c.k],td=el("td",c.num?"num":"");
         if(c.tag&&Array.isArray(v))td.innerHTML='<span class="tag '+tone(v[1])+'">'+esc(v[0])+'</span>';
         else if(c.mono)td.innerHTML='<span class="mono">'+esc(v)+'</span>';
         else if(r._goto&&c.k===(s.columns[0]||{}).k)
           td.innerHTML='<span class="lnk">'+esc(v)+'</span>';
         else td.textContent=v==null?"—":v;
         if(r._goto&&c.k===(s.columns[0]||{}).k)td.onclick=function(){if(scr(r._goto)){S.path=r._goto;S.seg=0;draw()}};
         tr.appendChild(td);
       });
       tb.appendChild(tr);
     });
     t.appendChild(tb);tw.appendChild(t);card.appendChild(tw);
     card.appendChild(el("div","foot",esc((s.note?s.note+" · ":"")+rows.length+" baris"+(S.unit!=="__all"?" · unit "+S.unit:""))));
   }
   b.appendChild(card);
 }

 /* journal */
 if(s.journal&&s.journal.length&&S.state==="normal"){
   var jc=el("div","card"),jr=el("div","jr");
   jr.appendChild(el("div","h","Jurnal yang ditulis dokumen ini"));
   s.journal.forEach(function(l){
     var row=el("div","l");
     row.innerHTML='<span class="s '+(l.dr?"dr":"cr")+'">'+(l.dr?"Dr":"Cr")+'</span>'+
       '<span><span class="mono">'+esc(l.dr||l.cr)+'</span>'+(l.note?' <span class="m">· '+esc(l.note)+'</span>':'')+'</span>';
     jr.appendChild(row);
   });
   jr.appendChild(el("div","l",'<span class="s" style="color:var(--faint)">→</span><span class="m">Arti, bukan kode. <span class="lnk" id="openPk">Buka pemilih akun</span> untuk melihat arti menjadi kode 12 digit.</span>'));
   jc.appendChild(jr);b.appendChild(jc);
   var op=$("#openPk");if(op)op.onclick=function(){openPicker(s.title,function(){})};
 }
}

$("#pkBtn").onclick=function(){openPicker("mana saja",function(){})};
$("#state").onchange=function(){S.state=this.value;draw()};
$("#theme").onclick=function(){
 var r=document.documentElement, cur=r.getAttribute("data-theme");
 var dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
 r.setAttribute("data-theme",dark?"light":"dark");
};
draw();
})();
</script>
