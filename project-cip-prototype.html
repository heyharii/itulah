<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#1d1d1f;--body:#424245;--mute:#6e6e73;--faint:#c7c7cc;
  --hairline:#e8e8ec;--row-line:#eeeef1;--band:#fafafb;--soft-2:#f2f2f5;--soft-3:#f5f5f7;
  --rail-2:#f5f5f7;--rail-3:#efeff2;
  --accent:#2862dc;--accent-bg:#eef3fc;--cta-hover:#2055c7;
  --ok:#36b827;--warn:#c9892e;--bad:#d70015;--bad-fg:#d70015;--info:#2862dc;
  --r-card:10px;--r-inner:8px;--r-sheet:16px;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --ring:0 0 0 1px rgb(0 0 0/5%),0 2px 8px rgb(0 0 0/5%),0 24px 64px rgb(0 0 0/14%);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
p{margin:0}

/* prototype chrome */
.chrome{position:sticky;top:0;z-index:80;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;background:#20242c;color:#fff}
.chrome .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.chrome .grp>span{opacity:.55;margin-right:6px}
.chrome button{border:0;border-radius:999px;padding:6px 12px;background:#353a44;color:#fff;cursor:pointer;font-size:15px}
.chrome button[aria-pressed=true]{background:#fff;color:#20242c;font-weight:600}

/* hub shell */
.shell{display:flex;gap:12px;min-height:calc(100vh - var(--ch,52px));padding:12px 12px 12px 0;background:#ececef}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.rail .mk{width:36px;height:36px;margin-bottom:10px}
.rail i{display:block;width:36px;height:36px;border-radius:9px;background:#e2e2e6}
.rail i.on{background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/5%)}
.panel{width:216px;flex:none;align-self:flex-start;position:sticky;top:calc(var(--ch,52px) + 12px);min-height:calc(100vh - var(--ch,52px) - 24px);background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgb(0 0 0/4%);padding:14px 10px}
.panel h2{font-size:17px;font-weight:600;margin:6px 10px 14px}
.panel a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:#3a3a3c;text-decoration:none;cursor:default}
.panel a.on{background:var(--accent-bg);color:var(--accent);font-weight:500}
.panel a i{font-style:normal;color:var(--mute)}
.panel hr{border:0;border-top:1px solid var(--hairline);margin:8px 10px}
.panel small{display:block;margin:14px 10px 4px;color:var(--mute);font-size:15px}
.page{flex:1;min-width:0;padding:26px 32px 64px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgb(0 0 0/4%)}
.panel a.sub{padding-left:24px}
.panel .nest{position:relative}
.panel .nest::before{content:"";position:absolute;left:15px;top:4px;bottom:4px;width:1px;background:var(--hairline)}

.crumb{color:var(--mute);margin-bottom:2px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:17px;font-weight:600;margin:0;line-height:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--mute)}
.head .acts{display:flex;gap:8px;align-items:center}
.st{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:400;font-size:15px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.st.ok{--c:var(--ok)} .st.warn{--c:var(--warn)} .st.info{--c:var(--info)} .st.faint{--c:var(--faint);color:var(--mute)} .st.bad{--c:var(--bad);color:var(--bad-fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border:0;border-radius:var(--r-inner);cursor:pointer;font-weight:600;white-space:nowrap;transition:transform 160ms var(--ease-out),background-color 150ms ease,opacity 150ms ease}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{height:32px;padding:0 12px}
.btn.primary{background:var(--accent);color:#fff}
.btn svg{width:17px;height:17px}
@media (hover:hover) and (pointer:fine){.btn.primary:hover:not(:disabled){background:var(--cta-hover)}}
.act{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--accent);font-weight:500;cursor:pointer;transition:opacity 150ms ease,transform 160ms var(--ease-out)}
.act:active{transform:scale(.97)}
.act svg{width:16px;height:16px}

.banner{display:flex;align-items:center;gap:14px;margin-top:20px;padding:14px 18px;border-radius:var(--r-card);background:var(--soft-3)}
.banner b{font-weight:600}
.banner .why{color:var(--mute)}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--hairline);margin:20px 0 0}
.tabs button{border:0;background:none;padding:10px 0;color:var(--mute);cursor:pointer}
.tabs button i{font-style:normal;margin-left:6px}
.tabs button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}

.kpis{display:flex;flex-wrap:wrap;margin:22px 0 4px;row-gap:12px}
.kpi{padding:0 24px;border-left:1px solid var(--hairline)}
.kpi:first-child{padding-left:0;border-left:0}
.kpi small{display:block;color:var(--mute);font-size:15px}
.kpi b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi b.warn{color:var(--warn)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 16px}
.search{flex:0 1 300px;height:36px;border:1px solid var(--hairline);border-radius:var(--r-inner);padding:0 12px}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px}
.sec h3{margin:0;font-size:15px;font-weight:600}
.sec h3 span{color:var(--mute);font-weight:400;margin-left:8px}
.frame{border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{height:44px;background:var(--band);color:var(--mute);font-weight:500;text-align:left;padding:0 20px;border-bottom:1px solid var(--hairline)}
td{padding:14px 20px;border-top:1px solid var(--row-line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tfoot td{background:var(--band);border-top:1px solid var(--hairline);font-weight:600}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
td .g{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trunc{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-weight:500}
tr.link{cursor:pointer}
@media (hover:hover) and (pointer:fine){tr.link:hover td{background:var(--band)}}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.thumb{flex:none;width:40px;height:40px;border-radius:var(--r-inner);background:var(--soft-2);display:grid;place-items:center;color:#8e8e93;overflow:hidden}
.thumb svg{width:19px;height:19px}
.thumb.ph{background:linear-gradient(135deg,#dfe6ef,#c8d3e0)}
.goes{width:100%;height:36px;border:1px solid var(--hairline);border-radius:var(--r-inner);padding:0 10px;background:#fff}
.goes.empty{border-color:var(--warn);color:var(--warn)}

/* sheet (layer from the right) */
.dim{position:fixed;inset:0;z-index:55;background:rgb(40 30 20/10%);opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-out)}
.dim.open{opacity:1;pointer-events:auto;transition:opacity 340ms var(--ease-drawer)}
.sheet{position:fixed;z-index:56;top:calc(var(--ch,52px) + 10px);right:10px;bottom:10px;width:min(928px,calc(100vw - 20px));display:flex;flex-direction:column;background:#fff;border-radius:var(--r-sheet);box-shadow:var(--ring);transform:translateX(calc(100% + 20px));transition:transform 200ms var(--ease-out)}
.sheet.open{transform:none;transition:transform 340ms var(--ease-drawer)}
.sh-h{display:flex;justify-content:space-between;gap:12px;padding:28px 36px 20px;border-bottom:1px solid var(--hairline)}
.sh-b{flex:1;overflow:auto;padding:28px 36px 36px;display:flex;flex-direction:column;gap:40px}
.sh-f{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-height:68px;padding:14px 36px;border-top:1px solid var(--hairline)}
.x{flex:none;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:var(--soft-2);color:var(--mute);cursor:pointer;transition:transform 160ms var(--ease-out)}
.x:active{transform:scale(.94)}
.x svg{width:18px;height:18px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:20px 40px}
.facts dt{color:var(--mute)}
.facts dd{margin:2px 0 0}

/* dialog */
.scrim{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgb(40 30 20/10%);opacity:0;pointer-events:none;transition:opacity 150ms ease}
.scrim.open{opacity:1;pointer-events:auto;transition-duration:200ms}
.dlg{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:var(--r-sheet);box-shadow:var(--ring);opacity:0;transform:scale(.96);transition:opacity 150ms ease,transform 150ms var(--ease-out)}
.scrim.open .dlg{opacity:1;transform:none;transition-duration:200ms}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:24px 20px 0 28px}
.dlg-h h2{margin:0;font-size:17px;font-weight:600}
.dlg-b{padding:8px 28px 4px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:24px 28px}
.dlg-f .btn{min-width:160px}
.field{display:block;margin-top:24px}
.field>span{display:block;font-weight:500;margin-bottom:8px}
.field input,.field select{width:100%;height:47px;border:1px solid var(--hairline);border-radius:var(--r-inner);padding:0 12px;background:#fff;outline:0;transition:border-color 150ms ease,box-shadow 150ms ease}
.field :is(input,select):focus{border-color:var(--accent);box-shadow:0 0 0 3px rgb(40 98 220/12%)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;align-items:center;gap:10px;min-height:47px;padding:8px 12px;border:1px solid var(--hairline);border-radius:var(--r-inner);background:#fff;cursor:pointer;text-align:left;transition:transform 160ms var(--ease-out),border-color 150ms ease}
.tile:active{transform:scale(.97)}
.tile svg{flex:none;width:18px;height:18px;color:#8e8e93}
.tile.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:500}
.tile.on svg{color:var(--accent)}
.photo{display:flex;align-items:center;gap:16px}
.photo .box{width:96px;height:96px;border:1px dashed var(--hairline);border-radius:var(--r-card);background:var(--soft-2);display:grid;place-items:center;color:var(--accent)}
.photo .box svg{width:24px;height:24px}
.sum{border:1px solid var(--hairline);border-radius:var(--r-card);margin-top:16px}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-top:1px solid var(--row-line)}
.sum div:first-child{border-top:0}
.sum span:first-child{color:var(--mute)}
.sum b{font-weight:600;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:28px;z-index:70;transform:translate(-50%,16px);opacity:0;background:#20242c;color:#fff;padding:11px 16px;border-radius:10px;pointer-events:none;transition:opacity 200ms ease,transform 240ms var(--ease-out)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* tasks */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;border:1px solid var(--hairline);background:#fff;border-radius:999px;padding:0 14px;cursor:pointer;color:var(--body);transition:transform 160ms var(--ease-out)}
.chip:active{transform:scale(.97)}
.chip i{font-style:normal;color:var(--mute)}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.chip.on i{color:var(--accent)}
.chip svg{width:17px;height:17px}
.ck{flex:none;display:grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--faint);border-radius:50%;background:#fff;cursor:pointer;color:#fff;transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease}
.ck:active{transform:scale(.9)}
.ck svg{width:14px;height:14px;opacity:0;transition:opacity 150ms ease}
.ck[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.ck[aria-pressed=true] svg{opacity:1}
tr.done td{color:var(--mute)}
tr.done .name{font-weight:400}
.ms{display:inline-block;width:9px;height:9px;margin-right:8px;transform:rotate(45deg);background:var(--accent);border-radius:2px;vertical-align:1px}
tr.done .ms{background:var(--faint)}
.late{color:var(--bad-fg)}
tr.today td{padding:0 20px;height:34px;background:var(--accent-bg);color:var(--accent);font-weight:600;border-top:1px solid #d6e2fa}
tr.today + tr td{border-top-color:#d6e2fa}
.cbox{width:60px;padding-right:0}

/* project page */
.tabsel{display:none;margin:20px 0 0}
.tabsel select{width:100%;height:44px;border:1px solid var(--hairline);border-radius:var(--r-inner);padding:0 12px;background:#fff}
.lnk{border:0;background:none;padding:0;color:inherit;font-weight:500;cursor:pointer;text-align:left;max-width:100%}
@media (hover:hover) and (pointer:fine){.lnk:hover{color:var(--accent)}}
.page-sec{margin-top:36px}
.kind{color:var(--mute)}
/* the record layer over a project */
.sheet.r2{z-index:58;width:min(600px,calc(100vw - 20px));transform:translateX(calc(100% + 40px))}
.sheet.r2.open{transform:none}
.sheet.r2.over{right:22px;top:calc(var(--ch,52px) + 22px)}
#dim2{z-index:57}
.hero{display:flex;gap:20px;align-items:flex-end}
.hero .ph{width:160px;height:160px;flex:none;border-radius:var(--r-card);display:grid;place-items:center;color:#8e8e93;background:var(--soft-2)}
.hero .ph.on{background:linear-gradient(135deg,#dfe6ef,#c8d3e0)}
.hero .ph svg{width:40px;height:40px}
.doc{height:200px;border-radius:var(--r-card);background:var(--soft-3);display:grid;place-items:center;color:#8e8e93}
.doc svg{width:44px;height:44px}

@media (max-width:900px){
  .rail,.panel{display:none}
  .shell{padding:0;gap:0;background:#fff}
  .page{padding:20px 16px 48px;border-radius:0;box-shadow:none}
  .tabs.many{display:none}
  td.cbox{float:left;width:auto;padding:2px 12px 0 0}
  tr.today{padding:8px 16px;background:var(--accent-bg)}
  tr.today td{height:auto;padding:0;border:0}
  .tabsel.many{display:block}
  .sheet.r2,.sheet.r2.over{right:0;top:calc(var(--ch,52px) + 4px);width:100%}
  .sheet{top:calc(var(--ch,52px) + 4px);right:0;bottom:0;width:100%;border-radius:var(--r-sheet) var(--r-sheet) 0 0}
  .sh-h,.sh-b,.sh-f{padding-left:20px;padding-right:20px}
  .facts,.row2{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  /* tables become stacked rows: nothing scrolls sideways */
  table,tbody,tfoot,tr,td{display:block;width:100%}
  thead{display:none}
  tr{padding:12px 16px;border-top:1px solid var(--row-line)}
  tbody tr:first-child{border-top:0}
  td{padding:2px 0;border:0}
  td.r{text-align:left}
  td[data-l]::before{content:attr(data-l);color:var(--mute);margin-right:8px}
  .kpi{padding:0 16px}
  .search{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.open{transition:opacity 200ms ease}.sheet:not(.open){opacity:0;transform:none;pointer-events:none}}
</style>
</head>
<body>

<div class="chrome">
  <div class="grp"><span>GA</span>
    <button data-view="ga-list">Projects</button>
    <button data-do="chromeRegister" data-press="register">Register asset</button>
  </div>
  <div class="grp"><span>Project</span>
    <button data-opt="sheet">Sheet · now</button>
    <button data-opt="A">A · Tabs</button>
    <button data-opt="B">B · In sidebar</button>
    <button data-opt="C">C · One page</button>
    <button data-opt="D">D · By kind</button>
  </div>
  <div class="grp"><span>Seen by</span>
    <button data-role="ga">GA</button>
    <button data-role="fin">Finance</button>
  </div>
  <div class="grp"><span>Finance</span>
    <button data-view="fin-project">Project costs</button>
    <button data-view="fin-pre">Pre-opening</button>
  </div>
  <div class="grp"><button id="reset">Reset</button></div>
</div>

<main id="app"></main>
<div class="dim" id="dim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside>
<div class="dim" id="dim2"></div>
<aside class="sheet r2" id="sheet2" role="dialog" aria-modal="true"></aside>
<div class="scrim" id="scrim"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ── data ─────────────────────────────────────────────────────────────── */
const TYPES = [
  ['BUILDING', 'Building', '<path d="M4 21V5l8-3 8 3v16M9 21v-5h6v5M8 8h1M15 8h1M8 12h1M15 12h1"/>'],
  ['TECH', 'Technical equipment', '<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>'],
  ['FFE', 'Furniture & fixtures', '<path d="M6 11V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M4 11h16v5H4zM6 16v3M18 16v3"/>'],
  ['IT', 'IT hardware', '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'],
  ['OE', 'Operating equipment', '<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>'],
  ['VEHICLE', 'Vehicle', '<path d="M5 17h14M6 17v2M18 17v2M4 13l2-6h12l2 6v4H4z"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/>'],
  ['AUDIO', 'Audio / music', '<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14" r="3"/><circle cx="12" cy="7.5" r="1"/>'],
  ['SOFTWARE', 'Software', '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>'],
  ['LAND', 'Land', '<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>'],
];
const typeOf = code => TYPES.find(t => t[0] === code);

/* Dates: the prototype's today is 12 Nov 2026; a task's due is counted back
   from the opening (H-n). */
const OPENS = new Date(2026, 10, 15), TODAY = new Date(2026, 10, 12);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dueOf = off => new Date(OPENS.getTime() - off * 864e5);
const dm = d => `${String(d.getDate()).padStart(2, '0')} ${MON[d.getMonth()]}`;
const PEOPLE = [['Nina Oktaviani', 'GA'], ['Dian Pertiwi', 'GA'], ['Hari Santoso', 'Stores'], ['Sari Wulandari', 'HR'], ['Rudi Hartono', 'Merchandise'], ['Maya Anggraini', 'Marketing']];
/* The client's own checklist for a new store, as the template a project of
   that kind starts from. Off = days before the opening. */
const STORE_OPENING = [
  ['Tanda tangan kontrak kontraktor', 'Nina Oktaviani', 48],
  ['Renovasi mulai', 'Nina Oktaviani', 45, true],
  ['Izin PBG & reklame', 'Dian Pertiwi', 30],
  ['Pesan AC, rak dan PC kasir', 'Nina Oktaviani', 21],
  ['Buat toko di Stores', 'Hari Santoso', 14],
  ['Rekrut tim & rekam sidik jari', 'Sari Wulandari', 10],
  ['Training kasir', 'Dian Pertiwi', 7],
  ['HO approve POS', 'Hari Santoso', 5],
  ['Serah terima dari kontraktor', 'Nina Oktaviani', 3, true],
  ['Stok pertama tiba dari DC', 'Rudi Hartono', 3],
  ['Signage & promo opening', 'Maya Anggraini', 2],
  ['Toko buka', 'Nina Oktaviani', 0, true],
];
const DONE_ON = { 0: '28 Sep', 1: '01 Oct', 2: '15 Oct', 3: '28 Oct', 4: '30 Oct', 5: '05 Nov', 6: '08 Nov' };
const svg = (d, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

function fresh() {
  return {
    view: 'ga-list',
    tab: 'open',
    opt: 'A',                  // how a project opens: sheet · A · B · C · D
    role: 'ga',                // whose eyes: GA or Finance
    ptab: '',                  // the project page's tab
    rec: null,                 // the record open over it: 'asset:a1', 'work:w2', 'file:f1', 'cost:c4'
    dlg: null,

/* ── the project as a page: A · B · C · D ─────────────────────────────── */
const KINDS = [['contracts', 'Contract', 'Contracts'], ['repairs', 'Repair', 'Repairs'], ['supplies', 'Supply request', 'Supply requests'], ['claims', 'Claim', 'Claims']];
const costBy = k => S.costs.filter(c => k(c.to)).reduce((s, c) => s + c.amt, 0);
const fileIcon = '<path d="M7 3h7l5 5v13H7zM14 3v5h5"/>';
const imgIcon = '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>';

function pageTabs() {
  const fin = S.role === 'fin';
  const t = [];
  if (fin) t.push(['costs', 'Costs', S.costs.length]);
  else t.push(['tasks', 'Tasks', tasksLeft().length]);
  if (S.opt === 'D') {
    t.push(['all', 'All', S.assets.length + S.records.length + S.files.length]);
    t.push(['assets', 'Assets', S.assets.length]);
    KINDS.forEach(([key, kind, label]) => t.push([key, label, S.records.filter(r => r.kind === kind).length]));
    t.push(['files', 'Files', S.files.length]);
  } else {
    t.push(['assets', 'Assets', S.assets.length], ['work', 'Work', S.records.length], ['files', 'Files', S.files.length]);
  }
  return t;
}

function assetsTable(fin) {
  return `<div class="frame"><table>
    <thead><tr><th style="width:46%">Asset</th><th>Type</th><th class="r" style="width:80px">Qty</th>${fin ? '<th class="r" style="width:170px">Cost</th>' : ''}<th style="width:140px">Status</th></tr></thead>
    <tbody>${S.assets.map(a => `<tr class="link" data-rec="asset:${a.id}">
      <td><span class="who">${thumb(a)}<span style="min-width:0"><span class="name trunc">${esc(a.name)}</span><span class="g">${a.no}</span></span></span></td>
      <td data-l="Type">${typeOf(a.type)[1]}</td><td class="r" data-l="Qty">${a.qty}</td>
      ${fin ? `<td class="r" data-l="Cost">${rp(costBy(t => t === a.id))}</td>` : ''}<td>${st(assetState())}</td></tr>`).join('')}</tbody>

}
function workTable(rows) {

  return `<div class="frame"><table>
    <thead><tr><th style="width:52%">What</th><th>Kind</th><th style="width:220px">Where it stands</th></tr></thead>
    <tbody>${rows.map(r => `<tr class="link" data-rec="work:${r.id}">
      <td><span class="who"><span class="thumb">${svg(r.icon)}</span><span style="min-width:0"><span class="name trunc">${esc(r.name)}</span><span class="g">${esc(r.who)}</span></span></span></td>
      <td data-l="Kind">${r.kind}</td><td>${r.state}</td></tr>`).join('')}</tbody>

}
function filesTable() {

      <td><span class="who"><span class="thumb">${svg(f.type === 'Image' ? imgIcon : fileIcon)}</span><span style="min-width:0"><span class="name trunc">${esc(f.name)}</span><span class="g">${f.type} · ${f.size}</span></span></span></td>
      <td data-l="Added">${f.on}</td><td data-l="By">${esc(f.by)}</td></tr>`).join('')}</tbody>

}
function allTable() {

    <tbody>${rows.map(r => `<tr class="link" data-rec="${r.rec}">

function costsTable() {
  const closed = S.status === 'CAPITALISED';
  const opts = c => [['', 'Choose…'], ...S.assets.map(a => [a.id, `${a.name}${a.qty > 1 ? ' × ' + a.qty : ''}`]), ['PRE', 'Pre-opening'], ['EXP', 'Expense']]

  const goesWord = t => t === 'PRE' ? 'Pre-opening' : t === 'EXP' ? 'Expense' : S.assets.find(a => a.id === t)?.name ?? '—';

    <tbody>${S.costs.map(c => `<tr>

      <td><button class="lnk trunc" data-rec="cost:${c.id}">${esc(c.what)}</button><span class="g">${esc(c.who)}</span></td>
      <td class="r" data-l="Amount">${rp(c.amt)}</td>
      <td>${closed ? esc(goesWord(c.to)) : `<select class="goes ${c.to ? '' : 'empty'}" data-goes="${c.id}">${opts(c)}</select>`}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="3">Total</td><td class="r">${rp(total)}</td><td></td></tr></tfoot>

/* What a tab or a section holds, and the one action its bar carries. */
function body(key) {
  if (key === 'costs') return costsTable();
  if (key === 'tasks') return tasksBlock();
  if (key === 'assets') return assetsTable(S.role === 'fin');
  if (key === 'work') return workTable(S.records);
  if (key === 'files') return filesTable();
  if (key === 'all') return allTable();
  const kind = KINDS.find(k => k[0] === key)?.[1];
  return workTable(S.records.filter(r => r.kind === kind));
}
function barAction(key) {
  if (S.role === 'fin' || S.status !== 'OPEN') return '';
  if (key === 'assets') return `<button class="btn primary sm" data-do="register">${svg(ICON.plus)}Register asset</button>`;
  if (key === 'tasks') return `<button class="btn primary sm" data-do="newTask">${svg(ICON.plus)}Add task</button>`;
  if (key === 'files') return `<button class="btn primary sm" data-do="addFile">${svg(ICON.plus)}Add file</button>`;
  if (key === 'work' || key === 'all') return `<button class="btn primary sm" data-do="newWork">${svg(ICON.plus)}Add work</button>`;
  const kind = KINDS.find(k => k[0] === key);
  if (kind) return `<button class="btn primary sm" data-do="newWork" data-kind="${kind[1]}">${svg(ICON.plus)}Add ${kind[1].toLowerCase()}</button>`;
  return '';
}

function projectPage() {
  const fin = S.role === 'fin';
  const total = S.costs.reduce((s, c) => s + c.amt, 0), left = costBy(t => t === '');
  let act = '';
  if (!fin && S.status === 'OPEN') act = `<button class="btn primary" data-do="gaClose">Close project</button>`;
  if (fin && S.status !== 'CAPITALISED') act = `<button class="btn primary" data-do="closeProject" ${left === 0 && S.status === 'CLOSED' ? '' : 'disabled'}>Capitalise</button>`;
  const banner = S.status === 'CLOSED'
    ? `<div class="banner"><span><b>Closed by ${esc(S.handedBy)} · ready 14 Nov</b></span></div>`
    : S.status === 'CAPITALISED' ? `<div class="banner"><span><b>Capitalised by ${esc(S.closedBy)} · 16 Nov</b> <span class="why">· assets in use from ${P.opens}</span></span></div>`
    : fin ? `<div class="banner"><span><b>GA has not closed it yet</b></span></div>` : '';
  const kpis = fin
    ? `<div class="kpi"><small>Collected</small><b>${rp(total)}</b></div>
       <div class="kpi"><small>To assets</small><b>${rp(costBy(t => t.startsWith('a')))}</b></div>

       <div class="kpi"><small>Expense</small><b>${rp(costBy(t => t === 'EXP'))}</b></div>
       ${S.status === 'CAPITALISED' ? '' : `<div class="kpi"><small>Not split</small><b class="${left ? 'warn' : ''}">${rp(left)}</b></div>`}`
    : `<div class="kpi"><small>Opens</small><b>${P.opens}</b></div>
       <div class="kpi"><small>Tasks left</small><b>${tasksLeft().length}</b></div>
       <div class="kpi"><small>Late</small><b class="${tasksLate().length ? 'late' : ''}">${tasksLate().length}</b></div>

       <div class="kpi"><small>Work</small><b>${S.records.length}</b></div>`;
  const head = `
    <div class="crumb">${fin ? 'Assets / Projects' : 'Projects'}</div>

      <div class="acts">${act}</div></div>
    ${banner}
    <div class="kpis">${kpis}</div>`;

  let main;
  if (S.opt === 'C') {
    // C · no tabs: every part on one page, one under another.
    const parts = [...(fin ? [['costs', 'Costs', S.costs.length]] : [['tasks', 'Tasks', tasksLeft().length]]), ['assets', 'Assets', S.assets.length], ['work', 'Work', S.records.length], ['files', 'Files', S.files.length]];
    main = parts.map(([key, label, n]) => `<section class="page-sec">
      <div class="sec"><h3>${label}<span>${n}</span></h3>${barAction(key)}</div>${body(key)}</section>`).join('');
  } else {
    const tabs = pageTabs();
    if (!tabs.some(t => t[0] === S.ptab)) S.ptab = tabs[0][0];
    const many = tabs.length > 3 ? 'many' : '';
    main = `
      <div class="tabs ${many}">${tabs.map(([k, l, n]) => `<button class="${S.ptab === k ? 'on' : ''}" data-ptab="${k}">${l}<i>${n}</i></button>`).join('')}</div>
      <div class="tabsel ${many}"><select data-ptabsel>${tabs.map(([k, l, n]) => `<option value="${k}" ${S.ptab === k ? 'selected' : ''}>${l} · ${n}</option>`).join('')}</select></div>
      <div class="bar"><input class="search" placeholder="Search ${tabs.find(t => t[0] === S.ptab)[1].toLowerCase()}">${barAction(S.ptab) ? `<span style="margin-left:auto">${barAction(S.ptab)}</span>` : ''}</div>
      ${body(S.ptab)}`;
  }
  return (fin ? finShell : gaShell)(head + main);
}

/* ── tasks ─────────────────────────────────────────────────────────────── */
const tasksLeft = () => S.tasks.filter(t => !t.done);
const tasksLate = () => S.tasks.filter(t => !t.done && dueOf(t.off) < TODAY);
const deptOf = who => PEOPLE.find(p => p[0] === who)?.[1] ?? 'GA';
const tick = '<path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="2.4"/>';
function tasksBlock() {
  const ro = S.role === 'fin' || S.status !== 'OPEN';
  const all = [...S.tasks].sort((a, b) => b.off - a.off);
  const n = { all: all.length, open: tasksLeft().length, late: tasksLate().length, done: all.length - tasksLeft().length };
  const shown = all.filter(t => S.tf === 'all' || (S.tf === 'open' && !t.done) || (S.tf === 'done' && t.done) || (S.tf === 'late' && !t.done && dueOf(t.off) < TODAY));
  const chip = (k, label, icon) => `<button class="chip ${S.tf === k ? 'on' : ''}" data-tf="${k}">${svg(icon)}${label}<i>${n[k]}</i></button>`;
  let rows = '', todayDrawn = S.tf === 'done' || S.tf === 'late';
  for (const t of shown) {
    const due = dueOf(t.off);
    if (!todayDrawn && due >= TODAY) { rows += `<tr class="today"><td colspan="4">Today · ${dm(TODAY)}</td></tr>`; todayDrawn = true; }
    const late = !t.done && due < TODAY;
    rows += `<tr class="link ${t.done ? 'done' : ''}" data-rec="task:${t.id}">
      <td class="cbox"><button class="ck" data-ck="${t.id}" aria-pressed="${!!t.done}" aria-label="Done" ${ro ? 'disabled' : ''}>${svg(tick)}</button></td>
      <td><span class="name trunc">${t.ms ? '<i class="ms"></i>' : ''}${esc(t.name)}</span><span class="g">${deptOf(t.who)}</span></td>
      <td data-l="PIC"><span class="trunc">${esc(t.who)}</span></td>
      <td data-l="Due"><span class="${late ? 'late' : ''}">${dm(due)}</span><span class="g">${t.done ? 'Done ' + t.done : t.off === 0 ? 'Opening day' : 'H-' + t.off}</span></td></tr>`;
  }
  if (!todayDrawn && S.tf !== 'done') rows += `<tr class="today"><td colspan="4">Today · ${dm(TODAY)}</td></tr>`;
  return `<div class="chips">
      ${chip('open', 'To do', '<circle cx="12" cy="12" r="8"/>')}
      ${chip('late', 'Late', '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>')}
      ${chip('done', 'Done', '<circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>')}
      ${chip('all', 'All', '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>')}
    </div>
    <div class="frame"><table>
      <thead><tr><th class="cbox"></th><th>Task</th><th style="width:200px">PIC</th><th style="width:150px">Due</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

/* ── a record over the project: asset, work, file, bill ──────────────── */
function recordSheet() {
  const [kind, id] = S.rec.split(':');
  const fin = S.role === 'fin';
  const facts = rows => `<dl class="facts" style="margin:0">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  let crumb, title, badge = '', inner, foot = '';
  if (kind === 'asset') {
    const a = S.assets.find(x => x.id === id);
    crumb = `${P.name} / ${a.no}`; title = a.name; badge = st(assetState());
    inner = `<div class="hero"><span class="ph ${a.photo ? 'on' : ''}">${svg(typeOf(a.type)[2])}</span>${a.photo ? '' : `<button class="act">${svg(ICON.cam)}Add photo</button>`}</div>
      ${facts([['Type', typeOf(a.type)[1]], ['Quantity', a.qty], ['Site', P.site], ['Project', P.name], ['Registered', a.on + ' 2026'], ['Registered by', 'Nina Oktaviani'], ...(fin ? [['Cost', rp(costBy(t => t === a.id))]] : [])])}`;
  } else if (kind === 'work') {
    const r = S.records.find(x => x.id === id);
    crumb = `${P.name} / ${r.kind}`; title = r.name; badge = `<span class="st faint">${r.state}</span>`;
    inner = facts([['Kind', r.kind], ...r.facts, ['Project', P.name]]);
  } else if (kind === 'task') {
    const t = S.tasks.find(x => x.id === id);
    const due = dueOf(t.off), late = !t.done && due < TODAY;
    const where = { Stores: 'Stores › Wonosobo', HR: 'HR › Employees', Merchandise: 'Merchandise › Allotments', Marketing: 'Marketing › Promotions' }[deptOf(t.who)];
    crumb = `${P.name} / Tasks`; title = t.name;
    badge = t.done ? '<span class="st ok">Done</span>' : late ? '<span class="st bad">Late</span>' : '<span class="st info">To do</span>';
    inner = facts([['PIC', t.who], ['Department', deptOf(t.who)], ['Due', `${dm(due)} 2026 · ${t.off ? 'H-' + t.off : 'opening day'}`], ['Done', t.done ? t.done + ' 2026' : '—'],
      ['From', t.from === 'template' ? 'Store opening template' : 'Added by Nina Oktaviani'], ...(t.ms ? [['Milestone', 'Yes']] : []),
      ...(where ? [['Done in', `<button class="act">${where}</button>`]] : [])]);
    foot = S.role === 'fin' || S.status !== 'OPEN' ? '' : `<div class="sh-f"><button class="btn primary" data-ck="${t.id}">${t.done ? 'Not done' : 'Mark done'}</button></div>`;
  } else if (kind === 'file') {
    const f = S.files.find(x => x.id === id);
    crumb = `${P.name} / Files`; title = f.name;
    inner = `<div class="doc">${svg(f.type === 'Image' ? imgIcon : fileIcon)}</div>${facts([['Type', f.type], ['Size', f.size], ['Added', f.on + ' 2026'], ['Added by', f.by]])}`;
  } else {
    const c = S.costs.find(x => x.id === id);
    const to = c.to === 'PRE' ? 'Pre-opening' : c.to === 'EXP' ? 'Expense' : S.assets.find(a => a.id === c.to)?.name ?? 'Not split';
    crumb = `${P.name} / ${c.from}`; title = c.what;
    inner = facts([['From', c.from], ['Supplier', c.who], ['Date', c.on + ' 2026'], ['Amount', rp(c.amt)], ['Goes to', to], ['Project', P.name]]);
  }
  return `
    <div class="sh-h"><div>
      <div class="crumb">${esc(crumb)}</div>
      <div class="head"><h1>${esc(title)} ${badge}</h1></div></div>
      <button class="x" data-do="closeRec" aria-label="Close">${svg(ICON.x)}</button></div>
    <div class="sh-b">${inner}</div>${foot}`;
}

/* ── render ───────────────────────────────────────────────────────────── */
// The chrome wraps on a narrow window; the sheets start under it.
const chromeHeight = () => document.documentElement.style.setProperty('--ch', document.querySelector('.chrome').offsetHeight + 'px');
addEventListener('resize', chromeHeight);
function render() {
  chromeHeight();
  const v = S.view;
  document.querySelectorAll('.chrome [data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v && S.dlg !== 'register'));
  document.querySelectorAll('.chrome [data-press]').forEach(b => b.setAttribute('aria-pressed', S.dlg === 'register'));
  document.querySelectorAll('.chrome [data-opt]').forEach(b => b.setAttribute('aria-pressed', b.dataset.opt === S.opt && (v === 'project' || v === 'ga-project')));
  document.querySelectorAll('.chrome [data-role]').forEach(b => b.setAttribute('aria-pressed', b.dataset.role === S.role));
  $('#app').innerHTML = v === 'fin-project' ? finPage() : v === 'fin-pre' ? prePage() : v === 'project' ? projectPage() : gaList();

  const sheetOpen = v === 'ga-project';
  if (sheetOpen) $('#sheet').innerHTML = gaSheet();
  $('#sheet').classList.toggle('open', sheetOpen);
  $('#dim').classList.toggle('open', sheetOpen);

  if (S.rec) $('#sheet2').innerHTML = recordSheet();
  $('#sheet2').classList.toggle('open', !!S.rec);
  $('#sheet2').classList.toggle('over', sheetOpen);
  $('#dim2').classList.toggle('open', !!S.rec);

  const dlg = S.dlg === 'register' ? registerDlg() : S.dlg === 'close' ? closeDlg() : S.dlg === 'work' ? workDlg() : S.dlg === 'gaclose' ? gaCloseDlg() : S.dlg === 'task' ? taskDlg() : S.dlg === 'newproject' ? newProjectDlg() : '';
  if (dlg) $('#dlg').innerHTML = dlg;
  $('#scrim').classList.toggle('open', !!dlg);
}
function go(view) { S.view = view; S.dlg = null; S.rec = null; render(); }
function openProject() { go(S.opt === 'sheet' ? 'ga-project' : 'project'); }
function back() {
  if (S.dlg) S.dlg = null;
  else if (S.rec) S.rec = null;
  else if (S.view === 'ga-project') S.view = 'ga-list';
  render();
}

document.addEventListener('click', e => {
  if (e.target.id === 'scrim') { S.dlg = null; render(); return; }
  if (e.target.id === 'dim2') { S.rec = null; render(); return; }
  if (e.target.id === 'dim') { go('ga-list'); return; }
  const el = e.target.closest('[data-view],[data-do],[data-tab],[data-ptab],[data-type],[data-wkind],[data-npkind],[data-ck],[data-tf],[data-opt],[data-role],[data-rec],#reset');
  if (!el) return;
  if (el.id === 'reset') { S = fresh(); render(); return; }
  if (el.dataset.view) return go(el.dataset.view);
  if (el.dataset.opt) { S.opt = el.dataset.opt; return openProject(); }
  if (el.dataset.role) {
    S.role = el.dataset.role; S.ptab = '';
    if (S.view !== 'project') S.view = 'project';
    if (S.opt === 'sheet') S.opt = 'A';
    S.rec = null; render(); return;
  }
  if (el.dataset.ck) {
    const t = S.tasks.find(x => x.id === el.dataset.ck);
    t.done = t.done ? '' : dm(TODAY);
    render(); toast(t.done ? `Done · ${t.name}` : `Not done · ${t.name}`); return;
  }
  if (el.dataset.tf) { S.tf = el.dataset.tf; render(); return; }
  if (el.dataset.npkind) { S.np.kind = el.dataset.npkind; render(); return; }
  if (el.dataset.rec) { e.stopPropagation(); S.rec = el.dataset.rec; render(); return; }
  if (el.dataset.tab) { S.tab = el.dataset.tab; render(); return; }
  if (el.dataset.ptab) { S.ptab = el.dataset.ptab; render(); return; }
  if (el.dataset.type) { S.reg.type = el.dataset.type; render(); return; }
  if (el.dataset.wkind) { S.wk.kind = el.dataset.wkind; render(); return; }
  const d = el.dataset.do;
  if (d === 'openProject') { S.role = 'ga'; openProject(); }
  if (d === 'closeSheet') go('ga-list');
  if (d === 'closeRec') { S.rec = null; render(); }
  if (d === 'register') { S.dlg = 'register'; render(); }
  if (d === 'chromeRegister') { S.role = 'ga'; if (S.view !== 'project' && S.view !== 'ga-project') S.view = S.opt === 'sheet' ? 'ga-project' : 'project'; S.dlg = 'register'; render(); }
  if (d === 'newProject') { S.dlg = 'newproject'; render(); }
  if (d === 'saveProject') {
    const n = S.np, count = n.kind === 'Store opening' ? STORE_OPENING.length : 6;
    S.made.unshift({ id: 'p' + (9 + S.made.length), no: 'PRJ-000' + (4 + S.made.length), name: n.name.trim(), site: n.site, kind: n.kind, opens: n.opens, assets: 0, status: 'OPEN' });
    S.dlg = null; S.tab = 'open'; render(); toast(`${n.name.trim()} created · ${count} tasks`);
  }
  if (d === 'newTask') { S.tk = { name: '', who: 'Nina Oktaviani', off: 4 }; S.dlg = 'task'; render(); }
  if (d === 'saveTask') {
    S.tasks.push({ id: 't' + (S.tasks.length + 1), name: S.tk.name.trim(), who: S.tk.who, off: Number(S.tk.off), ms: false, done: '', from: 'added' });
    S.dlg = null; S.tf = 'open'; render(); toast('Task added');
  }
  if (d === 'addFile') { S.files.push({ id: 'f' + (S.files.length + 1), name: 'Foto serah terima', type: 'Image', size: '1,6 MB', on: '14 Nov', by: 'Nina Oktaviani' }); render(); toast('File added'); }
  if (d === 'closeDlg') { S.dlg = null; render(); }
  if (d === 'saveAsset') {
    const n = 47 + S.assets.length;
    S.assets.push({ id: 'a' + (S.assets.length + 1), on: '12 Nov', no: 'AST-0000' + n, name: S.reg.name.trim(), type: S.reg.type, qty: Number(S.reg.qty) || 1, photo: false });
    S.reg = { ...S.reg, name: '', qty: 1 };
    S.dlg = null; S.ptab = 'assets'; render(); toast('Asset registered · In project');
  }
  if (d === 'gaClose') { S.dlg = 'gaclose'; render(); }
  if (d === 'handOver') { S.status = 'CLOSED'; S.handedBy = 'Nina Oktaviani'; S.dlg = null; render(); toast('Project closed'); }
  if (d === 'newWork') { S.wk = { kind: el.dataset.kind || 'Contract', name: '', who: '' }; S.dlg = 'work'; render(); }
  if (d === 'saveWork') {
    const k = WORK_KINDS.find(x => x[0] === S.wk.kind);
    S.records.push({ id: 'w' + (S.records.length + 1), kind: k[0], name: S.wk.name.trim(), who: S.wk.who.trim() || '—', state: k[2], icon: k[3],
      facts: [[k[1], S.wk.who.trim() || '—'], ['Added', '12 Nov 2026'], ['Added by', 'Nina Oktaviani']] });
    S.dlg = null; render(); toast(`${k[0]} added to ${P.name}`);
  }
  if (d === 'closeProject') { S.dlg = 'close'; render(); }
  if (d === 'confirmClose') { S.status = 'CAPITALISED'; S.closedBy = 'Rina Kusuma'; S.dlg = null; render(); toast(`Capitalised · ${S.assets.length} assets in use`); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.goes) { S.costs.find(c => c.id === t.dataset.goes).to = t.value; render(); }
  if (t.hasAttribute('data-ptabsel')) { S.ptab = t.value; render(); }
  if (t.dataset.reg) { S.reg[t.dataset.reg] = t.value; render(); }
  if (t.hasAttribute('data-months')) S.months = Number(t.value);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.tk) {
    S.tk[t.dataset.tk] = t.dataset.tk === 'off' ? Number(t.value) : t.value;
    const b = document.querySelector('[data-do="saveTask"]');
    if (b) b.disabled = !S.tk.name.trim();
  }
  if (t.dataset.np) {
    S.np[t.dataset.np] = t.value;
    const b = document.querySelector('[data-do="saveProject"]');
    if (b) b.disabled = !S.np.name.trim();
  }
  if (t.dataset.wk) {
    S.wk[t.dataset.wk] = t.value;
    const b = document.querySelector('[data-do="saveWork"]');
    if (b) b.disabled = !S.wk.name.trim();
  }
  if (t.dataset.reg === 'name' || t.dataset.reg === 'qty') {
    S.reg[t.dataset.reg] = t.value;
    const b = document.querySelector('[data-do="saveAsset"]');
    if (b) b.disabled = !S.reg.name.trim();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') back(); });
render();
</script>
</body>
</html>
