<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inventory menu options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Inventory menu: today, five options, and the research behind them.
   Look: hub v2 · E Quiet (hub-v2-prototype.html). Inter 14, 36px controls,
   52px rows, Poppins only for the 28px title and figures. No chips, status is
   a dot and a word, colour only on exceptions. Nothing below 14px.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --font-ui:"Inter",system-ui,-apple-system,sans-serif;
  --font-display:"Poppins","Inter",system-ui,sans-serif;
  --canvas:#f7f8fa; --surface:#fff; --well:#f6f7f9; --side:#f8f9fb;
  --hairline:#e7eaf0; --rule:#eef0f4; --line-ctl:#d3d8e0;
  --ink-900:#20242c; --ink-800:#2b313c; --ink-700:#394150; --ink-600:#4a5261; --ink-500:#626b78; --ink-400:#737c89; --ink-300:#aab1bb; --ink-200:#d5dae1;
  --primary:#2563eb; --primary-ink:#1d4ed8; --primary-soft:#eef4ff;
  --sel:#eceff3; --sel-subtle:#f8f9fb;
  --ok:#22a55a; --info:#2563eb; --warn:#d99a2b; --warn-fg:#b45309; --bad:#e25555; --bad-fg:#be123c; --bad-bg:#fcecec;
  --new:#7c3aed;
  --h-ctl:36px; --h-row:52px; --h-nav:36px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --shadow-pop:0 14px 36px -10px rgb(24 39 60/.22),0 2px 6px rgb(24 39 60/.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#15171b; --surface:#1c1f24; --well:#23262c; --side:#191b20;
    --hairline:#2c3038; --rule:#262a31; --line-ctl:#3a3f48;
    --ink-900:#f1f3f6; --ink-800:#e2e5ea; --ink-700:#c9ced6; --ink-600:#b3b9c3; --ink-500:#9aa1ad; --ink-400:#858d99; --ink-300:#5c636e; --ink-200:#3a3f48;
    --primary:#4f83f5; --primary-ink:#8cb0ff; --primary-soft:#1d2a44; --sel:#2a2e36; --sel-subtle:#20232a;
    --warn-fg:#f0b44f; --bad-fg:#ff8a8a; --bad-bg:#3a1f22; --new:#a78bfa;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#15171b; --surface:#1c1f24; --well:#23262c; --side:#191b20;
  --hairline:#2c3038; --rule:#262a31; --line-ctl:#3a3f48;
  --ink-900:#f1f3f6; --ink-800:#e2e5ea; --ink-700:#c9ced6; --ink-600:#b3b9c3; --ink-500:#9aa1ad; --ink-400:#858d99; --ink-300:#5c636e; --ink-200:#3a3f48;
  --primary:#4f83f5; --primary-ink:#8cb0ff; --primary-soft:#1d2a44; --sel:#2a2e36; --sel-subtle:#20232a;
  --warn-fg:#f0b44f; --bad-fg:#ff8a8a; --bad-bg:#3a1f22; --new:#a78bfa;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas)}
body{font:400 14px/20px var(--font-ui);color:var(--ink-700);-webkit-font-smoothing:antialiased;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ── Prototype bar: which option is on screen ─────────────────────────── */
.proto{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--hairline)}
.proto .t{font-weight:600;color:var(--ink-900);white-space:nowrap}
.proto .t span{color:var(--ink-400);font-weight:400}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--well);overflow-x:auto;scrollbar-width:none}
.seg button{height:30px;padding:0 12px;border-radius:8px;color:var(--ink-500);font-weight:500;white-space:nowrap;transition:background-color .2s var(--ease-out),color .2s}
.seg button:hover{color:var(--ink-900)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink-900);box-shadow:0 1px 2px rgb(24 39 60/.1),0 0 0 1px var(--hairline)}
.seg button .star{color:var(--primary)}
.proto .sp{flex:1}
.proto .theme{height:30px;padding:0 10px;border-radius:8px;color:var(--ink-500)}
.proto .theme:hover{background:var(--well);color:var(--ink-900)}

/* ── The hub shell ───────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:256px minmax(0,1fr) 340px;min-height:calc(100vh - 51px)}
.side{background:var(--side);border-right:1px solid var(--hairline);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:51px;height:calc(100vh - 51px);overflow:auto}
.chip{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.mark{width:28px;height:28px;border-radius:8px;background:#111114;color:#fff;display:grid;place-items:center;font:600 15px/1 var(--font-display);position:relative}
.mark::after{content:"";position:absolute;right:5px;bottom:6px;width:5px;height:5px;border-radius:50%;background:#2563eb}
.chip b{font-weight:600;color:var(--ink-900)}
.chip small{display:block;font-size:14px;color:var(--ink-400)}
.row{display:flex;align-items:center;gap:10px;height:var(--h-nav);padding:0 8px;border-radius:9px;color:var(--ink-600);font-weight:500;white-space:nowrap;text-align:left;width:100%;transition:background-color .15s var(--ease-out),color .15s}
.row:hover{background:var(--well);color:var(--ink-900)}
.row .i{color:var(--ink-400)}
.row.dim{color:var(--ink-400)}
.row.gone{color:var(--ink-300);text-decoration:line-through;text-decoration-color:var(--ink-300)}
.row.dep{color:var(--ink-900);font-weight:600}
.row.dep .i{color:var(--ink-900)}
.row .ct{margin-left:auto;font-weight:500;color:var(--ink-400)}
.row .ct.bad{color:var(--bad-fg)}
.subs{position:relative;margin:2px 0 6px 17px;padding-left:12px;border-left:1px solid var(--hairline);display:flex;flex-direction:column;gap:1px}
.sub{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border-radius:8px;color:var(--ink-600);text-align:left;width:100%;transition:background-color .15s,color .15s}
.sub:hover{background:var(--well);color:var(--ink-900)}
.sub[aria-current]{background:var(--sel);color:var(--ink-900);font-weight:600}
.sub .ct{margin-left:auto;font-weight:500;color:var(--ink-400)}
.sub .ct.bad{color:var(--bad-fg)}
.sub .nw{margin-left:auto;color:var(--new);font-weight:500}
.grp{padding:10px 10px 2px;color:var(--ink-400);font-weight:500}
.subs .anim{animation:sub-in .32s var(--ease-out) both}
@keyframes sub-in{from{opacity:0;transform:translateY(-4px)}}

/* ── Page ─────────────────────────────────────────────────────────────── */
main{min-width:0;padding:28px 32px 64px}
.page{animation:page-in .28s var(--ease-out)}
@keyframes page-in{from{opacity:0;transform:translateY(6px)}}
.crumb{color:var(--ink-400)}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head .tx{flex:1;min-width:260px}
.h1{margin-top:2px;font:600 28px/36px var(--font-display);letter-spacing:-.025em;color:var(--ink-900)}
.desc{margin-top:4px;color:var(--ink-500);max-width:640px}
.desc .nwt{color:var(--new);font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:var(--h-ctl);padding:0 14px;border-radius:10px;font-weight:500;white-space:nowrap;transition:background-color .2s,transform .16s var(--ease-out)}
.btn:active{transform:scale(.98)}
.btn-g{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-ctl);color:var(--ink-700)}
.btn-g:hover{background:var(--well)}
.btn-g .i{color:var(--ink-400)}
.btn-p{background:var(--primary);color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgb(255 255 255/.18),0 0 0 1px rgb(0 0 0/.08)}
.btn-p:hover{background:var(--primary-ink)}
:root[data-theme=dark] .btn-p:hover{background:#3b6ee0}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--hairline);border-radius:14px;background:var(--surface);margin-bottom:20px}
.fig{padding:16px 20px}
.fig+.fig{border-left:1px solid var(--rule)}
.fig .l{color:var(--ink-500)}
.fig .v{margin-top:2px;font:600 30px/38px var(--font-display);letter-spacing:-.03em;color:var(--ink-900);font-variant-numeric:tabular-nums}
.fig .s{color:var(--ink-400)}
.panel{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;height:var(--h-ctl);padding:0 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-ctl);color:var(--ink-400)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink-900)}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;height:var(--h-ctl);padding:0 34px 0 12px;border-radius:10px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-ctl);color:var(--ink-800);font-weight:500;cursor:pointer}
.sel select:hover{background:var(--well)}
.sel .i{position:absolute;right:10px;pointer-events:none;color:var(--ink-400);width:16px;height:16px}
.fcount{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:999px;background:var(--well);color:var(--ink-700);font-weight:600}
.h2{padding:14px 16px 4px;font-weight:600;color:var(--ink-900);font-size:15px}
table{width:100%;border-collapse:collapse}
th{height:40px;padding:0 16px;text-align:left;font-weight:500;color:var(--ink-500);border-bottom:1px solid var(--hairline);white-space:nowrap}
td{height:var(--h-row);padding:0 16px;border-bottom:1px solid var(--rule);color:var(--ink-700);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--sel-subtle)}
.t1{color:var(--ink-900);font-weight:500}
.t2{color:var(--ink-400)}
.mono{font-variant-numeric:tabular-nums;color:var(--ink-500)}
.neg{color:var(--bad-fg);font-weight:600}
.dot{display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--ink-600)}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-300)}
.dot.ok::before{background:var(--ok)} .dot.info::before{background:var(--info)}
.dot.warn{color:var(--warn-fg)} .dot.warn::before{background:var(--warn)}
.dot.bad{color:var(--bad-fg)} .dot.bad::before{background:var(--bad)}
.go{color:var(--primary-ink);font-weight:500}
.tw{overflow-x:auto}
.foot{padding:12px 16px;color:var(--ink-400);border-top:1px solid var(--rule)}
.list .it{display:flex;align-items:center;gap:14px;min-height:var(--h-row);padding:10px 16px;border-top:1px solid var(--rule)}
.list .it:first-child{border-top:0}
.list .it .tx{flex:1;min-width:0}
.list .it .i{color:var(--ink-400)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.picker .it{border-right:1px solid var(--rule)}

/* ── Stock card sheet ────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgb(247 248 250/.6);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s var(--ease-out)}
:root[data-theme=dark] .scrim{background:rgb(0 0 0/.45)}
.sheet{position:fixed;top:12px;right:12px;bottom:12px;width:min(520px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--hairline);border-radius:18px;box-shadow:var(--shadow-pop);z-index:61;transform:translateX(calc(100% + 24px));transition:transform .36s var(--ease-drawer);display:flex;flex-direction:column;overflow:hidden}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sheet .sh{padding:20px 20px 12px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.sheet .sh .tx{flex:1}
.sheet .sh .h1{font-size:22px;line-height:30px}
.sheet .x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-500)}
.sheet .x:hover{background:var(--well)}
.sheet .sb{overflow:auto;padding:4px 0 20px}
.sheet .h2{padding:18px 20px 6px}
.sheet td,.sheet th{padding:0 20px}

/* ── Right column: what this option is ───────────────────────────────── */
.about{border-left:1px solid var(--hairline);background:var(--surface);padding:24px 20px 48px;position:sticky;top:51px;height:calc(100vh - 51px);overflow:auto}
.about .k{color:var(--ink-400)}
.about h3{margin-top:2px;font:600 20px/28px var(--font-display);color:var(--ink-900);letter-spacing:-.015em}
.about p{margin-top:8px;color:var(--ink-600)}
.about .meta{display:flex;gap:16px;margin-top:14px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.about .meta div{flex:1}
.about .meta b{display:block;font:600 22px/28px var(--font-display);color:var(--ink-900)}
.about .meta span{color:var(--ink-500)}
.about h4{margin-top:20px;font-weight:600;color:var(--ink-900)}
.map{margin-top:6px;display:flex;flex-direction:column}
.map div{display:grid;grid-template-columns:1fr 16px 1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--rule);align-items:start}
.map .a{color:var(--ink-500)}
.map .b{color:var(--ink-900);font-weight:500}
.map .ar{color:var(--ink-300)}
.pc{margin-top:6px;padding-left:18px;color:var(--ink-600)}
.pc li{margin-top:4px}
.rec{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--primary-soft);color:var(--ink-800)}
.rec b{color:var(--primary-ink)}

/* ── Research page ───────────────────────────────────────────────────── */
.research{max-width:1100px;margin:0 auto;padding:32px 24px 72px}
.research .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.research .card{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:16px 18px}
.research .card h3{font-weight:600;color:var(--ink-900);font-size:15px}
.research .card .pat{color:var(--ink-400)}
.research .card .rows{margin-top:8px;color:var(--ink-700)}
.research .card .rows b{font-weight:600;color:var(--ink-900)}
.research .card .why{margin-top:8px;color:var(--ink-500)}
.research .card a{color:var(--primary-ink);text-decoration:none}
.research .card .v{color:var(--ink-400)}
.research table{margin-top:10px}
.research .panel{margin-top:20px}

@media (max-width:1280px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .about{grid-column:2;position:static;height:auto;border-left:0;border-top:1px solid var(--hairline);padding:24px 32px 48px}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--hairline)}
  .side .row:not(.dep){display:none}
  main{padding:20px 16px 48px}
  .about{grid-column:1;padding:20px 16px 40px}
  .figs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fig:nth-child(3){border-left:0}
  .fig:nth-child(n+3){border-top:1px solid var(--rule)}
  .two,.picker,.research .grid{grid-template-columns:minmax(0,1fr)}
  .proto{padding:10px 16px;gap:10px}
  .proto .t span,.proto .theme{display:none}
  .research{padding:24px 16px 56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="proto">
  <div class="t">Inventory menu <span>· prototype</span></div>
  <div class="seg" id="seg" role="group" aria-label="Option"></div>
  <div class="sp"></div>
  <button class="theme" id="theme" title="Light / dark">◐</button>
</div>
<div id="root"></div>
<div id="sheetwrap"><div class="scrim" data-close></div><aside class="sheet" id="sheet" aria-label="Stock card"></aside></div>

<script>
/* ───────────────────────── icons (lucide-ish, inline) ───────────────── */
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',

  truck:'<path d="M2 6h12v10H2zM14 9h4l4 4v3h-8"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
  cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.3h8.6a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/>',
  store:'<path d="M3 9 4.5 4h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/>',

  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  split:'<path d="M16 3h5v5M8 3H3v5M21 3l-7 7M3 3l7 7M12 14v7"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  filter:'<path d="M3 5h18M6 12h12M10 19h4"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  count:'<path d="M9 4h6v3H9z"/><path d="M8 5H5v16h14V5h-3"/><path d="m9 14 2 2 4-4"/>',
  swap:'<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
  ruler:'<path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/>',
  flow:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h5a3 3 0 0 1 3 3v6"/>',
  pin:'<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',

    {h:"Store server", v:r => r.ok ? `<span class="t2">${r.sync}</span>` : dot(r.sync, "warn")},

  if (view === "By place in the Gudang") return table([

  return table([
    {h:"Article", v:r => two(r.a, `${r.c} · ${r.d}`)},

}

    {h:"Pool", v:r => `<span class="mono">${r.p}</span>`}, {h:"Source", v:r => r.src}, {h:"On hand", n:1, v:r => n(r.h)},

const PAGES = {
  overview: overviewPage, stock: stockPage, issues: issuesPage, counts: countsPage, movements: (c) => movementsPage(c),
  setup: (c) => setupPage(c), replenish: replenishPage, allotments: allotmentsPage, transfers: transfersPage,

/* ───────────────────────── the options ─────────────────────────────── */

      {label:"Setup", items:[["e-units","Units"],["e-flows","Goods flows"],["e-places","Places & pools"],["setup","Ledger health"]]},

const ORDER = ["today", "a", "b", "c", "d", "e", "research"]

/* The rest of the sidebar, collapsed, as it is today. */
const MODULES = [
  ["home","Home"],["shirt","Articles"],["box","Inventory"],["split","Allotment"],["cart","Procurement"],["store","Stores"],

]

/* ───────────────────────── render ───────────────────────────────────── */
const state = {opt:"b", page:null, view:{}}
try { const s = JSON.parse(localStorage.getItem("inv-menu") || "{}"); if (OPTIONS[s.opt]) state.opt = s.opt } catch (e) {}

function firstPage(o) { return OPTIONS[o].groups[0].items[0][0] }

function sidebar(o) {
  const opt = OPTIONS[o]
  const inv = opt.groups.map(g => (g.label ? `<div class="grp">${g.label}</div>` : "") + g.items.map(([id, label, ct, cls], i) =>
    `<button class="sub anim" style="animation-delay:${i * 22}ms" data-page="${id}"${state.page === id ? " aria-current=page" : ""}>${label}${ct === "new" ? `<span class="nw">new</span>` : ct ? `<span class="ct ${cls || ""}">${ct}</span>` : ""}</button>`).join("")).join("")
  return `<nav class="side" aria-label="Sidebar"><div class="chip"><span class="mark">C</span><div><b>itulah</b><small>Head office</small></div></div>` +
    MODULES.map(([i, l, ct]) => {
      if (l === "Inventory") return `<button class="row dep">${ic(i)}<span>Inventory</span>${ic("chev")}</button><div class="subs">${inv}</div>`
      if (l === "Allotment" && opt.hideAllotmentModule) return `<button class="row gone" title="Moved into Inventory">${ic(i)}<span>Allotment</span><span class="ct">moved</span></button>`
      return `<button class="row">${ic(i)}<span>${l}</span>${ct ? `<span class="ct">${ct}</span>` : ""}</button>`
    }).join("") + `</nav>`
}

function about(o) {
  const x = OPTIONS[o]
  return `<aside class="about"><div class="k">${o === "today" ? "What we have now" : "Option"}</div><h3>${x.name}${x.star ? " ★" : ""}</h3><p>${x.principle}</p>
    <div class="meta"><div><b>${x.rows}</b><span>sidebar rows</span></div><div><span>Borrowed from</span><div class="t1" style="margin-top:2px">${x.from}</div></div></div>
    <h4>${o === "today" ? "Hidden today" : "Where today's screens go"}</h4><div class="map">${x.map.map(([a, b]) => `<div><span class="a">${a}</span><span class="ar">→</span><span class="b">${b}</span></div>`).join("")}</div>
    <h4>Good</h4><ul class="pc">${x.pros.map(p => `<li>${p}</li>`).join("")}</ul>
    <h4>Costs</h4><ul class="pc">${x.cons.map(p => `<li>${p}</li>`).join("")}</ul>
    ${x.star ? `<div class="rec"><b>Proposed.</b> Five rows, one inbox, the same shape as Finance and HR. Operations keeps the stations, Allotment keeps its row. When min/max and transfers are built, add them as a sixth row, or move to C.</div>` : ""}
  </aside>`
}

  const P = [
    ["Odoo 17/18 Inventory", "Overview + activity buckets", "<b>Overview</b> · <b>Operations</b> (Transfers, Receipts, Deliveries, Physical inventory, Scrap) · <b>Products</b> (Products, Lots/Serials, Reordering rules) · <b>Reporting</b> (Stock, Moves history, Valuation, Forecast) · <b>Configuration</b>", "Dashboard first, then a bucket per activity. Deep, but scales.", "https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/inventory.html", "verified"],
    ["ERPNext v15 Stock", "Workspace of doctype cards", "Shortcuts: Item, Material Request, Stock Entry, Purchase Receipt, Delivery Note, <b>Stock Ledger</b>, <b>Stock Balance</b> · Cards: Items, Stock Transactions, Stock Reports, Settings, Serial & Batch, Tools", "One link per document type and report, equal weight. Fast for experts, no story for anyone else.", "https://github.com/frappe/erpnext/blob/version-15/erpnext/stock/workspace/stock/stock.json", "verified (workspace JSON)"],
    ["Shopify admin", "Object first, 3 rows", "Products › <b>Inventory</b> · <b>Transfers</b> · <b>Purchase orders</b>", "Inventory is a property of products. Lowest load; thin for multi-warehouse and RFID.", "https://help.shopify.com/en/manual/products/inventory", "verified"],
    ["NetSuite", "Transaction type first", "Transactions › Inventory › <b>Adjust inventory</b>, <b>Transfer inventory</b> (each with a list) + an Inventory dashboard of portlets", "Every action is a postable document; dashboard bolted on.", "https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_4660882963.html", "verified"],
    ["SAP Business One", "Document type first", "Item master · Goods receipt · Goods issue · Transfer request · <b>Inventory transfer</b> · Revaluation · <b>Inventory counting</b> · Opening balance · Pick & pack · Reports", "Most granular of the set: one row per document.", "", "well documented"],
    ["Business Central", "Role centre + document lists", "Items · <b>Physical inventory orders</b> · Item journals (adjust, reclassify) · <b>Transfer orders</b> · Item tracking · Warehouse module separate", "Task-shaped docs over lists of documents; warehouse is a separate module (like our Operations).", "https://learn.microsoft.com/en-us/dynamics365/business-central/inventory-manage-inventory", "verified"],
    ["Zoho Inventory", "Sales / Purchases / Inventory split", "Items · Sales · Purchases · Inventory (<b>Adjustments</b>, <b>Transfer orders</b>, Warehouses)", "Inventory holds only what moves stock without a customer or supplier.", "https://www.zoho.com/us/inventory/help/", "approximate"],
    ["Nedap iD Cloud (RFID retail)", "Workflows, not menus", "<b>RFID count</b> · Encode tags · Replenish from stockroom · Display check", "Named after what staff physically do. Our Operations stations already work this way.", "", "approximate"],
  ]
  return `<div class="research page"><div class="crumb">Research · 28 Sep 2026</div><h1 class="h1">How other software lays out Inventory</h1>
    <p class="desc">Ten products checked. Labels marked “approximate” could not be read from a real screen or source; the rest were.</p>
    <div class="grid">${P.map(([t, pat, rows, why, url, v]) => `<div class="card"><h3>${t}</h3><div class="pat">${pat} · <span class="v">${v}</span></div><div class="rows">${rows}</div><div class="why">${why}</div>${url ? `<div style="margin-top:8px"><a href="${url}" target="_blank" rel="noopener">Source</a></div>` : ""}</div>`).join("")}</div>
    <div class="panel"><div class="h2">What almost everyone has</div>${table([{h:"Row", v:r => `<span class="t1">${r[0]}</span>`}, {h:"Seen in", v:r => r[1]}, {h:"Ours today", v:r => r[2]}],
      [["Stock on hand by location", "all ten", "Stock (as pools)"], ["Transfers between locations", "Odoo, Shopify, NetSuite, SAP, BC, Zoho", "Allotment module + Operations; no store→store"],
       ["Adjustments (damage, write-off)", "Odoo (Scrap), NetSuite, SAP, BC, Zoho", "Missing › write off (hidden)"], ["Counts / stock opname", "all ten", "Counts"],
       ["Movement history / stock ledger", "Odoo, ERPNext, NetSuite, SAP, BC", "Movements"], ["Reorder / replenishment", "Odoo, ERPNext, Lightspeed, Katana", "none (gap list)"],
       ["Units, locations, serials/RFID", "always under Settings / Configuration, never a daily row", "two of them are daily rows"]])}</div>
    <div class="panel"><div class="h2">The patterns, and which option borrows each</div>${table([{h:"Pattern", v:r => `<span class="t1">${r[0]}</span>`}, {h:"Who", v:r => r[1]}, {h:"Option", v:r => r[2]}],
      [["Object first, few rows", "Shopify, Katana", "A · Lean"], ["Overview + few buckets", "Odoo", "B · Inbox first ★"], ["Every stock document in Inventory", "Zoho, NetSuite, Cin7", "C · Owns the flow"],
       ["Organised by place", "Odoo Locations, Nedap", "D · By place"], ["One row per document/report", "ERPNext, SAP B1", "E · ERP full"]])}</div>
  </div>`
}

function render() {
  const o = state.opt
  document.getElementById("seg").innerHTML = ORDER.map(k => `<button data-opt="${k}" aria-pressed="${k === o}">${OPTIONS[k].label}${OPTIONS[k].star ? ' <span class="star">★</span>' : ""}</button>`).join("")
  const root = document.getElementById("root")
  if (o === "research") { root.innerHTML = researchPage(); return }
  const ids = OPTIONS[o].groups.flatMap(g => g.items.map(i => i[0]))
  if (!ids.includes(state.page)) state.page = firstPage(o)
  const page = (PAGES[state.page] || (() => ""))({opt:o, view:state.view})
  root.innerHTML = `<div class="app">${sidebar(o)}<main><div class="page">${page}</div></main>${about(o)}</div>`
}

function card(code) {
  const a = ART.find(r => r.c === code); if (!a) return
  const where = [["Gudang · Warehouse", Math.round(a.g * .8)], ["Gudang · Pick area", a.g - Math.round(a.g * .8)], ...STORES.slice(0, 4).map((s, i) => [s.s, Math.round(a.s * [.28, .22, .26, .14][i])]), ["On its way", a.t]]
  document.getElementById("sheet").innerHTML = `<div class="sh"><div class="tx"><div class="crumb">Stock card · ${a.c}</div><h2 class="h1">${a.a}</h2><div class="desc">${n(a.g + a.s + a.t)} pieces · last counted ${a.cnt}</div></div><button class="x" data-close aria-label="Close">${ic("x")}</button></div>
    <div class="sb"><div class="h2">Where it is</div>${table([{h:"Place", v:r => r[0]}, {h:"Pieces", n:1, v:r => n(r[1])}], where.filter(r => r[1]))}
    <div class="h2">Last movements</div>${table([{h:"When", v:r => `<span class="mono">${r.t.slice(0, 6)}</span>`}, {h:"What", v:r => two(r.a, r.r)}, {h:"Pieces", n:1, v:r => sg(r.q)}], MOVES.slice(0, 5))}
    <div class="foot" style="border:0"><button class="go">All movements of this article →</button></div></div>`
  document.getElementById("sheetwrap").classList.add("open")
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-opt],[data-page],[data-card],[data-close]")
  if (!t) return
  if (t.dataset.opt) { state.opt = t.dataset.opt; state.page = null; state.view = {}; try { localStorage.setItem("inv-menu", JSON.stringify({opt:state.opt})) } catch (err) {}; render(); scrollTo(0, 0) }
  else if (t.dataset.page) { state.page = t.dataset.page; state.view = {}; render() }
  else if (t.dataset.card) card(t.dataset.card)
  else if (t.hasAttribute("data-close")) document.getElementById("sheetwrap").classList.remove("open")
})
document.addEventListener("change", (e) => {
  const s = e.target.closest("select[data-view]"); if (!s) return
  state.view[s.dataset.view] = s.value; render()
})
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("sheetwrap").classList.remove("open") })
document.getElementById("theme").addEventListener("click", () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
  r.dataset.theme = dark ? "light" : "dark"
})
render()
</script>
