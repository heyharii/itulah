  h+=`<div class="tcard"><table class="t"><colgroup><col><col style="width:16%"><col style="width:12%"><col style="width:12%"><col style="width:10%"><col style="width:20%"></colgroup>

const REQK={leave:'Annual leave',sick:'Sick leave',permit:'Permit',swap:'Shift swap',ot:'Overtime'};
function hrState(){

  const rq=t.closest('[data-rec]');if(rq){openSheet('rec',rq.dataset.rec);return}
  const gss=t.closest('[data-gosess]');if(gss){openSheet('sess',gss.dataset.gosess);return}
  const rc2=t.closest('.rr[data-rc]');if(rc2){openSheet('receipt',rc2.dataset.rc);return}
  const sd=t.closest('[data-savedrop]');if(sd){saveDrop(sd.dataset.savedrop);return}
  const dz=t.closest('[data-dorec]');if(dz){saveRecon(dz.dataset.dorec);return}
  const gs=t.closest('[data-goshift]');if(gs){go('recon',{day:S.D.shifts.find(s=>s.id===gs.dataset.goshift).day,recTab:'cash'});setTimeout(()=>openSheet('shift',gs.dataset.goshift),60);return}
  const gl=t.closest('[data-golist]');if(gl){const s=S.D.shifts.find(x=>x.id===gl.dataset.golist);S.acc['s'+s.id]=true;S.flash=s.id;go('sales',{day:s.day,q:''});requestAnimationFrame(()=>{const c=$('#sess-'+s.id);if(c)c.scrollIntoView({block:'start',behavior:'smooth'})});return}
  if(t.closest('[data-godigital]')){go('recon',{recTab:'digital'});return}
  const gb=t.closest('[data-gobox]');if(gb){S.flash='box-all';go('count');return}
  const cnt=t.closest('[data-count]');if(cnt){openSheet('count',cnt.dataset.count);return}
  const ph=t.closest('[data-photo]');if(ph){ph.classList.add('has');ph.innerHTML=`<span class="thumb">${ico('receipt')}</span><span class="pn">IMG_2041.jpg<span>Tap to retake</span></span>`;ph.dataset.done='1';formCheck();return}
  const ap=t.closest('[data-addphoto]');if(ap){const x=S.D.petty.find(v=>v.id===ap.dataset.addphoto);x.photo=true;S.flash=x.id;refreshSheet();renderPage();toast('Photo added');return}
  const dn=t.closest('[data-done]');if(dn){countResult(dn.dataset.done,sheetTotal());return}
  const srt=t.closest('[data-srt]');if(srt){S.srTab=srt.dataset.srt;S.srBank='all';const id=S.open.arg;$('#sheet').innerHTML=srecSheet(id);return}
  const srb=t.closest('[data-srb]');if(srb){S.srBank=srb.dataset.srb;const id=S.open.arg;$('#sheet').innerHTML=srecSheet(id);return}
  const rcs=t.closest('tr[data-rc]');if(rcs){openSheet('receipt',rcs.dataset.rc);return}
  if(t.closest('[data-prgo]')){const pr=prState();pr.status='sent';pr.sentAt='11 Oct, 21:4'+(2+Math.floor(Math.random()*7));closeSheet();renderPage();toast('Payroll sent to HO',()=>{pr.status='draft';renderPage()});return}
  if(t.closest('[data-nsgo]')){
    const need={nsName:v=>v.trim().length>2,nsNik:v=>/^\d{16}$/.test(v),nsBirth:v=>!!v,nsAddr:v=>v.trim().length>4,nsPhone:v=>v.replace(/\D/g,'').length>=9,nsJoin:v=>!!v};
    const kind=val('nsKind');if(kind==='PKWT')need.nsEnd=v=>!!v&&v>val('nsJoin');
    const msg={nsName:'Enter the full name',nsNik:'NIK is 16 digits',nsBirth:'Pick the date of birth',nsAddr:'Enter the address',nsPhone:'Enter a phone number',nsJoin:'Pick the join date',nsEnd:'Must be after the join date'};
    let bad=null;Object.keys(msg).forEach(k=>{const h=$('#'+k+'H');if(h)h.textContent='';const el=$('#'+k);if(el)el.setAttribute('aria-invalid','false');if(need[k]&&!need[k](val(k))){if(h)h.textContent=msg[k];if(el)el.setAttribute('aria-invalid','true');if(!bad)bad=el}});
    if(bad){bad.focus();return}
    const L=staffReqs(),r={id:'NS-'+String(8+L.filter(x=>x.id>'NS-0007').length).padStart(4,'0'),name:val('nsName').trim(),position:val('nsPos'),kind,join:val('nsJoin'),end:kind==='PKWT'?val('nsEnd'):null,phone:val('nsPhone'),at:'11 Oct 2026, 21:4'+(2+Math.floor(Math.random()*7)),state:'pending'};
    L.unshift(r);S.stab='req';S.flash=r.id;closeSheet();renderPage();toast(`Requested ${r.name} to HO`,()=>{L.splice(L.indexOf(r),1);renderPage()});return}
  const bp=t.closest('[data-bprint]');if(bp){openSheet('bprint',bp.dataset.bprint);return}
  const bc=t.closest('[data-backcnt]');if(bc){openSheet('cnt',bc.dataset.backcnt);return}
  if(t.closest('[data-kbadd]')){$('#kbRows').insertAdjacentHTML('beforeend',kbRow());$$('#kbRows [data-kbn]').pop().focus();return}
  const kr=t.closest('[data-kbrm]');if(kr){kr.closest('.kbr').remove();updTot();return}
  const rc=t.closest('[data-recount]');if(rc){openSheet('count',rc.dataset.recount);return}
  const sv=t.closest('[data-savecount]');if(sv){saveCount(sv.dataset.savecount,+sv.dataset.total);return}
  const se=t.closest('[data-save]');if(se){saveExpense(se.dataset.save);return}
  if(t.closest('[data-savedep]')){saveDeposit();return}
  const tb=t.closest('[data-toast]');if(tb){toast(tb.dataset.toast)}
});
sh.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-den]')){
    const v=t.value.replace(/\D/g,'');if(v!==t.value)t.value=v;
    const am=t.parentElement.querySelector('[data-am]'),n=parseInt(v,10)||0;am.textContent=rp(n*t.dataset.den);am.classList.toggle('has',n>0);
    const tot=sheetTotal();$('#cTotal').textContent=rp(tot);
    const dn=$('#sheet [data-done]');if(dn)dn.disabled=tot===0;
    if(S.open.kind==='drop'&&S.D.shifts.find(x=>x.id===S.open.arg).state!=='open'){recCheck();return}
    if(S.open.kind==='drop'){const max=+$('#xMax').dataset.max,over=tot>max,b=$('#sheet [data-savedrop]');$('#xWhy').textContent=over?`Only ${rp(max)} in the drawer`:'';b.textContent=tot>0?`Drop ${rp(tot)}`:'Drop';b.disabled=!(tot>0&&!over&&val('xBy'))}
    return}
  if(t.matches('[data-money]')){const raw=t.value.replace(/\D/g,'');const pos=t.value.length-t.selectionStart;t.value=raw?idn(+raw):'';const p=Math.max(0,t.value.length-pos);t.setSelectionRange(p,p)}
  if(t.id==='rWhy'){const b=$('#sheet [data-dorec]');b.disabled=!t.value.trim();$('#rMsg').textContent=t.value.trim()?'':'Say why';return}
  if(t.matches('[data-kba]')){const raw=t.value.replace(/\D/g,'');t.value=raw?idn(+raw):''}
  if(t.matches('[data-kba],[data-kbn]')){updTot();return}
  if(t.id==='cWhy'){$('#sheet [data-savecount]').disabled=!t.value.trim();$('#cWhyMsg').textContent=t.value.trim()?'':'Say why';return}
  formCheck();
});
sh.addEventListener('change',e=>{if(e.target.matches('[data-xby]')){const i=$('#sheet [data-den]');if(i)i.dispatchEvent(new Event('input',{bubbles:true}));return}formCheck()});
sh.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.matches('.inp'))return;e.preventDefault();
  const all=$$('#sheet .inp'),i=all.indexOf(e.target);if(all[i+1])all[i+1].focus();else{const d=$('#sheet [data-done]');if(d&&!d.disabled)d.click()}
});
sh.addEventListener('focusin',e=>{if(e.target.matches('.inp'))e.target.select()});
const val=id=>{const el=$('#'+id);return el?el.value:''};
const amt=id=>parseInt(val(id).replace(/\D/g,''),10)||0;
function formCheck(){
  if(!S.open)return;


  if(S.open.kind==='deposit'){
    const a=amt('dAmt'),max=+$('#dAmt').dataset.max,over=a>max;
    $('#dHint').textContent=over?`Only ${rp(max)} is in the safe`:(inTillsTakings()>0?`${rp(inTillsTakings())} is still in the tills`:'');$('#dHint').className='hint'+(over?' bad':'');
    $('#dAmt').setAttribute('aria-invalid',over);
    $('#dAfter').textContent=rp(S.D.boxes.cash.books-a);
    const b=$('#sheet [data-savedep]');b.textContent=`Deposit ${rp(a)}`;
    const photo=$('#sheet [data-photo]').dataset.done;
    b.disabled=!(a>0&&!over&&val('dSlip').trim()&&photo);
    $('#dWhy').textContent=a>0&&!over&&(!val('dSlip').trim()||!photo)?(!val('dSlip').trim()?'Add the slip number':'Add a photo of the slip'):'';
  }
}
function updTot(){const tot=sheetTotal();$('#cTotal').textContent=rp(tot);const dn=$('#sheet [data-done]');if(dn)dn.disabled=tot===0}
function nowText(){return '11 Oct 2026, 21:4'+(2+Math.floor(Math.random()*7))}
function saveCount(target,total){
  const why=val('cWhy').trim();
  const c={...S.cnt.c,id:'CC-0'+(99+S.D.counts.length),box:'petty',reason:why};
  S.D.counts.unshift(c);closeSheet();S.flash=c.id;renderPage();
  toast(`Petty cash counted · ${rpS(c.counted-c.should)}`,()=>{S.D.counts=S.D.counts.filter(x=>x!==c);renderPage()});
}
function saveDrop(id){
  const s=S.D.shifts.find(x=>x.id===id),a=countTotal(),pieces=piecesOf(),t='21:4'+(2+Math.floor(Math.random()*7));
  if(s.state!=='open'){
    const prev={received:s.received,recvPieces:s.recvPieces,recvAt:s.recvAt};
    s.received=a;s.recvPieces=pieces;s.recvAt=t;s.recvBy=val('xBy');closeSheet();S.flash=s.id;renderPage();
    toast(`${rp(a)} received from ${s.who.split(' ')[0]} · ${rpS(finalDiff(S.D,s))}`,()=>{Object.assign(s,prev);renderPage()});return}
  const x={t,amt:a,pieces,by:val('xBy')};
  s.drops.push(x);closeSheet();S.flash=s.id;renderPage();
  toast(`${rp(a)} dropped · ${s.who.split(' ')[0]}`,()=>{s.drops=s.drops.filter(v=>v!==x);renderPage()});
}
function saveRecon(id){
  const s=S.D.shifts.find(x=>x.id===id),why=val('rWhy').trim(),prevNote=s.note;
  s.reconciled={by:'Maya Anggraini',at:'21:4'+(2+Math.floor(Math.random()*7)),note:why};if(why&&!s.note)s.note=why;
  closeSheet();S.flash='rec-'+s.id;renderPage();
  toast(`Session ${sessNo(s)} reconciled · ${rpS(finalDiff(S.D,s))}`,()=>{s.reconciled=null;s.note=prevNote;renderPage()});
}
function saveExpense(kind){
  const a=amt('fAmt');const b=S.D.boxes.petty;
  const e=kind==='topup'
    ?{id:'PC-'+(400+S.D.petty.length),day:TODAY,t:'21:4'+(2+Math.floor(Math.random()*7)),cat:'topup',what:'Top up from head office',payee:'',amount:a,ref:val('fRef'),photo:false,by:'Maya Anggraini'}
    :{id:'PC-'+(400+S.D.petty.length),day:TODAY,t:'21:4'+(2+Math.floor(Math.random()*7)),cat:val('fCat'),what:val('fFor'),payee:val('fPay'),amount:-a,photo:!!$('#fPhoto').dataset.done,by:'Maya Anggraini'};
  S.D.petty.unshift(e);b.books+=e.amount;S.exSpan=S.exSpan||'30';closeSheet();S.flash=e.id;renderPage();
  toast(kind==='topup'?`Top up ${rp(a)} saved`:`Expense ${rp(a)} saved`,()=>{S.D.petty=S.D.petty.filter(x=>x!==e);b.books-=e.amount;renderPage()});
}
function saveDeposit(){
  const a=amt('dAmt');const x={id:'DEP-0'+(414+S.D.deposits.length-2),at:nowText(),day:TODAY,slip:val('dSlip'),to:val('dTo'),amount:a,by:'Maya Anggraini',state:'way'};
  S.D.deposits.unshift(x);S.D.boxes.cash.books-=a;S.recTab='deposits';closeSheet();S.flash=x.id;renderPage();
  toast(`Deposit ${rp(a)} recorded`,()=>{S.D.deposits=S.D.deposits.filter(v=>v!==x);S.D.boxes.cash.books+=a;renderPage()});
}
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ppop').classList.contains('on'))return hidePop();if(S.open)closeSheet()}});

/* ───────── "At the till" (prototype): what happens on the POS ───────── */
function hidePop(){$('#ppop').classList.remove('on')}
$('#tillBtn').addEventListener('click',e=>{
  const p=$('#ppop');if(p.classList.contains('on'))return hidePop();
  const r=e.currentTarget.getBoundingClientRect();p.style.left=Math.min(r.left,innerWidth-340)+'px';
  const open=S.D.shifts.filter(s=>s.state==='open');
  const way=S.D.deposits.filter(x=>x.state==='way');
  p.innerHTML=(open.length?open.map(s=>`<button data-fin="${s.id}">${esc(s.who)} finishes ${s.till}<small>Blind count at the till</small></button>`).join('')+open.slice(0,1).map(s=>`<button data-sale="${s.id}">New cash sale on ${s.till}<small>${esc(s.who)}</small></button>`).join(''):'<div class="none">No till is open.</div>')
    +staffReqs().filter(r=>r.state==='pending').slice(0,2).map(r=>`<button data-hostaff="${r.id}">HO approves ${esc(r.name)}<small>New staff request</small></button>`).join('')
    +['before','open','closed'].map(w=>`<button data-win="${w}">HO payroll window: ${w==='before'?'not open yet':w==='open'?'open (21–23 Oct)':'closed'}<small>${prWin()===w?'Now':'Set'}</small></button>`).join('')
    +way.map(x=>`<button data-bank="${x.id}">Head office sees ${rp(x.amount)} in the bank<small>Deposit ${esc(x.slip)}</small></button>`).join('');
  p.classList.add('on');
});
document.addEventListener('click',e=>{if(!e.target.closest('#ppop,#tillBtn'))hidePop()});
$('#ppop').addEventListener('click',e=>{
  const D=S.D;
  const f=e.target.closest('[data-fin]');
  if(f){const s=D.shifts.find(x=>x.id===f.dataset.fin);const ex=expected(D,s);const diff=s.tillNo===3?20000:0;
    s.state='counted';s.to='21:4'+(3+Math.floor(Math.random()*6));s.counted=ex+diff;s.pieces=breakdown(s.counted);s.countedAt=s.to;s.countedWhere='till';if(diff)s.note='Pelanggan tidak ambil kembalian';
    hidePop();S.day=s.day;S.flash=s.id;if(S.screen!=='recon'||S.recTab!=='cash'){S.screen='recon';S.recTab='cash';pressed();sync()}renderPage();toast(`${s.who.split(' ')[0]} finished ${s.till} · counted ${rp(s.counted)}`);return}
  const sl=e.target.closest('[data-sale]');
  if(sl){const s=D.shifts.find(x=>x.id===sl.dataset.sale);const ar=ARTS[1];const no=`STORE-01-20261011-${Math.random().toString(36).slice(2,8).toUpperCase()}`;
    D.receipts.unshift({no,day:TODAY,t:'21:4'+(1+Math.floor(Math.random()*8)),shift:s.id,who:s.who,till:s.till,items:[{art:ar[0],colour:'Navy',size:'L',qty:1,price:ar[1],disc:0}],pay:[{m:'CASH',amt:ar[1],given:200000,change:200000-ar[1]}],total:ar[1],kind:'sale',member:null});
    D.boxes.cash.books+=ar[1];hidePop();S.flash=no;S.acc['s'+s.id]=true;renderPage();toast(`${rp(ar[1])} cash sale on ${s.till}`);return}
  const hs=e.target.closest('[data-hostaff]');
  if(hs){const r=staffReqs().find(x=>x.id===hs.dataset.hostaff);r.state='approved';r.nip='S01-02'+(290+Math.floor(Math.random()*9));r.by='HO · People';hidePop();S.screen='staff';S.stab='req';S.flash=r.id;pressed();sync();renderPage();toast(`HO approved ${r.name} · ${r.nip}`);return}
  const wn=e.target.closest('[data-win]');
  if(wn){S.prWin=wn.dataset.win;hidePop();if(S.screen!=='pay'){S.screen='pay';pressed();sync()}renderPage();toast(wn.dataset.win==='open'?'HO opened payroll sending':wn.dataset.win==='closed'?'HO closed payroll sending':'Payroll sending not open yet');return}
  const bk=e.target.closest('[data-bank]');
  if(bk){const x=D.deposits.find(v=>v.id===bk.dataset.bank);x.state='bank';x.bankOn='12 Oct 2026';hidePop();S.flash=x.id;S.recTab='deposits';if(S.screen!=='recon'){S.screen='recon';pressed();sync()}renderPage();toast(`${rp(x.amount)} landed in ${DEST[x.to].split(' ·')[0]}`);}
});

/* ───────── prototype bar ───────── */
function pressed(){
  $$('.proto [data-p]').forEach(b=>b.setAttribute('aria-pressed',String(S[b.dataset.p]===b.dataset.v)));
  $('#stage').className='stage '+(S.device==='desktop'?'':S.device);
}
$('.proto').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]');if(!b)return;const p=b.dataset.p,v=b.dataset.v;
  if(p==='screen'){go(v);return}
  if(p==='opt'){const k=S.screen==='dash'?'dopt':S.screen==='sched'?'sopt':S.screen==='pay'?'popt':'aopt';S[k]=v;closeSpop();if(S.sched)S.sched.sel.clear();renderPage();return}
  if(p==='data'){closeSheet();S.data=v;S.D=build(v);S.day=TODAY;S.fShift=null;S.fWho='all';S.fPay='all';S.q=''}
  if(p==='device'){S.device=v}
  renderPage();pressed();sync();
});
$('#reset').addEventListener('click',()=>{closeSheet();S.D=build(S.data);S.day=TODAY;S.fShift=null;S.fWho='all';S.fPay='all';S.q='';renderPage()});

function fillResearch(){}
renderPage();pressed();
</script>
