<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store · hub sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="frontend-hub/design-system/tokens.css">
<link rel="stylesheet" href="frontend-hub/design-system/bundle.css">
<style>
:root{--font-sans:"Inter Variable","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--bar-h:57px;--side-w:248px;--ease-sheet:cubic-bezier(.32,.72,0,1);--ease-exit:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stone);font-family:var(--font-sans);font-size:15px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}

/* prototype chrome */
.pbar{flex:none;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;min-height:var(--bar-h);padding:10px 16px;background:#fff;border-bottom:1px solid var(--hairline)}
.pbar b{font-weight:600}.pbar small{color:var(--body);font-size:15px}.pbar .sp{flex:1}
.pbar label{display:inline-flex;align-items:center;gap:8px;color:var(--body);cursor:pointer}
.pbar input{width:18px;height:18px;accent-color:var(--accent)}

/* shell — measured on the running frontend-hub (:5350, look white · now,
   29 Oct): the stone ground; the screens panel (inner) floats 12px off it,
   216 wide, radius 16; the page floats beside it, radius 16, and scrolls
   inside itself. No rail: the panel stands where the rail's 12px was. */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;background:#e8ebf0}
.shell{flex:1;min-height:0;display:flex;background:#e8ebf0}
.side{flex:none;display:flex;min-height:0}
/* the hub's rail, measured on :5350 — 68 wide on the ground, 40px keys 42 apart */
.rail{flex:none;display:flex;flex-direction:column;align-items:center;width:68px;padding:12px 0 16px}
.rk{position:relative;flex:none;display:grid;place-items:center;width:40px;height:40px;margin-bottom:2px;border:0;border-radius:8px;background:none;color:#475467;transition:background-color var(--t-hover) var(--ease-out)}
.rk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rk.find{margin-bottom:12px;border-radius:10px;color:#344054}
.rk.on{background:#fff;box-shadow:0 0 0 1px rgb(16 24 40/7%),0 1px 2px rgb(16 24 40/8%);color:#2862dc}
.rk .dot{position:absolute;top:6px;left:26px;width:8px;height:8px;border-radius:50%;background:#d70015;box-shadow:0 0 0 2px #e8ebf0}
@media (hover:hover) and (pointer:fine){.rk:not(.on):hover{background:rgb(0 0 0/5%);color:#1d2939}}
.r-sp{flex:1}
.orb{position:relative;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:#eef3fc;color:#2862dc;font-size:17px;font-weight:600}
.orb i{position:absolute;top:-6px;right:-8px;height:16px;min-width:16px;padding:0 4px;border-radius:999px;background:#d70015;box-shadow:0 0 0 2px #e8ebf0;color:#fff;font:700 11px/16px inherit;font-style:normal}
.panel{flex:none;display:flex;flex-direction:column;width:216px;margin:12px 12px 12px 0;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/5%),0 2px 6px rgb(0 0 0/4%);overflow:hidden}
.panel[hidden]{display:none}
.s-head{flex:none;display:flex;align-items:center;gap:4px;height:52px;padding:0 8px 0 16px}
.s-name{flex:1;min-width:0;margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.4px;color:#1d2939;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-icon{flex:none;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--mute)}
.s-x{display:none;flex:none;place-items:center;width:44px;height:44px;border:0;border-radius:8px;background:none;color:var(--mute)}
.s-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding:10px}
@keyframes nav-swap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.nav-swap{animation:nav-swap 220ms var(--ease-out) both}
.grp{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.grp:first-child{margin-top:0}
.chip-label{align-self:flex-start;height:22px;margin:0 0 4px 6px;padding:0 8px;border-radius:6px;background:#f2f2f5;color:#667085;font-size:12px;line-height:22px;font-weight:600;white-space:nowrap}
.row{flex:none;display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:15px;color:#344054;transition:background-color var(--t-hover) var(--ease-out)}
.row .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on{background:#eef3fc;color:#2862dc;font-weight:600}
@media (hover:hover) and (pointer:fine){.row:not(.on):hover,.s-icon:hover{background:#f2f2f5;color:var(--ink)}}
.chev{flex:none;color:var(--mute)}
.cnt{flex:none;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#d70015;box-shadow:0 0 0 2px #fff;color:#fff;font-size:15px;line-height:20px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.newdot{display:none;flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.mark-new .is-new .newdot{display:block}

.main{flex:1;min-width:0;display:flex;flex-direction:column;margin:12px 12px 12px 0;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/5%),0 2px 8px rgb(0 0 0/4%),0 24px 72px rgb(0 0 0/8%);overflow:hidden}
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.page-content{padding:24px 28px 64px}

/* under 64rem: the hub's top bar, and the panel as a drawer over the page */
.ptop{display:none}
.scrim{display:none}
@media (max-width:1023px){
  .main{margin:0;border-radius:0;box-shadow:none}
  .side{position:fixed;z-index:70;top:0;left:0;bottom:0;max-width:92vw;background:#e8ebf0;box-shadow:var(--shadow-float,0 24px 64px rgb(0 0 0/18%));transform:translateX(-105%);transition:transform 200ms var(--ease-exit)}
  .panel{width:232px;min-width:0;flex-shrink:1}
  .rk{width:44px;height:44px}
  .side.open{transform:none;transition:transform 340ms var(--ease-sheet)}
  .s-x{display:grid}
  .panel .s-icon{display:none}
  .row,.fold{min-height:44px}
  .scrim{display:block;position:fixed;inset:0;z-index:65;background:rgb(0 0 0/20%);opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-exit)}
  .scrim.open{opacity:1;pointer-events:auto;transition:opacity 340ms var(--ease-sheet)}
  .ptop{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;border-bottom:1px solid var(--hairline);background:#fff}
  .ptop button{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--r-inner);background:none;color:var(--ink)}
  .ptop b{font-weight:600}
  .ptop span{color:var(--mute)}
}
@media (max-width:767px){
  .page-content{padding:16px 16px 32px}
  .door-head{margin:-16px -16px 20px!important;padding:16px 16px 0!important}
  .door-head.notabs{padding-bottom:12px!important}
  .ds-kpis{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));margin-left:0!important;clip-path:none!important;gap:16px!important}
  .ds-kpi{padding:0!important}.ds-kpi::before{display:none}
  .ds-bar .ds-search{flex:1 1 100%}
  .wk{min-width:760px}
  .tbl-wrap{overflow-x:auto}
  .scroller{overflow-x:hidden}
}

/* page: head · figures · tabs · bar · table */
.door-head{position:sticky;top:0;z-index:30;display:flex;flex-direction:column;gap:12px;margin:-24px -28px 24px;padding:24px 28px 0;background:#fff;border-bottom:1px solid var(--hairline)}
.door-head.notabs{padding-bottom:16px}
.crumb{margin-bottom:-4px;color:var(--mute)}
.door-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:36px}
.door-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.door-title .ds-title{margin:0}
.door-title .sub{color:var(--body)}
.door-actions{display:flex;gap:8px}
.door-tabs{margin-bottom:0;box-shadow:none;overflow-x:auto}
.tab-n{margin-left:6px;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.page-content .ds-kpis{margin-bottom:24px}
.ds-table thead th{position:sticky;top:var(--head-h,0);z-index:2}
.wk thead th{position:sticky;top:var(--head-h,0);z-index:2}
.ds-kpi-value.is-bad{color:var(--bad-fg)}.ds-kpi-value.is-warn{color:var(--warn-fg)}.ds-kpi-value.is-ok{color:var(--ok-fg)}
.bar-spacer{flex:1}
.ds-btn{transition:background-color var(--t-hover) var(--ease-out),transform var(--t-press) var(--ease-out)}
.ds-btn:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:var(--control);padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);font-weight:500;white-space:nowrap}
.chip .n{color:var(--body);font-weight:400;font-variant-numeric:tabular-nums}
.chip[aria-checked="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.chip[aria-checked="true"] .n{color:var(--accent)}
@media (hover:hover){.chip[aria-checked="false"]:hover{background:var(--soft-2)}}
.ds-table-card{border:0;border-radius:0;overflow:visible}
.ds-table th{background:#fafafb;height:40px}
.ds-table td{padding-top:12px;padding-bottom:12px}
.tbl{table-layout:fixed}
.tbl td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl td.is-num,.tbl th.is-num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nm{font-weight:500}
.tbl tfoot td{font-weight:600;background:#fff;border-top:1px solid var(--hairline);border-bottom:0}
@media (hover:hover){.tbl tr.ds-opens:hover td{background:var(--soft)}}
.tbl tr.ds-opens{cursor:pointer}
.mute{color:var(--body)}.faint{color:var(--faint)}
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.st::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--line-ico)}
.st.ok::before{background:var(--ok-fg)}.st.warn::before{background:var(--warn-fg)}.st.bad::before{background:var(--bad-fg)}.st.info::before{background:var(--accent)}
.neg{color:var(--bad-fg)}.pos{color:var(--ok-fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.box{border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);padding:20px 22px}
.box h3{margin:0 0 14px;font-size:16px;font-weight:600}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--row-line);font-variant-numeric:tabular-nums}
.lines div:last-child{border-bottom:0}

/* schedule week grid (hub roster look) */
.wk{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.wk th{height:40px;padding:0 10px;background:#fafafb;border-bottom:1px solid var(--hairline);color:var(--body);font-weight:500;text-align:left}
.wk th.today{color:var(--accent)}
.wk td{height:56px;padding:6px;border-bottom:1px solid var(--row-line);border-left:1px solid var(--row-line)}
.wk td:first-child{border-left:0;padding:0 12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk tr:last-child td{border-bottom:0}
.shift{display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 10px;border-radius:var(--r-inner);font-weight:500;line-height:1.2}
.shift small{font-size:15px;font-weight:400;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift.P{background:#e8f0ff;color:#2457c5}.shift.S{background:#fff1e0;color:#a35a00}.shift.M{background:#efe9fb;color:#6a43b8}.shift.O{background:var(--soft);color:var(--body)}
.wk td.hrs{text-align:right;font-variant-numeric:tabular-nums;padding-right:12px}

/* sheet — frontend-hub's Sheet (components/ui/sheet.tsx + white.css), as is:
   desk: floats 12px off three edges, radius 16, the ring shadow, over a grey
   veil with a 2px blur; slides in from the right in 280ms, leaves in 200ms.
   Head on a hairline (grey crumb · 17px name + state · grey caption · ×),
   the body scrolls, the foot stands on a hairline, main action last.
   Phone: the whole screen, up from the bottom in 450ms. */
:root{--scrim:rgb(208 208 213/48%);--wt-ring:0 0 0 1px rgb(0 0 0/5%),0 2px 8px rgb(0 0 0/5%),0 24px 64px rgb(0 0 0/14%);--ease-drawer:cubic-bezier(.32,.72,0,1);--ease-out:cubic-bezier(.23,1,.32,1);--t-sheet:280ms;--t-drawer:450ms;--t-exit:200ms}
.sheet-veil{position:fixed;inset:0;z-index:40;background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity var(--t-exit) var(--ease-out)}
.sheet-veil.open{opacity:1;pointer-events:auto;transition-duration:var(--t-sheet)}
.sheet-pop{position:fixed;z-index:40;display:flex;flex-direction:column;overflow:hidden;background:#fff;inset:0;height:100dvh;transform:translateY(100%);visibility:hidden;transition:transform var(--t-exit) var(--ease-drawer),visibility 0s var(--t-exit)}
.sheet-pop.open{transform:none;visibility:visible;transition:transform var(--t-drawer) var(--ease-drawer),visibility 0s}
@media (min-width:768px){
  .sheet-pop{inset:12px 12px 12px auto;height:auto;max-width:calc(100vw - 24px);border-radius:16px;box-shadow:var(--wt-ring);transform:translateX(calc(100% + 1.25rem))}
  .sheet-pop.open{transition-duration:var(--t-sheet)}
  .sheet-pop[data-size="rail"]{width:clamp(30rem,40vw,35rem)}
  .sheet-pop[data-size="table"]{width:clamp(27.5rem,92vw,64rem)}
  .sheet-pop[data-size="wide"]{width:clamp(27.5rem,94vw,76rem)}
}
.sheet-head{flex:none;display:flex;align-items:flex-start;gap:0 16px;padding:16px;border-bottom:1px solid var(--hairline)}
@media (min-width:768px){.sheet-head{padding:28px 36px 20px}}
.sheet-headtext{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.sheet-id{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 4px;line-height:18px;color:var(--mute)}
.sheet-crumb-sep{color:#aeaeb2}
.sheet-titlerow{flex-basis:100%;display:flex;align-items:center;gap:10px;min-width:0}
.sheet-title{margin:0;font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.3px;color:var(--ink);overflow-wrap:anywhere}
.sheet-caption{flex-basis:100%;line-height:20px;color:var(--mute)}
.sheet-close{flex:none;display:grid;place-items:center;width:36px;height:36px;margin:-4px -6px 0 0;padding:0;border:0;border-radius:var(--r-inner);background:none;color:var(--ink)}
@media (max-width:767px){.sheet-close{width:44px;height:44px}}
@media (hover:hover) and (pointer:fine){.sheet-close:hover{background:var(--soft-2)}}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:24px 16px}
@media (min-width:768px){.sheet-body{padding:28px 36px 32px}}
.foot-lead{display:flex;gap:10px;font-variant-numeric:tabular-nums}
.boxed .ds-table-card{border:1px solid var(--hairline);border-radius:var(--r-card,12px);overflow:clip}
.tally i{font-style:normal;font-size:15px;color:var(--body)}
.row-stamp{display:inline-block;transform:rotate(-6deg);border:3px double currentColor;border-radius:6px;padding:2px 10px;color:var(--ok-fg);text-align:center;font-size:15px;line-height:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;opacity:.85;mix-blend-mode:multiply;pointer-events:none}
.md-list tbody td{height:76px;vertical-align:middle}
.md-list .row-stamp{margin-left:2px}
.row-stamp span{display:block;font-variant-numeric:tabular-nums}
.foot-group{display:flex;align-items:center;gap:16px;margin-left:auto}
/* checkout pattern — the table on the left, a summary rail on the right: the counts stacked, Submit under them */
#sheet .foot-group{flex-direction:column;align-items:stretch;margin-left:0;gap:12px;width:100%}
#sheet .foot-lead{flex-direction:column;gap:8px}
#sheet .tally{width:100%;padding:10px 16px}
#sheet .tally b{white-space:nowrap}
#sheet .foot-group .ds-btn{width:100%;height:52px}
@media (min-width:768px){
  #sheet:has(.foot-lead){display:grid;grid-template-columns:minmax(0,1fr) 260px;grid-template-rows:auto minmax(0,1fr);width:clamp(27.5rem,96vw,82rem)}
  #sheet:has(.foot-lead) .sheet-head{grid-column:1/-1}
  #sheet:has(.foot-lead) .sheet-body{grid-column:1;grid-row:2}
  #sheet:has(.foot-lead) .sheet-foot{grid-column:2;grid-row:2;flex-direction:column;align-items:stretch;justify-content:flex-end;border-top:0;border-left:1px solid var(--hairline);padding:28px 24px}
}
.tally{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:104px;padding:8px 14px;border-radius:12px;background:var(--soft,#f6f6f8);border:1px solid transparent;text-align:left;font:inherit;color:var(--ink)}
.tally span{font-size:15px;color:var(--body)}
.tally b{font-size:24px;line-height:30px;font-weight:600}
.tally.bad{background:#fef3f2;border-color:#fecdca}.tally.bad b{color:var(--bad-fg)}
button.tally{cursor:pointer;transition:transform var(--t-press,.12s) ease-out}button.tally:active{transform:scale(.97)}
button.tally[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sheet-foot:has(.foot-lead){padding-top:14px;padding-bottom:14px}
.sheet-foot:has(.foot-lead) .ds-btn{height:48px;padding:0 28px;font-size:17px}
.sheet-foot{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:8px;border-top:1px solid var(--hairline);padding:12px 16px}
@media (min-width:768px){.sheet-foot{min-height:68px;padding:14px 36px}}
@media (max-width:767px){.sheet-foot .ds-btn{height:44px;flex:1}}
.btn-ghost{border:1px solid var(--hairline-2)!important;background:#fff!important;color:var(--ink)!important;box-shadow:none!important}
@media (hover:hover) and (pointer:fine){.btn-ghost:hover{background:var(--soft-2)!important}}
.sheet-body .ds-table th{position:static}
.sheet-body .ds-kpis{margin-bottom:32px}
.sheet-sec{display:flex;flex-direction:column;gap:16px}
.sheet-sec + .sheet-sec{margin-top:40px;padding-top:24px;border-top:1px solid var(--hairline)}
.sheet-sec h4{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px;margin:0}
.facts dt{color:var(--mute)}.facts dd{margin:4px 0 0;color:var(--ink);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.sheet-pop,.sheet-pop.open{transform:none!important;transition:opacity 160ms ease,visibility 0s}.sheet-pop:not(.open){opacity:0}.side,.scrim{transition:none!important}.nav-swap{animation:none}}
.toasts{position:fixed;left:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px}

/* money declaration A–D */
.vsw{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vsw span{margin-right:4px;color:var(--body)}
.vsw button{height:32px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:#fff;font-weight:500;transition:background-color var(--t-hover) var(--ease-out),transform var(--t-press) var(--ease-out)}
.vsw button:active{transform:scale(.97)}
.vsw button[aria-checked="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.mx{table-layout:fixed;width:100%;min-width:900px}
.mx th,.mx td{white-space:nowrap;font-variant-numeric:tabular-nums}
.mx thead th{height:auto;padding-top:12px;padding-bottom:12px;vertical-align:bottom;font-weight:400}
.mx .who{font-weight:600;color:var(--ink)}
.mx td.lbl{color:var(--body)}
.mx td.is-num,.mx th.is-num{text-align:right}
.mx tr.sum td{font-weight:600;color:var(--ink)}
.mx tr.sub td.lbl{padding-left:32px}
.mx tr.gap td{border-top:1px solid var(--hairline)}
.mx .stk{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mx td.mx-open,.mx tr.sum td.mx-open{cursor:pointer;color:var(--accent);transition:background-color var(--t-hover) var(--ease-out)}
@media (hover:hover) and (pointer:fine){.mx td.mx-open:hover{background:var(--accent-bg)}}
.mx tfoot td{padding-top:14px;padding-bottom:14px}
.mx tfoot .ds-btn{min-width:150px}
.ver{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px}
.mx-cards{display:none}
.mx-cards .who{font-weight:600}
.card-foot{display:flex;justify-content:flex-end;margin-top:14px}

  { till: 'Cashier 1', who: 'Dewi Anggraini', open: '09:58', close: '16:02', sys: 8_745_000, cash: 3_120_000, card: 4_085_000, qris: 1_540_000, declared: 3_120_000 },
  { till: 'Cashier 2', who: 'Budi Santoso', open: '10:01', close: '16:00', sys: 6_210_500, cash: 2_415_500, card: 2_655_000, qris: 1_140_000, declared: 2_405_500 },
  { till: 'Cashier 1', who: 'Dewi Anggraini', open: '16:05', close: '22:01', sys: 11_380_000, cash: 4_260_000, card: 5_090_000, qris: 2_030_000, declared: 4_260_000 },

]

const code7 = () => Array.from({ length: 7 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(rnd() * 32)]).join('')

SCREENS.payments = () => {

  const from = filt('tx-from', '2026-10-29'), to = filt('tx-to', '2026-10-29'), w = filt('tx-who', 'all'), pay = filt('tx-pay', 'all')
  const by = filt('pay-by', 'day')
  const list = RECEIPTS.filter(r => r.kind !== 'Void' && dayOf(r) >= from && dayOf(r) <= to && (w === 'all' || r.who === w) && (pay === 'all' || r.pay === pay))
  const sum = rs => rs.reduce((t, r) => t + r.amt, 0)

  const sold = rs => sum(rs.filter(r => r.amt > 0))
  const pct = (x, of) => of ? `${(x / of * 100).toLocaleString('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%` : '—'
  const keyOf = r => by === 'day' ? dayOf(r) : dayOf(r) + '|' + r.who
  const keys = [...new Set(list.map(keyOf))].sort((x, y) => y.localeCompare(x))
  const showWho = by === 'session' || w !== 'all'
  const rows = keys.flatMap(k => {
    const [d, who] = k.split('|'), block = list.filter(r => keyOf(r) === k), dsc = block.reduce((t, r) => t + discOf(r), 0)
    const ms = [...new Set(block.map(r => r.pay))].map(p => ({ p, rs: block.filter(r => r.pay === p) })).sort((x, y) => sum(y.rs) - sum(x.rs))

      d: dm(d), who: who || w, pay: m.p, tot: money(sum(m.rs)), n: m.rs.length, sh: pct(sold(m.rs), sold(block)),
      disc: dsc ? `−${rp(dsc)}` : '<span class="faint">—</span>', amt: money(sum(block)),
      _on: `S.f['tx-from']='${d}';S.f['tx-to']='${d}';${who ? `S.f['tx-who']='${who}';` : ''}S.f['tx-pay']='${m.p}';go('transactions')` }))

  const sw = `<div class="chips" role="radiogroup" aria-label="Group by">${[['day', 'Per day'], ['session', 'Per session']].map(([v, l]) => `<button class="chip" type="button" role="radio" aria-checked="${by === v}" onclick="setFilt('pay-by','${v}')">${l}</button>`).join('')}</div>`
  return page({ title: 'Payments',
    body: bar(dateRange(from, to), pickIn('tx-who', w, 'All cashiers', 'users'), pickIn('tx-pay', pay, 'All payments', 'wallet'), sp, sw) +

}

/* every transaction of the day, so a total opens into its receipts */
const TX = (() => {
  const out = []
  const mins = t => +t.slice(0, 2) * 60 + +t.slice(3)
  const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0')
  const split = (total, avg) => {
    const n = Math.max(1, Math.round(total / avg)), parts = []
    let left = total
    for (let k = 0; k < n - 1; k++) { const a = Math.max(500, Math.min(left - 500 * (n - k - 1), r500(avg * (.5 + rnd())))); parts.push(a); left -= a }
    return [...parts, left]
  }
  SHIFTS.forEach((s, i) => {
    const a = mins(s.open), b = mins(s.close || '21:40')
    const add = (m, edc, kind, total, avg) => total && split(total, avg).forEach(amt => out.push({ s: i, t: hhmm(a + Math.floor(rnd() * (b - a))), m, edc, kind, amt }))
    add('Cash', '', 'Cash', s.cash, 260_000)
    EDCS.forEach(e => {
      const [card, qris] = MD[i].edc[e], visa = r500(card * .2), master = r500(card * .1)
      add('EDC', e, 'Debit', card - visa - master, 330_000); add('EDC', e, 'VISA', visa, 330_000); add('EDC', e, 'MASTER', master, 330_000)
      add('EDC', e, 'QRIS', qris, 180_000)
    })
  })
  out.sort((x, y) => x.t.localeCompare(y.t))
  return out.map((x, n) => ({ ...x, id: n, no: code7() }))
})()
TX.forEach(x => { if (x.kind === 'VISA' || x.kind === 'MASTER') x.kind = 'Credit'; x.onus = x.m === 'EDC' && x.kind !== 'QRIS' ? rnd() < .6 : null })
const sum = xs => xs.reduce((a, x) => a + x.amt, 0)

const mdDiff = i => MD[i].declared == null ? null : MD[i].declared - expected(i)

/* one cashier column: who, till, hours */
const mdHead = (s, i) => `<th class="is-num"><div class="who">${s.who}</div><div class="mute">${s.till} · ${s.open}–${s.close || 'open'}</div></th>`
const cell = (v, on) => on ? `<td class="is-num mx-open" onclick="${on}">${v}</td>` : `<td class="is-num">${v}</td>`
function mdVerifyCell(i) {
  const d = mdDiff(i)
  if (d == null) return st('Open', 'info')
  if (S.ver[i]) return `<span class="ver">${st('Verified', 'ok')}<span class="mute">Maya · ${S.ver[i]}</span></span>`
  return btn(d ? 'Accept shortage' : 'Verify', `mdVerify(${i})`)
}
function mdVerify(i) { const now = new Date(); S.ver[i] = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'); renderPage(); toast(`${SHIFTS[i].who} verified`) }

/* the matrix: label column, one column per cashier; split = sales by EDC (D) */
function mdMatrix(split) {
  const C = SHIFTS.map((s, i) => i)
  const row = (label, f, cls = '') => `<tr class="${cls}"><td class="lbl">${label}</td>${C.map(f).join('')}</tr>`
  const money = n => n == null ? '<span class="faint">—</span>' : rp(n)
  const salesRows = split
    ? row('Cash', i => cell(rp(SHIFTS[i].cash), `mdTx(${i},'Cash')`), 'sub') +
      EDCS.map(e => row(`EDC ${e}`, i => cell(rp(edcOf(i, e)), `mdEdcSheet(${i},'${e}')`), 'sub')).join('') +
      row('Sales', i => cell(rp(SHIFTS[i].sys), `mdTx(${i})`), 'sum')
    : row('Sales', i => cell(rp(SHIFTS[i].sys), `mdTx(${i})`), 'sum')
  const cashRows =
    row('Float', i => cell(rp(MD[i].float)), 'gap') +
    row('Cash drops', i => `<td class="is-num"><div class="stk">${MD[i].drops.map(([t, a]) => `<span><span class="faint">${t}</span>&nbsp; ${rp(a)}</span>`).join('')}</div></td>`) +
    row('Expected in drawer', i => cell(rp(expected(i)))) +
    row('Declared', i => cell(money(MD[i].declared))) +
    row('Difference', i => { const d = mdDiff(i); return cell(d == null ? '<span class="faint">—</span>' : d ? `<span class="neg">${rp(d)}</span>` : 'Rp 0') }, 'sum')
  const desk = `<div class="ds-table-card tbl-wrap mx-desk"><table class="ds-table mx"><colgroup><col style="width:210px">${C.map(() => '<col>').join('')}</colgroup>
    <thead><tr><th></th>${SHIFTS.map(mdHead).join('')}</tr></thead><tbody>${salesRows}${cashRows}</tbody>
    <tfoot><tr><td></td>${C.map(i => `<td class="is-num">${mdVerifyCell(i)}</td>`).join('')}</tr></tfoot></table></div>`
  /* phone: the same rows, one card per cashier, nothing scrolls sideways */
  const cards = `<div class="mx-cards">${C.map(i => { const s = SHIFTS[i], d = mdDiff(i)
    const ls = [...(split ? [['Cash', rp(s.cash)], ...EDCS.map(e => [`EDC ${e}`, rp(edcOf(i, e))])] : []), ['Sales', `<b>${rp(s.sys)}</b>`], ['Float', rp(MD[i].float)],
      ...MD[i].drops.map(([t, a]) => [`Cash drop ${t}`, rp(a)]), ['Expected in drawer', rp(expected(i))], ['Declared', money(MD[i].declared)],
      ['Difference', d == null ? '—' : d ? `<span class="neg">${rp(d)}</span>` : 'Rp 0']]
    return `<div class="box"><div class="who">${s.who}</div><div class="mute" style="margin-bottom:8px">${s.till} · ${s.open}–${s.close || 'open'}</div>${lines(ls)}<div class="card-foot">${mdVerifyCell(i)}</div></div>` }).join('')}</div>`
  return desk + cards
}

/* B: one EDC at a time; every transaction starts ticked, untick what the slip lacks */
function mdEdcList(noVerify) {
  const e = filt('mdedc', 'BCA')
  const xs = TX.filter(x => x.edc === e)
  const on = xs.filter(x => !S.off.has(x.id))
  const tick = x => `<input type="checkbox" class="tick" aria-label="On the slip" ${S.off.has(x.id) ? '' : 'checked'} onclick="event.stopPropagation()" onchange="mdTick(${x.id},this.checked)">`
  const head = bar(chips('mdedc', EDCS.map(b => [b, `EDC ${b}`, TX.filter(x => x.edc === b).length]), 'BCA'), sp,
    noVerify ? '' : S.everified[e] ? st(`EDC ${e} verified`, 'ok') : btn(`Verify EDC ${e}`, `S.everified['${e}']=true;renderPage();toast('EDC ${e} verified')`))
  return { e, xs, on, html: head + table([{ l: '', k: 'c', w: 56 }, { l: 'Time', k: 't', w: 80 }, { l: 'Receipt', k: 'no', w: 150 }, { l: 'Cashier', k: 'who', w: 170 }, { l: 'Card', k: 'kind', w: 170 }, { l: 'EDC', k: 'edc', w: 250 }, { l: 'Amount', k: 'a', num: 1 }],
    xs.map(x => ({ c: tick(x), t: x.t, no: x.no, who: SHIFTS[x.s].who, kind: x.kind + wasEdc(x), edc: edcPick(x, ''), a: S.off.has(x.id) ? `<span class="faint">${rp(x.amt)}</span>` : rp(x.amt) })),
    { t: 'Ticked', who: `${on.length} of ${xs.length}`, a: rp(sum(on)) }) }
}
function mdTick(id, on) { on ? S.off.delete(id) : S.off.add(id); renderPage() }

/* C: the two views behind one switch, as sketch 2's header */
const mdSwitch = () => `<div class="chips" role="radiogroup">${[['cashier', 'Per cashier'], ['edc', 'Per EDC']].map(([v, l]) => `<button class="chip" type="button" role="radio" aria-checked="${S.mdside === v}" onclick="S.mdside='${v}';renderPage()">${l}</button>`).join('')}</div>`

/* E and F: a kasir runs more than one session a day.
   E — each kasir a column group: its sessions, then its total; fuller rows.
   F — the same day turned on its side: sessions are rows under their kasir. */
const KASIR = [...new Set(SHIFTS.map(s => s.till))].map(k => ({ k, ss: SHIFTS.map((s, i) => i).filter(i => SHIFTS[i].till === k) }))
const MORE = [ // per session: pieces, exchanges [count, value], voids
  { pcs: 41, exch: [2, 385_000], voids: 1 }, { pcs: 29, exch: [1, 199_000], voids: 0 },
  { pcs: 53, exch: [3, 512_000], voids: 2 }, { pcs: 44, exch: [1, 149_000], voids: 0 },
  { pcs: 26, exch: [0, 0], voids: 0 }, { pcs: 22, exch: [1, 129_000], voids: 1 },
]
const receipts = i => TX.filter(x => x.s === i).length
const sessionName = i => `<div class="who">${SHIFTS[i].who}</div><div class="mute">${SHIFTS[i].open}–${SHIFTS[i].close || 'open'}</div>`

function mdGrouped() {
  const cols = KASIR.flatMap(g => [...g.ss.map(i => ({ i })), { total: g }])
  const sumOf = (g, f) => g.ss.reduce((a, i) => a + (f(i) ?? 0), 0)
  const money = n => n == null ? '<span class="faint">—</span>' : rp(n)
  const diffTxt = d => d == null ? '<span class="faint">—</span>' : d ? `<span class="neg">${rp(d)}</span>` : 'Rp 0'
  /* a row: label, value per session, and how a total adds up (default: sum) */
  const row = (label, f, { cls = '', on, total, fmt = money } = {}) => `<tr class="${cls}"><td class="lbl">${label}</td>${cols.map(c => c.total
    ? `<td class="is-num tot">${total ? total(c.total) : fmt(sumOf(c.total, f))}</td>`
    : (on ? `<td class="is-num mx-open" onclick="${on(c.i)}">${fmt(f(c.i))}</td>` : `<td class="is-num">${fmt(f(c.i))}</td>`)).join('')}</tr>`
  const sec = label => `<tr class="sec"><td colspan="${cols.length + 1}">${label}</td></tr>`
  const plain = n => n == null ? '' : dots(n)
  const head = `<tr><th rowspan="2"></th>${KASIR.map(g => `<th class="grp-h" colspan="${g.ss.length + 1}">${g.k}</th>`).join('')}</tr>
    <tr>${cols.map(c => c.total ? `<th class="is-num tot">Total</th>` : `<th class="is-num">${sessionName(c.i)}</th>`).join('')}</tr>`
  const body =
    sec('Sales') +
    row('Receipts', i => receipts(i), { fmt: plain, on: i => `mdTx(${i},'All')` }) +
    row('Pieces', i => MORE[i].pcs, { fmt: plain }) +
    row('Cash', i => SHIFTS[i].cash, { cls: 'sub', on: i => `mdTx(${i},'Cash')` }) +
    EDCS.map(e => row(`EDC ${e}`, i => edcOf(i, e), { cls: 'sub', on: i => `mdEdcSheet(${i},'${e}')` })).join('') +
    row('Sales', i => SHIFTS[i].sys, { cls: 'sum', on: i => `mdTx(${i},'All')` }) +
    sec('Returns') +
    row('Exchanges', i => MORE[i].exch[1], { fmt: n => n ? rp(n) : '<span class="faint">—</span>' }) +
    row('Voids', i => MORE[i].voids, { fmt: n => n ? String(n) : '<span class="faint">—</span>' }) +
    sec('Cash in the drawer') +
    row('Float', i => MD[i].float) +
    row('Cash drops', i => dropsOf(i), { fmt: n => n == null ? '' : rp(n) }) +
    row('Expected in drawer', i => expected(i)) +
    row('Declared', i => MD[i].declared, { total: g => g.ss.some(i => MD[i].declared == null) ? '<span class="faint">—</span>' : rp(sumOf(g, i => MD[i].declared)) }) +
    row('Difference', i => mdDiff(i), { cls: 'sum', fmt: diffTxt, total: g => g.ss.some(i => mdDiff(i) == null) ? '<span class="faint">—</span>' : diffTxt(sumOf(g, mdDiff)) })
  const foot = `<tr><td></td>${cols.map(c => c.total ? '<td class="tot"></td>' : `<td class="is-num">${mdVerifyCell(c.i)}</td>`).join('')}</tr>`
  return `<div class="ds-table-card tbl-wrap mx-desk"><table class="ds-table mx mx-g"><colgroup><col style="width:170px">${cols.map(() => '<col>').join('')}</colgroup>
    <thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>` + mdMatrixCards()
}
/* phone: one card per session, as A */
const mdMatrixCards = () => mdMatrix(false).slice(mdMatrix(false).indexOf('<div class="mx-cards">'))

function mdRows() {
  /* plain figures, no "Rp": eight money columns must fit beside the names */
  const n = x => num(x)
  const diffTxt = d => d == null ? '<span class="faint">—</span>' : d ? `<span class="neg">${n(d)}</span>` : '0'
  const edcAll = i => EDCS.reduce((a, e) => a + edcOf(i, e), 0)
  const cells = o => `<td>${o.name}</td><td class="is-num">${o.sales}</td><td class="is-num">${o.cash}</td><td class="is-num">${o.edc}</td><td class="is-num">${o.drops}</td><td class="is-num">${o.exp}</td><td class="is-num">${o.dec}</td><td class="is-num">${o.diff}</td><td class="is-num">${o.act}</td>`
  const one = i => `<tr class="ds-opens" onclick="mdTx(${i},'All')">${cells({ name: sessionName(i), sales: n(SHIFTS[i].sys), cash: n(SHIFTS[i].cash), edc: n(edcAll(i)), drops: n(dropsOf(i)), exp: n(expected(i)),
    dec: MD[i].declared == null ? '<span class="faint">—</span>' : n(MD[i].declared), diff: diffTxt(mdDiff(i)), act: `<span onclick="event.stopPropagation()">${mdVerifyCell(i)}</span>` })}</tr>`
  const tot = (label, ss, cls) => { const s = f => ss.reduce((a, i) => a + f(i), 0), open = ss.some(i => MD[i].declared == null)
    return `<tr class="${cls}">${cells({ name: label, sales: n(s(i => SHIFTS[i].sys)), cash: n(s(i => SHIFTS[i].cash)), edc: n(s(edcAll)), drops: n(s(dropsOf)), exp: n(s(expected)),
      dec: open ? '<span class="faint">—</span>' : n(s(i => MD[i].declared)), diff: open ? '<span class="faint">—</span>' : diffTxt(s(mdDiff)), act: '' })}</tr>` }
  const body = KASIR.map(g => `<tr class="grp-row"><td colspan="9">${g.k}</td></tr>${g.ss.map(one).join('')}${tot(`Total ${g.k}`, g.ss, 'sub-tot')}`).join('')
  const all = SHIFTS.map((s, i) => i)
  return `<div class="ds-table-card tbl-wrap mx-desk"><table class="ds-table mx mx-r"><colgroup><col style="width:180px"><col><col><col><col><col><col><col><col style="width:160px"></colgroup>
    <thead><tr><th>Session</th><th class="is-num">Sales</th><th class="is-num">Cash</th><th class="is-num">EDC</th><th class="is-num">Cash drops</th><th class="is-num">Expected</th><th class="is-num">Declared</th><th class="is-num">Difference</th><th></th></tr></thead>
    <tbody>${body}</tbody><tfoot>${tot('Total', all, '')}</tfoot></table></div>` + mdMatrixCards()
}
/* G: three steps so nobody mixes cash and cards — 1 Cash, 2 EDC, 3 Submit
   with notes. One row per session (the person and their hours; which kasir
   doesn't matter), the total underneath. Nothing is approved that doesn't
   match: a short or open drawer is counted again, a payment missing from
   the slip blocks Submit. */
S.gstep = 'cash'; S.sub = null
const GSTEPS = [['cash', 'Cash'], ['edc', 'EDC'], ['submit', 'Submit']]
const gGo = k => `S.gstep='${k}';renderPage();$('#scroller').scrollTop=0`
function stepper() {
  const at = GSTEPS.findIndex(([k]) => k === S.gstep)
  return `<ol class="stepper">${GSTEPS.map(([k, l], j) => {
    const issue = !S.sub && j < at && blockers().some(b => b[2] === k)
    const state = S.sub || j < at ? (issue ? 'issue' : 'done') : j === at ? 'now' : 'next'
    return `<li class="${state}"><button type="button" onclick="${gGo(k)}" ${j === at ? 'aria-current="step"' : ''}><span class="dot">${state === 'done' ? ico('check') : state === 'issue' ? '!' : j + 1}</span>${l}</button></li>`
  }).join('')}</ol>`
}
const dash = '<span class="faint">—</span>'
const gDiff = d => d == null ? dash : d ? `<span class="neg">${rp(d)}</span>` : 'Rp 0'
const ALL = SHIFTS.map((s, i) => i)

/* one row per session; cols: { l, f(i), fmt, on(i), sub(i), total(all) } */
function sessionTable(cols, act) {
  const head = `<tr><th>Session</th>${cols.map(c => `<th class="is-num">${c.l}</th>`).join('')}${act ? '<th></th>' : ''}</tr>`
  const cell = (c, i) => {
    const v = (c.fmt || rp)(c.f(i)), sub = c.sub ? `<div class="faint">${c.sub(i)}</div>` : ''
    return c.on ? `<td class="is-num mx-open" onclick="${c.on(i)}">${v}${sub}</td>` : `<td class="is-num">${v}${sub}</td>`
  }
  const rows = ALL.map(i => `<tr><td>${sessionName(i)}</td>${cols.map(c => cell(c, i)).join('')}${act ? `<td class="is-num">${act(i)}</td>` : ''}</tr>`).join('')
  const tot = `<tr><td>Total</td>${cols.map(c => `<td class="is-num">${c.total ? c.total() : (c.fmt || rp)(ALL.reduce((a, i) => a + (c.f(i) ?? 0), 0))}</td>`).join('')}${act ? '<td></td>' : ''}</tr>`
  return `<div class="ds-table-card tbl-wrap"><table class="ds-table mx mx-s"><colgroup><col style="width:200px">${cols.map(() => '<col>').join('')}${act ? '<col style="width:150px">' : ''}</colgroup>
    <thead>${head}</thead><tbody>${rows}</tbody><tfoot>${tot}</tfoot></table></div>`
}

const anyOpen = () => ALL.some(i => MD[i].declared == null)
/* every amount of cash is counted note by note, from 100.000 down to the 100 coin */
const NOTES = [100000, 50000, 20000, 10000, 5000, 2000, 1000, 500, 200, 100]
function notesField(max, label) {
  S.pc = NOTES.map(() => 0); S.pcMax = max
  return `<section class="sheet-sec"><h4>${label}</h4><div class="notes">${NOTES.map((n, k) =>
    `<label class="note-row"><span>${dots(n)}</span><input inputmode="numeric" value="" placeholder="0" aria-label="Pieces of ${dots(n)}" oninput="pcSet(${k},this.value)"><b id="pc${k}">—</b></label>`).join('')}</div>
    <div class="pc-total"><span>Total</span><b id="pctot">Rp 0</b></div><div class="pc-err neg" id="pcerr" hidden></div></section>`
}
const pcSum = () => NOTES.reduce((a, n, k) => a + n * S.pc[k], 0)
function pcSet(k, v) {
  S.pc[k] = +String(v).replace(/\D/g, '') || 0
  $('#pc' + k).textContent = S.pc[k] ? dots(NOTES[k] * S.pc[k]) : '—'
  const t = pcSum(), over = t > S.pcMax
  $('#pctot').textContent = rp(t)
  $('#pcerr').hidden = !over
  $('#pcerr').textContent = `Can't be more than ${rp(S.pcMax)}`
  const save = $('#sheet .sheet-foot .ds-btn'); if (save) save.disabled = over || !t
}
const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') }

/* sessions that share a time window, earliest first; four people at most per block */
function sessionGroups() {
  const mins = t => +t.slice(0, 2) * 60 + +t.slice(3)
  const order = [...ALL].sort((a, b) => mins(SHIFTS[a].open) - mins(SHIFTS[b].open))
  const groups = []
  order.forEach(i => {
    const g = groups.find(g => Math.abs(mins(SHIFTS[g[0]].open) - mins(SHIFTS[i].open)) <= 60 && g.length < 4)
    g ? g.push(i) : groups.push([i])
  })
  return groups
}
function sessionBlocksOf(rowsFor, act) {
  return sessionGroups().map(ids => {
    const from = ids.map(i => SHIFTS[i].open).sort()[0]
    const to = ids.some(i => !SHIFTS[i].close) ? 'open' : ids.map(i => SHIFTS[i].close).sort().pop()
    return `<section class="sg"><h3 class="sg-h">${from}–${to}</h3>${sessionMatrix(rowsFor(ids), act, ids)}</section>`
  }).join('')
}
function sessionMatrix(rows, act, ALL) {
  const pad = '<td></td>'.repeat(4 - ALL.length), padh = '<th></th>'.repeat(4 - ALL.length)
  const head = `<tr><th></th>${ALL.map(i => `<th class="is-num">${sessionName(i)}</th>`).join('')}${padh}<th class="is-num tot">Total</th></tr>`
  const body = rows.map(r => `<tr class="${r.cls || ''}"><td class="lbl">${r.l}</td>${ALL.map(i => `<td class="is-num">${r.f(i)}</td>`).join('')}${pad}<td class="is-num tot">${r.tot()}</td></tr>`).join('')
  const foot = act ? `<tfoot><tr><td></td>${ALL.map(i => `<td class="is-num">${act(i)}</td>`).join('')}${pad}<td class="tot"></td></tr></tfoot>` : ''
  return `<div class="ds-table-card tbl-wrap mx-scroll"><table class="ds-table mx mx-m"><colgroup><col style="width:200px">${ALL.map(() => '<col>').join('')}${'<col>'.repeat(4 - ALL.length)}<col style="width:170px"></colgroup>
    <thead>${head}</thead><tbody>${body}</tbody>${foot}</table></div>`
}
/* one block per session, its lines running down; the total block last */
function sessionBlocks(linesOf, act, totalLines) {
  return `<div class="ses">${ALL.map(i => `<section class="box ses-b"><div class="ses-h">${sessionName(i)}<div class="ses-act">${act ? act(i) : ''}</div></div>${lines(linesOf(i))}</section>`).join('')}
    <section class="box ses-b ses-tot"><div class="ses-h"><div class="who">Total</div></div>${lines(totalLines)}</section></div>`
}
const link = (v, on) => `<button type="button" class="lnk" onclick="${on}">${v}</button>`

/* G cash: no count, no declared — the cash sales leave the drawer in cash drops,
   as many as it takes; when nothing is left to drop the button becomes Verify */
const GD = [[...MD[0].drops, ['15:58', 620_000]], [...MD[1].drops], [...MD[2].drops, ['21:55', 760_000]], [...MD[3].drops], [...MD[4].drops, ['16:00', 980_000]], [...MD[5].drops]]
const gDropped = i => GD[i].reduce((a, d) => a + d[1], 0)
const gLeft = i => SHIFTS[i].cash - gDropped(i)
function mdCashStep() {
  const left = n => n ? `<span class="neg">${rp(n)}</span>` : 'Rp 0'
  const act = i => S.ver[i] ? st('Verified', 'ok') : gLeft(i) ? btn('Add cash drop', `mdDrop(${i})`) : btn('Verify', `S.ver[${i}]=nowHM();renderPage();toast('${SHIFTS[i].who} verified')`)
  return sessionBlocksOf(ids => {
    const sumAll = f => ids.reduce((a, i) => a + f(i), 0)
    const most = Math.max(...ids.map(i => GD[i].length))
    return [
      { l: 'Cash sales', f: i => link(rp(SHIFTS[i].cash), `mdTx(${i},'Cash')`), tot: () => rp(sumAll(i => SHIFTS[i].cash)) },
      ...Array.from({ length: most }, (_, k) => ({ l: `Cash drop ${k + 1}`, cls: k ? '' : 'gap',
        f: i => GD[i][k] ? `${rp(GD[i][k][1])}<div class="faint">${GD[i][k][0]}</div>` : dash,
        tot: () => rp(sumAll(i => GD[i][k]?.[1] || 0)) })),
      { l: 'Not dropped yet', cls: 'sum gap', f: i => left(gLeft(i)), tot: () => left(sumAll(gLeft)) },
    ]
  }, act)
}
const edcOfS = i => TX.filter(x => x.s === i && x.m === 'EDC')
function mdEdcStep() {
  const offOf = i => sum(edcOfS(i).filter(x => S.off.has(x.id)))
  const warn = n => n ? `<span class="warn-t">${rp(n)}</span>` : dash
  return sessionBlocksOf(ids => {
    const sumAll = f => ids.reduce((a, i) => a + f(i), 0)
    return [
      ...EDCS.map(e => ({ l: `EDC ${e}`, f: i => link(rp(edcOf(i, e)), `mdEdcSheet(${i},'${e}')`), tot: () => rp(sumAll(i => edcOf(i, e))) })),
      { l: 'EDC total', cls: 'sum gap', f: i => rp(sum(edcOfS(i))), tot: () => rp(sumAll(i => sum(edcOfS(i)))) },
      { l: 'Not on the slip', f: i => warn(offOf(i)), tot: () => warn(sumAll(offOf)) },
    ]
  })
}
/* a cash drop: as often as needed, note by note; never more than is left to drop */
function mdDrop(i) {
  const s = SHIFTS[i]
  openSheet({ crumb: ['Money declaration'], title: `Add cash drop · ${s.who}`, caption: `${s.open}–${s.close || 'open'}`, size: 'rail', actions: [['Add cash drop', `mdDropSave(${i})`]],
    body: kpis([['Cash sales', rp(s.cash)], ['Not dropped yet', rp(gLeft(i))]]) + notesField(gLeft(i), 'Notes in the drop') })

/* a closing that doesn't add up goes back to the cashier, at most twice; after

S.ret = {}; S.wait = {}; S.acc = {}; S.cnt = {}

  EDCS.forEach(e => { S.aslip[i + e] = String(wSys(i, e)) })
  const pending = S.miss[i]?.ho === 'pending'
  if (!pending) EDCS.forEach(e => S.ev[i + e] = nowHM())
  wClose(i)
  S.ed = {}; S.lost = []; S.lnote = ''; closeSheet(); renderPage()
  toast(pending ? 'Sent to head office' : `${SHIFTS[i].who}: EDC verified`)
}
function wSlipBack(i) { S.eWait[i] = true; renderPage(); toast(`Returned to ${SHIFTS[i].who} for a slip recount`) }
function wSlipResubmit(i) { delete S.eWait[i]; EDCS.forEach(e => { S.slip[i + e] = String(wSys(i, e)) }); renderPage(); toast(`${SHIFTS[i].who} recounted the slips`) }
function wCashReceipts(i) {
  const s = SHIFTS[i], xs = TX.filter(x => x.s === i && x.m === 'Cash')
  openSheet({ crumb: ['Money declaration', s.who], title: 'Cash sales', caption: `${s.open}–${s.close || 'open'}`, size: 'table',
    body: table([{ l: 'Time', k: 't', w: 90 }, { l: 'Receipt', k: 'no' }, { l: 'Amount', k: 'a', num: 1 }],
      xs.map(x => ({ t: x.t, no: x.no, a: rp(x.amt) })), { t: 'Total', no: `${xs.length} receipts`, a: rp(sum(xs)) }) })
}
/* what makes up the cash handed in: the closing and each temporary deposit, note by note, as the cashier counted them */
function wCashSheet(i) {
  const s = SHIFTS[i], c = S.closing[i]
  openSheet({ crumb: ['Money declaration'], title: `${s.who} · Cashier closing`, caption: `${s.open}–${s.close || 'open'}`, size: 'table',
    body: kpis([['Cash sales', rp(s.cash)], ['Cashier closing', c == null ? '—' : rp(wTemp(i) + c)]]) + cashMatrix(i, false) })
}
/* no Submit closing: the cashier is closed the moment both Declare cash and Declare EDC have gone through */
function wClose(i) { if (!S.ver[i] && wReady(i)) { S.ver[i] = nowHM(); setTimeout(() => toast(`${SHIFTS[i].who}: closed`), 0) } }
function mdWizard() {
  const order = wOrder(), at = Math.min(S.wi, order.length - 1), i = order[at], last = at === order.length - 1
  const side = order.map((k, n) => { const [t, c] = wState(k)
    return `<button type="button" class="wz-step ${n === at ? 'on' : ''}" ${n === at ? 'aria-current="step"' : ''} onclick="${wGo(n)}">
      <span class="wz-dot ${S.ver[k] ? 'done' : ''}">${S.ver[k] ? ico('check') : n + 1}</span><span class="wz-txt"><span class="wz-name">${SHIFTS[k].who}</span></span></button>` }).join('')
  /* moving between cashiers is navigation, not an action: white buttons */
  const nav = (l, on) => `<button class="ds-btn btn-white" type="button" onclick="${on}">${l}</button>`
  const back = at ? nav('Back', wGo(at - 1)) : '<span></span>'
  const next = last ? nav('Done', 'S.wzOpen=false;renderPage()') : nav('Next', wGo(at + 1))
  return `<div class="wz" role="dialog" aria-label="Money declaration">
    <header class="wz-top"><button type="button" class="wz-x" aria-label="Close" onclick="S.wzOpen=false;renderPage()">${ico('x')}</button>
      <b>Money declaration</b><span class="mute">Thu 29 Oct</span><span class="sp"></span><span class="mute">Cashier ${at + 1} of ${order.length}</span></header>
    <div class="wz-body"><nav class="wz-side" aria-label="Cashiers">${side}</nav>
      <div class="wz-main"><div class="wz-in">${wKasir(i)}</div>
        <footer class="wz-foot"><div class="wz-foot-in">${back}${next}</div></footer></div></div></div>`
}
const allClosed = () => SHIFTS.every(s => s.close)
/* prototype only: let the open kasir close, to walk the run */
function demoClose(on) {
  SHIFTS[3].close = on ? '22:00' : null
  S.closing[3] = on ? wShould(3) : undefined
  EDCS.forEach(e => { S.slip[3 + e] = on ? String(wSys(3, e)) : undefined })
  S.wzOpen = on; S.wi = 0; renderPage()
}
/* the list: one money declaration per business day, today on top */
const MD_PAST = [['Wed 28 Oct', 6, 18_420_500, 21_905_000, '22:14'], ['Tue 27 Oct', 5, 15_102_000, 19_330_500, '22:06'], ['Mon 26 Oct', 5, 14_788_500, 17_640_000, '22:21'],
  ['Sun 25 Oct', 6, 22_915_000, 26_480_500, '22:40'], ['Sat 24 Oct', 6, 24_330_500, 27_115_000, '22:35'], ['Fri 23 Oct', 6, 19_870_000, 23_402_500, '22:18']]
function mdWizardPage() {
  const order = wOrder(), open = SHIFTS.filter(s => !s.close).length, done = order.filter(i => S.ver[i]).length
  if (open) S.wzOpen = false
  /* a closed day is stamped, as procurement stamps a finished order: the word over the day */
  const stamp = d => `<span class="row-stamp">Closed<span>${d.replace(/^\w+ /, '')}</span></span>`
  const tc = order.reduce((a, i) => a + SHIFTS[i].cash, 0), te = order.reduce((a, i) => a + sum(edcOfS(i)), 0)
  const today = { d: 'Thu 29 Oct', n: `${done}/${order.length}`, c: rp(tc), e: rp(te), t: rp(tc + te),
    /* a day not closed yet shows the way in where its status would be */
    s: done === order.length ? stamp('Thu 29 Oct') : `<button class="ds-btn ds-btn--primary sm" type="button" ${open ? 'disabled' : ''} onclick="event.stopPropagation();S.wzOpen=true;renderPage()">${done ? 'Continue' : 'Declare'}</button>`,
    _on: open ? '' : 'S.wzOpen=true;renderPage()' }
  const past = MD_PAST.map(([d, n, c, e, at]) => ({ d, n: `${n}/${n}`, c: rp(c), e: rp(e), t: rp(c + e), s: stamp(d), _on: `mdPast('${d}',${n},${c},${e},'${at}')` }))
  /* the figures share the width evenly, the day's total beside them; the status keeps a fixed column */
  const body = table([{ l: 'Date', k: 'd', w: 150 }, { l: 'Cashiers Closed', k: 'n', num: 1 }, { l: 'Cash', k: 'c', num: 1 }, { l: 'EDC', k: 'e', num: 1 }, { l: 'Total', k: 't', num: 1 }, { l: 'Money Declaration Status', k: 's', w: 260 }], [today, ...past])
  return page({ title: 'Money declaration', bare: true, body: `<div class="boxed md-list">${body}</div>` }) + (S.wzOpen ? mdWizard() : '')
}
/* a closed day reads as facts, its cashiers underneath */
function mdPast(d, n, c, e, at) {
  const who = ['Dewi Anggraini', 'Budi Santoso', 'Sari Wulandari', 'Agus Setiawan', 'Rizky Pratama', 'Dewi Anggraini'].slice(0, n)
  const share = k => (k + 2) / who.reduce((a, _, j) => a + j + 2, 0)
  openSheet({ title: `Money declaration · ${d}`, caption: `Closed ${at} · Maya Lestari`, size: 'table',
    body: facts([['Cash', rp(c)], ['EDC', rp(e)], ['Cashiers closed', `${n}/${n}`]]) + '<div style="height:24px"></div>' +
      table([{ l: 'Cashier', k: 'w' }, { l: 'Cash', k: 'c', num: 1 }, { l: 'EDC', k: 'e', num: 1 }, { l: 'Closed', k: 't', w: 110 }],
        who.map((w, k) => ({ w, c: rp(Math.round(c * share(k) / 500) * 500), e: rp(Math.round(e * share(k) / 500) * 500), t: `${String(16 + k).padStart(2, '0')}:0${k}` })),
        { w: 'Total', c: rp(c), e: rp(e) }) })
}

/* two pages, no stepper: the notes and the way on stand under the table */
S.notes = { cash: '', edc: '' }
function gFoot(k, buttons) {
  const bl = k === 'edc' && !S.sub ? blockers() : []
  const notes = S.sub ? (S.notes[k] ? `<p class="note-read">${S.notes[k].replace(/</g, '&lt;')}</p>` : '<p class="mute">No notes</p>')
    : `<textarea class="note" rows="3" oninput="S.notes['${k}']=this.value">${S.notes[k]}</textarea>`
  return `<div class="g-foot ${isH() ? 'h' : ''}"><label class="g-notes"><span>Notes</span>${notes}</label>
    ${bl.length ? `<div class="g-block">${isH() ? '<div class="g-block-h">Can\'t submit yet</div>' : ''}${bl.map(([a, b]) => `<div><span>${a}</span><span class="${isH() && !/Rp/.test(b) ? 'mute' : 'neg'}">${b}</span></div>`).join('')}</div>` : ''}
    <div class="g-btns">${buttons.join('')}</div></div>`
}
function mdTwoPages() {
  const done = !!S.sub, stuck = blockers().length > 0
  const go = k => `S.gstep='${k}';renderPage();$('#scroller').scrollTop=0`
  if (S.gstep !== 'edc') S.gstep = 'cash'
  const btns = done ? [] : S.gstep === 'cash' ? [btn('Next: EDC', go('edc'))]
    : [btn('Back to Cash', go('cash')), `<button class="ds-btn ds-btn--primary" type="button" ${stuck ? 'disabled' : ''} onclick="mdSubmit()">Submit</button>`]
  const body = (S.gstep === 'cash' ? (isH() ? mdCashStepH() : mdCashStep()) : (isH() ? mdEdcStepH() : mdEdcStep())) + gFoot(S.gstep, btns)
  return page({ title: S.gstep === 'cash' ? 'Money declaration · Cash' : 'Money declaration · EDC', bare: true,
    titleAfter: done ? (isH() ? quiet(`Submitted ${S.sub.at} · Maya Lestari`) : st(`Submitted ${S.sub.at} · Maya Lestari`, 'ok')) : '',
    actions: done ? [btn(S.gstep === 'cash' ? 'EDC' : 'Cash', go(S.gstep === 'cash' ? 'edc' : 'cash')), btn('Print', 'mdPrint()')] : [], body })
}

function mdPage() {
  const v = S.mdv
  if (v === 'g' || v === 'h') return mdTwoPages()
  if (v === 'i' || v === 'j') return mdWizardPage()
  const actions = [btn('Print', 'mdPrint()')]
  if (v === 'b' || (v === 'c' && S.mdside === 'edc')) {
    const L = mdEdcList(), offN = L.xs.length - L.on.length
    return page({ title: 'Money declaration', bare: true, actions,
      kpi: [['Transactions', L.xs.length], [`EDC ${L.e} in system`, rp(sum(L.xs))], ['Ticked', rp(sum(L.on))], ['Not on the slip', offN, offN ? 'warn' : '']],
      body: (v === 'c' ? bar(mdSwitch()) : '') + L.html })
  }
  /* no figures on top: the omset stands under the table, as the sketch */
  const omset = `<div class="omset"><span>Turnover</span><b>${rp(SHIFTS.reduce((a, s) => a + s.sys, 0))}</b></div>`
  return page({ title: 'Money declaration', bare: true, actions,
    body: (v === 'c' ? bar(mdSwitch()) : '') + (v === 'e' ? mdGrouped() : v === 'f' ? mdRows() : mdMatrix(v === 'd')) + omset })
}

/* a total opens its receipts; the chips switch cash and each EDC */
function mdTx(i, f) {
  if (f) S.txf = f
  const k = S.txf || 'All'
  const mine = TX.filter(x => x.s === i)
  const pass = x => k === 'All' || (k === 'Cash' ? x.m === 'Cash' : x.edc === k)
  const xs = mine.filter(pass), s = SHIFTS[i]
  const opts = [['All', 'All', mine.length], ['Cash', 'Cash', mine.filter(x => x.m === 'Cash').length], ...EDCS.map(e => [e, `EDC ${e}`, mine.filter(x => x.edc === e).length])]
  const sw = `<div class="chips" role="radiogroup">${opts.map(([v, l, n]) => `<button class="chip" type="button" role="radio" aria-checked="${k === v}" onclick="mdTx(${i},'${v}')">${l} <span class="n">${n}</span></button>`).join('')}</div>`
  openSheet({ crumb: ['Money declaration'], title: s.who, caption: `${s.till} · ${s.open}–${s.close || 'open'} · Thu 29 Oct`, size: 'table',
    body: sw + '<div style="height:20px"></div>' + table([{ l: 'Time', k: 't', w: 80 }, { l: 'Receipt', k: 'no', w: 150 }, { l: 'Paid by', k: 'p', w: 170 }, { l: 'EDC', k: 'edc', w: 250 }, { l: 'Amount', k: 'a', num: 1 }],
      xs.map(x => ({ t: x.t, no: x.no, p: x.m === 'Cash' ? 'Cash' : x.kind + wasEdc(x), edc: x.m === 'Cash' ? '<span class="faint">—</span>' : edcPick(x, `mdTx(${i})`), a: rp(x.amt) })), { t: 'Total', no: `${xs.length} receipts`, a: rp(sum(xs)) }) })
}
/* D: one cashier on one EDC, ticked like B */
function mdEdcSheet(i, e) {
  const xs = TX.filter(x => x.s === i && x.edc === e), on = xs.filter(x => !S.off.has(x.id))
  const tick = x => `<input type="checkbox" class="tick" aria-label="On the slip" ${S.off.has(x.id) ? '' : 'checked'} onchange="mdTick(${x.id},this.checked);mdEdcSheet(${i},'${e}')">`
  openSheet({ crumb: ['Money declaration'], title: `${SHIFTS[i].who} · EDC ${e}`, caption: `${SHIFTS[i].till} · ${SHIFTS[i].open}–${SHIFTS[i].close || 'open'}`, size: 'table',
    body: kpis([['In system', rp(sum(xs))], ['Ticked', rp(sum(on))], ['Not on the slip', xs.length - on.length, xs.length - on.length ? 'warn' : '']]) +
      table([{ l: '', k: 'c', w: 56 }, { l: 'Time', k: 't', w: 80 }, { l: 'Receipt', k: 'no', w: 150 }, { l: 'Card', k: 'kind', w: 170 }, { l: 'EDC', k: 'edc', w: 250 }, { l: 'Amount', k: 'a', num: 1 }],
        xs.map(x => ({ c: tick(x), t: x.t, no: x.no, kind: x.kind + wasEdc(x), edc: edcPick(x, `mdEdcSheet(${i},'${e}')`), a: rp(x.amt) })), { t: 'Ticked', no: `${on.length} of ${xs.length}`, a: rp(sum(on)) }) })
}

/* Print: the paper the store head signs, in Indonesian like every printed paper */
function mdPrint() {
  const C = SHIFTS.map((s, i) => i)
  const r = (l, f, b) => `<tr class="${b ? 'b' : ''}"><td>${l}</td>${C.map(i => `<td>${f(i)}</td>`).join('')}</tr>`
  const m = n => n == null ? '—' : dots(n)
  const omset = SHIFTS.reduce((a, s) => a + s.sys, 0)
  openSheet({ crumb: ['Money declaration'], title: 'Print', size: 'table', actions: [['Print']],
    body: `<div class="paper"><div class="p-title">CASHIER DEPOSIT REPORT</div><div class="p-sub">Grand Indonesia · Thursday, 29 October 2026</div>
      <table class="p-tbl"><thead><tr><th></th>${SHIFTS.map(s => `<th>${s.who}<br><span>${s.till} ${s.open}–${s.close || 'open'}</span></th>`).join('')}</tr></thead><tbody>
      ${r('Cash', i => dots(SHIFTS[i].cash))}${EDCS.map(e => r(`EDC ${e}`, i => dots(edcOf(i, e)))).join('')}${r('Sales', i => dots(SHIFTS[i].sys), 1)}
      ${r('Opening float', i => dots(MD[i].float))}${r('Temporary deposits', i => dots(dropsOf(i)))}${r('Expected in drawer', i => dots(expected(i)))}
      ${r('Cash counted', i => m(MD[i].declared))}${r('Difference', i => mdDiff(i) == null ? '—' : (mdDiff(i) < 0 ? '−' : '') + dots(mdDiff(i)), 1)}</tbody></table>
      <div class="p-omset"><span>Turnover</span><b>Rp ${dots(omset)}</b></div>
      <div class="p-sign">${SHIFTS.map(s => `<div><span>Cashier</span><i></i>${s.who}</div>`).join('')}<div><span>Store head</span><i></i>Maya Lestari</div></div></div>` })
}

function renderPage(keepFocus) {
  const pos = keepFocus && document.activeElement?.selectionStart
  $('#page').innerHTML = (SCREENS[S.id] || SCREENS.today)()
  $('#ptitle').textContent = LABEL[S.id]
  $('#page').style.setProperty('--head-h', ($('#page .door-head')?.offsetHeight || 0) + 'px')
  if (keepFocus) { const n = $('#page .ds-search input'); if (n) { n.focus(); n.setSelectionRange(pos, pos) } }
}
S.id = 'money'; S.mdv = 'i'; S.panel = true
demoClose(true)
side(); renderPage(); mdChrome()
</script>
</body>
