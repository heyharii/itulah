<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PO matte options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* frontend-hub, All white look — values measured off the running hub (:5350, /procurement/orders, 20 Oct) */
:root {
  --stone: #e8ebf0;
  --ink: #1d1d1f;
  --body: #6e6e73;
  --faint: #c7c7cc;
  --hair: #e8e8ec;
  --hair-2: #dcdce1;
  --row: #eeeef1;
  --soft: #fafafb;
  --soft-2: #f2f2f5;
  --soft-3: #f5f5f7;
  --accent: #2862dc;
  --accent-bg: #eef3fc;
  --ok-fg: #248a3d;
  --ok: #36b827;
  --bad: #d70015;
  --rail-text: #344054;
  --rail-mute: #8a92a0;
  --panel-ink: #1d2939;
  --r-inner: 8px;
  --r-card: 10px;
  --r-sheet: 16px;
  --shadow-page: 0 0 0 1px rgb(0 0 0 / 5%), 0 2px 8px rgb(0 0 0 / 4%), 0 24px 72px rgb(0 0 0 / 8%);
  --shadow-panel: 0 0 0 1px rgb(0 0 0 / 5%), 0 2px 6px rgb(0 0 0 / 4%);
  --shadow-rail-tile: 0 0 0 1px rgb(16 24 40 / 7%), 0 1px 2px rgb(16 24 40 / 8%);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --font: "Inter Variable", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  /* matte: the Deep icon's blue, and Gojek's family colours */
  --m-top: #4a80ea;
  --m-foot: #2155c8;
}
* { box-sizing: border-box; margin: 0; }
html, body { min-height: 100%; }
body { font-family: var(--font); font-size: 15px; line-height: 20px; color: var(--ink); background: #d9dce2; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
h1, h2, h3, p { font: inherit; }
svg { display: block; flex: none; }
.ln { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
body[data-chrome="off"] .proto-picker { display: none; }

#stage { padding: 112px 16px 48px; display: flex; justify-content: center; }
body[data-chrome="off"] #stage { padding-top: 16px; }
.deskwrap { position: relative; flex: none; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgb(0 0 0 / 18%); }
.desk { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }

/* ── the matte pictures (as the phone grid draws them): pastel square top-left, picture stepping out ── */
.mpic { position: relative; display: block; width: var(--s); height: var(--s); flex: none; }
.mpic-bg { position: absolute; left: 0; top: 0; width: 78%; height: 78%; border-radius: 30%; background: var(--cb); }
.mpic svg { position: absolute; left: 23%; top: 19%; width: 77%; height: 77%; overflow: visible; }
.mpic.bare .mpic-bg { display: none; }
.mpic.bare svg { left: 0; top: 0; width: 100%; height: 100%; }
.mpic .b { fill: var(--gb); } .mpic .d { fill: var(--gd); } .mpic .l { fill: var(--gl); }
.mpic .b[stroke] { stroke: var(--gb); } .mpic .d[stroke] { stroke: var(--gd); }
.mpic .w { fill: #f4f2ee; } .mpic .a { fill: var(--ac, #f7b928); } .mpic .hl { display: none; }
.mpic .sa { fill: none; stroke: var(--ac, #f7b928); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.mpic .sd { fill: none; stroke: var(--cd); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.mpic .sw { fill: none; stroke: #fff; stroke-opacity: .55; stroke-width: 2.4; stroke-linecap: round; }

/* ═════════ DESK ═════════ */
.shell { display: flex; width: 1440px; height: 900px; padding: 12px 12px 12px 0; background: var(--stone); }
.rail { position: relative; width: 68px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 0; margin-top: -12px; }
.rail .rb { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-inner); color: var(--rail-mute); }
.rail .rb svg.ln { width: 20px; height: 20px; }
.rail .rb.search { margin: 12px 0 10px; color: var(--rail-text); border-radius: 10px; }
.rail .rb.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-rail-tile); }
.rail .rb .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--stone); }
.rail .rb.on .dot { box-shadow: 0 0 0 2px #fff; }
.orb { position: absolute; bottom: 16px; left: 18px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); font-weight: 600; box-shadow: 0 0 0 2px var(--accent); }
.orb i { position: absolute; top: -8px; right: -12px; height: 18px; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-style: normal; font-size: 12px; line-height: 18px; font-weight: 600; }

.panel { width: 216px; flex: none; margin-right: 12px; border-radius: var(--r-sheet); background: #fff; box-shadow: var(--shadow-panel); padding: 12px 10px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; height: 28px; padding: 0 6px; margin-bottom: 22px; }
.panel-head h2 { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; color: var(--panel-ink); }
.panel-head svg { width: 18px; height: 18px; color: var(--rail-mute); }
.plink { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r-inner); color: var(--rail-text); margin-bottom: 2px; }
.plink.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.plink .cnt { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 13px; line-height: 20px; font-weight: 600; text-align: center; }

.page { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: var(--r-sheet); background: #fff; box-shadow: var(--shadow-page); overflow: hidden; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 84px; flex: none; padding: 0 40px 0 28px; border-bottom: 1px solid var(--hair); }
.page-head h1 { display: flex; align-items: center; gap: 12px; font-size: 17px; line-height: 24px; font-weight: 600; }
.btn-primary { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 10px; border-radius: var(--r-inner); background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 1px 2px rgb(20 50 100 / 10%); }
.btn-primary svg { width: 18px; height: 18px; }
.page-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 40px 0 28px; display: flex; flex-direction: column; }

.kpis { display: flex; align-items: stretch; margin-bottom: 32px; }
.kpi { display: flex; flex-direction: column; padding: 0 24px; border-left: 1px solid var(--hair); }
.kpi:first-child { padding-left: 0; border-left: 0; }
.kpi > div { display: flex; flex-direction: column; }
.kpi .k-l { color: var(--body); }
.kpi .k-v { padding-top: 6px; font-size: 16px; line-height: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--hair); margin-bottom: 16px; }
.tab { position: relative; padding: 8px 0 11px; font-weight: 500; color: var(--body); white-space: nowrap; }
.tab .n { color: var(--body); font-weight: 400; margin-left: 4px; }
.tab.on { color: var(--ink); }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }

.bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.field { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--hair-2); border-radius: var(--r-inner); background: #fff; color: #8e8e93; }
.field svg { width: 16px; height: 16px; }
.field.search { width: 280px; }
.field.date { min-width: 136px; justify-content: space-between; gap: 16px; white-space: nowrap; }
.toggle { white-space: nowrap; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--hair-2); border-radius: var(--r-inner); color: var(--ink); }
.toggle i { width: 30px; height: 18px; border-radius: 9px; background: #e5e5ea; position: relative; }
.toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 15%); }
.ghost { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--hair-2); border-radius: var(--r-inner); font-weight: 500; margin-left: auto; }
.ghost svg { width: 16px; height: 16px; }

.tbl { width: 100%; border-collapse: separate; border-spacing: 0; }
.tbl th { position: sticky; top: 0; z-index: 1; height: 40px; padding: 0 16px; background: var(--soft); box-shadow: inset 0 -1px 0 var(--hair); text-align: left; font-weight: 500; color: var(--body); white-space: nowrap; }
.tbl td { padding: 12px 16px; border-bottom: 1px solid var(--row); white-space: nowrap; vertical-align: middle; }
.tbl .r { text-align: right; }
.tbl tr.body:hover td { background: #fafafc; }
.po-name { font-weight: 500; }
.po-sub { color: var(--body); }
.po-sub .id { font-family: var(--mono); font-size: 14px; letter-spacing: -0.01em; }
.num { display: flex; flex-direction: column; align-items: flex-end; line-height: 24px; font-variant-numeric: tabular-nums; }
.num b { font-weight: 500; }
.num span { color: var(--body); }
.st { display: inline-flex; align-items: center; gap: 7px; color: var(--ok-fg); }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.late { color: var(--bad); }
.pc-top .who em.late { color: var(--bad); }
.rc { display: inline-flex; align-items: center; gap: 6px; height: 28px; margin: -4px 0; padding: 0 8px; border-radius: var(--r-inner); background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 2px rgb(20 50 100 / 10%); transition: transform 160ms var(--ease-out); }
.rc:active { transform: scale(0.97); }
.rc svg.ln { width: 15px; height: 15px; stroke-width: 2; }
.pc-foot .rc { height: 44px; margin: -8px 0; padding: 0 14px; }
.tfoot td { position: sticky; bottom: 0; background: var(--soft); box-shadow: inset 0 1px 0 var(--hair); border: 0; font-variant-numeric: tabular-nums; }
.tfoot .num b { font-weight: 600; }

/* ═════════ PHONE ═════════ */
.phone { position: relative; width: 414px; height: 896px; flex: none; border-radius: 52px; padding: 10px; background: #1d1d1f; box-shadow: 0 20px 60px rgb(0 0 0 / 22%); }
.ps { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #fff; }
.p-status { position: absolute; z-index: 5; inset: 0 0 auto; height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0 36px; font-family: -apple-system, "SF Pro Text", var(--font); font-size: 16px; font-weight: 600; background: rgb(255 255 255 / 90%); }
.p-status .isl { position: absolute; left: 50%; top: 10px; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
.p-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 47px 0 190px; scrollbar-width: none; }
.p-title { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; }
.p-sum { padding: 0 16px 16px; color: var(--body); line-height: 24px; border-bottom: 1px solid var(--hair); }
.p-sum b { color: var(--bad); font-weight: 600; }
.p-cards { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.pc { border: 1px solid var(--hair); border-radius: var(--r-card); background: #fff; }
.pc-top { display: flex; justify-content: space-between; gap: 12px; padding: 16px 16px 14px; }
.pc-top .who { min-width: 0; display: flex; flex-direction: column; gap: 2px; line-height: 22px; }
.pc-top .who b { font-weight: 600; }
.pc-top .who span { color: var(--body); }
.pc-top .who span em { font-style: normal; color: var(--ink); }
.pc-top .fig { display: flex; flex-direction: column; align-items: flex-end; line-height: 22px; font-variant-numeric: tabular-nums; }
.pc-top .fig b { font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em; }
.pc-top .fig b small { font-size: 15px; font-weight: 400; color: var(--body); letter-spacing: 0; margin-left: 3px; }
.pc-top .fig span { color: var(--body); }
.pc-foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--hair); color: var(--body); }
.dock { position: absolute; z-index: 6; left: 8px; right: 8px; bottom: 68px; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: rgb(255 255 255 / 88%); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 0 0 1px rgb(0 0 0 / 5%), 0 8px 24px rgb(0 0 0 / 10%); }
.chip { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 16px; border-radius: 999px; background: var(--soft-2); font-weight: 500; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; color: var(--body); }
.dsearch { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 999px; background: var(--soft-2); color: #8e8e93; }
.dsearch span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dsearch svg { width: 17px; height: 17px; }
.round { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--soft-2); color: var(--body); }
.round svg { width: 18px; height: 18px; }
.plusb { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--accent); color: #fff; }
.plusb svg { width: 22px; height: 22px; stroke-width: 2; }
.tabbar { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; height: 60px; display: grid; grid-template-columns: repeat(4, 1fr); background: rgb(255 255 255 / 92%); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 var(--hair); padding-bottom: 4px; }
.tb { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8e8e93; font-weight: 500; }
.tb svg.ln { width: 22px; height: 22px; }
.tb.on { color: var(--accent); background: var(--accent-bg); }
.tb.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tb .bd { position: absolute; top: 8px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.porb { position: absolute; z-index: 7; right: 8px; bottom: 128px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: #fff; box-shadow: 0 0 0 2px var(--accent), 0 8px 20px rgb(0 0 0 / 14%); }
.porb span { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); font-size: 18px; font-weight: 600; }
.porb i { position: absolute; top: -6px; right: -4px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-style: normal; font-size: 13px; line-height: 20px; font-weight: 600; }

/* ═════════ MATTE levels ═════════ */
/* Touch and up: the one solid button is matte — tones top → foot, a soft coloured shadow, no inner shine */
.m .btn-primary, .m .plusb { background: linear-gradient(180deg, var(--m-top), var(--m-foot)); box-shadow: 0 1px 1px rgb(16 40 110 / 10%), 0 8px 16px -8px rgb(33 85 200 / 65%); }
.m .rail .rb .mpic { --s: 26px; }
.m .rail .rb.on { box-shadow: var(--shadow-rail-tile); }
.m .tb .mpic { --s: 26px; }
.m .rc { background: linear-gradient(180deg, var(--m-top), var(--m-foot)); box-shadow: 0 1px 1px rgb(16 40 110 / 10%), 0 6px 12px -6px rgb(33 85 200 / 60%); }
.soft .rc { height: 32px; margin: -6px 0; padding: 0 12px 0 10px; border-radius: 10px; }
.soft .pc-foot .rc { height: 44px; border-radius: 12px; }
.m .orb, .m .porb span { background: linear-gradient(180deg, #e6eefc, #cddcf8); }

/* Matte and up: pictures on the head, the panel, the figures */
.kpis.pics .kpi { flex-direction: row; align-items: center; gap: 12px; }
.kpis.pics .kpi > div { display: flex; flex-direction: column; }
.plink .mpic { --s: 22px; }
.page-head .mpic { --s: 30px; }
.p-title .mpic { --s: 30px; }
.p-sum.pic { display: flex; gap: 12px; align-items: flex-start; }

/* Soft: the boldest — a pastel ground, cards that float instead of hairlines, a segmented strip */
:is(.soft, .softdesk) .shell { background: linear-gradient(180deg, #eef2fb, #e3eaf7); }
:is(.soft, .softdesk) .rail .rb .dot { box-shadow: 0 0 0 2px #e9eef9; }
.soft .rail .rb { width: 44px; height: 44px; border-radius: 12px; }
.soft .rail .rb.on { background: #fff; }
:is(.soft, .softdesk) .panel, :is(.soft, .softdesk) .page { box-shadow: 0 1px 2px rgb(24 50 120 / 6%), 0 18px 48px -20px rgb(24 60 150 / 22%); }
:is(.soft, .softdesk) .plink.on { background: #e3ebfb; }
:is(.soft, .softdesk) .tabs { border: 0; gap: 2px; padding: 3px; border-radius: 10px; background: #f1f4fa; width: max-content; }
:is(.soft, .softdesk) .tab { padding: 6px 14px; border-radius: 8px; }
:is(.soft, .softdesk) .tab.on { background: #fff; box-shadow: 0 1px 2px rgb(24 50 120 / 10%), 0 2px 6px rgb(24 50 120 / 6%); }
:is(.soft, .softdesk) .tab.on::after { display: none; }
.soft .kpis.pics { gap: 12px; }
.soft .kpis.pics .kpi { padding: 12px 18px 12px 12px; border: 0; border-radius: 14px; background: #f6f8fc; }
:is(.soft, .softdesk) :is(.field, .toggle, .ghost) { border-color: transparent; background: #f1f4fa; }
:is(.soft, .softdesk) .tbl th { background: #f6f8fc; }
:is(.soft, .softdesk) .tfoot td { background: #f6f8fc; }
/* Soft cards on a desk: Soft's figures as soft cards, with no pictures (the desk keeps Touch's icons) */
.softdesk .kpis { gap: 12px; }
/* the table's head and totals as rounded bands (owner, 20 Oct: "tambahin radius di footer dan header table") */
.softdesk .tbl thead th:first-child { border-top-left-radius: 12px; } .softdesk .tbl thead th:last-child { border-top-right-radius: 12px; }
.softdesk .tbl thead th { box-shadow: none; }
.softdesk .tfoot td { box-shadow: none; } .softdesk .tfoot td:first-child { border-radius: 12px 0 0 12px; } .softdesk .tfoot td:last-child { border-radius: 0 12px 12px 0; }
.softdesk .kpis .kpi { padding: 10px 18px; border: 0; border-radius: 14px; background: #f6f8fc; }
:is(.soft, .softcard) .ps { background: #f4f6fb; }
:is(.soft, .softcard) .p-status { background: rgb(244 246 251 / 90%); }
:is(.soft, .softcard) .p-sum { border: 0; margin: 0 16px; padding: 14px; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgb(24 50 120 / 6%); }
:is(.soft, .softcard) .pc { border: 0; border-radius: 16px; box-shadow: 0 1px 2px rgb(24 50 120 / 6%), 0 10px 24px -14px rgb(24 60 150 / 25%); }
:is(.soft, .softcard) .pc-foot { border-top-color: #f0f2f7; }
.soft .chip, .soft .dsearch, .soft .round { background: #eef2fa; }
/* Soft cards: Soft's phone cards, everything else as today. The button is today's thin one (28px, solid blue);
   a 44px hit area stands invisibly round it, as the hub's own row buttons do. Desk stays as today. */
.softcard .pc-foot .rc { position: relative; height: 28px; margin: -4px 0; padding: 0 8px; }
.softcard .pc-foot .rc::after { content: ""; position: absolute; inset: -8px -4px; }


/* ═════════ SHEETS: the order's detail and the New PO form (measured off :5350, 20 Oct) ═════════ */
.shell { position: relative; }
.scrim { position: absolute; z-index: 20; inset: 0; background: rgb(208 208 213 / 48%); }
.sheet { position: absolute; z-index: 21; top: 12px; right: 12px; bottom: 12px; width: 1040px; display: flex; flex-direction: column; border-radius: var(--r-sheet); background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 5%), 0 2px 8px rgb(0 0 0 / 5%), 0 24px 64px rgb(0 0 0 / 14%); overflow: hidden; }
.sh-head { display: flex; justify-content: space-between; gap: 16px; flex: none; padding: 28px 36px 20px; border-bottom: 1px solid var(--hair); }
.crumb { color: var(--body); }
.crumb i { font-style: normal; margin: 0 6px; color: var(--faint); }
.sh-title { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 17px; line-height: 24px; font-weight: 600; }
.sh-title .st { font-size: 15px; font-weight: 500; }
.rlink { color: var(--accent); }
.x { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-inner); color: var(--body); }
.x svg { width: 16px; height: 16px; }
.sh-body { flex: 1; min-height: 0; overflow: auto; padding: 28px 36px 32px; scrollbar-width: none; }
.sh-foot { display: flex; justify-content: flex-end; gap: 8px; flex: none; padding: 14px 36px; border-top: 1px solid var(--hair); background: #fff; }
.sh-foot .btn-primary, .sh-foot .btn-red, .sh-foot .btn-line { padding: 0 16px; }
.btn-red { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: var(--r-inner); background: var(--bad); color: #fff; font-weight: 600; }
.btn-line { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: var(--r-inner); border: 1px solid var(--hair-2); background: #fff; color: var(--accent); font-weight: 600; }
.btn-line svg, .btn-red svg { width: 16px; height: 16px; }
.btn-primary.dim { opacity: .45; }
.facts { display: flex; margin-bottom: 36px; }
.fact { display: flex; flex-direction: column; gap: 5px; padding: 0 24px; border-left: 1px solid var(--hair); }

.items { border: 1px solid var(--hair); border-radius: var(--r-card); overflow: hidden; }
.itbl { width: 100%; border-collapse: separate; border-spacing: 0; }
.itbl th { height: 40px; padding: 0 16px; background: var(--soft); text-align: left; font-weight: 500; color: var(--body); white-space: nowrap; }
.itbl td { padding: 14px 16px; border-top: 1px solid var(--hair); vertical-align: middle; white-space: nowrap; font-variant-numeric: tabular-nums; }

.itbl .act { width: 84px; }
.itbl .act span { display: inline-flex; gap: 4px; color: var(--body); }
.itbl .act svg { width: 32px; height: 32px; padding: 8px; border-radius: var(--r-inner); }
.item { display: flex; align-items: center; gap: 12px; }

.item > div span { color: var(--body); }
.item > div span.rlink { color: var(--accent); }
.thumb { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 8px; background: var(--soft-2); }
.thumb svg { width: 30px; height: 30px; }
.totals { width: 340px; margin: 16px 0 0 auto; font-variant-numeric: tabular-nums; }

.seg { display: flex; padding: 2px; border-radius: 9px; background: #f2f2f4; }

.disc { display: flex; gap: 8px; align-items: center; }
.notes h4, .fsec h4 { font-weight: 600; }
.notes { margin-top: 40px; }
.notes h4 { font-weight: 400; color: var(--body); margin-bottom: 12px; }
.activity { display: flex; align-items: center; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--hair); color: var(--body); }

.fsec { padding-bottom: 28px; margin-bottom: 28px; border-bottom: 1px solid var(--hair); }

.fsec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }

.psheet .sh-body { padding: 20px 16px 24px; }

.pfacts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-bottom: 24px; }
.pfacts div { display: flex; flex-direction: column; gap: 2px; }
.pfacts span { color: var(--body); }

.plines { border-top: 1px solid var(--hair); }

.pline .item { align-items: flex-start; margin-bottom: 14px; }

.psheet .totals { width: auto; margin-top: 8px; }
.psheet .fgrid { grid-template-columns: 1fr; }
.psheet .inp { height: 44px; }
.psheet .inp.num { width: 120px; height: 36px; }
.psheet .notes { margin-top: 24px; }

/* Soft cards on a desk: the sheet takes the list page's soft ground pieces; buttons stay today's */
.softdesk .sheet { border-radius: 20px; box-shadow: 0 1px 2px rgb(24 50 120 / 6%), 0 24px 64px -16px rgb(24 60 150 / 30%); }

.softdesk .sh-head, .softdesk .sh-foot { border-color: #eef0f5; }

.softdesk .seg { background: #eef2fa; }
.softdesk .totals .inp { background: #fff; }
.softdesk .thumb { background: #eef1f7; border-radius: 10px; }

.softcard .psheet .seg { background: #eef2fa; }
.softcard .thumb { background: #eef1f7; border-radius: 10px; }

/* Gojek's few colours, sampled (the phone grid's Family palette) — base, shade, light, ground */
const FAM = {
  G: ["#30a830", "#1e7a22", "#4cc03c", "#def6cc"],
  R: ["#ec2d3a", "#9c2a30", "#f2525c", "#fcdede"],
  B: ["#00a8cc", "#00799a", "#22bfe0", "#d2f0f6"],
  O: ["#f08c1a", "#b5620c", "#f6a640", "#fdead2"],
  K: ["#b4b4ba", "#8e8e93", "#d8d8dc", "#f2f2f5"], // grey: an inactive picture keeps its shape, drops its colour
  D: ["#2f63d8", "#183f9c", "#7fa3f0", "#e3ebfb"], // the Deep icon's blue
};
const mixHex = (a, b, t) => {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v * t + B[i] * (1 - t)).toString(16).padStart(2, "0")).join("");
};
let mu = 0;
function pic(art, fam, size, { bare = false } = {}) {
  const [c, cd, cl, cb] = FAM[fam];
  const u = "mp" + ++mu;
  const g = (k, stops) => `<linearGradient id="${u}${k}" x1="0" y1="0" x2=".25" y2="1">${stops.map(([o, col]) => `<stop offset="${o}" stop-color="${col}"/>`).join("")}</linearGradient>`;
  const defs = g("b", [[0, mixHex(c, cl, 0.78)], [0.45, c], [1, mixHex(c, cd, 0.45)]]) + g("d", [[0, mixHex(cd, c, 0.8)], [1, mixHex(cd, "#000000", 0.72)]]) + g("l", [[0, cl], [1, mixHex(cl, c, 0.5)]]);
  const accent = fam === "K" ? "--ac:#d1d1d6;" : "";
  return `<span class="mpic${bare ? " bare" : ""}" style="${accent}--cd:${cd};--cb:${cb};--gb:url(#${u}b);--gd:url(#${u}d);--gl:url(#${u}l);--s:${size}px"><span class="mpic-bg"></span><svg viewBox="0 0 48 48" aria-hidden="true"><defs>${defs}</defs><ellipse cx="26" cy="46" rx="16" ry="2.4" fill="${cd}" opacity=".3"/>${ART[art]}</svg></span>`;
}

/* ── harness ── */
const stage = document.getElementById("stage");
function fit() {
  const wrap = stage.querySelector(".deskwrap");
  if (!wrap) return;
  const k = Math.min(1, (stage.clientWidth - 32) / 1440);
  wrap.style.width = 1440 * k + "px";
  wrap.style.height = 900 * k + "px";
  wrap.firstElementChild.style.transform = `scale(${k})`;
}
function mount() {
  mu = 0;
  document.body.className = ["now", "m touch", "m matte", "m soft", "now softcard"][level] + (level === 4 && device === 0 && deskLayout === 1 ? " softdesk" : "");
  const showIcons = level === 4 && device === 1;
  const showLayout = level === 4 && device === 0;
  document.body.toggleAttribute("data-icons", showIcons);
  document.body.toggleAttribute("data-layout", showLayout);
  if (showIcons) iconsPick.move();
  if (showLayout) layoutPick.move();
  stage.innerHTML = device === 0 ? `<div class="deskwrap"><div class="desk">${desk()}</div></div>` : phone();
  fit();
}
window.addEventListener("resize", fit);

function makePicker(nav, param, count, onChange, def = 0) {
  const highlight = nav.querySelector(".proto-picker-highlight");
  const items = [...nav.querySelectorAll(".proto-picker-item")];
  let at = 0;
  const move = () => { const el = items[at]; highlight.style.width = el.offsetWidth + "px"; highlight.style.transform = `translateX(${el.offsetLeft}px)`; };
  function set(i) {
    if (i < 0 || i >= count) return;
    at = i;
    items.forEach((el, j) => { el.toggleAttribute("data-active", j === i); if (j === i) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current"); });
    move();
    const url = new URL(location); url.searchParams.set(param, i + 1); history.replaceState(null, "", url);
    onChange(i);
  }
  items.forEach((el, i) => el.addEventListener("click", () => set(i)));
  window.addEventListener("resize", move);
  const start = (parseInt(new URLSearchParams(location.search).get(param), 10) || def + 1) - 1;
  return { set, move, start: () => set(start), get at() { return at; }, ready: () => nav.setAttribute("data-ready", "") };
}
let booted = false;
const picker = makePicker(document.getElementById("variants"), "v", 5, (i) => { level = i; if (booted) mount(); });
const screensPick = makePicker(document.getElementById("screens"), "s", 3, (i) => { screen = i; if (booted) mount(); });
const states = makePicker(document.getElementById("states"), "d", 2, (i) => { device = i; if (booted) mount(); });
const iconsPick = makePicker(document.getElementById("icons"), "i", 3, (i) => { icons = i; if (booted) mount(); }, 1);
const layoutPick = makePicker(document.getElementById("layout"), "l", 2, (i) => { deskLayout = i; if (booted) mount(); }, 1);
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 5) picker.set(n - 1);
  else if (e.key === "ArrowRight") picker.set((level + 1) % 5);
  else if (e.key === "ArrowLeft") picker.set((level + 4) % 5);
  else if (e.key === "p" || e.key === "P" || e.key === "s" || e.key === "S") states.set((states.at + 1) % 2);
  else if (e.key === "h" || e.key === "H") document.body.dataset.chrome = document.body.dataset.chrome === "off" ? "" : "off";
});
states.start();
iconsPick.start();
layoutPick.start();
screensPick.start();
picker.start();
booted = true;
mount();
requestAnimationFrame(() => requestAnimationFrame(() => { picker.ready(); states.ready(); iconsPick.ready(); layoutPick.ready(); screensPick.ready(); }));
</script>
