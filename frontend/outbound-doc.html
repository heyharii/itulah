<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Dokumen Outbound</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #e2e8f0; color: #0f172a;
      font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12px; }
    .actions { display: flex; gap: 8px; justify-content: center; padding: 16px; }
    .actions button, .actions select { padding: 8px 14px; border: 1px solid #94a3b8;
      border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }

    /* A5 portrait: fits a clipboard and a document pouch on a carton. */
    .paper { width: 148mm; min-height: 200mm; margin: 0 auto 24px; background: #fff;
      padding: 12mm 10mm; box-shadow: 0 2px 12px rgba(0,0,0,.25); }

    .head { display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 2px solid #0f172a; padding-bottom: 8px; margin-bottom: 12px; }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: #475569; }
    .docno { text-align: right; }
    .docno .num { font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 15px; font-weight: 700; }
    .docno .when { font-size: 10px; color: #475569; }

    .meta { display: grid; grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 4px 16px; margin-bottom: 14px; }
    .meta div { display: flex; gap: 6px; }
    .meta .k { color: #475569; min-width: 78px; }
    .meta .v { font-weight: 600; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
      color: #475569; border-bottom: 1px solid #0f172a; padding: 5px 6px; font-weight: 600; }
    td { padding: 5px 6px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums;
      font-family: "SF Mono", ui-monospace, Menlo, monospace; }
    .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
    tfoot td { border-top: 2px solid #0f172a; border-bottom: none; font-weight: 700; padding-top: 7px; }

    .group { margin: 10px 0 4px; font-weight: 700; font-size: 12px;
      background: #f1f5f9; padding: 4px 6px; }

    .sign { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px;
      margin-top: 28px; page-break-inside: avoid; }
    .sign div { text-align: center; }
    .sign .line { margin-top: 42px; border-top: 1px solid #0f172a; padding-top: 4px;
      font-size: 10px; color: #475569; }

    .note { font-size: 10px; color: #475569; margin-top: 14px; line-height: 1.5; }
    /* The QR sits beside the header block: the first thing a phone is pointed at. */
    .qr { float: right; margin: 0 0 8px 14px; text-align: center; }
    .qr svg { display: block; width: 30mm; height: 30mm; }
    .qr .cap { font-size: 9px; color: #475569; margin-top: 2px;
      font-family: "SF Mono", ui-monospace, Menlo, monospace; }
    #error { color: #dc2626; text-align: center; padding: 24px; }

    @media print {
      body { background: #fff; }
      .actions { display: none; }
      .paper { box-shadow: none; margin: 0; width: auto; min-height: 0; padding: 0; }
      @page { size: A5 portrait; margin: 12mm 10mm; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <button onclick="window.print()">Cetak</button>
    <button onclick="location.href='/'">Kembali</button>
  </div>
  <div id="error" hidden></div>
  <div class="paper" id="paper" hidden></div>

  <script src="/auth.js" defer></script>
  <script defer>
    (function () {
      'use strict';

      var BRAND = 'Wira Makmur';
      var params = new URLSearchParams(location.search);
      var kind = params.get('doc');
      var id = params.get('id');
      var paper = document.getElementById('paper');
      var errorBox = document.getElementById('error');

      function fail(message) {
        errorBox.hidden = false;
        errorBox.textContent = message;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function when(value) {
        if (!value) return '-';
        var d = new Date(value);
        if (isNaN(d.getTime())) return value;
        return d.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
      }

      function num(value) {
        return new Intl.NumberFormat('id-ID').format(value || 0);
      }

      function head(kindLabel, number, subtitle) {
        var h = el('div', 'head');
        var left = el('div');
        left.appendChild(el('div', 'brand', BRAND));
        left.appendChild(el('div', 'kind', kindLabel));
        var right = el('div', 'docno');
        right.appendChild(el('div', 'num', number));
        right.appendChild(el('div', 'when', subtitle));
        h.appendChild(left);
        h.appendChild(right);
        return h;
      }

      function meta(pairs) {
        var box = el('div', 'meta');
        pairs.forEach(function (pair) {
          var row = el('div');
          row.appendChild(el('span', 'k', pair[0]));
          row.appendChild(el('span', 'v', pair[1] === undefined || pair[1] === null || pair[1] === '' ? '-' : pair[1]));
          box.appendChild(row);
        });
        return box;
      }

      function table(columns, rows, footer) {
        var t = el('table');
        var thead = el('thead');
        var hr = el('tr');
        columns.forEach(function (column) {
          var th = el('th', column.num ? 'num' : null, column.label);
          hr.appendChild(th);
        });
        thead.appendChild(hr);
        t.appendChild(thead);
        var tbody = el('tbody');
        rows.forEach(function (cells) {
          var tr = el('tr');
          cells.forEach(function (cell, index) {
            var td = el('td', columns[index].num ? 'num' : (columns[index].mono ? 'mono' : null), cell);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        t.appendChild(tbody);
        if (footer) {
          var tfoot = el('tfoot');
          var fr = el('tr');
          footer.forEach(function (cell, index) {
            fr.appendChild(el('td', columns[index].num ? 'num' : null, cell));
          });
          tfoot.appendChild(fr);
          t.appendChild(tfoot);
        }
        return t;
      }

      function signatures(labels) {
        var box = el('div', 'sign');
        labels.forEach(function (label) {
          var cell = el('div');
          cell.appendChild(el('div', 'line', label));
          box.appendChild(cell);
        });
        return box;
      }

      function note(text) {
        return el('div', 'note', text);
      }

      // ---- the four documents ------------------------------------------

      function renderPicklist(data) {
        var lines = data.lines || [];
        var total = lines.reduce(function (sum, line) { return sum + line.outstanding; }, 0);
        paper.appendChild(head('Daftar Ambil', 'PICKLIST', when(new Date().toISOString())));
        paper.appendChild(meta([
          ['Dicetak', when(new Date().toISOString())],
          ['Baris SKU', num(lines.length)]
        ]));
        paper.appendChild(table(
          [{ label: 'SKU', mono: true }, { label: 'Allotment menunggu', num: true }, { label: 'Ambil', num: true }],
          lines.map(function (line) {
            return [line.sku_code, num(line.allotment_lines), num(line.outstanding)];
          }),
          ['Total', '', num(total)]
        ));
        paper.appendChild(note(
          'Daftar ini tidak menyebut toko. Tujuan tiap potong ditentukan saat masuk koli, ' +
          'bukan saat diambil dari rak — jadi barang yang sudah diambil tidak terikat pada ' +
          'satu toko dan tidak terdampar bila allotment dibatalkan.'
        ));
        paper.appendChild(signatures(['Diambil oleh', 'Diperiksa oleh']));
      }

      function qrBlock(svgMarkup, caption) {
        var box = el('div', 'qr');
        // The markup comes from our own server-side encoder, never from a user.
        box.innerHTML = svgMarkup;
        box.appendChild(el('div', 'cap', caption));
        return box;
      }

      function renderPacking(data) {
        var koli = data.koli || {};
        var lines = data.lines || [];
        var total = lines.reduce(function (sum, line) { return sum + line.quantity; }, 0);
        paper.appendChild(head('Packing List', koli.koli_number, 'Isi koli'));
        if (data.qr_svg) paper.appendChild(qrBlock(data.qr_svg, data.qr_payload));
        paper.appendChild(meta([
          ['Tujuan', koli.destination_store_id],
          ['Posisi', koli.position],
          ['Disegel', when(koli.sealed_at)],
          ['Oleh', koli.sealed_by],
          ['Jumlah', num(koli.unit_count) + ' pcs']
        ]));
        paper.appendChild(table(
          [{ label: 'SKU', mono: true }, { label: 'Allotment', mono: true }, { label: 'Qty', num: true }],
          lines.map(function (line) {
            return [line.sku_code, line.allotment_line_id, num(line.quantity)];
          }),
          ['Total', '', num(total)]
        ));
        paper.appendChild(note(
          'QR di atas dan barcode pada stiker di luar dus membawa nomor koli yang sama. ' +
          'QR untuk kamera ponsel, barcode untuk scanner laser gudang.'
        ));
        paper.appendChild(signatures(['Dipacking oleh', 'Diterima oleh']));
      }

      function renderSuratJalan(data) {
        var shipment = data.shipment || {};
        var koli = data.koli || [];
        paper.appendChild(head('Surat Jalan', shipment.shipment_number, 'Tujuan ' + (shipment.destination_store_id || '-')));
        if (data.qr_svg) paper.appendChild(qrBlock(data.qr_svg, data.qr_payload));
        paper.appendChild(meta([
          ['Tujuan', shipment.destination_store_id],
          ['Posisi', shipment.position],
          ['Jumlah koli', num(shipment.koli_count)],
          ['Jumlah potong', num(shipment.unit_count) + ' pcs']
        ]));
        koli.forEach(function (entry) {
          var box = entry.koli || {};
          paper.appendChild(el('div', 'group', box.koli_number + ' — ' + num(box.unit_count) + ' pcs'));
          paper.appendChild(table(
            [{ label: 'SKU', mono: true }, { label: 'Qty', num: true }],
            (entry.lines || []).map(function (line) {
              return [line.sku_code, num(line.quantity)];
            })
          ));
        });
        paper.appendChild(note(
          'Barang diterima dalam keadaan koli tersegel. Periksa jumlah koli terhadap daftar ' +
          'di atas sebelum menandatangani; selisih isi di dalam koli dicatat saat pemindaian.'
        ));
        paper.appendChild(signatures(['Pengirim', 'Pengemudi', 'Penerima']));
      }

      function renderManifes(data) {
        var dispatch = data.dispatch || {};
        var shipments = data.shipments || [];
        var units = shipments.reduce(function (sum, s) { return sum + (s.unit_count || 0); }, 0);
        paper.appendChild(head('Manifes Muat', dispatch.dispatch_number, when(dispatch.departed_at) === '-' ? 'Belum berangkat' : 'Berangkat ' + when(dispatch.departed_at)));
        paper.appendChild(meta([
          ['Ekspedisi', dispatch.carrier],
          ['Nomor polisi', dispatch.vehicle_plate],
          ['Pengemudi', dispatch.driver_name],
          ['Berangkat', when(dispatch.departed_at)],
          ['Surat jalan', num(dispatch.shipment_count)],
          ['Koli', num(dispatch.koli_count)]
        ]));
        paper.appendChild(table(
          [{ label: 'Surat jalan', mono: true }, { label: 'Tujuan' }, { label: 'Koli', num: true }, { label: 'Pcs', num: true }],
          shipments.map(function (s) {
            return [s.shipment_number, s.destination_store_id, num(s.koli_count), num(s.unit_count)];
          }),
          ['Total', '', num(dispatch.koli_count), num(units)]
        ));
        paper.appendChild(note(
          'Satu truk dapat membawa beberapa surat jalan ke beberapa toko. Tiap toko ' +
          'menandatangani surat jalannya sendiri; lembar ini untuk pemuat dan pengemudi.'
        ));
        paper.appendChild(signatures(['Pemuat', 'Pengemudi', 'Kepala gudang']));
      }

      var DOCS = {
        picklist:   { url: function () { return '/api/v1/dc/picklist'; }, render: renderPicklist, needsId: false },
        packing:    { url: function (i) { return '/api/v1/dc/koli/' + encodeURIComponent(i); }, render: renderPacking, needsId: true },
        suratjalan: { url: function (i) { return '/api/v1/dc/shipments/' + encodeURIComponent(i); }, render: renderSuratJalan, needsId: true },
        manifes:    { url: function (i) { return '/api/v1/dc/dispatches/' + encodeURIComponent(i); }, render: renderManifes, needsId: true }
      };

      var doc = DOCS[kind];
      if (!doc) {
        fail('Tambahkan ?doc=picklist|packing|suratjalan|manifes pada URL.');
        return;
      }
      if (doc.needsId && !id) {
        fail('Dokumen ' + kind + ' perlu ?id=<id> pada URL.');
        return;
      }

      window.addEventListener('DOMContentLoaded', function () {
        fetch(doc.url(id))
          .then(function (response) {
            return response.json().then(function (body) {
              if (!response.ok) throw new Error(body.error || ('HTTP ' + response.status));
              return body;
            });
          })
          .then(function (body) {
            doc.render(body);
            paper.hidden = false;
            document.title = paper.querySelector('.docno .num').textContent;
          })
          .catch(function (error) {
            fail(error.message || String(error));
          });
      });
    })();
  </script>
</body>
</html>
