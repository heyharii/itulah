<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PO · Order & Received summary options</title>
<style>
:root{--ink:#20242c;--text:#394150;--muted:#626b78;--line:#e6e6e9;--soft:#f8f8f9;--accent:#2563eb;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;background:#f0f0f2;color:var(--text);font:14px/20px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--accent);text-decoration:none}.page{max-width:1280px;margin:auto;padding:24px 28px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}.top h1{margin:0;color:var(--ink);font-size:18px;line-height:26px;font-weight:600}.top a{white-space:nowrap}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:20px}.controls label{display:flex;align-items:center;gap:8px;color:var(--muted)}select{background:white;border:1px solid #dadade;border-radius:6px;padding:6px 9px;max-width:100%}.seg{display:flex;gap:3px;background:var(--soft);padding:3px;border-radius:7px}.seg button{border:0;background:transparent;border-radius:5px;padding:6px 10px;color:var(--muted)}.seg button.on{background:var(--ink);color:white}.controls .context{color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.grid.focus{grid-template-columns:minmax(0,720px);justify-content:center}.option{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}.option-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:6px}.option-head h2{font-size:15px;color:var(--ink);font-weight:600;margin:0}.option-head button{border:0;background:transparent;color:var(--accent);padding:0}.explanation{color:var(--muted);margin:0 0 20px;line-height:21px}.example{color:var(--ink);font-variant-numeric:tabular-nums}.box{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:16px}.box-title{font-weight:600;margin:0 0 14px;font-size:14px;line-height:20px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ledger{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;margin:0;align-items:baseline}.ledger dt{color:var(--muted)}.ledger dd{margin:0;text-align:right;white-space:nowrap;color:var(--ink)}.ledger .total{border-top:1px solid #dadade;padding-top:12px;margin-top:2px}.ledger dd.total{font-weight:600}.ledger .final{font-weight:600;color:var(--ink)}.ledger dd.final{font-size:18px;line-height:24px}.ledger small{display:block;font-size:14px;color:var(--muted);font-weight:400;line-height:20px}.qty-pair{display:flex;gap:20px;margin-bottom:16px}.qty-pair>div{flex:1}.qty-pair span{display:block;color:var(--muted)}.qty-pair b{display:block;font-size:18px;line-height:26px;font-weight:600;margin-top:3px}.qty-pair b small{font-size:14px;font-weight:400;color:var(--muted)}.quiet{color:var(--muted)}.empty-note{color:var(--muted);margin:0 0 14px}.empty-value{color:#89919d!important}.pending-final{font-weight:400!important;color:var(--muted)!important}.stack .section+.section{border-top:1px solid #dadade;margin-top:16px;padding-top:16px}.stack .section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:16px}.section-title h3{font-size:14px;font-weight:600;margin:0}.section-title span{color:var(--muted)}.stack .ledger{gap:8px 20px}.stack .ledger .total{border:0;margin:0;padding-top:4px}.stack .received-final{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-top:1px solid #dadade;padding-top:12px;margin-top:12px;font-weight:600}.received-final b{font-size:20px;line-height:28px;font-weight:600;white-space:nowrap}.reference{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;color:var(--muted)}.reference .left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.reference b{font-weight:500;white-space:nowrap}.reference .discount-note{font-size:14px;margin-top:2px}.hero-received .hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:16px}.hero-top h3{font-size:14px;font-weight:600;margin:0}.hero-top span{color:var(--muted)}.hero-value{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid #dadade;margin-top:14px;padding-top:14px}.hero-value b{font-size:22px;line-height:30px;font-weight:600;white-space:nowrap}.hero-value span{font-weight:500}.compact .summary-row{display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:baseline}.summary-row .row-title{font-weight:600}.summary-row .row-qty{font-weight:400;color:var(--muted);margin-left:8px}.summary-row .row-money{text-align:right;white-space:nowrap;font-weight:500}.summary-row .row-caption{color:var(--muted);font-size:14px}.summary-row .row-caption.right{text-align:right}.compact details{margin-top:10px;color:var(--muted)}.compact summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center}.compact summary:after{content:'⌄'}.compact details[open] summary:after{content:'⌃'}.compact .detail-ledger{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.compact .receive-row{border-top:1px solid #dadade;margin-top:16px;padding-top:16px}.compact .receive-row .row-money{font-weight:600;font-size:20px;line-height:28px}.compact .adjustment-line{display:flex;justify-content:space-between;gap:16px;margin-top:10px;color:var(--muted)}.compact .adjustment-line span:last-child{white-space:nowrap}.footer-note{color:var(--muted);margin:22px 0 0;line-height:22px}.footer-note b{font-weight:500;color:var(--ink)}
@media(max-width:1050px){.split{grid-template-columns:1fr}.controls .context{margin-left:0}.option{padding:18px}}
@media(max-width:760px){.page{padding:16px}.grid{grid-template-columns:1fr;gap:16px}.top{align-items:flex-start;flex-direction:column;gap:6px}.controls{align-items:flex-start;gap:10px}.controls .context{width:100%}.option{padding:16px}.split{grid-template-columns:1fr 1fr}.hero-value b{font-size:20px}}
@media(max-width:480px){.split{grid-template-columns:1fr}.reference{align-items:flex-start}.reference .left{gap:4px 8px}.ledger{gap:8px 12px}.hero-value{align-items:flex-start;flex-direction:column;gap:4px}.seg{flex-wrap:wrap}.controls label{align-items:flex-start;flex-direction:column}.summary-row .row-qty{display:block;margin-left:0;margin-top:3px}}
</style>
</head>
<body>
<main class="page">
<header class="top"><h1>PO · Order & Received</h1><a href="po-detail-form-options.html">← PO detail options</a></header>
<div class="controls"><label>Contoh <select id="state"><option value="short">Completed · closed short (sesuai screenshot)</option><option value="pending">Belum diterima</option><option value="partial">Diterima sebagian</option><option value="full">Completed · semua diterima</option></select></label><div class="seg" id="view"><button data-view="all" class="on">Semua versi</button><button data-view="one">1</button><button data-view="two">2</button><button data-view="three">3</button><button data-view="four">4</button></div><span class="context" id="context"></span></div>
<div class="grid" id="options"></div>
<p class="footer-note"><b>Order total</b> adalah referensi pesanan setelah discount. <b>Received total</b> adalah nilai penerimaan sementara; ketika receiving selesai, labelnya menjadi <b>Final payable</b>. Closed short muncul di bagian Received. Angka pada contoh completed mengikuti screenshot.</p>
</main>
<script>
const ORDER = {qty:400,gross:19400000,discount:485000,net:18915000};
const STATES = {
 short:{received:360,remaining:40,adjustment:3510000,net:15405000,completed:true,adjustmentLabel:'Closed short',context:'400 ordered · 360 received · 40 closed short'},
 pending:{received:null,remaining:400,adjustment:null,net:null,completed:false,adjustmentLabel:'Still expected',context:'400 ordered · awaiting receiving'},
 partial:{received:240,remaining:160,adjustment:7566000,net:11349000,completed:false,adjustmentLabel:'Still expected',context:'400 ordered · 240 received · 160 still expected'},
 full:{received:400,remaining:0,adjustment:0,net:18915000,completed:true,adjustmentLabel:'Closed short',context:'400 ordered · fully received'}
};
let state='short', view='all';
const money=n=>n===null?'—':'Rp '+n.toLocaleString('id-ID');
const deduction=n=>'−'+money(n);
const pcs=n=>n===null?'—':n+' pcs';
const finalLabel=s=>s.net===null?'Received total':s.completed?'Final payable':'Received total';
const receiptNote=s=>s.net===null?'Awaiting receiving':s.completed?'Receiving completed':'Receiving in progress';
const adjustmentMoney=s=>s.adjustmentLabel==='Closed short'&&s.remaining>0?deduction(s.adjustment):null;
const orderRows=()=>`<dt>Ordered</dt><dd>${pcs(ORDER.qty)}</dd><dt>Subtotal</dt><dd>${money(ORDER.gross)}</dd><dt>Discount · 2,5%</dt><dd>${deduction(ORDER.discount)}</dd><dt class="total">Order total</dt><dd class="total">${money(ORDER.net)}</dd>`;
const qtyPair=s=>`<div class="qty-pair"><div><span>Received</span><b>${s.received===null?'—':s.received+' <small>pcs</small>'}</b></div>${s.remaining>0?`<div><span>${s.adjustmentLabel}</span><b>${s.remaining} <small>pcs</small></b></div>`:''}</div>`;
const adjustmentRow=s=>adjustmentMoney(s)?`<dt>${s.adjustmentLabel}</dt><dd>${adjustmentMoney(s)}</dd>`:'';
const receiptBox=s=>`<section class="box"><h3 class="box-title">Received</h3>${qtyPair(s)}${s.net===null?'<p class="empty-note">Awaiting receiving</p>':''}<dl class="ledger">${adjustmentRow(s)}<dt class="total final ${s.net===null?'pending-final':''}">${finalLabel(s)}</dt><dd class="total final ${s.net===null?'empty-value':''}">${money(s.net)}</dd></dl></section>`;
const VERSIONS={
 one:{name:'1 · Dua kotak',note:'Order dan Received memiliki area sendiri. Mudah membandingkan pesanan awal dengan hasil penerimaan.',html:s=>`<div class="split"><section class="box"><h3 class="box-title">Order</h3><dl class="ledger">${orderRows()}</dl></section>${receiptBox(s)}</div>`},
 two:{name:'2 · Dua bagian',note:'Satu kotak yang ringkas, dibagi menjadi Order dan Received dengan garis pemisah.',html:s=>`<div class="box stack"><section class="section"><div class="section-title"><h3>Order</h3><span>${pcs(ORDER.qty)}</span></div><dl class="ledger"><dt>Subtotal</dt><dd>${money(ORDER.gross)}</dd><dt>Discount · 2,5%</dt><dd>${deduction(ORDER.discount)}</dd><dt class="total">Order total</dt><dd class="total">${money(ORDER.net)}</dd></dl></section><section class="section"><div class="section-title"><h3>Received</h3><span>${pcs(s.received)}</span></div><dl class="ledger">${s.remaining>0?`<dt>${s.adjustmentLabel} · ${pcs(s.remaining)}</dt><dd>${adjustmentMoney(s)||'—'}</dd>`:''}</dl>${s.net===null?'<p class="empty-note">Awaiting receiving</p>':''}<div class="received-final"><span class="${s.net===null?'pending-final':''}">${finalLabel(s)}</span><b class="${s.net===null?'empty-value':''}">${money(s.net)}</b></div></section></div>`},
 three:{name:'3 · Received sebagai fokus',note:'Order hanya referensi kecil. Qty yang diterima dan nilai akhir menjadi informasi utama.',html:s=>`<div class="reference"><div class="left"><span>Order</span><span>${pcs(ORDER.qty)}</span></div><div><b>${money(ORDER.net)}</b><div class="discount-note">After 2,5% discount</div></div></div><section class="box hero-received"><div class="hero-top"><h3>Received</h3><span>${receiptNote(s)}</span></div>${qtyPair(s)}${adjustmentMoney(s)?`<dl class="ledger"><dt>Closed short deduction</dt><dd>${adjustmentMoney(s)}</dd></dl>`:''}<div class="hero-value"><span class="${s.net===null?'pending-final':''}">${finalLabel(s)}</span><b class="${s.net===null?'empty-value':''}">${money(s.net)}</b></div></section>`},
 four:{name:'4 · Dua baris',note:'Paling padat. Order dan Received langsung memperlihatkan qty dan nilai; detail discount bisa dibuka.',html:s=>`<div class="box compact"><div class="summary-row"><span class="row-title">Order <span class="row-qty">${pcs(ORDER.qty)}</span></span><span class="row-money">${money(ORDER.net)}</span><span class="row-caption">Order total</span><span class="row-caption right">After discount</span></div><details><summary>Discount · 2,5%</summary><dl class="ledger detail-ledger"><dt>Subtotal</dt><dd>${money(ORDER.gross)}</dd><dt>Discount · 2,5%</dt><dd>${deduction(ORDER.discount)}</dd><dt>Discount / pc</dt><dd>Rp 1.213 / pc</dd></dl></details><div class="receive-row"><div class="summary-row"><span class="row-title">Received <span class="row-qty">${pcs(s.received)}</span></span><span class="row-money ${s.net===null?'empty-value':''}">${money(s.net)}</span><span class="row-caption">${receiptNote(s)}</span><span class="row-caption right">${finalLabel(s)}</span></div>${s.remaining>0?`<div class="adjustment-line"><span>${s.adjustmentLabel} · ${pcs(s.remaining)}</span><span>${adjustmentMoney(s)||''}</span></div>`:''}</div></div>`}
};
function render(){
 const s=STATES[state];
 const visible=view==='all'?Object.entries(VERSIONS):[[view,VERSIONS[view]]];
 document.getElementById('options').innerHTML=visible.map(([id,v])=>`<article class="option"><div class="option-head"><h2>${v.name}</h2>${view==='all'?`<button data-view="${id}" aria-label="Lihat ${v.name}">Lihat sendiri ↗</button>`:''}</div><p class="explanation">${v.note}</p><div class="example">${v.html(s)}</div></article>`).join('');
 document.getElementById('options').classList.toggle('focus',view!=='all');
 document.getElementById('context').textContent=s.context;
 document.querySelectorAll('#view button').forEach(b=>{b.classList.toggle('on',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view))});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render()}});
document.getElementById('state').addEventListener('change',e=>{state=e.target.value;render()});
render();
</script>
</body>
</html>
