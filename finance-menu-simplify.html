<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Menu Simplify</title>
<style>
@font-face{font-family:Inter;src:url('/frontend-hub/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
/* the hub shell (white.css, Fog) with the Ink text tone */
:root{--ink:#1d1d1f;--mute:#6e6e73;--line:#ececf0;--blue:#2563eb;--blue-soft:#eef3fd;--red:#d70015;--amber:#b25000;--green:#1f8a3b;
 --stone:#e8ebf0;--panel:#f4f6f9;--side-ink:#1d1d1f;--side-mute:#6e6e73;--hover:rgb(0 0 0 / 5%);--edge:rgb(0 0 0 / 5%);
 --ring:0 0 0 1px rgb(0 0 0 / 5%),0 2px 8px rgb(0 0 0 / 4%),0 24px 72px rgb(0 0 0 / 8%);
 --ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--stone);-webkit-font-smoothing:antialiased;overflow:hidden}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
.num{font-variant-numeric:tabular-nums}

.shell{display:flex;height:100vh}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;color:#5a6271}
.rail .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.rail .ic.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / 7%)}

.panel{width:236px;flex:none;display:flex;flex-direction:column;margin:12px 12px 12px 0;border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px var(--edge),0 2px 6px rgb(0 0 0 / 4%);overflow:hidden}
.panel h2{margin:0;padding:18px 20px 10px;font-size:20px;font-weight:650;letter-spacing:-.015em;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 small{font-size:15px;font-weight:500;color:var(--side-mute)}
.list{flex:1;min-height:0;overflow-y:auto;padding:2px 10px 16px;scrollbar-width:none;
 mask-image:linear-gradient(to bottom,transparent 0,#000 8px,#000 calc(100% - 24px),transparent 100%)}
.list::-webkit-scrollbar{display:none}
.list.swap{animation:swap .16s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(4px)}}

.item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;color:var(--side-ink);font-weight:450;white-space:nowrap;transition:background-color .15s ease}
.item>span:first-child{overflow:hidden;text-overflow:ellipsis}
@media(hover:hover) and (pointer:fine){.item:not(.on):hover{background:var(--hover)}}
.item.on{background:#fff;font-weight:600;box-shadow:0 0 0 1px rgb(0 0 0 / 6%),0 1px 3px rgb(0 0 0 / 6%)}
.item.step{box-shadow:0 0 0 2px var(--blue)}
.badge{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:15px;line-height:1;font-weight:600}
.glabel{display:flex;align-items:center;justify-content:space-between;width:100%;height:30px;margin-top:14px;padding:0 10px;color:var(--side-mute);font-weight:600;white-space:nowrap;border-radius:8px}
.group:first-child>.glabel{margin-top:0}
.fold .glabel{height:34px;margin-top:2px;color:var(--side-ink);font-weight:450}
.fold.open .glabel{font-weight:600}
.glabel .chev{width:14px;height:14px;opacity:.6;transition:transform .2s var(--ease)}
.fold.open .glabel .chev{transform:rotate(90deg)}
@media(hover:hover) and (pointer:fine){button.glabel:hover{background:var(--hover)}}
.fold .rows{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .2s var(--ease),opacity .15s ease}
.fold.open .rows{grid-template-rows:1fr;opacity:1}
.fold .rows>div{min-height:0;overflow:hidden;padding-left:10px}
.foot{flex:none;padding:6px 10px 12px;border-top:1px solid rgb(0 0 0 / 6%)}
.foot .item span{display:flex;align-items:center;gap:8px}

.page{flex:1;min-width:0;background:#fff;margin:12px 12px 12px 0;border-radius:16px;box-shadow:var(--ring);overflow:hidden;display:flex;flex-direction:column}
.page-in{flex:1;overflow:auto;padding:26px 32px 120px}
.page-in.swap{animation:swap .16s var(--ease)}
.crumb{color:var(--mute)}
.crumb button{color:var(--mute)}
.crumb button:hover{color:var(--ink)}
h1{margin:2px 0 20px;font-size:20px;line-height:26px;font-weight:650;letter-spacing:-.015em}
h3{margin:28px 0 8px;font-size:15px;font-weight:600}
.wrap{max-width:1000px}

table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-weight:500;color:var(--mute);height:40px;border-bottom:1px solid var(--line);padding:0 14px 0 0;white-space:nowrap}
.t td{padding:10px 14px 10px 0;border-bottom:1px solid #f3f3f6;vertical-align:top}
.t .r{text-align:right;white-space:nowrap}
.mock .t td,.mock .t th{white-space:nowrap}
.t .mute{color:var(--mute)}
.t tr.gh td{padding-top:18px;font-weight:600;border-bottom:1px solid var(--line)}
.t tr.on td{background:#f6f8fc}
.t td.go{cursor:pointer}
.t td.go:hover{color:var(--blue)}
.warn{color:var(--amber)}
.bad{color:var(--red)}
.ok{color:var(--green)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:2px}

/* mocks */
.mock{border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:6px 18px 14px;margin-bottom:8px;overflow-x:auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0 4px}
.ctl{height:36px;padding:0 12px;border-radius:8px;box-shadow:0 0 0 1px #e3e5ea;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn{height:36px;padding:0 14px;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;display:inline-flex;align-items:center;transition:transform .12s ease}
.btn:active,.ctl:active{transform:scale(.97)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:4px 0 2px}
.tabs span{padding:10px 0;color:var(--mute);font-weight:500}
.tabs span.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.check{list-style:none;margin:0;padding:0}
.check li{display:flex;align-items:center;gap:12px;height:48px;border-bottom:1px solid #f3f3f6}
.check li>b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;flex:none;background:#f0f1f4;color:var(--mute)}
.check li.done>b{background:#e7f5ec;color:var(--green)}
.check li .w{flex:1}
.check li .s{color:var(--mute)}
.small{height:30px;padding:0 12px;border-radius:999px;background:#f0f1f4;color:var(--blue);font-weight:600;white-space:nowrap}
.small:active{transform:scale(.97)}

/* flow strip (7Soft's module front page, as a strip) */
.strip{display:flex;align-items:stretch;gap:0;margin:0 0 22px;overflow-x:auto;padding:2px}
.node{min-width:150px;padding:12px 14px;border-radius:12px;box-shadow:0 0 0 1px var(--line);background:#fff;transition:box-shadow .15s ease,transform .12s ease}
.node:active{transform:scale(.98)}
@media(hover:hover) and (pointer:fine){.node:hover{box-shadow:0 0 0 1px #cfd6e4,0 2px 8px rgb(0 0 0 / 5%)}}
.node.on{box-shadow:0 0 0 2px var(--ink)}
.node b{display:block;font-weight:600}
.node span{color:var(--mute)}
.node span.warn{color:var(--amber)}
.arrow{display:grid;place-items:center;width:30px;flex:none;color:#b9bec8}
.side{display:flex;gap:10px;margin:-10px 0 22px;color:var(--mute);align-items:center;flex-wrap:wrap}

/* C overview map */
.map{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:14px 0;align-items:center;min-width:820px}
.map .node{margin:0 8px}
.lane{grid-column:1/-1;color:var(--mute);font-weight:500;margin-top:8px}

/* walk bar */
.walk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;margin:0 0 22px;border-radius:12px;background:var(--blue-soft)}
.walk .steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.walk .steps span{padding:3px 10px;border-radius:999px;background:#fff;color:var(--mute);white-space:nowrap}
.walk .steps span.on{background:var(--blue);color:#fff}
.walk .steps span.done{color:var(--ink)}
.walk .ctl{background:#fff}

/* setup page */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:6px}
.card .glabel{margin:4px 0 2px}
.card .item{height:36px}

/* switch */
.switch{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:14px;background:rgb(255 255 255 / 88%);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 0 0 1px rgb(0 0 0 / 7%),0 8px 30px rgb(0 0 0 / 12%);z-index:10;max-width:calc(100vw - 32px);overflow-x:auto}
.switch button{height:40px;padding:0 14px;border-radius:9px;white-space:nowrap;color:var(--mute);font-weight:500;transition:background-color .15s ease,color .15s ease,transform .12s ease}
.switch button:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.switch button:hover{background:rgb(0 0 0 / 4%)}}
.switch button[aria-pressed="true"]{background:#1d1d1f;color:#fff}
.switch b{font-weight:600;margin-right:6px;opacity:.55}
.switch .n{margin-left:6px;opacity:.6}
.switch .sep{width:1px;margin:6px 4px;background:rgb(0 0 0 / 10%);flex:none}

@media(max-width:760px){
 body{overflow:auto}
 .shell{flex-direction:column;height:auto}
 .rail{display:none}
 .panel{width:auto;margin:12px 12px 0;max-height:46vh}
 .page{margin:12px}
 .page-in{padding:20px 16px 110px}
}
@media(prefers-reduced-motion:reduce){.list.swap,.page-in.swap{animation:none}.fold .rows{transition:none}}
</style>
</head>

function places(v) {
 const out = []
 for (const g of V[v].groups) for (const r of g.rows) {
  out.push({r, g:g.l})
  if (r.flow) for (const n of r.flow) out.push({r:n, g:g.l, flow:r})
 }
 for (const [s, items] of V[v].setup ?? []) for (const r of items) out.push({r, g:"Setup", setup:s})
 return out
}
const findPlace = (v, k) => places(v).find((p) => p.r.k === k)
function menuCount(v) { return V[v].groups.reduce((a, g) => a + g.rows.length, 0) + (V[v].setup ? 1 : 0) }
function dest(v, t) {
 if (v === "today") return null
 if (V[v].gone?.[t]) return {txt:V[v].gone[t], off:true}
 for (const p of places(v)) {
  const f = p.r.from.find((x) => x[0] === t)
  if (f) return {k:p.r.k, txt:(p.setup ? "Setup › " : p.flow ? p.flow.l + " › " : "") + p.r.l, how:f[1]}
 }
 return {txt: t.startsWith("x_") ? "⌘K, as today" : t.startsWith("h_") ? "Hidden, as today" : "—", mute:true}
}

 for (const b of sw.querySelectorAll("[data-v]")) b.setAttribute("aria-pressed", !st.view && b.dataset.v === st.v)
 for (const b of sw.querySelectorAll("[data-view]")) b.setAttribute("aria-pressed", st.view === b.dataset.view)
 const u = new URL(location); u.searchParams.set("v", st.v); u.searchParams.set("r", st.k)
 st.view ? u.searchParams.set("view", st.view) : u.searchParams.delete("view"); history.replaceState(null, "", u)
}
function goWalk() {
 const f = FLOWS.find((x) => x.k === st.walk.f), s = f.s[st.v][st.walk.i]
 st.k = s[0]; st.view = ""
 const p = findPlace(st.v, st.k); st.open = {}
 render(true)
}
document.addEventListener("click", (e) => {
 const t = e.target.closest("button,td.go"); if (!t) return
 if (t.dataset.walkstart) { st.v = t.dataset.v; st.open = {}; st.walk = {f:t.dataset.walkstart, i:0}; goWalk(); return }
 if (t.dataset.walk) {
  const steps = FLOWS.find((x) => x.k === st.walk.f).s[st.v], i = st.walk.i + Number(t.dataset.walk)
  if (i >= steps.length) { st.walk = null; st.view = "flows"; render(true); return }
  st.walk.i = Math.max(0, i); goWalk(); return
 }
 if (t.dataset.fold) { const key = st.v + t.dataset.fold, g = t.parentElement; const open = !g.classList.contains("open"); st.open[key] = open; g.classList.toggle("open", open); return }
 if (t.dataset.view) { st.view = st.view === t.dataset.view ? "" : t.dataset.view; st.walk = null; render(true); return }
 if (t.dataset.v && !t.dataset.k) { st.v = t.dataset.v; st.view = ""; st.walk = null; st.open = {}; if (!findPlace(st.v, st.k) && st.k !== "__setup") st.k = "ov"; if (st.k === "__setup" && !V[st.v].setup) st.k = "ov"; render(true); return }
 if (t.dataset.k) { if (t.dataset.v) st.v = t.dataset.v; st.k = t.dataset.k; st.view = ""; if (st.walk && !t.closest(".walk")) st.walk = null; render(!t.classList.contains("item")) }
})
addEventListener("keydown", (e) => {
 if (e.target.closest?.("input,textarea")) return
 const i = "0123".indexOf(e.key); if (i >= 0) { sw.querySelector(`[data-v="${VS[i]}"]`).click(); return }
 if (e.key === "c") sw.querySelector('[data-view="compare"]').click()
 if (e.key === "j") sw.querySelector('[data-view="flows"]').click()
 if (st.walk && (e.key === "ArrowRight" || e.key === "ArrowLeft")) document.querySelector(`[data-walk="${e.key === "ArrowRight" ? 1 : -1}"]`)?.click()
 if (st.walk && e.key === "Escape") { st.walk = null; render() }
})
const q = new URLSearchParams(location.search)
if (V[q.get("v")]) st.v = q.get("v")
if (q.get("r")) st.k = q.get("r")
if (["compare","flows"].includes(q.get("view"))) st.view = q.get("view")
render()
</script>
</body>
</html>
