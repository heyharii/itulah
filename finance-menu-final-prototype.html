<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance · final menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="frontend-hub/design-system/tokens.css">
<link rel="stylesheet" href="frontend-hub/design-system/bundle.css">
<style>
:root{--font-sans:"Inter Variable","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--bar-h:57px;--ease-sheet:cubic-bezier(.32,.72,0,1);--ease-exit:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stone);font-family:var(--font-sans);font-size:15px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ── prototype chrome (not part of the design) ── */
.pbar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;min-height:var(--bar-h);padding:10px 16px;background:#fff;border-bottom:1px solid var(--hairline)}
.pbar b{font-weight:600}
.pbar small{color:var(--body);font-size:15px}
.pbar .sp{flex:1}
.pbar-k{display:inline-flex;align-items:center;gap:12px;height:36px;padding:0 8px 0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);color:var(--body)}
.pbar-k kbd,.pal kbd,.kb{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 6px;border:1px solid var(--hairline-2);border-bottom-width:2px;border-radius:6px;background:var(--soft);color:var(--body);font:500 15px/1 var(--font-sans)}
@media (hover:hover){.pbar-k:hover{background:var(--soft)}}

/* ── desk shell (hub sizes) ── */
.stage{overflow-x:auto}
.shell{min-width:1280px;min-height:calc(100vh - var(--bar-h));align-items:flex-start}
.shell .ds-rail{position:sticky;top:var(--bar-h);align-self:flex-start}
.shell .ds-rail-btn{border-radius:var(--r-inner)}
.shell .ds-rail-btn .ds-ico{width:18px;height:18px}
.shell .ds-rail-btn.is-current{color:var(--accent)}
.shell .ds-rail .find{margin-bottom:10px;color:var(--rail-text);cursor:pointer}
.shell .ds-panel{position:sticky;top:calc(var(--bar-h) + var(--float));display:flex;flex-direction:column;height:calc(100vh - var(--bar-h) - 2 * var(--float));padding:0}
.p-head{display:flex;align-items:center;height:52px;padding:0 8px 0 16px}
.p-head .ds-panel-title{flex:1;padding:0}
.p-body{flex:1;padding:4px 10px 10px;overflow:auto}
.nav-label{display:block;margin:16px 0 4px 10px;color:var(--panel-mute,var(--body));font-size:15px;line-height:22px;font-weight:500}
.nav-gap{height:14px}
.nav-row-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:0 10px;height:36px;border-radius:var(--r-inner);color:var(--panel-ink);transition:background-color var(--t-hover) var(--ease-out)}
@media (hover:hover){.nav-row-btn:hover{background:var(--soft-2)}}
.nav-row-btn.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav-row-btn .nb{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--soft-2);color:var(--body);font-size:15px;line-height:22px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
.nav-row-btn .nb.warn{background:var(--warn-bg);color:var(--warn-fg)}
.nav-row-btn.on .nb{background:#fff;color:var(--accent)}
.p-foot{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-top:1px solid var(--hairline);font-weight:500;color:var(--panel-ink);font-variant-numeric:tabular-nums}
.p-foot .ds-ico{width:18px;height:18px;color:var(--line-ico)}
.shell .ds-page{min-height:calc(100vh - var(--bar-h) - 2 * var(--float));overflow:visible}

/* head: title (+ crumb) · the one primary at the right · the page's tabs */
.door-head{display:flex;flex-direction:column;gap:12px;margin:0 calc(-1 * var(--page-gutter)) 24px;padding:0 var(--page-gutter);border-bottom:1px solid var(--hairline)}
.door-head.notabs{padding-bottom:16px}
.door-top{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:36px}
.door-title{display:flex;align-items:center;gap:10px;min-width:0}
.crumb-back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 6px;margin-left:-6px;border:0;border-radius:var(--r-inner);background:none;color:var(--body);font-weight:500}
@media (hover:hover){.crumb-back:hover{background:var(--soft-2);color:var(--ink)}}
.crumb-sep{color:var(--faint)}
.door-actions{position:relative;display:flex;align-items:center;gap:8px}
.door-tabs{margin-bottom:0;box-shadow:none}
.tab-n{margin-left:6px;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.ds-tab.is-selected .tab-n{color:var(--body)}
.ds-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* figures */
.kpis .ds-kpi{border:0;background:none;text-align:left;font:inherit;color:inherit}
.kpis button.ds-kpi{cursor:pointer}
@media (hover:hover){.kpis button.ds-kpi:hover .ds-kpi-label{color:var(--ink)}}
.page .kpis{margin-bottom:24px}
.ds-kpi-value.is-bad{color:var(--bad-fg)}
.ds-kpi-value.is-warn{color:var(--warn-fg)}
.ds-kpi-value.is-ok{color:var(--ok-fg)}

/* bar */
.bar-spacer{flex:1}
.sel{position:relative;flex:none}
.sel select{appearance:none;-webkit-appearance:none;height:var(--control);padding:0 34px 0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);color:var(--ink);cursor:pointer;outline:none}
.sel select:focus-visible{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.sel .ds-ico{position:absolute;right:11px;top:50%;margin-top:-8px;color:var(--line-ico);pointer-events:none}
.bar-count{color:var(--body);white-space:nowrap}
.daypick{display:inline-flex;align-items:center;height:var(--control);border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas)}
.daypick button{display:grid;place-items:center;width:34px;height:100%;border:0;background:none;color:var(--body)}
@media (hover:hover){.daypick button:hover{color:var(--ink);background:var(--soft)}}
.daypick span{padding:0 10px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:1500px){.page .ds-search{flex-basis:220px}}

/* chips: icon radios with counts — one picked */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:var(--control);padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);color:var(--ink);font-weight:500;white-space:nowrap;transition:background-color var(--t-hover) var(--ease-out),color var(--t-hover) var(--ease-out),transform var(--t-press) var(--ease-out)}
.chip .ds-ico{color:var(--line-ico)}
.chip .n{color:var(--body);font-weight:400;font-variant-numeric:tabular-nums}
.chip[aria-checked="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.chip[aria-checked="true"] .ds-ico,.chip[aria-checked="true"] .n{color:var(--accent)}
@media (hover:hover){.chip[aria-checked="false"]:hover{background:var(--soft-2)}}
.chip:active{transform:scale(.97)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-inner);background:var(--soft-2)}
.seg button{height:calc(var(--control) - 6px);padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--body);font-weight:500;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--canvas);color:var(--ink);box-shadow:var(--shadow-segment)}

/* buttons */
.ds-btn{transition:background-color var(--t-hover) var(--ease-out),transform var(--t-press) var(--ease-out)}
.ds-btn:active{transform:scale(.97)}
.ds-btn--sm.cell{height:30px;padding:0 12px}
.lnk{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;border:0;border-radius:var(--r-inner);background:none;color:var(--accent);font-weight:500;white-space:nowrap}
@media (hover:hover){.lnk:hover{background:var(--accent-bg)}}
.lnk .ds-ico{color:currentColor}

/* tables: one size, one figure per cell, status as a word */
.tbl{table-layout:fixed}
.tbl td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl td:first-child{font-weight:400}
.tbl td.wrap{white-space:normal;overflow-wrap:anywhere}
.tbl .nm{font-weight:500}
.tbl td.is-num,.tbl th.is-num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.ck,.tbl td.ck{width:44px;text-align:center;padding-left:0;padding-right:0}
.tbl tr.grp td{padding:9px var(--cell-x);background:var(--band);color:var(--body);font-weight:500}
@media (hover:hover){.tbl tr.ds-opens:hover td{background:var(--soft)}}
.tbl tr.ds-opens{cursor:pointer}
.tbl tr.sel td{background:var(--accent-bg)}
.tbl td.act{text-align:right;padding-top:0;padding-bottom:0;overflow:visible}
.tbl tfoot td{white-space:nowrap;font-weight:600;background:var(--band);border-bottom:0}
.tbl tr.dim td{color:var(--body)}
.mute{color:var(--body)}
.faint{color:var(--faint)}
.late,.bad{color:var(--bad-fg)}
.warn{color:var(--warn-fg)}
.ok{color:var(--ok-fg)}
.in-amt{color:var(--ok-fg)}
.out-amt{color:var(--bad-fg)}
.one{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.st::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--line-ico)}
.st.ok::before{background:var(--ok-fg)}.st.warn::before{background:var(--warn-fg)}.st.bad::before{background:var(--bad-fg)}.st.info::before{background:var(--accent)}
.st.ok,.st.warn,.st.bad,.st.info{color:var(--ink)}
.cb{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
.table-scroll{overflow-x:auto}

/* pills (in sheets and heads only) */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--hairline-2);border-radius:var(--r-chip);background:var(--canvas);color:var(--body);font-size:15px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok-fg);border-color:color-mix(in srgb,var(--ok-fg) 30%,transparent)}
.pill.warn{color:var(--warn-fg);border-color:color-mix(in srgb,var(--warn-fg) 30%,transparent)}
.pill.bad{color:var(--bad-fg);border-color:color-mix(in srgb,var(--bad-fg) 30%,transparent)}
.pill.info{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.pill.ro{color:var(--bad-fg);border-color:color-mix(in srgb,var(--bad-fg) 30%,transparent);letter-spacing:.02em}

/* cards & sections */
.sec{margin-bottom:28px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;margin-bottom:10px}
.sec-head h3{margin:0;font-size:16px;line-height:22px;font-weight:600}
.sec-head .mute{font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.box{border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);padding:20px 22px}
.box h3{margin:0 0 12px;font-size:16px;font-weight:600}
.empty-note{padding:40px;text-align:center;color:var(--body)}
.note-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;color:var(--body)}
.note-line .ds-ico{color:var(--line-ico)}
.code{font-variant-numeric:tabular-nums;color:var(--body)}

/* fields (forms) */
.f7{display:flex;flex-direction:column;gap:6px;min-width:0}
.f7>span{font-weight:500;display:flex;gap:6px;align-items:baseline}
.f7 .req{color:var(--bad-fg);font-style:normal}
.f7 .optl{color:var(--body);font-weight:400;font-style:normal}
.f7 input,.f7 select,.f7 textarea{height:44px;padding:0 12px;border:1px solid var(--hairline-2);border-radius:var(--r-inner);background:var(--canvas);color:var(--ink);outline:0;width:100%}
.f7 textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.f7 input:focus,.f7 select:focus,.f7 textarea:focus{border-color:var(--accent);box-shadow:var(--shadow-focus)}
.f7 input[readonly],.f7 input:disabled,.f7 select:disabled{background:var(--soft);color:var(--body)}
.f7.err input,.f7.err select{border-color:var(--bad-fg)}
.f7 .hint{color:var(--bad-fg)}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 24px}
.form-grid .s2{grid-column:span 2}.form-grid .s4{grid-column:span 4}

/* ── layers: a sheet slides in from the right; what's under it dims and never moves ── */
.layers{position:fixed;inset:0;z-index:60;pointer-events:none}
.layers.open{pointer-events:auto}
.layers .veil{position:absolute;inset:0;background:rgb(40 30 20/10%);opacity:0;transition:opacity 340ms var(--ease-sheet)}
.layers.open .veil{opacity:1}
.layers.closing .veil{opacity:0;transition:opacity 200ms var(--ease-exit)}
.sheet-wrap{position:absolute;top:var(--float);right:var(--float);bottom:var(--float);display:flex;max-width:calc(100vw - 2 * var(--float));transform:translateX(calc(100% + 24px));transition:transform 340ms var(--ease-sheet)}
.sheet-wrap.on{transform:none}
.sheet-wrap.out{transform:translateX(calc(100% + 24px));transition:transform 200ms var(--ease-exit)}
.sheet-wrap .ds-sheet{height:100%;max-width:calc(100vw - 2 * var(--float))}
.sheet-wrap .ds-sheet-body{flex:1;overflow:auto}
.sheet-wrap.under .ds-sheet::after{content:"";position:absolute;inset:0;z-index:5;border-radius:inherit;background:rgb(40 30 20/10%)}
.ds-sheet--rail{width:var(--sheet-rail)}
.ds-sheet--wide{width:var(--sheet-wide)}
.ds-sheet--record{width:1040px}
.ds-sheet--workspace{width:var(--sheet-workspace)}
.sheet-wrap .ds-kpis{margin-bottom:0}
.foot-left{margin-right:auto;display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){.sheet-wrap,.sheet-wrap.out{transition:opacity 160ms ease;transform:none}.sheet-wrap:not(.on){opacity:0}}

/* toasts */
.toasts{position:fixed;left:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toasts .ds-toast{align-items:center;transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
.toasts .ds-toast.in{animation:toast-in 220ms var(--ease-out)}
.toasts .ds-toast.gone{opacity:0;transform:translateY(6px)}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}}

/* ⌘K: no motion, it is opened many times a day */
.palette{position:fixed;inset:0;z-index:95;display:none}
.palette.open{display:block}
.palette .pv{position:absolute;inset:0;background:rgb(40 30 20/14%)}
.pal{position:absolute;left:50%;top:12vh;width:640px;max-width:calc(100vw - 32px);transform:translateX(-50%);border:1px solid var(--hairline);border-radius:var(--r-sheet);background:var(--canvas);box-shadow:var(--shadow-pop);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-bottom:1px solid var(--hairline)}
.pal-in input{flex:1;border:0;outline:0;font-size:16px;background:none}
.pal-in .ds-ico{color:var(--line-ico)}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-row{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:var(--r-inner);background:none;text-align:left}
.pal-row .pr-t{flex:1;min-width:0}
.pal-row .pr-g{color:var(--body)}
.pal-row .pr-7{color:var(--body)}
.pal-row.on{background:var(--accent-bg)}
.pal-row.on .pr-t{color:var(--accent);font-weight:500}
.pal-head{padding:10px 10px 4px;color:var(--body);font-weight:500}

/* ── Cash & Bank: every account as a card (Hari's sketch) ── */
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.acc-card{display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);padding:20px 22px 18px;cursor:pointer;transition:box-shadow var(--t-hover) var(--ease-out),border-color var(--t-hover) var(--ease-out)}
@media (hover:hover){.acc-card:hover{border-color:var(--hairline-2);box-shadow:var(--shadow-board-hover)}}
.acc-top{display:flex;align-items:flex-start;gap:12px}
.acc-mark{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;font-weight:600;font-size:15px;color:#fff}
.acc-mark.cash{background:var(--soft-2);color:var(--body)}
.acc-name{flex:1;min-width:0}
.acc-name b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-name span{color:var(--body)}
.place{flex:none;height:26px;padding:0 10px;border-radius:var(--r-chip);background:var(--a-orange,#e8833a);color:#fff;font-weight:500;line-height:26px;font-size:15px}
.acc-bal{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 14px}
.acc-bal .big{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.acc-bal .sm{color:var(--body);margin-top:2px}
.acc-flow{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:10px 0 12px;border-top:1px solid var(--hairline);font-size:16px;font-variant-numeric:tabular-nums}
.acc-act{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}

/* ── board (Giro) ── */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start}
.lane{border-radius:var(--r-card);background:var(--soft);padding:12px}
.lane-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 4px 10px}
.lane-h b{font-weight:600}
.lane-h span{color:var(--body);font-variant-numeric:tabular-nums}
.bcard{display:block;width:100%;margin-bottom:10px;padding:14px 16px;border:1px solid var(--hairline);border-radius:var(--r-inner);background:var(--canvas);text-align:left;cursor:pointer;transition:box-shadow var(--t-hover) var(--ease-out)}
@media (hover:hover){.bcard:hover{box-shadow:var(--shadow-board-hover)}}
.bcard .bc-top{display:flex;justify-content:space-between;gap:10px}
.bcard .bc-amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bcard .bc-sub{color:var(--body);margin-top:4px}
.bcard .bc-act{margin-top:10px}

/* ── Klasik voucher (BKK / BKM) ── */
.kl-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 340px;gap:0;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);margin-bottom:20px}
.kl-col{display:flex;flex-direction:column;gap:16px;padding:22px 24px}
.kl-col + .kl-col{border-left:1px solid var(--hairline)}
.kl-total{display:flex;flex-direction:column;padding:22px 24px;border-left:1px solid var(--hairline);background:var(--soft);border-radius:0 var(--r-card) var(--r-card) 0}
.kl-total .lbl{color:var(--body);font-weight:500}
.kl-total .big{margin:6px 0 4px;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kl-total .big small{font-size:16px;color:var(--body);font-weight:500;margin-right:6px}
.kl-total .words{color:var(--body);min-height:44px;font-style:italic}
.kl-mini{margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:6px}
.kl-mini div{display:flex;justify-content:space-between;gap:10px}
.kl-mini dt{color:var(--body)}
.kl-mini dd{margin:0;font-variant-numeric:tabular-nums}
.kl-bar{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
.kl-bar .ds-tabs{margin-bottom:0;flex:1}
.kl-grid{border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--canvas);overflow:hidden}
.kl-grid table{width:100%;border-collapse:collapse;table-layout:fixed}
.kl-grid th{height:40px;padding:0 12px;background:var(--band);border-bottom:1px solid var(--hairline);color:var(--body);font-weight:500;text-align:left;white-space:nowrap}
.kl-grid td{height:44px;padding:0 12px;border-bottom:1px solid var(--row-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kl-grid td.cellin{padding:0}
.kl-grid td.cellin input{width:100%;height:43px;padding:0 12px;border:0;background:transparent;outline:0;text-align:inherit}
.kl-grid td.cellin input:focus{background:var(--accent-bg);box-shadow:inset 0 0 0 2px var(--accent)}
.kl-grid td.cellin input:disabled{color:var(--body)}
.kl-grid .r,.kl-grid td.r input{text-align:right;font-variant-numeric:tabular-nums}
.kl-grid tr.picked td{background:color-mix(in srgb,var(--accent-bg) 55%,transparent)}
.kl-grid tr.over td.pay input{color:var(--bad-fg);font-weight:600}
.kl-grid tr.blank td{color:var(--faint)}
.kl-grid tfoot td{background:var(--band);font-weight:600;border-bottom:0}
.kl-status{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:14px;color:var(--body)}
.kl-foot{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:10px;margin:28px calc(-1 * var(--page-gutter)) calc(-1 * var(--page-top));padding:14px var(--page-gutter);border-top:1px solid var(--hairline);background:rgb(255 255 255/94%);backdrop-filter:blur(8px);border-radius:0 0 var(--r-sheet) var(--r-sheet)}
.kl-foot .sp{flex:1}
.paidby{display:inline-flex}
.giro3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-inner);margin-bottom:16px}
.banner.ok{background:var(--ok-bg);color:var(--ok-fg)}
.banner.bad{background:var(--bad-bg);color:var(--bad-fg)}
.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}
.banner.info{background:var(--accent-bg);color:var(--accent)}
.banner .ds-ico{flex:none;margin-top:2px;color:currentColor}
fieldset.kl{border:0;margin:0;padding:0;min-width:0}

/* ── statement (bank reconciliation) and ledgers ── */
.stmt td.match{overflow:visible}
.ladder{display:flex;flex-direction:column;gap:8px;max-width:420px;margin-left:auto}
.ladder div{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.ladder .tot{padding-top:8px;border-top:1px solid var(--hairline);font-weight:600}
.facts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 28px}
.facts4 dt{color:var(--body)}
.facts4 dd{margin:4px 0 0;font-variant-numeric:tabular-nums}

/* checklist (Month end) */
.check-row{display:grid;grid-template-columns:28px minmax(0,1fr) 220px 160px;align-items:center;gap:14px;min-height:64px;padding:10px 20px;border-bottom:1px solid var(--row-line);cursor:pointer}
@media (hover:hover){.check-row:hover{background:var(--soft)}}
.check-row:last-child{border-bottom:0}
.tick{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--hairline-2)}
.tick.done{background:var(--ok-fg);border-color:var(--ok-fg);color:#fff}
.tick.todo{border-color:var(--warn-fg)}
.tick.done .ds-ico{color:#fff;width:14px;height:14px}

/* print */

  .pbar,.ds-rail,.ds-panel,.door-actions,.ds-bar,.kl-foot,.chips{display:none!important}
  body{background:#fff}.stage{overflow:visible}.shell{display:block;min-width:0}
}

</style>
</head>
<body>
<div class="pbar"><b>Finance · final menu</b><small>15 rows in 6 groups · Central Fashion Store books · prototype, nothing is saved</small><span class="sp"></span><button class="pbar-k" type="button" onclick="openPalette()"><span>Find a menu or a 7Soft name</span><kbd>⌘K</kbd></button></div>
<div class="stage" id="stage"></div>
<div class="layers" id="layers"></div>
<div class="palette" id="palette"></div>
<div class="toasts" id="toasts"></div>
<script>
/* ═════════ format ═════════ */
const TODAY = '2026-10-28'
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const day = iso => { const [y, m, d] = iso.split('-'); return `${+d} ${MON[+m - 1]} ${y}` }
const dayS = iso => { const [, m, d] = iso.split('-'); return `${+d} ${MON[+m - 1]}` }
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10) }
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5)
const weekday = iso => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(iso + 'T00:00:00Z').getUTCDay()]
const dots = n => Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.')
const money = n => (n < 0 ? '−' : '') + 'Rp ' + dots(n)
const num = n => (n < 0 ? '−' : '') + dots(n)
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + 'Rp ' + dots(n)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const plural = (n, w, ws) => `${n} ${n === 1 ? w : ws || w + 's'}`
const $ = (s, el = document) => el.querySelector(s)
const DASH = '<span class="faint">—</span>'
const ico = (n, size = '') => `<span class="ds-ico ds-ico-${n} ${size}"></span>`
const btn = (label, on, kind = 'primary', extra = '') => `<button class="ds-btn ds-btn--${kind} ${extra}" type="button" onclick="event.stopPropagation();${on}">${label}</button>`
const lnk = (label, on, icon = '') => `<button class="lnk" type="button" onclick="event.stopPropagation();${on}">${icon ? ico(icon) : ''}${label}</button>`
const pill = (t, tone = '') => `<span class="pill ${tone}">${t}</span>`
const st = (t, tone = '') => `<span class="st ${tone}">${t}</span>`
const q = s => `'${String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")}'`

/* Indonesian amount in words, as 7Soft prints under the total */
function terbilang(n) {
  n = Math.floor(Math.abs(n))
  if (n === 0) return 'Nol rupiah'
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas']
  const w = x => x < 12 ? s[x] : x < 20 ? w(x - 10) + ' belas' : x < 100 ? w(Math.floor(x / 10)) + ' puluh ' + w(x % 10)
    : x < 200 ? 'seratus ' + w(x - 100) : x < 1000 ? w(Math.floor(x / 100)) + ' ratus ' + w(x % 100)
      : x < 2000 ? 'seribu ' + w(x - 1000) : x < 1e6 ? w(Math.floor(x / 1000)) + ' ribu ' + w(x % 1000)
        : x < 1e9 ? w(Math.floor(x / 1e6)) + ' juta ' + w(x % 1e6) : x < 1e12 ? w(Math.floor(x / 1e9)) + ' miliar ' + w(x % 1e9) : w(Math.floor(x / 1e12)) + ' triliun ' + w(x % 1e12)
  const t = w(n).replace(/\s+/g, ' ').trim() + ' rupiah'
  return t[0].toUpperCase() + t.slice(1)
}

/* a seeded random, so the demo books are the same on every load */
let SEED = 20261028
const rnd = () => { SEED = (SEED * 1103515245 + 12345) % 2147483648; return SEED / 2147483648 }
const pick = a => a[Math.floor(rnd() * a.length)]
const round = (n, to = 500) => Math.round(n / to) * to

/* ═════════ registry: reg({ id, group, label, render, badge, s7 }) ═════════
   group: stores · cash · pay · acc · (rep and setup are rows on their own, no heading) */
const GROUPS = [['stores', 'Stores'], ['cash', 'Cash & Bank'], ['pay', 'Payables'], ['acc', 'Accounting'], ['rep', ''], ['setup', '']]
const SCREENS = []
const reg = s => SCREENS.push(s)
const S = { id: null, tab: {}, q: {}, f: {}, stack: [], doc: null, day: '2026-10-27', sel: {} }
const curScreen = () => SCREENS.find(s => s.id === S.id) || SCREENS[0]
const tabOf = (id, dflt) => S.tab[id] || dflt
function setTab(id, key) { S.tab[id] = key; render() }
const filt = (id, k, d = '') => (S.f[id] && S.f[id][k]) ?? d
function setFilt(id, k, v) { (S.f[id] = S.f[id] || {})[k] = v; render() }

/* ═════════ building blocks ═════════ */
/* kpis: [{ label, value, tone, on }] — a figure with `on` filters the list below it */
const kpisHTML = ks => ks?.length ? `<div class="ds-kpis kpis">${ks.map(k => `<${k.on ? 'button type="button"' : 'div'} class="ds-kpi" ${k.on ? `onclick="${k.on}"` : ''}><div class="ds-kpi-label">${k.label}</div><div class="ds-kpi-value ${k.tone ? 'is-' + k.tone : ''}">${k.value}</div></${k.on ? 'button' : 'div'}>`).join('')}</div>` : ''
/* table({ cols:[{l, k, num, w, cls}], rows:[{c:{k:html}, on, cls, group}], foot:{k:html}, empty, min }) */
function table(m) {
  if (!m.rows.length) return `<div class="ds-table-card"><div class="empty-note">${m.empty || 'Nothing here'}</div></div>`
  const cls = c => [c.num ? 'is-num' : '', c.cls || ''].join(' ')
  return `<div class="ds-table-card ${m.min ? 'table-scroll' : ''}"><table class="ds-table tbl ${m.tbl || ''}" ${m.min ? `style="min-width:${m.min}px"` : ''}>
    <colgroup>${m.cols.map(c => `<col${c.w ? ` style="width:${c.w}px"` : ''}>`).join('')}</colgroup>
    <thead><tr>${m.cols.map(c => `<th class="${cls(c)}">${c.l}</th>`).join('')}</tr></thead>
    <tbody>${m.rows.map(r => r.group ? `<tr class="grp"><td colspan="${m.cols.length}">${r.group}</td></tr>` : `<tr class="${r.on ? 'ds-opens' : ''} ${r.cls || ''}" ${r.on ? `onclick="${r.on}"` : ''}>${m.cols.map(c => `<td class="${cls(c)}">${r.c[c.k] ?? ''}</td>`).join('')}</tr>`).join('')}</tbody>
    ${m.foot ? `<tfoot><tr>${m.cols.map(c => `<td class="${cls(c)}">${m.foot[c.k] ?? ''}</td>`).join('')}</tr></tfoot>` : ''}
  </table></div>`
}
/* chips: [[value, label, count?, icon?]] — icon radios, one picked */
const chips = (id, key, opts, dflt) => `<div class="chips" role="radiogroup">${opts.map(([v, l, n, i]) => `<button class="chip" type="button" role="radio" aria-checked="${filt(id, key, dflt) === v}" onclick="setFilt('${id}','${key}','${v}')">${i ? ico(i) : ''}${l}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`).join('')}</div>`
const seg = (id, key, opts, dflt) => `<div class="seg" role="radiogroup">${opts.map(([v, l]) => `<button type="button" role="radio" aria-checked="${filt(id, key, dflt) === v}" onclick="setFilt('${id}','${key}','${v}')">${l}</button>`).join('')}</div>`
const search = (id, ph) => `<label class="ds-search">${ico('search')}<input type="search" placeholder="${ph}" value="${esc(S.q[id] || '')}" oninput="S.q['${id}']=this.value;renderKeep()"></label>`
const hit = (qq, ...xs) => !qq || xs.some(x => String(x ?? '').toLowerCase().includes(qq.toLowerCase()))
const bar = (...parts) => `<div class="ds-bar">${parts.filter(Boolean).join('')}</div>`
const spacer = '<span class="bar-spacer"></span>'
const selectBox = (opts, cur, on) => `<label class="sel"><select onchange="${on}">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>` }).join('')}</select>${ico('chevron-down')}</label>`
/* the one day picker of Stores: ‹ Tue 27 Oct 2026 › */
const dayPick = () => `<span class="daypick"><button type="button" aria-label="Day before" onclick="S.day=addDays(S.day,-1);render()">${ico('chevron-left')}</button><span>${weekday(S.day)} ${day(S.day)}</span><button type="button" aria-label="Day after" onclick="if(S.day<addDays(TODAY,-1)){S.day=addDays(S.day,1);render()}">${ico('chevron-right')}</button></span>`
const field = (label, inner, o = {}) => `<label class="f7 ${o.cls || ''}"><span>${label}${o.req ? '<i class="req">*</i>' : ''}${o.optl ? `<i class="optl">${o.optl}</i>` : ''}</span>${inner}</label>`
const sec = (title, inner, right = '') => `<section class="sec"><div class="sec-head"><h3>${title}</h3>${right}</div>${inner}</section>`
const facts = xs => `<dl class="facts4">${xs.map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>`
const tabsHTML = (id, tabs, cur) => `<div class="ds-tabs door-tabs" role="tablist">${tabs.map(([k, l, n]) => `<button class="ds-tab ${k === cur ? 'is-selected' : ''}" role="tab" aria-selected="${k === cur}" type="button" onclick="setTab('${id}','${k}')">${l}${n != null ? `<span class="tab-n">${n}</span>` : ''}</button>`).join('')}</div>`
/* page({ title, crumb:[label, onclick], pill, actions:[{label,on,icon,kind}], tabs, tab, kpis, body }) */
function page(p) {
  const id = curScreen().id
  const crumb = p.crumb ? `<button class="crumb-back" type="button" onclick="${p.crumb[1]}">${ico('chevron-left')}${p.crumb[0]}</button><span class="crumb-sep">/</span>` : ''
  return `<div class="door-head ${p.tabs ? '' : 'notabs'}"><div class="door-top"><div class="door-title">${crumb}<h1 class="ds-title">${p.title}</h1>${p.pill || ''}</div><div class="door-actions">${(p.actions || []).map(a => a.raw || `<button class="ds-btn ds-btn--${a.kind || 'primary'}" type="button" onclick="${a.on}">${a.icon ? ico(a.icon) : ''}${a.label}</button>`).join('')}</div></div>${p.tabs ? tabsHTML(id, p.tabs, p.tab) : ''}</div>${kpisHTML(p.kpis)}${p.body}`
}
function toast(title, desc, tone = 'ok') {
  const host = $('#toasts'), el = document.createElement('div')
  el.className = `ds-toast ds-toast--${tone} in`
  el.innerHTML = `${ico(tone === 'ok' ? 'check' : 'alert')}<div class="ds-toast-text"><div class="ds-toast-title">${title}</div>${desc ? `<div class="ds-toast-desc">${desc}</div>` : ''}</div>`
  const kill = () => { el.classList.add('gone'); setTimeout(() => el.remove(), 170) }
  host.appendChild(el); setTimeout(kill, 4200)
  while (host.children.length > 3) host.firstChild.remove()
}
const soon = what => toast(what, 'Prototype: nothing is saved')

/* ═════════ sheets: openSheet({ crumb, title, pill, body, foot, size }) ═════════
   Layer move: slides in from the right (340ms), what's under dims and never moves; closing
   takes the same path back (200ms). size: rail · wide · record · workspace */
function openSheet(o) {
  S.stack.push(o)
  drawLayers()
  const wraps = document.querySelectorAll('#layers .sheet-wrap')
  const top = wraps[wraps.length - 1]
  requestAnimationFrame(() => requestAnimationFrame(() => { top.classList.add('on'); $('#layers').classList.add('open') }))
}
function refreshSheet(o) { S.stack[S.stack.length - 1] = { ...S.stack[S.stack.length - 1], ...o }; drawLayers(true) }
function closeSheet() {
  const wraps = document.querySelectorAll('#layers .sheet-wrap'), top = wraps[wraps.length - 1]
  if (!top) return
  top.classList.remove('on'); top.classList.add('out')
  if (S.stack.length === 1) $('#layers').classList.add('closing')
  setTimeout(() => { S.stack.pop(); drawLayers(true) }, 200)
}
function drawLayers(settled) {
  const el = $('#layers')
  el.classList.remove('closing')
  if (!S.stack.length) { el.className = 'layers'; el.innerHTML = ''; return }
  el.innerHTML = `<div class="veil" onclick="closeSheet()"></div>` + S.stack.map((o, i) => {
    const last = i === S.stack.length - 1
    const on = settled || !last ? 'on' : ''
    return `<div class="sheet-wrap ${on} ${last ? '' : 'under'}"><div class="ds ds-sheet ds-sheet--${o.size || 'wide'}" role="dialog" aria-label="${esc(o.titleText || '')}">
    <div class="ds-sheet-head"><div class="ds-sheet-headtext">${o.crumb ? `<div class="ds-sheet-crumb">${o.crumb.map(esc).join('<span class="ds-sep"> / </span>')}</div>` : ''}<div class="ds-sheet-titlerow"><h2 class="ds-sheet-title">${o.title}</h2>${o.pill || ''}</div></div>
    <button class="ds-sheet-close" type="button" aria-label="Close" onclick="closeSheet()">${ico('x', 'ds-ico--17')}</button></div>
    <div class="ds-sheet-body">${o.body}</div>${o.foot ? `<div class="ds-sheet-foot">${o.foot}</div>` : ''}</div></div>`
  }).join('')
  if (settled) el.classList.add('open')
}

/* ═════════ shell ═════════ */
function rail() { return `<nav class="ds-rail"><span class="ds-rail-btn find" role="button" aria-label="Find" onclick="openPalette()">${ico('search')}</span><span class="ds-rail-btn is-current" aria-label="Finance">${ico('wallet')}</span></nav>` }
function panel() {
  const cur = curScreen().id
  return `<aside class="ds-panel"><div class="p-head"><div class="ds-panel-title">Finance</div></div><div class="p-body">${GROUPS.map(([g, label]) => {
    const xs = SCREENS.filter(s => s.group === g)
    if (!xs.length) return ''
    return `${label ? `<span class="nav-label">${label}</span>` : '<div class="nav-gap"></div>'}<div class="ds-nav">${xs.map(s => {
      const b = s.badge ? s.badge() : null
      return `<button class="nav-row-btn ${s.id === cur ? 'on' : ''}" type="button" onclick="go('${s.id}')"><span>${s.label}</span>${b ? `<span class="nb ${b[1] || ''}">${b[0]}</span>` : ''}</button>`
    }).join('')}</div>`
  }).join('')}</div><div class="p-foot">${ico('calendar')}October 2026 · open</div></aside>`
}
function render() {
  const sc = curScreen()
  const body = S.doc && sc.doc ? sc.doc(S.doc) : sc.render()
  $('#stage').innerHTML = `<div class="ds ds-shell shell">${rail()}${panel()}<main class="ds-page page"><div class="ds-page-content">${body}</div></main></div>`
  if (sc.after) sc.after()
  history.replaceState(null, '', '#' + sc.id + (S.doc ? '/' + encodeURIComponent(S.doc) : S.tab[sc.id] ? '/' + S.tab[sc.id] : ''))
}
/* typing in a search box must not lose the caret */
function renderKeep() {
  const a = document.activeElement, inSearch = a && a.closest('.ds-search'), pos = a && a.selectionStart
  render()
  if (inSearch) { const n = $('.ds-page .ds-search input'); if (n) { n.focus(); n.setSelectionRange(pos, pos) } }
}
function go(id, tab, doc) {
  S.id = id; S.doc = doc || null
  if (tab) S.tab[id] = tab
  while (S.stack.length) S.stack.pop()
  drawLayers(true)
  window.scrollTo(0, 0); render()
}
const openDoc = (id, doc) => go(id, null, doc)

/* ═════════ ⌘K: every row, every 7Soft name, every document number ═════════
   No animation — opened many times a day. */
const PAL = { open: false, q: '', i: 0 }
function palItems() {
  const xs = []
  SCREENS.forEach(s => {
    xs.push({ t: s.label, g: GROUPS.find(g => g[0] === s.group)[1] || s.label, go: () => go(s.id) })
    ;(s.s7 || []).forEach(([name, tab]) => xs.push({ t: name, seven: true, g: s.label, go: () => go(s.id, tab) }))
  })
  ;(window.PAL_DOCS || []).forEach(d => xs.push(d))
  const qq = PAL.q.trim().toLowerCase()
  return qq ? xs.filter(x => (x.t + ' ' + x.g).toLowerCase().includes(qq)).slice(0, 40) : xs.filter(x => !x.doc).slice(0, 60)
}
function openPalette() { PAL.open = true; PAL.q = ''; PAL.i = 0; drawPalette(); $('#palette input').focus() }
function closePalette() { PAL.open = false; drawPalette() }
function drawPalette(keepInput) {
  const el = $('#palette')
  if (!PAL.open) { el.className = 'palette'; el.innerHTML = ''; return }
  const items = palItems()
  PAL.i = Math.min(PAL.i, Math.max(0, items.length - 1))
  const list = items.length ? items.map((x, i) => `<button class="pal-row ${i === PAL.i ? 'on' : ''}" type="button" onmousemove="if(PAL.i!==${i}){PAL.i=${i};drawPalette(true)}" onclick="palGo(${i})"><span class="pr-t">${esc(x.t)}</span>${x.seven ? `<span class="pr-7">7Soft · lands on ${esc(x.g)}</span>` : `<span class="pr-g">${esc(x.g)}</span>`}</button>`).join('') : '<div class="empty-note">No menu or document by that name</div>'
  if (keepInput && $('#palette .pal-list')) { $('#palette .pal-list').innerHTML = list; return }
  el.className = 'palette open'
  el.innerHTML = `<div class="pv" onclick="closePalette()"></div><div class="pal" role="dialog" aria-label="Find"><div class="pal-in">${ico('search')}<input placeholder="Find a menu, a 7Soft name or a document number" value="${esc(PAL.q)}" oninput="PAL.q=this.value;PAL.i=0;drawPalette(true)"><kbd>esc</kbd></div><div class="pal-list">${list}</div></div>`
}
function palGo(i) { const x = palItems()[i]; closePalette(); if (x) x.go() }
addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); PAL.open ? closePalette() : openPalette(); return }
  if (PAL.open) {
    const n = palItems().length
    if (ev.key === 'Escape') { closePalette() }
    else if (ev.key === 'ArrowDown') { ev.preventDefault(); PAL.i = (PAL.i + 1) % Math.max(n, 1); drawPalette(true) }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); PAL.i = (PAL.i - 1 + n) % Math.max(n, 1); drawPalette(true) }
    else if (ev.key === 'Enter') { ev.preventDefault(); palGo(PAL.i) }
    return
  }
  if (ev.key === 'Escape' && S.stack.length) closeSheet()
})
function boot() {
  const raw = location.hash.slice(1), cut = raw.indexOf('/')
  const h = cut < 0 ? [decodeURIComponent(raw)] : [decodeURIComponent(raw.slice(0, cut)), decodeURIComponent(raw.slice(cut + 1))]
  const sc = SCREENS.find(s => s.id === h[0])
  if (sc) { S.id = h[0]; if (h[1]) { if (sc.doc && sc.isDoc && sc.isDoc(h[1])) S.doc = h[1]; else S.tab[h[0]] = h[1] } }
  render()
}

/* ═════════ the books: Central Fashion Store, October 2026 ═════════
   Account = 10-digit base + 2-digit location (00 head office, 01–13 shops C001–C013).
   Shop names follow the order of the chart's affiliate accounts (002 CIKUPA … 014 WONOSOBO) —

/* ── stores: one close per shop per day ── tenders: cash · debit · credit · QRIS on the shop's EDC bank */
const MDR = { debitOn: .0015, debitOff: .01, credit: .018, qris: .007 }
const DAYS = {}
function closeOf(date, code) {
  const k = date + code
  if (DAYS[k]) return DAYS[k]
  const s = STORE[code], i = STORES.indexOf(s)
  SEED = Number(date.replace(/-/g, '')) % 100000 * 31 + i * 977 + 13
  const wk = weekday(date), boost = wk === 'Sat' || wk === 'Sun' ? 1.45 : 1
  const gross = round((6e6 + rnd() * 18e6) * boost, 1000)
  const share = { cash: .3 + rnd() * .15, debit: .22 + rnd() * .1, credit: .08 + rnd() * .06 }
  share.qris = Math.max(.08, 1 - share.cash - share.debit - share.credit)
  const t = {}
  Object.keys(share).forEach(m => { t[m] = round(gross * share[m], 500) })
  t.qris = gross - t.cash - t.debit - t.credit
  /* no money goes back over the counter: a return is an exchange (the piece is swapped, the
     customer may top up the difference); a void cancels a receipt before the day is closed */
  const exchN = rnd() < .5 ? 1 + Math.floor(rnd() * 2) : 0
  const exchVal = exchN ? round(150000 + rnd() * 250000, 1000) * exchN : 0
  const topUp = exchN && rnd() < .5 ? round(20000 + rnd() * 60000, 1000) : 0
  const voidsN = rnd() < .35 ? 1 + (rnd() < .3 ? 1 : 0) : 0
  const voidAmt = voidsN ? round(100000 + rnd() * 300000, 1000) * voidsN : 0
  const receipts = Math.max(8, Math.round(gross / (210000 + rnd() * 90000)))
  const cashExp = t.cash
  const yesterday = addDays(TODAY, -1)
  let diff = 0, state = 'posted'
  if (date === yesterday) {
    state = ['C004', 'C009'].includes(code) ? 'diff' : code === 'C012' ? 'open' : ['C002', 'C006', 'C011'].includes(code) ? 'ready' : 'posted'
    diff = code === 'C004' ? -50000 : code === 'C009' ? 20000 : 0
  } else if (date === addDays(TODAY, -2) && code === 'C012') { state = 'posted' }
  const cashiers = 2 + (gross > 15e6 ? 1 : 0)
  return DAYS[k] = { date, code, gross, t, returns: 0, returnsN: 0, exchN, exchVal, topUp, voidsN, voidAmt, voids: voidsN, receipts, cashExp, counted: state === 'open' ? null : cashExp + diff, diff, state, cashiers, tax: Math.round(gross * 11 / 111), closedAt: state === 'open' ? null : `${21 + Math.floor(rnd() * 2)}:${String(Math.floor(rnd() * 60)).padStart(2, '0')}`, by: PEOPLE[i] }
}
const CLOSE_WORD = { posted: ['Posted', ''], ready: ['Ready to post', 'info'], diff: ['Difference', 'warn'], open: ['Not closed', 'bad'] }
/* the money the EDC bank owes for a shop's day: card + QRIS, credited H+1 net of the fee (on-us debit) */
function edcOf(date, code) {
  const d = closeOf(date, code)
  const fee = Math.round(d.t.debit * MDR.debitOn + d.t.credit * MDR.credit + (d.t.qris > 0 ? d.t.qris * MDR.qris : 0))
  return { gross: d.t.debit + d.t.credit + d.t.qris, fee, net: d.t.debit + d.t.credit + d.t.qris - fee, credit: addDays(date, 1) }
}
/* receipts of a shop's day — drawn when the day is opened */
function receiptsOf(date, code) {
  const d = closeOf(date, code), out = []
  SEED = Number(date.slice(-2)) * 101 + STORES.indexOf(STORE[code]) * 7 + 3
  let left = d.gross, n = 0
  const methods = [['Cash', d.t.cash], [`Debit ${STORE[code].edc}`, d.t.debit], [`Credit ${STORE[code].edc}`, d.t.credit], [`QRIS ${STORE[code].edc}`, d.t.qris]]
  while (n < Math.min(d.receipts, 14)) {
    const lines = [], k = 1 + Math.floor(rnd() * 3)
    for (let j = 0; j < k; j++) { const a = pick(ARTICLES); const qty = rnd() < .8 ? 1 : 2; const disc = rnd() < .25 ? .1 : 0; lines.push({ a, v: 100 + Math.floor(rnd() * 8), qty, price: a[2], disc: Math.round(a[2] * qty * disc) }) }
    const total = lines.reduce((x, l) => x + l.a[2] * l.qty - l.disc, 0)
    const m = pick(methods)[0]
    const hh = 10 + Math.floor(n * 11 / 14), mm = Math.floor(rnd() * 60)
    out.push({ no: `${code}-${date.slice(2).replace(/-/g, '')}-${String(n + 1).padStart(4, '0')}`, time: `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`, cashier: PEOPLE[(STORES.indexOf(STORE[code]) + (n % 2)) % PEOPLE.length], method: m, lines, total, member: rnd() < .35 ? `M-${String(10000 + Math.floor(rnd() * 89999))}` : null })
    left -= total; n++
  }
  return out
}

/* ═════════ Stores › Daily close ═════════
   Replaces 7Soft's Penjualan Cash · POS, Info Penjualan and Retur Penjualan (a return swaps the piece
   for another; no money goes back over the counter). The tills write every
   receipt; Finance checks one close per shop per day: what the POS says per payment, what was
   counted or what the bank will pay, the difference, then posts it. */
const TENDERS = [['cash', 'Cash'], ['debit', 'Debit'], ['credit', 'Credit'], ['qris', 'QRIS']]
const dayCloses = date => STORES.map(s => closeOf(date, s.code))
const POSTED_NOW = new Set()
const stateOf = d => POSTED_NOW.has(d.date + d.code) ? 'posted' : d.state

function closeRow(d) {
  const s = STORE[d.code], stt = stateOf(d), [w, tone] = CLOSE_WORD[stt]
  const card = d.t.debit + d.t.credit + d.t.qris
  return {
    on: `openClose('${d.date}','${d.code}')`, cls: stt === 'open' ? 'dim' : '',
    c: {
      store: `<span class="nm">${d.code}</span> <span class="mute">${esc(s.name)}</span>`,
      take: money(d.gross), cash: money(d.t.cash), card: money(card),
      counted: d.counted == null ? DASH : money(d.counted),
      diff: d.counted == null ? DASH : d.diff ? `<span class="${d.diff < 0 ? 'bad' : 'warn'}">${signed(d.diff)}</span>` : '<span class="mute">0</span>',
      st: st(w, tone),
    },
  }
}

  out.sort((x, y) => x.date.localeCompare(y.date) || x.code.localeCompare(y.code)).forEach(x => { if (x.spent) { seq[x.code] = (seq[x.code] || 0) + 1; x.no = `KK/${x.code}/2610/${String(seq[x.code]).padStart(4, '0')}` } })
  return out.reverse()
})

function shopState(code) {
  const c = boxOf('c', code), p = boxOf('p', code), f = boxOf('f', code)
  const short = c.counted - c.books, last = [c.countedOn, p.countedOn, f.countedOn].sort()[0]
  const base = { short, last }
  if (short < 0) return { ...base, k: 'short', w: ['Short', 'bad'] }
  if (DEPS.some(d => d.code === code && depState(d) === 'late')) return { ...base, k: 'late', w: ['Deposit late', 'bad'] }
  if (short > 0) return { ...base, k: 'over', w: ['Over', 'warn'] }
  if (daysBetween(last, TODAY) > 7) return { ...base, k: 'stale', w: ['Not counted for a week', 'warn'] }
  return { ...base, k: 'ok', w: ['Counted', 'ok'] }
}

/* one shop: what it holds, the week's chain from takings to the bank, what moved */
function shopSheet(code) {
  const s = STORE[code], i = STORES.indexOf(s), c = boxOf('c', code), p = boxOf('p', code), f = boxOf('f', code), stt = shopState(code)
  const days = []; for (let d = '2026-10-23'; d <= addDays(TODAY, -1); d = addDays(d, 1)) days.push(d)
  const chain = days.map(d => {
    const cl = closeOf(d, code), dep = DEPS.find(x => x.code === code && x.close === d), ds = dep && depState(dep)
    return {
      on: `openClose('${d}','${code}')`,
      c: {
        d: `${weekday(d)} ${dayS(d)}`, t: money(cl.cashExp),
        k: cl.counted == null ? DASH : cl.diff ? `<span class="${cl.diff < 0 ? 'bad' : 'warn'}">${money(cl.counted)}</span>` : money(cl.counted),
        n: dep ? tlink(dep.no, `openShopCash('${code}')`) : DASH, a: dep ? money(dep.amt) : DASH,
        l: !dep ? (cl.counted == null ? DASH : '<span class="mute">Not deposited yet</span>') : dep.landed ? dayS(dep.landed) : ds === 'late' ? st(lateWord(daysBetween(dep.date, TODAY)), 'bad') : st('In transit', 'info'),

  DEPS.filter(x => x.code === code && x.date >= '2026-10-23').forEach(x => mv.push({ date: x.date, doc: `Deposit ${x.no}`, box: 'Cash on hand', w: `To ${ACC[x.acc].name} · slip ${x.slip}`, o: x.amt }))
  PETTY.filter(x => x.code === code && x.date >= '2026-10-23').forEach(x => mv.push({ date: x.date, doc: x.doc || x.no || 'Top-up', on: x.doc ? `openDoc('bkk','${x.doc}')` : '', box: 'Petty cash', w: x.for, i: x.top, o: x.spent }))
  mv.sort((x, y) => y.date.localeCompare(x.date))

  return {

        rows: chain,
      }), `<span class="mute">${dayS(days[0])} – ${dayS(days[days.length - 1])}</span>`)}
      ${sec('Movements', table({
        cols: [{ l: 'Date', k: 'd', w: 90 }, { l: 'Document', k: 'doc', w: 210 }, { l: 'Box', k: 'b', w: 140 }, { l: 'For', k: 'w' }, { l: 'In', k: 'i', num: 1, w: 150 }, { l: 'Out', k: 'o', num: 1, w: 150 }],
        rows: mv.map(m => ({ on: m.on || '', c: { d: dayS(m.date), doc: `<span class="nm">${esc(m.doc)}</span>`, b: m.box, w: `<span class="one">${esc(m.w)}</span>`, i: m.i ? money(m.i) : '', o: m.o ? money(m.o) : '' } })),

/* record a deposit: the latest close not yet deposited fills the amount */
function scPend(code) {
  for (let d = addDays(TODAY, -1); d >= '2026-10-23'; d = addDays(d, -1)) {
    if (DEPS.some(x => x.code === code && x.close === d)) return null
    if (closeOf(d, code).counted != null) return d
  }
  return null
}
const scSug = code => { const p = scPend(code); return p ? round(closeOf(p, code).cashExp * .96, 1000) : 0 }
const bankOpts = cur => ACCOUNTS.filter(a => a.kind === 'bank' && a.name.startsWith('Giro')).map(a => `<option value="${a.id}" ${a.id === cur ? 'selected' : ''}>${esc(accLabel(a))}</option>`).join('')

  const c0 = code || STORES[0].code, sug = scSug(c0)
  openSheet({

    body: `<div class="form-grid">
      ${code ? '' : field('Shop', `<select id="sc-shop" onchange="scDepShop(this.value)">${STORES.map(s => `<option value="${s.code}">${esc(storeName(s.code))}</option>`).join('')}</select>`, { req: 1, cls: 's4' })}
      ${field('Amount', `<input id="sc-amt" inputmode="numeric" placeholder="0" value="${sug ? dots(sug) : ''}" ${moneyIn()}>`, { req: 1, cls: 's4' })}
      ${field('Into', `<select id="sc-acc">${bankOpts(GIRO_OF[STORE[c0].edc])}</select>`, { cls: 's4' })}
      ${field('Slip no', `<input id="sc-slip" placeholder="On the bank's slip">`, { cls: 's2' })}
      ${field('Date', `<input id="sc-date" type="date" value="${TODAY}">`, { cls: 's2' })}</div>`,
    foot: btn('Save deposit', `scDepSave('${code}')`),
  })
}
function scDepShop(code) { const s = scSug(code); $('#sc-amt').value = s ? dots(s) : ''; $('#sc-acc').value = GIRO_OF[STORE[code].edc] }
function scDepSave(fixed) {
  const code = fixed || $('#sc-shop').value, amt = parseRp($('#sc-amt').value), acc = $('#sc-acc').value, slip = $('#sc-slip').value.trim(), date = $('#sc-date').value || TODAY
  const c = boxOf('c', code), bad = !amt || amt > c.books
  $('#sc-amt').closest('.f7').classList.toggle('err', bad)
  if (bad) { toast(amt ? `More than the cash on hand at ${code}` : 'Type the amount', amt ? money(c.books) + ' on hand' : '', 'bad'); return }
  const close = scPend(code) || date
  let no = `${code}-${close.slice(8)}`
  while (DEPS.some(x => x.no === no)) no += 'b'
  DEPS.push({ no, code, close, date, amt, acc, slip: slip || '—', landed: null, by: PEOPLE[STORES.indexOf(STORE[code])] })
  c.books -= amt; c.counted -= amt; ACC[acc].books += amt
  toast(`Deposit ${no} recorded`, `${money(amt)} in transit to ${ACC[acc].name}`)
  closeSheet()
  setTimeout(() => { const top = S.stack[S.stack.length - 1]; if (top && top.shop === code) refreshSheet(shopSheet(code)); render() }, 220)
}

/* ═════════ Cash & Bank › Giro ═════════
   BG Keluar from writing to clearing: what is already promised out of which bank, and when.
   Every BG is written by a BKK; Saldo Awal BG are the ones still out when the books opened. */
const allGiros = () => [...GIROS, ...GIRO_OPENING]
const isOpening = g => GIRO_OPENING.includes(g)
const giroAcc = g => g.acc || GIRO_OF[g.bank]
const giroBy = no => allGiros().find(g => g.no === no)
const giroOut = g => g.state === 'written' || g.state === 'with'
const giroLate = g => g.state === 'with' && g.due < TODAY
const giroWord = g => giroLate(g) ? [lateWord(daysBetween(g.due, TODAY)), 'bad'] : GIROWORD[g.state]
/* the account's books, less every BG still out that falls due on or before this one */
function giroBalance(g) {
  if (!giroOut(g)) return null
  const a = ACC[giroAcc(g)]
  return a.books - sumOf(allGiros().filter(x => giroOut(x) && giroAcc(x) === giroAcc(g) && (x.due < g.due || (x.due === g.due && x.no <= g.no))))
}
const giroBill = g => g.bkk && BILLS.find(b => b.bounced === g.bkk)
function giroAction(g, sheet) {
  if (g.state === 'written') return btn('Given to supplier', `grGive('${g.no}')`)
  if (g.state === 'with') return g.onStatement ? btn('Match bank line', `grMatch('${g.no}')`) : btn('Mark cleared', `grClear('${g.no}')`)
  if (g.state === 'bounced') return btn('Replace', `grReplace('${g.no}')`)
  return sheet && g.bkk && docOf(g.bkk) ? btn('Open BKK', `openDoc('bkk','${g.bkk}')`) : ''
}
function giroCard(g) {
  const bal = giroBalance(g), bill = giroBill(g)
  const when = g.state === 'cleared' ? `Cleared ${dayS(g.cleared)}` : g.state === 'bounced' ? `<span class="bad">Bounced ${dayS(g.bounced)}</span>` : giroLate(g) ? `<span class="bad">${lateWord(daysBetween(g.due, TODAY))}</span> · due ${dayS(g.due)}` : `Due ${dayS(g.due)}`
  const act = giroAction(g)
  return `<div class="bcard" role="button" tabindex="0" onclick="openGiro('${g.no}')">
    <div class="nm one">${esc(SUP[g.sup].name)}</div>
    <div class="bc-amt" style="margin-top:4px">${money(g.amt)}</div>
    <div class="bc-sub">BG ${g.no} · ${g.bank}${isOpening(g) ? ' · Saldo Awal' : ''}</div>
    <div class="bc-sub">${when}</div>
    ${bal != null ? `<div class="bc-sub">Balance on due date</div><div class="ds-num ${bal < 0 ? 'bad' : ''}">${money(bal)}</div>` : ''}
    ${bill ? `<div class="bc-sub">${bill.no} open again</div>` : ''}
    ${act ? `<div class="bc-act">${act}</div>` : ''}</div>`
}

/* ═════════ Cash & Bank › Bank reconciliation ═════════
   7Soft's Rekonsiliasi Bank, laid out as the bank prints the statement: every line, the running
   balance, and what it is in the books. Card and QRIS are booked straight to the EDC bank's Cash in Bank (owner, 1 Oct);
   matching a credit to its Daily close books the MDR fee to 6010310004. */
const REC = { done: {}, booked: {}, lastF: null }
/* lines the bank shows that nobody has matched yet, and what the bank took on its own */
const REC_SET = {
  bca: {
    match: ['BKK/HO/2610/0058', 'BKK/HO/2610/0060', 'BKM/HO/2610/0024', 'C003-26'],
    own: [['2026-10-22', 'BIAYA BUKU BG 25 LBR', -117000, 'Buku BG 25 lembar'], ['2026-10-25', 'BIAYA TRSF BI-FAST 2510/WS95058', -2500, 'BI-FAST transfer ke Graha Clean']],
  },
  mdr: {
    match: ['BKM/HO/2610/0021', 'C013-26'],
    own: [['2026-10-26', 'BIAYA ADM GIRO 10/2026', -30000, 'Adm giro Mandiri Oktober'], ['2026-10-27', 'BIAYA MCM 10/2026', -50000, 'Mandiri Cash Management Oktober']],
  },
  bcat: { own: [['2026-10-27', 'BUNGA', 362300, 'Bunga tabungan Oktober']] },
}
const BANKTXT = {
  BCA: { db: 'TRSF E-BANKING DB', cr: 'TRSF E-BANKING CR', ref: (v, d) => `${d}/FTSCY/WS95${v.no.slice(-3)}`, dep: 'SETOR TUNAI', edc: 'KR EDC BCA', mid: '885' },
  Mandiri: { db: 'MCM INHOUSETRF DB', cr: 'MCM INHOUSETRF CR', ref: (v, d) => `${d}${v.no.slice(-4)}`, dep: 'SETORAN TUNAI', edc: 'KR EDC MANDIRI', mid: '710' },
  BRI: { db: 'TRF DB', cr: 'TRF CR', ref: (v, d) => `${d}${v.no.slice(-3)}`, dep: 'SETOR TUNAI', edc: 'KR EDC BRI', mid: '002' },
}
const recBanks = () => ACCOUNTS.filter(a => a.kind === 'bank' && !a.upload)
function vDesc(v, m, T) {
  const o = (v.other || [])[0], d = v.date.slice(8) + v.date.slice(5, 7)
  if (m === 'bkk' && o && o[0] === '6010310004') return 'BIAYA ADM'
  if (m === 'bkm' && o && o[0] === '8010110001') return 'BUNGA JASA GIRO'
  const who = v.party ? SUP[v.party].name.replace(/,\s*(PT|CV)$/i, '') : v.ref && !/^TRF/.test(v.ref) ? v.ref : v.what
  return `${m === 'bkk' ? T.db : T.cr} ${T.ref(v, d)} ${who.toUpperCase()}`
}
function lineState(l, set) {
  const s = l.src, m = set.match || []
  if (s.t === 'edc') return { st: 'ok', doc: [`Close ${s.code} · ${dayS(s.close)}`, `openClose('${s.close}','${s.code}')`] }
  if (s.t === 'dep') return { st: m.includes(s.x.no) && !REC.done[l.id] ? 'match' : 'ok', doc: [`Deposit ${s.x.no}`, `openShopCash('${s.x.code}')`] }
  if (s.t === 'v') return { st: m.includes(s.v.no) && !REC.done[l.id] ? 'match' : 'ok', doc: [s.v.no, `openDoc('${s.m}','${s.v.no}')`] }
  if (s.t === 'giro') return { st: s.g.state === 'with' ? 'match' : 'ok', doc: [`BG ${s.g.no}`, `openGiro('${s.g.no}')`] }
  const no = REC.booked[l.id]
  return no ? { st: 'ok', doc: [no, `openDoc('${s.m}','${no}')`] } : { st: 'book', doc: null }
}
/* the statement of one account, 20–27 Oct, built from the shared books so every figure agrees */
function stmtOf(id) {
  return keepSeed(() => {
    const a = ACC[id], T = BANKTXT[a.bank], set = REC_SET[id] || {}, from = addDays(a.stmt, -7), L = []
    const inWin = d => d >= from && d <= a.stmt
    if (a.name.startsWith('Giro')) STORES.filter(s => s.edc === a.bank).forEach((s, i) => {
      for (let d = from; d <= a.stmt; d = addDays(d, 1)) {
        const c = addDays(d, -1), e = edcOf(c, s.code)
        if (e.net > 0) L.push({ id: `edc-${s.code}-${c}`, date: d, ord: 1, desc: `${T.edc} ${c.slice(8)}/${c.slice(5, 7)} MID ${T.mid}${String(1003 + Number(s.loc) * 217).padStart(5, '0')}`, dr: 0, cr: e.net, src: { t: 'edc', code: s.code, close: c, e } })
      }
    })
    DEPS.filter(x => x.acc === id && x.landed && inWin(x.landed)).forEach(x => L.push({ id: 'dep-' + x.no, date: x.landed, ord: 2, desc: `${T.dep} ${x.code}`, dr: 0, cr: x.amt, src: { t: 'dep', x } }))
    ;['bkk', 'bkm'].forEach(m => VOUCHERS[m].filter(v => v.acc === id && v.st === 'posted' && v.method !== 'giro' && inWin(v.date))
      .forEach(v => L.push({ id: 'v-' + v.no, date: v.date, ord: 3, desc: vDesc(v, m, T), dr: m === 'bkk' ? v.amt : 0, cr: m === 'bkm' ? v.amt : 0, src: { t: 'v', m, v } })))
    allGiros().filter(g => giroAcc(g) === id && ((g.state === 'cleared' && inWin(g.cleared)) || (g.state === 'with' && g.onStatement)))
      .forEach(g => L.push({ id: 'bg-' + g.no, date: g.state === 'cleared' ? g.cleared : g.due, ord: 4, desc: `KLIRING BG ${g.no}`, dr: g.amt, cr: 0, src: { t: 'giro', g } }))
    ;(set.own || []).forEach(([d, desc, amt, note], i) => L.push({ id: `own-${id}-${i}`, date: d, ord: 5, desc, dr: amt < 0 ? -amt : 0, cr: amt > 0 ? amt : 0, src: { t: 'own', note, m: amt < 0 ? 'bkk' : 'bkm', gl: amt < 0 ? '6010310004' : '8010110001' } }))
    L.sort((x, y) => x.date.localeCompare(y.date) || x.ord - y.ord || x.desc.localeCompare(y.desc))
    let bal = a.bankBal - sumOf(L, l => l.cr - l.dr)
    const open = bal
    L.forEach(l => { bal += l.cr - l.dr; l.bal = bal; Object.assign(l, lineState(l, set)) })
    /* in the books, not at the bank yet: BG given and booked but not cleared, deposits not landed */
    const outs = [
      ...allGiros().filter(g => giroAcc(g) === id && g.state === 'with' && !g.onStatement && (!g.bkk || !docOf(g.bkk) || docOf(g.bkk).st === 'posted')).sort((x, y) => x.due.localeCompare(y.due))
        .map(g => ({ t: 'giro', g, date: g.due, desc: `BG ${g.no} · ${SUP[g.sup].name}`, dr: g.amt, cr: 0, late: giroLate(g), doc: g.bkk && docOf(g.bkk) ? [g.bkk, `openDoc('bkk','${g.bkk}')`] : [`BG ${g.no}`, `openGiro('${g.no}')`], on: `openGiro('${g.no}')` })),
      ...DEPS.filter(x => x.acc === id && !x.landed).sort((x, y) => x.date.localeCompare(y.date))
        .map(x => ({ t: 'dep', x, date: x.date, desc: `${T.dep} ${x.code} · deposit ${x.no}`, dr: 0, cr: x.amt, late: depState(x) === 'late', doc: [`Deposit ${x.no}`, `openShopCash('${x.code}')`], on: `openShopCash('${x.code}')` })),
    ]
    return { a, from, open, lines: L, outs }
  })
}
/* bank − books − to match = 0, shown only on the printout */
function recSums(id) {
  const s = stmtOf(id), a = s.a
  const own = s.lines.filter(l => l.st === 'book'), gir = s.outs.filter(o => o.t === 'giro'), dep = s.outs.filter(o => o.t === 'dep')
  const ownNet = sumOf(own, l => l.cr - l.dr), giroNet = sumOf(gir, 'dr'), depNet = sumOf(dep, 'cr')
  const toMatch = ownNet + giroNet - depNet
  return { s, own, gir, dep, ownNet, giroNet, depNet, toMatch, diff: a.bankBal - a.books - toMatch }
}
const syncMatch = id => { ACC[id].toMatch = stmtOf(id).lines.filter(l => l.st !== 'ok').length }

function pyTick(no, on, el) {
  const xs = sel(), b = BILLS.find(x => x.no === no)
  if (on) {
    const other = xs.map(n => BILLS.find(x => x.no === n)).find(x => x.sup !== b.sup)
    if (other) { el.checked = false; toast('One supplier per BKK', `The ticked bills are for ${esc(supName(other.sup))}`, 'warn'); return }
    if (!xs.includes(no)) xs.push(no)
  } else S.sel.bills = xs.filter(n => n !== no)
  render()
}
function pyClear() { S.sel.bills = []; render() }
/* Pay: a BKK with these bills ticked. A bill already on a draft BKK opens that draft instead of paying twice. */
function pyPay(sup, nos) {
  const draft = VOUCHERS.bkk.find(v => v.st === 'draft' && v.party === sup && (v.settle || []).some(([b]) => nos.includes(b)))
  let key = 'new', d
  if (draft) { key = draft.no; d = draftOf('bkk', key) }
  else { delete DOCS.bkknew; d = draftOf('bkk', 'new'); d.party = sup; d.rows = settleRowsFor(d, null); d.acc = 'bca'; d.giro.bank = 'BCA'; d.tab = 'settle' }
  let added = 0
  d.rows.forEach(r => { if (nos.includes(r.no) && !r.pick) { r.pick = true; r.amt = r.open - r.disc; added++ } })
  S.sel.bills = []
  if (draft) toast(added ? `Added to ${draft.no}` : `Already on ${draft.no}`, 'Draft BKK · post it there')
  openDoc('bkk', key)
}

function bfPickRc(code) {
  const rc = RCPT.find(r => r.sup === code && !r.billed)
  BF.rc = rc ? rc.bpb : ''
  BF.tipe = rc ? 'MATCHING' : 'STANDARD'
  BF.qty = rc ? rc.lines.map(l => l[2]) : []

function pyNewBill(pre) {

  if (pre) Object.assign(BF, pre)
  else if (S.id === 'bills' && filt('bills', 'sup', 'all') !== 'all') { BF.sup = filt('bills', 'sup'); bfPickRc(BF.sup) }
  openSheet(billForm())

const bfRc = () => RCPT.find(r => r.bpb === BF.rc)
function bfTotals() {
  const rc = bfRc()
  const total = BF.tipe === 'UANG MUKA' ? BF.adv : BF.tipe === 'MATCHING' && rc ? sum(rc.lines, (l, i) => (BF.qty[i] || 0) * l[3]) : sum(BF.free, l => Math.round((l.qty || 0) * (l.price || 0)))
  const ppn = BF.ppn === 'ppn' ? total - Math.round(total * 100 / 111) : 0
  return { total, ppn, dpp: total - ppn }
}

  if (!BF.date) p.push('Date')
  else if (BF.date < '2026-10-01') p.push('September is closed')
  if (bfTotals().total <= 0) p.push('Nothing billed yet')
  return p

/* ── one jurnal, 7Soft style: header, the grid of lines, Total Debet · Total Kredit · Selisih ── */
let JNEW = null
const jnew = () => JNEW || (JNEW = { date: TODAY, ref: '', note: '', lines: [], tried: false })
const usedJu = () => Math.max(0, ...allJ().filter(j => j.no.startsWith('JU/HO/2610/')).map(j => +j.no.slice(-4)))
const nextJu = () => 'JU/HO/2610/' + pad4(Math.max(W.FIN_JU ? W.FIN_JU.n : 0, usedJu() + 1))
const takeJu = () => { const n = nextJu(); if (W.FIN_JU) W.FIN_JU.n = +n.slice(-4) + 1; return n }
const bumpJu = () => { if (W.FIN_JU) W.FIN_JU.n = Math.max(W.FIN_JU.n, usedJu() + 1) }
const jLine = ([b, l, u, dr, cr]) => ({ base: b, unit: unitOf(l), note: u, dr, cr })
function juProblems(d) {
  const p = [], ls = d.lines.filter(l => l.base || l.dr || l.cr)
  if (!ls.length) p.push('No lines yet')
  ls.forEach((l, i) => {
    if (!nameOf(l.base)) p.push(`Line ${i + 1}: account ${l.base || 'missing'}`)
    if (!UNITS.includes(l.unit)) p.push(`Line ${i + 1}: unit ${l.unit || 'missing'}`)
    if (!l.dr && !l.cr) p.push(`Line ${i + 1}: no amount`)
  })
  if (sum(d.lines, l => l.dr) !== sum(d.lines, l => l.cr)) p.push('Debet and Kredit differ')
  if (d.date < '2026-10-01') p.push('September is closed')
  return p
}
function juSheet(key) {

  const d = ro ? { no: j.no, date: j.date, ref: j.ref, note: j.note, auto: j.auto, lines: j.lines.map(jLine) } : jnew()
  const tdr = sum(d.lines, l => l.dr), tcr = sum(d.lines, l => l.cr), diff = tdr - tcr, ok = tdr > 0 && !diff
  const jst = ro ? stOf(j) : 'new', rev = ro && revOf(j.no), [w, tone] = ro ? JST[jst] : ['New', 'info']
  const deprCodes = new Set(deprRun().map(l => l[0]))
  const dupDep = !ro && d.lines.some(l => deprCodes.has(l.base) && l.dr) && allJ().find(x => x.auto && stOf(x) === 'posted' && x.date.slice(0, 7) === d.date.slice(0, 7))
  const p = !ro && d.tried ? juProblems(d) : []
  const banner = (rev ? `<div class="banner warn">${ico('undo')}<span>Reversed by ${rev.no} on ${dayS(rev.date)}.</span>${lnk('Open it', `refreshSheet(juSheet('${rev.no}'))`)}</div>` : '')
    + (ro && j.st === 'reversal' && jFind(j.of) ? `<div class="banner info">${ico('undo')}<span>Reverses ${j.of}.</span>${lnk('Open it', `refreshSheet(juSheet('${j.of}'))`)}</div>` : '')
    + (dupDep ? `<div class="banner warn">${ico('alert')}<span>${periodOf(d.date)} depreciation is already posted on ${dupDep.no}.</span></div>` : '')
    + (p.length ? `<div class="banner bad">${ico('alert')}<span>${plural(p.length, 'thing')} to fix: ${p.map(esc).join(' · ')}</span></div>` : '')
  const dis = ro ? 'disabled' : ''
  const head = `<div class="kl-head" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="kl-col">${field('No Jurnal', `<input value="${ro ? d.no : ''}" placeholder="${nextJu()}" disabled>`, { optl: 'auto' })}
      ${field('Tanggal', `<input type="date" value="${d.date}" max="${TODAY}" ${dis} onchange="jnew().date=this.value;refreshSheet(juSheet('new'))">`, { req: 1 })}
      ${field('Periode Acc', `<input value="${periodOf(d.date)}" readonly>`)}</div>
    <div class="kl-col">${field('No Referensi', `<input value="${esc(d.ref)}" placeholder="BKK, bill or memo number" ${dis} oninput="jnew().ref=this.value">`)}
      ${field('Keterangan', `<input value="${esc(d.note)}" placeholder="What this jurnal does" ${dis} oninput="jnew().note=this.value">`)}
      ${field('Otomatis', `<input value="${d.auto ? 'Yes · from Assets' : 'No'}" readonly>`)}</div></div>`
  const tools = ro ? '' : `<div class="kl-bar" style="align-items:center">${lnk('Penyusutan', 'pyJuDepr()', 'calendar')}${lnk('Del All', 'pyJuClear()', 'trash')}</div>`
  const rows = ro ? d.lines : [...d.lines, { base: '', unit: 'HO', note: '', dr: 0, cr: 0, blank: true }]
  const cell = (i, k, v, extra = '') => `<input data-r="${i}" data-k="${k}" value="${v}" ${extra}>`
  const grid = `<datalist id="ju-names">${coaBases().map(c => `<option value="${esc(nameOf(c))}" label="${c}">`).join('')}</datalist><datalist id="ju-units">${UNITS.map(u => `<option value="${u}">`).join('')}</datalist>
    <div class="kl-grid"><table><colgroup><col style="width:48px"><col><col style="width:140px"><col style="width:260px"><col style="width:90px"><col style="width:170px"><col style="width:170px"></colgroup>
    <thead><tr><th></th><th>Deskripsi Account</th><th>Kode Account</th><th>Uraian</th><th>Unit</th><th class="r">Debet</th><th class="r">Kredit</th></tr></thead><tbody>
    ${rows.map((l, i) => ro ? `<tr><td class="mute" style="text-align:center">${i + 1}</td><td>${esc(nameOf(l.base))}</td><td class="mute">${l.base}</td><td>${esc(l.note)}</td><td>${l.unit}</td><td class="r">${l.dr ? dots(l.dr) : ''}</td><td class="r">${l.cr ? dots(l.cr) : ''}</td></tr>`
      : `<tr class="${l.blank ? 'blank' : ''}"><td class="mute" style="text-align:center">${l.blank ? ico('plus') : i + 1}</td>
      <td class="cellin">${cell(i, 'name', esc(nameOf(l.base)), `list="ju-names" placeholder="${l.blank ? 'Type an account name or code' : ''}" onchange="pyJu(${i},'name',this.value)"`)}</td>
      <td class="cellin">${cell(i, 'code', l.base, `inputmode="numeric" maxlength="10" onchange="pyJu(${i},'code',this.value)"`)}</td>
      <td class="cellin">${cell(i, 'note', esc(l.note), `oninput="pyJu(${i},'note',this.value,1)"`)}</td>

      <td class="cellin r">${cell(i, 'dr', l.dr ? dots(l.dr) : '', `inputmode="numeric" placeholder="0" oninput="pyJu(${i},'dr',this.value,1)"`)}</td>
      <td class="cellin r">${cell(i, 'cr', l.cr ? dots(l.cr) : '', `inputmode="numeric" placeholder="0" oninput="pyJu(${i},'cr',this.value,1)"`)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td></td><td>Total · ${plural(d.lines.length, 'line')}</td><td></td><td colspan="2" class="r">Selisih <span data-out="jdiff" class="${diff ? 'bad' : ''}">${dots(diff)}</span></td><td class="r" data-out="jdr">${dots(tdr)}</td><td class="r" data-out="jcr">${dots(tcr)}</td></tr></tfoot></table></div>`
  return {
    size: 'workspace', crumb: ['Journal', ro ? periodOf(d.date) : 'New'], title: ro ? d.no : 'New jurnal', titleText: ro ? d.no : 'New jurnal',
    pill: `${pill(w, tone)}${ro ? pill('READ ONLY', 'ro') : ''}`,
    body: `${banner}<fieldset class="kl" ${dis}>${head}${tools}${grid}</fieldset>${ro ? `<div class="kl-status"><span>Posted by ${esc(j.by)} · ${dayS(j.date)} ${j.at}</span></div>` : ''}`,
    foot: `<div class="foot-left">${lnk('Print jurnal', `soon('Print ${ro ? d.no : 'the jurnal'}')`, 'printer')}</div>${ro ? (jst === 'posted' && !j.sept ? btn('Reverse', `pyJuReverse('${j.no}')`) : '') : btn('Post jurnal', 'pyJuPost()', 'primary', `ju-post ${ok ? '' : 'is-disabled'}`)}`,
  }
}
function openJournal(no) { openSheet(juSheet(no || 'new')) }
function pyJu(i, k, v, soft) {
  const d = jnew()
  if (i >= d.lines.length) { d.lines.push({ base: '', unit: 'HO', note: '', dr: 0, cr: 0 }); soft = 0 }
  const l = d.lines[i]
  if (k === 'code') l.base = String(v).replace(/\D/g, '').slice(0, 10)
  else if (k === 'name') { const t = String(v).trim(), m = t.match(/^\d{10}/); l.base = m ? m[0] : glKeys().find(c => c.length === 10 && nameOf(c).toLowerCase() === t.toLowerCase()) || l.base }
  else if (k === 'unit') l.unit = String(v).trim().toUpperCase() || 'HO'
  else if (k === 'dr' || k === 'cr') {
    l[k] = parseRp(v)
    const o = k === 'dr' ? 'cr' : 'dr'
    if (l[k] && l[o]) { l[o] = 0; const el = sheetEl(`[data-r="${i}"][data-k="${o}"]`); if (el) el.value = '' }
  } else l[k] = v
  if (soft) return juOuts()
  refreshSheet(juSheet('new'))
  refocus(`[data-r="${i}"][data-k="${k === 'code' || k === 'name' ? 'note' : k}"]`)
}
function juOuts() {
  const d = jnew(), tdr = sum(d.lines, l => l.dr), tcr = sum(d.lines, l => l.cr), diff = tdr - tcr
  const set = (k, v) => { const el = sheetEl(`[data-out="${k}"]`); if (el) el.textContent = v }
  set('jdr', dots(tdr)); set('jcr', dots(tcr)); set('jdiff', dots(diff))
  const de = sheetEl('[data-out="jdiff"]'); if (de) de.className = diff ? 'bad' : ''
  const b = document.querySelector('#layers .ju-post'); if (b) b.classList.toggle('is-disabled', !(tdr > 0 && !diff))
}
function pyJuDepr() {
  const d = jnew()
  d.lines = deprRun().map(jLine)
  if (!d.note) d.note = `Penyusutan & amortisasi aktiva, ${BULAN[+d.date.slice(5, 7) - 1]} ${d.date.slice(0, 4)}`
  if (!d.ref) d.ref = 'Assets · Oktober 2026'
  refreshSheet(juSheet('new'))
}
function pyJuClear() { jnew().lines = []; refreshSheet(juSheet('new')) }
function pyJuRecur(i) {
  const t = JREC[i]
  JNEW = { date: TODAY, ref: t.ref, note: t.note, lines: t.lines().map(jLine), tried: false }
  openJournal('new')
}
function pyJuPost() {
  const d = jnew()
  d.tried = true
  if (juProblems(d).length) { refreshSheet(juSheet('new')); return }
  const no = takeJu()
  JOURNALS.unshift({ no, date: d.date, at: nowHM(), ref: d.ref, note: d.note || 'Jurnal umum', st: 'posted', by: FIN, lines: d.lines.filter(l => l.dr || l.cr).map(l => [l.base, locOf(l.unit), l.note, l.dr, l.cr]) })
  W.PAL_DOCS.push({ doc: 1, t: no, g: 'Journal', go: () => { go('journal'); setTimeout(() => openJournal(no), 30) } })
  JNEW = null
  render(); refreshSheet(juSheet(no))
  toast(`${no} posted`, money(sum(d.lines, l => l.dr)))
}
function pyJuReverse(no) {
  const j = jFind(no)
  if (!j || revOf(no)) return
  const n = takeJu()
  JOURNALS.unshift({ no: n, date: TODAY, at: nowHM(), ref: j.no, note: `Reversal ${j.no} · ${j.note}`, st: 'reversal', of: j.no, by: FIN, lines: j.lines.map(([b, l, u, dr, cr]) => [b, l, u, cr, dr]) })
  W.PAL_DOCS.push({ doc: 1, t: n, g: 'Journal', go: () => { go('journal'); setTimeout(() => openJournal(n), 30) } })
  render(); refreshSheet(juSheet(n))
  toast(`${n} posted`, `Reverses ${j.no}`)
}

/* tax for Coretax: PPN Keluaran from the closes, Masukan from October's bills and tranches, PPh 23 from the tranches */
function taxSum() {
  let kel = 0, gross = 0
  octDays().forEach(d => STORES.forEach(s => { const c = closeOf(d, s.code); kel += c.tax; gross += c.gross }))
  const bills = BILLS.filter(b => b.date >= '2026-10-01' && b.date <= TODAY).map(b => { const ppn = Math.round(b.total * 11 / 111); return { no: b.no, sup: b.sup, dpp: b.total - ppn, ppn } })
  const tr = PRJ.flatMap(p => p.tr.map(trx).filter(t => t.date >= '2026-10-01').map(t => ({ ...t, p })))
  const mas = sum(bills, b => b.ppn) + sum(tr, t => t.ppn)
  return { kel, dppK: gross - kel, bills, tr, mas, net: kel - mas, pph: sum(tr, t => t.pph) }
}
window.FIN_TAX = taxSum
function stockRows() {
  const adj = -sum(Object.values(STOCK_DIFF), x => x)
  const inv = ((window.FIN_BS && window.FIN_BS.inv()) || 9286400000) + (ME.stock ? adj : 0)
  const places = ['HO', ...STORES.map(s => s.code)]
  let left = inv
  return places.map((p, i) => {
    const base = i === places.length - 1 ? left : round(inv * STOCK_W[i] / 100, 1000)
    left -= base
    const sys = base + (STOCK_DIFF[p] || 0)
    return { p, sys, led: ME.stock ? sys : base }
  })
}

  return { lines, at, res, ...res(null), locs: [...new Set(lines.flatMap(l => Object.keys(l.by)))].sort() }

const ART_W = [9, 7, 12, 8, 5, 4, 6, 4, 5, 6, 9, 10]

  const k = -pl.hpp / sum(rows, r => r.raw)
