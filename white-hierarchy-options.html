const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[n]}"/></svg>`;document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const shades={Navy:'#29384f',White:'#f5f4ee',Cream:'#e7d7b9',Black:'#333539','Dusty Pink':'#d09e9e',Khaki:'#c6b28f',Mocca:'#93745e'};

const samples=[['Blus Rayon','Wanita',['Dusty Pink','Cream'],['S','M','L'],159000,159000],['Kemeja Oxford','Pria',['Navy','White'],['M','L','XL'],179000,199000],['Rok Plisket','Wanita',['Black','Mocca'],['All size'],129000,129000],['Celana Chino','Pria',['Khaki','Navy'],['30','32','34'],229000,249000],['Dress Anak Bunga','Anak Perempuan',['Cream','Dusty Pink'],['2','4','6'],99000,129000],['Kaos Basic','Anak Laki-laki',['White','Navy','Black'],['S','M','L'],79000,79000],['Kemeja Linen','Wanita',['Cream','White'],['S','M','L','XL'],189000,189000],['Polo Pique','Pria',['Navy','Black'],['M','L','XL'],149000,169000],['Kulot Linen','Wanita',['Black','Khaki'],['S','M','L'],169000,169000],['Cardigan Rajut','Wanita',['Cream','Mocca'],['All size'],199000,199000],['Celana Anak','Anak Laki-laki',['Navy','Khaki'],['2','4','6'],99000,119000],['Blus Katun','Anak Perempuan',['White','Dusty Pink'],['S','M','L'],89000,89000]];
const articles=Array.from({length:48},(_,i)=>{const a=samples[i%12];return{id:i+1,name:a[0]+(i>=12?['',' Regular',' Relaxed',' Essential'][Math.floor(i/12)]:''),code:String(500+i).padStart(8,'0'),division:a[1],colours:a[2],sizes:a[3],low:a[4],high:a[5],active:![8,21,37].includes(i)}});
const columns=[{id:'article',name:'Article',width:260},{id:'division',name:'Division',width:176},{id:'colours',name:'Colors',width:92},{id:'sizes',name:'Sizes',width:86},{id:'skus',name:'SKUs',width:66},{id:'price',name:'Price range',width:174},{id:'status',name:'Status',width:96}];
let variant=new URLSearchParams(location.search).get('v')||'stone',limit=48,q='',division='',colour='',order='newest',selected=null,editing=false,toastTimer;const hiddenCols=new Set();
const notes={now:'Simulasi gaya sekarang: satu putih, header putih, navigasi dan aksi sekunder minim pembeda.',white:'Putih menyeluruh dengan header tabel halus, pilihan aktif biru, dan tombol sekunder yang jelas.',stone:'Sidebar stone tipis memisahkan navigasi dari area kerja putih. Tabel dan kontrol tetap tenang.',panel:'Kanvas abu muda dengan satu panel putih untuk seluruh area tabel, tanpa kartu tambahan.'};
function changeVariant(v){if(!notes[v])v='stone';variant=v;document.documentElement.dataset.variant=v;document.querySelectorAll('[data-variant]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.variant===v))});$('design-description').innerHTML=(v==='stone'?'<span class="recommendation">Recommended ·</span>':'')+notes[v];const url=new URL(location.href);url.searchParams.set('v',v);history.replaceState(null,'',url);}
function thumbnail(a){const kind=/rok/i.test(a.name)?'skirt':/celana|kulot/i.test(a.name)?'pants':/dress/i.test(a.name)?'dress':/kaos|polo/i.test(a.name)?'tee':'shirt';return`<span class="thumb" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="${shapes[kind]}" fill="${shades[a.colours[0]]}" stroke="#24283045" stroke-width="1.3" stroke-linejoin="round"/></svg></span>`}
const price=a=>a.low===a.high?rp(a.low):rp(a.low)+'–'+fmt(a.high),sizeSpan=a=>a.sizes.length===1?a.sizes[0]:a.sizes[0]+'–'+a.sizes.at(-1),swatches=a=>`<span class="swatches" aria-label="${esc(a.colours.join(', '))}">${a.colours.map(c=>`<span class="swatch" title="${c}" style="--swatch:${shades[c]}"></span>`).join('')}</span>`;
function rows(){let a=articles.slice(0,limit).filter(a=>(!q||(a.name+' '+a.code).toLowerCase().includes(q.toLowerCase()))&&(!division||a.division===division)&&(!colour||a.colours.includes(colour)));return a.sort((a,b)=>order==='price'?a.low-b.low:order==='oldest'?a.id-b.id:b.id-a.id)}
function cell(a,id){if(id==='article')return`<div class="article-cell">${thumbnail(a)}<div class="article-copy"><strong>${esc(a.name)}</strong><span class="code num">${a.code}</span></div></div>`;if(id==='division')return`<span class="division">${a.division}</span>`;if(id==='colours')return swatches(a);if(id==='sizes')return sizeSpan(a);if(id==='skus')return fmt(a.colours.length*a.sizes.length);if(id==='price')return price(a);if(id==='status')return`<span class="status ${a.active?'':'cancelled'}">${a.active?'Active':'Cancelled'}</span>`}
function renderTable(){const cols=columns.filter(c=>!hiddenCols.has(c.id)),data=rows();$('table-cols').innerHTML=cols.map(c=>`<col style="width:${c.width}px">`).join('');$('table-head').innerHTML='<tr>'+cols.map(c=>`<th class="${['skus','price'].includes(c.id)?'right':''}">${c.name}</th>`).join('')+'</tr>';$('table-body').innerHTML=data.length?data.map(a=>`<tr tabindex="0" data-article="${a.id}" aria-selected="${selected===a.id}">${cols.map(c=>`<td class="${['skus','price'].includes(c.id)?'right num':''}">${cell(a,c.id)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty"><strong>No matching articles</strong>Try a broader search or clear the filters.</td></tr>`;$('articles-count').textContent=limit;$('results-count').textContent=fmt(data.length)+' of '+fmt(limit)+' articles';$('selection-note').textContent=selected?'Selected · '+articles.find(a=>a.id===selected).name:'Select an article to view details';document.querySelector('.catalogue').style.minWidth=Math.max(460,cols.reduce((n,c)=>n+c.width,0))+'px'}
function showColumns(){$('columns-menu').innerHTML=columns.filter(c=>c.id!=='article').map(c=>`<label><input type="checkbox" data-column="${c.id}" ${hiddenCols.has(c.id)?'':'checked'}>${c.name}</label>`).join('');$('columns-menu').hidden=!$('columns-menu').hidden;$('columns-button').setAttribute('aria-expanded',String(!$('columns-menu').hidden))}
const detailParams=new URLSearchParams(location.search);
const detailLayout=['now','header','strip','below','properties','properties-top'].includes(detailParams.get('detail'))?detailParams.get('detail'):'strip';
if(detailParams.get('embed')==='1')document.documentElement.dataset.embedded='true';
function articleFacts(a,kind='compact-facts',withVariants=true){return `<dl class="${kind}"><div><dt>Division</dt><dd>${a.division}</dd></div><div><dt>Price range</dt><dd class="num">${price(a)}</dd></div>${withVariants?`<div><dt>Variants</dt><dd class="num">${a.colours.length*a.sizes.length} SKUs · ${sizeSpan(a)}</dd></div>`:''}</dl>`}
function articleProperties(a,withVariants=true){const facts=[['Division',a.division,'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z'],['Price range',price(a),'M20 13l-7 7L3 10V3h7zM7 7h.01'],['Variants',`${a.colours.length*a.sizes.length} SKUs · ${sizeSpan(a)}`,'m12 3 9 5-9 5-9-5 9-5m-9 9 9 5 9-5m-18 5 9 5 9-5']];return `<dl class="property-rail" aria-label="Article properties">${facts.filter(([label])=>withVariants||label!=='Variants').map(([label,value,path])=>`<div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg><dt>${label}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl>`}
function articleVariants(a,heading=false,count=false){return `<section>${heading?`<div class="variant-heading"><h3>Variants</h3>${count?`<span class="variant-count num">${a.colours.length*a.sizes.length} SKUs${count==='sizes'?' · '+sizeSpan(a):''}</span>`:''}</div>`:''}<div class="variants-frame"><table class="variants" aria-label="Article variants"><thead><tr><th>Color</th><th>Sizes</th><th class="right">SKUs</th><th class="right">Base price</th></tr></thead><tbody>${a.colours.map((c,i)=>`<tr><td><span class="swatches"><span class="swatch" style="--swatch:${shades[c]}"></span>${c}</span></td><td>${a.sizes.join(', ')}</td><td class="right num">${a.sizes.length}</td><td class="right num">${rp(i&&a.high!==a.low?a.high:a.low)}</td></tr>`).join('')}</tbody></table></div></section>`}
function openArticle(id,edit=false){
 selected=id;editing=edit;const a=articles.find(a=>a.id===id);if(!a)return;renderTable();
 const status=`<span class="status ${a.active?'':'cancelled'}">${a.active?'Active':'Cancelled'}</span>`;
 const title=`<span class="code num">${a.code}</span><h2 id="detail-title" tabindex="-1">${esc(a.name)}</h2>`;
 const header=detailLayout==='now'?`<header class="sheet-head"><div>${title}</div>${status}</header>`:`<header class="sheet-head"><span class="code num">${a.code}</span><div class="detail-title-line"><h2 id="detail-title" tabindex="-1">${esc(a.name)}</h2>${status}</div>${!edit&&detailLayout==='header'?articleFacts(a,'grouped-facts'):''}</header>`;
 let body='';
 if(edit)body=`<div class="form-fields"><label class="field wide">Name<input id="edit-name" value="${esc(a.name)}" required></label><label class="field">Division<select id="edit-division">${['Wanita','Pria','Anak Perempuan','Anak Laki-laki'].map(d=>`<option ${a.division===d?'selected':''}>${d}</option>`).join('')}</select></label><label class="field">Base price · Rp<input id="edit-price" type="number" value="${a.low}" min="1" required></label></div>`+articleVariants(a,true);
 else if(detailLayout==='now')body=articleFacts(a,'facts')+articleVariants(a,true);
 else if(detailLayout==='header')body=articleVariants(a);
 else if(detailLayout==='strip')body=articleFacts(a)+articleVariants(a);
 else if(detailLayout==='properties')body=`<div class="detail-workspace">${articleVariants(a)}${articleProperties(a)}</div>`;
 else if(detailLayout==='properties-top')body=articleProperties(a,false)+articleVariants(a,true,'sizes');
 else body=articleVariants(a,true,true)+articleFacts(a,'compact-facts secondary-facts',false);
 $('article-sheet').dataset.detailLayout=detailLayout;
 $('article-sheet').innerHTML=`${edit?'<form id="edit-form" style="display:contents">':''}${header}<div class="sheet-body">${body}</div><footer class="sheet-foot"><button type="button" class="button secondary" data-close>${edit?'Cancel':'Close'}</button>${edit?'<button type="submit" class="button primary">Save changes</button>':'<button type="button" class="button primary" data-edit>Edit article</button>'}</footer>${edit?'</form>':''}`;
 if(!$('article-sheet').open)$('article-sheet').showModal();$('detail-title').focus({preventScroll:true});
 if(edit)$('edit-form').onsubmit=e=>{e.preventDefault();const name=$('edit-name').value.trim();if(!name){$('edit-name').setCustomValidity('Enter an article name.');$('edit-name').reportValidity();return}a.name=name;a.division=$('edit-division').value;a.low=Number($('edit-price').value);a.high=a.low;openArticle(id);clearTimeout(toastTimer);$('toast').textContent='Article updated in this preview';$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500)};
}
document.addEventListener('click',e=>{const option=e.target.closest('button[data-variant]');if(option){changeVariant(option.dataset.variant);return}if(e.target.closest('#columns-button')){showColumns();return}if(!e.target.closest('.popover-wrap')){$('columns-menu').hidden=true;$('columns-button').setAttribute('aria-expanded','false')}const row=e.target.closest('[data-article]');if(row){openArticle(Number(row.dataset.article));return}if(e.target.closest('[data-close]'))$('article-sheet').close();if(e.target.closest('[data-edit]'))openArticle(selected,true);if(e.target.closest('#nav-toggle'))document.body.classList.toggle('nav-open')});
$('search').oninput=e=>{q=e.target.value;renderTable()};$('division-filter').onchange=e=>{division=e.target.value;renderTable()};$('colour-filter').onchange=e=>{colour=e.target.value;renderTable()};$('order').onchange=e=>{order=e.target.value;renderTable()};$('row-count').onchange=e=>{limit=Number(e.target.value);selected=null;renderTable()};$('columns-menu').onchange=e=>{if(e.target.dataset.column){e.target.checked?hiddenCols.delete(e.target.dataset.column):hiddenCols.add(e.target.dataset.column);renderTable()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('nav-open');if(e.target.closest('[data-article]')&&['Enter',' '].includes(e.key)){e.preventDefault();openArticle(Number(e.target.closest('[data-article]').dataset.article))}if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)||$('article-sheet').open)return;if(['1','2','3','4'].includes(e.key))changeVariant(['now','white','stone','panel'][Number(e.key)-1])});
changeVariant(variant);renderTable();
const initialArticle=Number(detailParams.get('article'));if(articles.some(a=>a.id===initialArticle))openArticle(initialArticle);
</script>
