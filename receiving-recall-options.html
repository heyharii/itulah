<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recall a count — options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ──────────────────────────────────────────────────────────────────────────
   Ops › Receiving: the counter typed the wrong number. How does she take it back?

   Today (measured on the running hub, 8 Oct): a row that has been counted shows
   "900 pcs · Rina Kusuma · 02 Oct, 09:13" and nothing else — the row does not open,
   there is no button. The only way out is to tell the buyer, who opens the PO →
   Review Count → Count again. Once the buyer has accepted, the pieces are in stock
   and nothing can be recalled.

   Five places to put the way out, all inside the Receiving screen as it is
   (rows on desk, Lead Figure cards on phone, a sheet for one record):
     A  a Recall button in the Count cell / card foot
     B  the row opens the count as a sheet — Recall lives in its footer
     C  the same sheet, with Correct count beside Recall (fix the number, keep the place)
     D  an Undo toast the moment she submits — the sheet reopens filled in
     E  she cannot recall; she asks the buyer to send it back (no new rights)

   Hub tokens and measures: Inter 15, th 40/14, rows 75, tint button 32/15/600/r8,
   cards 368 wide r10 with a 74px foot, 14px floor, actions at the bottom on phone.
   Motion (Emil): ease-out custom curves, dialogs scale from .96 and stay centred,
   sheets use the drawer curve, press = scale(.97), nothing animates on keyboard
   actions, exits are faster than entrances, reduced-motion keeps the fades.
   ────────────────────────────────────────────────────────────────────────── */
:root{
  --ink:#20242c; --text:#394150; --body:#566070; --mute:#666f7d; --faint:#b9c0c9;
  --canvas:#fff; --soft:#f8f8f9; --soft-2:#f0f0f2; --soft-3:#f6f6f7;
  --hairline:#e6e6e9; --hairline-2:#dadade; --hairline-strong:#c6c6cc;
  --rail:#242526; --rail-3:#393b3d; --rail-text:#c3c4c7;
  --accent:#2563eb; --accent-ink:#2c57bf; --accent-bg:#eef3fe; --accent-bg-2:#e4ecfd; --cta-hover:#1d4ed8;
  --ok:#36b827; --ok-bg:#e8f6ee; --ok-fg:#15803d;
  --warn-bg:#fdf1dd; --warn-fg:#b45309;
  --bad:#d05151; --bad-bg:#fdecec; --bad-fg:#be123c;
  --r-card:.75rem; --r-inner:.4375rem; --r-dialog:1rem;
  --out:cubic-bezier(.23,1,.32,1); --drawer:cubic-bezier(.32,.72,0,1);
  --shadow-pop:0 4px 8px rgb(24 39 60/4%),0 12px 32px rgb(24 39 60/8%);
  --shadow-float:0 2px 6px rgb(24 39 60/5%),0 24px 64px rgb(24 39 60/16%);
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:15px;color:var(--text);background:var(--soft-3);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:var(--ink)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* ── prototype chrome (not the hub) ─────────────────────────────────────── */
.top{position:sticky;top:0;z-index:50;background:var(--canvas);border-bottom:1px solid var(--hairline)}
.top .row1{display:flex;align-items:center;gap:20px;padding:0 24px;min-height:56px;flex-wrap:wrap}
.top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.tabs{display:flex;gap:2px;flex:1;min-width:0;flex-wrap:wrap}
@media (max-width:1180px){.tabs{flex-basis:100%;margin:0 -10px}.top .row1{padding-top:10px;gap:0}}
.tabs button{height:56px;padding:0 14px;font-weight:500;color:var(--body);position:relative;white-space:nowrap;transition:color 150ms var(--out)}
.tabs button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--soft-2);color:var(--body);font-size:14px;margin-right:8px;font-weight:600}
.tabs button.on{color:var(--ink)}
.tabs button.on b{background:var(--ink);color:#fff}
.tabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
@media (hover:hover){.tabs button:hover{color:var(--ink)}}
.bar2{display:flex;align-items:center;gap:16px;padding:10px 24px;border-top:1px solid var(--hairline);background:var(--soft);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft-2);border-radius:9px;padding:3px}
.seg button{height:32px;padding:0 14px;border-radius:7px;font-weight:500;color:var(--body);transition:background 150ms var(--out),color 150ms var(--out)}
.seg button.on{background:var(--canvas);color:var(--ink);box-shadow:0 0 0 1px var(--hairline),0 1px 2px rgb(0 0 0/6%)}
.sw{display:inline-flex;align-items:center;gap:10px;height:32px;font-weight:500;color:var(--body)}
.sw .t{width:36px;height:22px;border-radius:99px;background:var(--hairline-strong);position:relative;transition:background 180ms var(--out)}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/25%);transition:transform 180ms var(--out)}
.sw.on .t{background:var(--accent)}
.sw.on .t::after{transform:translateX(14px)}
.link{height:32px;padding:0 10px;border-radius:7px;color:var(--body);font-weight:500}
@media (hover:hover){.link:hover{background:var(--soft-2);color:var(--ink)}}
.grow{flex:1}
.wrap{max-width:1360px;margin:0 auto;padding:24px}
.lede{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.says{margin:0 0 18px;color:var(--body);max-width:60rem}
.stagewrap{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.pm div{background:var(--canvas);box-shadow:0 0 0 1px var(--hairline);border-radius:var(--r-card);padding:12px 16px}
.pm b{display:block;font-weight:600;color:var(--ink);margin-bottom:2px}
@media (max-width:760px){.pm{grid-template-columns:1fr}}

/* ── the hub frame (desk) ───────────────────────────────────────────────── */
.frame{position:relative;height:660px;background:var(--canvas);border-radius:14px;box-shadow:0 0 0 1px var(--hairline-2),var(--shadow-pop);overflow:hidden;display:flex}
.rail{width:56px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;flex-shrink:0}
.mark{width:30px;height:30px;border-radius:8px;background:#0b0b0b;box-shadow:inset 0 0 0 1px rgb(255 255 255/.12);color:#fff;display:grid;place-items:center;font-weight:600;position:relative;margin-bottom:10px}
.mark::after{content:"";position:absolute;right:5px;bottom:5px;width:5px;height:5px;border-radius:50%;background:#3b82f6}
.ri{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--rail-text)}
.ri.on{background:var(--rail-3);color:#fff}
.nav{width:178px;border-right:1px solid var(--hairline);background:var(--canvas);padding:14px 10px;flex-shrink:0}
.nav h4{margin:2px 10px 14px;font-size:15px;font-weight:600;color:var(--ink)}
.nav a{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border-radius:7px;color:var(--text);font-size:14px}
.nav a.on{background:#eef3fe;color:var(--accent-ink);font-weight:500}
.nav a em{font-style:normal;color:#b45309;font-weight:500}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.ph{padding:20px 24px 0}
.ph h2{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--ink)}
.tb{display:flex;gap:2px;border-bottom:1px solid var(--hairline)}
.tb span{height:40px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:500;color:var(--body);position:relative}
.tb span.on{color:var(--ink)}
.tb span.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.scroll{flex:1;overflow-y:auto;padding:16px 24px 24px}
table{width:100%;border-collapse:collapse}
.tcard{background:var(--canvas);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--hairline);overflow:clip}
th{height:40px;text-align:left;font-weight:500;color:var(--body);padding:0 12px;border-bottom:1px solid var(--hairline);background:var(--soft);font-size:14px;white-space:nowrap}
th.r,td.r{text-align:right}
td{height:75px;padding:0 12px;border-bottom:1px solid var(--hairline);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.sup{display:block;color:var(--ink);font-weight:500;max-width:21rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po{display:block;color:var(--mute)}
td.cnt{width:420px}
.cell{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.fig{display:flex;flex-direction:column;align-items:flex-end;line-height:20px;min-width:0}
.fig b{font-weight:500;color:var(--ink)}
.fig span{color:var(--mute);max-width:14rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
tr.open{cursor:pointer}
@media (hover:hover){tr.open:hover td{background:var(--soft)}}
.tint{height:32px;padding:0 14px;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;transition:transform 160ms var(--out),background 150ms var(--out)}
@media (hover:hover){.tint:hover{background:var(--accent-bg-2)}}
.tint:active,.btn:active,.fabbtn:active{transform:scale(.97)}
.note{color:var(--mute);font-size:14px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:8px;font-weight:500;white-space:nowrap}
.pill.line{border:1px solid rgb(37 99 235/.35);color:var(--accent-ink);background:var(--canvas)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.flip{animation:flip 240ms var(--out)}
@keyframes flip{from{opacity:0;filter:blur(2px);transform:translateY(3px)}}

.btn{height:40px;padding:0 16px;border-radius:var(--r-inner);box-shadow:inset 0 0 0 1px var(--hairline-2);background:var(--canvas);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;white-space:nowrap;transition:transform 160ms var(--out),background 150ms var(--out)}
@media (hover:hover){.btn:hover{background:var(--soft)}}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
@media (hover:hover){.btn.pri:hover{background:var(--cta-hover)}}
.btn.ghost{box-shadow:none;background:none;color:var(--body)}
@media (hover:hover){.btn.ghost:hover{background:var(--soft-2);color:var(--ink)}}
.btn.warnb{box-shadow:none;background:none;color:var(--bad-fg)}
@media (hover:hover){.btn.warnb:hover{background:var(--bad-bg)}}
.btn[disabled]{opacity:.45;cursor:default;transform:none}

/* ── layers: sheet, dialog, toast (inside the frame) ───────────────────── */
.veil{position:absolute;inset:0;background:rgb(246 246 247/.72);z-index:20;opacity:0;pointer-events:none;transition:opacity 160ms var(--out)}
.veil.on{opacity:1;pointer-events:auto;transition-duration:220ms}
.sheet{position:absolute;top:0;right:0;bottom:0;width:31rem;max-width:100%;background:var(--canvas);border-left:1px solid var(--hairline);box-shadow:var(--shadow-float);z-index:30;display:flex;flex-direction:column;transform:translateX(102%);transition:transform 200ms var(--drawer),visibility 0s linear 200ms;visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform 280ms var(--drawer)}
.sh{display:flex;gap:12px;align-items:flex-start;padding:18px 12px 14px 24px;border-bottom:1px solid var(--hairline)}
.sh .t{flex:1;min-width:0}
.sh .id{display:block;color:var(--mute);margin-bottom:2px}
.sh h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.015em;color:var(--ink);overflow-wrap:anywhere}
.sh .cap{margin-top:4px;color:var(--mute);font-size:14px}
.sh .pill{margin-top:8px}
.x{width:44px;height:44px;border-radius:var(--r-inner);display:grid;place-items:center;color:var(--mute);flex-shrink:0;margin:-4px 0 0}
@media (hover:hover){.x:hover{background:var(--soft-2);color:var(--ink)}}
.sb{flex:1;min-height:0;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.sf{border-top:1px solid var(--hairline);padding:12px 16px 12px 20px;display:flex;align-items:center;gap:8px;min-height:68px}
.sf .grow{flex:1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.facts dt{color:var(--mute);font-size:14px;margin-bottom:2px}
.facts dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.sub{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--ink)}
.mini{width:100%;border-collapse:collapse;border-radius:var(--r-card);box-shadow:0 0 0 1px var(--hairline);overflow:clip}
.mini th{height:40px}
.mini td{height:52px;padding:0 12px}
.mini td small{display:block;color:var(--mute);font-size:14px}
.mini tfoot td{background:var(--soft);font-weight:600;color:var(--ink);border-top:1px solid var(--hairline);border-bottom:0}
.in{width:84px;height:40px;border-radius:var(--r-inner);border:1px solid var(--hairline-2);padding:0 10px;text-align:right;background:var(--canvas);font-variant-numeric:tabular-nums;transition:box-shadow 150ms var(--out),border-color 150ms var(--out)}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgb(37 99 235/.16)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--hairline-2);color:var(--body);font-weight:500;transition:transform 160ms var(--out),background 150ms var(--out),color 150ms var(--out)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--accent-bg);color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-card);background:var(--bad-bg);color:var(--bad-fg)}
.banner svg{margin-top:2px}
.dlgwrap{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:16px;pointer-events:none}
.dlg{width:min(26rem,100%);background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-dialog);box-shadow:var(--shadow-float);padding:22px 22px 16px;opacity:0;transform:scale(.96);visibility:hidden;transition:opacity 140ms var(--out),transform 140ms var(--out),visibility 0s linear 140ms;transform-origin:center}
.dlg.on{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity 180ms var(--out),transform 180ms var(--out)}
.dlg h3{margin:0 0 6px;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:-.015em}
.dlg p{margin:0 0 14px;color:var(--body)}
.dlg .act{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:absolute;left:50%;bottom:20px;z-index:45;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-float);min-height:48px;max-width:calc(100% - 24px);transition:opacity 160ms var(--out),transform 160ms var(--out)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;transition:opacity 280ms var(--out),transform 320ms var(--out)}
.toast span.m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .u{height:36px;padding:0 12px;border-radius:8px;color:#9db8ff;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform 160ms var(--out),background 150ms var(--out)}
.toast .u:active{transform:scale(.97)}
@media (hover:hover){.toast .u:hover{background:rgb(255 255 255/.08)}}
.ring{width:20px;height:20px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.4}
.ring .bg{stroke:rgb(255 255 255/.2)}
.ring .fg{stroke:#9db8ff;stroke-dasharray:50.3;stroke-dashoffset:0;stroke-linecap:round}
.toast.on .ring .fg{animation:run var(--win,15s) linear forwards}
@keyframes run{to{stroke-dashoffset:50.3}}

/* ── buying panel ───────────────────────────────────────────────────────── */
.buy{background:var(--canvas);box-shadow:0 0 0 1px var(--hairline);border-radius:var(--r-card);padding:16px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.buy .l{min-width:12rem}
.buy .l small{display:block;color:var(--mute);font-size:14px;margin-bottom:2px}
.buy .m{flex:1;min-width:16rem}
.buy .m b{font-weight:500;color:var(--ink)}
.buy .m span{display:block;color:var(--mute);font-size:14px}
.buy .btn{height:36px}
.buy .ping{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-fg);padding:10px 12px;border-radius:10px}

/* ── phone ──────────────────────────────────────────────────────────────── */
.phonewrap{display:flex;justify-content:center}
.phone{position:relative;width:414px;height:860px;background:var(--soft-3);border-radius:38px;box-shadow:0 0 0 10px #17181a,0 0 0 11px #3a3c3f,var(--shadow-float);overflow:hidden;display:flex;flex-direction:column}
.pbar{height:60px;padding:0 20px 0 24px;display:flex;align-items:center;justify-content:space-between;background:var(--canvas);border-bottom:1px solid var(--hairline);flex-shrink:0}
.pbar b{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:600}
.cards{flex:1;overflow-y:auto;padding:14px 23px 170px;display:flex;flex-direction:column;gap:12px}
.lc{background:var(--canvas);border-radius:10px;box-shadow:0 0 0 1px var(--hairline),0 1px 2px rgb(24 39 60/4%);overflow:clip}
.lc.tap{cursor:pointer}
.lc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 14px}
.lc .hd .n{min-width:0}
.lc .hd .sup{font-size:16px;font-weight:600;max-width:100%}
.lc .hd .po{margin-top:4px}
.lc .big{text-align:right;flex-shrink:0}
.lc .big b{display:block;font-size:24px;font-weight:600;line-height:30px;color:var(--ink)}
.lc .big span{color:var(--mute);font-size:14px}
.lc .ft{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--hairline);min-height:74px}
.lc .ft .fg{min-width:0;color:var(--mute);line-height:22px}
.lc .ft .fg b{color:var(--ink);font-weight:600}
.lc .ft .fg div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .ft .tint{position:relative;flex-shrink:0}
.lc .ft .tint::after{content:"";position:absolute;inset:-6px -4px}
.dock{position:absolute;left:0;right:0;bottom:64px;padding:0 16px 10px;z-index:10;pointer-events:none}
.dock .pillbar{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--canvas);border-radius:99px;padding:8px;box-shadow:0 0 0 1px var(--hairline),var(--shadow-pop)}
.dock .srch{flex:1;height:44px;border-radius:99px;background:var(--soft-2);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--mute)}
.dock .rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--body)}
.pnav{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--canvas);border-top:1px solid var(--hairline);display:flex;z-index:11}
.pnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);font-size:14px}
.pnav a.on{color:var(--accent);background:var(--accent-bg)}
.phone .veil{z-index:20}
.phone .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:88%;border-left:0;border-radius:18px 18px 0 0;transform:translateY(102%)}
.phone .sheet.on{transform:none}
.phone .sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--hairline-2);margin:8px auto 0}
.phone .sf{padding-bottom:16px}
.phone .toast{bottom:150px;left:16px;right:16px;transform:translateY(16px);max-width:none}
.phone .toast.on{transform:none}
.phone .toast span.m{flex:1}

/* ── decision tab ───────────────────────────────────────────────────────── */
.dec{display:grid;gap:20px}
.dec .card{background:var(--canvas);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--hairline);padding:20px 24px}
.dec h3{margin:0 0 12px;font-size:17px;font-weight:600;color:var(--ink)}
.dec table{border-radius:0}
.dec th,.dec td{height:52px;padding:0 12px;border-bottom:1px solid var(--hairline);font-size:15px}
.dec th{background:none;color:var(--ink);font-weight:600}
.dec td.c,.dec th.c{text-align:center}
.dec tbody tr:last-child td{border-bottom:0}
.yes{color:var(--ok-fg);font-weight:600}.no{color:var(--faint)}.mid{color:var(--warn-fg);font-weight:500}
.rec{display:flex;gap:14px;align-items:flex-start;background:var(--accent-bg);border-radius:var(--r-card);padding:16px 20px;color:var(--ink)}
.rec b{font-weight:600}
.rules{margin:0;padding-left:20px;display:grid;gap:8px}
.rules li::marker{color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  .sheet,.sheet.on,.toast,.toast.on,.dlg,.dlg.on{transition:opacity 160ms linear}
  .sheet{transform:none}.phone .sheet{transform:none}
  .flip{animation:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <h1>Recall a count</h1>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="bar2" id="bar2"></div>
</header>
<main class="wrap" id="root"></main>
<script>
/* ── icons ─────────────────────────────────────────────────────────────── */
const P={
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  search:'<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>',
  sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  truck:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  cols:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>',
  more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  store:'<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-5-6.7"/>',
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${P[n]}</svg>`;

/* ── data (the running hub's Receiving list, 8 Oct) ─────────────────────── */
const LONG={sup:'Indorama Sejahtera Tekstil Nusantara Raya, PT',who:'Raden Ayu Kusumawardhani Prabaswari'};
const seed=()=>[
 {po:'PO-041026-010',sup:'Garmen AA, UD',lines:[['Kemeja Blus','Wanita · Blus']],n:1,c:null},
 {po:'PO-041026-011',sup:'Indorama, PT',lines:[['Kaos Polos Crew','Pria · Kaos']],n:1,c:null},
 {po:'PO-051026-002',sup:'Indorama, PT',lines:[['Celana Chino Slim','Pria · Celana']],n:1,c:null},
 {po:'PO-051026-003',sup:'Garmen AA, UD',lines:[['Dress Midi Linen','Wanita · Dress']],n:1,c:null},
 {po:'PO-021026-001',sup:'Indorama, PT',lines:[['Kaos Polos Crew','Pria · Kaos'],['Kaos Polos V','Pria · Kaos']],n:2,c:{q:[600,300],bad:0,at:'02 Oct, 09:13'}},
 {po:'PO-041026-007',sup:'Indorama, PT',lines:[['Kemeja Oxford','Pria · Kemeja']],n:1,c:{q:[20],bad:0,at:'04 Oct, 17:04'}},
 {po:'PO-041026-009',sup:'Indorama, PT',lines:[['Jaket Parka','Unisex · Jaket']],n:1,c:{q:[12],bad:0,at:'04 Oct, 09:37'}},
 {po:'PO-041026-012',sup:'Indorama, PT',lines:[['Rok Plisket','Wanita · Rok']],n:1,c:{q:[700],bad:0,at:'04 Oct, 16:59'}},
 {po:'PO-051026-001',sup:'Indorama, PT',lines:[['Topi Baseball','Aksesori · Topi']],n:1,c:{q:[6],bad:0,at:'05 Oct, 10:57'}},
];
const OPTS={
 A:{name:'Recall in the Count cell',
    says:'The Count cell already holds the next step for an uncounted order — “Count receive”. A counted order gets its own: Recall, beside the figure. One tap, one confirm.',
    good:'Shortest path; the cell always shows what she can do next; same button on card and row.',
    cost:'She recalls from the total alone — she cannot see which line she mistyped without opening it.'},
 B:{name:'The row opens the count',
    says:'The dead row now opens. A sheet shows what was counted, by whom and who reviews it; Recall lives in the footer, two steps (Recall → confirm in place).',
    good:'She checks the lines before pulling the count back; fixes the dead-end row.',
    cost:'Two taps before anything happens; the number is not fixed, only withdrawn.'},
 C:{name:'The count sheet, with Correct',
    says:'The same sheet, with Correct count beside Recall. Most mistakes are one wrong number — fix it in place, the buyer sees the corrected count and its history.',
    good:'No retyping of lines that were right; the buyer’s “Review Count” never disappears and returns.',
    cost:'Two verbs to learn; the correction has to be shown to the buyer (was 20 → 18).'},
 D:{name:'Undo right after Submit',
    says:'Most slips are caught seconds after Submit. A toast keeps Undo for 15 seconds; Undo reopens the count sheet filled in. Try it: Count receive on an open order, type, Submit.',
    good:'Zero new screens; catches the typo while the delivery is still in front of her.',
    cost:'Window closes — a slip found later has no way out. Pair it with A or B.'},
 E:{name:'Ask the buyer to send it back',
    says:'No new rights: she asks, the buyer sends it back with the Count again they already have. The row says who was asked.',
    good:'Nothing to build on the count itself; the buyer stays in control of her own review.',
    cost:'Waits on another person; the buyer can be offline while the lorry is still at the dock.'},
};
const REASONS=['Typo','Wrong delivery','Wrong article'];

/* ── state ─────────────────────────────────────────────────────────────── */
let S;
function reset(keep){
  const k=keep||{};
  S={opt:k.opt||'A',dev:k.dev||'desk',accepted:!!k.accepted,worst:!!k.worst,rows:seed(),
     sheet:null,dialog:null,toast:null,last:'PO-041026-007',log:{},asked:{},gone:[],tab:k.tab||'proto'};
}
reset();
const find=po=>S.rows.find(r=>r.po===po)||S.gone.find(r=>r.po===po);
const sup=r=>S.worst&&r.sup.startsWith('Indorama')?LONG.sup:r.sup;
const who=()=>S.worst?LONG.who:'Rina Kusuma';
const total=r=>r.c?r.c.q.reduce((a,b)=>a+b,0)+r.c.bad:0;
const pcs=n=>n.toLocaleString('en-US')+' pcs';

/* ── top chrome ────────────────────────────────────────────────────────── */
function chrome(){
  document.getElementById('tabs').innerHTML=Object.keys(OPTS).map(k=>`<button class="${S.tab==='proto'&&S.opt===k?'on':''}" data-opt="${k}"><b>${k}</b>${OPTS[k].name}</button>`).join('')+
    `<button class="${S.tab==='dec'?'on':''}" data-tab="dec">Decision</button>`;
  document.getElementById('bar2').innerHTML=S.tab==='dec'?'':`
    <div class="seg" role="group" aria-label="Device"><button class="${S.dev==='desk'?'on':''}" data-dev="desk">Desk</button><button class="${S.dev==='phone'?'on':''}" data-dev="phone">Phone 414</button></div>
    <button class="sw ${S.accepted?'on':''}" data-sw="accepted" role="switch" aria-checked="${S.accepted}"><span class="t"></span>Buyer accepts meanwhile</button>
    <button class="sw ${S.worst?'on':''}" data-sw="worst" role="switch" aria-checked="${S.worst}"><span class="t"></span>Worst case names</button>
    <span class="grow"></span>
    <button class="link" data-act="reset">Reset</button>`;
}

/* ── desk frame ────────────────────────────────────────────────────────── */
function countCell(r){
  const o=S.opt;
  if(r.status==='received')return `<span class="pill ok">Received</span>`;
  if(!r.c){
    return `<div class="cell ${r.flip?'flip':''}"><button class="tint" data-act="count" data-po="${r.po}">Count receive</button></div>`;
  }
  const fig=`<div class="fig"><b class="num">${pcs(total(r))}</b><span title="${who()}">${who()} · ${r.c.at}</span></div>`;
  let act='';
  if(S.asked[r.po])act=`<span class="note">Recount asked · Dewi Lestari</span>`;
  else if(o==='A')act=`<button class="tint" data-act="recall" data-po="${r.po}">Recall</button>`;
  else if(o==='E')act=`<button class="tint" data-act="ask" data-po="${r.po}">Ask to recount</button>`;
  return `<div class="cell ${r.flip?'flip':''}">${act}${fig}</div>`;
}
function deskRows(){
  const o=S.opt;
  return S.rows.map(r=>{
    const opens=(o==='B'||o==='C')&&r.c&&r.status!=='received';
    return `<tr class="${opens?'open':''}" ${opens?`data-act="open" data-po="${r.po}"`:''}>
      <td><span class="sup">${sup(r)}</span><span class="po mono">${r.po}</span></td>
      <td class="r num">${r.n}</td>
      <td class="r cnt">${countCell(r)}</td></tr>`;
  }).join('');
}
function desk(){
  return `<div class="frame" id="frame">
    <aside class="rail"><div class="mark">C</div>
      <div class="ri">${ic('cart')}</div><div class="ri on">${ic('truck')}</div><div class="ri">${ic('box')}</div><div class="ri">${ic('store')}</div><div class="ri">${ic('users')}</div></aside>
    <nav class="nav"><h4>Ops</h4><a>Workload</a><a class="on">Receiving <em>${S.rows.length}</em></a><a>Allotment <em>8</em></a><a>Return from Store</a><a>Return PO <em>2</em></a><a>Activity Log</a></nav>
    <section class="main">
      <div class="ph"><h2>Receiving</h2><div class="tb"><span class="on">Purchase orders · ${S.rows.length}</span><span>Store returns</span></div></div>
      <div class="scroll"><div class="tcard"><table>
        <thead><tr><th>PO</th><th class="r">Items</th><th class="r">Count</th></tr></thead>
        <tbody id="body">${deskRows()}</tbody></table></div></div>
    </section>
    ${layers()}</div>`;
}

/* ── phone frame ───────────────────────────────────────────────────────── */
function phoneCards(){
  const o=S.opt;
  return S.rows.map(r=>{
    const opens=(o==='B'||o==='C')&&r.c&&r.status!=='received';
    let foot;
    if(r.status==='received')foot=`<div class="fg">Received</div><span class="pill ok">Received</span>`;
    else if(!r.c)foot=`<div class="fg ${r.flip?'flip':''}">Not counted</div><button class="tint ${r.flip?'flip':''}" data-act="count" data-po="${r.po}">Count receive</button>`;
    else{
      const left=`<div class="fg ${r.flip?'flip':''}"><div>Counted <b class="num">${pcs(total(r))}</b></div><div>${who()} · ${r.c.at}</div></div>`;
      let right='';
      if(S.asked[r.po])right=`<span class="note">Asked Dewi</span>`;
      else if(o==='A')right=`<button class="tint" data-act="recall" data-po="${r.po}">Recall</button>`;
      else if(o==='E')right=`<button class="tint" data-act="ask" data-po="${r.po}">Ask to recount</button>`;
      else right=`<span class="pill line">Counted</span>`;
      foot=left+right;
    }
    return `<article class="lc ${opens?'tap':''}" ${opens?`data-act="open" data-po="${r.po}"`:''}>
      <div class="hd"><div class="n"><span class="sup">${sup(r)}</span><span class="po mono">${r.po}</span></div>
      <div class="big"><b class="num">${r.n}</b><span>${r.n===1?'item':'items'}</span></div></div>
      <div class="ft">${foot}</div></article>`;
  }).join('');
}
function phone(){
  return `<div class="phonewrap"><div class="phone" id="frame">
    <div class="pbar"><b>Receiving</b><span class="av">R</span></div>
    <div class="cards" id="body">${phoneCards()}</div>
    <div class="dock"><div class="pillbar"><div class="srch">${ic('search')}<span>Search Orders</span></div><span class="rb">${ic('sliders')}</span></div></div>
    <nav class="pnav"><a>${ic('home')}Home</a><a>${ic('dash')}Workload</a><a class="on">${ic('truck')}Receiving</a><a>${ic('cols')}Allotment</a><a>${ic('more')}More</a></nav>
    ${layers()}
  </div></div>`;
}

/* ── layers ────────────────────────────────────────────────────────────── */
function layers(){
  return `<div class="veil" id="veil" data-act="dismiss"></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Count"></aside>
    <div class="dlgwrap"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
    <div class="toast" id="toast" role="status"></div>`;
}
function sheetHtml(){
  const sh=S.sheet;if(!sh)return '';
  const r=find(sh.po);if(!r)return '';
  const head=(badge)=>`<div class="sh"><div class="t"><span class="id mono">${r.po}</span><h3>${sup(r)}</h3>${badge}
      <div class="cap">${sh.mode==='count'?'Count receive':`Counted by ${who()} · ${r.c?r.c.at:''}`}</div></div>
      <button class="x" data-act="close" aria-label="Close">${ic('x')}</button></div>`;
  if(sh.mode==='count'){
    const v=sh.vals;const t=v.reduce((a,b)=>a+(+b||0),0)+(+sh.bad||0);
    return head('')+`<div class="sb"><table class="mini"><thead><tr><th>Article</th><th class="r">Counted</th></tr></thead><tbody>
      ${r.lines.map((l,i)=>`<tr><td>${l[0]}<small>${l[1]}</small></td><td class="r"><input class="in" inputmode="numeric" data-line="${i}" value="${v[i]??''}" aria-label="${l[0]} counted"></td></tr>`).join('')}
      <tr><td>Not as Ordered<small>Damaged or wrong items</small></td><td class="r"><input class="in" inputmode="numeric" data-bad value="${sh.bad??0}" aria-label="Not as ordered"></td></tr></tbody>
      <tfoot><tr><td>Total Counted</td><td class="r num" id="tot">${pcs(t)}</td></tr></tfoot></table></div>
      <div class="sf"><span class="grow"></span><button class="btn pri" data-act="submit" ${t>0?'':'disabled'} id="subbtn">Submit count</button></div>`;
  }
  if(sh.mode==='correct'){
    const v=sh.vals;const t=v.reduce((a,b)=>a+(+b||0),0)+(+sh.bad||0);
    return head(`<span class="pill warn">Waiting for review</span>`)+`<div class="sb"><div><p class="sub">Correct count</p><table class="mini"><thead><tr><th>Article</th><th class="r">Counted</th></tr></thead><tbody>
      ${r.lines.map((l,i)=>`<tr><td>${l[0]}<small>${l[1]}</small></td><td class="r"><input class="in" inputmode="numeric" data-line="${i}" value="${v[i]??''}" aria-label="${l[0]} counted"></td></tr>`).join('')}
      <tr><td>Not as Ordered<small>Damaged or wrong items</small></td><td class="r"><input class="in" inputmode="numeric" data-bad value="${sh.bad??0}" aria-label="Not as ordered"></td></tr></tbody>
      <tfoot><tr><td>Total Counted</td><td class="r num" id="tot">${pcs(t)}</td></tr></tfoot></table></div></div>
      <div class="sf"><button class="btn ghost" data-act="back">Cancel</button><span class="grow"></span><button class="btn pri" data-act="save" ${t>0?'':'disabled'} id="subbtn">Save correction</button></div>`;
  }
  /* read */
  const rows=r.lines.map((l,i)=>`<tr><td>${l[0]}<small>${l[1]}</small></td><td class="r num">${pcs(r.c.q[i])}</td></tr>`).join('')+
    (r.c.bad?`<tr><td>Not as Ordered</td><td class="r num">${pcs(r.c.bad)}</td></tr>`:'');
  const err=sh.error?`<div class="banner">${ic('alert')}<div><b>Dewi Lestari accepted this count a moment ago.</b><br>The pieces are in stock; it can no longer be recalled.</div></div>`:'';
  let foot;
  if(sh.error)foot=`<span class="grow"></span><button class="btn" data-act="close">Close</button>`;
  else if(sh.confirm)foot=`<div class="grow"><div class="chips" style="margin-bottom:10px">${REASONS.map(x=>`<button class="chip ${sh.reasons.has(x)?'on':''}" data-reason="${x}">${x}</button>`).join('')}</div><div style="display:flex;gap:8px;justify-content:flex-end;align-items:center"><span class="note" style="flex:1">Recall ${pcs(total(r))}?</span><button class="btn ghost" data-act="keep">Keep</button><button class="btn pri" data-act="confirm">Recall</button></div></div>`;
  else foot=`<button class="btn warnb" data-act="recall-in-sheet">Recall count</button>${S.opt==='C'?`<button class="btn" data-act="correct">Correct count</button>`:''}<span class="grow"></span><button class="btn" data-act="close">Close</button>`;
  return head(r.status==='received'?`<span class="pill ok">Received</span>`:`<span class="pill warn">Waiting for review</span>`)+
    `<div class="sb">${err}<dl class="facts"><div><dt>Reviewer</dt><dd>Dewi Lestari</dd></div></dl>
     <div><p class="sub">Counted</p><table class="mini"><thead><tr><th>Article</th><th class="r">Pieces</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>Total</td><td class="r num">${pcs(total(r))}</td></tr></tfoot></table></div></div>
     <div class="sf" style="${sh.confirm?'align-items:flex-end':''}">${foot}</div>`;
}
function dialogHtml(){
  const d=S.dialog;if(!d)return '';
  const r=find(d.po);if(!r)return '';
  if(d.error)return `<h3>Can’t recall</h3><div class="banner">${ic('alert')}<div>Dewi Lestari accepted this count a moment ago. The pieces are in stock.</div></div><div class="act"><button class="btn" data-act="dismiss">Close</button></div>`;
  const ask=d.kind==='ask';
  return `<h3>${ask?'Ask the buyer to send it back?':'Recall this count?'}</h3>
    <p>${ask?`Dewi Lestari raised ${r.po}. She sends it back from Review Count, and you count again.`:`${pcs(total(r))} on ${r.po} goes back to Not counted. The buyer no longer sees it.`}</p>
    <div class="chips">${REASONS.map(x=>`<button class="chip ${d.reasons.has(x)?'on':''}" data-reason="${x}">${x}</button>`).join('')}</div>
    <div class="act"><button class="btn ghost" data-act="dismiss">Keep</button><button class="btn pri" data-act="confirm">${ask?'Send request':'Recall'}</button></div>`;
}

/* ── buying panel ──────────────────────────────────────────────────────── */
function buying(){
  const r=find(S.last);const lg=S.log[S.last];
  if(!r)return '';
  let btn='',main='',left=`<small>Buying · Purchase orders</small><b class="mono" style="font-weight:500;color:var(--ink)">${r.po}</b> <span style="color:var(--mute)">${sup(r)}</span>`;
  if(r.status==='received'){main=`<b>Received</b><span>Dewi Lestari accepted ${pcs(total(r))}</span>`;}
  else if(S.asked[r.po]){
    main=`<div class="ping">${ic('alert')}<div><b style="color:inherit">${who()} asked for a recount</b><span style="color:inherit;opacity:.85">${(S.asked[r.po].reasons||[]).join(', ')||'No reason given'}</span></div></div>`;
    btn=`<button class="btn" data-act="sendback">Count again</button>`;
  }
  else if(r.c){
    main=`<b class="num">Counted ${pcs(total(r))}</b><span>${who()} · ${r.c.at}${lg&&lg.corrected?` · corrected, was ${pcs(lg.was)}`:''}</span>`;
    btn=`<button class="btn pri" data-act="noop">Review Count</button>`;
  }else{
    main=`<b>Not counted yet</b><span>${lg&&lg.recalled?`Count recalled · ${who()}${lg.reasons.length?` · ${lg.reasons.join(', ')}`:''} · just now`:'Waiting for the warehouse'}</span>`;
  }
  return `<div class="buy"><div class="l">${left}</div><div class="m">${main}</div>${btn}</div>`;
}

/* ── render ────────────────────────────────────────────────────────────── */
function stage(){
  const root=document.getElementById('root');
  if(S.tab==='dec'){root.innerHTML=decision();return}
  const o=OPTS[S.opt];
  root.innerHTML=`<p class="lede">${S.opt} · ${o.name}</p><p class="says">${o.says}</p>
    <div class="stagewrap">${S.dev==='desk'?desk():phone()}${buying()}
    <div class="pm"><div><b>Good</b>${o.good}</div><div><b>Costs</b>${o.cost}</div></div></div>`;
  paintLayers(false);
}
function paintLayers(animate){
  const veil=document.getElementById('veil'),sheet=document.getElementById('sheet'),dlg=document.getElementById('dlg');
  if(!veil)return;
  const sOn=!!S.sheet,dOn=!!S.dialog;
  if(sOn)sheet.innerHTML=sheetHtml();
  if(dOn)dlg.innerHTML=dialogHtml();
  requestAnimationFrame(()=>{
    sheet.classList.toggle('on',sOn);dlg.classList.toggle('on',dOn);veil.classList.toggle('on',sOn||dOn);
  });
  paintToast();
}
let toastTimer=null;
function paintToast(){
  const t=document.getElementById('toast');if(!t)return;
  const k=S.toast;
  if(k){
    t.innerHTML=`<span class="m">${k.text}</span>${k.undo?`<button class="u" data-act="undo"><svg class="ring" viewBox="0 0 20 20"><circle class="bg" cx="10" cy="10" r="8"/><circle class="fg" cx="10" cy="10" r="8"/></svg>Undo</button>`:''}`;
    t.style.setProperty('--win',(k.ms/1000)+'s');
    t.classList.remove('on');void t.offsetWidth;requestAnimationFrame(()=>t.classList.add('on'));
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>{S.toast=null;t.classList.remove('on')},k.ms);
  }else{t.classList.remove('on');clearTimeout(toastTimer)}
}
function flash(po){const r=find(po);if(r){r.flip=true;setTimeout(()=>{r.flip=false},400)}}
function refreshBody(){
  const b=document.getElementById('body');if(b)b.innerHTML=S.dev==='desk'?deskRows():phoneCards();
  const bu=document.querySelector('.buy');if(bu)bu.outerHTML=buying();
  const tb=document.querySelector('.tb span.on');if(tb)tb.textContent='Purchase orders · '+S.rows.length;
  const nv=document.querySelector('.nav a.on em');if(nv)nv.textContent=S.rows.length;
}

/* ── actions ───────────────────────────────────────────────────────────── */
function recallNow(po,reasons){
  const r=find(po);S.last=po;
  if(S.accepted){r.status='received';return false}
  S.log[po]={recalled:true,reasons:[...reasons]};
  r.c=null;flash(po);
  return true;
}
function afterClose(){ // received rows leave the list once the error is dismissed
  S.gone.push(...S.rows.filter(r=>r.status==='received'));
  S.rows=S.rows.filter(r=>r.status!=='received');
}
function doAct(a,el){
  const po=el&&el.dataset.po;
  switch(a){
    case 'recall':S.dialog={kind:'recall',po,reasons:new Set()};S.last=po;paintLayers();refreshBody();break;
    case 'ask':S.dialog={kind:'ask',po,reasons:new Set()};S.last=po;paintLayers();refreshBody();break;
    case 'open':{const r=find(po);S.last=po;S.sheet={po,mode:'read',confirm:false,reasons:new Set()};paintLayers();refreshBody();break}
    case 'count':{const r=find(po);S.last=po;S.sheet={po,mode:'count',vals:r.lines.map(()=>''),bad:0};paintLayers();break}
    case 'recall-in-sheet':S.sheet.confirm=true;S.sheet.reasons=new Set();paintLayers();break;
    case 'keep':S.sheet.confirm=false;paintLayers();break;
    case 'correct':{const r=find(S.sheet.po);S.sheet.mode='correct';S.sheet.vals=r.c.q.map(String);S.sheet.bad=r.c.bad;S.sheet.was=total(r);paintLayers();break}
    case 'back':S.sheet.mode='read';paintLayers();break;
    case 'save':{
      const sh=S.sheet,r=find(sh.po);
      r.c={q:sh.vals.map(v=>+v||0),bad:+sh.bad||0,at:'just now'};
      S.log[sh.po]={corrected:true,was:sh.was};
      sh.mode='read';paintLayers();refreshBody();
      S.toast={text:`Count corrected · ${r.po}`,ms:3200};paintToast();break}
    case 'confirm':{
      if(S.dialog){
        const d=S.dialog;
        if(d.kind==='ask'){
          S.asked[d.po]={reasons:[...d.reasons]};S.dialog=null;S.last=d.po;
          paintLayers();refreshBody();S.toast={text:`Asked Dewi Lestari · ${d.po}`,ms:3200};paintToast();
        }else{
          const ok=recallNow(d.po,d.reasons);
          if(ok){S.dialog=null;paintLayers();refreshBody();S.toast={text:`Count recalled · ${d.po}`,ms:3200};paintToast()}
          else{S.dialog.error=true;paintLayers();refreshBody()}
        }
      }else if(S.sheet){
        const sh=S.sheet,ok=recallNow(sh.po,sh.reasons);
        if(ok){S.sheet=null;paintLayers();refreshBody();S.toast={text:`Count recalled · ${sh.po}`,ms:3200};paintToast()}
        else{sh.error=true;sh.confirm=false;paintLayers();refreshBody()}
      }
      break}
    case 'submit':{
      const sh=S.sheet,r=find(sh.po);
      r.c={q:sh.vals.map(v=>+v||0),bad:+sh.bad||0,at:'just now'};S.log[sh.po]=null;
      S.sheet=null;paintLayers();flash(sh.po);refreshBody();
      if(S.opt==='D'){S.toast={text:`Counted ${pcs(total(r))} · ${r.po}`,undo:true,ms:15000,po:sh.po,vals:sh.vals.slice(),bad:sh.bad};paintToast()}
      else{S.toast={text:`Count sent · ${r.po}`,ms:3200};paintToast()}
      break}
    case 'undo':{
      const k=S.toast;if(!k)break;const r=find(k.po);
      if(S.accepted){S.toast={text:'Too late — Dewi Lestari accepted it',ms:3200};r.status='received';paintToast();refreshBody();break}
      r.c=null;flash(k.po);S.toast=null;paintToast();
      S.sheet={po:k.po,mode:'count',vals:k.vals,bad:k.bad};paintLayers();refreshBody();break}
    case 'sendback':{
      const po=S.last,r=find(po);r.c=null;S.log[po]={recalled:true,reasons:S.asked[po].reasons};delete S.asked[po];
      flash(po);refreshBody();break}
    case 'close':case 'dismiss':{
      const gone=S.rows.some(r=>r.status==='received');
      S.sheet=null;S.dialog=null;paintLayers();
      if(gone)setTimeout(()=>{afterClose();refreshBody()},220);
      break}
    case 'reset':reset({opt:S.opt,dev:S.dev,worst:S.worst,accepted:S.accepted,tab:S.tab});chrome();stage();break;
    case 'noop':break;
  }
}

/* ── decision ──────────────────────────────────────────────────────────── */
function decision(){
  const M=(v)=>v==='y'?'<span class="yes">●</span>':v==='m'?'<span class="mid">◐</span>':'<span class="no">○</span>';
  const rows=[
    ['Gives a counted row something to do','y','y','y','n','y'],
    ['She can see what she counted first','n','y','y','n','n'],
    ['Catches the slip seconds after Submit','n','n','n','y','n'],
    ['Fixes one wrong number without retyping','n','n','y','m','n'],
    ['Works the same on card and row','y','y','y','y','y'],
    ['Needs no new right on the count','n','n','n','n','y'],
    ['Buyer is never surprised mid-review','n','n','m','n','y'],
  ];
  return `<div class="dec">
   <div class="rec"><div style="font-size:20px;line-height:1">★</div><div><b>Recommended: A + D, with C’s sheet behind the row.</b> Undo catches the slip while she is still at the dock (D). Later, the Count cell carries Recall (A) and the row opens a sheet that reads the count and offers Correct (C). E stays as the fallback if Hari does not want counters withdrawing anything.</div></div>
   <div class="card"><h3>The five against what we saw on the running hub</h3>
    <table><thead><tr><th></th>${['A','B','C','D','E'].map(k=>`<th class="c">${k}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td class="c">${M(v)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
   <div class="two">
    <div class="card"><h3>Rules (proposed)</h3><ul class="rules">
      <li>Recall is open to whoever may count — a permission, not the name on the count — and only while the buyer has not accepted. The count is marked <b>Recalled</b>, never deleted, with the reason and who.</li>
      <li>If the buyer accepts first, Recall is refused with their name (try the switch “Buyer accepts meanwhile”). The row leaves the list as Received.</li>
      <li>Reasons are one tap and optional: Typo, Wrong delivery, Wrong article.</li>
      <li>The buyer’s Review Count button disappears with the recall; the PO shows “Count recalled · Rina Kusuma · Typo”.</li>
      <li>Correct count (C) replaces the figures in place and keeps the old total on the PO’s timeline.</li>
    </ul></div>
    <div class="card"><h3>After the buyer has accepted</h3><ul class="rules">
      <li>The pieces are in the Gudang’s Unidentified pool — nothing to recall.</li>
      <li>Too many: the buyer raises a return to the supplier from the PO.</li>
      <li>Too few: keep it on order or close it short from the PO.</li>
      <li>Wrong all along: Inventory adjusts the stock (a movement with a cause).</li>
    </ul></div>
   </div>
   <div class="card"><h3>To build once picked</h3><ul class="rules">
      <li>Cloud: count status <b>RECALLED</b>, a recall route beside accept and recount in <span class="mono">dc/receiving.rs</span>, refused unless the count is still awaiting verification.</li>
      <li>Hub: the Count cell / card foot, the count sheet (read, correct), the Undo toast; Review Count reacts to the count leaving.</li>
      <li>Notification to the buyer on recall, correction or ask.</li>
   </ul></div>
  </div>`;
}

/* ── events ────────────────────────────────────────────────────────────── */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-opt],[data-tab],[data-dev],[data-sw],[data-act],[data-reason]');
  if(!t)return;
  if(t.dataset.opt){S.opt=t.dataset.opt;S.tab='proto';reset({opt:S.opt,dev:S.dev,worst:S.worst,accepted:S.accepted});chrome();stage();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;chrome();stage();return}
  if(t.dataset.dev){S.dev=t.dataset.dev;S.sheet=null;S.dialog=null;S.toast=null;chrome();stage();return}
  if(t.dataset.sw){S[t.dataset.sw]=!S[t.dataset.sw];chrome();if(t.dataset.sw==='worst')stage();return}
  if(t.dataset.reason){
    const set=S.dialog?S.dialog.reasons:S.sheet&&S.sheet.reasons;if(!set)return;
    set.has(t.dataset.reason)?set.delete(t.dataset.reason):set.add(t.dataset.reason);
    t.classList.toggle('on');return;
  }
  if(t.dataset.act){
    /* a button inside an opening row must not also open the row */
    if(t.tagName!=='TR'&&t.tagName!=='ARTICLE'&&e.target.closest('button[data-act]')&&t.dataset.act==='open'&&e.target.closest('button[data-act]')!==t)return;
    if(t.dataset.act==='dismiss'&&e.target!==t&&!e.target.closest('button[data-act="dismiss"]'))return;
    doAct(t.dataset.act,t);
  }
});
document.addEventListener('input',e=>{
  const sh=S.sheet;if(!sh||!(sh.mode==='count'||sh.mode==='correct'))return;
  const el=e.target;el.value=el.value.replace(/[^0-9]/g,'');
  if(el.dataset.line!==undefined)sh.vals[+el.dataset.line]=el.value;
  if(el.dataset.bad!==undefined)sh.bad=el.value;
  const t=sh.vals.reduce((a,b)=>a+(+b||0),0)+(+sh.bad||0);
  document.getElementById('tot').textContent=pcs(t);
  document.getElementById('subbtn').disabled=!(t>0);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(S.sheet||S.dialog))doAct('close');
});
chrome();stage();
</script>
