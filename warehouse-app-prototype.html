const IDX = { gudang: 0, toko: 1, reject: 2 };
/* A delivery from the DC, by its surat jalan: what was packed, per SKU. */
const DELIVERIES = {
  'SJ-000007': { koli: 2, from: 'DC Cikupa', lines: [['10021345104', 6], ['10034567211', 4], ['10052740207', 8], ['10081109015', 10]] },
};
/* Why a piece goes to Reject: one tap, never typed. */
const WHY = ['Rusak', 'Cacat', 'Kotor', 'Salah kirim'];

/* One key per kind of move, in the POS's own toolbar. */
const MODES = {
  in: { key: 'F1', label: 'Terima', flag: 'Terima barang', from: ['dc'], to: 'gudang' },
  floor: { key: 'F2', label: 'Ke toko', flag: 'Gudang → Toko', from: ['gudang'], to: 'toko' },
  back: { key: 'F3', label: 'Ke gudang', flag: 'Toko → Gudang', from: ['toko'], to: 'gudang' },
  reject: { key: 'F4', label: 'Reject', flag: 'Reject', from: ['toko', 'gudang'], to: 'reject', why: true },
  ho: { key: 'F5', label: 'Kirim HO', flag: 'Kirim ke HO', from: ['reject', 'gudang', 'toko'], to: 'ho' },
};
const KEYMAP = [
  ['+', 'Tambah', 'plus'], ['−', 'Kurangi', 'minus'],
  ['F1', 'Terima', 'in'], ['F2', 'Ke toko', 'floor'], ['F3', 'Ke gudang', 'back'], ['F4', 'Reject', 'reject'], ['F5', 'Kirim HO', 'ho'],
  ['F9', 'Cek stok', 'check'], ['F10', 'Riwayat', 'history'],
];

/* ── Formats ──────────────────────────────────────────────────────────── */
const fmt = n => Math.round(n).toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const skuText = s => /^\d{11}$/.test(s) ? s.slice(0, 8) + '·' + s.slice(8) : '—';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const p2 = n => String(n).padStart(2, '0');
const hm = d => p2(d.getHours()) + ':' + p2(d.getMinutes());
const dayTime = d => `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${hm(d)}`;
const variant = it => `${it.colour} · ${it.size}`;
const pcsText = n => `${fmt(n)} pcs`;
const itemOf = sku => ITEMS.find(it => it.sku === sku);
let CLOCK = { base: new Date(2026, 9, 25, 9, 12, 0).getTime(), at: Date.now() };
const now = () => new Date(CLOCK.base + (Date.now() - CLOCK.at));

/* ── Icons (lucide, the hub's set) ────────────────────────────────────── */
const ic = (d, s = 16, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  search: ic('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),
  chevDown: ic('<path d="m6 9 6 6 6-6"/>'),
  arrow: ic('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'),
  rfidBig: ic('<path d="M2 12C2 6.5 6.5 2 12 2"/><path d="M5 12a7 7 0 0 1 7-7"/><path d="M8 12a4 4 0 0 1 4-4"/><circle cx="12" cy="12" r="1"/><path d="M22 12c0 5.5-4.5 10-10 10"/><path d="M19 12a7 7 0 0 1-7 7"/><path d="M16 12a4 4 0 0 1-4 4"/>', 40, 1.5),
  trash: ic('<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>'),
  okCircle: ic('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>'),
  info: ic('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'),
};
let MID = 0;
function mark(cls) {
  const id = 'mk' + (++MID);
  return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="${id}t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4277e6"/><stop offset="1" stop-color="#1f4fc0"/></linearGradient><linearGradient id="${id}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3e0fa"/></linearGradient><linearGradient id="${id}d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd766"/><stop offset="1" stop-color="#eaa20f"/></linearGradient><filter id="${id}s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8"/></filter></defs><rect width="100" height="100" rx="23.4" fill="url(#${id}t)"/><ellipse cx="48" cy="84" rx="25" ry="3.4" fill="#0b2466" opacity=".4" filter="url(#${id}s)"/><path d="M64.32 28.88A28.25 28.25 0 1 0 64.32 68.12A7.25 7.25 0 0 0 53.89 58.05A13.75 13.75 0 1 1 53.89 38.95A7.25 7.25 0 0 0 64.32 28.88Z" fill="url(#${id}c)"/><circle cx="75.5" cy="48.5" r="8" fill="url(#${id}d)"/></svg>`;
}

/* The fingerprint sensor, as the POS draws it. */
const FP = [
  ['M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4', 0],
  ['M14 13.12c0 2.38 0 6.38-1 8.88', 1],
  ['M8.65 22c.21-.66.45-1.32.57-2', 1],
  ['M9 6.8a6 6 0 0 1 9 5.2v2', 2],
  ['M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2', 2],
  ['M17.29 21.02c.12-.6.43-2.3.5-3.02', 3],
  ['M2 12a10 10 0 0 1 18-6', 4],
  ['M21.8 16c.2-2 .131-5.354 0-6', 4],
  ['M2 16h.01', 5],
];
function sensor(state, act, arg, small) {
  const base = FP.map(([d]) => `<path d="${d}"/>`).join('');
  const ink = FP.map(([d, o]) => `<path pathLength="1" style="--o:${o}" d="${d}"/>`).join('');
  return `<button class="fp ${state}${small ? ' sm' : ''}" data-act="${act}" data-arg="${arg}" aria-label="Sensor sidik jari">
    <span class="fp-clip"><span class="fp-beam"></span></span>
    <svg class="fp-glyph" viewBox="0 0 24 24"><g class="fp-base">${base}</g><g class="fp-ink">${ink}</g></svg>
    <span class="fp-fill"></span>
    <svg class="fp-check" viewBox="0 0 24 24"><path pathLength="1" d="M6.5 12.5l3.8 3.8 7.2-8.3"/></svg>
  </button>`;
}
let TIMERS = [];
const later = (fn, ms) => { const id = setTimeout(() => { TIMERS = TIMERS.filter(t => t !== id); fn(); }, ms); TIMERS.push(id); return id; };
const clearTimers = () => { TIMERS.forEach(clearTimeout); TIMERS = []; };

/* ── State ────────────────────────────────────────────────────────────── */
const S = {
  screen: 'till',         // door | till
  door: 'touch',          // touch (the finger) | welcome
  fp: 'idle',             // idle | reading | done | no
  sup: null,              // the Kepala toko's finger being asked for
  size: 'full',
  mode: 'floor',          // which move the list is building
  drafts: {},             // one list per move; switching keys loses nothing
  from: {},               // per move, the place it takes from (Reject, Kirim HO)
  sj: null,               // Terima: the surat jalan scanned
  sel: 0, scanVal: '', scanErr: null, reading: false,
  list: null,             // null | 'check' | 'history': the item list shows that instead
  find: '', open: null,   // search, and the history row opened
  stock: JSON.parse(JSON.stringify(STOCK0)),
  history: [], seq: 41,
  toasts: [], anim: {}, focus: null,
};
const draft = () => (S.drafts[S.mode] = S.drafts[S.mode] || []);
const fromOf = () => S.from[S.mode] || MODES[S.mode].from[0];
const have = (sku, place) => place in IDX ? S.stock[sku][IDX[place]] : Infinity;
const pieces = lines => lines.reduce((a, l) => a + l.qty, 0);
/* A line short of stock where it is taken from, or a Reject line with no reason. */
const lineProblem = l => S.mode !== 'in' && l.qty > have(l.sku, fromOf()) ? `Stok ${PLACE[fromOf()].toLowerCase()} ${have(l.sku, fromOf())}`
  : MODES[S.mode].why && !l.why ? 'Pilih alasan' : null;
const canSave = () => draft().length > 0 && pieces(draft()) > 0 && !draft().some(lineProblem);

function seedHistory() {
  const mk = (mins, mode, from, lines, by = WHO.name) => ({ no: ++S.seq, at: new Date(now() - mins * 60e3), mode, from, to: MODES[mode].to, lines: lines.map(([sku, qty, why]) => ({ sku, qty, why })), by });
  // Oldest first so the numbers run with time, then newest on top.
  S.history = [
    mk(60 * 26, 'back', 'toko', [['10092199210', 2]], 'Rizky Pratama'),
    mk(95, 'in', 'dc', [['10043310102', 6], ['10066015118', 3]]),
    mk(52, 'reject', 'toko', [['10034567211', 1, 'Rusak']], 'Rizky Pratama'),
    mk(18, 'floor', 'gudang', [['10052740207', 4], ['10081109015', 6]]),
  ].reverse();
}

/* ── Render ───────────────────────────────────────────────────────────── */
const frame = document.getElementById('frame');
const holder = document.getElementById('holder');
let SCALE = 1;
const A = (k, cls) => S.anim[k] ? ' ' + cls : '';

function render() {
  const scrolls = {};
  frame.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });
  const act = document.activeElement;
  const prevKey = act && frame.contains(act) ? act.dataset.focus : null;
  frame.innerHTML = view();
  frame.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll]; });
  const want = S.focus || prevKey || (S.list === 'check' || (S.list === 'history' && !S.open) ? 'find' : 'scan');
  const el = frame.querySelector(`[data-focus="${want}"]`) || frame.querySelector('[data-focus="scan"]');
  if (el) { el.focus({ preventScroll: true }); const n = el.value.length; if (S.selectAll) el.select(); else el.setSelectionRange(n, n); }
  S.focus = null; S.selectAll = false;
  const row = frame.querySelector('.t-grid tr.sel'); if (row) row.scrollIntoView({ block: 'nearest' });
  S.anim = {};
  S.toasts.forEach(t => { t.shown = true; });
  renderChrome();
}
function view() {
  if (S.screen === 'door') return doorView() + toastView();
  return tillView() + (S.sup ? supView() : '') + toastView();
}
/* The way in is a finger, nothing else, as at the POS. */
function doorView() {
  const brand = `<div style="display:flex;flex-direction:column;align-items:center">${mark('d-mark')}<p class="d-word">Central<i>.</i></p><p class="d-till">${STORE.device} · ${STORE.code} ${STORE.name}</p></div>`;
  let inner;
  if (S.door === 'welcome') {
    const r = S.anim.rise, m = i => r ? ` m-rise" style="--i:${i}` : '';
    inner = `<div class="d-in" data-act="skipWelcome">${brand}
      <div class="w-orb${r ? ' run' : ''}"><span class="w-av">${WHO.initials}</span><span class="w-blue"></span><svg class="w-check" viewBox="0 0 24 24"><path d="M6.5 12.5l3.8 3.8 7.2-8.3"/></svg></div>
      <p class="d-hello${m(2)}">Selamat datang,</p><p class="d-name${m(3)}">${WHO.name}</p><p class="d-meta${m(4)}">${longDay(now())} · ${hm(now())}</p>
      <span class="d-progress${r ? ' run' : ''}"><i></i></span></div>`;
  } else {
    const say = S.fp === 'reading' ? 'Membaca…' : S.fp === 'done' ? 'Dikenali' : S.fp === 'no' ? 'Jari tidak dikenali' : 'Tempelkan jari';
    inner = `<div class="d-in${A('swap', 'm-swap')}">${brand}${sensor(S.fp, 'finger', 'dimas', false)}
      <p class="d-say${S.fp === 'no' ? ' bad' : ''}" aria-live="polite">${say}</p><p class="d-hint">${S.fp === 'no' ? 'Coba lagi, atau minta kepala toko' : ''}</p></div>`;
  }
  return `<div class="door"><div class="d-card${A('lift', 'm-lift')}">${inner}</div>
    <p class="d-status${A('lift', 'm-lift')}"><span class="live"></span><span>Central online</span><span class="dot">·</span><span>${STORE.device} · ${STORE.code} ${STORE.name}</span><span class="dot">·</span><span data-clock="hm">${hm(now())}</span></p></div>`;
}
/* Reject and Kirim HO: the Kepala toko puts her finger on the sensor. */
function supView() {
  const s = S.sup;
  const say = s.state === 'reading' || s.state === 'done' ? 'Membaca…' : s.state === 'no' ? 'Bukan kepala toko' : s.state === 'ok' ? `Disetujui · ${SUPERVISOR.name}` : 'Tempelkan jari';
  return `<div class="veil sup-veil${A('sup', 'm-veil')}" data-act="stop"><div class="sup${A('sup', 'm-pop')}" role="dialog" aria-label="Kepala toko">
    <p class="ttl">${esc(s.title)}</p><p class="cap">Kepala toko menyetujui dengan jari</p>
    ${sensor(s.state === 'ok' ? 'done' : s.state, 'supFinger', SUPERVISOR.id, true)}
    <p class="d-say${s.state === 'no' ? ' bad' : ''}" aria-live="polite" style="${s.state === 'ok' ? 'color:var(--ok-fg)' : ''}">${say}</p>
    <div class="sup-foot"><button class="ds-btn ds-btn--ghost" data-act="supCancel">Batal</button></div>
  </div></div>`;
}
function tillView() {
  const brand = `<div class="t-brand">${mark('')}<b>Central<i>.</i></b></div>`;
  const person = `<button class="t-person" data-act="lock" aria-label="Kunci · ${WHO.name}"><span class="av">${WHO.initials}</span>${I.chevDown}</button>`;
  const status = `<footer class="t-status"><span class="live"></span><span>Online · semua terkirim</span><span class="sp"></span><span>${WHO.name}</span><span class="dot">·</span><span>${STORE.device} · ${STORE.code} ${STORE.name}</span><span class="dot">·</span><span data-clock>${dayTime(now())}</span></footer>`;
  return `<div class="till v-D">
    <header class="t-top">${brand}${keyTiles()}${person}</header>
    <div class="t-main one"><section class="t-page">${scanView()}${modeRow()}${gridView()}${footView()}</section></div>${status}</div>`;
}
function keyTiles() {
  const on = id => (S.list ? S.list === id : S.mode === id);
  const nudge = { plus: 1, minus: -1 }, none = !!S.list || !draft()[S.sel];
  return `<div class="t-keys7" role="toolbar" aria-label="Tombol">${KEYMAP.map(([k, label, id], i) => nudge[id]
    ? `<button class="k7" data-act="nudge" data-arg="${nudge[id]}"${none ? ' disabled' : ''} aria-keyshortcuts="${id === 'plus' ? 'Add' : 'Subtract'}"><span class="k7-k">${k}</span><span class="k7-l">${label}</span></button>`
    : `${i === 2 || i === 7 ? '<span class="k7-gap"></span>' : ''}<button class="k7${on(id) ? ' on' : ''}" data-act="key" data-arg="${id}" aria-keyshortcuts="${k}" aria-pressed="${on(id)}"><span class="k7-k">${k}</span><span class="k7-l">${label}</span></button>`).join('')}</div>`;
}
function scanView() {
  const hint = S.mode === 'in' && !S.list ? 'No. surat jalan, lalu SKU (3*SKU untuk jumlah)' : 'SKU (3*SKU untuk jumlah)';
  return `<div class="t-scan">
    <div class="t-rfid${S.reading ? ' on' : ''}" role="status" aria-live="polite"><span class="t-rfid-dot"></span><span class="t-rfid-t"><b>RFID</b><span>${S.reading ? 'Membaca…' : 'Siap'}</span></span></div>
    <label class="t-scanbox${S.scanErr ? ' bad' : ''}">${I.search}<input data-bind="scan" data-focus="scan" value="${esc(S.scanVal)}" placeholder="${hint}" autocomplete="off" spellcheck="false" aria-label="SKU">${S.scanErr ? `<span class="t-scanerr" role="alert">${esc(S.scanErr)}</span>` : ''}</label>
  </div>`;
}
/* What the list is doing, above it: the move and where it takes from. */
function modeRow() {
  if (S.list === 'check') return `<div class="t-mode"><span class="mode-flag">Cek stok</span><label class="t-find in-mode">${I.search}<input data-bind="find" data-focus="find" value="${esc(S.find)}" placeholder="SKU atau nama barang" autocomplete="off"></label></div>`;
  if (S.list === 'history') {
    const h = S.open && S.history.find(x => x.no === S.open);
    return `<div class="t-mode"><span class="mode-flag">Riwayat</span>${h ? `<span class="mute num">PB-${p2(Math.floor(h.no / 100))}${p2(h.no % 100)} · ${routeText(h)}</span>` : `<label class="t-find in-mode">${I.search}<input data-bind="find" data-focus="find" value="${esc(S.find)}" placeholder="No., SKU atau nama" autocomplete="off"></label>`}</div>`;
  }
  const m = MODES[S.mode];
  const tone = S.mode === 'reject' ? ' bad' : S.mode === 'ho' ? ' ret' : S.mode === 'in' ? ' held' : '';
  const froms = m.from.length > 1 ? `<span class="wh-from"><span class="mute">Dari</span><span class="mchips" role="radiogroup" aria-label="Dari">${m.from.map(f => `<button class="mchip${fromOf() === f ? ' on' : ''}" role="radio" aria-checked="${fromOf() === f}" data-act="from" data-arg="${f}">${PLACE[f]}</button>`).join('')}</span></span>` : '';
  const sj = S.mode === 'in' && S.sj ? `<span class="mute num">${S.sj} · ${DELIVERIES[S.sj].from} · ${DELIVERIES[S.sj].koli} koli</span>` : '';
  return `<div class="t-mode"><span class="mode-flag${tone}">${m.flag}</span>${froms}${sj}</div>`;
}
const routeText = h => `${PLACE[h.from]} → ${PLACE[h.to]}`;

function gridView() {
  if (S.list === 'check') return checkGrid();
  if (S.list === 'history') { const h = S.open && S.history.find(x => x.no === S.open); return h ? historyGrid(h) : historyListGrid(); }
  const lines = draft(), m = MODES[S.mode];
  if (!lines.length) {
    const say = S.mode === 'in' ? 'Scan surat jalan atau koli' : `Taruh barang di reader · ${PLACE[fromOf()]} → ${PLACE[m.to]}`;
    return `<div class="t-grid"><div class="t-empty">${I.rfidBig}<p>${say}</p></div></div>`;
  }
  const inbound = S.mode === 'in', from = fromOf();
  const rows = lines.map((l, i) => {
    const it = itemOf(l.sku), on = i === S.sel, bad = lineProblem(l);
    const diff = inbound && l.sent != null ? l.qty - l.sent : 0;
    return `<tr class="${on ? 'sel' : ''}" data-act="row" data-arg="${i}">
      <td class="mute num">${skuText(l.sku)}</td>
      <td><div class="nm-2"><div class="nm-w"><span class="nm-t">${esc(it.name)}</span><span class="nm-v">${esc(variant(it))}</span></div></div></td>
      ${inbound ? `<td class="c num">${l.sent ?? '—'}</td>` : `<td class="c num${bad && bad.startsWith('Stok') ? ' wh-short' : ''}">${have(l.sku, from)}</td>`}
      <td class="c"><input class="wh-qty" data-bind="qty" data-arg="${i}" data-focus="qty-${i}" inputmode="numeric" value="${l.qty}" aria-label="Jumlah ${esc(it.name)}"></td>
      ${inbound ? `<td class="c num${diff ? ' wh-diff' : ''}">${diff ? (diff > 0 ? '+' : '') + diff : '—'}</td>` : ''}
      ${m.why ? `<td><span class="wh-why" role="radiogroup" aria-label="Alasan">${WHY.map(w => `<button class="mchip${l.why === w ? ' on' : ''}" role="radio" aria-checked="${l.why === w}" data-act="why" data-arg="${i}:${w}">${w}</button>`).join('')}</span></td>` : ''}
      <td class="c">${on ? `<button class="t-rm" data-act="rm" data-arg="${i}" aria-label="Hapus ${esc(it.name)}">${I.trash}</button>` : ''}</td>
    </tr>`;
  }).join('');
  const cols = inbound
    ? '<col style="width:170px"><col><col style="width:120px"><col style="width:120px"><col style="width:110px"><col style="width:48px">'
    : `<col style="width:170px"><col><col style="width:130px"><col style="width:120px">${m.why ? '<col style="width:390px">' : ''}<col style="width:48px">`;
  const head = inbound
    ? '<th>SKU</th><th>Barang</th><th class="c">Dikirim</th><th class="c">Diterima</th><th class="c">Selisih</th><th></th>'
    : `<th>SKU</th><th>Barang</th><th class="c">Stok ${PLACE[from].toLowerCase()}</th><th class="c">Jumlah</th>${m.why ? '<th>Alasan</th>' : ''}<th></th>`;
  return `<div class="t-grid" data-scroll="grid"><table><colgroup>${cols}</colgroup><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* F9: every SKU in the three places. */
function checkGrid() {
  const q = S.find.trim().toLowerCase().replace(/[·\s]/g, '');
  const list = ITEMS.filter(it => !q || it.sku.includes(q) || it.name.toLowerCase().replace(/\s/g, '').includes(q));
  if (!list.length) return `<div class="t-grid"><div class="t-empty"><p>Tidak ada yang cocok dengan “${esc(S.find.trim())}”</p></div></div>`;
  const rows = list.map(it => { const [g, t, r] = S.stock[it.sku]; return `<tr><td class="mute num">${skuText(it.sku)}</td>
    <td><div class="nm-2"><div class="nm-w"><span class="nm-t">${esc(it.name)}</span><span class="nm-v">${esc(variant(it))}</span></div></div></td>
    <td class="r num">${g}</td><td class="r num">${t}</td><td class="r num${r ? ' wh-short' : ''}">${r}</td><td class="r b">${g + t + r}</td></tr>`; }).join('');
  return `<div class="t-grid" data-scroll="grid"><table><colgroup><col style="width:170px"><col><col style="width:120px"><col style="width:120px"><col style="width:120px"><col style="width:120px"></colgroup>
    <thead><tr><th>SKU</th><th>Barang</th><th class="r">Gudang</th><th class="r">Toko</th><th class="r">Reject</th><th class="r">Total</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* F10: what moved, newest first; a row opens its pieces. */
function historyListGrid() {
  const q = S.find.trim().toLowerCase();
  const list = S.history.filter(h => !q || `pb-${p2(Math.floor(h.no / 100))}${p2(h.no % 100)}`.includes(q) || h.lines.some(l => l.sku.includes(q) || itemOf(l.sku).name.toLowerCase().includes(q)));
  if (!list.length) return `<div class="t-grid"><div class="t-empty"><p>${q ? `Tidak ada “${esc(S.find.trim())}”` : 'Belum ada pindahan'}</p></div></div>`;
  const rows = list.map(h => `<tr data-act="open" data-arg="${h.no}"><td class="num">PB-${p2(Math.floor(h.no / 100))}${p2(h.no % 100)}</td><td class="num">${h.at.getDate()} ${MON[h.at.getMonth()]} · ${hm(h.at)}</td>
    <td><span class="wh-route">${PLACE[h.from]}${I.arrow}${PLACE[h.to]}</span></td><td>${esc(h.by)}</td><td class="c num">${pieces(h.lines)}</td></tr>`).join('');
  return `<div class="t-grid" data-scroll="grid"><table><colgroup><col style="width:150px"><col style="width:170px"><col><col><col style="width:110px"></colgroup>
    <thead><tr><th>No.</th><th>Waktu</th><th>Pindah</th><th>Oleh</th><th class="c">Jumlah</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function historyGrid(h) {
  const rows = h.lines.map((l, i) => { const it = itemOf(l.sku); return `<tr><td class="mute num">${i + 1}</td><td class="mute num">${skuText(l.sku)}</td>
    <td><div class="nm-2"><div class="nm-w"><span class="nm-t">${esc(it.name)}</span><span class="nm-v">${esc(variant(it))}</span></div></div></td><td class="c num">${l.qty}</td><td>${l.why ? esc(l.why) : '<span class="faint">—</span>'}</td></tr>`; }).join('');
  return `<div class="t-grid" data-scroll="h-${h.no}"><div class="hg-band"><p class="rg-facts"><span class="wh-route">${PLACE[h.from]}${I.arrow}${PLACE[h.to]}</span><span>${dayTime(h.at)}</span><span>${esc(h.by)}</span></p></div>
    <table><colgroup><col style="width:64px"><col style="width:170px"><col><col style="width:110px"><col style="width:180px"></colgroup>
    <thead><tr><th></th><th>SKU</th><th>Barang</th><th class="c">Jumlah</th><th>Alasan</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function footView() {
  const back = label => `<button class="ds-btn ds-btn--primary t-big" data-act="back">${label} <span class="kbd">Esc</span></button>`;
  if (S.list === 'history' && S.open) return `<div class="t-float fB">${back('Riwayat')}<span class="sp"></span><button class="ds-btn ds-btn--primary t-pay" data-act="print"><span>Cetak surat jalan</span><span class="kbd">Enter</span></button></div>`;
  if (S.list) return `<div class="t-float fB">${back('Kembali')}<span class="sp"></span></div>`;
  const lines = draft(), n = pieces(lines), m = MODES[S.mode];
  const need = lines.filter(lineProblem).length;
  const total = `<div class="tf-total"><span class="tf-k">${PLACE[fromOf()]} → ${PLACE[m.to]}${need ? ` · <span class="wh-need">${need} perlu dicek</span>` : ''}</span><span class="tf-v"><b>${fmt(n)}</b><span class="cur" style="margin-left:6px">pcs</span></span></div>`;
  const clear = lines.length ? `<button class="ds-btn ds-btn--destructive t-big t-clear" data-act="clear">${I.trash}<span>Kosongkan</span><span class="kbd">F6</span></button>` : '';
  return `<div class="t-float fB">${clear}<span class="sp"></span>${total}<button class="ds-btn ${S.mode === 'reject' ? 'ds-btn--destructive' : 'ds-btn--primary'} t-pay" data-act="save"${canSave() ? '' : ' disabled'}><span>${S.mode === 'in' ? 'Terima' : S.mode === 'ho' ? 'Kirim' : 'Pindahkan'}</span><span class="kbd">F12</span></button></div>`;
}
function toastView() {
  return `<div class="toasts" aria-live="polite">${S.toasts.map(t => `<div class="ds-toast ds-toast--${t.tone}${t.shown ? '' : ' m-toast'}">${t.tone === 'ok' ? I.okCircle : I.info}<div class="ds-toast-text"><p class="ds-toast-title">${esc(t.title)}</p>${t.desc ? `<p class="ds-toast-desc">${esc(t.desc)}</p>` : ''}</div></div>`).join('')}</div>`;
}
function toast(tone, title, desc) {
  const t = { tone, title, desc, shown: false };
  S.toasts = [...S.toasts.slice(-2), t];
  setTimeout(() => { S.toasts = S.toasts.filter(x => x !== t); render(); }, 3200);
}

/* ── Actions ──────────────────────────────────────────────────────────── */
function setMode(id) {
  S.list = null; S.open = null; S.find = '';
  S.mode = id; S.sel = Math.max(0, draft().length - 1); S.scanErr = null; S.focus = 'scan';
}
function addSku(sku, n = 1) {
  const lines = draft(), at = lines.findIndex(l => l.sku === sku);
  if (at >= 0) { lines[at].qty += n; S.sel = at; }
  else { lines.push({ sku, qty: n, why: null }); S.sel = lines.length - 1; }
}
function scan(raw) {
  let code = raw.trim().toUpperCase(), n = 1;
  S.scanVal = ''; S.scanErr = null;
  if (!code) return;
  if (S.list) { S.list = null; S.open = null; S.find = ''; }
  if (S.mode === 'in' && DELIVERIES[code]) { loadSj(code); return; }
  const qm = code.match(/^(\d{1,3})\s*\*\s*(\S+)$/);
  if (qm) { n = Number(qm[1]); code = qm[2]; }
  const digits = code.replace(/[·.\s-]/g, '');
  const it = itemOf(digits);
  if (!it) { S.scanErr = `${raw.trim()} tidak dikenal`; return; }
  if (S.mode === 'in' && !S.sj) { S.scanErr = 'Scan surat jalan dulu'; return; }
  addSku(it.sku, n);
}
/* Terima: the surat jalan fills the list with what was packed, counted as
   sent (not blind, 23 Oct); the receiver changes only what differs. */
function loadSj(no) {
  S.sj = no;
  S.drafts.in = DELIVERIES[no].lines.map(([sku, sent]) => ({ sku, sent, qty: sent, why: null }));
  S.sel = 0;
}
function save() {
  if (!canSave()) return;
  if ((S.mode === 'reject' || S.mode === 'ho') && !WHO.head) { askSupervisor(S.mode === 'reject' ? 'Reject barang' : 'Kirim ke HO', commit); return; }
  commit();
}
function askSupervisor(title, then) { S.sup = { title, state: 'idle', then }; S.anim.sup = true; }
function supFinger(id) {
  const s = S.sup;
  if (!s || s.state === 'reading' || s.state === 'ok') return;
  s.state = 'reading'; render();
  later(() => {
    if (!S.sup) return;
    if (id !== SUPERVISOR.id) { s.state = 'no'; render(); later(() => { if (S.sup) { s.state = 'idle'; render(); } }, 1500); return; }
    s.state = 'ok'; render();
    later(() => { const fn = s.then; S.sup = null; fn(SUPERVISOR); render(); }, 900);
  }, 980);
}
function finger(id) {
  if (S.fp === 'reading' || S.fp === 'done') return;
  clearTimers(); S.fp = 'reading'; render();
  later(() => {
    const p = PEOPLE[id];
    if (!p) { S.fp = 'no'; render(); later(() => { S.fp = 'idle'; render(); }, 1700); return; }
    S.fp = 'done'; render();
    later(() => welcome(p, false), 760);
  }, 980);
}
function welcome(p, hold) {
  WHO = p; S.screen = 'door'; S.door = 'welcome'; S.fp = 'idle'; S.anim.rise = true; render();
  if (!hold) later(enter, 2050);
}
function enter() { clearTimers(); S.screen = 'till'; S.focus = 'scan'; render(); }
function commit(approver) {
  const m = MODES[S.mode], from = fromOf(), lines = draft();
  lines.forEach(l => {
    if (from in IDX) S.stock[l.sku][IDX[from]] -= l.qty;
    if (m.to in IDX) S.stock[l.sku][IDX[m.to]] += l.qty;
  });
  const h = { no: ++S.seq, at: now(), mode: S.mode, from, to: m.to, lines: lines.map(l => ({ sku: l.sku, qty: l.qty, why: l.why })), by: WHO.name };
  S.history.unshift(h);
  S.drafts[S.mode] = []; S.sel = 0;
  if (S.mode === 'in') S.sj = null;
  toast('ok', S.mode === 'in' ? 'Barang diterima' : S.mode === 'ho' ? 'Dikirim ke HO' : 'Barang dipindah', `${pcsText(pieces(h.lines))} · ${routeText(h)} · PB-${p2(Math.floor(h.no / 100))}${p2(h.no % 100)}${approver ? ` · disetujui ${approver.name}` : ''}`);
}
/* A line's quantity, typed: Tab from the scan field (or a click on the number)
   selects it, digits replace it, Enter goes back to the scan field. */
function editQty(i) { if (!draft()[i]) return; S.sel = i; S.focus = `qty-${i}`; S.selectAll = true; }
function readTags() {
  S.reading = true; render();
  setTimeout(() => {
    S.reading = false;
    const pick = S.mode === 'back' || S.mode === 'reject' ? ['10052740207', '10081109015', '10056091022'] : ['10021345104', '10034567211', '10052740207'];
    pick.forEach(sku => addSku(sku));
    render();
  }, 700);
}

function act(name, arg) {
  switch (name) {
    case 'key':
      if (MODES[arg]) setMode(arg);
      else if (S.list === arg) act('back');
      else { S.list = arg; S.open = null; S.find = ''; S.focus = 'find'; }
      break;
    case 'from': S.from[S.mode] = arg; break;
    case 'row': S.sel = Number(arg); break;
    case 'qty': { const [i, d] = arg.split(':').map(Number); const l = draft()[i]; if (l) { l.qty = Math.max(0, l.qty + d); S.sel = i; } break; }
    case 'why': { const [i, w] = arg.split(':'); const l = draft()[Number(i)]; if (l) { l.why = w; S.sel = Number(i); } break; }
    case 'rm': draft().splice(Number(arg), 1); S.sel = Math.max(0, Math.min(S.sel, draft().length - 1)); break;
    case 'clear': S.drafts[S.mode] = []; if (S.mode === 'in') S.sj = null; S.sel = 0; break;
    case 'save': save(); break;
    case 'nudge': { const l = draft()[S.sel]; if (l && !S.list) l.qty = Math.max(0, l.qty + Number(arg)); break; }
    case 'finger': finger(arg); return;
    case 'supFinger': supFinger(arg); return;
    case 'supCancel': clearTimers(); S.sup = null; break;
    case 'skipWelcome': enter(); return;
    case 'lock': clearTimers(); S.sup = null; S.screen = 'door'; S.door = 'touch'; S.fp = 'idle'; S.anim.lift = true; break;
    case 'open': S.open = Number(arg); break;
    case 'back': if (S.open) S.open = null; else { S.list = null; S.find = ''; S.focus = 'scan'; } break;
    case 'print': toast('ok', 'Mencetak surat jalan', `PB-${p2(Math.floor(S.open / 100))}${p2(S.open % 100)}`); break;
  }
  render();
}
frame.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.bind === 'qty') { editQty(Number(e.target.dataset.arg)); render(); return; }
  const el = e.target.closest('[data-act]');
  if (el && frame.contains(el)) act(el.dataset.act, el.dataset.arg);
});
frame.addEventListener('input', e => {
  const b = e.target.dataset && e.target.dataset.bind;
  if (b === 'scan') { S.scanVal = e.target.value; if (S.scanErr) { S.scanErr = null; render(); } }
  if (b === 'find') { S.find = e.target.value; render(); }
  if (b === 'qty') { const i = Number(e.target.dataset.arg), l = draft()[i]; if (l) { l.qty = Number(e.target.value.replace(/\D/g, '').slice(0, 4) || 0); S.sel = i; } render(); }
});
const FK = { F1: 'in', F2: 'floor', F3: 'back', F4: 'reject', F5: 'ho', F9: 'check', F10: 'history' };
document.addEventListener('keydown', e => {
  const k = e.key;
  if (/^F([1-9]|1[0-2])$/.test(k)) e.preventDefault();
  if (S.screen === 'door') {
    if (S.door === 'touch' && k === 'Enter') { e.preventDefault(); finger('dimas'); }
    else if (S.door === 'welcome' && (k === 'Enter' || k === ' ')) { e.preventDefault(); enter(); }
    return;
  }
  if (S.sup) {
    if (k === 'Escape') act('supCancel');
    else if (k === 'Enter') supFinger(SUPERVISOR.id);
    e.preventDefault(); return;
  }
  if (k === 'F6') { if (!S.list) act('clear'); return; }
  if (FK[k]) { act('key', FK[k]); return; }
  if (k === 'F12') { if (!S.list) act('save'); return; }
  const target = e.target.dataset ? e.target.dataset.focus : null;
  if (k === 'Escape') { if (S.list) act('back'); else { S.scanVal = ''; S.scanErr = null; S.focus = 'scan'; render(); } e.preventDefault(); return; }
  if (S.list === 'history' && S.open && k === 'Enter') { act('print'); e.preventDefault(); return; }
  if (S.list) return;
  if (e.target.dataset && e.target.dataset.bind === 'qty') {
    const i = Number(e.target.dataset.arg);
    if (k === 'Enter' || k === 'Tab') { e.preventDefault(); S.focus = 'scan'; render(); return; }
    if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); editQty(Math.max(0, Math.min(draft().length - 1, i + (k === 'ArrowDown' ? 1 : -1)))); render(); return; }
    if (k.length === 1 && !/\d/.test(k)) e.preventDefault();
    return;
  }
  const lines = draft(), empty = !(target === 'scan' ? e.target.value : S.scanVal).trim();
  if (k === 'Tab' && !e.shiftKey && empty && lines[S.sel]) { e.preventDefault(); editQty(S.sel); render(); return; }
  if (k === 'Enter') { e.preventDefault(); scan(target === 'scan' ? e.target.value : S.scanVal); render(); return; }
  if (k === 'ArrowDown' && lines.length) { S.sel = Math.min(lines.length - 1, S.sel + 1); render(); e.preventDefault(); return; }
  if (k === 'ArrowUp' && lines.length) { S.sel = Math.max(0, S.sel - 1); render(); e.preventDefault(); return; }
  if (lines[S.sel] && (e.code === 'NumpadAdd' || (empty && k === '+'))) { e.preventDefault(); act('qty', `${S.sel}:1`); return; }
  if (lines[S.sel] && (e.code === 'NumpadSubtract' || (empty && k === '-'))) { e.preventDefault(); act('qty', `${S.sel}:-1`); return; }
  if (lines[S.sel] && empty && k === 'Delete') { act('rm', String(S.sel)); return; }
});

/* ── Prototype chrome: steps, sizes, the reader ──────────────────────── */
const STEPS = [
  ['door', 'Jari'], ['welcome', 'Selamat datang'], ['floor', 'Gudang → Toko'], ['in', 'Terima surat jalan'], ['back', 'Toko → Gudang'], ['reject', 'Reject'], ['approve', 'Kepala toko'], ['ho', 'Kirim HO'], ['check', 'Cek stok'], ['history', 'Riwayat'], ['open', 'Riwayat dibuka'],
];
const SIZES = { full: null, '1366': [1366, 768], '1920': [1920, 1080], '1024': [1024, 768] };
const SIZE_ORDER = ['full', '1366', '1920', '1024'];
let step = 'floor', lastChrome = '';
function reset() {
  clearTimers(); S.screen = 'till'; S.door = 'touch'; S.fp = 'idle'; S.sup = null; WHO = PEOPLE.dimas;
  S.drafts = {}; S.from = {}; S.sj = null; S.list = null; S.open = null; S.find = ''; S.sel = 0; S.scanErr = null;
  S.stock = JSON.parse(JSON.stringify(STOCK0)); S.seq = 41; seedHistory();
}
function goStep(id) {
  step = id; reset();
  switch (id) {
    case 'door': S.screen = 'door'; break;
    case 'welcome': welcome(PEOPLE.dimas, true); return;
    case 'approve': setMode('reject'); addSku('10034567211', 1); draft()[0].why = 'Rusak'; addSku('10056012031', 1); draft()[1].why = 'Cacat'; askSupervisor('Reject barang', commit); break;
    case 'floor': setMode('floor'); addSku('10021345104', 2); addSku('10052740207', 3); addSku('10081109015', 6); addSku('10066015118', 4); break;
    case 'in': setMode('in'); loadSj('SJ-000007'); S.drafts.in[2].qty = 7; S.sel = 2; break;
    case 'back': setMode('back'); addSku('10056091022', 2); addSku('10052740207', 1); break;
    case 'reject': setMode('reject'); addSku('10034567211', 1); draft()[0].why = 'Rusak'; addSku('10056012031', 1); break;
    case 'ho': setMode('ho'); addSku('10034567211', 1); addSku('10056091022', 2); addSku('10092199210', 1); break;
    case 'check': setMode('floor'); S.list = 'check'; S.focus = 'find'; break;
    case 'history': setMode('floor'); S.list = 'history'; S.focus = 'find'; break;
    case 'open': setMode('floor'); S.list = 'history'; S.open = S.history[1].no; break;
  }
  render();
}
function simButtons() {
  const b = (l, a) => `<button class="c-btn" data-sim="${a}">${l}</button>`;
  if (S.screen === 'door') return S.door === 'touch'
    ? `<span class="c-lbl">Jari di sensor</span>${b('Dimas Saputra', 'f:dimas')}${b('Rizky Pratama', 'f:rizky')}${b('Bima Prasetyo · Kepala toko', 'f:bima')}${b('Jari tak dikenal', 'f:x')}<span class="c-lbl" style="margin-left:6px">Enter = Dimas</span>`
    : `${b('Ulangi selamat datang', 'replay')}<span class="c-lbl" style="margin-left:6px">Klik atau Enter masuk</span>`;
  if (S.sup) return `<span class="c-lbl">Jari di sensor</span>${b('Bima Prasetyo · Kepala toko', 's:bima')}${b('Dimas (bukan kepala toko)', 's:dimas')}<span class="c-lbl" style="margin-left:6px">Enter = Bima · Esc batal</span>`;
  if (S.list) return '';
  return `<span class="c-lbl">Reader</span>${b('3 barang di reader', 'read')}${S.mode === 'in' ? b('Scan SJ-000007', 'sj') : ''}<span class="c-lbl" style="margin-left:6px">F1 terima · F2 ke toko · F3 ke gudang · F4 reject · F5 kirim HO · F9 cek stok · F10 riwayat · F6 kosongkan · F12 simpan · Tab atau klik angka untuk ketik jumlah · + − tambah/kurangi · Delete hapus</span>`;
}
function renderChrome() {
  const steps = STEPS.map(([id, label], i) => `<button class="${id === step ? 'on' : ''}" data-step="${id}"><b>${i + 1}</b>${label}</button>`).join('');
  const sizes = SIZE_ORDER.map(k => `<button class="${S.size === k ? 'on' : ''}" data-size="${k}">${k === 'full' ? 'Layar penuh' : `${SIZES[k][0]} × ${SIZES[k][1]}`}</button>`).join('');
  const sims = simButtons();
  const sig = steps + sizes + sims;
  if (sig === lastChrome) return;
  lastChrome = sig;
  document.getElementById('c-steps').innerHTML = steps;
  document.getElementById('c-size').innerHTML = sizes;
  const simRow = document.getElementById('c-sim');
  simRow.innerHTML = sims; simRow.style.display = sims ? '' : 'none';
  layout();
}
document.getElementById('chrome').addEventListener('click', e => {
  const st = e.target.closest('[data-step]'); if (st) { goStep(st.dataset.step); return; }
  const sz = e.target.closest('[data-size]'); if (sz) { S.size = sz.dataset.size; lastChrome = ''; layout(); render(); return; }
  const sm = e.target.closest('[data-sim]');
  if (sm) {
    const a = sm.dataset.sim;
    if (a.startsWith('f:')) finger(a.slice(2)); else if (a.startsWith('s:')) supFinger(a.slice(2));
    else if (a === 'replay') { clearTimers(); welcome(PEOPLE.dimas, true); }
    else if (a === 'read') readTags(); else { loadSj('SJ-000007'); render(); }
    return;
  }
  if (e.target.closest('#c-hide')) { document.getElementById('chrome').classList.toggle('hidden'); document.body.classList.toggle('bare'); layout(); }
});
function layout() {
  const ch = document.getElementById('chrome');
  const bare = ch.classList.contains('hidden');
  const stage = document.getElementById('stage');
  stage.style.top = (bare ? 0 : ch.offsetHeight) + 'px';
  const full = S.size === 'full';
  document.body.classList.toggle('full', full);
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const [w, h] = full ? [Math.max(1024, sw), Math.max(640, sh)] : SIZES[S.size];
  const pad = bare || full ? 0 : 24;
  const sc = Math.min(1, (sw - pad) / w, (sh - pad) / h);
  SCALE = sc;
  holder.style.width = Math.round(w * sc) + 'px';
  holder.style.height = Math.round(h * sc) + 'px';
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  frame.style.transform = `scale(${sc})`;
  frame.dataset.size = w >= 1700 ? '1920' : w < 1200 ? '1024' : '1366';
}
window.addEventListener('resize', layout);
setInterval(() => { frame.querySelectorAll('[data-clock]').forEach(el => { el.textContent = el.dataset.clock === 'hm' ? hm(now()) : dayTime(now()); }); }, 10000);

const HASH = (location.hash || '').slice(1);
goStep(STEPS.some(([id]) => id === HASH) ? HASH : 'floor');
layout();
})();
</script>
