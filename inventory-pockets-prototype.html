<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inventory pockets</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Inventory is pockets. Every place stock can stand in is a pocket; a
   movement is a piece leaving one pocket for another. Big pockets hold small
   ones: the Gudang holds its stages, Stores holds each store.
   Same pocket as Articles (articles-pockets-prototype.html): soft grey, one
   dashed stitch, colour only on the pieces. Hub tokens, Inter 14, charcoal
   sidebar. What the pocket shows, besides its number:
     • pieces peeking out of the top — what is in it (fuller = more);
     • a piece fallen under the point — missing stock;
     • a ghost piece — a tag the reader saw somewhere else;
     • a faded pocket — its store server is silent, we can't see inside;
     • "Checked 21 Sep" under the name, amber after three weeks.
   Nothing below 14px.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --ink:#20242c; --text:#394150; --body:#626b78; --mute:#737c89; --faint:#b9c0c9; --line-ico:#89919d;
  --canvas:#fff; --soft:#f8f9fb; --soft-2:#f0f2f5; --soft-3:#f5f6f8; --pk:#eef0f3; --pk-in:#fff;
  --hairline:#e7eaf0; --hairline-2:#dce1e8; --stitch:#c3c9d2;
  --accent:#2563eb; --accent-ink:#1d4ed8; --accent-bg:#eff5ff;
  --warn:#d99a2b; --warn-fg:#b45309; --bad:#e25555; --bad-fg:#c0263b;
  --rail:#242526; --rail-2:#303234; --rail-3:#393b3d; --rail-ink:#fff; --rail-text:#c3c4c7; --rail-mute:#a1a3a8; --rail-hair:#343638;
  --r-card:12px; --ease-out:cubic-bezier(.23,1,.32,1); --spring:cubic-bezier(.34,1.3,.64,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --shadow-pop:0 4px 8px rgb(24 39 60/4%),0 16px 40px rgb(24 39 60/12%);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#f1f3f6; --text:#d3d7de; --body:#a4aab4; --mute:#8b919b; --faint:#5b616b; --line-ico:#8b919b;
  --canvas:#17181a; --soft:#1e2023; --soft-2:#26282c; --soft-3:#1c1e21; --pk:#2a2c30; --pk-in:#202225;
  --hairline:#2c2f34; --hairline-2:#363a40; --stitch:#50555e;
  --accent:#4f83f5; --accent-ink:#8cb0ff; --accent-bg:#1c2a44; --warn-fg:#f0b44f; --bad-fg:#ff8a8a;
  --rail:#101112; --rail-2:#1c1d1f; --rail-3:#26272a; --rail-hair:#222325; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#f1f3f6; --text:#d3d7de; --body:#a4aab4; --mute:#8b919b; --faint:#5b616b; --line-ico:#8b919b;
  --canvas:#17181a; --soft:#1e2023; --soft-2:#26282c; --soft-3:#1c1e21; --pk:#2a2c30; --pk-in:#202225;
  --hairline:#2c2f34; --hairline-2:#363a40; --stitch:#50555e;
  --accent:#4f83f5; --accent-ink:#8cb0ff; --accent-bg:#1c2a44; --warn-fg:#f0b44f; --bad-fg:#ff8a8a;
  --rail:#101112; --rail-2:#1c1d1f; --rail-3:#26272a; --rail-hair:#222325; color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas)}
body{font:400 14px/20px Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* prototype bar */
.proto{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:8px 20px;background:var(--soft);border-bottom:1px solid var(--hairline);color:var(--body)}
.proto b{color:var(--ink);font-weight:600}
.tg{display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hairline)}
.seg button{height:28px;padding:0 10px;border-radius:7px;color:var(--body);font-weight:500;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--soft-2);color:var(--ink)}
.proto .sp{flex:1}
.proto .th{height:30px;width:34px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hairline);text-align:center}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{background:var(--rail);color:var(--rail-text);padding:14px 10px;display:flex;flex-direction:column;gap:1px;position:sticky;top:45px;height:calc(100vh - 45px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:var(--rail-ink);font-weight:600;font-size:15px}
.mark{width:26px;height:26px;border-radius:7px;background:#000;box-shadow:inset 0 0 0 1px #3a3b3d;display:grid;place-items:center;font-weight:600;color:#fff;position:relative}
.mark::after{content:"";position:absolute;right:4px;bottom:5px;width:5px;height:5px;border-radius:50%;background:#2563eb}
.row{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:8px;color:var(--rail-text);white-space:nowrap;width:100%}
.row:hover{background:var(--rail-2);color:var(--rail-ink)}
.row .i{color:var(--rail-mute)}
.row.on{color:var(--rail-ink);font-weight:500}
.row.on .i{color:var(--rail-ink)}
.row .ct{margin-left:auto;color:var(--rail-mute)}
.subs{margin:2px 0 8px 16px;padding-left:12px;border-left:1px solid var(--rail-hair);display:flex;flex-direction:column;gap:1px}
.sub{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:7px;color:var(--rail-text);width:100%}
.sub:hover{background:var(--rail-2);color:var(--rail-ink)}
.sub[aria-current]{background:var(--rail-3);color:var(--rail-ink);font-weight:500}
.sub .ct{margin-left:auto;color:var(--rail-mute)}

main{min-width:0;padding:22px 32px 96px}
.wrap{max-width:1160px;margin:0 auto}
.hd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hd h1{font-size:17px;line-height:24px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.hd .pcs{color:var(--body);margin-bottom:1px}
.hd .act{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;font-weight:500;white-space:nowrap;transition:background-color .15s,transform .16s var(--ease-out)}
.btn:active{transform:scale(.98)}
.btn-g{box-shadow:inset 0 0 0 1px var(--hairline-2);color:var(--text);background:var(--canvas)}
.btn-g:hover{background:var(--soft)}
.btn-g .i{color:var(--line-ico)}
.btn-p{background:var(--ink);color:var(--canvas)}
.big{position:relative;display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;background:var(--canvas);border:1px solid var(--hairline-2);border-radius:8px;box-shadow:0 1px 3px rgb(24 39 60/4%);transition:border-color .15s,box-shadow .15s}
.big:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.big .i{color:var(--line-ico)}
.big input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink)}
.big input::placeholder{color:var(--mute)}
.scope{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:6px;background:var(--accent-bg);color:var(--accent-ink);font-weight:500;white-space:nowrap}
.scope button{color:var(--accent-ink);border-radius:4px;width:22px;height:22px;display:grid;place-items:center}
.sugg{position:absolute;top:48px;left:0;right:0;z-index:30;background:var(--canvas);border:1px solid var(--hairline);border-radius:10px;box-shadow:var(--shadow-pop);padding:6px;display:none}
.big.open .sugg{display:block;animation:pop .16s var(--ease-out)}
.sugg button{display:flex;width:100%;gap:10px;align-items:center;padding:6px 8px;border-radius:7px}
.sugg button:hover,.sugg button.hl{background:var(--soft-2)}
.sugg .gm{width:30px;height:30px}
.sugg .c{margin-left:auto;color:var(--mute)}
.hint{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);margin:8px 2px 0}
.hint .w{color:var(--warn-fg)}
.hint .b{color:var(--bad-fg)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}

/* ── big pocket: a place that holds places ─────────────────────────── */
.hold{position:relative;margin-top:28px;padding:18px 20px 44px;isolation:isolate}
.hold>.bg{position:absolute;inset:0;z-index:-1;background:var(--soft-3);clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),50% 100%,0 calc(100% - 30px));border-radius:14px 14px 0 0}
.hold>.bg svg{position:absolute;inset:6px 6px 4px;width:calc(100% - 12px);height:calc(100% - 10px);overflow:visible}
.hold>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hold>header .nm{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:15px}
.hold>header .nm .tw{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--mute);transition:transform .25s var(--ease-out),background-color .15s}
.hold>header .nm:hover .tw{background:var(--soft-2);color:var(--ink)}
.hold.shut>header .nm .tw{transform:rotate(-90deg)}
.hold>header .v{font-weight:600;color:var(--ink);font-size:20px;line-height:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hold>header .s{color:var(--mute)}
.hold>header .p{color:var(--warn-fg)}
.hold .inner{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;margin-top:14px}
.hold .inner.road{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
/* a hold inside a hold (a city inside Stores) */
.hold .hold{margin-top:0;padding:14px 12px 36px;grid-column:span 2;min-width:0}
.hold .hold>.bg{background:var(--canvas)}
.hold .hold .inner{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.hold .hold .pk{background:var(--pk)}
.thread{height:28px;margin:0 auto;width:0;border-left:1.5px dashed var(--stitch)}

/* ── small pocket: one place ───────────────────────────────────────── */
.pocket{position:relative;border-radius:var(--r-card);padding:8px 8px 10px;cursor:pointer;outline:0;transition:background-color .15s}
.pocket:hover,.pocket:focus-visible,.pocket[aria-current]{background:var(--canvas);box-shadow:0 0 0 1px var(--hairline)}
.hold .hold .pocket:hover,.hold .hold .pocket[aria-current]{background:var(--soft-3)}
.bag{position:relative;height:118px}
.peek{position:absolute;inset:0 0 auto;height:70px;z-index:1}
.peek .gm{position:absolute;width:62px;height:62px;left:calc(50% - 31px);top:4px;filter:drop-shadow(0 3px 4px rgb(24 39 60/.12));transition:transform .45s var(--spring)}
.peek .gm:nth-child(1){transform:translate(-24px,12px) rotate(-12deg)}
.peek .gm:nth-child(2){transform:translate(0,4px)}
.peek .gm:nth-child(3){transform:translate(24px,12px) rotate(12deg)}
.peek .gm:only-child{transform:translate(0,14px)}
.pocket:hover .peek .gm:nth-child(1){transform:translate(-30px,2px) rotate(-16deg)}
.pocket:hover .peek .gm:nth-child(2){transform:translate(0,-6px)}
.pocket:hover .peek .gm:nth-child(3){transform:translate(30px,2px) rotate(16deg)}
.pocket:hover .peek .gm:only-child{transform:translate(0,4px)}
.peek .gm.ghost{opacity:.55;filter:none}
.peek .gm.ghost path{fill:none!important;stroke:var(--warn)!important;stroke-dasharray:3 3}
.pk{position:absolute;left:6%;right:6%;bottom:0;height:62px;z-index:2;background:var(--pk-in);box-shadow:inset 0 0 0 1px var(--hairline);clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%)}
.hold .pk{background:var(--pk-in)}
.pk svg.st{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pk .n{position:absolute;left:0;right:0;top:12px;text-align:center;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.fell{position:absolute;z-index:3;right:4%;bottom:-16px;width:36px;height:36px;transform:rotate(28deg);filter:drop-shadow(0 2px 3px rgb(24 39 60/.15));animation:fall 1.1s var(--spring) both}
.fell.extra{left:4%;right:auto;transform:rotate(-24deg)}
@keyframes fall{from{transform:translate(-14px,-30px) rotate(0);opacity:0}}
.fell .gm{width:36px;height:36px}
.pocket.silent .bag{opacity:.45;filter:grayscale(1)}
.lb{margin-top:12px;text-align:center;min-width:0}
.lb b{display:block;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb span{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .old{color:var(--warn-fg)}
.lb .pw{color:var(--warn-fg)}
.lb .pb{color:var(--bad-fg)}
.search-on .pk .n{color:var(--accent-ink)}

/* a folded hold: one wide pocket with its small pockets peeking out */
.folded{display:flex;justify-content:center;margin-top:10px}
.folded .pocket{width:260px}
.folded .bag{height:130px}
.folded .peek .mini{position:absolute;width:62px;height:52px;left:calc(50% - 31px);top:10px;transition:transform .45s var(--spring)}
.folded .peek .mini:nth-child(1){transform:translate(-56px,14px) rotate(-10deg)}
.folded .peek .mini:nth-child(2){transform:translate(0,2px)}
.folded .peek .mini:nth-child(3){transform:translate(56px,14px) rotate(10deg)}
.folded .pocket:hover .peek .mini:nth-child(2){transform:translate(0,-8px)}
.mini .pk{position:absolute;inset:0;height:auto;left:0;right:0;background:var(--pk)}
.mini .pk .n{top:8px;font-size:14px;font-weight:500;color:var(--body)}

/* ── the panel for one pocket ─────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:60;background:rgb(255 255 255/.5);opacity:0;pointer-events:none;transition:opacity .25s var(--ease-out)}
:root[data-theme=dark] .scrim{background:rgb(0 0 0/.45)}
.sheet{position:fixed;top:12px;right:12px;bottom:12px;width:min(440px,calc(100vw - 24px));z-index:61;background:var(--canvas);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow-pop);transform:translateX(calc(100% + 24px));transition:transform .38s var(--ease-drawer);display:flex;flex-direction:column;overflow:hidden}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sh{display:flex;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--hairline)}
.sh .tx{flex:1;min-width:0}
.sh .k{color:var(--mute)}
.sh h2{font-size:17px;line-height:24px;font-weight:600;color:var(--ink)}
.sh .v{margin-top:4px;font-size:30px;line-height:36px;font-weight:600;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sh .v small{font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;margin-left:6px}
.x{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--body);flex:none}
.x:hover{background:var(--soft-2)}
.sb{flex:1;overflow:auto;padding:0 20px 20px}
.h2{margin:18px 0 6px;font-weight:600;color:var(--ink)}
.h2 span{font-weight:400;color:var(--mute)}
.eq button{display:flex;align-items:center;width:100%;min-height:40px;gap:10px;border-bottom:1px solid var(--hairline);padding:0 4px}
.eq button:hover{background:var(--soft)}
.eq .op{width:14px;color:var(--mute);text-align:center}
.eq .k{flex:1}
.eq .k small{font-size:inherit;color:var(--mute);margin-left:6px}
.eq .n{font-variant-numeric:tabular-nums}
.eq .start{color:var(--body);cursor:default}
.eq .tot{font-weight:600;color:var(--ink);border-bottom:0;border-top:1px solid var(--hairline-2);cursor:default}
.eq .start:hover,.eq .tot:hover{background:none}
.mv{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease-out)}
.mv.on{grid-template-rows:1fr}
.mv>div{min-height:0;overflow:hidden}
.mv p{display:flex;gap:10px;padding:8px 4px 8px 28px;color:var(--body);border-bottom:1px solid var(--hairline)}
.mv p span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline)}
.chk .tx{flex:1}
.t2{color:var(--mute)}
.prob{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--hairline)}
.prob .dot{margin-top:7px;width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.prob.bad .dot{background:var(--bad)}
.prob .tx{flex:1}
.go{color:var(--accent-ink);font-weight:500;white-space:nowrap}
.none{color:var(--mute);padding:10px 0}
.inside{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px;margin-top:4px}
.inside div{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:8px}
.inside .gm{width:44px;height:44px}
.inside span{color:var(--body);font-variant-numeric:tabular-nums}

/* counts / setup */
.list{margin-top:8px;border-top:1px solid var(--hairline)}
.lg{margin-top:22px;color:var(--mute);font-weight:500}
.li{display:flex;align-items:center;gap:14px;min-height:52px;padding:8px 10px;border-bottom:1px solid var(--hairline);width:100%}
.li:hover{background:var(--soft)}
.li .i{color:var(--line-ico)}
.li .tx{flex:1;min-width:0}
.li .t1{color:var(--ink);font-weight:500}
.li .r{color:var(--body);font-variant-numeric:tabular-nums}
.li .r.b{color:var(--bad-fg)}
.page{animation:page-in .3s var(--ease-out)}
@keyframes page-in{from{opacity:0;transform:translateY(6px)}}
.gm{display:block;overflow:visible}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px 16px}
  .side .brand,.side .row:not(.on){display:none}
  .side .subs{flex-direction:row;margin:0;border:0;padding:0}
  main{padding:18px 16px 80px}
  .hold{padding:14px 12px 40px}
  .hold .inner{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hold .hold{grid-column:1/-1}
  .proto{padding:8px 16px;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="g-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".14"/></linearGradient>
</defs></svg>
<div class="proto">
  <b>Inventory as pockets</b>
  <div class="tg">Stores <div class="seg" data-tg="city"><button data-v="flat">one pocket</button><button data-v="city">pocket per city</button></div></div>
  <div class="tg">Gudang <div class="seg" data-tg="gd"><button data-v="open">open</button><button data-v="shut">folded</button></div></div>
  <div class="sp"></div>
  <button class="th" id="theme" title="Light / dark">◐</button>
</div>
<div class="app">
  <nav class="side" id="side" aria-label="Sidebar"></nav>
  <main><div class="wrap" id="main"></div></main>
</div>
<div id="pw"><div class="scrim" data-close></div><aside class="sheet" id="sheet" aria-label="Pocket"></aside></div>

<script>
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.3h8.6a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/>',
  shirt:'<path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3a4 4 0 0 1-8 0z"/>',
  forklift:'<path d="M4 17V7h6l3 5v5M13 12h4V4M17 17h4"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  tag:'<path d="M3 3h8l10 10-8 8L3 11z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  receipt:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',

function edge(hex){const v=parseInt(hex.slice(1),16),r=v>>16,g=v>>8&255,b=v&255,l=(r*299+g*587+b*114)/255000

const hash = (s) => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return ((h >>> 0) % 1000) / 1000 }
const vOf = (l) => state.art ? Math.round(l.v * state.art.s * (0.4 + 1.2 * hash(l.id + state.art.c))) : l.v
const pbOf = (l) => !l.pb ? null : !state.art ? l.pb : (l.pb.art === state.art.c ? l.pb : null)

/* What peeks out: fuller pockets show more pieces. */
function peek(l, max) {
  if (state.art) { const v = vOf(l); return v ? Array.from({length: v > 40 ? 3 : v > 8 ? 2 : 1}, () => garment(state.art.k, state.art.h)).join("") : "" }
  if (l.koli || l.id.startsWith("sj")) return Array.from({length: l.v > 150 ? 3 : 2}, () => garment("koli", "#cfa574")).join("")
  const count = l.v > max * .45 ? 3 : l.v > max * .12 ? 2 : 1
  const pick = [...ART].sort((a, b) => hash(l.id + a.c) - hash(l.id + b.c)).slice(0, count)
  let out = pick.map(a => garment(a.k, l.grey ? GREY : a.h))
  const p = pbOf(l)
  if (p && p.look === "ghost") out[out.length - 1] = garment(pick[pick.length - 1].k, "#ffffff", "ghost")
  return out.join("")
}
function ckLine(l) {
  if (l.note) return `<span>${l.note}</span>`

function pocket(l, max) {
  const p = pbOf(l), v = vOf(l)
  // the piece that fell out is the article that is missing, when we know it
  const who = state.art || ART.find(a => a.c === p?.art)
  const boxy = !who && (l.koli || l.id.startsWith("sj"))
  const fell = p && (p.look === "fell" || p.look === "extra")
    ? `<div class="fell${p.look === "extra" ? " extra" : ""}" title="${p.t}">${boxy ? garment("koli", "#cfa574") : garment((who || ART[0]).k, (who || ART[0]).h)}</div>` : ""
  return `<div class="pocket${p?.look === "silent" ? " silent" : ""}" tabindex="0" role="button" data-id="${l.id}"${state.place === l.id ? " aria-current=true" : ""}>

}

function hold(id, name, leaves, opts = {}) {
  const shut = opts.folded ?? state.shut[id]
  const ps = leaves.map(pbOf).filter(Boolean)
  const max = Math.max(...leaves.map(l => l.v))

  const body = shut
    ? `<div class="folded"><div class="pocket" data-fold="${id}"><div class="bag"><div class="peek">${leaves.slice(0, 3).map(l => `<div class="mini"><div class="pk">${stitch()}<span class="n">${n(vOf(l))}</span></div></div>`).join("")}</div><div class="pk">${stitch()}<span class="n">${n(sum(leaves))}</span></div></div><div class="lb"><span>${leaves.length} pockets inside · open to see them</span></div></div></div>`

}

function storesBody() {

const MV = {"Went in":["SJ-210926-003 · 96", "SJ-240926-008 · 84"], "Sold":["POS 1 · 212 receipts", "POS 2 · 176 receipts"], "Came back":["4 returns at the till"], "Went out":["SJ-270926-009", "Picked for 3 allotments"], "Missing":["Count CNT-0926", "Not found on the last sweep"]}

}
function render() {
  document.querySelectorAll(".seg").forEach(s => s.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", state[s.dataset.tg] === b.dataset.v)))
  document.querySelectorAll(".proto .tg").forEach(t => t.style.visibility = state.page === "stock" ? "" : "hidden")
  document.getElementById("side").innerHTML = side()
  document.getElementById("main").innerHTML = state.page === "counts" ? countsPage() : state.page === "setup" ? setupPage() : stockPage()
}

/* ── search ─────────────────────────────────────────────────── */
let hl = 0
function suggest(q) {
  const m = ART.filter(a => !q || a.a.toLowerCase().includes(q.toLowerCase()) || a.c.includes(q)); hl = 0
  document.getElementById("sugg").innerHTML = m.map((a, i) => `<button data-art="${a.c}" class="${i ? "" : "hl"}">${garment(a.k, a.h)}<span>${a.a}</span><span class="c">${a.c}</span></button>`).join("") || `<div class="none" style="padding:8px">No article like that</div>`
  document.getElementById("big").classList.add("open")
}
document.addEventListener("focusin", (e) => { if (e.target.id === "q" && !state.art) suggest(e.target.value) })
document.addEventListener("input", (e) => { if (e.target.id === "q") suggest(e.target.value) })
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closePocket(); document.getElementById("big")?.classList.remove("open"); return }
  if (e.key === "/" && e.target.tagName !== "INPUT") { e.preventDefault(); document.getElementById("q")?.focus() }
  if (e.target.id === "q") {
    const bs = [...document.querySelectorAll("#sugg button")]
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); hl = (hl + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length; bs.forEach((b, i) => b.classList.toggle("hl", i === hl)) }
    if (e.key === "Enter" && bs[hl]) bs[hl].click()
    if (e.key === "Backspace" && !e.target.value && state.art) { state.art = null; render(); document.getElementById("q").focus() }
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("pocket")) { e.preventDefault(); e.target.click() }
})
document.addEventListener("click", (e) => {
  const t = e.target
  if (!t.closest("#big")) document.getElementById("big")?.classList.remove("open")
  const seg = t.closest(".seg button"); if (seg) { state[seg.parentElement.dataset.tg] = seg.dataset.v; if (seg.parentElement.dataset.tg === "gd") delete state.shut.gudang; render(); return }
  const pg = t.closest("[data-page]"); if (pg) { state.page = pg.dataset.page; closePocket(); render(); return }
  const art = t.closest("[data-art]"); if (art) { e.preventDefault(); state.art = ART.find(a => a.c === art.dataset.art); render(); return }
  if (t.closest("[data-clear]")) { e.preventDefault(); state.art = null; render(); return }
  const fold = t.closest("[data-fold]"); if (fold) {
    const id = fold.dataset.fold, isShut = !!document.querySelector(`[data-hold="${id}"]`)?.classList.contains("shut")
    state.shut[id] = !isShut; render(); return
  }
  const mv = t.closest("[data-mv]"); if (mv) { document.getElementById("mv" + mv.dataset.mv).classList.toggle("on"); return }
  if (t.closest("[data-close]")) { closePocket(); return }
  const pk = t.closest(".pocket[data-id]"); if (pk) openPocket(pk.dataset.id)
})
document.getElementById("theme").addEventListener("click", () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
  r.dataset.theme = dark ? "light" : "dark"
})
render()
</script>
</body>
</html>
