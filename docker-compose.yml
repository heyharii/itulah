services:
  postgres:
    # Same major version as CI (`ci.yml` runs `postgres:17`), so a local run
    # goes through the Postgres the gate does.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data

volumes:
  inventory_pgdata:
