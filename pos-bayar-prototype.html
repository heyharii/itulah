<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayar kasir</title>
<style>
:root{
  --ink:#1d1d1f;--body:#6e6e73;--faint:#c7c7cc;--stone:#e8ebf0;--hairline:#e8e8ec;--hairline-2:#dcdce1;--soft:#f2f2f5;
  --accent:#2862dc;--accent-bg:#eef3fc;--warn-bg:#faeacd;--warn-fg:#a66c1f;--bad:#d70015;--bad-bg:#fbeaea;--ok-fg:#248a3d;
  --font-sans:"Inter Variable",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--stone);color:var(--ink);font:15px/1.45 var(--font-sans);-webkit-font-smoothing:antialiased}
p{margin:0}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:14px 24px;background:rgba(232,235,240,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline-2)}
.top h1{margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.4px}
.grp{display:flex;align-items:center;gap:8px}
.grp .k{color:var(--body)}
.seg{display:inline-flex;flex-wrap:wrap;padding:2px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline-2)}
.seg button{height:32px;padding:0 12px;border:0;border-radius:7px;background:none;font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
main{padding:24px;display:flex;flex-direction:column;align-items:center;gap:28px}
/* The cashier's monitor at its real size, scaled to fit this page: the dialog
   takes the screen's height less a margin, so what fits here fits there. */
.mon{position:relative;flex:none}
.screen{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;place-items:center;background:rgba(29,29,31,.32);border-radius:6px;overflow:hidden}
.screen .pay{width:min(1100px,calc(100% - 32px));height:calc(100% - 32px);max-width:none;grid-template-rows:auto minmax(0,1fr)}
.screen .pay-l{min-height:0;overflow:hidden}
/* The band never leaves the screen: only the rows give way, scrolling last. */
.screen .rows{flex:0 1 auto;min-height:0;overflow:auto}
.screen .foot{flex:none}
.screen .pay-r{min-height:0}
.mon-cap{color:var(--body)}
/* On the till the dialog is most of the screen: everything a size up. */
.screen .pay{width:min(1400px,calc(100% - 48px));height:min(900px,calc(100% - 48px));grid-template-columns:minmax(0,1fr) 460px}
.screen .pay-head{padding:18px 32px 16px}
.screen .ttl{font-size:20px}
.screen .pay-l{padding:22px 32px 0}
.screen .pay-r{padding:22px 28px 28px;gap:12px}
.screen .fig.lg .k{font-size:20px}
.screen .fig.lg .v{font-size:42px;line-height:50px}
.screen .mrow{grid-template-columns:140px minmax(0,1fr) 170px;min-height:54px;padding:5px 14px}
.screen .mrow .ml{font-size:17px}
.screen .amt{width:170px;height:48px;font-size:20px}
.screen .chip{height:32px;padding:0 12px;font-size:17px}
.screen .qrow{height:62px;padding:0 18px}
.screen .qrow b{font-size:24px}
.screen .qrow .l{font-size:17px}
.screen .btn{height:64px;font-size:17px}
.screen .due-box{padding:12px 16px;font-size:17px}
.screen .due-box b{font-size:24px}
.screen .foot{margin:16px -32px 0}
.screen .band{padding:18px 32px 22px}
.screen .band .k{font-size:22px}
.screen .band .v{font-size:44px;line-height:52px}
.screen .tell{padding:12px 16px;font-size:17px}

/* The Bayar dialog of the till: inputs left, quick amounts and the go right. */
.pay{width:1100px;max-width:100%;border-radius:16px;background:#fff;box-shadow:0 4px 8px rgba(24,39,60,.04),0 12px 32px rgba(24,39,60,.08);display:grid;grid-template-columns:minmax(0,1fr) 420px;overflow:hidden}
.pay-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:16px 28px 14px;border-bottom:1px solid var(--hairline)}
.ttl{font-size:17px;font-weight:600}
.cap{color:var(--body)}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--body)}
.pay-l{display:flex;flex-direction:column;padding:18px 28px 0;min-width:0;min-height:600px}
.pay-r{display:flex;flex-direction:column;gap:10px;padding:18px 24px 24px;border-left:1px solid var(--hairline)}

/* Figures to read: label left, figure right, one size per level. */
.fig{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.fig .k{font-size:17px;font-weight:600;color:var(--body)}
.fig .v{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fig.lg .k{color:var(--ink)}
.fig.lg .v{font-size:34px;line-height:42px;font-weight:700}
.fig.due .k,.fig.due .v{color:var(--bad)}
.fig .k{white-space:nowrap}
.pay-r .fig .v{font-size:24px;line-height:32px}
.pay-r .fig.lg .v{font-size:28px;line-height:36px}
.figs{display:flex;flex-direction:column;gap:2px;padding-bottom:16px;margin-bottom:12px;border-bottom:1px solid var(--hairline)}

/* Ways to pay: every way the shop takes, one row each, the same height. */
.rows{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:120px minmax(0,1fr) 160px;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border-radius:10px}
.mrow+.mrow{margin-top:2px}
.mrow.on{background:var(--accent-bg)}
.mrow .ml{font-weight:500}
.mrow.on .ml{color:var(--accent);font-weight:600}
.mrow .mid{color:var(--body);min-width:0}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 10px;margin-right:6px;border-radius:7px;background:var(--accent);color:#fff;font-weight:500}
.chip.idle{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hairline-2)}
.edc{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.eq{color:var(--body);margin-right:2px}
.chip.ask{border:0;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hairline-2);font:inherit;font-weight:500;cursor:pointer;gap:6px;margin:0}
.chip.ask:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip.ask .kbd{min-width:22px;height:20px;padding:0 4px}
.chip.pick{border:0;font:inherit;font-weight:500;cursor:pointer;gap:6px;margin:0}
.chip .xx{opacity:.75}
.screen .chip{height:34px;font-size:15px}
.screen .edc{flex-wrap:nowrap}
.edc .chip{flex:none;white-space:nowrap;padding:0 10px}
.edc .chip .kbd{min-width:20px;padding:0 4px}
.mrow .ml{white-space:nowrap}
.more{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:34px;margin:4px 0 4px 12px;padding:0 12px;border:0;border-radius:8px;background:var(--accent-bg);color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.ph{color:var(--faint);margin-right:8px}
.adds{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.adds .more{margin:0}
.more:disabled{background:var(--soft);color:var(--body);cursor:default}
.vin{width:240px;height:36px;padding:0 10px;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--accent);font:inherit;font-size:17px;letter-spacing:.04em;outline:none}
.vin.pts{width:110px;text-align:right;margin:0 8px}
.vin.code{width:110px;letter-spacing:.2em;margin:0 8px}
.pt-bal{color:var(--body)}
.pt-eq{margin-right:8px;font-weight:600}
.vin.bad{box-shadow:inset 0 0 0 1.5px var(--bad)}
.vin+.kbd{margin-left:6px}
.vbad{margin-left:8px;color:var(--bad);font-weight:600}
.ok-t{color:var(--ok-fg);font-weight:600}
.wait{color:var(--warn-fg);margin-right:8px}
.mid .chip.ask{margin-left:4px}
/* EDC answers (Hari, 28 Oct 2026): picked many times a day, often by key, so the
   motion is barely there — only the chip just picked and the next question
   come in; nothing leaves. State indication, not decoration. */
@keyframes chip-in{from{opacity:0;transform:translateX(-6px)}}
.edc .in{animation:chip-in 160ms cubic-bezier(0.23,1,0.32,1) both}
.edc .chip.ask.in{animation-delay:40ms}
.edc .chip.ask.in+.chip.ask.in{animation-delay:70ms}
.edc .chip.ask.in+.chip.ask.in+.chip.ask.in{animation-delay:100ms}
@media (prefers-reduced-motion:reduce){@keyframes chip-in{from{opacity:0}}}
/* Finger on the reader (Hari, 28 Oct 2026): a few times a day, so it may show
   life — the print wobbles while it is read (1.8 s), then settles green.
   State indication: the cashier sees the reader is working, not stuck. */
.fp{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:50%;background:var(--warn-bg);color:var(--warn-fg);vertical-align:middle}
.fp.reading svg{animation:fp-wobble 600ms cubic-bezier(0.77,0,0.175,1) infinite;transform-origin:50% 70%}
@keyframes fp-wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.fp.done{background:#d9f4d2;color:var(--ok-fg);animation:fp-in 200ms cubic-bezier(0.23,1,0.32,1)}
@keyframes fp-in{from{transform:scale(0.9);opacity:.6}}
@media (prefers-reduced-motion:reduce){.fp.reading svg{animation:fp-fade 900ms ease infinite alternate}@keyframes fp-fade{to{opacity:.4}}.fp.done{animation:none}}
.edc .chip.drop{margin-left:auto;gap:6px;padding:0 8px;border:0;background:var(--soft);color:var(--body);font:inherit;font-size:18px;cursor:pointer}
@media (hover:hover) and (pointer:fine){.edc .chip.drop:hover{background:var(--bad-bg);color:var(--bad)}}
.edc{width:100%}
.nopay{padding:14px 12px;color:var(--body);font-size:17px}
.amt{justify-self:end;width:160px;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline-2);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.mrow.on .amt{box-shadow:inset 0 0 0 1.5px var(--accent)}
.amt .cur{color:var(--body);font-size:15px;font-weight:500}
.amt.zero{color:var(--faint);font-weight:500}

/* Quick amounts: one clean row each, the key at the end. */
.qk{display:flex;flex-direction:column;gap:6px}
.qrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;height:50px;padding:0 14px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline-2)}
.qrow b{font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.qrow .l{color:var(--accent);font-weight:500}
.kbd{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;background:var(--soft);color:var(--body);font-size:15px;font-weight:500}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{height:56px;white-space:nowrap;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;font-weight:600;color:#fff;background:var(--accent)}
.btn .kbd{background:rgba(255,255,255,.18);color:#fff}
.act-row{display:flex;gap:8px}
.btn.red{flex:none;background:var(--bad)}
.btn.go{flex:1;min-width:0;padding:0 14px}
.btn.off{background:var(--soft);color:var(--body)}
.btn.off .kbd{background:#fff;color:var(--body)}
.due-line{display:flex;justify-content:flex-end;gap:8px;color:var(--bad);font-weight:500}
.due-line b{font-weight:700;font-variant-numeric:tabular-nums}
.due-box{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:600}
.due-box b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.btn.off b{color:var(--bad);font-variant-numeric:tabular-nums}

/* What the cashier must say: a red line per point, then the band. */
.tell{margin:0 0 8px;padding:10px 14px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-weight:600}
.tell.info{background:var(--accent-bg);color:var(--accent)}
.foot{margin:12px -28px 0}
.foot .tells{padding:0 28px}
.band{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:20px;padding:16px 28px 20px;background:var(--accent);color:#fff}
.band .k{font-size:20px;line-height:28px;font-weight:600;white-space:nowrap}
.band .tell{grid-column:1/-1;margin:0 0 8px;background:#fff}
.band .tell.info{background:#fff}
.band .tell+.k{margin-top:4px}
.band .tell.card{display:flex;flex-direction:column;gap:4px;color:var(--bad)}
.band .ln.ok{color:var(--ok-fg);display:flex;flex-wrap:wrap;column-gap:10px}
.band .ln.info{color:var(--accent)}
/* W2: no white card — the lines sit on the blue, white, a rule under them. */
.band .tell.card.bare{background:none;padding:0 0 12px;margin-bottom:10px;border-radius:0;border-bottom:1px solid rgba(255,255,255,.3);color:#ffd36b}
.band .tell.card.bare .ln.ok{color:#fff}
.band .tell.card.bare .ln.info{color:#fff}
.band .tell.okfill{background:var(--ok-fg);color:#fff;display:flex;flex-direction:column}
.band .tell.okrow{background:none;padding:0 2px;color:#fff;font-weight:500}
.band .tell b{font-weight:700}
.tk-s{font-weight:500;opacity:.85}
.band .v{font-size:38px;line-height:46px;font-weight:700;letter-spacing:-.035em;text-align:right;font-variant-numeric:tabular-nums}

/* The list of mistakes and what stops each. */
.why{width:1100px;max-width:100%;background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 1px 2px rgb(0 0 0/6%)}
.why h2{margin:0 0 10px;font-size:17px;font-weight:600}
.why table{width:100%;border-collapse:collapse}
.why th{text-align:left;color:var(--body);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--hairline)}
.why td{padding:8px;border-bottom:1px solid var(--hairline);vertical-align:top}
.why td:first-child{font-weight:600;width:300px}
/* Each thing said is its own white card (29 Oct 2026). */
.tell.card+.tell.card,.tell+.tell.card{margin-top:8px}
</style>
</head>
<body>
<header class="top">
  <h1>Bayar kasir</h1>
  <div class="grp"><span class="k">Versi</span><div class="seg" id="ver"></div></div>
  <div class="grp"><span class="k">Kurang (R1)</span><div class="seg" id="kur"></div></div>
  <div class="grp"><span class="k">Bisa ditukar</span><div class="seg" id="tuk"></div></div>
  <div class="grp"><span class="k">Latar</span><div class="seg" id="wv"></div></div>
  <div class="grp"><span class="k">Layar</span><div class="seg" id="scr"></div></div>
  <div class="grp"><span class="k">Kasus</span><div class="seg" id="cas"></div></div>
</header>
<main id="app"></main>
<script>
const fmt = n => n.toLocaleString('id-ID');
/* Each case the cashier meets at Bayar. `rows`: the ways used, with what was
   typed; `tell`: pieces that may not be exchanged ('all' for a return). */
const CASES = {
  tunai: { lbl: 'Tunai', pcs: 8, total: 1122000, rows: [['Tunai', 1200000]], tell: [] },
  split: { lbl: 'Split EDC', pcs: 8, total: 1122000, rows: [['Tunai', 322000], ['EDC', 500000, ['BCA', 'Debit', 'Kartu BCA']], ['EDC 2', 300000, ['Mandiri', 'Debit', 'Bank lain']]], tell: [] },
  kurang: { lbl: 'Masih kurang', pcs: 8, total: 1122000, rows: [['Tunai', 1000000]], tell: [] },
  nope: { lbl: 'Ada yang tidak bisa ditukar', pcs: 3, total: 403000, rows: [['Tunai', 500000]], tell: ['Bombi Kaos Kaki 3in1'] },
  voucher: { lbl: 'Voucher lebih besar', pcs: 1, total: 189000, rows: [['Voucher', 200000, 'GC-7Y3K-22QD']], tell: [], voucher: true },
  member: { lbl: 'Member', pcs: 2, total: 289000, rows: [['EDC', 289000, ['BCA', 'QRIS']]], tell: [], member: ['Siti Rahmawati', 28] },
  promo: { lbl: 'Promo & kupon', pcs: 2, total: 289000, rows: [['Tunai', 300000]], tell: [], member: ['Siti Rahmawati', 28], save: [75000, 'Member Hemat, Kupon HEMAT50'] },
  poin: { lbl: 'Tukar poin', pcs: 1, total: 137000, rows: [['Poin', 50000, '5.000 poin'], ['Tunai', 100000]], tell: [], member: ['Siti Rahmawati', 8] },
  karyawan: { lbl: 'Diskon karyawan', pcs: 1, total: 157000, rows: [['Diskon karyawan', 100000], ['Tunai', 60000]], tell: [] },
  retless: { lbl: 'Return · lebih murah', pcs: 1, total: 0, rows: [], tell: ['all'], ret: { back: 137000, out: 94000 } },
  ret: { lbl: 'Return · bayar selisih', pcs: 1, total: 76000, rows: [['Tunai', 100000]], tell: ['all'], ret: { back: 2, out: 1 } },
};
/* Every way the shop takes, in the till's order. */
const WAYS = ['Tunai', 'EDC', 'EDC 2', 'Voucher', 'Poin', 'Diskon karyawan'];
const VERS = [['A', 'Sekarang'], ['R1', 'Rapi'], ['R2', 'Rapi · total kanan'], ['R3', 'Rapi · total kiri']];
/* Common till screens, by panel size: 15" POS touch, 18.5–19" desktop monitor, 19.5–20", 21.5–24" full HD. */
const SCREENS = { '1024': [1024, 768, '15"'], '1366': [1366, 768, '18.5"'], '1600': [1600, 900, '19.5"'], '1920': [1920, 1080, '21.5–24"'] };
let SC = get('scr', '1366');

let V = get('ver', 'R1'), C = get('cas', 'kurang'), K = get('kurang', 'K2'), T = get('tukar', 'T1'), W = get('kartu', 'W1');
if (!CASES[C]) C = 'kurang';
if (!VERS.some(([k]) => k === V)) V = 'R1';
function get(k, d) { try { return localStorage.getItem('bayar.' + k) || d; } catch { return d; } }
function set(k, v) { try { localStorage.setItem('bayar.' + k, v); } catch { /* no storage */ } }

/* The unused EDC row, clickable (Hari, 28 Oct 2026): one question at a time —
   Mesin, then Jenis, then Kartu. An answer is a solid chip; × takes it back. The
   key beside each choice is the one the counter presses. */
/* More than one EDC for a split over cards: "+ EDC lagi" (or +) adds a row. */
const FP = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 11a5 5 0 0 1 10 0v2"/><path d="M12 11v4a6 6 0 0 1-1.5 4"/><path d="M9 11.5V14a9 9 0 0 1-1.2 4.5"/><path d="M15 13.5a10 10 0 0 1-.8 4"/><path d="M4.5 9a8 8 0 0 1 15 0"/><path d="M5 14.5a12 12 0 0 0 .3-2"/></svg>';
/* What the cashier has opened on top of the case: EDC rows, a voucher, points, an employee's finger. */
/* Tunai and one EDC are always there (Hari, 28 Oct 2026); more EDC by "+ EDC". */
let FOCUS = 0, ROWS = [];
const blankEdc = () => ({ mach: null, kind: null, card: null, amt: 0 });
const X = { edcs: [], voucher: null, poin: null, emp: null };
function resetX() {
  const c = CASES[C];
  FOCUS = 0;
  X.edcs.length = 0;
  if (!c.rows.some(r => r[0].startsWith('EDC'))) X.edcs.push(blankEdc());
  X.voucher = X.poin = X.emp = null;
}
const EDCS = X.edcs;
/* The row just answered (or taken back), so only what changed moves — the
   whole dialog redraws on every key. Cleared once drawn. */
let FRESH = null;
function edcAsk(n) {
  const EDC = EDCS[n], fresh = FRESH && FRESH.n === n;
  const picked = [EDC.mach, EDC.kind && { D: 'Debit', K: 'Kredit', Q: 'QRIS' }[EDC.kind], EDC.card].filter(Boolean);
  const done = picked.map((x, i) => `<button class="chip pick${fresh && FRESH.pick && i === picked.length - 1 ? ' in' : ''}" data-e="undo:${n}:${i}">${x} <span class="xx">×</span></button>`).join('');
  const q = !EDC.mach ? ['Mesin', [['BCA', '1'], ['Mandiri', '2'], ['BRI', '3']], 'mach']
    : !EDC.kind ? ['Jenis', [['Debit', 'D'], ['Kredit', 'K'], ['QRIS', 'Q']], 'kind']
    : EDC.kind !== 'Q' && !EDC.card ? ['Kartu', [[`Kartu ${EDC.mach}`, 'Y'], ['Bank lain', 'T']], 'card'] : null;
  /* Not using this EDC after all: × takes the row away (the last one empties). */
  const drop = picked.length || EDC.amt ? `<button class="chip drop" data-e="drop:${n}" title="Batal pakai EDC">× <span class="kbd">Del</span></button>` : '';
  return `<span class="edc">${done}${q ? `<span class="eq${fresh ? ' in' : ''}">${q[0]}</span>${q[1].map(([l, k]) => `<button class="chip ask${fresh ? ' in' : ''}" data-e="${q[2]}:${n}:${q[2] === 'kind' ? k : l}">${l} <span class="kbd">${k}</span></button>`).join('')}` : ''}${drop}</span>`;
}
/* What is still owed, from what the case and the opened rows hold. */
function due() {
  const c = CASES[C];
  const got = c.rows.reduce((a, r) => a + r[1], 0) + X.edcs.reduce((a, e) => a + (e.amt || 0), 0) + (X.voucher ? X.voucher.val : 0) + (X.poin && X.poin.st === 'ok' ? X.poin.pts * POINT_RP : 0) + (X.emp ? X.emp.amt : 0);
  return c.total - got;
}
function view() {
  const c = CASES[C];
