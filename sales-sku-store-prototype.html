<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sales by Article</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #20242c; --text: #394150; --body: #565f6d; --mute: #666f7d; --faint: #b9c0c9; --line-ico: #89919d;
    --canvas: #ffffff; --soft: #f8f8f9; --soft-2: #f0f0f2; --soft-3: #f6f6f7;
    --hairline: #e6e6e9; --hairline-2: #dadade; --hairline-strong: #c6c6cc;
    --dark: #191b20; --accent: #2563eb; --accent-bg: #eff5ff; --bad: #d05151; --good: #1f8a5b;
    --r-card: 10px; --r-inner: 8px; --row: 52px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--soft-3); color: var(--text); font: 15px/1.4 var(--sans); }
  button, input, select { font: inherit; color: inherit; }

  .shell { display: grid; grid-template-columns: 64px 280px minmax(0, 1fr); min-height: 100vh; }
  .rail { background: var(--dark); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 10px; }
  .rail .mark { width: 36px; height: 36px; border-radius: 10px; background: #000; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 18px; position: relative; }
  .rail .mark::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); right: 6px; top: 15px; }
  .rail i { width: 36px; height: 36px; border-radius: 10px; display: block; background: rgba(255,255,255,.06); }
  .rail i.on { background: rgba(255,255,255,.16); }
  .side { background: var(--canvas); border-right: 1px solid var(--hairline); padding: 18px 14px; }
  .side h2 { margin: 0 6px 16px; font-size: 17px; font-weight: 600; color: var(--ink); }
  .side a { display: block; padding: 10px 12px; border-radius: var(--r-inner); color: var(--body); text-decoration: none; font-size: 15px; transition: background-color 150ms ease; }
  @media (hover: hover) and (pointer: fine) { .side a:hover { background: var(--soft); } }
  .side a.on { background: var(--accent-bg); color: var(--accent); font-weight: 500; }

  main { min-width: 0; padding: 28px 32px 40px; }
  .eyebrow { color: var(--mute); font-size: 15px; }
  h1 { margin: 2px 0 18px; font-size: 22px; line-height: 30px; letter-spacing: -0.02em; font-weight: 600; color: var(--ink); }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .field { height: 40px; border: 1px solid var(--hairline-2); background: var(--canvas); border-radius: var(--r-inner); padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; color: var(--text); }
  .field input, .field select { border: 0; outline: 0; background: transparent; height: 38px; }
  .field.search { width: 280px; }
  .field.search input { width: 100%; }
  .to { color: var(--mute); }
  .seg { display: inline-flex; height: 40px; padding: 3px; border-radius: var(--r-inner); background: var(--soft-2); }
  .seg button { border: 0; background: transparent; padding: 0 14px; border-radius: 6px; color: var(--body); cursor: pointer; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
  .seg button:active { transform: scale(0.97); }
  .seg button.on { background: var(--canvas); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .spacer { flex: 1; }
  .btn { height: 40px; border: 1px solid var(--hairline-2); background: var(--canvas); border-radius: var(--r-inner); padding: 0 14px; cursor: pointer; color: var(--text); transition: transform 160ms var(--ease-out), background-color 150ms ease; }
  .btn:active { transform: scale(0.97); }

  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 14px 16px; }
  .kpi .l { color: var(--mute); font-size: 14px; }
  .kpi .v { margin-top: 4px; font-size: 18px; line-height: 24px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  .card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-card); overflow: hidden; }
  .scroll { overflow: auto; max-height: calc(100vh - 290px); overscroll-behavior: contain; }
  table { border-collapse: separate; border-spacing: 0; font-size: 15px; font-variant-numeric: tabular-nums; }
  th, td { white-space: nowrap; height: var(--row); padding: 0 14px; border-bottom: 1px solid var(--hairline); text-align: right; background: var(--canvas); }
  thead th { position: sticky; z-index: 3; background: var(--soft); color: var(--body); font-weight: 500; font-size: 14px; }
  thead tr:first-child:not(:only-child) th { top: 0; height: 36px; color: var(--mute); letter-spacing: .04em; text-transform: uppercase; border-bottom: 1px solid var(--hairline); }
  thead tr:nth-child(2) th { top: 36px; height: 40px; }
  thead tr:only-child th { top: 0; height: 40px; }
  thead th.grp { text-align: center; border-left: 1px solid var(--hairline-2); }
  th.l, td.l { text-align: left; }
  td.b, th.b { border-left: 1px solid var(--hairline-2); }
  .sticky1 { position: sticky; left: 0; z-index: 2; min-width: 220px; }
  .sticky2 { position: sticky; left: 220px; z-index: 2; min-width: 150px; box-shadow: 1px 0 0 var(--hairline-2); }
  thead .sticky1, thead .sticky2 { z-index: 4; }
  th.sort { cursor: pointer; user-select: none; }
  th.sort .ar { color: var(--faint); margin-left: 4px; }
  th.sort.on { color: var(--ink); }
  th.sort.on .ar { color: var(--accent); }

  tr.art td { color: var(--ink); }
  tr.art td.l .name { font-weight: 500; }
  tr.sku td { background: var(--soft); color: var(--text); }
  tr.sku td.sticky1 { padding-left: 42px; }
  @media (hover: hover) and (pointer: fine) { tbody tr:hover td { background: #fafbff; } }
  .tw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .chev { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; color: var(--line-ico); transition: transform 200ms var(--ease-out); }
  .open .chev { transform: rotate(90deg); }
  .code { font-family: var(--mono); font-size: 14px; color: var(--body); }
  .sub { color: var(--mute); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 7px; border: 1px solid rgba(0,0,0,.12); vertical-align: -1px; }
  .tags { color: var(--body); }
  .neg { color: var(--bad); }
  .zero { color: var(--faint); }
  td.d, th.d { background: #fbfaf6; }
  tr.sku td.d { background: #f5f4ef; }

  tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--soft); font-weight: 600; color: var(--ink); border-top: 1px solid var(--hairline-strong); border-bottom: 0; }
  tfoot td.sticky1, tfoot td.sticky2 { z-index: 3; }

  .foot { display: flex; justify-content: space-between; color: var(--mute); font-size: 14px; padding: 10px 2px 0; }
  .view { display: none; }
  .view.on { display: block; }
  .lbl { color: var(--mute); font-size: 14px; }
  .pair { display: inline-flex; align-items: center; gap: 10px; }
  .kpis-8 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi .d { margin-top: 2px; font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--hairline); font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  .list td { height: 44px; }
  .list td.l { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .scroll.short { max-height: none; }
  .crumbs { display: flex; gap: 6px; align-items: center; color: var(--mute); margin: -4px 0 12px; min-height: 22px; }
  .crumbs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }
  .crumbs .sep { color: var(--faint); }
  tr.click td.sticky1 { cursor: pointer; }
  tr.click td.sticky1 .name { color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { tr.click:hover td.sticky1 .name { color: var(--accent); } }
  .heat { transition: background-color 200ms ease; }
  .store-top { color: var(--ink); font-weight: 500; }
  .scrim { position: fixed; inset: 0; background: rgba(25,27,32,.18); opacity: 0; pointer-events: none; transition: opacity 200ms ease; z-index: 20; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 92vw); background: var(--canvas); border-left: 1px solid var(--hairline); box-shadow: -12px 0 32px rgba(0,0,0,.08); transform: translateX(100%); transition: transform 280ms var(--ease-out); z-index: 21; overflow: auto; padding: 22px 24px 32px; }
  .sheet.on { transform: translateX(0); }
  .sheet h3 { margin: 0; font-size: 20px; color: var(--ink); letter-spacing: -0.01em; }
  .sheet .facts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px 16px; margin: 16px 0 18px; }
  .sheet .facts .l { color: var(--mute); font-size: 14px; } .sheet .facts .v { color: var(--ink); }
  .sheet .x { float: right; border: 0; background: var(--soft-2); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 18px; color: var(--body); transition: transform 160ms var(--ease-out); }
  .sheet .x:active { transform: scale(0.97); }
  .sheet .card { margin-top: 12px; }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  /* full view: tabs + search on top, dock at the bottom */
  .app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; }
  .top { display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 16px; background: var(--canvas); border-bottom: 1px solid var(--hairline); }
  .tabs { display: flex; gap: 4px; }
  .tabs button { height: 40px; padding: 0 16px; border: 0; border-radius: var(--r-inner); background: transparent; color: var(--body); cursor: pointer; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
  .tabs button:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .tabs button:hover { background: var(--soft); } }
  .tabs button.on { background: var(--soft-2); color: var(--ink); font-weight: 500; }
  .search { margin-left: auto; width: min(420px, 40vw); height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--hairline-2); border-radius: var(--r-inner); background: var(--canvas); }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; height: 38px; }
  .content { overflow: auto; padding: 16px; min-height: 0; }
  .view.fill.on { display: flex; flex-direction: column; height: 100%; }
  .view.fill .card { flex: 1; min-height: 0; display: flex; }
  .view.fill .scroll { flex: 1; max-height: none; }
  .dock { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; background: var(--canvas); border-top: 1px solid var(--hairline); }
  .dock-btn { height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: var(--r-inner); background: transparent; color: var(--text); cursor: pointer; transition: background-color 150ms ease, transform 160ms var(--ease-out); }
  .dock-btn:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .dock-btn:hover { background: var(--soft); } }
  .dock-btn[aria-expanded="true"] { background: var(--soft-2); color: var(--ink); }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; line-height: 20px; text-align: center; }
  .badge:empty { display: none; }
  .dock-sep { width: 1px; height: 24px; background: var(--hairline-2); }
  .dock-tabs { display: flex; gap: 2px; }
  .dock-tabs button { height: 40px; padding: 0 12px; border: 0; border-radius: var(--r-inner); background: transparent; color: var(--body); cursor: pointer; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
  .dock-tabs button:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .dock-tabs button:hover { background: var(--soft); } }
  .dock-tabs button.on { background: var(--soft-2); color: var(--ink); font-weight: 500; }
  .dock-tabs .n { color: var(--mute); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .dock-count { color: var(--mute); font-size: 14px; }
  [data-for] { display: none; }
  body[data-view="overview"] [data-for~="overview"], body[data-view="explorer"] [data-for~="explorer"],
  body[data-view="matrix"] [data-for~="matrix"], body[data-view="all"] [data-for~="all"] { display: flex; }
  body[data-view] .dock-count[data-for] { display: none; }
  body[data-view="explorer"] .dock-count[data-for="explorer"], body[data-view="all"] .dock-count[data-for="all"] { display: inline; }
  .panel { position: fixed; left: 16px; bottom: 68px; width: min(760px, calc(100vw - 32px)); background: var(--canvas); border: 1px solid var(--hairline); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.12); padding: 8px 16px; z-index: 15;
    transform-origin: bottom left; opacity: 0; transform: scale(0.97) translateY(4px); pointer-events: none; transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
  .panel.on { opacity: 1; transform: none; pointer-events: auto; }
  .pg { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
  .pg:last-child { border-bottom: 0; }
  .pg[data-for] { display: none; }
  body[data-view="explorer"] .pg[data-for~="explorer"], body[data-view="matrix"] .pg[data-for~="matrix"], body[data-view="all"] .pg[data-for~="all"] { display: flex; }
  .pl { width: 92px; flex: none; color: var(--mute); font-size: 14px; }
  .pr { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  @media (prefers-reduced-motion: reduce) { .panel { transition: opacity 150ms ease; transform: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <nav class="tabs" id="tabs">
      <button data-view="overview" class="on">Overview</button>
      <button data-view="explorer">Explorer</button>
      <button data-view="matrix">Store matrix</button>
      <button data-view="all">All data</button>
    </nav>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#89919d" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search articles, SKUs, suppliers" autocomplete="off" /></label>
    <span id="title" hidden></span>
  </header>

  <div class="content">
    <section id="v-overview" class="view on">
      <div class="kpis kpis-8" id="ov-kpis"></div>
      <div class="grid3" id="ov-lists"></div>
      <div class="card">
        <div class="card-h"><span>Stores</span></div>
        <div class="scroll short"><table id="ov-stores"></table></div>
      </div>
    </section>

    <section id="v-explorer" class="view fill">
      <div class="crumbs" id="crumbs"></div>
      <div class="card"><div class="scroll"><table id="ex-t"></table></div></div>
    </section>

    <section id="v-matrix" class="view fill">
      <div class="card"><div class="scroll"><table id="mx-t"></table></div></div>
    </section>

    <section id="v-all" class="view fill">
      <div class="kpis" id="kpis"></div>
      <div class="card"><div class="scroll"><table id="t"></table></div></div>
    </section>
  </div>

  <footer class="dock">
    <button class="dock-btn" id="sfBtn" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Sort &amp; filter<span class="badge" id="sfCount"></span></button>
    <span class="dock-sep"></span>
    <div class="dock-tabs" data-for="explorer" id="lens">
      <button data-v="best" class="on">Best sellers</button><button data-v="slow">Slow movers</button><button data-v="out">Running out</button><button data-v="disc">Discount-driven</button><button data-v="all">All</button>
    </div>
    <div class="dock-tabs" data-for="matrix" id="mxMetric">
      <button data-v="sales" class="on">Sales Rp</button><button data-v="qty">Sold qty</button><button data-v="stock">Stock qty</button>
    </div>
    <div class="dock-tabs" data-for="all" id="storeView">
      <button data-v="total" class="on">Stores: Total</button><button data-v="full">Full price</button><button data-v="disc">Discounted</button><button data-v="split">Split</button>
    </div>
    <span class="spacer"></span>
    <span class="dock-count" data-for="explorer" id="ex-count"></span>
    <span class="dock-count" data-for="all" id="count"></span>
    <button class="dock-btn" id="rangeBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="range"></span></button>
    <div class="seg" id="basis"><button data-v="net" class="on">Net</button><button data-v="gross">Gross</button></div>
  </footer>

  <div class="panel" id="panel" aria-hidden="true">
    <div class="pg"><div class="pl">Period</div><div class="pr"><label class="field"><input type="date" id="from" value="2026-01-01" /></label><span class="to">to</span><label class="field"><input type="date" id="to" value="2026-10-08" /></label><label class="field"><select id="cmp"><option value="prev">vs previous period</option><option value="ly">vs last year</option></select></label></div></div>
    <div class="pg"><div class="pl">Filter</div><div class="pr"><label class="field"><select id="div"><option value="">All divisions</option></select></label><label class="field"><select id="tag"><option value="">All tags</option></select></label></div></div>
    <div class="pg" data-for="explorer"><div class="pl">Group by</div><div class="pr"><div class="seg" id="groupBy"><button data-v="division">Division</button><button data-v="supplier">Supplier</button><button data-v="tags">Tags</button><button data-v="article" class="on">Article</button><button data-v="color">Color</button><button data-v="size">Size</button><button data-v="sku">SKU</button></div></div></div>
    <div class="pg" data-for="explorer"><div class="pl">Sort by</div><div class="pr"><label class="field"><select id="sortBy"><option value="">As the view sorts</option><option value="sales">Net sales</option><option value="qty">Sold</option><option value="change">Change</option><option value="disc">Disc %</option><option value="stockRp">Stock Rp</option><option value="days">Days of stock</option></select></label><div class="seg" id="sortDir"><button data-v="desc" class="on">High to low</button><button data-v="asc">Low to high</button></div></div></div>
    <div class="pg" data-for="matrix"><div class="pl">Rows</div><div class="pr"><div class="seg" id="mxRows"><button data-v="division">Division</button><button data-v="article" class="on">Article</button><button data-v="color">Color</button></div></div></div>
    <div class="pg" data-for="matrix"><div class="pl">Display</div><div class="pr"><div class="seg" id="mxMode"><button data-v="numbers" class="on">Numbers</button><button data-v="heat">Heatmap</button></div><div class="seg" id="mxScale"><button data-v="row" class="on">Per row</button><button data-v="all">All cells</button></div></div></div>
    <div class="pg" data-for="all"><div class="pl">Rows</div><div class="pr"><div class="seg" id="rows"><button data-v="article" class="on">Article</button><button data-v="sku">SKU</button></div><button class="btn">Export</button></div></div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" aria-hidden="true"></aside>
</div>

<script>
const STORES = Array.from({ length: 13 }, (_, i) => "S" + String(i + 1).padStart(2, "0"));
const DIVISIONS = ["Women", "Men", "Kids", "Accessories"];
const TAGS = ["Basic", "Casual", "Formal", "New season", "Sale"];
const SUPPLIERS = ["Supplier A", "Garmen Nusantara", "Indorama", "Garmen AA", "Sepatu Sejahtera"];
const COLOURS = [["Navy", "#1b2a4a"], ["Black", "#1a1a1a"], ["White", "#f4f4f2"], ["Olive", "#6b7039"], ["Maroon", "#6d1f2c"], ["Beige", "#d8c8a8"]];
const SIZES = ["S", "M", "L", "XL"];
const NAMES = ["Kemeja Oxford", "Kaos Basic", "Celana Chino", "Jaket Denim", "Blus Linen", "Rok Plisket", "Polo Pique", "Hoodie Fleece", "Dress Midi", "Celana Jogger", "Kemeja Flanel", "Cardigan Rajut"];

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = (a) => a[Math.floor(rnd() * a.length)];

const ARTICLES = NAMES.map((name, i) => {
  const code = String(12345678 + i * 13).padStart(8, "0");
  const hpp = (45 + Math.floor(rnd() * 14) * 5) * 1000;
  const price = Math.round((hpp * (1.9 + rnd() * 0.6)) / 5000) * 5000;
  const colours = [pick(COLOURS), pick(COLOURS)].filter((c, j, a) => a.findIndex((x) => x[0] === c[0]) === j);
  const sizes = SIZES.slice(0, 2 + Math.floor(rnd() * 3));
  const skus = [];
  colours.forEach((c, ci) => sizes.forEach((s, si) => {
    const hot = 0.35 + rnd() * 1.3;
    const perStore = STORES.map((_, si) => {
      const lean = 0.5 + ((si * 7 + i * 3) % 13) / 9;
      const full = Math.floor(rnd() * 8 * hot * lean);
      const disc = Math.floor(rnd() * 6 * lean);
      const stock = Math.floor(rnd() * 9 * (2 - hot));
      const drift = 0.7 + rnd() * 0.6;
      return { full, disc, stock, prevFull: Math.round(full * drift), prevDisc: Math.round(disc * drift) };
    });
    skus.push({
      code: code + (ci + 1) + String(si + 3).padStart(2, "0"),
      colour: c, size: s,
      stock: perStore.reduce((n, p) => n + p.stock, 0),
      perStore,
      discRate: 0.15 + rnd() * 0.25,
    });
  }));
  return {
    code, name, hpp, price, skus,
    division: DIVISIONS[i % DIVISIONS.length],
    tags: [TAGS[i % TAGS.length], TAGS[(i + 2) % TAGS.length]],
    supplier: SUPPLIERS[i % SUPPLIERS.length],
  };
});

const state = { rows: "article", basis: "net", storeView: "total", open: new Set([ARTICLES[0].code]), sort: { key: "totalSales", dir: -1 }, q: "", div: "", tag: "" };

function figures(a, sku) {
  const out = { stockQty: sku.stock, stockRp: sku.stock * a.hpp, fullQty: 0, fullSales: 0, discQty: 0, discSales: 0, discount: 0, stores: [] };
  sku.perStore.forEach((p) => {
    const fullSales = p.full * a.price;
    const discGross = p.disc * a.price;
    const discount = Math.round(discGross * sku.discRate / 1000) * 1000;
    const discSales = state.basis === "net" ? discGross - discount : discGross;
    out.fullQty += p.full; out.fullSales += fullSales;
    out.discQty += p.disc; out.discSales += discSales; out.discount += discount;
    out.stores.push({ qty: p.full + p.disc, sales: fullSales + discSales, fullQty: p.full, fullSales, discQty: p.disc, discSales });
  });
  out.totalQty = out.fullQty + out.discQty;
  out.totalSales = out.fullSales + out.discSales;
  const net = state.basis === "net" ? out.totalSales : out.totalSales - out.discount;
  out.gp = net - out.totalQty * a.hpp;
  return out;
}
function add(t, f) {
  for (const k of ["stockQty", "stockRp", "fullQty", "fullSales", "discQty", "discSales", "discount", "totalQty", "totalSales", "gp"]) t[k] = (t[k] || 0) + f[k];
  t.stores = t.stores || STORES.map(() => ({ qty: 0, sales: 0, fullQty: 0, fullSales: 0, discQty: 0, discSales: 0 }));
  f.stores.forEach((s, i) => { for (const k of ["qty", "sales", "fullQty", "fullSales", "discQty", "discSales"]) t.stores[i][k] += s[k]; });
  return t;
}

const n0 = new Intl.NumberFormat("id-ID");
const qty = (v) => v === 0 ? '<span class="zero">0</span>' : n0.format(v);
const rp = (v) => {
  if (v === 0) return '<span class="zero">0</span>';
  const s = (Math.abs(v) / 1e6).toLocaleString("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " jt";
  return v < 0 ? '<span class="neg">−' + s + "</span>" : s;
};

const METRICS = [
  ["hpp", "HPP", "cost"], ["stockQty", "Quantity", "stock"], ["stockRp", "Rp", "stock"],
  ["fullQty", "Quantity", "full"], ["fullSales", "Sales", "full"],
  ["discQty", "Quantity", "disc"], ["discSales", "Sales", "disc"], ["discount", "Discount", "disc"],
  ["totalQty", "Quantity", "total"], ["totalSales", "Sales", "total"], ["gp", "Gross profit", "total"],
];
const GROUPS = [["cost", "Cost", 1], ["stock", "Stock", 2], ["full", "Full price", 2], ["disc", "Discounted", 3], ["total", "Total", 3]];

function head() {
  let r1 = '<tr><th class="l sticky1" rowspan="1">Product</th><th class="l sticky2"></th><th class="l" colspan="5"></th>';
  GROUPS.forEach(([, label, span]) => (r1 += `<th class="grp" colspan="${span}">${label}</th>`));
  const span = state.storeView === "split" ? 4 : 2;
  STORES.forEach((s) => (r1 += `<th class="grp" colspan="${span}">${s}</th>`));
  r1 += "</tr>";
  let r2 = '<tr><th class="l sticky1">Article</th><th class="l sticky2">SKU</th><th class="l">Division</th><th class="l">Tags</th><th class="l">Supplier</th><th class="l">Color</th><th class="l">Size</th>';
  METRICS.forEach(([key, label, g], i) => {
    const first = i === 0 || METRICS[i - 1][2] !== g;
    const on = state.sort.key === key;
    r2 += `<th class="sort ${first ? "b" : ""} ${on ? "on" : ""}" data-k="${key}">${label}<span class="ar">${on ? (state.sort.dir < 0 ? "↓" : "↑") : "↕"}</span></th>`;
  });
  const sub = {
    total: '<th class="b">Quantity</th><th>Sales</th>',
    full: '<th class="b">Full qty</th><th>Full sales</th>',
    disc: '<th class="b">Disc qty</th><th>Disc sales</th>',
    split: '<th class="b">Full qty</th><th>Full sales</th><th class="d">Disc qty</th><th class="d">Disc sales</th>',
  }[state.storeView];
  STORES.forEach(() => (r2 += sub));
  return "<thead>" + r1 + r2 + "</thead>";
}

function cells(f, hpp) {
  let h = `<td class="b">${hpp == null ? "" : n0.format(hpp)}</td>`;
  h += `<td class="b">${qty(f.stockQty)}</td><td>${rp(f.stockRp)}</td>`;
  h += `<td class="b">${qty(f.fullQty)}</td><td>${rp(f.fullSales)}</td>`;
  h += `<td class="b">${qty(f.discQty)}</td><td>${rp(f.discSales)}</td><td>${rp(f.discount)}</td>`;
  h += `<td class="b">${qty(f.totalQty)}</td><td>${rp(f.totalSales)}</td><td>${rp(f.gp)}</td>`;
  f.stores.forEach((s) => {
    if (state.storeView === "total") h += `<td class="b">${qty(s.qty)}</td><td>${rp(s.sales)}</td>`;
    else if (state.storeView === "full") h += `<td class="b">${qty(s.fullQty)}</td><td>${rp(s.fullSales)}</td>`;
    else if (state.storeView === "disc") h += `<td class="b">${qty(s.discQty)}</td><td>${rp(s.discSales)}</td>`;
    else h += `<td class="b">${qty(s.fullQty)}</td><td>${rp(s.fullSales)}</td><td class="d">${qty(s.discQty)}</td><td class="d">${rp(s.discSales)}</td>`;
  });
  return h;
}

function visible() {
  const q = state.q.toLowerCase();
  return ARTICLES.filter((a) =>
    (!state.div || a.division === state.div) &&
    (!state.tag || a.tags.includes(state.tag)) &&
    (!q || a.code.includes(q) || a.name.toLowerCase().includes(q) || a.supplier.toLowerCase().includes(q) || a.skus.some((s) => s.code.includes(q))));
}

function render() {
  const arts = visible().map((a) => {
    const skus = a.skus.map((s) => ({ s, f: figures(a, s) }));
    const f = skus.reduce((t, x) => add(t, x.f), {});
    return { a, skus, f };
  });
  const k = state.sort.key, d = state.sort.dir;
  const val = (x, a) => k === "hpp" ? a.hpp : x[k];
  arts.sort((x, y) => (val(x.f, x.a) - val(y.f, y.a)) * d);

  let body = "";
  const total = {};
  arts.forEach(({ a, skus, f }) => {
    add(total, f);
    const colours = [...new Set(a.skus.map((s) => s.colour[0]))];
    const sizes = [...new Set(a.skus.map((s) => s.size))];

      if (open) skus.slice().sort((x, y) => (val(x.f, a) - val(y.f, a)) * d).forEach(({ s, f: sf }) => {
        body += `<tr class="sku"><td class="l sticky1 sub">${a.name}</td><td class="l sticky2 code">${s.code}</td>
          <td class="l sub">${a.division}</td><td class="l sub">${a.tags.join(", ")}</td><td class="l sub">${a.supplier}</td>
          <td class="l"><span class="dot" style="background:${s.colour[1]}"></span>${s.colour[0]}</td><td class="l">${s.size}</td>
          ${cells(sf, a.hpp)}</tr>`;
      });
    } else {
      skus.slice().sort((x, y) => (val(x.f, a) - val(y.f, a)) * d).forEach(({ s, f: sf }) => {
        body += `<tr class="art"><td class="l sticky1"><span class="name">${a.name}</span><br><span class="code">${a.code}</span></td><td class="l sticky2 code">${s.code}</td>
          <td class="l">${a.division}</td><td class="l tags">${a.tags.join(", ")}</td><td class="l">${a.supplier}</td>
          <td class="l"><span class="dot" style="background:${s.colour[1]}"></span>${s.colour[0]}</td><td class="l">${s.size}</td>
          ${cells(sf, a.hpp)}</tr>`;
      });
    }
  });

  const foot = arts.length ? `<tfoot><tr><td class="l sticky1">Total</td><td class="l sticky2 sub">${arts.reduce((n, x) => n + x.skus.length, 0)} SKUs</td><td colspan="5"></td>${cells(total, null)}</tr></tfoot>` : "";
  document.getElementById("t").innerHTML = head() + "<tbody>" + body + "</tbody>" + foot;

  const t = arts.length ? total : { totalQty: 0, totalSales: 0, discount: 0, gp: 0, stockRp: 0 };
  const margin = t.totalSales ? (t.gp / (state.basis === "net" ? t.totalSales : t.totalSales - t.discount)) * 100 : 0;
  document.getElementById("kpis").innerHTML = [
    ["Sold", n0.format(t.totalQty) + " pcs"],
    [state.basis === "net" ? "Sales (net)" : "Sales (gross)", "Rp " + n0.format(t.totalSales)],
    ["Discount", "Rp " + n0.format(t.discount)],
    ["Gross profit", "Rp " + n0.format(t.gp) + " · " + margin.toLocaleString("id-ID", { maximumFractionDigits: 1 }) + "%"],
    ["Stock at cost", "Rp " + n0.format(t.stockRp)],
  ].map(([l, v]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");

  document.getElementById("count").textContent = `${arts.length} articles · ${arts.reduce((n, x) => n + x.skus.length, 0)} SKUs`;
  const f = new Date(document.getElementById("from").value), to = new Date(document.getElementById("to").value);
  const fmt = (x) => x.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  document.getElementById("range").textContent = `${fmt(f)} – ${fmt(to)}`;
}

/* ---------- shared facts: one row per SKU × store, the shape of sales_sku_day ---------- */
const DIMS = {
  division: { label: "Division", next: "article", keys: (a) => [a.division] },
  supplier: { label: "Supplier", next: "article", keys: (a) => [a.supplier] },
  tags: { label: "Tag", next: "article", keys: (a) => a.tags },
  article: { label: "Article", next: null, keys: (a) => [a.code] },
  color: { label: "Color", next: "size", keys: (a, k) => [k.colour[0]] },
  size: { label: "Size", next: "sku", keys: (a, k) => [k.size] },
  sku: { label: "SKU", next: null, keys: (a, k) => [k.code] },
};
const ui = { view: "overview", sortBy: "", sortDir: "desc", lens: "best", groupBy: "article", crumbs: [], mxRows: "article", mxMetric: "sales", mxMode: "numbers", mxScale: "row" };

function periodDays() {
  const f = new Date(document.getElementById("from").value), t = new Date(document.getElementById("to").value);
  return Math.max(1, Math.round((t - f) / 864e5) + 1);
}
function facts(drill = false) {
  const out = [];
  visible().forEach((a) => a.skus.forEach((k) => k.perStore.forEach((p, si) => {
    const discGross = p.disc * a.price;
    const discount = Math.round(discGross * k.discRate / 1000) * 1000;
    const prevDiscGross = p.prevDisc * a.price;
    const prevDiscount = Math.round(prevDiscGross * k.discRate / 1000) * 1000;
    const net = state.basis === "net";
    out.push({
      a, k, si,
      fullQty: p.full, fullSales: p.full * a.price,
      discQty: p.disc, discSales: net ? discGross - discount : discGross, discount,
      qty: p.full + p.disc,
      sales: p.full * a.price + (net ? discGross - discount : discGross),
      prevSales: p.prevFull * a.price + (net ? prevDiscGross - prevDiscount : prevDiscGross),
      prevQty: p.prevFull + p.prevDisc,
      stock: p.stock, stockRp: p.stock * a.hpp,
      cost: (p.full + p.disc) * a.hpp,
      netSales: p.full * a.price + discGross - discount,
    });
  })));
  return drill && ui.crumbs.length ? out.filter((f) => ui.crumbs.every((c) => DIMS[c.dim].keys(f.a, f.k).includes(c.value))) : out;
}
function blank() { return { qty: 0, sales: 0, prevSales: 0, prevQty: 0, fullQty: 0, fullSales: 0, discQty: 0, discSales: 0, discount: 0, stock: 0, stockRp: 0, cost: 0, netSales: 0, stores: STORES.map(() => ({ qty: 0, sales: 0, stock: 0 })) }; }
function fold(t, f) {
  for (const k of ["qty", "sales", "prevSales", "prevQty", "fullQty", "fullSales", "discQty", "discSales", "discount", "stock", "stockRp", "cost", "netSales"]) t[k] += f[k];
  const st = t.stores[f.si]; st.qty += f.qty; st.sales += f.sales; st.stock += f.stock;
  return t;
}
function groupFacts(rows, dim) {
  const m = new Map();
  rows.forEach((f) => DIMS[dim].keys(f.a, f.k).forEach((key) => {
    if (!m.has(key)) m.set(key, { key, a: f.a, k: f.k, t: blank() });
    fold(m.get(key).t, f);
  }));
  return [...m.values()];
}
const delta = (cur, prev) => prev ? (cur - prev) / prev * 100 : null;
const pct = (v, digits = 1) => v == null || !isFinite(v) ? "–" : v.toLocaleString("id-ID", { maximumFractionDigits: digits, minimumFractionDigits: digits }) + "%";
const dPct = (v) => v == null ? '<span class="sub">–</span>' : `<span class="${v >= 0 ? "up" : "down"}">${v >= 0 ? "+" : "−"}${pct(Math.abs(v))}</span>`;
const days = (t) => t.stock === 0 ? '<span class="zero">0</span>' : t.qty === 0 ? '<span class="sub">–</span>' : n0.format(Math.round(t.stock / (t.qty / periodDays())));
const daysVal = (t) => t.stock === 0 ? 0 : t.qty === 0 ? Infinity : t.stock / (t.qty / periodDays());
const rpFull = (v) => "Rp " + (v / 1e6).toLocaleString("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " jt";
function labelOf(dim, g) {
  if (dim === "article") return `<span class="name">${g.a.name}</span><br><span class="code">${g.a.code}</span>`;
  if (dim === "sku") return `<span class="name">${g.a.name}</span><br><span class="code">${g.k.code} · ${g.k.colour[0]} · ${g.k.size}</span>`;
  if (dim === "color") { const c = COLOURS.find((x) => x[0] === g.key); return `<span class="name"><span class="dot" style="background:${c ? c[1] : "#ccc"}"></span>${g.key}</span>`; }
  return `<span class="name">${g.key}</span>`;
}
function topStore(t) {
  let best = -1, at = -1;
  t.stores.forEach((s, i) => { if (s.sales > best) { best = s.sales; at = i; } });
  return best > 0 ? STORES[at] : "–";
}

/* ---------- Overview ---------- */
function renderOverview() {
  const rows = facts();
  const t = rows.reduce(fold, blank());
  const gp = t.netSales - t.cost;
  const avgStockCost = t.stockRp * 1.15; // stands in for the month-end snapshots
  const kpi = (l, v, d) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`;
  const cmp = document.getElementById("cmp").value === "ly" ? "vs last year" : "vs previous period";
  document.getElementById("ov-kpis").innerHTML = [
    kpi(state.basis === "net" ? "Net sales" : "Gross sales", rpFull(t.sales), dPct(delta(t.sales, t.prevSales)) + " " + cmp),
    kpi("Sold", n0.format(t.qty) + " pcs", dPct(delta(t.qty, t.prevQty)) + " " + cmp),
    kpi("Full price sales", rpFull(t.fullSales), n0.format(t.fullQty) + " pcs"),
    kpi("Discounted sales", rpFull(t.discSales), n0.format(t.discQty) + " pcs · " + pct(t.discSales / (t.fullSales + t.discSales) * 100) + " of sales"),
    kpi("Discount", rpFull(t.discount), pct(t.discount / (t.fullSales + t.discSales + (state.basis === "net" ? t.discount : 0)) * 100) + " of gross"),
    kpi("Stock value", rpFull(t.stockRp), n0.format(t.stock) + " pcs at HPP"),
    kpi("Gross margin", pct(gp / t.netSales * 100), rpFull(gp)),
    kpi("GMROI", (gp / avgStockCost).toLocaleString("id-ID", { maximumFractionDigits: 2 }) + "×"),
  ].join("");

  const arts = groupFacts(rows, "article");
  const list = (title, items, cols) => `<div class="card"><div class="card-h"><span>${title}</span></div><table class="list" style="width:100%">${
    items.map((g) => `<tr class="click" data-art="${g.a.code}"><td class="l sticky1" style="position:static;min-width:0"><span class="name">${g.a.name}</span></td>${cols.map((c) => `<td>${c(g.t)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  const discShare = (x) => x.fullSales + x.discSales ? x.discSales / (x.fullSales + x.discSales) : 0;
  document.getElementById("ov-lists").innerHTML =
    list("Top sellers", arts.slice().sort((x, y) => y.t.sales - x.t.sales).slice(0, 5), [(x) => rp(x.sales), (x) => dPct(delta(x.sales, x.prevSales))]) +
    list("Discount-driven", arts.filter((g) => g.t.qty).sort((x, y) => discShare(y.t) - discShare(x.t)).slice(0, 5), [(x) => pct(discShare(x) * 100), (x) => rp(x.sales)]) +
    list("High stock, selling slowly", arts.filter((g) => g.t.stock).sort((x, y) => daysVal(y.t) - daysVal(x.t) || y.t.stockRp - x.t.stockRp).slice(0, 5), [(x) => rp(x.stockRp), (x) => days(x) + " days"]);

  let h = '<thead><tr><th class="l sticky1">Store</th><th>Net sales</th><th>Change</th><th>Sold</th><th>Full price</th><th>Discounted</th><th>Disc %</th><th>Stock Rp</th><th>Days of stock</th><th>Margin</th></tr></thead><tbody>';
  const per = STORES.map((st, i) => ({ st, t: rows.filter((f) => f.si === i).reduce(fold, blank()) })).sort((x, y) => y.t.sales - x.t.sales);
  per.forEach(({ st, t: x }) => {
    h += `<tr><td class="l sticky1"><span class="name">${st}</span></td><td>${rp(x.sales)}</td><td>${dPct(delta(x.sales, x.prevSales))}</td><td>${qty(x.qty)}</td><td>${rp(x.fullSales)}</td><td>${rp(x.discSales)}</td><td>${pct(discShare(x) * 100)}</td><td>${rp(x.stockRp)}</td><td>${days(x)}</td><td>${pct((x.netSales - x.cost) / x.netSales * 100)}</td></tr>`;
  });
  h += `</tbody><tfoot><tr><td class="l sticky1">Total</td><td>${rp(t.sales)}</td><td>${dPct(delta(t.sales, t.prevSales))}</td><td>${qty(t.qty)}</td><td>${rp(t.fullSales)}</td><td>${rp(t.discSales)}</td><td>${pct(discShare(t) * 100)}</td><td>${rp(t.stockRp)}</td><td>${days(t)}</td><td>${pct(gp / t.netSales * 100)}</td></tr></tfoot>`;
  document.getElementById("ov-stores").innerHTML = h;
}

/* ---------- Explorer ---------- */
function renderExplorer() {
  const dim = ui.groupBy;
  const all = groupFacts(facts(true), dim);
  const share = (x) => x.fullSales + x.discSales ? x.discSales / (x.fullSales + x.discSales) : 0;
  const lensOf = (lens) => {
    let g = all.slice();
    if (lens === "best") g.sort((x, y) => y.t.sales - x.t.sales);
    if (lens === "slow") g = g.filter((x) => x.t.stock > 0).sort((x, y) => daysVal(y.t) - daysVal(x.t) || y.t.stockRp - x.t.stockRp);
    if (lens === "out") g = g.filter((x) => x.t.qty > 0 && x.t.stock > 0 && daysVal(x.t) < 60).sort((x, y) => daysVal(x.t) - daysVal(y.t));
    if (lens === "disc") g = g.filter((x) => x.t.qty > 0).sort((x, y) => share(y.t) - share(x.t));
    if (lens === "all") g.sort((x, y) => y.t.sales - x.t.sales);
    return g;
  };
  document.querySelectorAll("#lens button").forEach((b) => {
    const label = { best: "Best sellers", slow: "Slow movers", out: "Running out", disc: "Discount-driven", all: "All" }[b.dataset.v];
    b.innerHTML = `${label}<span class="n">${lensOf(b.dataset.v).length}</span>`;
  });
  let groups = lensOf(ui.lens);
  if (ui.sortBy) {
    const key = { sales: (x) => x.sales, qty: (x) => x.qty, change: (x) => delta(x.sales, x.prevSales) ?? -Infinity, disc: share, stockRp: (x) => x.stockRp, days: (x) => isFinite(daysVal(x)) ? daysVal(x) : 1e9 }[ui.sortBy];
    const dir = ui.sortDir === "asc" ? 1 : -1;
    groups.sort((x, y) => (key(x.t) - key(y.t)) * dir);
  }

  let r1 = `<tr><th class="l sticky1">${DIMS[dim].label}</th><th class="grp" colspan="3">Sales</th><th class="grp" colspan="4">Full price vs discounted</th><th class="grp" colspan="4">Stock</th>`;
  STORES.forEach((st) => (r1 += `<th class="grp" colspan="2">${st}</th>`));
  let r2 = '<tr><th class="l sticky1"></th><th class="b">Sold</th><th>Net sales</th><th>Change</th><th class="b">Full price</th><th>Discounted</th><th>Discount</th><th>Disc %</th><th class="b">Quantity</th><th>Rp</th><th>Days</th><th>Top store</th>';
  STORES.forEach(() => (r2 += '<th class="b">Qty</th><th>Sales</th>'));
  let body = "";
  const total = blank();
  groups.forEach((g) => {
    const x = g.t; for (const k of Object.keys(total)) if (k !== "stores") total[k] += x[k]; x.stores.forEach((s, i) => { total.stores[i].qty += s.qty; total.stores[i].sales += s.sales; total.stores[i].stock += s.stock; });
    const max = Math.max(...x.stores.map((s) => s.sales));
    body += `<tr class="art click" data-key="${g.key}" data-art="${g.a.code}"><td class="l sticky1">${labelOf(dim, g)}</td>
      <td class="b">${qty(x.qty)}</td><td>${rp(x.sales)}</td><td>${dPct(delta(x.sales, x.prevSales))}</td>
      <td class="b">${rp(x.fullSales)}</td><td>${rp(x.discSales)}</td><td>${rp(x.discount)}</td><td>${pct(share(x) * 100)}</td>
      <td class="b">${qty(x.stock)}</td><td>${rp(x.stockRp)}</td><td>${days(x)}</td><td>${topStore(x)}</td>
      ${x.stores.map((s) => `<td class="b ${s.sales === max && max > 0 ? "store-top" : ""}">${qty(s.qty)}</td><td class="${s.sales === max && max > 0 ? "store-top" : ""}">${rp(s.sales)}</td>`).join("")}</tr>`;
  });
  const foot = `<tfoot><tr><td class="l sticky1">Total · ${groups.length}</td><td class="b">${qty(total.qty)}</td><td>${rp(total.sales)}</td><td>${dPct(delta(total.sales, total.prevSales))}</td><td class="b">${rp(total.fullSales)}</td><td>${rp(total.discSales)}</td><td>${rp(total.discount)}</td><td>${pct(share(total) * 100)}</td><td class="b">${qty(total.stock)}</td><td>${rp(total.stockRp)}</td><td>${days(total)}</td><td>${topStore(total)}</td>${total.stores.map((s) => `<td class="b">${qty(s.qty)}</td><td>${rp(s.sales)}</td>`).join("")}</tr></tfoot>`;
  document.getElementById("ex-t").innerHTML = `<thead>${r1}</tr>${r2}</tr></thead><tbody>${body}</tbody>${dim === "tags" ? "" : foot}`;
  document.getElementById("ex-count").textContent = `${groups.length} ${DIMS[dim].label.toLowerCase()}${groups.length === 1 ? "" : "s"}` + (dim === "tags" ? " · an article with two tags counts under both, so tags add up to more than the total" : "");

  const crumbs = [`<button data-crumb="-1">All</button>`].concat(ui.crumbs.map((c, i) => `<span class="sep">/</span><button data-crumb="${i}">${c.label}</button>`));
  document.getElementById("crumbs").innerHTML = crumbs.join(" ");
  document.querySelectorAll("#groupBy button").forEach((b) => b.classList.toggle("on", b.dataset.v === dim));
}

/* ---------- Store matrix ---------- */
function renderMatrix() {
  const groups = groupFacts(facts(), ui.mxRows);
  const val = (s) => ui.mxMetric === "sales" ? s.sales : ui.mxMetric === "qty" ? s.qty : s.stock;
  const fmt = (v) => ui.mxMetric === "sales" ? rp(v) : qty(v);
  groups.sort((x, y) => val(y.t) - val(x.t));
  const allMax = Math.max(1, ...groups.flatMap((g) => g.t.stores.map(val)));
  let h = `<thead><tr><th class="l sticky1">${DIMS[ui.mxRows].label}</th>${STORES.map((st) => `<th>${st}</th>`).join("")}<th class="b">Total</th></tr></thead><tbody>`;
  groups.forEach((g) => {
    const rowMax = Math.max(1, ...g.t.stores.map(val));
    h += `<tr class="click" data-art="${g.a.code}"><td class="l sticky1">${labelOf(ui.mxRows, g)}</td>${g.t.stores.map((s) => {
      const v = val(s), m = ui.mxScale === "row" ? rowMax : allMax;
      const bg = ui.mxMode === "heat" && v > 0 ? `background:rgba(37,99,235,${(0.06 + 0.44 * v / m).toFixed(3)})` : "";
      return `<td class="heat" style="${bg}">${fmt(v)}</td>`;
    }).join("")}<td class="b">${fmt(val(g.t))}</td></tr>`;
  });
  document.getElementById("mx-t").innerHTML = h + "</tbody>";
}

/* ---------- Product detail ---------- */
function openDetail(code) {
  const a = ARTICLES.find((x) => x.code === code); if (!a) return;
  const rows = facts().filter((f) => f.a.code === code);
  const t = rows.reduce(fold, blank());
  const skus = groupFacts(rows, "sku").sort((x, y) => x.k.code.localeCompare(y.k.code));
  const fact = (l, v) => `<div><div class="l">${l}</div><div class="v">${v}</div></div>`;
  let h = `<button class="x" id="sheet-x" aria-label="Close">×</button><h3>${a.name}</h3><div class="code">${a.code}</div>
    <div class="facts">${fact("Division", a.division)}${fact("Tags", a.tags.join(", "))}${fact("Supplier", a.supplier)}${fact("HPP", "Rp " + n0.format(a.hpp))}
    ${fact("Price", "Rp " + n0.format(a.price))}${fact("Sold", n0.format(t.qty) + " pcs")}${fact(state.basis === "net" ? "Net sales" : "Gross sales", rpFull(t.sales))}${fact("Stock", n0.format(t.stock) + " pcs · " + rpFull(t.stockRp))}</div>`;
  h += `<div class="card"><div class="card-h"><span>SKUs</span></div><div class="scroll short"><table style="width:100%"><thead><tr><th class="l">SKU</th><th class="l">Color</th><th class="l">Size</th><th>Sold</th><th>Sales</th><th>Disc %</th><th>Stock</th><th>Days</th></tr></thead><tbody>${
    skus.map((g) => `<tr><td class="l code">${g.k.code}</td><td class="l"><span class="dot" style="background:${g.k.colour[1]}"></span>${g.k.colour[0]}</td><td class="l">${g.k.size}</td><td>${qty(g.t.qty)}</td><td>${rp(g.t.sales)}</td><td>${pct(g.t.discSales / Math.max(1, g.t.fullSales + g.t.discSales) * 100)}</td><td>${qty(g.t.stock)}</td><td>${days(g.t)}</td></tr>`).join("")}</tbody></table></div></div>`;
  h += `<div class="card"><div class="card-h"><span>Stores</span></div><div class="scroll short"><table style="width:100%"><thead><tr><th class="l">Store</th><th>Sold</th><th>Full price</th><th>Discounted</th><th>Sales</th><th>Stock</th><th>Days</th></tr></thead><tbody>${
    STORES.map((st, i) => { const x = rows.filter((f) => f.si === i).reduce(fold, blank()); return `<tr><td class="l">${st}</td><td>${qty(x.qty)}</td><td>${rp(x.fullSales)}</td><td>${rp(x.discSales)}</td><td>${rp(x.sales)}</td><td>${qty(x.stock)}</td><td>${days(x)}</td></tr>`; }).join("")}</tbody></table></div></div>`;
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = h; sheet.classList.add("on"); sheet.setAttribute("aria-hidden", "false");
  document.getElementById("scrim").classList.add("on");
  document.getElementById("sheet-x").addEventListener("click", closeDetail);
}
function closeDetail() { document.getElementById("sheet").classList.remove("on"); document.getElementById("scrim").classList.remove("on"); document.getElementById("sheet").setAttribute("aria-hidden", "true"); }
document.getElementById("scrim").addEventListener("click", closeDetail);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

/* ---------- routing and controls ---------- */
const TITLES = { overview: "Overview", explorer: "Explorer", matrix: "Store matrix", all: "All data" };
function updateDock() {
  const f = new Date(document.getElementById("from").value), t = new Date(document.getElementById("to").value);
  const fmt = (x) => x.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  document.getElementById("range").textContent = `${fmt(f)} – ${fmt(t)}`;
  const active = [document.getElementById("div").value, document.getElementById("tag").value, ui.sortBy, document.getElementById("cmp").value === "ly" ? "ly" : ""].filter(Boolean).length + ui.crumbs.length;
  document.getElementById("sfCount").textContent = active ? String(active) : "";
}
function renderView() {
  updateDock();
  if (ui.view === "overview") renderOverview();
  if (ui.view === "explorer") renderExplorer();
  if (ui.view === "matrix") renderMatrix();
  if (ui.view === "all") { render(); updateDock(); }
}
document.querySelectorAll("#tabs button[data-view]").forEach((link) => link.addEventListener("click", (e) => {
  e.preventDefault(); ui.view = link.dataset.view; document.body.dataset.view = ui.view;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === link));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === "v-" + ui.view));
  document.getElementById("title").textContent = TITLES[ui.view];
  renderView();
}));
for (const id of ["lens", "groupBy", "mxRows", "mxMetric", "mxMode", "mxScale", "sortDir"]) document.getElementById(id).addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  ui[id] = b.dataset.v;
  if (id === "groupBy") ui.crumbs = [];
  document.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle("on", x === b));
  renderView();
});
document.getElementById("ex-t").addEventListener("click", (e) => {
  const tr = e.target.closest("tr.click"); if (!tr || !e.target.closest("td.sticky1")) return;
  const dim = ui.groupBy;
  if (dim === "article" || dim === "sku") return openDetail(tr.dataset.art);
  const label = tr.querySelector(".name").textContent.trim();
  ui.crumbs.push({ dim, value: tr.dataset.key, label });
  ui.groupBy = DIMS[dim].next;
  renderExplorer();
});
document.getElementById("crumbs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-crumb]"); if (!b) return;
  const i = Number(b.dataset.crumb);
  if (i < 0) { ui.crumbs = []; ui.groupBy = "article"; }
  else { const c = ui.crumbs[i]; ui.crumbs = ui.crumbs.slice(0, i + 1); ui.groupBy = DIMS[c.dim].next; }
  renderExplorer();
});
for (const id of ["ov-lists", "mx-t"]) document.getElementById(id).addEventListener("click", (e) => {
  const tr = e.target.closest("tr.click"); if (tr && (ui.view === "overview" || ui.mxRows === "article")) openDetail(tr.dataset.art);
});
for (const id of ["q", "div", "tag", "from", "to", "cmp"]) document.getElementById(id).addEventListener(id === "q" ? "input" : "change", renderView);
document.getElementById("basis").addEventListener("click", () => setTimeout(renderView));
document.getElementById("sortBy").addEventListener("change", (e) => { ui.sortBy = e.target.value; renderView(); });
const panel = document.getElementById("panel"), sfBtn = document.getElementById("sfBtn");
function setPanel(open) { panel.classList.toggle("on", open); panel.setAttribute("aria-hidden", String(!open)); sfBtn.setAttribute("aria-expanded", String(open)); }
sfBtn.addEventListener("click", () => setPanel(!panel.classList.contains("on")));
document.getElementById("rangeBtn").addEventListener("click", () => setPanel(!panel.classList.contains("on")));
document.addEventListener("pointerdown", (e) => { if (panel.classList.contains("on") && !panel.contains(e.target) && !e.target.closest("#sfBtn, #rangeBtn")) setPanel(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setPanel(false); });
document.body.dataset.view = ui.view;
renderView();
</script>
</body>
</html>
