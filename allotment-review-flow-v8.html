<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allotment review · Version 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens: frontend-hub/design-system/tokens.css (All white). Board, cards and sheets copied from allotment-board-options.html (17 Oct, measured on :5350). */
:root {
  --ink: #1d1d1f; --body: #6e6e73; --mute: #6e6e73; --faint: #c7c7cc;
  --canvas: #fff; --soft: #fafafb; --soft-2: #f2f2f5; --segment-track: #f2f2f4;
  --row-line: #eeeef1; --hairline: #e8e8ec; --hairline-strong: #c7c7cc; --stone: #e8ebf0;
  --accent: #2862dc; --accent-bg: #eef3fc; --warn: #c9892e; --warn-fg: #a66c1f; --warn-bg: #fbf3e6;
  --bad-fg: #d70015; --bad-bg: #fdecee; --ok: #36b827; --ok-fg: #248a3d; --ok-bg: #eaf6ec;
  --shadow-soft: 0 1px 2px rgba(0,0,0,.04); --shadow-segment: 0 1px 3px rgba(0,0,0,.12);
  --hatch: repeating-linear-gradient(135deg, color-mix(in oklab, var(--ink) 5%, transparent) 0 7px, transparent 7px 14px);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --font: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; font-family: var(--font); font-size: 15px; line-height: 1.45; color: var(--ink); background: var(--stone); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { display: block; }
p { margin: 0; }

/* ── Prototype chrome ─────────────────────────────────────────────────── */
.chrome { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--canvas); border-bottom: 1px solid var(--hairline); }
.chrome .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; flex-basis: 100%; }
.chrome .row[hidden] { display: none; }
.lab { color: var(--body); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--segment-track); max-width: 100%; }
.seg[hidden] { display: none; }
.seg button { height: 30px; padding: 0 11px; border: 0; border-radius: 6px; background: none; color: var(--body); font-weight: 500; white-space: nowrap; cursor: pointer; }
.seg button[aria-pressed="true"] { border-radius: 7px; background: var(--canvas); color: var(--ink); box-shadow: var(--shadow-segment); }
.seg .n { margin-left: 6px; color: var(--warn-fg); font-weight: 600; }
.chrome .reset, .chrome .helper { height: 30px; border: 0; background: none; color: var(--accent); font-weight: 500; cursor: pointer; }
.chrome .reset { margin-left: auto; }
.chrome .helper[hidden] { display: none; }

/* ── Shell ────────────────────────────────────────────────────────────── */
.stage { position: relative; flex: 1 0 auto; min-height: 640px; display: flex; gap: 12px; width: 100%; margin: 0 auto; padding: 12px; overflow: hidden; }
.stage[data-device="phone"] { flex: none; height: 860px; min-height: 0; max-width: 414px; margin: 12px auto; padding: 0; border-radius: 28px; background: var(--canvas); box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 20px 50px rgba(0,0,0,.12); }
.stage[data-device="phone"] .panel { display: none; }
.panel { flex: none; width: 216px; display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; border-radius: 12px; background: var(--canvas); }
.panel h2 { margin: 2px 10px 12px; font-size: 17px; font-weight: 600; }
.panel .chip { margin: 12px 10px 6px; align-self: flex-start; padding: 0 8px; border-radius: 6px; background: var(--soft-2); color: var(--body); font-size: 12px; line-height: 22px; }
.nav { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--ink); }
.nav.on { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--bad-fg); color: #fff; font-weight: 600; font-size: 13px; line-height: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.page { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px 24px; border-radius: 16px; background: var(--canvas); box-shadow: 0 0 0 1px rgba(0,0,0,.05); overflow: hidden; }
.stage[data-device="phone"] .page { padding: 0; border-radius: 0; box-shadow: none; }
.head { flex: none; display: flex; align-items: center; gap: 8px; min-height: 40px; margin-bottom: 16px; }
.head h1 { margin: 0 auto 0 0; font-size: 17px; line-height: 24px; font-weight: 600; }
.ghost { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--canvas); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color 150ms ease, transform 160ms var(--ease-out); }
.ghost:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .ghost:hover { background: var(--soft); } }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }

/* ── Lanes + cards (board) ────────────────────────────────────────────── */
.lanes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr) 16px minmax(0, 1fr); gap: 4px; }
.arrow { display: flex; justify-content: center; padding-top: 17px; color: var(--faint); }
.lane { min-height: 0; display: flex; flex-direction: column; border-radius: 12px; background: var(--soft-2); }
.lane-h { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.lane-h h2 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
.lane-h .n { margin-left: auto; color: var(--body); font-weight: 500; font-variant-numeric: tabular-nums; }
.lane-b { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 0 8px 8px; }
.none { padding: 28px 8px; text-align: center; color: var(--body); }
.card { position: relative; flex: none; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--hairline); border-radius: 10px; background: var(--canvas); box-shadow: var(--shadow-soft); text-align: left; cursor: pointer; transition: border-color 150ms var(--ease-out), transform 160ms var(--ease-out); }
.card:active:not(.off) { transform: scale(.985); }
@media (hover: hover) and (pointer: fine) { .card:not(.off):hover { border-color: var(--hairline-strong); } }
.card.off { background: var(--soft); cursor: default; }
.card.off .c-in { opacity: .6; }
.card.arrive { animation: arrive 900ms var(--ease-out); }
@keyframes arrive { 0% { box-shadow: 0 0 0 3px rgba(40,98,220,.45); border-color: var(--accent); } 100% { box-shadow: 0 0 0 0 rgba(40,98,220,0); } }
.strip { flex: none; display: flex; align-items: center; height: 28px; padding: 0 16px; color: #fff; font-weight: 600; white-space: nowrap; }
.strip.info { background: var(--accent); }
.strip.warn { background: var(--warn-fg); }
.strip.grey { background: var(--soft-2); color: var(--body); }
.c-in { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; }
.c-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.c-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; line-height: 24px; font-weight: 600; }
.c-fig { flex: none; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.c-fig small { font-size: 15px; font-weight: 400; color: var(--body); }
.c-sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--body); }
.c-lines { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--hairline); }
.c-line { display: flex; justify-content: space-between; gap: 12px; color: var(--body); font-variant-numeric: tabular-nums; }
.c-line .wait { color: var(--warn-fg); font-weight: 500; }
.c-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 30px; margin-top: 10px; }
.c-meta { min-width: 0; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tint { flex: none; display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-weight: 600; white-space: nowrap; }
.tint.mute { color: var(--body); font-weight: 500; }
.chev { flex: none; margin-right: -4px; color: var(--faint); }

/* ── Phone board / lists ──────────────────────────────────────────────── */
.ph-top { flex: none; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 20px; border-bottom: 1px solid var(--hairline); font-size: 20px; font-weight: 600; }
.ph-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 104px; }
.ph-h { display: flex; align-items: center; gap: 8px; padding: 14px 4px 8px; }
.ph-h b { font-size: 16px; font-weight: 600; }
.ph-h .n { color: var(--mute); font-variant-numeric: tabular-nums; }
.ph-sec { display: flex; flex-direction: column; gap: 10px; }
.dock { position: absolute; left: 10px; right: 10px; bottom: 14px; z-index: 6; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 28px; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.12); }
.dock select { flex: 1; height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: var(--soft-2); font-weight: 500; outline: none; }

/* ── MD page ──────────────────────────────────────────────────────────── */
.kpis { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-bottom: 18px; }
.kpi { padding: 0 16px; border-left: 1px solid var(--hairline); }
.kpi:first-child { padding-left: 0; border-left: 0; }
.kpi .l { color: var(--body); font-size: 14px; }
.kpi .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .v.bad { color: var(--bad-fg); }
.kpi .v.warn { color: var(--warn-fg); }
.tabs { flex: none; display: flex; gap: 24px; margin-bottom: 16px; border-bottom: 1px solid var(--hairline); }
.tabs button { position: relative; height: 40px; padding: 0; border: 0; background: none; color: var(--body); font-weight: 500; cursor: pointer; }
.tabs button .n { margin-left: 6px; color: var(--mute); font-variant-numeric: tabular-nums; }
.tabs button .n.hot { color: var(--warn-fg); font-weight: 600; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
.dcard { border: 1px solid var(--hairline); border-radius: 12px; background: var(--canvas); }
.dcard.fresh { animation: arrive 900ms var(--ease-out); }
.d-in { padding: 16px 18px; }
.d-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.d-sup { font-size: 17px; line-height: 24px; font-weight: 600; }
.d-fig { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.d-fig.warn { color: var(--warn-fg); }
.d-sub { color: var(--body); }
.d-sub .mono, .mono { font-family: var(--mono); font-size: 14px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tile { display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 8px; background: var(--soft-2); }
.tile b { font-weight: 500; }
.tile .w { display: inline-flex; align-items: center; gap: 6px; color: var(--body); }
.tile .w i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.tile .w.info i { background: var(--accent); } .tile .w.ok i { background: var(--ok); } .tile .w.pk i { background: var(--warn); }
.tile.review { background: var(--warn-bg); }
.tile.review .w { color: var(--warn-fg); font-weight: 600; }
.tile.review .w i { background: var(--warn-fg); }
.d-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--hairline); }
.d-foot .who { margin-right: auto; color: var(--body); }
.why-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 10px; }
.tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 7px; font-weight: 500; white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
.tag.bad { background: var(--bad-bg); color: var(--bad-fg); }
.tag.info { background: var(--accent-bg); color: var(--accent); }
.tag.ok { background: var(--ok-bg); color: var(--ok-fg); }
.tag.grey { background: var(--soft-2); color: var(--body); }
.empty { padding: 56px 16px; text-align: center; color: var(--body); }

/* ── Buttons ──────────────────────────────────────────────────────────── */
.btn-s { flex: none; height: 30px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform 160ms var(--ease-out), filter 150ms ease; }
.btn-s.red { background: var(--bad-fg); }
.btn-s:disabled { opacity: .35; cursor: default; filter: none; transform: none; }
.btn-s.ghost { border: 1px solid var(--hairline); background: var(--canvas); color: var(--ink); font-weight: 500; }
@media (hover: hover) and (pointer: fine) { .btn-s.ghost:hover { filter: none; background: var(--soft); } }
.btn-s:active, .btn:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .btn-s:hover, .btn:hover { filter: brightness(1.08); } }
.btn { height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform 160ms var(--ease-out), filter 150ms ease, opacity 150ms ease; }
.btn:disabled { opacity: .4; cursor: default; filter: none; transform: none; }
.btn.ghosty { border: 1px solid var(--hairline); background: var(--canvas); color: var(--ink); }
.plain { height: 40px; padding: 0 4px; border: 0; background: none; color: var(--accent); font-weight: 500; cursor: pointer; white-space: nowrap; }
.plain.red { color: var(--bad-fg); }

/* ── Sheet ────────────────────────────────────────────────────────────── */
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(208,208,213,.48); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease-out); }
.scrim.on { opacity: 1; pointer-events: auto; transition-duration: 340ms; }
.sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; z-index: 31; width: min(760px, calc(100% - 24px)); display: flex; flex-direction: column; border-radius: 16px; background: var(--canvas); box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 24px 64px rgba(0,0,0,.14); transform: translateX(calc(100% + 24px)); transition: transform 200ms var(--ease-out); }
.sheet.on { transform: none; transition: transform 340ms var(--ease-drawer); }
/* A narrow window gives the lanes the room the side menu would take. */
@media (max-width: 900px) { .stage[data-device="desk"] .panel { display: none; } .stage[data-device="desk"] .page { padding: 16px; } }
/* Desk: the sheet, its veil and the toasts hold to the window, so a short window still shows them. */
.stage[data-device="desk"] .scrim, .stage[data-device="desk"] .sheet, .stage[data-device="desk"] .toasts { position: fixed; }
.stage[data-device="phone"] .sheet { top: 8px; right: 8px; bottom: 8px; width: calc(100% - 16px); border-radius: 22px; }
.sh-h { flex: none; display: flex; align-items: flex-start; gap: 12px; padding: 22px 24px 16px; border-bottom: 1px solid var(--hairline); }
.sh-h .eyebrow { color: var(--body); }
.sh-h h3 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; }
.x { flex: none; display: grid; place-items: center; width: 36px; height: 36px; margin: -6px -8px 0 auto; border: 0; border-radius: 8px; background: none; color: var(--body); cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .x:hover { background: var(--soft-2); color: var(--ink); } }
.sh-b { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 24px 20px; }
.stage[data-device="phone"] .sh-b, .stage[data-device="phone"] .sh-h, .stage[data-device="phone"] .sh-f { padding-left: 16px; padding-right: 16px; }
.sh-f { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 12px; padding: 14px 24px; border-top: 1px solid var(--hairline); }
.sh-f .note { margin-right: auto; color: var(--body); }
.sh-f .note.bad { color: var(--bad-fg); }
.sh-f .left { margin-right: auto; }
.stage[data-device="phone"] .sh-f .btn { flex: 1; height: 44px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 20px 0 6px; font-weight: 600; }
.sec-h span { color: var(--body); font-weight: 400; }
.sh-b > .sec-h:first-child { margin-top: 8px; }
.art-h { display: flex; align-items: center; gap: 12px; margin: 16px 0 4px; }
.sw { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.thumb { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--soft-2); color: var(--body); }
.art-h b { display: block; font-weight: 600; }
.art-h span { color: var(--body); }
.t { width: 100%; border-collapse: collapse; }
.t th { height: 40px; color: var(--body); font-weight: 500; text-align: left; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
.t td { height: 52px; border-bottom: 1px solid var(--row-line); font-variant-numeric: tabular-nums; }
.t tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; }
.t .sub { display: block; color: var(--body); font-family: var(--mono); font-size: 14px; }
.t .bad { color: var(--bad-fg); font-weight: 600; }
.t .warn { color: var(--warn-fg); font-weight: 600; }
.t .ok { color: var(--ok-fg); }
.t tfoot td { height: 48px; font-weight: 600; border-top: 1px solid var(--hairline); border-bottom: 0; }
.step { display: inline-flex; align-items: center; height: 36px; border: 1px solid var(--hairline); border-radius: 8px; }
.step button { width: 34px; height: 34px; border: 0; background: none; color: var(--body); font-size: 17px; cursor: pointer; }
.step button:disabled { opacity: .3; cursor: default; }
.step b { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
.chips button { height: 36px; padding: 0 14px; border: 1px solid var(--hairline); border-radius: 18px; background: var(--canvas); cursor: pointer; transition: transform 160ms var(--ease-out), background-color 150ms ease; }
.chips button:active { transform: scale(.97); }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.lbl { display: block; margin: 18px 0 6px; font-weight: 500; }
.lbl span { color: var(--bad-fg); }
.field { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--canvas); outline: none; }
textarea.field { height: 72px; padding: 10px 12px; resize: none; }
.field:focus { border-color: var(--accent); }
.tick { display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid var(--row-line); cursor: pointer; }
.tick input { width: 18px; height: 18px; accent-color: var(--accent); }
.tick.red input { accent-color: var(--bad-fg); }
.tick .grow { flex: 1; }
.tick .sub { display: block; color: var(--body); }
.why-box { display: flex; flex-direction: column; gap: 2px; margin: 12px 0 4px; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); }
.why-box b { color: var(--warn-fg); font-weight: 600; }
.why-box span { color: var(--body); }
.rkpi { display: flex; flex-wrap: wrap; gap: 0; margin: 12px 0 4px; }
.rkpi .kpi { min-width: 96px; }
.receipt { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.receipt .r-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--hairline); border-radius: 10px; }
.receipt .r-row svg { flex: none; margin-top: 2px; }
.receipt .r-row b { font-weight: 600; }
.receipt .r-row span { display: block; color: var(--body); }
.pair { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin: 8px 0; border: 1px solid var(--warn); border-radius: 10px; background: var(--warn-bg); }
.pair .grow { flex: 1; min-width: 0; }
.pair b { display: block; font-weight: 600; }
.pair span { display: block; color: var(--body); }
.scan { position: relative; }
.scan svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--mute); }
.scan input { padding-left: 38px; }
.cnt { width: 64px; height: 40px; border: 1px solid var(--hairline); border-radius: 8px; text-align: center; font-weight: 600; outline: none; }
.cnt:focus { border-color: var(--accent); }
.rm { width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--body); cursor: pointer; }
.stampw { display: inline-block; rotate: -6deg; padding: 0 10px; border: 2.5px double currentColor; border-radius: 8px; font-size: 13px; line-height: 24px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.stampw.ok { color: var(--ok-fg); }
.stampw.warn { color: var(--warn-fg); }

/* ── Review matrix = New allotment's grid (matrix.tsx: article 17.5rem, Stock 5rem, store 7rem, gutter 5.5rem, header 76, rows 56, boxes 44) */
.sheet.wide { width: min(1120px, calc(100% - 24px)); }
.stage[data-device="desk"] .sheet.full { left: 12px; width: auto; }
.sheet.full .sh-b, .sheet.full .sh-h, .sheet.full .sh-f { padding-left: 32px; padding-right: 32px; }
/* The matrix reads like a spreadsheet: every cell has its lines, groups (All
   stores, each store) are closed by a darker line, and only a cell that
   differs is coloured. */
.mx-wrap { --grid: #e2e2e8; --grid-strong: #c4c4cc; margin-top: 16px; overflow-x: auto; border: 1px solid var(--grid-strong); border-radius: 10px; }
.mx { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-variant-numeric: tabular-nums; }
.mx col.c-id { width: 320px; }
.mx th, .mx td { height: 52px; padding: 0 12px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); text-align: center; white-space: nowrap; }
.mx tr > :last-child { border-right: 0; }
.mx tbody tr:last-child > * { border-bottom: 0; }
.mx .ge { border-right-color: var(--grid-strong); }
.mx .id { position: sticky; left: 0; z-index: 1; text-align: left; white-space: normal; background: var(--canvas); border-right-color: var(--grid-strong); }
.mx thead th { height: 44px; background: var(--soft); color: var(--body); font-weight: 500; }
.mx thead th.id { z-index: 2; background: var(--soft); }
.mx thead tr:last-child th, .mx thead th[rowspan] { border-bottom-color: var(--grid-strong); }
.mx thead tr.top th { height: 64px; }
.mx-store { display: flex; flex-direction: column; align-items: center; line-height: 20px; }
.mx-store b { color: var(--accent); font-weight: 600; }
.mx-store span { color: var(--body); }
.mx-store em { color: var(--warn-fg); font-style: normal; font-weight: 500; }
.mx tr.div td { height: 40px; padding: 0 14px; background: var(--canvas); font-weight: 600; text-align: left; }
.mx tr.div td span { margin-left: 8px; color: var(--body); font-weight: 400; }
.mx tr.art > * { height: auto; padding-top: 12px; padding-bottom: 12px; background: var(--soft); font-weight: 600; vertical-align: middle; }
.mx td.was { color: var(--body); }
.mx td.bad { background: var(--bad-bg); color: var(--bad-fg); font-weight: 600; }
.mx td.warn { background: var(--warn-bg); color: var(--warn-fg); font-weight: 600; }
.mx td.wait { background-image: var(--hatch); color: var(--mute); }
.mx .bad-t { color: var(--bad-fg); }
.mx .warn-t { color: var(--warn-fg); }
.mx .z { color: var(--faint); font-weight: 400; }
.mx s { margin-right: 8px; color: var(--mute); font-weight: 400; }
.mx-art { display: flex; align-items: flex-start; gap: 12px; font-weight: 400; }
.mx-thumb { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--canvas); }
.mx-art b { display: block; color: var(--accent); font-weight: 600; }
.mx-art .mono { display: block; color: var(--mute); }
.mx-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.mx-tags i { padding: 0 8px; border-radius: 6px; background: var(--soft-2); color: var(--body); font-style: normal; line-height: 24px; }
.mx-sku { display: flex; flex-direction: column; }
.mx-sku > span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.mx-sku .mono { color: var(--mute); }
.bdg { display: inline-block; margin-left: 8px; min-width: 28px; padding: 0 7px; border-radius: 11px; background: var(--bad-fg); color: #fff; font-style: normal; font-weight: 600; line-height: 22px; }
.bdg.warn { background: var(--warn-fg); }
.mx-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.mx-pair h4 { margin: 18px 0 0; font-size: 15px; font-weight: 600; }
.mx-pair h4 span { color: var(--body); font-weight: 400; }
.mx-pair .mx col.c-id { width: 230px; }
.mx-pair .mx-thumb { display: none; }
.mx-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 16px; }
.mx-pick { margin-top: 14px; }
@media (max-width: 1000px) { .mx-pair { grid-template-columns: minmax(0, 1fr); } }
.stage[data-device="phone"] .mx-pair { grid-template-columns: minmax(0, 1fr); }
.stage[data-device="phone"] .mx col.c-id { width: 132px; }
.stage[data-device="phone"] .mx th, .stage[data-device="phone"] .mx td { padding: 0 8px; }
.stage[data-device="phone"] .mx-thumb { display: none; }
/* Talking cells, folded rows, lit cells (H, J). */
.mx td small { display: block; margin-top: 2px; font-size: 15px; font-weight: 500; line-height: 20px; white-space: normal; }
.mx td.hl { box-shadow: inset 0 0 0 2px var(--accent); }
.mx tr.fold td { height: 44px; padding: 0 14px; text-align: left; background: var(--soft); }
.mx tr.fold button { height: 32px; padding: 0; border: 0; background: none; color: var(--accent); font-weight: 500; cursor: pointer; }
/* Summary models (F–J): a lined list in the matrix's own grid. */
.iss { --grid: #e2e2e8; --grid-strong: #c4c4cc; margin-top: 8px; border: 1px solid var(--grid-strong); border-radius: 10px; overflow: hidden; }
.iss-h, .iss-r { display: grid; grid-template-columns: var(--cols); align-items: stretch; width: 100%; }
.iss-f { --cols: minmax(0, 1.1fr) minmax(0, 1fr); }
.iss-g { --cols: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr); }
.iss-h > *, .iss-r > * { display: flex; align-items: center; min-width: 0; padding: 12px 14px; border-right: 1px solid var(--grid); }
.iss-h > :last-child, .iss-r > :last-child { border-right: 0; }
.iss-h { background: var(--soft); color: var(--body); font-weight: 500; border-bottom: 1px solid var(--grid-strong); }
.iss-r + .iss-r { border-top: 1px solid var(--grid); }
button.iss-r { padding: 0; border: 0; background: var(--canvas); color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background-color 150ms ease; }
button.iss-r + button.iss-r { border-top: 1px solid var(--grid); }
@media (hover: hover) and (pointer: fine) { button.iss-r:hover { background: var(--soft); } }
button.iss-r[aria-pressed="true"] { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
.iss .what { gap: 12px; }
.iss .nm { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.iss .nm > b { font-weight: 600; }
.iss .nm > span:not(.route) { color: var(--body); }
.iss .nm .route { margin-top: 4px; }
.kind { flex: none; width: 128px; padding: 0 8px; border-radius: 6px; font-weight: 600; line-height: 28px; text-align: center; white-space: nowrap; }
.kind.warn { background: var(--warn-bg); color: var(--warn-fg); }
.kind.bad { background: var(--bad-bg); color: var(--bad-fg); }
.mx-thumb.sm { width: 36px; height: 36px; }
.mx-thumb.nao { color: var(--mute); font-weight: 600; border-style: dashed; }
.route { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.route .lb { color: var(--body); }
.route .st { white-space: nowrap; }
.route .st b { color: var(--accent); font-weight: 600; }
.route .arr { flex: none; color: var(--warn-fg); }
.oc { flex-direction: column; align-items: flex-start !important; justify-content: center; gap: 2px; transition: background-color 150ms ease; }
.oc b { font-weight: 600; }
.oc > span:not(.ol) { color: var(--body); }
.oc .ol { display: none; color: var(--body); }
.oc.both { grid-column: span 2; }
.iss-r .oc.both .ol { display: block; }
.sheet[data-hl="asis"] .oc.asis, .sheet[data-hl="refill"] .oc.refill, .sheet[data-hl="asis"] .oc.both, .sheet[data-hl="refill"] .oc.both { background: var(--accent-bg); }
.scs { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-top: 8px; }
.sc { border: 1px solid #c4c4cc; border-radius: 10px; overflow: hidden; }
.sc-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--soft); border-bottom: 1px solid #c4c4cc; }
.sc-h .st b { color: var(--accent); font-weight: 600; }
.sc-n { color: var(--body); white-space: nowrap; }
.sc-n b { color: var(--ink); font-weight: 600; }
.sc-l { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.sc-l + .sc-l { border-top: 1px solid #e2e2e8; }
.sc-l .nm { display: flex; flex-direction: column; min-width: 0; }
.sc-l .nm b { font-weight: 600; }
.sc-l .nm span { color: var(--body); }
.fig { flex: none; min-width: 40px; padding: 0 8px; border-radius: 6px; font-weight: 600; line-height: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.fig.warn { background: var(--warn-bg); color: var(--warn-fg); }
.fig.bad { background: var(--bad-bg); color: var(--bad-fg); }
.sc-e { margin: 0; padding: 14px; color: var(--body); }
.stage[data-device="phone"] .iss-f, .stage[data-device="phone"] .iss-g { --cols: minmax(0, 1fr); }
.stage[data-device="phone"] .iss-h { display: none; }
.stage[data-device="phone"] .iss-r > * { border-right: 0; }
.stage[data-device="phone"] .iss-r > * + * { border-top: 1px solid var(--grid); }
.stage[data-device="phone"] .iss-f .iss-r > * + * { border-top: 0; padding-top: 0; }
.stage[data-device="phone"] .oc .ol { display: block; }
.stage[data-device="phone"] .oc.both { grid-column: auto; }
.stage[data-device="phone"] .kind { width: auto; }
.stage[data-device="phone"] .iss .what { flex-direction: column; align-items: flex-start !important; gap: 8px; }
.stage[data-device="phone"] .iss-r + .iss-r, .stage[data-device="phone"] button.iss-r + button.iss-r { border-top: 1px solid var(--grid-strong); }
.stage[data-device="phone"] .iss-g .what { background: var(--soft); }
.stage[data-device="phone"] .iss .mx-thumb { display: none; }
.stage[data-device="phone"] .scs { grid-template-columns: minmax(0, 1fr); }
.stage[data-device="phone"] .sc-l .mx-thumb { display: none; }

/* ── Store count = the hub's Receiving count sheet (Article | Counted | In pieces) */
.cs { margin-top: 12px; border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; }
.cs-h, .cs-row { display: grid; grid-template-columns: minmax(0, 1fr) 190px 110px; align-items: center; gap: 12px; padding: 0 16px; }
.cs-h { height: 40px; border-bottom: 1px solid var(--hairline); background: var(--soft); color: var(--body); font-weight: 500; }
.cs-art { padding-bottom: 8px; border-bottom: 1px solid var(--hairline); }
.cs-row { min-height: 56px; }
.cs-row.top { padding-top: 14px; padding-bottom: 6px; align-items: start; }
.cs-v { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--body); }
.cs-v .mono { color: var(--mute); }
.cs-mid { display: flex; align-items: center; gap: 10px; }
.cs-in { display: flex; align-items: center; gap: 8px; }
.cs-in input { width: 96px; height: 44px; border: 1px solid var(--hairline); border-radius: 7px; background: var(--canvas); text-align: center; font-weight: 600; outline: none; }
.cs-in input:focus { border-color: var(--accent); }
.cs-in span { color: var(--body); }
.cs-tot { text-align: right; font-variant-numeric: tabular-nums; color: var(--body); }
.cs-add { padding: 14px 16px; border-bottom: 1px solid var(--hairline); background: var(--soft); }
.cs-foot { min-height: 52px; }
.cs-foot b { font-weight: 600; }
.cs-foot .cs-tot { color: var(--ink); }
.hits { display: flex; flex-direction: column; margin-top: 8px; overflow: hidden; border: 1px solid var(--hairline); border-radius: 10px; background: var(--canvas); }
.hits:empty { display: none; }
.hits button { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 14px; border: 0; border-bottom: 1px solid var(--row-line); background: var(--canvas); text-align: left; cursor: pointer; }
.hits button:last-child { border-bottom: 0; }
@media (hover: hover) and (pointer: fine) { .hits button:hover { background: var(--soft); } }
.hits b { display: block; font-weight: 600; }
.hits .mono { display: block; color: var(--mute); }
.stage[data-device="phone"] .cs-h { grid-template-columns: minmax(0, 1fr) 110px; }
.stage[data-device="phone"] .cs-row { grid-template-columns: minmax(0, 1fr) 150px; }
.stage[data-device="phone"] .cs-h .cs-mid, .stage[data-device="phone"] .cs-row .cs-tot:empty { display: none; }
.stage[data-device="phone"] .cs-row.top { grid-template-columns: minmax(0, 1fr) auto; }
.stage[data-device="phone"] .cs-row.top .cs-mid { display: none; }
.stage[data-device="phone"] .cs-in input { width: 80px; }

/* ── Store app list ───────────────────────────────────────────────────── */
.scard { border: 1px solid var(--hairline); border-radius: 12px; background: var(--canvas); }
.s-in { display: flex; justify-content: space-between; gap: 12px; padding: 16px 18px; }
.s-in b { display: block; font-family: var(--mono); font-size: 15px; font-weight: 600; }
.s-in span { color: var(--body); }
.s-fig { text-align: right; }
.s-fig b { font-family: var(--font); font-size: 22px; line-height: 28px; }
.s-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 12px 8px 18px; border-top: 1px solid var(--hairline); color: var(--body); }

/* ── Toasts ───────────────────────────────────────────────────────────── */
.toasts { position: absolute; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.stage[data-device="phone"] .toasts { left: 12px; right: 12px; bottom: 84px; }
.toast { display: flex; flex-direction: column; min-width: 300px; max-width: 420px; padding: 12px 16px; border-radius: 12px; background: var(--canvas); box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.12); transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
@starting-style { .toast { opacity: 0; transform: translateY(8px); } }
.toast b { font-weight: 600; }
.toast span { color: var(--body); }
.toast.out { opacity: 0; transform: translateY(8px); transition-duration: 150ms; }
@media (prefers-reduced-motion: reduce) { .card, .sheet, .sheet.on, .toast, .scrim { transition-duration: 0ms !important; } .card.arrive, .dcard.fresh { animation: none; } }

/* Version 8: put the issue, its evidence and its decision in one workspace. */
.version-bar { display:flex; align-items:center; justify-content:space-between; gap:20px; width:100%; padding-bottom:6px; }
.version-bar b { font-size:14px; }.version-bar b span { margin-left:8px; color:var(--body); font-weight:400; }
.version-bar a { font-size:13px; color:var(--accent); text-decoration:none; }
.focused .sh-h { padding-top:18px; padding-bottom:14px; }
.focused .sh-b { padding-top:20px; }
.review-stats { display:flex; align-items:center; gap:28px; padding-bottom:18px; border-bottom:1px solid var(--hairline); margin-bottom:20px; }
.review-stat { display:flex; flex-direction:column; gap:2px; }.review-stat span,.review-stat small { color:var(--body); font-size:13px; }.review-stat b { font-size:22px; font-weight:600; letter-spacing:-.5px; }
.review-stat b small { font-size:14px; font-weight:400; letter-spacing:0; }
.review-stat.note { margin-left:auto; padding:10px 14px; border-radius:8px; background:var(--warn-bg); }.review-stat.note b { color:var(--warn-fg); font-size:15px; letter-spacing:0; }
.review-workspace { display:grid; grid-template-columns:minmax(280px,.85fr) minmax(0,1.65fr); gap:24px; align-items:start; }
.focus-section-title { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; }
.focus-section-title h4 { margin:0; font-size:15px; font-weight:600; }.focus-section-title span { color:var(--body); font-size:13px; }
.focus-issue-list { border:1px solid var(--hairline-strong); border-radius:10px; overflow:hidden; }

.focus-issue + .focus-issue { border-top:1px solid var(--hairline); }.focus-issue[aria-pressed="true"] { background:var(--accent-bg); box-shadow:inset 3px 0 var(--accent); }.focus-issue:hover { background:var(--soft); }
.issue-number { flex:none; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--soft-2); color:var(--body); font-size:12px; font-weight:600; }
.focus-issue[aria-pressed="true"] .issue-number { background:var(--accent); color:white; }
.issue-copy { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }.issue-copy b { font-size:14px; font-weight:600; }.issue-copy span { font-size:13px; color:var(--body); }.issue-copy .issue-type { align-self:flex-start; font-size:12px; font-weight:600; margin-bottom:2px; }.issue-type.warn { color:var(--warn-fg); }.issue-type.bad { color:var(--bad-fg); }
.issue-jump { color:var(--accent); font-size:16px; }.focus-help { margin-top:8px; color:var(--body); font-size:12px; }
.focused .mx-wrap { margin-top:0; border-color:var(--hairline-strong); }.focused .mx col.c-id { width:190px; }.focused .mx th,.focused .mx td { padding:6px 10px; height:52px; font-size:14px; }.focused .mx thead tr.top th { height:48px; }.focused .mx thead tr:last-child th { height:34px; font-size:12px; }.focused .mx td small { font-size:12px; line-height:16px; font-weight:400; }.focused .mx-sku .mono { font-size:11px; }.focused .mx tr.fold td { height:36px; }.focused .mx tr.fold button { font-size:12px; }.focused .mx td.hl { box-shadow:inset 0 0 0 2px var(--accent); }
.review-audit { margin-top:10px; color:var(--body); font-size:12px; }
.resolve-section { margin-top:22px; padding-top:18px; border-top:1px solid var(--hairline); }.resolve-intro { margin:3px 0 12px; color:var(--body); font-size:13px; }
.decision-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.decision-option { display:block; padding:14px 16px; border:1px solid var(--hairline-strong); border-radius:10px; background:white; text-align:left; cursor:pointer; }.decision-option:hover { border-color:var(--accent); }.decision-option[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--accent-bg); }
.decision-heading { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; }.choice-dot { display:block; width:17px; height:17px; border:1.5px solid var(--faint); border-radius:50%; background:white; }.decision-option[aria-pressed="true"] .choice-dot { border:5px solid var(--accent); }
.decision-option ul { margin:9px 0 0 26px; padding-left:13px; color:var(--body); font-size:13px; }.decision-option li+li { margin-top:6px; }.decision-option strong { color:var(--ink); font-weight:500; }.decision-option .stock-warning { display:inline; color:var(--bad-fg); font-weight:500; }
.shared-outcome { display:flex; align-items:baseline; gap:8px; margin-top:10px; color:var(--body); font-size:12px; }.shared-outcome b { color:var(--ink); font-weight:500; }
.focused .sh-f { justify-content:space-between; padding-top:12px; padding-bottom:12px; }.decision-footer { display:flex; flex-direction:column; gap:2px; margin-right:auto; font-size:13px; }.decision-footer span { color:var(--body); font-size:12px; }.focused .btn:disabled { opacity:.45; cursor:default; }
button:focus-visible,a:focus-visible { outline:3px solid #86a9f2; outline-offset:3px; }
@media(max-width:1000px) { .review-workspace { grid-template-columns:1fr; gap:20px; }.focus-issue-list { display:grid; grid-template-columns:repeat(3,1fr); }.focus-issue + .focus-issue { border-top:0; border-left:1px solid var(--hairline); }.focus-issue { padding:12px 10px; }.issue-jump { display:none; } }
.stage[data-device="phone"] .review-workspace { grid-template-columns:1fr; gap:20px; }.stage[data-device="phone"] .focus-issue-list { display:block; }.stage[data-device="phone"] .focus-issue + .focus-issue { border-left:0; border-top:1px solid var(--hairline); }.stage[data-device="phone"] .focus-issue { padding:12px; }
.stage[data-device="phone"] .review-stats { gap:20px; flex-wrap:wrap; margin-bottom:18px; padding-bottom:14px; }.stage[data-device="phone"] .review-stat b { font-size:20px; }.stage[data-device="phone"] .review-stat.note { width:100%; margin:0; flex-direction:row; align-items:center; justify-content:space-between; padding:8px 10px; }.stage[data-device="phone"] .review-stat.note b { font-size:13px; }.stage[data-device="phone"] .review-stat.note span { font-size:12px; }

<script>
/* ── Catalogue ───────────────────────────────────────────────────────── */
const ART = {
  '00000016': { name: 'Celana Chino Slim Fit', div: 'Pria', sup: 'Garmen Nusantara', kind: 'pants', tags: ['Celana'] },
  '00000017': { name: 'Kaos Basic Katun Combed', div: 'Pria', sup: 'Garmen Nusantara', kind: 'tee', tags: ['Basic', 'Kaos', 'Lengan Pendek'] },

};
const SKUS = {};
function addSkus(art, colours) {
  for (const [digit, colour, hex] of colours)
    for (const [code, size] of [['03', 'M'], ['04', 'L'], ['05', 'XL']])
      SKUS[art + digit + code] = { art, colour, size, hex };
}
addSkus('00000016', [['0', 'Khaki', '#c8ad80'], ['1', 'Black', '#2b2b2b']]);
addSkus('00000017', [['0', 'White', '#f5f5f5']]);
addSkus('00000018', [['0', 'Light Blue', '#a9c8ea'], ['1', 'White', '#f5f5f5']]);
addSkus('00000019', [['0', 'Pink', '#f2b8c6']]);
const STORES = { C001: 'Cikupa', C002: 'Muaro Bungo', C003: 'Purbalingga' };
const COUNTER = { C001: 'Maya Sari', C002: 'Dewi Lestari', C003: 'Rudi Hartono' };
const MD = 'Rina Wulandari', OPS = 'Budi Santoso';
const ALTS = {
  'ALT-00000015': { art: '00000016', date: '17 Oct' },

  'ALT-00000017': { art: '00000018', date: '16 Oct' },
};
const PICK_WHY = ['Stock in the pool could not be confirmed', 'Item not found in the pool', 'Item damaged', 'Label or equipment problem', 'Other'];
const PACK_WHY = ['Item damaged', 'Not in the picked pile', 'Wrong item', 'Other'];
const SHIP_WHY = ['Koli not found', 'Koli damaged', 'Other'];
/* The story at the store: one Light Blue M meant for C002 went into C001's koli,
   one White XL is gone, and C001 found one piece with no label. */
const STORY = {
  'SJ-HO-GUDANG-000004': { counts: { '00000018003': 2, '00000018004': 1, '00000018005': 1, '00000018103': 1, '00000018104': 1, '00000018105': 1 }, nao: 1 },
  'SJ-HO-GUDANG-000005': { counts: { '00000018004': 1, '00000018103': 1 }, nao: 0 },
};

/* ── State ───────────────────────────────────────────────────────────── */
let S;
function fresh() {
  return {
    role: S?.role ?? 'ops', device: S?.device ?? 'desk', store: S?.store ?? 'C001', waiting: S?.waiting ?? 'hidden',
    mdTab: 'review',
    plan: {
      'ALT-00000015': { C001: 10, C002: 6, C003: 1 },
      'ALT-00000016': { C001: 3, C002: 3 },
      'ALT-00000017': { C001: 6, C002: 4, C003: 2 },
    },
    picks: [
      { id: 'p1', alt: 'ALT-00000015', store: 'C002', lines: { '00000016003': 1, '00000016004': 1, '00000016005': 1, '00000016103': 1, '00000016104': 1, '00000016105': 1 }, state: 'open' },
      { id: 'p2', alt: 'ALT-00000016', store: 'C002', lines: { '00000017003': 1, '00000017004': 1, '00000017005': 1 }, state: 'open' },
      { id: 'p3', alt: 'ALT-00000015', store: 'C003', lines: { '00000016003': 1 }, state: 'open' },
    ],
    piles: {
      C001: [
        { alt: 'ALT-00000015', sku: '00000016003', qty: 1 }, { alt: 'ALT-00000015', sku: '00000016004', qty: 2 }, { alt: 'ALT-00000015', sku: '00000016005', qty: 2 },
        { alt: 'ALT-00000015', sku: '00000016103', qty: 2 }, { alt: 'ALT-00000015', sku: '00000016104', qty: 2 }, { alt: 'ALT-00000015', sku: '00000016105', qty: 1 },
        { alt: 'ALT-00000016', sku: '00000017003', qty: 1 }, { alt: 'ALT-00000016', sku: '00000017004', qty: 1 }, { alt: 'ALT-00000016', sku: '00000017005', qty: 1 },
      ],
    },
    koli: [
      { no: 'A00009', store: 'C003', lines: [{ alt: 'ALT-00000017', sku: '00000018004', qty: 1 }, { alt: 'ALT-00000017', sku: '00000018104', qty: 1 }], state: 'ready' },
    ],
    trips: [{ no: 'DSP-HO-GUDANG-000002', at: '21:24', note: 'Truk B 9123 XY · sopir Joko' }],
    deliveries: [
      { sj: 'SJ-HO-GUDANG-000004', trip: 'DSP-HO-GUDANG-000002', alt: 'ALT-00000017', store: 'C001', koli: 1, sent: { '00000018003': 1, '00000018004': 1, '00000018005': 1, '00000018103': 1, '00000018104': 1, '00000018105': 1 }, count: null, nao: 0, state: 'transit' },
      { sj: 'SJ-HO-GUDANG-000005', trip: 'DSP-HO-GUDANG-000002', alt: 'ALT-00000017', store: 'C002', koli: 1, sent: { '00000018003': 1, '00000018004': 1, '00000018103': 1, '00000018105': 1 }, count: null, nao: 0, state: 'transit' },
    ],
    reviewer: S?.reviewer ?? MD,
    mxVer: S?.mxVer ?? 'C', mxSize: S?.mxSize ?? 'full', smVer: S?.smVer ?? 'K', mxShow: 'after', mxStore: null,
    /* What the DC still holds of the SKUs a refill may ask for (others: 3). */
    dcStock: { '00000018003': 0, '00000018105': 2 },
    reviews: [], returns: [], seq: 18, koliSeq: 11, sjSeq: 6, tripSeq: 3,
    sheet: null, fresh: null, toasts: [],
  };
}
S = fresh();

/* ── Helpers ─────────────────────────────────────────────────────────── */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const pcs = (n) => `${n} ${n === 1 ? 'pc' : 'pcs'}`;
const sumOf = (o) => Object.values(o).reduce((a, b) => a + b, 0);
const shop = (id) => `${id} · ${STORES[id]}`;
const artOf = (alt) => ART[ALTS[alt].art];
const skuName = (sku) => `${SKUS[sku].colour} · ${SKUS[sku].size}`;
const now = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const altNo = () => `ALT-${String(S.seq++).padStart(8, '0')}`;
const CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const X = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4.5 4.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const SHIRT = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M8 3l4 2 4-2 5 4-3 3-2-1v12H8V9L6 10 3 7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
const SCAN = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M12 12l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const icon = (kind) => ({
  ok: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="var(--ok-bg)"/><path d="M5.5 9.2l2.3 2.3 4.7-5" stroke="var(--ok-fg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="var(--warn-bg)"/><path d="M11.5 6.5H7.5a2.5 2.5 0 000 5H12M9.5 4.5l-2 2 2 2" stroke="var(--warn-fg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  new: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="var(--accent-bg)"/><path d="M9 5.5v7M5.5 9h7" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>',
  lost: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="var(--bad-bg)"/><path d="M9 5.2v4.6M9 12.4v.2" stroke="var(--bad-fg)" stroke-width="1.7" stroke-linecap="round"/></svg>',
})[kind];

function toast(title, sub) {
  const id = Math.random();
  S.toasts.push({ id, title, sub });
  renderToasts();
  setTimeout(() => {
    const el = document.querySelector(`[data-toast="${id}"]`);
    if (el) el.classList.add('out');
    setTimeout(() => { S.toasts = S.toasts.filter((t) => t.id !== id); renderToasts(); }, 160);
  }, 4200);
}
function renderToasts() {
  $('#toasts').innerHTML = S.toasts.map((t) => `<div class="toast" data-toast="${t.id}"><b>${esc(t.title)}</b>${t.sub ? `<span>${esc(t.sub)}</span>` : ''}</div>`).join('');
}

/* ── Derived ─────────────────────────────────────────────────────────── */
const openReviews = () => S.reviews.filter((r) => r.state === 'open');
/* The stores of a receive review's trip that have not counted yet: the
   review cannot be decided before them, a wrong-store pair needs both ends. */
const waitingFor = (r) => S.deliveries.filter((d) => d.trip === r.trip && d.alt === r.alt && d.state === 'transit');
/* What a store counted beyond its delivery: physically there, not sellable,
   set aside until MD decides. */
function onHoldOf(d) {
  const out = Object.entries(d.count || {}).map(([sku, n]) => ({ sku, n: n - (d.sent[sku] || 0) })).filter((l) => l.n > 0);
  if (d.nao) out.push({ sku: null, n: d.nao });
  return out;
}
function stageOf(alt, store) {
  if (openReviews().some((r) => r.alt === alt && r.stores.includes(store))) return ['Review', 'review'];
  const dl = S.deliveries.filter((d) => d.alt === alt && d.store === store);
  const pick = S.picks.find((p) => p.alt === alt && p.store === store && p.state === 'open');
  const inPile = (S.piles[store] || []).some((l) => l.alt === alt);
  const inKoli = S.koli.some((k) => k.store === store && k.state === 'ready' && k.lines.some((l) => l.alt === alt));
  if (pick) return [inPile || inKoli || dl.length ? 'Picking' : 'To pick', ''];
  if (inPile) return ['Picked', ''];
  if (inKoli) return ['Packed', 'pk'];
  if (dl.length) return dl.every((d) => d.state === 'done') ? ['Received', 'ok'] : ['Dispatched', 'info'];
  return ['To pick', ''];
}

/* ── Chrome + shell ──────────────────────────────────────────────────── */
function render() {
  for (const [id, key] of [['role', 'role'], ['device', 'device'], ['storePick', 'store'], ['waiting', 'waiting'], ['reviewer', 'reviewer'], ['mxVer', 'mxVer'], ['mxSize', 'mxSize'], ['smVer', 'smVer']])
    document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S[key])));
  $('#storePick').hidden = S.role !== 'store';
  $('#reviewer').hidden = $('#reviewerLab').hidden = S.role !== 'md';
  $('#mxRow').hidden = $('#smRow').hidden = S.role !== 'md';
  $('#story').hidden = !(S.role === 'store' && S.sheet?.type === 'count' && STORY[S.sheet.id]);
  const n = openReviews().length;
  $('#mdN').textContent = n ? n : '';
  $('#stage').dataset.device = S.device;
  renderPanel();
  renderPage();
  renderSheet();
}
function renderPanel() {
  const rv = openReviews().length;
  const ret = S.returns.filter((r) => r.store === S.store && r.state === 'open').length;
  const nav = (label, on, badge) => `<div class="nav${on ? ' on' : ''}"><span>${label}</span>${badge ? `<span class="badge">${badge}</span>` : ''}</div>`;
  if (S.role === 'ops') {
    const work = S.picks.filter((p) => p.state === 'open').length + Object.values(S.piles).filter((p) => p.length).length + S.koli.filter((k) => k.state === 'ready').length;
    $('#panel').innerHTML = `<h2>Ops</h2>${nav('Receiving PO', false, 17)}${nav('Receiving Return', false, 2)}${nav('Quantity Checks', false, 2)}${nav('Allotment', true, work)}${nav('Return Store', false, 3)}`;
  } else if (S.role === 'md') {
    $('#panel').innerHTML = `<h2>Merchandise</h2>${nav('Articles')}${nav('New Articles', false, 16)}<span class="chip">Distribution</span>${nav('Allotments', true, rv)}${nav('Return HO')}`;
  } else {
    $('#panel').innerHTML = `<h2>Stock</h2>${nav('Stock')}${nav('Receive', S.page !== 'returns', S.deliveries.filter((d) => d.store === S.store && d.state === 'transit').length)}${nav('Count')}${nav('Return to HO', S.page === 'returns', ret)}${nav('Stock ledger')}`;
  }
}
function renderPage() {
  if (S.role === 'ops') return renderBoard();
  if (S.role === 'md') return renderMd();
  return renderStore();
}

/* ── Ops board ───────────────────────────────────────────────────────── */
function cardHtml({ id, title, sub, fig, meta, strip, step, lines, off, fresh }) {
  return `<div class="card${off ? ' off' : ''}${fresh ? ' arrive' : ''}" ${off ? '' : `data-act="open" data-v="${id}"`} role="button" tabindex="0">
    ${strip ? `<div class="strip ${strip[1]}">${esc(strip[0])}</div>` : ''}
    <div class="c-in">
      <div class="c-top"><span class="c-title">${esc(title)}</span><span class="c-fig">${fig}</span></div>
      <span class="c-sub">${sub}</span>
      ${lines ? `<div class="c-lines">${lines}</div>` : ''}
      <div class="c-foot"><span class="c-meta">${meta}</span>${step}</div>
    </div></div>`;
}
const stepText = (label) => `<span class="tint">${label}${CHEV}</span>`;
function boardCards() {
  const shown = S.waiting === 'shown';
  const pick = [], pack = [], ship = [];
  for (const p of S.picks) {
    if (p.state === 'closed') continue;
    const n = sumOf(p.lines);
    const art = artOf(p.alt);
    if (p.state === 'review') {
      if (shown) pick.push(cardHtml({ id: p.id, title: art.name, sub: `${shop(p.store)} · ${p.alt}`, fig: `${n} <small>${n === 1 ? 'pc' : 'pcs'}</small>`, meta: `${Object.keys(p.lines).length} SKU${Object.keys(p.lines).length === 1 ? '' : 's'}`, strip: ['Waiting for MD', 'grey'], step: '<span class="tint mute">Waiting</span>', off: true }));
      continue;
    }
    pick.push(cardHtml({ id: p.id, title: art.name, sub: `${shop(p.store)} · ${p.alt}`, fig: `${n} <small>${n === 1 ? 'pc' : 'pcs'}</small>`, meta: `${Object.keys(p.lines).length} SKU${Object.keys(p.lines).length === 1 ? '' : 's'}`, strip: p.again ? [`MD: ${p.again}`, 'info'] : null, step: stepText('Pick'), fresh: S.fresh === p.id }));
  }
  for (const [store, pile] of Object.entries(S.piles)) {
    if (!pile.length) continue;
    const n = pile.reduce((a, l) => a + l.qty, 0);

}

/* MD review */
function receiveSummary(r) {
  const ds = r.stores.map((s) => S.deliveries.find((d) => d.trip === r.trip && d.alt === r.alt && d.store === s));
  const diff = {}; // sku -> {store: diff}
  let nao = 0, sent = 0, counted = 0;
  for (const d of ds) {
    if (!d || d.state !== 'review') continue;
    nao += d.nao; sent += sumOf(d.sent); counted += sumOf(d.count) + d.nao;
    for (const sku of new Set([...Object.keys(d.sent), ...Object.keys(d.count)])) {
      const v = (d.count[sku] || 0) - (d.sent[sku] || 0);
      if (v) (diff[sku] ||= {})[d.store] = v;
    }
  }
  const pairs = [], shorts = [], extras = [];
  for (const [sku, by] of Object.entries(diff)) {
    const minus = Object.entries(by).filter(([, v]) => v < 0).map(([s, v]) => [s, -v]);
    const plus = Object.entries(by).filter(([, v]) => v > 0);
    for (const m of minus) for (const p of plus) {
      const n = Math.min(m[1], p[1]);
      if (n > 0) { pairs.push({ sku, from: m[0], to: p[0], n }); m[1] -= n; p[1] -= n; }
    }
    for (const [s, v] of minus) if (v > 0) shorts.push({ sku, store: s, n: v });
    for (const [s, v] of plus) if (v > 0) extras.push({ sku, store: s, n: v });
  }
  return { ds, pairs: pairs.reduce((a, p) => a + p.n, 0), short: shorts.reduce((a, p) => a + p.n, 0), extra: extras.reduce((a, p) => a + p.n, 0), nao, sent, counted, pairList: pairs, shortList: shorts, extraList: extras };
}
/* ── The New allotment matrix, read-only: what was planned against what happened.
   Five ways to show before and after (chrome "Review matrix"):
   A Struck · B Badge · C Sent | Counted · D Before | After · E Switch. */
function garment(art, hex) {
  const kind = ART[art].kind;
  const d = kind === 'pants' ? 'M7 3h10l1.2 18h-4.4L12 10.5 10.2 21H5.8z' : kind === 'tee' ? 'M8.5 4L12 5.6 15.5 4l5 3.4-2 3.6-2.2-1.1V20H7.7V9.9L5.5 11l-2-3.6z' : 'M8.5 3.5L12 6l3.5-2.5 5 3.6-2 3.6-2.2-1.1V20.5H7.7V9.6L5.5 10.7l-2-3.6z';
  return `<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}" fill="${hex}" stroke="rgba(0,0,0,.28)" stroke-width=".8" stroke-linejoin="round"/></svg>`;
